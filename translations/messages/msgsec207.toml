japanese = "悲鳴を聞いて思わず飛び出しちまったが<line-break>魔物に勝てるか<line-break>ちょっと自信がなかったんだ。<line-break>ハハッ。俺はアミラルのヒューズ。<line-break>見ての通り冒険者だ。<end>"
