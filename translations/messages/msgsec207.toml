english = "So you're <value:$28>. I could tell by the way you move―you're an adventurer too, then. Good to meet you, <value:$28>. I'm usually at the tavern in Amiral, so stop by if you're ever nearby. I'll buy you a drink to thank you. See you around!<end>"

