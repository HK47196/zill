english = "If so, then go.<end>"

["1120145"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000そうか。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000ならば無理強いはすまい。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000うつろいやすき人の子よ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000気が変わったならば<line-break>\u3000\u3000\u3000\u3000\u3000また我を訪ねるがよい。<end>"
english = "I see. Then I shall not force you. Fickle child of man, if you change your mind, you may seek me out again.<end>"

["1120146"]
japanese = "フン…貴様が<line-break>無限のソウルを持つ者か…。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>この世界のため、<line-break>そして、我が弟フルーヴの無念のため、<line-break>貴様を無へと帰してやろう！！<end>"
english = "Hmph... So you are the Bearer of the Infinite Soul. For the sake of this world, and for my younger brother Flueve's unfulfilled hopes, I shall return you to nothingness!<end>"

["1120147"]
japanese = "く、無念…。<line-break>我が力もってしても<line-break>貴様らの愚行をとめられぬか…。<line-break>大きく、しかし愚かなる魂よ。<line-break>やがて来る闇に絶望し<line-break>己が行いをくいるがいい…。<end>"
english = "Damn... So even my power cannot put an end to your folly. O great but foolish soul, despair at the darkness soon to come, and rue what you have done.<end>"

["1120148"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000さすがだな…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よくやった、<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ…。<end>"
english = "Impressive... You have done well, Bearer of the Infinite Soul...<end>"

["1120149"]
japanese = "\u3000\u3000\u3000よくぞ、巨人パンタ・レイを倒した。\u3000\u3000<line-break>\u3000\u3000\u3000これで、我の力を妨げる者はない。<line-break>\u3000\u3000礼を言うぞ。無限のソウルを持つ者よ。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我は感謝の証として、<line-break>\u3000\u3000\u3000\u3000汝に我の力の一部を与えよう。<line-break>\u3000\u3000\u3000人の子にはあまるほどの巨大な力を。<end>"
english = "You have done well to defeat the giant Panta Rhei. Now no one remains who can hinder my power. You have my thanks, Bearer of the Infinite Soul. As a token of my gratitude, I shall grant you a portion of my power―an immense power beyond what any child of man could contain.<end>"

["1120150"]
japanese = "地の最高位の魔法が解放された。<end>"
english = "The highest-level earth magic has been unlocked.<end>"

["1120151"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000エステルよ…、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000地の巫女よ…。<end>"
english = "Esther... Priestess of Earth...<end>"

["1120152"]
japanese = "何？\u3000精霊神様。<end>"
english = "What is it, Spirit God?<end>"

["1120153"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000我の力を分け与えよう。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000地の巫女である汝ならば<line-break>\u3000\u3000\u3000\u3000受け入れることができるはずだ。<end>"
english = "I shall share my power with you. As the Priestess of Earth, you should be able to receive it.<end>"

["1120154"]
japanese = "エステルの巫女としての力が<line-break>大きく引き出された。<end>"
english = "A great deal of Esther's power as a priestess has been brought forth.<end>"

["1120155"]
japanese = "すごい…。<line-break>これが、ボクの力…？<end>"
english = "Incredible... Is this my power...?<end>"

["1120156"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000さよう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000その力、我ら精霊の使いとして<line-break>\u3000\u3000\u3000\u3000\u3000\u3000存分にふるうがよい。<end>"
english = "Just so. Wield that power to the fullest in the service of us spirits.<end>"

["1120157"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000では、さらばだ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。<end>"
english = "Then farewell, Bearer of the Infinite Soul.<end>"

["1120158"]
japanese = "\u3000\u3000\u3000来たか、無限のソウルを持つ者よ…。\u3000\u3000<line-break>\u3000\u3000\u3000\u3000ならば、我は今一度汝に乞う。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000我が大いなる力を封じる<line-break>\u3000\u3000\u3000\u3000\u3000巨人、パンタ・レイを<line-break>\u3000\u3000\u3000\u3000\u3000倒してはくれまいか？<end>"
english = "So you have come, Bearer of the Infinite Soul... Then once more, I implore you: will you defeat the giant Panta Rhei, who seals away my great power?<end>"

["1120159"]
japanese = "しょうがない<end>"
english = "I suppose I have no choice.<end>"

["1120160"]
japanese = "関係ないってば<end>"
english = "I told you, it's got nothing to do with me!<end>"

["1120161"]
japanese = "\u3000\u3000\u3000\u3000\u3000 \u3000\u3000来たか、地の巫女よ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ん、汝は…。<line-break>\u3000\u3000\u3000なるほど、無限のソウルを持つ者か…。<line-break>\u3000<line-break>\u3000\u3000\u3000 \u3000 \u3000\u3000大いなる可能性を持つ<line-break>\u3000\u3000\u3000  \u3000\u3000 \u3000\u3000人の子らよ。<line-break>\u3000\u3000\u3000  \u3000\u3000 \u3000汝に頼みがある。<end>"
english = "You have come, priestess of earth. Hmm, and you are... I see. The Bearer of the Infinite Soul... Children of man, you hold great potential. I have a favor to ask of you.<end>"

["1120162"]
japanese = "\u3000\u3000 \u3000\u3000ここより先に、<line-break>\u3000\u3000 フルーヴという巨人がおる。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000汝の力で葬ってくれ。<line-break>\u3000 \u3000彼奴は我の力を妨げる力。<line-break>\u3000\u3000 \u3000不要な存在なのだ…。<end>"
english = "Beyond this place dwells a giant called Fluve. Bury it with your power. That creature is a force that impedes my own. Its existence serves no purpose...<end>"

["1120163"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よし。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000では我は、汝を<line-break>\u3000\u3000\u3000\u3000 \u3000\u3000精霊の座へと導かん。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000汝、気高き地の光を越え<line-break>\u3000\u3000\u3000\u3000\u3000\u3000彼の巨人に挑むがよい。<line-break>\u3000\u3000\u3000\u3000 \u3000挑み、打ち破るがよい…。<end>"
english = "Good. I shall guide you to the Seat of the Spirits. Pass beyond the noble light of earth and face that giant. Challenge it, and strike it down...<end>"

["1120164"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000そうか。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000ならば無理強いはすまい。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000うつろいやすき人の子よ。<line-break>\u3000\u3000\u3000\u3000気が変わったならば<line-break>\u3000\u3000\u3000 また我を訪ねるがよい。<end>"
english = "I see. Then I shall not compel you. Fickle child of man, should you change your mind, come before me again.<end>"

["1120165"]
japanese = "\u3000\u3000\u3000\u3000\u3000うつろいやすき人の子よ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000気が変わったならば<line-break>\u3000\u3000\u3000\u3000\u3000また我を訪ねるがよい。<end>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000さらばだ。<end>"
english = "O fickle child of man. If you change your mind, come and seek me again.<end>Farewell.<end>"

["1120166"]
japanese = "フン…地の巫女と<line-break>無限のソウルを持つ者か。<line-break>\u3000<line-break>グラジェオンめ…<line-break>闇の力の高まりを知り、<line-break>我を滅ぼさんと欲したか。<end>"
english = "Hmph... The Earth Priestess and the Bearer of the Infinite Soul. Curse you, Grajeon... You sensed the growing power of darkness and sought to destroy me?<end>"

["1120167"]
japanese = "しかし、汝らごときに倒される<line-break>このフルーヴではない。<line-break>来るがよい、精霊神のしもべよ！！<end>"
english = "But Furuve will not fall to the likes of you. Come, servants of the Spirit God!<end>"

["1120168"]
japanese = "愚かなり、人の子よ。<line-break>精霊神に躍らされ、<line-break>我を撃ち、闇を呼ぶか…。<line-break>愚かなり…愚かなり…。<end>"
english = "Foolish child of man. Made to dance to the Spirit God's tune, you strike me down and call forth darkness...? Foolish... How foolish.<end>"

["1120169"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よくやった…\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000我が地の巫女よ…。<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ…。<end>"
english = "Well done... my priestess of the earth... Bearer of the Infinite Soul...<end>"

["1120170"]
japanese = "\u3000\u3000地の巫女よ、無限のソウルを持つ者よ。\u3000\u3000<line-break>\u3000\u3000\u3000よくぞ、巨人フルーヴを倒した。<line-break>\u3000\u3000\u3000心から、礼を言わせてもらうぞ。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000さあ、再び行くがよい。<line-break>\u3000\u3000\u3000\u3000\u3000汝らのなすべき旅の道へ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000さらばだ。<end>"
english = "Priestess of Earth! Bearer of the Infinite Soul! You have done well to defeat Giant Fleuve. I offer you my heartfelt thanks. Now, all of you, go forth once more upon the path you must travel. Farewell.<end>"

["1120171"]
japanese = "\u3000\u3000\u3000\u3000\u3000来たか、地の巫女よ。そして、\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000 \u3000無限のソウルを持つ者よ…。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000ならば、我は今一度汝に乞う。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我の力を封じつづける<line-break>\u3000\u3000\u3000 \u3000彼の巨人を倒してはくれまいか？<end>"
english = "You have come, priestess of earth, and you, Bearer of the Infinite Soul... Then I beseech you once more: will you defeat the giant that continues to seal away my power?<end>"

["1120172"]
japanese = "えっ！？<line-break>せ、制御の間ですか？<end>"
english = "What!? Th-the control chamber?<end>"

["1120173"]
japanese = "えっ！？<line-break>ど、動力の間ですか？<end>"
english = "What!? Th-the Chamber of Power?<end>"

["1120174"]
japanese = "あ、あちらです！<end>"
english = "O-over there!<end>"

