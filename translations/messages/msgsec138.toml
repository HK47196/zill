japanese = "かゆくなったり痛くなったり…<line-break>そうなるのは、<line-break>ハチの針に毒があるからだな。<line-break>武器に効果をつけるってのは、<line-break>例えるなら、お前さんの剣が<line-break>ハチの針みてえになるってことよ。<end>"
english = "It itches or hurts because a bee's stinger carries poison. Giving a weapon an effect is like turning your sword into a bee's stinger.<end>"

["1380554"]
japanese = "刺したと同時に敵を眠らせちまう槍や、<line-break>斬ることで相手を麻痺させる剣、<line-break>なんてのも作れる。<line-break>防具はその逆だ。<line-break>石化や呪いからお前さんを<line-break>守ってくれる防具も作れる。<end>"
english = "I can make a spear that puts an enemy to sleep when it strikes, or a sword that inflicts Paralysis when it cuts. Armor works the other way around. I can make armor that protects you from petrification or curses.<end>"

["1380555"]
japanese = "こいつは難しい仕事だから、<line-break>それなりのギアをいただくが、<line-break>重宝するぜ。<line-break>強度や形状を変えてもまだ…<line-break>って時には、<line-break>ぜひ試してみてくれよ。<end>"
english = "It's difficult work, so it'll cost you a fair amount of Gea, but it comes in handy. If changing the strength or shape still isn't enough, give it a try.<end>"

["1380556"]
japanese = "俺たちにとっても、<line-break>いい稼ぎになるしな。<end>"
english = "Makes us a tidy profit too.<end>"

["1380557"]
japanese = "ははは！<end>"
english = "Ha ha ha!<end>"

["1380558"]
japanese = "ズバリ、エモノの形のことだな。<line-break>使ってる武器がいまいち好みじゃない<line-break>…そんな時は、鍛冶屋の出番だ。<line-break>代金さえもらえりゃ、ある程度、<line-break>お前さんの好みに従って<line-break>仕立て直すことが可能だ。<end>"
english = "Simply put, it means the shape of your weapon. If the weapon you're using isn't quite to your liking, that's where a blacksmith comes in. Pay the price and I can reshape it to suit your tastes, within reason.<end>"

["1380559"]
japanese = "同じ剣にしても、もっと細身がいいとか<line-break>まっすぐなのがいいとか、あるだろ？<line-break>そういうことだよ。<line-break>もちろん、<line-break>昔の形に戻すことだってできるぜ。<end>"
english = "Even with swords, you might want one slimmer or straighter, right? That's what I mean. And of course, I can restore its old shape too.<end>"

["1380560"]
japanese = "精霊ＬＶのことか。<line-break>確かにそれも装備品まわりの<line-break>ことではあるが、ちょいと…<line-break>それは鍛冶屋じゃなくて、<line-break>神殿の仕事なんでな。<end>"
english = "You mean Spirit ＬＶ? It does concern equipment, but... that's temple work, not a blacksmith's.<end>"

["1380561"]
japanese = "私の出番ですね。<end>"
english = "Then this is where I come in.<end>"

["1380562"]
japanese = "おっ、ありがてえ。<line-break>神官さん、精霊属性のことを<line-break>説明してやってくださいよ。<end>"
english = "Oh, much obliged. Priest, would you explain Spirit Attributes?<end>"

["1380563"]
japanese = "私の杖の修理代、<line-break>安くしてくれるなら、<line-break>考えてもいいですよ。<end>"
english = "I might consider it if you'll give me a discount on repairing my staff.<end>"

["1380564"]
japanese = "うおっ、神様のしもべが俺の足元を！<line-break>天空神様へのお布施ってやつですかい？<end>"
english = "Whoa! A servant of the gods, taking advantage of me! Is that what you call an offering to the Sky God?<end>"

["1380565"]
japanese = "ふふ、冗談ですよ、冗談。<line-break>で、精霊属性のことですね？<line-break>\u3000<line-break>装備品の精霊属性を変更する仕事は、<line-break>鍛冶屋ではなく、<line-break>神と人とをつなぐ神殿の領分なのです。<end>"
english = "Hee hee, it was only a joke. Now, Spirit Attributes, was it? Altering the Spirit Attribute of equipment falls not to blacksmiths, but to the temples that serve as a bridge between gods and mortals.<end>"

["1380566"]
japanese = "ロストールには神殿がないからな。<line-break>ちなみにこの方はたまたま用事があって<line-break>エンシャントからいらっしゃってんだ。<end>"
english = "There isn't a temple in Rostorl. This priest just happens to be visiting from Ancient on other business.<end>"

["1380567"]
japanese = "精霊属性の変更とは、すなわち、<line-break>火や水といった精霊の力を<line-break>武器や防具に宿すことを意味します。<line-break>精霊の属性については<line-break>もうご存知ですか？<end>"
english = "Changing a Spirit Attribute means imbuing a weapon or piece of armor with the power of a spirit, such as fire or water. Are you already familiar with the Spirit Attributes?<end>"

["1380568"]
japanese = "火、水、土、風…<line-break>この四種類が精霊の属性です。<line-break>\u3000<line-break>聖母神がお作りになったこの四属性が<line-break>互いに干渉しあい、循環することで<line-break>世界は成り立っています。<end>"
english = "Fire, water, earth, and wind: these are the four Spirit Attributes. The world exists through the interplay and circulation of these four attributes, created by the Mother Goddess.<end>"

["1380569"]
japanese = "火は水に強く、水は土に強く、<line-break>土は風に、風は火に強い。<line-break>\u3000<line-break>おわかりでしょう？<line-break>どれが圧倒的に優位ということはなく、<line-break>うまくバランスをとっているのです。<end>"
english = "Fire is strong against water, water against earth, earth against wind, and wind against fire. You see? None holds an overwhelming advantage. They maintain a careful balance.<end>"

["1380570"]
japanese = "装備に精霊属性を宿すということは<line-break>そのまま、この四属性の性質を<line-break>盛り込むことになるのです。<line-break>例えば、あなたが火属性の剣を持ち、<line-break>火属性の鎧を身につけたとしましょう。<end>"
english = "Imbuing equipment with a Spirit Attribute gives it the qualities of one of those four elements. Suppose, for example, that you carried a Fire-element sword and wore Fire-element armor.<end>"

["1380571"]
japanese = "あなたは水属性の相手に対して<line-break>有利に戦うことができ、<line-break>\u3000<line-break>火属性のダメージを<line-break>大幅に軽減することができます。<line-break>これは大変有益なことです。<end>"
english = "You would have an advantage when fighting a Water-element opponent, and Fire-element damage against you would be greatly reduced. This can be extremely useful.<end>"

["1380572"]
japanese = "さらにこの精霊属性には、<line-break>装備品ごと、最初から決まった強弱…<line-break>レベルというものが存在します。<line-break>同じ火属性を宿したとしても、<line-break>片手剣なら４、槍なら２、<line-break>ナックルだと６…となります。<end>"
english = "Spirit Attributes also have a predetermined strength, or level, for each type of equipment. Even with the same Fire element, a one-handed sword has a level of 4, a spear 2, and a knuckle weapon 6.<end>"

["1380573"]
japanese = "ですが、同時に、忘れないでください。<line-break>精霊ＬＶが高いということは、<line-break>それだけ純粋に近いという証。<line-break>火属性の剣の攻撃では、<line-break>同じ火属性の敵を<line-break>傷つけることは難しく…<end>"
english = "But do not forget: a high Spirit ＬＶ is proof that the attribute is closer to purity. Attacks from a Fire-element sword will have difficulty harming an enemy of the same element...<end>"

["1380574"]
japanese = "火属性の鎧は、風属性の攻撃を、<line-break>時に倍にもして受けてしまう。<line-break> <line-break>その効果が、さらに、<line-break>属性のレベルによって変動します。<line-break>臨機応変に考えねばならないでしょう。<end>"
english = "And Fire-element armor may sometimes double the damage taken from Wind-element attacks. The extent of these effects also varies with the attribute level. You must adapt to the situation.<end>"

["1380575"]
japanese = "ふうむ、さすが神官様は説明がうまい。<line-break>口下手な俺なんかが<line-break>でしゃばらなくてよかったぜ。<end>"
english = "Hmm. A priest certainly knows how to explain things. Good thing a poor talker like me didn't butt in.<end>"

["1380576"]
japanese = "装備に精霊の力を宿したくなったら、<line-break>神殿へいらっしゃい。<line-break>お待ちしてますよ。<end>"
english = "If you ever wish to imbue your equipment with the power of spirits, come to the temple. I'll be waiting.<end>"

["1380577"]
japanese = "じゃ、説明はこの辺で<line-break>終わりにしちまって大丈夫かい？<end>"
english = "All right, is it okay if we end the explanation here?<end>"

["1380578"]
japanese = "いいえ<end>"
english = "No<end>"

["1380579"]
japanese = "はい<end>"
english = "Yes<end>"

["1380580"]
japanese = "ん？\u3000オッシの奴が？<line-break>酒場のツケを、<line-break>俺のと奴のとでワリカンに？<line-break>そうかー！\u3000思い出したぞ。<end>"
english = "Hm? Ossi said that? Split the tavern tab between the two of us? Oh! Now I remember!<end>"

["1380581"]
japanese = "この前、あいつと飲んでて、<line-break>何か約束したような気になってたのは、<line-break>そのことだったか！<line-break>くっ、あいつのほうが飲んでるってのに<line-break>ワリカンとは…。オッシの野郎、<line-break>こっちがあぜんとするほど飲むんだぜ。<end>"
english = "When we were drinking the other day, I had a feeling I'd promised him something. So that was it! Damn it, he drank more than I did, and we're splitting the bill? That bastard Ossi drinks enough to leave me speechless.<end>"

["1380582"]
japanese = "おまけにその酒癖ときちゃあ…。<line-break>ま、約束したなら仕方がねえな。<line-break>頼むよ。<end>"
english = "And don't get me started on what he's like when he's drunk... Well, a promise is a promise. Take care of it for me.<end>"

["1380583"]
japanese = "悪いな。<line-break>よし、じゃ、あんたには、<line-break>駄賃といったらなんだが…<end>"
english = "Sorry about that. Here, let me give you something for your trouble...<end>"

["1380584"]
japanese = "こいつを持ってきな。<end>"
english = "Take this with you.<end>"

["1380585"]
japanese = "何って、錬剛石だよ、錬剛石！<line-break>そいつがありゃ、お前さんの装備も<line-break>少しはマシになるだろ。<line-break>がんばれよ、ヒヨッコ。<line-break>お前さんが装備を鍛えにくるのを<line-break>楽しみに待ってるぜ。<end>"
english = "What, this? It's a Tempering Stone, a Tempering Stone! With that, you can make your equipment a little less pathetic. Keep at it, fledgling. I'll be looking forward to seeing you when you're ready to improve your equipment.<end>"

["1380586"]
japanese = "それじゃ、私たち行きますね。<line-break>またお店で待ってますので<line-break>よろしくお願いしますね。<end>"
english = "Well, we'd better be going. I'll be waiting for you back at the tavern, so please take care of it.<end>"

["1380587"]
japanese = "<value:$28>さん、<line-break>まずはスラムの酒場まで<line-break>連れていってください。<end>"
english = "First, please take me to the tavern in the Slums, <value:$28>.<end>"

["1380588"]
japanese = "酒代をマスターに渡すのは<line-break>そのあとにしてください。<line-break>よろしくお願いします。<end>"
english = "Please give the money for the drinks to the tavern keeper after that. I'm counting on you.<end>"

