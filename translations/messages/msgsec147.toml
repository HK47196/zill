["1470011"]
japanese = "へぇ。てことは、アジトの場所は<line-break>つきとめてあるのかい？<end>"
english = "Oh? So you've tracked down their hideout?<end>"

["1470012"]
japanese = "ああ。このロストールから<line-break>２日ほど南西に行ったところにある<line-break>洞窟だってわかったんだ。<end>"
english = "Yes. We found out it's a cave about two days' journey southwest of Rostorl.<end>"

["1470013"]
