["1470044"]
japanese = "いや、あんたは<line-break>この広場でよく見かけるんでね。<line-break>ちょっと、聞きたいことがあるんだ。<line-break>今さっき、この辺りで<line-break>リルビーの女の子と、男が何か<line-break>言い争ってたりはしなかったか？<end>"
