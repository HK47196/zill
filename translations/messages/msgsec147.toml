["1470030"]
japanese = "…実は、俺も例の子供を狙った<line-break>誘拐事件のことがひっかかっていた。<line-break>もしかしたら、ルルアンタが…。<line-break>町を捜してみた方がよさそうだな。<line-break>手遅れになるとまずい。<end>"
