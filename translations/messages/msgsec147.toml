["1470050"]
japanese = "誘拐のプロにしてはお粗末だが、<line-break>奴らはもう、この町からは離れていると<line-break>考えた方がいいだろうな。<line-break>ギルドの親父の話では、<line-break>奴らのアジトは飢えた者の迷宮だ。<line-break>今から追うぞ。<end>"
