["1490001"]
japanese = "…富める者はこう言う。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>自分には金があるから大丈夫だ。<line-break>金は他人が自分を敬うようにする。<line-break>金が自分を守る護衛を雇ってくれる。\u3000<line-break>今日飢えないのも金があればこそだ。<line-break>今日凍えないのも金があればこそだ。<end>"
english = "The wealthy say this: “I have money, so I have nothing to fear. Money makes others respect me. Money hires guards to protect me. Because I have money, I will not go hungry today. Because I have money, I will not freeze today.”<end>"

["1490002"]
japanese = "その者は神の存在を忘れている。\u3000\u3000\u3000<line-break>神がその者を敬わせ、危険や飢えや<line-break>凍えから守っていることを忘れている。<line-break>思い上がり、神を忘れ、すべての加護を<line-break>金と、金を持つ己の力のおかげだと<line-break>傲慢にも考えている。<end>"
english = "Such a person has forgotten that God exists―that it is God who makes others show respect and protects that person from danger, hunger, and cold. Swollen with pride and forgetful of God, such a person arrogantly credits every blessing to money and to the power of possessing it.<end>"

["1490003"]
japanese = "神はその傲慢を打ち砕くだろう。<line-break>傲慢を捨てよ。すべてを投げ捨てよ。<line-break>ただ、真の神にのみ、すがるがよい。<end>"
english = "God shall shatter that pride. Cast off your arrogance. Cast aside everything. Place your faith in the one true God alone.<end>"

["1490004"]
japanese = "非市民どもの集会は禁じられておる。<line-break>散れ！<end>"
english = "Gatherings of noncitizens are forbidden. Disperse!<end>"

["1490005"]
japanese = "ここは神懸かった神聖王サラミスが\u3000\u3000<line-break>商業を禁止したときに、<line-break>追放された商人たちが建てた町だ。<line-break>だから、このリベルダムの市民は<line-break>お前のような神懸かりを見ると<line-break>ムカムカするのだ。さっさと出て行け！<end>"
english = "This town was built by merchants banished when the god-possessed Holy King Salamis outlawed trade. That's why the citizens of Liberdam can't stand the sight of god-possessed people like you. Now get out!<end>"

["1490006"]
