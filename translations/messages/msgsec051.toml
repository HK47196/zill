["510151"]
japanese = "<if><value:$2A><less>50あんたのことは<line-break>聞いたことがある。<line-break>冒険者だな。<line-break>…<value:$28>だったっけ？<line-break>これから、よろしくな。<end>あんたのことは<line-break>聞いたことがある。<line-break>冒険者だな。<line-break>…<value:$2B>の<line-break><value:$28>だったっけ？<line-break>これから、よろしくな。<end>"
english = "<if><value:$2A><less>50I've heard about you. You're an adventurer, right? <value:$28>, wasn't it? Well, good to meet you.<end>I've heard about you. You're an adventurer, right? <value:$2B> <value:$28>, wasn't it? Well, good to meet you.<end>"

["510152"]
japanese = "アンギルダンは万一の王都守備軍の速攻に備え、<line-break>付近の町に強制徴発の軍を差し向けた。<line-break>そのため中枢部が手薄になった。<end>"
english = "To guard against a sudden attack by the royal capital's garrison, Angeerdan sent troops to carry out forced requisitions in nearby towns. This left the heart of his army thinly defended.<end>"

["510153"]
japanese = "その手薄になった中枢部を、<line-break>驚くべき早さで敗残兵を立て直した<line-break>ゼネテス・ファーロスが奇襲したのである。<line-break><line-break>ゼネテスの奇襲により、<line-break>朱雀将軍アンギルダンが討ち取られると、<line-break>帝国軍は壊乱し、敗走した。<end>"
english = "After rallying the routed remnants with astonishing speed, Xenetes Pharos launched a surprise attack on the weakened heart of the army. When the Vermilion Bird General Angeerdan fell in Xenetes's assault, the Imperial Army collapsed into disorder and fled.<end>"

["510154"]
japanese = "この戦いで、ゼネテスの声望は<line-break>一気に上がり、奇跡の名将と呼ばれたが<line-break>ロストールの被害も甚大なものがあった。<end>"
english = "Xenetes's renown soared after this battle, and he became known as a general who worked miracles. Rostorl, however, had suffered devastating losses.<end>"

