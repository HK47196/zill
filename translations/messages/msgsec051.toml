["510149"]
japanese = "誇りのために軍を動かし、兵を死なせた<line-break>親父ノヴィン・ファーロスの尻拭いを<line-break>息子の俺がしてるってわけだ。<line-break>ロストールの大貴族にして総司令<line-break>ノヴィン・ファーロスの不肖の息子が<line-break>この俺、ゼネテス・ファーロスだ。<end>"
english = "So here I am, cleaning up after my father, Novin Pharos, who marched an army off to satisfy his pride and got his soldiers killed. I'm Xenetes Pharos, the unworthy son of Novin Pharos, one of Rostorl's great nobles and its commander-in-chief.<end>"

["510150"]
