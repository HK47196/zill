["2040001"]
japanese = "<value:$28>か…。<line-break>俺もヒマだし、せっかくだから<line-break>少し話につきあえよ。<line-break>そろそろネタも尽きてきたから、<line-break>オルファウスのとっておきの話を<line-break>聞かせてやろう。<end>"
english = "<value:$28>, huh? Well, I've got time to kill, so stay and chat for a while. I'm running out of material, so I'll tell you one of my best stories about Orphaus.<end>"

["2040002"]
japanese = "くしゃみが出たんで、<line-break>もしやと思ったんですが、<line-break>また私の話ですか、ネモ？<end>"
english = "I sneezed, so I had a feeling... Are you talking about me again, Nemo?<end>"

["2040003"]
japanese = "ああ、覚えてるだろ？<line-break>俺とお前が戦った時のことだ。<end>"
english = "Yeah. You remember when you and I fought, don't you?<end>"

["2040004"]
japanese = "そんなこともありましたね。<line-break>もうだいぶ昔のことなんで<line-break>あまり記憶にありませんけど。<end>"
english = "Oh, yes. That did happen, didn't it? It was so long ago that I hardly remember it, though.<end>"

["2040005"]
japanese = "あの問題児が、<line-break>クィーダロアに選ばれたと思ったら、<line-break>たちまち立派な指導者だぜ。<end>"
english = "That notorious troublemaker got chosen as Quidaloa, and in no time at all he'd become a fine leader.<end>"

["2040006"]
japanese = "さらにはエルフの軍勢を率いて、<line-break>魔人の俺様に徹底抗戦だ。<line-break>思わず別人かと疑っちまったよ。<line-break>それから何度も矛を交えたが、<line-break>最後に戦ったのは<line-break>バロルの時だったな…。<line-break>俺様は魔獣軍を指揮して、こいつは<line-break>ネメアとレーグ、ケリュネイアを<line-break>引き連れていた。<end>"
english = "Then he led an army of Elves and put up a relentless fight against me, a demon. I almost thought he was a different person. We clashed many times after that, but our last battle came during the events surrounding Balor... I commanded the army of magical beasts, while he brought Nemea, Reig, and Ceryneia with him.<end>"

["2040007"]
japanese = "しかも、相変わらず俺様を<line-break>手こずらせたあげく、<line-break>しまいには敗北させやがって…。<line-break>敬愛する恩師相手に少しは<line-break>手加減してくれてもよかったんだぜ？<end>"
english = "And after giving me as much trouble as ever, he even went and defeated me... You could have gone a little easier on your beloved mentor, you know?<end>"

["2040008"]
japanese = "敬愛もなにも<line-break>私は昔から<line-break>札付きの問題児でしたからね。<line-break>手加減をするつもりなんて<line-break>これっぽっちもありませんでしたよ。<line-break>\u3000<line-break>むしろネモこそ、可愛い生徒を相手に<line-break>後腐れないよう徹底的に<line-break>叩き潰すつもりだったのでは？<end>"
english = "Beloved or not, I was always a notorious troublemaker. I had no intention of going easy on you. If anything, weren't you the one planning to crush your dear pupil so thoroughly that there would be no trouble afterward, Nemo?<end>"

["2040009"]
japanese = "バレてたか…。<line-break>\u3000<line-break>\u3000<line-break>そう言うお前だって、隙あらば<line-break>俺を亡き者にしようとしてたろ？<end>"
english = "So you saw through me... But you were ready to do away with me too, the moment you got the chance, weren't you?<end>"

["2040010"]
japanese = "まあ、最悪の場合はそれもありかな、<line-break>…と思っていたことは認めますよ。<line-break>\u3000<line-break>でも、意外としぶとかったですね、<line-break>先生。<end>"
english = "Well, I admit I did think it might come to that if worst came to worst. But you proved surprisingly hard to kill, Master.<end>"

["2040011"]
japanese = "ちぇっ、よく言うぜ。<line-break>お前が慢心して手を抜いていたら、<line-break>今頃、世界は変わっていたのによ。<end>"
english = "Tch. Listen to you. If you'd grown overconfident and held back, the world would be a very different place by now.<end>"

["2040012"]
japanese = "手を抜くなんて無理でしたね。<line-break>ネモの力を熟知していたからこそ<line-break>真剣にならざるを得なかったんです。<line-break>私の大事な恩師の実力は<line-break>よくわかっていましたから。<end>"
english = "Holding back was never an option. I knew Nemo's power too well not to take the fight seriously. I knew exactly what my dear mentor was capable of.<end>"

["2040013"]
japanese = "やれやれ、口が達者なのは昔っから<line-break>変わんねえな。<line-break>\u3000<line-break>まったく、恩師思いの生徒を持って<line-break>俺は幸せ者だよ。<end>"
english = "Good grief. You've always had a silver tongue. I'm truly blessed to have such a devoted pupil.<end>"

["2040014"]
japanese = "どういたしまして、先生。<line-break>\u3000<line-break>\u3000<line-break>さて、ネモがもっと悪い記憶を<line-break>掘り起こさないうちに<line-break>私は退散するとしましょうか。<end>"
english = "You're very welcome, Master. Now, before Nemo dredges up any more unpleasant memories, I think I'll take my leave.<end>"

