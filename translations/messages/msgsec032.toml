english = "Roy is prepared to die...<end>"

["320102"]
japanese = "どうした、<line-break>来ないのか。<line-break>\u3000<line-break>後悔したいのなら、<line-break>とめはせん。<line-break>そこにいろ。<end>"
english = "What's wrong? Aren't you coming? If you want to live with regret, I won't stop you. Stay here.<end>"

["320103"]
japanese = "俺はセラ。<line-break>ロイは俺が認めた<line-break>唯一の男だ。<line-break>お前を守る気はない。<line-break>足手まといにはなるな。<end>"
english = "I'm Sera. Roy is the only man I acknowledge. I have no intention of protecting you. Don't slow me down.<end>"

["320104"]
japanese = "<if><value:$29><equal>%0さすがに<line-break>俺が認めた男の<line-break>弟だけのことはある。<line-break>いい手並みだった。<line-break>兄を救いに行くつもりか？<end>さすがに<line-break>俺が認めた男の<line-break>妹だけのことはある。<line-break>いい手並みだった。<line-break>兄を救いに行くつもりか？<end>"
english = "<if><value:$29><equal>%0You are the brother of the one man I acknowledge, after all. You handled yourself well. Do you intend to save your brother?<end>You are the sister of the one man I acknowledge, after all. You handled yourself well. Do you intend to save your brother?<end>"

["320105"]
japanese = "…ロイはお前を逃がすために、<line-break>村人を逃がすよう言ったのだぞ。<end>"
english = "Roy told you to evacuate the villagers so that you would escape as well.<end>"

["320106"]
japanese = "ロイは死を覚悟している。<line-break>…奴のことなら、わかる。<end>"
english = "Roy is prepared to die. I know him.<end>"

["320107"]
japanese = "俺はセラ。<line-break>ロイは俺が認めた<line-break>唯一の男だ。<end>"
english = "I'm Sera. Roy is the only man I acknowledge.<end>"

["320108"]
japanese = "…来い。<end>"
english = "Come.<end>"

["320109"]
japanese = "…アンティノ商会が極秘開発中の<line-break>戦闘用モンスター…デス・ギガース。<line-break>…やはり、そういうことか。<end>"
english = "A combat monster being developed in absolute secrecy by the Antino Trading Company... Death Gigas. So that is what happened.<end>"

["320110"]
japanese = "ロイほどの手練れでも倒すのは難しい。<line-break>だが、俺がただひとり認めた<line-break>あの男以上に腕の立つ男は存在しない。<line-break>ロイがこれを倒したのだな。<end>"
english = "Even someone as skilled as Roy would have struggled to defeat it. But no man is more skilled than the one man I acknowledge. Roy must have defeated it.<end>"

["320111"]
japanese = "月光に反応はない。<line-break>ロイはここにはいないようだな。<end>"
english = "Moonlight isn't responding. Roy doesn't seem to be here.<end>"

["320112"]
japanese = "これは妖刀・月光。<line-break>ロイはこれと対をなす剣を<line-break>持っている。<end>"
english = "This is the Demon Blade “Moonlight.” Roy carries its twin.<end>"

["320113"]
japanese = "…ロイは生きている。<end>"
english = "Roy is alive.<end>"

["320114"]
japanese = "だが、デス・ギガースを倒したあと、<line-break>あの男はなぜ姿を消した…？<end>"
english = "But why did he disappear after defeating Death Gigas...?<end>"

["320115"]
japanese = "ついてくるなら、<line-break>それもいいだろう。<line-break>面倒は見んがな。<end>"
english = "If you want to follow me, so be it. But don't expect me to look after you.<end>"

["320116"]
japanese = "ロイのあとを<line-break>追いかける気はないのか？<end>"
english = "Don't you intend to go after Roy?<end>"

["320117"]
japanese = "俺に不信があるなら<line-break>いずれ答えてやる。<line-break>ただし、それは今ではない。<line-break>今、俺は急ぐ。<end>"
english = "If you have doubts about me, I'll answer them in time. But not now. I'm in a hurry.<end>"

["320118"]
japanese = "<if><value:$29><equal>%0来い。<line-break>ロイの弟よ。<end>来い<line-break>ロイの妹よ。<end>"
english = "<if><value:$29><equal>%0Come, Roy's brother.<end>Come, Roy's sister.<end>"

["320119"]
japanese = "アーギルシャイアは<line-break>俺の大事なものを奪った…。\u3000\u3000<line-break>\u3000<line-break>俺は強くなる、<line-break>…どんな手段を使ってもな。<line-break>そして、俺のすべてを取り戻す。<end>"
english = "Argyleshire took something precious from me. I will become stronger, whatever it takes. Then I will take back everything that is mine.<end>"

["320120"]
japanese = "<select><value:$20>%3どうしたのだ。<line-break>ロイとともに村の外の森を<line-break>調べてくるがよい。<end>心配はいらぬ。<line-break>ロイがついているのだからな。<line-break>フフ…、私も親バカなことだ。<end>私はよい子供たちに恵まれたものだ。<line-break>万一、今ここで私が死んでも<line-break>神器のことは安心して任せられる。<line-break>万一の話だ。<line-break>そのような顔をするでない。<line-break>我が子よ。<end>"
english = "<select><value:$20>%3What is it? Go with Roy and investigate the forest outside the village.<end>There's no need to worry. Roy will be with you. Heh... What a doting parent I am.<end>I have been blessed with fine children. Even if I were to die here and now, I could entrust the sacred artifact to you without fear. I said if. Don't look at me like that, my child.<end>"

["320121"]
japanese = "<value:$28>様、<line-break>お帰りなさいませ。\u3000\u3000\u3000\u3000<line-break>おケガは？<end>"
english = "Welcome home, <value:$28>. Are you hurt?<end>"

["320122"]
japanese = "ご無事で何よりです。<line-break>お父上のダディアス大神官が<line-break>神殿内でお待ちです。<end>"
english = "I'm relieved to see you safe. Your father, High Priest Dadias, is waiting inside the temple.<end>"

["320123"]
japanese = "父なる天空神ノトゥーンと<line-break>愛の神ライラネートのご加護あらんことを。<line-break><value:$28>様、よくぞご無事で。<line-break>さ、早く神殿へ。<line-break>お父上のダディアス様が<line-break>心配なさっておられますよ。<end>"
english = "May Father Notun, the Sky God, and Lailanate, God of Love, watch over you. <value:$28>, thank goodness you're safe. Quickly, to the temple. Your father, Lord Dadias, is worried about you.<end>"

["320124"]
japanese = "<value:$28>様も<line-break>神器の守護者のご一族。<line-break>大丈夫ですと申し上げておりますのに。\u3000\u3000<end>"
english = "I keep telling him there's no need to worry. <value:$28> is from the family that guards the sacred artifact, after all.<end>"

["320125"]
japanese = "<select><value:$20>%3ロイ様ですか？<line-break>もう、広場か森に行かれたのでは？<end><value:$28>様もロイ様も<line-break>このミイスの村の大神官ダディアス様も、<line-break>神器の守護者と呼ばれるご一族。<line-break>闇の神器という危険な宝物を<line-break>破壊神の騎士と呼ばれる魔人どもから<line-break>守るのがお役目なのです。<end>今朝の地震といい、<line-break>最近うろつきだした魔物どもといい、<line-break>魔人が神器をねらっているのでしょうか？\u3000<line-break>しかし心配はご無用ですぞ。<line-break>きっと天空神ノトゥーンの加護があります。<line-break>このじいもついておりますしな。<end>"
english = "<select><value:$20>%3Lord Roy? Hasn't he gone to the square or the forest already?<end><value:$28>, Lord Roy, and High Priest Dadias of Miis Village all belong to the family known as the Guardians of the sacred artifact. Their duty is to protect the dangerous treasure called the Dark Artifact from the fiends known as the Knights of the God of Destruction.<end>First this morning's earthquake, and now monsters prowling about... Could the fiends be after the sacred artifact? But you needn't worry. The Sky God Notun will surely protect us―and this old man is here as well.<end>"

["320126"]
japanese = "<select><value:$20>%3<value:$28>様に<line-break>愛の神ライラネートのご加護を…。<line-break>\u3000<line-break>そして、<value:$28>様の敵に<line-break>天空神ノトゥーンの<line-break>裁きのいかづちを…。<end>このミイスの村は<line-break>闇の神器を闇のしもべから\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>守るための隠れ里…。<line-break>闇の神器は破壊神の復活に使われるもの。<line-break>だから、破壊神のしもべがねらうのです。<end>私もこの神殿の神器が<line-break>どのようなものかは存じません。\u3000\u3000\u3000<line-break>\u3000<line-break>隠れて伝わる伝承では<line-break>記憶を失うかわりに<line-break>すさまじい力を手に入れられるとか…。<end>"
english = "<select><value:$20>%3May Lailanate, God of Love, bless <value:$28>... and may the Sky God Notun strike down the enemies of <value:$28> with the thunderbolt of judgment.<end>Miis Village is a hidden settlement built to protect the Dark Artifact from the servants of darkness. The Dark Artifact can be used to revive the God of Destruction. That is why the god's servants seek it.<end>Even I do not know the nature of the sacred artifact housed in this temple. A secret legend says it grants tremendous power in exchange for one's memories...<end>"

["320127"]
japanese = "<select><value:$20>%3神器とはどのようなものかは、<line-break>その時期が来れば、<line-break>お父上が教えてくださいますよ。\u3000\u3000<line-break>こればかりは神器を守る神官家にのみ<line-break>伝わる秘伝ですからな。<line-break>じいも存じませんのです。<end><value:$28>様もロイ様も<line-break>大神官ダディアス様も、<line-break>このミイスの村の神官家の方々はみな<line-break>闇の神器という危険な宝物を、<line-break>破壊神の騎士と呼ばれる魔人どもから<line-break>守る宿命を負っておられるのです。<end>今朝の地震といい、<line-break>最近うろつきだした魔物どもといい…、<line-break>魔人が神器をねらっているのでしょうか？\u3000<line-break>しかし心配はご無用ですぞ。<line-break>きっと天空神ノトゥーンの加護があります。<line-break>このじいもついておりますしな。<end>"
english = "<select><value:$20>%3When the time comes, your father will tell you what the sacred artifact is. That secret is passed down only within the priestly family that guards it. Even this old man does not know.<end><value:$28>, Lord Roy, High Priest Dadias―all members of Miis Village's priestly family are fated to protect the dangerous treasure called the Dark Artifact from the fiends known as the Knights of the God of Destruction.<end>First this morning's earthquake, and now monsters prowling about... Could the fiends be after the sacred artifact? But you needn't worry. The Sky God Notun will surely protect us―and this old man is here as well.<end>"

["320128"]
japanese = "<if><value:$29><equal>%0よう、<value:$28>。<line-break>朝早いってのに、<line-break>魔物騒ぎで大変だったな。<end><value:$28>。<line-break>無事でよかった…。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>魔物騒ぎで森に行ったってっから<line-break>俺…、寝てらんなくって…。<line-break>でも、無事でホントよかったよ。<end>"
english = "<if><value:$29><equal>%0Morning, <value:$28>. Quite a commotion over those monsters, especially this early.<end><value:$28>... I'm so glad you're safe. When I heard you'd gone into the forest because of the monsters, I couldn't sleep... I'm just so glad you're all right.<end>"

["320129"]
japanese = "<if><value:$29><equal>%0<value:$28>。<line-break>無事でよかった…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>魔物騒ぎがあって、<line-break>キミが退治に行ったっていうから、<line-break>心配で朝早いのにここに来たんだよ。<end>魔物がこんな村近くの森にまで…。<line-break>心配でゆっくり寝てられないわ。<end>"
english = "<if><value:$29><equal>%0<value:$28>... I'm so glad you're safe. When I heard about the monsters and that you'd gone to deal with them, I was so worried I came here even though it was still early.<end>Monsters, even in the forest this close to the village... I'm too worried to sleep.<end>"

["320130"]
japanese = "お…おっきなじしんだったね！<line-break>わ…わたし、びっくりしちゃった。<end>"
english = "Th-that was a really big earthquake! I-it scared me.<end>"

["320131"]
japanese = "<select><value:$20>%3今の地震といい魔物騒ぎといい…、<line-break>天空神ノトゥーンさまが<line-break>お怒りなのかのう…。<line-break>ロセンでは悪い王が<line-break>民をいじめておるからのう。<end>今の地震といい魔物騒ぎといい…、<line-break>天空神ノトゥーンさまが<line-break>お怒りなのかのう…。\u3000<line-break>ディンガルでは皇帝が<line-break>世界を救った勇者ネメア様を<line-break>いじめておるというからのう…。<end>今の地震といい魔物騒ぎといい…、<line-break><value:$28>様、<line-break>世界は滅ぶのではないですかのう。\u3000\u3000\u3000\u3000<line-break>リベルダムでは魔物を改造して<line-break>戦争のための道具にしておるそうですじゃ。<line-break>これでは神様もお怒りでしょうのう。<end>"
english = "<select><value:$20>%3With that earthquake and all this trouble with monsters... perhaps the Sky God Notun is angry. A wicked king in Rocen is tormenting the people, after all.<end>With that earthquake and all this trouble with monsters... perhaps the Sky God Notun is angry. Word is, the emperor in Dingal is persecuting Lord Nemea, the Hero who saved the world...<end>After that earthquake and all this trouble with monsters... do you think the world is coming to an end, <value:$28>? I hear monsters are being altered in Liberdam and turned into weapons of war. No wonder the gods are angry.<end>"

["320132"]
japanese = "<select><value:$20>%3ロイ様は修行の旅から戻られて<line-break>いっそうたくましくなられましたな。<line-break>\u3000<line-break>少々魔物がうろついたところで、<line-break>ロイ様と<value:$28>様が<line-break>おられれば安心ですな。<end><value:$28>様もロイ様のように、<line-break>神器の守護者としての実力をつけるため<line-break>いずれは旅に出られるのでしょうなあ。<end>ロイ様の持っておられる短剣は<line-break>日光という聖剣らしいですな。<line-break>修行の旅の途中見つけられたとか。<end>"
english = "<select><value:$20>%3Lord Roy has grown even stronger since returning from his training journey. A few monsters wandering about are nothing to fear with Lord Roy and <value:$28> here.<end>I suppose that one day you too will set out on a journey, <value:$28>, to hone your skills as a Guardian of the sacred artifact, just as Lord Roy did.<end>The dagger Lord Roy carries is apparently a holy sword called Sunlight. It seems he found it during his training journey.<end>"

["320133"]
japanese = "<select><value:$20>%3魔物の出現に続いて地震かよ。<line-break>いよいよ、お前たち神器を守る一族の<line-break>出番ってわけだ。<line-break>ホント大変な家に生まれちまったな。<line-break>ま、がんばれよ。<line-break>お前なら神器を守り通せるさ。<end>お前たち神官家ってさ、<line-break>このミイスにある神器を<line-break>守ってるんだよな。<line-break>…ところで神器って<line-break>なんなんだ？<line-break>どんなもんなんだ？<end>ロイ様の持ってらっしゃる剣、<line-break>カッコいいよなあ。<line-break>聖剣・日光って言うんだってな。<end>"
english = "<select><value:$20>%3First monsters, and now an earthquake. Looks like it's finally time for your family of sacred-artifact guardians to step in. You really were born into one demanding family. Well, do your best. I know you can keep the sacred artifact safe.<end>Your priestly family protects the sacred artifact here in Miis, right? So... what is a sacred artifact, anyway? What's it like?<end>That sword Lord Roy carries looks incredible. I hear it's called the Holy Sword Sunlight.<end>"

["320134"]
japanese = "<if><value:$29><equal>%0<value:$28>クン。<line-break>怪物のうろついてるミイスの森に行くの？<line-break>お姉さん、心配だな。<line-break>ロイ様もついているし、<line-break>キミも神器の守護者のご一族だもんね。<line-break>大丈夫なのはわかってるけどね。<end>魔物に続いて地震…。<line-break>いったいどうなってるのかしら。<end>"
english = "<if><value:$29><equal>%0<value:$28>, are you going into Miis Forest with all those monsters prowling around? I'm worried about you. I know Lord Roy will be there, and you're from the family of the sacred artifact's Guardians too. I know you'll be all right, but still.<end>First monsters, and now an earthquake... What in the world is happening?<end>"

["320135"]
japanese = "<select><value:$20>%2こわいよぉ！<line-break>こわいよぉ！<end><value:$28>さまぁ！<line-break>たすけて！！<line-break>みんな…みんな…もえちゃうよお！<end>"
english = "<select><value:$20>%2I'm scared! I'm scared!<end><value:$28>! Help! Everyone... everyone's going to burn!<end>"

["320136"]
japanese = "<select><value:$20>%2ヘンな女が空から降りてきて…<line-break>村が…村が…炎に包まれて…。<end>火だ…火だ…火だアア！<line-break>だ、誰か、助けてくれえ！<end>"
english = "<select><value:$20>%2A strange woman came down from the sky... and the village... the whole village was engulfed in flames...<end>Fire... fire... FIIIRE! S-somebody, help me!<end>"

["320137"]
japanese = "<if><value:$29><equal>%0知らない！！<line-break>知らないんだ、俺たちゃ！<line-break>面ってなんなんだよ！？\u3000おい！！<end>みんな…みんな…<line-break>あの女に燃やされて…！！<line-break>ああ…、ど、どうなってるんだよ！？<end>"
english = "<if><value:$29><equal>%0We don't know! None of us know! What mask are you talking about?! Hey!<end>Everyone... everyone was burned by that woman...! Ah... w-what's happening?!<end>"

["320138"]
japanese = "<if><value:$29><equal>%0…<value:$28>クン…な…の？<line-break>に…逃げ…て…、は…早…く…\u3000\u3000<line-break>\u3000<line-break>…わ…私…もう…ダメ…だから…<line-break>キ…キミ…だけでも…<end>イ…イヤ…死にたく…ない…<line-break>か、かめ…ん…なんて…<line-break>ホント…知らな…い…<end>"
english = "<if><value:$29><equal>%0Is... is that you, <value:$28>...? R-run... hurry... I'm... I'm finished... but you... you can still...<end>N-no... I don't want to die... I really don't know anything... about a m-mask...<end>"

["320139"]
japanese = "<value:$28>さまー。<line-break>おかえりなさい。<line-break>お疲れさまでしたー。<end>"
english = "<value:$28>! Welcome home! Good work out there!<end>"

["320140"]
japanese = "デスギガースに立ち向かう<end>"
english = "Face Death Gigas<end>"

["320141"]
japanese = "兄の言うとおり村人を避難させる<end>"
english = "Do as my older brother says and evacuate the villagers<end>"

["320142"]
japanese = "…心配はいらん。<line-break>こいつはすでに機能停止…<line-break>つまり、死んでいる。<end>"
english = "No need to worry. This one's already stopped functioning... In other words, it's dead.<end>"

