["1480094"]
japanese = "そうだよね！\u3000よかった…。\u3000\u3000<line-break>ルルアンタ、これからも<line-break><value:$28>と一緒だよ！<line-break>それじゃぁ、<value:$28>。<line-break>出発進行！<end>"
english = "That's right! Thank goodness... Lulluantha will stay with <value:$28> from now on! All right, <value:$28>. Full speed ahead!<end>"

["1480095"]
