["1480103"]
japanese = "現在、聖杯はゴブゴブ団と名乗る<line-break>３匹のゴブリンが盗み持っています。<line-break>\u3000<line-break>ですが、それを盗み出させたのは<line-break>魔人アーギルシャイアではなく、<line-break>このネモなのです。<end>"
