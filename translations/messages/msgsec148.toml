english = "This place... No, so this is it... I'm sure there was no manor here the last time I came through...<end>"

["1480002"]
japanese = "フフ、ここは結界を張っています。\u3000\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "Heh. This place is protected by a barrier.<end>"

["1480003"]
japanese = "未使用<end>"
english = ""

["1480004"]
japanese = "運命に選ばれた人だけが、<line-break>結界を抜けてここに入ってくるのです。<line-break>\u3000<line-break>ですから、あなたほどの冒険者でも\u3000\u3000<line-break>ここに来たことがないんですよ。<line-break>\u3000<end>"
