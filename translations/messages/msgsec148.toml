["1480093"]
japanese = "ねぇ、<value:$28>は<line-break><value:$28>だよねぇ？<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ルルアンタの知ってる、<line-break><value:$28>だよねぇ？<end>"
