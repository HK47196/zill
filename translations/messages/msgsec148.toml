["1480144"]
japanese = "そうそう。<value:$28>は<line-break>ギルドで受けた仕事を達成してるから<line-break>ギルドに行けば報酬がもらえるよぉ。<line-break>だから、ロストールに行くんだったら<line-break>ギルドに行った方がいいよ。<line-break>じゃあ、またあとでねぇ。<end>"
english = "Oh, right! You've finished that job you took from the Guild, <value:$28>, so you can collect your reward there. If you're going to Rostorl, you should stop by the Guild. See you later!<end>"

["1480145"]
japanese = "ん？\u3000なんだ、お前は？<line-break>お城に何か用があるのか？\u3000\u3000\u3000\u3000<end>"
english = "Hm? Who are you? Do you have business at the castle?<end>"

["1480146"]
japanese = "フリントの子だと？<line-break>…そう言えば、<line-break>お前の顔には見覚えがあるな。\u3000\u3000<line-break>お前が訪ねてくるという話は<line-break>聞いている。エリス様がお待ちだ。<line-break>ついてこい。<end>"
english = "Flint's child? Come to think of it, I do recognize your face. I was told you'd be coming. Lady Eris is waiting. Follow me.<end>"

["1480147"]
japanese = "<if><value:$29><equal>%0よく来た、フリントの息子<line-break><value:$28>よ。<line-break>もはや知っていようが…<line-break>そなたの父フリントは<line-break>ただの旅の商人ではない。<line-break>我が配下の諜報員だった。<end>よく来た、フリントの娘<line-break><value:$28>よ。<line-break>もはや知っていようが…<line-break>そなたの父フリントは<line-break>ただの旅の商人ではない。<line-break>我が配下の諜報員だった。<end>"
english = "<if><value:$29><equal>%0Welcome, <value:$28>, son of Flint. You may already know this, but your father was no mere traveling merchant. He was a spy in my service.<end>Welcome, <value:$28>, daughter of Flint. You may already know this, but your father was no mere traveling merchant. He was a spy in my service.<end>"

["1480148"]
japanese = "今回は、ノーブルの代官ボルボラから<line-break>エリエナイ公レムオンの出生の秘密に<line-break>関わる手紙を運んでくる途中だった。<line-break>そのことを私の口から伝えておくのが<line-break>筋だと思い、こうして呼んだのだ。<line-break>そなたの父には世話になったゆえな。<end>"
english = "He had been on his way here carrying a letter from Bolbora, the governor of Noble, concerning the secret surrounding the birth of Lemghon, Duke of Elienai. I summoned you because I thought it only right to tell you myself. I owed your father a great deal.<end>"

["1480149"]
japanese = "かつて、テジャワの変で<line-break>救ってくれて以来、久しく<line-break>フリントは私によく仕えてくれた。<line-break>フリントのことは<line-break>心から残念に思っている。<line-break>そなたには気を落とすなとも言えぬ。<end>"
english = "Flint served me faithfully for many years, ever since he saved me during the Tejava Incident. What happened to Flint pains me deeply. I can hardly tell you to keep your spirits up.<end>"

["1480150"]
japanese = "そなたは目の輝きが他人とは違う。<line-break>目の輝きは魂の輝きを示す。<line-break>そなたはよき魂を持っているようだ。<line-break>その魂を、今回のことで<line-break>曇らせぬようにしてほしい。<line-break>ただ、それを願うばかりだ。<end>"
english = "The light in your eyes is unlike anyone else's. The light in one's eyes reveals the light of the soul. Yours seems to be a good soul. I hope you will not let what has happened cloud it. That is my only wish.<end>"

["1480151"]
japanese = "わざわざ、すまなかったな。<line-break>そなたの元気な姿を見ることができて<line-break>安心した。<line-break>さがってよい。<line-break>フリントの子<value:$28>よ。<end>"
english = "Forgive me for summoning you all this way. I am relieved to see you well. You may go, <value:$28>, child of Flint.<end>"

["1480152"]
japanese = "フリントの子<value:$28>よ。<line-break>父のように私に仕えろとは言わぬ。<line-break>だが、時には私の所に来るとよい。<line-break>門衛には、そなたのことは<line-break>申し伝えておく。<line-break>門衛に話をすれば通れるはずだ。<end>"
english = "<value:$28>, child of Flint. I will not ask you to serve me as your father did. But you should come to see me from time to time. I will leave word at the gate. Speak to a guard there, and you should be admitted.<end>"

["1480153"]
japanese = "おう、あんた、ゼネテスさんの連れの<line-break>…たしか、<value:$28>だったな。<line-break>\u3000<line-break>子供たちが戻ってきたって、依頼主が<line-break>言っていたよ。初仕事で見事に<line-break>事件を解決してくれたみたいだな。<end>"
english = "Ah, you're the one traveling with Xenetes... <value:$28>, wasn't it? The client told me the children are back. Sounds like you did a fine job sorting everything out on your very first assignment.<end>"

["1480154"]
japanese = "これは報酬の５００ギアだ。<line-break>ゼネテスさんから、全部あんたに\u3000\u3000<line-break>渡すように言われている。<line-break>受け取ってくれ。<end>"
