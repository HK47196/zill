["1480139"]
japanese = "じゃあじゃあ、用意ができたら\u3000\u3000<line-break>早くロストールに行こうよ。<line-break>ルルアンタも準備してくるから。<line-break>町を出るときに合流するからね。<line-break>ロストールにはゼネテスがいるから<line-break>また会えるね。楽しみだなぁ。<end>"
english = "Then let's get ready and hurry to Rostorl! Lulluantha will go get ready too. We'll meet up when we leave town, all right? Xenetes is in Rostorl, so we'll get to see him again. I can't wait!<end>"

["1480140"]
japanese = "そうそう。<value:$28>は<line-break>ギルドで受けた仕事を達成してるから<line-break>ギルドに行けば報酬がもらえるよぉ。<line-break>だから、時間があったら<line-break>ロストールのギルドに行った方が<line-break>いいよ。じゃあ、またあとでねぇ。<end>"
english = "Oh, right! You've finished that job you took from the Guild, <value:$28>, so you can collect your reward there. If there's time, you should stop by the Guild in Rostorl. See you later!<end>"

["1480141"]
