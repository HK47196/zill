english = "The Grail originally belonged to him. When Nemo learned of Argyleshire's scheme, he resolved not to let her seize his artifact. Hoping to use its power to regain his true form, he had the three Goblins steal it from Rostorl.<end>"

["1480105"]
japanese = "ですが、禁断の聖杯によって<line-break>知恵を身につけたゴブリンたちは\u3000\u3000\u3000<line-break>ネモを見限ってしまいました。<end>"
english = "But the Forbidden Grail granted the Goblins wisdom, and they abandoned Nemo.<end>"

["1480106"]
japanese = "ミイスの時のように<line-break>聖杯を持ってるゴブリンがいる町ごと<line-break>焼き払ってしまうかもしれないのです。<line-break>ですから、あなたに急いで聖杯を<line-break>取り戻してもらいたいのです。<end>"
english = "As she did at Miis, Argyleshire may burn down the entire town where the Goblins holding the Grail are staying. That is why I need you to recover it quickly.<end>"

["1480107"]
japanese = "ウフフ。ありがとうございます。<line-break>それでは、聖杯のことお願いしますよ。<line-break>\u3000<line-break>このようなことは、ソウルに巨大な<line-break>可能性を秘めている…無限のソウルを<line-break>持つ者にしか頼めませんから。<end>"
english = "Hee hee. Thank you. Then I leave the Grail in your hands. This is something I could ask only of the Bearer of the Infinite Soul, whose Soul holds such tremendous potential.<end>"

["1480108"]
japanese = "ネモの話だと、そのゴブリンたちは<line-break>エンシャントにいるという話でしたが、<line-break>急がないと移動してしまうでしょう。<end>"
english = "According to Nemo, the Goblins are in Ancient, but they may move on if you don't hurry.<end>"

