["1480097"]
japanese = "アーギルシャイアは<line-break>破壊神ウルグの円卓騎士と呼ばれる\u3000<line-break>強力な魔人のひとりです。<line-break>妖艶な美女で、残酷で気まぐれです。<line-break>闇の神器をひとつ手に入れるために<line-break>ミイスを焼き払ってしまいました。<end>"
english = "Argyleshire is one of the powerful demons known as the Knights of the Round Table serving Ulugh, the God of Destruction. She is a seductive beauty, cruel and capricious. She burned Miis to the ground to obtain an Artifact of Darkness.<end>"

["1480098"]
japanese = "闇の神器？<end>"
english = "An Artifact of Darkness?<end>"

["1480099"]
japanese = "闇の神器とは強大で凶々しい力を持つ<line-break>１２の魔道器のことで、破壊神ウルグの<line-break>復活に使われたと言われています。<line-break>ただ、彼女はその本来の使い方<line-break>以外のことで使おうとしています。<line-break>\u3000<end>"
english = "The Artifacts of Darkness are twelve magical artifacts of immense and sinister power. They are said to have been used to resurrect Ulugh, the God of Destruction. But Argyleshire intends to use one for something other than its original purpose.<end>"

["1480100"]
japanese = "彼女は究極の合成怪物を作り、<line-break>その力でおもしろ半分に世界を<line-break>破壊しようと考えているようです。<line-break>その合成怪物を作るための知識を<line-break>闇の神器のひとつ、禁断の聖杯から<line-break>得ようとしているみたいですね。<end>"
