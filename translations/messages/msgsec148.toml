["1480005"]
japanese = "いらっしゃい。<line-break>お待ちしていましたよ。<line-break>\u3000<line-break>私はオルファウス。<line-break>この猫屋敷の主です。<end>"
english = "Welcome. I have been expecting you. I am Orphaus, master of Cat Manor.<end>"

["1480006"]
japanese = "…ということは、あんたが<line-break>この森に住んでいるという<line-break>賢者なのか？<end>"
english = "Then you're the sage who's said to live in this forest?<end>"

["1480007"]
japanese = "ウフフ。私は自分で賢者と<line-break>名乗ったことなどありませんが、<line-break>そのように呼ぶ人もいますね。<end>"
english = "Heh heh. I have never called myself a sage, though there are some who call me one.<end>"

["1480008"]
japanese = "…そうか、あんたが。<line-break>…おっと、自分のことを名乗るのを<line-break>忘れていたな。<line-break>俺はゼネテス。<line-break>こっちは<value:$28>。<line-break>ふたりとも冒険者だ。<end>"
english = "So you're the one... Ah, I nearly forgot to introduce myself. I'm Xenetes. This is <value:$28>. We're both adventurers.<end>"

["1480009"]
japanese = "連れのリルビーの女の子が<line-break>この森に迷い込んでしまってな。<line-break>今、捜している最中なんだが…。<end>"
english = "A Lilubee girl traveling with us wandered into this forest. We're looking for her now...<end>"

["1480010"]
japanese = "フフ。あなた方が捜している<line-break>女の子はルルアンタさんと<line-break>おっしゃいませんか？<end>"
english = "Heh. Would the girl you are seeking happen to be named Lulluantha?<end>"

["1480011"]
japanese = "どうして、ルルアンタのことを<line-break>知っている？<end>"
english = "How do you know Lulluantha?<end>"

["1480012"]
japanese = "ルルアンタさんなら、先ほど<line-break>森の中でお会いしましてね。<line-break>今は中にいらっしゃいますよ。<end>"
english = "I met Lulluantha in the forest a short while ago. She is inside now.<end>"

["1480013"]
japanese = "フフ、ここで立ち話もなんですし、<line-break>とりあえず、中に入りませんか？<end>"
english = "Heh. Rather than stand here talking, why don't we go inside for now?<end>"

["1480014"]
japanese = "あ？\u3000あぁ、そうだな。\u3000\u3000\u3000\u3000<line-break>中に入ってみよう。<line-break>\u3000<line-break>よかったな、<value:$28>、<line-break>ルルアンタが無事で。<end>"
english = "Huh? Oh, right. Let's go inside. Good news, <value:$28>. Lulluantha's safe.<end>"

["1480015"]
japanese = "そんじゃ、行ってみますか。<end>"
english = "Well then, let's go.<end>"

["1480016"]
japanese = "あ…、<value:$28>…。<end>"
english = "Oh... <value:$28>...<end>"

["1480017"]
japanese = "ふたりで捜しに来てくれた<line-break>そうですよ。<line-break>よかったですね、ルルアンタさん。<end>"
english = "They both came looking for you. Isn't that wonderful, Lulluantha?<end>"

["1480018"]
japanese = "<value:$28>、ルルアンタを追って<line-break>こんな所まで来てくれたんだ…。<line-break>ありがとう…。<end>"
english = "<value:$28>, you came all this way looking for Lulluantha... Thank you...<end>"

["1480019"]
japanese = "ごめんね、<value:$28>。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>フリントさんが亡くなって、<line-break><value:$28>が一番つらいときに、<line-break>こんなことになっちゃって。<end>"
english = "I'm sorry, <value:$28>. Flint died, and now, when <value:$28> is having the hardest time, this had to happen...<end>"

["1480020"]
japanese = "ルルアンタ、お使いに行くときに<line-break>フリントさんを襲ってきた<line-break>人を見つけて…<line-break>それで、あとを付けていったら<line-break>逆に捕まっちゃって…<end>"
english = "Lulluantha was out on an errand when she saw the person who attacked Flint... So Lulluantha followed, but got caught instead...<end>"

["1480021"]
japanese = "ルルアンタ、<value:$28>に<line-break>迷惑かけちゃった…。<end>"
english = "Lulluantha caused trouble for <value:$28>...<end>"

["1480022"]
japanese = "ひっく、ひっく…<end>"
english = "Sniff... sniff...<end>"

["1480023"]
japanese = "うわ～ん！！！<line-break><value:$28>～！<line-break>こわかったよぉ～～～！<end>"
english = "Waaaaah! <value:$28>! I was so scared!<end>"

["1480024"]
japanese = "あんたがルルアンタを<line-break>助けてくれたんだな。<line-break>礼を言う。<end>"
english = "You're the one who saved Lulluantha. You have my thanks.<end>"

["1480025"]
japanese = "いえいえ、森を歩いていたら<line-break>迷子に出会ったものですから。<line-break>助けるのは当然というものですよ。\u3000\u3000<line-break>それより、皆さんお疲れのようですし、<line-break>久々の再会で話すことも<line-break>たくさんあるでしょう。<end>"
english = "Not at all. I happened upon a lost child while walking through the forest. Helping her was only natural. More importantly, you all look tired, and after so long apart, you must have much to talk about.<end>"

["1480026"]
japanese = "腕によりをかけて<line-break>晩御飯を作りますから、<line-break>ゆっくり休んでいってください。<end>"
english = "I shall prepare a splendid dinner, so please stay and rest awhile.<end>"

["1480027"]
japanese = "すまない。<line-break>そうさせてもらえると助かる。<end>"
english = "Thanks. We'd appreciate that.<end>"

["1480028"]
japanese = "オルファウスさん、<line-break>おはようございます！！<end>"
english = "Good morning, Orphaus!<end>"

["1480029"]
japanese = "おはよう、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>、ルルアンタ。<line-break>\u3000<line-break>ルルアンタは本当に元気ですね。<end>"
english = "Good morning, <value:$28>, Lulluantha. You certainly are full of energy, Lulluantha.<end>"

["1480030"]
japanese = "うふふ。<line-break>ありがとうございます！<line-break>\u3000<end>"
english = "Hee hee. Thank you!<end>"

["1480031"]
japanese = "それで、<line-break>ゼネテスはどうしました？<end>"
english = "And where is Xenetes?<end>"

["1480032"]
japanese = "まだ寝てるよぉ。<line-break>ほんと、お寝坊さんなんだからぁ！<end>"
english = "He's still asleep. What a sleepyhead!<end>"

["1480033"]
japanese = "朝からうるせーぞ！<line-break>このガキ！<end>"
english = "Quit making such a racket this early, you brat!<end>"

["1480034"]
japanese = "あいてててって…。う～。<end>"
english = "Ow, ow, ow... Ugh.<end>"

["1480035"]
japanese = "わ、ブサイクな猫がしゃべった！<end>"
english = "Whoa! That ugly cat just talked!<end>"

["1480036"]
japanese = "俺は猫じゃない、ネモだ。<line-break>破壊神の円卓騎士ネモ！\u3000っててて…。<end>"
english = "I'm not a cat. I'm Nemo―Nemo, Knight of the Round Table serving the God of Destruction! Ow, ow...<end>"

["1480037"]
japanese = "わ、すごいすごーい！！<end>"
english = "Wow! That's amazing!<end>"

["1480038"]
japanese = "騒ぐなって。頭に響く。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>オルファウスとゼネテスと<line-break>朝まで飲んでて、ふつか酔いなんだよ。<line-break>いてててって…。<end>"
english = "Keep it down. You're making my head pound. I was drinking with Orphaus and Xenetes until dawn, and now I'm hungover. Ow, ow, ow...<end>"

["1480039"]
japanese = "破壊神の円卓騎士とは言っても、<line-break>昔の話です。<line-break>心配はいりませんよ。<line-break>昔、勇者ネメアに倒されてからは<line-break>猫の姿に封印されて、<line-break>今はなんの力も残っていませんから。<end>"
english = "He may have been a Knight of the Round Table serving the God of Destruction, but that was long ago. There is no need to worry. Ever since the Hero Nemea defeated him, he has been sealed in the form of a cat. He has no power left now.<end>"

["1480040"]
japanese = "しかし、さすがは破壊神の円卓騎士\u3000<line-break>ですよね。猫の姿になってなお<line-break>人語を操るんですから。<end>"
english = "Still, he is a Knight of the Round Table serving the God of Destruction. Even in the form of a cat, he can speak the human tongue.<end>"

["1480041"]
japanese = "さて、このバカ猫はほっといて。<line-break>ここまで訪ねてきてくれた<line-break>あなたたちに見せたいものがあります。<line-break>これから始まる冒険の旅の役に<line-break>きっと立つと思いますよ。<end>"
english = "Now, never mind this foolish cat. Since you've come all this way, there is something I'd like to show you. I believe it will prove useful on the adventure ahead.<end>"

["1480042"]
japanese = "あっ、これ何？<line-break>これ何？<end>"
english = "Oh! What's this? What is it?<end>"

["1480043"]
japanese = "フフ。<line-break>この子は転送機っていうんです。<line-break>使ってみましょうか。<end>"
english = "Heh heh. This little device is called a teleporter. Shall we try it?<end>"

["1480044"]
japanese = "わ！\u3000ゼネテスが出てきたぁ！<line-break>どうなってるのぉ？<end>"
english = "Whoa! Xenetes came out! How did that happen?<end>"

["1480045"]
japanese = "ウフフ。この子を使えば<line-break>このように、遠くにいる人を<line-break>呼び寄せたりできるんですよ。<end>"
english = "Hee hee. With this device, you can summon someone from far away, just as you saw.<end>"

["1480046"]
japanese = "へぇー。すごいんですねぇ。<line-break>オルファウスさんのお家って<line-break>不思議なものがいっぱい…。<end>"
english = "Wow, that's amazing. Your house is full of mysterious things, Orphaus...<end>"

["1480047"]
japanese = "それにしても、ゼネテスったらぁ。<line-break>みっともないんだからぁ。<end>"
english = "Honestly, Xenetes. What a disgraceful sight.<end>"

["1480048"]
japanese = "あれだけ飲めば、仕方ないですかね。<line-break>私ですら多少厳しいんですから…。<line-break>\u3000<line-break>そうそう、それと<line-break>この子は逆に、ここにいる人を<line-break>遠くに送り出すこともできますよ。<end>"
english = "Given how much we drank, I suppose it was inevitable. Even I found it a little taxing... Ah, yes. This device can also send someone here to a distant place.<end>"

["1480049"]
japanese = "すごいすごーい！<end>"
english = "Amazing!<end>"

["1480050"]
japanese = "あなたが将来、<line-break>旅で人と出会い、<line-break>仲間を増やしたとき、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>一緒に旅する仲間を<line-break>変更したいと思ったら<line-break>ここに来てください。<end>"
english = "In the future, once you've met people on your travels and gained more companions, come here whenever you wish to change who travels with you.<end>"

["1480051"]
japanese = "あ、今後はパーティーメンバーの<line-break>了解を取ってから呼び出しますから<line-break>こんな無様なことはありませんよ。<end>"
english = "Ah, from now on, I'll obtain your party members' consent before summoning them. You won't see such an undignified spectacle again.<end>"

["1480052"]
japanese = "おはよう、ゼネテス！<end>"
english = "Good morning, Xenetes!<end>"

["1480053"]
japanese = "おはようございます。<line-break>気分はどうですか？<end>"
english = "Good morning. How are you feeling?<end>"

["1480054"]
japanese = "…最悪だ。<line-break>朝まで飲んで寝てるところを<line-break>実験台に使われたんだからな…。<end>"
english = "Awful. I drank until dawn, fell asleep, and then got used as a test subject...<end>"

["1480055"]
japanese = "くすっ、以後は<line-break>そんなことはありませんから。<end>"
english = "Hee. I assure you, it won't happen again.<end>"

["1480056"]
japanese = "フフ、信じてるぜ。<end>"
english = "Heh. I'll hold you to that.<end>"

["1480057"]
japanese = "さぁて、すっかり<line-break>長居しちまったからな。<line-break>そろそろ、おいとまするとしようか？<end>"
english = "Well, we've stayed more than long enough. Shall we be on our way?<end>"

["1480058"]
japanese = "おや、もうお帰りですか？<line-break>あなたたちに、ひとつ仕事をお願い<line-break>しようかと思っていたんですが…。<end>"
english = "Oh, are you leaving already? I was hoping to ask you to take on a job for me...<end>"

["1480059"]
japanese = "うーん。<line-break>最終的な判断は\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>に任せるが、<line-break>そろそろ<value:$28>に、<line-break>ロストールのお偉いさん方から<line-break>なんらかの接触があると思うぜ。<end>"
english = "Hmm. The final decision is yours, <value:$28>, but I expect the important people in Rostorl will be contacting <value:$28> before long.<end>"

["1480060"]
japanese = "お前さんはエリスの密使の子だ。\u3000\u3000\u3000<line-break>だから、ロストール王家の秘密を<line-break>聞かされてると思われてるだろう。<line-break>エリス側か、あるいはエリスに<line-break>敵対する側かが、お前さんに<line-break>働きかけてくるのはまず間違いない。<end>"
english = "You're the child of Eris's secret envoy. They'll assume you've been told the secrets of the Rostorl Royal House. Either Eris's faction or its enemies are almost certain to approach you.<end>"

["1480061"]
japanese = "お前さんは何も知らんようだが、<line-break>残念ながら、お前さんが知ってるか<line-break>どうかは問題じゃない。<line-break>お前さんが知っていると、<line-break>向こうが思いこんでいることが<line-break>問題なんだ。<end>"
english = "You don't seem to know anything, but unfortunately, whether you actually know is beside the point. What matters is that they believe you do.<end>"

["1480062"]
japanese = "さーてと。<line-break>俺はそろそろロストールに戻るか。<line-break>こう見えてもけっこう忙しいんでね。<end>"
english = "Well, I suppose it's time I went back to Rostorl. Believe it or not, I'm a busy man.<end>"

["1480063"]
japanese = "えー？<line-break>ゼネテス、もう行っちゃうのぉ？<end>"
english = "What? Xenetes, you're leaving already?<end>"

["1480064"]
japanese = "あぁ。ルルアンタがいれば、<line-break><value:$28>は大丈夫だろ？<end>"
english = "Yeah. With Lulluantha around, <value:$28> should be all right, don't you think?<end>"

["1480065"]
japanese = "<value:$28>。お前はギルドで<line-break>受けた誘拐事件の依頼も達成している。<line-break>もう、立派な冒険者だ。<line-break>ルルアンタと一緒に、<line-break>お前の冒険を続けるんだ。<line-break>仕事の報酬はその行動資金にしてくれ。<end>"
english = "<value:$28>, you have fulfilled the Guild's request to solve the kidnapping case. You are already a fine adventurer. Continue your adventure with Lulluantha. Use the reward from this job to fund your journey.<end>"

["1480066"]
japanese = "なぁに、一生の別れというんじゃない。\u3000<line-break>俺の力が必要になったら、ロストールの<line-break>スラムを訪ねてきてくれればいい。<line-break>じゃあ、またな、<line-break><value:$28>、ルルアンタ。<line-break>オルファウスさんにも世話になったな。<end>"
english = "Come on, it's not as if we'll never meet again. If you need my help, come find me in the Slums of Rostorl. Until next time, <value:$28>, Lulluantha. And thank you for everything, Orphaus.<end>"

["1480067"]
japanese = "ゼネテス、行っちゃったね…。<end>"
english = "Xenetes is gone...<end>"

["1480068"]
japanese = "でもでもぉ、ルルアンタは<line-break>いつまでも<value:$28>と<line-break>一緒にいるからね！<end>"
english = "But Lulluantha will stay with <value:$28> forever!<end>"

["1480069"]
japanese = "さて、ゼネテスの話では<line-break>あなたはロストール王家に<line-break>因縁があるようですからね。\u3000<line-break>無理強いはしませんが、ひとつ<line-break>私の仕事の依頼を聞いては<line-break>もらえませんか？<end>"
english = "Now, from what Xenetes said, it seems you have some connection to the Rostorl Royal House. I won't force you, but would you at least hear about a job I'd like you to undertake?<end>"

["1480070"]
japanese = "もう質問はありません<end>"
english = "I don't have any more questions.<end>"

["1480071"]
japanese = "無限のソウルとは<end>"
english = "What is the Infinite Soul?<end>"

["1480072"]
japanese = "転送機について<end>"
english = "About the teleportation device<end>"

["1480073"]
japanese = "闇の神器について<end>"
english = "About the divine artifact of darkness<end>"

["1480074"]
japanese = "ネモについて<end>"
english = "About Nemo<end>"

["1480075"]
japanese = "アーギルシャイアについて<end>"
english = "About Argyleshire<end>"

["1480076"]
japanese = "将来、旅の途中で出会った仲間を<line-break>呼び出すための装置です。<line-break>\u3000<line-break>一緒に旅する仲間を<line-break>変更したくなったら<line-break>この猫屋敷に来てください。<end>"
english = "This device will allow you to summon companions you meet on your travels. If you ever wish to change who travels with you, come to the Cat Manor.<end>"

["1480077"]
japanese = "一緒に旅をしたい仲間を呼び出したり<line-break>別行動を取ることを決めた仲間を<line-break>送り出したりできますよ。<end>"
english = "You can summon companions you wish to travel with, or send off those who have decided to go their separate ways.<end>"

["1480078"]
japanese = "ここにいるブサイクな猫です。\u3000\u3000<line-break>口は悪いですけれど<line-break>無害ですよ。<line-break>もともとは老人星の精霊で<line-break>天空の賢者とも呼ばれていましたが<line-break>地上に落ちて、魔人になりました。<end>"
english = "That would be the ugly cat right here. He's foul-mouthed, but harmless. He was once a spirit of the Old Man Star and was also known as the Sage of the Heavens, but then he fell to earth and became a demon.<end>"

["1480079"]
japanese = "破壊神の強力な魔人、<line-break>１２人の円卓騎士のひとりで、<line-break>名前を知るものの異名を持ちます。<end>"
english = "One of the God of Destruction's powerful demons and one of the twelve Knights of the Round Table, known by the epithet “He Who Knows the Name.”<end>"

["1480080"]
japanese = "聖杯をねらってる悪い魔人は\u3000<line-break>アーギルシャイア。<line-break>\u3000<line-break>聖杯を持ってるゴブリンは<line-break>ゴブゴブ団って言って<line-break>今はエンシャントにいる…と。<end>"
english = "The evil demon after the Grail is Argyleshire. The Goblins who have it call themselves the Gob-Gob Gang, and they're in Ancient right now... Got it.<end>"

["1480081"]
japanese = "忘れないように<line-break>覚えておかなくちゃ。<line-break>\u3000<end>"
english = "I'd better remember that so I don't forget.<end>"

["1480082"]
japanese = "あぁ？\u3000なんだって？<line-break>…あいてててって。う～。<line-break>話はオルファウスに聞いてくれ。<end>"
english = "Huh? What did you say? Ow, ow, ow... Ugh. Ask Orphaus about it.<end>"

["1480083"]
japanese = "あ、<value:$28>。<line-break>もう、行っちゃうの？<end>"
english = "Oh, <value:$28>. Are you leaving already?<end>"

["1480084"]
japanese = "じゃあ、オルファウスさんに<line-break>ちゃんとお礼を言ってからね。<end>"
english = "Then make sure you thank Orphaus properly before we go.<end>"

["1480085"]
japanese = "オルファウスさん。<line-break>本当にお世話になりましたぁ。<end>"
english = "Orphaus, thank you so much for everything.<end>"

["1480086"]
japanese = "いえいえ、お礼を言われるほどの<line-break>ことはしていませんよ。<line-break>私もふたりに会えてよかったです。<end>"
english = "Not at all. I haven't done anything worth thanking me for. I'm glad I got to meet you both, too.<end>"

["1480087"]
japanese = "オルファウスさん、<line-break>それじゃあ、行ってきまーす！<end>"
english = "Well, Orphaus, we're off!<end>"

["1480088"]
japanese = "<value:$28>。<end>"
english = "<value:$28>.<end>"

["1480089"]
