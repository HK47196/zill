english = "<if><value:$01><equal>3What shall we do, <value:$28>? Bandit or no, it wouldn't sit right to simply walk away. Shall we go?<end><if><value:$01><equal>4What are you going to do, <value:$28>? You're going to help, then?<end><if><value:$01><equal>5What are you going to do, <value:$28>? Just as I thought...<end><if><value:$01><equal>6That's the bandit everyone's been talking about, right? The bandit's probably a bad person, right? But... What should we do, <value:$28>?<end><if><value:$01><equal>13<value:$28>. You're not seriously planning to go, are you?<end><if><value:$01><equal>10What're you gonna do, sis? Though knowing you...<end><if><value:$01><equal>14Something seems strange. What shall we do, <value:$28>? Shall we go see this bandit's so-called lair?<end><if><value:$01><equal>15What should we do, <value:$28>? They say there's a monster... Shall we go and see?<end><if><value:$01><equal>17<value:$28>! Don't tell me you're thinking of going to help! You're not, are you?!<end><if><value:$01><equal>19Hey, hey, <value:$28>. The bandit might be a bad person, but we have to go help, don't we? Right?<end><if><value:$01><equal>20You're going?<end><if><value:$01><equal>11What are you going to do, <value:$28>?<end><if><value:$01><equal>27A bandit? Something's not right... What will you do, <value:$28>?<end><if><value:$01><equal>26A monster... Shall we go see this bandit's so-called lair?<end><if><value:$01><equal>192What will you do, <value:$28>? I shall follow your lead.<end><if><value:$01><equal>193That's a bandit, isn't it? But still... What should we do, <value:$28>?<end><if><value:$01><equal>194I'm warning you. That man over there is... far too dangerous.<end><if><value:$01><equal>191I wonder if there really is a monster. What will you do, <value:$28>? Are you going to help the bandit?<end><if><value:$01><equal>190What will you do? Those people are bandits. Are you still going to help?<end>What are you going to do, <value:$28>? This person belongs to that ban