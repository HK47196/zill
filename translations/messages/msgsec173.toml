english = "<if><value:$01><equal>3Hm. I thought that was what you'd say. Well then, let us be off.<end><if><value:$01><equal>4Hee hee! We might get caught up in another mess! I'm almost looking forward to it! Eek!<end><if><value:$01><equal>5Yeah, figures. <value:$28> really can't resist getting involved in things like this. All right, let's get going.<end><if><value:$01><equal>6Yeah, you're right. We can't just leave things like this. Come on, <value:$28>. Let's go!<end><if><value:$01><equal>13Honestly... What utter nonsense.<end><if><value:$01><equal>10Yeah, I thought so. Come on, sis. Let's go.<end><if><value:$01><equal>14Very well. Let us go.<end><if><value:$01><equal>15You're right. We can't just leave things like this. Come on, let's go!<end><if><value:$01><equal>17Oh, honestly! Why must you act out of such base pity? I simply cannot believe it!<end><if><value:$01><equal>19Right! Let's go!<end><if><value:$01><equal>20I see.<end><if><value:$01><equal>11All right.<end><if><value:$01><equal>27I see. If <value:$28> says so, then let us go.<end><if><value:$01><equal>26Mm.<end><if><value:$01><equal>192Understood. Let's go and help.<end><if><value:$01><equal>193I thought you'd say that, <value:$28>. Let's hurry and help!<end><if><value:$01><equal>194I thought that was what you'd say... All right, let's go.<end><if><value:$01><equal>191You really are a meddler, <value:$28>. But that's one of your good qualities. All right, let's go!<end><if><value:$01><equal>190I agree with you. Let's hurry.<end>You're right. That's just like you, <value:$28>. Come on, let's go!<end>"

