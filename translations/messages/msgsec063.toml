["630070"]
japanese = "タルテュバという貴族の男が、<line-break>ときどき、スラムに現れて暴れるんです。<line-break>\u3000<line-break>わたしたちのことを、<line-break>クズだ、ゴミだと言って…。<line-break>もう、何人も殺されています。<end>"
