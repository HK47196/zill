["630066"]
japanese = "そういえば、ゼネテスのおじちゃん\u3000\u3000<line-break>さいきん来ないなぁ…。<line-break>\u3000<line-break>おじちゃんのお嫁さんに<line-break>なってあげるってやくそくしたのに…。<line-break>女の子を待たせるなんて、ダメね。<end>"
