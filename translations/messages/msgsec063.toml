["630012"]
japanese = "さあ、クズども、早く出てこい！<line-break>タルテュバ様のお出ましだぞ！\u3000\u3000<line-break>\u3000<line-break>今日はお前らと遊んでやろう。<line-break>たっぷりと死ぬまでなア！<end>"
english = "Come on, you scum! Get out here! The great Tartyuba has arrived! Today, I think I'll play with you until you're good and dead!<end>"

["630013"]
japanese = "来たようです。<end>"
english = "It sounds like Tartyuba's here.<end>"

["630014"]
japanese = "ガラの悪い人を引き連れて、<line-break>目に付いたスラムの人を<line-break>ひとり残らず殴り倒すんです…。<end>"
english = "Tartyuba brings a gang of thugs along and beats down every last person in the Slums who catches Tartyuba's eye...<end>"

["630015"]
japanese = "あいつは、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ムカつくことがあると、<line-break>ここへ人狩りに来るのさ。\u3000<line-break>だから、あいつが<line-break>こっちに向かっているって聞いたら、<line-break>近くの家に隠れるようにしてるのさ。<end>"
english = "Whenever something gets under Tartyuba's skin, this is where the noble comes to hunt people. So when we hear Tartyuba is headed this way, we hide in the nearest house.<end>"

["630016"]
japanese = "なんだお前ら！<line-break>出てこないつもりなのかア！？<end>"
english = "What's this, you lot? You mean you're not coming out?!<end>"

["630017"]
japanese = "へっ、当たり前じゃねえか。<line-break>こっちは貧乏人、相手はお貴族様。<line-break>出ていっても、いたぶられるだけだ。<line-break>こうやって<line-break>嵐が通り過ぎるのを<line-break>待つしかないのさ。<end>"
english = "Hah. Of course not. We're poor, and Tartyuba's a high-and-mighty noble. If we go out there, we'll only be tormented. All we can do is stay put and wait for the storm to pass.<end>"

["630018"]
japanese = "くっ、クズどもが<line-break>コソコソ隠れやがって…。<line-break>さては、陰で俺を笑ってるんだな！<end>"
english = "Damn you, hiding away like that... You're laughing at me behind my back, aren't you?!<end>"

["630019"]
japanese = "タルテュバはねえ<line-break>この前、わたしの大切なお人形を<line-break>取っていっちゃったんだよ。<end>"
english = "Tartyuba took my precious doll away the other day.<end>"

["630020"]
japanese = "へっ、人形ですんでよかったな。<line-break>命を持ってかれなかっただけ<line-break>ましだぜ。<end>"
english = "Hah. You're lucky it was only a doll. At least you got away with your life.<end>"

["630021"]
japanese = "くそっ！\u3000どいつもこいつも<line-break>俺のことバカにしやがって！<line-break>なめやがって！\u3000なめやがってエ！<line-break>俺は名家リューガ家の出なんだ。<line-break>お前らとは格が違うんだ！<line-break>それなのに、バカにしやがって…。<end>"
english = "Damn you! Every last one of you is making a fool of me! How dare you! How dare you! I was born into the illustrious House of Ryuga. I'm far above the likes of you! And still you mock me...<end>"

["630022"]
japanese = "ああ、こんなときに<line-break>ゼネテスさんがいてくれたら…。<line-break>\u3000<line-break>あの人なら、<line-break>すぐにタルテュバを<line-break>追い帰してくれるでしょうに。<end>"
english = "Oh, if only Xenetes were here... He would send Tartyuba packing in no time.<end>"

["630023"]
japanese = "クズのくせに…クズのくせに…<line-break>クズのくせに…クズのくせに…<line-break>クズのくせに…クズの……………！！<end>"
english = "Scum like you... scum like you... scum like you... scum like you... scum like you... Scum like...!<end>"

["630024"]
japanese = "殺す！！<line-break>お前ら全員、ブチのめしてやるゥ！<line-break>\u3000<line-break>リベルダムから取り寄せた<line-break>戦闘用モンスターを連れてこい！！<end>"
