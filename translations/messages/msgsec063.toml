["630027"]
japanese = "タルテュバ様、こいつです。<end>"
english = "Your Excellency, here it is.<end>"

["630028"]
japanese = "俺に逆らった罰だア！<line-break>こいつで、薄汚いスラムごと<line-break>ぶっつぶしてやる！<end>"
