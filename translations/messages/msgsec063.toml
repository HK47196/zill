["630071"]
japanese = "<if><value:$29><equal>%0お兄ちゃん、この前はありがとね。<line-break>タルテュバも<line-break>あれでこりてくれるといいんだけど。<end>お姉ちゃん、この前はありがとね。<line-break>タルテュバも<line-break>あれでこりてくれるといいんだけど。<end>"
