["1330000"]
japanese = "エア\u3000ボリューム５開始<end>"
english = ""

["1330001"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000エアは<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000虚無の子に<line-break>\u3000\u3000\u3000\u3000\u3000さらわれてしまった…。\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "The Child of the Void has taken Er…<end>"

["1330002"]
japanese = "\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000エアは竜骨の砂漠だ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000エアを<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000救うのだ。<end>"
english = "Bearer of the Infinite Soul. Er is in the Dragonbone Desert. Save her.<end>"

["1330003"]
japanese = "\u3000\u3000\u3000\u3000\u3000エアは死んでしまった…。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000もはや、我が未来のために<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000守るべきものは<line-break>\u3000\u3000\u3000\u3000\u3000\u3000なくなってしまった…。<end>"
english = "Er is dead... There is nothing left for me to protect for the sake of my future...<end>"

["1330004"]
japanese = "\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000我に見せてはくれぬか？<line-break>\u3000\u3000\u3000\u3000\u3000\u3000そなたのその力を。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000未来への希望を。<end>"
english = "Bearer of the Infinite Soul, will you not show me? Show me that power of yours. Show me hope for the future.<end>"

["1330005"]
japanese = "期待に応えてみせます<end>"
english = "I'll live up to your expectations.<end>"

["1330006"]
japanese = "あなたも希望なのです<end>"
english = "You are hope, too.<end>"

["1330007"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000では、ゆくぞ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者、<line-break>\u3000\u3000\u3000\u3000\u3000いや、<value:$28>よ。<end>"
english = "Then let us begin. Bearer of the Infinite Soul―no, <value:$28>.<end>"

["1330008"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000見せてもらったぞ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000感じさせてもらったぞ。<line-break>\u3000\u3000\u3000そなたの持つ、大いなる可能性を。<line-break>\u3000\u3000\u3000\u3000希望は、まだあるということを。<end>"
english = "I have seen it. I have felt it: the great potential within you, and the truth that hope still remains.<end>"

["1330009"]
japanese = "\u3000\u3000\u3000我は、すでに古く、朽ちゆく存在。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000そなたらの未来には要らぬもの。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000さらばだ。<line-break>\u3000\u3000\u3000小さく、弱く、強く、優しき者よ。<end>"
english = "I am already ancient, a being slowly crumbling away. Your future has no need of me. Farewell, you who are small and weak, yet strong and kind.<end>"

["1330010"]
japanese = "<value:$28>は<line-break>竜殺しの称号を手に入れた。<end>"
english = "<value:$28> earned the title of Dragonslayer.<end>"

["1330011"]
japanese = "\u3000\u3000\u3000\u3000\u3000この我が……希望……か。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000不思議なものだ。汝が言うと<line-break>\u3000\u3000\u3000いかにもという感じがしてくる。<end>"
english = "That I... am hope...? A strange thing. When you say it, somehow it begins to feel true.<end>"

["1330012"]
japanese = "\u3000\u3000\u3000\u3000ならば、我も在りつづけよう。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000やがて新しき希望が<line-break>\u3000\u3000\u3000\u3000この地に生まれるのを待ち、<line-break>\u3000\u3000\u3000\u3000そして、守り育んでゆこう。<end>"
english = "Then I, too, shall endure. I will wait for a new hope to be born in this land, and I shall protect and nurture it.<end>"

["1330013"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000では、さらばだ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。<line-break>\u3000\u3000\u3000\u3000\u3000我はまだ見ぬ希望を待つ。<line-break>\u3000\u3000\u3000\u3000汝は、希望をもたらしにゆけ。<end>"
english = "Then farewell, Bearer of the Infinite Soul. I shall await a hope as yet unseen. Go forth and bring hope.<end>"

["1330014"]
japanese = "…<value:$28>。<line-break>本当にそなたが参るとは…。<line-break>いや、なんでもない。こちらの話じゃ。<line-break>今日はそなたに<line-break>聞いてもらいたいことがあったのじゃ。<end>"
english = "…<value:$28>. To think you truly came... No, never mind. It was merely a thought of my own. There was something I wanted you to hear today.<end>"

["1330015"]
japanese = "風の巫女は、魔法によって\u3000\u3000<line-break>その命の連続を築いてきた。<line-break>\u3000<line-break>わかりやすく言えば、<line-break>次の巫女となる自分の娘を<line-break>魔法で生み出してきたのじゃ。<end>"
english = "The Priestesses of Wind have used magic to perpetuate their line. Put simply, each has used magic to bring forth her own daughter, who would become the next priestess.<end>"

["1330016"]
japanese = "自らの魔力を守るために\u3000\u3000\u3000\u3000<line-break>他者との血の交わりを嫌い<line-break>自然の理に背いてな……。<line-break>ゆえに風の巫女は、<line-break>普通の人間の半分も生きられぬ。<end>"
english = "To preserve their own magical power, they shunned the mingling of their blood with another's and defied the laws of nature. Thus, a Priestess of Wind cannot live even half as long as an ordinary human.<end>"

["1330017"]
japanese = "わらわは絶望した。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>この、悲しき営みに。<line-break>\u3000<line-break>子を残すために魔力を使い果たし<line-break>おぞましくくずれ落ちる<line-break>歴代の風の巫女と、自分の運命に…。<end>"
english = "I despaired at this sorrowful cycle―at the fate of every Priestess of Wind who had come before me, spending all her magic to leave behind a child, only to collapse into a hideous ruin... and at the fate awaiting me.<end>"

["1330018"]
japanese = "それゆえ、わらわは\u3000\u3000\u3000\u3000\u3000<line-break>シャリの言葉に惹かれた。<line-break>\u3000<line-break>運命を断ち切る力であれば、<line-break>それがたとえ絶望であっても<line-break>すがりたいと思ったのじゃ…。<end>"
english = "That was why Shalli's words drew me in. If there was a power that could sever the bonds of fate, I wanted to cling to it―even if that power was despair itself.<end>"

["1330019"]
japanese = "最後まで聞くのじゃ…。<end>"
english = "Hear me out to the end.<end>"

["1330020"]
japanese = "しかし、そなたが、<line-break>絶望のはざまにしか道を見出せなかった<line-break>わらわを救ってくれた。<line-break>わらわは決めた。<line-break>魔法で子を産むのはよそう、<line-break>運命にあらがおう、と。<end>"
english = "But you saved me, when I could see no path except one through despair. And so I made my choice. I would not bear a child through magic. I would defy fate.<end>"

["1330021"]
japanese = "運命はひとつではない。<line-break>それは可能性のひとつにすぎない…。<end>"
english = "There is not just one fate. It is only one possibility among many.<end>"

["1330022"]
japanese = "運命と絶望があるのではなく、\u3000\u3000\u3000<line-break>可能性と希望がある…。<line-break>\u3000<line-break>そう、そなたが教えてくれたからな。<end>"
english = "It is not fate and despair that lie before us, but possibility and hope. You taught me that.<end>"

["1330023"]
japanese = "わらわは、今日、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>わらわの決心を<line-break>そなたに聞いてもらいたかった。<line-break>それゆえ、わらわは<line-break>そなたがここを訪れることを望み、<line-break>そして、今日、そなたはここへ参った。<end>"
english = "Today, I wanted you to hear the choice I had made. And so I wished that you would visit this place―and today, you came.<end>"

["1330024"]
japanese = "…願いが、…かのうたのじゃ。<line-break>希望とは、つまり<line-break>こういうことなのじゃな…。<end>"
english = "My wish... has come true. So this is what hope means.<end>"

["1330025"]
japanese = "やっぱ、ちょっと殺風景だよ。<line-break>僕にとっては翔王が死んでてくれて<line-break>好都合なんだけどさ。<end>"
english = "Still, it does feel a little bare. Though having the Soaring King dead works out rather well for me.<end>"

["1330026"]
japanese = "シャリか…。抵抗はせぬ。<line-break>わらわを、ラドラスへ<line-break>連れて行くがよい…。<end>"
english = "Shalli... I shall not resist. Take me to Ladras.<end>"

["1330027"]
japanese = "おとなしく僕に連れ去られ、<line-break>空中都市を復活させる。<line-break>\u3000<line-break>それが、君に見えた運命から<line-break>君が選んだ道なんだね？<end>"
english = "You'll let me carry you off without a fight and restore the Floating City. So that's the path you chose based on the destiny you saw?<end>"

["1330028"]
japanese = "………………。<end>"
english = "...<end>"

["1330029"]
japanese = "ねえ、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>君の力で見える運命ってさ、<line-break>たったひとつっきりなの？<line-break>いろんな運命っていうかさ、<line-break>例えば君が僕に抵抗したくなるような、<line-break>そんな運命は見えなかったの？<end>"
english = "Tell me, is there only one destiny your power lets you see? Aren't there others? One where you feel like resisting me, for instance. Didn't you see anything like that?<end>"

["1330030"]
japanese = "わらわに見える運命にも<line-break>いくらかの、ぶれやねじれはある。<line-break>\u3000<line-break>しかし、それらがたどりつく<line-break>運命の帰結点は、ひとつじゃ。<end>"
english = "Even the destinies I see contain some variation and distortion. Yet they all arrive at the same final outcome.<end>"

["1330031"]
japanese = "ふーん。ね、じゃあさ、<line-break>運命がたったひとつに<line-break>帰結する点って、いつのことなの？<end>"
english = "Hmm. Then tell me: when exactly do all those destinies converge on a single outcome?<end>"

["1330032"]
japanese = "それは………。<end>"
english = "That is...<end>"

["1330033"]
japanese = "僕が答えてあげよっか？\u3000\u3000\u3000<line-break>運命なんて本当は<line-break>帰結してないんでしょ？<line-break>君がこうしているのは、<line-break>君が、それを望んでいるから。<line-break>そうでしょ？<end>"
english = "Want me to answer for you? Destiny doesn't really converge at all, does it? You're doing this because it's what you want. Isn't that right?<end>"

["1330034"]
japanese = "空中都市を浮かばせて、\u3000\u3000\u3000\u3000<line-break>運命から逃げたいんでしょ？<line-break>君が見た、君の運命から。<line-break>先代までの風の巫女みたいに<line-break>むごたらしい姿で朽ちていく<line-break>自分と、その娘たちの運命から！<end>"
english = "You want to raise the Floating City and escape destiny, don't you? The destiny you saw for yourself: you and your daughters rotting away in some hideous state, just like every Priestess of Wind before you!<end>"

["1330035"]
japanese = "言うな！<end>"
english = "Say no more!<end>"

["1330036"]
japanese = "わかったよ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>僕は君が来てくれるなら<line-break>それでいいんだ。<line-break>じゃあ、行こうか。<line-break>君を救ってくれる絶望に向かって。<end>"
english = "All right. As long as you come with me, that's enough. Shall we go, then? Toward the despair that will save you.<end>"

["1330037"]
japanese = "シャリ！<end>"
english = "Shalli!<end>"

["1330038"]
japanese = "おや、地の巫女エステルちゃん！<line-break>ごめんね。今は君に構ってられない。<line-break>僕の代わりにこいつがお相手するよ。<end>"
english = "Well, if it isn't little Esther, the Priestess of Earth! Sorry, but I don't have time for you right now. This one will keep you company in my place.<end>"

["1330039"]
japanese = "シャリ、いったい何を企んでおる！<line-break>イークレムン殿をどうした！？<end>"
english = "Shalli, what in blazes are you plotting? What have you done with Lady Iiklmn?!<end>"

["1330040"]
japanese = "イークレムン殿…ねえ？\u3000<line-break>彼女なら無事だよ。<line-break>\u3000<line-break>ねぇ、お爺ちゃん、<line-break>元気が余ってるんなら、<line-break>こいつの相手でもしててよ。<end>"
english = "Lady Iiklmn, you say? She's safe. And Grandpa, if you've got that much energy to spare, why don't you keep this one busy?<end>"

["1330041"]
japanese = "やぁ、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>じゃないか？\u3000<line-break>\u3000<line-break>僕と君は、<line-break>今、同じ感覚を共有しているよ。<line-break>おいおい、またこいつかよ、ってね。<end>"
english = "Well, if it isn't <value:$28>. You and I are feeling exactly the same thing right now: “Oh, come on. This thing again?”<end>"

["1330042"]
japanese = "フフ、ダメだよん、君。<line-break>順番はちゃんと守ってよ。<line-break>まずは僕がエアと話すの。<line-break>その間、退屈だろうから、<line-break>こいつとでも遊んでてよ。<end>"
english = "Heh-heh, no cutting in line. I get to talk to Er first. You'd only be bored while you wait, so go play with this one.<end>"

["1330043"]
japanese = "無限のソウルを持つ者の未来は<line-break>エアにも見えないらしいね。<line-break>\u3000<line-break>フフ、そうだ、こうしよう！<line-break>君がこいつに勝ったら、<line-break>今日は引き上げようじゃない？<end>"
english = "It seems even Er can't see the future of the Bearer of the Infinite Soul. Heh-heh, I know! Let's do this: if you beat this one, why don't I call it a day and leave?<end>"

["1330044"]
japanese = "フフ、約束だ。<line-break>今日は引き上げるよ。<end>"
english = "Heh-heh, you have my word. I'll leave for today.<end>"

["1330045"]
japanese = "でも、ねえ、エア、いいの？<line-break>君自身の望みは、僕と一緒に<line-break>行くことなんじゃないのかい？<end>"
english = "But Er, are you sure? Isn't going with me what you truly want?<end>"

["1330046"]
japanese = "エア。君には選ぶ権利がある。<line-break>僕と来て、空中都市で<line-break>すべての絶望に終止符を打つか。<line-break>それとも、彼らと共に行き、<line-break>結局、新しい絶望を味わうか。<end>"
english = "Er, the choice is yours. Come with me and put an end to all despair in the Floating City, or go with them and eventually suffer a new despair.<end>"

["1330047"]
japanese = "ボクたちは絶望なんかしない。<line-break>絶望をはねのける希望のために<line-break>戦いぬいてみせる！！<end>"
english = "We won't give in to despair! We'll fight to the very end for the hope that can drive despair away!!<end>"

["1330048"]
japanese = "わらわは…。<end>"
english = "I...<end>"

["1330049"]
japanese = "それが答え？<line-break>愚かすぎるよ。<end>"
english = "Is that your answer? How utterly foolish.<end>"

["1330050"]
japanese = "愚かなもんか！！<line-break>暗い運命なんか信じないで、<line-break>明るい希望に賭けるんだよ！<end>"
english = "It's not foolish!! We won't believe in some grim destiny. We'll bet on a brighter hope!<end>"

["1330051"]
japanese = "クスクス、希望だって？<line-break>エア、本気？<line-break>君らしくもない行動だよ？<end>"
english = "Heh-heh. Hope, you say? Are you serious, Er? This isn't like you at all.<end>"

["1330052"]
japanese = "うるさいわ。<line-break>わらわはそなたに従わぬ。<line-break>それだけじゃ。去れ！<end>"
english = "Silence. I shall not obey you. That is all. Begone!<end>"

["1330053"]
japanese = "あーあ、僕も嫌われたもんだね。<line-break>まあいいや。<line-break>僕もちょっと忙しくなってきたし。<line-break>また今度、誘いに来るよ。<line-break>じゃあね！\u3000バイバーイ！<end>"
english = "Oh dear, you really do hate me now. Never mind. I'm getting a little busy myself. I'll come back and ask you again sometime. Bye-bye!<end>"

["1330054"]
japanese = "エア、シャリのねらいはなんなの？<line-break>空中都市って？<end>"
english = "Er, what is Shalli after? And what's this Floating City?<end>"

["1330055"]
japanese = "…フフ、そなたは知らぬのか？<line-break>空中都市とは、ラドラスそのもの…。<line-break>竜王をも倒せる、空の魔道要塞よ。<line-break>かつて、魔道王国が滅ぼされしとき、<line-break>魔道王国の人々は、空中都市が<line-break>他者の手に落ちることを恐れた。<end>"
english = "Heh... You do not know? The Floating City is Ladras itself: a sorcerous fortress in the sky, powerful enough to defeat even the Dragon King. When the Magic Kingdom fell long ago, its people feared that the Floating City would fall into the hands of others.<end>"

["1330056"]
japanese = "そこで、そなたの祖先、地のズゥは<line-break>魔法で王国の地を砂漠に変え、<line-break>そこに空中都市を沈めたのじゃ。<end>"
english = "And so your ancestor, Zuu of Earth, used magic to turn the kingdom's lands into a desert and sank the Floating City beneath the sands.<end>"

["1330057"]
japanese = "その伝説は知ってる。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ボクたち地水風火の<line-break>４人の巫女の子孫がそろったとき…<line-break>ラドラスの魔道技術、<line-break>…つまり、空中都市が<line-break>復活するんだよね。<end>"
english = "I know that legend. When all four descendants of the priestesses of earth, water, wind, and fire come together, Ladras's arcane technology―the Floating City―will be restored, right?<end>"

["1330058"]
japanese = "…シャリのねらいはわからない。<line-break>けれど、奴に空中都市は渡せない。<line-break>あそこには、ボクの仲間がいるもの。<end>"
english = "I don't know what Shalli is after. But we can't let him have the Floating City. My friends are in there.<end>"

["1330059"]
japanese = "エア、キミなら、水の巫女と火の巫女が<line-break>囚われている所が、わかるよね。<end>"
english = "Er, you know where the Priestess of Water and the Priestess of Fire are being held, don't you?<end>"

["1330060"]
japanese = "ラドラスの、制御の間じゃ。<line-break>しかし、それを知ってどうする？<end>"
english = "In Ladras's control chamber. But what will you do with that knowledge?<end>"

["1330061"]
japanese = "あの、いつもは動かない<line-break>柱の向こうか……。じゃあ、<line-break>エア、ボクたちをそこへ飛ばせる？<end>"
english = "Behind that pillar that never moves... Then, Er, can you take us there?<end>"

["1330062"]
japanese = "わらわなら可能じゃ。<line-break>しかし、それを聞いてどうする？<end>"
english = "I can. But why do you ask?<end>"

["1330063"]
japanese = "決まってるでしょ。<line-break>助けに行く。<line-break>そして、今のラドラスを守る。<end>"
english = "Isn't it obvious? We're going to rescue them―and protect Ladras as it is now.<end>"

["1330064"]
japanese = "愚かな…。<line-break>そなたらは運命に抗えると思うのか？<end>"
english = "Fools... Do you believe you can defy fate?<end>"

["1330065"]
japanese = "なんで、まだ見たこともない未来を<line-break>運命だってあきらめちゃうの？<line-break>\u3000<line-break>どうして、自分の意志と希望で<line-break>前に進むことを愚かだって言うの？<line-break>ねえ、エア！<end>"
english = "Why resign yourself to a future you haven't even seen and call it fate? Why call it foolish to move forward, driven by your own will and hope? Er!<end>"

["1330066"]
japanese = "わらわは天地千年を見通す…。<line-break>すべては運命じゃ。<end>"
english = "My sight spans a thousand years of heaven and earth... All is fate.<end>"

["1330067"]
