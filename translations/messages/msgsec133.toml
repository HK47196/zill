["1330246"]
japanese = "待ってるよ、<line-break><value:$28>。<end>"
english = "I'll be waiting, <value:$28>.<end>"

["1330247"]
japanese = "さて、ぐずぐずしていられません。<line-break>今から、ネメアの精神世界に行きます。<line-break>\u3000<line-break>おそらく、破壊神に半ば乗っ取られた<line-break>ネメアと戦うことになるでしょう。<line-break>心してください。<end>"
english = "There is no time to waste. It is time to enter Nemea's mind. Nemea will most likely be half possessed by the God of Destruction and will have to be fought. Be prepared.<end>"

["1330248"]
japanese = "では、行きますよ。<end>"
english = "Then let us go.<end>"

["1330249"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ダレ…だ…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000ワレの…復活を…、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000邪魔する…モノは…。<end>"
english = "Who... is it... obstructing my resurrection...?<end>"

["1330250"]
japanese = "やはり、かなり不安定な状態ですね。<line-break>これならば、ネメア本来の力も<line-break>ウルグとしての力も出せないはずです。<line-break>勝てるはずです。<line-break>今ならまだ間に合います。<end>"
english = "As I suspected, his condition is highly unstable. He should be unable to wield either Nemea's own power or Ulugh's. We can defeat him. There is still time.<end>"

["1330251"]
japanese = "私がネメアの精神を守っておきます。<line-break>本気で戦って打ち負かしてください。<line-break>でないと、みんな死にますよ！<end>"
english = "I will protect Nemea's mind. Fight him with all your strength and defeat him. Otherwise, everyone will die!<end>"

["1330252"]
japanese = "\u3000\u3000\u3000\u3000\u3000シすべき…モノたち…か…。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000キエうせるが…いい…。<line-break>\u3000\u3000\u3000\u3000オロかなる存在に…、滅びを！<end>"
english = "So... you are the ones who must die... Begone... Doom upon you, foolish creatures!<end>"

["1330253"]
japanese = "\u3000\u3000\u3000いずれ…滅びの時は…訪れよう…。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000ワレが…、テを…下すまでも…なく。<line-break>\u3000\u3000\u3000\u3000だが…、ネガわくば…いつか…、<line-break>\u3000\u3000\u3000\u3000我がテにて…汝らに…、滅びヲ！<end>"
english = "One day... the hour of destruction will come... without my lifting a hand... And yet... I pray that someday... I may bring ruin upon you all by my own hand!<end>"

["1330254"]
japanese = "せっかく<value:$28>と僕で<line-break>闇の神器を集めたのに、<line-break>あんなことで死なれちゃ困るからね。<line-break>フフフ。さあ、<value:$28>。<line-break>残りの神器を僕にくれないかな。<line-break>\u3000<end>"
