ual>27強大すぎる力は世界にとって危険、<line-break>ゆえに排除すべきである…<line-break>確かに普通の者ならばそうでしょう<line-break>ですが竜王様、お考えください<line-break><value:$28>はその力に匹敵する<line-break>大きなソウルを持っているのです！<end><if><value:$01><equal>192小さき者よ、下がりなさい。<line-break>その必要はありません。<end><if><value:$01><equal>193そ、そんな…！<line-break><value:$28>さんが<line-break>世界を脅かす存在になる！？<line-break>私、そんなの認めません！<line-break><value:$28>さんは<line-break>そんなことする人じゃありません！<end><if><value:$01><equal>194竜王よ、血迷ったのか！<line-break>そんな理由で争うほうがどうかしてる！<end><if><value:$01><equal>191ちょっと待って！<line-break><value:$28>が<line-break>世界を滅ぼす存在になる！？<line-break>ありえないわ！<line-break><value:$28>は<line-break>そんな人じゃない！<end><if><value:$01><equal>190<value:$28>が<line-break>世界の均衡を壊す存在になる？<line-break>そんなバカなことがあるか！<line-break>俺を救った<value:$28>が<line-break>そんな人間であるわけがない！<end>闇を払拭した<value:$28>が<line-break>今度は世界の均衡を崩す存在になる<line-break>…竜王はそう言うの？<line-break>そんなことは絶対にないよ！<line-break>ぼくの知っている<value:$28>は<line-break>そんなに愚かな人間じゃない！<end>"
english = "<if><value:$01><equal>2Wait! Now you're saying <value:$28> will become a threat to the world? Don't be ridiculous. The <value:$28> I know would never do such a thing!<end><if><value:$01><equal>3Wait a moment. Are you saying <value:$28> will now become a threat to the world? Impossible! The <value:$28> I know is no such person!<end><if><value:$01><equal>4Wait. You think <value:$28> is going to destroy the world now? No way! The <value:$28> I know isn't that dangerous!<end><if><value:$01><equal>5Hold on! You think <value:$28> is going to destroy the world now? Don't be ridiculous! The <value:$28> I know would never do that!<end><if><value:$01><equal>6<value:$28> banished the darkness, and now the Dragon King thinks that same person will upset the Balance of the World? That's impossible. <value:$28> would never do such a thing!<end><if><value:$01><equal>7Wait! Now you're saying <value:$28> will destroy the world? Don't be ridiculous. I didn't fight beside someone who would even contemplate such a thing!<end><if><value:$01><equal>8<value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? That cannot be. The <value:$28> I know would never do such a thing.<end><if><value:$01><equal>9So now you think <value:$28> might destroy the world? Aren't you blaming the wrong person? The <value:$28> I know would never do anything so outrageous.<end><if><value:$01><equal>11<value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? That cannot be. <value:$28> saved me and would never do such a thing!<end><if><value:$01><equal>12<value:$28> banished the darkness, and now the Dragon King thinks that same person will upset the Balance of the World? No chance. The <value:$28> I know isn't that stupid.<end><if><value:$01><equal>13<value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? Impossible. The <value:$28> I know is no such fool.<end><if><value:$01><equal>10Hold on! You think my sister's going to destroy the world now? Don't be ridiculous! My sister would never do that!<end><if><value:$01><equal>14Wait a moment! Are you saying <value:$28> will now destroy the world? Impossible! I'm not fool enough to travel beside someone capable of such a thing!<end><if><value:$01><equal>15Wait! Now you're saying <value:$28> will destroy the world? Don't be ridiculous! The <value:$28> I know would never do that!<end><if><value:$01><equal>16<value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? Impossible. I entrusted everything to someone far wiser than that!<end><if><value:$01><equal>17Now just wait one moment! Are you suggesting that <value:$28> will destroy the world? Don't be absurd! The <value:$28> I know is not such an imbecile!<end><if><value:$01><equal>19Wait! You're saying <value:$28> is going to destroy the world now? The <value:$28> Lulluantha knows would never, ever do that!<end><if><value:$01><equal>20<value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? Absurd. The <value:$28> I know is no such fool.<end><if><value:$01><equal>21Does the balance of power matter so much to you, Dragon King? <value:$28> saved the world from disaster! And now you would kill the world's savior merely for becoming too powerful, lest that power become the next threat?<end><if><value:$01><equal>26Those who imperiled the world are dead, and none remain who can rival <value:$28>. So you fear that power may upset the balance and bring calamity upon the world? Just what I would expect from a dragon worshipper.<end><if><value:$01><equal>24Now that the High Priest is dead, you deem <value:$28> too powerful and dangerous to be left alive... So that is the Dragon King's judgment. Regrettably, I cannot comply, Lady Noel Silva.<end><if><value:$01><equal>25Once the threat to the world is gone, no longer needed―is that it? Or rather, too powerful, and therefore dangerous? I can't accept that!<end><if><value:$01><equal>23The Dragon King considers it insolent for humans to wield power―even while exploiting that power whenever the world is threatened. That strikes me as rather self-serving.<end><if><value:$01><equal>27Power of such magnitude poses a danger to the world and must therefore be eliminated... That might be true of an ordinary person. But consider this, Dragon King: <value:$28> possesses a Soul every bit as great as that power!<end><if><value:$01><equal>192Stand back, little one. There is no need.<end><if><value:$01><equal>193N-no...! <value:$28> will become a threat to the world? I refuse to accept that! <value:$28> would never do such a thing!<end><if><value:$01><equal>194Dragon King, have you lost your senses? Fighting for a reason like that is what's insane!<end><if><value:$01><equal>191Wait! <value:$28> will become a threat capable of destroying the world? Impossible! <value:$28> isn't like that!<end><if><value:$01><equal>190<value:$28> will upset the Balance of the World? What nonsense! The <value:$28> who saved me could never be that kind of person!<end><value:$28> banished the darkness, and now the Dragon King says that same person will upset the Balance of the World? Never! The <value:$28> I know isn't that foolish!<end>"

["1330601"]
japanese = "<value:$28>は今や<line-break>地上最強の存在となりつつある。<line-break> <line-break>もし、その<value:$28>が<line-break>心変わりをしたら<line-break>誰がとめられるというのだ？<end>"
english = "<value:$28> is now on the verge of becoming the most powerful being on earth. If <value:$28> should ever change course, who could possibly stand in the way?<end>"

["1330602"]
japanese = "そうなる前に排除せよとの<line-break>竜王様の賢明なるご判断だ。<line-break>\u3000<line-break>さぁ、ノエル、カフィン、レイヴン、<line-break>竜王様の加護を受けし者たちよ。<line-break>今こそ、その恩に報いるときだ。<end>"
english = "The Dragon King has wisely decreed that the threat be eliminated before that can happen. Come, Noel, Coffin, Raven―you who have received the Dragon King's blessing. The time has come to repay that grace.<end>"

["1330603"]
japanese = "…俺はノエルに従うと決めている。<line-break>ノエルの前に立つ敵は<line-break>排除する。…それだけだ。<end>"
english = "I have chosen to follow Noel. Anyone who stands against her will be eliminated. That is all.<end>"

["1330604"]
japanese = "こんなことになってしまって<line-break>残念だけど、<line-break>全力でいかせてもらうわ！<end>"
english = "I'm sorry it's come to this, but I won't hold back!<end>"

["1330605"]
japanese = "カフィンは下がってて。<end>"
english = "Coffin, stay back.<end>"

["1330606"]
japanese = "待って！<line-break>あたしもノエルの仲間よ！<line-break>一緒に戦うわ！<end>"
english = "Wait! I'm Noel's companion too! I'll fight beside her!<end>"

["1330607"]
japanese = "…レムオンさんは<line-break>あなたの娘、カミラの子…。<line-break>あなたのお孫さんなんでしょう？<line-break>…忍びないの、お願い。<line-break>これくらいのことなら、<line-break>竜王様も許してくださるわ。<end>"
english = "Lemghon is Camilla's son―your daughter's child. That makes him your grandson, doesn't it? I can't bear this. Please. Surely the Dragon King will forgive this much.<end>"

["1330608"]
japanese = "…ノエル。<end>"
english = "Noel...<end>"

["1330609"]
japanese = "俺の実の母の…母親…が…<line-break>カフィンだっただと…？<end>"
english = "Coffin... was my birth mother's mother?<end>"

["1330610"]
japanese = "ノエル…ありがとう。<line-break>でも、気遣いだけで十分。<line-break><line-break>ソウルイーターと戦ったあの時から、<line-break>あたしもあなたと運命を<line-break>ともにすることになったのだもの！<end>"
english = "Noel... thank you. But knowing you care is enough. Ever since we fought the Soul Eater, my fate has been bound to yours!<end>"

["1330611"]
japanese = "あえて祖母とは呼ばぬ。<end>"
english = "I will not call you Grandmother.<end>"

["1330612"]
japanese = "しかし、ひとりの人として、<line-break>同じダルケニスとして、<line-break><line-break>その堂々とした態度には、<line-break>こちらも全力をもって応えよう！<end>"
english = "But as one person to another, and as a fellow Darkenith, I will honor that proud resolve by giving you everything I have!<end>"

["1330613"]
japanese = "ふふ…ありがたいね。<line-break><line-break><line-break>ノエル！<end>"
english = "Heh... I'm grateful. Noel!<end>"

["1330614"]
japanese = "はい！<end>"
english = "Yes!<end>"

["1330615"]
japanese = "<value:$28>さん！<line-break>ノエルの最後の剣、<line-break>受けとめてください！<end>"
english = "<value:$28>! Take Noel's final strike!<end>"

["1330616"]
japanese = "うぅ…、やっぱり<line-break>つよい…。<end>"
english = "Ugh... You really are strong...<end>"

["1330617"]
japanese = "ノエル、わかっているだろうな。<line-break>お前に敗北は許されてはいない。<line-break>お前が退いたそのときは…。<end>"
english = "Noel, you understand, don't you? You are not permitted to lose. The moment you retreat...<end>"

["1330618"]
japanese = "やめて、ナーシェス。<line-break><value:$28>さんに<line-break>そのことは言わないで！<end>"
english = "Stop, Narscess! Don't tell <value:$28> about that!<end>"

["1330619"]
japanese = "フフ、よいではないか。<line-break><value:$28>にも<line-break>聞かせてやるとしよう。\u3000\u3000\u3000\u3000\u3000<line-break>そうすれば、人間の持つ<line-break>哀れみの感情とやらで、<line-break>竜王様に従う気になるかもしれん。<end>"
english = "Heh. Why not? Let <value:$28> hear it. Perhaps that vaunted human capacity for pity will inspire obedience to the Dragon King.<end>"

["1330620"]
japanese = "世界の均衡を崩すほどに<line-break>成長してしまった<line-break>自らの命を絶つ気にな。フフ…。<end>"
english = "It may even move you to take your own life―the life that has grown powerful enough to upset the Balance of the World. Heh...<end>"

["1330621"]
japanese = "<value:$28>、<line-break>お前を慕っていたノエルが<line-break>ここに来た理由がわかるか？<line-break>お前が死なない限り、<line-break>カフィンとレイヴンが死人に<line-break>戻ってしまうからだ！<end>"
english = "<value:$28>, do you know why Noel, who cared so deeply for you, came here? Because unless you die, Coffin and Raven will be dead once more!<end>"

["1330622"]
japanese = "カフィンも、レイヴンも、<line-break>一度死んでいる。竜王様のお力で<line-break>ソウルを体に留めているにすぎぬ。<line-break>竜王様のご意志に沿えないとき、<line-break>それがどうなるか…。<line-break>フフフ…。<end>"
english = "Coffin and Raven have both died once already. The Dragon King's power is all that binds their Souls to their bodies. And if they should defy the Dragon King's will... Heh heh heh...<end>"

["1330623"]
japanese = "さぁ、どうする？<line-break>お前が死ななければ、<line-break>このふたりは死ぬぞ！<end>"
english = "Well? What will you do? Unless you die, these two will!<end>"

["1330624"]
japanese = "ば、バカな！<line-break>貴様、正気か…！？\u3000\u3000<line-break>\u3000<line-break>私に刃向かうのは<line-break>竜王様に剣を向けるのと<line-break>同じことだぞ！<end>"
english = "I-impossible! Have you lost your mind...?! To defy me is no different from raising your sword against the Dragon King!<end>"

["1330625"]
japanese = "…あんたの言いぐさは<line-break>聞くに耐えないんでな。<line-break>\u3000<line-break>殺人機械だった俺を、<line-break>助け出してくれたことには感謝してる。<line-break>だが、ノエルを悲しませるのは許さん。<end>"
english = "I've heard enough of your vile talk. I'm grateful that you rescued me when I was nothing but a killing machine. But I will not allow you to make Noel suffer.<end>"

["1330626"]
japanese = "レイヴン！<end>"
english = "Raven!<end>"

["1330627"]
japanese = "ノエル…。<line-break>今の俺はお前の重荷にすぎない。<line-break>それは…俺には許されないことなのだ。<line-break>お前のそばにいるようになって、<line-break>俺は人間に戻ることができた。<line-break>感謝している。…さらばだ。<end>"
english = "Noel... As I am now, I am nothing but a burden to you. I cannot allow that. At your side, I became human again. Thank you... Farewell.<end>"

["1330628"]
japanese = "ノエル…。<line-break>あたしたち…もう…いくわ…<end>"
english = "Noel... It's time for us... to go...<end>"

["1330629"]
japanese = "カフィン！<end>"
english = "Coffin!<end>"

["1330630"]
japanese = "<if><value:$01><equal>2<value:$28>…。<end><if><value:$01><equal>3<value:$28>…。<end><if><value:$01><equal>4<value:$28>…。<end><if><value:$01><equal>5<value:$28>…。<end><if><value:$01><equal>6<value:$28>…。<end><if><value:$01><equal>7<value:$28>…。<end><if><value:$01><equal>8<value:$28>…。<end><if><value:$01><equal>9<value:$28>…。<end><if><value:$01><equal>12<value:$28>…。<end><if><value:$01><equal>11<value:$28>…。<end><if><value:$01><equal>13<value:$28>…。<end><if><value:$01><equal>10姉ちゃん…。<end><if><value:$01><equal>14<value:$28>…。<end><if><value:$01><equal>15<value:$28>…。<end><if><value:$01><equal>17<value:$28>…。<end><if><value:$01><equal>19<value:$28>…。<end><if><value:$01><equal>20<value:$28>…。<end><if><value:$01><equal>21<value:$28>…。<end><if><value:$01><equal>23<value:$28>…。<end><if><value:$01><equal>27<value:$28>…。<end><if><value:$01><equal>26<value:$28>…。<end><if><value:$01><equal>24<value:$28>様…。<end><if><value:$01><equal>25<value:$28>…。<end><if><value:$01><equal>192<value:$28>様…。<end><if><value:$01><equal>193<value:$28>さん…。<end><if><value:$01><equal>194<value:$28>…。<end><if><value:$01><equal>191<value:$28>…。<end><if><value:$01><equal>190<value:$28>…。<end><value:$28>…。<end>"
english = "<if><value:$01><equal>2<value:$28>...<end><if><value:$01><equal>3<value:$28>...<end><if><value:$01><equal>4<value:$28>...<end><if><value:$01><equal>5<value:$28>...<end><if><value:$01><equal>6<value:$28>...<end><if><value:$01><equal>7<value:$28>...<end><if><value:$01><equal>8<value:$28>...<end><if><value:$01><equal>9<value:$28>...<end><if><value:$01><equal>12<value:$28>...<end><if><value:$01><equal>11<value:$28>...<end><if><value:$01><equal>13<value:$28>...<end><if><value:$01><equal>10Sis...<end><if><value:$01><equal>14<value:$28>...<end><if><value:$01><equal>15<value:$28>...<end><if><value:$01><equal>17<value:$28>...<end><if><value:$01><equal>19<value:$28>...<end><if><value:$01><equal>20<value:$28>...<end><if><value:$01><equal>21<value:$28>...<end><if><value:$01><equal>23<value:$28>...<end><if><value:$01><equal>27<value:$28>...<end><if><value:$01><equal>26<value:$28>...<end><if><value:$01><equal>24<value:$28>...<end><if><value:$01><equal>25<value:$28>...<end><if><value:$01><equal>192<value:$28>...<end><if><value:$01><equal>193<value:$28>...<end><if><value:$01><equal>194<value:$28>...<end><if><value:$01><equal>191<value:$28>...<end><if><value:$01><equal>190<value:$28>...<end><value:$28>...<end>"

["1330631"]
japanese = "終わったな。<end>"
english = "It's over.<end>"

["1330632"]
japanese = "さあ、戻ろう。<line-break>戦いが終わっても、<line-break>やらねばならぬことは残っている。<end>"
english = "Come. Let us return. The battle may be over, but there is still work to be done.<end>"

["1330633"]
japanese = "とりあえず、闇の侵攻は、<line-break>くい止められましたね。<line-break>よくやってくれました。<line-break>でも、これであなたの旅が、<line-break>終わったわけではありません。<end>"
english = "For now, the advance of darkness has been halted. You have done well. But your journey is not over yet.<end>"

["1330634"]
japanese = "ふふふ。これからあなたは、<line-break>どんな道を進むのでしょうね？<line-break>楽しみです。<end>"
english = "Heh heh. I wonder what path you will follow from here. I look forward to finding out.<end>"

["1330635"]
japanese = "では、戻りましょうか。<line-break>無事な姿をみんなに見せないと。<line-break>さあ、行きましょう。<end>"
english = "Shall we head back, then? Everyone will want to see that you're safe. Come, let's go.<end>"

["1330636"]
japanese = "\u3000\u3000\u3000\u3000\u3000神聖暦<value:$24>年<value:$25>月\u3000\u3000\u3000\u3000<line-break>後に多くの吟遊詩人に歌われるこの騒乱の後<line-break>\u3000\u3000ディンガル帝国とロストール王国は\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000和平条約を締結した。\u3000\u3000\u3000\u3000\u3000<end>"
english = "In Year <value:$24>, Month <value:$25> of the Sacred Era, after this upheaval―later celebrated in the songs of many bards―the Dyneskal Empire and the Kingdom of Rostorl concluded a peace treaty.<end>"

["1330637"]
japanese = "わしか…？<line-break>わしはイオンズ。<line-break>ここの神官じゃ。<end>"
english = "Me? I'm Ions. I'm the priest here.<end>"

["1330638"]
japanese = "天空神の祝福が<line-break>汝にあらんことを…<end>"
english = "May the Sky God's blessing be upon you...<end>"

["1330639"]
japanese = "ま、こういうのが、ここで<line-break>一番似合わぬ神官が<line-break>わしじゃわな。ハハハ<end>"
english = "Well, I'm the priest here least suited to this sort of thing. Ha ha ha!<end>"

["1330640"]
japanese = "イオンズ様、大変でございます。<line-break>お力を！<end>"
english = "Lord Ions, there's an emergency. Please help!<end>"

["1330641"]
japanese = "ああ、またかいな。<line-break>今行く。<end>"
english = "Oh, not again. I'm coming.<end>"

["1330642"]
japanese = "それじゃぁな。<end>"
english = "Well, see you.<end>"

["1330643"]
japanese = "こう見えてな、<line-break>わしは若いころ、傭兵だったんじゃ。<end>"
english = "I may not look it, but I was a mercenary in my younger days.<end>"

["1330644"]
japanese = "荒くれの無頼でな。<line-break>ずいぶん、ひどいこともしとった。<line-break>自分の腕以外は、何も信じとらなんだ。<line-break>流れ流れて、<line-break>この街の傭兵をやっとった時に、<line-break>アンギルダンというオヤジに会うてな。<end>"
english = "A lawless brute, at that. I did some terrible things. Trusted nothing but my own skill. I drifted from place to place until I came here and took work as a mercenary. That was when I met an old fellow named Angeerdan.<end>"

["1330645"]
japanese = "なにか、すごい台詞を聞かされてな。<line-break>瞬間、今までのつまらん人生すべてが<line-break>はがれ落ちる気がして、神官になった。<end>"
english = "He said something profound to me. In that instant, I felt my whole worthless life falling away, and I became a priest.<end>"

["1330646"]
japanese = "どんなすごいことを言われたか、<line-break>もう覚えとらんのだがな。<end>"
english = "Mind you, I can't remember what those profound words were anymore.<end>"

["1330647"]
japanese = "ま、そんなことはどうでもええ。<line-break>わしは、こうしてここにおる。<line-break>それで十分なのじゃ。<end>"
english = "Well, never mind all that. Here I am, and that is enough.<end>"

["1330648"]
japanese = "神官と傭兵だらけ…<line-break>いやはや、殺風景な町じゃ。<end>"
english = "Nothing but priests and mercenaries... Good grief, what a dreary town.<end>"

["1330649"]
japanese = "若いころ、傭兵としてここに来たとき<line-break>こんな所に攻めてくる国があるか、<line-break>無駄なことじゃい、と思うたがな。<line-break>実際、攻め入ろうとする国は存在する。<line-break>その理由もわかっとる。いやはや、<line-break>つまらん力は持つもんではないのう。<end>"
english = "When I first came here as a young mercenary, I wondered what country would ever attack a place like this. It all seemed rather pointless. Yet there are countries that truly would invade, and I know why. Good grief. Some powers are more trouble than they are worth.<end>"

["1330650"]
japanese = "わしは、若いころは無頼の傭兵でな。<line-break>無論、神官の勉強なんぞは<line-break>これっぽちもしとらんかった。<end>"
english = "I was a lawless mercenary in my youth. Naturally, I hadn't studied for the priesthood at all.<end>"

["1330651"]
japanese = "じゃから、オッサンになってから、<line-break>死に物狂いに勉強してな。<line-break>それこそ、人の３倍は努力した。<line-break>努力は報われ、ま、わしも、<line-break>並以上の神官になれたわけじゃ。<line-break>なんでも、努力はするもんじゃな。<end>"
english = "So when I was already middle-aged, I studied as if my life depended on it. I put in three times the effort of anyone else. That hard work paid off, and I became a better-than-average priest. Whatever you do, it's worth making the effort.<end>"

["1330652"]
japanese = "最近はいにしえの怪物たちの目覚めが<line-break>多うてな。あちこちから呼び出される。<line-break>封士イオンズ様も仕事が多いわ。<end>"
english = "Ancient monsters have been awakening with troubling frequency of late, so I am summoned here, there and everywhere. Lord Ions the Sealer is a busy man.<end>"

["1330653"]
japanese = "商売繁盛で結構なことじゃが、<line-break>気に入らんな。<line-break>封じればすむことではないのに…<line-break>もっと気に入らんのは<line-break>怪物どもを目覚めさせ、その敵意を<line-break>煽っとる奴がいるということじゃ。<end>"
english = "Business may be booming, but I do not like it. Sealing them away solves nothing... Worse still, someone is awakening these monsters and stoking their hostility.<end>"

["1330654"]
japanese = "奴らがそのようなことをするたび、<line-break>わしの夢…怪物どもとの共存という夢は<line-break>千年単位で遠ざかりよるからな。<line-break>対峙した怪物どもの暗くすさんだ<line-break>心をのぞくだに、痛うて痛うて、<line-break>わしまで泣きたくなってきよる。<end>"
english = "Every time they do this, my dream of coexisting with the monsters slips millennia farther out of reach. Just glimpsing the dark, ravaged hearts of the monsters I confront hurts so much, it makes me want to weep.<end>"

["1330655"]
japanese = "ちょっと法力に優れとるゆえに、<line-break>人はわしを封士様と呼んでくれよる。<end>"
english = "Because I happen to possess a little more divine power than most, people are kind enough to call me Lord Sealer.<end>"

["1330656"]
japanese = "封士とは、元を正せば、<line-break>世界の凶つ物を封印して回った<line-break>施文院の祖レオニックのあだ名よ。<line-break>封士レオニックは、<line-break>非常に強力な究極の神聖魔法を<line-break>遺跡に封じたという伝説を残しとってな<end>"
english = "The title “Sealer” was originally a sobriquet given to Leonick, founder of the Inscription Order, who traveled the world sealing away its baleful beings. Legend holds that Leonick the Sealer confined an immensely powerful form of ultimate sacred magic within some ruins.<end>"

["1330657"]
japanese = "わしも傭兵時代に探したもんじゃが…<line-break>まさか、そのレオニックと同じ<line-break>あだ名をもらうことになるとはのう。<end>"
english = "I searched for it myself in my mercenary days... Never imagined I would one day bear the same sobriquet as Leonick.<end>"

["1330658"]
japanese = "まあ、もう少しゆっくりさせてくれ。<line-break>しばらくしたら、神殿に戻って、<line-break>神官様らしく行儀よう座っとるでな。<end>"
english = "Well, let me rest a little longer. After a while, I'll go back to the temple and sit there all prim and proper, like a priest should.<end>"

["1330659"]
japanese = "ああ、こいつか。こいつはな…。<end>"
english = "Ah, this one. Well...<end>"

["1330660"]
japanese = "ギー、オレ、イズキヤル。<line-break>イオンズノ、トモ。<end>"
english = "Ghee. I'm Izkiyal. Ions's friend.<end>"

["1330661"]
japanese = "そして、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>わしの生涯最大の強敵だった。<line-break>\u3000<line-break>なりは小さくしとるが、<line-break>こいつはティラの娘と呼ばれる<line-break>いにしえの闇の聖母の怪物だ。<end>"
english = "And the greatest foe I ever faced. Small as Izkiyal looks now, this is an ancient Dark Mother monster known as the Daughter of Tira.<end>"

["1330662"]
japanese = "こいつが復活したとき\u3000\u3000\u3000\u3000\u3000\u3000<line-break>わしがこいつと戦い、<line-break>かろうじて勝った。<line-break>わしはこいつに<line-break>とどめを刺そうとして、考えた。<line-break>怪物は悪なのか？\u3000とな。<end>"
english = "When Izkiyal came back to life, we fought, and I barely won. As I was about to deliver the final blow, a thought came to me: Is a monster evil?<end>"

["1330663"]
japanese = "わしはすぐに否と思うた。\u3000\u3000\u3000\u3000<line-break>人間に悪人も善人もないように、<line-break>怪物だから悪ということはない。<line-break>ならばどうする？<line-break>このまま生かしておけば、こいつは<line-break>傷が癒えた日に里を襲うだろう。<end>"
english = "I knew at once the answer was no. Just as humans cannot simply be divided into good and evil, being a monster does not make one evil. But then what? If I let Izkiyal live, the village would be attacked as soon as those wounds healed.<end>"

["1330664"]
japanese = "その前に\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>こいつの牙と爪を見た者が<line-break>こいつに戦いを挑むかもしれぬ。<line-break>争えば憎しみだけが残り、<line-break>封じれば恨みだけが先送りされる。<end>"
english = "Even before that, someone who saw those fangs and claws might challenge Izkiyal to a fight. Fighting leaves only hatred, while sealing a creature away merely postpones resentment.<end>"

["1330665"]
japanese = "殺せば、生まれたことの悲しみと<line-break>虚無だけが勝利する。<line-break>わしは答えが出せなんだ。<line-break>じゃから、わしは、<line-break>話しおうてみることにした。<end>"
english = "If I killed Izkiyal, only the sorrow of having been born and the Void would triumph. I could find no answer. So I decided to try talking things through.<end>"

["1330666"]
japanese = "傷ついたこいつが眠る洞窟へ何度も\u3000\u3000<line-break>足を運んだ。こいつは怒りと悲しみに<line-break>むしばまれておった。<line-break>こいつの人生は、追われ、傷つけられ、<line-break>封じられ、恨み、殺し、破壊することの<line-break>繰り返しじゃった。<end>"
english = "Again and again, I went to the cave where the wounded Izkiyal slept. Anger and sorrow were eating away at that creature. Izkiyal's life had been an endless cycle of being hunted, wounded, and sealed away―of hatred, killing, and destruction.<end>"

["1330667"]
japanese = "わしは小さくなる魔法を教えた。\u3000\u3000\u3000<line-break>せめて、姿が人の恐怖を誘わなければ、<line-break>この悪い輪から逃れられると思ってな。<line-break>最後には、こいつは<line-break>わしの申し出を受け入れてくれよった。<end>"
english = "I taught Izkiyal a spell for becoming small. I thought that if that form no longer inspired fear in people, there might at least be a way out of that vicious cycle. In the end, Izkiyal accepted my offer.<end>"

["1330668"]
japanese = "ソノマエニ、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ダイブヤリアッタガ、ナ。<end>"
english = "We fought plenty before that, though.<end>"

["1330669"]
japanese = "こいつは今、自分の意志で\u3000\u3000\u3000\u3000<line-break>こうして小さくなっておる。<line-break>\u3000\u3000<line-break>じゃが、その気になればいつでも、<line-break>もとの姿になって、<line-break>この町ぐらい、軽く焼き尽くせる。<end>"
english = "Izkiyal now takes this small form by choice. But if so inclined, Izkiyal could return to the original form at any time and burn a town this size to ashes with ease.<end>"

["1330670"]
japanese = "ギー、ソントキャ、オマエガ、<line-break>オレヲ、タイジシテクレンダロ？<end>"
english = "Ghee. If that happens, you'll kill me, won't you?<end>"

