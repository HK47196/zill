["1330687"]
japanese = "このことを利用して<line-break>ひどい悪事を行ったリルビーが、<line-break>昔、いたんだって。<line-break>人間たちは激怒して、リルビーを<line-break>皆殺しにしようとしたんだ。<line-break>ちょうどダルケニスにしたみたいにね。<end>"
english = "They say that long ago, a Lilubee took advantage of that resemblance to commit terrible crimes. The humans were furious and tried to exterminate every Lilubee―just as they did to the Darkenith.<end>"

["1330688"]
japanese = "これを回避するために、リルビーは、<line-break>今後、ニ度とこんなことを<line-break>起こさないことを誓い、<line-break>人間の子供と区別するために、<line-break>すべてのリルビーにつけぼくろを<line-break>埋め込むことで人間と和解したんだ。<end>"
english = "To avert that, the Lilubees swore nothing like it would ever happen again. They made peace with the humans by agreeing to have a false mole implanted in every Lilubee, so we could be told apart from human children.<end>"

["1330689"]
japanese = "…これ、結構、痛いんだよ。<line-break>\u3000<line-break>\u3000<line-break>でも、ぼくが痛がることを知りながら<line-break>これを埋め込まなくっちゃいけなかった<line-break>父さんと母さんの心の方が、<end>"
english = "This actually hurts quite a bit. But my father and mother knew it would hurt me, and they still had to implant it. The pain they felt must have been...<end>"

["1330690"]
japanese = "…たぶん、何千倍も、何万倍も<line-break>痛んだだろうなって、<line-break>ぼく、思うよ。<line-break>リルビーの変わった風習だって、<line-break>今となっちゃ、笑う人間もいるけれど、<line-break>これは、人間優位の社会の風習なんだ。<end>"
english = "...I think it must have hurt them thousands, even tens of thousands, of times more. Some humans laugh at it now as a strange Lilubee custom, but it's a custom born of a society where humans come first.<end>"

["1330691"]
japanese = "旅好きなせいもあるけど、<line-break>ぼくは子供を持ちたくない。<line-break>種族平等を唱えてたネメアも死んだし。<end>"
