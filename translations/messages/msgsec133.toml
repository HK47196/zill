["1330245"]
japanese = "あはは、おもしろいね。<line-break>さすがに賢者様はよく考えてるや。<line-break>ま、今回は一本とられたってとこかな。<line-break>でもね、これが切り札じゃないんだよ。<line-break>フフフ、ここから戻れたら、<line-break>エンシャントにおいでよ。<end>"
