["1330242"]
japanese = "とっさの思いつきだったんですけど、<line-break>ネメアはできのいい子でしてね。<line-break>無言で理解してくれましたよ。<line-break>ウルグの復活は、失敗ですね。<end>"
english = "It was only a spur-of-the-moment idea, but Nemea is a clever boy. He understood without a word. Ulugh's resurrection has failed.<end>"

["1330243"]
