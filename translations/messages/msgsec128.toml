japanese = "<select><value:$33>（未：AGETEA_09 旅立ち）<end>（未：AGETEA_09 旅立ち後）<end>（未：AGETEA_09 ネメア即位）<end>（未：AGETEA_09 ロセン王国陥落）<end>（未：AGETEA_09 アンギルダンの山越え）<end>（未：AGETEA_09 リベルダム陥落）<end>（未：AGETEA_09 カルラ進軍）<end>（未：AGETEA_09 ネメア死亡）<end>"
