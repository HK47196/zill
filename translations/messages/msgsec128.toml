["1280010"]
japanese = "<select><value:$33>ディンガル建国の英雄って言われてた<line-break>アンギルダンが、今じゃお尋ね者になってね。<line-break>時々うちの酒場で飲んでるよ。<line-break>もっとも密告する気にはならないよ。<line-break>たとえ罪人でもうちのお客さんだからね。<end>ディンガル建国の英雄って言われてた<line-break>アンギルダンが、今じゃお尋ね者になってね。<line-break>時々うちの酒場で飲んでるよ。<line-break>もっとも密告する気にはならないよ。<line-break>たとえ罪人でもうちのお客さんだからね。<end>勇者ネメアが皇帝になったおかげで<line-break>アンギルダンも将軍に返り咲けてよかったよ。<line-break>あんたもアンギルダンを目指してがんばりな。<end>アンティノはロティの親友だといわれてるが<line-break>本当のところ、仲がいいと思っているのは<line-break>ロティの方だけって話だぜ。<end>最近、アンティノの家に怪しい人物が<line-break>出入りしているらしいぞ。<line-break>あの男、何をたくらんでいるのやら…。<end>（未：AGETEA_03 リベルダム陥落）<end>（未：AGETEA_03 カルラ進軍）<end>（未：AGETEA_03 ネメア死亡）<end>"
english = "<select><value:$33>Angeerdan, once a hero of Dingal's founding, is now wanted. He drinks here, but I won't inform. Criminal or not, he's my customer.<end>Angeerdan, once a hero of Dingal's founding, is now wanted. He drinks here, but I won't inform. Criminal or not, he's my customer.<end>I'm glad Hero Nemea restored Angeerdan as general. Work hard, and perhaps you'll be like him someday.<end>Antino is called Lottie's closest friend, but apparently only Lottie sees it that way.<end>A suspicious man has been visiting Antino's house lately. What is he plotting...?<end>(Incomplete: AGETEA_03 Fall of Liberdam)<end>(Incomplete: AGETEA_03 Karula's Advance)<end>(Incomplete: AGETEA_03 Nemea's Death)<end>"

["1280011"]
japanese = "<select><value:$33>この国はおかしいんだ。<line-break>早めにロセンを出たほうがいいよ。<line-break>旅人はすぐにスパイ扱いされるからね。<end>この国はおかしいんだ。<line-break>早めにロセンを出たほうがいいよ。<line-break>旅人はすぐにスパイ扱いされるからね。<end>この国はおかしいんだ。<line-break>早めにロセンを出たほうがいいよ。<line-break>旅人はすぐにスパイ扱いされるからね。<end>この国を救ってくれたカルラ将軍は、<line-break>リベルダムのような闘技場を建設して、<line-break>大会を開くみたいだな。<end>将軍に任命される前のカルラ様は、<line-break>諜報部に所属していて、鎖国時代の<line-break>ロセンに忍び込むこともあったんだと。<line-break>その時に、ペウダにさらわれた娘たちを<line-break>救ったこともあるらしいね。<end>闘技場が完成して大会が開かれるように<line-break>なったな。これで、ロセンが大陸一の都と<line-break>呼ばれる日も近いね。<end>ここだけの話だが、カルラ将軍がいよいよ<line-break>動くぜ。だが、今のロストールじゃどうしようも<line-break>ないだろうな。兵力差がありすぎるぜ。<end>ネメア様が死んだなんて話は信じられないが、<line-break>俺のつかんだ情報だと、行方不明になったのは<line-break>事実らしい。理由はわからないがな。<end>"
english = "<select><value:$33>Something is wrong here. Leave Rocen quickly; travelers are soon branded spies.<end>Something is wrong here. Leave Rocen quickly; travelers are soon branded spies.<end>Something is wrong here. Leave Rocen quickly; travelers are soon branded spies.<end>General Karula, our savior, plans to build a Liberdam-style arena and hold a tournament.<end>Before becoming general, Karula worked in intelligence and infiltrated closed Rocen. She once rescued girls abducted by Peuda.<end>The arena is finished and holds tournaments. Rocen may soon be the continent's greatest city.<end>Keep quiet: Karula is moving at last. Rostorl can't stop her with such inferior forces.<end>I can't believe Lord Nemea is dead, but my sources say he's missing. I don't know why.<end>"

["1280012"]
japanese = "<select><value:$33>ここは神聖王国アルレシア最後の都市だよ。<line-break>強力な魔法文明で栄えたものの、時の流れと<line-break>ともに衰退して今じゃこのざまだ。<line-break>どんなに隆盛を誇ったとしても<line-break>いつかは必ず衰えるといういましめだね。<end>ここは神聖王国アルレシア最後の都市だよ。<line-break>強力な魔法文明で栄えたものの、時の流れと<line-break>ともに衰退して今じゃこのざまだ。<line-break>どんなに隆盛を誇ったとしても<line-break>いつかは必ず衰えるといういましめだね。<end>ディンガルの新皇帝ネメアは世界征服を<line-break>たくらんでいるようだね。<line-break>世界を救った男が、今度は世界を狙う…。<line-break>これも時代がさせるのかな。<end>ディンガルやロストールでは傭兵を<line-break>募集しているみたいだぞ。<line-break>いよいよ戦争が近いってことだな。<end>風の巫女エアは知っているかい？<line-break>彼女の他に火、水、土の巫女がいるらしいぜ。<line-break>４人とも魔道王国最後の巫女の子孫らしいな。<line-break>４人の巫女がそろうと空中都市が復活する<line-break>なんて伝説もあるらしい。<line-break>どうだい、興味深い話だろ？<end>行方不明になっているリベルダムの武器商人<line-break>アンティノは、戦闘用モンスターの研究を<line-break>していたらしいな。<line-break>それでな、奴が研究していた最新作も<line-break>行方不明だっていうから物騒だよな。<line-break>あんた、見つけたら倒してくれよ。<end>最近ネメアの話題がないと思ったら、<line-break>あの男、親衛隊を連れて宝探しをしている<line-break>らしいな。今度はゼグナ鉱山に行くらしいぜ。<end>ネメアが死んだのは事実みたいだぜ。<line-break>世界征服をたくらむような男だったが、<line-break>一度は世界を救ってくれたんだ。<line-break>やっぱり悲しいものだな。<line-break>ネメアと共に魔王と戦った仲間たちは、<line-break>どう思っているのかね。<end>"
english = "<select><value:$33>This last city of the Holy Kingdom of Alresia once thrived on mighty magic. Time ruined it: every prosperous realm must decline.<end>This last city of the Holy Kingdom of Alresia once thrived on mighty magic. Time ruined it: every prosperous realm must decline.<end>Nemea, Dingal's new emperor, seems bent on world conquest. The world's savior now claims it... Have the times changed him?<end>Dingal and Rostorl are both hiring mercenaries. War must be near.<end>Shrine maidens: Wind (Er), Fire, Water, Earth. All descend from the Magic Kingdom's last shrine maidens. Together they restore the Floating City.<end>Antino, Liberdam's missing arms dealer, bred monsters for battle. His latest creature vanished too. Kill it if you find it.<end>No wonder Nemea went quiet: he took the Imperial Guard treasure hunting and heads for Zegna Mine next.<end>Nemea truly is dead. He plotted conquest but once saved the world. How sad. What do his comrades against the Demon King think?<end>"

