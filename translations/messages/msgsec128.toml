["1280000"]
japanese = "いらっしゃい、何にしましょうか？<line-break>えっ！\u3000酒は飲めないのかい。<line-break>よし、それなら特別にお茶を用意しよう。<end>"
english = "Welcome. What can I get you? What, you can't drink alcohol? All right, then. I'll make you some tea specially.<end>"

["1280001"]
japanese = "よう、<value:$28>、景気はどうだい？<line-break>今日も、あんたのために用意した<line-break>スペシャルティーを飲んでいってくれよ。<end>"
english = "Hey, <value:$28>. How are things? Stay and have the special tea I made for you again today.<end>"

["1280002"]
japanese = "よう、天下の<value:$28>。<line-break>有名人になっても、見た目はかわらないねぇ。<line-break>今日も、スペシャルティーを用意しているぜ。<end>"
english = "Well, if it isn't the renowned <value:$28>. Fame hasn't changed the way you look. I've got your special tea ready again today.<end>"

["1280003"]
japanese = "おや、お金が足りないようだな。<line-break>いくら心の広い俺でも、タダでは<line-break>スペシャルティーを飲ませてやれないぜ。<end>"
english = "Oh, looks like you're short on money. Generous as I am, I can't give you the special tea for free.<end>"

["1280004"]
japanese = "どうだい、おいしかっただろう？<line-break>まだ時間があるなら、他のお茶も<line-break>飲んでいかないかい？<end>"
english = "Well? Delicious, wasn't it? If you've still got time, why not stay and try another tea?<end>"

["1280005"]
japanese = "それじゃ、また来てくれよな。<line-break>あんたのためにいつでもスペシャルティーを<line-break>用意して待っているからよ。<end>"
english = "Come back again, then. I'll always have your special tea ready and waiting.<end>"

["1280006"]
japanese = "熟成すればするほど、香りがよくなる<line-break>エイジアの葉、２０年もののお茶さ。<line-break>時代の香りがするぜ。そうそう時代っていえば…<end>"
english = "A twenty-year-old tea made from Agea leaves. The longer they age, the more fragrant they become. You can smell the years in it. Speaking of the times...<end>"

["1280007"]
japanese = "<select><value:$33>勇者ネメアがとうとう皇帝を見限った\u3000<line-break>みたいだね。<line-break>\u3000<line-break>誰もが予想していたことだけど、<line-break>こうして現実になると悲しいものだね。<end>勇者ネメアがとうとう皇帝を見限った\u3000<line-break>みたいだね。<line-break>\u3000<line-break>誰もが予想していたことだけど、<line-break>こうして現実になると悲しいものだね。<end>勇者ネメアが、我がディンガル帝国の<line-break>皇帝になる日がとうとう来たんだなあ。<line-break>待ち望んでいただけにうれしいよ。<end>ロセンが我がディンガル帝国によって<line-break>解放されたのは知ってるだろ？<line-break>これで、ロセンに入れるようになるぜ。<end>アンギルダン将軍が山越えでロストール軍を<line-break>破ったときは、勝ったと思ったんだがな。<line-break>名将といえども油断することはあるんだねぇ。<end>カルラの次の目標はロストールだね。<line-break>ロストール側はゼネテスが出てくるだろうが<line-break>兵力差がありすぎるね。<line-break>誰も思いつかないような秘策でもない限り、<line-break>ロストールに勝ち目はないだろうよ。<end>最近、姿をみせないネメア様だが、<line-break>何でも親衛隊を連れて宝探しを<line-break>しているそうだよ。<line-break>近々、ゼグナ鉱山に向かうって話もあるよ。<line-break>冒険ってのは、皇帝になってもやめられない<line-break>くらい魅力的なものなのかい？<end>ネメア様の死は、ゼネテスの流した<line-break>デマってのが真相らしいぜ。<line-break>まったく、汚い手を使いやがる！<end>"
english = "<select><value:$33>Hero Nemea has finally abandoned the emperor. We all expected it, but it's still sad.<end>Hero Nemea has finally abandoned the emperor. We all expected it, but it's still sad.<end>At last, Hero Nemea will become Dingal's emperor. I've waited so long. I'm delighted.<end>Dingal liberated Rocen, as you know. We can enter it now.<end>When Angeerdan crossed the mountains and beat Rostorl, I thought we'd won. Even great commanders drop their guard.<end>Karula will target Rostorl next. Xenetes may fight, but Rostorl can't overcome her army without an unimaginable secret plan.<end>Lord Nemea took the Imperial Guard treasure hunting and heads for Zegna Mine next. Even an emperor can't resist adventure!<end>Xenetes apparently started the rumor of Lord Nemea's death. What a filthy trick!<end>"

["1280008"]
japanese = "<select><value:$33><value:$28>くらいの歳なら、<line-break>そろそろ１人で生きていくころだな。<line-break>いつまでも人を頼っていてはダメだぞ。<end>西にある偽りの森の先にオズワルドって名の<line-break>小さな町があるんだ。<line-break>地図にものらない隠れた名所だよ。<line-break>その町には古い遺跡があるそうだ。<line-break>機会があれば行ってみるのもいいだろうな。<end>ディンガル軍がロセン攻略の準備を<line-break>しているようだよ。<line-break>あの辺りには近づかないほうがよいだろうな。<end>ロセンを滅ぼしたカルラは巨大なカマを、<line-break>愛用の武器として使うらしいよ。<line-break>そいつで何人の首が飛んだのかな。<end>ノヴィン総司令率いる我がロストール軍が、<line-break>アンギルダンにやられちまった時は<line-break>どうしようかと思ったぜ。<line-break>なんたってディンガル軍は、老人も女も子供も<line-break>皆殺しにするような軍隊だからな。<line-break>ゼネテス様のおかげで命拾いしたよ。<end>リベルダムが破壊されたから、<line-break>フゴーもロセンに引っ越したらしいぞ。<line-break>珍しい物を売りつけるときはロセンに行きな。<end>ロストール王国の一大事だっていうのに、<line-break>リューガ卿を中心とした有力貴族どもは<line-break>女王にたてついて兵をださないらしい。<line-break>いくらファーロス総司令が名将でも、<line-break>この戦力差じゃどうしようもないぜ。<line-break>俺たちは、どうすりゃいいのかな…。<end>ネメアは闇の神器とかいう破壊神を復活させる<line-break>アイテムを探していたということだ。<line-break>何に使うつもりだったのやら…。<end>"
english = "<select><value:$33>At your age, <value:$28>, you must make your own way. You can't rely on others forever.<end>West beyond the Forest of Deceit lies Oswald, a hidden town absent from maps, with ancient ruins too. Visit sometime.<end>The Dingal Army is preparing to take Rocen. Stay away from there.<end>Karula, Rocen's destroyer, favors a huge scythe. I wonder how many heads it has sent flying.<end>Angeerdan beat Rostorl under Commander Novin. Dingal slaughters old folk, women, and children; Lord Xenetes saved me.<end>Since Liberdam fell, Hugo has moved to Rocen. Take any rare goods you have to him there.<end>Rostorl is in grave danger: Lord Ryuga's nobles defy the queen and withhold troops. Even Pharos can't overcome those odds.<end>Nemea sought the Artifacts of Darkness, which can revive the God of Destruction. What did he intend?<end>"

