["1280017"]
japanese = "<select><value:$33>（未：AGETEA_10 旅立ち）<end>世間がどんなに大騒ぎをしようが、<line-break>我らドワーフは落ち着いたもんだよ。<line-break>やっぱり寿命が長いからかね。<end>ディンガル軍の青竜将軍が東方諸国を<line-break>攻略するために出兵したそうだよ。<line-break>少女将軍の力を見せてもらおうかな。<end>ディンガルの少女将軍の手並みは、<line-break>大したものだ。<line-break>次は名将アンギルダンの出番だよ。<end>ディンガルの敗残兵が何人か逃げてきたが、<line-break>それを狩ろうっていう不届き者がいてね。<line-break>そいつらもバカなことをしたもんだよ。<line-break>もちろん、そいつらは牢獄行きさ。<line-break>王国内でのもめ事は禁止されているからね。<line-break>我らは弱い者いじめが大嫌いだからな。<end>少女将軍が東の都リベルダムを破壊しちまった。<line-break>あの娘っこは、物を造ることの大変さが<line-break>わかっていない。嘆かわしいことだ。<end>この間、ネメアを見たぞ。<line-break>ダークエルフとドワーフとボルダンを<line-break>従えていたね。南へ向かったみたいだよ。<line-break>ロストールとの戦いに参加するつもり<line-break>なのかもしれないな。<end>ネメアが死んだという話は本当なのか？<line-break>あれほどの男が、そう簡単に死ぬとは<line-break>思えないな。何かの間違いだろう。<end>"
english = "<select><value:$33>(Incomplete: AGETEA_10 Departure)<end>However the world rages, we Dwarves remain calm. Perhaps it's our long lives.<end>Dingal's Azure Dragon General has marched on the Eastern Nations. Let's see what this girl general can do.<end>Dingal's girl general proved her skill. Next comes renowned Angeerdan's turn.<end>Scoundrels hunted defeated Dingal troops sheltering here. We jailed them: conflict is forbidden, and we despise preying on the weak.<end>That girl general destroyed eastern Liberdam. She knows nothing of the toil of building. Deplorable.<end>I saw Nemea with a Dark Elf, Dwarf, and Boldan, heading south. Perhaps he'll join the war against Rostorl.<end>Nemea, dead? A man like him doesn't die easily. There must be some mistake.<end>"

["1280018"]
japanese = "<select><value:$33>ガルドランとかいう冒険者が<line-break>うちの看板娘に手をだそうとしたんで<line-break>ぶん殴ってやったよ。<end>ヴァンの事件は不幸な話だったよ。<line-break>ガルドランのような冒険者ばかりじゃないと<line-break>思うが、冒険者って連中には失望したよ。<end>今一番の話題は、勇者ネメアの即位だろ。<line-break>ディンガル国民が待ちに待ってたことだからな。<end>ロセンと自由に行き来できるようになったな。<line-break>これで、ロセンからの巡礼客も増えるだろう。<end>エルズから来た巡礼客に聞いたんだが、<line-break>エルズの女王エアは、人の運命だろうが<line-break>捜し物だろうが、何でもわかるそうだよ。<end>ロセンの闘技場で大会が開かれるようになって<line-break>うれしいね。リベルダムよりは近いから、<line-break>気軽に出かけることができるからな。<end>カルラ将軍の副官アイリーンは、<line-break>元はロストール出身の冒険者だってな。<line-break>冒険者時代にはこの酒場にも来たことがあるぜ。<end>最近、巡礼客の数がめっきり増えてね。<line-break>やはり世界の行く末に不安を感じる人が<line-break>多いんだろうな。<end>"
english = "<select><value:$33>An adventurer called Girldlan tried to make a move on our serving girl, so I gave him a good pounding.<end>The Van incident was a tragedy. I don't believe every adventurer is like Girldlan, but I've lost faith in the lot of them.<end>Hero Nemea's accession is the talk of the day. The people of Dingal have been waiting a long time for it.<end>We can travel freely to and from Rocen now. That should bring more pilgrims here from Rocen.<end>A pilgrim from Elz told me that Queen Er knows anything you might ask, whether it's a person's fate or the whereabouts of something lost.<end>I'm glad they're holding tournaments in Rocen's arena now. It's closer than Liberdam, so I can go without making a great journey of it.<end>I hear General Karula's adjutant, Irene, was once an adventurer from Rostorl. She even came to this tavern back in her adventuring days.<end>The number of pilgrims has risen sharply of late. I suppose many people are anxious about the fate of the world.<end>"

["1280019"]
japanese = "<select><value:$33>（未：AGETEA_12 旅立ち）<end>この間の地震は竜王様が原因みたいだね。<line-break>エンシャントではノトゥーン神殿の<line-break>ステンドグラスが割れてしまったそうだよ。<end>ロストールでは女は騎士になれないんだよ。<line-break>ディンガルには女の将軍が２人もいるのにな。<line-break>貴族どもの頭の中は古すぎるんだよな。<end>ロセン行きの航路が復活して、<line-break>また、にぎやかになりそうだ。<line-break>船乗りも仕事が増えて大変だろうな。<end>アンギルダンが分断の山脈を越えて、<line-break>ロストールに迫ってきた時は、<line-break>どうしようかと思ったよ。<line-break>首都が占領されたら、<line-break>次はここだろうからね。<line-break>自警団じゃ軍隊は防げないよ。<end>リベルダムの港が壊れたもんで、<line-break>船乗りたちは大騒ぎさ。<line-break>ディンガル軍もひどいことをするよな。<end>カルラ率いる青竜軍が、<line-break>いよいよロストールへ攻め込むようだぜ。<line-break>これでロストールもおしまいかな。<end>邪竜の断層では、いにしえに封印された<line-break>凶暴なドラゴンが、復活の好機をうかがっている<line-break>そうだよ。恐ろしい話だよな。<end>"
english = "<select><value:$33>(Incomplete: AGETEA_12 Departure)<end>The Dragon King caused the recent quake. Even Notun Temple's stained glass shattered over in Ancient.<end>Rostorl bars women from knighthood, while Dingal has two female generals. Those nobles live in the past.<end>The sea route to Rocen has reopened. Things will liven up, and sailors will be busy.<end>When Angeerdan crossed the Dividing Mountains toward Rostorl, I feared the capital and then this place would fall. Our militia can't stop an army.<end>Liberdam's destroyed harbor has sailors in uproar. The Dingal Army did a terrible thing.<end>Karula's Azure Dragon Army is finally invading. This may be Rostorl's end.<end>A ferocious ancient dragon lies sealed in Evil Dragon Rift, awaiting revival. Terrifying.<end>"

["1280020"]
japanese = "<select><value:$33>あんたのような若者が未来を<line-break>切り開いていくんだ。<line-break>新しい時代に期待しているよ。<end>死竜の洞窟には、その名の通りドラゴンの<line-break>死体があるそうだよ。<line-break>\u3000<line-break>死んで何百年も経つのに滅びることなく<line-break>迷い込んだ生物の命を吸って復活の機会を<line-break>待っているというから恐ろしい話だよな。<end>ネメアは皇帝になる少し前に、<line-break>エルズのエアを訪ねたそうだよ。<line-break>何かの予言でも聞いたのかな？<end>処刑されたロセン王ペウダを裏から操って<line-break>いたのがエリスとリベルダムのロティだよ。<line-break>裏世界じゃけっこう有名な話なんだぜ。<end>アンギルダンを破ったゼネテスは、<line-break>元は冒険者をやってたんだ。<line-break>ここにもしょっちゅう酒を飲みに来てたよ。<line-break>貴族とは思えないくらい気さくな男でね、<line-break>この辺りじゃ知らぬ人間がいないくらいの<line-break>人気者だったよ。<end>ロセン解放軍を率いていたクリュセイスも、<line-break>リベルダムを裏切った武器商人アンティノも<line-break>行方不明らしいな。<end>救国の英雄ゼネテスが、再びロストール軍の<line-break>指揮をとるらしいぜ。だが、レムオンを中心と<line-break>した貴族連合が出兵を拒否しているらしい。<line-break>いくらゼネテスでもカルラの半分以下の<line-break>兵力じゃ勝てっこないだろ。<line-break>これで、ロストールもおしまいだな。<end>このタイミングでネメアが死ぬなんて、<line-break>竜王様のご加護に違いないな。もっとも、<line-break>カルラの脅威が消えたわけじゃないがな。<end>"
english = "<select><value:$33>You young people will forge the future. I have high hopes for the new age.<end>Dead Dragon Cave holds a centuries-dead, undecayed dragon. It drains intruders' lives as it awaits revival. Horrifying.<end>Nemea visited Er in Elz just before becoming emperor. Perhaps she gave him a prophecy.<end>Liberdam's Eris and Lottie controlled executed King Peuda from the shadows. The underworld knows it.<end>Xenetes, who beat Angeerdan, was an adventurer and drank here. Easygoing for a noble, he was known and loved by all.<end>Both Khryuseis, leader of Rocen's Liberation Army, and Antino, the arms dealer who betrayed Liberdam, have vanished.<end>Hero Xenetes again leads Rostorl, but Lemghon's nobles withhold troops. With under half Karula's forces, even he can't win. Rostorl is doomed.<end>Nemea's death now must be the Dragon King's blessing, though Karula still threatens us.<end>"

["1280021"]
japanese = "<select><value:$33>（未：AGETEA_14 旅立ち）<end>冒険者を狙うダークエルフとか、<line-break>街道を移動中に勝負を挑んでくるボルダンとか<line-break>最近は物騒なヤツらが多いな。<end>ロストールの大貴族レムオンの命を<line-break>狙っているヤツらがいる。レムオンが領地の<line-break>ノーブルへ向かう途中で襲う計画のようだが…。<line-break>いつ実行するつもりなのかはわからないが、<line-break>レムオンが暗殺されるとロストールは<line-break>間違いなく大騒ぎになるな。<end>そうそう、ロティの友人アンティノが、<line-break>暗殺用の毒薬を買ったって情報があるんだ。<line-break>ふふふふ…誰に使うつもりなのかな。<end>ロセンを電撃的に占領したカルラが、<line-break>リベルダムに攻めてくるぜ。<line-break><line-break>しかもあの女は負ける戦をしない。<line-break>アンティノの屋敷にカルラの密偵が<line-break>ひんぱんに訪れてるって話もあるんだ。<line-break>逃げるなら早めにな。<end>フゴーも闘技場もロセンに移ったぜ。<line-break>もう、自由都市リベルダムには何もないんだ。<line-break>それでも俺の居場所は、ここしかないんだな。<end>カルラはロストールとの戦で、ネメアと合流し、<line-break>その勢いで王都を攻め落とすつもりのようだ。<line-break>つまりネメアはロストール領のどこかにいるぞ。<end>エルファスって予言者は知っているか？<line-break>あいつの予言はハズレたことがない。<line-break>不気味な話だと思わないか？<end>"
english = "<select><value:$33>(Incomplete: AGETEA_14 Departure)<end>Dark Elves hunt adventurers and Boldans challenge travelers. Too many dangerous sorts roam these days.<end>Plotters plan to kill mighty Lord Lemghon en route to Noble in his domain. If they succeed, Rostorl will surely fall into turmoil.<end>Antino, Lottie's friend, bought poison for an assassination. Heh heh... Whom will he use it on?<end>Karula took Rocen in a lightning campaign and now targets Liberdam. She never fights unwinnable battles, and her spies visit Antino. Flee soon.<end>Hugo and the arena moved to Rocen. Nothing remains in Free City Liberdam, yet it's my only home.<end>Karula plans to join Nemea in the Rostorl war, then ride that momentum into the royal capital. So Nemea is in Rostorl.<end>Know the prophet Elfas? Every prophecy of his has come true. Doesn't that unsettle you?<end>"

["1280022"]
japanese = "レベリスの葉を使ったお茶さ。このお茶を<line-break>おいしくいれるには、少し技術が必要なんだよ。<line-break>そういえば…<end>"
english = "This tea is made from Levelis leaves. It takes a little skill to brew it properly. That reminds me...<end>"

["1280023"]
japanese = "<if><value:$2C><less-equal>%20魔法を使うには精霊力レベルが<line-break>重要なんだってな。<line-break>魔道アカデミーの学生が言っていたよ。<end><if><value:$2C><less-equal>%37宿しているソウルによってレベルが上がった時に<line-break>上がるフィジカルパラメータの変化が違うんだ。<line-break>むやみにレベルを上げても強くなれないよ。<end><if><value:$2C><less-equal>%49あんたくらいのレベルなら、<line-break>ドラゴンだって倒せるかもしれないな。<line-break>例えば死竜の洞窟に住むエルアザルとかな。<end><if><value:$2C><greater-equal>%50今のあんたなら、<line-break>竜王だって倒せるんじゃないか。<line-break>まったく、大した強さだよ。<end>"
english = "<if><value:$2C><less-equal>%20Spirit Power level matters when casting magic, a Magic Academy student told me.<end><if><value:$2C><less-equal>%37Your Soul determines which Physical Parameters rise with each level. Blindly leveling won't always make you stronger.<end><if><value:$2C><less-equal>%49At your level, you might beat a dragon, such as Elazar in Dead Dragon Cave.<end><if><value:$2C><greater-equal>%50At your strength, you might even beat the Dragon King. Truly formidable.<end>"

["1280024"]
japanese = "<if><value:$2C><less-equal>%9武器を選ぶときは攻撃力だけじゃなくて、<line-break>重さや、届く距離なんかも考えるんだよ。<end><if><value:$2C><less-equal>%29武器の属性は無属性にしておいた方がいいぞ。<line-break>魔法では無属性にできないからな。<end><if><value:$2C><less-equal>%49攻撃は最大の防御だ。<line-break>敵より１回でも多く攻撃できるように、<line-break>ＡＧＩが上がるようなソウルにするんだ。<end><if><value:$2C><greater-equal>%50あんたくらい強ければ、邪竜の断層や<line-break>未開の森にも行ったことがあるだろう。<line-break>まだなら、一度は行っておいた方がいいぞ。<end>"
english = "<if><value:$2C><less-equal>%9When choosing a weapon, don't consider Attack Power alone. Think about its weight and reach as well.<end><if><value:$2C><less-equal>%29It's best to leave your weapon non-elemental. Magic can't be made non-elemental, after all.<end><if><value:$2C><less-equal>%49The best defense is a good offense. Choose a Soul that raises ＡＧＩ so you can attack more often than the enemy.<end><if><value:$2C><greater-equal>%50At your strength, you've probably visited the Evil Dragon Rift and the Uncharted Forest already. If not, you should see each at least once.<end>"

["1280025"]
japanese = "<if><value:$2C><less-equal>%9（未：LEVELTEA_02 9以下）<end><if><value:$2C><less-equal>%29（未：LEVELTEA_02 29以下）<end><if><value:$2C><less-equal>%49（未：LEVELTEA_02 49以下）<end><if><value:$2C><greater-equal>%50（未：LEVELTEA_02 50以上）<end>"
english = "<if><value:$2C><less-equal>%9(Incomplete: LEVELTEA_02 9 or below)<end><if><value:$2C><less-equal>%29(Incomplete: LEVELTEA_02 29 or below)<end><if><value:$2C><less-equal>%49(Incomplete: LEVELTEA_02 49 or below)<end><if><value:$2C><greater-equal>%50(Incomplete: LEVELTEA_02 50 or above)<end>"

["1280026"]
japanese = "<if><value:$2C><less-equal>%9ガルドランはたいして強くないくせに、<line-break>必殺技だけは、たくさん持っているみたいだな。<line-break>卑怯な技ばかりだけどね。<end><if><value:$2C><less-equal>%29ボルダン族は強い者と戦うことに<line-break>喜びを感じるそうだよ。<line-break>レーグもそうなのかな。<end><if><value:$2C><less-equal>%49火、水、土、風の禁呪を習得するためには、<line-break>それぞれの属性を司る精霊神に会って、<line-break>封印をといてもらわないといけないんだ。<end><if><value:$2C><greater-equal>%50よく、がんばったな。<line-break>そこまで強ければ、もう言うことはない。<line-break>自由に世界中を冒険してくれ。<end>"
english = "<if><value:$2C><less-equal>%9Girldlan isn't particularly strong, but he seems to have plenty of special techniques. Cowardly ones, every last one.<end><if><value:$2C><less-equal>%29They say Boldans find joy in fighting strong opponents. I wonder if Reig feels the same.<end><if><value:$2C><less-equal>%49To learn the Forbidden Spells of fire, water, earth, and wind, you must meet the Spirit God governing each element and have the seals removed.<end><if><value:$2C><greater-equal>%50You've done well. At your strength, there's nothing more to say. Go and explore the world as you please.<end>"

["1280027"]
japanese = "<if><value:$2C><less-equal>%9あんたくらいのレベルでこの辺りを<line-break>うろつくのはやめたほうがいい。<line-break>若い命を散らすことになるぜ。<end><if><value:$2C><less-equal>%29宝箱を開けるのはディテクターのスキルを<line-break>持っている者の仕事だよ。<line-break>これがないと、開けられないからね。<end><if><value:$2C><less-equal>%49アンチハードルがあれば、罠の解除が少しだけ<line-break>簡単になる。だが、あまり頼りすぎると<line-break>ＭＰがなくなってしまうぞ。<end><if><value:$2C><greater-equal>%50罠の解除で重要なのは、<line-break>解除する者のＤＥＸと慣れだ。<line-break>アンチハードルは、おまけみたいなもんだ。<end>"
english = "<if><value:$2C><less-equal>%9You shouldn't wander around this area at your level. You'll only cut a young life short.<end><if><value:$2C><less-equal>%29Opening treasure chests is a job for someone with the Detector skill. Without it, they can't be opened.<end><if><value:$2C><less-equal>%49Anti-Hurdle makes trap disarming a little easier. Rely on it too much, though, and you'll run out of MP.<end><if><value:$2C><greater-equal>%50What matters in trap disarming is the disarmer's ＤＥＸ and experience. Anti-Hurdle is merely a little extra help.<end>"

["1280028"]
japanese = "<if><value:$2C><less-equal>%9アハブには悪霊やら死霊がうようよいるぜ。<line-break>もう少し強くなるまで近づかないことだ。<end><if><value:$2C><less-equal>%29敵から逃げてばかりだと、<line-break>精霊力レベルが上がらないぞ。<end><if><value:$2C><less-equal>%49火、水、土、風の禁呪を習得するためには、<line-break>それぞれの属性を司る精霊神に会って、<line-break>封印を解いてもらわないといけないんだぜ。<end><if><value:$2C><greater-equal>%50いやあ、あんたは強い！<line-break>もう何も教えることはないよ。<end>"
english = "<if><value:$2C><less-equal>%9Ahab is crawling with evil spirits and the undead. Stay away until you're stronger.<end><if><value:$2C><less-equal>%29If you keep running from enemies, your Spirit Power level won't rise.<end><if><value:$2C><less-equal>%49To learn the Forbidden Spells of fire, water, earth, and wind, you must meet the Spirit God governing each element and have the seals removed.<end><if><value:$2C><greater-equal>%50My, you are strong! There's nothing left for me to teach you.<end>"

