japanese = "<if><value:$2A><less-equal>%50盾を装備できるのは騎士として<line-break>認められた者だけなんだそうだよ。<end><if><value:$2A><less-equal>%100ドワーフ王国の王ジンガは、<line-break>若いころに闘士として、<line-break>闘技場で活躍していたそうだよ。<end><if><value:$2A><less-equal>%120フゴーに仕えているダイダロは、<line-break>闘技場で優勝したこともある、<line-break>なかなかの戦士らしいぜ。<end><if><value:$2A><greater-equal>%121フゴーとフゴー夫人の愛の物語を<line-break>最後まで聞いた人間は、恐怖のあまりに<line-break>狂ってしまうらしいぜ。恐い話だよな。<end>"
english = "<if><value:$2A><less-equal>%50Apparently, only those recognized as knights are permitted to equip shields.<end><if><value:$2A><less-equal>%100They say King Jinga of the Dwarf Kingdom made quite a name for himself as an arena fighter in his youth.<end><if><value:$2A><less-equal>%120Daedalo, who serves Hugo, is apparently quite a warrior. He's even won the arena tournament before.<end><if><value:$2A><greater-equal>%121They say anyone who hears the entire love story of Hugo and Mrs. Hugo goes mad with terror. Frightening, isn't it?<end>"
