["1280047"]
japanese = "<if><value:$2A><less-equal>%25（未：RUMORTEA_08 25以下）<end><if><value:$2A><less-equal>%50（未：RUMORTEA_08 50以下）<end><if><value:$2A><less-equal>%75（未：RUMORTEA_08 75以下）<end><if><value:$2A><greater-equal>%76（未：RUMORTEA_08 76以上）<end>"
