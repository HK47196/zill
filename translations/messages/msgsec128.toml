["1280033"]
japanese = "<if><value:$2C><less-equal>%9デルガドは鍛冶の腕だけでなく、<line-break>戦士としても一流なんだよ。<line-break>若いころは世界中を冒険していたみたいだしな。<end><if><value:$2C><less-equal>%29重い武具を扱うには<line-break>それなりの筋力が必要になってくる。<line-break>武具も人を選ぶってことさ。おぼえておけよ。<end><if><value:$2C><less-equal>%49ＳＴＲを鍛えれば、それだけ重い装備が<line-break>できるようになる。前衛で戦うのなら<line-break>しっかり鍛えとけよ。<end><if><value:$2C><greater-equal>%50あんたは強いな。<line-break>ほんとに、大したもんだよ。<line-break>ドワーフなら王になれたかもしれないな。<end>"
english = "<if><value:$2C><less-equal>%9Dergado isn't only a master smith. He's also a first-rate warrior. Apparently, he traveled the world as an adventurer in his youth.<end><if><value:$2C><less-equal>%29You need the muscle to handle heavy arms and armor. Equipment chooses its bearer, too. Remember that.<end><if><value:$2C><less-equal>%49The more you train your ＳＴＲ, the heavier the equipment you can use. If you fight on the front line, make sure you train it well.<end><if><value:$2C><greater-equal>%50You're strong. Truly impressive. Had you been a Dwarf, you might have become king.<end>"

["1280034"]
japanese = "<if><value:$2C><less-equal>%9魔法しか効かないモンスターもいる。<line-break>魔法が使えるメンバーが、パーティーに１人は<line-break>いたほうがいいだろうな。<end><if><value:$2C><less-equal>%29戦闘中の移動コマンドは重要だぞ。<line-break>武器が届かないときは前衛や飛び出し位置に<line-break>移動すればいいのさ。<end><if><value:$2C><less-equal>%49貴重なアイテムを無駄使いするなよ。<line-break>道具屋で売ってない物は貴重品だと思って、<line-break>大切に、ここぞって時に使うんだ。<end><if><value:$2C><greater-equal>%50恵みの陽光みたいなアイテムは、<line-break>本当に必要な時に使うんだぞ。<line-break>無駄遣いは許されないんだ。<end>"
english = "<if><value:$2C><less-equal>%9Some monsters can only be harmed by magic. You should have at least one party member who can cast spells.<end><if><value:$2C><less-equal>%29The Move command is important in battle. If your weapon can't reach, move to the front line or the forward position.<end><if><value:$2C><less-equal>%49Don't waste valuable items. Treat anything that isn't sold in item shops as a rarity, and save it for when you truly need it.<end><if><value:$2C><greater-equal>%50Items like Blessing Sunlight should only be used when you truly need them. Don't waste them.<end>"

["1280035"]
japanese = "<if><value:$2C><less-equal>%9弓を扱える仲間がいれば便利だろうな。<line-break>空の敵だろうが、後列に位置している敵だろうが<line-break>気にせず戦えるからな。<end><if><value:$2C><less-equal>%29リルビー族はマヒや毒の影響を受けないんだ。<line-break>パーティーに１人いれば、全員がマヒになって<line-break>全滅なんてことを回避できるぜ。<end><if><value:$2C><less-equal>%49未開の森の先には、選ばれた者の集う場所が<line-break>あるって話だ。あんたくらいの強さなら、<line-break>その場所へ行けるんじゃないのか。<end><if><value:$2C><greater-equal>%50西の海に闇の門の島があるそうだよ。<line-break>そこはすべての災いを生み出す恐ろしい島<line-break>だと聞いてるぜ。<end>"
english = "<if><value:$2C><less-equal>%9A companion who can use a bow would be useful. You could fight flying enemies and enemies in the rear rank without worrying about reach.<end><if><value:$2C><less-equal>%29Lilbie are unaffected by Paralysis and poison. Having one in the party can prevent everyone from being paralyzed and wiped out.<end><if><value:$2C><less-equal>%49They say a gathering place for the chosen lies beyond the Uncharted Forest. At your strength, perhaps you can reach it.<end><if><value:$2C><greater-equal>%50They say the Island of the Dark Gate lies in the western sea. I've heard it's a dreadful island where every calamity is born.<end>"

["1280036"]
japanese = "<if><value:$2C><less-equal>%9戦闘中のスピードは、敏捷さＡＧＩと\u3000\u3000\u3000<line-break>装備品の重さによって変化するんだ。<line-break>そいつを忘れると痛い目にあうぜ。<line-break>例え重装備でも、敵の集中攻撃をくらえば<line-break>大ダメージを受ける可能性があるだろ。<line-break>パーティー内での攻撃順位は確認しとけよ。<end><if><value:$2C><less-equal>%29仲間はたくさんできたか？<line-break>まだ、３人以上いないなら問題だぞ。<line-break>世界中の町を隅々まで歩いてみな。<line-break>必ず、運命が仲間を引き寄せてくれるから。<line-break>もちろん、困っているやつを見捨ててたり<line-break>したらダメだぜ。<end><if><value:$2C><less-equal>%49ゼグナ鉱山では、たまに錬剛石が拾えるぜ。<line-break>拾って何ケ月かたつと、また拾えることも<line-break>あるから、見つけたら迷わず拾っときな。<end><if><value:$2C><greater-equal>%50西の果てに半島があって、<line-break>そこに古城が建っているそうだ。<line-break>なんでも、船でしか行けない場所らしいな。<end>"
english = "<if><value:$2C><less-equal>%9Battle speed depends on AGI and equipment weight. Heavy armor won't stop focused attacks, so always check party attack order.<end><if><value:$2C><less-equal>%29Do you have three companions? If not, explore every town. Fate draws allies to you, unless you abandon those in need.<end><if><value:$2C><less-equal>%49Zegna Mine sometimes yields Tempering Stones. More may appear months after collection, so never pass one by.<end><if><value:$2C><greater-equal>%50At the world's far western edge is a peninsula with an Old Castle, reachable only by ship.<end>"

["1280037"]
japanese = "<if><value:$2C><less-equal>%9ソウルを宿していたときに、<line-break>あまり使わなかったスキルは、<line-break>無理に習得しなくてもいいだろう。<end><if><value:$2C><less-equal>%29宝箱は無理に開けずに、解除に自信がつくまで<line-break>とっておくのもひとつの手だぜ。<end><if><value:$2C><less-equal>%49西の海に、しぶきの群島があるそうだ。<line-break>そこに向かって生きて帰った者は<line-break>いないっていうから危険な所なんだろうな。<end><if><value:$2C><greater-equal>%50エンシャントの中には<line-break>魔王バロルの廃城があって、<line-break>今でも闇の力が強いんだってよ。<end>"
english = "<if><value:$2C><less-equal>%9You don't have to learn every skill you barely used while bearing a Soul.<end><if><value:$2C><less-equal>%29You needn't force open every treasure chest. Leaving one until you're more confident at disarming it is also an option.<end><if><value:$2C><less-equal>%49They say the Spray Archipelago lies in the western sea. No one who has set out for it has ever returned alive, so it must be a dangerous place.<end><if><value:$2C><greater-equal>%50Within Ancient stands the Ruined Castle of Balor, Demon King. They say the power of darkness remains strong there even now.<end>"

["1280038"]
japanese = "ルーマスの葉を使った、高級なお茶さ。<line-break>貴族たちが、噂話をしながら飲むのはこれだぜ。<line-break>そうそう、噂話と言えば…<end>"
english = "A fine tea made from Rumas leaves. This is what nobles drink while exchanging gossip. Speaking of gossip...<end>"

["1280039"]
japanese = "<if><value:$2A><less-equal>%50猫屋敷に住んでいる賢者様は、<line-break>勇者ネメアと一緒に魔王バロルを倒した<line-break>仲間の１人らしいぜ。<end><if><value:$2A><less-equal>%119ザギヴ将軍はライラネート神殿のとなりにある<line-break>墓地をよく訪れるそうだよ。<end><if><value:$2A><less-equal>%150乙女の鏡に強そうなモンスターが<line-break>住み着いたらしいよ。<line-break>もう、誰か、退治してくれたかな？<end><if><value:$2A><greater-equal>%151ここで飲んでるお客さんが、あんたのことを<line-break>話してるのを見ると、なんだか自分の事<line-break>みたいにうれしくなってしまってね。<end>"
english = "<if><value:$2A><less-equal>%50Apparently, the sage who lives at Cat Manor was one of the companions who defeated Balor, Demon King, alongside Hero Nemea.<end><if><value:$2A><less-equal>%119They say General Zagiv often visits the cemetery beside Lailanate Temple.<end><if><value:$2A><less-equal>%150Apparently, a formidable monster has taken up residence in Maiden's Mirror. I wonder if anyone has defeated it yet.<end><if><value:$2A><greater-equal>%151Whenever I hear the customers drinking here talk about you, I can't help feeling happy, as if they were talking about me.<end>"

["1280040"]
japanese = "<if><value:$2A><less-equal>%50エリエナイ公の弟エストは考古学者として<line-break>闇の神器とかいう魔法のアイテムを<line-break>研究しているそうだな。<end><if><value:$2A><less-equal>%119自称未来の勇者ガルドランの奴、<line-break>どうもフェルムちゃんにほれたみたいでな、<line-break>しょっちゅうやって来るんだ。<end><if><value:$2A><less-equal>%149城塞都市跡に恐ろしい魔物が住み着いて、<line-break>うっかり奥に入り込んだ駆け出し冒険者が<line-break>何人か犠牲になってるそうだよ。<end><if><value:$2A><greater-equal>%150駆け出しの吟遊詩人が何人か訪ねてきてね、<line-break>大陸一の冒険者<value:$28>の冒険談を<line-break>知っていたら教えてくださいってさ。<end>"
english = "<if><value:$2A><less-equal>%50Est, Duke Elienai's younger brother, is an archaeologist studying magical Artifacts of Darkness.<end><if><value:$2A><less-equal>%119Self-styled future Hero Girldlan has fallen for little Ferme. He's always here now.<end><if><value:$2A><less-equal>%149A fearsome monster inhabits the Fortress City Ruins. Several novices who ventured too deep fell victim to it.<end><if><value:$2A><greater-equal>%150Novice bards asked me for tales of <value:$28>, the continent's greatest adventurer.<end>"

["1280041"]
japanese = "<if><value:$2A><less-equal>%25（未：RUMORTEA_02 25以下）<end><if><value:$2A><less-equal>%50（未：RUMORTEA_02 50以下）<end><if><value:$2A><less-equal>%75（未：RUMORTEA_02 75以下）<end><if><value:$2A><greater-equal>%76（未：RUMORTEA_02 76以上）<end>"
english = "<if><value:$2A><less-equal>%25(Incomplete: RUMORTEA_02 25 or below)<end><if><value:$2A><less-equal>%50(Incomplete: RUMORTEA_02 50 or below)<end><if><value:$2A><less-equal>%75(Incomplete: RUMORTEA_02 75 or below)<end><if><value:$2A><greater-equal>%76(Incomplete: RUMORTEA_02 76 or above)<end>"

["1280042"]
japanese = "<if><value:$2A><less-equal>%25あんたの噂を全然聞かないぜ。<line-break>もっとがんばってくれよ。<line-break>期待しているんだからな。<end><if><value:$2A><less-equal>%50城塞都市跡にフゴーが欲しがっている<line-break>珍しい品があるらしいよ。<line-break>機会があったら探してみるといい。<end><if><value:$2A><less-equal>%75風の巫女エアは有名だけど、<line-break>火、水、土の巫女ってのもいるらしいね。<end><if><value:$2A><greater-equal>%76フゴーは珍しい物だけじゃなくて有名人の<line-break>持ち物も欲しがるらしいよ。<line-break>あんたのも狙われてるんじゃないのかい？<end>"
english = "<if><value:$2A><less-equal>%25I haven't heard a single rumor about you. Try a little harder. I'm counting on you.<end><if><value:$2A><less-equal>%50Apparently, there's a rare item in the Fortress City Ruins that Hugo wants. You should look for it if you get the chance.<end><if><value:$2A><less-equal>%75Er, the Shrine Maiden of Wind, is famous, but apparently there are also Shrine Maidens of Fire, Water, and Earth.<end><if><value:$2A><greater-equal>%76Apparently, Hugo doesn't only want rare things. He also collects the possessions of famous people. Perhaps he's after something of yours.<end>"

["1280043"]
japanese = "<if><value:$2A><less-equal>%45ロティの娘クリュセイスは、<line-break>ロセン王家の血をひいているらしいよ。<end><if><value:$2A><less-equal>%79ネメアの父親は魔人だっていう<line-break>バカげた噂があるんだが、<line-break>信じる奴はいるのかね？<end><if><value:$2A><less-equal>%119火山岩地帯にやっかいな魔物が住み着いた<line-break>らしいな。退治をギルドに頼みに行くって、<line-break>そこでお茶を飲んでた神官が言ってたよ。<end><if><value:$2A><greater-equal>%120闇の神器をすべて集めると破壊神ウルグが<line-break>復活するという伝説があるんだが、<line-break>この伝説には続きがあるらしいよ。<line-break>復活した破壊神を倒すことができれば、<line-break>破壊神の力を自分のものにできるってのが、<line-break>その続きなんだが、そんなの無理だよなぁ。<end>"
english = "<if><value:$2A><less-equal>%45Khryuseis, Lottie's daughter, is said to have Rocen royal blood.<end><if><value:$2A><less-equal>%79An absurd rumor says Nemea's father is a Demon. Who believes that?<end><if><value:$2A><less-equal>%119A troublesome monster settled in the Volcanic Rock Zone. A priest taking tea here planned to ask the Guild to exterminate it.<end><if><value:$2A><greater-equal>%120Legend says the Artifacts of Darkness revive Urg, God of Destruction; whoever defeats the revived god claims its power. Impossible, surely.<end>"

["1280044"]
japanese = "<if><value:$2A><less-equal>%50その昔、ここにはある高名な神官がいてね、<line-break>命をかけて邪竜を封印したそうだよ。<line-break>今じゃ、そんな偉大な神官はいなくなったな。<end><if><value:$2A><less-equal>%100昔、この地から産出した聖光石は、<line-break>世界を支配するだけの力を持っていたそうだ。<line-break>今じゃ、かけらぐらいしか採れないがね。<end><if><value:$2A><less-equal>%130この地には破壊神ウルグに従った邪竜が<line-break>封印されているらしいよ。<line-break>それが本当だと大変なことになるな。<end><if><value:$2A><greater-equal>%131古の樹海にはエルフの聖地があるらしよ。<line-break>もちろん、普通の人間はそこまで<line-break>入り込めはしないらしいけどな。<end>"
english = "<if><value:$2A><less-equal>%50Long ago, a renowned priest lived here and is said to have risked death to seal away an Evil Dragon. There aren't any great priests like that anymore.<end><if><value:$2A><less-equal>%100They say the Holy Light Stone once mined here held enough power to rule the world. These days, only fragments can be mined.<end><if><value:$2A><less-equal>%130Apparently, an Evil Dragon that served Urg, the God of Destruction, is sealed away in this land. If that's true, it could mean serious trouble.<end><if><value:$2A><greater-equal>%131They say there's an Elf sanctuary in the Ancient Forest. Ordinary humans can't make it that far in, of course.<end>"

["1280045"]
japanese = "<if><value:$2A><less-equal>%25（未：RUMORTEA_06 25以下）<end><if><value:$2A><less-equal>%50（未：RUMORTEA_06 50以下）<end><if><value:$2A><less-equal>%75（未：RUMORTEA_06 75以下）<end><if><value:$2A><greater-equal>%76（未：RUMORTEA_06 76以上）<end>"
