["1280015"]
japanese = "<select><value:$33>（未：AGETEA_08 旅立ち）<end>大陸では竜王の覚醒が乱世を呼ぶなんて騒いでる<line-break>ようだけど、すべてをお見通しのエア様が<line-break>いる限り、ここは平和だよ。<end>ディンガル皇帝になったネメアだけどな、<line-break>彼は皇帝になる少し前にエア様を訪ねて<line-break>いるそうだよ。<end>（未：AGETEA_08 ロセン王国陥落）<end>（未：AGETEA_08 アンギルダンの山越え）<end>（未：AGETEA_08 リベルダム陥落）<end>（未：AGETEA_08 カルラ進軍）<end>（未：AGETEA_08 ネメア死亡）<end>"
english = "<select><value:$33>(Incomplete: AGETEA_08 Departure)<end>The continent fears the Dragon King's Awakening and chaos, but all-seeing Lady Er will keep this place peaceful.<end>Nemea may now rule Dingal, but he reportedly visited Lady Er shortly before taking the throne.<end>(Incomplete: AGETEA_08 Fall of the Kingdom of Rocen)<end>(Incomplete: AGETEA_08 Angeerdan's Mountain Crossing)<end>(Incomplete: AGETEA_08 Fall of Liberdam)<end>(Incomplete: AGETEA_08 Karula's Advance)<end>(Incomplete: AGETEA_08 Nemea's Death)<end>"

