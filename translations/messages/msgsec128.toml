["1280048"]
japanese = "<if><value:$2A><less-equal>%25（未：RUMORTEA_09 25以下）<end><if><value:$2A><less-equal>%50（未：RUMORTEA_09 50以下）<end><if><value:$2A><less-equal>%75（未：RUMORTEA_09 75以下）<end><if><value:$2A><greater-equal>%76（未：RUMORTEA_09 76以上）<end>"
english = "<if><value:$2A><less-equal>%25(Incomplete: RUMORTEA_09 25 or below)<end><if><value:$2A><less-equal>%50(Incomplete: RUMORTEA_09 50 or below)<end><if><value:$2A><less-equal>%75(Incomplete: RUMORTEA_09 75 or below)<end><if><value:$2A><greater-equal>%76(Incomplete: RUMORTEA_09 76 or above)<end>"

["1280049"]
japanese = "<if><value:$2A><less-equal>%49ウルカーンの長老シェムハザは、<line-break>コーンス族らしいぞ。<end><if><value:$2A><less-equal>%100竜骨の砂漠には、ラドラスの財宝が眠っている<line-break>らしいぞ。探してみるだけの価値は<line-break>あるんじゃないかな。<end><if><value:$2A><less-equal>%130大陸の東に炎竜山があるのは知ってるか？<line-break>あそこに、鍛冶の名人が住んでいるらしいぞ。<end><if><value:$2A><greater-equal>%131名工デルガドは知っているだろ？<line-break>実は鎧を鍛えるのは苦手らしくてな。<line-break>自分の鎧も他人に鍛えてもらっているらしいな。<end>"
english = "<if><value:$2A><less-equal>%49Shemhaza, elder of Ulkhan, is apparently one of the Korns.<end><if><value:$2A><less-equal>%100Ladras's treasure lies buried in Dragonbone Desert. It may be worth seeking.<end><if><value:$2A><less-equal>%130Did you know Flame Dragon Mountain is in the continent's east? A master smith lives there.<end><if><value:$2A><greater-equal>%131You know master craftsman Dergado? Armor alone defeats him; he even has someone else make his own.<end>"

["1280050"]
japanese = "<if><value:$2A><less-equal>%49各地の街道にしゃべるゴブリンが<line-break>現れるらしいんだ。<line-break>自分たちのことをゴブゴブ団とか呼ぶらしいよ。<end><if><value:$2A><less-equal>%80紺碧の洞窟に住み着いた魔物のせいで<line-break>コロル石の採掘ができないらしいよ。<line-break>なんでも、かなり強い魔物だってね。<line-break>ギルドに退治の依頼が来たらしいが<line-break>どうなったかな？<end><if><value:$2A><less-equal>%139この町に住んでいたコーンス族のナッジの<line-break>おじいさんの話なんだがな。<line-break>実は、魔道アカデミーの教授だったらしいよ。<line-break>あのジラークに魔法を教えたのも、<line-break>ナッジのおじいさんだって話だぜ。<end><if><value:$2A><greater-equal>%140吟遊詩人のレルラ＝ロントンを知ってるかい？<line-break>あいつには生き別れになった娘がいるらしいよ。<line-break>けっこう意外な話だろ？<line-break>５年も家族を無視して旅してたら、奥さんも娘も<line-break>行方不明になっちまったらしい。<line-break>もっとも、家族を捜す気はないみたいだけど。<end>"
english = "<if><value:$2A><less-equal>%49Talking Goblins called the Gob-Gob Gang have appeared on roads across the land.<end><if><value:$2A><less-equal>%80A powerful monster in Azure Cave halted Korol Stone mining. The Guild was asked to exterminate it. I wonder what happened.<end><if><value:$2A><less-equal>%139Nadge's grandfather, a Korn once living here, taught at the Magic Academy and even taught Zsilak magic.<end><if><value:$2A><greater-equal>%140Bard Relra-Lonton has an estranged daughter. After he ignored his family to travel for five years, his wife and daughter vanished. He seems unconcerned.<end>"

["1280051"]
japanese = "<if><value:$2A><less-equal>%49宿屋の別館を魔法で破壊した女の子…、<line-break>修理費を返すまで宿屋でただ働きさせられる<line-break>ことになったけど、まだ働いているのかな。<end><if><value:$2A><less-equal>%100ワッシャー海賊のキャプテン・カンダカンは、<line-break>どうやら死んだらしいよ。<end><if><value:$2A><less-equal>%130ワッシャー海賊のキャプテン・カンダカンには、<line-break>ヒルダリアって名の一人娘がいたはずだが、<line-break>親の跡を継いでキャプテンをしてるのかな？<end><if><value:$2A><greater-equal>%131宿屋の別館を破壊したユーリスって娘は、<line-break>魔道アカデミーでも有名な問題児らしいね。<line-break>建物の破壊なんてのは序の口らしいよ。<line-break>魔法で掃除しようとして歴代名誉教授像の頭を<line-break>ことごとく破壊したり、カゼをひいた友人に<line-break>マヒ薬をのませたりと悪行ざんまいだってな。<end>"
english = "<if><value:$2A><less-equal>%49The girl who magically wrecked the inn annex had to work there unpaid for repairs. I wonder if she still does.<end><if><value:$2A><less-equal>%100Captain Kandakan of the Washer Pirates is reportedly dead.<end><if><value:$2A><less-equal>%130Washer Pirate Captain Kandakan had one daughter, Hildaria. Did she succeed her parent as captain?<end><if><value:$2A><greater-equal>%131Inn-wrecker Julls' Academy misdeeds: tried magic cleaning but blew every honorary-professor statue's head off; gave a friend with a cold a paralysis drug.<end>"

["1280052"]
japanese = "<if><value:$2A><less-equal>%50エリス王妃は、リベルダムの武器商人ロティや<line-break>同じく武器商人のアンティノと組んで、<line-break>ペウダを操っているみたいだよ。<end><if><value:$2A><less-equal>%75リューガ家のレムオンは二刀流の使い手だ。<line-break>確か剣聖レーグもそうだよな。<line-break>\u3000<line-break>２人ともダブルブレードというスキルを<line-break>習得しているそうだよ。<end><if><value:$2A><less-equal>%129ゼネテスは盾の扱いがどうしようもなく<line-break>下手らしいぜ。ま、盾と片手剣を持った姿は<line-break>似合わないからかまわないと思うがな。<end><if><value:$2A><greater-equal>%130エリス王妃の料理はうまいらしいぜ。<line-break>もっとも実際に食べたわけじゃないから、<line-break>どのくらいうまいのかは知らないけどな。<end>"
english = "<if><value:$2A><less-equal>%50Queen Eris joined Liberdam arms dealers Lottie and Antino to manipulate Peuda.<end><if><value:$2A><less-equal>%75House Ryuga's Lemghon and Sword Saint Reig both practice Dual Wielding and know Double Blade.<end><if><value:$2A><less-equal>%129Xenetes is hopeless with shields. He'd look wrong with a shield and one-handed sword anyway, so no matter.<end><if><value:$2A><greater-equal>%130Queen Eris is said to be a fine cook. I've never tasted her food, so I can't say how good.<end>"

