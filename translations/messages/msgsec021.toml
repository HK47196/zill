["210061"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000ディンガル帝国。<line-break>\u3000\u3000広大な大地、バイアシオン大陸において<line-break>\u3000\u3000\u3000南のロストール王国と肩を並べる<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000北の大国である。<line-break>\u3000\u3000\u3000\u3000その片隅にテラネの町がある。<line-break>\u3000時折旅人が立ち寄る他は、変化のない日々と<line-break>\u3000\u3000\u3000\u3000\u3000緑とが続く、のどかな町。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "The Dingal Empire. A great northern power on the vast Baiashion Continent, it stands as an equal to the Kingdom of Rostorl in the south. In a remote corner of the empire lies the town of Terane, a peaceful place where, apart from the occasional traveler passing through, quiet days and green countryside stretch on unchanged. The story of a great soul begins here…<end>"

["210062"]
japanese = "\u3000\u3000\u3000\u3000広大な大地、バイアシオン大陸。<line-break>\u3000\u3000\u3000\u3000\u3000人と、人ならざる者とが\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000それぞれの生を営み\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000旅と冒険とが息づく世界。\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000大陸の南、ノーブルの町。<line-break>\u3000今日、この地においても、旅の商人の親子が<line-break>\u3000\u3000次の町を目指し、旅立とうとしていた。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "The vast Baiashion Continent. A world where humans and nonhumans alike live out their lives, and where journeys and adventures abound. In the south of the continent lies the town of Noble. Here too, a traveling merchant and the merchant's child were preparing that day to set out for the next town. The story of a great soul begins here…<end>"

["210063"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000ロストール王国。<line-break>\u3000\u3000\u3000広大な大地、バイアシオン大陸の<line-break>\u3000\u3000\u3000\u3000南側に領土を持つ大国であり、<line-break>\u3000\u3000政治は、貴族により執り行われている。<line-break>その領地のひとつに、ノーブルという町がある。<line-break>\u3000\u3000\u3000\u3000\u3000今、このちっぽけな町は<line-break>\u3000暴政に対する反乱の気運でつつまれていた。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "The Kingdom of Rostorl. A great power whose territory lies in the south of the vast Baiashion Continent, it is governed by the nobility. Among its holdings is a town called Noble. Now this tiny town was filled with the stirrings of rebellion against tyranny. The story of a great soul begins here…<end>"

["210064"]
japanese = "\u3000\u3000\u3000広大な大地、バイアシオン大陸の南に<line-break>\u3000\u3000\u3000\u3000ロストールという名の王国がある。<line-break>\u3000\u3000その王都ロストールでは、悪質な貴族が<line-break>\u3000\u3000\u3000民衆をいたずら半分に苦しめていた。<line-break>\u3000\u3000\u3000\u3000そして、それと時を同じくして、<line-break>\u3000\u3000\u3000古代の神々にまつわる神器をめぐり<line-break>\u3000闇のしもべたちが動き出そうとしていた…。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "In the south of the vast Baiashion Continent lies a kingdom called Rostorl. In its capital, also called Rostorl, malicious nobles tormented the people half for sport. At the same time, servants of darkness were beginning to stir in pursuit of sacred artifacts associated with the ancient gods… The story of a great soul begins here…<end>"

["210065"]
japanese = "\u3000\u3000\u3000\u3000広大な大地、バイアシオン大陸。<line-break>\u3000\u3000\u3000\u3000\u3000そのあまりの広大さゆえに、<line-break>\u3000\u3000\u3000\u3000地図にも記されず、旅人にさえ<line-break>\u3000\u3000知られることのない、小さな村がある…。<line-break>\u3000\u3000\u3000\u3000\u3000村の名は、ミイスという。<line-break>\u3000\u3000そこにあるのは、小さな神殿と、森と<line-break>\u3000\u3000\u3000穏やかな日常くらいのものだった。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "The vast Baiashion Continent. So immense is it that there is a tiny village marked on no map and unknown even to travelers… Its name is Miis. There was little there beyond a small temple, a forest, and the quiet passage of everyday life. The story of a great soul begins here…<end>"

["210066"]
japanese = "\u3000\u3000\u3000\u3000\u3000北の大都市、エンシャント。<line-break>\u3000\u3000\u3000広大な大地、バイアシオン大陸の<line-break>\u3000北半分を支配し、南のロストールと対立する<line-break>\u3000\u3000\u3000\u3000ディンガル帝国の首都である。<line-break>\u3000\u3000\u3000\u3000その、にぎやかな街の外れに、<line-break>\u3000\u3000ひっそりとたたずむ、禁忌の塔がある。<line-break>\u3000\u3000今そこで、目覚めようとする者が居た。<line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "Ancient, the great city of the north. It is the capital of the Dingal Empire, which rules the northern half of the vast Baiashion Continent and stands opposed to Rostorl in the south. On the outskirts of that bustling city stands a forbidden tower, silent and secluded. And now, someone within was about to awaken. The story of a great soul begins here…<end>"

