english = "<value:$28>? Not much of a name. Still, you may yet bring about a transformation in humanity. I shall remember your name. Farewell.<end>"

["1100101"]
japanese = "エスト・リューガ博士に\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ついて知っているか？<line-break>\u3000<line-break>新進気鋭の学者だ。主に考古学的な<line-break>見地からだが、現在までの歴史観を<line-break>根底からくつがえす男だ。<end>"
english = "Do you know of Dr. Est Ryuga? He is a brilliant, up-and-coming scholar. His work is chiefly archaeological, but it overturns our entire understanding of history.<end>"

["1100102"]
japanese = "彼は先人類の存在を主張している。<line-break>それは、現在の人類よりもはるかに強く<line-break>優れた魔道技術を操る超人類だ。<line-break>ネメア様が求めておられる闇の神器も<line-break>彼らの所産だという。エストは<line-break>その構造にまで手を着けている。<end>"
english = "He contends that a human race existed before our own―a race of superhumans, far stronger than modern humanity and masters of vastly superior magical technology. He claims that even the divine artifacts of darkness Lord Nemea seeks were their creation. Est has gone so far as to investigate how they were constructed.<end>"

["1100103"]
japanese = "世界中の学者で<line-break>自力でここまでたどり着いた者は\u3000<line-break>これまで皆無だ。<line-break>古くさいロストールなどに生まれて<line-break>いなければ、恐るべき存在だった。<line-break>人類の革新のための貴重な人材だ。<end>"
english = "No scholar anywhere in the world has ever come this far independently. Had he not been born in a hidebound place like Rostorl, he would have become a formidable force. He is an invaluable asset to the advancement of humanity.<end>"

["1100104"]
