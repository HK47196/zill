english = "Hello there. Visiting a grave, are you? I'm Doldrum, a priest in the service of Sorias. A Dwarf priest of Sorias is a rare sight, eh? Perhaps our meeting was meant to be. Care to walk with me for a while?<end>"

["1100065"]
japanese = "墓地を散歩するのも\u3000\u3000\u3000\u3000\u3000<line-break>面白いものでな。<line-break>\u3000<line-break>墓地は人生の終点であり、<line-break>その人間について記された<line-break>大いなる書物でもある。<end>"
