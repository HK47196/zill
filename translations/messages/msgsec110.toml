["1100106"]
japanese = "答は簡単だ。シャロームよ。<line-break>貴様の夢にはなんら実現性がない。\u3000\u3000<line-break>\u3000<line-break>人の革新は貴様の道の果てにはない。<line-break>貴様には、竜王に吊されたその肉塊が<line-break>朽ち果てていく道しか残されていない。<end>"
english = "The answer is simple, Shalom. Your dream has no hope of becoming reality. Humanity's evolution does not lie at the end of your path. All that remains for you is to hang there, a lump of flesh strung up by the Dragon King, and rot away.<end>"

["1100107"]
japanese = "汝に強力な資質を授けた親に対して\u3000\u3000<line-break>その口の聞き方とはな。<line-break>\u3000<line-break>我が恩を思え、ベルゼーヴァ。<line-break>そして我が手先となれ。<line-break>竜王を封じ、我を解放せよ。<end>"
english = "Is that any way to address the parent who endowed you with such power? Remember what you owe me, Beelzeva, and become my instrument. Seal away the Dragon King and set me free.<end>"

["1100108"]
japanese = "さすれば人類の革新を阻むものはない。<line-break>人類は真の霊長として<line-break>世界に君臨するのだ。<end>"
