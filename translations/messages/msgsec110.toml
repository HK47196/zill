["1100067"]
japanese = "ほう、この墓が気になるのか？\u3000\u3000\u3000<line-break>この墓は皇帝の一族、<line-break>ディンガル家の代々の墓じゃ。<line-break>邪眼帝バロルは、ザギヴという娘が<line-break>ディンガルを支配するという<line-break>妖術宰相ゾフォルの予言に惑わされ、<end>"
english = "Oh? Has this grave caught your eye? This is the ancestral tomb of House Dingal, the imperial family. The Evil-Eyed Emperor Balor was led astray by the Sorcerous Chancellor Zofor's prophecy that a girl named Zagiv would rule Dingal.<end>"

["1100068"]
japanese = "ザギヴという娘とその一族を捕らえ、<line-break>破壊神の円卓騎士マゴスに<line-break>襲わせたのじゃ。<line-break>ネメア様がマゴスを倒し、<line-break>ザギヴという娘だけは助けられたが、<line-break>あとの方々は…間に合わなんだ…。<end>"
english = "Balor had Zagiv and her family captured, then set Magos, a Knight of the Round Table serving the God of Destruction, upon them. Lord Nemea defeated Magos and managed to save Zagiv, but for the others... help came too late.<end>"

["1100069"]
japanese = "ま、ザギヴという娘は、その後、<line-break>魔道アカデミーを主席で卒業。<line-break>そして、官僚になったそうじゃ。<line-break>かなり有能で<line-break>将来有望らしいぞ。<end>"
english = "Well, Zagiv later graduated at the top of her class from the Academy of Magic. I hear she then became an official. Apparently, she is highly capable and has a promising future ahead of her.<end>"

["1100070"]
