["1100109"]
japanese = "真の霊長？\u3000ものは言いようだな。<line-break>おごれる王シャロームよ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>それは、貴様が魔法で強化した奴ら…<line-break>神聖王国時代の魔道兵のような<line-break>でき損ないをさして言っているのか？<end>"
english = "The pinnacle of life? You do know how to dress things up, Shalom, you arrogant king. Do you mean those you enhanced with magic―the failures like the sorcerous soldiers of the Holy Kingdom era?<end>"

["1100110"]
japanese = "そうだとしたらお笑いぐさだ。<line-break>ついえた夢をいまだに見ている\u3000\u3000\u3000\u3000<line-break>おめでたい道化でしかないな。<line-break>人の革新はすでに始まっている。<line-break>ネメア様こそ、真の霊長。<line-break>貴様のでき損ないよりも強く、美しい。<end>"
