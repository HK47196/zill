english = "I only hope the Dragon King, with that hatred of great power, does not have him eliminated... We should hasten the conquest of Rostorl.<end>"

["1100105"]
japanese = "なぜだ、我が子よ？<line-break>なぜ我が夢に荷担しようとせぬ？<end>"
