["1100000"]
japanese = "ザギヴメッセージｖ１用開始<end>"
english = ""

["1100001"]
japanese = "さあ、おとなしくついてこい。<line-break>老いぼれに手荒なマネはしたくないが、<line-break>従わないのならば、容赦しないぞ。<end>"
english = "Come quietly. I would rather not be rough with an old man, but if you refuse to obey, I will show no mercy.<end>"

["1100002"]
japanese = "容赦せんか…。\u3000\u3000\u3000\u3000\u3000<line-break>ふっふっ、恐ろしいの。<line-break>\u3000<line-break>エンシャントでは、<line-break>老人をいたわらんらしい。<end>"
english = "No mercy, you say? Heh heh. How frightening. It seems Ancient has little regard for the elderly.<end>"

["1100003"]
japanese = "老人を助ける<end>"
english = "Help the old person<end>"

["1100004"]
japanese = "無視する<end>"
english = "Ignore<end>"

["1100005"]
japanese = "貴様！\u3000本官に逆らうか！<line-break>殺してもかまわん！\u3000排除しろ！<end>"
english = "You! You dare defy an officer? Lethal force is authorized! Eliminate the offender!<end>"

["1100006"]
japanese = "礼を言わせてもらうぞ。しかし…<line-break>ふふ、余計なことをしたものじゃ。<end>"
english = "You have my thanks. Still... heh, you did something quite unnecessary.<end>"

["1100007"]
japanese = "気がついたか？<end>"
english = "Awake, are you?<end>"

["1100008"]
japanese = "礼を言わせてもらうぞ。しかし…<line-break>ふふ、余計なことをしたものじゃ。<end>"
english = "You have my thanks. Still... heh, you did something quite unnecessary.<end>"

["1100009"]
japanese = "ふっふっ、まあ、安心せい。<line-break>今はただの老いぼれじゃ。<line-break>わしは何もしとらんよ。<end>"
english = "Heh heh. Don't worry. These days, I'm just an old man. I'm not up to anything.<end>"

["1100010"]
japanese = "お前は、わしがお尋ね者の\u3000\u3000\u3000\u3000\u3000<line-break>妖術宰相ゾフォルと知らなんだか。<line-break>\u3000<line-break>かつて、魔王バロルのもとで<line-break>その手腕をふるい、<line-break>世界を闇に落とそうとした魔道士と。<end>"
english = "Did you not know that I am Zofor, the wanted Sorcerous Chancellor? I once served under Balor, Demon King, putting my talents to use in an attempt to plunge the world into darkness.<end>"

["1100011"]
japanese = "ついてくるがいい。<end>"
english = "Come with me.<end>"

["1100012"]
japanese = "ようこそ。ふっふっ…。<line-break>わしが妖術宰相と知っても\u3000\u3000\u3000\u3000\u3000<line-break>ここに来るか。<line-break>お前をここに駆り立てたものは<line-break>好奇心か？\u3000探求心か？<line-break>そのいずれもが、世界を変える力…。<end>"
english = "Welcome. Heh heh... So you came even knowing that I am the Sorcerous Chancellor. Was it curiosity that drove you here? A thirst for knowledge? Either one has the power to change the world...<end>"

["1100013"]
japanese = "それを持つ者が<line-break>無限のソウルの持ち主なれば<line-break>なおのこと運命を感じるわ…。\u3000\u3000<line-break>わしとお前とは対立するじゃろう。<line-break>それが運命じゃ。じゃが、今は<line-break>殺し合いをするには及ぶまい。<end>"
english = "And when one possessed of such a quality also bears an Infinite Soul, I feel the hand of fate all the more keenly... You and I will find ourselves opposed. That is our destiny. But for now, there is no need for us to kill one another.<end>"

["1100014"]
japanese = "探求心がお前を駆り立てるなら、<line-break>また、ここに来るがよい。<end>"
english = "If your thirst for knowledge drives you, come back here.<end>"

["1100015"]
japanese = "じじいの話し相手になる気があれば、<line-break>また、ここを訪れてくるがよい。<end>"
english = ""

["1100016"]
japanese = "エンシャントの<line-break>魔道の塔を知っておるか？\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>かつて、アルレシアの七王は<line-break>強大な魔力を持ち、<line-break>その力でこの世に神聖王国を建てた。<end>"
english = "Do you know of the Arcane Tower in Ancient? Long ago, the Seven Kings of Alresia possessed tremendous magical power. With it, they founded the Holy Kingdom in this world.<end>"

["1100017"]
japanese = "世界が彼らによって<line-break>統一されることを竜王は嫌った。\u3000\u3000\u3000<line-break>\u3000<line-break>彼らは七王のうちふたりに、先人類の<line-break>魔道文明の遺産を与え、背かせた。<line-break>彼らが魔道王国の祖となった。<end>"
english = "The Dragon Kings had no wish to see the world united under them. They bestowed the legacy of the earlier human race's arcane civilization upon two of the Seven Kings and induced them to rebel. Those two became the founders of the Arcane Kingdom.<end>"

["1100018"]
japanese = "しかし、そのうちのひとりは<line-break>先人類の遺産を見て、その偉大なる力と<line-break>不遜なる思いにとらわれた。<line-break>人はもっと、<line-break>すばらしい存在たり得るのでは<line-break>ないのか？<end>"
english = "But when one of them beheld that legacy, he was captivated by its magnificent power―and by a presumptuous thought. Could humanity not become something greater?<end>"

["1100019"]
japanese = "人は神の力を手に入れることも\u3000\u3000\u3000\u3000<line-break>可能ではないのか？<line-break>\u3000<line-break>その男、シャロームは愚かにも<line-break>その不遜な考えを実行に移そうとした。<end>"
english = "Could humanity not even attain the power of the gods? That man, Shalom, was fool enough to try to put his presumptuous idea into practice.<end>"

["1100020"]
japanese = "それは、強大な力の出現を嫌う<line-break>竜王にとって反逆に等しかった。\u3000\u3000\u3000<line-break>\u3000<line-break>竜王は神聖王国の五王を使い、<line-break>不遜の企みの中心地エンシャントの<line-break>魔道の塔を攻めさせた。<end>"
english = "To the Dragon Kings, who abhorred the emergence of any great power, that was tantamount to rebellion. They sent the Holy Kingdom's five kings to attack the Arcane Tower in Ancient, the heart of that presumptuous scheme.<end>"

["1100021"]
japanese = "激闘が続き、人はさらに数を減らした。<line-break>ついにシャロームが倒れたとき、<line-break>五王もナザールを残すのみだった。\u3000\u3000<line-break>竜王は死ぬことのないシャロームを<line-break>魔道の塔に封じ込めた。そして、<line-break>その塔をナザールに守るように命じた。<end>"
english = "The fierce struggle dragged on, and humanity's numbers dwindled further. By the time Shalom finally fell, Nazar alone remained of the five kings. The Dragon Kings imprisoned the deathless Shalom within the Arcane Tower, then commanded Nazar to guard it.<end>"

["1100022"]
japanese = "これが神聖王国成立の次第じゃ。<line-break>わしはこの伝説を追い求め、<line-break>ついに魔道の塔の位置を突き止めた。\u3000<line-break>シャロームは、生きておった。<line-break>その力は無力化されてはおったが、<line-break>その知識はわしの興味に十分に耐えた。<end>"
english = "And that is how the Holy Kingdom came to be. I pursued the legend and at last discovered the location of the Arcane Tower. Shalom was still alive. His power had been rendered useless, but his knowledge proved more than sufficient to hold my interest.<end>"

["1100023"]
japanese = "奴は、わしに男と女を要求した。\u3000\u3000\u3000<line-break>わしは要求に応えた。<line-break>わしは代わりに知識を得た。<line-break>ベルゼーヴァも<line-break>魔道の塔に通っておる様じゃ。<line-break>行ってみるがよかろう。<end>"
english = "He demanded a man and a woman from me. I obliged, and received knowledge in return. It seems Beelzeva has also been visiting the Arcane Tower. You may find it worthwhile to go there yourself.<end>"

["1100024"]
japanese = "ベルゼーヴァとシャロームの関係？\u3000\u3000<line-break>いうなれば、父と子じゃよ。<line-break>\u3000<line-break>ベルゼーヴァの生家は貴族でな。<line-break>バロル様による特権階級弾圧政策で<line-break>当時、貧しく、ひどい有様じゃった。<end>"
english = "Beelzeva and Shalom's relationship? You might call them father and son. Beelzeva was born into a noble family, you see. But Lord Balor's campaign against the privileged classes had left them destitute and in a wretched state.<end>"

["1100025"]
japanese = "そこにわしがつけ込んだのよ。\u3000\u3000\u3000\u3000<line-break>魔法の儀式に立ち会えば<line-break>地位と金をやろうとな。<line-break>ベルゼーヴァの父母ウリアとバシテバは<line-break>シャロームに身体を貸した。<line-break>マノンの封印の弱まる金環食の日にな。<end>"
english = "And I took advantage of their plight. I offered them wealth and status if they would attend a magical ritual. Beelzeva's parents, Uria and Bashiteba, lent their bodies to Shalom on the day of an annular eclipse, when Manon's seal was weakened.<end>"

["1100026"]
japanese = "シャロームは彼らの身体を使い<line-break>ベルゼーヴァをもうけた。<line-break>奴には肉体の両親の他に父がいるのよ。<line-break>かわいそうにウリアとバシテバは<line-break>ベルゼーヴァをもうけてじきに死んだ。<line-break>術に身体が耐えられなんだのじゃな。<end>"
english = "Shalom used their bodies to beget Beelzeva. So besides his parents in the flesh, Beelzeva has another father. Poor Uria and Bashiteba died not long after bringing him into being. Their bodies could not withstand the ritual.<end>"

["1100027"]
japanese = "ウリアとバシテバの愚は笑えぬ。\u3000\u3000\u3000<line-break>それほどに、当時、特権階級への<line-break>弾圧は厳しかったのだから…。<line-break>マノンの封印の弱まる金環食の日には<line-break>シャロームもそのくらいの術は使える。<line-break>うかつに、奴に近づかぬことじゃな。<end>"
english = "Uria and Bashiteba's folly is no laughing matter. The persecution of the privileged classes was that severe in those days. On the day of an annular eclipse, when Manon's seal weakens, Shalom is capable of magic on that scale. You'd best be careful not to go near him.<end>"

["1100028"]
japanese = "ふぉっふぉっふぉ。<line-break>マノンの封印について聞きたいのか？\u3000<line-break>\u3000<line-break>昔、アリアロという<line-break>無限のソウルの持ち主が、<line-break>その力でシャロームの封印を破った。<end>"
english = "Ho ho ho. You wish to hear about Manon's seal? Long ago, Ariaro, bearer of an Infinite Soul, used its power to break the seal binding Shalom.<end>"

["1100029"]
japanese = "お主にも覚えがあろう？<line-break>偉大な力を持ちながら、<line-break>そのことを知らず、利用される…。\u3000\u3000<line-break>アリアロもそう。恋しい男の理想のため<line-break>結果的にはその男を闇に落とす扉を<line-break>開いてしもうたのじゃ。<end>"
english = "That must sound familiar to you, does it not? To possess great power without realizing it, only to be used by others... Ariaro was much the same, pursuing the ideals of a dearly loved man, only to open the door that led him into darkness.<end>"

["1100030"]
japanese = "その封印をもとに戻すため、<line-break>マノンは自らのソウルを腕輪に封じ<line-break>シャロームの力を再び封じたという。\u3000<line-break>じゃが、ソウルの干渉によって<line-break>金環食の日には封印の力が弱くなり、<line-break>シャロームは少しだけ術を使えるのよ。<end>"
english = "To restore the seal, Manon is said to have placed a Soul of Manon's own within a bracelet, sealing Shalom's power away once more. But interference between Souls weakens the seal on the day of an annular eclipse, allowing Shalom to work a little magic.<end>"

["1100031"]
japanese = "その日にはマノンの腕輪を安置した\u3000\u3000<line-break>部屋の扉すらも、アガスティアと<line-break>ブラックバイパーの持ち主には開く。<line-break>ただ、シャロームも、これまで何人も<line-break>腕輪を破壊するべく人を送っておるが<line-break>すべて失敗しておるということじゃ。<end>"
english = "On that day, even the door to the chamber where Manon's Bracelet rests will open for those who bear Agastia and the Black Viper. Shalom has sent many people to destroy the bracelet, but I am told they have all failed.<end>"

["1100032"]
japanese = "妖術宰相の隠れ家にようこそ…。<line-break>何も出せんが<line-break>まあ、ゆっくりしていくといい。<end>"
english = "Welcome to the Sorcerous Chancellor's hideaway. I've nothing to offer you, but make yourself at home.<end>"

["1100033"]
japanese = "…人は誰しも<line-break>胸の内に怪物を飼っておる。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>人が怪物を憎むのはな、そいつを通して<line-break>自分が胸の内に押し込んでいた<line-break>醜いものの存在を感じるからじゃ。<end>"
english = "…Everyone harbors a monster within. People hate monsters because, in them, they catch a glimpse of the ugliness they have buried inside themselves.<end>"

["1100034"]
japanese = "外の怪物を殺そうとも、<line-break>内の怪物を殺そうとも、<line-break>解放にも解決にもならぬのにな。<end>"
english = "Yet killing the monster without or the monster within brings neither freedom nor resolution.<end>"

["1100035"]
japanese = "年をとると、人は変われぬようになる。<line-break>年をとるほど、変わるために<line-break>捨てねばならぬ物が増えてゆくのに、<line-break>年をとるほどに、そういう物を<line-break>捨てるのに必要な勇気とか<line-break>無分別という物が枯渇してゆくのじゃ。<end>"
english = "As people grow older, they become unable to change. The older they get, the more they must cast aside in order to change, while the courage and recklessness needed to do so dwindle away.<end>"

["1100036"]
japanese = "人はきれいに生きようとする。<line-break>悲しいほどにきれいにな。<line-break>\u3000<line-break>そうすると人を許せなくなる。<line-break>滑稽なほどに。<line-break>無責任なほどにな。<end>"
english = "People try to lead spotless lives. So spotless it's sad. In doing so, they become unable to forgive others. Ridiculously so. Irresponsibly so.<end>"

["1100037"]
japanese = "わしには予言の力がある。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>人の不幸が言葉となって<line-break>頭に浮かぶのじゃ。<line-break>じゃが、運命は変えられぬ。<line-break>わしは不幸をくいとめようとしたが<line-break>ムダなことじゃった。<end>"
english = "I have the gift of prophecy. Other people's misfortunes take shape as words in my mind. But fate cannot be changed. I tried to prevent those misfortunes, but it was futile.<end>"

["1100038"]
japanese = "最後には、わし自身が<line-break>不幸を呼ぶ者としてうとまれ\u3000\u3000\u3000\u3000\u3000<line-break>村を追い出された。<line-break>まだ１０才じゃった。<line-break>あのときの母親の形相は今でも忘れぬ。<line-break>あのときの気持ちもな。<end>"
english = "In the end, I was shunned as someone who brought misfortune and driven from the village. I was only ten. I have never forgotten the look on my mother's face that day, or how I felt.<end>"

["1100039"]
japanese = "自分は奴らの言うような\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>不幸を呼ぶ者ではないんだと<line-break>そう強烈に思うた。<line-break>その思いは老境にあってまだ<line-break>忘れぬのに、わしは今でも<line-break>こうして世界を恐怖させておる。<end>"
english = "I was fiercely certain that I was not the bringer of misfortune they claimed I was. Even now, in my old age, I have not forgotten that conviction. And yet here I am, still holding the world in terror.<end>"

["1100040"]
japanese = "運命だったのじゃよ…。<line-break>誰も運命からは逃れられぬ。<end>"
english = "It was fate... No one can escape fate.<end>"

["1100041"]
japanese = "ふぉふぉ、アカデミーの爆破は<line-break>そんなことが原因じゃったのか。\u3000\u3000\u3000<line-break>\u3000<line-break>パーティーにそんな娘がいるとはな。<line-break>いい気味よ。<line-break>アカデミーなどロクな所ではない。<end>"
english = "Ho ho! So that was what prompted the bombing of the Academy. To think you have a girl like that in your party. Serves the place right. The Academy was never worth a damn.<end>"

["1100042"]
japanese = "わしは若いころ、<line-break>忘れられた剣士の伝承について\u3000\u3000\u3000\u3000<line-break>研究しておった。<line-break>邪竜エルアザルを倒し、世界を救うたは<line-break>賢王アルキュオネ、ドワーフ王ドレンガ<line-break>冒険エルフの祖ラミュだけではない…。<end>"
english = "In my youth, I studied the legends of the Forgotten Swordsman. Wise King Alcyone, Dwarf King Drenga, and Rami, forebear of the adventuring Elves, were not the only ones who defeated the Evil Dragon Eluazar and saved the world...<end>"

["1100043"]
japanese = "もうひとり、<line-break>忘れられた人間の剣士がいたのじゃ。\u3000<line-break>\u3000<line-break>この者が闇の神器、虚無の剣を抜き、<line-break>その力で邪竜を倒したのじゃが、<line-break>剣の呪いで世界から消えたのじゃ。<end>"
english = "There was one other: a forgotten human swordsman. This swordsman drew the Sword of the Void, an artifact of darkness, and used its power to defeat the Evil Dragon. But the sword's curse erased its wielder from the world.<end>"

["1100044"]
japanese = "これが、わしが世界をめぐって\u3000\u3000\u3000\u3000<line-break>伝承を集め、<line-break>くだした結論じゃった。<line-break>じゃが、その論文に対してアカデミー、<line-break>特にエルフやドワーフの学者どもが<line-break>実につまらぬ理由から非難した。<end>"
english = "That was the conclusion I reached after traveling the world and gathering its legends. But the Academy, especially its Elf and Dwarf scholars, condemned my paper for the most trivial of reasons.<end>"

["1100045"]
japanese = "人間偏重の歴史を作るための<line-break>人間至上主義の論文だとぬかす。\u3000\u3000<line-break>\u3000<line-break>奴らは人間とエルフとドワーフが<line-break>バランスのいい比率で邪竜を退治した<line-break>ことにしないと気がすまぬらしい。<end>"
english = "They called it a human-supremacist paper, written to create a history favoring humankind. Apparently, they will accept no account of the Evil Dragon's defeat unless humans, Elves, and Dwarves all contributed in suitably balanced proportions.<end>"

["1100046"]
japanese = "わしはアカデミーをあとにした。<line-break>真実より政治学が幅をきかす場所に\u3000\u3000<line-break>いたくなかったのでな。<line-break>それから、わしはその伝承にあった\u3000\u3000<line-break>虚無の剣を求めて闇の力にはまり、<line-break>今では妖術宰相などと呼ばれとる。<end>"
english = "So I left the Academy. I had no wish to remain where politics held more sway than truth. After that, I sought the Sword of the Void described in those legends and became ensnared by the power of darkness. Now they call me the Sorcerous Chancellor.<end>"

["1100047"]
japanese = "ひょっとしたら、ここにいたのは\u3000\u3000\u3000<line-break>無害で伝承を求めているだけの<line-break>うだつの上がらぬ学者だったんじゃ。<line-break>じゃがな、…運命じゃよ。<line-break>人は変われぬのじゃ。<end>"
english = "Perhaps all you would once have found here was a harmless, unsuccessful scholar seeking nothing more than old legends. But... such is fate. People cannot change.<end>"

["1100048"]
japanese = "あなた、誰？<end>"
english = "Who are you?<end>"

["1100049"]
japanese = "…近寄らないで。<end>"
english = "Don't come any closer.<end>"

["1100050"]
japanese = "ザギヴ様。東方兵力配置の件で<line-break>ベルゼーヴァ様がお話があるそうです。<line-break>至急、政庁にお越しください！<end>"
english = "Zagiv! Beelzeva would like to speak with you about the eastern troop deployments. Please come to the government offices immediately!<end>"

["1100051"]
japanese = "一般人の前で機密事項に関することを<line-break>しゃべるなんて、どういうつもり？<line-break>本来なら厳重処分ものよ。<line-break>以後、気をつけて。<end>"
english = "What were you thinking, discussing classified matters in front of a civilian? That would normally warrant severe disciplinary action. See that it doesn't happen again.<end>"

["1100052"]
japanese = "は、はい。<end>"
english = "Y-yes.<end>"

["1100053"]
japanese = "すぐ行くわ。<line-break>ベルゼーヴァ閣下にはそう伝えて。<end>"
english = "I'll go at once. Tell His Excellency Beelzeva that.<end>"

["1100054"]
japanese = "はっ。<end>"
english = "Yes, ma'am.<end>"

["1100055"]
japanese = "………………。<end>"
english = "...<end>"

["1100056"]
japanese = "あなた、いったい何なの？ <line-break>私がここで何をしてようが<line-break>私の自由でしょう？<line-break>私につきまとわないで。<end>"
english = "What is your problem? Whatever I do here is my own business, isn't it? Stop following me around.<end>"

["1100057"]
japanese = "あら。また、あなたなの。<line-break>不思議とよく会うわね。<end>"
english = "Oh. It's you again. We do seem to run into each other a lot.<end>"

["1100058"]
japanese = "私は忙しいの。失礼するわ。<end>"
english = "I'm busy. Excuse me.<end>"

["1100059"]
japanese = "少し、待ってて。<end>"
english = "Wait a moment.<end>"

["1100060"]
japanese = "ありがとう、<value:$28>。<end>"
english = "Thank you, <value:$28>.<end>"

["1100061"]
japanese = "ザギヴ様！<end>"
english = "Zagiv!<end>"

["1100062"]
japanese = "今、行くわ。<end>"
english = "I'm coming.<end>"

["1100063"]
