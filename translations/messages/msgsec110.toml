["1100129"]
japanese = "むろん竜王を倒しただけで<line-break>人類の革新が達成できるとは<line-break>私も思っていない。<line-break>だが、神の揺り籠を捨て、<line-break>人類が己の足で歩いてゆく時代は<line-break>確実に近づきつつある。<line-break>そのためにも、<line-break>人類を導く強大な存在が必要なのだ。<line-break>\u3000<line-break>その人類革新の指導者に<line-break>ネメア様こそがふさわしいと<line-break>私は確信している。<line-break>あるいはもしかすると<line-break><value:$28>にも<line-break>その資質があるのかもしれぬがな。<end>"
english = "Of course, I do not believe that defeating the Dragon King alone will bring about humanity's evolution. But the age when humanity casts off the gods' cradle and walks on its own feet is surely drawing near. To reach it, humanity needs a being of immense power to lead the way. I am convinced that Lord Nemea is the one best suited to lead that evolution. Or perhaps you, too, have the makings of such a leader, <value:$28>.<end>"

["1100130"]
japanese = "<value:$28>…。<line-break>君にこれだけは<line-break>わかっていてほしい。<line-break>人類の革新は、あまたの神々や<line-break>太古の魔道技術を借りて<line-break>行なうものではないということを。<line-break>あくまで人間自身が、己の力で<line-break>より強くありたいと願う<line-break>その意志によって果たされるのだ。<line-break>おそらく革新には気の遠くなるような<line-break>時間が必要になるだろう。<line-break>\u3000<line-break>しかし、それだけの価値はあると<line-break>私は信じている。<end>"
english = "<value:$28>... There is one thing I want you to understand. Humanity's evolution will not be achieved with the aid of countless gods or ancient magical technology. It must come from humanity itself―from the will to grow stronger through its own power. That evolution will probably take an almost inconceivable length of time. But I believe it will be worth it.<end>"

