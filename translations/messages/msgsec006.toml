["60000"]
japanese = "<select><value:$33>今回の航海は無事成功したが、<line-break>次はどうなるだろうか…。<line-break>モンスターも増えてきているしな。<end>今回の航海は無事成功したが、<line-break>次はどうなるだろうか…。<line-break>モンスターも増えてきているしな。<end>ディンガルでは新しい皇帝の誕生を祝っている<line-break>そうだよ。やはりネメアが帝位につくことを<line-break>国民は待ち望んでいたのだな。<end>ロセンがカルラのおかげで解放されたので、<line-break>我々の仕事も忙しくなりそうだ。<end>アンギルダンが海路でなく山越えでロストールを<line-break>攻めるとはな。おかげで、我々の船は仕事を<line-break>ひとつなくしてしまったぞ。わはははは…。<end>やれやれ自由都市リベルダムを、ここまで<line-break>破壊してしまうとは、カルラもたいした女だ。<line-break>おかげで、動ける船はうちのだけだ。<end>この有様だから、最近はロセンの<line-break>ほうがにぎやかでな、我々の船もめったに<line-break>この港へ寄らなくなってしまったよ。<end>ネメアが死んだという噂が流れているようだが、<line-break>それが事実なら指導者を失ったディンガル帝国の<line-break>行く末が気になるな。<end>"
english = "<select><value:$33>This voyage went off without a hitch, but who knows about the next? There have been more monsters around lately, too.<end>This voyage went off without a hitch, but who knows about the next? There have been more monsters around lately, too.<end>I hear Dyneskal is celebrating the crowning of its new emperor. The people must have longed to see Nemea take the throne.<end>Now that Karula has liberated Rocen, it looks as though we'll be getting busier too.<end>Who would have thought Angeerdan would cross the mountains to attack Rostorl instead of going by sea? That's cost our ship a job! Hahahahaha...<end>Good grief. Karula must be quite a woman to have laid waste to the Free City Liberdam like this. Thanks to her, ours is the only ship still fit to sail.<end>With the port in this state, Rocen has been much livelier lately. Our ship hardly ever calls here anymore.<end>There seems to be a rumor going around that Nemea is dead. If it's true, I wonder what will become of the Dyneskal Empire now that it has lost its leader.<end>"

["60001"]
japanese = "<if><value:$2A><less-equal>%49荷を降ろし終わったら、<line-break>すぐ新しい荷を積まなきゃいけねえ。<line-break>まったく休みぐらいくれっていうんだよなあ。<end><if><value:$2A><less-equal>%100船と海がある限り、仕事はなくならねえ。<line-break>あ～あ、休みが欲しいよなあ。<end><if><value:$2A><less-equal>%150あんた、<value:$28>だろ？<line-break>けっこうな有名人みたいだな。<line-break>おいらも名前は知っているぜ。<end>よっ！\u3000<value:$2B>。<line-break>ロストールに行くことがあったら、<line-break>うちのおっかさんによろしく伝えといてくれ。<end>"
english = "<if><value:$2A><less-equal>%49As soon as we're done unloading, we have to start loading the next cargo. Can't we at least get some time off once in a while?<end><if><value:$2A><less-equal>%100As long as there are ships and seas, there'll always be work. Ah, I could really use some time off.<end><if><value:$2A><less-equal>%150You're <value:$28>, right? Sounds like you're pretty famous. Even I've heard the name.<end>Hey, <value:$2B>! If you happen to go to Rostorl, give my regards to my ma.<end>"

["60002"]
japanese = "<select><value:$20>%3しっかしロセン行きの船には\u3000\u3000\u3000\u3000<line-break>乗りたくないもんだぜ。<line-break><line-break>竜王の島沿岸を通るたびに<line-break>すさまじい鬼気を感じて、<line-break>さすがの俺も鳥肌がたっちまうんだ。<end>船旅でモンスターに襲われたら<line-break>逃げることは絶対にできない。<line-break>すべてのモンスターを倒すしかないのだ。<end>船旅は陸路を進むより早く目的地に<line-break>着けるが金がかかるぞ。<end>"
english = "<select><value:$20>%3Still, I sure wouldn't want to take a ship to Rocen. Every time we pass the coast of the Dragon King's Island, I feel this terrifying presence. Even I get goosebumps.<end>If monsters attack while you're at sea, there's no escape. You have no choice but to defeat every last one.<end>Traveling by ship will get you to your destination faster than going overland, but it'll cost you.<end>"

["60003"]
japanese = "<if><value:$2C><less-equal>%9剣聖レーグのような強い用心棒が<line-break>一緒に乗ってくれたなら、<line-break>安心して船旅を楽しめるのだが…。<end><if><value:$2C><less-equal>%29剣聖レーグは、自分を超える戦士を求めている。<line-break>お主ではまだ力不足だが、ネメアやゼネテスなら<line-break>彼の期待に応えられるかもしれぬな。<end><if><value:$2C><less-equal>%49大陸の西に、闇の門の島と呼ばれる<line-break>不気味な島があり、その島の中心には<line-break>異界への入り口があるそうだ。<end>大陸の西にあるしぶきの群島に、<line-break>人の精神を食らって大きくなる化け物が<line-break>いるという話だ。お主なら勝てるかもしれぬな。<end>"
english = "<if><value:$2C><less-equal>%9If only a bodyguard as strong as Sword Saint Reig would sail with us, I could relax and enjoy the voyage...<end><if><value:$2C><less-equal>%29Sword Saint Reig seeks a warrior capable of surpassing him. You are not strong enough yet, but Nemea or Xenetes may be able to meet his expectations.<end><if><value:$2C><less-equal>%49There is an eerie island west of the continent known as the Island of the Dark Gate. They say a gateway to another realm lies at its heart.<end>They say a monster lives in the Spray Archipelago west of the continent, growing larger as it devours people's spirits. You might be able to defeat it.<end>"

["60004"]
japanese = "<select><value:$33>無事に荷が届いて、ほっとひと安心だのう。<line-break>わしは気が弱いから、<line-break>無事に荷が届くまで心配で心配で…。<end>無事に荷が届いて、ほっとひと安心だのう。<line-break>わしは気が弱いから、<line-break>無事に荷が届くまで心配で心配で…。<end>アンティノ様の命令で戦闘用モンスターや<line-break>武器をロセンに送るときは心が痛むのだよ。<line-break>わしもペウダ王の非道は知っておるのでのう。<end>ロセンが解放されて、今度は復興のために<line-break>必要な物資を送ることになったのだ。<line-break>これで少しはよいことをした気になれるのう。<end>ロセンはどんどん復興して立派になっておる。<line-break>わしも仕事のしがいがあるのだけれど、<line-break>解放軍に狙われるのはイヤだのう。<end>いつの時代でも権力者に従わなかった<line-break>自由都市リベルダムが、アンティノの裏切りで<line-break>めちゃくちゃになってしもうた…ぐすっ。<end>フゴー殿がここを捨ててロセンに引っ越して<line-break>しまったので、もうここの復興は無理だのう。<line-break>わしはどうするかのう…。<end>今ではロセンが大陸一の商業都市で<line-break>リベルダム名物の闘技場も移ってしもうた。<line-break>もう、ここには何もないんじゃ…。<end>"
english = "<select><value:$33>What a relief to see the cargo arrive safely. I'm a timid sort, so I worry and worry until I know it's safe...<end>What a relief to see the cargo arrive safely. I'm a timid sort, so I worry and worry until I know it's safe...<end>It pains me whenever Lord Antino orders me to send combat monsters and weapons to Rocen. I know how cruel King Peuda is.<end>Now that Rocen has been liberated, we're sending the supplies needed to rebuild it. At least now I can feel I've done a little good.<end>Rocen is growing grander by the day as the rebuilding continues. It makes the work worthwhile, but I don't much like being targeted by the Liberation Army.<end>The Free City Liberdam never bowed to those in power, in any age. Now Antino's betrayal has left it in ruins... Sniff.<end>Lord Hugo abandoned this place and moved to Rocen, so there's no hope of rebuilding here now. What am I going to do...?<end>Rocen is now the foremost commercial city on the continent, and even Liberdam's famous arena has moved there. There's nothing left here now...<end>"

["60005"]
japanese = "<if><value:$2C><less-equal>%9竜骨の砂漠には、砂漠の民が住んでいる<line-break>という噂があるのだが本当だろうか。<line-break>水のない砂漠で生きていくことなど不可能だろ？<end><if><value:$2C><less-equal>%29竜骨の砂漠には、古代ラドラスの遺跡が<line-break>眠っているという話を聞いたのだ。<line-break>砂漠の民と関係があるのだろうか？<end><if><value:$2C><less-equal>%49竜骨の砂漠に眠る古代ラドラスの遺跡は、<line-break>空中都市と呼ばれる、その名の通り<line-break>空に浮かぶ都市だということだ。<end>竜骨の砂漠に眠る空中都市には、<line-break>地の精霊神の座所があるというのだ。<line-break>私には確かめようがないが、興味深い話だな。<end>"
english = "<if><value:$2C><less-equal>%9Rumor has it that a desert people live in the Dragonbone Desert. Can that really be true? Surely no one could survive in a desert without water.<end><if><value:$2C><less-equal>%29I've heard that the ruins of ancient Ladras lie buried in the Dragonbone Desert. Could they have some connection to the desert people?<end><if><value:$2C><less-equal>%49The ruins of ancient Ladras buried in the Dragonbone Desert are said to be the Floating City―a city that, true to its name, floats in the sky.<end>They say the Floating City buried in the Dragonbone Desert holds the seat of the Spirit God of Earth. I have no way to verify it, but it is an intriguing tale.<end>"

["60006"]
japanese = "<select><value:$33>これがリベルダムのシンボル、時計塔よ。<line-break>この時計塔の鐘の音は、町中に響きわたるの。<end>これがリベルダムのシンボル、時計塔よ。<line-break>この時計塔の鐘の音は、町中に響きわたるの。<end>この時計塔の上からだったら、<line-break>エンシャントやロストールも<line-break>見えるかもしれないわね。<end>ロセンの王族たちは皆殺しにされたそうよ。<line-break>カルラって、きっと恐ろしい性格の娘なのね。<end>ディンガル軍は分断の山脈を越えて、<line-break>ロストールを攻めたそうよ。<line-break>これってすごいことなのかな。<end>そんな…あたしの生まれ育った町が…<line-break>平和で活気のあふれたリベルダムが…<line-break>こんなことになるなんて…。<end>もう…何もかもおしまいよ…<line-break>この町には何もないの…何もないのよっ！<end>エルファス様こそ救世主…<line-break>あわれな人間を導いてくださるお方…。<end>"
english = "<select><value:$33>This clock tower is the symbol of Liberdam. Its bell can be heard all across town.<end>This clock tower is the symbol of Liberdam. Its bell can be heard all across town.<end>From the top of this clock tower, you might be able to see Ancient and Rostorl.<end>They say all the Rocen royals were slaughtered. Karula must be a terrifying girl.<end>They say the Dyneskal Army crossed the Dividing Mountains and attacked Rostorl. Is that really so impressive?<end>No... The town where I was born and raised... peaceful, bustling Liberdam... How could this happen?<end>It's over... Everything's over... There's nothing left in this town... Nothing!<end>Lord Elfas is the Savior... the one who will guide wretched humankind...<end>"

["60007"]
japanese = "<select><value:$33>たっかいぞ、たっかいぞ、<line-break>時計塔はたっかいぞ。<line-break>わーい。<line-break>ぼくもいつかでっかくなって、<line-break>時計塔を踏みつぶすんだ。<line-break>たのしみだなー。<end>たっかいぞ、たっかいぞ、<line-break>時計塔はたっかいぞ。<line-break>わーい。<line-break>ぼくもいつかでっかくなって、<line-break>時計塔を踏みつぶすんだ。<line-break>たのしみだなー。<end>このあいだね、時計塔に登ろうと<line-break>してた人が怒られてたよ<line-break>恥ずかしーね。<end>エルファスっておじちゃんを知ってる？<line-break>おなかを出してて寒くないのかな。<end>レーグみたいに大きくなるには<line-break>どうすればいいのかな？<end>ぜ～んぶ、壊れちゃった～。<line-break>時計塔も壊れちゃったよ～。<line-break>ぼくが壊すのに…ぐすっ。<end>こわいよ～こわいよ～<line-break>かまをもった死神がぜ～んぶ<line-break>壊しちゃうよ～。<end>パパもママもお祈りしてばかりで<line-break>つまんないよ～。<line-break>エルファスさま～だって。<end>"
english = "<select><value:$33>So tall, so tall, the clock tower's so tall! Hooray! Someday I'm gonna grow huge and stomp it flat. I can't wait!<end>So tall, so tall, the clock tower's so tall! Hooray! Someday I'm gonna grow huge and stomp it flat. I can't wait!<end>The other day, somebody got in trouble for trying to climb the clock tower. How embarrassing!<end>Do you know a man named Elfas? Doesn't he get cold with his tummy showing?<end>How can I get as big as Reig?<end>Everythiiing's broken. Even the clock tower. I was supposed to break it... Sniff.<end>I'm scared! I'm scared! The Grim Reaper with the scythe is gonna break everythiiing!<end>Papa and Mama do nothing but pray. It's so boring! All they say is, “Lord Elfas!”<end>"

["60008"]
japanese = "<if><value:$2A><less-equal>%49ロストールにはゼネテスっていう<line-break>凄腕の冒険者がいるってよ。<line-break>あんたは知ってるかい？<end><if><value:$2A><less-equal>%100ここで有名になりたけりゃ、<line-break>お金持ちになるしかないね。<line-break>ここはそういう街だからね。<end><if><value:$2A><less-equal>%150世の中がこんなことになっても、<line-break>あんたら冒険者はたくましく<line-break>生きていけるんだろ？\u3000うらやましいな。<end>なあ、<value:$28>さんよ。<line-break>あんたなら、この混迷した世界を<line-break>救えるんじゃないかな。<end>"
english = "<if><value:$2A><less-equal>%49They say there's a first-rate adventurer named Xenetes in Rostorl. Ever heard of him?<end><if><value:$2A><less-equal>%100If you want to make a name for yourself here, you've got to get rich. That's the kind of town this is.<end><if><value:$2A><less-equal>%150Even with the world in this state, you adventurers will find a way to survive, won't you? I envy you.<end>Say, <value:$28>. Maybe you could save this troubled world.<end>"

["60009"]
japanese = "<if><value:$2C><less-equal>%9魔法のスキルを習得しても、<line-break>精霊力レベルが低いと<line-break>その魔法を唱えることはできないのだー！！<end><if><value:$2C><less-equal>%29宝箱を開けるときは覚悟を決めるのだー！！<line-break>ひどい罠になると呪われたりするから<line-break>手に負えない罠には挑まないことだー！！<end><if><value:$2C><less-equal>%49精霊力レベルがぜ～んぶ１０になったら<line-break>究極の魔法を探すのだー！！<end>聖の禁呪は夢幻の湖に眠る遺跡に、<line-break>闇の禁呪は新月の塔にあるのだー！！<end>"
english = "<if><value:$2C><less-equal>%9Even if you learn a magic skill, you can't cast it unless your Spirit Power Level is high enough!!<end><if><value:$2C><less-equal>%29Prepare yourself before opening a treasure chest!! The worst traps can even curse you, so don't tackle any trap you can't handle!!<end><if><value:$2C><less-equal>%49Once every Spirit Power Level reaches 10, go find the ultimate magic!!<end>The Holy Forbidden Spell lies in the ruins at the Lake of Illusions, and the Dark Forbidden Spell is in New Moon Tower!!<end>"

["60010"]
japanese = "<select><value:$33>ディンガルのネメアは\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>かなり強いんだってよ。<line-break>\u3000<line-break>しかし、我らがリベルダムのチャンピオン、<line-break>剣聖レーグにはかなわないだろう。<line-break>なんといってもレーグは二刀流だからな。<end>ディンガルのネメアは\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>かなり強いんだってよ。<line-break>\u3000<line-break>しかし、我らがリベルダムのチャンピオン、<line-break>剣聖レーグにはかなわないだろう。<line-break>なんといってもレーグは二刀流だからな。<end>ネメアが将軍に任命したジラークは、<line-break>額に角が生えたコーンス族らしいぞ。<end>あまり大きな声じゃ言えないけれど、<line-break>ロティの娘クリュセイスは、カルラが根絶やしに<line-break>したロセン王家の血をひく最後の１人らしいぜ。<end>カルラに反抗してロセンで破壊活動をしてる<line-break>解放軍ってヤツらがいるんだが、それを裏で<line-break>操っている大商人がいるって話だ。<end>アンティノの野郎がカルラと手を結んで<line-break>いたなんて予想してなかったぜ。<line-break>おかげで、この有様だ。<end>もうリベルダムもおしまいだな。<line-break>復興しようと思っても金と人手がない。<line-break>せめて、みんなを率いるリーダーがいればな…。<end>救世主様の話だともうすぐ世界は滅ぶそうだ。<line-break>あんたも思い残すことがないようにな。<end>"
english = "<select><value:$33>They say Nemea of Dyneskal is awfully strong. But he's no match for Liberdam's own champion, Reig the Sword Saint. Reig uses Dual Wielding, after all.<end>They say Nemea of Dyneskal is awfully strong. But he's no match for Liberdam's own champion, Reig the Sword Saint. Reig uses Dual Wielding, after all.<end>I hear Zsilak, the general Nemea appointed, is a member of the Corns tribe, with a horn growing from his forehead.<end>Keep your voice down, but they say Lottie's daughter Khryuseis is the last person left with the blood of Rocen's royal family, the one Karula wiped out.<end>There's a group called the Liberation Army carrying out attacks in Rocen against Karula. Word is, some wealthy merchant is pulling the strings behind the scenes.<end>Never thought that bastard Antinone would join forces with Karula. And now look at us.<end>This is the end of Liberdam. Even if we wanted to rebuild, we haven't got the money or the hands. If only we had someone to lead us...<end>According to the Savior, the world will end soon. Make sure you have no regrets when it does.<end>"

["60011"]
japanese = "<select><value:$33>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ロストールでは貴族や王族の間で<line-break>醜い権力闘争が繰り広げられているって<line-break>いうじゃないか。<line-break>国民はえらく迷惑しているだろうねえ。<line-break>私はリベルダムの人間でよかったよ。<end>ペウダがディンガルに攻め込んで国境沿いの<line-break>村々を焼き払うという事件があったのだが、<line-break>あれはエリスが裏で操っていたという噂だよ。<end>カルラの命令でロセン王家の人間は、<line-break>子供もまでも処刑されたそうだね。<line-break>王家に生まれたばっかりに哀れだよ。<end>アンギルダンを破ったゼネテスは、<line-break>エリス王妃の甥だということだよ。<line-break>反エリス派の貴族は不満だろうね。<end>ああ…カルラに何もかも破壊されたこの町で、<line-break>これからどうやって生きていこう。<line-break>娘には苦労させたくないが…。<end>こんなになっても、生まれ育った場所を<line-break>捨てる気になれない…。<line-break>君のように生きることはできないよ。<end>救世主エルファス様の言葉を信じて、<line-break>真の神に祈りを捧げるよ。<line-break>娘のためにもね。<end>"
english = "<select><value:$33>They say the nobles and royals of Rostorl are embroiled in an ugly struggle for power. It must be causing no end of trouble for the people. I'm glad I'm from Liberdam.<end>They say the nobles and royals of Rostorl are embroiled in an ugly struggle for power. It must be causing no end of trouble for the people. I'm glad I'm from Liberdam.<end>There was an incident in which Peuda invaded Dyneskal and burned the villages along the border. Rumor has it Eris was behind the whole thing.<end>I hear Karula ordered every member of Rocen's royal family executed, even the children. Poor souls, guilty only of being born royal.<end>They say Xenetes, who defeated Angeerdan, is Queen Eris's nephew. The nobles who oppose Eris can't be pleased.<end>Ah... How am I supposed to live now, with Karula having destroyed everything in this town? I don't want my daughter to suffer...<end>Even after all this, I can't bring myself to abandon the place where I was born and raised. I couldn't live the way you do.<end>I'll put my faith in the words of Elfas the Savior and offer my prayers to the true god. For my daughter's sake, too.<end>"

["60012"]
japanese = "<select><value:$33>リベルダムで一番の金持ちはフゴーだけど、\u3000<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>リベルダムで一番の金持ちはフゴーだけど、\u3000<line-break>実際にリベルダムを動かしているのは、<line-break>ロティとアンティノの２人だよ。<line-break>くれぐれも、あの２人には気をつけるんだよ。<line-break>笑って人を刺せるやつらだからねえ。<end>ロティとアンティノはエリスと手を結んで、<line-break>ロセンのペウダを操っているのさ。<line-break>おかげでロセンはひどい有様だよ。<end>ロティはロセン王家の復活を目論む<line-break>解放軍の指導者だって話だよ。<line-break>カルラには気にくわない存在だろうね。<end>解放軍はロセン王家復興の旗頭に<line-break>クリュセイスをたてるみたいだよ。<line-break>あの娘の母親はロセン王家の出身だからね。<end>何の恨みがあって、こんな破壊をするのかね。<line-break>ディンガルにとって、ここはそんなに目障り<line-break>だったのかい？<end>カルラはロセンを新しいリベルダムに<line-break>するために、ここを破壊したんだよ。<line-break>この町はもうおしまいだよ。<end>ネメアが死んでディンガルもお終いだよ。<line-break>もう世の中なんて何もかもお終いなのさ。<line-break>世界は滅んじゃうんだよ。<end>"
english = "<select><value:$33>Hugo may be the richest person in Liberdam, but Lottie and Antinone are the ones who truly run it. Be very careful around those two. They can smile while they stab you.<end>Hugo may be the richest person in Liberdam, but Lottie and Antinone are the ones who truly run it. Be very careful around those two. They can smile while they stab you.<end>Lottie and Antinone have allied themselves with Eris, and they're manipulating Peuda of Rocen. Look what it's done to the place.<end>They say Lottie leads the Liberation Army, which aims to restore Rocen's royal house. Karula can't be happy about that.<end>It seems the Liberation Army means to make Khryuseis the figurehead for restoring Rocen's royal house. Her mother was a member of the royal family, you know.<end>What grudge could drive anyone to wreak such destruction? Was this town really such an eyesore to Dyneskal?<end>Karula destroyed this place so Rocen could become the new Liberdam. This town is finished.<end>Nemea is dead, and Dyneskal is finished. Everything in this world is finished. The world's going to end.<end>"

["60013"]
japanese = "<if><value:$33><less-equal>4レーグって知ってる？<line-break>すごーく大きくて、すごーく強いんだよ。<line-break>でも、お顔もすごーくこわいの。<end>あたしのおうち壊されちゃったの…<line-break>それとね、闘技場も壊されちゃった。<line-break>もう、レーグに会えないの…。<end>"
english = "<if><value:$33><less-equal>4Do you know Reig? He's reeeally big and reeeally strong. But his face is reeeally scary, too.<end>They broke my house... And they broke the arena, too. I'll never get to see Reig again...<end>"

["60014"]
japanese = "<select><value:$20>%1フゴー美術館へようこそ。<line-break>世界中から集めた美術品の<line-break>数々をお楽しみください。<end>"
english = "<select><value:$20>%1Welcome to the Hugo Museum. Please enjoy our many works of art gathered from around the world.<end>"

["60015"]
japanese = "<select><value:$20>%1当美術館は、世界中から集めました<line-break>珍しい品々を展示しております。<line-break>ごゆっくりご鑑賞ください。<end>"
english = "<select><value:$20>%1Our museum displays rare treasures gathered from around the world. Please take your time and enjoy the collection.<end>"

["60016"]
japanese = "<if><value:$2C><less-equal>%15むっ、これはあの…いやそんなはずはない。<line-break>…しかし、この色使いは間違いなく<line-break>盗まれた絵と一致する。<line-break>だが、証拠があっても<line-break>フゴーさんは返してくれんだろうな。<line-break>トホホ…家宝だったのに。<end><if><value:$2C><less-equal>%29冒険の途中で普通の道具屋では売れないような<line-break>珍しい物を見つけたら、ぜひフゴーさんに<line-break>売るといいですよ。<end>フゴーさんは有名人の装備品も集めている<line-break>みたいですよ。あなたの装備品も高く<line-break>買ってくれるかもしれませんね。<end>"
english = "<if><value:$2C><less-equal>%15Hm? This is... No, it couldn't be. Yet these colors unmistakably match the stolen painting. But even with proof, I doubt Hugo would give it back. Oh, dear... It was a family heirloom.<end><if><value:$2C><less-equal>%29If you find anything rare on your travels that an ordinary shop wouldn't buy, you should certainly sell it to Hugo.<end>Hugo seems to collect equipment once used by famous people. You might get a handsome price for yours, too.<end>"

["60017"]
japanese = "<if><value:$2A><less-equal>%25ここの展示品のいくつかは、<line-break>冒険者がフゴーに売りつけた品なんだ。<line-break>俺も珍品を見つけて高値で売りつけるぜ。<end><if><value:$2A><less-equal>%49珍品を手に入れるには、宝箱の罠を解除できる<line-break>ようにならないとだめだ。<line-break>アンチハードルは習得しろよ。<end>フゴーは名のある冒険者が愛用した装備品も<line-break>集めているのだ。あんたが鍛えた装備品で<line-break>いらないものがあったら売ってみな。<end>"
english = "<if><value:$2A><less-equal>%25Adventurers sold Hugo some of the pieces on display here. I'll find a rarity of my own and sell it for a high price.<end><if><value:$2A><less-equal>%49If you want to get your hands on rare goods, you'd better learn to disarm treasure-chest traps. Make sure you learn Anti-Hurdle.<end>Hugo also collects equipment once favored by renowned adventurers. If you've got any upgraded equipment you no longer need, try selling it.<end>"

["60018"]
japanese = "<if><value:$2C><less-equal>%9禁呪を知っているかしら？\u3000<line-break>展示してある古代魔道王国時代の品に<line-break>ヒントがあるかもと思って来たのだけれど…。<line-break>精霊神に関係があるのは確かね。<line-break>もうちょっと調べてみようかしら。<end><if><value:$2C><less-equal>%29禁呪は全部で６個あるみたいね。<line-break>どれもこれも強力な呪文だから、制御するには<line-break>高い精霊力レベルが必要だわ。<end>火、水、土、風の属性を持った禁呪は、<line-break>各属性の精霊神が守っていることがわかったの。<line-break>でも、精霊神に会うことが問題よね。<end>"
english = "<if><value:$2C><less-equal>%9Have you heard of the Forbidden Spells? I thought these relics from the age of the ancient Magic Kingdom might hold a clue, so I came to investigate. They certainly have something to do with the Spirit Gods. Perhaps I'll look a little longer.<end><if><value:$2C><less-equal>%29It seems there are six Forbidden Spells in all. Every one of them is powerful, so controlling them requires a high Spirit Power Level.<end>I've learned that the Forbidden Spells of Fire, Water, Earth, and Wind are guarded by the Spirit God of each element. The trouble is finding a way to meet those gods.<end>"

["60019"]
japanese = "<if><value:$33><less-equal>4さすがは、フゴーのお膝元。<line-break>装飾から広さから、他の町の宿屋と違って<line-break>豪華なもんだぜ。<line-break>あの絵なんていくらで売れるのか…。<line-break>おっといけねえ、<line-break>つい昔の仕事の癖がでちまったい。<end>町はあんなに破壊されたのに、<line-break>なぜか宿屋は無傷なんだよな。<line-break>何か深い理由があるような気がしないか？<end>"
english = "<if><value:$33><less-equal>4You can tell this is Hugo's home ground. From the decorations to the sheer size, it's far grander than inns in other towns. Wonder how much that painting would fetch... Whoops. Old habits from my former trade.<end>The town took a terrible beating, yet somehow the inn escaped without a scratch. Don't you get the feeling there's more to that?<end>"

["60020"]
japanese = "<if><value:$33><less-equal>4装備品を鍛えるために必要な錬剛石はな、<line-break>洞窟や岩場に落ちていることがある。<line-break>キラリと光っていたら調べてみなさい。<end><select><value:$20>%3ここが壊されなくてよかったよ。<line-break>カルラも世界中の冒険者を敵にまわすのは<line-break>避けたかったのだろうな。<end>装備品を鍛えるために必要な錬剛石はな、<line-break>洞窟や岩場に落ちていることがある。<line-break>キラリと光っていたら調べてみなさい。<end>エンシャントのギルドでは、<line-break>宝箱の罠を解除する練習ができる。<line-break>解除に自信がなければ行ってみなさい。<end>"
english = "<if><value:$33><less-equal>4You can sometimes find Tempering Stones, which you need to improve equipment, lying in caves or among rocks. If you see something glinting, take a closer look.<end><select><value:$20>%3I'm glad this place wasn't destroyed. Karula probably wanted to avoid making enemies of adventurers the world over.<end>You can sometimes find Tempering Stones, which you need to improve equipment, lying in caves or among rocks. If you see something glinting, take a closer look.<end>You can practice disarming treasure-chest traps at the Guild in Ancient. Go there if you're not confident in your skills.<end>"

["60021"]
japanese = "<select><value:$33>さすがは大陸一っていわれる<line-break>リベルダムのギルドだぜ。<line-break>ロストールとは大違いだな。<end>さすがは大陸一っていわれる<line-break>リベルダムのギルドだぜ。<line-break>ロストールとは大違いだな。<end>賞金首にされてたアンギルダンも、<line-break>今や朱雀将軍だからな。<line-break>やっぱり実力と人望がある人間は違うよな。<end>エンシャントに帰らずロセンに居座ったまま…、<line-break>つまりカルラは戦争を続けるつもりなわけだ。<line-break>次にどこを攻めるつもりなのかな？<end>アンギルダンがロストールを攻めたのなら、<line-break>やはりカルラの攻略目標はここだな。<line-break>だが、ここの守りは堅いぞ、どう攻める気だ？<end>まさかアンティノを使うとはな…<line-break>奴は自分の利益のためなら何でもする男だ。<line-break>今回の作戦にはうってつけの人間だよ。<end>カルラ軍は連戦連勝で士気も高いし、何より<line-break>ほとんどの無傷だ。それに比べてロストール軍は<line-break>兵力は乏しく、戦い慣れしていない。<line-break>どう考えてもロストールの負けなんだが、<line-break>司令官があのゼネテスだけに期待するよな。<end>正直言ってネメアが死んだなんて<line-break>信じられないが、ディンガルの混乱ぶりを<line-break>見ると真実なんだろうな。<end>"
english = "<select><value:$33>No wonder they call Liberdam's Guild the finest on the continent. Rostorl's doesn't compare.<end>No wonder they call Liberdam's Guild the finest on the continent. Rostorl's doesn't compare.<end>Angeerdan used to have a price on his head, and now he's the Vermilion Bird General. That's what skill and the respect of others can do for a person.<end>Karula hasn't returned to Ancient and is still in Rocen. In other words, she means to continue the war. Where will she attack next?<end>If Angeerdan attacked Rostorl, then Karula's target must be this place. But its defenses are formidable. How does she plan to take it?<end>I never imagined she'd use Antinone... He'll do anything for his own profit. That makes him perfect for this operation.<end>Karula's Army has won battle after battle, so morale is high, and more importantly, it's almost entirely unscathed. Rostorl's forces are small and inexperienced by comparison. By any measure, Rostorl should lose, but with Xenetes in command, you can't help hoping.<end>Honestly, I can't believe Nemea is dead. But judging by the turmoil in Dyneskal, it must be true.<end>"

["60022"]
japanese = "<if><value:$2A><less-equal>%49リルビー族にはマヒや毒を<line-break>無効にする力があるのですぞ。<line-break>仲間に１人いると役に立ちますぞ。<end><if><value:$2A><less-equal>%100装備品に特殊効果をつけるときは慎重に。<line-break>系統を変えると最初から鍛え直しになるし、<line-break>使用した錬剛石も戻ってこないですからな。<end><if><value:$2A><less-equal>%120冒険の途中で珍しい品を見つけたら、<line-break>フゴーのところへ持っていくといいです。<line-break>きっと高く買い取ってくれますぞ。<end>君が<value:$28>ですか。<line-break>有名人は何かと大変でしょうが、自分がすべての<line-break>冒険者の代表だと思って行動してほしいですな。<end>"
english = "<if><value:$2A><less-equal>%49The Lilbie have the power to nullify Paralysis and poison. Having one in your party can be quite useful.<end><if><value:$2A><less-equal>%100Be careful when adding special effects to equipment. Changing its type means upgrading it again from the beginning, and you won't recover any Tempering Stones you've used.<end><if><value:$2A><less-equal>%120If you find anything rare during your travels, take it to Hugo. You're sure to get a good price for it.<end>So you're <value:$28>. Fame brings its share of difficulties, but I hope you'll conduct yourself as a representative of every adventurer.<end>"

["60023"]
japanese = "<if><value:$2C><less-equal>%9各属性の精霊力レベルに極端な偏りがあると<line-break>ユナイトスペルを使えないということを<line-break>忘れてはならぬぞ。<end><if><value:$2C><less-equal>%19精霊力ポイントは戦闘で得られるのじゃ。<line-break>逃げてばかりでは精霊力レベルの上昇など<line-break>望めぬのじゃ。<end><if><value:$2C><less-equal>%29モンスターの中には魔法でしかダメージを<line-break>与えられぬ奴もおる。<line-break>くれぐれも魔法の修行を怠るでないぞ。<end>魔法で攻撃するときは、<line-break>相手の属性を考えて使うのじゃぞ。<end>"
english = "<if><value:$2C><less-equal>%9Never forget: if your Spirit Power Levels are too heavily skewed among the elements, you cannot use Unite Spells.<end><if><value:$2C><less-equal>%19You earn Spirit Power Points in battle. If all you do is flee, you cannot hope to raise your Spirit Power Levels.<end><if><value:$2C><less-equal>%29Some monsters can only be harmed with magic. See that you do not neglect your magical training.<end>When attacking with magic, always consider your opponent's element.<end>"

["60024"]
japanese = "<if><value:$2A><less-equal>%49無名なうちは、小さな仕事を確実に<line-break>こなしていったほうがいいわよ。<line-break>小さな信用の積み重ねが大切なんだから。<end><if><value:$2A><less-equal>%100一緒に旅をする仲間は大切にしないとだめよ。<line-break>１人の力じゃ限界があるものね。<end><if><value:$2A><less-equal>%150あら、<value:$28>さんね。<line-break>あなたの評判、けっこういいみたいよ。<line-break>この調子でがんばってね。<end><value:$2B>か…<line-break>いい通り名をもらったわね。<line-break>あなたにピッタリよ。<end>"
english = "<if><value:$2A><less-equal>%49While you're still unknown, you'd be wise to handle small jobs and do them well. Trust is built a little at a time.<end><if><value:$2A><less-equal>%100Be good to the companions who travel with you. There's only so much one person can do alone.<end><if><value:$2A><less-equal>%150Oh, you're <value:$28>. It seems you've earned quite a good reputation. Keep it up.<end><value:$2B>, is it? That's a fine byname. It suits you perfectly.<end>"

["60025"]
japanese = "<if><value:$2C><less-equal>%15ここには世界中の酒がそろっとるから、<line-break>わしに言わせりゃバイアシオンの酒都じゃい。<line-break>ガハハハハハ…ヒック。<end><if><value:$2C><less-equal>%29わしが見たところ、お主は酒場で酒も飲まずに<line-break>茶ばっかり飲んでおるようじゃのう。<line-break>酒は百薬の長！\u3000飲んでこそ人生ぞ…ヒック。<end><if><value:$2C><less-equal>%49お主は、わしがいつも酒を飲んでおると<line-break>思っとるかもしれぬが、それは間違いぞ。<line-break>たまたま飲んでおるときにお主が来るのじゃ。<end>わしだって世間が大騒ぎなのは知っておるぞ。<line-break>じゃから、世界が滅ぶその瞬間まで<line-break>後悔をせんでええように酒を飲むのじゃ。<end>"
english = "<if><value:$2C><less-equal>%15They stock liquor from all over the world here. Far as I'm concerned, this is Baiashion's capital of booze! Gahahahaha... Hic!<end><if><value:$2C><less-equal>%29From what I've seen, you come to the tavern and drink nothing but tea. Drink is the best medicine! Life is meant for drinking... Hic!<end><if><value:$2C><less-equal>%49You might think I'm always drinking, but you'd be wrong. You simply happen to visit whenever I've got a drink in hand.<end>I know the whole world's in an uproar. That's why I'll keep drinking until the moment the world ends, so I won't have any regrets!<end>"

["60026"]
japanese = "<select><value:$33>人が集まってるとこってだーい好き。<line-break>だって、いろんな人に、あたいの歌を<line-break>聞いてもらえるんだもん。<end>人が集まってるとこってだーい好き。<line-break>だって、いろんな人に、あたいの歌を<line-break>聞いてもらえるんだもん。<end>えっとねえクリスピー…じゃなかった<line-break>レルラ＝ロントンおじさん知ってる？<line-break>弓の名人で冒険者歴２０年の腕利きなんだ。<end>あたいロセンに行ったことないの。<line-break>町の中に入れるようになったみたいだから、<line-break>今度、行ってみようと思うんだ。<end>ロセンにも大きな闘技場があったよ。<line-break>でも、闘技大会はやってなかった<line-break>みたいだったよ。<end>町の中、み～んな壊れちゃったね。<line-break>もう、あたいの歌を聞いてくれる人もいないし、<line-break>これからどうしようかなっ。<end>今度はロストールの町が大変みたいだね。<line-break>フェルムちゃんの酒場で歌っている<line-break>クルップちゃんはどうしてるのかなぁ？<end>みんなエルファスさんの言いつけを守って<line-break>お祈りしているね。あたいもみんなの笑顔が<line-break>戻ってきますようにってお祈りしようかな。<end>"
english = "<select><value:$33>I looove places with lots of people. That way, all kinds of people get to hear me sing!<end>I looove places with lots of people. That way, all kinds of people get to hear me sing!<end>Um, do you know Crispy... No, wait, Uncle Relra-Lonton? He's a master archer and a seasoned adventurer with twenty years under his belt.<end>I've never been to Rocen. It sounds like people can enter the town now, so I think I'll go there sometime.<end>Rocen had a big arena, too. But it didn't look like they were holding any tournaments.<end>The whole town's broken now. There's no one left to listen to my songs, so what am I going to do?<end>Now it sounds like Rostorl is in trouble. I wonder how Krupp, who sings at Ferme's tavern, is doing.<end>Everyone's doing what Elfas said and praying. Maybe I'll pray for everyone's smiles to come back, too.<end>"

["60027"]
japanese = "<if><value:$33><less-equal>2くそ！\u3000なにが夢のかなう町だ…。<line-break>俺には実力がないのか、<line-break>それとも運がないのか…。<end><if><value:$33><equal>3俺は負けんぞ！<line-break>夢はかなえるためにあるんだ、<line-break>俺の未来はまだ決まってない…はず。<end><if><value:$33><equal>4くそ！\u3000ガルドランには負けんぞ！<line-break>あいつより先に俺の夢を…<line-break>ハーレムを造るんだ！<end>ぜーんぶ壊れてよ…すべてがパーだよ。<line-break>こんなことなら故郷でこつこつと<line-break>働いていればよかったな…。<end>"
english = "<if><value:$33><less-equal>2Damn it! So much for the city where dreams come true. Do I lack the talent, or am I just unlucky...?<end><if><value:$33><equal>3I won't give up! Dreams are meant to come true. My future hasn't been decided yet... I think.<end><if><value:$33><equal>4Damn it! I won't lose to Girldlan! I'll achieve my dream before he does... I'll build a harem!<end>It's all wrecked... Everything's gone. If I'd known this would happen, I'd have stayed home and kept working away.<end>"

["60028"]
japanese = "<if><value:$2C><less-equal>%9剣聖レーグこそ、我らボルダンの誇り。<line-break>彼に勝てるものは、この世にはいないだろう。<line-break>お前ごときでは、一撃ともたないだろうな。<end><if><value:$2C><less-equal>%29剣聖レーグは勇者ネメアとともに<line-break>魔王バロルを倒したという。<line-break>ゼネテスとやらも、二撃ともたないだろうな。<end><if><value:$2C><less-equal>%49ロストールのレムオンという貴族は<line-break>二刀流の使い手らしいな。<line-break>だが、レーグの二刀流は無敵だ！<line-break>その男も、三撃ともたないだろうな。<line-break>レーグは最強の男だからな。<end>…たぶん無理だと思うが、<line-break>お前なら竜王にも勝てるかもしれんな。<line-break>たぶん無理だと思うが…<end>"
english = "<if><value:$2C><less-equal>%9Reig the Sword Saint is the pride of us Boldans. No one in this world could defeat him. Someone like you wouldn't last a single blow.<end><if><value:$2C><less-equal>%29They say Reig the Sword Saint defeated Balor, Demon King, alongside Nemea the Hero. This Xenetes fellow wouldn't last two blows.<end><if><value:$2C><less-equal>%49I hear a Rostorl noble named Lemghon practices Dual Wielding. But Reig's Dual Wielding is invincible! That man wouldn't last three blows. Reig is the strongest man alive!<end>It's probably beyond you, but you might even be able to defeat the Dragon King. Probably not, though...<end>"

["60029"]
japanese = "<if><value:$2C><less-equal>%15いいねえいいねえ、レーグ最高！\u3000<line-break>彼のような強い男が<line-break>生きている時代に生まれてよかったあ。<end><if><value:$2C><less-equal>%25ネメアとレーグの対決が見てみたいな。<line-break>歴史に残る好カード間違いなしだろ。<line-break>なあ、あんたはどっちを応援する？<end><if><value:$2C><less-equal>%35レーグを倒せるのはボルダンかドワーフの<line-break>戦士じゃないと無理か？\u3000人間にもがんばって<line-break>ほしいけどな。例えば<value:$28>とかよ。<end>レーグのようにいかにも強そうって<line-break>感じじゃないけど、<value:$28>も<line-break>けっこういいよな。<end>"
english = "<if><value:$2C><less-equal>%15Yes, yes! Reig is the best! I'm so glad I was born in an age when a man that strong is alive.<end><if><value:$2C><less-equal>%25I'd love to see Nemea face Reig. It would be a match for the history books. So, which one would you cheer for?<end><if><value:$2C><less-equal>%35Does it take a Boldan or a Dwarf warrior to defeat Reig? I'd like to see a human do it, though. Someone like <value:$28>, perhaps.<end><value:$28> doesn't look as obviously strong as Reig, but is still pretty impressive.<end>"

["60030"]
japanese = "レーグは確かに強い。<line-break>じゃが、まだ守りに隙があるわい。<end>"
english = "Reig is certainly strong. But there are still openings in his defense.<end>"

["60031"]
japanese = "<if><value:$2C><less-equal>%15さすがに剣聖の名を持つだけのことはある。<line-break>レーグの強さは本物だよ。<line-break><line-break>だが、わしとしては<line-break>彼と互角に戦えるヤツがいないと<line-break>試合がおもしろくないんだな。<end><if><value:$2C><less-equal>%25ゼネテスという冒険者が、<line-break>なかなかの腕前らしいじゃないか。<line-break>闘技大会でレーグと戦ってくれないかな。<end><if><value:$2C><less-equal>%35最近、気になっている冒険者がいるのだよ。<line-break>顔は知らないのだが見かけによらず強いらしい。<line-break>たしか、<value:$28>とかいったかな…。<end>おお、<value:$28>ではないか！<line-break>君なら永遠の王者になれるはずだ。<line-break>わたしは期待しているからな。<end>"
english = "<if><value:$2C><less-equal>%15Reig certainly lives up to the title of Sword Saint. His strength is the real thing. But unless someone can fight him as an equal, the matches aren't much fun for me.<end><if><value:$2C><less-equal>%25I hear an adventurer named Xenetes is quite skilled. I wonder if he'll fight Reig in the tournament.<end><if><value:$2C><less-equal>%35There's an adventurer who's caught my interest lately. I've never seen the face, but apparently this person is surprisingly strong. The name was <value:$28>, I believe...<end>Ah, <value:$28>! You could become champion for all time. I'm counting on you.<end>"

["60032"]
japanese = "<if><value:$33><less-equal>4どの国にも束縛されない\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>自由都市リベルダムにようこそ。<line-break>\u3000<line-break>昔からここの支配権を狙って各国の王が<line-break>攻めてきましたが、誰１人として、<line-break>この城門を越えることはできませんでした。<end>もはや私の守るべきリベルダムはない。<line-break>それでも、ここに立たずにはいられない<line-break>自分がせつないのです…。<end>"
english = "<if><value:$33><less-equal>4Welcome to Free City Liberdam, beholden to no nation. For generations, kings from many lands have attacked in hopes of seizing control, but not one has ever made it through this gate.<end>There is no longer a Liberdam for me to protect. Even so, I can't help standing here. It pains me...<end>"

["60033"]
japanese = "<if><value:$33><less-equal>4あなたも富と名誉を求めて\u3000\u3000\u3000\u3000\u3000\u3000<line-break>やってきたのかしら？\u3000<line-break><line-break>ここは、夢の始まりと終わりが生まれる<line-break>しんきろう都市リベルダム。<line-break>あなたの夢が実現するといいわね。<end>神に祝福された神聖王国アルレシアも<line-break>優れた魔法技術を持った魔道王国ラドラスも<line-break>滅んでいきました。<line-break>ここリベルダムは夢の町。<line-break>どのような夢にも終わりはくるのです。<end>"
english = "<if><value:$33><less-equal>4Have you come seeking wealth and honor as well? This is Liberdam, the mirage city where dreams begin and end. I hope yours comes true.<end>The god-blessed Holy Kingdom of Alresia fell, as did Magic Kingdom Ladras, with all its advanced magical arts. Liberdam is a city of dreams. And every dream must end.<end>"

["60034"]
japanese = "<if><value:$33><less-equal>2今の暮らしは貧しいけんど、<line-break>毎日おびえながら暮らしとった<line-break>ロセンのころを思えば、自由で楽しいわい。<line-break>平和とはありがたいもんじゃい。<line-break>若いあんたさんには<line-break>わからんかもしれんがのう。<end><if><value:$33><less-equal>4ロセンはカルラによって解放された。<line-break>じゃけんど、わしら夫婦は帰るわけにはいかん。<line-break>新しいロセンは、若い力にたくすのじゃ。<line-break>がまんできんで逃げ出したわしらは、<line-break>ここで静かに余生を送ることにするわい。<end>若さは時に勢いのまま暴走してしまう。<line-break>じゃけんど、力を持った若さが暴走すると<line-break>たくさんの悲しみを生むことになるんじゃぞ。<end>"
english = "<if><value:$33><less-equal>2We may be poor now, but compared with our days in Rocen, when we lived in fear from morning to night, this life is free and happy. Peace is a precious thing. You may be too young to understand.<end><if><value:$33><less-equal>4Karula liberated Rocen, but my wife and I cannot return. The new Rocen belongs in younger hands. We couldn't bear it and ran away, so we'll spend what remains of our lives quietly here.<end>The young are sometimes carried away by their own momentum. But when youth has power behind it, that recklessness can bring great sorrow.<end>"

["60035"]
japanese = "<if><value:$33><less-equal>2ロセン王ペウダは、本当にひどい男です。<line-break>わたしらは、逃げてきたからよいものの、<line-break>今もあの鬼畜王は好き放題してるのだろうねえ。<end><if><value:$33><less-equal>4死ぬ前にロセンが解放されて<line-break>ほんによかったです。<line-break>これで心おきなくご先祖様に会えますよ。<end>あんたさんは、力が使い方しだいで<line-break>多くの悲しみを生むことを忘れんでくださいよ。<end>"
english = "<if><value:$33><less-equal>2King Peuda of Rocen is a truly dreadful man. We were fortunate enough to escape, but I expect that savage king is still doing whatever he pleases.<end><if><value:$33><less-equal>4I'm so glad Rocen was liberated before I die. Now I can meet my ancestors with an easy heart.<end>Please remember that power can cause great sorrow, depending on how it is used.<end>"

["60036"]
japanese = "<if><value:$2A><less-equal>%49俺っちに金でも恵んでくれるのかい？<line-break>ひよっこ冒険者さんよう…へっへっへ。<end><if><value:$2A><less-equal>%100ここは夢に破れた人間の溜まり場よ。<line-break>夢を追いかけてる冒険者のあんたが<line-break>来るようなとこじゃないんだよう。<end><if><value:$2A><less-equal>%140あんた冒険者の<value:$28>だよなあ。<line-break>へっへっへ…あんたを倒したら俺っちの<line-break>名前もちったぁ売れるかなあ。<end>どうだい<value:$28>さんよぉ。<line-break>有名になるってのは気持ちいいもんかい？<line-break>俺っちのようなクズには想像できねぇよ。<end>"
english = "<if><value:$2A><less-equal>%49Come to spare me a little coin, have you, fledgling adventurer? Heh heh heh.<end><if><value:$2A><less-equal>%100This is where people end up when their dreams are broken. It's no place for an adventurer like you, still chasing yours.<end><if><value:$2A><less-equal>%140You're that adventurer, <value:$28>, aren't you? Heh heh heh... If I beat you, maybe my name'll get around a little.<end>So, <value:$28>, does it feel good being famous? Scum like me couldn't imagine.<end>"

["60037"]
japanese = "<if><value:$33><less-equal>2アンティノやロティの売った武器のせいで<line-break>多くの人間が泣いているのを<line-break>知っているか？<line-break>やつらの財産は、東方国家の人々の流した<line-break>涙と血のぶんだけ増えていくんだ。<line-break>俺はやつらを絶対に許さないぞ。<end><if><value:$33><equal>3ロセンは解放され、武器は必要なくなった。<line-break>だが、商人どもは復興に必要な物資を売り込む<line-break>ことで、あいかわらず私腹を肥やすのさ。<end><if><value:$33><equal>4武器商人どもめ！\u3000今度はディンガルに武器を<line-break>売りつけるつもりだ。ふざけやがって！<line-break>自分たちがもうければいいのかよっ！<end><if><value:$33><equal>5はっはっはっ…ざまあねえぜ！<line-break>武器商人のやつら、自分たちの売った武器で<line-break>何もかも破壊されて…自業自得だ！<end>ロティは暗殺され、アンティノは行方不明。<line-break>他人を犠牲にして生きてきた人間の末路なんて<line-break>こんなものだろうさ。<end>"
english = "<if><value:$33><less-equal>2Do you know how many people have suffered because of the weapons Antinone and Lottie sold? Their fortunes grow with every tear and every drop of blood shed by the people of the eastern nations. I'll never forgive them.<end><if><value:$33><equal>3Rocen has been liberated, so weapons are no longer needed. But the merchants are still lining their pockets by selling the supplies needed for reconstruction.<end><if><value:$33><equal>4Those damned arms merchants! Now they're planning to sell weapons to Dyneskal. Bastards! Is profit all they care about?<end><if><value:$33><equal>5Hah hah hah... Serves them right! Everything those arms merchants had was destroyed by the very weapons they sold. They brought it on themselves!<end>Lottie was assassinated, and Antinone has disappeared. That's about the end you'd expect for people who lived by sacrificing others.<end>"

["60038"]
japanese = "<if><value:$33><less-equal>2正直者がバカを見るのがこのリベルダムだ。<line-break>親友さえも平気でおとしいれることのできる<line-break>人間が、ここじゃ勝利者なんだよ。<end><if><value:$33><equal>3ロセンで暴れている解放軍のリーダーは、<line-break>ロティだ。奴は王家の血をひく自分の娘を<line-break>女王にしようって腹なのさ。ふざけやがって！<end><if><value:$33><equal>4くくくくっ…ロティの奴が暗殺されてみろ。<line-break>恨みを持つ者が多すぎて犯人を探すことが<line-break>できないぜ。<end><if><value:$33><equal>5アンティノの野郎、カルラに何を吹き込まれた<line-break>かは知らないが、リベルダムを滅ぼした罪は<line-break>絶対に償わさせてやるっ！<end>自由都市だの文化の中心だのとたたえられた<line-break>リベルダムも、今じゃ巨大なスラムだよ。<line-break>ここら辺りは、もとからスラムだがよ。<end>"
english = "<if><value:$33><less-equal>2In Liberdam, honesty only makes you a fool. The winners here are the ones who can betray even their closest friends without a second thought.<end><if><value:$33><equal>3Lottie leads the Liberation Army rampaging through Rocen. He means to make his own daughter queen because she has royal blood. What a damned outrage!<end><if><value:$33><equal>4Heh heh heh... Just imagine if Lottie were assassinated. So many people bear him a grudge, they'd never find the culprit.<end><if><value:$33><equal>5I don't know what Karula put into that bastard Antinone's head, but I'll make him pay for destroying Liberdam!<end>Liberdam was once praised as the Free City and the center of culture. Now it's one enormous slum. Though this neighborhood was always part of the Slums.<end>"

["60039"]
japanese = "<if><value:$33><less-equal>2アンティノの野郎、武器だけでなく<line-break>戦争用の魔法生物まで売ってやがる。<line-break>人の命を何だと思ってるんだ。<end><if><value:$33><equal>3ここだけの話だが、ペウダはアンティノから<line-break>買った魔法生物のエサとして、近隣の村から<line-break>さらった若い娘を与えていたそうだ。鬼だな。<end><if><value:$33><equal>4ゼネテスのおかげでなんとか勝利したけど、<line-break>兵力の大半を失ったロストールに<line-break>ディンガルの再攻撃を防ぐ手だてはないね。<end><if><value:$33><equal>5この店の主人はたいしたもんだよ。<line-break>こんなひどい状況でも、店を開いて<line-break>いるんだからな。<end>エルファスの予言通り世界が滅んでしまうなら、<line-break>文句を言っていただけの俺の人生って<line-break>みじめだなあ…。<end>"
english = "<if><value:$33><less-equal>2That bastard Antinone isn't just selling weapons. He's even selling magical creatures for use in war. What does he think human lives are worth?<end><if><value:$33><equal>3Keep this to yourself, but they say Peuda fed young women kidnapped from nearby villages to magical creatures he bought from Antinone. What a monster.<end><if><value:$33><equal>4Rostorl managed to win thanks to Xenetes, but it lost most of its forces. There's no way it can fend off another attack from Dyneskal.<end><if><value:$33><equal>5The owner of this shop is something else. Even with things this bad, the shop's still open.<end>If the world really does end just as Elfas prophesied, then what a miserable life I've led... All I ever did was complain.<end>"

["60040"]
japanese = "世界が大きく変わろうとしています。<line-break>その流れに、あなたも巻き込まれますが、<line-break>未来はまだ白紙です。<line-break>自分の思うように生きてみなさい。<line-break>それが、最良の選択となるでしょう。<end>"
english = "The world is on the verge of great change. You, too, will be swept up in its course, but the future remains unwritten. Live as you see fit. That will be the best choice you can make.<end>"

["60041"]
japanese = "<select><value:$33>ふーん。そうかいそうかい。<line-break>私も見に行ってみたいもんだねえ。<end>ふーん。そうかいそうかい。<line-break>私も見に行ってみたいもんだねえ。<end>それは気の毒にねえ。<line-break>悪い人間にコーンスが襲われていたら<line-break>助けてあげておくれね。<end>おやまあ、そうなのかい。<line-break>でも、強いからってわざと毒蛇にかまれたり<line-break>しないでおくれよ。<end>へぇーそうなのかい。<line-break>ババは何にも知らなかったよ。<end>ディンガルの軍隊もスラムまでは<line-break>壊しにこなかったよ。ありがたいことじゃ。<end>そうかいそうかい、ありがとうねえ。<line-break>わたしは、あんたが来てくれるだけで<line-break>うれしいんだよ。<end>ありがとう…あんたはやさしい子だよ。<line-break>ババはアンタが生き残れるように、<line-break>いつも祈っておるからねぇ。<end>"
english = "<select><value:$33>Oh, is that so? I'd like to go and see it myself.<end>Oh, is that so? I'd like to go and see it myself.<end>Oh, the poor things. If you see any Corns being attacked by bad people, please help them.<end>My, is that so? But just because you're strong, don't go letting venomous snakes bite you on purpose.<end>Oh, really? This old granny didn't know a thing about it.<end>Even Dyneskal's army didn't come all the way to the Slums to destroy them. We can be thankful for that.<end>Oh, thank you, dear. Just having you come to visit makes me happy.<end>Thank you... You're a kind child. This old granny is always praying that you'll survive.<end>"

["60042"]
japanese = "<select><value:$33>ロストールには、<line-break>すっごーく大きな樹があってねえ<line-break>千年樹って呼ばれてるんだ。<end>ロストールには、<line-break>すっごーく大きな樹があってねえ<line-break>千年樹って呼ばれてるんだ。<end>コーンスは悪い人間に角をとられちゃうんだよ。<line-break>それでね、角をとられたコーンスは死ぬんだよ。<line-break>ぼくリルビーでよかったなぁ。<end>ぼくたちリルビーは、毒やマヒに強いんだよ。<line-break>だから毒虫や毒蛇なんてへっちゃらさ。<end>ぼくのおでこに付けボクロがあるでしょ。<line-break>これはね、人間の子供と間違わないように<line-break>生まれたときに埋められるんだ。<end>たいへんだよー！\u3000たいへんだよー！<line-break>ディンガルの兵隊が時計塔も広場も<line-break>おうちもぜーんぶ壊しちゃったよ！<end>おばあさん、何か足りない物があったら<line-break>言ってよね。ぼくが手に入れてくるからさ。<end>ぼくねぇ、一生懸命祈ったから。<line-break>世界が滅亡したって、絶対おばあさんは<line-break>生き残れるはずだよ。<end>"
english = "<select><value:$33>There's a really, really big tree in Rostorl called the Thousand-Year Tree.<end>There's a really, really big tree in Rostorl called the Thousand-Year Tree.<end>Bad people take the Corns' horns. And when they do, the Corns die. I'm glad I'm a Lilbie.<end>We Lilbies are really resistant to poison and paralysis. So venomous bugs and snakes don't bother us at all.<end>See the fake mole on my forehead? It's implanted when we're born so no one mistakes us for human children.<end>It's terrible! It's terrible! Dyneskal's soldiers destroyed the clock tower, the square, the houses―everything!<end>Grandma, if you need anything, just tell me. I'll get it for you.<end>I prayed really, really hard. So even if the world ends, I'm sure you'll survive, Grandma.<end>"

["60043"]
japanese = "<select><value:$20>%2わしが病気で寝たきりなばっかりに、<line-break>娘には苦労ばかりかけて…ごほごほ。<line-break>うう…、情けない…。<end>わしに人を見る目があれば、ロティなんぞに<line-break>だまされはしなかっただろうに。<line-break>あいつの人のよさそうな顔が憎い…。<end>"
english = "<select><value:$20>%2All because I'm sick and bedridden, I've done nothing but make life hard for my daughter... Cough, cough. Oh... How pathetic.<end>If only I'd been a better judge of character, Lottie would never have fooled me. I hate that friendly-looking face...<end>"

["60044"]
japanese = "<select><value:$20>%3お父さん、私のことはいいから<line-break>早く病気を治してね。<end>父が仕事で失敗して、家も財産も失いましたが<line-break>親子で暮らせる時間が戻ってきました。<line-break>私は、それがうれしいです。<end>お父さん、もうすぐおかゆができるから、<line-break>ちょっと待っててね。<end>"
english = "<select><value:$20>%3Father, don't worry about me. Just concentrate on getting well soon.<end>Father failed at his work, and we lost our home and everything we owned. But now we have time to live together as father and daughter again. That makes me happy.<end>Father, the porridge will be ready soon. Just wait a little longer.<end>"

["60045"]
japanese = "ここはフゴー様のお屋敷です。<line-break>あなたのような無名の方を通すわけには<line-break>まいりません。お帰りください。<end>"
english = "This is Lord Hugo's estate. I cannot admit an unknown person such as yourself. Please leave.<end>"

["60046"]
japanese = "ここはアンティノ様のお屋敷だ。<line-break>お前のような非市民が来るところじゃねえ。<line-break>痛い目みないうちに帰りやがれ。<end>"
english = "This is Lord Antinone's estate. It's no place for a noncitizen like you. Get lost before you get hurt.<end>"

["60047"]
japanese = "ここはクロイス様のお屋敷です。<line-break>ご用のない方を通すわけにはいきません。<line-break>お帰りください。<end>"
english = "This is Lord Krois's estate. I cannot admit anyone without business here. Please leave.<end>"

["60048"]
japanese = "<if><value:$2A><less-equal>%49おう、町を出るんだな。<line-break>船に乗るなら船賃をもらうぞ。<line-break>金がないなら陸路を行くんだな。<end><if><value:$2A><less-equal>%75ほほぉ、貴様が<value:$28>か。<line-break>船に乗る気なら、船賃３００ギアをもらうぞ。<line-break>町を出るつもりなんだろ？<end><if><value:$2A><less-equal>%130<value:$28>、町を出るつもりなのか？<line-break>船に乗るには金がかかるのはわかっているな。<line-break>もっとも、金には不自由してないだろうがな。<end>よう、天下の<value:$28>。<line-break>急ぎの旅なら船を使ってくれよ。<line-break>町を出るつもりなんだろう？<end>"
english = "<if><value:$2A><less-equal>%49So, you're leaving town, eh? If you want to take the boat, you'll have to pay the fare. If you haven't got the money, go by land.<end><if><value:$2A><less-equal>%75Well, well. So you're <value:$28>. If you want to take the boat, it'll cost you 300 Gea. You're leaving town, right?<end><if><value:$2A><less-equal>%130<value:$28>, are you planning to leave town? You know it costs money to take the boat. Not that you're likely to be short of coin.<end>Well, if it isn't the great <value:$28>. If you're in a hurry, take the boat. You're leaving town, right?<end>"

["60049"]
japanese = "町から出る<end>"
english = "Leave town<end>"

["60050"]
japanese = "町から出ない<end>"
english = "Stay in town<end>"

["60051"]
japanese = "リベルダムメッセージここまで<end>"
english = ""
