["600000"]
japanese = "アンギルダン・ボリューム３用開始<end>"
english = ""

["600001"]
japanese = "\u3000\u3000\u3000\u3000皇帝ネメアの世界統一構想のもと\u3000\u3000\u3000<line-break>\u3000\u3000南方攻略軍司令、朱雀将軍アンギルダンが\u3000<line-break>\u3000\u3000\u3000ついにロストール攻略に動き出した。<end>"
english = "Under Emperor Nemea's plan to unite the world, Angeerdan, Vermilion Bird General and commander of the Southern Campaign Army, at last launched the Rostorl Campaign.<end>"

["600002"]
japanese = "\u3000\u3000\u3000\u3000帝国軍が大兵力を投入すると\u3000\u3000\u3000<line-break>\u3000\u3000予想したロストール側は、分断の山脈を<line-break>\u3000\u3000\u3000越えてくるとは考えず、内海側の\u3000\u3000<line-break>\u3000海路を封鎖し、敵の上陸時を叩く作戦に出た。<line-break>\u3000これに対し、ロストール軍副指令ゼネテスは<line-break>\u3000\u3000帝国は分断の山脈を越えてくると主張、\u3000<line-break>\u3000山脈がわに兵を割いて防衛線を築くことを\u3000<line-break>\u3000\u3000提案したが、軍議で即時に却下された。<end>"
english = "Expecting the Imperial Army to commit a massive force, Rostorl did not believe it would cross the Dividing Mountains. Instead, Rostorl blockaded the sea routes through the inland sea, planning to strike as the enemy landed. Xenetes, deputy commander of the Rostorl Army, argued that the Empire would cross the mountains and proposed assigning troops to establish a defensive line there, but the council of war rejected his proposal outright.<end>"

["600003"]
japanese = "\u3000\u3000しかし、このゼネテスの予測は正しく、<line-break>\u3000\u3000\u3000\u3000アンギルダンは少数の精兵で\u3000\u3000\u3000<line-break>\u3000\u3000\u3000分断の山脈を越えると、大街道を\u3000\u3000<line-break>\u3000\u3000\u3000\u3000電撃的な早さで行軍してきた。\u3000\u3000<line-break>\u3000\u3000\u3000\u3000分断の山脈を軍隊が越えたのは\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000歴史上初の壮挙である。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000こうしてディンガル軍は\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000王都ロストールに王手をかけた。<end>"
english = "Xenetes's prediction, however, proved correct. Angeerdan crossed the Dividing Mountains with a small force of elite troops, then advanced along the main highway with lightning speed. It was the first time in history that an army had accomplished the feat of crossing the Dividing Mountains. The Dingal Army thus stood poised to seize the royal capital of Rostorl.<end>"

["600004"]
japanese = "\u3000\u3000\u3000事ここに及び、ロストール軍総司令<line-break>\u3000\u3000\u3000\u3000ノヴィンは急きょ、軍を反転、\u3000<line-break>\u3000\u3000\u3000アンギルダン率いるディンガル軍を<line-break>\u3000\u3000\u3000\u3000\u3000迎え撃つべく、急行した。\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000このとき、ゼネテスは\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000父親でもある総司令に、隊列を整えつつ<line-break>\u3000\u3000\u3000ゆっくりと敵を牽制し、その上で\u3000\u3000<line-break>\u3000\u3000王都守備軍と連係攻撃すべきと説いた。<end>"
english = "With matters at this pass, Novin, commander-in-chief of the Rostorl Army, hastily reversed course and rushed to intercept the Dingal Army led by Angeerdan. Xenetes urged the commander-in-chief, who was also his father, to advance slowly, keeping the enemy in check while restoring the army's formation, and then mount a coordinated attack with the capital's garrison.<end>"

["600005"]
japanese = "\u3000\u3000しかし、ここでもまたゼネテスの説得は<line-break>\u3000\u3000\u3000聞き入れられず、隊列が乱れたまま\u3000<line-break>\u3000\u3000\u3000交戦状態に入ったロストール軍は\u3000\u3000<line-break>\u3000\u3000ディンガル軍の攻撃を受け、壊滅した。<line-break>\u3000\u3000\u3000この戦いで、ロストール軍総司令\u3000\u3000<line-break>\u3000\u3000\u3000ノヴィン・ファーロスをはじめ、\u3000\u3000<line-break>\u3000\u3000\u3000\u3000ロストールの名だたる貴族が\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000多く、その命を落とした。\u3000\u3000\u3000<end>"
english = "Once again, however, Xenetes's counsel went unheeded. The Rostorl Army entered battle with its ranks still in disarray and was annihilated by the Dingal Army's attack. Many of Rostorl's most prominent nobles lost their lives in the battle, including Novin Pharos, commander-in-chief of the Rostorl Army.<end>"

["600006"]
japanese = "ルブルグ伯タルテュバ・リューガは\u3000<line-break>自らの軍を捨て単身逃走。\u3000\u3000\u3000<line-break>命こそ失わずにすんだものの、\u3000\u3000<line-break>その評判は地に落ちた。\u3000\u3000\u3000\u3000<end>"
english = "Count Tarteuba Ryuga of Ruburg abandoned his own army and fled alone. Though he escaped with his life, his reputation was ruined.<end>"

["600007"]
japanese = "朱雀将軍アンギルダンは、\u3000\u3000\u3000<line-break>ロストール軍を壊滅させると、\u3000\u3000<line-break>深追いを禁じ、続く王都侵攻に備え、<line-break>全軍に物資の現地調達開始を命じた。<end>"
english = "After annihilating the Rostorl Army, Vermilion Bird General Angeerdan forbade his forces from pursuing the enemy too far and ordered the entire army to begin procuring supplies locally in preparation for the coming assault on the capital.<end>"

["600008"]
japanese = "アンギルダンの唯一の不安材料だった\u3000<line-break>物資もこれにより補充され、\u3000\u3000\u3000<line-break>ディンガル軍のロストール占領を\u3000\u3000<line-break>阻むものはなくなったかに見えた。\u3000<end>"
english = "This replenished the supplies that had been Angeerdan's sole concern, and it seemed that nothing remained to prevent the Dingal Army from occupying Rostorl.<end>"

["600009"]
japanese = "だが、ゼネテスは、驚くべき早さで\u3000<line-break>ロストール軍の敗残兵を立て直し、\u3000<line-break>徴発隊が繰り出して手薄になった\u3000\u3000<line-break>帝国軍中枢部を、奇襲した。\u3000\u3000\u3000<line-break>このゼネテスの神速の奇襲により、\u3000<line-break>帝国軍の中枢部は壊滅、\u3000\u3000\u3000\u3000<line-break>アンギルダンも討ち取られ、\u3000\u3000\u3000<line-break>帝国軍は潰走した。\u3000\u3000\u3000\u3000\u3000<end>"
english = "But with astonishing speed, Xenetes rallied the remnants of the Rostorl Army and launched a surprise attack on the heart of the Imperial Army, left thinly defended after its requisitioning parties had been sent out. Xenetes's lightning assault destroyed the Imperial Army's core, Angeerdan was slain, and the Imperial Army fled in disarray.<end>"

["600010"]
japanese = "これによりゼネテスの声望は一気に\u3000<line-break>高まり、奇跡の名将とまで呼ばれたが、<line-break>この戦いでロストールが受けた被害は\u3000<line-break>甚大なものであった。\u3000\u3000\u3000\u3000<end>"
english = "Xenetes's renown soared as a result, and he came to be hailed as a miraculous commander. Yet the losses Rostorl suffered in the battle were immense.<end>"

