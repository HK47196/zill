japanese = "なるほど、只者ではないな。<line-break>カルラ様から話は聞いている。<line-break>中へ入るがいい<end>"
english = ""

["1360201"]
japanese = "ひさしぶり、<value:$28>。<line-break>いやー、感動の再会だねー。<line-break>感動、感動～。<end>"
english = "Long time no see, <value:$28>. What a touching reunion! I'm moved. Truly moved.<end>"

["1360202"]
japanese = "あれから、いろいろあったよねー。<line-break>あんたがゼネテス側について<line-break>あたしの敵にまわったりさー。<end>"
english = "A lot's happened since then, hasn't it? Like you siding with Xenetes and turning against me.<end>"

["1360203"]
japanese = "あたし、ぜんぜん根に持ってないから<line-break>うん、ぜんぜん。ホントよ。<line-break>だから、安心してよね。<end>"
english = "But I don't hold a grudge. Not at all. Really. So don't worry.<end>"

["1360204"]
japanese = "君に来てもらったのは他でもない。<line-break>国計に関わる大事があってのことだ。<end>"
english = "I summoned you here for one reason: a matter of grave importance to the state.<end>"

["1360205"]
japanese = "ディンガル帝国を脅かす存在…。<line-break>つまり君には今日ここで消えてもらう。<line-break>すでに我が精鋭がこの部屋を囲んでいる。<end>"
english = "You pose a threat to the Dingal Empire. Which means you must disappear here today. My finest troops have already surrounded this room.<end>"

["1360206"]
japanese = "…なーんてさ、どっかの宰相みたいに<line-break>インケンなことは考えてないから。<line-break>安心しちゃって。<line-break>あたしが青竜将軍カルラ。<line-break>ま、これまでのことは水に流して<line-break>サクサク行こうよ。とりあえずは、さ。<end>"
english = "Or so some chancellor might say. I'm not plotting anything that underhanded, so relax. I'm Karula, the Azure Dragon General. Let's put everything that's happened behind us and get on with things. For now, anyway.<end>"

["1360207"]
japanese = "うちの副官。アイリーンのことで<line-break>ちょっと話があるのさ。<line-break>あんたにすごい関係あること。<end>"
english = "I want to talk about my adjutant, Irene. It's got a lot to do with you.<end>"

["1360208"]
japanese = "アイリーンが先のロストール戦で<line-break>あんたに戦いを挑んだでしょ？<line-break>んで、あんたは逃げた。<line-break>それから、どーも、落ち込んでてさ。<end>"
english = "Irene challenged you during the recent battle at Rostorl, remember? And you ran away. She's been rather down ever since.<end>"

["1360209"]
japanese = "あのコ、根がマジメだし、<line-break>思い詰めるとヤバいかなーって<line-break>思ってたら、失踪しちゃった。<end>"
english = "She's serious by nature, so I was starting to worry she might do something drastic if she brooded over it too long. Then she disappeared.<end>"

["1360210"]
japanese = "で…調べによると、彼女は失踪する直前に<line-break>リベルダムであんたと接触してんのよ。<line-break>ほれ、何があったか白状しなさい？<end>"
english = "According to our investigation, she met with you in Liberdam just before she vanished. Come on, confess. What happened?<end>"

["1360211"]
japanese = "ふむふむ、そんな話を…<line-break>ちょーっと期待してた展開では<line-break>なかったなあ。<end>"
english = "Mm-hmm. So that's what happened... Not quite the story I was hoping for.<end>"

["1360212"]
japanese = "まあまあ、冗談はおいといて。<line-break>アイリーンの行方を追えるのは<line-break><value:$28>だけみたいやね。<end>"
english = "All right, jokes aside. It looks like <value:$28> is the only one who can track Irene down.<end>"

["1360213"]
japanese = "失踪原因はあんた、とまでは言わないけど<line-break>どうも関わりがあるみだいだし<line-break>ま、キッカケは確実にあんただしね。<line-break>それに、あんたなら<line-break>魔人にも知り合いがいるみたいだしさ。<line-break>アイリーンは魔人の話してたんでしょ？<end>"
english = "I won't go so far as to say you're the reason she disappeared, but you do seem to be involved. And you were definitely what set it off. Besides, you apparently even know demonfolk. Irene talked about demonfolk, didn't she?<end>"

["1360214"]
japanese = "では、冒険者<value:$28>に<line-break>騎士アイリーン・エルメスの<line-break>捜索を依頼します。<line-break>条件はアイリーンを生きている状態で<line-break>ロセン総督府に連れ戻し、<line-break>青竜軍に復帰させること。<end>"
english = "I hereby commission the adventurer <value:$28> to find the knight Irene Hermes. The terms are that you bring Irene back alive to the Rocen Governor-General's Office and return her to service in the Azure Dragon Army.<end>"

["1360215"]
japanese = "報酬は錬剛石５個。<line-break>文句ある？<end>"
english = "Your reward will be five tempered-steel stones. Any complaints?<end>"

["1360216"]
japanese = "じゃあ、契約成立ってことで。<line-break>途中報告一切不要。結果をみせてよね。<line-break>以上。<end>"
english = "Then we have a deal. No progress reports. Just show me the results. That's all.<end>"

["1360217"]
japanese = "開け放つものって魔人がいるかって？<line-break>破壊神ウルグ様の円卓騎士筆頭<line-break>ヴァシュタールがそうだが、どうしたよ<end>"
english = "You want to know if there's a demon called the Opener? That would be Vashtar, foremost among the Knights of the Round Table serving Lord Urg, God of Destruction. Why do you ask?<end>"

["1360218"]
japanese = "なるほどねえ。<line-break>んで、お前はアイリーンを<line-break>探しにいかなきゃならないのか？<end>"
english = "Ah, I get it. So now you have to go looking for Irene?<end>"

["1360219"]
japanese = "そんな伝説ができてたのは知ってたが…<line-break>ヴァシュタールの老いぼれに<line-break>何を聞こうってんだ？<line-break>伝説は伝説に過ぎない。<line-break>あいつはそんな親身な奴じゃないぜ？<line-break>最近はめっきりやる気もなくしてる。<end>"
english = "I knew that legend had been making the rounds, but what do you expect to learn from an old wreck like Vashtar? A legend's just a legend. He's not the helpful sort, you know. Lately, he's lost all motivation.<end>"

["1360220"]
japanese = "何度も繰り返される光と闇の戦いに<line-break>やれ飽きただの、もう消えたいだの。<line-break>あきらめてオトナになれよって思うぜ。<line-break>そんな奴より、俺に聖杯を持ってきたら<line-break>騎士どころか貴族にも王様にもして…<end>"
english = "He keeps whining that he's sick of the endless cycle of battles between light and darkness, that he wants to disappear. I say he should accept it and grow up. Forget him. Bring me the Grail, and I'll make you not just a knight, but a noble or even a king...<end>"

["1360221"]
japanese = "ヴァシュタールの居場所？<line-break>ああ、だいたいの見当ならつくぜ。<line-break>ヴァシュタールの柩って遺跡だ。<line-break>趣味悪いだろ？\u3000普通、自分の寝床に<line-break>柩なんてつけるか？<line-break>まあ、そういう奴だ。<end>"
english = "Where is Vashtar? Oh, I have a pretty good idea. There's a ruin called Vashtar's Coffin. Awful taste, isn't it? Who calls his own bed a coffin? Well, that's the sort of man he is.<end>"

["1360222"]
japanese = "ノーブルの南西に偽りの森ってあるだろ？<line-break>その奥にオズワルドっていう町がある。<line-break>そこにある遺跡だよ。<line-break>でも、もう町の人間のソウルを奪って<line-break>闇の門を開けにいってるかもな。<line-break>奴がいなかったからって文句はなしだぜ？<end>"
english = "You know the Forest of Deceit southwest of Noble? There's a town called Oswald deep inside it. The ruin is there. But Vashtar may already have stolen the townspeople's Souls and gone off to open the Gate of Darkness. Don't come complaining to me if he's not there, all right?<end>"

["1360223"]
japanese = "なぜ、この世界から争いが、<line-break>そして悲しみがなくならないのか…<line-break>それがつらいのか、女よ？<end>"
english = "Does it pain you, woman, that conflict and sorrow never vanish from this world?<end>"

["1360224"]
japanese = "やさしさに毒されているのだな、女。<line-break>やさしさという名の欲に。<end>"
english = "You have been poisoned by kindness, woman―by the desire that calls itself kindness.<end>"

["1360225"]
japanese = "争いはなくならない。それが摂理だ。<line-break>勝者は傲り、敗者は傷つき悲しむ。<line-break>そのゆがみの総和が創造の絶対値なのだ。<line-break>安寧…完全に均質化された世界は、<line-break>人らしく意志する者にとって<line-break>動きのない死。<end>"
english = "Conflict will never end. That is the natural order. The victors grow arrogant; the defeated are wounded and grieve. The sum of those distortions is creation's absolute value. For anyone possessed of a human will, peace―a perfectly uniform world―is motionless death.<end>"

["1360226"]
japanese = "怠惰なる死を恐れた大いなる意志は<line-break>この永遠に続く争いの摂理を作った。<line-break> <line-break>お前が怒る不当な勝利も、<line-break>お前が嘆く不当な敗北も、<line-break>すべてはその中で踊っているにすぎない。<end>"
english = "The Great Will, fearing the idle death of stasis, created this law of eternal conflict. The unjust victories that enrage you and the unjust defeats you lament are merely dancing within it.<end>"

["1360227"]
