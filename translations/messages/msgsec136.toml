["1360160"]
japanese = "気付いていたの…。<line-break>\u3000<line-break>\u3000<line-break>行き着くところまでよ。<line-break>たとえ、そこが地獄でも、<line-break>どこまでもついていくわ。<end>"
english = "You knew I was here... I'm going with you to the very end. Even if the road leads to hell, I'll follow you all the way.<end>"

["1360161"]
japanese = "ケリュネイア。<line-break>お前はここに残れ。<end>"
english = "Ceryneia. Stay here.<end>"

["1360162"]
japanese = "イヤよ！<line-break>ついていく！<line-break>\u3000<line-break>足手まといにはならないわ！<line-break>私だって魔王を倒した勇者のひとり。<line-break>閃光のケリュネイアよ！<end>"
english = "No! I'm coming with you! I won't hold you back! I'm one of the Heroes who defeated the Demon King. I am Ceryneia the Flash!<end>"

["1360163"]
japanese = "だからこそ、だ。<line-break>お前にはここで、次々わいてくる<line-break>ザコどもをくいとめてもらう。<line-break>そして、<value:$28>の<line-break>仲間たちを呼び出してもらう。<line-break>これができるのはお前だけだ。<end>"
english = "That's exactly why. Stay here and hold off the small fry that keep pouring in. Then summon <value:$28>'s companions. You're the only one who can do it.<end>"

["1360164"]
japanese = "難しい仕事だ。<line-break>できるか、ケリュネイア？<end>"
english = "It will not be easy. Can you do it, Ceryneia?<end>"

["1360165"]
japanese = "わかったわ、兄さん。<line-break>勇者ネメアの妹の名に恥じない<line-break>働きをしてみせる。<end>"
english = "All right, brother. I'll prove myself worthy of the name of Nemea the Hero's sister.<end>"

["1360166"]
japanese = "<value:$28>、私はここにいるわ。<line-break>仲間を呼び出したかったら<line-break>私に話しかけて。<line-break>あとは、たのんだわ。<line-break><value:$28>。<end>"
english = "<value:$28>, I'll remain here. If you want to summon your companions, come and speak to me. The rest is up to you, <value:$28>.<end>"

["1360167"]
japanese = "<value:$28>、時に猶予はない。<end>"
english = "<value:$28>, there is no time to spare.<end>"

["1360168"]
japanese = "では、行こう。<line-break>すべてを終わらせに。<end>"
english = "Then let us go and put an end to everything.<end>"

["1360169"]
japanese = "おつかれさま。<line-break>連戦でいい顔つきになってきたよ。<line-break><value:$28>。<line-break>ここで君を待っていたのは<line-break>君におとぎ話を聞いてほしかったからさ。<line-break>舞台はアルノートゥンだよ。<end>"
english = "Good work. All those battles are starting to give you the look of a seasoned fighter, <value:$28>. I was waiting here because I wanted you to hear a little fairy tale. It takes place in Alnortun.<end>"

["1360170"]
japanese = "少し前、封士イオンズという男がいた。<line-break>彼は怪物を退治したり封印しても、<line-break>憎悪が残ってしまうことを悩んでいた。<line-break>で、彼はイズキヤルという怪物と<line-break>戦ったとき、殺したり封印したりせず<line-break>忍耐強く説得を続けたんだ。<end>"
english = "Not long ago, there was a man named Ionz, a Sealer. It troubled him that hatred remained even after he defeated monsters or sealed them away. So when he fought a monster named Izkiyal, he neither killed nor sealed it away. Instead, he patiently kept trying to persuade it.<end>"

["1360171"]
japanese = "その説得は功を奏し、イズキヤルは<line-break>小さくなって、自分の力を封じ、<line-break>アルノートゥンの町に住むことにした。<line-break>町の人々も、徐々にイズキヤルに<line-break>親しみ、なじんできた。<line-break>怪物と人間、両者の間に交流が生まれた。<end>"
english = "The persuasion paid off. Izkiyal made itself small, sealed away its own power, and settled in the town of Alnortun. Little by little, the townspeople warmed to Izkiyal and grew used to having it around. And so, monster and human began to interact.<end>"

["1360172"]
japanese = "だけどイズキヤルみたいなティラの子は<line-break>いわば暴風雨や地震や洪水のような<line-break>自然の暴力の現れだからね。<line-break>思うままに暴れたいという思いは<line-break>どうしても本能として心の底に残ってた。<line-break>そこに悪い魔法使いが現れたんだ。<end>"
english = "But a child of Tira like Izkiyal is a manifestation of nature's violence, much like a storm, an earthquake, or a flood. Deep down, the instinctive urge to run wild at will never quite went away. Then an evil sorcerer appeared.<end>"

["1360173"]
japanese = "さあ大変！\u3000悪い魔法使いに<line-break>暴れたいという本能を呼び覚まされ<line-break>イズキヤルは暴れ出したよ。<line-break>そこに<value:$28>という<line-break>勇者が通りかかったんだけど、<line-break>無視して行っちゃったんだ。ひどいよね。<end>"
english = "Oh, what a disaster! The evil sorcerer awakened Izkiyal's instinctive urge to run wild, and it began to rampage. Just then, a hero named <value:$28> happened along, but walked right past and ignored the whole thing. Awful, isn't it?<end>"

["1360174"]
japanese = "イオンズはイズキヤルを追いつめた。<line-break>だけど、どうしても倒せなかったんだ。<line-break>\u3000<line-break>イズキヤルはいわば彼の親友だったし、<line-break>イズキヤルの意志で暴れてたんじゃない。<line-break>そう、イオンズにはわかっていたからね。<end>"
english = "Ionz cornered Izkiyal, but he simply couldn't defeat it. Izkiyal was, in a way, his closest friend, and the rampage wasn't Izkiyal's own choice. Ionz knew that.<end>"

["1360175"]
japanese = "イズキヤルも、彼を殺したくなかった。<line-break>だけど、<line-break>イズキヤルは本能にあらがえなかった。<end>"
english = "Izkiyal didn't want to kill him, either. But it could not resist its own instincts.<end>"

["1360176"]
japanese = "イズキヤルは絶望を知り、<line-break>闇に墜ちましたとさ。<end>"
english = "And so Izkiyal learned despair and fell into darkness.<end>"

["1360177"]
japanese = "おしまい。おしまい。<line-break>じゃ、またあとで。<line-break>死んじゃったりしないでね。<end>"
english = "The end, the end. See you later. Don't go dying on me, all right?<end>"

["1360178"]
japanese = "…あっ。<line-break><value:$28>。<end>"
english = "Oh... <value:$28>.<end>"

["1360179"]
japanese = "聞いた？<line-break>アルノートゥンのジラークが死んだわ。<line-break>コーンス族を人間から守ろうとしてね。<end>"
english = "Have you heard? Zsilak of Alnortun is dead. He was trying to protect the Korns people from humans.<end>"

["1360180"]
japanese = "私…<line-break>弱い者を守るために戦ってきた。<line-break>大事なものを守るために剣を振るってた。<line-break>…そう信じてた。<end>"
english = "I... I fought to protect the weak. I wielded my sword to protect what mattered to me. Or so I believed.<end>"

["1360181"]
japanese = "このリベルダムの破壊だって…。<end>"
english = "Even the destruction of Liberdam...<end>"

["1360182"]
japanese = "だけど結局ゼネテスは戦争を挑んだ。<line-break>ゼネテスはゼネテスの大事なものを<line-break>守るために戦うことを選んだ。<end>"
english = "But in the end, Xenetes started a war. He chose to fight for what mattered to him.<end>"

["1360183"]
japanese = "ジラークも同じ。<line-break>争いでは悲しみしか得られないのに<line-break>どうしても争いは地上からなくならない。<end>"
english = "Zsilak was the same. Conflict brings nothing but sorrow, yet it never disappears from the world.<end>"

["1360184"]
japanese = "大事なものを守りたい者同士が<line-break>相手の大事なものを壊しあい続けるの。<line-break>ねえ！\u3000なにが正しいの？\u3000答えてよ！<end>"
english = "People who want to protect what matters to them keep destroying what matters to each other. Tell me! What's right? Answer me!<end>"

["1360185"]
japanese = "…開け放つもの。<end>"
english = "...The one who sets things free.<end>"

["1360186"]
japanese = "おとぎ話の魔人よ。<line-break>魂と引き替えに心の底のわだかまりを<line-break>開け放ってくれるの…<end>"
english = "The demon from the fairy tale. In exchange for your soul, it sets free everything festering deep inside you...<end>"

["1360187"]
japanese = "もう、何もわからないの。<line-break>何が正しくて、何を正義と呼ぶのか？<line-break>わからないのに…。<line-break>剣を振り続けるなんてできないの。<end>"
english = "I don't understand anything anymore. What's right? What can even be called justice? I don't know... I can't go on wielding my sword without knowing.<end>"

["1360188"]
japanese = "…そして私は<line-break>剣を振り続けることしか<line-break>してこなかったの。<end>"
english = "And all I've ever done is wield my sword.<end>"

["1360189"]
japanese = "おう、<value:$28>、大変だ。<line-break>お前にカルラ将軍から<line-break>出頭命令が来てるぞ。<end>"
english = "Hey, <value:$28>, this is serious. General Karula has ordered you to report in.<end>"

["1360190"]
japanese = "おいおい？<line-break>思い当たるふしはないってかい？<line-break>冗談言うなよ。<line-break>お前ほどの人間なら<line-break>カルラ将軍に目をつけられる理由なんて<line-break>腐るほどあるだろうぜ。<end>"
english = "What, you can't think why? Don't make me laugh. Someone like you must've given General Karula more reasons to keep an eye on you than you can count.<end>"

["1360191"]
japanese = "とにかくロセン総督府に出頭しろってさ。<line-break>総督府は、元王宮のあの建物だ。<line-break>確かに伝えたぜ。<end>"
english = "Anyway, you're to report to the Rocen Governor-General's Office. You know the building―the former royal palace. There, message delivered.<end>"

