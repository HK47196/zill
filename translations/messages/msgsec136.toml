["1360000"]
japanese = "ジラーク、ボリューム６開始<end>"
english = ""

["1360001"]
japanese = "邪竜エルアザル、何百年も前に<line-break>世界を滅亡の危機に追いやったけど<line-break>賢王アルキュオネに倒された…。<end>"
english = "The Evil Dragon Eluazar drove the world to the brink of destruction centuries ago, only to be defeated by Wise King Alcyone...<end>"

["1360002"]
japanese = "知ってる？<line-break>ホントにこいつを倒したのは別の人間。<line-break>忘れられたかわいそうな剣士。<line-break>彼は強大な力を与える代わりに<line-break>世界から存在を忘却の彼方に消し去る<line-break>闇の神器、虚無の剣を抜いたのさ。<end>"
english = "Did you know? It was actually defeated by someone else―a poor swordsman who was forgotten. He drew the Sword of the Void, a dark artifact that grants immense power in exchange for erasing its wielder's very existence from the world.<end>"

["1360003"]
japanese = "忘れられた剣士ミラクの<line-break>失われた伝承など知っている俺を、<line-break>誰だと思っている？<end>"
english = "Who do you think I am? I even know the lost legend of Mirak, the Forgotten Swordsman.<end>"

["1360004"]
japanese = "もとは施文院最強の告死天使。<line-break>今は堕ちて、自分のためだけに<line-break>どんな汚い仕事もこなすケチな悪党…<end>"
english = "Once the mightiest Angel of Death in the Shimon'in. Now fallen, a petty villain who'll do any dirty job for personal gain...<end>"

["1360005"]
japanese = "そんな君がなんでここに来るの？<line-break>ご親切にも、うかつな冒険者に<line-break>この屍竜に近づくなと警告するため？<end>"
english = "So what brings you here? Did you kindly come to warn some careless adventurer not to go near this Corpse Dragon?<end>"

["1360006"]
japanese = "ここには黄泉の乙女像がある。<line-break>ガッポリ賞金のかかったデカイ山だ。<line-break>ケチな小悪党にはぴったりだろう？<end>"
english = "The Statue of the Underworld Maiden is here. It's a big score with a hefty reward attached―perfect for a petty little crook, wouldn't you say?<end>"

["1360007"]
japanese = "フフ。エルファスの呪いの具合はどう？<line-break>ホントはもう歩くのすら困難なはずさ。<line-break>そんな身体で屍竜に挑む気だったの？<end>"
english = "Heh. How is Elfas's curse treating you? You should barely be able to walk by now. Were you really going to take on the Corpse Dragon in that condition?<end>"

["1360008"]
japanese = "違うだろう？<line-break>思い出すため、だろう？<end>"
english = "No, that's not it. You came here to remember, didn't you?<end>"

["1360009"]
japanese = "思い出そうとしていることすら<line-break>思い出せないだろうけど<line-break>僕は知っているよ。<end>"
english = "You probably can't even remember that you're trying to remember. But I know.<end>"

["1360010"]
japanese = "それは忘れてしまった君の願い。<end>"
english = "It's the wish you've forgotten.<end>"

["1360011"]
japanese = "おやおや、またもやおジャマ虫の登場だ。<line-break>霊峰トールのノトゥーン神殿においで。<line-break>そこで話の続きをしよう？\u3000くすくす。<end>"
english = "Oh, my. Another pest has come buzzing in. Come to Notun Temple on Sacred Mount Thor. Let's continue our little talk there, shall we? Hee hee.<end>"

["1360012"]
japanese = "くすくす。<line-break>君の願いはなんなのか？<line-break>それを探りに来てくれたんだね。<end>"
english = "Hee hee. What is it you wish for? You've come to find out, haven't you?<end>"

["1360013"]
japanese = "じゃあまず質問。<line-break>そしてこれは君の願いを知るヒントだよ。<line-break>なんで君はゼネテスが嫌いなの？<end>"
english = "Then let's start with a question. It'll give you a clue to what you truly wish for. Why do you hate Xenetes?<end>"

["1360014"]
japanese = "虫が好かない。<line-break>それだけだ。<line-break>理由などあるものか。<end>"
english = "He rubs me the wrong way. That's all. Why should there be a reason?<end>"

["1360015"]
japanese = "くすっ。理由はあるよ。<line-break>思い出せないだけ。<line-break>じゃあ、次。<end>"
english = "Hee hee. There is a reason. You just can't remember it. Next question.<end>"

["1360016"]
japanese = "なんで君は生きることに執着するの？<line-break>そんなになってまで<line-break>呪いで身体はズタズタだろう？<end>"
english = "Why are you so determined to stay alive? Even like this, with the curse tearing your body apart?<end>"

["1360017"]
japanese = "死よりもつらい痛みが君を襲ってるのに<line-break>君は平気なふりしてまだ生きようとする。<line-break>まるで君が嫌いなゼネテスみたいだ。<end>"
english = "You're in pain worse than death, yet you pretend nothing's wrong and keep struggling to live. Just like that Xenetes you hate so much.<end>"

["1360018"]
japanese = "死ぬのが恐いからさ。<line-break>あいつは関係ない。<end>"
english = "Because I'm afraid to die. He has nothing to do with it.<end>"

["1360019"]
japanese = "ウフフアハハ！\u3000関係あるさあ！<line-break>なんの感情も持たない告死天使の君を<line-break>ここまでにしてくれた彼の影響だよ。<end>"
english = "Ohoho, ahahaha! He has everything to do with it! You're an Angel of Death who once felt nothing at all. He's the reason you've come this far.<end>"

["1360020"]
japanese = "次！\u3000ドンドンいこう！\u3000ねえ？<line-break>君ははるか昔にエルアザルを倒した<line-break>忘れられた剣士に誰の姿を重ねてるの？<end>"
english = "Next! Let's keep them coming! Now, whose face do you see in the Forgotten Swordsman who defeated Eleazar so long ago?<end>"

["1360021"]
japanese = "ねえ？\u3000バロルを倒したネメアは<line-break>どうして世界を救った勇者と<line-break>賞賛されることを嫌がるの？\u3000ねえ？<end>"
english = "Tell me, why does Nemea, who defeated Balor, hate being praised as the Hero who saved the world? Hmm?<end>"

["1360022"]
japanese = "それはネメアめは勇者ではないからだ。<line-break>奴も忘れてはいるが<line-break>真に世界を救った者は別にいる。<end>"
english = "Because that wretch Nemea is no Hero. He may have forgotten it himself, but someone else truly saved the world.<end>"

["1360023"]
japanese = "世界を滅ぼそうとする魔王バロルと<line-break>ネメアの決戦のとき、別の場所で<line-break>世界を救うための戦いがあった。<end>"
english = "While Nemea fought his final battle against Balor, Demon King, who sought to destroy the world, another battle to save it was being fought elsewhere.<end>"

["1360024"]
japanese = "ゼネテス、貴様、そして<line-break>忘れられた大いなるソウルの持ち主は、<line-break> <line-break>姉さんが施した封印を<line-break>破ろうとしていた。<end>"
english = "Xenetes, you, and the forgotten bearer of the great Soul were trying to break the seal my sister had placed.<end>"

["1360025"]
japanese = "その封印こそ、バロルに不死の力を与え<line-break>バロルの精神を操って世界を消そうと<line-break>しむけていた元凶だったからね。<end>"
english = "Because that very seal was the root of it all. It gave Balor immortality, controlled Balor's mind, and drove Balor to erase the world.<end>"

["1360026"]
japanese = "だけど、考えてもごらんよ。<line-break>君らの貧弱な魔力じゃ、とうてい<line-break>イズの封印を解けるはずもない。<line-break>…でも、ひとつだけ手はあったんだ。<line-break>闇の神器の力を借りるって奥の手がね。<end>"
english = "But think about it. With your feeble magic, you could never have broken Iz's seal. There was one way, though: a last resort. You could borrow the power of an Artifact of Darkness.<end>"

["1360027"]
japanese = "あいつは言った。…この虚無の剣を<line-break>大いなるソウルを持つ自分が抜けば<line-break>自分の存在は忘却の彼方へ消え去る。<line-break>だけど大いなるソウルと闇の神器の力で<line-break>この封印を断つことができる。<line-break>自分が好きな世界を救えるんだ、と。<end>"
english = "That's what was said: “If I, the bearer of the great Soul, draw this Sword of the Void, my existence will vanish beyond all memory. But with the power of the great Soul and the Artifact of Darkness, I can cut through this seal. I can save the world I love.”<end>"

["1360028"]
japanese = "君は止めたよね？<line-break>だけど、普段生きることの大切さを<line-break>偉そうに説いてたゼネテスは…。<end>"
english = "You tried to stop it, didn't you? But Xenetes, who was always so self-righteous about how precious life was...<end>"

["1360029"]
japanese = "奴は止めなかった。<line-break>あいつの意志を…大事にする…と言って<line-break>そんな…偽善…俺は…俺は…！<end>"
english = "He didn't try to stop it. Said he would... respect that choice... Such... hypocrisy... I... I...!<end>"

["1360030"]
japanese = "君の痛みはものすごかったんだね。<end>"
english = "You must have been in terrible pain.<end>"

["1360031"]
japanese = "今の君を作ったふたりのうちのひとりが<line-break>そのときしていた悲しい目に<line-break>気づけないほどつらかったんだね。<end>"
english = "So much pain that you never noticed the sorrow in the eyes of one of the two people who made you what you are today.<end>"

["1360032"]
japanese = "そしてツェラシェルは世界が滅ぶとも<line-break>自分の利益のためだけに生きると誓い<line-break>ゼネテスは誰とも組まなくなったとさ。<end>"
english = "And so Zelashell swore to live for nothing but personal gain, even if the world perished, while Xenetes never joined forces with anyone again.<end>"

["1360033"]
japanese = "そして、すべては忘却の彼方…。<line-break>みーんな、その存在を忘れてしまった。<line-break>世界を救うために消滅した者のことを。<line-break>僕だけだよ。この話を覚えていたのは。<end>"
english = "And then everything passed into oblivion... Everyone forgot that person had ever existed―the one who vanished to save the world. I was the only one who remembered this story.<end>"

["1360034"]
japanese = "君が意識下で死を恐れる理由はこれ。<line-break>自分が負った大事な人を失うという傷を<line-break>大事な妹たちに負わせるのが恐いんだ。<end>"
english = "That's why, deep down, you're afraid to die. You're afraid your beloved younger sisters will suffer the same wound you did: losing someone precious to them.<end>"

["1360035"]
japanese = "だけど、エルファスの呪いにより<line-break>君は死のあぎとに捕らえられつつあるよ。<line-break>どうする？<end>"
english = "But Elfas's curse is slowly dragging you into the jaws of death. What will you do?<end>"

["1360036"]
japanese = "君の願いをかなえる答えはひとつだけ。<line-break>ヒントは、闇の神器、虚無の剣。<line-break>僕は知ってる、あれは確実だ。<end>"
english = "There's only one answer that can grant your wish. Here's a hint: the Artifact of Darkness, the Sword of the Void. I know it will work. Without fail.<end>"

["1360037"]
japanese = "使用者のソウルが大きすぎた失敗例が<line-break>たった２件だけあるけど、<line-break>君程度の小悪党ならだいじょうぶ。<end>"
english = "There have only been two failures, both because the user's Soul was too great. A petty villain like you will be fine.<end>"

["1360038"]
japanese = "さ、君の希望はすぐそこだよ？<line-break>思い出しているんだろう？<line-break>おいで、安らかな絶望のほうへ。<end>"
english = "There now. Your hope is right before you. You remember, don't you? Come. Embrace peaceful despair.<end>"

["1360039"]
japanese = "わー、<value:$28>だ。<line-break>なんでも暴力で解決しようって姿勢<line-break>よくないと思うよ？<end>"
english = "Oh, it's <value:$28>. You really shouldn't try to solve everything with violence, you know.<end>"

["1360040"]
japanese = "人はね、ココロがあって生きてるんだ。<line-break>そのココロの底の願いがかなうってのに<line-break>ジャマばっかしてさ。おしおきだよ！<end>"
english = "People live because they have hearts, you know. The wish at the bottom of that heart is about to come true, and all you do is get in the way. Time for your punishment!<end>"

["1360041"]
japanese = "奴なら、行ったよ。<end>"
english = "The one you mean already left.<end>"

["1360042"]
japanese = "なるほど…闇の神器を使って<line-break>逆に封印をほどこしておったか。<end>"
english = "I see... You used an Artifact of Darkness to place a seal on it instead.<end>"

["1360043"]
japanese = "開け放つものである私の力が満ちても<line-break>ウルグ様復活の門が開かないのも道理だ。<line-break>しかし…いつの間に？<end>"
english = "No wonder the gate to Lord Urg's resurrection remained closed, even with my power to open it at its height. But... when did you manage it?<end>"

["1360044"]
japanese = "それは認識しえまい。<line-break>私もこの世界の存在だ。<line-break>この虚無の剣の魔力からは逃れられぬ。<end>"
english = "You could not have perceived it. I, too, am a being of this world. I cannot escape the power of the Sword of the Void.<end>"

["1360045"]
japanese = "…まあよい、闇の門を開け放ち<line-break>幾度となく繰り返されてきた茶番、<line-break>光と闇の戦いの幕をまた開けよう。<end>"
english = "No matter. I shall throw open the Gate of Darkness and raise the curtain once more on that farce repeated through the ages: the battle between Light and Darkness.<end>"

["1360046"]
japanese = "そうはさせん。<line-break>これはあいつがいたという証だ。<end>"
english = "I won't let you. This is proof of that person's existence.<end>"

["1360047"]
japanese = "施文院の秘術か。しかもかなり高度だ。<line-break>これを使える者がこの時代にも<line-break>まだいたとはな。<line-break>いや、きれいに一撃をもらったよ。<line-break>本来なら魔人の生という永遠の怠惰から<line-break>私は解放されていたことだろう。<end>"
english = "A secret art of the Shi Monastery? And a highly advanced one at that. I never imagined anyone in this age could still wield it. I must admit, that was a clean hit. Ordinarily, it would have freed me from the eternal indolence of a demon's existence.<end>"

["1360048"]
japanese = "しかしどうしたことだ。<line-break>その肉体の衰えは<line-break>まるで死体だ。技の威力も皆無だな。<end>"
english = "But what has happened to you? That body has withered to the state of a corpse, and your technique has lost all its power.<end>"

["1360049"]
japanese = "そこらのザコならいざ知らず<line-break>破壊神ウルグの円卓騎士筆頭<line-break>ヴァシュタールを倒すには不足だ。<end>"
english = "That might suffice against common rabble, but not against Vashtar, foremost among the Knights of the Round Table serving Urg, God of Destruction.<end>"

["1360050"]
japanese = "兄さん！<end>"
english = "Brother!<end>"

["1360051"]
japanese = "ザコがもう２匹。<end>"
english = "Two more weaklings.<end>"

["1360052"]
japanese = "ぐっ！<line-break>動けない！<end>"
english = "Ghh! I can't move!<end>"

["1360053"]
japanese = "ほほう、貴様も消えたがっているのか。<line-break>この２匹の女どもに、心の痛みを<line-break>与えぬため、という理由はくだらんが。<end>"
english = "Oh? So you wish to disappear as well. Though wanting to spare these two women the pain is a pitiful reason.<end>"

["1360054"]
japanese = "それなら虚無の剣を使うまでもないな。<line-break>私が貴様の前にこの女どもを始末しよう。<line-break>そうすれば痛むべき心もなくなる。<end>"
english = "Then there is no need for the Sword of the Void. I shall dispose of these women before your eyes. Then there will be no heart left to ache.<end>"

["1360055"]
japanese = "やめろ！！<end>"
english = "Stop!!<end>"

["1360056"]
japanese = "<value:$28>！<line-break>お前まで、どうしてここに！<line-break>危険だ！\u3000逃げろ！<end>"
english = "<value:$28>! Why are you here too? It's dangerous! Run!<end>"

["1360057"]
japanese = "フッ。またザコかと思えば<line-break>無限のソウルの持ち主ではないか。<line-break>そうか、今回の茶番の主役は貴様か。<line-break>あるいは、貴様なら<line-break>この永遠に繰り返される輪廻に<line-break>終止符を打ってくれるのかな？<end>"
english = "Hmph. I took you for more rabble, but you possess the Infinite Soul. So you are the protagonist of this farce. Perhaps you might even bring this eternally recurring cycle to an end.<end>"

["1360058"]
japanese = "まあいい<line-break>時間は限りなくある。<line-break>退屈しのぎに試してみてもいいだろう。<line-break>いくぞ、<value:$28>とやら。<end>"
english = "Very well. I have all the time in the world. You may prove an amusing diversion. Come, <value:$28>, or whatever your name is.<end>"

["1360059"]
japanese = "今回の茶番の主人公は<line-break>別の人間に務めてもらうのだな。<line-break>どうせ代役は用意されているのだろう？<end>"
english = "It seems another human will have to play the lead in this farce. There is a replacement waiting in the wings anyway, is there not?<end>"

["1360060"]
japanese = "茶番、茶番とうるさいんだよ。<line-break>人間の生き様は、かけがえのない<line-break>それぞれに尊いもんなんだ！<end>"
english = "Enough about your damned farce! Every human life is unique and precious in its own right!<end>"

["1360061"]
japanese = "その気…<line-break>貴様、さっきの戦いの間に<line-break>虚無の剣を盗みおったか？<end>"
english = "That aura... Did you steal the Sword of the Void during the battle just now?<end>"

["1360062"]
japanese = "生きるのに飽き飽きしてる？<line-break>消えたい？<line-break>上等だ。消してやるぜ！<end>"
english = "Sick of living? Want to disappear? Fine. I'll wipe you out!<end>"

["1360063"]
japanese = "やめて、お兄ちゃん！<line-break>虚無の剣を抜かないで！<end>"
english = "No, Brother! Don't draw the Sword of the Void!<end>"

["1360064"]
japanese = "俺は、俺はもっと生きたかったぜ！<line-break>今は言える！\u3000もっと、もっと<line-break><value:$28>と…いっしょに…！<end>"
english = "I... I wanted to live longer! I can say it now! I wanted more time―much more time―with <value:$28>...!<end>"

["1360065"]
japanese = "私…たち…<line-break>どうしてこんなところに…<line-break>いるの…？<end>"
english = "Why... are we... in a place like this...?<end>"

["1360066"]
japanese = "<value:$28>は<line-break>虚無の剣を手に入れた。<end>"
english = ""

["1360067"]
japanese = "そうよ、たぶんそれよ。<line-break>ええと…、闇の神器…の…剣。<line-break>その探索でここに来たのよ。<end>"
english = "Yes, that must be it. Um... the sword... one of the Artifacts of Darkness. We came here looking for it.<end>"

["1360068"]
japanese = "じゃ、旅を続けよっか。<line-break>お兄ちゃん！<end>"
english = "Okay, let's keep going, Brother!<end>"

["1360069"]
japanese = "あ…。<line-break>なんでお兄ちゃんなんて呼んだんだろ。<line-break><value:$28>は女の子なのにね。<end>"
english = "Oh... Why did I call you Brother? You're a girl, <value:$28>.<end>"

["1360070"]
japanese = "それに<line-break>私たちは天涯孤独、ふたりっきり。<line-break>兄なんていないでしょう、ヴィア。<end>"
english = "Besides, we have no one in the world but each other. We don't have a brother, Via.<end>"

["1360071"]
japanese = "そうだよね。<line-break>どうしたんだろ。ヘンだよ。<line-break>さっきから頭がボーっとしてて。<end>"
english = "You're right. What's wrong with me? This is strange. My head's been all foggy for a while.<end>"

["1360072"]
japanese = "どうなさったのですか<line-break><value:$28>様。<end>"
english = "Is something wrong, <value:$28>?<end>"

["1360073"]
japanese = "…私も同じだ。<end>"
english = "I feel it too.<end>"

["1360074"]
japanese = "ええ。<line-break>私も何か心に穴が開いたような、<line-break>そんな気がします。<end>"
english = "Yes. I feel as though there's a hole in my heart too.<end>"

["1360075"]
japanese = "旅にご一緒させていただくときは<line-break>いつも通り猫屋敷で呼び出していただく<line-break>…ということですね。了解です。<end>"
english = "So whenever you wish me to join you on your journey, you will summon me at Cat Manor as usual. Understood.<end>"

["1360076"]
japanese = "それでは<value:$28>様<line-break>失礼させていただきます。<end>"
english = "Then I shall take my leave, <value:$28>.<end>"

["1360077"]
japanese = "なるほど、退屈しのぎにはなった。<line-break>だが、私の存在を消すには<line-break>どうにも力不足のようだ。<end>"
english = "I see. You did relieve my boredom. But it seems you still lack the power to erase my existence.<end>"

["1360078"]
japanese = "あー、ズルいー！<line-break>またお兄ちゃんとふたりっきりで！<line-break>交代してよ、ヴァイ！<end>"
english = "Hey, that's not fair! You get to be alone with Big Brother again! Switch with me, Vai!<end>"

["1360079"]
japanese = "<value:$28>様、妹のわがまま、<line-break>まことに申しわけございませんが<line-break>聞いていただけませんでしょうか。<end>"
english = "<value:$28>, I sincerely apologize for my younger sister's selfish request, but might I ask you to indulge her?<end>"

["1360080"]
japanese = "ありがとうございます。<line-break>では、失礼いたします<line-break><value:$28>様<end>"
