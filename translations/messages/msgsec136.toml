><equal>193Something seems wrong. What did you do to Zagiv?<end><if><value:$01><equal>194Zophor... So at last you have trapped Zagiv in the jaws of darkness.<end><if><value:$01><equal>191Something's wrong with her. What did you do?<end><if><value:$01><equal>190Something's wrong. Did you do something to Zagiv?<end>So this is the birth of Dingal's new emperor. I've witnessed history again... Wait, this is no time for that.<end>"

