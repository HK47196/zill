["1690000"]
japanese = "ノーブルメッセージｖ１用開始<end>"
english = ""

["1690001"]
japanese = "新しい領主様は、<line-break>どのようなお方なのだろう…。<line-break>一度も見たことがないのだよ。\u3000\u3000<end>"
english = "I wonder what our new ruler is like... I've never even caught a glimpse.<end>"

["1690002"]
japanese = "悪代官のボルボラがいなくなって、<line-break>この町にも平和が戻りました。<line-break>みんなで勝ちとった平和です。<end>"
english = "With that corrupt magistrate Bolbora gone, peace has returned to our town. We all won this peace together.<end>"

["1690003"]
japanese = "新しい領主様は、<line-break>特に何もしてくださらないけど<line-break>領民を苦しめたりしないからいいわ。\u3000<end>"
english = "Our new lord may not do much for us, but at least the people aren't made to suffer.<end>"

["1690004"]
japanese = "新たなノーブルはいかがかしら。<line-break>ボルボラに怯えながら暮らしていたのが<line-break>ウソみたいでしょう？<end>"
english = "How do you like the new Noble? It's hard to believe we used to live in fear of Bolbora, isn't it?<end>"

["1690005"]
japanese = "ボルボラがいなくなったから、<line-break>パパもママも笑うようになったんだ。<line-break>だから毎日たのしーんだ。<line-break>今日もいい子になったリルビーに<line-break>遊んでもらおっと！<end>"
english = "Now that Bolbora's gone, Mom and Dad smile again. That means every day's so much fun! And today, I'll have Lilby, who's a good kid now, play with me again!<end>"

["1690006"]
japanese = "ボルボラがいなくなったから、<line-break>よその人と話してもいいって<line-break>ママが言ったんだ。だ・か・ら…\u3000\u3000<line-break>ノーブルの町へ<line-break>ようこそ！<line-break>…なんちゃって。<end>"
english = "Now that Bolbora's gone, Mom says I'm allowed to talk to strangers. Sooo... welcome to the town of Noble! Just kidding.<end>"

["1690007"]
japanese = "ぼくはボルボラの手下として、<line-break>町の人にひどいことをしてました。<line-break>今はとーっても深く反省してますです。<line-break>世の中に悪が栄えたためしなしって<line-break>言いますが、本当なんですね。<end>"
english = "I did terrible things to the townspeople as one of Bolbora's lackeys. I'm ever so very deeply sorry now, yes I am. They say evil never prospers, and it really is true.<end>"

["1690008"]
japanese = "えへへへ…、ノーブルはいい町でしょ。<line-break>悪い代官ボルボラがいなくなったから<line-break>ボクいい子になりました。<end>"
english = "Heh heh heh... Noble's a nice town, isn't it? Now that the wicked magistrate Bolbora is gone, I'm a good kid.<end>"

["1690009"]
japanese = "ボルボラのかわりに新しい領主様が<line-break>決まってね、あたしはどんな人か<line-break>知らないけど、悪い人じゃないんだろうね。\u3000<end>"
english = "A new lord's been chosen to replace Bolbora. I don't know what sort of person was chosen, but probably no one bad.<end>"

["1690010"]
japanese = "ノーブルはね、長いことボルボラの悪行に\u3000\u3000<line-break>苦しめられてきたんだよ。<line-break>でも、今は平和ないい町さね。<line-break>この平和は、あたしたちがボルボラを<line-break>追い出すことによって勝ち取ったんだよ。<line-break>もっともレムオン様の手助けもあったけどね。<end>"
english = "Noble suffered for years because of all the terrible things Bolbora did. But now it's a good, peaceful town. We won this peace by driving Bolbora out ourselves. Mind you, we did have Lemghon's help.<end>"

["1690011"]
japanese = "あたし、逃げ回ってるわけじゃないの。<line-break>今までがまんしてたから、いろんな人と<line-break>お話しできるのがうれしくて、うれしくて…。<line-break>あなたも外の世界のできごとや<line-break>あたしの知らないことをたくさん教えてね。<end>"
english = "I'm not running away. I've been holding back all this time, so being able to talk to all kinds of people makes me so, so happy... Tell me lots of things too, okay? About what's happening in the outside world, and all the things I don't know.<end>"

["1690012"]
japanese = "もう、ビクビクしなくていいの。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>だから、話しかけられないように<line-break>逃げ回らなくていいんだわ。<end>"
english = "I don't have to be afraid anymore. So I don't have to keep running away to stop people from talking to me.<end>"

["1690013"]
japanese = "悪名高いボルボラに代わって、<line-break>この地を治めることになった<line-break>ノーブル伯のことはご存知ですかな？\u3000\u3000<line-break>ロストールで聞いた噂では、<line-break>先代エリエナイ公の隠し子とか…。<line-break>あくまで噂ですがね。<end>"
english = "Have you heard of the Count of Noble, who has taken over the rule of these lands from the notorious Bolbora? Rumor in Rostorl has it that the count is an illegitimate child of the previous Duke Elienai... But it is only a rumor, of course.<end>"

["1690014"]
japanese = "ボルボラがいなくなって、<line-break>この町もずいぶん活気が出てきましたな。<line-break>昔は雰囲気が暗い町だったのですよ。<line-break>今は昔の悪夢を振り払うみたいに、<line-break>明るくなっています。<end>"
english = "With Bolbora gone, this town has really come alive. It used to be such a gloomy place. Now it seems to be brightening up, as though it were shaking off the nightmare of the past.<end>"

["1690015"]
japanese = "あの日、町の奴らは、<line-break>ボルボラに立ち向かって行ったが\u3000\u3000\u3000\u3000\u3000<line-break>俺はできなかった…。<line-break>もちろん爺さんの意見が正しいと<line-break>思ったのも事実だ！<line-break>でも、ほんとうは勇気がないだけなんだ…。<end>"
english = "That day, the townspeople went to face Bolbora, but I couldn't... It's true―I did think my grandfather was right! But the truth is, I just didn't have the courage...<end>"

["1690016"]
japanese = "あんた冒険者かい…。<line-break>俺をひとりにしておいてくれよ。\u3000\u3000\u3000\u3000\u3000<line-break>頼むよ…。<end>"
english = "Are you an adventurer...? Just leave me alone. Please...<end>"

["1690017"]
japanese = "新しい領主様がボルボラのような\u3000\u3000\u3000<line-break>悪人でも、我々は負けませんよ。<line-break>もう泣き寝入りはしませんから。<end>"
english = "Even if our new lord is as wicked as Bolbora, we won't be beaten. We won't suffer in silence anymore.<end>"

["1690018"]
japanese = "もう、ボルボラのモンスターに<line-break>怯える必要もありません。<line-break>重税をとられ苦しむこともありません。<line-break>我々の勇気と団結力が勝利したのです。<line-break>ああ、言いたいことを言える生活、<line-break>なんとすばらしいものなのか！<end>"
english = "We no longer have to fear Bolbora's monsters, or suffer under crushing taxes. Our courage and unity have won the day. Ah, how wonderful it is to live where we can speak our minds!<end>"

["1690019"]
japanese = "これはこれはご主人様、<line-break>お帰りなさいませ。<line-break>さ、さ、どうぞ、お入りください。<end>"
english = "Why, Master! Welcome home. Please, come right in.<end>"

