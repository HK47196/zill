["1580000"]
japanese = "<if><value:$33><equal>%0アイリーンお姉ちゃんはね、<line-break>とってもつよいけど、とってもやさしいんだ。<line-break>あたし、お姉ちゃんだーい好き。<end><if><value:$23><equal>%2あっ！\u3000<value:$28>お兄ちゃんだぁ。<line-break>おかえりなさぁい。<end><select><value:$20>%1ここにはねえ、アイリーンっていう\u3000\u3000\u3000\u3000<line-break>つよーいお姉ちゃんがいたんだよぉ。<line-break>とってもつよくて、やさしかったんだぁ。<line-break>でもね、今はね、ここには、いないよぉ。<line-break>ロストールで、女はきしになれないって<line-break>たびにでちゃったんだよぉ。<end>"
english = "<if><value:$33><equal>%0Irene's really strong, but she's really kind, too. I just love her!<end><if><value:$23><equal>%2Oh! It's you, <value:$28>! Welcome home!<end><select><value:$20>%1There used to be a really strong girl here named Irene. She was very strong and kind. But she isn't here anymore. She left on a journey because women aren't allowed to become knights in Rostorl.<end>"

["1580001"]
japanese = "<if><value:$33><equal>%0<if><value:$23><not-equal>2ここの道場のオッシさんには<line-break>怪物退治やら、橋の修理やら、悪人退治やら、\u3000<line-break>本当にお世話になってます。<line-break>騎士団は貴族のことだけで手一杯で<line-break>平民のことなんてほったらかしです。<line-break>オッシさんがいてくれないとどうなることやら。<end><if><value:$33><equal>%0あら、<value:$28>くんじゃない。<line-break>修行のほうは進んでる？<line-break>オッシさんをめざしてがんばんなさい。<end><if><value:$33><equal>%1<if><value:$23><not-equal>2ここの道場のオッシさんには<line-break>怪物退治やら、橋の修理やら、悪人退治やら、\u3000<line-break>本当にお世話になってます。<line-break>騎士団は貴族のことだけで手一杯で<line-break>平民のことなんてほったらかしです。<line-break>オッシさんがいてくれないとどうなることやら。<end><if><value:$33><equal>%1あら、<value:$28>くん、<line-break>おかえりなさい。<line-break>元気そうでよかったわ。<end><if><value:$33><equal>%2<if><value:$23><not-equal>2スラムでは、たちの悪い貴族がモンスターを\u3000<line-break>放し飼いにして人々を襲わせたりと、<line-break>やりたい放題をしているそうですよ。<line-break>もし、ここの道場のオッシさんがいなければ、<line-break>悪い貴族はここにも来ていたかもしれません。<line-break>うちの子が無事なのもオッシさんのおかげですよ。<end><if><value:$33><equal>%2あら、<value:$28>くん、<line-break>おかえりなさい。<line-break>聖杯探しは順調に進んでる？<end><if><value:$33><equal>%3<if><value:$23><not-equal>2アイリーンという名のほんとに活発な女の子、<line-break>年齢はあなたと同じくらいなんですけど、<line-break>どこかで会ったことはありませんか？<line-break>女の子ながらオッシ道場でも１、２を争う<line-break>腕の持ち主で、騎士になるといって旅に<line-break>出たきり何の連絡もないんです。<end><if><value:$33><equal>%3あら、<value:$28>くん、<line-break>おかえりなさい。<line-break>アイリーンちゃんは元気にしてる？<end><if><value:$33><equal>%4<if><value:$23><not-equal>2オッシさんは突然フラッとやってきて<line-break>あの家に道場なんか開くから、最初は<line-break>周りから煙たがられていたんですよ。<line-break>でも、あの人柄だからすぐにとけ込ん<line-break>じゃって。今ではここにいなくては<line-break>ならない人になっていますわ。<end><if><value:$33><equal>%4あら、<value:$28>くん、<line-break>すこしたくましくなったんじゃない？<line-break>オッシさんも喜ぶんじゃないかしら。<end><if><value:$33><equal>%5<if><value:$23><not-equal>2リベルダムはカルラ将軍に破壊されたとか…。<line-break>ロストールもそんなことになってしまったら、<line-break>私たち一家はどうすればいいのでしょうか？<end><if><value:$33><equal>%5リベルダムはカルラ将軍に破壊されたそうね。<line-break>ロストールもそんなことになってしまったら、<line-break>私たち一家はどうすればいいの？<end><if><value:$33><equal>%6<if><value:$23><not-equal>2ディンガルのカルラ将軍の部下に<line-break>アイリーンという女騎士がいるそうなのです。<line-break>もしかしてアイリーンちゃんなのでしょうか…。<end><if><value:$33><equal>%6ディンガルのカルラ将軍の部下に<line-break>アイリーンという女騎士がいるらしいのよ。<line-break><value:$28>くん、何か知ってないの？<end><if><value:$33><equal>%7あの、やさしかったアイリーンちゃんが、<line-break>どうしてカルラなんかの部下に…。<end>"
english = "<if><value:$33><equal>%0<if><value:$23><not-equal>2We owe Ossi so much. He runs the training hall here, and he does everything from hunting monsters and repairing bridges to dealing with criminals. The knights are so busy looking after the nobility that they leave the commoners to fend for themselves. I don't know what we'd do without Ossi.<end><if><value:$33><equal>%0Why, if it isn't <value:$28>. How is your training going? Keep at it and aim to follow in Ossi's footsteps.<end><if><value:$33><equal>%1<if><value:$23><not-equal>2We owe Ossi so much. He runs the training hall here, and he does everything from hunting monsters and repairing bridges to dealing with criminals. The knights are so busy looking after the nobility that they leave the commoners to fend for themselves. I don't know what we'd do without Ossi.<end><if><value:$33><equal>%1Oh, <value:$28>! Welcome home. I'm glad to see you looking well.<end><if><value:$33><equal>%2<if><value:$23><not-equal>2I hear some truly vicious nobles in the Slums are letting monsters run loose and making them attack people. They do whatever they please. If Ossi weren't here, those wicked nobles might have come here as well. It's thanks to him that my child is safe.<end><if><value:$33><equal>%2Oh, <value:$28>! Welcome home. Is the search for the Grail going well?<end><if><value:$33><equal>%3<if><value:$23><not-equal>2Have you met a very lively girl named Irene anywhere? She's about your age. Even though she's a girl, she's one of the two best fighters at Ossi's training hall. She set out saying she would become a knight, and we haven't heard a word from her since.<end><if><value:$33><equal>%3Oh, <value:$28>! Welcome home. Is Irene doing well?<end><if><value:$33><equal>%4<if><value:$23><not-equal>2Ossi wandered in out of nowhere and opened a training hall in that house, so the neighbors didn't take kindly to him at first. But being the sort of man he is, he soon fit right in. Now we couldn't do without him.<end><if><value:$33><equal>%4Why, <value:$28>, haven't you grown a little sturdier? I expect Ossi will be pleased.<end><if><value:$33><equal>%5<if><value:$23><not-equal>2They say General Karula destroyed Liberdam. If the same thing happened to Rostorl, what would become of our family?<end><if><value:$33><equal>%5I hear General Karula destroyed Liberdam. If the same thing happened to Rostorl, what would become of our family?<end><if><value:$33><equal>%6<if><value:$23><not-equal>2I hear there is a woman knight named Irene serving under General Karula of Dyneskal. Could it possibly be our Irene?<end><if><value:$33><equal>%6Apparently, a woman knight named Irene serves under General Karula of Dyneskal. <value:$28>, don't you know anything about it?<end><if><value:$33><equal>%7How could sweet, kind Irene have ended up serving someone like Karula...?<end>"

["1580002"]
japanese = "<if><value:$2C><less-equal>%9オッシ先生は酒癖は悪いが<line-break>面倒見がよく、実は手先も小器用だったりして<line-break>本当に頼りになるお方だ。<line-break>右腕を痛めていらっしゃるようだが、<line-break>それさえなければ、リベルダムの闘技場でも<line-break>チャンプになれる実力の持ち主なのだ。<end><if><value:$2C><less-equal>%29力を求め強くなることの先に何があるのか、<line-break>何のために強くなるのか、そんなことを<line-break>自問自答しながら修行に励んでいるのだ。<line-break>これもオッシ先生の教えのたまものだよ。<line-break>先生は強いだけでなくて考え方も<line-break>しっかりしたお方なのだ。<end><if><value:$2C><less-equal>%49君は数多くの経験を積み、その強さは<line-break>オッシ先生を超えているかもしれない。<line-break>だが、オッシ先生の崇高さには及ばないな。<end>君には強さという力がある。<line-break>それを何に使うべきなのか、<line-break>よく考えてみたまえ。<end>"
english = "<if><value:$2C><less-equal>%9Master Ossi may be a troublesome drunk, but he looks after people, and he's surprisingly handy as well. He's a truly dependable man. He seems to have injured his right arm, but if not for that, he would have the skill to become champion of the arena in Liberdam.<end><if><value:$2C><less-equal>%29As I train, I keep asking myself what lies beyond the pursuit of power and why I seek strength at all. I owe that to Master Ossi's teaching. He isn't merely strong; he is a man of sound principles.<end><if><value:$2C><less-equal>%49You have gained a wealth of experience, and your strength may even surpass Master Ossi's. But you still fall short of his nobility.<end>You have strength. Think carefully about what you ought to use it for.<end>"

["1580003"]
japanese = "<if><value:$23><equal>2<if><value:$33><equal>%0おう、<value:$28>じゃないっすか。<line-break>お互いがんばって修行して<line-break>オッシ先生をめざすっすぅ！<end><if><value:$2A><less-equal>%49オッシ先生は本当にスバラシっ！<line-break>俺、先生を尊敬してるっす。<line-break>どこまでもついていくっす！<line-break>オッシ先生っ、<line-break>アイリーンが抜けた穴は<line-break>俺に任せてくださいっすぅ！<end><if><value:$2A><less-equal>%100<if><value:$23><equal>2おや、<value:$28>じゃないっすか。\u3000\u3000<line-break>最近、少し名前を聞くようになったっす。<line-break>なんだか、かっこいいっすよ。<line-break>でも、俺も負けてないっす。<line-break>オッシ先生のもとで修行に励んで<line-break>いまにロストールで一番の剣士になるっすよ。<end><if><value:$2A><less-equal>%100あなた最近少し有名になってきた冒険者の\u3000\u3000\u3000<line-break><value:$28>さんじゃないっすか。<line-break>その若さで有名人なんてかっこいいっす。<line-break>でも、俺も負けてないっす。<line-break>オッシ先生のもとで修行に励んで<line-break>いまにロストールで一番の剣士になるっすよ。<end><if><value:$2A><less-equal>%130厳しい修行に耐えて、だいぶ強くなったっす。<line-break>でもロストールで一番には、まだまだっす。<line-break>俺も<value:$2B>って呼ばれたいっす！<end>うひょ、<value:$28>さんじゃないっすか！<line-break>大陸で一番の冒険者になっても、こうして<line-break>会いに来てくれるなんて感激っす！<end>"
english = "<if><value:$23><equal>2<if><value:$33><equal>%0Hey, isn't that <value:$28>? Let's both train hard and try to be like Master Ossi!<end><if><value:$2A><less-equal>%49Master Ossi is amazing! I really look up to him. I'd follow him anywhere! Master Ossi, leave it to me to fill the gap Irene left behind!<end><if><value:$2A><less-equal>%100<if><value:$23><equal>2Hey, isn't that <value:$28>? I've been hearing your name around lately. That's pretty impressive. But I'm not about to lose! I'll keep training under Master Ossi, and before long I'll be the finest swordsman in Rostorl!<end><if><value:$2A><less-equal>%100Aren't you <value:$28>, the adventurer who's been making a name lately? Being famous at your age is pretty impressive. But I'm not about to lose! I'll keep training under Master Ossi, and before long I'll be the finest swordsman in Rostorl!<end><if><value:$2A><less-equal>%130I've endured some grueling training, and I've gotten a lot stronger. But I'm still a long way from being the best in Rostorl. I want people to call me <value:$2B>, too!<end>Whoa, <value:$28>! Even after becoming the greatest adventurer on the continent, you still came to see me. I'm thrilled!<end>"

["1580004"]
japanese = "<if><value:$2A><less-equal>%49へっ、貴族の奴らは、俺ら貧乏人を\u3000\u3000\u3000\u3000<line-break>人間だとは思っちゃあいないのさ。<line-break>特に七竜家の１つリューガ家のタルテュバはな。<line-break>タルテュバの奴、何かむかつくことがあると<line-break>ごろつきを連れてきちゃあ、気晴らしに<line-break>スラムのみんなに乱暴を働きやがる。<end><if><value:$2A><less-equal>%100貴族の奴ら、運よく貴族の子として生まれた\u3000<line-break>だけの能なし野郎のくせにいばりやがって。<line-break>貴族なんてのは国が滅べばただの人なんだよ。<line-break>七竜士が世界を救った英雄なんてウソっぱちだ。<line-break>くだらん貴族制度を導入して、自分の子孫を<line-break>ぶくぶくと太らしているだけじゃないか。<end><if><value:$2A><less-equal>%130あんた、<value:$28>だろ？<line-break>ただの平民から、今じゃ大陸で３本の指に入る<line-break>冒険者なんだってな。尊敬するぜ。<end>あんたを見てると、貴族制度を愚痴っている<line-break>自分が恥ずかしくなってよ。<line-break>俺も生きる努力ってのをしてみるぜ。<end>"
english = "<if><value:$2A><less-equal>%49Hah. The nobles don't even think of poor folk like us as human, especially Tartuba of House Ryuga, one of the Seven Dragon Houses. Whenever something puts him in a foul mood, he brings a gang of thugs down here and takes it out on everyone in the Slums.<end><if><value:$2A><less-equal>%100Those nobles are useless bastards who just happened to be born into noble families, yet they strut around as if they're better than us. If their country fell, they'd be ordinary people like anyone else. That tale about the Seven Dragon Knights being heroes who saved the world is a pack of lies. They brought in this rotten aristocracy just to fatten up their own descendants.<end><if><value:$2A><less-equal>%130You're <value:$28>, right? They say you started as an ordinary commoner, and now you're one of the three greatest adventurers on the continent. You have my respect.<end>Looking at you makes me ashamed of sitting around complaining about the aristocracy. I'm going to make an effort to do something with my life, too.<end>"

["1580005"]
japanese = "<select><value:$33>そりゃ、ロストールは身分がすべてさ。<line-break>だからってウジウジしてんのはゴメンだよ。<line-break>それよりゃ、笑って、働いて、遊ぶ方がいい。\u3000<line-break>それでも気に入らなけりゃ、<line-break>でっかいことしてひっくり返すのさ。<line-break>…って、全部ゼネさんの受け売りなんだけどさ。<end>そりゃ、ロストールは身分がすべてさ。<line-break>だからってウジウジしてんのはゴメンだよ。<line-break>それよりゃ、笑って、働いて、遊ぶ方がいい。\u3000<line-break>それでも気に入らなけりゃ、<line-break>でっかいことしてひっくり返すのさ。<line-break>…って、全部ゼネさんの受け売りなんだけどさ。<end>あんた冒険者ならゼネテスって知っているだろ。<line-break>一見だらしない酒好きの男だけど、あたしらに<line-break>とっちゃ頼もしい味方だよ。いい男だしねぇ。<line-break>世間じゃ勇者ネメアが皇帝になったなんて<line-break>騒いでいるけど勇者がなんだっていうんだい。<line-break>ゼネさんのほうがいい男に決まってるよ。<end>確かに生活は貧しいけどつらくはないさね。\u3000\u3000<line-break>人生は泣いて笑って楽しむものだって気づいた<line-break>からねぇ。子供たちも立派に育ってくれたし。<line-break>上の２人はディンガルとリベルダムで船員として<line-break>働いているよ。末っ子はロストールで一番の<line-break>剣士になるってオッシ道場で修行中だよ。<end>このロストールを救ってくれたのが、<line-break>我らのヒーロー、ゼネさんだよ。<line-break>それにくらべてタルテュバは男のクズだね。<end>リベルダムで働いている息子かい？<line-break>もちろん無事にリベルダムを脱出したさね。<line-break>海と船がある限り仕事はなくならないとさ。<end>カルラが攻めてきたって、あたしゃ恐くないね。<line-break>もちろん、ゼネさんが必ず守ってくれるって<line-break>信じているからさ。<end>エルファス様の話を聞いていると、<line-break>あの人が救世主って呼ばれている理由が<line-break>わかるような気がするよ。<end>"
english = "<select><value:$33>Sure, status is everything in Rostorl. But that doesn't mean I'm going to mope about it. I'd rather laugh, work, and enjoy myself. And if I still can't stand it, I'll do something big and turn the whole thing on its head. Though I'm only repeating what Xene always says.<end>Sure, status is everything in Rostorl. But that doesn't mean I'm going to mope about it. I'd rather laugh, work, and enjoy myself. And if I still can't stand it, I'll do something big and turn the whole thing on its head. Though I'm only repeating what Xene always says.<end>You're an adventurer, so you know Xenetes, don't you? At first glance he looks sloppy and drinks too much, but to us he's a dependable ally. And a fine-looking man, too. Everyone's making a fuss about the Hero Nemea becoming emperor, but who cares if he's a hero? Xene's the better man, no question.<end>We may be poor, but life isn't miserable. I've learned that life is about crying, laughing, and enjoying yourself. My children have all grown up well, too. The two eldest work as sailors in Dyneskal and Liberdam. The youngest is training at Ossi's hall, determined to become the finest swordsman in Rostorl.<end>It was our hero Xene who saved Rostorl. Tartuba, on the other hand, is scum.<end>My son who works in Liberdam? Of course he escaped safely. He says that as long as there are seas and ships, there'll always be work.<end>I'm not afraid of Karula attacking. Of course, that's because I trust Xene to protect us.<end>When I listen to Elfas speak, I think I understand why people call him the Savior.<end>"

["1580006"]
japanese = "<select><value:$20>%2エンシャントのギルドにいる謎の冒険者に<line-break>のせられて、ついつい何度も挑戦してたら<line-break>所持金がなくなっちまった…トホホ。<end>楽して稼ごうなんて考えちゃだめだね。<line-break>エンシャントのギルドにある魔法の箱…<line-break>あれは悪魔の箱だよ。<end>"
english = "<select><value:$20>%2The Mysterious Adventurer at the Guild in Ancient egged me on, and before I knew it, I'd tried so many times that I'd lost every coin I had. What a disaster.<end>You should never expect to make easy money. That magic box at the Guild in Ancient... it's a devil's box.<end>"

["1580007"]
japanese = "<select><value:$33>♪おれっち、ボルダン～。<line-break>♪力がすべて～<line-break>♪戦いが大好きだ～！<line-break>♪でーもー、おれっちは～<line-break>♪うまい料理と～<line-break>♪酒も～大好きだ～！<end>♪ボルダンはな～強くなけりゃ～、<line-break>♪一人前と認められないんだ～よ～。<line-break>♪だから戦士になりたがる～のさ～…、ひっく。<end>♪燃えさ～かる命の炎～<line-break>♪ボルダ～ンの炎は輝き激し～い<line-break>♪命みじか～し戦え～激しく～。<end>♪ボ、ボ、ボ、ボ、ボルダ～ン<line-break>♪格闘大好きボルダ～ン<line-break>♪ドワーフ戦士と戦ってみ～た～い～。<end>♪アンギルダンは赤鎧～<line-break>♪ディンガル軍は黒鎧～<line-break>♪おれっちボルダン肉鎧～、つよいぞー。<end>♪破滅の槍はネメアがもって～<line-break>♪王者レーグは剛刃に閃刃～<line-break>♪将軍カルラはカマつかい～。<end>♪おれっちボ～ルダ～ン<line-break>♪強い女が大！\u3000大！\u3000大！\u3000大好きだ～<line-break>♪愛しのカルラと戦いた～い。<end>♪ゼネテス、ネメアが強くとも～<line-break>♪王者レーグにゃかなうまい～<line-break>♪おいらもレーグにゃかなわない～。<end>"
english = "<select><value:$33>♪I'm Boldan! ♪Strength is everything! ♪Oh, how I love to fight! ♪But I also love ♪good food ♪and plenty of drink!<end>♪Boldan's no real man unless he's strong! ♪That's why he wants to be a warrior... Hic!<end>♪The flames of life burn bright! ♪Boldan's flame blazes fierce and brilliant! ♪Life is short, so fight with all your might!<end>♪B-B-B-B-Boldan! ♪Boldan loves hand-to-hand fighting! ♪I'd love to fight a Dwarf warrior!<end>♪Angeerdan wears red armor! ♪The Dyneskal Army wears black! ♪But I, Boldan, wear armor of flesh! I'm strong!<end>♪Nemea bears the Spear of Ruin! ♪Champion Reig has the Mighty Blade and Flash Blade! ♪General Karula fights with a sickle!<end>♪I am Boldan! ♪I love, love, love, love strong women! ♪I want to fight my darling Karula!<end>♪Xenetes and Nemea may be strong, ♪but they can't match Champion Reig! ♪And I can't match Reig either!<end>"

["1580008"]
japanese = "<if><value:$2C><less-equal>%9うい～、最近の若いもんは自分の身の程も\u3000\u3000\u3000<line-break>知らずに危険なことばかりしおる。<line-break>目立てばええっちゅうもんじゃないじゃろが。<line-break>自分のレベルに合った場所で地道に宝を<line-break>探すのが一番なんじゃ、ひっく…。<line-break>冒険初心者には飢えた者の迷宮がええんじゃい。<end><if><value:$2C><less-equal>%29なんじゃいなんじゃい、ちょっと強くなった<line-break>くらいで城塞都市跡を探検するんじゃないわい。<line-break>最近の冒険者は命を粗末にしすぎるぞ、ひっく。<line-break>探検するならぁ、ゼグナ鉱山に夢幻の湖…<line-break>まだまだあるじゃろが、うい～。<line-break>あんたも命知らずの冒険者なんかい…。<end><if><value:$2C><less-equal>%49ライネル、グレト、エシック…みんなすまねえ…<line-break>俺が…俺がしぶきの群島に連れていかなきゃ<line-break>あんな化け物と戦わなきゃ…ぐずっ…。<end>あんた、強いじゃろ！<line-break>お願いじゃ、しぶきの群島の巨大な化け物を…<line-break>仲間の仇をとってくれ…お願いじゃ…<end>"
english = "<if><value:$2C><less-equal>%9Ugh... Young people these days don't know their own limits. They're always doing something dangerous. Getting noticed isn't everything, you know. The best way is to search steadily for treasure somewhere suited to your level. Hic... Beginners ought to start with the Labyrinth of the Hungry.<end><if><value:$2C><less-equal>%29What's this? Just because you've gotten a little stronger doesn't mean you should go exploring the Fortress City Ruins! Adventurers these days are far too careless with their lives. If you want somewhere to explore, there's Zegna Mine, the Lake of Illusions... plenty of other places. Ugh... Are you another one of those foolhardy adventurers?<end><if><value:$2C><less-equal>%49Linell, Greto, Ethic... forgive me, all of you. If I hadn't taken you to the Spray Archipelago... you never would have had to fight that monster... Sniff...<end>You're strong, aren't you? Please... kill the giant monster in the Spray Archipelago and avenge my companions. I'm begging you.<end>"

["1580009"]
japanese = "<select><value:$33>孫のチダフが元気に育ってくれて、\u3000\u3000\u3000<line-break>わたしゃうれしいよ。でも元気すぎて<line-break>大ケガしなけりゃいいんだけど…。<line-break>チダフがケガをすると出稼ぎにでている<line-break>息子夫婦に申しわけがたたないからねえ。<end>孫のチダフが元気に育ってくれて、\u3000\u3000\u3000<line-break>わたしゃうれしいよ。でも元気すぎて<line-break>大ケガしなけりゃいいんだけど…。<line-break>チダフがケガをすると出稼ぎにでている<line-break>息子夫婦に申しわけがたたないからねえ。<end>うちのお爺さんは、また酒場で飲んだくれてる<line-break>のかね。あれでも昔は血気盛んな冒険者でねえ、<line-break>無茶をしてケガばっかりしてたもんさ。<line-break>あんまりケガをするもんで、ひどい時には<line-break>治療代のほうが稼ぎより多かったんだから。<line-break>おかげで今でも貧乏暮らしだよ。<end>うちのお爺さんは若いころ、しぶきの群島を<line-break>探検するために仲間を連れてでかけたんだけど、<line-break>モンスターに襲われてねえ。<line-break>生きて帰ってきたのは、あの人だけだったのさ。<line-break>それ以来、冒険で稼いだ金は仲間の遺族に配って<line-break>しまって…。いつも我が家は貧乏してたもんさ。<end>そこの酒場でうちのお爺さんに説教されただろ。<line-break>若い冒険者が話しかけてくると、無茶はするなと<line-break>す～ぐ説教しちまうのさ。<line-break>でも許してやっておくれ。悪気はないんだよ。<line-break>自分のように無茶をして仲間を失うような目に<line-break>あって欲しくないだけなんだから。<end>うちのお爺さんは、今日も酒場かねえ。<line-break>文句ばかり言ってないで、あんたら若者に<line-break>助言のひとつでも言えばいいだろうにねえ。<end>ディンガルの軍隊が攻めてくるのかい？<line-break>ロストールが危ないようなら、<line-break>アミラルにでも逃げたほうがいいのかねえ。<end>ほんにエルファス様は神の使いだよ…。<line-break>あの方のおっしゃるように、真の神に祈れば、<line-break>きっと世界は救われる…あたしゃ信じてるよ。<end>"
english = "<select><value:$33>I'm glad my grandchild Chidaf is growing up healthy. But I worry all that energy will lead to a serious injury. My son and his wife are away earning money. How could I face them if Chidaf got hurt?<end>I'm glad my grandchild Chidaf is growing up healthy. But I worry all that energy will lead to a serious injury. My son and his wife are away earning money. How could I face them if Chidaf got hurt?<end>Is my old man drinking himself senseless at the tavern again? Believe it or not, he was once a hot-blooded adventurer. He was always taking foolish risks and getting hurt. Sometimes the treatment cost more than he had earned. That's why we're still poor today.<end>When my old man was young, he took a band of companions to explore the Spray Archipelago, but monsters attacked them. He was the only one who came back alive. After that, he gave all the money he earned adventuring to the families of his dead companions. We were always poor because of it.<end>My old man lectured you at the tavern, didn't he? The moment a young adventurer speaks to him, he starts warning against taking foolish risks. Please forgive him. He means no harm. He just doesn't want anyone else to be reckless and lose companions the way he did.<end>Is my old man at the tavern again today? Instead of doing nothing but complain, he could at least offer you young folk some useful advice.<end>Is the Dyneskal army going to attack? If Rostorl is in danger, perhaps we should flee to Amiral.<end>Lord Elfas truly is a messenger of God. Just as he says, if we pray to the true God, the world will surely be saved. I believe it.<end>"

["1580010"]
japanese = "<select><value:$33>竜王様、愛の女神ライラネート様<line-break>今日もみんなが無事で過ごせますように。<line-break>うちの人が元気で帰ってきますように。<line-break>ハンナがタルテュバに取られたお人形が<line-break>なんとかして、戻ってきますように。<line-break>竜王様、愛の女神ライラネート様…。<end>竜王様、愛の女神ライラネート様<line-break>今日もみんなが無事で過ごせますように。<line-break>ハンナが元気に育ってくれますように。<line-break>そして、タルテュバのいやがらせが<line-break>なくなりますように。<line-break>竜王様、愛の女神ライラネート様…。<end>うちの人の話だとディンガル帝国では、<line-break>誰もが実力次第で出世できるそうですね。<line-break>とてもすばらしいことだと思います。<line-break>征服帝ランガスターを倒した七竜士は、<line-break>どうして貴族制などを導入したのでしょう。<line-break>自分の子孫のためでしょうか…。<end>貧しい生活ですけどハンナを見てると元気が\u3000\u3000<line-break>でてくるんです。うちの人もハンナのために<line-break>しっかりと稼いで元気な姿を見せてくれないと。<line-break>うちの人は交易船の船員をしていて、半年に１度<line-break>しか帰ってこないからハンナがさびしがって…。<line-break>無事に帰ってくるよういつも祈ってるんです。<end>ディンガル帝国が占領したために、ロセンの港が<line-break>昔のように使えるようになったそうですよ。<line-break>うちの人も仕事が増えて大変なんですって。<line-break>青竜将軍のカルラというお方はかなりのやり手<line-break>で、先王ペウダの暴挙と戦争で荒れ果てたロセ<line-break>ンをすごい勢いで復興させているそうですよ。<end>せっかくロセンが復興してきたというのに、<line-break>どうしてリベルダムを破壊するのでしょう…。<line-break>戦争は壊すだけで、何も生み出さないのですね。<end>カルラ将軍がロストールへ迫っているそうです。<line-break>ハンナを守るためにも、アミラルへ疎開したい<line-break>のですが夫と連絡がとれなくて…。<end>救世主エルファス様の言葉を信じて、<line-break>真の神に祈りをささげます…。<line-break>どうかハンナをお守りください…。<end>"
english = "<select><value:$33>O Dragon King, O Lailanate, Goddess of Love, may everyone pass this day in safety. May my husband return home safe and well. And somehow, please let Hannah have back the doll Tartuba took from her. O Dragon King, O Lailanate, Goddess of Love...<end>O Dragon King, O Lailanate, Goddess of Love, may everyone pass this day in safety. May Hannah grow up healthy, and may Tartuba's harassment come to an end. O Dragon King, O Lailanate, Goddess of Love...<end>My husband says that in the Dyneskal Empire, anyone can rise according to ability. I think that's wonderful. Why did the Seven Dragon Knights, who defeated the Conqueror Emperor Lancaster, ever establish an aristocracy? Was it for the sake of their own descendants?<end>Our life is poor, but looking at Hannah gives me strength. Her father must work hard for her sake and come home safe and well. He serves aboard a merchant ship and only returns once every six months, so Hannah gets lonely. I always pray for his safe return.<end>I hear that since the Dyneskal Empire occupied Rocen, its port has gone back into use just as it was in the old days. All the extra work is keeping my husband very busy. Azure Dragon General Karula is apparently very capable. She is rebuilding Rocen at remarkable speed after former King Peuda's tyranny and the war left it in ruins.<end>Rocen was finally beginning to recover, so why did Liberdam have to be destroyed? War only destroys. It creates nothing.<end>I hear General Karula is closing in on Rostorl. I want to evacuate to Amiral to protect Hannah, but I can't get word to my husband...<end>I believe the words of Elfas, the Savior, and offer my prayers to the true God. Please protect Hannah...<end>"

