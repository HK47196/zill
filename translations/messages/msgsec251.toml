["2510001"]
japanese = "フフフ。よく来た<value:$28>。<line-break>どうやら決心がついたようだな。<line-break>\u3000<line-break>さあ、余と共に新しき人類の<line-break>時代を歩むのだ。<line-break>\u3000<line-break>この世の苦しみも悲しみも<line-break>一切が消え去った世界を<line-break><value:$28>に見せてやろう。<line-break>すべての人々が超人類となった<line-break>理想の世界…。<line-break>\u3000<line-break>そこではもはや、汝が造られた存在で<line-break>あることを問う者はいまい。<line-break>\u3000<line-break>さあ、今こそ時は満ちた。<line-break>余と共に来るがよい。<end>"
english = "Heh heh heh. Welcome, <value:$28>. It seems you have made up your mind. Come, walk with me into the age of a new humanity. I shall show <value:$28> an ideal world where all people have become superhuman, a world from which every trace of suffering and sorrow has vanished... There, no one will question your nature as a created being. The time has come at last. Come with me.<end>"

["2510002"]
