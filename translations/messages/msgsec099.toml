english = "In the end, each of us is alone. We can't stay together forever.<end>"

["990073"]
japanese = "久しぶりね、<value:$28>。<end>"
english = "It's been a long time, <value:$28>.<end>"

["990074"]
japanese = "私、カルラ様の配下になったの。\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>今の私はディンガル帝国黒鎧騎士、<line-break>東方攻略軍所属、青竜軍副将<line-break>アイリーン・エルメスよ。<end>"
english = "I've entered Lady Karula's service. Now I'm Irene Hermes, a Black-Armored Knight of the Dyneskal Empire, serving with the Eastern Campaign Army as deputy commander of the Azure Dragon Army.<end>"

["990075"]
japanese = "やっと、夢がかなったの。<line-break>どうしても、あなたに伝えたくて…。<end>"
english = "At last, my dream has come true. I had to tell you...<end>"

["990076"]
japanese = "やっと、夢がかなったの。<line-break>それじゃ。<end>"
english = "At last, my dream has come true. Goodbye.<end>"

["990077"]
japanese = "<value:$28>…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>こんなところに来るなんて<line-break>どういうつもり？<line-break>今の私たちは敵同士なのよ！？<end>"
