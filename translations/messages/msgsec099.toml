["990006"]
japanese = "ロストールの入り口まで来たとき\u3000\u3000\u3000<line-break>君の悲鳴が聞こえた気がした。<line-break>\u3000<line-break>だから、そこから全速力で走ってきた！<line-break>間に合ってよかった！<line-break>フェルムちゃん！\u3000大丈夫かい！<end>"
english = "I thought I heard you scream just as I reached the entrance to Rostorl. So I ran here as fast as I could! Thank goodness I made it in time! Ferme! Are you all right?<end>"

["990007"]
japanese = "俺様の愛するフェルムちゃんに<line-break>酔ってからむとは不埒な奴！<line-break>許せん！<end>"
english = "You drunken lout, how dare you harass my beloved Ferme! I won't stand for it!<end>"

["990008"]
japanese = "あ、<value:$28>さん…。<line-break>い、いらっしゃいませ…。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>あ、べ、別になんでもないんです。<line-break>し、仕事に戻らなくっちゃ…！<end>"
