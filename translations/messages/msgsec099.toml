english = "Aw, I wanted to have a meal with you, <value:$28>. Oh well. See you later!<end>"

["990011"]
japanese = "何か…、すごい格好を<line-break>なさってる方ですね。<line-break>\u3000<line-break>スタイルはいいし、<line-break>肌もきれいだし、<line-break>かわいい感じの方ですけど…。<end>"
english = "That's quite an outfit. Such a lovely figure, beautiful skin, and a rather sweet look, but...<end>"

["990012"]
japanese = "<value:$28>！<end>"
english = "<value:$28>!<end>"

["990013"]
japanese = "ここの料理<line-break>ホント、おいしかったよ。\u3000\u3000<line-break>\u3000<line-break>ボクのオススメはねえ、<line-break>ソルバ魚のカルパッチョと<line-break>ジオールスターの唐揚げかな。<end>"
english = "The food here was really good! I'd recommend the Solba fish carpaccio and the fried Geolstar.<end>"

["990014"]
japanese = "ちゃんと食べてみてよ！<line-break>すっごくおいしかったんだから。<line-break>じゃあね！<end>"
english = "You have to try them! They were so good. See you!<end>"

["990015"]
japanese = "とても、気持ちよく<line-break>食べてくださる方ですね。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>あれだけ食べても、<line-break>あんなにいいスタイルだなんて…<line-break>ちょっとうらやましいですね。<end>"
english = "What a pleasure it is to watch someone eat with such gusto. To eat that much and still have such a lovely figure... I'm a little envious.<end>"

["990016"]
japanese = "あら、<value:$28>…<line-break>今から食事かしら？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>あなたがここで食事するのだったら<line-break>待ち合わせて２人で食事したかったわ。<line-break>ここのテラネ茄子はいけてるのよ。<end>"
english = "Oh, <value:$28>... Are you about to eat? If I'd known you were dining here, I'd have arranged to meet you so we could eat together. The Terane eggplant here is quite good.<end>"

["990017"]
japanese = "ディンガルで食べるよりも<line-break>ロストールで食べる方が<line-break>おいしいなんて、おかしいわね。<line-break>それじゃ、私は行くわ。<line-break>今度、機会があれば、<line-break>２人で食事したいわね。<end>"
english = "It's strange that the food tastes better in Rostorl than it does in Dyneskal. Well, I should be going. If the opportunity arises, I'd like to dine with you sometime.<end>"

["990018"]
japanese = "ものすごく、おきれいな方ですよね。<line-break>背もスラッとして、物腰も上品で…。<line-break>\u3000<line-break>それに、あの…、なんていうか<line-break>ものすごい…胸…ですよね。<line-break>なんか…圧倒されちゃいますよね。<end>"
english = "Such a strikingly beautiful person, don't you think? Tall and slender, with such elegant manners... And, well, how should I put it... that chest is simply enormous. It's rather overwhelming, isn't it?<end>"

["990019"]
japanese = "あ、<value:$28>だ。<line-break>声をかけようかな…。<line-break>そうしよっと！<line-break>あ、<value:$28>、<line-break>とっても、会いたかったの。<line-break>\u3000<end>"
english = "Oh, there's <value:$28>. Maybe I'll go say hello... Yes, I think I will! Oh, <value:$28>! I've really been wanting to see you!<end>"

["990020"]
japanese = "だって、ここの料理<line-break>とってもおいしいんだもん！<line-break>一緒に食べられたらなって思ったの！<end>"
english = "It's just that the food here is so good! I was hoping we could eat together!<end>"

["990021"]
japanese = "じゃ、私、行くわね。<end>"
