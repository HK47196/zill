english = "It's been a long time, <value:$28>.<end>"

["990070"]
japanese = "私…<line-break>あれから、カルラ様に助けられて…<line-break>カルラ様の配下になったの。\u3000\u3000<line-break>今の私はディンガル帝国黒鎧騎士、<line-break>東方攻略軍所属、青竜軍副将<line-break>アイリーン・エルメスよ。<end>"
english = "I... After that, Lady Karula saved me, and I entered her service. Now I'm Irene Hermes, a Black-Armored Knight of the Dyneskal Empire, serving with the Eastern Campaign Army as deputy commander of the Azure Dragon Army.<end>"

["990071"]
japanese = "これからはお互い、<line-break>それぞれの夢を追いましょ。<line-break>それじゃ、<value:$28>。<end>"
english = "From now on, let's each pursue our own dream. Goodbye, <value:$28>.<end>"

["990072"]
