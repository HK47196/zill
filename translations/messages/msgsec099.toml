["990042"]
japanese = "ここ、あなたの行きつけの店だったの？<line-break>だーから、おいしくなかったのねー。<end>"
english = "So this is your usual place? No wonder the food was so awful.<end>"

["990043"]
japanese = "味？\u3000最悪ねー。<line-break>一言で言えば塩と油って感じかしら？<line-break>\u3000<line-break>世界は驚きに満ちているって言う<line-break>あなたの言葉を、ホントに<line-break>今日は思い知らされたわー。<end>"
english = "The taste? Dreadful. If I had to sum it up, I'd say salt and grease. You always say the world is full of surprises, and today I truly learned just how right you were.<end>"

["990044"]
japanese = "こーんなものを食べて生きている<line-break>生物がいるんですもの。<line-break>ホントにまったくオドロキよねー。<end>"
english = "To think there are creatures that live on food like this. It truly is astonishing.<end>"

["990045"]
japanese = "そ、それは、その、全部食べなきゃ、<line-break>店の人に悪いと思ったからよぉ！<line-break>\u3000<line-break>別に、料理がおいしかったわけじゃ<line-break>絶対、絶対、絶対、絶対、ないわ！<line-break>何、細かいところ指摘してるのよ！<end>"
english = "I-I only ate it all because I would've felt bad for the people here! It wasn't because the food was good. Absolutely, absolutely, absolutely, absolutely not! Why are you picking at every little detail?<end>"

["990046"]
japanese = "…そうね。<line-break>確かに堕落ね。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>人間ごときに気を使うなんて、\u3000<line-break>高貴で優雅なエルフである<line-break>アタクシらしくないわ…。<end>"
english = "Yes... You're right. I've certainly fallen far. Showing consideration for mere humans is hardly becoming of a noble and graceful Elf such as myself...<end>"

["990047"]
japanese = "でもでも、こうなってしまったのも<line-break>あなたのせいなんですからね！<line-break>セキニンとってほしいわ！<end>"
english = "But, but it's your fault I've become like this! I want you to take responsibility!<end>"

["990048"]
japanese = "セキニンっていう言葉が<line-break>聞こえたんですけど…、<line-break>セキニンっていったい…？<end>"
english = "I thought I heard the word “responsibility”... What exactly do you mean by that?<end>"

["990049"]
japanese = "そ、そ、そうですよね！<line-break>そんなわけないですよね！<end>"
english = "Y-yes, of course! It couldn't possibly mean that!<end>"

["990050"]
japanese = "あー、<value:$28>！<line-break>また、酒場に来てるぅ！\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>もう！\u3000<value:$28>ってば<line-break>目を離すとすぐこれなんだから！<line-break>ダメだよ。お酒なんか飲んじゃ！<end>"
english = "Oh, <value:$28>! You're at the tavern again! Honestly, <value:$28>! The moment I take my eyes off you, you're right back at it! You shouldn't be drinking!<end>"

["990051"]
japanese = "そぉお？<line-break>なら、いいんだけど。<line-break>それじゃ、ルルアンタ、行くね。<end>"
english = "Really? Well, if you say so. Lulluantha's going now, then.<end>"

["990052"]
japanese = "フフフ、かわいいリルビーですね。<line-break>世話好きで、まるでお母さん気取り。<line-break>\u3000<line-break>まあ、男の人って誰でも、<line-break>多少、母親とか子供とかに弱い…<line-break>そういう傾向、ありますものね。<end>"
english = "Hee hee. What a sweet little Rilby. So fond of looking after people, like a little mother. Then again, men do tend to have a soft spot for mothers and children, at least to some degree.<end>"

["990053"]
japanese = "ごちそうさん。<end>"
english = "Thanks for the meal.<end>"

["990054"]
japanese = "ありがとうございましたー。<end>"
english = "Thank you very much!<end>"

["990055"]
japanese = "…<value:$28>さん。<line-break>…それで、あの方とは、<line-break>どういうご関係なんですか？<end>"
english = "Um, <value:$28>... What exactly is your relationship with that person?<end>"

["990056"]
japanese = "…あの方とは<line-break>どういうご関係なんですか？<end>"
english = "What exactly is your relationship with that person?<end>"

["990057"]
japanese = "あ、いらっしゃいませー！<end>"
english = "Oh, welcome!<end>"

["990058"]
japanese = "…で、ある男の子が、ある女の子と\u3000\u3000<line-break>キスする仲…なんです。<line-break>\u3000<line-break>女の子はとても、その男の子のことが<line-break>好きなんです。その男の子に会えないと<line-break>不安で泣きたくなるくらいなんです。<end>"
english = "So... there's a boy and a girl, and they... kiss. The girl loves the boy very much. When she can't see him, she gets so anxious she feels like crying.<end>"

["990059"]
japanese = "それなのに、その男の子の方は<line-break>他の女の子と、すごくいい雰囲気で<line-break>しゃべるんです。…その女の子の前で。<line-break>あ、説明すると、その女の子って<line-break>わ、私の、と、友達なんですけど…<line-break>ガルドランさん、どう…思います？<end>"
english = "But the boy talks to another girl as if the two of them are very close... right in front of her. Oh, I should explain. She's m-my f-friend. Girldlan, what do you... think?<end>"

["990060"]
japanese = "フッ、恋する男の風上にも置けん奴だ。<line-break>俺様が愛について槍で語ってやろう。<line-break>\u3000<line-break>そう、俺様の伝説化決定済みの槍、<line-break>名付けて、愛の一撃必殺槍でな。<line-break>誰だい、そのハレンチな奴は？<end>"
english = "Hmph. That scoundrel is unworthy to call himself a man in love. I'll teach him about love with my spear―yes, the spear already destined to become legend! I call it the Spear of Love's Certain Death! Who is this shameless wretch?<end>"

["990061"]
japanese = "い、いえ、本当はいい人なんです。<line-break>ただ、ちょっとカッコいいから…。<end>"
english = "N-no, he's really a good person. It's just that he's rather handsome...<end>"

["990062"]
japanese = "フェルムちゃん！\u3000君はやさしい！\u3000<line-break>そんなクズ野郎すらかばうなんて！<line-break>\u3000<line-break>そのやさしさを持つ君こそ、<line-break>勇者の口づけを受ける資格がある！<line-break>さあ、俺様の唇を存分に吸ってくれ！<end>"
english = "Ferme! You are too kind! Defending even a worthless cur like that! A woman of such kindness is worthy of a Hero's kiss! Come, drink your fill from my lips!<end>"

["990063"]
japanese = "それにしても、フェルムちゃんの<line-break>友達も不幸だ。そんなクズ野郎、<line-break>捨ててしまえばいいのに…。<line-break>そう、彼女も、フェルムちゃんのように<line-break>この愛の青春伝説の異名を持つ<line-break>俺様のような男に出会えていればな。<end>"
english = "Still, I pity your friend, Ferme. She ought to cast aside a worthless cur like that. If only she too had met a man like me―the one they call the Legend of Love and Youth―just as you have.<end>"

["990064"]
japanese = "俺様にかぎって、<line-break>君を苦しめることはない。<line-break>俺様は誓えるさ！<line-break>さあ、フェルムちゃん！<line-break>愛溢れる俺様と出会った幸福を、<line-break>この接吻で思う存分、味わうがいい！<end>"
english = "I would never make you suffer. I swear it! Come, Ferme! With this kiss, savor to the fullest your good fortune in meeting a man as full of love as I!<end>"

["990065"]
japanese = "い、いやっ！<end>"
english = "N-no!<end>"

["990066"]
japanese = "<select><value:$20>%4感じるぜ！\u3000フェルムちゃん！<line-break>君の愛を君の拳から！！<end>ふっ、いいパンチだ。<line-break>未来の勇者の妻になるにふさわしい！<end>い、痛い…。でも、<line-break>…こういう愛の形もいいかもしれない。<end>人は、ときに愛に臆病になり、<line-break>愛から逃げようとする。<line-break>\u3000<line-break>だが、これしきのパンチでは<line-break>俺様の伝説化決定の愛からは<line-break>逃げられないぜ！<end>"
english = "<select><value:$20>%4I can feel it, Ferme! The love in your fist!<end>Hah! A fine punch. Truly worthy of the future wife of a Hero!<end>O-ow... But perhaps this form of love has its charms too.<end>At times, people grow afraid of love and try to flee from it. But a punch like that cannot save you from my love, already destined for legend!<end>"

["990067"]
japanese = "今日は、これでさよならだ。<line-break>また来るぜ！\u3000フェルムちゃん！<end>"
english = "Farewell for today. I'll be back, Ferme!<end>"

["990068"]
japanese = "…あ、<value:$28>さん。<line-break>あ、あの…なんでもないです！<line-break>それじゃっ！<end>"
english = "Oh, <value:$28>... Um, it's nothing! Goodbye!<end>"

