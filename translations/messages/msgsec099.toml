["990080"]
japanese = "こんなことになるなんて…<line-break>思ってもみなかった…。<end>"
english = "I never imagined it would come to this...<end>"

["990081"]
japanese = "<value:$28>…。<end>"
english = "<value:$28>...<end>"

["990082"]
japanese = "ディンガル帝国青竜軍副将として、<line-break><value:$28>、お前を討つ！<end>"
english = "As deputy commander of the Dyneskal Empire's Azure Dragon Army, I will strike you down, <value:$28>!<end>"

["990083"]
japanese = "………………。<end>"
english = "...<end>"

["990084"]
japanese = "…行きなさい。<line-break>次はないわ。<end>"
english = "Go. There won't be another chance.<end>"

["990085"]
japanese = "…どうして、<line-break>どうして解放軍なんかに…。<end>"
english = "Why? Why did you have to join the Liberation Army...?<end>"

["990086"]
japanese = "<value:$28>！<line-break>こんな所で何をしているの！\u3000<line-break>\u3000<line-break>早く出ていきなさい。<line-break>今回だけは見逃してあげる。<line-break>もう私の前に顔を出さないで。<end>"
english = "<value:$28>! What are you doing here? Get out, now. I'll let you go this once. Don't ever show your face before me again.<end>"

["990087"]
japanese = "…ほんっとに<line-break>いつまでたっても子供なんだから！<end>"
english = "Honestly, you never stop being such a child!<end>"

["990088"]
japanese = "<value:$28>…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>どういうつもりで<line-break>ここに来ているのかしら、ノーブル伯？<line-break>今の私たちは敵同士も同然よ。<end>"
