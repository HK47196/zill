["700199"]
japanese = "よぉ、<value:$28><line-break>邪魔していいか？<end>"
english = "Hey, <value:$28>. Mind if I interrupt?<end>"

["700200"]
japanese = "セラ見てるとホント<line-break>リディオンを思い出すよ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>アミラルで最強の剣士。<line-break>アミラルの銀狼騒ぎのとき、銀狼を<line-break>退治して、旅に出たことになってる。<end>"
english = "Seeing Sera always reminds me of Lidion. Lidion was the finest swordsman in Amiral. During the Silver Wolf incident there, Lidion killed the Silver Wolf, then supposedly set off on a journey.<end>"

["700201"]
japanese = "あいつ…、<line-break>ずっと、昔の心の傷を負って、\u3000\u3000\u3000\u3000<line-break>心を閉ざして、荒れてた。\u3000<line-break>あいつ、ガキのころ、<line-break>ロベルトさんとこの娘さんを<line-break>町の外へデート気分で連れ出したんだ。<end>"
english = "Lidion had carried an old emotional wound for years. Shut everyone out and went off the rails. When Lidion was a kid, Lidion took Roberto's daughter outside town as if the two of them were going on a date.<end>"

["700202"]
japanese = "そのとき、モンスターに襲われて\u3000\u3000\u3000<line-break>リディオンは助かったんだが<line-break>…娘さんの方は…ダメだった。<line-break>彼女を守れなかった…<line-break>そのことでリディオンは<line-break>変わっちまった…。<end>"
english = "The two of them were attacked by monsters. Lidion survived, but Roberto's daughter... didn't. Lidion couldn't protect her. That was what changed Lidion.<end>"

["700203"]
japanese = "もともと意固地な奴だったけど<line-break>それからは、周囲の誰にも心を閉ざし、<line-break>ひたすら、怪物退治と剣に没頭した。<line-break>あいつ…、<line-break>俺によく突っかかってきたよな。<line-break>剣の勝負だとか、なんだとか言ってさ。<end>"
english = "Lidion had always been stubborn, but after that, Lidion shut everyone out and devoted everything to hunting monsters and mastering the sword. Lidion was always coming after me, challenging me to sword matches and whatever else.<end>"

["700204"]
japanese = "あれをみんなは、ケンカだとか<line-break>槍もでき、人の受けもいい俺のことを<line-break>嫉妬してだとか言ってたけど、違う。\u3000<line-break>その証拠に俺は奴に１回も<line-break>勝てたことがない。<line-break>それでも、奴は俺に何度も挑み続けた。<end>"
english = "Everyone called it fighting. Some said Lidion was jealous because I was good with a spear and people liked me. But they were wrong. I never beat Lidion. Not once. And still, the challenges kept coming.<end>"

["700205"]
japanese = "奴が、最後にすがろうとした\u3000\u3000\u3000\u3000\u3000<line-break>人とのつながりが<line-break>俺…だったんじゃないかな。<line-break>あいつはあいつの心の中の様々な気持ち<line-break>…それは口にすればいいわけになる…<line-break>それを剣に託して伝えたかったんだ。<end>"
english = "Maybe I was the last human connection Lidion tried to cling to. Lidion had all kinds of feelings inside, but putting them into words would only have turned them into excuses. So Lidion tried to convey them through the sword instead.<end>"

["700206"]
japanese = "…だけど俺の槍は未熟で、<line-break>結局、奴の剣に応えられなかった。<end>"
english = "But I wasn't skilled enough with my spear. In the end, I couldn't answer that sword.<end>"

["700207"]
japanese = "…あいつさ。旅に出たことに<line-break>なってるけどさ。…実は、<line-break>銀狼との死闘での傷で死んだんだ。\u3000\u3000<line-break>奴は、町の連中に奴らのために死んだと<line-break>思われるのがイヤで、旅に出たことに<line-break>してくれって、死に際に頼んだんだ。<end>"
english = "The story is that Lidion went off traveling. But the truth is, Lidion died from wounds suffered in that fight with the Silver Wolf. Lidion didn't want the people in town thinking Lidion had died for them, so before dying, Lidion asked for everyone to be told that Lidion had gone traveling.<end>"

["700208"]
japanese = "俺と奴のおやじさんに、さ…。\u3000\u3000\u3000\u3000<line-break>あとは、一言もない。<line-break>奴らしい片意地な最期だった…。<end>"
english = "Asked me and Lidion's father, that is. Not another word after that. Stubborn to the bitter end. Just like Lidion.<end>"

["700209"]
japanese = "セラって奴さ。見てると<line-break>リディオンのこと、思い出すんだ。\u3000<line-break>\u3000<line-break>あいつも、不器用で片意地で<line-break>心の中の言葉を、<line-break>うまく、口にできない。<end>"
english = "Looking at Sera reminds me of Lidion. He's awkward and stubborn too, and he can't seem to put what's inside him into words.<end>"

["700210"]
japanese = "奴もリディオンみたいな重いものを\u3000<line-break>心に持ってるんだ…って思う。<line-break>\u3000<line-break>例えば、<line-break>奴とアーギルシャイアとが<line-break>不自然なほど似てることとか、さ。<end>"
english = "I think he's carrying something heavy inside, just like Lidion was. Like how unnaturally alike he and Argyleshire are.<end>"

["700211"]
japanese = "俺、お前に<line-break>奴を見放さないようにしてほしい。<line-break>そうじゃなきゃ、あとで後悔する…。<end>"
english = "I'm asking you not to give up on him. Otherwise, you'll regret it later.<end>"

["700212"]
japanese = "さすがに夜は冷え込むよな…<line-break><value:$28>、中に入ろうぜ。<end>"
english = "It really does get cold at night. Come on, <value:$28>. Let's go inside.<end>"

["700213"]
japanese = "いやー、きれいだわ。<line-break>セラちゃんは、もう。\u3000<line-break>\u3000<line-break>きゃー、セラ様ー！<line-break>って感じかな。<line-break>いやー、かっこいいわ。<end>"
english = "Oh, Sera is just gorgeous. It's like, “Eee! Lord Sera!” Oh, he's so cool.<end>"

["700214"]
japanese = "おんやー？\u3000あたしが彼ばっかり<line-break>ほめるから、すねちった？<end>"
english = "Oh? Are you sulking because I keep praising him?<end>"

["700215"]
japanese = "アハハハ、剣闘士<value:$28>も<line-break>めちゃ、かっこいいってばさ。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>なんつーかなー、あんたは正統派の<line-break>かっこいい男なんだけどさ。<line-break>彼は陰のかっこよさなのよ。<end>"
