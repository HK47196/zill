japanese = "ロッシマ（２）メッセージＶ３－２開始<end>"
english = ""

["1770001"]
japanese = "ここのアロースリットや床からトゲは<line-break>解除できんようになっとる。<line-break>じゃけぇ、ダメージを覚悟の上で進みんさい。<line-break>あんたらが回復アイテムを、よけえ持っとらん<line-break>なら、引き返した方がええで。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ロッシマ<end>"
english = "The arrow slits and floor spikes here can't be disabled. If you're going on, be prepared to take some damage. If you don't have plenty of healing items, you'd best turn back. ―Rossima<end>"

["1770002"]
japanese = "シュートを見つけた。<line-break>これを使って下の階に降りることができる。<end>"
english = "Found a chute. It can be used to reach the floor below.<end>"

["1770003"]
japanese = "床からトゲの罠を見つけた。<end>"
english = "Found a spike trap in the floor.<end>"

["1770004"]
japanese = "アロースリットの罠を見つけた。<end>"
english = "Found an arrow-slit trap.<end>"

["1770005"]
japanese = "レオニックの証は、タダでは手に入らん。<line-break>証を失うと、迷宮から出れんようにする罠が、<line-break>祭壇に仕掛けてあるからのう。<line-break>証と同じ重さの物を置けば、罠は作動せん。<line-break>わしゃあ、涙をのんで戦友を置いていく。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ロッシマ<end>"
english = "Leonic's token cannot be had for nothing. A trap has been set on the altar: remove the token, and you will be unable to leave the labyrinth. Put something of equal weight in its place, and the trap will not spring. Swallowing my tears, I leave my comrade-in-arms behind. Rossima<end>"

["1770006"]
japanese = "祭壇の上にレオニックの証が置いてある。<line-break>レオニックの証を手に入れますか？<end>"
english = "Leonick's Proof rests on the altar. Will you take Leonick's Proof?<end>"

["1770007"]
japanese = "手に入れない<end>"
english = "Don't obtain it<end>"

["1770008"]
japanese = "手に入れる<end>"
english = "Obtain it<end>"

["1770009"]
japanese = "祭壇がある。<line-break>レオニックの証を祭壇に戻しますか？<end>"
english = "There is an altar here. Return Leonic's token to the altar?<end>"

["1770010"]
japanese = "戻さない<end>"
english = "Don't return<end>"

["1770011"]
japanese = "戻す<end>"
english = "Return<end>"

["1770012"]
japanese = "祭壇の上にレオニックの証が置いてある。<line-break>レオニックの証とロッシマの道具を<line-break>交換しますか？<end>"
english = "Leonick's token rests on the altar. Exchange it for Rossima's gear?<end>"

["1770013"]
japanese = "交換しない<end>"
english = "Don't exchange<end>"

["1770014"]
japanese = "交換する<end>"
english = "Exchange<end>"

["1770015"]
japanese = "祭壇の上にロッシマの道具が置いてある。<line-break>ロッシマの道具とレオニックの証を<line-break>交換しますか？<end>"
english = "Rossima's equipment is on the altar. Would you like to exchange it for Leonic's token?<end>"

