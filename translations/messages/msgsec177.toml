["1770048"]
japanese = "私の名はメイア。<line-break>禁忌の力を守護する者。<line-break>よくぞ来た、無限のソウルを宿す者よ。<line-break>貴様が、禁忌の力を扱うに<line-break>ふさわしい者ならば、<line-break>私を倒してみよ。<end>"
english = "My name is Meia, guardian of the forbidden power. Welcome, bearer of the Infinite Soul. If you are worthy to wield the forbidden power, then defeat me.<end>"

["1770049"]
japanese = "見事だ…<line-break>貴様なら禁忌の力を<line-break>正しく使えるはず…<end>"
english = "Well done... You should be able to use the forbidden power properly...<end>"

["1770050"]
japanese = "よくぞ我が試練を乗り越え、ここまで参った。<line-break>約束どおり、禁忌の力を授けよう。<line-break>祭壇の前に立つがよい。<end>"
english = "You have done well to overcome my trial and come this far. As promised, I shall grant you the forbidden power. Stand before the altar.<end>"

["1770051"]
japanese = "禁忌の呪文デモリッシュの封印を解く。<line-break>これでそなたとその仲間は、禁忌の力を<line-break>手に入れるであろう。<end>"
english = "I shall break the seal upon the forbidden spell Demolish. You and your companions shall now gain the forbidden power.<end>"

["1770052"]
japanese = "デモリッシュの封印が解かれた。<end>"
english = "Demolish has been unsealed.<end>"

["1770053"]
japanese = "禁忌の大剣ソルベンジュを授けよう。<line-break>これは、戦神ソリアスがウルグとの戦いで<line-break>用いたと伝えられる大剣である。<line-break>普通の人間には使いこなせぬが、<line-break>そなたたちならば使いこなせるはず。<line-break>その力、存分に発揮してみせい。<end>"
english = "I bestow upon you Solvenge, the forbidden greatsword. It is said that the War God Solias wielded this blade in battle against Ulugh. No ordinary mortal could master it, but you should be equal to the task. Show me its full power.<end>"

["1770054"]
japanese = "おう、われか。<line-break>ひさしぶりじゃのう。<line-break>元気でやっとったかいの？<end>"
english = "Oh, it's you. Been a long time. Have you been keeping well?<end>"

["1770055"]
japanese = "どしたんねぇ、<line-break>何やらニコニコして。<line-break>えらい誇らしげじゃのう。<end>"
english = "What's all this, then? Grinning away and looking mighty proud of yourself.<end>"

["1770056"]
japanese = "われは最後まで行けたんか！\u3000\u3000\u3000\u3000<line-break>…うれしいのう、超えたんかぁ。<line-break>われがわしを超えたんかぁ。<line-break>弟子が神の手ロッシマを超える…<line-break>これ以上の喜びはありゃせんわ。<line-break>わしは最高の宝を手に入れたんじゃ。<end>"
english = "You made it all the way to the end? Ah, that does me good. So you've surpassed me at last. My own pupil, surpassing Rossima, the Hand of God... Nothing could make me happier. I've gained the greatest treasure of all.<end>"

["1770057"]
japanese = "何を照れとんねぇ。<line-break>わしはわれを鍛え上げた<line-break>わ・し・をほめとるんじゃ！<end>"
english = "What are you getting bashful for? I'm praising me―the one who trained you so well!<end>"

["1770058"]
japanese = "なんじゃ、わしの道具を返して<line-break>くれるんか？<end>"
english = "What's this? Are you giving my gear back?<end>"

["1770059"]
japanese = "その道具は、われのもんよ。<line-break>われの好きにしんさい。<line-break>わしには必要ないもんじゃ。<line-break>道具は使ってこそ道具じゃと<line-break>前にも言ったじゃろ。<line-break>忘れたんか？<end>"
english = "That gear is yours. Use it however you like. I don't need it. Gear is meant to be used. I told you that before, didn't I? Have you forgotten?<end>"

["1770060"]
japanese = "そがーなことより座りんさいや。<line-break>われの冒険ぶりをじっくりと<line-break>聞かせてもらわにゃいけんからの。<end>"
english = "Never mind all that. Sit yourself down. I want to hear the whole tale of your adventures.<end>"

["1770061"]
japanese = "それじゃ、達者でな。<line-break>われの活躍を楽しみにしとるでぇ。<end>"
english = "Well then, take care of yourself. I'll be looking forward to seeing what you accomplish.<end>"

["1770062"]
japanese = "<value:$28>…<line-break>われのおかげで、わしの人生に<line-break>くいはのうなった。<end>"
english = "<value:$28>... Thanks to you, I can look back on my life without a single regret.<end>"

["1770063"]
japanese = "こんな晴れ晴れした気分は<line-break>ひさしぶりじゃ。<line-break>これで安心して死ねるわい。<line-break>ありがとうよ…<line-break><value:$28>。<end>"
english = "It's been a long time since I felt this light at heart. Now I can die in peace. Thank you... <value:$28>.<end>"

