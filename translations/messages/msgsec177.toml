["1770018"]
japanese = "おおう！<line-break>われ、レオニックの証を<line-break>手に入れたんか！<end>"
english = "Oh! So you've obtained the Proof of Leonic!<end>"

["1770019"]
japanese = "ほうか、ほんなら教えてやるわい。<line-break>われには資格があるんじゃから、<line-break>レオニックの迷宮へ行く方法をのう。<end>"
english = "Ah, then I'll tell you how to reach Leonic's Labyrinth. You've got the right to know.<end>"

["1770020"]
japanese = "乙女の鏡を知っとるじゃろ。\u3000\u3000\u3000\u3000<line-break>あそこに５本の柱に囲まれた<line-break>場所があるんよ。<line-break>そこが、レオニックの迷宮への<line-break>入り口でな、レオニックの証を<line-break>持っとったら迷宮へ導かれるはずよ。<end>"
english = "You know the Maiden's Mirror, don't you? There's a place there surrounded by five pillars. That's the entrance to Leonic's Labyrinth. If you carry the Proof of Leonic, it should lead you inside.<end>"

["1770021"]
japanese = "レオニックの迷宮はのう、<line-break>挑む者の魂によって形を変えるんよ。<line-break>じゃから、助言はしてやれん。<line-break>わしの時は、モンスターなんか<line-break>ほとんどおらんで、罠ばっかりの<line-break>迷宮じゃったんでぇ。<end>"
english = "Leonic's Labyrinth changes shape according to the soul of whoever challenges it, so I can't advise you. When I challenged it, there were hardly any monsters―just trap after trap.<end>"

["1770022"]
japanese = "われは、普通のやつとは\u3000\u3000\u3000\u3000\u3000\u3000<line-break>違う力を持っとる。<line-break>目の輝きが凡人と違うんよ。<line-break>じゃから、わし以上に困難な迷宮かも<line-break>しれん。ほじゃけぇ、ダメじゃあ…<line-break>思うたら逃げることよ。<end>"
english = "You have a power ordinary folk don't. I can see it in your eyes. Your labyrinth may be harder than mine was. So if you ever think you can't go on... run.<end>"

["1770023"]
japanese = "今のわれは、冒険者ロッシマを超える<line-break>ことができるはずじゃ。<line-break>われはわしの最高の弟子なんじゃけぇ。<line-break>生きとりゃあ、何回でも挑戦できる。<line-break>命を大切にしんさいよ。<line-break>無謀と勇気は違うんじゃけぇ。<end>"
english = "As you are now, you should be able to surpass Rossima the adventurer. You're the finest pupil I've ever had. As long as you're alive, you can try again as many times as it takes. Value your life. Recklessness and courage aren't the same thing.<end>"

["1770024"]
japanese = "なんか、しゃべりすぎて<line-break>疲れたわい…。<end>"
english = "Seems I've worn myself out talking so much...<end>"

["1770025"]
japanese = "親友の墓参りに行くために<line-break>ちょーっと遠出したんよ。<line-break>じゃから、疲れが残っとるんかな…<line-break>今日は、何となくわれが来そうな<line-break>気がしたけぇ無理して来たんが<line-break>いけんかったんかもしれんわい。<end>"
english = "I went a little farther afield to visit my best friend's grave. Maybe that's why I'm still tired... I had a feeling you might come today, so I pushed myself to be here. Perhaps I shouldn't have.<end>"

["1770026"]
japanese = "まあ、２，３日休めば<line-break>元気になるじゃろうて。<line-break>われに会ったことじゃしのう。<end>"
english = "Well, two or three days of rest should put me right. I got to see you, after all.<end>"

["1770027"]
japanese = "ようこそ、無限のソウルを宿す者よ。<line-break>我が名はレオニック。禁忌を封じる者なり。<line-break>この迷宮は、そなたのために用意した。<line-break>自らの知恵と力を駆使し、<line-break>見事、我がもとに来るがよい。<line-break>さすれば、そなたに禁忌の力を与えよう。<end>"
english = "Welcome, bearer of the Infinite Soul. My name is Leonic, the one who seals away the forbidden. This labyrinth has been prepared for you. Use your wisdom and strength, and make your way to me. Do so, and I shall grant you the power of the forbidden.<end>"

