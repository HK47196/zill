["490000"]
japanese = "ルルアンタ・ボリューム１開始<end>"
english = ""

["490001"]
japanese = "まずはギルドへ行こう。<end>"
english = "First, let's go to the Guild.<end>"

["490002"]
japanese = "おやじさんの荷物の後始末を\u3000\u3000\u3000<line-break>しなくちゃ行けないからな。<line-break>\u3000<line-break>それにこれからは、冒険者になる。<line-break>ギルドで冒険者登録を<line-break>しておかないと、な。<end>"
english = "The old man's belongings still need sorting out. Besides, from now on, it's life as an adventurer. Better register with the Guild.<end>"

["490003"]
japanese = "ゼネテスさんじゃないか。<line-break>最近、顔を見せなかったが、<line-break>どこをほっつき歩いていたんだい？<end>"
english = "Xenetes! Haven't seen you around lately. Where've you been wandering off to?<end>"

["490004"]
japanese = "ま、いろんなとこだ。<end>"
english = "Oh, here and there.<end>"

["490005"]
japanese = "あんたじゃないと、<line-break>手に負えない依頼がたまってるんだよ。<line-break>ちょっと、片付けてくれないかい？<end>"
english = "I've got a pile of jobs only you can handle. Think you could clear them out for me?<end>"

["490006"]
japanese = "いんや。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Nope.<end>"

["490007"]
japanese = "今から俺はこいつの相棒になるんでな。<line-break>悪いが引き受けられない。<end>"
english = "I'm partnering up with this one now. Sorry, but I can't take them.<end>"

["490008"]
japanese = "こいつのギルド登録を<line-break>してやってくれ、おやじ。<end>"
english = "Register this one with the Guild, will you, old man?<end>"

["490009"]
japanese = "へえ。あんたかい。<line-break>ゼネテスさんが目を付けたんだ。<line-break>将来有望なんだろうね。<end>"
english = "Oh, so it's you. If you've caught Xenetes's eye, you must have a promising future ahead of you.<end>"

["490010"]
japanese = "犯罪登録なし。幻術計振れておらず。\u3000\u3000\u3000<line-break>…はい、あなたは今日から<line-break>冒険者として登録されました。<line-break>頑張って仕事してくれよ。<line-break>あんたが有名になったら、そのギルド登録を<line-break>したのは俺だって鼻が高いからね。<end>"
english = "No criminal record. No reading on the illusion gauge... All right. As of today, you're officially registered as an adventurer. Work hard out there. If you become famous, I'll be proud to say I was the one who registered you with the Guild.<end>"

["490011"]
japanese = "それから、こいつの馬車が<line-break>町の出口にとめてある。\u3000\u3000<line-break>\u3000<line-break>その荷物を処分したいんだ。<end>"
english = "There's one more thing. This one's wagon is parked near the way out of town. I want to get rid of the cargo.<end>"

["490012"]
japanese = "これだけがこいつが抱えている、<line-break>商品の受注先のリストだ。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ついでだが、これだけのものを<line-break>責任持って、先方に届けて欲しい。<line-break>報酬は荷物を処分した分から払う。<end>"
english = "This is the full list of customers waiting on the goods in that cargo. While you're at it, I want you to make sure all of it reaches the proper recipients. Your fee will be paid out of the proceeds from disposing of the cargo.<end>"

["490013"]
japanese = "おいおい、仕事の依頼を断った上に、<line-break>そっちから仕事をもってくるのかよ？<end>"
english = "Hold on. First you turn down my jobs, and now you're bringing me one of your own?<end>"

["490014"]
japanese = "大事なお客様ってわけだ。<line-break>\u3000<line-break>\u3000<line-break>それともうひとつ。<line-break>ツェラシェルに会いたい。<line-break>奴を呼んでくれ。<end>"
english = "This is an important customer. One more thing: I want to see Tserashel. Send for Tserashel.<end>"

["490015"]
japanese = "ツェラシェル？<line-break>あいつは金に汚いし、<line-break>詐欺師まがいの評判の悪い冒険者だよ？<end>"
english = "Tserashel? That's a money-grubbing adventurer with a rotten reputation, practically a swindler.<end>"

["490016"]
japanese = "そのかわり、一流だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>奴の腕が必要なんだ。<line-break>\u3000<line-break>ま、そーゆーわけで早急に金もいる。<line-break>以上２件、いつまでにできる？<end>"
english = "But Tserashel is first-rate. I need Tserashel's skills. And that's why I need the money quickly, too. When can you have both done?<end>"

["490017"]
japanese = "うーん。<line-break>少なくとも、１週間は<line-break>見てもらわんとなあ。<end>"
english = "Hmm. You'll have to give me at least a week.<end>"

["490018"]
japanese = "わかった。<end>"
english = "All right.<end>"

["490019"]
japanese = "んじゃ、あと１週間も<line-break>ぶらぶらしてるのもなんだしな。<line-break>\u3000<line-break>仕事するか？<line-break><value:$28>？<end>"
english = "Well, no sense in loafing around for a week. Want to do some work, <value:$28>?<end>"

["490020"]
japanese = "んじゃ、お前さんが仕事を取ってこい。<line-break>\u3000<line-break>\u3000<line-break>まず、カウンターのギルドの親父に<line-break>話しかけるんだ。<line-break>そのあとは親父が説明してくれる。<end>"
english = "Then you go pick up a job. Start by talking to the Guildmaster at the counter. He'll explain the rest.<end>"

["490021"]
japanese = "冒険者の基本は、こうやって\u3000\u3000\u3000\u3000\u3000<line-break>ギルドの仕事をやって<line-break>地道に経験を重ねていくことだ。<line-break>ま、もちろん、世界を巡り<line-break>自由に探検するのも大事だがな。<line-break>んじゃ、町から出るときに合流しよう。<end>"
english = "The foundation of adventuring is taking Guild jobs like this and steadily building experience. Of course, traveling the world and exploring freely matters too. I'll meet you when you're ready to leave town.<end>"

["490022"]
japanese = "おっと。<line-break>世界に出るより、まずはギルドだ。<line-break>\u3000<line-break>おやじさんの荷物の処分も<line-break>しなくちゃ行けないし、<line-break>お前さんも今日から冒険者だ。<end>"
english = "Wait. Before we head out into the world, we need to visit the Guild. We still have to dispose of the old man's belongings, and as of today, you're an adventurer too.<end>"

["490023"]
japanese = "ギルドで冒険者登録は<line-break>済ませとかないと困るぜ？\u3000\u3000\u3000\u3000<line-break><value:$28>。<end>"
english = "You'll need to register as an adventurer at the Guild, <value:$28>.<end>"

["490024"]
japanese = "よ、待ってたぜ。<line-break>まずは、金を受け取ろうや。<end>"
english = "There you are. I've been waiting. First, let's collect the money.<end>"

["490025"]
japanese = "金の方は用意できている。<line-break>商品の方の配送も終わった。<line-break>\u3000<line-break>大変だったぜ。<line-break>いきなりあんだけの仕事が<line-break>舞い込んだんだからな。<end>"
english = "The money's ready, and all the goods have been delivered. It was a real job, having that much work dropped on us without warning.<end>"

["490026"]
japanese = "こっちが、<line-break>あんたの荷物や馬車を処分したり、<line-break>商品の代金を集めたりしてできた金。\u3000<line-break>こっちが<line-break>冒険者を雇った人件費、その他<line-break>もろもろの諸経費。確認してくれ。<end>"
english = "This is what we made from selling off your belongings and carriage and collecting payment for the goods. And this is what we spent hiring adventurers, along with all the other expenses. Check it over.<end>"

["490027"]
japanese = "これを差し引きして…、残りはちょうど５０００だ。はいよ。<end>"
english = "Deducting all that... leaves exactly 5,000. Here you go.<end>"

["490028"]
japanese = "５０００か…。ツェラシェルを雇うには<line-break>少し足りないな。<end>"
english = "5,000... That's a little short of what we'd need to hire Tserashel.<end>"

["490029"]
japanese = "少し？\u3000ぜんぜん足りないぞ。<line-break>どうするんだ？<end>"
english = "A little? It's nowhere near enough. What are you going to do?<end>"

["490030"]
japanese = "ま、その辺はなんとかするさ。<end>"
english = "Well, I'll work something out.<end>"

["490031"]
japanese = "親父、ツェラシェルの方は<line-break>どうなってる？<end>"
english = "Old man, any word from Tserashel?<end>"

["490032"]
japanese = "今日にも来ると思うが…。<end>"
english = "Should be here sometime today...<end>"

["490033"]
japanese = "んじゃ、来たら<line-break>酒場で待ってると伝えてくれ。<end>"
english = "Then when Tserashel arrives, say I'll be waiting at the tavern.<end>"

["490034"]
japanese = "んじゃな。俺は酒場で待ってる。<line-break>お前さんもすぐ来てくれ。<end>"
english = "All right, then. I'll be waiting at the tavern. You come straight over too.<end>"

["490035"]
japanese = "それと、今手にいれた５０００ギアは<line-break>手をつけないで別にしといてくれ。<line-break>ちょっと、使い道があるんでな。<end>"
english = "One more thing. Don't touch that 5,000 Gea we just got. Set it aside. I've got a use for it.<end>"

["490036"]
japanese = "<未使用><end>"
english = ""

["490037"]
japanese = "<未使用><end>"
english = ""

["490038"]
japanese = "よ、待ってたぜ。\u3000<end>"
english = "Hey. I've been waiting for you.<end>"

["490039"]
japanese = "これからツェラシェルという<line-break>冒険者に会う。<line-break>色々と問題はあるが、腕は一流の男だ。<line-break>そいつから情報を仕入れて<line-break>俺たちは<line-break>ルルアンタを追いかける。<end>"
english = "We're about to meet an adventurer named Tzerashel. He's got his problems, but his skill is first-rate. Once we've got some information from him, we'll go after Lulluantha.<end>"

["490040"]
japanese = "自分のつらさを乗り越えて、お前さんに<line-break>優しい手を差し伸べてくれた女の子に、<line-break>今度はお前さんが手を差し出すんだ。<line-break>…っと、来たみたいだな。<end>"
english = "That girl overcame her own pain to offer you a helping hand. Now it's your turn to offer her one. Ah, looks like he's here.<end>"

["490041"]
japanese = "久しぶりだな、<line-break>イカサマ野郎。<end>"
english = "Long time no see, you cheating bastard.<end>"

["490042"]
japanese = "お前の依頼内容は大体わかっている。\u3000<line-break>そこの子がエリスの手の者に<line-break>狙われる可能性はあるか。<line-break>それともうひとつ。ルルアンタとかいう<line-break>リルビーの娘の行方。<line-break>この２つを知りたいんだろ？<end>"
english = "I have a fair idea what you want. First, whether that child there is likely to be targeted by Eris's people. Second, the whereabouts of a Lilbie girl called Lulluantha. Those are the two things you want to know, right?<end>"

["490043"]
japanese = "な？<line-break>問題はあるけど一流だろ？<end>"
english = "See? He's got his problems, but he's first-rate.<end>"

["490044"]
japanese = "で、どうだった？<line-break>お前のことだ、結構な情報を<line-break>仕入れてきてくれたんだろ？<end>"
english = "So, what did you find out? Knowing you, you must've dug up plenty.<end>"

["490045"]
japanese = "まず金だ。軽妙な会話で<line-break>俺がうっかり情報をたれ流すと思うか？<line-break>ここから先は、有料の会話だ。<end>"
english = "Money first. Did you think a little witty banter would make me carelessly spill everything? From here on, the conversation costs you.<end>"

["490046"]
japanese = "５０００ギア。<end>"
english = "Five thousand Gea.<end>"

["490047"]
japanese = "話にならん。<end>"
english = "Out of the question.<end>"

["490048"]
japanese = "じゃあ更に、今までの賭けの俺の勝ち分<line-break>全部チャラ。これでどうだい？<line-break>１００００ギアはいくだろ？<end>"
english = "Then I'll throw in all my winnings from our past bets. Wipe the slate clean. How's that? It must come to ten thousand Gea.<end>"

["490049"]
japanese = "ふざけるな。お前のイカサマに<line-break>金を払う義務も必要もない。<end>"
english = "Don't be absurd. I have neither reason nor obligation to pay for your cheating.<end>"

["490050"]
japanese = "ちぇ。じゃあ、ここでまたひとつ\u3000\u3000<line-break>俺と勝負といこうや。<line-break>イカサマは、なしだ。<line-break>俺が勝ったら今の条件で情報をもらう。<line-break>お前が勝ったら今の条件分、全部<line-break>お前が持って帰っていい。どうだ？<end>"
english = "Tch. Then let's have one more wager, right here. No cheating. If I win, you give me the information for what I've just offered. If you win, you can take the whole amount home with you. What do you say?<end>"

["490051"]
japanese = "いいだろう。<line-break>何で勝負だ？<end>"
english = "Very well. What are we wagering on?<end>"

["490052"]
japanese = "この酒場に次に来る客は<line-break>男か、女か。これを当てる。<line-break>さあ、どっちだい？<end>"
english = "We guess whether the next customer through the door is a man or a woman. So, which will it be?<end>"

["490053"]
japanese = "女、だ。<line-break>俺の耳は今、ここに向かって歩く<line-break>女の足音をしっかりととらえている。<end>"
english = "A woman. I can clearly hear a woman's footsteps approaching this tavern.<end>"

["490054"]
japanese = "ふーん、女か。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>この酒場はそこにいるべっぴんさん<line-break>目当ての客が多いらしいんだがな。<line-break>ま、女でいいんだな？<end>"
english = "Hmm, a woman? I'd heard a lot of this tavern's customers come to see that beauty over there. Still, you're sure about a woman?<end>"

["490055"]
japanese = "い、いや待て。\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>……男だ。男でいく。<end>"
english = "N-no, wait. A man. I'll choose a man.<end>"

["490056"]
japanese = "わかった。男だな。<end>"
english = "All right. A man, then.<end>"

["490057"]
japanese = "こんにちはフェルムちゃん。<line-break>この前お願いしたお酒、ある？<end>"
english = "Hello, Ferme. Do you have that drink I asked for the other day?<end>"

["490058"]
japanese = "あ、おばあちゃん、こんにちは。<line-break>あのお酒、ありますよ。<line-break>はい、これですよね？<end>"
english = "Oh, hello, ma'am! Yes, I have it. Here you are. This is the one, right?<end>"

["490059"]
japanese = "ええ、これこれ。<line-break>うちの人が飲みたがってねえ。<line-break>じゃ、ありがとうね。フェルムちゃん。<end>"
english = "Yes, that's it. My husband has been wanting some. Thank you, Ferme.<end>"

["490060"]
japanese = "はい。<line-break>また来てくださいね、おばあちゃん。<end>"
english = "Yes. Please come again, ma'am.<end>"

["490061"]
japanese = "女、だったな…。<end>"
english = "That was a woman.<end>"

["490062"]
japanese = "ああ、<line-break>かなり歳をくってはいるが<line-break>女だった…。<line-break>………………。<end>"
english = "Yes. A very old woman, but a woman nonetheless...<end>"

["490063"]
japanese = "いや、残念だったな。<line-break>そんじゃ、<line-break>情報、聞かせてもらおうか。<end>"
english = "Too bad. Now then, let's hear that information.<end>"

["490064"]
japanese = "……ちっ。<line-break>まず、最初のほうだが、あんた、<line-break><value:$28>、だっけ？<line-break>エリスは結構、あんたのことを<line-break>気に入っているようだ。<line-break>殺されることはまずないな。<end>"
english = "Tch. First, about you. It was <value:$28>, wasn't it? Eris seems rather fond of you. You almost certainly won't be killed.<end>"

["490065"]
japanese = "あとの方だが、ルルアンタは<line-break>旅芸人の一座にくっついて行った。<line-break>が、これが問題含みだ。<line-break>最近起こっている誘拐事件、あれに<line-break>関わっている盗賊団が、その一座を<line-break>隠れみのに使っている。<end>"
english = "As for the other matter, Lulluantha tagged along with a traveling troupe. That's where the trouble starts. The bandits behind the recent kidnappings are using the troupe as cover.<end>"

["490066"]
japanese = "まずいな。<line-break>ルルアンタの性格なら、まず確実に<line-break>面倒事に首を突っ込むだろうな。<end>"
english = "That's bad. Knowing Lulluantha, she's almost certain to stick her nose into the whole mess.<end>"

["490067"]
japanese = "そうか、なら<line-break>生きて再会したければ<line-break>早く追いかけることだな。\u3000\u3000<line-break>その一座はこれから<line-break>リベルダムをまわって<line-break>エンシャントへ向かうそうだ。<end>"
english = "Then if you want to see her alive again, you'd better hurry after her. I hear the troupe is making the rounds through Liberdam before heading to Ancient.<end>"

["490068"]
japanese = "ありがとうよ、ツェラシェル。<line-break>ついでに頼めるかな？<end>"
english = "Thanks, Tzerashel. Mind doing me one more favor?<end>"

["490069"]
japanese = "あーいい、言うな。<line-break>言おうとしてる事はわかるし、<line-break>断らせないつもりなのもわかる。<line-break>エリスあたりに時間稼ぎして、<line-break>その子に呼び出しがかかるのを<line-break>遅らせればいいんだろ？<end>"
english = "Oh, spare me. I know what you're about to ask, and I know you have no intention of letting me refuse. You want me to stall Eris and delay that child's summons, right?<end>"

["490070"]
japanese = "さすがだな。よろしく頼む。<line-break>感謝してるぜ。<end>"
english = "I knew I could count on you. Take care of it for me. I appreciate this.<end>"

["490071"]
japanese = "感謝より金だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>だいたい、こんなこと、<line-break>本当ならお前がやればいいことだ。<end>"
english = "I'd rather have money than gratitude. Besides, this is something you ought to be doing yourself.<end>"

["490072"]
japanese = "そうもいかないのさ。<line-break>\u3000<line-break>\u3000<line-break>さて、と。<end>"
english = "That's not an option. Well, then.<end>"

["490073"]
japanese = "そうだな、お前さんの言うとおり、\u3000<line-break>まずはリベルダムだ。<line-break>急がないと、ルルアンタが危ない。<line-break>…と、その前に旅の支度をしてこい。<line-break>街の門で合流しようぜ。<line-break>じゃあな。<end>"
english = "You're right. Liberdam first. Lulluantha will be in danger if we don't hurry. But before that, go get ready for the journey. We'll meet at the city gate. See you there.<end>"

["490074"]
japanese = "ん？<line-break>さっき負けたらどうするつもり<line-break>だったかって？<line-break>なに、さっきの勝負に<line-break>負けは無かったのさ。<end>"
english = "Hm? What would I have done if I'd lost that wager? Simple. There was no chance of me losing.<end>"

["490075"]
japanese = "あいつの五感はすごいからな。<line-break>はじめに奴が言ったろ？\u3000女って。\u3000\u3000<line-break>それが正解さ。<line-break>あとはそれを撤回するように<line-break>ゆざぶってやればいい。<line-break>やっぱり奴は賭け事に向いていないな。<end>"
english = "His five senses are extraordinary. Remember what he said first? A woman. That was the right answer. All I had to do was rattle him until he changed it. He really isn't cut out for gambling.<end>"

