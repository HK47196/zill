["490090"]
japanese = "<value:$28>、どうしたのじゃ。<line-break>港へ行くのではなかったのか？<end>"
english = "What's the matter, <value:$28>? Weren't you going to the harbor?<end>"

["490091"]
japanese = "お主もじゃ。<line-break>いつまでもこんな所で<line-break>油を売ってていいのか？<end>"
english = "And what about you? Can you afford to stand around here all day?<end>"

["490092"]
japanese = "んー、あ、ああ。<line-break>ま、すぐ行くさ。<end>"
