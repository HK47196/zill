japanese = "禁断の聖杯については<line-break>今、ゴブゴブ団という<line-break>３匹のゴブリンが持っています。<line-break>とりあえずは、<line-break>エンシャントを探してみると<line-break>彼らに会えると思いますよ。<end>"
english = "The Forbidden Grail is currently in the possession of three Goblins known as the Gobgob Gang. For now, try looking for Ancient. I think that will lead you to them.<end>"

["490282"]
japanese = "ここにいるブサイクな猫です。\u3000\u3000\u3000\u3000<line-break>口は悪いけど、無害ですよ。<line-break>もともとは老人星の精霊で<line-break>天空の賢者とも呼ばれた者でしたが<line-break>地上に堕ちて、魔人になりました。<end>"
english = "It's the ugly cat right here. It has a foul mouth, but it's harmless. It was originally the spirit of the Old Man Star and was also known as the Sage of the Heavens, but after falling to earth, it became a demon.<end>"

["490283"]
japanese = "破壊神の強力な魔人、<line-break>１２人の円卓騎士のひとりで、<line-break>名前を知るもの、の異名を持ちます。<line-break>そのあだ名の通り<line-break>金を出せば名前を付けてくれますが<line-break>ま、あんまりおすすめはしません。<end>"
english = "This is one of the God of Destruction's powerful demons, one of the twelve Knights of the Round Table, and bears the epithet “the One Who Knows Names.” True to that epithet, a name will be assigned for a price, though I cannot really recommend it.<end>"

["490284"]
japanese = "円卓騎士には他に<line-break>アーギルシャイアなどがいますね。<line-break>\u3000<end>"
english = "Other Knights of the Round Table include Argyleshire.<end>"

["490285"]
japanese = "破壊神ウルグの円卓騎士の１人です。<line-break>妖艶な美女の姿をしています。<line-break>\u3000<line-break>きわめて、気まぐれで残酷です。<line-break>すでに神器を手に入れるため<line-break>ミイスの村を焼き払っています。<end>"
english = "She is one of Urg the God of Destruction's Knights of the Round Table and takes the form of a bewitchingly beautiful woman. She is extremely capricious and cruel. She has already burned Miis Village to the ground in pursuit of a divine artifact.<end>"

["490286"]
japanese = "究極生物を作ろうとして、<line-break>その製法を神器、禁断の聖杯から<line-break>得ようと、聖杯をねらっています。<line-break>円卓騎士には他に<line-break>うちのネモなどがいますね。<line-break>\u3000<end>"
english = "She is after the Forbidden Grail, a divine artifact, hoping to learn from it how to create an Ultimate Life-Form. The other Knights of the Round Table include our own Nemo.<end>"

["490287"]
japanese = "そうですか。<end>"
english = "Is that so?<end>"

["490288"]
japanese = "ま、こんな感じですかね。<line-break>わかっていただけましたか？<end>"
english = "Well, that about covers it. Does that make sense?<end>"

["490289"]
japanese = "聖杯をねらってる悪い魔人は\u3000<line-break>アーギルシャイア。<line-break>\u3000<line-break>聖杯を持ってるゴブリンは<line-break>ゴブゴブ団、っていって<line-break>今はエンシャントにいる…と。<end>"
english = "The evil demon after the Grail is Argyleshire. The Goblins who have the Grail are called the Gob-Gob Gang, and they're in Ancient now... Right.<end>"

["490290"]
japanese = "忘れないように<line-break>覚えておかなくちゃ。<line-break>\u3000<end>"
english = "I'd better remember that so I don't forget.<end>"

["490291"]
japanese = "俺も冒険者だ。<line-break>それこそ、世界中をまわった。\u3000\u3000\u3000<line-break>\u3000<line-break>賢者の森にも何度も来た。だが、<line-break>ここに入ったことは一度もなかった。<line-break>運命に選ばれていなかったんだな。<end>"
english = "I'm an adventurer too. I've traveled all over the world. I've been to Sage's Forest many times, but I'd never once set foot in this place. Fate hadn't chosen me, I suppose.<end>"

["490292"]
japanese = "その俺がここにいる。<line-break>これはどういうことだって思う？<end>"
