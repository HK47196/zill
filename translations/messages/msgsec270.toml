["2700002"]
japanese = "そうか。知らぬか。<end>"
english = "I see. So you don't know her.<end>"

["2700003"]
japanese = "いや、なに。<line-break>そのイーシャが最近、天経院の周りで<line-break>ダークエルフと一緒にいたと聞いてな。<line-break>ダークエルフには<line-break>善悪の区別なく、殺して回る<line-break>物騒な奴もいる。<line-break>イーシャがそんな奴と<line-break>関わりになっているとは思えんが<line-break>ちと心配になってな。<end>"
english = "No, it's just that I heard Iria has been around the Tenkeiin with a Dark Elf lately. Some Dark Elves are dangerous sorts who go around killing without regard for good or evil. I can't imagine her getting mixed up with anyone like that, but it has me a little worried.<end>"

["2700004"]
