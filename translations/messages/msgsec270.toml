["2700001"]
japanese = "それはそうと、お主。<line-break>イーシャという娘を知らんかね？<line-break>\u3000<line-break>そうだな。歳は２０歳前後。<line-break>髪は茶色で、可愛い顔をしているが、<line-break>短剣やナイフの扱いが得意でな。<end>"
