["1400391"]
japanese = "私は…<line-break>道具としての役目を<line-break>完全に失ってしまいました…。<line-break>これから、どう生きればいいのか、<line-break>それすらもわかりません。<line-break>わかりません…しかし…<end>"
english = "I have completely lost my purpose as a tool. I do not even know how I am to live from now on. I do not know... and yet...<end>"

["1400392"]
japanese = "なぜか生きていきたいと思うのです。<line-break>あなたと同じこの世界で生きること、<line-break>それがとても…何か…<line-break>理解できません。ですが感じるのです。<line-break>この感情は、苦しいのです。<line-break>しかし、何か…とても…<end>"
english = "For some reason, I want to go on living. To live in this same world with you... it feels so... I do not know what it is. I cannot understand it. But I can feel it. This feeling is painful. And yet, there is something... something very...<end>"

["1400393"]
japanese = "…意味不明な言葉ばかり、すみません。<line-break><value:$28>様、<line-break>どうか、またお会いできますよう…。<end>"
english = "I am sorry. I have spoken nothing but nonsense. <value:$28>, I pray that we may meet again...<end>"

["1400394"]
japanese = "さあ、そなたも行くがよい。<line-break>無限のソウルを持つ者よ。<line-break>\u3000<line-break>最後に、礼を言うぞ。<line-break>そなたのおかげで、わらわも<line-break>未来に希望を見出せそうじゃ。<end>"
