english = "<value:$28>, you shouldn't have saved me.<end>"

["1400411"]
japanese = "あのあと、ボクは<line-break>巫女として完全に覚醒した。<line-break>そしてエアのようにすべてを知った。<end>"
english = "After that, I fully awakened as a priestess. And like Er, I came to know everything.<end>"

["1400412"]
japanese = "<value:$28><line-break>キミは…利用されていたんだ。<line-break>地の精霊神グラジェオンにね。<line-break>グラジェオンは闇の聖母ティラの子だ。<line-break>そして主神バイアスは巨人たちに命じて<line-break>闇の聖母神ティラを封じていたんだ。<end>"
english = "<value:$28>, you were... being used. By Grajeon, the earth spirit god. Grajeon is the child of Tira, the Dark Mother. And Bias, the Chief God, ordered the giants to seal away Tira, the Dark Mother Goddess.<end>"

["1400413"]
japanese = "グラジェオンは母親を救おうと<line-break>キミを利用して、巨人を倒させ、<line-break>そして闇の聖母の封印を解いたんだ。<line-break>ボクは空中都市が落下したあと<line-break>この地の魔法力が乱れ、<line-break>封印が弱まってたのを守ってたんだ。<end>"
english = "Grajeon used you to save Tira, the god's mother. You were made to defeat the giants and break the Dark Mother's seal. After the Floating City fell, the magical power in this land was thrown into turmoil and the seals weakened. I was guarding them.<end>"

["1400414"]
japanese = "その１つを…キミは解いてしまった。<line-break>ティラの憎しみの強さは<line-break>知ってるよね。<line-break>キミは<line-break>ボクを助けるべきじゃ、<line-break>なかったのに…、だのに…。<end>"
english = "And you... broke one of them. You know how deep Tira's hatred runs. You shouldn't have saved me. You shouldn't have... and yet...<end>"

["1400415"]
japanese = "それを…、キミが解いてしまった…。<line-break>ティラは世界を生み、<line-break>そしてノトゥーンに奪われた女神だ。<line-break>ティラは人が自然を破壊するのを<line-break>我が子が傷つけられるように<line-break>悲しみ、怒り、憎んでいる。<end>"
english = "You... broke that seal. Tira is the goddess who created the world, only to have Notun take it from her. When humans destroy nature, she feels grief, anger, and hatred as though her own offspring were being harmed.<end>"

["1400416"]
japanese = "その悲しみや怒りや憎しみが<line-break>神々の戦いを引き起こし、<line-break>それは、現在にまで尾を引いている。<line-break>かつて戦いに敗れたティラは<line-break>その身体を４つに裂かれて封印された。<line-break>キミはその封印を解いたんだ。<end>"
english = "That grief, rage, and hatred sparked the war of the gods, and its effects linger to this day. Tira lost that war long ago. Her body was torn into four pieces, and each was sealed away. You broke that seal.<end>"

["1400417"]
japanese = "神代以来、破られたことのない封印を…<line-break>やがて、ティラは破壊神ウルグなど<line-break>比べものにならない災厄をもたらすよ。<line-break>キミは<line-break>ボクを助けるべきじゃ、<line-break>なかったのに…、だのに…。<end>"
english = "A seal that had stood unbroken since the Age of the Gods... In time, Tira will bring a calamity that makes Urg, the God of Destruction, seem like nothing. You shouldn't have saved me. You shouldn't have... and yet...<end>"

["1400418"]
japanese = "バカだよ…。<line-break>本当にバカだよ、キミは…！<end>"
english = "You fool... You really are a fool...!<end>"

["1400419"]
japanese = "ゴメン…。<line-break>ゴメン…。本当はうれしいです。<line-break>ゴメン…。ありがとう…。<end>"
english = "I'm sorry... I'm sorry... The truth is, I am happy. I'm sorry... Thank you...<end>"

["1400420"]
japanese = "（そして、たぶん、いつか、さよなら）<end>"
english = "(And perhaps, someday, goodbye.)<end>"

["1400421"]
japanese = "ううん…。<line-break>聞こえなくていいんだ。<line-break>今はね…。<end>"
english = "No... It's all right if you didn't hear that. For now...<end>"

["1400422"]
japanese = "ね、また一緒に旅をしよう。<line-break>ボクを冒険に<line-break>連れていってよ。<end>"
english = "Let's travel together again. Take me on another adventure.<end>"

["1400423"]
japanese = "うれしいよ…。<line-break>ボク、また、<line-break>キミの側にいられるんだね。<end>"
english = "I'm so glad... I can be by your side again.<end>"

["1400424"]
japanese = "じゃあ、また猫屋敷で<line-break>呼び出してくれるのを<line-break>待ってるから。<end>"
english = "Then I'll wait at Cat Manor for you to summon me again.<end>"

["1400425"]
japanese = "キミといっしょにいられる<line-break>この一瞬一瞬…<line-break>ボク…大事にするよ。<end>"
english = "Every moment I get to spend with you... I'll treasure it.<end>"

["1400426"]
japanese = "\u3000\u3000\u3000  \u3000\u3000\u3000…来たか<line-break>\u3000\u3000   \u3000無限のソウルを持つ者よ<line-break>\u3000\u3000\u3000    我は汝を待っておった<line-break>\u3000我こそは地の精霊神、グラジェオンなり<end>"
english = "So, you have come, Bearer of the Infinite Soul. I have been awaiting you. I am Grajeon, Spirit God of Earth.<end>"

["1400427"]
japanese = "\u3000\u3000  \u3000\u3000地の巫女、エステルは\u3000\u3000<line-break>空中都市崩壊時に発生せる魔法力場の嵐より<line-break>\u3000  \u3000 \u3000\u3000世界を守らんがため<line-break>\u3000 この地にて、自ら封印となっておる<end>"
english = "To protect the world from the magical force-field storm unleashed by the collapse of the Floating City, Esther, the Priestess of Earth, has made herself a seal here.<end>"

["1400428"]
japanese = "\u3000\u3000\u3000エステルを救う方法、なきにしもあらず\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000我が力が完全に復活したならば<line-break>\u3000\u3000\u3000\u3000\u3000力場の乱れ、収めてしんぜよう<line-break><line-break>\u3000\u3000\u3000さすればエステルは封印となる必要なし<line-break>\u3000\u3000\u3000\u3000\u3000再び汝とともに旅に立てよう<line-break>\u3000\u3000\u3000\u3000聖地母神の長兄たる我を封じる巨人<line-break>\u3000\u3000\u3000\u3000\u3000\u3000パンタ・レイを倒すがよい<end>"
english = "There may yet be a way to save Esther. If my power were fully restored, I would quell the disturbance in the force field. Then Esther would no longer need to be the seal and could journey with you once more. I am the eldest brother of the Sacred Mother Goddess. Defeat Panta Rei, the giant who keeps me sealed away.<end>"

["1400429"]
