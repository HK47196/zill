["1400395"]
japanese = "私は、ウルカーンへ戻ります。<line-break>そこにはもう、私の役目は<line-break>何もないのかもしれませんが…。<end>"
english = "I shall return to Ulcaan. There may no longer be any purpose for me there, but...<end>"

["1400396"]
japanese = "<value:$28>さん…、<line-break>本当にありがとうございました。<line-break>\u3000<line-break>私…私もできることなら<line-break><value:$28>さんの旅に…。<end>"
english = "<value:$28>... thank you. Truly. If I could, I... I would join <value:$28> on the journey...<end>"

["1400397"]
japanese = "…いえ、なんでもありません。<line-break>私は、アキュリュースで<line-break>私のなすべきことをなしましょう。<line-break>では、<value:$28>さん、<line-break>また、アキュリュースへ…<line-break>私の所へいらしてください。<end>"
english = "No, it is nothing. I shall do what I must in Aqyurius. Well then, <value:$28>, when you next come to Aqyurius... please come and see me.<end>"

["1400398"]
japanese = "<value:$28>…。<line-break>わらわは、今<line-break>希望を感じておる。<line-break>おそらく、わらわにとって<line-break>生まれて初めての希望じゃ。<line-break>未来を強く願うほどのな…。<end>"
english = "<value:$28>... I feel hope now. Perhaps it is the first hope I have ever known―the kind that makes me yearn for the future.<end>"

["1400399"]
japanese = "今までのわらわは<line-break>見える未来に絶望するだけで<line-break>あらがう強さを持たなかった。<line-break>そなたが、教えてくれたのじゃ。<line-break>未来を切り開く強さを。<line-break>希望を持ち、進む生き方を…。<end>"
english = "Until now, I could only despair at the future I foresaw. I had not the strength to defy it. You taught me that strength: the strength to carve out a future, to live with hope and press onward.<end>"

["1400400"]
japanese = "………………。<line-break>\u3000<line-break>\u3000<line-break>行くがよい。<line-break>このままでは、わらわはそなたを<line-break>引きとめてしまいそうじゃ。<end>"
english = "... Go now. If you remain, I fear I may try to keep you here.<end>"

