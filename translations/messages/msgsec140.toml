value:$01><equal>191大爆発！？<line-break>冗談じゃないわ！<line-break>\u3000<line-break><value:$28>、急ぎましょ！<line-break>巫女たちを助けるしか<line-break>打開策はないわ！<end><if><value:$01><equal>190くっ！<line-break>何とか爆発を食い止めないと！<line-break>でもどうすれば…？<line-break>ラドラスの巫女である彼女たちなら<line-break>何か知っているかもしれない。<line-break>動力の間に急ごう！<end>大変だ！\u3000早くなんとかしないと、<line-break>僕たちみんなドッカ～ンだよ！！<line-break>\u3000<line-break>う～ん、う～ん…、そうだ！<line-break>まずは巫女のみんなを助けに行こう！<line-break>彼女たちなら何か対策知ってるかも！ <end>"
