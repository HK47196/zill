["1400402"]
japanese = "追加メッセージここから<end>"
english = ""

["1400403"]
japanese = "\u3000 \u3000よくぞ、巨人パンタ・レイを倒した<line-break>\u3000\u3000\u3000これで、我の力を妨げる者はない<line-break>\u3000\u3000礼を言うぞ。無限のソウルを持つ者よ<line-break><line-break>\u3000\u3000\u3000\u3000\u3000我は感謝の証として、<line-break>\u3000\u3000\u3000汝に我が力の一部を与えよう<line-break>\u3000\u3000人の子にはあまるほどの巨大な力を<end>"
english = "You have done well to defeat the giant Panta Rei. Now none remain who can hinder my power. You have my thanks, Bearer of the Infinite Soul. As a token of my gratitude, I shall grant you a portion of my power―a vast power beyond the measure of any mortal.<end>"

["1400404"]
japanese = "地の最高位の魔法が解放された。<end>"
