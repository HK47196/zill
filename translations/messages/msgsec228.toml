english = "Death comes to every living thing. No matter how dear a friend may be, there comes a time when we must say goodbye. That is why we all cherish life, and why we grieve when death comes. But grief isn't all there is. I'm sure your dog is glad to have been loved by you. And the memories of your time together are still warm in your heart, aren't they?<end>"

