["1370087"]
japanese = "あん？\u3000相変わらずうるさいって？\u3000\u3000<line-break>いっひっひ。まだまだ青いねぇ。<line-break>相変わらずなのはお前の方だよ。<line-break>普通、ああいう展開があれば、<line-break>そのあとふたりの仲は急速に発展する<line-break>ってのがお約束なんだが…ま、いいか。<end>"
