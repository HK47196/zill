["1370506"]
japanese = "ソウルを磨きあげるための経験を、<line-break>冒険者たちは、ソウルポイントと<line-break>呼んでる。覚えておけよ。<line-break>ソウルポイントが一定までたまると、<line-break>さらに優れたソウルを<line-break>宿せるんだ。<end>"
