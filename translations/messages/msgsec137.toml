english = "We're not out of danger yet, but I'd like to believe Irene will keep Karula in check from now on.<end>"

["1370083"]
japanese = "今回の戦いのあと、道場に人が殺到だ。<line-break>自警団を強化しようとか言ってな。<line-break>逃げようってよりはいいんだろうがな。<line-break>だが、そんなことをしても、<line-break>ディンガル軍を刺激するだけだ。<line-break>今はおとなしくした方がいい。<end>"
