["1370100"]
japanese = "あ、そうだ、もし急いでなかったら<line-break>うちのダンナにも会っていっておくれよ。<line-break>きっと、おんなじような反応すると思うけどね。<line-break>この町の裏山で<line-break>ひとりで木を切ってるんだ。<line-break>行きゃあわかるよ。<end>"
