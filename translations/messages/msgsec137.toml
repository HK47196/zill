["1370109"]
japanese = "木こりかどうかなんて問題じゃないんだけどね。<line-break>私は働く男の背中ってのに弱くてね。<line-break>\u3000<line-break>うちの人には昔からそれがあったから、<line-break>つい、くらっときちまって、<line-break>駆け落ち同然で一緒になっちまったんだよ。<end>"
