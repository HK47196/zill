["1370701"]
japanese = "精霊レベルのことか。<line-break>確かにそれも装備品まわりの<line-break>ことではあるが、ちょいと…<line-break>それは鍛冶屋じゃなくて、<line-break>教会の仕事なんでな。<end>"
english = "Spirit Levels, eh? True, that does have to do with equipment, but... it's church work, not a blacksmith's.<end>"

["1370702"]
japanese = "火、水、土、風…<line-break>この四種類が精霊の属性です。<line-break>\u3000<line-break>聖母神がお作りになったこの四属性が<line-break>互いに干渉しあい、循環することで<line-break>世界は成り立っています。<end>"
english = "Fire, water, earth, and wind: these are the four Spirit Attributes. The world exists through the interplay and circulation of these four attributes, created by the Mother Goddess.<end>"

["1370703"]
japanese = "火は水に強く、水は土に強く、<line-break>土は風に、風は火に強い。<line-break>\u3000<line-break>おわかりでしょう？<line-break>どれが圧倒的に優位ということはなく、<line-break>うまくバランスをとっているのです。<end>"
english = "Fire is strong against water, water against earth, earth against wind, and wind against fire. You see? None holds an overwhelming advantage; together, they maintain a careful balance.<end>"

["1370704"]
japanese = "装備の精霊レベルをあげるということは<line-break>そのまま、この四属性の性質を<line-break>盛り込むことになるのです。<line-break>例えば、あなたが火属性の剣を持ち、<line-break>火属性の鎧を身につけたとしましょう。<end>"
english = "Raising a piece of equipment's Spirit Level imbues it with the nature of one of those four attributes. Suppose, for example, that you wield a Fire-element sword and wear Fire-element armor.<end>"

["1370705"]
japanese = "あなたは水属性の相手に対して<line-break>圧倒的に有利に戦うことができ、<line-break>\u3000<line-break>火属性のダメージを<line-break>大幅に軽減することができます。<line-break>これは大変有益なことです。<end>"
english = "You would have an overwhelming advantage against a Water-element opponent, while greatly reducing the Fire-element damage you suffer. This can be extremely useful.<end>"

["1370706"]
japanese = "さらに、この精霊の力は、<line-break>装備品ごとに上限が定まってはいますが、<line-break>レベルとして向上させることができます。<line-break>同じ火の属性の剣でも、<line-break>１レベルと３レベルでは<line-break>大きくその威力が変わってくる。<end>"
english = "This spiritual power can also be raised in levels, though every piece of equipment has its own limit. Even between two Fire-element swords, the difference in power between level one and level three is considerable.<end>"

["1370707"]
japanese = "ですが、同時に、忘れないでください。<line-break>精霊レベルが高いということは、<line-break>それだけ純粋に近いという証。<line-break>火属性の剣の攻撃では、<line-break>同じ火属性の敵を<line-break>傷つけることは難しく…<end>"
english = "But there is something else you must remember. A higher Spirit Level is a sign of greater elemental purity. A Fire-element sword will have difficulty harming a Fire-element enemy...<end>"

["1370708"]
japanese = "火属性の鎧は、風属性の攻撃を、<line-break>時に倍にもして受けてしまうことが<line-break>あるということを…。<end>"
english = "...and Fire-element armor may sometimes cause you to take as much as twice the damage from a Wind-element attack.<end>"

["1370709"]
japanese = "ふうむ、さすが神官様は説明がうまい。<line-break>口下手な俺なんかが<line-break>でしゃばらなくて良かったぜ。<end>"
english = "Hmm. A priest certainly knows how to explain things. Good thing a poor talker like me didn't butt in.<end>"

["1370710"]
japanese = "装備に精霊の力を宿したくなったら、<line-break>神殿へいらっしゃい。<line-break>お待ちしてますよ。<end>"
