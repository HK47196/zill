["1370101"]
japanese = "なんだい？\u3000<line-break><value:$28>じゃないか。<line-break>いつ帰ってきたんだい？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>おや、今日はナッジは一緒じゃないんだね。<line-break>ま、せっかく来たんならうちのダンナにも<line-break>会ってってやっておくれよ。<end>"
