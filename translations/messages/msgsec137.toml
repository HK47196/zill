["1370094"]
japanese = "今のところディンガル軍に動きはない。<line-break>この街もどことなく不安が漂ってはいるが、<line-break>住民の生活の息づかいは元に戻りつつある。<line-break>もともとこの平民街は、ロストール王家から<line-break>援助を受けていたわけではないからな。<line-break>昔も今も、自分たちの力で生きているんだ。<end>"
english = "So far, the Dyneskal Army has made no move. There is still an undercurrent of anxiety in this town, but the pulse of the townspeople's lives is gradually returning to normal. This commoners' quarter has never received aid from the Rostorl royal family. Then as now, its people have lived by their own strength.<end>"

["1370095"]
japanese = "その力はたくましいものだが、武力に対抗する<line-break>種類の力ではない。<line-break>だから、俺がここにいるんだ。<line-break>これからも、ディンガルがこの街を<line-break>つぶしに来ない限り、<line-break>俺の方から動くつもりはない。<end>"
english = "It's a hardy sort of strength, but not one that can stand against military force. That's why I'm here. Unless Dyneskal comes to crush this town, I have no intention of making the first move.<end>"

["1370096"]
japanese = "よう、<value:$28>。<line-break>この前は世話になったな。<line-break>アイリーンの様子はどうだい？<end>"
english = "Hey, <value:$28>. Thanks for your help the other day. How's Irene doing?<end>"

["1370097"]
japanese = "あん？\u3000相変わらずうるさいって？\u3000\u3000\u3000\u3000<line-break>いっひっひ。まだまだ青いねぇ。<line-break>相変わらずなのはお前の方だよ。<line-break>普通、ああいう展開があれば、<line-break>そのあとふたりの仲は急速に発展する<line-break>ってのが、お約束なんだが…ま、いいか。<end>"
