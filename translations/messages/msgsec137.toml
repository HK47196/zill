english = "But that doesn't mean you should spoil a man. You can rely on him, but don't show it too much. Mind you, never showing it at all is no good either. Striking the right balance is the secret to keeping a household together.<end>"

["1370112"]
japanese = "<if><value:$29><equal>%0おっと、男のあんたにしてみれば<line-break>こんな話はつまらないかもしれないね。\u3000\u3000<line-break>\u3000<line-break>でも、あんたも、いずれ、<line-break>私の言ってたことの意味が<line-break>わかるだろうよ。<end>よく覚えておきなよ。<line-break>家庭を持つ女の先輩として忠告さ。<line-break>いずれ、あんたも所帯を持ったらわかるよ。<end>"
english = "<if><value:$29><equal>%0Oh, I suppose a man like you might find all this rather dull. Still, one day you'll understand what I meant.<end>Remember that. Take it as advice from a woman with more experience of married life. You'll understand once you have a household of your own.<end>"

