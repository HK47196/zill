english = "Even with swords, you might want a slimmer blade or a straighter one, right? That's what I mean. And of course, we can restore its old shape too. Handy, isn't it?<end>"

["1370304"]
japanese = "おう、効果のことな。<line-break>お前さん、<line-break>ハチに刺されたことがあるかい？<end>"
english = "Ah, effects. Ever been stung by a bee?<end>"

["1370305"]
japanese = "かゆくなったり痛くなったり…<line-break>そうなるのは、<line-break>ハチの針に毒があるからだな。<line-break>武器に効果をつけるってのは、<line-break>例えるなら、お前さんの剣が<line-break>ハチの針みてえになるってことよ。<end>"
english = "It itches or hurts because there's venom in the bee's stinger. Giving a weapon an effect is like turning your sword into a bee's stinger.<end>"

["1370306"]
japanese = "刺したと同時に敵を眠らせちまう槍や、<line-break>斬ることで相手を麻痺させる剣、<line-break>なんてのも作れる。<line-break>防具はその逆だ。<line-break>石化や呪いからお前さんを<line-break>守ってくれる防具も作れる。<end>"
english = "We can make a spear that puts an enemy to sleep the moment it strikes, or a sword that inflicts Paralysis when it cuts. Armor works the other way around: we can make armor that protects you from petrification or curses.<end>"

["1370307"]
japanese = "こいつは難しい仕事だから、<line-break>それなりのギアをいただくが、<line-break>重宝するぜ。<line-break>強度や形状を変えてもまだ…<line-break>って時には、<line-break>ぜひ試してみてくれよ。<end>"
english = "It's difficult work, so it'll cost you a fair bit of Gea, but it comes in mighty useful. If changing strength and shape still isn't enough, give it a try.<end>"

["1370308"]
japanese = "俺たちにとっても、<line-break>いい稼ぎになるしな。<end>"
english = "Makes us a tidy profit, too.<end>"

["1370309"]
japanese = "ははは！<end>"
english = "Ha ha ha!<end>"

["1370310"]
japanese = "精霊属性のことか。<line-break>こいつだけは本来、<line-break>鍛冶屋の領分じゃねえ。<line-break>神殿に言って頼むことだ。<line-break>ま、俺でも、<line-break>説明くらいはできるが…。<end>"
english = "Spirit Attributes, eh? Strictly speaking, those aren't a blacksmith's business. You'll have to ask at a temple. Still, I can at least explain them.<end>"

["1370311"]
japanese = "精霊属性ってのはだな、<line-break>火や水といった精霊の力を<line-break>武器や防具に宿すことさ。<line-break>精霊の属性については<line-break>もう知ってるのかい？<end>"
english = "A Spirit Attribute imbues a weapon or piece of armor with the power of a spirit, such as Fire or Water. Do you already know how Spirit Attributes work?<end>"

["1370312"]
japanese = "知らない<end>"
english = "No, I don't<end>"

["1370313"]
japanese = "知っている<end>"
english = "Yes, I do<end>"

["1370314"]
japanese = "火、水、土、風…<line-break>この四種類が精霊の属性だ。<line-break> <line-break>聖母神がお作りになったこの四属性が<line-break>互いに干渉しあい、循環することで<line-break>世界は成り立ってるのさ。<end>"
english = "The four Spirit Attributes are Fire, Water, Earth, and Wind. The world exists because these four attributes, created by the Mother Goddess, interact with one another in an endless cycle.<end>"

["1370315"]
japanese = "火は水に強く、水は土に強く、<line-break>土は風に、風は火に強い。<line-break> <line-break>わかるだろ、ぐるぐる回ってんだ。<line-break>どれが圧倒的に優位ということはなく、<line-break>うまくバランスをとってるんだな。<end>"
english = "Fire is strong against Water, Water against Earth, Earth against Wind, and Wind against Fire. See? It goes round and round. None has an overwhelming advantage; they keep each other in balance.<end>"

["1370316"]
japanese = "まあ、魔法なんかもすべて<line-break>火、水、土、風の四属性を<line-break>元にしているからな。<line-break>お前さんにそういう知識があるなら<line-break>まず問題はねえだろ。<end>"
english = "All magic is based on those same four elements―Fire, Water, Earth, and Wind. If you know how those work, you shouldn't have much trouble.<end>"

["1370317"]
japanese = "装備の精霊属性を変更するってことは、<line-break>この四属性の性質をそのまま装備に<line-break>盛り込むってことだ。<line-break>例えば、お前さんが火属性の剣を持ち、<line-break>火属性の鎧を身につけたとする。<end>"
english = "Changing equipment's Spirit Attribute means giving it the properties of one of those four elements. Say you carry a Fire-element sword and wear Fire-element armor.<end>"

["1370318"]
japanese = "お前さんは水属性の相手に対して<line-break>圧倒的に有利に戦うことができ…<line-break> <line-break>逆に、火属性のダメージを<line-break>大幅に軽減することも可能だ。<line-break>なっ、こりゃすげえことだろ？<end>"
english = "You'd have an overwhelming advantage against a Water-element foe, while also taking far less Fire-element damage. Impressive, eh?<end>"

["1370319"]
japanese = "さらにこの精霊属性ってのには、<line-break>装備品ごと、最初から決まった強弱…<line-break>いわゆるレベルってもんがある。<line-break>同じ火属性を宿したとしても、<line-break>片手剣なら４、槍なら２、<line-break>ナックルだと６、って具合になる。<end>"
english = "What's more, every piece of equipment has a fixed strength for its Spirit Attribute―a level, in other words. Even with the same Fire element, it might be 4 for a one-handed sword, 2 for a spear, and 6 for knuckles.<end>"

["1370320"]
japanese = "だが、単に属性のレベルの数値が<line-break>高けりゃいいのかっていうと、<line-break>そんな底の浅い話でもない。<line-break>忘れないでくれよ。<line-break>精霊ＬＶが高いということは、<line-break>それだけ純粋に近いという証だ。<end>"
english = "But don't think a higher attribute level is always better. It's not that simple. Remember this: a high Spirit ＬＶ means the element is that much closer to purity.<end>"

["1370321"]
japanese = "火属性の剣では、同じ火属性の敵を<line-break>傷つけることは難しく、火属性の鎧は、<line-break>風属性の攻撃を、倍ににも受けちまう。<line-break>その効果が、さらに、<line-break>属性のレベルによって変動する。<line-break>…ま、臨機応変に、ってことだな。<end>"
english = "A Fire-element sword has trouble harming a Fire-element enemy, while Fire-element armor makes you take twice as much damage from Wind-element attacks. The attribute level changes the extent of those effects too. So adapt to the situation.<end>"

["1370322"]
japanese = "どうでえ、酔っ払ってるとは思えねえ<line-break>さわやかな弁舌だろ？<line-break>鍛冶のことなら任せとけってんだ。<end>"
english = "Well? Pretty lucid for a drunk, wasn't I? When it comes to smithing, you can count on me.<end>"

["1370323"]
japanese = "本当に大丈夫だな？<end>"
english = "You're sure you'll be all right?<end>"

["1370324"]
japanese = "ちょっと待って<end>"
english = "Wait a minute<end>"

["1370325"]
japanese = "大丈夫<end>"
english = "I'm ready<end>"

["1370326"]
japanese = "よしきた。<line-break>じゃ、何を話そうか？<end>"
english = "All right, then. What shall we talk about?<end>"

["1370327"]
japanese = "ほっほう、そいつはたいしたもんだ。<line-break>改めて俺に仕事を頼むときも、<line-break>迷わずに済むな。<end>"
english = "Well, well. That's impressive. Next time you come to hire me, you won't have any trouble deciding what to ask for.<end>"

["1370328"]
japanese = "あんたと話をしてて、<line-break>久々にハンマーが握りたくなってきた。<line-break>俺も…やり直せるのかもな…。<end>"
english = "Talking to you has made me want to pick up a hammer again. Maybe... maybe I can start over.<end>"

["1370329"]
japanese = "けっ、酔っ払いを<line-break>からかいたかっただけかよ。<line-break> <line-break>ひとりにしといてくれってんだ。<line-break>あばよ。<end>"
english = "Bah. So you only wanted to make fun of a drunk. Leave me alone. See ya.<end>"

["1370330"]
japanese = "<value:$28>様、<line-break>お帰りなさいませ。\u3000\u3000\u3000\u3000<line-break>おケガは？<end>"
english = "Welcome home, <value:$28>. Are you hurt?<end>"

["1370331"]
japanese = "ご無事で何よりです。<line-break>お父上のダディアス大神官が<line-break>神殿内でお待ちです。<end>"
english = "I'm relieved to see you safe. Your father, High Priest Dadias, is waiting for you inside the temple.<end>"

["1370332"]
japanese = "<select><value:$20>%3ロイ様ですか？<line-break>もう、広場か森に行かれたのでは？<end><value:$28>様もロイ様も<line-break>このミイスの村の大神官ダディアス様も、<line-break>神器の守護者と呼ばれるご一族。<line-break>闇の神器という危険な宝物を<line-break>破壊神の騎士と呼ばれる魔人どもから<line-break>守るのがお役目なのです。<end>今の地震といい、<line-break>最近うろつきだした魔物どもといい、<line-break>魔人が神器をねらっているのでしょうか？\u3000<line-break>しかし心配はご無用ですぞ。<line-break>きっと天空神ノトゥーンの加護があります。<line-break>このじいもついておりますしな。<end>"
english = "<select><value:$20>%3Master Roy? Hasn't he already gone to the square or the forest?<end>You, <value:$28>, Master Roy, and Lord Dadias, High Priest of Miis Village, belong to the family known as the Guardians of the Divine Artifact. Your duty is to protect the dangerous treasure called the Dark Divine Artifact from the demons known as the Knights of the God of Destruction.<end>With that earthquake just now, and the monsters that have begun prowling about of late, could the demons be after the Divine Artifact? But you need not worry. The Sky God Notun will surely protect us―and this old soldier is with you as well.<end>"

["1370333"]
japanese = "<select><value:$20>%3神器とはどのようなものかは、<line-break>その時期が来れば、<line-break>お父上が教えてくださいますよ。\u3000\u3000<line-break>こればかりは神器を守る神官家にのみ<line-break>伝わる秘伝ですからな。<line-break>じいも存じませんのです。<end><value:$28>様もロイ様も<line-break>大神官ダディアス様も、<line-break>このミイスの村の神官家の方々はみな<line-break>闇の神器という危険な宝物を、<line-break>破壊神の騎士と呼ばれる魔人どもから<line-break>守る宿命を負っておられるのです。<end>今の地震といい、<line-break>最近うろつきだした魔物どもといい…、<line-break>魔人が神器をねらっているのでしょうか？\u3000<line-break>しかし心配はご無用ですぞ。<line-break>きっと天空神ノトゥーンの加護があります。<line-break>このじいもついておりますしな。<end>"
english = "<select><value:$20>%3When the time comes, your father will tell you what the Divine Artifact is. That knowledge is a secret handed down only within the priestly family charged with guarding it. Even I do not know.<end>You, <value:$28>, Master Roy, High Priest Dadias, and all the members of Miis Village's priestly family are fated to protect the dangerous treasure called the Dark Divine Artifact from the demons known as the Knights of the God of Destruction.<end>With that earthquake just now, and the monsters that have begun prowling about of late... could the demons be after the Divine Artifact? But you need not worry. The Sky God Notun will surely protect us―and this old soldier is with you as well.<end>"

["1370334"]
japanese = "父なる天空神ノトゥーンと<line-break>愛の神ライラネートのご加護あらんことを。<line-break><value:$28>様、よくぞご無事で。<line-break>さ、早く神殿へ。<line-break>お父上のダディアス様が<line-break>心配なさっておられますよ。<end>"
english = "May Father Notun, the Sky God, and Lailanate, God of Love, watch over you. <value:$28>, I'm so glad you're safe. Quickly, to the temple. Your father, Lord Dadias, is worried about you.<end>"

["1370335"]
japanese = "<select><value:$20>%3<value:$28>様に<line-break>愛の神ライラネートのご加護を…。<line-break>\u3000<line-break>そして、<value:$28>様の敵に<line-break>天空神ノトゥーンの<line-break>裁きのいかづちを…。<end>このミイスの村は<line-break>闇の神器を闇のしもべから<line-break>守るための隠れ里…。<line-break>闇の神器は破壊神の復活に使われるもの。<line-break>だから、破壊神のしもべがねらうのです。<end>私もこの神殿の神器が<line-break>どのようなものかは存じません。<line-break>\u3000<line-break>隠れて伝わる伝承では<line-break>記憶を失うかわりに<line-break>すさまじい力を手に入れられるとか…。<end>"
english = "<select><value:$20>%3May Lailanate, God of Love, watch over you, <value:$28>... and may Notun, God of the Sky, strike <value:$28>'s enemies with the thunderbolt of judgment.<end>Miis Village is a hidden settlement meant to protect the Dark Divine Artifact from the servants of darkness. The artifact can be used to revive the God of Destruction. That is why the god's servants seek it.<end>Even I do not know what form the Divine Artifact in this temple takes. According to a secret legend, it grants tremendous power in exchange for one's memories...<end>"

["1370336"]
japanese = "…アンティノ商会が極秘開発中の<line-break>戦闘用モンスター…デスギガース。<line-break>…やはり、そういうことか。<end>"
english = "Death Gigas... the combat monster being developed in utmost secrecy by the Antino Trading Company. So that is what happened.<end>"

["1370337"]
japanese = "…心配はいらん。<line-break>こいつはすでに機能停止…<line-break>つまり、死んでいる。<end>"
english = "Don't worry. It has already ceased functioning. In other words, it's dead.<end>"

["1370338"]
japanese = "ロイほどの手練れでも倒すのは難しい。<line-break>だが、俺がただひとり認めた<line-break>あの男以上に腕の立つ男は存在しない。<line-break>ロイがこれを倒したのだな。<end>"
english = "Even someone as skilled as Roy would have struggled to defeat it. But no man is more skilled than that man, the only one I have ever acknowledged. Roy must have defeated it.<end>"

["1370339"]
japanese = "月光に反応はない。<line-break>ロイはここにはいないようだな。<end>"
english = "Moonlight shows no response. It seems Roy isn't here.<end>"

["1370340"]
japanese = "これは妖刀・月光。<line-break>ロイはこれと対をなす剣を<line-break>持っている。<end>"
english = "This is the Demon Blade “Moonlight.” Roy carries its twin.<end>"

["1370341"]
japanese = "だが、デスギガースを倒したあと、<line-break>あの男はなぜ姿を消した…？<end>"
english = "But why did he disappear after defeating Death Gigas...?<end>"

["1370342"]
japanese = "セラという男についていく<end>"
english = "Follow the man named Sera<end>"

["1370343"]
japanese = "セラという男は信用できない<end>"
english = "The man named Sera can't be trusted<end>"

["1370344"]
japanese = "ついてくるなら、<line-break>それもいいだろう。<line-break>面倒は見んがな。<end>"
english = "If you want to follow me, so be it. But don't expect me to look after you.<end>"

["1370345"]
japanese = "ロイのあとを<line-break>追いかける気はないのか？<end>"
english = "Don't you intend to go after Roy?<end>"

["1370346"]
japanese = "俺に不信があるなら<line-break>いずれ答えてやる。<line-break>ただし、それは今ではない。<line-break>今、俺は急ぐ。<end>"
english = "If you have doubts about me, I'll answer them in time. But not now. I'm in a hurry.<end>"

["1370347"]
japanese = "<if><value:$29><equal>%0来い。<line-break>ロイの弟よ。<end>来い<line-break>ロイの妹よ。<end>"
english = "<if><value:$29><equal>%0Come with me, Roy's brother.<end>Come with me, Roy's sister.<end>"

["1370348"]
japanese = "アーギルシャイアは<line-break>俺の大事なものを奪った…。\u3000\u3000<line-break>\u3000<line-break>俺は強くなる、<line-break>…どんな手段を使ってもな。<line-break>そして、俺のすべてを取り戻す。<end>"
english = "Argyleshire took something precious from me. I will become stronger, whatever it takes. And I will take back everything that is mine.<end>"

["1370349"]
japanese = "ここがディンガル帝国の首都<line-break>エンシャントだ。<line-break>\u3000<line-break>町の中でまで群れては歩かん。<line-break>町を出るまでは別行動が冒険者同士の<line-break>暗黙のルールだ。憶えておけ。<end>"
english = "This is Ancient, capital of the Dyneskal Empire. Adventurers don't travel in packs inside the city. Until we leave town, we go our separate ways. It's an unwritten rule. Remember that.<end>"

["1370350"]
japanese = "追加メッセージここから<end>"
english = ""

["1370351"]
japanese = "（村の人たちを助けに行かなきゃ…。）<line-break>\u3000<line-break>\u3000<line-break>（…そう。<line-break>\u3000兄さんと約束したんだから…。）<end>"
english = "(I have to go help the villagers.) (That's right. I promised my brother.)<end>"

["1370352"]
japanese = "遅くなってすまない。<line-break>神殿で取ってくるものが<line-break>あったのでな。<end>"
english = "Sorry I'm late. There was something I had to fetch from the temple.<end>"

["1370353"]
japanese = "ん？<line-break>父上が、私に…？<line-break>護符か。ありがたい。<end>"
english = "Hm? Father sent this for me? An amulet... I'm grateful.<end>"

["1370354"]
japanese = "<value:$28>も、<line-break>ご苦労だったな。\u3000\u3000\u3000\u3000\u3000\u3000<line-break> <line-break><value:$28>のおかげで、<line-break>父上の気遣いの心が<line-break>よく伝わってきたよ。<end>"
english = "You did well too, <value:$28>. Thanks to you, <value:$28>, Father's concern came through clearly.<end>"

["1370355"]
japanese = "…どうした？<end>"
english = "What's wrong?<end>"

["1370356"]
japanese = "そうか、そんな感覚をおぼえたか。<line-break> <line-break> <line-break>つまり、この護符を私に届けるという<line-break>仕事を成し遂げたことで、お前の中に<line-break>ソウルポイントが蓄積されたのだ。<end>"
english = "I see. So you felt it. By completing the task of delivering this amulet to me, you've accumulated Soul Points within yourself.<end>"

["1370357"]
japanese = "助けを求める声に応じ、<line-break>窮する人々に救いの手を差し伸べる。  <line-break> <line-break>そうすることにより<line-break>ソウルポイントが得られ、<line-break>さらに優れたソウルを導き寄せる。<end>"
english = "Answer the cries of those in need and extend a helping hand to people in distress. By doing so, you earn Soul Points and attract even greater Souls.<end>"

["1370358"]
japanese = "よし、では行こうか。<end>"
english = "Good. Shall we go, then?<end>"

["1370359"]
japanese = "どうした？<line-break>調査の前に<line-break>やり残したことがあるのか？<end>"
english = "What's wrong? Is there something you still need to do before the investigation?<end>"

["1370360"]
japanese = "ならば行ってくるといい。<line-break>私はここで待っている。<end>"
english = "Then go and see to it. I'll wait here.<end>"

["1370361"]
japanese = "もう大丈夫か？<end>"
english = "Are you ready now?<end>"

["1370362"]
japanese = "ではミイスの森を<line-break>調査しに行くぞ。<end>"
english = "Then let's go investigate Miis Forest.<end>"

["1370363"]
japanese = "<if><value:$29><equal>%0よう、<value:$28>。<line-break>朝も早いってのに、<line-break>魔物騒ぎで大変だったな。<end><value:$28>。<line-break>無事でよかった…。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>魔物騒ぎで森に行ったってっから<line-break>俺…、寝てらんなくって…。<line-break>でも、無事でホントよかったよ。<end>"
english = "<if><value:$29><equal>%0Hey, <value:$28>. Quite a morning you've had, dealing with those monsters at the crack of dawn.<end><value:$28>. I'm so glad you're safe... When I heard you'd gone into the forest because of the monsters, I... I couldn't sleep. I'm just really glad you're all right.<end>"

["1370364"]
japanese = "<select><value:$20>%3魔物の出現に続いて地震かよ。<line-break>いよいよ、お前たち神器を守る一族の<line-break>出番ってわけだ。<line-break>ホント大変な家に生まれちまったな。<line-break>ま、がんばれよ。<line-break>お前なら神器を守り通せるさ。<end>お前たち神官家ってさ、<line-break>このミイスにある神器を<line-break>守ってるんだよな。<line-break>…ところで神器って<line-break>なんなんだ？<line-break>どんなもんなんだ？<end>ロイ様の持ってらっしゃる剣、<line-break>カッコいいよなあ。<line-break>聖剣・日光って言うんだってな。<end>"
english = "<select><value:$20>%3First monsters, and now an earthquake. Looks like it's finally time for your family of sacred-artifact guardians to step in. You really were born into one demanding family. Well, do your best. I know you can keep the sacred artifact safe.<end>Your priestly family protects the sacred artifact here in Miis, right? So... what is a sacred artifact, anyway? What's it like?<end>That sword Lord Roy carries is so impressive. I hear it's called the Holy Sword Sunlight.<end>"

["1370365"]
japanese = "<if><value:$29><equal>%0知らない！！<line-break>知らないんだ、俺たちゃ！<line-break>面ってなんなんだよ！？\u3000おい！！<end>みんな…みんな…<line-break>あの女に燃やされて…！！<line-break>ああ…、ど、どうなってるんだよ！？<end>"
english = "<if><value:$29><equal>%0We don't know! None of us know! What mask are you talking about?! Hey!<end>Everyone... everyone was burned by that woman...! Ah... w-what's happening?!<end>"

["1370366"]
japanese = "お…おっきなじしんだったね！<line-break>わ…わたし、びっくりしちゃった。<end>"
english = "Th-that was a really big earthquake! I-it scared me.<end>"

