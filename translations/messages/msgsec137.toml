["1370077"]
japanese = "アイリーンのことを一番悲しんでるのは<line-break>彼女の母親だよ。旦那さんに続いて、<line-break>ひとり娘まで戦争にさらわれちまった。<line-break>エルメスさんの姿を見ると、<line-break>アイリーンが街を出るときにとめりゃ…<line-break>なんて考えちまってな。<end>"
