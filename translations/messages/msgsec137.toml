["1370093"]
japanese = "アイリーンなら大丈夫だろう。<line-break>あいつの目から迷いがなくなっていたからな。<line-break>いい騎士になってくれると思うぜ。<line-break>あれからディンガル軍が動く気配はないしな。<line-break>俺としては、カルラの襲撃計画を<line-break>アイリーンがとめてくれたと思いたいね。<end>"
