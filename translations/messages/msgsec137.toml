["1370000"]
japanese = "オッシ開始<end>"
english = ""

["1370001"]
japanese = "あぁ、俺がこの道場の師範<line-break>オッシだが、なんか用かい？<end>"
english = "Yeah, I'm Ossi, master of this dojo. What can I do for you?<end>"

["1370002"]
japanese = "なんだ。アイリーンを知ってるのか。<line-break>アイリーンは女だが、このあたりじゃ<line-break>かなう者がない剣の使い手だ。<line-break>アイリーンの父親は騎士でな。<line-break>アイリーンが男じゃなかったことを<line-break>くやしがってたよ。<end>"
english = "Oh? You know Irene? She may be a woman, but no one around here can match her with a sword. Her father is a knight, you see. He always regretted that she wasn't born a boy.<end>"

["1370003"]
japanese = "ロストールの法、竜綱では<line-break>女性は騎士になれないからな。\u3000\u3000\u3000<line-break>\u3000<line-break>それで、あいつは騎士になるため、<line-break>この国を出たわけだが…<line-break>あいつは元気だったかい？<end>"
english = "Under Rostorl law―the Dragon Code―a woman cannot become a knight. That's why she left the country to become one. So... was she doing well?<end>"

["1370004"]
japanese = "そいつぁよかった。アイリーンに会ったら<line-break>よろしく言っておいてくれ。<line-break>成長を楽しみにしてるってな。<end>"
english = "That's good to hear. If you see Irene, give her my regards. Tell her I'm looking forward to seeing how she develops.<end>"

["1370005"]
japanese = "そうかい。ま、用がなくてもいいやな。<line-break>ゆっくりしてくといいさ。<end>"
english = "I see. Well, you don't need a reason to be here. Stay and rest awhile.<end>"

["1370006"]
japanese = "おう、<value:$28>じゃないか。<line-break>今日はアイリーンは一緒じゃないんだな。<end>"
english = "Well, if it isn't <value:$28>. Irene's not with you today, eh?<end>"

["1370007"]
japanese = "あん？<line-break>聖杯を取り返せないうちは<line-break>俺に合わす顔がないって言ってた？\u3000\u3000\u3000<line-break>相変わらず妙なところでお堅い奴だな。<line-break>ここはただでさえ女っ気がねぇんだから、<line-break>紅一点の存在は貴重なんだがなぁ。<end>"
english = "Huh? She said she couldn't face me until she'd got the Grail back? She's as stubbornly proper as ever about the oddest things. There's little enough female company around here as it is. We can hardly do without our only woman.<end>"

["1370008"]
japanese = "今度はちゃんと連れて来いよ。\u3000\u3000\u3000\u3000\u3000<line-break>お前さんもあまり<line-break>根をつめすぎねぇようにな。<end>"
english = "Make sure you bring her next time. And don't work yourself too hard, either.<end>"

["1370009"]
japanese = "おう、<value:$28>じゃないか。<line-break>今日はアイリーンは一緒じゃないんだな。<line-break>また、ケンカでもやらかしたか？<end>"
english = "Well, if it isn't <value:$28>. Irene's not with you today, eh? You two have another fight?<end>"

["1370010"]
japanese = "なぁんだ、またその手の話かい？\u3000\u3000\u3000<line-break>お前さんも苦労が絶えないねぇ。<line-break>\u3000<line-break>生き物の半分は女なんだからよ、<line-break>色目のひとつやふたつぐらい…。<end>"
english = "What, that again? You never do get a moment's peace, do you? Half the creatures in this world are female. A wandering eye now and then is only...<end>"

["1370011"]
japanese = "アイリーンの一方的な思いこみ？<line-break>言いわけか？\u3000男らしくねぇ奴だな。\u3000<line-break>\u3000<line-break>いいじゃねえか。<line-break>いい女に目がいくのは男の性なんだよ。<line-break>弁解なんかするもんじゃねぇぜ。<end>"
english = "It was all in Irene's head? Is that your excuse? Not very manly of you. What's the harm? A man can't help noticing a beautiful woman. No point making excuses for it.<end>"

["1370012"]
japanese = "おう、<value:$28>じゃないか。<line-break>今日はアイリーンは一緒じゃないんだな。<line-break>また、ケンカでもやらかしたか？<end>"
english = "Well, if it isn't <value:$28>. Irene's not with you today, eh? You two have another fight?<end>"

["1370013"]
japanese = "たまには私抜きで行動してみなさい\u3000\u3000\u3000\u3000\u3000<line-break>って言われた？<line-break>わっはっは。こりゃおもしれぇ。<line-break>お前さんがどこに行くにつけても、<line-break>べったりくっついてってんのは<line-break>アイリーンの方なのにな。<end>"
english = "She told you to try doing things without her for once? Hah! That's a good one. Irene's the one who sticks to you like glue wherever you go.<end>"

["1370014"]
japanese = "まぁ、でも、お前さんも早く<line-break>一人前になってやんねぇと<line-break>アイリーンの方も気苦労が絶えねぇわな。\u3000\u3000<line-break>別に一人前ってのは剣の腕に限らないんだぜ。<line-break>剣でアイリーンに勝てなくても、それ以外の<line-break>何かで安心させてやればいいんだよ。<end>"
english = "Still, you'd better learn to stand on your own soon, or Irene will never have a moment's peace. And that doesn't just mean getting better with a sword. You don't have to beat Irene at swordplay. Just find some other way to put her mind at ease.<end>"

["1370015"]
japanese = "ん、<value:$28>か？<line-break>ま、ゆっくりしていけや。<end>"
english = "Hm? <value:$28>? Well, stay a while and make yourself comfortable.<end>"

["1370016"]
japanese = "アイリーンのことは気にすることないさ。<line-break>あいつならひとりでも大丈夫だろうよ。<line-break>\u3000<line-break>それよりも、せっかくのいい機会だ。<line-break>お前さんもアイリーン抜きでやってみな。<line-break>\u3000<end>"
english = "No need to worry about Irene. She can take care of herself. More importantly, this is a fine opportunity. Try managing without her for a while.<end>"

["1370017"]
japanese = "ま、それによ、<line-break>離れてみて、お互いの価値が<line-break>もっとよくわかることだってあるんだ。\u3000<line-break>これでお別れってんじゃないんだからよ。<line-break>今度、アイリーンに会うときに<line-break>笑われないようにしとくこったな。<end>"
english = "Besides, sometimes a little time apart helps you appreciate each other more. It's not as if you're parting for good. Just make sure Irene has no reason to laugh at you the next time you meet.<end>"

["1370018"]
japanese = "アイリーンは剣の筋はいいし、<line-break>しっかりした娘だ。ただ、まだ若いしな。<line-break>ま、これからってところだ。<line-break>お前さんもそうだぜ。今のうちに<line-break>いろんな物を目に焼き付けて、そして、<line-break>いろんなことを、自分で考えてみな。<end>"
english = "Irene has a real gift for the sword, and she's a sensible girl. But she's still young. She's only getting started. The same goes for you. While you can, take in as much of the world as possible, then think it all through for yourself.<end>"

["1370019"]
japanese = "若いからこそできる見方、<line-break>若いからこそできる考え方ってのが\u3000\u3000\u3000\u3000\u3000<line-break>世の中にはあるからよ。<line-break>まぁ、この手の話ってのは、<line-break>自分も年とってみないと<line-break>わかんねぇことなんだけどな。<end>"
english = "There are ways of seeing and thinking about the world that are only possible while you're young. Though I suppose that's the sort of thing you don't understand until you've grown older yourself.<end>"

["1370020"]
japanese = "なんだ。<line-break>ここの貴族さんたちのことかい？\u3000\u3000<line-break>\u3000<end>"
english = "What? You mean the nobles around here?<end>"

["1370021"]
japanese = "…まぁ、貴族制に縛られているのは\u3000<line-break>俺たちだけじゃあ、ないからな。<line-break>\u3000<line-break>やつらには、今の俺みたいな<line-break>好き勝手な暮らしなんて<line-break>できないからねぇ。<end>"
english = "Well, we're not the only ones bound by the aristocratic system. They can't just live however they please, the way I do now.<end>"

["1370022"]
japanese = "生まれたときからかけさせられた\u3000\u3000<line-break>色眼鏡をとって、世の中を<line-break>見るってことだけでも、<line-break>奴らには大きな努力が必要なんだよ。<line-break>ましてや、俺たちと同じ世界に<line-break>立つってことはな。<end>"
english = "Even taking off the tinted spectacles they were made to wear from birth and seeing the world as it is takes a tremendous effort for them. Let alone standing in the same world as us.<end>"

["1370023"]
japanese = "出世、ねえ。<line-break>あまり興味がないな。<line-break>俺にはここの道場主ってのが一番さ。<line-break>俺なんかにゃ<line-break>組織の中で名をあげるなんてのは<line-break>ただ、もう、うんざりさ。<end>"
english = "Getting ahead, huh? Can't say I'm much interested. Being the master of this training hall suits me best. I've had more than enough of trying to make a name for myself in some organization.<end>"

["1370024"]
japanese = "アイリーンは自分で考えて<line-break>騎士になりたいって言うから、\u3000\u3000\u3000<line-break>俺も喜んで送り出すけどよ。<line-break>ま、なんにしたって\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>俺はここの暮らしが<line-break>気に入っちまっててね。<end>"
english = "Irene thought it through for herself and says she wants to become a knight, so I'm happy to send her off. Anyway, I've grown pretty fond of life here.<end>"

["1370025"]
japanese = "ここは俺がやっと見つけた<line-break>自分の居場所だからな。<line-break>ちょっと、離れられねぇや。\u3000\u3000\u3000\u3000<end>"
english = "This is where I finally found a place for myself. I can't exactly leave now.<end>"

["1370026"]
japanese = "お、剣の話かい？<line-break>ところでお前さんは、<line-break>剣に何を求めているんだい？<end>"
english = "Oh, you want to talk about swords? Tell me, what are you looking for in the sword?<end>"

["1370027"]
japanese = "強さ<end>"
english = "Strength<end>"

["1370028"]
japanese = "美しさ<end>"
english = "Beauty<end>"

["1370029"]
japanese = "よくわからない<end>"
english = "Not sure<end>"

["1370030"]
japanese = "剣はしょせん敵を倒すための道具さ。<line-break>お前さんがどういうつもりで<line-break>強さを求めているのか知らねぇが、<line-break>このことを知らないでいる、<line-break>いや、知ろうとしないでいる<line-break>ってのはホントに危ねぇんだ。<end>"
english = "In the end, a sword is a tool for defeating an enemy. I don't know why you're seeking strength, but staying ignorant of that―no, refusing even to understand it―is really dangerous.<end>"

["1370031"]
japanese = "でもよ、最初はただ強さを求めていただけな\u3000\u3000<line-break>はずなのに、その過程で何か違うものが<line-break>見えてくるってこともあるんだぜ。<end>"
english = "Still, sometimes you start out seeking nothing but strength, only to discover something else along the way.<end>"

["1370032"]
japanese = "い？\u3000それが何かだって？\u3000\u3000\u3000\u3000<line-break>そんなものは人に聞くもんじゃないんだよ。<line-break>若いんだから、怠けてねぇで自分で見つけなよ。<end>"
english = "Hm? You want to know what that is? That's not something you ask someone else. You're young―don't be lazy. Find it for yourself.<end>"

["1370033"]
japanese = "…美しさ、ねぇ。<line-break>まぁ、いいさ。<line-break>剣に何を見るかは人それぞれだしな。\u3000\u3000\u3000\u3000<line-break>お前さん、これからも冒険を続けるんだろう？<line-break>物事にはいろんな面があるってことを<line-break>剣が教えてくれるかもしれねぇやな。<end>"
english = "Beauty, huh? Well, fair enough. Everyone sees something different in the sword. You're going to keep adventuring, aren't you? Maybe the sword will teach you that there's more than one side to everything.<end>"

["1370034"]
japanese = "ま、そうだな。こんな時代じゃ、<line-break>いちいちそんなこと考えてられねぇか。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>だがな、物事には必ず何かひとつは<line-break>学べるものがあるはずだ。そして、<line-break>誰もがそこに同じものを見出すわけじゃあない。<end>"
english = "Well, I suppose so. In times like these, maybe you can't stop to think about every little thing. But there's always something to be learned, no matter what it is―and not everyone will find the same lesson in it.<end>"

["1370035"]
japanese = "お前さんの剣もいずれは<line-break>お前さんに何かを教えてくれるさ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>お前さんだけの何かをな。<line-break>…って、そんなことずっと考えて<line-break>生きてたら、気が滅入っちまうか？<line-break>ハハハ！<end>"
english = "Someday, your sword will teach you something too. Something that's yours alone. Though I suppose you'd get awfully gloomy if you spent your whole life thinking like that. Ha ha ha!<end>"

["1370036"]
japanese = "ん、<value:$28>か？<line-break>ま、ゆっくりしていけや。<end>"
english = "Hm? <value:$28>, is that you? Well, make yourself at home.<end>"

["1370037"]
japanese = "アイリーンは剣の筋はいいし、<line-break>しっかりした娘だ。でも、なにせまだ<line-break>若いからなぁ。ま、これからってとこだ。<line-break>お前さんも今のうちにいろんな<line-break>物を目に焼き付けておくんだ。<line-break>そして、いろんなことを考えてみな。<end>"
english = "Irene has a real gift for the sword, and she's a levelheaded girl. But she's still young. She's got plenty of growing left to do. While you're young yourself, take a good look at all sorts of things. Give them plenty of thought, too.<end>"

