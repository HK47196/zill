["400223"]
japanese = "ネメアが戻った？\u3000\u3000\u3000\u3000\u3000\u3000<line-break>私を見限り城を出たネメアが？<line-break>\u3000<line-break>ふふふ、今頃なんの用か。<line-break>共に魔王バロルを倒したときの<line-break>思い出話でもしに来たか。<end>"
english = "Nemea has returned? Nemea, who gave up on me and left the castle? Heh. What business could he have here now? Has he come to reminisce about when we defeated Balor, the Demon King, together?<end>"

["400224"]
japanese = "あるいは…、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>戦場で初めて出会われたときの話\u3000\u3000<line-break>かもしれませぬな。<line-break>なんのために戦うのかと陛下が<line-break>問われたとき、民のためにと<line-break>ネメア様は答えられたとか…。<end>"
english = "Or perhaps he means to speak of your first meeting on the battlefield. When Your Majesty asked what he fought for, Lord Nemea is said to have answered, “For the people.”<end>"

["400225"]
japanese = "ほう、そうか。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>そのようなこともあったか。<line-break>くくく…。<line-break>奴らしいではないか。<line-break>魔王を倒す男の言いそうなことだ。<end>"
english = "Oh? Is that so? So that happened as well. Heh heh... That does sound like him. Just the sort of thing the man who defeated the Demon King would say.<end>"

["400226"]
japanese = "………………。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>ネメア様をお連れしても、<line-break>よろしいでしょうか？<end>"
english = "...Shall I bring Lord Nemea before you?<end>"

["400227"]
japanese = "よかろう。<line-break>連れてまいれ。<end>"
english = "Very well. Bring him in.<end>"

["400228"]
japanese = "ネメア様をお連れしました。<end>"
english = "I have brought Lord Nemea.<end>"

["400229"]
japanese = "壮健そうでなによりだ、ネメアよ。<line-break>私の治世を確固たるものにするために、<line-break>お前はなんでもしてくれた。<line-break>かつて、余の下した１２の難事を<line-break>こともなく成し遂げてくれた恩は、<line-break>忘れておらんよ。<end>"
english = "I am pleased to see you in good health, Nemea. You did everything in your power to secure my reign. I have not forgotten the debt I owe you for accomplishing the Twelve Labors I once set before you with such ease.<end>"

["400230"]
japanese = "その恩に免じて、<line-break>ひとつ質問に答えてもらえるか？<line-break>我が友、エリュマルクよ。<end>"
english = "In return for that service, will you answer one question, my friend Erymalc?<end>"

["400231"]
japanese = "いいだろう。<line-break>聞こうではないか。<end>"
english = "Very well. Let us hear it.<end>"

["400232"]
japanese = "初めてあったときの私の言葉を<line-break>覚えているか？<end>"
english = "Do you remember what I said when we first met?<end>"

["400233"]
japanese = "そんなことか。<line-break>たしか戦場だったと記憶している。<line-break>\u3000<line-break>なんのために戦うのか、<line-break>と問うた余に、民のためにと<line-break>答えたのだったな。<end>"
english = "Is that all? I believe it was on a battlefield. I asked what you fought for, and you answered, “For the people.”<end>"

["400234"]
japanese = "エリュマルク帝は崩御された。<line-break>\u3000<line-break>\u3000<line-break>よって、エリュマルク帝の<line-break>姉上エスリン様の遺児である<line-break>ネメア様があとを継がれる。<end>"
english = "Emperor Erymalc has passed away. Therefore, Lord Nemea, child of the emperor's late elder sister, Lady Ethlinn, shall succeed him.<end>"

["400235"]
japanese = "…世界を手に入れる。<end>"
english = "...And take the world for ourselves.<end>"

["400236"]
japanese = "我らはこれより、<line-break>迫りくる闇の力に<line-break>対抗しうる勢力を作り上げる。<end>"
english = "From this moment forward, we shall forge a power capable of standing against the encroaching darkness.<end>"

["400237"]
japanese = "かつて、魔王バロルを倒し、\u3000<line-break>勇者と呼ばれた男、ネメアは\u3000\u3000\u3000<line-break>叔父であるエリュマルク帝を退け\u3000\u3000\u3000<line-break>ディンガル帝国の帝位についた。\u3000\u3000\u3000\u3000\u3000<end>"
english = "Nemea, the man hailed as a Hero after defeating Balor, the Demon King, deposed his uncle, Emperor Eryumark, and ascended the throne of the Dingal Empire.<end>"

["400238"]
japanese = "そして、宰相ベルゼーヴァの\u3000<line-break>指揮の下、豊富な国力を生かして\u3000<line-break>大軍隊を組織。同時に、それを率いる\u3000<line-break>４人の将軍を大抜擢した。\u3000\u3000\u3000<end>"
english = "Then, under Chancellor Beelzeva's command, the empire drew on its abundant resources to assemble a vast army. Four generals were chosen in a series of bold appointments to lead it.<end>"

["400239"]
japanese = "魔道アカデミーを首席で卒業した\u3000\u3000<line-break>ザギヴ・ディンガルを\u3000\u3000\u3000\u3000\u3000<line-break>帝国内務統括、玄武将軍に任命、\u3000\u3000<line-break>ベルゼーヴァの下で国内を掌握させ…\u3000<end>"
english = "Zagiv Dingal, who had graduated at the top of the Academy of Magic, was appointed overseer of the empire's internal affairs and Black Tortoise General, charged with securing control of the realm under Beelzeva...<end>"

["400240"]
japanese = "さらに、少数種族である<line-break>コーンス族からジラークを登用、<line-break>西方攻略軍総司令、白虎将軍に任じ、<line-break>アキュリュースへの攻撃を命じ…<end>"
english = "Next, Zsilak was recruited from the Corns, a minority people, and appointed commander-in-chief of the western campaign and White Tiger General, with orders to attack Aqyurius...<end>"

["400241"]
japanese = "無名の兵卒であった\u3000\u3000\u3000\u3000\u3000\u3000<line-break>カルラ・コルキアを青竜将軍に\u3000\u3000\u3000<line-break>抜擢。東方小国家連合、及び\u3000\u3000\u3000\u3000\u3000\u3000<line-break>商業都市リベルダムの攻略を命じ…\u3000\u3000\u3000\u3000\u3000<end>"
english = "Karla Korkia, once an unknown rank-and-file soldier, was elevated to Azure Dragon General and ordered to conquer the eastern alliance of small states and the commercial city of Liberdam...<end>"

["400242"]
japanese = "かつてバロル帝のもとで名をはせた\u3000<line-break>老将アンギルダン・ゼイエンを\u3000\u3000<line-break>南方攻略軍総司令、朱雀将軍に任じ、<line-break>大国ロストールの攻略を命じた。\u3000<end>"
english = "The veteran commander Angildan Zeien, who had once won renown under Emperor Balor, was appointed commander-in-chief of the southern campaign and Vermilion Bird General, and ordered to conquer the great power of Rostorl.<end>"

["400243"]
japanese = "ディンガル帝国皇帝\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ネメア・ランガスター・ディンガルは、<line-break>バイアシオン大陸のすべてに\u3000\u3000\u3000\u3000\u3000\u3000<line-break>戦いを挑んだのである。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Nemea Langaster Dingal, Emperor of the Dingal Empire, challenged the whole of the Baiashion Continent to war.<end>"

["400244"]
japanese = "かくして世界は、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>激動と混沌の時代を迎え\u3000\u3000\u3000\u3000\u3000\u3000<line-break>大きなうねりを描きはじめた…。\u3000\u3000\u3000\u3000<end>"
english = "And so the world entered an age of upheaval and chaos, and a vast tide began to swell...<end>"

["400245"]
japanese = "な、何者だ！<line-break>ディンガル帝国の者か？<end>"
english = "W-who are you?! Are you with the Dingal Empire?<end>"

["400246"]
japanese = "その方たちは違う。<line-break>心配は無用だ。<end>"
english = "No, these people aren't with the Dingal Empire. There's no need to worry.<end>"

["400247"]
japanese = "シェムハザ長老！<end>"
english = "Elder Shemhaza!<end>"

["400248"]
japanese = "この方たちのことならば<line-break>私がよく知っている。<end>"
english = "I know these people well.<end>"

["400249"]
japanese = "しかし、このようなときに来られるとは<line-break>…フフ、まあ、天命かもしれぬな。<line-break>\u3000<line-break>私の家においでになるとよい。<line-break>頼みたいこともあるのでな。<end>"
english = "Still, for you to arrive at a time like this... Heh. Perhaps it was ordained. Come to my house. There is something I would ask of you.<end>"

["400250"]
japanese = "この方のことならば少し聞いている。<line-break>信頼に足る方だ。<end>"
english = "I've heard something of this person. This is someone we can trust.<end>"

["400251"]
japanese = "しかし、このようなときに来られるとは<line-break>…フフ、まあ、天命かもしれぬな。<line-break>\u3000<line-break>私はこのウルカーンの長老シェムハザ。<line-break>私の家においでになるとよい。<line-break>頼みたいこともあるのでな。<end>"
english = "Still, for you to arrive at a time like this... Heh. Perhaps it was ordained. I am Shemhaza, elder of Urkaan. Come to my house. There is something I would ask of you.<end>"

["400252"]
japanese = "先日、ディンガル皇帝ネメアが<line-break>ウルカーンまで来おってな。<line-break>\u3000<line-break>どこでこの地にあることを知ったか<line-break>闇の神器、束縛の腕輪を渡せと<line-break>言ってきたのだ。<end>"
english = "The other day, Nemea, Emperor of Dingal, came all the way to Urkaan. I do not know how he learned it was here, but he demanded that we hand over the dark divine artifact known as the Bracelet of Binding.<end>"

["400253"]
japanese = "束縛の腕輪は、強力な力を持つ<line-break>魔道器だ。利己的な欲望のために<line-break>使ってはならないのだよ。<line-break>神器をあの簒奪者に奪われては、<line-break>いったいどんな災厄を世界に<line-break>もたらすことになるかわからぬ。<end>"
english = "The Bracelet of Binding is a magical device of tremendous power. It must never be used to satisfy selfish desires. If that usurper takes the divine artifact, there is no telling what calamity he may bring upon the world.<end>"

["400254"]
japanese = "だから、ネメアとディンガル軍を<line-break>迎え撃つ準備をしているのだよ。<end>"
english = "That is why we are preparing to meet Nemea and the Dingal Army in battle.<end>"

["400255"]
japanese = "心配は無用だ。古来、ウルカーンは<line-break>防衛戦争で負けたことがない。<line-break>\u3000<line-break>火の巫女ウルが遺したマグマゴーレムが<line-break>どのような侵略者も、退けてきたのだ。<line-break>今、魔道士たちが起動している。<end>"
english = "There is no cause for concern. Urkaan has never lost a defensive war. The Magma Golems left by Priestess Uru of the Flame have repelled every invader to come against us. Our mages are activating them now.<end>"

["400256"]
japanese = "マグマゴーレムにかかれば<line-break>どんな大軍も、ただ死体の山を<line-break>築くために進軍してくるようなものだ。<end>"
english = "Any army, no matter how vast, would march against the Magma Golems only to leave behind a mountain of corpses.<end>"

["400257"]
japanese = "な、何事だ！？<end>"
english = "W-what is happening?!<end>"

["400258"]
japanese = "ち、長老様っ！<line-break>て、敵襲っ！<end>"
english = "E-Elder! We're under attack!<end>"

["400259"]
japanese = "バカな！\u3000早過ぎるぞ！<line-break>だいたい敵接近の報告は受けておらぬ。<line-break>\u3000<line-break>見張りは何をしていた！<line-break>ディンガルの大軍が近づいてきたのに<line-break>まったく、気がつかなかったのか！<end>"
english = "Impossible! It is too soon! We have had no report of an enemy approaching. What were the lookouts doing?! Did they somehow fail to notice a vast Dingal army bearing down on us?!<end>"

["400260"]
japanese = "敵は大軍ではありません！<line-break>て、敵は総勢４騎！<end>"
english = "It isn't an army! Th-there are only four riders!<end>"

["400261"]
japanese = "４騎！？\u3000バカな！<end>"
english = "Four riders?! Absurd!<end>"

["400262"]
japanese = "ええい、かまわん！\u3000今出ている<line-break>マグマゴーレムでひねりつぶせ！<end>"
english = "Bah, no matter! Have the Magma Golems already deployed crush them!<end>"

["400263"]
japanese = "そ、それが…！<end>"
english = "B-but...!<end>"

["400264"]
japanese = "私はディンガル皇帝ネメア。<line-break>ウルカーン長老シェムハザに告ぐ。<line-break>\u3000<line-break>これ以上の抵抗はムダだ。<line-break>降伏して束縛の腕輪を渡せば、<line-break>生命の安全は保証しよう。<end>"
english = "I am Nemea, Emperor of Dingal. Hear me, Shemhaza, Elder of Urkaan. Further resistance is futile. Surrender and hand over the Bracelet of Binding, and I shall guarantee your safety.<end>"

["400265"]
japanese = "皇帝直属遊撃隊、獅子の牙所属<line-break>黒鎧近衛騎士オイフェ以下２名。<line-break>\u3000<line-break>闇の神器、束縛の腕輪を奪取すべく<line-break>突撃します！<end>"
english = "Black-Armored Guard Knight Aoife of the Lion's Fang, the Emperor's direct-command mobile unit, accompanied by two others. We are charging in to seize the dark divine artifact, the Bracelet of Binding!<end>"

["400266"]
japanese = "バカな！\u3000マグマゴーレムが全滅！？<line-break>し、信じられぬ！<end>"
english = "Impossible! All the Magma Golems were destroyed?! I-I cannot believe it!<end>"

["400267"]
japanese = "ディ、ディンガルの騎士？<line-break>しかも、ダークエルフだと！？<end>"
english = "A-a knight of Dingal? And a Dark Elf at that?!<end>"

["400268"]
japanese = "私は皇帝直属遊撃隊、獅子の牙所属<line-break>黒鎧近衛騎士オイフェ。<end>"
english = "I am Aoife, Black-Armored Guard Knight of the Lion's Fang, the Emperor's direct-command mobile unit.<end>"

["400269"]
japanese = "…同じくゼリグ。<end>"
english = "And I am Zelig.<end>"

["400270"]
japanese = "同じくドルドラム。<line-break>ソリアスに使える神官じゃ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>長老シェムハザ殿、いかな大軍も<line-break>寄せつけぬマグマゴーレムも、<line-break>少数の勇者にはかなわなんだな。<end>"
english = "Doldrum, likewise. I am a priest in the service of Solias. Elder Shemhaza, it seems even Magma Golems that can hold any great army at bay are no match for a handful of heroes.<end>"

["400271"]
japanese = "マグマゴーレムがあっという間に<line-break>倒され、町の者は皆、<line-break>抵抗する気が失せておる。<line-break>長老、降伏なされ。<line-break>悪いようにはせん。<end>"
english = "The Magma Golems were felled in moments, and the townsfolk have lost all will to resist. Surrender, Elder. No harm will come to you.<end>"

["400272"]
japanese = "…仕方ない。降伏しよう。<line-break>束縛の腕輪はここだ。<line-break>取りに来い。<end>"
english = "Very well. I surrender. The Bracelet of Binding is here. Come and take it.<end>"

["400273"]
japanese = "バカめ！<line-break>うかつに近づいてきおって！<line-break>お前たちに渡す気などないわ！<end>"
english = "Fools! You came too close without a thought! I never had any intention of giving it to you!<end>"

["400274"]
japanese = "くっ…不覚。<end>"
english = "Gah... I let my guard down.<end>"

["400275"]
japanese = "闇の神器を使えば<line-break>確かに強くはなるが、<line-break>心が闇に堕ちてしまうのじゃぞ！<end>"
english = "A dark divine artifact may indeed make you stronger, but it will drag your heart into darkness!<end>"

["400276"]
japanese = "神器の力を使ってもこの程度か。<line-break>…つまらぬ男だ。<line-break>\u3000<line-break>このような者が神器を使い<line-break>長老の地位を守るため、<line-break>汲々としていたのか。<end>"
english = "Even with the divine artifact's power, this is all you can manage? What a pathetic man. To think someone like you was using it, desperately clinging to your position as elder.<end>"

["400277"]
japanese = "あとのことはザギヴに任せる。<line-break>ゆくぞ。<end>"
english = "Leave the rest to Zagiv. We are going.<end>"

["400278"]
japanese = "…<value:$28>。<line-break>私のやり方に不服か？<end>"
english = "...<value:$28>. Do you object to my methods?<end>"

["400279"]
japanese = "…ならば、私と戦え。<line-break>そして、とめてみせよ。<end>"
english = "Then fight me. Show me you can stop me.<end>"

["400280"]
japanese = "…また、助けられたわね。<end>"
english = "You've saved me again.<end>"

["400281"]
japanese = "でも、勘違いしないで！<line-break>私は恩になんて感じないから！\u3000<line-break>\u3000<line-break>今の私はネメア様の戦士。<line-break>今度会ったとき、もしも敵として<line-break>あなたが現れたなら…。<end>"
english = "But don't get the wrong idea! I don't feel indebted to you! I am Lord Nemea's warrior now. If we meet again and you stand before me as an enemy...<end>"

["400282"]
japanese = "私は、あなたを殺すわ。\u3000\u3000\u3000\u3000<line-break>…それだけ。<line-break><end>"
english = "I will kill you. That is all.<end>"

["400283"]
japanese = "おお、また会うたな。<line-break>墓場はお気に入りの場所かな？<line-break>\u3000<line-break><value:$28>、<line-break>何度も会うのも、何かの縁じゃ。<line-break>少し散歩でもせんかね。<end>"
english = "Ah, we meet again. Fond of graveyards, are you? <value:$28>, after so many chance meetings, perhaps fate has had a hand in it. Care to join me for a little stroll?<end>"

["400284"]
japanese = "墓地を散歩するのも<line-break>面白いものでな。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>墓地は人生の終点であり、<line-break>その人間について記された<line-break>大いなる書物でもある。<end>"
english = "A walk through a cemetery can be quite interesting. It is the end of a life's journey, but also a great book in which that life is recorded.<end>"

["400285"]
japanese = "歴史の物言わぬ証人でもあり、<line-break>遺された人間にとっては<line-break>記憶の眠る場所でもある。<end>"
english = "It stands as a silent witness to history, and for those left behind, it is where memories lie at rest.<end>"

["400286"]
japanese = "…イズ皇后の墓じゃ。<line-break>おかわいそうな方じゃ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>エリュマルク帝はネメア様を<line-break>陥れようと、ネメア様に<line-break>絶世の美女イズ様の誘拐を命じた。<end>"
english = "This is the grave of Empress Iz. A poor soul. Emperor Eryumark sought to bring about Nemea's downfall, so he ordered him to abduct Iz, a beauty without equal.<end>"

["400287"]
japanese = "イズ様は暗殺教団、施文院の<line-break>大神官じゃった。これをさらうには<line-break>生命がいくつあっても足りぬ。<line-break>しかも、これは犯罪じゃ。<line-break>勇者の仕事ではない。<line-break>成功しても不名誉なことじゃ。<end>"
english = "Iz was the high priest of Shibun'in, an order of assassins. No number of lives would be enough to abduct Iz. Besides, it was a crime―no work for a hero. Even success would bring dishonor.<end>"

["400288"]
japanese = "…と言っても、ネメア様が断れば、<line-break>皇帝は命令に背いたことを理由に<line-break>処刑してしまうつもりじゃった。<line-break>退くもならず進むもならず<line-break>という状態じゃの。<line-break>ネメア様はどうしたと思う？<end>"
english = "Yet if Nemea refused, the emperor intended to have him executed for disobeying an imperial command. He could neither retreat nor go forward. What do you suppose Nemea did?<end>"

["400289"]
japanese = "ネメア様は皇帝の命に従い<line-break>イズ様をさらったのじゃ。<end>"
english = "Nemea obeyed the emperor's command and abducted Iz.<end>"

["400290"]
japanese = "どんな事情があるのか<line-break>ようわからんが、<line-break>ネメア様はその命に従った。<line-break>エリュマルク帝はイズ様に恋し、<line-break>イズ様を皇后にした。<line-break>しかし、イズ様は心を開かなかった。<end>"
english = "I don't rightly know what was behind it, but Nemea obeyed the order. Emperor Eryumark fell in love with Iz and made Iz his empress. But Iz never opened up to him.<end>"

["400291"]
japanese = "その上、イズ様はずっとネメア様ばかり<line-break>見つめておられた。エリュマルク帝は<line-break>ネメア様をいよいよ恨まれた。<line-break>エリュマルク帝はイズ様を嫉妬のあまり<line-break>殺され、イズ様と通じていたとして、<line-break>ネメア様の処刑をお命じになった。<end>"
english = "What is more, Iz had eyes only for Nemea. Emperor Eryumark's hatred of him deepened. In a jealous rage, the emperor had Iz killed, then ordered Nemea's execution on the charge that he and Iz had been involved.<end>"

["400292"]
japanese = "これが、自分をさらったネメア様への、<line-break>イズ様の復讐だったのかもしれぬ。<line-break>…なんにせよ、悲劇的なことじゃ。<end>"
english = "Perhaps that was Iz's revenge against Nemea for the abduction. Whatever the truth, it is a tragedy.<end>"

["400293"]
japanese = "また、来なさるとよい。<line-break>ヒマと縁があれば、<line-break>昔語りなどしようほどにの。<end>"
english = "Come again sometime. If time and fortune allow, perhaps I'll tell you a tale or two of days gone by.<end>"

["400294"]
japanese = "これでわかった？<line-break>私は、手加減しないわ。<line-break>もう邪魔をしないことね。<end>"
english = "Do you understand now? I don't hold back. Don't interfere again.<end>"

["400295"]
japanese = "すまんな。<line-break>この闇の神器は、<line-break>わしらがもらっていく。<line-break>さあ、行くぞ、<line-break>オイフェ、ゼリグ。<end>"
english = "Sorry, but we're taking this Sacred Artifact of Darkness. Come, Aoife, Zelig. We're leaving.<end>"

["400296"]
japanese = "\u3000\u3000\u3000ディンガル帝国<line-break>帝都エンシャント、謁見の間<end>"
english = "The Dingal Empire ― Ancient, the Imperial Capital ― Audience Chamber<end>"

