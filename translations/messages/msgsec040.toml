english = "In the name of Sorias: victory through friendship and effort. Teamwork matters, you see. <value:$28>, we've lost this time. We'll withdraw without a fuss.<end>"

["400160"]
japanese = "傲慢の首飾りを失った。<end>"
english = "Lost the Necklace of Arrogance.<end>"

["400161"]
japanese = "次は、負けないわ！！<end>"
english = "Next time, I won't lose!<end>"

["400162"]
japanese = "やれやれ。ま、このくらいの勇み足は<line-break>オイフェならば愛嬌じゃな。<line-break>ゆくぞ、ゼリグ。<end>"
english = "Good grief. Still, a little rashness like that is part of Aoife's charm. Come, Zelig.<end>"

["400163"]
japanese = "<if><value:$2A><greater-equal>%15ここは、かつての魔王バロルの城じゃ。<line-break>今はバロルは滅びたが、闇の力は<line-break>いまだに城内にあふれているそうじゃ。<line-break>お前さんもよほどの腕なのじゃろうが<line-break>この城の門をくぐるのであれば<line-break>覚悟を決めて行くことじゃな。<end>ここは、かつての魔王バロルの城じゃ。<line-break>今はバロルは滅びたが、闇の力は<line-break>いまだに城内にあふれているそうじゃ。<line-break>お前さんも冒険者なら<line-break>中を探検したいのじゃろうが<line-break>危険すぎる。やめておくことじゃ。<end>"
english = "<if><value:$2A><greater-equal>%15This was once the castle of Balor, the Demon King. Balor is no more, but they say the castle is still awash with dark power. Skilled though you may be, if you mean to pass through its gates, you'd best steel yourself first.<end>This was once the castle of Balor, the Demon King. Balor is no more, but they say the castle is still awash with dark power. If you're an adventurer, no doubt you'll want to explore the place, but it's far too dangerous. Best leave it be.<end>"

["400164"]
japanese = "ありがとう、それじゃ<end>"
english = "Thanks. See you.<end>"

["400165"]
japanese = "強くなるにはどうすればいい？<end>"
english = "How can I get stronger?<end>"

["400166"]
japanese = "冒険者として一流になりたいんなら\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ソウルを鍛えていくことだ。<line-break>\u3000<line-break>ソウルってのは、魂の形だな。<line-break>魂の形ってのは、すなわち<line-break>お前が持っている能力の象徴みたいなもんだ。<end>"
english = "If you want to become a first-rate adventurer, you'll need to develop your Soul. A Soul is the shape of your spirit―a symbol of the abilities you possess.<end>"

["400167"]
japanese = "ソウルを鍛えていくことで、<line-break>お前の魂は形を変えていき、お前の成長を助け、<line-break>いろんな能力を与えてくれるだろうよ。<end>"
english = "As you develop your Soul, your spirit will take on new forms, helping you grow and granting you all sorts of abilities.<end>"

["400168"]
japanese = "わかった。ありがとう<end>"
english = "Got it. Thanks.<end>"

["400169"]
japanese = "ソウルはどうやって鍛える？<end>"
english = "How do I strengthen my Soul?<end>"

["400170"]
japanese = "ソウルを鍛えるには、<line-break>他人のために何かをしてあげればいい。\u3000\u3000<line-break>その心が、ソウルを育てる。<line-break>ま、ギルドのクエストをやりゃあいいのよ。<line-break>そしたら、ソウルが育つ。<line-break>どう育てるかは、お前次第だ。<end>"
english = "To develop your Soul, do something for someone else. It's the spirit behind the deed that makes your Soul grow. In other words, take on quests from the Guild. Your Soul will grow, but how it grows is up to you.<end>"

["400171"]
japanese = "おおざっぱに言うとだな、<line-break>Ｂｒａｖｅは勇敢さを、Ｗｉｌｄは荒々しさを、<line-break>Ｓｅａｒｃｈは探究心を、<line-break>Ｃｏｏｌは冷静さを、<line-break>Ｂｅｌｉｅｆは信心深さを、<line-break>Ｋｉｎｄはやさしさを、魂に与えてくれるのさ。<end>"
english = "Broadly speaking, Ｂｒａｖｅ gives your spirit courage; Ｗｉｌｄ, ferocity; Ｓｅａｒｃｈ, curiosity; Ｃｏｏｌ, composure; Ｂｅｌｉｅｆ, faith; and Ｋｉｎｄ, compassion.<end>"

["400172"]
japanese = "ありがとう、よくわかったよ<end>"
english = "Thanks, I understand now.<end>"

["400173"]
japanese = "もう少し詳しく教えてほしいな<end>"
english = "Could you explain a little more?<end>"

["400174"]
japanese = "Ｂｒａｖｅについて教えてほしい<end>"
english = "Tell me about Ｂｒａｖｅ.<end>"

["400175"]
japanese = "Ｋｉｎｄについて教えてほしい<end>"
english = "Tell me about Ｋｉｎｄ.<end>"

["400176"]
japanese = "Ｓｅａｒｃｈについて教えてほしい<end>"
english = "Tell me about Ｓｅａｒｃｈ.<end>"

["400177"]
japanese = "Ｂｅｌｉｅｆについて教えてほしい<end>"
english = "Tell me about Ｂｅｌｉｅｆ.<end>"

["400178"]
japanese = "Ｗｉｌｄについて教えてほしい<end>"
english = "Tell me about Ｗｉｌｄ.<end>"

["400179"]
japanese = "Ｃｏｏｌについて教えてほしい<end>"
english = "Tell me about Ｃｏｏｌ.<end>"

["400180"]
japanese = "<select><value:$20>%4Ｋｉｎｄはやさしさ。<line-break>つまりは気高く正しい心のことさ。<line-break>勇者なら持っていてほしいよな。\u3000\u3000<line-break>あと、この資質がすぐれている奴には<line-break>弓の使い手が多いんだ。<line-break>パーティのサポート役ってとこだな。<end>Ｋｉｎｄはやさしさ。<line-break>つまりは気高く正しい心のことさ。<line-break>勇者なら持っていてほしいよな。\u3000\u3000<line-break>あと、この資質がすぐれている奴には<line-break>弓の使い手が多いんだ。<line-break>パーティのサポート役ってとこだな。<end>Ｋｉｎｄはやさしさ。<line-break>つまりは気高く正しい心のことさ。<line-break>勇者なら持っていてほしいよな。<line-break>ただ、<line-break>やさしすぎると得られない<line-break>闇のソウルもあるってウワサだぜ。<end>Ｋｉｎｄはやさしさ。<line-break>つまりは気高く正しい心のことさ。<line-break>勇者なら持っていてほしいよな。<line-break>尊敬される戦士になるには<line-break>やっぱ、やさしさや正義の心が<line-break>必要になってくるぜ。<end>"
english = "<select><value:$20>%4Ｋｉｎｄ means compassion: a noble and righteous heart. Just the sort of thing you'd want in a hero. Many who excel in this quality are bow users. They tend to support the party.<end>Ｋｉｎｄ means compassion: a noble and righteous heart. Just the sort of thing you'd want in a hero. Many who excel in this quality are bow users. They tend to support the party.<end>Ｋｉｎｄ means compassion: a noble and righteous heart. Just the sort of thing you'd want in a hero. Mind you, there's a rumor that being too kind can keep you from acquiring certain dark Souls.<end>Ｋｉｎｄ means compassion: a noble and righteous heart. Just the sort of thing you'd want in a hero. If you want to become a respected warrior, you'll need kindness and a sense of justice.<end>"

["400181"]
japanese = "<select><value:$20>%2Ｓｅａｒｃｈは探求心だ。<line-break>知識を求める心は<line-break>魔法を使うには必要だよな。\u3000\u3000<line-break>ただ、魔法を使うには<line-break>さらに精霊力が身についてないと<line-break>ダメなんだ。<end>Ｓｅａｒｃｈは探求心だ。<line-break>知識を求める心は<line-break>魔法を使うには必要だよな。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>賢くなりたきゃ、この資質を上げるんだ。<line-break>さらに冷静さが加われば<line-break>大魔法使いにだってなれるさ。<end>"
english = "<select><value:$20>%2Ｓｅａｒｃｈ means curiosity. A thirst for knowledge is essential if you want to use magic. But you'll also need to acquire spirit power before you can cast any spells.<end>Ｓｅａｒｃｈ means curiosity. A thirst for knowledge is essential if you want to use magic. Raise this quality if you want to become wiser. Add composure to it, and you could even become a great mage.<end>"

["400182"]
japanese = "Ｂｅｌｉｅｆは信仰心だ。<line-break>神に仕える神官や僧侶には<line-break>なくちゃならない資質だよな。<line-break>いやす力が欲しければ、<line-break>信仰心を持つこった。<end>"
english = "Ｂｅｌｉｅｆ means faith. It's indispensable for priests and monks in divine service. If you want the power to heal, you need faith.<end>"

["400183"]
japanese = "<select><value:$20>%3Ｗｉｌｄは荒々しさ。<line-break>これで大いなる自然の力を<line-break>身につけることができる。<line-break>人間を超えた動物の力は<line-break>きっと役に立つはずさ。<end>Ｗｉｌｄは荒々しさ。<line-break>これで大いなる自然の力を<line-break>身につけることができる。<line-break>人間を超えた動物の力は<line-break>きっと役に立つはずさ。<end>Ｗｉｌｄは荒々しさ。<line-break>これで大いなる自然の力を\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>身につけることができる。<line-break>ただ、あんまりガサツじゃ<line-break>身につかないソウルもあるってウワサだ。<line-break>よく考えてから、のばしてくれ。<end>"
english = "<select><value:$20>%3Ｗｉｌｄ means ferocity. It allows you to acquire the awesome power of nature. The strength of beasts, surpassing that of humans, is sure to prove useful.<end>Ｗｉｌｄ means ferocity. It allows you to acquire the awesome power of nature. The strength of beasts, surpassing that of humans, is sure to prove useful.<end>Ｗｉｌｄ means ferocity. It allows you to acquire the awesome power of nature. But rumor has it that being too coarse can keep you from acquiring certain Souls, so think carefully before developing it.<end>"

["400184"]
japanese = "Ｃｏｏｌは冷静さ。<line-break>冷静な判断力は探検家には\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>必要な能力だよな。<line-break>すばやくなりたいときや<line-break>器用になりたいときは<line-break>この資質をのばしてソウルを得るといい。<end>"
english = "Ｃｏｏｌ means composure. Sound judgment is essential for an Explorer. If you want to become faster or more dexterous, develop this quality to gain a Soul.<end>"

["400185"]
japanese = "じゃあな。<line-break>お前の活躍、期待してるぜ。<end>"
english = "See you around. I'm expecting great things from you.<end>"

["400186"]
japanese = "Ｂｒａｖｅは勇敢さだ。<line-break>力強い戦士には<line-break>これがないと話にならねえよな。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>だけど勇敢なだけじゃあ、<line-break>いい戦士にはなれないぜ。<line-break>他の資質と組みあわせてのばしていきたいよな。<end>"
english = "Ｂｒａｖｅ means courage. A powerful warrior won't get far without it. But courage alone doesn't make a good warrior. You'll want to develop it in combination with other qualities.<end>"

["400187"]
japanese = "ラミリー山を探検していると、\u3000\u3000\u3000\u3000<line-break>光る場所が見つかることがある。<line-break>そんな時は、迷わず調べてみるのだ！<line-break>錬剛石が落ちているからな。<line-break>ただし、他の冒険者が拾うこともある。<line-break>早い者勝ちだぞ。<end>"
english = "While exploring Mount Ramiri, you may come across a glowing spot. If you do, check it without a second thought! You'll find a tempered-steel stone there. Mind you, another adventurer may pick it up first. First come, first served!<end>"

["400188"]
japanese = "このあいだ先輩に連れられてゼグナ鉱山を<line-break>探検したんだよ。そしたら、光ってる場所が<line-break>あるんで、調べたら錬剛石を見つけたよ。<line-break>先輩の話だと、何週間に１回くらいは<line-break>こんなことがあるらしいよ。<line-break>君も行ってみたらどうだい？<end>"
english = "A more experienced adventurer took me exploring Zegna Mine the other day. There was a glowing spot, and when I checked it out, I found some rengoseki. The adventurer who took me said that happens about once every few weeks. Why don't you go take a look yourself?<end>"

["400189"]
japanese = "この間、聖光石の廃鉱に行ってみたけど<line-break>聖光石は見つからなかったよ。<line-break>かけらなら採れたけどね。<line-break>やっぱり、良質な聖光石ってのは<line-break>採り尽したみたいだね。<end>"
english = "I went to the Old Sacred Lightstone Mine the other day, but I couldn't find any Holy Light Stone. I did manage to mine a few fragments, though. Looks like all the good-quality stone has already been mined out.<end>"

["400190"]
japanese = "虹色の山脈で光っている場所を見つけたので、<line-break>そこを調べたら錬剛石が落ちていましたぞ。<line-break>あそこで拾ったのは久しぶりですな。<line-break>あと１個残しておいたから、<line-break>急げば、まだ落ちているかもしれませんぞ。<end>"
english = "I saw a spot glowing in the Rainbow Mountains, and when I went to take a look, I found some rengoseki lying there. It's been a long time since I last picked any up there. I left one behind, so if you hurry, it may still be there.<end>"

["400191"]
japanese = "あなた、錬剛石欲しくない？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>鳳凰山に１個だけ落ちていたわよ。<line-break>私には必要ない物だから教えてあげるわ。<line-break>錬剛石が落ちている場所は光っていたから<line-break>行ってみればわかると思うわよ。<line-break>でも、誰かに拾われてても文句言わないでね。<end>"
english = "Wouldn't you like some Rengoseki? There was a single piece lying on Phoenix Mountain. I have no use for it, so I thought I'd tell you. The spot where I saw it was glowing, so you should recognize it when you get there. But don't blame me if someone else has already picked it up.<end>"

["400192"]
japanese = "死竜の洞窟を知っているよな。<line-break>あそこに、錬剛石が落ちていることがあるのは<line-break>知っていたかい？<line-break>この間も光っている場所を調べてみたら<line-break>錬剛石が落ちていたよ。<line-break>あと１個くらいは落ちてるんじゃないかな。<end>"
english = "You know Dead Dragon Cave, don't you? Did you know you can sometimes find refined steelstone lying around in there? I checked a spot that was glinting the other day and found some. I wouldn't be surprised if there's another piece still there.<end>"

["400193"]
japanese = "（穴の中に何かが見える…）<end>"
english = "(Something is visible inside the hole...)<end>"

["400194"]
japanese = "穴に飛び込みますか？<end>"
english = "Jump into the hole?<end>"

["400195"]
japanese = "（暖炉の火は消えている…。）<end>"
english = "(The fire in the hearth has gone out...)<end>"

["400196"]
japanese = "火をつけてみますか？<end>"
english = "Would you like to try lighting it?<end>"

["400197"]
japanese = "おやじ、剣が古くなってきたから\u3000\u3000<line-break>新しいのを買いたいんだ。<line-break>いい剣はないか？<end>"
english = "Old man, my sword's getting worn out. I want to buy a new one. Got any good blades?<end>"

["400198"]
japanese = "あんた、新米冒険者だね？\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "You're a novice adventurer, aren't you?<end>"

["400199"]
japanese = "え？<line-break>なんで新米だってわかったんだ？\u3000\u3000<line-break>\u3000<end>"
english = "What? How could you tell?<end>"

["400200"]
japanese = "武器はな、新しく買うよりも、<line-break>強化していった方が強くなるのさ。\u3000<line-break>だから、そう思ったわけだ。<end>"
english = "A weapon will grow stronger if you keep improving it instead of buying a new one. That's what gave you away.<end>"

["400201"]
japanese = "な、なるほど。<line-break>それなら、強化してくれないか。\u3000\u3000<line-break>\u3000<end>"
english = "R-right. That makes sense. Then could you improve mine?<end>"

["400202"]
japanese = "武器の強化には、錬剛石が必要だが、<line-break>持ってるかい？<line-break>\u3000<end>"
english = "Improving a weapon takes tempering stone. Do you have any?<end>"

["400203"]
japanese = "錬剛石？\u3000いや、持ってないな。\u3000\u3000<line-break>その錬剛石って、どうすれば<line-break>手に入るんだ？<end>"
english = "Tempering stone? No, I don't. How do I get some?<end>"

["400204"]
japanese = "鉱山なんかへ行くと、ときどき<line-break>地面が光っていることがある。<line-break>そこを調べたら見つかるはずだ。\u3000\u3000<line-break>だが、錬剛石はきちんと<line-break>結晶化するまで時間がかかるし、<line-break>他の冒険者もねらってるからな。<end>"
english = "In mines and places like that, you'll sometimes see the ground glowing. Search the spot and you should find some. But tempering stone takes time to crystallize properly, and other adventurers are after it too.<end>"

["400205"]
japanese = "なるほど。<line-break>冒険者は何ごとも冒険から\u3000\u3000\u3000\u3000\u3000<line-break>ってことだな。<line-break>それじゃあ、おやじ。<line-break>錬剛石を手に入れたら、また来るよ。<end>"
english = "I get it. For an adventurer, everything starts with an adventure. All right, old man. I'll be back once I've found some tempering stone.<end>"

["400206"]
japanese = "おう！<line-break>ギアもいるから、貯めとけよ。\u3000\u3000\u3000<line-break>\u3000<end>"
english = "Right! You'll need Gea too, so save some up.<end>"

["400207"]
japanese = "だから、錬剛石がとれる山を\u3000\u3000\u3000\u3000<line-break>見つけたら、何度か足を<line-break>運んでみるのがいいだろうな。<end>"
english = "So if you find a mountain where tempering stone can be found, you'd do well to visit it several times.<end>"

