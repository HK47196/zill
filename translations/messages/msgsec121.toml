["1210104"]
japanese = "ガルドランの居場所？<line-break>そもそもガルドランって誰なの。<line-break>そこから説明してくれないとなー。<line-break>そいつが冒険者なら冒険者ギルドに<line-break>来るでしょ。あと、酒場ね。<line-break>酒場は冒険者の集まる場所だからね。<end>"
english = "Where is Girldlan? First of all, who is Girldlan? You'll have to explain that much. If he's an adventurer, he'll visit an Adventurers' Guild. Or a tavern. Taverns are where adventurers gather.<end>"

["1210105"]
japanese = "姉ちゃん何でガルドランなんて男に<line-break>興味を持つんだよ。もしや、その男が<line-break>好きなのかよ！\u3000冗談だろ！<line-break>姉ちゃんガルドランってどんな男だよ！<line-break>もちろん俺に会わせてくれるよな。<line-break>もし、ろくでもない男なら許さないぞ！<end>"
english = "Sis, why are you so interested in a man like Girldlan? Don't tell me you like him! You're joking, right? What kind of man is he? You'll let me meet him, of course. If he's no good, I won't stand for it!<end>"

["1210106"]
japanese = "ガルドラン…？\u3000知らないわ。<line-break>冒険者なのだとしたら、あなたの方が<line-break>察しがついて当然でしょう？<end>"
english = "Girldlan...? I don't know. If he's an adventurer, surely you should have a better idea than I do.<end>"

["1210107"]
japanese = "未来の勇者ガルドランの居場所ねえ。<line-break>そいつを特定するのが難しいのは、<line-break>お前さんならわかるだろ。<line-break>住所不定なのが冒険者だからな。<line-break>冒険中に偶然出会うか、酒場や宿屋や<line-break>冒険者ギルドで出会うかしかないだろ。<end>"
english = "Where can you find Girldlan, the future Hero? You should understand how hard that is to pin down. Adventurers have no fixed address. You'll either run into him while adventuring or meet him at a tavern, inn, or Adventurers' Guild.<end>"

["1210108"]
japanese = "ガルドラン…誰だその男は。<line-break>俺はそのような男は知らん。<line-break>くだらない質問をするな。<end>"
english = "Girldlan...? Who is that man? I know no one by that name. Do not ask such foolish questions.<end>"

["1210109"]
japanese = "ガルドランという冒険者の居場所を<line-break>捜しておるのじゃな。<line-break>冒険者の居場所といえば昔から…<line-break>宿屋、冒険者ギルド、そして酒場と<line-break>決まっておるわい。世界酒場巡りなど<line-break>しておれば、いつかは見つかるわい。<end>"
english = "You seek an adventurer named Girldlan. Since ancient times, adventurers have always been found at inns, Adventurers' Guilds, and taverns. Tour the taverns of the world, and you will find him eventually.<end>"

