["1210173"]
japanese = "まずは冒険者の町と呼ばれる自由都市<line-break>リベルダムへ行こうではないか。<line-break>あそこを冒険の拠点とするのじゃ。<line-break>冒険者ギルドで仕事をもらい、<line-break>それを確実にこなしていけば、<line-break>お主のソウルも鍛えられるじゃろ。<end>"
