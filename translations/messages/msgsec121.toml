["1210168"]
japanese = "今はいろんな修羅場を乗り越えてさ、<line-break>もっと強くなることを考えた方が<line-break>いいと思うんだけどね？<line-break>そのためには、冒険者ギルドで仕事を<line-break>もらってコツコツとこなしていくのが<line-break>地味でお似合いかもよ。<end>"
english = "For now, I think you should focus on surviving all kinds of ordeals and becoming stronger. Taking jobs from the Adventurers' Guild and steadily working through them may be dull, but it suits you.<end>"

["1210169"]
japanese = "ロストールもいいけどリベルダムも<line-break>冒険者にはいいところじゃないかな。<line-break>姉ちゃん、どっちかを拠点にしようぜ。<line-break>俺たちは、駆け出しの冒険者だから<line-break>冒険者ギルドで引き受けた仕事を<line-break>確実にこなして実力をつけないとな。<end>"
english = "Rostorl is good, but Liberdam seems like a good place for adventurers too. Sis, let's make one of them our base. We're still novice adventurers, so we need to build our abilities by completing the jobs we accept from the Adventurers' Guild without fail.<end>"

["1210170"]
japanese = "そうですね、まずは実力と名声を<line-break>身につけた方がいいと思いますよ。<line-break>冒険の拠点となる町を決めましょう。<line-break>その町の冒険者ギルドで仕事をもらい、<line-break>確実にこなしていくことで自然に実力と<line-break>名声がついてくると思いますよ。<end>"
