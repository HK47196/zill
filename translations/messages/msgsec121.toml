["1210174"]
japanese = "今、僕たちに足りないのは実力だよ。<line-break>自分で困難を克服できる力を<line-break>身につけないといけないと思うんだ。<line-break>だから、リベルダムへ行こうよ。<line-break>あそこを中心に冒険者ギルドの仕事を<line-break>こなして実力をつけるんだ。<end>"
