["1210167"]
japanese = "そうですね、まず自分のソウルを育てる<line-break>ことから始めなさい。そのためには<line-break>冒険者ギルドで仕事をもらうのです。<line-break>引き受けた仕事をこなしていけば、<line-break>ソウルは自然に育っていくでしょう。<end>"
