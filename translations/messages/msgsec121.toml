["1210175"]
japanese = "ソウルを鍛えるのだな。<line-break>そのためには冒険者ギルドで仕事を<line-break>もらい、こなしていくのだ。<line-break>実力のないうちから、迷宮や洞窟に<line-break>挑んだところで得る物は少ないぞ。<end>"
english = "Train your Soul. To do so, take jobs from the Adventurers' Guild and complete them. You'll gain little from challenging labyrinths and caves before you have the necessary ability.<end>"

["1210176"]
japanese = "どうするもこうするもないわよ。<line-break>世界が驚きに満ちているってことを<line-break>証明するのが、あんたの使命でしょ。<line-break>まさか忘れたわけじゃないでしょーね。<line-break>高貴で優雅で知性あふれるエルフの<line-break>アタクシをだますなんて許さないわよ。<end>"
english = "What do you mean, what should you do? Your mission is to prove that the world is full of wonders. Don't tell me you've forgotten. I will not forgive you for deceiving a noble, graceful, brilliant Elf such as moi!<end>"

["1210177"]
japanese = "どうしようか？ボゲー<end>"
english = "What should we do, Bogee?<end>"

["1210178"]
japanese = "ルルアンタはリベルダムが大きい町<line-break>だから好きだよぉ。おっきな時計台も<line-break>あるし闘技場もあるんだよぉ。<line-break>それにね、リベルダムは冒険者の町<line-break>なんだってぇ。だからお仕事もたくさん<line-break>あると思うなぁ。<end>"
english = "Lulluantha likes Liberdam because it's a big city. It has a huge clock tower and an arena too. And they say Liberdam is a city of adventurers, so I think there must be lots of work.<end>"

["1210179"]
japanese = "………………。<line-break><line-break><line-break>強くなれ。<line-break>今のお前は弱すぎる。<end>"
english = "... Get stronger. You're far too weak right now.<end>"

["1210180"]
japanese = "どんな状況下でも生き残ることが<line-break>できる実力と冷静な判断力を<line-break>身につけることだ。<line-break>そのためには冒険者ギルドで仕事を<line-break>もらい、それを確実にこなしていけ。<line-break>少しずつ実力をつけるのだ。<end>"
english = "Develop the ability and calm judgment needed to survive under any circumstances. To do that, take jobs from the Adventurers' Guild and complete them without fail. Build your strength little by little.<end>"

["1210181"]
japanese = "そうだね、リベルダムへ行くのはどう？<line-break>あそこは冒険者の町だから仕事も<line-break>たくさんあると思うよ。<line-break>駆け出しの冒険者は実力も名声も<line-break>ないから、冒険者ギルドで引き受けた<line-break>仕事をこなしていくことが大切だよ。<end>"
english = "Why not go to Liberdam? It's a city of adventurers, so there should be plenty of work. Novice adventurers have neither ability nor Fame, so it's important for them to complete the jobs they accept from the Adventurers' Guild.<end>"

["1210182"]
japanese = "どう生きるかは、君自身が決める<line-break>べきことだ。大都市で名を馳せるも、<line-break>地方で埋もれるも、君次第だ。<end>"
english = "How you live is for you to decide. Whether you make a name for yourself in a great city or fade into obscurity in the provinces is entirely up to you.<end>"

["1210183"]
japanese = "僭越ながら、まずは拠点がなくては。<line-break>冒険者としての名声が欲しいなら、<line-break>自由都市リベルダムはいかがですか？<end>"
english = "If I may be so bold, you first need a base. If you seek Fame as an adventurer, how about Free City Liberdam?<end>"

["1210184"]
japanese = "ここ！\u3000って町を決めようよ。<line-break><value:$28>様の好きな町で<line-break>いいと思うよ。<end>"
english = "Let's pick one city and call it home! Any city <value:$28> likes should be fine.<end>"

["1210185"]
japanese = "まったく、最近の若いモンは…<line-break>と言いたいところじゃが、<line-break>こればかりは良く考えるがいいぞ。<line-break>冒険者の世は決して甘くはない。<line-break>ましてや動乱のきざしすらある昨今、<line-break>軽率な行動は命取りとなるからの。<end>"
english = "I'd like to say, “Young people these days...” but this is something you must consider carefully. An adventurer's life is never easy. Especially now, with signs of unrest appearing, a rash decision could prove fatal.<end>"

["1210186"]
japanese = "何より重要なのは、<line-break><value:$28>自身のことだろう。<line-break>冒険者の世間は甘くないぞ。<line-break>多くの冒険を体験し、心身、<line-break>そしてソウルを鍛えていこう。<line-break>大丈夫、素質はあるさ。<end>"
english = "What matters most is <value:$28>. The adventurers' world is not forgiving. Experience many adventures and train your mind, body, and Soul. Don't worry. You have the talent.<end>"

["1210187"]
japanese = "………………。<end>"
english = "...<end>"

["1210188"]
japanese = "うーん、駆け出しの冒険者なんだし、<line-break>まずは地道に仕事をこなして<line-break>実力をつけていくのが一番かな。<line-break>ロストールやリベルダムみたいな<line-break>大都市を拠点に、<line-break>ギルドで仕事をしてみるのはどう？<end>"
english = "Hmm. Since you're a novice adventurer, steadily completing jobs and building your abilities is probably best. Why not use a major city like Rostorl or Liberdam as your base and take work from the Guild?<end>"

["1210189"]
japanese = "………………。<end>"
english = "...<end>"

["1210190"]
japanese = "そうですね…どこかの町を拠点に<line-break>冒険者ギルドで仕事をこなしていけば<line-break>実力も経験もつくと思います。<line-break>まずは無理せず力をつけることが<line-break>大事ですよ。<line-break>お客さんの受け売りなんですけどね。<end>"
english = "Well... if you make some town your base and complete jobs from the Adventurers' Guild, I think you'll gain ability and experience. The important thing is to build your strength first without overreaching. I'm only repeating what one of my customers said, though.<end>"

["1210191"]
japanese = "………………。<end>"
english = "...<end>"

["1210192"]
japanese = "（楽な仕事ばかりこなしていると<line-break>\u3000金は貯まるけど、実力はあまり<line-break>\u3000つかないかもしれない）<line-break>（たまには迷宮や洞窟に潜って、<line-break>\u3000モンスター相手に腕試しをするのも<line-break>\u3000実力をつけるにはいいのかも…）<end>"
english = "(Doing nothing but easy jobs will earn money, but may not improve my abilities very much.) (Venturing into a labyrinth or cave now and then to test myself against monsters might be a good way to become stronger...)<end>"

["1210193"]
japanese = "そうねえ、ちょっと腕試しに近くの<line-break>迷宮や洞窟を探検するってのはどう？<line-break>ギルドの仕事ばかりじゃ飽きるしね。<line-break>まだ、モンスターが強くて危ないなと<line-break>思ったら逃げればいいことだしね。<line-break>さっそく行ってみようか？<end>"
english = "Well, how about exploring a nearby labyrinth or cave to test our skills? Doing nothing but Guild jobs gets boring. If the monsters still seem too strong and dangerous, we can always run away. Shall we go right now?<end>"

["1210194"]
japanese = "そうじゃのう、迷宮や洞窟を冒険する<line-break>のが手っ取り早い方法じゃと思うぞ。<line-break>腕試しにもなるから一石二鳥じゃな。<line-break>しかし、深入りは禁物じゃ。<line-break>危ないと思ったら引き上げることよ。<line-break>死んでしまっては元も子もないからの。<end>"
english = "Hmm, I think the quickest way would be to venture into a labyrinth or cave. It would test your skills too, so you'd be killing two birds with one stone. But you mustn't go too deep. If it seems dangerous, turn back. Nothing is worth getting killed over.<end>"

["1210195"]
japanese = "魔法の実力を磨くには、精霊力を<line-break>鍛えることだって学校で習いました。<line-break>精霊力は戦闘で鍛えられるそうですよ。<line-break>ならば、迷宮や洞窟みたいに戦闘が<line-break>たくさんできそうな場所を探検すれば<line-break>問題解決ですね。<end>"
english = "At school, I learned that improving your magic means training your spiritual power. Apparently, spiritual power can be trained through combat. In that case, exploring somewhere with plenty of opportunities to fight, such as a labyrinth or cave, should solve the problem.<end>"

["1210196"]
japanese = "実戦が一番じゃねえのか。<line-break>迷宮とか洞窟を探検してモンスターを<line-break>倒しまくれば実力もつくだろぜ。<line-break>冒険者ギルドで楽そうな仕事ばかり<line-break>選んでいる意気地なしには、できねえ<line-break>だろうがな。<end>"
english = "Nothing beats real combat, right? Explore labyrinths and caves and take down monster after monster, and you're bound to get stronger. Not that some coward who only picks easy jobs at the Adventurers' Guild could manage it.<end>"

["1210197"]
japanese = "冒険者ギルドで引き受けた仕事を<line-break>やり遂げていくことも大切だけど、<line-break>ボクもたまには探検に行きたいな。<line-break>迷宮とか洞窟とか探検するのって<line-break>新しい発見があってワクワクするんだ。<line-break>腕試しにもなると思うし、どうかな？<end>"
english = "It's important to keep completing the jobs we take from the Adventurers' Guild, but I'd like to go exploring once in a while too. Exploring labyrinths and caves is exciting because you never know what you'll discover. It would give us a chance to test our skills too. What do you think?<end>"

["1210198"]
japanese = "自分の性質というものを知ることね。<line-break>特に、人間であるあなたは、<line-break>中途半端に終わる可能性が高いわ。<line-break>同時にそれは、意志の問題でもある…。<line-break>自分がどんな冒険者になりたいか、<line-break>決めるのはあなたということね。<end>"
english = "You need to understand your own nature. As a human in particular, you're quite likely to end up half-baked. At the same time, that's also a matter of will... You're the one who decides what kind of adventurer you want to become.<end>"

["1210199"]
japanese = "そうですね、ギルドで仕事を引き受ける<line-break>場合に、迷宮や洞窟を探検しなくては<line-break>ならない仕事を選ぶようにするのです。<line-break>そうすれば、モンスターと戦ったり<line-break>宝を見つけたりするでしょうから、<line-break>少しずつ実力がついていくでしょう。<end>"
english = "When taking jobs from the Guild, try to choose ones that require you to explore labyrinths or caves. You'll likely fight monsters and find treasure along the way, so your abilities should gradually improve.<end>"

["1210200"]
japanese = "とにかく、あたしみたいに数多くの<line-break>修羅場をくぐっていくことね。<line-break>それで生き残れば実力つくわよー。<line-break>それがダメなら、迷宮とか洞窟とか<line-break>モンスターが出てくるところを<line-break>探検すれば、実力つくと思うけど。<end>"
english = "Above all, you need to survive as many deadly situations as I have. If you make it through alive, you'll get stronger! If that's too much, I suppose you could explore labyrinths, caves, and other places where monsters appear. That should make you stronger too.<end>"

["1210201"]
japanese = "俺、思うんだけど護衛や運送の仕事って<line-break>すごく楽な仕事なんじゃないかな。<line-break>姉ちゃん俺たち実力つけたいんだよな？<line-break>俺、楽な仕事ばかりやってると実力が<line-break>つかないと思うんだ。だから、探索とか<line-break>退治とかの仕事を中心にしていこうぜ。<end>"
english = "I've been thinking: aren't Escort and transport jobs really easy? Sis, we want to get stronger, right? I don't think we'll improve if we keep doing nothing but easy jobs. So let's focus on exploration and extermination work.<end>"

["1210202"]
japanese = "迷宮や洞窟を探検してみるのは<line-break>どうでしょう？<line-break>もちろん、危険はともないますよ。<line-break>しかし、危険を恐れていては、<line-break>他人に尊敬されるような冒険者に<line-break>なれないと思います。<end>"
english = "Why not try exploring a labyrinth or cave? There will be danger, of course. But if you're afraid of danger, I don't think you can become the kind of adventurer others respect.<end>"

["1210203"]
japanese = "おいおい、基本は冒険者ギルドの仕事を<line-break>こなしていくことだぜ。<line-break>そうすりゃソウルも育つし実力もつく。<line-break>だが、洞窟や迷宮を探検することも<line-break>たまには必要かもしれん。<line-break>腕試しの意味も含めてな。<end>"
english = "Come on, the main thing is to keep doing jobs for the Adventurers' Guild. That'll develop your Soul and make you stronger. Still, you may need to explore a cave or labyrinth from time to time, if only to test your skills.<end>"

["1210204"]
japanese = "冒険者ギルドの仕事をこなし、ソウルを<line-break>鍛えることが先決だ。だが、楽な仕事<line-break>ばかりでは実戦経験が不足する。<line-break>迷宮や洞窟を探検することも<line-break>たまには必要だろう。<line-break>だが、無理はするなよ。<end>"
english = "Your first priority is to complete jobs for the Adventurers' Guild and train your Soul. But easy jobs alone won't give you enough real combat experience. You should explore labyrinths and caves from time to time as well. Just don't push yourself too far.<end>"

["1210205"]
japanese = "そうじゃのう、わしが駆け出しのころは<line-break>冒険者ギルドで引き受けた仕事の合間に<line-break>迷宮や洞窟を探検しておったな。<line-break>迷宮や洞窟を制覇するたびに、少しづつ<line-break>実力がついたような気がしたものじゃ。<line-break>懐かしいのう。<end>"
english = "Ah, yes. When I was a novice, I used to explore labyrinths and caves between the jobs I took from the Adventurers' Guild. Each time I conquered one, I felt as though I had grown a little stronger. Those were the days.<end>"

["1210206"]
japanese = "冒険者ギルドの仕事をこなすだけじゃ<line-break>ダメみたいだね。少し自信がついて<line-break>きたら迷宮や洞窟の探検にも行こうよ。<line-break>モンスターとの戦いから戦闘の駆け引き<line-break>を習得して戦い上手になるんだ。<end>"
english = "It seems that just completing jobs for the Adventurers' Guild isn't enough. Once we've gained a little confidence, let's go explore some labyrinths and caves too. By fighting monsters, we'll learn how to handle ourselves in combat and become better fighters.<end>"

["1210207"]
japanese = "ギルドの仕事をこなすだけが<line-break>冒険者の全てではないぞ。<line-break>君の知らない世界は、広い。<end>"
english = "An adventurer's life is about more than completing Guild jobs. The world you have yet to see is vast.<end>"

["1210208"]
japanese = "あんたの実力なんて高貴で知的な<line-break>アタクシが興味あるわけないでしょ。<line-break>失礼しちゃうわね。<line-break>そんなに実力つけたいなら<line-break>戦闘バカのボルダンやドワーフにでも<line-break>聞いてみればいいじゃない！<end>"
english = "Why would someone as noble and intelligent as moi care how capable you are? Honestly, how insulting. If you want to get stronger that badly, why don't you ask that battle-crazed fool Bordan, or a Dwarf?<end>"

["1210209"]
japanese = "実力をつけるには？ボゲー<end>"
english = "How do you get stronger, Bogee?<end>"

["1210210"]
japanese = "ルルアンタは冒険者ギルドのお仕事で<line-break>実力をつけたほうがいいと思うよぉ。<line-break>でもね、それだけじゃダメなのかも…<line-break>ギルドのおじさんがね、迷宮や洞窟を<line-break>探検しない冒険者は、いつまでも<line-break>駆け出しだって言うんだもん。<end>"
english = "Lulluantha thinks you should get stronger by doing jobs for the Adventurers' Guild. But maybe that alone isn't enough... The man at the Guild says adventurers who never explore labyrinths or caves stay novices forever.<end>"

["1210211"]
japanese = "………………。<line-break><line-break><line-break>洞窟と迷宮だ。<end>"
english = "... Caves and labyrinths.<end>"

["1210212"]
japanese = "どんな状況下でも生き残ることが<line-break>できる実力と冷静な判断力を<line-break>身につけることだ。<line-break>そのためには冒険者ギルドで仕事を<line-break>もらい、それを確実にこなしていけ。<line-break>少しずつ実力をつけるのだ。<end>"
english = "Develop the ability and calm judgment needed to survive under any circumstances. To do that, take jobs from the Adventurers' Guild and complete them without fail. Build your strength little by little.<end>"

["1210213"]
japanese = "護衛や運送の仕事ばかりしていると<line-break>なかなか実力がつかないよ。<line-break>探索や退治の仕事を中心にするんだ。<line-break>特に迷宮や洞窟に行くような仕事が<line-break>実力をつけるには、もってこいだよ。<line-break>ぼくのアドバイスって役に立つでしょ。<end>"
english = "You won't improve much if you only do Escort and transport jobs. Focus on exploration and extermination work. Jobs that send you into labyrinths or caves are especially good for building your abilities. My advice is useful, isn't it?<end>"

["1210214"]
japanese = "平均点ほどの者が言いそうなことだ。<line-break>つまり君は、良くも悪くも人並み。<line-break>わかるかね？<line-break>群集から抜け出たいと思うなら、<line-break>皆の行かぬところへ行き、<line-break>困難な仕事を成功させることだ。<end>"
english = "That's precisely what one would expect from someone of merely average caliber. In other words, for better or worse, you're unexceptional. Do you understand? If you wish to rise above the crowd, go where others will not and succeed at difficult jobs.<end>"

["1210215"]
japanese = "中級以上の冒険者は町から離れ、<line-break>洞窟や迷宮にも踏み入って<line-break>実力を磨いています。<line-break>行くきっかけは依頼としてギルドで<line-break>得ることができますが、相応の<line-break>危険も伴うことをお忘れなく。<end>"
english = "Adventurers of intermediate rank and above leave the towns behind and venture into caves and labyrinths to hone their skills. The Guild can provide jobs that give you a reason to go, but don't forget that such places pose dangers to match.<end>"

["1210216"]
japanese = "私たちも、昔は苦労したんだよ。<line-break>何回も危ない目に会ったしね。<line-break>そのおかげで、今の私があるの！<end>"
english = "We had a hard time in the old days too. We found ourselves in danger over and over. And that's what made me who I am today!<end>"

["1210217"]
japanese = "なるほどな、荷物配達などは、<line-break>もういい加減、物足りなくなってきた<line-break>というわけじゃ。<line-break>ならば町の外にも目を向けよ。<line-break>迷宮や遺跡、森や洞窟や湖や…<line-break>何ならわしが案内してやってもいいぞ。<end>"
english = "I see. So parcel deliveries and the like are no longer enough to satisfy you. Then cast your eyes beyond the town: labyrinths, ruins, forests, caves, lakes... Why, I could even guide you myself, if you like.<end>"

["1210218"]
japanese = "そういうことで悩むようになれば、<line-break>冒険者として軌道に乗ってきた<line-break>証拠だと言えるだろうな。<line-break>今までは町と町をつなぐような<line-break>仕事が多かったが、洞窟や迷宮にも<line-break>足を伸ばしてみるといい。<end>"
english = "The fact that you've begun worrying about such things is proof that you're finding your feet as an adventurer. Most of your work until now has taken you from one town to another, but you should try venturing into caves and labyrinths as well.<end>"

