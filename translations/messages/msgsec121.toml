["1210171"]
japanese = "そうだな、お前さんに足りないのは<line-break>実力と名声だから、まずはそいつらを<line-break>身につける必要がある。<line-break>ロストールにでも腰を落ち着けてだな、<line-break>冒険者ギルドでもらった仕事をこなして<line-break>いこうや。そうすりゃ実力もつくだろ。<end>"
