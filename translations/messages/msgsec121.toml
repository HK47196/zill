["1210222"]
japanese = "やっぱり実戦が一番だと思います！<line-break>よく言うじゃないですか？<line-break>百回の練習より一回の本番って。<line-break>ギルドの仕事でモンスターと戦うような<line-break>仕事をこなしていけば、<line-break>自然と実力がつくはずです。<end>"
