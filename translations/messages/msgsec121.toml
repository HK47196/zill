["1210220"]
japanese = "実力をつけたいなら<line-break>洞窟や迷宮に行って、<line-break>モンスターたちを相手にすること。<line-break>ギルドでそれ系の仕事をこなしていけば<line-break>すぐ実力がつくはずよ。<line-break>例えば、退治や探索なんかね。<end>"
english = "If you want to get stronger, go to caves and labyrinths and take on the monsters there. Keep doing that sort of job for the Guild, and you should improve in no time. Extermination and exploration jobs, for example.<end>"

