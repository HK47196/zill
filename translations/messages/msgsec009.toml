["90000"]
japanese = "<select><value:$20>%3ここウルカーンには、失われた魔法文明の\u3000\u3000<line-break>技術をよみがえらせようと多くの魔道士が<line-break>集まっています。<line-break>私も、マグマゴーレムの製法から何か得る物は<line-break>ないかとディンガルからやってきたのですが、<line-break>なかなか思うように研究が進まなくて…。<end>火の属性に強いのは風の属性で、弱いのは\u3000<line-break>水の属性なのです。冒険に行く前に装備品の<line-break>属性を確認しといたほうがいいですよ。<end>冒険者ギルドの裏側から通じている<line-break>道の向こうに行ったことありますか？<line-break>モンスターが強くて私は行けないんです。<line-break>あの道の向こうには、<line-break>いったい何があるんでしょうね？<end>"
english = "<select><value:$20>%3Many mages have gathered here in Ulkarne, hoping to revive the lost arts of magical civilization. I came from Dyneskal myself, hoping to learn something useful from the methods used to create Magma Golems, but my research hasn't gone as well as I'd hoped.<end>Wind is strong against Fire, while Water is weak against it. You should check the elements of your equipment before setting out on an adventure.<end>Have you ever followed the path behind the Adventurers' Guild to see what's beyond it? The monsters are too strong for me to go any farther. I wonder what's out there.<end>"

["90001"]
japanese = "<if><value:$2C><less-equal>%9あなた、冒険者としては駆け出しみたいね。<line-break>もし炎竜山に登ったことがないなら<line-break>一度登ってみることをすすめるわ。<line-break>あの辺りには火属性のモンスターが多いけど<line-break>それほど強くないから安心していいわよ。<end><if><value:$2C><less-equal>%29炎竜山や鳳凰山のように<line-break>火属性のモンスターが多いところでは、<line-break>風属性の武器が威力を発揮するのよ。<end><if><value:$2C><less-equal>%49この地のどこかに火属性の禁呪が<line-break>封印されているのよ。<line-break>あたしは神殿が怪しいと思うんだけど…。<end>火属性の禁呪は火の精霊神が守っている<line-break>みたいよ。なんとかして封印を解きたいけど<line-break>精霊神が相手じゃねぇ。<end>"
english = "<if><value:$2C><less-equal>%9You look like you're just starting out as an adventurer. If you've never climbed Flame Dragon Mountain, you should give it a try. There are plenty of Fire-element monsters in that area, but they're not especially strong, so you should be fine.<end><if><value:$2C><less-equal>%29In places with lots of Fire-element monsters, such as Flame Dragon Mountain and Phoenix Mountain, Wind-element weapons are especially effective.<end><if><value:$2C><less-equal>%49A Fire Forbidden Spell is sealed somewhere in this land. My guess is the temple...<end>It seems the Fire Forbidden Spell is guarded by the elemental god of fire. I'd like to find some way to break the seal, but taking on an elemental god is another matter.<end>"

["90002"]
japanese = "<select><value:$33>旅立ちの時にここに来ちゃうなんて…。<line-break>もしかしてバグなのかしら？<end>この間、炎竜山が久しぶりに噴火したの。<line-break>竜王の覚醒だって噂されてる例の地震が<line-break>原因なのかしら？<end>勇者ネメアがディンガル帝国の新皇帝ですって。<line-break>前の皇帝は若かったと思うけど、事故か何かで<line-break>死んだのかしら？<end>おとなりのロセンがディンガルに滅ぼされた<line-break>そうよ。ディンガル軍を指揮していたのは、<line-break>若干１６歳の少女なんですって。<end>カルラ将軍の手腕で、ロセンは新しい都市に<line-break>生まれ変わっているそうよ。<line-break>闘技場もできるんですってよ。<end>リベルダムが陥落したせいで、<line-break>大商人たちはロセンへ引っ越したそうよ。<end>ネメアは何が目的で闇の神器を<line-break>集めているのかしら。<line-break>もしかして破壊神の復活？<end>ネメアが行方不明なんですって。<line-break>彼が集めていたという闇の神器は<line-break>どうなったのかしら？<end>"
english = "<select><value:$33>How did you end up here just as you were setting out...? Could this be a bug?<end>Flame Dragon Mountain erupted the other day for the first time in ages. I wonder if that earthquake, the one rumored to be the Dragon King's Awakening, caused it.<end>They say Hero Nemea is the new emperor of the Dyneskal Empire. I thought the previous emperor was young. Perhaps there was an accident or something?<end>I hear neighboring Rocen was destroyed by Dyneskal. They say the Dyneskal Army was commanded by a girl of only sixteen.<end>They say General Karula is transforming Rocen into a new city. It's even getting an arena.<end>Apparently, the great merchants moved to Rocen after Liberdam fell.<end>Why is Nemea collecting the Dark Artifacts? Could he be trying to revive the God of Destruction?<end>They say Nemea has disappeared. I wonder what became of the Dark Artifacts he was supposedly collecting.<end>"

["90003"]
japanese = "<if><value:$2C><less-equal>%9ここに住んでいると、<line-break>火の精霊力レベルばかりが上がって困るよ。<line-break>水属性の魔法だって使いたいのになあ。<end><if><value:$2C><less-equal>%29この辺りのモンスターは火属性なんだよ。<line-break>だから火属性の魔法は効きやしない。<line-break>風属性の魔法でないとダメなのさ。<end><if><value:$2C><less-equal>%49闇属性の魔法を使えるようになるには、<line-break>ネガヴァニティアのソウルを宿さないと<line-break>ダメなのさ。知っていたかい？<end>バニティスペルを使えない人は、<line-break>闇属性の禁呪の封印を解くことが<line-break>できないそうだよ。<end>"
english = "<if><value:$2C><less-equal>%9The trouble with living here is that only my Fire spirit power level ever goes up. I want to use Water-element magic too.<end><if><value:$2C><less-equal>%29The monsters around here are Fire-element creatures, so Fire-element magic won't touch them. You need Wind-element magic.<end><if><value:$2C><less-equal>%49To use Dark-element magic, you have to take the Soul of Negavanitia into yourself. Did you know that?<end>I hear anyone who can't use a Vanity Spell can't break the seal on the Dark Forbidden Spell.<end>"

["90004"]
japanese = "<select><value:$33>旅立ちの途中に来てしまうとは困った奴じゃ。<line-break>もう一度旅立ちの舞台に戻るがよいぞ。<end>この辺りを歩きまわっとる魔道士は<line-break>みなわしのかわいい弟子たちじゃ。<line-break>お主もこの地に住むのなら弟子にしてやるぞい。<end>わしが若いころに、ディンガルの邪眼帝バロル<line-break>めが攻めてきおってのう。わしも仲間と共に<line-break>マグマゴーレムを率いて戦ったんじゃよ。<line-break>もちろんマグマゴーレム部隊の大勝利じゃった。<line-break>しかし、マグマゴーレムの力は強力すぎる。<line-break>決して侵略には使ってはいかんと思ったわい。<end>もし、ディンガルがこの地に攻めてきたら<line-break>わしは迷わずマグマゴーレムを使うじゃろう。<line-break>そのためにたくさんの死傷者が出たとしてもな。<end>わしの寿命もそう長くない。<line-break>それじゃから、わしは弟子を育てることに<line-break>専念しておるのじゃ。<end>この地を守ってきたマグマゴーレムも、<line-break>操れる者が少なくなって、今ではただの<line-break>モンスターと化しておる。嘆かわしいのう。<end>古代ラドラスの魔法技術の中から、<line-break>戦いに関係なく、我々の生活を豊かにしてくれる<line-break>技術のみを復活できればよいのじゃがな。<end>あれほどの強さを誇るネメアも<line-break>ずいぶんあっけなく死んでしもうたの。<line-break>人生、何が起こるかわからんわい。<end>"
english = "<select><value:$33>What a nuisance, showing up here midway through your departure. Go back to where your journey begins.<end>All the mages wandering around here are my dear pupils. If you mean to live in this land, I'll take you on as one too.<end>When I was young, that Evil-Eyed Emperor Balor of Dyneskal invaded. My companions and I led the Magma Golems into battle, and naturally, our Magma Golem force won a great victory. But their power is too great. It must never be used for conquest.<end>If Dyneskal ever invades this land, I will not hesitate to use the Magma Golems, even if it means many casualties.<end>I haven't many years left. That is why I now devote myself to training my pupils.<end>The Magma Golems that once defended this land have become mere monsters now that so few can control them. A sorry state of affairs.<end>If only we could revive just those technologies of ancient Ladras that have nothing to do with warfare and would enrich our lives.<end>Even mighty Nemea died all too easily. One never knows what life will bring.<end>"

["90005"]
japanese = "<if><value:$2C><less-equal>%9鳳凰山に住んでいるというフェニックスを\u3000<line-break>ひとめ見ようと、命知らずの冒険者が<line-break>挑戦しているが、今だ成功した者はおらん。<line-break>わしも挑戦したんだが、モンスターが強くて<line-break>危うくドワーフの丸焼きになるところ<line-break>だったわい。<end><if><value:$2C><less-equal>%29鳳凰山のモンスターは、フェニックスが住む<line-break>という山頂に近づくほど強くなるようだわい。<line-break>お主も無理をして深入りせんようにな。<end><if><value:$2C><less-equal>%49お主ならフェニックスと戦っても<line-break>大丈夫かもしれんな。<line-break>わしなどより、よっぽど強いわい。<end>お主ほどの強者になると自分より強い相手が<line-break>おらんでさびしいじゃろう。<line-break>竜王に挑んでみるのはどうじゃ？<end>"
english = "<if><value:$2C><less-equal>%9Reckless adventurers keep trying to catch a glimpse of the Phoenix said to live on Phoenix Mountain, but not one has succeeded yet. I tried myself, but the monsters nearly made a roast Dwarf out of me.<end><if><value:$2C><less-equal>%29The monsters on Phoenix Mountain seem to grow stronger the closer one gets to the summit where the Phoenix is said to dwell. Don't push your luck by venturing too deep.<end><if><value:$2C><less-equal>%49You might well survive a fight with the Phoenix. You're far stronger than I am.<end>When you're as strong as you are, it must be lonely having no one stronger to face. Why not challenge the Dragon King?<end>"

["90006"]
japanese = "<if><value:$2A><less-equal>%49勇者ネメアって知ってるか？\u3000\u3000<line-break>魔王バロルを倒して世界を救った<line-break>英雄なんだぜ。<line-break>俺もあの人みたいになりたくて<line-break>冒険者をやってるんだ。<line-break>なかなか有名になれないけどな。<end><if><value:$2A><less-equal>%120最近、<value:$28>って名の<line-break>冒険者が活躍しているらしいな。<line-break>俺も負けてられねえぜ。<end><value:$28>は化け物かっ！<line-break>どうやったらこんな短期間で<line-break>大陸中に名前が知れ渡るんだ！？<end>"
english = "<if><value:$2A><less-equal>%49You know Hero Nemea? He's the hero who saved the world by defeating Balor, Demon King. I became an adventurer because I wanted to be like him. Haven't had much luck making a name for myself, though.<end><if><value:$2A><less-equal>%120Sounds like an adventurer named <value:$28> has been making quite a name lately. I can't afford to fall behind.<end>Is <value:$28> some kind of monster?! How does anyone become famous across the whole continent so quickly?!<end>"

["90007"]
japanese = "<select><value:$20>%2元々ウルカーンは古代魔道王国ラドラスの\u3000\u3000\u3000<line-break>火の巫女ウルと、魔法文明を捨てるという<line-break>彼女の意志に賛同した者たちが造ったのじゃ。<line-break>じゃが長い年月が経って、マグマゴーレム<line-break>を研究して魔法文明をよみがえらせようとする<line-break>魔道士たちが集う都市になってしまったのじゃ。<end>火の巫女フレア様の世話はシェムハザ殿が\u3000\u3000<line-break>しておるんじゃ。そのせいかフレア様のお姿を<line-break>ここ２０年くらい見てない気がするのう。<line-break>しかし、わしが若いころから火の巫女はフレア様<line-break>じゃったが、もうかなりのお年じゃろう、<line-break>いつ代替わりするのかのう。<end>"
english = "<select><value:$20>%2Ulkarne was originally founded by Uru, the Priestess of Fire of Magic Kingdom Ladras, together with those who shared her resolve to abandon magical civilization. But as the years passed, it ended up as a city where mages gather to revive magical civilization through research into Magma Golems.<end>Lord Shemhaza looks after Flare, the Priestess of Fire. Perhaps that's why I haven't seen Flare in some twenty years. Still, Flare was already the Priestess of Fire when I was young, and she must be quite old by now. I wonder when a successor will take her place.<end>"

["90008"]
japanese = "<select><value:$20>%3火の巫女ウルの血をひくフレア様が<line-break>火の神殿で祈ってくださるから、<line-break>わしらは安心して暮らせるんじゃよ。<end>長老のシェムハザ殿はコーンス族でな、<line-break>額に角が生えておる。<line-break>あれが魔力の源なのじゃ。<end>ウルカーンのことは長老のシェムハザ殿が<line-break>すべてしきっておる。おかげで研究に没頭できる<line-break>からありがたいことじゃ。<end>"
english = "<select><value:$20>%3Because Flare, a descendant of Uru, Priestess of Fire, offers prayers for us at the Temple of Fire, we can live here in peace.<end>Elder Shemhaza belongs to the Konsu people and has a horn on his forehead. That horn is the source of his magical power.<end>Elder Shemhaza runs everything in Ulkarne. Thanks to him, I can concentrate on my research, and I'm grateful for it.<end>"

["90009"]
japanese = "<if><value:$2A><less-equal>%49かつて魔道王国ラドラスには砂漠や極寒の地など<line-break>人間が生きていけないような場所で快適に暮らす<line-break>ための魔法技術があったそうです。<line-break>その魔法技術を蘇らせることができれば<line-break>竜骨の砂漠のような灼熱の地でも快適に<line-break>暮らせるのですが…。<end><if><value:$2A><less-equal>%100この地の守護者マグマゴーレムも、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>失われた魔法技術によって<line-break>動いているのですよ。<line-break>かつては傭兵がわりに魔道士たちが<line-break>操っていたそうですが、今では操る者も減って<line-break>ただのモンスターになってますけど。<end>私の友人のエストは、闇の神器という道具を<line-break>中心に魔法技術の研究をしているのですよ。<line-break>私たちの研究成果を期待していてください。<end>"
english = "<if><value:$2A><less-equal>%49The Magic Kingdom Ladras is said to have possessed magical technology that allowed people to live comfortably in places where humans could not otherwise survive, from deserts to lands of bitter cold. If we could revive that technology, people could live comfortably even in the scorching heat of the Dragonbone Desert.<end><if><value:$2A><less-equal>%100The Magma Golems, guardians of this land, are also powered by lost magical technology. Mages once controlled them in place of mercenaries, but now so few can control them that they've become nothing more than monsters.<end>My friend Est researches magical technology, focusing on devices known as Dark Artifacts. You can look forward to seeing what our research produces.<end>"

["90010"]
japanese = "<select><value:$20>%2ぼくもゾフォルみたいな歴史に残る<line-break>悪の魔道士になるんだ。<end>魔法の勉強してるとすぐに眠くなるんだ。<line-break>だから息抜きに運動しないとね。<end>"
english = "<select><value:$20>%2I'm going to be an evil mage who goes down in history, just like Zofor.<end>Studying magic always makes me sleepy. That's why I need some exercise now and then for a change of pace.<end>"

["90011"]
japanese = "ウルカーンメッセージここまで<end>"
english = ""
