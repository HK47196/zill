["1900000"]
japanese = "Ｖ７その２開始<end>"
english = ""

["1900001"]
japanese = "またも円卓騎士か！<line-break>開け放つものヴァシュタール！<line-break>\u3000<line-break>このエンシャントのどこかで、<line-break>闇の力が、極度に<line-break>強まっているということか。<end>"
english = "Another Knight of the Round Table! Vashtar the Opener! Does this mean the power of darkness has grown immensely somewhere in Ancient?<end>"

["1900002"]
