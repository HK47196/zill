["1900006"]
japanese = "紹介しよう。<line-break>エンシャントの新皇帝<line-break>ザギヴ・ディンガル陛下だ。\u3000\u3000\u3000\u3000<line-break>ディンガル家の正統な後継者であり、<line-break>強大な闇の力を身中に宿しておる。<line-break>闇の世を治めるにふさわしき皇帝よ。<end>"
english = "Allow me to present Her Majesty Zagiv Dingal, the new Empress of Ancient. The rightful heir to House Dingal, she bears a mighty power of darkness within her. An empress worthy to rule the world of darkness.<end>"

["1900007"]
japanese = "<if><value:$01><equal>2あなた、ザギヴ様に何をしたの！？ <end><if><value:$01><equal>3お主、ザギヴに何をしおった！ <end><if><value:$01><equal>4ザギヴ様になんかしたわね。<line-break>いけないじじいですね、まったく。 <end><if><value:$01><equal>5てめえ、ザギヴに何かしやがったな！ <end><if><value:$01><equal>6ザギヴに何をしたの！？ <end><if><value:$01><equal>7ザギヴほどの魔道士が<line-break>操られている！？<line-break>シャリ、何をした！ <end><if><value:$01><equal>8ザギヴに潜んでいる闇に<line-break>力を与えましたね。<line-break>ひどいことを…。 <end><if><value:$01><equal>9ザギヴの様子が変ね。<line-break>シャリ、また何かやったね？ <end><if><value:$01><equal>12何かに操られているのか？<line-break>爺さん、あんた何をしたんだ？ <end><if><value:$01><equal>13あの女、様子が変だ…。<line-break>貴様、何をした！ <end><if><value:$01><equal>10姉ちゃん、ザギヴが変だよ。<line-break>こら、じじい！\u3000ザギヴに何した！ <end><if><value:$01><equal>14お主、ザギヴに何をしたのじゃ！？ <end><if><value:$01><equal>15ザギヴさん…、様子が変だね。<line-break>シャリに操られている…？ <end><if><value:$01><equal>17やーね、まったく、あの女、<line-break>自分を忘れてるじゃない。<line-break>いったいどうなってるのよー！ <end><if><value:$01><equal>19<value:$28>、<line-break>ザギヴさんが変だよぉ。<line-break>またシャリが何かしたんだよ。 <end><if><value:$01><equal>20闇に<line-break>操られているな。 <end><if><value:$01><equal>21様子がおかしい…<line-break>貴様、何をした！ <end><if><value:$01><equal>23貴様、ザギヴに何をした！ <end><if><value:$01><equal>27様子が変だ…。<line-break>操られているのか？！<end><if><value:$01><equal>26おぬし、ザギヴ殿に<line-break>何をしたんじゃ！<end><if><value:$01><equal>24様子がおかしい…？<line-break>操られているというの…？！<end><if><value:$01><equal>25様子が変… <end>あなた、何をしたの！？ <end>ディンガル新皇帝の誕生…。<line-break>歴史的な瞬間だけど、<line-break>こんな場面を詩にしたくはないよ。 <end>"
english = "<if><value:$01><equal>2What have you done to Lady Zagiv?!<end><if><value:$01><equal>3What have you done to Zagiv?!<end><if><value:$01><equal>4You did something to Lady Zagiv, didn't you? What a bad old man you are. Honestly.<end><if><value:$01><equal>5You bastard! You did something to Zagiv!<end><if><value:$01><equal>6What did you do to Zagiv?!<end><if><value:$01><equal>7A sorceress as powerful as Zagiv is being controlled?! Shalli, what have you done?!<end><if><value:$01><equal>8You gave power to the darkness lurking within Zagiv. What a horrible thing to do...<end><if><value:$01><equal>9There's something strange about Zagiv. Shalli, what have you done this time?<end><if><value:$01><equal>12Is something controlling her? Old man, what did you do?<end><if><value:$01><equal>13There's something wrong with that woman... What have you done?!<end><if><value:$01><equal>10Sis, something's wrong with Zagiv. Hey, old man! What did you do to her?!<end><if><value:$01><equal>14What have you done to Zagiv?!<end><if><value:$01><equal>15Something's wrong with Zagiv... Is Shalli controlling her?<end><if><value:$01><equal>17Oh, honestly! That woman has completely forgotten herself. What in the world is going on?!<end><if><value:$01><equal>19<value:$28>, something's wrong with Zagiv. Shalli must have done something again.<end><if><value:$01><equal>20The darkness is controlling her.<end><if><value:$01><equal>21Something is wrong... What have you done?!<end><if><value:$01><equal>23What have you done to Zagiv?!<end><if><value:$01><equal>27Something's wrong... Is she being controlled?!<end><if><value:$01><equal>26What have you done to Lady Zagiv?!<end><if><value:$01><equal>24Something is wrong... Is she being controlled?!<end><if><value:$01><equal>25Something's wrong...<end>What have you done?!<end>The birth of Dingal's new empress... A historic moment, but not one I'd want to immortalize in verse.<end>"

["1900008"]
japanese = "そう騒ぐでない。これも運命。<line-break>ザギヴに巣くっておった闇が、<line-break>時を得て甦りつつあるだけのこと。<line-break>ネメアを失い、弱くなった心では、<line-break>闇を抑えきれなかったのよ。<end>"
english = "Enough of this clamor. This too is fate. The darkness that nested within Zagiv has merely found its hour and begun to awaken. With Nemea gone, her weakened heart could no longer contain it.<end>"

["1900009"]
japanese = "だが、お主への想いが<line-break>どうやら最後の覚醒にいたらせぬ<line-break>原因のようじゃ。<end>"
english = "And yet, it seems her feelings for you are what keep the final awakening at bay.<end>"

["1900010"]
japanese = "フフフ、<value:$28>が<line-break>ザギヴの最後の希望ってわけだね。\u3000\u3000<line-break>\u3000<line-break>周囲から疎まれ続けたザギヴにとって、<line-break><value:$28>だけが<line-break>心を許せる人物だったんだ。<end>"
english = "Heh heh... So <value:$28> is Zagiv's last hope. Shunned by everyone around her, Zagiv found only one person she could trust: <value:$28>.<end>"

["1900011"]
japanese = "だが、それも幻想にすぎぬということを<line-break>教えてやらねばなるまい。<line-break>\u3000<line-break><value:$28>よ、どうする？<line-break>ザギヴとともに闇を滅ぼすか？<line-break>じゃが、そのときはザギヴも死ぬぞ。<end>"
english = "But she must be taught that even this is no more than an illusion. What will you do, <value:$28>? Will you destroy the darkness together with Zagiv? If you do, Zagiv will die as well.<end>"

["1900012"]
japanese = "さあ、ザギヴ。<line-break>自らの手で試すがよい。<line-break>\u3000<line-break>たとえ<value:$28>であっても、<line-break>恐怖の存在には剣を向けるしかない<line-break>ということをな。<end>"
english = "Now, Zagiv. See for yourself. Even <value:$28> can do nothing but raise a sword against something to be feared.<end>"

["1900013"]
japanese = "<if><value:$01><equal>2え、<value:$28>？<line-break>ひとりで戦うって…、ちょっと！ <end><if><value:$01><equal>3なんじゃと？<line-break>お主、ひとりで戦うつもりか？ <end><if><value:$01><equal>4え、ひとりで戦うの？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>ふーん…、ちょっとかっこいいかも。 <end><if><value:$01><equal>5ひとりで戦うだって！？<line-break>おい、マジかよ！ <end><if><value:$01><equal>6ひとりで戦うって…。<line-break><value:$28>…。 <end><if><value:$01><equal>7ひとりで戦うですって？<line-break>バカな！\u3000死ぬ気なの！<line-break>ザギヴは強力な魔道士なのよ！ <end><if><value:$01><equal>8ひとりで戦うのですか？\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>そうですか、わかりました。<line-break>手は出しません。 <end><if><value:$01><equal>9ひとりで戦うの？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>ふーん、ま、いいけどね。<line-break>あ、わかってると思うけど、<line-break>ほんとに死んだら、意味ないかんね。 <end><if><value:$01><equal>12そうか、ひとりで戦うか。\u3000\u3000\u3000\u3000<line-break>無茶はするなよ。<line-break>\u3000<line-break>ほんとに死んじまったら、<line-break>意味がなくなっちまうんだからな。 <end><if><value:$01><equal>13ひとりで戦うだと！？<line-break>…正気か？ <end><if><value:$01><equal>10姉ちゃん、ひとりで戦うの？ <end><if><value:$01><equal>14お主、ひとりで戦うつもりか？ <end><if><value:$01><equal>15ひとりで戦うの？\u3000本当に？ <end><if><value:$01><equal>17ちょっとぉ、どういうことなのぉ！<line-break>ひとりで戦うですって！？ <end><if><value:$01><equal>19え、ひとりで戦うのぉ！？<line-break><value:$28>、大丈夫？ <end><if><value:$01><equal>20ひとりで戦うのか？<line-break>…わかった。譲ろう。 <end><if><value:$01><equal>21ひとりで戦うというのか？！<line-break>\u3000<line-break>\u3000<line-break>…わかった。 <line-break>だが、無理だけはしないでくれ<end><if><value:$01><equal>23ひとりで戦うつもりなのか？<line-break><value:$28>よ<end><if><value:$01><equal>27ひとりで戦うつもりなのか？！<end><if><value:$01><equal>26なんじゃと？<line-break><value:$28>殿<line-break>ひとりで戦うつもりか？！<end><if><value:$01><equal>24おひとりで戦われるのですね…<line-break> <line-break> <line-break>ご無理だけはなさらないでください<line-break><value:$28>様…<end><if><value:$01><equal>25ひとりで戦うなんて…！<line-break> <line-break> <line-break>お願い、無理はしないで…<end>え、ひとりで戦うの！？<line-break>本当にそれでいいの？ <end>"
english = "<if><value:$01><equal>2What, <value:$28>? You're going to fight alone? Wait!<end><if><value:$01><equal>3What? You intend to fight alone?<end><if><value:$01><equal>4What, you're fighting alone? Hmm... That's actually kind of impressive.<end><if><value:$01><equal>5You're fighting alone?! Are you serious?!<end><if><value:$01><equal>6You're going to fight alone... <value:$28>...<end><if><value:$01><equal>7You're going to fight alone? Don't be a fool! Are you trying to get yourself killed? Zagiv is a powerful sorceress!<end><if><value:$01><equal>8You intend to fight alone? Very well. I understand. I won't interfere.<end><if><value:$01><equal>9You're fighting alone? Hmm. Fine by me. But you do realize there's no point if you actually get yourself killed, right?<end><if><value:$01><equal>12So you're fighting alone. Don't do anything reckless. None of this will mean a thing if you actually get yourself killed.<end><if><value:$01><equal>13You mean to fight alone?! Have you lost your mind?<end><if><value:$01><equal>10Are you going to fight alone?<end><if><value:$01><equal>14You intend to fight alone?<end><if><value:$01><equal>15You're going to fight alone? Really?<end><if><value:$01><equal>17Wait just a moment! What's the meaning of this? You're fighting alone?!<end><if><value:$01><equal>19What, you're fighting alone?! Are you sure you'll be all right, <value:$28>?<end><if><value:$01><equal>20You're fighting alone? Very well. I'll stand aside.<end><if><value:$01><equal>21You mean to fight alone?! Very well. But please, don't push yourself too far.<end><if><value:$01><equal>23Do you intend to fight alone, <value:$28>?<end><if><value:$01><equal>27You intend to fight alone?!<end><if><value:$01><equal>26What? <value:$28>, do you intend to fight alone?!<end><if><value:$01><equal>24So you mean to fight alone... Please, do not overexert yourself, <value:$28>...<end><if><value:$01><equal>25You're going to fight alone...! Please, don't push yourself too far...<end>What, you're fighting alone?! Are you sure about this?<end>"

