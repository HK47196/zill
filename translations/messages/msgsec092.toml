english = "Heh... Bwahahaha! You impudent little wretch! You win.<end>"

["920021"]
japanese = "ところで若いの。<line-break>その風体、冒険者か？<line-break>わしも、もとが付くが冒険者じゃ。<line-break>ちょうどいい。<line-break>わしもまた旅に出たかったのじゃ。<line-break>一緒に連れていってくれんか？<end>"
english = "By the way, youngster. Judging by the look of you, are you an adventurer? I'm one myself―or was, at any rate. This is perfect. I've been wanting to take to the road again. How about letting me come with you?<end>"

["920022"]
japanese = "仲間にする<end>"
english = "Accept as a companion<end>"

["920023"]
japanese = "仲間にしない<end>"
