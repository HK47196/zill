["920000"]
japanese = "デルガド\u3000Ｖ１\u3000開始<end>"
english = ""

["920001"]
japanese = "刀工デルガドをお探しかい？<line-break>あそこで飲んだくれてるのがご当人さ。<line-break>なんの用か知らんが、剣は打てないよ。<end>"
english = "Looking for Dergado the swordsmith? That's him over there, drinking himself senseless. Don't know what you want with him, but he can't forge swords.<end>"

["920002"]
japanese = "もう、あのザマじゃあな。<end>"
english = "Not anymore. Not in the state he's in.<end>"

["920003"]
japanese = "ほれ、あそこ見てみな。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>あれがデルガドだ。<line-break>\u3000<line-break>昔は当代一の刀工とたたえられた男が、<line-break>何があったのかは知らないが、<line-break>今はただのへそまがりな酔っぱらいさ。<end>"
english = "See that man over there? That's Dergado. He was once hailed as the finest swordsmith of his day. I don't know what happened to him, but now he's just a cantankerous drunk.<end>"

["920004"]
japanese = "やっかいな客で迷惑してるんだ。<line-break>ま、気をつけて、あいつと<line-break>面倒は起こさないようにしてくれ。\u3000\u3000<line-break>特に刀とか鍛冶とかの話はご法度だぜ。<line-break>前にその手の話をした時は、店の中を<line-break>めちゃくちゃにされたからな。<end>"
english = "He's a troublesome customer and nothing but a nuisance. So watch yourself, and try not to get into any trouble with him. Above all, don't mention swords or smithing. The last time that subject came up, he wrecked the place.<end>"

["920005"]
japanese = "いらっしゃい。<line-break>今日は珍しくデルガド爺さんが<line-break>来てないから、ゆっくりできるぜ。<end>"
english = "Welcome. Old Dergado isn't here today for once, so you can take it easy.<end>"

["920006"]
japanese = "デルガド師匠に用かい？<line-break>たぶん、酒場で飲んだくれてんだろ？\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>自分の名を銘に入れた剣デルガドが<line-break>ネメアに折られちまってから<line-break>剣が打てねえって、あの調子だよ。<end>"
english = "Looking for Master Dergado? He's probably at the tavern drinking himself senseless. Ever since Nemea broke Dergado―the sword bearing his own name―he's been like this, saying he can't forge another sword.<end>"

["920007"]
japanese = "当代随一の刀工なんて持ち上げられて、\u3000\u3000\u3000<line-break>それが、いまや、ただの酔っぱらいさ。<line-break>天才は、逆境に弱いからねえ。<line-break>酒場にいなきゃ、どっか、ふらついてるのさ。<line-break>帰ってくるまで、結構かかるから<line-break>出直して来た方がいいよ。<end>"
english = "He was once hailed as the finest swordsmith of the age, and now he's nothing but a drunk. Geniuses don't handle adversity well. If he isn't at the tavern, he's probably wandering around somewhere. It'll be a while before he gets back, so you'd better come back later.<end>"

["920008"]
japanese = "ま、剣を打ってくれっつっても、<line-break>あれじゃ、無理だろうけどねえ。<line-break>え？\u3000師匠に用があったんじゃないの？\u3000\u3000\u3000<end>"
english = "Though even if you asked him to forge a sword, I doubt he could in that state. Huh? You didn't come to see Master Dergado?<end>"

["920009"]
japanese = "ふむ、わしがデルガドじゃ。<line-break>若いの、デルガドを知っとるか？<end>"
english = "Hmm. I'm Dergado. Tell me, youngster―have you heard of Dergado?<end>"

["920010"]
japanese = "当代一とたたえられた刀工<end>"
english = "A swordsmith hailed as the finest of the age<end>"

["920011"]
japanese = "ただの酔っぱらい<end>"
english = "Just a drunk<end>"

["920012"]
japanese = "ロセンの略奪の時、老人子供を虐殺した剣<end>"
english = "The sword that slaughtered the elderly and children during the sack of Rocen<end>"

["920013"]
japanese = "ハッ！\u3000当代一の刀工じゃと？<line-break>当代一の刀工はこんな風に話すのか？<line-break>こんな風に酒浸りの毎日を送るのか？<line-break>では、わしはいったい誰なんじゃ？<end>"
english = "Hah! The finest swordsmith of this age, you say? Would the finest swordsmith of this age talk like this? Would he spend every day drowning himself in drink? Then who in blazes am I?<end>"

["920014"]
japanese = "デルガドの影だよ。<end>"
english = "Dergado's shadow.<end>"

["920015"]
