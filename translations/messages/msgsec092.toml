english = "For me, forging swords was my work, my livelihood, and more than that, my faith. A sword so mighty it could cleave heaven and earth... Every sword I've forged until now was but another step toward that goal.<end>"

["920079"]
japanese = "しかし、わしの剣たちが\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>人々の血を吸うのを見るうちに<line-break>わしにはわからなくなってしもうた。<line-break>剣はしょせん、人殺しの道具なのか？<line-break>強き力は、人を傷つけねばならぬのか？<line-break>わしは今も迷い、剣を打てずにいる…。<end>"
english = "But as I watched my swords drink people's blood, I lost sight of what it all meant. Are swords, in the end, nothing more than tools for killing? Must great power be used to hurt others? I am still torn, unable to forge another sword...<end>"

["920080"]
japanese = "つまらん話をしたのう。<line-break>じじいの愚痴じゃ。忘れてくれ。<line-break>さあ、明日も早い。もう寝るとしよう。<end>"
english = "That was a tedious tale. Nothing but an old man's grumbling. Forget it. Come, tomorrow will be another early morning. Let's get some sleep.<end>"

["920081"]
japanese = "炎竜山か…。<line-break>すまぬが、わしは登りとうない。<line-break>\u3000<line-break>この山で鍛冶をしてるはずの<line-break>古い仲間に、今のわしを<line-break>見られるのはつらい……。<end>"
english = "Flame Dragon Mountain... Forgive me, but I don't want to climb it. An old comrade of mine should be smithing here, and I couldn't bear to be seen as I am now...<end>"

["920082"]
japanese = "すまぬ。わしにはどうしても\u3000\u3000\u3000<line-break>この先へ進むことができん。<line-break>お主らだけで行ってくれ。<line-break>また、わしで力になれるなら<line-break>すまんがもう一度呼び出してくれ。<end>"
english = "I'm sorry. I simply cannot go any farther. Go on without me. If I can be of help again, forgive me, but call me back.<end>"

["920083"]
japanese = "おお、<value:$28>か。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>……不思議なもんじゃ。お主と旅に出る<line-break>前から、ずっと同じ酒を飲んでるはず<line-break>なのに、味が全然違うんじゃ。<end>"
english = "Ah, <value:$28>. Strange, isn't it? I've been drinking the same stuff since before we set out together, yet now it tastes completely different.<end>"

["920084"]
japanese = "なんというか、わし自身の気力が<line-break>味わいとなっているというか……。<line-break>こんなうまい酒は何年ぶりじゃろう…。<line-break>…なあ<value:$28>、わしは<line-break>やはり、最高の剣を打ってみたい。<line-break>最高の剣の、その意味を知るためにも。<end>"
english = "Somehow, it's as if my own vigor has become part of the flavor... How many years has it been since I've had a drink this good? You know, <value:$28>, I still want to forge the finest sword there is. Partly so I can learn what that truly means.<end>"

["920085"]
japanese = "そこで、炎竜山に向かいたいのじゃ。<line-break>あの山頂は天然の炉になっとるでの。<line-break>最高の剣を打つにふさわしい。<line-break>それに、あの山には、わしの<line-break>古い鍛冶仲間、カッツがおる。<line-break>奴もきっと力を貸してくれるだろう。<end>"
english = "That's why I want to go to Flame Dragon Mountain. The summit is a natural furnace, just the place to forge the finest sword. Besides, an old smithing associate of mine, Katz, is up there. I'm sure he'll lend a hand.<end>"

["920086"]
japanese = "では、炎竜山へ出発じゃ。<line-break>町を出る時に落ちあおうぞ。<end>"
english = "Then it's settled. We leave for Flame Dragon Mountain. We'll meet when we leave town.<end>"

["920087"]
japanese = "これは…\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>カッツと、ロッチナの家か…？<line-break>\u3000<line-break>だいぶほこりをかぶっとるが…。<line-break>おおかた山頂にでもいるのじゃろう。<line-break>よし、行くかの。<end>"
english = "Is this... Katz and Rotchina's house? It's thick with dust. I expect they're up at the summit. Well, shall we go?<end>"

["920088"]
japanese = "カッツ…。<line-break>ロッチナ…。<line-break>\u3000<end>"
english = "Katz... Rotchina...<end>"

["920089"]
japanese = "すまなんだ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>しかし、我が子を失う親というのは<line-break>こんな気分なのじゃろうな…。<line-break>……行くかの。<line-break>生きているわしらには、まだこれから<line-break>なすべきことがあるしの。<end>"
english = "I'm sorry. But I suppose this is how it feels for a parent to lose a child... Let's go. We who are still alive have things left to do.<end>"

["920090"]
japanese = "ん？\u3000なんじゃ。<line-break>墓のようじゃが…。<line-break>ここにささっているのは…剣か？<end>"
english = "Hm? What's this? It looks like a grave... Is that a sword planted there?<end>"

["920091"]
japanese = "こ、これは…。\u3000\u3000\u3000\u3000\u3000<line-break>この剣は…。<line-break>\u3000<line-break>なんと…いうことじゃ…。<end>"
english = "Th-this is... This sword... How can this be...?<end>"

["920092"]
japanese = "わしには昔、娘がおってな。<line-break>戦火で親を失った人間の少女じゃ。\u3000<line-break>名をロッチナという。<line-break>ドワーフ王国で育て、ドワーフの男も<line-break>顔負けの鍛冶の腕も身につけた。<line-break>わしの、宝じゃった。<end>"
english = "Long ago, I had a daughter. A human girl who had lost her parents in the war. Her name was Rotchina. I raised her in the Dwarf Kingdom, where she became a smith skilled enough to put any dwarf man to shame. She was my treasure.<end>"

["920093"]
japanese = "やがて、カッツと出会い、<line-break>ふたりで最強の剣を打つと言って<line-break>この地に移り住んだのじゃ。<end>"
english = "In time, she met Katz. They said they would forge the mightiest sword together, and moved here.<end>"

["920094"]
japanese = "その時、わしが祝いに打ったのが<line-break>この剣じゃ。しかし、この剣が<line-break>墓に供えられているということは…。<line-break>ふたりは…。<line-break>あの、希望に満ちていたふたりは…。<end>"
english = "I forged this sword as a gift to mark the occasion. But if it has been laid here at a grave... Then the two of them... Those two, so full of hope...<end>"

["920095"]
japanese = "…！<line-break>これは…。<end>"
english = "What...! This is...<end>"

["920096"]
japanese = "折れた宝剣を入手した。<end>"
english = "Obtained the Broken Precious Sword.<end>"

["920097"]
japanese = "それは、折れてはいるが、<line-break>間違いなくカッツの剣じゃ。<line-break>しかも、かなりのできのな。<line-break>おそらくは、この山の山頂で<line-break>打った剣じゃろう。しかし、<line-break>何ゆえに折れたのか…。<end>"
english = "Broken though it is, that is unmistakably Katz's sword. And it is a fine piece of work. It was probably forged at the summit of this mountain. But why did it break...?<end>"

["920098"]
japanese = "<value:$28>、すまんが<line-break>今日は山を下りんか？<line-break>今のわしでは、最高の剣なぞ打てまい。<end>"
english = "Sorry, <value:$28>, but could we head back down the mountain for today? I'm in no state to forge the finest sword.<end>"

["920099"]
japanese = "すまん。<end>"
english = "I'm sorry.<end>"

["920100"]
japanese = "カッツ、ロッチナ。<line-break>お前たちの夢、このわしが<line-break>引き継がせてもらうぞ。<end>"
english = "Katz. Rotchina. I shall carry on your dream.<end>"

["920101"]
japanese = "わぁ、珍しい剣だね。<line-break>折れてるけど…ね、見せてよ。<end>"
english = "Oh, what an unusual sword. It's broken, but... let me see it.<end>"

["920102"]
japanese = "最近の作だけど、この作り方は、<line-break>古代の方式にのっとっているね。<line-break>…緋炎の宝剣を作ろうとしたのかな？<line-break>炎竜山の炎で鍛えた剣は<line-break>緋色に燃え、<line-break>神をも斬り裂く宝剣となる…。<end>"
english = "It was made recently, but it follows an ancient method. I wonder if someone was trying to forge the Crimson Flame Sword. A sword forged in the fires of Flame Dragon Mountain shall burn crimson, becoming a treasured blade that can cleave even a god...<end>"

["920103"]
japanese = "これが緋炎の宝剣の伝承さ。<line-break>神代、破壊神ウルグと<line-break>戦神ソリアスの戦いのときに、<line-break>ソリアスを助けようと、人間が<line-break>作って渡そうとした宝剣なんだって。<line-break>ありがと。<end>"
english = "That's the legend of the Crimson Flame Sword. During the battle between Urg, God of Destruction, and the War God Solias in the Age of the Gods, humans are said to have tried to forge the sword and deliver it to Solias, hoping to aid the War God. Thanks.<end>"

["920104"]
japanese = "珍しいものが見られたよ。<line-break>じゃ、今日はこれで！<end>"
english = "That was quite a rare sight. Well, that's all for today!<end>"

["920105"]
japanese = "ほぉ、珍しい剣をもっておるな。<line-break>見せてみよ。<end>"
english = "Oh? That is an unusual sword you have there. Let me see it.<end>"

["920106"]
japanese = "最近の作じゃが、古代の製法じゃな。<line-break>…もしや…緋炎の宝剣か？<line-break>\u3000<line-break>炎竜山の炎で鍛えた剣は<line-break>緋色に燃え、<line-break>神をも斬り裂く宝剣となる…。<end>"
english = "Recent work, but the forging method is ancient. Could this be... the Crimson Flame Sword? A sword forged in the fires of Flame Dragon Mountain shall burn crimson, becoming a treasured blade that can cleave even a god...<end>"

["920107"]
japanese = "これが緋炎の宝剣の伝承じゃ。<line-break>神代、破壊神ウルグと<line-break>戦神ソリアスの戦いのときに、<line-break>ソリアスを助けようと、人間が<line-break>作って渡そうとした宝剣なのじゃ。<line-break>…無論、渡せはせなんだがな。<end>"
english = "That is the legend of the Crimson Flame Sword. During the battle between Urg, God of Destruction, and the War God Solias in the Age of the Gods, humans tried to forge the sword and deliver it to Solias, hoping to aid the War God. Of course, it was never presented.<end>"

["920108"]
japanese = "ウルグ様を恐れ、消したいという<line-break>人間の願いが生み出した伝承かと<line-break>思うておったが、案外古い伝承でな。<line-break>信憑性も実は高い。<line-break>じゃが、これを打つには心技体が<line-break>そろわねばならぬ。<end>"
english = "I had thought the legend was born of humanity's fear of Lord Urg and its wish to destroy the god. But it turns out to be surprisingly old, and in fact quite credible. Still, to forge this blade, body, skill, and heart must all be present.<end>"

["920109"]
japanese = "最高の炎の精霊力を宿した身体、\u3000\u3000<line-break>器用さとしての技術力…そして、<line-break>最後に、心というのがくせ者でな。<line-break>神代の人間はこの宝剣を打とうとして<line-break>誰ひとり、その心がなくて<line-break>打てなんだという。<end>"
english = "A body imbued with fire-spirit power of the highest order, technical skill expressed through dexterity... and finally, the difficult part: the heart. It is said that none of the humans who tried to forge this treasured sword in the Age of the Gods possessed that heart, and so none succeeded.<end>"

["920110"]
japanese = "これを打った者も、失敗しておったな。<line-break>ま、人間の打ったものが、神を斬れる<line-break>わけがないということじゃな。<end>"
english = "The one who forged this failed as well. Well, I suppose that means no blade forged by human hands can cut a god.<end>"

["920111"]
japanese = "あら、珍しい剣ね。<line-break>折れてるみたいだけど。<line-break>見ていい？<end>"
english = "My, what an unusual sword. It seems to be broken, though. May I see it?<end>"

["920112"]
japanese = "最近の作だけど、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>古い製法を使ってるわね。<line-break>…もしかして、緋炎の宝剣？<line-break>炎竜山の炎で鍛えた剣は<line-break>緋色に燃え、<line-break>神をも斬り裂く宝剣となる…。<end>"
english = "It was made recently, but it uses an old forging method. Could it be the Crimson Flame Sword? A sword forged in the fires of Flame Dragon Mountain shall burn crimson, becoming a treasured blade that can cleave even a god...<end>"

["920113"]
japanese = "これが緋炎の宝剣の伝承。\u3000\u3000\u3000<line-break>神代、破壊神ウルグと<line-break>戦神ソリアスの戦いのときに、<line-break>ソリアスを助けようと、人間が<line-break>作って渡そうとした宝剣なのよ。<line-break>\u3000<end>"
english = "That is the legend of the Crimson Flame Sword. During the battle between Urg, God of Destruction, and the War God Solias in the Age of the Gods, humans tried to forge the sword and deliver it to Solias, hoping to aid the War God.<end>"

["920114"]
japanese = "ありがとう。<line-break>珍しいものが見られたわ。<line-break>それじゃ、失礼するわね。<end>"
english = "Thank you. I got to see something quite rare. Now, if you'll excuse me.<end>"

["920115"]
japanese = "やあ、<value:$28>。<line-break>さすが、ドワーフ王国の酒場だね。<line-break>もんのすごーくお酒がおいしいよ。<end>"
english = "Hey, <value:$28>. Just what you'd expect from a tavern in the Dwarf Kingdom. The booze is sooo good!<end>"

["920116"]
japanese = "いたたたたた…。<line-break>まったく、ひどい目にあったよ。\u3000\u3000<line-break>\u3000<line-break>名工デルガドがいるってんで<line-break>刀を打ってくれって頼みに行ったら\u3000<line-break>いきなりゴツン！\u3000だよ。あー痛て。<end>"
english = "Ow, ow, ow, ow... Honestly, that was awful. I heard the master smith Dergado was here, so I went to ask him to forge me a sword. Then, out of nowhere, wham! Ow, that hurts.<end>"

