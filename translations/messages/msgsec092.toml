english = "Shut up, you Lilbie! I wasn't talking to the likes of you. Go sing something, like a Lilbie should!<end>"

["920016"]
japanese = "リルビーじゃないよ。<line-break>レルラ＝ロントンって名前が\u3000\u3000\u3000<line-break>あるんだから。\u3000<line-break>自分は名前だけで決めてかかられて<line-break>怒ってるくせに、僕のことは<line-break>種族だけで決めてかかるの？<end>"
