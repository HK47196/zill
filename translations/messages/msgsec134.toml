["1340181"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000バカな…！<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000竜である我が<line-break>\u3000\u3000\u3000人の子ごときに敗れようとは…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000…終わらぬぞ…。<line-break>\u3000\u3000\u3000\u3000これしきでは…終わらぬぞオオオオ！<line-break>\u3000\u3000\u3000\u3000\u3000ゴオオオオオオオオオオオ！！！<end>"
