english = "<if><value:$01><equal>2A dead end...<end><if><value:$01><equal>3Looks like this is as far as the tunnel goes.<end><if><value:$01><equal>4Looks like a dead end. I wonder what would happen if someone jumped down from here?<end><if><value:$01><equal>5Hey, looks like a cliff. Don't push me, <value:$28>. Falling from a cliff like this would mean a lot worse than getting hurt.<end><if><value:$01><equal>6We've come all the way to a dead end. But this oppressive air...<end><if><value:$01><equal>7The deepest part...<end><if><value:$01><equal>8It seems a little early to relax.<end><if><value:$01><equal>9Well, looks like this is the end of the line.<end><if><value:$01><equal>12Looks like we've reached the deepest point... but I wouldn't relax just yet.<end><if><value:$01><equal>13...Wait. It looks like it's too soon to relax.<end><if><value:$01><equal>10Hey, lady, don't push me! ...Huh.<end><if><value:$01><equal>14Hmm. This appears to be the deepest part. Still, what is that murmuring from the ore...?<end><if><value:$01><equal>15Hey, it looks like this is as far as it goes. If there's nothing here, let's head back...<end><if><value:$01><equal>17What? You make me walk until I'm exhausted, and all that's here is a dead end! How are you going to make this up to me...?<end><if><value:$01><equal>19Looks like a dead end, doesn't it? But...<end><if><value:$01><equal>20...Wait.<end><if><value:$01><equal>21It seems to end here, but something isn't right...<end><if><value:$01><equal>26It seems we've come as far as we can. And yet...<end><if><value:$01><equal>11This seems to be the deepest part. But... wait!<end><if><value:$01><equal>23...Wait. It's too soon to relax.<end><if><value:$01><equal>27A dead end... but it's too soon to relax.<end><if><value:$01><equal>24It's a dead end...<end><if><value:$01><equal>25A dead end...<end><if><value:$01><equal>192A dead end... I sense something.<end><if><value:$01><equal>193It's a dead end, but there's nothing here.<end><if><value:$01><equal>194A dead end. ...No, this presence...<end><if><value:$01><equal>191It looks like this is the deepest part... But...<end><if><value:$01><equal>190A dead end. But this oppressive air...<end>It looks like the cave ends here, but...<end>"

