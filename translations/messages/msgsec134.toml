["1340229"]
japanese = "それも、その通り。<line-break>だけど、いったい…？<end>"
english = "That's true too. But what exactly are you getting at?<end>"

["1340230"]
japanese = "闇の神器…先文明の、究極の魔道器。<line-break>あなたは、ある程度までだが、その力を<line-break>抽出することにも成功している。<line-break>そして、あなたはその力を、<line-break>愚かな人間どもに与えようとしている。<line-break>それをやめていただきたいのです。<end>"
english = "The dark divine artifact―the ultimate magical device of the former civilization. You have even managed, to some extent, to extract its power. And now you intend to give that power to those foolish humans. I must ask you to stop.<end>"

["1340231"]
japanese = "どうして？<line-break>それが僕の目的なのに？<end>"
english = "Why? That's the whole purpose of my work.<end>"

["1340232"]
japanese = "ある偉大なお方の意志なのです。<line-break>愚かで邪悪な人間に<line-break>高度な魔法文明を与えることは、<line-break>ゴブリンに魔剣を与えるよりも<line-break>始末が悪い。<line-break>世界の滅びに直結してしまう。<end>"
english = "It is the will of a great personage. Giving advanced magical civilization to foolish, wicked humans would be worse than giving a magic sword to a Goblin. It would lead directly to the destruction of the world.<end>"

["1340233"]
japanese = "人間は文明を得ることで賢くなるよ！<line-break>いずれ、かつてのような<line-break>満ちたりし時がやって来るんだ！<end>"
english = "Civilization will make humanity wiser! One day, an age of fulfillment will return, just as it did before!<end>"

["1340234"]
