english = "<if><value:$01><equal>3Hey, are you sure we can leave Xenetes behind?<end><if><value:$01><equal>4Yeah, maybe running away is the right choice! Even if we tried to save Lord Xenetes, we'd never make it in time now. This might be much better than arriving too late and watching him get killed right in front of us. Right?<end><if><value:$01><equal>5I don't like running away, but who cares about some Rostorl noble? Still don't like running, though!<end><if><value:$01><equal>6This is wrong! Let's go save Xenetes, <value:$28>!<end><if><value:$01><equal>13You're running away?<end><if><value:$01><equal>10Sis! Aren't you going to save Xenetes?!<end><if><value:$01><equal>14Hold it! Are you truly going to leave without saving Xenetes?<end><if><value:$01><equal>15Hey, we have to go save Xenetes.<end><if><value:$01><equal>17Are you really going to leave Xenetes? N-not that I care what happens to that lowly creature! And whether you regret it and get hurt has absolutely nothing to do with me! That's right! I simply don't like running away!<end><if><value:$01><equal>19Xenetes is going to die! Are you really all right with that, <value:$28>?!<end><if><value:$01><equal>20Is that truly your wish?<end><if><value:$01><equal>26Are you certain we need not save the gentleman called Xenetes?<end><if><value:$01><equal>11So Xenetes can't be saved after all. It's sad, but perhaps that's simply the reality of it.<end><if><value:$01><equal>27Are you sure we shouldn't go save Xenetes?<end><if><value:$01><equal>192Are you sure we can leave Xenetes behind?<end><if><value:$01><equal>193W-wait! If we don't save Xenetes, he'll be executed!<end><if><value:$01><equal>194You're running away?<end><if><value:$01><equal>191Wait! It won't be too late to flee after we've saved Xenetes.<end><if><value:$01><equal>190You're going to run... and abandon him?<end>Heeey, we still haven't saved Xenetes! Let's go to the audience chamber!<end>"

