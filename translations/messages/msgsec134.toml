japanese = "<if><value:$01><equal>2そうね。<line-break>実際に見て、確かめなくちゃ。<line-break>オッシ先生もそう教えてくれたんだし。<line-break>何だか、１人だけ様子がおかしいのが<line-break>いたのも気になるわね。<line-break>行きましょ、<value:$28>。<end><if><value:$01><equal>3そうじゃな、どうも気になる。<line-break>少し近隣を当たってみるとするかの…。<end><if><value:$01><equal>6うん、行ってみよう。<line-break>すっごく気になるしさ。<end><if><value:$01><equal>13…やめておけ。お前程度のひよっこが<line-break>首を突っ込むべきことではない。<line-break><line-break>…と言っても、<line-break>行く気なのだろう？<line-break>死んでからでは後悔もできんぞ。<end><if><value:$01><equal>15そうだね。<line-break>行ってみよう。<end><if><value:$01><equal>14そうじゃな、どうも気になる。<line-break>少し近隣を当たってみるとするか…。<end><if><value:$01><equal>19そうだね、気になるよねぇ。<line-break>行ってみよ？<end><if><value:$01><equal>10そうだね、姉ちゃん。<line-break>行ってみよう。<end><if><value:$01><equal>4この危険そうな奴らの正体を\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>探ってみるって…<line-break>どうしよっかな…。<line-break>ついていこうっと！\u3000でもでも<line-break>こんな危険に飛び込もうとするなんて、<line-break>ちょっと、おバカさんかも！\u3000きゃっ！<end><if><value:$01><equal>5はやってるのかな？<line-break><line-break><line-break>よーし、行こうぜ！<line-break>とめたって俺ひとりでも<line-break>行くつもりだしな！<end><if><value:$01><equal>17天空神ノトゥーンの紋章に似てる？<line-break>…ちゃ、ちゃんと知っててよ！<line-break>ア、アタクシが言いたいのはぁ、別！<line-break>そ、そうよ、アタクシはあいつらの正体を<line-break>突き止めないとって言いたかったの！<line-break>さっさと急いで出発するのよぉ！<end><if><value:$01><equal>193そうですね、気になりますね。<line-break>少し怖いけど行ってみましょう！<end><if><value:$01><equal>191そうね、危険な感じがするけど、<line-break>気になるわね。<line-break>行きましょ。<end>何者かつきとめる？<line-break>こういうのに関わるのってさ、<line-break>か～な～り、危険なんだよ？<line-break>だーかーら、危険だからこそ<line-break>行く価値があるんじゃない。<line-break>それじゃ、捜索、かいし～！<end>"
english = "<if><value:$01><equal>2Yes. We need to see for ourselves and find out. That's what Professor Ossi taught us, after all. And I'm curious about the one who seemed to be acting strangely. Let's go, <value:$28>.<end><if><value:$01><equal>3Yes, it is troubling. Let us search the surrounding area...<end><if><value:$01><equal>6Yeah, let's go. I'm dying to know what this is about.<end><if><value:$01><equal>13Stay out of it. This is no business for a greenhorn like you. Though I suppose you mean to go anyway. Once you're dead, it'll be too late for regrets.<end><if><value:$01><equal>15All right. Let's go take a look.<end><if><value:$01><equal>14Yes, it is troubling. Let us search the surrounding area...<end><if><value:$01><equal>19Yeah, you want to know too, don't you? Shall we go?<end><if><value:$01><equal>10Yeah, Sis. Let's go take a look.<end><if><value:$01><equal>4Investigate who those dangerous-looking people really are...? What should I do...? Oh, I'll come along! But plunging straight into danger like this might make you a bit of a fool! Eek!<end><if><value:$01><equal>5Is this the latest craze or something? All right, let's go! Even if you try to stop me, I'm going alone!<end><if><value:$01><equal>17It resembles the emblem of Notun, the Sky God? Y-you ought to know that already! Th-that's not what I was trying to say! I meant that we must uncover who those people really are! Now hurry up and get moving!<end><if><value:$01><equal>193Yes, I am curious. It's a little frightening, but let's go!<end><if><value:$01><equal>191It feels dangerous, but I want to know more. Let's go.<end>Find out who they are? Getting involved in something like this is ve-ry dangerous, you know? And that's exactly why it's worth doing! All right, let the search begin!<end>"

