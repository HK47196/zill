["1340000"]
japanese = "ジラーク用メッセージ開始<end>"
english = ""

["1340001"]
japanese = "いたぞ。<line-break>おい、あいつだ。<end>"
english = "There! That's the one.<end>"

["1340002"]
japanese = "<value:$28>だな。<line-break>ジラーク将軍がお呼びだ。<line-break>我々と来てもらおう。<end>"
english = "You're <value:$28>, correct? General Zsilak has summoned you. You will come with us.<end>"

["1340003"]
japanese = "ジラーク将軍、<line-break><value:$28>を<line-break>連れてまいりましたっ！<end>"
english = "General Zsilak! I've brought <value:$28>, sir!<end>"

["1340004"]
japanese = "ご苦労。<line-break>さがってくれ。<end>"
english = "Good work. You may go.<end>"

["1340005"]
japanese = "はっ！<end>"
english = "Sir!<end>"

["1340006"]
japanese = "<value:$28>君。<line-break>君のすばらしい活躍ぶりは<line-break>アキュリュースの者から聞いているよ。<line-break>そこで相談なのだが、<line-break>今度は私の下で、その力を<line-break>発揮してはくれないかね？<end>"
english = "<value:$28>, I've heard from the people of Aqyurius about your remarkable exploits. So I have a proposition for you: would you consider putting your talents to use under my command?<end>"

["1340007"]
japanese = "我々とアキュリュースは、<line-break>もはや敵対関係ではない。<line-break>悪い話ではないと思うのだがね。<end>"
english = "Aqyurius is no longer our enemy. I don't think it's a bad offer.<end>"

["1340008"]
japanese = "<value:$28>君、<line-break>君は実に有能な戦士だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>一度刃を交えたからこそ、<line-break>その実力をよく理解しているつもりだ。<line-break>今後は私の下で働いてくれないかね？<end>"
english = "<value:$28>, you are an exceptionally capable warrior. Having crossed blades with you myself, I believe I know your skill well. Would you consider serving under my command from now on?<end>"

["1340009"]
japanese = "ネメア様の崇高な思想を<line-break>大陸すべてに広めるためには<line-break>君のような勇者が必要なのだよ。<end>"
english = "If we are to spread Lord Nemea's noble ideals across the entire continent, we need a hero like you.<end>"

["1340010"]
japanese = "君が<value:$28>君か。<line-break>噂は聞いているよ。<line-break>かなり腕のたつ冒険者だそうだね。<line-break>突然このような形で招いた非礼は<line-break>許してくれたまえ。<line-break>あまり時間がないものでね。<end>"
english = "So you are <value:$28>. I've heard about you. By all accounts, you're a remarkably skilled adventurer. Forgive me for summoning you so abruptly, but time is short.<end>"

["1340011"]
japanese = "単刀直入に言おう。<line-break>我々と共に戦ってはくれないかね？<line-break>君のような勇者が必要なのだよ。<end>"
english = "I will come straight to the point. Will you fight alongside us? We need a hero like you.<end>"

["1340012"]
japanese = "<value:$28>、<line-break>アルノートゥン攻略に<line-break>君の力を貸して欲しい。<end>"
english = "<value:$28>, I want your help in the campaign against Alnortun.<end>"

["1340013"]
japanese = "いいでしょう<end>"
english = "All right.<end>"

["1340014"]
japanese = "お断りします<end>"
english = "I must decline.<end>"

["1340015"]
japanese = "その答えを期待していたよ。<line-break>では、今後君と君の仲間には<line-break>私の直属兵として働いてもらおう。\u3000<line-break>任務は特殊なものを与えるつもりだ。<line-break>そのかわり、普段は冒険者として、<line-break>今まで通りにしてくれてかまわんよ。<end>"
english = "That is the answer I was hoping for. From now on, you and your companions will serve under my direct command. I intend to entrust you with special assignments. In return, you may carry on as adventurers as you always have when not on duty.<end>"

["1340016"]
japanese = "この陣に来たい時は<line-break>アキュリュースの船着き場にいる<line-break>我が軍の騎士に声をかけたまえ。<end>"
english = "Whenever you wish to come to this encampment, speak to one of my knights at Aqyurius Wharf.<end>"

["1340017"]
japanese = "それは残念だ。<line-break>突然すまなかった。<line-break>さがってくれたまえ。<end>"
english = "That is regrettable. Forgive me for summoning you so abruptly. You may go.<end>"

["1340018"]
japanese = "では、よろしく頼むよ<line-break><value:$28>君。<end>"
english = "Then I'm counting on you, <value:$28>.<end>"

["1340019"]
japanese = "ああ、帰り道かね？<line-break>心配無用だ。我が軍の者に<line-break>アキュリュースまで送らせよう。<line-break>外にいる騎士に声をかけたまえ。<end>"
english = "Ah, wondering how you will get back? No need to worry. I shall have one of my soldiers escort you to Aqyurius. Speak to the knight outside.<end>"

["1340020"]
japanese = "ああ、ちょっと待ちたまえ。\u3000<line-break>ひとつ言い忘れていた。<line-break>\u3000<line-break>単独行動をしている間、<line-break>アルノートゥンに対する<line-break>一切の破壊、略奪行動は禁止する。<end>"
english = "Ah, wait a moment. There was one thing I neglected to mention. While you are acting independently, all acts of destruction or pillage against Alnortun are forbidden.<end>"

["1340021"]
japanese = "君は特例的存在なのでね。<line-break>他の者たちの不満を買うわけには<line-break>いかないのだ。よろしく頼んだよ。<end>"
english = "You are an exceptional case, you see. I cannot afford to provoke resentment among the others. I trust you will comply.<end>"

["1340022"]
japanese = "<value:$28>様ですね。<line-break>お話はお伺いしています。<line-break>では、まいりましょう。<end>"
english = "You must be <value:$28>. I've heard about you. Shall we go?<end>"

["1340023"]
japanese = "さあ、モイ、ソイ、<line-break>お前たちの出番だ。<line-break>しっかり走ってくれよ。<end>"
english = "All right, Moi, Soi. It's your turn. Run with all you've got.<end>"

["1340024"]
japanese = "あ、<value:$28>様！<line-break>お送りします。<line-break>待ってください～。<end>"
english = "Ah, <value:$28>! I'll escort you. Wait for me!<end>"

["1340025"]
japanese = "\u3000\u3000\u3000\u3000西方攻略をその任とし、<line-break>近々アルノートゥン侵攻を計画していた<line-break>\u3000ディンガル軍の白虎将軍ジラークが<line-break>\u3000\u3000\u3000\u3000突然、その姿を消した。<line-break>\u3000\u3000アルノートゥン攻略の目的の<line-break>\u3000ひとつである、聖光石の鉱山へと<line-break>\u3000\u3000\u3000\u3000視察に向かったきり、<line-break>\u3000\u3000\u3000連絡が途絶えたのである。<end>"
english = "White Tiger General Zsilak of the Dingal Army, tasked with conquering the west and planning an imminent invasion of Alnortun, suddenly vanished. He had gone to inspect the Holy Light Stone mine, one of the campaign's objectives, and all contact with him was lost.<end>"

["1340026"]
japanese = "\u3000幾度となく派遣された捜索隊も帰ってこず、<line-break>\u3000\u3000白虎軍の士気は下がる一方であった。<line-break>\u3000\u3000そしてついに、ディンガル本国より<line-break>\u3000\u3000全軍の本国への一時撤退が通達された。<end>"
english = "The search parties sent out time and again also failed to return, and the White Tiger Army's morale continued to decline. At last, orders came from Dingal for the entire army to withdraw home temporarily.<end>"

["1340027"]
japanese = "このジラークの失踪は、大いなる闇の力の復活に<line-break>\u3000深く関与していたのだが、それを知るものは<line-break>\u3000\u3000\u3000当事者以外にはほとんどいなかった。<line-break>\u3000\u3000ただひとり、猫屋敷の賢者を除いては…。\u3000<line-break>\u3000\u3000時代は、人々の望む望まざるに関わらず<line-break>\u3000\u3000\u3000着実に、混沌へと向かっていた…。<line-break>\u3000<end>"
english = "Zsilak's disappearance was deeply connected to the revival of a great dark power, though almost no one beyond those directly involved knew the truth―save the sage of Cat Manor. Whether people wished it or not, the age was steadily moving toward chaos...<end>"

["1340028"]
japanese = "あなたは…<line-break>無限のソウルを持つ者ですね…。<line-break>\u3000<line-break>お願いです。<line-break>どうぞお助けください。<line-break>あなたの力が必要なのです。<end>"
english = "You are... the Bearer of the Infinite Soul, aren't you...? Please, help me. I need your power.<end>"

["1340029"]
japanese = "私は…、この場所に<line-break>捕らわれているのです。\u3000\u3000\u3000<line-break>もうずっと長い間…。<line-break>どうぞ、力をお貸しください。<line-break>無限のソウルの力が<line-break>必要なのです。<end>"
english = "I am... trapped in this place. It has been so very long... Please, lend me your strength. I need the power of the Infinite Soul.<end>"

["1340030"]
japanese = "力を貸す<end>"
english = "Lend her your strength<end>"

["1340031"]
japanese = "それはできない<end>"
english = "I cannot<end>"

["1340032"]
japanese = "ありがとう…。<end>"
english = "Thank you...<end>"

["1340033"]
japanese = "さぁ、私に手を…。<end>"
english = "Now, give me your hand...<end>"

["1340034"]
japanese = "愚かな…。<line-break>うぬに力与えしは、<line-break>何者と思うておる？<end>"
english = "Fool... Who do you think granted you that power?<end>"

["1340035"]
japanese = "\u3000\u3000\u3000\u3000我は不死にして力あるもの…。\u3000<line-break>\u3000\u3000\u3000\u3000我こそは邪竜イシュバアル…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000破壊神により創られ<line-break>\u3000\u3000\u3000この世に破壊をもたらす者なり…。<end>"
english = "I am immortal and mighty... I am Ishbaal, the Evil Dragon... Created by the God of Destruction, I bring destruction to this world...<end>"

["1340036"]
japanese = "\u3000\u3000\u3000\u3000\u3000 無限のソウルを持つ者よ…\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000 よくぞ我を復活させた…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000 その礼ぞ…<line-break>\u3000\u3000\u3000\u3000うぬにも破滅をくれてやろう…！<end>"
english = "Bearer of the Infinite Soul... You have done well to revive me. In thanks... I shall bring ruin upon you as well...!<end>"

["1340037"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000 バカな…！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000竜である我が<line-break>\u3000\u3000\u3000\u3000人の子ごときに敗れようとは…。<end>"
english = "Impossible... That I, a dragon, should be defeated by a mere human child...<end>"

["1340038"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000…終わらぬぞ…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000これしきでは…終わらぬぞオオオオ！<line-break>\u3000\u3000\u3000\u3000ゴオオオオオオオオオオオ！！！<end>"
english = "It is not over... This will not end me... It is not over yet! GRAAAAAAAAAAH!!!<end>"

["1340039"]
japanese = "<value:$28>は<line-break>竜殺しの称号を得た。<end>"
english = "<value:$28> earned the title of Dragonslayer.<end>"

["1340040"]
japanese = "…そんな！\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>…いえ、<line-break>あなたが再び訪れる日を<line-break>待つことにします。<end>"
english = "...No! ...No. I shall wait for the day you return.<end>"

["1340041"]
japanese = "あなたしか、<line-break>私を救える人はいないのです。<line-break>どうか、あわれんでください。<end>"
english = "You are the only one who can save me. Please, take pity on me.<end>"

["1340042"]
japanese = "お疲れさまです、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>様！<line-break>\u3000<line-break>ジラーク様の陣中へまいりますか？<end>"
english = "Good to see you, <value:$28>! Would you like me to take you to Lord Zsilak's camp?<end>"

["1340043"]
japanese = "うん、よろしく頼むよ<end>"
english = "Yeah, please.<end>"

["1340044"]
japanese = "ううん、今日はいいや<end>"
english = "No, not today.<end>"

["1340045"]
japanese = "はっ、では、お送りいたします。<line-break>さあ、こちらへ。<end>"
english = "Very well. Allow me to escort you. This way, please.<end>"

["1340046"]
japanese = "そうですか。<line-break>それでは。<end>"
english = "I see. Then, if you'll excuse me.<end>"

["1340047"]
japanese = "来たか、<value:$28>君。<line-break>さっそく仕事だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>聖光石の鉱山の視察だ。<line-break>今回は私も同行させてもらうよ。<line-break>是非、自分の目で見ておきたいのでね。<end>"
english = "There you are, <value:$28>. Let's get straight to work. We're going to inspect the Holy Light Stone mine. I'll be coming along this time. I want to see it for myself.<end>"

["1340048"]
japanese = "では、出発だ。<end>"
english = "Well then, let's be off.<end>"

["1340049"]
japanese = "今回の視察の目的は<line-break>鉱山内の地形の把握と<line-break>聖光石の質の確認だ。<line-break>では、行こう。<end>"
english = "The purpose of this inspection is to familiarize ourselves with the layout of the mine and assess the quality of its Holy Light Stone. Let us proceed.<end>"

["1340050"]
japanese = "どうしたのだね？<line-break>まだ何も見てはいないのだよ？<end>"
english = "What's the matter? We haven't seen anything yet.<end>"

["1340051"]
japanese = "少し気分が悪いので…<end>"
english = "I'm feeling a little unwell...<end>"

["1340052"]
japanese = "いえ、なんでもないです<end>"
english = "No, it's nothing.<end>"

["1340053"]
japanese = "意外とだらしがないのだね。<line-break>仕方ない、日をあらためよう。\u3000\u3000<line-break>\u3000<line-break>君の方の準備が整ったら<line-break>また私の陣まで来てくれたまえ。<line-break>では、さらばだ。<end>"
english = "You're surprisingly feeble. Very well, we'll try again another day. Once you're ready, come back to my camp. Until then, farewell.<end>"

["1340054"]
japanese = "そうか、ならば行こう。<end>"
english = "I see. Then let's go.<end>"

["1340055"]
japanese = "これがすべて聖光石なのか…？<line-break>しかも、とても質が高い…。<line-break>\u3000<line-break>これだけの量があれば<line-break>古代魔道国家並みの魔道軍隊創設も<line-break>夢ではないな…。<end>"
english = "Is all of this Holy Light Stone...? And such high-quality stone at that. With this much, raising a magical army to rival those of the ancient magical nations would be no mere dream.<end>"

["1340056"]
japanese = "この空洞に星のようにまたたく光、<line-break>これがすべて、聖光石なのか…？<line-break>\u3000<line-break>すばらしい。<line-break>なんとすばらしいのだ…。<end>"
english = "That starlike light shimmering throughout this cavern... Is all of it Holy Light Stone? Magnificent. Truly magnificent...<end>"

["1340057"]
japanese = "<value:$28>君、君には<line-break>このすばらしさがわからないのかね？<line-break>\u3000<line-break>これだけの聖光石があると、<line-break>例えば私がこのように<line-break>魔力を解放するとだね…。<end>"
english = "<value:$28>, can't you see how extraordinary this is? With this much Holy Light Stone, if I were to release my magic like so...<end>"

["1340058"]
japanese = "このように大きな共振を<line-break>生み出すことができるわけだよ。<line-break>\u3000<line-break>なるほど、古代神聖王国が<line-break>アルノートゥンを重要視したのも<line-break>これでうなずけるな。<end>"
english = "It produces a resonance of this magnitude. Now I understand why the Ancient Holy Kingdom placed such importance on Alnortun.<end>"

["1340059"]
japanese = "ギー、<line-break>オレノネムリヲサマタゲタノハ<line-break>オマエタチカ？<end>"
english = "GEE... WAS IT YOU WHO DISTURBED MY SLUMBER?<end>"

["1340060"]
japanese = "これは驚いた。<line-break>言葉を話す怪物がいるとは。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>以前帝都でしゃべるゴブリンなどという<line-break>くだらない噂話がはやったようだが、<line-break>なるほど、確かに奇妙なものだな。<end>"
english = "Well, this is a surprise. A monster that can speak. There was some absurd rumor about a talking Goblin making the rounds in the imperial capital, as I recall. It certainly is a curious thing.<end>"

["1340061"]
japanese = "オレヲバカニシタノカ？<line-break>ギー、オマエラコロシテヤル！！<end>"
english = "ARE YOU MOCKING ME? GEE! I'LL KILL YOU ALL!!<end>"

["1340062"]
japanese = "ギ、ギ、ギ…<line-break>アリガトウヨ…<line-break>コレデオレハカイホウサレル…。\u3000<line-break>ハルカムカシ<line-break>いおんずニフウジラレタ<line-break>コノ、イマワシキカラダカラナ…！<end>"
english = "GEE, GEE, GEE... THANK YOU... NOW I CAN BE FREE... FREE OF THIS ACCURSED BODY THAT IONZ SEALED ME IN LONG, LONG AGO...!<end>"

["1340063"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ブフゥ～。<line-break>\u3000\u3000礼を言うぞ。小さく弱き虫ケラどもよ。\u3000\u3000<line-break>\u3000\u3000\u3000\u3000余は破壊神により生み出されし<line-break>\u3000\u3000\u3000\u3000\u3000\u3000邪竜イシュバアルなり。<line-break>\u3000\u3000\u3000\u3000封印などという辱めに耐え忍び<line-break>\u3000\u3000\u3000歴史の影のそのまた闇に潜み続けた<line-break>\u3000\u3000この恨みと怒り、今こそ晴らしてやるぞ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000さあ、まずはうぬらだ。<end>"
english = "Hmph... You have my thanks, you tiny, feeble insects. I am Evil Dragon Ishbaal, created by the God of Destruction. I have endured the humiliation of being sealed away, lurking in darkness beyond even the shadows of history. Now, at last, I shall have my revenge for all these years of hatred and rage. And you shall be the first.<end>"

["1340064"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000グアア……<line-break>\u3000\u3000\u3000まさか、余が力を退けるとは……。\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000しかし、このままでは朽ちぬ。<line-break>\u3000\u3000そこの老いぼれ、うぬの体をいただくぞ。\u3000<line-break>\u3000\u3000\u3000\u3000うぬと、その角が持つ魔の力、<line-break>\u3000\u3000\u3000\u3000\u3000余の糧とさせてもらう！<end>"
english = "Graah... To think my power could be repelled... But I shall not perish like this. You there, old fool―I shall take your body. You and the dark power possessed by that horn shall become my sustenance!<end>"

["1340065"]
japanese = "ウグ…アァアア！！<line-break>これは…邪竜の精神か？<line-break>私の体の…自由がきかぬ。<end>"
english = "Ugh... Aaaagh!! Is this... the Evil Dragon's mind? My body... won't obey me.<end>"

["1340066"]
japanese = "フフフ…ハハハ。<line-break>余はうぬの野望を依り代としている。<line-break>余を退けることは無理だ。<line-break>うぬが内に秘めた種族再興の野望。<line-break>人間族を退け、コーンス族の世界を<line-break>作りたいという秘めた願い…。<end>"
english = "Heh heh heh... Ha ha ha. Your ambition is my vessel. You cannot cast me out. That ambition you harbor to restore your race―to drive out the human race and build a world for the Kohns people...<end>"

["1340067"]
japanese = "余が、半分だけかなえてやろう。<line-break>人間族は根絶やしにしてくれる。<line-break>\u3000<line-break>ただし、<line-break>コーンス族も同じように<line-break>根絶やしだがな。フハハハハ！！<end>"
english = "I shall grant half your wish. I will exterminate humanity. Of course, the Kohns people will be exterminated along with them. Hah hah hah hah!!<end>"

["1340068"]
japanese = "…<value:$28>君…。<line-break>私を…殺してくれたまえ。<end>"
english = "<value:$28>... Please... kill me.<end>"

["1340069"]
japanese = "このままでは、伝説にある<line-break>邪竜と同化したドワーフと<line-break>同じ道をたどってしまう。<line-break>頼む、私のため、<line-break>そして、世界のため<line-break>さあ、やってくれ！！<end>"
english = "If this continues, I will share the fate of the Dwarf in the legend who became one with an Evil Dragon. Please―for my sake, and for the sake of the world―do it now!!<end>"

["1340070"]
japanese = "ウグアアアアア…！<end>"
english = "Ughaaaaagh...!<end>"

["1340071"]
