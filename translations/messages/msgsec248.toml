["2480001"]
japanese = "<value:$28>…。<line-break>父さんはああ言っていたけど<line-break>私の意見はまったく正反対よ。<end>"
english = "<value:$28>... Father may have said all that, but I couldn't disagree more.<end>"

["2480002"]
japanese = "私はハーフエルフとして<line-break>生きてきたからわかるの。<line-break>\u3000<line-break>どう生きていくのかが大事だ、<line-break>なんて言うのは簡単よ…。<line-break><line-break>だけど<line-break>実際にそうやって生きていくのが<line-break>どれほどつらいことか想像できる？<end>"
english = "I know because I've lived as a Half-Elf. It's easy to say that what matters is how you choose to live... But can you imagine how hard it is to actually live that way?<end>"

["2480003"]
japanese = "私は人間からもエルフからも<line-break>疎まれて生きてきたわ。<line-break><line-break>私という人格や個性とは関係なく<line-break>私がハーフエルフであるという<line-break>ただそれだけの事実で迫害してくるの。<end>"
english = "I've lived my whole life shunned by humans and Elves alike. They persecute me simply because I'm a Half-Elf, without the slightest regard for who I am as a person.<end>"

["2480004"]
japanese = "いくら私自身が変わろうと、<line-break>他人は私の意志や行動を<line-break>理解しようとはしない。<line-break>ハーフエルフという外見だけが、<line-break>私への扱いを決定しているの。<line-break>\u3000<line-break>そして、それは私が死ぬまで<line-break>つきまとってくる現実…。<end>"
english = "No matter how much I change, no one tries to understand my intentions or actions. My Half-Elf appearance alone determines how they treat me. And that is a reality that will follow me until the day I die...<end>"

["2480005"]
japanese = "それでも、私が生きてこられたのは<line-break>孤独じゃなかったからよ。<line-break>\u3000<line-break>父さんがいる。兄さんがいる。<line-break>そして、決して多くはないけれど<line-break>ハーフエルフの仲間だっているわ。<end>"
english = "Even so, I've managed to go on living because I wasn't alone. I have my father. I have my brother. And though there aren't many of them, I have Half-Elf companions too.<end>"

["2480006"]
japanese = "でも、あなたは私とは違う。<line-break>たったひとりぼっちの存在…。<line-break>\u3000<line-break>異分子として奇異の目で見られ、<line-break>疎まれ、遠ざけられるでしょうね。<line-break>\u3000<line-break>世界はたぶんあなたを受け入れられない。<line-break>あなたという異能者を認められるほど、<line-break>まだ世のなかは成熟していないから…。<line-break>そんな世界であなたは生きていけるの？<end>"
english = "But you're different from me. You are completely alone... People will see you as something alien, stare at you, shun you, keep their distance. The world probably won't accept you. It isn't mature enough yet to acknowledge someone with abilities like yours... Can you live in a world like that?<end>"

["2480007"]
japanese = "そう。あなたにはそれだけの<line-break>覚悟があるのね。<line-break>だったらもう何も言う必要はないわ。<end>"
english = "I understand. You're prepared to face all that. Then there's nothing more I need to say.<end>"

["2480008"]
japanese = "それにあなたには<line-break>無限のソウルがある…。<line-break>\u3000<line-break>もしかするとその可能性に<line-break>希望を抱いた多くの人たちが集い、<line-break>孤独を埋めてくれるのかもしれない。<end>"
english = "Besides, you have the Infinite Soul... Perhaps many people will find hope in its potential and gather around you, easing your loneliness.<end>"

