["1060000"]
japanese = "ロティ・ボリューム２用メッセージ開始<end>"
english = ""

["1060001"]
japanese = "よく来た、<value:$28>よ。\u3000\u3000<line-break>話はすでに聞いている。<line-break>手紙を渡してくれ。<end>"
english = "Welcome, <value:$28>. I've already heard the report. Give me the letter.<end>"

["1060002"]
japanese = "君のような勇敢な同志が<line-break>我ら解放軍にいることを<line-break>感謝している。<line-break>我らの活動は、君が命がけで<line-break>救ってくれたクリュセイス様の<line-break>存在あってこそのものだ。<end>"
english = "We are grateful to have a brave comrade like you in the Liberation Army. Our cause could not endure without Lady Khryuseis, whom you risked your life to save.<end>"

["1060003"]
japanese = "これからも苦しい状況が続こうが、<line-break>ロセンの血統が存続する限り、<line-break>我らも戦っていくことができる。<line-break>君の今後の活躍に期待している。<line-break>これからも、よろしく頼む。<end>"
english = "Hard times may lie ahead, but as long as Rocen's royal line survives, we can continue the fight. I expect great things from you. We will continue to rely on your help.<end>"

["1060004"]
japanese = "君のような勇敢な同志が<line-break>我ら解放軍にいることを感謝している。<line-break>\u3000<line-break>君の勇気ある行動が、<line-break>我ら解放軍の士気と結束を<line-break>ますます高めてくれるに違いない。<end>"
english = "We are grateful to have a brave comrade like you in the Liberation Army. Your courage will surely raise our morale and bind us more closely together.<end>"

["1060005"]
japanese = "そういう意味でも<line-break>君のような英雄的存在は、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>必要不可欠なものなのだ。<line-break>これからも、いくたの苦難に<line-break>立ち向かわねばならぬ<line-break>我らロセンの愛国者にとってはな。<end>"
english = "That is another reason why a heroic figure like you is indispensable to us patriots of Rocen, who must face so many hardships yet to come.<end>"

["1060006"]
japanese = "君の今後の活躍に期待している。\u3000\u3000\u3000<line-break>これからも、よろしく頼む。<line-break>我らが同志、ロセンの鐘の英雄よ。<end>"
english = "I expect great things from you. We will continue to rely on your help, our comrade and hero of the Bell of Rocen.<end>"

["1060007"]
japanese = "君のような勇敢な同志が<line-break>我ら解放軍にいることを感謝している。<line-break>\u3000<line-break>我らも君の闘志にあやかり<line-break>１日も早いロセンの復興を<line-break>成し遂げるつもりだ。<end>"
english = "We are grateful to have a brave comrade like you in the Liberation Army. Inspired by your fighting spirit, we intend to restore Rocen as soon as possible.<end>"

["1060008"]
japanese = "ロセンの復興がなったあかつきには\u3000\u3000<line-break>君は伝説となり、ロセン国民の<line-break>子々孫々に語り継がれるだろう。<line-break>ロセン王国中興の女王<line-break>クリュセイスを救った<line-break>輝ける英雄<value:$28>、とね。<end>"
english = "When Rocen is restored, you will become a legend, remembered by the people of Rocen for generations to come: the radiant hero <value:$28>, savior of Khryuseis, the queen who restored the Kingdom of Rocen.<end>"

["1060009"]
japanese = "君の今後の活躍に期待している。<line-break>これからも、よろしく頼む。<line-break>我らが同志、ロセンの鐘の英雄よ。\u3000\u3000<end>"
english = "I expect great things from you. We will continue to rely on your help, our comrade and hero of the Bell of Rocen.<end>"

["1060010"]
japanese = "最近、ロティの決意が<line-break>揺らいでいるようだ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>娘の命を思う親の気持ちというのも、<line-break>わからないでもないが、これしきの<line-break>苦難でへこたれていたのでは…。<end>"
english = "Lottie's resolve seems to be wavering of late. I can understand a parent's concern for his daughter's life, but if a hardship of this degree is enough to break him...<end>"

["1060011"]
japanese = "しょせん、彼は武器商人にすぎない、<line-break>ということか…。<line-break>いや、すまん、こちらの話だ。<line-break>ロティ殿には今回のことに負けず、<line-break>よりいっそうの協力を願いたいと<line-break>お伝えしてもらいたい。<end>"
english = "Perhaps he is nothing more than an arms merchant after all. No, forgive me. I was speaking to myself. Please tell Master Lottie that I hope he will not be defeated by this setback, and that we ask for even greater cooperation from him.<end>"

["1060012"]
japanese = "それにしても、<line-break>ロティの弱腰には困ったものだ。\u3000\u3000\u3000<line-break>\u3000<line-break>彼は順境には人格者として<line-break>ふるまえるが、逆境に対処できる器では<line-break>ないかもしれんな。<end>"
english = "Still, Lottie's timidity is troubling. He can conduct himself as a man of character in prosperous times, but he may not have the mettle to face adversity.<end>"

["1060013"]
japanese = "おそらく、彼がおそれているのは\u3000\u3000\u3000<line-break>娘の命ではなく、<line-break>自身の危険なのだろうな。<line-break>いずれにしても、我らにとって<line-break>彼の協力は必要だ。<line-break>これからも、よろしく頼む。<end>"
english = "I suspect it is not his daughter's life he fears for, but his own safety. Whatever the truth, we need his cooperation. We will continue to rely on your help.<end>"

["1060014"]
japanese = "残虐なるディンガルの将軍カルラにより<line-break>ロセンの王族はすべて処刑された。<line-break>\u3000<line-break>現在、ロセン王家の血を引くのは<line-break>ペウダ王の叔母君の娘に当たられる<line-break>クロイス家のクリュセイス様のみだ。<end>"
english = "Karula, the ruthless general of Dingal, had every member of Rocen's royal family executed. The only person of Rocen's royal blood who remains is Lady Khryuseis of House Krois, the daughter of King Peuda's aunt.<end>"

["1060015"]
japanese = "我らロセンの存続は彼女に\u3000\u3000\u3000\u3000\u3000\u3000<line-break>かかっているのだ！<line-break><end>"
english = "Rocen's very survival depends upon her!<end>"

["1060016"]
japanese = "ブゾリのやつめ、意外なところに<line-break>落とし穴を作ってくれたものだ。\u3000<line-break>\u3000<line-break>見た目通りの強欲ぶりを<line-break>発揮するかと思えば、こんなに早く<line-break>ロセンを復興させてしまった。<end>"
english = "That wretch Buzori has thwarted us in a most unexpected way. I thought he would prove every bit as greedy as he looks, yet he has rebuilt Rocen with remarkable speed.<end>"

["1060017"]
japanese = "皮肉なことに<line-break>ロセン臣民にもブゾリの支配を\u3000\u3000<line-break>受けいれる動きもあるらしい。<line-break>こんなことで反ディンガルの気運が<line-break>下がってしまっては、それこそ、<line-break>ディンガルの思うつぼではないか！<end>"
english = "Ironically, it seems that even some of Rocen's subjects are beginning to accept Buzori's rule. If this weakens the will to resist Dingal, we will have played straight into Dingal's hands!<end>"

["1060018"]
japanese = "青竜将軍カルラ…、青い死神め。<line-break>奴はいったい何者なのだ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>たった数週間で我らロセンをはじめ<line-break>東方国家６カ国を<line-break>滅ぼしてしまうとは…。<end>"
english = "Karula, the Azure Dragon General... that blue reaper. Who in the world is she? In a matter of weeks, she destroyed six eastern nations, Rocen among them.<end>"

["1060019"]
japanese = "信じられぬスピードだ。<line-break>ディンガルでは、あの青い死神のことを<line-break>神速の用兵家と呼んでいるようだ。<line-break>我らロセンの人材の窮乏と比べて<line-break>なぜ、ディンガルにはこうも<line-break>すぐれた人材が登場してくるのだ。<end>"
english = "The speed is beyond belief. In Dingal, they apparently call that blue reaper a lightning-swift strategist. Why does Dingal produce one gifted leader after another while Rocen suffers such a dearth of talent?<end>"

