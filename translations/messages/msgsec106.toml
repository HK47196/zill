english = "W-we can't, Van.<end>"

["1060040"]
japanese = "うっさいんだよ、ナッジ。<line-break>ナッジえ、とめる？<end>"
english = "Shut up, Nadge. What'd you have to nudge in and stop me for?<end>"

["1060041"]
japanese = "（うっ！\u3000寒い！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>その上、イヤすぎる…！）<line-break>\u3000<line-break>（ナッジと、なぜ、をかけてるのは<line-break>\u3000かろうじてわかるけれど、<line-break>\u3000く、苦しくてつまらない…！\u3000\u3000\u3000）<end>"
english = "(Ugh! That was cold! And just plain awful!) (I can barely tell he's trying to make a pun on “Nadge” and “nudge,” but it's so strained and boring...!)<end>"

["1060042"]
japanese = "（その上、このできの悪いギャグに<line-break>\u3000僕の名前が使われているなんて…<line-break>\u3000むごいよ、むごすぎるよ、ヴァン。）<line-break>（僕たち、友達じゃなかったのかい？<line-break>\u3000僕、君になんかひどいことした？<line-break>\u3000理不尽だよ、ひどいよ、ヴァン…！）<end>"
english = "(And he used my name for such a terrible joke... That's cruel, Van. Too cruel.) (Aren't we friends? Did I do something awful to you? It's so unfair. This is horrible, Van...!)<end>"

["1060043"]
japanese = "さーて、<line-break>みんな凍ってるすきにっと…。<end>"
english = "Right, while everyone's frozen stiff...<end>"

["1060044"]
japanese = "もう、遅いぜ。<line-break>手紙は開けちまったもんねー！<end>"
english = "Too late! I've already opened it, so there!<end>"

["1060045"]
japanese = "…自分のギャグが寒いこと、<line-break>自覚してたんだね、ヴァン。<end>"
english = "So you knew how cold your own joke was, Van.<end>"

["1060046"]
japanese = "すっげえ！\u3000ディンガルの玄武将軍<line-break>ザギヴがロセン巡察に来る日程と行程が<line-break>めちゃ詳しく書いてある！<end>"
english = "Whoa! This gives the exact schedule and route for Zagiv, Dingal's Black Tortoise General, to inspect Rocen!<end>"

["1060047"]
japanese = "へへっ、こんだけのものがあれば、<line-break>ロセンの奴らがヘボでも、<line-break>ザギヴは絶対にとれるな！<end>"
english = "Heh! With information this good, even if those Rocen fools are useless, they'll be sure to get Zagiv!<end>"

["1060048"]
japanese = "な、こうやって手紙の中身を見るのって<line-break>悪いことかな？<end>"
english = "Hey, is it really wrong to look inside a letter like this?<end>"

["1060049"]
japanese = "大丈夫だ。封なら簡単に元に戻る。<line-break>今までだってバレなかったんだ。<end>"
english = "It's fine. The seal is easy to put back. No one's ever noticed before.<end>"

["1060050"]
japanese = "まあ、そう怒るなって。<line-break>用心に越したことはないと思ってな。<line-break>少しチェックさせてもらってただけだ。<line-break>それよりも、この中身だ。<line-break>今までのチンケな情報とは精度が違う。<end>"
english = "Come on, don't get so angry. I thought it was better to be cautious, so I took a quick look. More importantly, look what's inside. This is far more precise than the paltry scraps we've had until now.<end>"

["1060051"]
japanese = "ディンガルの内政統括、玄武将軍<line-break>ザギヴのロセン巡察日程及び行程だ。<line-break>\u3000<line-break>ここまでの情報、ディンガルでも<line-break>四天王クラスじゃないと<line-break>手に入らないぜ？<end>"
english = "It's the schedule and route for Zagiv's inspection of Rocen―the Black Tortoise General who oversees Dingal's domestic affairs. Even in Dingal, only someone on the level of the Four Heavenly Kings could get information like this.<end>"

["1060052"]
japanese = "…お前さんには、教えといた方が\u3000<line-break>よさそうだと思ってな。<line-break>\u3000<line-break>…お前さんのディンガルのお友達、<line-break>結構、敵が多いらしいな。<end>"
english = "I thought you ought to know. It seems your friend in Dingal has quite a few enemies.<end>"

["1060053"]
japanese = "ねぇ、<value:$28>。<line-break>ボク、ピーンときちゃった。\u3000<line-break>\u3000<line-break>ほら、ロセン支部に届けろって<line-break>言われたあの手紙だよ。<line-break>ね、ね。絶対なんかあるよ。<end>"
english = "Hey, <value:$28>. I've got a hunch. Remember that letter we were told to deliver to the Rocen branch? Come on. There's definitely something in it.<end>"

["1060054"]
japanese = "いや、でもダメだよ。<line-break>人の手紙を勝手にのぞいちゃ。<end>"
english = "No, wait. We can't. We can't just peek at someone else's letter.<end>"

["1060055"]
japanese = "ダメダメ、やっぱり<line-break>そんなことしちゃダメだよ。<end>"
english = "No, no. We really shouldn't do that.<end>"

["1060056"]
japanese = "ああん、もぅ！<line-break>本当にダメなんだったら！<end>"
english = "Oh, come on! If this really isn't allowed...!<end>"

["1060057"]
japanese = "…って、<value:$28>。<line-break>ちゃんと、とめてよ。<line-break>ボク、手紙を開けちゃったじゃないか。<line-break>でも、開けちゃったものは<line-break>仕方がないよね。<line-break>…何が書いてあるのかな？<end>"
english = "Wait, <value:$28>! You were supposed to stop me. Now I've opened the letter. Well, what's done is done, right? I wonder what it says...<end>"

["1060058"]
japanese = "見てよ！<line-break>ザギヴって、ディンガルの<line-break>玄武将軍のことだよね。<end>"
english = "Look! Zagiv is Dingal's Black Tortoise General, right?<end>"

["1060059"]
japanese = "そのザギヴ将軍がロセンを巡察する<line-break>日程とかがすごい詳しく書いてある。<end>"
