だと思う？<line-break>気にならない？<line-break>でも、考えていても始まらないか。<line-break>とりあえず手紙を届けましょ。<end>僕たちが手紙を運んでいることを<line-break>知っていた…。<line-break>変だね。<line-break>…どっちにしても、<line-break>今は早く手紙を届けないと。<line-break>急ごう、<value:$28>。 <end>"
