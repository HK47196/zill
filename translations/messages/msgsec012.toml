["120000"]
japanese = "奥の入り口は、左から順に<line-break>移動の間、倉庫、貯水の間、農場の間<line-break>へ通じている。<end>"
english = "The entrances at the back lead, from left to right, to the Transit Room, the warehouse, the Water Storage Room, and the Farm Room.<end>"

["120001"]
japanese = "あなた、外の世界から来たのね。<line-break>外の世界の人に会うの、あたし初めてなの。<line-break>だって、ラドラスから一度も出たことないから。<line-break>外の世界って危険でいっぱいって本当なの？<line-break>あたしもエステルみたいに、外の世界に<line-break>冒険に行ってみたいなぁ。<end>"
english = "You're from the outside world, aren't you? I've never met anyone from outside before. I've never once left Ladras. Is it true the outside world is full of danger? I'd love to go adventuring out there like Esther.<end>"

["120002"]
japanese = "<select><value:$20>%5ここは移動の間だ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>柱の前に立てば、<line-break>別の場所へ移動できる。<line-break>だが、普段は使えない柱もある。<line-break>正面の柱などがそうだ。<end>エステル様の部屋に行きたいのなら<line-break>１番右の柱の前に立て。<end>正面の柱は制御の間につながっている。<end>監視の間へ行きたいのなら<line-break>右から４番目の柱の前に立て。<end>右から３番目の柱は<line-break>地下洞窟につながっている。<end>"
english = "<select><value:$20>%5This is the Transit Chamber. Stand before one of the pillars, and it will take you somewhere else. Some of the pillars can't normally be used, though. The one directly ahead is one of them.<end>To reach Lady Esther's room, stand before the pillar on the far right.<end>The pillar directly ahead leads to the Control Chamber.<end>To reach the Monitoring Chamber, stand before the fourth pillar from the right.<end>The third pillar from the right leads to the underground caverns.<end>"

["120003"]
japanese = "ここは貯水の間。<line-break>この水は我々にとって、まさに命の次に大切な<line-break>ものなのだ。大切にせねばいかんぞ。<end>"
english = "This is the Reservoir Chamber. To us, this water is second only to life itself. See that you treat it with care.<end>"

["120004"]
japanese = "ここは農場の間。<line-break>我々が砂漠の中で生きていけるのは、<line-break>食物を自給自足できるからだ。<line-break>魔道王国の技術力には感心するよ。<line-break>こんな技術を持った魔道王国が<line-break>滅ぶとは、不思議でならないのだが…。<end>"
english = "This is the Farm Chamber. We can survive here in the desert because we produce all our own food. The Mage Kingdom's technical prowess is remarkable. With such technology at its command, I cannot understand how the kingdom ever fell...<end>"

["120005"]
japanese = "ラドラスメッセージここまで<end>"
