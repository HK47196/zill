["1310000"]
japanese = "エア\u3000ボリューム１その２開始<end>"
english = ""

["1310001"]
japanese = "<value:$28>。<line-break>より多くの道標を望むか。<line-break>ならば、聞かせてやろう。<end>"
english = "<value:$28>. Do you seek further guidance? Then I shall grant it.<end>"

["1310002"]
japanese = "よくぞ来た、<value:$28>よ。<end>"
english = "Welcome, <value:$28>.<end>"

["1310003"]
japanese = "またも、進むべき道に迷い<line-break>わらわの言葉を求めるか。<line-break>ならば、聞かせてやろう。<end>"
english = "Have you lost your way once more and come seeking my counsel? Then I shall grant it.<end>"

["1310004"]
japanese = "わらわはエア。<line-break>このエルズの竜の座で<line-break>すべてを見る者なり。<end>"
english = "I am Er, she who sees all from the Dragon's Seat here in Elz.<end>"

["1310005"]
japanese = "いかがした？<line-break>わらわがそなたの名を知っておるのが<line-break>それほど、驚きか？<line-break>わらわは天地千年を見通す。<line-break>そなたの名を知ることぐらい、<line-break>たやすきことよ。<end>"
english = "What is it? Are you so surprised that I know your name? My sight spans heaven and earth across a thousand years. Knowing your name is a simple matter.<end>"

["1310006"]
japanese = "さて、そなたは道標を求め<line-break>わらわを訪ねたのであろう？<line-break>ならば、聞かせてやろう。<end>"
english = "Now, you came to me seeking guidance, did you not? Then I shall grant it.<end>"

["1310007"]
japanese = "エンシャントの南東にある賢者の森。<line-break>選ばれた者のみに見える館が<line-break>汝を迎え入れるであろう。<line-break>そなたの真の旅は<line-break>そこから始まるであろう…。<end>"
english = "In Sage's Forest, southeast of Ancient, a manor visible only to the chosen shall welcome you. There your true journey shall begin...<end>"

["1310008"]
japanese = "汝、かつての栄華の跡なる地より<line-break>常なる世界を越え<line-break>闇の淵へと迷い込まん。<line-break>そこで汝は<line-break>若き獅子の雄々しさと<line-break>その背負いたる宿業を見るであろう。<end>"
english = "From a land marked by the remnants of former glory, you shall pass beyond the ordinary world and stray into the abyss of darkness. There you shall witness the valor of a young lion and the fateful burden borne upon those shoulders.<end>"

["1310009"]
japanese = "無限のソウルを持つ者は、<line-break>汝だけにあらず。<line-break>今ひとつの魂が無限の輝きを宿す。<line-break>千年樹としんきろう、ふたつを<line-break>結びし古の道にて<line-break>汝とその魂は出会うであろう。<end>"
english = "You are not the only Bearer of the Infinite Soul. Another soul holds that same infinite radiance. On the ancient road linking the Thousand-Year Tree and the Mirage, you and that soul shall meet.<end>"

["1310010"]
japanese = "汝と対をなす無限の魂も<line-break>その生きる道を旅の中に見た。<line-break>その周りには、３つの魂あり。<line-break>今からそう遠くはないいつか、<line-break>都市にて仕事をなさんとする時<line-break>汝らは再会するであろう。<end>"
english = "The Infinite Soul paired with yours has also found its path in life through its journey. Three souls surround it. Before long, when you set out to undertake a task in a city, you shall be reunited.<end>"

["1310011"]
japanese = "青き死神、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>東の暗愚王の業に怒り<line-break>裁きの鎌を振るわんとす。<line-break>汝、死神の力になりたくば、<line-break>閉ざされし国の門を叩くがよい。<end>"
english = "The Blue Reaper, enraged by the deeds of the foolish king in the east, prepares to swing the scythe of judgment. If you would lend the Reaper your strength, knock upon the gates of the closed realm.<end>"

["1310012"]
japanese = "ロストールにふたりの王女あり。<line-break>ひとりは光、<line-break>今ひとりは闇をまとう。<line-break>今この大地には戦乱の兆しあり。<line-break>彼女らに会うべき想いあらば<line-break>急ぎ彼の国へと向かうがよい。<end>"
english = "There are two princesses in Rostorl. One is light; the other is clad in darkness. The shadow of war now hangs over this land. If you feel compelled to meet them, make haste for that realm.<end>"

["1310013"]
japanese = "この大陸が揺らいでおる。<line-break>ふたつの大いなる力の交錯じゃ。<line-break>\u3000<line-break>汝に守るべき縁あらば、<line-break>その者と道を共にするがよい。<line-break>汝が、生きる力となろう。<end>"
english = "This continent is trembling as two great powers collide. If there is someone you are bound to protect, walk the same path with that person. That person shall become your strength to live.<end>"

["1310014"]
japanese = "自由と欲望とで築かれし町、\u3000\u3000\u3000\u3000<line-break>やがて死神の吐息を受けん。<line-break>その、滅びの運命がゆえに。<line-break>しかし、富裕と孤独とをまといし娘が<line-break>死神の鎌に逆らおうとしておる。<line-break>牙を共にするも面白かろう。<end>"
english = "A city built on freedom and desire shall soon feel the Reaper's breath, for destruction is its fate. Yet a young woman cloaked in wealth and solitude seeks to defy the Reaper's scythe. It may prove interesting to bare your fangs beside her.<end>"

["1310015"]
japanese = "いにしえの日より<line-break>大いなる力のために<line-break>血を連ねし４人の巫女あり。<line-break>やがて巫女らは<line-break>東方の魔道士にかどわかされ<line-break>空舞う恐怖の鍵となろう。<end>"
english = "Since ancient days, there have been four priestesses bound by blood for the sake of a great power. In time, they shall be carried off by a sorcerer from the east and become the key to a terror that soars through the skies.<end>"

["1310016"]
japanese = "今そなたに示すべき道は<line-break>このようなものじゃ。<line-break>進むがよい。<value:$28>よ。<end>"
english = "That is all the guidance I have for you now. Go forth, <value:$28>.<end>"

