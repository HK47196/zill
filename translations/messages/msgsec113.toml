["1130000"]
japanese = "ザギヴメッセージｖ４用開始<end>"
english = ""

["1130001"]
japanese = "訃報だ。<line-break>アンギルダンは死んだよ。\u3000<line-break>反逆者としてね。<line-break>敗戦について挑発してやれば<line-break>すぐにかみついてきた。<line-break>\u3000<end>"
english = "I have news of a death. Angeerdan is dead. He died a traitor. I baited him over the defeat, and he bit at once.<end>"

["1130002"]
japanese = "さすがに老いたりとはいえ、<line-break>骨のある男だった。<line-break>少しは戦いも楽しめたかな。<end>"
english = "Old as he was, the man had backbone. At least the fight proved mildly entertaining.<end>"

["1130003"]
japanese = "君は長生きするのだな、<line-break><value:$28>。<line-break>…無限のソウルを持つ者よ。\u3000\u3000\u3000\u3000\u3000<end>"
english = "You will live a long life, <value:$28>... Bearer of the Infinite Soul.<end>"

["1130004"]
japanese = "あの戦いに生き残ったのならば、<line-break>ぼんくらどもとは違うのだろうから。<line-break>資質だけでなく、現在の能力的にもな。<end>"
english = "If you survived that battle, you must be different from those fools: not merely in promise, but in your abilities as they stand now.<end>"

["1130005"]
japanese = "しかし、アンギルダンには\u3000\u3000\u3000\u3000<line-break>感謝している。<line-break>\u3000<line-break>本来、人間の革新の日の目を<line-break>見ることのないぼんくらどもを、<line-break>大量に処分してくれたのだからな。<end>"
english = "Still, I am grateful to Angeerdan. He disposed of great numbers of fools who would never have lived to see the dawn of humanity's transformation.<end>"

