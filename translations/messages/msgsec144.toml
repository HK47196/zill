["1440000"]
japanese = "グフトク、Ｖｏｌ３メッセージ開始<end>"
english = ""

["1440001"]
japanese = "今、俺は究極の生物を作り上げた。<line-break>俺は、奴を生み出すためだけに<line-break>生まれたのかもしれない。<line-break>思えば、すべてが意味がなかった。<line-break>…孤独な人生も、金も…。<line-break>金には、あれほど執着したのにな。<end>"
english = "Now I have created the Ultimate Life-Form. Perhaps I was born solely to bring it into being. Looking back, it was all meaningless: my lonely life, money... And to think how obsessed I was with money.<end>"

["1440002"]
japanese = "それも、結局は<line-break>何にすがればよいかわからないために、<line-break>とりあえず選んだ無難な選択肢だった。<line-break>戦闘モンスター事業の成功も、<line-break>親友ロティに対する反発も、<line-break>リベルダムの陥落も、<end>"
english = "That too was merely a safe choice I made for want of knowing what else to cling to. The success of my combat-monster business, my rebellion against my best friend Lottie, the fall of Liberdam―<end>"

["1440003"]
japanese = "魔人の奴隷になったのも、<line-break>すべてはここに至るまでの<line-break>道標にすぎなかったのだ。<line-break>この俺の小さな身体は、仮の姿。<line-break>お前こそが<line-break>本当の俺だったのかもしれないな。<end>"
english = "Even becoming the demon's slave―all of it was merely a series of signposts leading me here. This small body of mine is only a temporary form. Perhaps you were my true self all along.<end>"

["1440004"]
japanese = "俺は運命を成し遂げた。<line-break>満足だ。醜く、強大なお前、<line-break>いや本当の自分に会えて…。<end>"
english = "I have fulfilled my destiny. I am content to have met you, hideous and mighty―or rather, to have met my true self...<end>"

["1440005"]
japanese = "いろいろあったが、<line-break>これで俺の苦労も報われる。<end>"
english = "A lot has happened, but now all my struggles will have been worthwhile.<end>"

["1440006"]
japanese = "今こそ披露しよう、<line-break>これが究極生物エクリプスだ！<end>"
english = "Now I shall unveil it: Eclipse, the Ultimate Life-Form!<end>"

["1440007"]
japanese = "今、小さい自分が死に、<line-break>大いなる自分が世界を蹂躙する<line-break>クックックッ、ハハハ…！<end>"
english = "Now my small self dies, and my great self will trample the world underfoot. Heh heh heh... Ha ha ha...!<end>"

