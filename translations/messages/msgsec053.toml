["530000"]
japanese = "ファーロス・ボリューム３開始<end>"
english = ""

["530001"]
japanese = "俺が部下を見捨てて何が悪い…。\u3000\u3000\u3000<line-break>俺とあいつらゴミどもとは違うんだ。\u3000<line-break>\u3000<line-break>俺は貴族なんだ、俺は貴族なんだ、<line-break>俺は、と、と、特別なんだアアア！！！<line-break>あいつらとは価値が違うのだ！\u3000俺は！<end>"
english = "What's wrong with abandoning my men...? I'm not like those worthless pieces of trash. I'm a noble! I'm a noble! I'm s-s-special! I'M WORTH MORE THAN THEY ARE! I AM!<end>"

["530002"]
japanese = "同じ負け戦に出て、どうしてどうしてエ<line-break>ゼネテスはみんなの脚光を浴びて、俺は<line-break>俺は俺は俺だけは白い目で見られるウ？<line-break>ゼネテスは貴族の義務を放棄したクズ…<line-break>そう、クズクズクズクズ…。<end>"
english = "We fought in the same losing battle, so why―why does Xenetes get all the glory while I―I'm the only one everyone looks down on? Xenetes cast aside his duty as a noble. He's scum... Yes, scum, scum, scum, scum...<end>"

["530003"]
japanese = "それなのにどうして俺が白い目で？\u3000\u3000<line-break>俺が俺がア？<line-break>\u3000<end>"
english = "Then why do they look down on me? Why me? Meee?<end>"

["530004"]
japanese = "くそっくそっくそっくそっ！\u3000クズめ！<line-break>クズめクズめクズめ！\u3000クズのくせに！<line-break>俺をバカにしやがって！\u3000クズがアア！<end>"
english = "Damn it, damn it, damn it, damn it! Scum! Scum, scum, scum! You're nothing but scum! How dare you make a fool of me! You scu-u-um!<end>"

["530005"]
japanese = "おとなしくしろ！<line-break>ルブルグ伯タルテュバ！\u3000\u3000<end>"
english = "Control yourself, Tartuba, Count of Ruburg!<end>"

["530006"]
japanese = "王宮内での無礼は厳罰だぞ！<line-break>ロストール貴族の面汚しめ！<end>"
english = "Any insolence in the royal palace will be severely punished! You are a disgrace to the nobility of Rostorl!<end>"

["530007"]
japanese = "何をオオオオオオオオオオ！<end>"
english = "How dare youuuuuuu!<end>"

["530008"]
japanese = "戦場で見苦しいマネをした貴様が、<line-break>王宮内で無礼を働くなど、<line-break>許されざることだ！<end>"
english = "After your disgraceful conduct on the battlefield, you dare behave so insolently in the royal palace? That is unforgivable!<end>"

["530009"]
japanese = "戦場で見苦しいマネをした貴様が、<line-break>戦場でご活躍なされた将軍に<line-break>無礼を働くなど許されざることだ！<end>"
english = "After your disgraceful conduct on the battlefield, you dare insult the general who served with such distinction there? That is unforgivable!<end>"

["530010"]
japanese = "…昔、アンギルダンのとっつぁんは<line-break>ロストールで傭兵をしてたこともある。<line-break>\u3000<line-break>俺が物心つくかつかないころだ。<line-break>…だが、俺は鮮明に覚えてる。<line-break>ホントに、でけえ人だった。<end>"
english = "Long ago, old Angeerdan spent some time working as a mercenary in Rostorl. I was barely old enough to know what was going on, but I remember him clearly. He was a truly enormous man.<end>"

["530011"]
japanese = "肩車してもらったこともある。\u3000\u3000\u3000\u3000<line-break>とっつぁんは覚えちゃ<line-break>いなかったろうがな…。<end>"
english = "I even got a ride on his shoulders. Doubt he remembered it, though.<end>"

["530012"]
japanese = "…剣を振ってくる。<line-break>じゃあな。<end>"
english = "I'm off to practice with my sword. See you.<end>"

["530013"]
japanese = "<value:$28>か。<line-break>先のディンガルとの戦で\u3000\u3000\u3000\u3000\u3000<line-break>兄、ノヴィンが死んだ。<line-break>気の利かぬ、察しの悪い男だった。<line-break>よく言えば、たくらみのない、<line-break>悪く言えば、ぼんくらな男だった。<end>"
english = "<value:$28>, is it? My brother Novin died in the recent war with Dingal. He was thoughtless and slow to understand. At best, he was guileless; at worst, a fool.<end>"

["530014"]
japanese = "自分のあり方に疑問を抱かなかった。<line-break>一切な。そういう人間は得てして<line-break>はた迷惑なものだが、兄もそうだった。<end>"
english = "He never once questioned the way he lived. People like that often make nuisances of themselves, and my brother was no exception.<end>"

["530015"]
japanese = "凡庸だったが、<line-break>死んでみると、やはり悲しいものだ。\u3000<line-break>それが親族というものかもしれぬ。<end>"
english = "He was an unremarkable man, yet now that he is dead, I find myself grieving. Perhaps that is simply the nature of kinship.<end>"

["530016"]
japanese = "ゼネテスは兄の息子。私の甥だ。<line-break>そして、こたびの戦の最功労者だ。\u3000\u3000<line-break>\u3000<line-break>敗軍をまとめ、敵を敗走させた。<line-break>その功をもって、父のあとを継ぎ、<line-break>軍総司令、ファーロス家当主となった。<end>"
english = "Xenetes is my brother's son, my nephew. He also distinguished himself above all others in this war. He rallied the defeated army and sent the enemy fleeing. For that achievement, he succeeded his father as commander-in-chief and head of House Pharos.<end>"

["530017"]
japanese = "フフ、ゼネテスの正体を知って\u3000\u3000\u3000\u3000<line-break>驚いているのか、<line-break><value:$28>？<line-break>驚いているのは私の方だ。<line-break>私の配下がディンガル側にいて<line-break>ロストール軍と戦っているのだからな。<end>"
english = "Heh. Surprised to learn who Xenetes really is, <value:$28>? I am the one who should be surprised. One of my own retainers was on Dingal's side, fighting Rostorl's army.<end>"

["530018"]
japanese = "リューガ家に売国奴の反逆者を出して<line-break>レムオンを巻き込もうとしたのか？\u3000<line-break>\u3000<line-break>もしそうならば<line-break>以後、そのような<line-break>愚かなマネはせぬことだ。<end>"
english = "Were you trying to turn a member of House Ryuga into a traitorous rebel and implicate Lemghon? If so, do not attempt anything so foolish again.<end>"

["530019"]
japanese = "そなたの父フリントは<line-break>決して捨て身の行動はとらなかった。<line-break>なぜだかわかるか？<line-break>捨て身になれば、人は判断力を失う。<line-break>何も守るものがない者は<line-break>強くはなれぬ。<end>"
english = "Your father Flint never acted with reckless disregard for his own life. Do you know why? Once a person throws life away, sound judgment goes with it. No one with nothing to protect can ever become strong.<end>"

["530020"]
japanese = "フリントはそなたを守ろうとしていた。<line-break>石火のごときフリントの働きは<line-break>そなたあってこその働きだったのだ。<line-break>フリントの、そなたを守ろうとした<line-break>気持ちをムダにするな。<line-break>そして、強くなれ。<end>"
english = "Flint was trying to protect you. He could act with such lightning speed because he had you to protect. Do not let that devotion go to waste. Become strong.<end>"

["530021"]
japanese = "さて、愚かなマネをしてくれた。\u3000<line-break>\u3000<line-break>\u3000<line-break>フリントの子供ゆえ、<line-break>守ってやりたいが、<line-break>事が露見してはかばいきれぬぞ。<end>"
english = "Well, you have done a foolish thing. You are Flint's child, so I want to protect you, but if this comes to light, I will not be able to shield you.<end>"

["530022"]
japanese = "ゼネテスには他言無用と<line-break>言いおいたが、誰に知れるか<line-break>わからぬ。気をつけよ。<end>"
english = "I ordered Xenetes to tell no one, but there is no knowing who may discover the truth. Be careful.<end>"

["530023"]
japanese = "よい。おもてを上げよ。<line-break>そなたひとりでは戦況は変わらぬ。\u3000<line-break>\u3000<line-break>兄、ノヴィンの死も、<line-break>多数のロストールの戦死者もすべて<line-break>兄の責任だ。そなたのせいではない。<end>"
english = "It is all right. Raise your head. You alone could not have changed the course of the war. The death of my brother Novin, and of so many Rostorl soldiers, was entirely my brother's responsibility. None of it was your fault.<end>"

["530024"]
japanese = "くそっくそっくそっくそっ！\u3000クズめ！<line-break>クズめクズめクズめ！\u3000クズのくせに！<line-break>俺をバカにしやがって！\u3000クズがアア！<end>"
english = "Damn it, damn it, damn it, damn it! Scum! Scum, scum, scum! You're nothing but scum! How dare you make a fool of me! You scu-u-um!<end>"

["530025"]
japanese = "…アンギルダンのこと、<line-break>俺もおぼえてるよ。<line-break>当時は、よくここに来てたからな…。<line-break>よく飲む、陽気な、いい奴だった…。<end>"
english = "I remember Angeerdan too. He used to come here often in those days. He could put away his drink, and he was cheerful. A good man.<end>"

