["530034"]
japanese = "兄は無能ゆえに多くの兵を死なせた。<line-break>死をもって報いるのが当然だろう。<line-break>息子のゼネテスに跡を継がせた。<end>"
english = "My brother's incompetence cost many soldiers their lives. It was only right that he pay with his own. I appointed his son Xenetes to succeed him.<end>"

["530035"]
japanese = "よくやった。<line-break>戦争などは本来いむべきものだが、<line-break>そなたの活躍、うれしく思うぞ。<line-break>天国のフリントとそなたの母も<line-break>やはり喜んでいよう。<end>"
english = "You did well. War is something to be abhorred, but I am pleased by what you accomplished. Flint in heaven must be pleased, and your mother must be too.<end>"

["530036"]
japanese = "王妃様。<line-break>七竜家の当主重鎮の方々が<line-break>会談を申し込んでおられます。<line-break>このたびの戦で受けた<line-break>損害の大きさについて、<line-break>お話があるとのことでした。<end>"
english = "Your Majesty. The heads and senior members of the Seven Dragon Houses have requested a meeting. They wish to discuss the scale of the losses suffered in this war.<end>"

["530037"]
japanese = "そうか、わかった。<line-break>\u3000<line-break>\u3000<line-break>フリントの子、<value:$28>よ。<line-break>また来るとよい。<end>"
english = "Very well. <value:$28>, child of Flint, you are welcome to return.<end>"

