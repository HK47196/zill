["1110100"]
japanese = "ウルカーンでネメア様の\u3000\u3000\u3000\u3000\u3000\u3000<line-break>邪魔をしたそうだな。<line-break>\u3000<line-break>以後、そのようなマネは慎むことだ。<line-break>…復活の時のあとにも<line-break>生き延びることを望むならな。<end>"
english = "I hear you interfered with Lord Nemea in Urkaan. See that it does not happen again... if you hope to survive beyond the time of resurrection.<end>"

["1110101"]
japanese = "人を竜王の束縛から解き放つ…。<line-break>その最後の機会こそ復活の時なのだ。<line-break>この機会を逃すわけにはゆかぬ。<end>"
english = "The moment of resurrection will be the final chance to free humanity from the Dragon King's grasp. We cannot let that chance pass.<end>"

["1110102"]
japanese = "無限のソウルを持つ者よ…\u3000\u3000\u3000\u3000\u3000<line-break>なぜ、理解しない？<line-break>\u3000<line-break>ただ、ネメア様のみが<line-break>復活の時を越え、人類を革新へと<line-break>導くことができるのだ。<end>"
english = "Bearer of the Infinite Soul... why can you not understand? Lord Nemea alone can transcend the hour of resurrection and lead humanity to renewal.<end>"

["1110103"]
japanese = "空きメッセージ<end>"
english = "Empty message<end>"

["1110104"]
japanese = "空きメッセージ<end>"
english = "Empty message<end>"

["1110105"]
japanese = "宰相閣下はただいま<line-break>会議で出ていらっしゃいます。<line-break>また後日、お越しください。<end>"
english = "The Chancellor is in a meeting at present. Please come back another day.<end>"

["1110106"]
japanese = "ベルゼーヴァ様は、<line-break>仕事に厳しすぎます。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ご自分が有能だから<line-break>つい、その尺度で他人をはかられる。<line-break>私じゃあの仕事量についていけません。<end>"
english = "Beelzeva is far too demanding when it comes to work. He's so capable himself that he tends to judge everyone else by the same standard. I can't keep up with that workload.<end>"

["1110107"]
japanese = "ああ、君か。<line-break>そうだな…。<line-break>君は知っておいた方がいいだろう。<end>"
english = "Ah, it's you. Let me see... Yes, this is something you ought to know.<end>"

["1110108"]
japanese = "<select><value:$20>%2聖と闇の魔法には<line-break>禁呪があると言われている。\u3000\u3000\u3000\u3000<line-break>今は封印されているが、<line-break>封印を解くことができれば、<line-break>資質を持つもののみ<line-break>使えるようになるという。<end>火水土風の精霊魔法において<line-break>最大威力を誇るものは、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>精霊神が封じていると聞く。<line-break>だが、精霊神の望みを<line-break>かなえる力を持つ者が現れれば、<line-break>封印が解かれるかもしれぬそうだ。\u3000<end>"
english = "<select><value:$20>%2Forbidden Spells are said to exist in sacred and dark magic. Though they are sealed away now, if the seal can be broken, only those with the necessary aptitude will be able to use them.<end>I hear that the most powerful of all fire, water, earth, and wind spirit magic is sealed away by the Spirit God. But it is said that the seal may be broken if someone appears with the power to fulfill the Spirit God's wish.<end>"

["1110109"]
japanese = "力をつけ、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>挑戦してみてはどうだ？<line-break>損はするまい。<end>"
english = "Why not build your strength and attempt it? You have nothing to lose.<end>"

["1110110"]
japanese = "ああ、君か。<line-break>この私になんの用だ？<end>"
english = "Ah, it's you. What business do you have with me?<end>"

["1110111"]
japanese = "無限のソウルについて、<line-break>知りたいのか？<end>"
english = "You wish to know about the Infinite Soul?<end>"

["1110112"]
japanese = "時折、現れるのだ。<line-break>成長に限界のない人間がな。<line-break>それが無限のソウルを持つ者だ。<line-break>人間には、普通は限界がある。<line-break>人により差があるが、<line-break>どこかで成長は止まる。<end>"
english = "Such people appear from time to time―people with no limit to their growth. They are Bearers of the Infinite Soul. Ordinarily, every person has a limit. It varies from one to another, but eventually, growth comes to an end.<end>"

["1110113"]
japanese = "もっとも限界まで、<line-break>成長を続けられるものは<line-break>まれだがな。<line-break>いかに大器であろうと<line-break>器を満たせねば、<line-break>凡人と変わらん。<end>"
english = "Mind you, few manage to continue growing until they reach their limit. No matter how great one's potential, if it is never fulfilled, one is no different from an ordinary person.<end>"

["1110114"]
japanese = "君はどうかな？<line-break>どこまでやれるのか<line-break>…楽しみにしているよ。<end>"
english = "And what of you? I look forward to seeing how far you can go.<end>"

["1110115"]
japanese = "さて、悪いが<line-break>予定が詰まっているのでね。<line-break>気が向いたら、また顔を出してくれ。<end>"
english = "Now, forgive me, but my schedule is rather full. Come and see me again if you feel so inclined.<end>"

["1110116"]
japanese = "気が向いたら、<line-break>また顔を出してくれ。<end>"
english = "Come by again sometime, if you feel like it.<end>"

