["1110008"]
japanese = "おう！\u3000<value:$28>。<line-break>なんかすごいことになってるぜ。\u3000<line-break>\u3000<line-break>ディンガルの四天王のひとり、<line-break>玄武将軍ザギヴが、<line-break>お前に礼を言いたいそうだ。<end>"
english = "Hey, <value:$28>! Something big's going on. Zagiv, General of the Black Tortoise and one of Dyneskal's Four Heavenly Kings, says she wants to thank you.<end>"

["1110009"]
japanese = "城まで来てくれってさ。<line-break>いやー、お前も大物になったなぁ。<line-break>\u3000<end>"
english = "She wants you to come to the castle. Well, look at you. You're a real big shot now.<end>"

["1110010"]
japanese = "無限のソウルの資質を持つ者よ。<line-break>私の執務室まで来てくれ。<end>"
english = "You who possess the qualities of an Infinite Soul, come to my office.<end>"

["1110011"]
japanese = "用事がある。<line-break>国計に関わる大事だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ネメア様の障害となる者、<line-break>つまり、君を私の執務室におびき寄せ<line-break>兵に囲ませて始末するのだ。<end>"
english = "I have business with you. It is an important matter of state. I intend to lure the one who stands in Lord Nemea's way―that is, you―to my office, have soldiers surround you, and dispose of you.<end>"

["1110012"]
japanese = "冗談だ。君ごときなら、<line-break>今、私ひとりで始末できる。<end>"
english = "I'm joking. I could dispose of the likes of you myself, right now.<end>"

["1110013"]
japanese = "君がネメア様と敵対状態なのは承知だ。<line-break>だが、ネメア様からは<line-break>どうしろとも命令がない。<line-break>ネメア様には君に関して<line-break>何かお考えがあるのだろう。<line-break>私はネメア様に忠実だ。<end>"
english = "I am aware that you and Lord Nemea are enemies. But he has given me no orders concerning you. I presume Lord Nemea has something in mind. I am loyal to him.<end>"

["1110014"]
japanese = "君はだいたいネメア様に<line-break>たてつくようなマネは<line-break>何もしていないではないか。<end>"
english = "You haven't actually done anything to defy Lord Nemea in the first place.<end>"

["1110015"]
japanese = "心配せずについてくるといい。<line-break>今日は、私の気まぐれだ。<line-break>無限のソウルの資質を持つ者よ。<end>"
english = "You needn't worry. Come with me. This is merely a whim of mine today, you who possess the qualities of an Infinite Soul.<end>"

["1110016"]
japanese = "私は君に期待している。<line-break>君のようなソウルを持つ者は、<line-break>人類の革新者たりうる。<line-break>いくら優れていても<line-break>所詮、四天王は凡人だ。<line-break>人類の革新者たりえない。<end>"
english = "I expect great things of you. Someone with a Soul like yours could transform humanity. No matter how exceptional the Four Heavenly Kings may be, they are ordinary people in the end. They could never transform humanity.<end>"

["1110017"]
japanese = "それでは意味がないのだ。<end>"
english = "Then there would be no point.<end>"

["1110018"]
japanese = "また来るといい。<line-break>無限のソウルを持つものよ。<line-break>私は君を歓迎するだろう。<end>"
english = "Come again, bearer of the Infinite Soul. You will be welcome here.<end>"

