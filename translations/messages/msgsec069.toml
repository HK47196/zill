["690000"]
japanese = "アーギルシャイアメッセージ開始<end>"
english = ""

["690001"]
japanese = "ここがディンガル帝国の首都<line-break>エンシャントだ。<line-break>\u3000<line-break>町の中でまで群れては歩かん。<line-break>町を出るまでは別行動が冒険者同士の<line-break>暗黙のルールだ。憶えておけ。<end>"
english = "This is Ancient, capital of the Dyneskal Empire. Adventurers don't travel in packs inside the city. Until we leave town, we go our separate ways. It's an unwritten rule among adventurers. Remember that.<end>"

["690002"]
japanese = "冒険者として<line-break>旅をした経験は？<end>"
english = "Have you ever traveled as an adventurer?<end>"

["690003"]
japanese = "…だろうな。<line-break>今からギルドで冒険者登録をする。<line-break>ギルドは、そこだ。<end>"
english = "I thought not. Now it's time to register as an adventurer at the Guild. The Guild's right over there.<end>"

["690004"]
japanese = "…来たか。<line-break>カウンターにいるおやじに<line-break>話しかけろ。…登録してくれる。<end>"
english = "...So you're here. Talk to the man at the counter. He'll register you.<end>"

["690005"]
japanese = "カウンターにいるおやじに<line-break>話しかけろ。登録してくれる。<end>"
english = "Talk to the old man at the counter. He'll register you.<end>"

["690006"]
japanese = "冒険者登録かい？<line-break>あんたみたいに若い人は大歓迎だ。<line-break>\u3000<line-break>ちょっと調べさせてもらうよ。<line-break>信用できる人物かどうか<line-break>確かめなくちゃならないんでな。<end>"
english = "Here to register as an adventurer? Young people like you are always welcome. Let me just check you out first. We need to make sure you're someone we can trust.<end>"

["690007"]
japanese = "幻術計振れておらず<line-break>犯罪登録当てはまらず。<line-break>\u3000<line-break>おめでとう。<line-break>あんたも冒険者として<line-break>登録されたよ。<end>"
english = "The illusion gauge didn't react, and there's no match in the criminal registry. Congratulations. You're now registered as an adventurer.<end>"

["690008"]
japanese = "これからは、バリバリ仕事して<line-break>名をあげていってくれよ。<line-break>がんばりな！<end>"
english = "Now get out there, take on plenty of work, and make a name for yourself. Good luck!<end>"

["690009"]
japanese = "仕事をこなしながら、<line-break>強くなることだ。<line-break>弱いやつは邪魔なだけだからな。<line-break>仕事の選択は、お前に任せる。<line-break>では、町を出るときに合流しよう。<end>"
english = "Take on jobs and grow stronger. Weaklings only get in the way. What work you choose is up to you. We'll meet up when you leave town.<end>"

["690010"]
japanese = "…<value:$28>、<line-break>気をつけろ。<end>"
english = "<value:$28>, watch out.<end>"

["690011"]
japanese = "あの女…強い…。<end>"
english = "That woman... she's strong.<end>"

["690012"]
japanese = "…引き上げることにしましょう…。<line-break>…ミイスは焼かれ、神器もとうとう<line-break>アーギルシャイアに落ちましたか…。<end>"
english = "We should withdraw. So Miis has been burned, and the divine artifact has finally fallen into Argyleshire's hands...<end>"

["690013"]
japanese = "アーギルシャイアだと？<line-break>貴様！<line-break>アーギルシャイアの仲間か…！<end>"
english = "Argyleshire? You! Are you one of her allies?!<end>"

["690014"]
japanese = "あ、転送中に来ては危険です。<line-break>下がって…。<end>"
english = "Oh, it's dangerous to come near during teleportation. Stand back...<end>"

["690015"]
japanese = "くっ！<line-break>瞬間移動…だと！？<end>"
english = "Gah! Teleportation?!<end>"

["690016"]
japanese = "…瞬間移動だ。<line-break>空間をねじ曲げて一瞬のうちに<line-break>何かを移動させる術。<line-break>空間をねじ曲げることができるのは<line-break>高レベルの魔道士だけだ。<line-break>…魔人クラスのな。<end>"
english = "Teleportation. A spell that bends space to move something in an instant. Only high-level sorcerers can bend space. Demon-class sorcerers, that is.<end>"

["690017"]
japanese = "奴も魔人かもしれん。<line-break>つまり、<line-break>アーギルシャイアの仲間…。<end>"
english = "Maybe we're dealing with another demon. In other words, one of Argyleshire's allies...<end>"

["690018"]
japanese = "…いや、奴の目的地から<line-break>そう遠くに放り出されてはいない。<line-break>\u3000<line-break>…瞬間移動は<line-break>そう使える術ではない。<line-break>奴も、この近くにいる。<end>"
english = "No. We haven't been thrown far from the destination. Teleportation isn't a spell that can be used so freely. The caster must be nearby too.<end>"

["690019"]
japanese = "…そうだな。<line-break>この森から捜そう。<end>"
english = "Right. Let's start with this forest.<end>"

["690020"]
japanese = "おや、めずらしい。<line-break>お客様ですか？<end>"
english = "Well, this is unusual. A visitor?<end>"

["690021"]
japanese = "…くっ、やはり<line-break>アーギルシャイアの仲間か！<end>"
english = "Urgh... I knew it! You're with Argyleshire!<end>"

["690022"]
japanese = "違いますよ。<line-break>アーギルシャイアの仲間にご用なら<line-break>呼びましょう。<end>"
english = "No, I'm not. But if you have business with Argyleshire's companions, I can call one of them.<end>"

["690023"]
japanese = "呼んだかー？\u3000オルファウス。<end>"
english = "You called, Orphaus?<end>"

["690024"]
japanese = "…なんだ<line-break>このブサイクな猫は。<end>"
english = "What is this ugly cat?<end>"

["690025"]
japanese = "猫じゃない！<line-break>破壊神の円卓騎士のひとり、<line-break>ネモ様だ！<line-break>今でこそ、<line-break>こんな姿に変えられているが<line-break>本来は立派な魔人なんだ！<end>"
english = "I'm not a cat! I am Lord Nemo, one of the God of Destruction's Knights of the Round Table! I've been changed into this shape for the moment, but in my true form, I'm a magnificent demon!<end>"

["690026"]
japanese = "そこの方がアーギルシャイアのことで<line-break>お話があるようですよ、ネモ。<end>"
english = "It seems our visitor wishes to speak about Argyleshire, Nemo.<end>"

["690027"]
japanese = "俺は奴の同僚だが、保護者じゃない。<line-break>苦情なんか聞いてられるか。<end>"
english = "I'm her colleague, not her keeper. Why should I listen to complaints about her?<end>"

["690028"]
japanese = "それでも、ここまで来たということは\u3000<line-break>偶然ではない、ということです。<line-break>巡り合わせが働いているはずです。<line-break>中に入ってください。<line-break>お茶にしながら、お話を伺いましょう。<end>"
english = "Even so, the fact that you came this far cannot be mere coincidence. Some turn of fate must be at work. Please come inside. We can have tea while I hear what you have to say.<end>"

["690029"]
japanese = "…女、<line-break>俺に命令するな。<end>"
english = "Woman... don't order me around.<end>"

["690030"]
japanese = "女…って私は男ですよ。<line-break>アーギルシャイアの仲間でもないです。<line-break>そして、命令でなくて提案です。<line-break>それとも、さっきの一撃で<line-break>動けませんか？<line-break>加減はしたんですよ。<end>"
english = "Woman? I'm a man. Nor am I one of Argyleshire's companions. And that was a suggestion, not an order. Or did that last blow leave you unable to move? I did hold back.<end>"

["690031"]
japanese = "…くっ。<line-break>…すぐ行く。<end>"
english = "Urgh... I'll be right there.<end>"

["690032"]
japanese = "それは結構です。<line-break>待っていますね。<end>"
english = "Excellent. I'll be waiting.<end>"

["690033"]
japanese = "…そうですか、あなたは<line-break>ミイスの生き残りなんですね。<line-break>それで、アーギルシャイアを追った。<line-break>それならば、あなたがたは<line-break>聖杯を追うとよいでしょう。<end>"
english = "I see. You're a survivor of Miis. That's why you pursued Argyleshire. In that case, all of you should seek the Grail.<end>"

["690034"]
japanese = "…聖杯？<end>"
english = "The Grail?<end>"

["690035"]
japanese = "闇の神器、禁断の聖杯です。<line-break>アーギルシャイアは究極生物を作り上げ<line-break>この世界を破壊しようとしています。<line-break>その究極生物を作る方法を知るために<line-break>禁断の聖杯によって得られる<line-break>膨大な知識を利用するつもりなのです。<end>"
english = "The Dark Artifact known as the Forbidden Grail. Argyleshire intends to create the Ultimate Life-Form and use it to destroy this world. She means to draw upon the vast knowledge granted by the Forbidden Grail to learn how such a creature can be made.<end>"

["690036"]
japanese = "彼女が追っている聖杯を追えば\u3000\u3000\u3000\u3000<line-break>彼女といつか関わることに<line-break>なるでしょう。<end>"
english = "If you pursue the Grail she seeks, your paths will eventually cross.<end>"

["690037"]
japanese = "…で、聖杯はどこにある。<end>"
english = "So where is the Grail?<end>"

["690038"]
japanese = "ゴブゴブ団を名乗るゴブリンどもが<line-break>今、聖杯を持っている。<line-break>\u3000<line-break>聖杯の力で人間の言葉を<line-break>しゃべれるようになっている。<line-break>すぐわかるはずだ。<end>"
english = "A band of Goblins calling themselves the Gob-Gob Gang has the Grail now. Its power has given them the ability to speak the human tongue. You should recognize them at once.<end>"

["690039"]
japanese = "くすっ。<line-break>ネモはもとの姿に戻るために<line-break>彼らを操り、聖杯を盗ませたのですが、<line-break>知恵を付けた彼らに見放されて、\u3000\u3000\u3000<line-break>今もこの格好なんです。<end>"
english = "Heh. Nemo manipulated them into stealing the Grail so he could regain his true form. But once it gave them some intelligence, they abandoned him. That is why he still looks like this.<end>"

["690040"]
japanese = "うるさい！\u3000とにかく、<line-break>このままでは奴らが危ない。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>それに最悪、アーギルシャイアが<line-break>奴らがいる町ごと焼き払うことだって<line-break>あり得るんだ。ミイスのときみたいに！<end>"
english = "Shut up! The point is, they're in danger if this goes on. In the worst case, Argyleshire could burn down the entire town they're in, just like what happened to Miis!<end>"

["690041"]
japanese = "あなたなら、ご存じでしょう？<line-break>アーギルシャイアは気まぐれで残酷…。<line-break>\u3000<line-break>おもしろ半分に殺戮を楽しみ、<line-break>町を焼くことなどなんでもありません。<line-break>神器を奪うためならなおさらです。<end>"
english = "You know what Argyleshire is like. Capricious and cruel. She delights in slaughter for sport and thinks nothing of burning a town to the ground, especially if it means seizing an artifact.<end>"

["690042"]
japanese = "そういうわけで、新たな犠牲をだす前に<line-break>聖杯を取ってきてほしいのです。<line-break>お願いできるでしょうか？<end>"
english = "That is why I want you to retrieve the Grail before anyone else is sacrificed. Will you do it?<end>"

["690043"]
japanese = "聖杯はここに持ってきてくれれば\u3000\u3000<line-break>私が預かります。<line-break>\u3000<line-break>もっとも、私が信用できないなら、<line-break>あなたが責任持って<line-break>預かっていてくれてもかまいません。<end>"
english = "If you bring the Grail here, I will keep it safe. Of course, if you do not trust me, you may take responsibility for guarding it yourselves.<end>"

["690044"]
japanese = "そのあたりの判断は<line-break>あなた方にお任せします。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<end>"
english = "I leave that decision to you.<end>"

["690045"]
japanese = "あと、合成怪物を作る素材を<line-break>アーギルシャイアは求めています。\u3000<line-break>\u3000<line-break>最近、妖術宰相ゾフォルが<line-break>古代の闇の怪物、ティラの娘たちを<line-break>復活させています。<end>"
english = "Argyleshire is also seeking materials from which to create synthetic monsters. Recently, Zofor, the Sorcerous Chancellor, has been reviving the Daughters of Tira, ancient monsters of darkness.<end>"

["690046"]
japanese = "もしかすると、素材を求めて\u3000\u3000\u3000\u3000<line-break>それらの怪物たちを狩りに<line-break>彼女が現れるかもしれません。<end>"
english = "Argyleshire may appear to hunt those monsters for the materials she needs.<end>"

["690047"]
japanese = "それにしても、<line-break>無限のソウルを持つ者ですかぁ…。<line-break>\u3000<line-break>竜王が目覚め、闇の門が開き、<line-break>そして無限のソウルの<line-break>持ち主が現れる…。<end>"
english = "Still, the Bearer of the Infinite Soul... The Dragon King awakens, the Dark Gate opens, and the Bearer of the Infinite Soul appears...<end>"

["690048"]
japanese = "運命の女神も悪戯好きですねえ。<line-break>くすくす…。<line-break>\u3000<line-break><value:$28>さん、でしたね。<line-break>来てください。<line-break>説明したいことがあります。<end>"
english = "The Goddess of Fate does enjoy her little games. Heh heh... Your name was <value:$28>, wasn't it? Please come. There's something I'd like to explain.<end>"

["690049"]
japanese = "…行け。<line-break>殺す気はないらしい。<line-break>\u3000<line-break>殺す気なら<line-break>とうにやっている。<line-break>あいつは…強い。<end>"
english = "Go. It seems killing isn't the plan. If it were, it would've happened by now. That one... is strong.<end>"

["690050"]
japanese = "軽傷とはいえ、セラを<line-break>ケガさせてしまいましたんでね。<line-break>\u3000<line-break>つぐないに、微力ながら<line-break>お手伝いできること<line-break>ということで…。<end>"
english = "Sera's injuries may have been minor, but I was responsible for them. So, by way of atonement, I thought I might offer what little help I can.<end>"

["690051"]
japanese = "この子でも役立ててもらおうかな<line-break>と思うんです。<line-break>\u3000<line-break>この転送機は世界中の<line-break>たいていの所から<line-break>仲間を呼び出せます。<end>"
english = "I thought perhaps you could put this little one to use. This teleportation device can summon your companions from almost anywhere in the world.<end>"

["690052"]
japanese = "！？<end>"
english = "?!<end>"

["690053"]
japanese = "逆に、別れたい仲間を、望む所に<line-break>送り出してやることもできます。<end>"
english = "It works the other way, too: it can send companions you want to part ways with wherever they wish to go.<end>"

["690054"]
japanese = "あなたが将来、旅の途中で<line-break>さまざまな人と出会い、<line-break>仲間を増やしたとき、<line-break>たぶん、この子が<line-break>役に立ちますよ。<end>"
english = "Someday, when you've met all sorts of people on your travels and gathered more companions, this little one will probably come in handy.<end>"

["690055"]
japanese = "………………。<end>"
english = "...<end>"

["690056"]
japanese = "くすくす。<line-break>驚かせてしまってすみません。\u3000\u3000\u3000<line-break>\u3000<line-break>今後は呼び出す前に<line-break>相手の方に都合を確認します。<line-break>もう、こんなことはありませんから。<end>"
english = "Hee hee. I'm sorry I startled you. From now on, I'll make sure it's convenient before summoning anyone. This won't happen again.<end>"

["690057"]
japanese = "一緒に旅する仲間を変更したいときは<line-break>この猫屋敷に来てください。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ああ、すいません。<line-break>私ばかり話してしまって…。<end>"
english = "Whenever you want to change your traveling companions, come to Cat Manor. Ah, forgive me. I've been doing all the talking.<end>"

["690058"]
japanese = "無限のソウルとは<end>"
english = "What is the Infinite Soul?<end>"

["690059"]
japanese = "転送機について<end>"
english = "Tell me about the teleportation device.<end>"

["690060"]
japanese = "闇の神器について<end>"
english = "Tell me about the Dark Artifact.<end>"

["690061"]
japanese = "ネモについて<end>"
english = "Tell me about Nemo.<end>"

["690062"]
japanese = "アーギルシャイアについて<end>"
english = "Tell me about Argyleshire.<end>"

["690063"]
japanese = "質問はない<end>"
english = "I don't have any questions.<end>"

["690064"]
japanese = "フフ、それは秘密です。\u3000\u3000<line-break>ま、おいおい、わかりますよ。<line-break>\u3000<line-break>とりあえずはギルドで<line-break>仕事をしていってください。<line-break>\u3000<end>"
english = "Heh heh. That's a secret. You'll understand in time. For now, take on some work at the Guild.<end>"

["690065"]
japanese = "他人のために働くことで<line-break>魂を成長させていけば、<line-break>いずれ、わかってきますよ。<end>"
english = "As you work for the sake of others and allow your soul to grow, you'll gradually come to understand.<end>"

["690066"]
japanese = "将来、旅の途中で出会った仲間を<line-break>呼び出すための装置です。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>一緒に旅する仲間を変更したくなったら<line-break>この猫屋敷に来てください。<line-break>\u3000<end>"
english = "It's a device for summoning companions you meet on your future travels. Whenever you want to change your traveling companions, come to Cat Manor.<end>"

["690067"]
japanese = "一緒に旅をしたい仲間を呼び出したり、<line-break>別行動を取ることを決めた仲間を<line-break>送り出したりできますよ。<end>"
english = "You can summon companions you wish to travel with, or send off those who have decided to go their separate ways.<end>"

["690068"]
japanese = "破壊神ウルグの復活に用いられた<line-break>強力な魔道器です。<line-break>\u3000<line-break>１２種類あるといいます。<line-break>禁断の聖杯は<line-break>その中のひとつですね。<end>"
english = "They are powerful magical artifacts used to resurrect Ulugh, the God of Destruction. There are said to be twelve of them, and the Forbidden Grail is one.<end>"

["690069"]
japanese = "禁断の聖杯については<line-break>今、ゴブゴブ団という<line-break>３匹のゴブリンが持っています。<line-break>とりあえずは、<line-break>エンシャントを探してみると<line-break>彼らに会えると思いますよ。<end>"
english = "The Forbidden Grail is now in the hands of three Goblins called the Gob-Gob Gang. For now, try searching Ancient. I believe you'll find them there.<end>"

["690070"]
japanese = "ここにいるブサイクな猫です。\u3000\u3000\u3000\u3000<line-break>口は悪いですけど、無害ですよ。<line-break>\u3000<line-break>もともとは老人星の精霊で<line-break>天空の賢者とも呼ばれていましたが<line-break>地上に堕ちて、魔人になりました。<end>"
english = "The ugly cat right here. Foul-mouthed, but harmless. Originally a spirit of the Old Man Star, the cat was also known as the Sage of the Heavens, but fell to earth and became a demon.<end>"

["690071"]
japanese = "破壊神の強力な魔人、<line-break>１２人の円卓騎士のひとりで<line-break>名前を知るものという異名を持ちます。<end>"
english = "The cat is a powerful demon of the God of Destruction, one of the twelve Knights of the Round Table, with the epithet “The One Who Knows the Name.”<end>"

["690072"]
japanese = "円卓騎士には他に<line-break>アーギルシャイアなどがいますね。\u3000\u3000<line-break>\u3000<end>"
english = "The other Knights of the Round Table include Argyleshire.<end>"

["690073"]
japanese = "破壊神ウルグの円卓騎士のひとりです。<line-break>妖艶な美女の姿をしています。<line-break>\u3000<line-break>きわめて、気まぐれで残酷です。<line-break>すでに神器を手に入れるため<line-break>ミイスの村を焼き払っています。<end>"
english = "This is one of the Knights of the Round Table who serve Ulugh, the God of Destruction, and takes the form of an alluringly beautiful woman. This Knight is exceedingly capricious and cruel, and has already burned Miis Village to the ground in pursuit of a divine artifact.<end>"

["690074"]
japanese = "究極生物を作ろうとして、<line-break>その製法を禁断の聖杯から得ようと<line-break>ねらっています。<line-break>また、その究極生物の核には<line-break>グフトクを使おうと考えています。<line-break>\u3000<end>"
english = "This Knight seeks to create the Ultimate Life-Form and obtain the means to do so from the Forbidden Grail. Guftok is intended to serve as the creature's core.<end>"

["690075"]
japanese = "セラとは何か因縁があるようですが、<line-break>セラはそのことについて<line-break>一切、語ろうとしません。<line-break>円卓騎士には他に<line-break>うちのネモなどがいますね。<line-break>\u3000<end>"
english = "There seems to be some history between this Knight and Sera, but Sera refuses to say anything about it. There are other Knights of the Round Table as well, including our own Nemo.<end>"

["690076"]
japanese = "そうですか。<end>"
english = "I see.<end>"

["690077"]
japanese = "ま、こんな感じですかね。<line-break>わかっていただけましたか？<end>"
english = "Well, that about covers it. Does that make sense?<end>"

["690078"]
japanese = "聞きたいことがあれば<line-break>答えますよ。<end>"
english = "If there's anything you'd like to ask, I'll be happy to answer.<end>"

["690079"]
