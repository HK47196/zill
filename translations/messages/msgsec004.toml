["40000"]
japanese = "<if><value:$2C><less-equal>%9ここはロストール王宮だ。<line-break>許可のない者を通すことはできない。<line-break>ケガをしないうちにさっさと立ち去るがよい。<end><if><value:$2C><less-equal>%29ここはロストール王宮だ。お前のような<line-break>冒険者風情には縁のない場所のはず。冒険者は<line-break>飢えた者の迷宮でも探検しておればよいのだ。<end><if><value:$2C><less-equal>%49なんだ、なんだ！\u3000ここはロストール王宮、<line-break>冒険者ギルドではないぞ。冒険者は冒険者らしく<line-break>ルンホルスの森でも探検しておればよいのだ。<end>わ、わたしは誇り高きロストール騎士。たとえ<line-break>貴様が大陸でもっとも強い戦士だとしても、<line-break>無断で王宮にいれるわけにはいかんのだ。<end>"
english = "<if><value:$2C><less-equal>%9This is Rostorl Palace. No one may enter without permission. Leave now, before you get hurt.<end><if><value:$2C><less-equal>%29This is Rostorl Palace, no place for a mere adventurer like you. Go explore the Labyrinth of the Hungry or something.<end><if><value:$2C><less-equal>%49Now see here! This is Rostorl Palace, not the Adventurers' Guild. If you're an adventurer, go explore Runhols Forest or something.<end>I-I am a proud knight of Rostorl! Even if you are the strongest warrior on the continent, I cannot let you into the palace without permission.<end>"

["40001"]
japanese = "<select><value:$33>ここだけの話だが、国王であるセルモノー陛下は<line-break>政治にやる気をなくしていてな。国政はもっぱら<line-break>王妃のエリス様が取り仕切っていらっしゃる。<end>世間では王妃様のことを悪く言っているらしいが<line-break>私はそうは思わない。むしろ尊敬しているのだ。<line-break>ロストールに敵対する国や私利私欲のために<line-break>王政をないがしろにしようとする貴族を<line-break>王妃様が知略を駆使し排除してくださるから<line-break>今の平和があるのではないか。<end>ディンガルでは、魔王バロルを倒した勇者\u3000\u3000\u3000<line-break>ネメアが叔父のエリュマルク帝を殺して<line-break>ディンガル皇帝になったということだ。<line-break>叔父殺しに主君殺し…勇者も罪深い男になり<line-break>下がったものよ。しかし、無能なエリュマルク帝<line-break>と違って、ネメアは切れ者だからやっかいだな。<end>東方諸国の盟主ロセンを滅ぼしたディンガルの<line-break>青竜将軍が１６かそこらの少女だと聞いたのだが<line-break>それは本当なのか？\u3000私にはとても信じられん。<end>総司令ノヴィン様率いる我がロストール軍が<line-break>ディンガルのアンギルダンの奇襲で大敗し、<line-break>総司令は名誉の自決をされたそうだ。<line-break>しかし、ノヴィン様のご子息ゼネテス様が<line-break>弔い合戦に臨まれて見事に仇をとったとか…。<line-break>親の敵を子が討つとは、まさに騎士道だな。<end>リベルダムが陥落したそうだな。<line-break>カルラの次のねらいはロストールだろうが、<line-break>ゼネテス様がいる限り負けはせんぞ！<end>ディンガルのカルラが迫ってきている。<line-break>我々はここを死守せねばならぬのだ！<line-break>用がないなら早く立ち去れ！<end>ディンガルのカルラがこの地を狙っているのだ。<line-break>我々はここを死守せねばならぬ。<line-break>用がないなら早く立ち去れ！<end>"
english = "<select><value:$33>Just between us, His Majesty King Selmono has lost all interest in politics. Queen Eris handles nearly all affairs of state now.<end>People seem to speak ill of the queen, but I don't share that view. I respect her, in fact. Our present peace exists because she uses her wits to eliminate hostile nations and nobles who would undermine the monarchy for their own gain, does it not?<end>They say Nemea, the Hero who defeated Balor, Demon King, killed his uncle and lord, Emperor Eryumark, and made himself Emperor of Dingal. Uncle-slayer and lord-slayer... The Hero has fallen far indeed. But unlike the incompetent Eryumark, Nemea is a shrewd man. That makes him dangerous.<end>I heard the Azure Dragon General of Dingal who destroyed Rocen, leader of the Eastern Nations, is a girl of sixteen or thereabouts. Can that possibly be true? I find it very hard to believe.<end>Our Rostorl army, led by Commander-in-Chief Novin, suffered a crushing defeat in a surprise attack by Dingal's Angeerdan. They say the commander took his own life to preserve his honor. But his son, Xenetes, went into battle to avenge him and succeeded splendidly... A son avenging his father. That is chivalry itself.<end>So Liberdam has fallen. Rostorl will likely be Karula's next target, but with Xenetes here, we cannot lose!<end>Karula of Dingal is closing in. We must defend this place to the death! If you have no business here, leave at once!<end>Karula of Dingal has set her sights on this land. We must defend this place to the death. If you have no business here, leave at once!<end>"

["40002"]
japanese = "<if><value:$2A><less-equal>%49ここは、リューガ家当主、<line-break>レムオン様のお屋敷だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>用のない者は立ち去るがよい。<line-break>…もしや、貴様、<line-break>公爵様の様子をうかがいに来た<line-break>ファーロスの雌狐の密偵ではあるまいな？<end><if><value:$2A><less-equal>%120最近売り出し中の<value:$28>だと？<line-break>そのような者を通すよう命令されてはおらん。\u3000<line-break>さっさと立ち去るがよい。<end>お前が<value:$2B>の<line-break><value:$28>か。<line-break>有名人らしいが、お前を通すわけにはいかぬな。<end>"
english = "<if><value:$2A><less-equal>%49This is the residence of Lord Lemghon, head of House Ryuga. Leave if you have no business here. Wait... You wouldn't happen to be a spy for the Vixen of Pharos, sent to see what the duke is doing?<end><if><value:$2A><less-equal>%120You're <value:$28>, the one who's been making a name lately? I have no orders to admit anyone by that name. Be off with you.<end>So you're <value:$28>, the <value:$2B>. You may be famous, but I still can't let you in.<end>"

["40003"]
japanese = "<if><value:$2C><less-equal>%9ここは、リューガ家の流れをくむ、<line-break>ルブルグ伯タルテュバ様のお屋敷だ。\u3000\u3000\u3000<line-break>用のない者は立ち去るがよい。<line-break>…いやホント、早く行った方がいいぞ。<line-break>タルテュバ様は平民いじめが趣味の<line-break>貴族の家柄を鼻にかけたイヤな人だからな。<end><if><value:$2C><less-equal>%29どうした冒険者、道にでも迷ったのか？\u3000\u3000\u3000\u3000<line-break>ここは七竜家のひとつリューガ家をはじめとする<line-break>大貴族の方々のお屋敷が並ぶ通りだ。<line-break>七竜家は征服帝ランガスターを倒しロストールを<line-break>建国した七人の勇者の子孫で、王に匹敵する<line-break>権威をもつ恐ろしい方々なんだからな。<end><if><value:$2C><less-equal>%49お前…タルテュバ様を狙う刺客ではないのか。<line-break>そのただならぬ雰囲気、どこか怪しいぞ。<end>屋敷の前をちょろちょろするんじゃない。<line-break>用がないなら、どこかへ行け！<end>"
english = "<if><value:$2C><less-equal>%9This is the residence of Lord Tartyuba, Count of Ruburg, whose house descends from the Ryuga line. Leave if you have no business here. No, truly, you should go quickly. Lord Tartyuba is a nasty aristocrat who flaunts his pedigree and torments commoners for sport.<end><if><value:$2C><less-equal>%29What's wrong, adventurer? Lost your way? This street is lined with the estates of the highest nobles, including House Ryuga, one of the Seven Dragon Houses. Those Houses descend from the seven Heroes who defeated the Conqueror Emperor Lancaster and founded Rostorl. They're fearsome people whose authority rivals the king's.<end><if><value:$2C><less-equal>%49You... You're not an assassin after Lord Tartyuba, are you? There's something extraordinary about you. I don't trust it.<end>Stop skulking around the estate. If you have no business here, go somewhere else!<end>"

["40004"]
japanese = "<if><value:$2C><less-equal>%20ダルケニスを知っとるかの？<line-break>人間の生き血を吸う恐ろしい種族じゃ！<line-break>お前のような弱い者は奴らの餌食になるぞ。\u3000<line-break>ふぉふぉ、恐がることはないて。<line-break>もう、ダルケニスは冒険者に退治され尽くして<line-break>今時は、ほとんど絶滅しとるでな。<end><if><value:$2C><less-equal>%40人の生き血を吸う恐ろしいダルケニス族はのう、<line-break>月神セリューンの従者じゃから、新月の晩には<line-break>とーんでもない怪力の化け物になるんじゃよ。<line-break>新月の晩は１人で出歩かんことじゃて。<line-break>ふぉふぉ、恐いじゃろ。でも安心せい、<line-break>ダルケニスはほとんど全滅しとるでな。<end>新月の塔を知っておるかの？<line-break>あそこは、ダルケニス族の聖地と呼ばれとる。<line-break>一度行ってみるとええじゃろうて。<end>"
english = "<if><value:$2C><less-equal>%20Have you heard of the Darkenis? A fearsome race that drinks human blood! A weakling like you would be easy prey. Ho ho, no need to be frightened. Adventurers have hunted the Darkenis so thoroughly that they're nearly extinct now.<end><if><value:$2C><less-equal>%40The dreadful Darkenis drink human blood, you know. As servants of the moon god Seryune, they turn into monsters of tremendous strength on nights of the new moon. Never go out alone on such a night. Ho ho, frightening, isn't it? But don't worry. The Darkenis have almost been wiped out.<end>Have you heard of New Moon Tower? It's known as a sacred place of the Darkenis. You should visit it sometime.<end>"

["40005"]
japanese = "<select><value:$33>王妃エリス様のことを、ファーロスの雌狐って<line-break>バカにする奴らがいるけど<line-break>とんでもないことさね！<line-break>王妃様の知略で、分断の山脈から南、<line-break>ロストールに逆らう国はみんな滅びちまった。<line-break>近頃は戦もない。これも王妃様のおかげさね。<end>この間の地震はすごかったね。ディンガルじゃ<line-break>ノトゥーン神殿の天井が壊れたそうじゃないか。<line-break>悪いことの前ぶれでなければいいんだけどねぇ。<end>ディンガルのネメアが謀反を起こしたって話を\u3000<line-break>聞いたかい！\u3000ネメアが殺した皇帝は、自分の<line-break>叔父さんだっていうじゃないか。<line-break>まったく恐ろしい世の中になっちまったもんさ。<line-break>ロストールが平和なのは、エリス様が謀反を<line-break>起こしそうな人間を排除したおかげかもねえ。<end>ディンガル帝国がロセン王国を攻め滅ぼしたって<line-break>話じゃないか。エリス様がいる限り、ロストール<line-break>には攻めてこないと思うけど…心配だねえ。<end>ディンガル軍が分断の山脈を越えて\u3000\u3000\u3000\u3000\u3000\u3000<line-break>すぐそこまで攻めて来てるらしいじゃないか！<line-break>迎撃のロストール軍は壊滅したっていうし…。<line-break>自決した総司令ノヴィン様に代わって軍の指揮を<line-break>とることになった、息子のゼネテスはどうなった<line-break>んだろうか？\u3000勝ったのかい、それとも…。<end>ディンガルが、とうとうリベルダムまで<line-break>占領しちゃったよ。次はロストールの番…。<line-break>ああ、どうすりゃいいんだろうねえ。<end>血なまぐさいことばかり起きて…ふう。<line-break>ついこの間までは、子供たちの笑い声が<line-break>絶えない、平和な時間が過ごせたってのに…。<end>あのネメアが死んだって話だよ。<line-break>これで平和な時間が戻ってきて<line-break>欲しいものだけど…。<end>"
english = "<select><value:$33>Some fools mock Queen Eris by calling her the Vixen of Pharos, but they're dead wrong! Through the queen's cunning, every country south of the Dividing Mountains that defied Rostorl has been destroyed. There hasn't been a war lately, either. We owe that to the queen.<end>That last earthquake was terrible. I hear the ceiling of Notun Temple in Dingal collapsed. I only hope it wasn't a sign of something worse to come.<end>Did you hear that Nemea has rebelled in Dingal? They say the emperor he killed was his own uncle! What a dreadful age we live in. Perhaps Rostorl is peaceful because Eris has disposed of anyone likely to rebel.<end>They say the Dingal Empire attacked and destroyed the Kingdom of Rocen. I don't think they'll attack Rostorl while Eris is here, but... I still worry.<end>They say the Dingal Army has crossed the Dividing Mountains and is almost upon us! And the Rostorl army sent to meet it was wiped out... Xenetes took command after his father, Commander-in-Chief Novin, killed himself. I wonder what became of him. Did he win, or...?<end>Dingal has finally occupied Liberdam. Rostorl will be next... Oh, what are we going to do?<end>Nothing but bloodshed, one thing after another... To think that only a short while ago, we lived in peace, with children's laughter always in the air...<end>They say Nemea is dead. I only hope peaceful days will return now...<end>"

["40006"]
japanese = "<if><value:$2A><less-equal>%50冒険者ってもうかるのかーい？<line-break>ロストールじゃ貴族の子供しか貴族になれない<line-break>から、平民は才能があっても平民なのさー。<line-break>普通に働いてちゃ、金持ちになれないのさー。<line-break>冒険者がもうかる仕事なら、ボクも転職して<line-break>冒険者になろうと思っているけど、どーだい？<end><if><value:$2A><less-equal>%150冒険者ってとーっても危険らしいじゃーん。\u3000\u3000<line-break>ボクは才能にあふれる男だけど、危険なことは<line-break>しない主義なのさー。<line-break>だから冒険者になるのはやめることにしたよー。<line-break>冒険者は有名にならないとダメなんだろー。<line-break>キミの噂はぜーんぜん聞かないよ、どしたのー？<end>やあ、<value:$2B>さーん。<line-break>キミもけっこう有名人みたいじゃーん。\u3000\u3000<line-break>ボクが水面下で宣伝活動したおかげだよー。<line-break>えっ！\u3000ボクかーい？<line-break>ボクは相変わらずダイアモンドの原石さー。<line-break>磨いてくれる人はどこなのかなー。<end>"
english = "<if><value:$2A><less-equal>%50Does adventuring pay? In Rostorl, only the children of nobles can become nobles, so a commoner stays a commoner no matter how talented he is. You can't get rich working an ordinary job. If adventuring pays well, I might change careers and become an adventurer myself. What do you think?<end><if><value:$2A><less-equal>%150I hear adventuring is terribly dangerous. I'm a man of boundless talent, but I make it a rule never to do anything dangerous. So I've decided not to become an adventurer. An adventurer has to be famous, doesn't he? I've never heard a thing about you. How come?<end>Why, hello, <value:$2B>! You seem to be getting rather famous. All thanks to the discreet publicity I've been doing for you. What, me? I'm still a diamond in the rough. Now where is the person who'll polish me?<end>"

["40007"]
japanese = "<select><value:$33>森を出て、旅に出ているんですが…<line-break>世界は人間でいっぱいですね。<line-break>我々エルフなどの妖精種族の数は少ない…。<line-break>冒険エルフの祖、ラミュ様のおっしゃるとおり<line-break>エルフも森を出て、活動をしなければ<line-break>世界は人間種族だけのものになってしまう！<end>森を出て、旅に出ているんですが…<line-break>世界は人間でいっぱいですね。<line-break>我々エルフなどの妖精種族の数は少ない…。<line-break>冒険エルフの祖、ラミュ様のおっしゃるとおり<line-break>エルフも森を出て、活動をしなければ<line-break>世界は人間種族だけのものになってしまう！<end>この国の人間は我々エルフのような妖精種族より<line-break>自分たちの方が優れているとでも思っているの<line-break>ですか！\u3000我々に対する態度は許し難いです。<line-break>数に任せておごる人間は必ず報いを受けます。<line-break>いえ、あなたは別ですよ。あなたは相手の種族や<line-break>生まれなど気にしない人でしょうから。<end>我々エルフの住む森にはオモヒキと名付けられた<line-break>巨大な霊樹が１本ずつあります。オモヒキは幹に<line-break>触れて思いを強く念じると他のオモヒキに思いが<line-break>届くという不思議な樹です。それぞれのエルフの<line-break>森の指導者であるクィーダはオモヒキに念じる<line-break>ことでお互いに連絡を取り合っているのです。<end>冒険エルフの祖、ラミュ様は、８００年ほど前に<line-break>ともに旅をする仲間たちと破壊神ウルグの復活を<line-break>目論んでいた邪竜エルアザルを倒したそうです。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>古の樹海には、エルフの聖地があります。<line-break>そこに無限のソウルを持つ者がたどり着けば、<line-break>究極のソウルを宿すといわれています。<line-break>あなたには普通の人間と違う力を感じます。<line-break>だから、このような秘密までも明かして<line-break>しまうのでしょうか…。<end>"
english = "<select><value:$33>I've left the forest to travel, but... the world is full of humans, isn't it? There are so few of the faerie races, including us Elves. Ramyu, forebear of the adventuring Elves, was right: unless Elves leave the forests and take action, this world will belong to humankind alone!<end>I've left the forest to travel, but... the world is full of humans, isn't it? There are so few of the faerie races, including us Elves. Ramyu, forebear of the adventuring Elves, was right: unless Elves leave the forests and take action, this world will belong to humankind alone!<end>Do the humans of this country imagine themselves superior to faerie races such as the Elves? Their treatment of us is intolerable. Humans grown arrogant on the strength of their numbers will surely pay for it. No, I don't mean you. You don't care about anyone's race or birth.<end>Every forest inhabited by Elves has a single enormous spirit tree called an Omohiki. If you touch its trunk and concentrate strongly on a thought, that thought will reach the other Omohiki. The Quida who lead each Elven forest communicate with one another by sending their thoughts through these trees.<end>They say that around eight hundred years ago, Ramyu, forebear of the adventuring Elves, and a band of traveling companions defeated Eluazar, an Evil Dragon plotting to revive Urg, the God of Destruction.<end>There is a sacred place of the Elves in the Ancient Forest. It is said that the Bearer of the Infinite Soul will receive the Ultimate Soul upon reaching it. I sense a power in you unlike that of an ordinary human. Perhaps that is why I find myself revealing even a secret such as this...<end>There is a sacred place of the Elves in the Ancient Forest. It is said that the Bearer of the Infinite Soul will receive the Ultimate Soul upon reaching it. I sense a power in you unlike that of an ordinary human. Perhaps that is why I find myself revealing even a secret such as this...<end>There is a sacred place of the Elves in the Ancient Forest. It is said that the Bearer of the Infinite Soul will receive the Ultimate Soul upon reaching it. I sense a power in you unlike that of an ordinary human. Perhaps that is why I find myself revealing even a secret such as this...<end>"

["40008"]
japanese = "<if><value:$2A><less-equal>%50どこかに有名人はいないかなー。\u3000\u3000\u3000\u3000<line-break>あたし有名人に会うのが夢なの。<line-break>あなた、有名人に会ったことなーい？<line-break>魔王バロルを倒した勇者ネメアとか。<line-break>ディンガル統一時に活躍した赤い巨星<line-break>アンギルダンとかさー。<end><if><value:$2A><less-equal>%100ファーロス家のゼネテス様は冒険者を\u3000\u3000\u3000\u3000<line-break>してるんだってー。あなたも冒険者なら<line-break>ゼネテス様に会ったことぐらいあるでしょ？<line-break>どこに行けば会えるか教えてくれないかなー。<line-break>ゼネテス様ったら、あまりにあたしがかわいい<line-break>から一目ぼれしちゃったりしてぇ、うふふ。<end><if><value:$2A><less-equal>%150今、一番会いたい有名人は<value:$28>よ。<line-break>どんな人かは知らないけど、きっとステキな<line-break>人にちがいないわー。どこにいるのかなー。<end>きゃっ！\u3000もしかして<value:$28>さん？<line-break>やったぁ、あなたに会うのが夢だったのー。<line-break>あたしって運がいいわー。<end>"
english = "<if><value:$2A><less-equal>%50I wonder if there are any famous people around. It's my dream to meet someone famous. Haven't you ever met one? Nemea, the Hero who defeated Balor, Demon King, perhaps. Or Angeerdan, the Red Giant who distinguished himself during the unification of Dingal.<end><if><value:$2A><less-equal>%100I hear Xenetes of House Pharos is an adventurer. You're an adventurer too, so you must have met him at least once, right? Won't you tell me where I can find him? Maybe he'll see how pretty I am and fall in love at first sight. Hee hee.<end><if><value:$2A><less-equal>%150The famous person I want to meet most right now is <value:$28>. I don't know what kind of person that is, but anyone that famous must be wonderful. Where could that person be?<end>Oh! Could you be <value:$28>? Hooray! I've always dreamed of meeting you. I'm so lucky!<end>"

["40009"]
japanese = "<select><value:$33>つつましやかで影から男を立てるのが<line-break>ロストール女性の美徳だったはずだ。\u3000\u3000\u3000\u3000<line-break>それを王妃エリス…あのファーロスの雌狐め。<line-break>夫であるセルモノー陛下や兄のノヴィン様を<line-break>ないがしろにし国政を牛耳るとは！<line-break>まったくもって、許しがたい事態だ！<end>つつましやかで影から男を立てるのが<line-break>ロストール女性の美徳だったはずだ。\u3000\u3000\u3000\u3000<line-break>それを王妃エリス…あのファーロスの雌狐め。<line-break>夫であるセルモノー陛下や兄のノヴィン様を<line-break>ないがしろにし国政を牛耳るとは！<line-break>まったくもって、許しがたい事態だ！<end>ディンガルじゃ武勇にすぐれたネメアが\u3000\u3000\u3000<line-break>前の皇帝エリュマルクを殺して、<line-break>自ら帝位についたそうじゃないか。<line-break>いかにファーロスの雌狐が悪知恵のきく女でも<line-break>戦争になっちまったらどうしようもないだろ。<line-break>今こそ、国王陛下やノヴィン様の出番だな。<end>ディンガルが東方国家の盟主ロセンを占領した<line-break>そうじゃないか。これではっきりしただろ。<line-break>ディンガルは大陸統一を目指してるんだよ。<line-break>我が国も早急に軍備を整えて迎撃しなくては<line-break>ならんのだ。ファーロスの雌狐ごときに<line-break>任せておいてはダメなんだよ！<end>ああ、なんということだ…。いかに予想外の\u3000\u3000<line-break>奇襲だったとはいえ、こうも簡単に我が軍が<line-break>破れてしまうとは…。<line-break>大陸最強と呼ばれた竜騎軍が破れさり、<line-break>総司令のノヴィン様も自決されたという。<line-break>ロストールはこれからどうなってしまうのだ…。<end>ゼネテス様がアンギルダンを破って、<line-break>平和になったと思ったら、今度はカルラが<line-break>リベルダムを滅ぼしたというではないか。<line-break>次はロストールに攻めてくるに違いない。<line-break>エリスの雌狐が国政を牛耳っておるから、<line-break>ディンガルごときになめられるのだ！<end>いかにゼネテス様が名将でも、先の戦いで兵力の<line-break>大半を失ったロストール軍では、カルラの侵攻を<line-break>防ぐことはできないだろう…。<end>もう、何もかも終わりだ。<line-break>すべては雌狐エリスのせいなんだよ！<line-break>ああ…救世主エルファス様、私はどうすれば…。<end>"
english = "<select><value:$33>Modesty and supporting men from behind the scenes were once the virtues of Rostorl women. But Queen Eris, that Vixen of Pharos, disregards her husband, His Majesty Selmono, and her brother, Lord Novin, while seizing control of the government! It is utterly intolerable!<end>Modesty and supporting men from behind the scenes were once the virtues of Rostorl women. But Queen Eris, that Vixen of Pharos, disregards her husband, His Majesty Selmono, and her brother, Lord Novin, while seizing control of the government! It is utterly intolerable!<end>They say Nemea, a great warrior, killed the former emperor Eryumark and took Dingal's throne for himself. The Vixen of Pharos may be a cunning woman, but her schemes will be worthless once war begins. Now is the time for His Majesty and Lord Novin to act.<end>Dingal has occupied Rocen, leader of the Eastern Nations. Surely it's clear now: Dingal intends to unite the continent. We must prepare our army at once and meet the attack. We cannot leave this to a mere Vixen of Pharos!<end>Oh, how could this happen...? The attack may have caught us by surprise, but how could our army fall so easily? The Dragon Cavalry, called the strongest force on the continent, has been routed, and Commander-in-Chief Novin is said to have taken his own life. What will become of Rostorl now...?<end>Just when Xenetes defeated Angeerdan and peace seemed restored, Karula destroyed Liberdam. Rostorl is sure to be next. Dingal dares treat us with contempt because that vixen Eris controls the government!<end>Xenetes may be a brilliant commander, but Rostorl's army lost most of its strength in the last battle. It cannot stop Karula's invasion...<end>It's over. Everything is over. This is all the fault of that vixen Eris! Oh... Lord Elfas, Savior, what am I to do...?<end>"

["40010"]
japanese = "<select><value:$20>%3ロストールは竜王様の加護を受けておる国。<line-break>わしを含めた国民のほとんどが<line-break>竜王様を神とあがめておるですじゃ。<line-break>はああ、ありがたや、ありがたや。<line-break>今日も竜王様のおかげで、<line-break>平和に１日が過ぎておりますじゃ。<end>昔々ディンガルの野心的な征服帝ランガスターが<line-break>諸国を滅ぼし世界を統一しようとしたとき、<line-break>７人の勇者が現れたそうですじゃ。<line-break>竜王様に導かれ七竜士と呼ばれた勇者たちは<line-break>ランガスターを激闘の末、倒したそうですじゃ。<line-break>その後彼らが建国したのがロストールですじゃ。<end>死んだ爺さんが言っておりました。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>爺さんがお城の番兵をしとったころ、お城の<line-break>地下に奇妙な通路を見つけたそうですじゃ。<line-break>その奥にはふたつ出口があったらしいのじゃが、<line-break>爺さんは恐くなって引き返したそうですじゃ。<line-break>その通路が何なのか知りたいものですじゃ。<end>"
english = "<select><value:$20>%3Rostorl is a land blessed by the Dragon King. Nearly all its people, myself included, worship the Dragon King as a god. Ah, praise be, praise be. Thanks to the Dragon King, another day passes in peace.<end>Long ago, when Dingal's ambitious Conqueror Emperor Lancaster sought to destroy every nation and unite the world, seven Heroes are said to have appeared. Guided by the Dragon King, those Heroes became known as the Seven Dragon Warriors, and after a fierce battle they defeated Lancaster. They then founded Rostorl.<end>I once heard this from an old man who's since died. Back when he served as a guard at the castle, he found a strange passage beneath it. Apparently there were two exits at the far end, but he grew frightened and turned back. I would dearly like to know what that passage was.<end>"

["40011"]
japanese = "<select><value:$33>レムオン公爵と王妃エリス様が\u3000\u3000\u3000<line-break>宮廷で争っているあいだ、<line-break>地方のことなんてほったらかしだ。\u3000<line-break>この南にあるノーブルってところじゃ<line-break>ボルボラっていう悪代官が<line-break>幅をきかしてるってさ。<end>この間の地震と世界中に響きわたるような<line-break>うなり声は聞いただろう？<line-break>あれは竜王の覚醒と呼ばれるものらしいぞ。<end>勇者ネメア、主君エリュマルク帝を廃し、\u3000\u3000<line-break>自らディンガル皇帝の座に着くってのが、<line-break>今一番世界を騒がせている事件だよ。<line-break>その昔、邪眼帝バロルが自分の仕えていた<line-break>皇帝を殺して帝位を奪い魔王となったように、<line-break>ネメアも魔王になるのかもな。<end>ロセンを攻め滅ぼしたディンガルの青竜将軍は\u3000<line-break>若干１６歳の女の子なんだと。いや、ほんとに。<line-break>ロセンは弱体化してるっていうけどロセン王は<line-break>戦闘用モンスターをリベルダムから大量に買って<line-break>いたそうだから、決して弱くはないはずだぜ。<line-break>俺は彼女の実力は本物だと思うけどな。<end>ロセンの次はいきなり山越えでロストールかよ。<line-break>ロセンは東方の脅威だから攻めたのも納得できる<line-break>けど、ロストールを攻めてどうする気なんだ。<line-break>まさか、ネメアは征服帝ランガスターの真似でも<line-break>して世界を征服するつもりなのかよ。<line-break>魔王を倒した勇者の名が聞いてあきれるぜ。<end>リベルダムを占領するだけならまだしも、<line-break>破壊してしまうなんて、何を考えてるんだ！<line-break>ロセンを第２のリベルダムにするためかよ！<end>カルラがロストールに攻めてくるっていうのに、<line-break>貴族どもはつまらん権力争いを続けている。<line-break>国が滅んでも貴族でいられると思っているのか！<end>救世主エルファス様の予言通り、<line-break>世界の終わりが近づいているような気がするよ。<line-break>俺もガラじゃないが、神に祈ってみるか…。<end>"
english = "<select><value:$33>While Duke Lemghon and Queen Eris fight at court, no one gives a damn about the provinces. Down south, in a place called Noble, a corrupt magistrate named Bolbora is throwing his weight around.<end>You heard that last earthquake, and the roar that seemed to echo across the whole world, didn't you? Apparently that event is called the Dragon King's Awakening.<end>The event setting the whole world abuzz is this: Nemea the Hero deposed his lord, Emperor Eryumark, and took the throne of Dingal himself. Long ago, Balor, the Evil-Eyed Emperor, killed the emperor he served, seized the throne, and became a Demon King. Maybe Nemea will become one too.<end>They say Dingal's Azure Dragon General, the one who destroyed Rocen, is a sixteen-year-old girl. No, really. Rocen may have been weakened, but its king had apparently bought large numbers of war monsters from Liberdam, so it couldn't have been helpless. I think the girl's ability is the real thing.<end>After Rocen, Dingal suddenly crosses the mountains and comes for Rostorl? I can understand attacking Rocen, since it threatened the east, but what does Nemea hope to gain by attacking Rostorl? Is he planning to imitate the Conqueror Emperor Lancaster and conquer the world? So much for the Hero who defeated the Demon King.<end>Occupying Liberdam would have been bad enough, but destroying it? What are they thinking? Do they want to turn Rocen into a second Liberdam?<end>Karula is coming to attack Rostorl, and those damned nobles are still squabbling over power. Do they think they'll remain nobles after the country is destroyed?<end>It feels as if the end of the world is drawing near, just as Lord Elfas, the Savior, prophesied. Praying isn't like me, but perhaps I'll give it a try...<end>"

["40012"]
japanese = "<select><value:$20>%3備えあれば憂いなし。<line-break>道具屋で元気の薬なんかは<line-break>しっかり、買い求めておくとよいぞ。<end>空を飛んでいる敵を攻撃するには、<line-break>弓が有利なんじゃ。片手剣や両手剣では<line-break>敵に届かんからなかなか命中せんぞ。<end>もしや、鍛冶屋をお探しかの？<line-break>向こう側に地下に降りる階段が見えるじゃろう。<line-break>鍛冶屋はこの下にあるんじゃよ。<end>"
english = "<select><value:$20>%3It pays to be prepared. Make sure you buy supplies such as Restorative Medicine at the item shop.<end>A bow is best for attacking enemies in the air. One-handed and two-handed swords cannot reach them properly, so your blows will rarely land.<end>Are you looking for the smithy? You can see the stairs leading underground across the way, can't you? The smithy is down there.<end>"

["40013"]
japanese = "<if><value:$2C><less-equal>%9アクセサリーは<line-break>ただの飾りじゃないんですよ。<line-break>上手に使えば本当に役に立つんですから。<line-break>ひ弱な私は体力の首飾りをつけて<line-break>自分の弱点を補強して<line-break>冒険に出ているんですよ。<end><if><value:$2C><less-equal>%29アクセサリーは２個まで装備できることは\u3000\u3000<line-break>ご存知ですよね。装備する組み合わせを考えて<line-break>いると眠れなくなりませんか？<line-break>私もいろいろ迷った結果、体力の首飾りと<line-break>知恵の首飾りを装備して弱点の補強と<line-break>強みの強化をすることにしました。<end><if><value:$2C><less-equal>%49戦闘中のマヒと石化は困りものですよね。<line-break>防具に石化の特殊効果をつければ防げるの<line-break>ですが、お金も錬剛石もなくて無理なんです。<end>闇の神器を集めて破壊神ウルグを復活させ、<line-break>それを倒すことができれば、<line-break>その力を得ることができるといいます。<line-break>しかし、破壊神を倒すことなど<line-break>できるのでしょうか？<end>"
english = "<if><value:$2C><less-equal>%9Accessories aren't merely decorative. Used properly, they can be genuinely useful. I'm rather frail, so I wear a Vitality Necklace to make up for that weakness when I go adventuring.<end><if><value:$2C><less-equal>%29You know you can equip up to two accessories, don't you? Doesn't deciding on the right combination keep you awake at night? After much agonizing, I chose a Vitality Necklace and a Wisdom Necklace, one to shore up my weakness and the other to strengthen what I'm good at.<end><if><value:$2C><less-equal>%49Paralysis and petrification are dreadful in battle, aren't they? You can prevent petrification by adding its special effect to your armor, but I don't have the money or Tempering Stones.<end>They say that if you gather the Dark Artifacts, revive Urg, the God of Destruction, and manage to defeat the deity, you can gain that power. But is it truly possible to defeat the God of Destruction?<end>"

["40014"]
japanese = "<if><value:$2A><less-equal>%30冒険している途中に怪しげな花や岩を<line-break>目にすることがあると思う。<line-break>そんな時は調べて見ろ。<line-break>そいつが拾えるかもしれないぜ。<line-break>もっとも、持っていると危険な<line-break>ものかもしれないがな。<end><if><value:$2A><less-equal>%75ダンジョンや洞窟でやっかいなのは、<line-break>モンスターなんかよりも、むしろ罠だぜ。<line-break>特に宝箱にしかけられた呪いガスの罠。<line-break>ダンジョンの奥深くであれを食らうと、<line-break>もうダメだぜ。<end><if><value:$2A><less-equal>%120アンチハードルをタイミングよく使うことが<line-break>できるなら、難易度が高い罠でも、<line-break>楽に解除できるんだろうがな。<end>ネガヴァニティアのソウルを持つ者が、<line-break>新月の塔の屋上に登ると、デモリッシュという<line-break>闇の禁呪が身に付くらしいぞ。<line-break>あんたくらいの冒険者なら、<line-break>もう知っていたかもしれないがな。<end>"
english = "<if><value:$2A><less-equal>%30While you're out adventuring, you may come across suspicious-looking flowers or rocks. Examine them when you do. You might be able to pick something up. Of course, it may be dangerous to carry.<end><if><value:$2A><less-equal>%75In dungeons and caves, traps are more trouble than monsters. Cursed-gas traps on treasure chests are especially nasty. Spring one deep in a dungeon and you're finished.<end><if><value:$2A><less-equal>%120If you can use Anti-Hurdle at the right moment, I suppose even a difficult trap would be easy to disarm.<end>They say anyone with the Negavanitia Soul who reaches the roof of New Moon Tower will learn a dark Forbidden Spell called Demolish. An adventurer of your caliber may already know that.<end>"

["40015"]
japanese = "<if><value:$2C><less-equal>%9救助の依頼を受けたら、行きがけに出会った<line-break>モンスターを倒しておいた方がいいよ。<line-break>そうすれば帰り道が楽になるから。<end><if><value:$2C><less-equal>%29ロストールの西にあるルンホルスの森は\u3000\u3000\u3000<line-break>気味悪い形の木ばかりで不気味な森だよね。<line-break>なんでも闇の力の影響を受けているそうだよ。<line-break>だから、森の奥に行くとモンスターが凶暴に<line-break>なっちゃうのかもしれないね。<line-break>奥にはいったい何があるんだろうか？<end><if><value:$2C><less-equal>%49珍しい品物を高く買いますよ、<line-break>なんてフゴーの秘書ダイダロに言われたけど、<line-break>珍しい物なんてめったに手に入らないよ。<end>フゴーは有名人の装備品を<line-break>高く買ってくれるそうですよ。<line-break>あなたの装備品なら買ってくれそうですね。<end>"
english = "<if><value:$2C><less-equal>%9When you take a rescue job, kill any monsters you meet on the way in. That will make the return journey easier.<end><if><value:$2C><less-equal>%29Runhols Forest, west of Rostorl, is an eerie place full of grotesquely shaped trees. They say it's under the influence of dark power. Perhaps that's why the monsters grow fiercer the farther in you go. I wonder what's waiting in its depths.<end><if><value:$2C><less-equal>%49Hugo's secretary, Daidalo, told me he'd pay well for rare items, but rare things are hard to come by.<end>I hear Hugo pays well for equipment that belonged to famous people. He might buy yours.<end>"

["40016"]
japanese = "<select><value:$33>なるほど、なるほど…。<line-break>いやあ、この人たちの言うことは<line-break>新米の僕には勉強になるなあ。<line-break>ねえ、君も<line-break>この人たちの言うことを聞いて<line-break>僕と一緒に勉強しないかい？<end>なるほど、なるほど…。<line-break>いやあ、この人たちの言うことは<line-break>新米の僕には勉強になるなあ。<line-break>ねえ、君も<line-break>この人たちの言うことを聞いて<line-break>僕と一緒に勉強しないかい？<end>冒険者って装備品にこだわりを持っている<line-break>もんなんだね。いつも両手剣を使ってる先輩に<line-break>槍をプレゼントしたら怒られちゃったよ。<end>ソウルを変えると、習得していないスキルは使え<line-break>なくなっちゃうんだね。この前ソウルをうっかり<line-break>変えて、魔法が使えなくなって困ったよ。<end>剣聖レーグのように、両手に剣を持って\u3000\u3000\u3000<line-break>戦えるようになるスキルがあるらしいよ。<line-break>たしかダブルブレードだったかな。<line-break>どうやったら習得できるのかは僕も<line-break>知らないけど、ソウルの影響を受けない<line-break>独立したスキルだってことはわかってるんだ。<end>僕の今のソウルはアルバレストなんだけど、<line-break>ウォーロックのロースペルは役に立つから<line-break>スキルポイントを貯めて習得することにするよ。<end>装備品を鍛えるために必要な錬剛石は<line-break>ゼグナ鉱山に落ちているんだ。<line-break>見つけたら教えてあげるよ。<end>ふふふふ…ぼくも今や立派な冒険者ですよ。<line-break>初心者なんて言わせません。<line-break>えっ！\u3000属性の強弱関係ですか…そ、それは…。<end>"
english = "<select><value:$33>Ah, that makes sense... Everything these people say is useful to a novice like me. Why don't you listen too, and learn along with me?<end>Ah, that makes sense... Everything these people say is useful to a novice like me. Why don't you listen too, and learn along with me?<end>Adventurers really are particular about their equipment. I gave a spear to a senior adventurer who always uses a two-handed sword, and he got angry with me.<end>So when you change Souls, you can't use skills you haven't learned. I changed mine by mistake the other day and suddenly couldn't cast magic. That was a problem.<end>Apparently there's a skill that lets you fight with a sword in each hand, like Reig the Sword Saint. I think it was called Double Blade. I don't know how to learn it, but I do know it's an independent skill, unaffected by your Soul.<end>My current Soul is Arbalest, but the Warlock skill Low Spell is useful, so I've decided to save up Skill Points and learn it.<end>The Tempering Stones needed to strengthen equipment can be found lying around Zegna Mine. I'll let you know if I find any.<end>Heh heh heh... I'm a proper adventurer now. No one can call me a beginner anymore. What? The strengths and weaknesses of the elements? Th-that is...<end>"

["40017"]
japanese = "<select><value:$20>%3この酒場の看板娘、フェルムちゃんは<line-break>明るくて、かわいくて、みんなの人気者じゃ。<line-break>みんな、フェルムちゃん目当てでここに来る。<line-break>もっとも、わしだけは、違うぞ。<line-break>酒場で情報を手に入れるために来とるんじゃ。<line-break>…しかし、フェルムちゃんはかわいいのう。<end>よそから来たえたいの知れない男どもが<line-break>フェルムちゃんに付きまとっておる。<line-break>奴らもフェルムちゃんにほれておるのかのう。<end>ロストールには酒場が２件あるのじゃよ。<line-break>広場の西側にスラムがあってな、<line-break>そこにも酒場があるんじゃ。穴場じゃぞ。<end>"
english = "<select><value:$20>%3Ferme, this tavern's darling, is cheerful, pretty, and loved by everyone. They all come here just to see her. Not me, of course. I come to gather information. Still... Ferme certainly is pretty.<end>Some suspicious men from out of town have been following Ferme around. I wonder if they've fallen for her too.<end>There are two taverns in Rostorl. The Slums lie west of the square, and there's another tavern there. A well-kept secret, that one.<end>"

["40018"]
japanese = "<select><value:$33>あたしはリルビーの吟遊詩人なのん。<line-break>旅をして、いろんな国を見ているわ。\u3000\u3000\u3000\u3000\u3000<line-break>それにしても、この国は平和よねえ。<line-break>王妃エリスとエリエナイ公レムオンの<line-break>派閥争いが一番の問題なんですもの。<line-break>ロセンなんて愚王ペウダの支配で大変なのにぃ。<end>あたしはリルビーの吟遊詩人なのん。<line-break>旅をして、いろんな国を見ているわ。\u3000\u3000\u3000\u3000\u3000<line-break>それにしても、この国は平和よねえ。<line-break>王妃エリスとエリエナイ公レムオンの<line-break>派閥争いが一番の問題なんですもの。<line-break>ロセンなんて愚王ペウダの支配で大変なのにぃ。<end>勇者ネメアが新しいディンガル皇帝になったの。<line-break>ディンガルの人たちは新皇帝を歓迎しているよう<line-break>だけど、前の皇帝はホントにかわいそうだよぉ。<line-break>だ～って、さんざん皇帝の器じゃないって陰口<line-break>たたかれて、目障りなネメアを処刑しようと<line-break>したら逃げられて最後は殺されたんだもん。<end>噂の愚王ペウダが処刑されてロセンは<line-break>解放されたみたいなのん。きーっとロセン中で<line-break>お祝いをしてるんだわ。たのしそーだよね。<line-break>あたしもロセンに行ってこようかなぁ。<line-break>カルラちゃんっていう女の子を見てみたいし、<line-break>それに解放祝賀祭に参加したいもん。<end>分断の山脈を越えてロストールに攻めてきた\u3000\u3000<line-break>ディンガルの朱雀将軍アンギルダンって、<line-break>あたし知っているよ。会ったことあるもん。<line-break>真っ赤な全身鎧を着て、とーっても大きな戦斧を<line-break>びゅんびゅん振り回す元気なお爺ちゃんなのん。<line-break>冒険者をやめて将軍様になってたんだねぇ。<end>東にあるリベルダムがカルラちゃんに<line-break>壊されちゃったのん。<line-break>カルラちゃんは恐い人なのかなぁ。<end>カルラちゃんが攻めてくるから、<line-break>みんな大騒ぎなのん。<line-break>カルラちゃんは、ここも壊しちゃうのかなぁ？<end>え～ん、え～ん、勇者ネメアが<line-break>死んじゃうなんてぇ。<line-break>まだ、会ったことなかったのに～。<end>"
english = "<select><value:$33>I'm a Lilbie minstrel. I travel around, seeing all sorts of countries. Still, this country really is peaceful. Its biggest problem is the factional struggle between Queen Eris and Lemghon, Duke of Elienai. Rocen, meanwhile, is suffering under that fool of a king, Peuda.<end>I'm a Lilbie minstrel. I travel around, seeing all sorts of countries. Still, this country really is peaceful. Its biggest problem is the factional struggle between Queen Eris and Lemghon, Duke of Elienai. Rocen, meanwhile, is suffering under that fool of a king, Peuda.<end>Hero Nemea is the new emperor of Dingal. The people of Dingal seem happy to welcome him, but the old emperor really was pitiful. I mean, everyone talked behind his back, saying he wasn't fit to be emperor. Then he tried to execute Nemea for getting in his way, only Nemea escaped, and in the end the old emperor was killed.<end>It sounds like that infamous fool King Peuda was executed and Rocen has been liberated. I bet they're celebrating all over Rocen. That sounds like so much fun! Maybe I'll go to Rocen too. I want to see this girl named Karula, and I want to join the liberation festival.<end>You know Angeerdan, Dingal's Vermilion Bird General who crossed the Dividing Mountains to attack Rostorl? I know him! I've met him before. He's a lively old man in a suit of bright red armor who whirls an enormous battle-axe around. So he gave up adventuring and became a general!<end>Karula destroyed Liberdam, over in the east. I wonder if Karula is scary.<end>Everyone's in a panic because Karula is coming to attack. I wonder if she'll destroy this place too.<end>Waaah, waaah! I can't believe Hero Nemea is dead! I never even got to meet him!<end>"

