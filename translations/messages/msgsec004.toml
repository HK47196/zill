japanese = "<select><value:$33>あそこの女の子、人間の子供みたいだろ？<line-break>でも、あれはリルビーっていう種族なんだ。<line-break>ほら、顔につけぼくろが埋め込まれてるだろ？<line-break>ああ、リルビーはいいよなあ。得だよなあ。<line-break>いつまでも子供みたいな外見だし。<line-break>人間にかわいがられて養ってもらえるし。<end>あそこの女の子、人間の子供みたいだろ？<line-break>でも、あれはリルビーっていう種族なんだ。<line-break>ほら、顔につけぼくろが埋め込まれてるだろ？<line-break>ああ、リルビーはいいよなあ。得だよなあ。<line-break>いつまでも子供みたいな外見だし。<line-break>人間にかわいがられて養ってもらえるし。<end>フェルムちゃんてかわいいよなあ。<line-break>好きな人とかいるのかなあ。<line-break>とっても気になるんだよなあ。<line-break>えっ、何？\u3000ディンガルの皇帝が<line-break>勇者ネメアに代わったって？<line-break>そんなことどうでもいいよ。<end>あそこのリルビーの女の子がロセン解放祝賀祭に<line-break>行くって言ってるんだが、俺はそんなのないから<line-break>行っても無駄だと思うけどなあ。<line-break>だって考えてもみろよ、ロセンが解放されたって<line-break>言うけどディンガル帝国に攻め滅ぼされて<line-break>占領されたんだぜ。ロセンは敗戦国なんだよ。<end>どーするよ、どーするよ。ディンガルが攻めて\u3000<line-break>来たら、ロストールが戦場になっちゃうぞ。<line-break>分断の山脈を越えてくるなんて反則じゃないか。<line-break>貴族や騎士団はいったいどうするんだよ。<line-break>誰が酒場でフェルムちゃんを見ながらぼーっと<line-break>するささやかな幸せを守ってくれるんだ。<end>あそこのリルビーの女の子、リベルダム陥落が<line-break>どれだけ重大な事件なのかわかっているのかな？<line-break>次はロストールに攻めてくるぞ！\u3000きっとだぞ！<end>もうだめだー！<line-break>今のロストールじゃカルラに勝てっこないよー。<line-break>俺の幸せな生活もこれで終わりだー。<end>本当はロストールを逃げ出したい…。<line-break>だけど、フェルムちゃんに会えない<line-break>生活なんて堪えられそうもないんだ。<end>"
english = "<select><value:$33>See that girl over there? She looks like a human child, doesn't she? But she's a Lilbie. See the beauty mark implanted in her face? Lilbies really have it good. They always look like children, and humans dote on them and provide for them.<end>See that girl over there? She looks like a human child, doesn't she? But she's a Lilbie. See the beauty mark implanted in her face? Lilbies really have it good. They always look like children, and humans dote on them and provide for them.<end>Ferme's so cute. I wonder if there's anyone she likes. I really want to know. What? Hero Nemea is the new emperor of Dingal? Who cares about that?<end>That Lilbie girl over there says she's going to the Rocen Liberation Festival, but I don't think there even is one. She'd be wasting her time. Think about it: they call it liberation, but the Dingal Empire invaded Rocen, destroyed it, and occupied it. Rocen is a defeated nation.<end>What are we going to do? What are we going to do? If Dingal attacks, Rostorl will turn into a battlefield! Crossing the Dividing Mountains isn't fair! What are the nobles and the knightly orders going to do about it? Who's going to protect my simple pleasure of sitting in the tavern and idly watching Ferme?<end>Does that Lilbie girl over there even understand how serious the Fall of Liberdam is? Rostorl will be next! I know it!<end>We're doomed! Rostorl doesn't stand a chance against Karula now! My happy life is over!<end>The truth is, I want to flee Rostorl... But I don't think I could bear living without seeing Ferme.<end>"

