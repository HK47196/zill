["970047"]
japanese = "<if><value:$01><equal>2ダメじゃない、ちゃんと見ないと。<line-break>ほら、もう一度行ってない所がないか、<line-break>確認してきなさい。<line-break>もう、ほんっとに<line-break>しょうがないんだから。 <end><if><value:$01><equal>5なんだよ、それじゃあ<line-break>まだ全部回ってないじゃないかよ。<line-break>\u3000<line-break>ちゃんと全部見てからじゃないと<line-break>仕事が終わらないぜ。<line-break>さぁ、早く戻れよ。 <end><if><value:$01><equal>6えぇ！？\u3000ちゃんと仕事しなくちゃ<line-break>ダメじゃない。\u3000ほら、もう少し<line-break>調べてみようよ。ボクも行くからさ。 <end><if><value:$01><equal>13帰るのは<line-break>全部調べてからだ。<line-break>早く戻って続けろ。 <end><if><value:$01><equal>10なんだよ、それじゃあ<line-break>全部回ってないじゃないか。<line-break>しっかりしてくれよ、姉ちゃん。<line-break>さぁ、さっさと戻って<line-break>一通り見てこようぜ。 <end><if><value:$01><equal>14なんじゃ、それではまだ<line-break>全部回ったわけじゃないんじゃな？\u3000<line-break>\u3000<line-break>それならまだ帰るわけにはいかんぞ。<line-break>さぁ、早く町に戻るんじゃ。 <end><if><value:$01><equal>15え？\u3000それじゃ、まだ全部<line-break>回ってないんじゃない。<line-break>\u3000<line-break>全部調べてからじゃないと<line-break>帰れないよ。さぁ、町に戻って<line-break>調査を続けないと。 <end><if><value:$01><equal>17なんてことかしら！\u3000このアタクシの<line-break>１億分の１も働いていなくてよ！<line-break>そんなこと、絶対に許さないわ！<line-break>さぁ、さっさと、直ちに、今すぐ<line-break>戻って、この町を調べてくるのよー！<line-break>アタクシはそれまで待っているわ！ <end><if><value:$01><equal>19えぇ！？\u3000それじゃ、まだ全部<line-break>行ってないんだ？\u3000ダメだよぉ、\u3000<line-break>ちゃんと見て回らないとぉ。<line-break>ルルアンタもちゃんと調べるからぁ、<line-break><value:$28>も、全部の場所に<line-break>行ってね。 <end>えぇ！？\u3000それじゃ、まだ全部<line-break>行ってないんじゃない。ダメだよ、\u3000<line-break>ちゃんと見て回らないと。<line-break>帰るのは全部回ってからにしようよ。<line-break>さぁ、早く戻って調査を続けよう！ <end>"
english = "<if><value:$01><equal>2That's no good. You have to look properly. Go back and make sure there isn't anywhere you missed. Honestly, what am I going to do with you?<end><if><value:$01><equal>5What? Then you haven't been everywhere yet. The job isn't done until you've checked the whole town. Come on, get back there.<end><if><value:$01><equal>6What!? You have to do the job properly. Come on, let's investigate a little more. I'll come too.<end><if><value:$01><equal>13We're not leaving until we've investigated everything. Get back there and continue.<end><if><value:$01><equal>10What? Then you haven't been everywhere, sis. Get it together. Come on, let's hurry back and give the whole place a proper look.<end><if><value:$01><equal>14What? Then you have yet to cover the whole town. We cannot leave yet. Come, hurry back to town.<end><if><value:$01><equal>15What? Then you haven't been everywhere yet. We can't leave until we've investigated the whole town. Come on, we have to go back and keep looking.<end><if><value:$01><equal>17How appalling! You haven't done even one hundred-millionth as much work as I have! I absolutely will not allow it! Now march straight back this instant and investigate the town! I shall wait here until you're done!<end><if><value:$01><equal>19What!? Then you haven't been everywhere yet? That's no good. You have to look around properly. Lulluantha will investigate too, so make sure you visit every part of town, <value:$28>.<end>What!? Then you haven't been everywhere yet. That's no good. You have to look around properly. Let's not leave until we've covered the whole town. Come on, let's go back and keep investigating!<end>"

["970048"]
