["970027"]
japanese = "…そ、そうですよね。<line-break>くよくよしてちゃ<line-break>ダメなんですよね。<end>"
english = "Y-you're right. I can't keep moping like this.<end>"

["970028"]
japanese = "これからいっぱい努力して<line-break>もっともっと剣を使えるようになって<line-break>みんなを助けてあげなくっちゃ。<end>"
english = "I'll work hard and get much, much better with a sword. I have to save everyone.<end>"

["970029"]
japanese = "そうよ、ノエル。<line-break>ようやく、いつものあなたらしく\u3000\u3000<line-break>なってきたじゃない。<line-break>あなたのこと放っておけないからね、<line-break>あたしも一緒に行ってあげるわ。<line-break>さぁ、元気を出していきましょ。<end>"
english = "That's right, Noel. Now you're finally starting to sound like yourself again. I can't just leave you on your own, so I'll come with you. Come on, cheer up. Let's go.<end>"

["970030"]
japanese = "ありがと。<line-break>あなたのおかげで、<line-break>ノエルも元気になってくれたわ。<line-break>あ、そういえば、<line-break>まだ名乗ってなかったわね。<line-break>私はカフィン。こっちはノエルよ。<end>"
english = "Thanks. You helped Noel feel better. Oh, that's right, we haven't introduced ourselves yet. I'm Coffin, and this is Noel.<end>"

["970031"]
