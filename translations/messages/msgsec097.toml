english = "Oswald lies beyond the Forest of Deceit, west of Noble. Make sure you investigate it thoroughly, all right?<end>"

["970013"]
japanese = "さぁ、ノエル。<line-break>そろそろ行くわよ。<line-break>いつまでもここにいたって仕方ないわ。<end>早くソウルイーターを見つけて<line-break>倒しちゃいましょ。そうすれば、<line-break>町のみんなが戻ってくるわ。<end>"
english = "Come on, Noel. It's time we left. There's no point staying here forever.<end>Let's hurry up, find the Soul Eater, and kill it. Then everyone in town will come back.<end>"

["970014"]
japanese = "…でも、わたしにはそんな力が…。<end>"
english = "But I don't have that kind of strength...<end>"

["970015"]
japanese = "あなた、誰？<line-break>…見かけない顔だわ。<line-break>この町の住民じゃないわね。<end>"
english = "Who are you? I haven't seen you around before. You're not a resident of this town, are you?<end>"

["970016"]
japanese = "<value:$28>？<line-break>連絡が途絶えた町の調査に来た？<line-break>\u3000<line-break>…そう。<line-break>外にもこの町の異変が<line-break>伝わっていたのね。<end>"
english = "<value:$28>? You came to investigate after contact with the town was lost? I see. So word of what happened here reached the outside.<end>"

["970017"]
japanese = "…もう、だいぶ前になるけど<line-break>この町の遺跡に封印されていた<line-break>ソウルイーターが復活したのよ。<line-break>ソウルイーター…。文字通り、<line-break>人の魂、ソウルを食べる魔物よ。<line-break>その封印が解かれてしまったの。<end>"
english = "It was quite some time ago. The Soul Eater sealed in the ruins here returned. The Soul Eater... The name is literal: it's a monster that devours human souls. Its seal was broken.<end>"

["970018"]
japanese = "瞬く間に、町の住民は<line-break>ソウルを吸われて消えてしまったわ。<line-break>あたしたちの目の前で…。<line-break>無事だったのは<line-break>あたしたちふたりだけ。<line-break>旅の冒険者に助けられてね。<end>"
english = "In moments, the Soul Eater drained the townspeople's souls, and they vanished before our eyes... We were the only two left unharmed. A traveling adventurer saved us.<end>"

["970019"]
japanese = "…わたしがいけないんです。<line-break>わたしがもっと<line-break>しっかりしていれば…。<end>"
english = "It's my fault. If only I'd been more capable...<end>"

["970020"]
japanese = "ノエル！<end>"
english = "Noel!<end>"

["970021"]
japanese = "わたし、少しくらい剣が使えるからって<line-break>いい気になってたんです！<line-break>この町は私がいれば大丈夫だって！<line-break>でも、全然ダメでした…。<line-break>何もできなかったんです。町のみんなが<line-break>目の前で消えていくのに、何も…！<end>"
english = "I let it go to my head just because I knew how to use a sword! I thought the town would be safe as long as I was here! But I was useless... I couldn't do anything. Everyone was vanishing right before my eyes, and I couldn't do a thing!<end>"

["970022"]
japanese = "みんな、わたしのこと、<line-break>頼りにしてくれてたんです。\u3000\u3000\u3000<line-break>だからわたし…、<line-break>だからわたし、<line-break>みんなのために<line-break>戦わなければならなかったのに…！<end>"
english = "Everyone was counting on me. That's why... that's why I was supposed to fight for them...!<end>"

["970023"]
