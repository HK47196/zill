["970011"]
japanese = "そう言わずに頼むよ。<line-break>この仕事で、この額だったら<line-break>他の冒険者は黙ってないぞ？\u3000\u3000\u3000\u3000\u3000<line-break>初心者のあんたには<line-break>ちょうどいい仕事なんじゃないか？<end>"
