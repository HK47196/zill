["970033"]
japanese = "あ、あの…<value:$28>さん<line-break>…でしたっけ？<line-break>その…ありがとうございました。<line-break>あの、<value:$28>さんは<line-break>冒険者をされてるんですか？<end>"
english = "Um... it was <value:$28>, wasn't it? Thank you. Um, are you an adventurer, <value:$28>?<end>"

["970034"]
japanese = "そうなんですか。<line-break><value:$28>さんも<line-break>がんばっているんですよね…。<end>"
