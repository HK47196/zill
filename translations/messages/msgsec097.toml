["970043"]
japanese = "…失礼するよ。<end>"
english = "If you'll excuse me.<end>"

["970044"]
japanese = "<if><value:$01><equal>2ちょっと、<value:$28>。<line-break>どこに行くのよ。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>もう、調査は終わったの？<line-break>ちゃんと、町の全部を<line-break>見て回ったんでしょうね？ <end><if><value:$01><equal>4あれれ、<value:$28>、<line-break>もう、全部調べちゃったの？<line-break>さすが、<value:$28>だわ！ <end><if><value:$01><equal>5おい、<value:$28>。<line-break>どこ行くんだよ。<line-break>もう、全部見て回ったのか？ <end><if><value:$01><equal>6ちょっと、<value:$28>。<line-break>どこに行くの？<line-break>もう、全部見て回ったの？ <end><if><value:$01><equal>13<value:$28>。<line-break>もう、全部<line-break>回ったのか？ <end><if><value:$01><equal>10あれ、姉ちゃん、<line-break>もう終わったのか？ <end><if><value:$01><equal>14おい、<value:$28>。<line-break>もう調査は終わったのか？ <end><if><value:$01><equal>15あれ、<value:$28>、<line-break>もう町を全部見て回ったの？ <end><if><value:$01><equal>17ちょーーーーっと、<value:$28>！<line-break>このアタクシにこんなさびれた町を<line-break>調べさせておいてどこにいくつもり！？<line-break>もちろん、ぜんぶ、すべて、くまなく、<line-break>とことん、調べつくしたんでしょうね？<line-break>ま・さ・か、まだとは言わなくてよね？ <end><if><value:$01><equal>19あれれ、<value:$28>、<line-break>もう、町の中を全部回ったのぉ？ <end>あれれ、<value:$28>、<line-break>もう、町の中を全部回ったの？ <end>"
english = "<if><value:$01><equal>2Wait, <value:$28>. Where are you going? Have you finished investigating already? You did look over the entire town, didn't you?<end><if><value:$01><equal>4Oh? <value:$28>, you've already investigated everything? That's <value:$28> for you!<end><if><value:$01><equal>5Hey, <value:$28>. Where are you going? Have you looked everywhere already?<end><if><value:$01><equal>6Wait, <value:$28>. Where are you going? Have you looked everywhere already?<end><if><value:$01><equal>13<value:$28>. Have you covered the whole town already?<end><if><value:$01><equal>10Huh, sis? Finished already?<end><if><value:$01><equal>14Hey, <value:$28>. Finished investigating already?<end><if><value:$01><equal>15Oh, <value:$28>. Have you looked all around town already?<end><if><value:$01><equal>17Juuust a moment, <value:$28>! After making me investigate this dreary little town, where do you think you're going!? Naturally, you've inspected absolutely every last inch of it, thoroughly and exhaustively. Surely you aren't about to tell me you haven't?<end><if><value:$01><equal>19Oh? <value:$28>, have you been all around town already?<end>Oh? <value:$28>, have you been all around town already?<end>"

["970045"]
