english = "Well, gone already, huh? I was going to ask someone from Oswald to investigate, since a local ought to know the town...<end>"

["970005"]
japanese = "ん？\u3000あんた、この前、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>冒険者の登録をしてた<line-break><value:$28>だな？<line-break>今の話、聞いてただろう？<line-break>ノーブルの西にあるオズワルドの町と<line-break>連絡が取れないんだ。<end>"
english = "Hm? You're <value:$28>, the one who was registering as an adventurer the other day, right? You heard all that, didn't you? There's been no contact with Oswald, the town west of Noble.<end>"

["970006"]
japanese = "それで、町のことを調査してくれって\u3000<line-break>いう依頼があるんだが、あんた<line-break>この仕事、やってみないか？<line-break>報酬は２０００ギアだ。<end>"
