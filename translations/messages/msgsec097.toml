english = "Yeah, it's true. No one's heard from Oswald in quite a while. If I remember right, you're from there. That's convenient. I was going to ask you to...<end>"

["970003"]
japanese = "なんてこった。<line-break>こうしちゃいられないぜ！\u3000\u3000<line-break>\u3000<end>"
