english = "That's enough, Noel. You did your best. You did everything you could.<end>"

["970024"]
japanese = "この子の言うとおりよ。<line-break>一度失敗したからって<line-break>ただ泣いてるだけの方が問題だわ。\u3000<line-break>これから努力して、もっと強くなって、<line-break>そのあとでソウルイーターを倒せば<line-break>それでいいの。<end>"
english = "That's right. Failing once isn't the problem. Sitting around crying about it would be. Work hard, grow stronger, and then defeat the Soul Eater. That's all you have to do.<end>"

["970025"]
japanese = "ソウルイーターを倒せば、<line-break>村のみんなの魂を取り戻せるって、<line-break>ナーシェスも言っていたじゃない。<end>"
english = "Narscess said we'd get back the souls of everyone in the village if we defeated the Soul Eater, remember?<end>"

["970026"]
japanese = "でも…。<end>"
