["970036"]
japanese = "あ、カフィンが呼んでます。\u3000\u3000\u3000<line-break>わたし、行かなくちゃ。<line-break>\u3000<line-break>あの、わたしもがんばりますから、<line-break>それじゃあ。<end>"
