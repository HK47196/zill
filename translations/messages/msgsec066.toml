["660025"]
japanese = "結構です。人形泥棒に<line-break>介抱していただく気はありません。<line-break>\u3000<line-break>それに、あなたがいなくなれば<line-break>すぐに治りますから。<end>"
english = "No, thank you. I have no intention of being tended to by a doll thief. Besides, I'll recover as soon as you're gone.<end>"

["660026"]
japanese = "結構です。あなたがいなくなれば<line-break>すぐに治りますから。<end>"
english = "No, thank you. I'll recover as soon as you're gone.<end>"

["660027"]
japanese = "つまり、俺を前にすると<line-break>クラッとくるわけだ。\u3000\u3000\u3000<line-break>\u3000<line-break>そりゃ原因は別かもな。<end>"
