["660056"]
japanese = "彼女には必要なのさ。<line-break>もっともな理由があって<line-break>文句をぶつけられる人間がな。\u3000\u3000\u3000<line-break>これからも、ときどき顔を<line-break>出してやらなきゃならんな。<end>"
english = "She needs someone she can rail at with good reason. Looks like I'll have to keep dropping by now and then.<end>"

["660057"]
japanese = "からかうとおもしろい姫さんだし<line-break>ティアナの方でも<line-break>俺のことが嫌いじゃないらしいし…。<end>"
english = "The princess is fun to tease, and it seems Tiana doesn't exactly dislike me, either.<end>"

["660058"]
japanese = "うぬぼれてるって？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
