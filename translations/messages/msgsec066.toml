["660087"]
japanese = "…いいさ。俺の方こそ<line-break>家族関係に立ち入るようなことを<line-break>言っちまった。悪かったな。<line-break><value:$28>、<line-break>なに突っ立ってるんだ。帰るぞ。<end>"
english = "Never mind. I'm the one who stuck his nose into your family affairs. Sorry about that. <value:$28>, what are you standing around for? We're leaving.<end>"

["660088"]
japanese = "そんな。<line-break>まだ、いらっしゃったばかりですわ。<end>"
