["660085"]
japanese = "だろうな。<line-break>だが、それも問題かもな。<line-break>あんたは叔母貴に少し冷淡すぎる。<line-break>確かに叔母貴には冷酷なとこもある。<line-break>けど、あんたにとっちゃ、<line-break>血のつながった母親だろ？<end>"
