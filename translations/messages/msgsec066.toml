["660046"]
japanese = "ずいぶん俺のことに詳しいねえ。<line-break>気になって調べさせたのかい？<end>"
english = "You know an awful lot about me. Were you so curious that you had someone investigate?<end>"

["660047"]
japanese = "誰が、そんなことを！\u3000\u3000\u3000<end>"
