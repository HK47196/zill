["660040"]
japanese = "うんにゃ。いくら俺でも<line-break>そこまでは割り切れねぇな。<line-break>\u3000<line-break>ま、弔い酒だ。<end>"
english = "No. Even I can't shrug it all off that easily. Call it a drink for the dead.<end>"

["660041"]
japanese = "弔い酒？<end>"
english = "A drink for the dead?<end>"

["660042"]
japanese = "ディンガル兵にしろ、\u3000\u3000\u3000\u3000\u3000<line-break>親兄弟がいる。<line-break>\u3000<line-break>子供がいる奴もいただろう。<line-break>それを…、<line-break>ずいぶん殺しちまった。<end>"
