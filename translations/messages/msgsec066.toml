english = "Nah, you weren't far wrong. Just as you said, I'm a hard-drinking, gambling lout with no manners.<end>"

["660073"]
japanese = "違います！\u3000ゼネテス様は本当は<line-break>やさしくて、思いやりがあって！<line-break>それに、とってもお強くて…。<end>"
