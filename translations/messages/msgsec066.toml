["660011"]
japanese = "<if><value:$29><equal>%0…いい女だねえ。<line-break>お前さんもそう思うだろ？\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ヴァイライラとヴィアリアリ。<line-break>サファイアとルビーと呼ばれる、<line-break>エリスの配下でもトップの実力だ。<end>…いい女だねえ。もちろん、<line-break>お前さんもいい女だけどな。<line-break>\u3000<line-break>ヴァイライラとヴィアリアリ。<line-break>サファイアとルビーと呼ばれる、<line-break>エリスの配下でもトップの実力だ。<end>"
english = "<if><value:$29><equal>%0Fine women, eh? You think so too, don't you? Vailaila and Vialiali―the Sapphire and the Ruby. They're among the best Eris has.<end>Fine women, eh? You're a fine woman yourself, of course. Vailaila and Vialiali―the Sapphire and the Ruby. They're among the best Eris has.<end>"

["660012"]
japanese = "奴らの強さは知っているだろう？<end>"
english = "You know how strong they are, don't you?<end>"

["660013"]
japanese = "叔母貴…王妃エリスの配下は<line-break>みんな石の名前で呼ばれている。\u3000\u3000<line-break>\u3000<line-break>お前さんのおやじさん…<line-break>フリントさんのようにな。<end>"
english = "All the people who serve my aunt, Queen Eris, go by the names of stones. Like your father, Flint.<end>"

["660014"]
japanese = "奴らは強い。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>…そして奴らは<line-break>ひとつの信念のためにしか<line-break>その力を使わない。そこが美しい。<end>"
english = "They're strong. And they use that strength in service of one conviction alone. That's what makes them beautiful.<end>"

["660015"]
japanese = "ま、その信念てのが、<line-break>金に汚いツェラシェルってところが<line-break>間違ってる気もするがな。<line-break>んじゃ、姫さんの所に顔出すか。<line-break>悪いが、<value:$28>。<line-break>お前さんもついてきてくれ。<end>"
english = "Though I do wonder if devoting themselves to the money-grubbing Tserashel might be the wrong conviction. Well, let's go show our faces at the princess's place. Sorry, <value:$28>, but I'd like you to come along.<end>"

["660016"]
japanese = "王女様、総司令閣下がおみえです。<end>"
english = "Princess, the Commander-in-Chief is here.<end>"

["660017"]
japanese = "王女と呼ばないで。<end>"
english = "Don't call me Princess.<end>"

["660018"]
japanese = "も、申しわけありません。<line-break>ティアナ様。<end>"
english = "M-my apologies, Lady Tiana.<end>"

["660019"]
japanese = "下がって結構です。<end>"
english = "You may leave us.<end>"

["660020"]
