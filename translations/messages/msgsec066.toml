["660081"]
japanese = "ゼネテス様…。<end>"
english = "Lord Xenetes...<end>"

["660082"]
japanese = "あ…、ゼネテス様…。<end>"
english = "Oh... Lord Xenetes...<end>"

["660083"]
japanese = "よ、俺の素行の悪さを<line-break>叔母貴に告げ口してない？<end>"
