["660031"]
japanese = "失礼で野蛮で、<line-break>酒とバクチにおぼれた人なんて！<end>"
english = "You're rude and uncivilized, and you wallow in drink and gambling!<end>"

["660032"]
japanese = "少し手柄をあげたくらいで<line-break>調子に乗らないでください。\u3000<end>"
