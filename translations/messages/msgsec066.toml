["660028"]
japanese = "なんですって？<end>"
english = "What did you say?<end>"

["660029"]
japanese = "例えば、恋の病とかな。<end>"
english = "Love sickness, for instance.<end>"

["660030"]
japanese = "だ、誰が！\u3000あなたなんかに！<end>"
