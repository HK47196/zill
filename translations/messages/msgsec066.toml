["660053"]
japanese = "ん？<line-break>あぁ、さっきの人形云々ね。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>タルテュバの奴が<line-break>スラムの女の子から人形を取り上げて、<line-break>ティアナにプレゼントしたんだ。<end>"
