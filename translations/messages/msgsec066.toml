["660059"]
japanese = "フフ、俺は人生悲観して生きるより<line-break>期待して生きることにしてるんでな。<end>"
english = "Heh. I'd rather live in hope than spend my life expecting the worst.<end>"

["660060"]
japanese = "じゃあな。<line-break>また会おうぜ、<value:$28>。\u3000<end>"
