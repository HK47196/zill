["660043"]
japanese = "………………。<end>"
english = "...<end>"

["660044"]
japanese = "ロストール兵だって、ほとんどは<line-break>無理やり引っぱり出された農民だ。\u3000<line-break>\u3000<line-break>国や貴族の名誉のために死ぬより<line-break>他にやることがあったろうに。<line-break>親父の指揮の誤りで死なせちまった。<end>"
