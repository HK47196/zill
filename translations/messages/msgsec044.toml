["440033"]
japanese = "\u3000\u3000帝国軍の侵攻をかろうじて食い止めた<line-break>\u3000\u3000\u3000\u3000\u3000ロストール王国だったが、<line-break>\u3000\u3000国家としての勢いはおとろえる一方で<line-break>\u3000\u3000国内でのひずみが表面化し始めていた。<end>"
english = "The Kingdom of Rostorl had barely managed to halt the imperial army's advance. But its strength as a nation continued to wane, and internal strains were beginning to surface.<end>"

["440034"]
japanese = "王都ロストールからやや南に位置する<line-break>ノーブルの町で、領主に代わって\u3000<line-break>町を治めていた代官ボルボラの暴政に<line-break>領民が蜂起、暴動となった。<line-break>この騒ぎは、領主であるエリエナイ公<line-break>レムオン・リューガの手によって\u3000<line-break>ボルボラが討たれる事で決着したが、<line-break>その裏には、更に大きなうねりがあった。<end>"
english = "In Noble, a town a short distance south of the capital, Rostorl, the people rose up against the tyranny of Bolbora, the governor who ruled in their lord's stead, and the uprising erupted into a riot. The unrest ended when Bolbora was slain by the local lord, Duke Lemghon Ryuga of Elienai. Yet behind it all lay an even greater current.<end>"

["440035"]
japanese = "今回の騒ぎは、ファーロスの雌狐と<line-break>呼ばれる王妃エリスが、<line-break>政敵であるレムオンの失脚を狙い、<line-break>密偵を使って起こしたものだった。<end>"
english = "The unrest had been orchestrated by Queen Eris, known as the Vixen of Pharos. Seeking the downfall of her political rival Lemghon, she had used spies to incite it.<end>"

["440036"]
japanese = "騒ぎを急速に鎮圧したレムオンの手腕は\u3000\u3000\u3000<line-break>鮮やかであったが、この事件が表した\u3000\u3000<line-break>ディンガル帝国との国勢の差は\u3000\u3000\u3000<line-break>隠しきれないものがあった。\u3000\u3000<end>"
english = "Lemghon's swift suppression of the unrest was masterful, but the gulf in national strength between Rostorl and the Dingal Empire, laid bare by the incident, could not be concealed.<end>"

["440037"]
japanese = "\u3000\u3000\u3000\u3000長い歴史を持つ大国ロストール。<line-break>\u3000\u3000\u3000\u3000\u3000その国土を照らす日差しは    <line-break>\u3000\u3000\u3000\u3000\u3000\u3000今、確実に赤みを増し      <line-break>\u3000\u3000\u3000\u3000\u3000そっと傾こうとしていた…。  <end>"
english = "Rostorl, a great power with a long history. The sunlight bathing its lands was now steadily growing redder, beginning to slant ever so gently...<end>"

["440038"]
japanese = "あ、<value:$28>将軍！<line-break>ここはロストールの大貴族、<line-break>エリエナイ公レムオンの屋敷です。<line-break>重要な調査が必要なため、<line-break>誰も中に入れるなとの<line-break>青竜将軍閣下よりの厳命であります。<end>"
english = "Ah, General <value:$28>! This is the residence of Duke Lemghon of Elienai, one of Rostorl's foremost nobles. An important investigation must be conducted here, and His Excellency the Azure Dragon General has given strict orders that no one be allowed inside.<end>"

