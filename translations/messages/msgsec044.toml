english = "I should think so. The whole town's talking about it.<end>"

["440093"]
japanese = "なんとも恐ろしいことじゃ。<line-break>国を動かすような大貴族様が<line-break>ダルケニス族じゃったとは…。<line-break>今までも時々人を襲って<line-break>血を吸うていたんじゃろうか…。<line-break>ひえぇぇぇ～。<end>"
english = "What a terrifying business. To think that a great noble with enough influence to sway the whole country was one of the Dalkenis... Do you suppose people have been attacked and had their blood sucked now and then, all this time...? Eeeeeeek!<end>"

["440094"]
japanese = "ダルケニスを殺すと賞金が出るらしい。<line-break>それでみんなレムオンを捜してるんだ。<line-break>\u3000<line-break>ま、こんな真っ昼間の大通りには<line-break>顔を出すはずはないけどね。<end>"
english = "Apparently there's a bounty for killing a Dalkenis. That's why everyone's looking for Lemghon. Not that he'd show his face on a main street in broad daylight.<end>"

["440095"]
japanese = "あのレムオン様が<line-break>ダルケニス族だったなんて…。\u3000\u3000\u3000<line-break>\u3000<line-break>でも、たとえダルケニスだろうと、<line-break>公爵様は、公爵様だわ。そうでしょ？<end>"
english = "To think Lord Lemghon is one of the Dalkenis... But Dalkenis or not, His Grace is still His Grace. Isn't that right?<end>"

["440096"]
japanese = "<value:$28>様…、<line-break>レムオン様がここしばらく<line-break>お戻りになっておりません。\u3000\u3000\u3000\u3000<line-break>私めに一言もなく、このように長い間<line-break>屋敷を離れられたことは、<line-break>今まで一度もなかったのですが…。<end>"
english = "<value:$28>... Master Lemghon has not returned for some time now. Never before has he stayed away from the manor for so long without saying a word to me...<end>"

["440097"]
japanese = "近頃街ではよからぬ噂が<line-break>流れておりますが、それしきのことで<line-break>姿を消すようなお方ではないはずです。<line-break>レムオン様の身にいったい何が…。<end>"
english = "There have been some troubling rumors going around town of late, but surely he would not disappear over something like that. What could have happened to Master Lemghon...?<end>"

["440098"]
japanese = "レムオン様の身にいったい何が…。\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "What could have happened to Lord Lemghon...?<end>"

["440099"]
japanese = "\u3000\u3000\u3000\u3000\u3000…<value:$28>。<line-break>\u3000\u3000\u3000\u3000\u3000…無限のソウルを持つ者。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000そして、その力ゆえに<line-break>\u3000\u3000\u3000\u3000\u3000世界を混沌に導く者よ…。<end>"
english = "…<value:$28>. Bearer of the Infinite Soul. You whose power will plunge the world into chaos…<end>"

["440100"]
japanese = "\u3000\u3000\u3000\u3000汝の存在はあまりにも危険だ…。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000均衡と秩序のため、<line-break>\u3000\u3000\u3000\u3000神の代理たる竜王の名において、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000我は汝を滅せん…。<end>"
english = "Your very existence poses too great a danger… For the sake of balance and order, in the name of the Dragon King, divine proxy, I shall destroy you…<end>"

["440101"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000…なぜだ？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000…運命の女神よ<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000なぜ、…我を滅ぼし<line-break>\u3000\u3000\u3000\u3000世界を混沌の闇に包まんとする…？<end>"
english = "…Why? Goddess of Fate… why do you seek to destroy me and shroud the world in the darkness of chaos…?<end>"

["440102"]
japanese = "\u3000\u3000\u3000余はうつつの身の最後の神であった…。\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000人の子よ…。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000すべての神を殺し、<line-break>\u3000\u3000人は自分の足で歩めると言えるのか？<end>"
english = "I was the last god embodied in this world… Child of man… After killing all the gods, can humanity truly claim to stand on its own feet?<end>"

["440103"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000神去った世に、汝は、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000何を試そうというのだ。<line-break>\u3000\u3000\u3000\u3000光と闇の均衡が崩れぬこと、<line-break>\u3000\u3000\u3000\u3000\u3000もはや、かなうまい…。<end>"
english = "Now that the gods are gone, what is it you mean to attempt? The balance between light and darkness can no longer be preserved…<end>"

["440104"]
japanese = "<value:$28>は<line-break>竜殺しの称号を得た。<end>"
english = "<value:$28> earned the title of Dragonslayer.<end>"

