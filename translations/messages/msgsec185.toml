["1850078"]
japanese = "話はつけてきたのか？<line-break>早く頼むよ。<end>"
english = "Did you get it sorted out? Hurry up, will you?<end>"

["1850079"]
japanese = "知ってる？\u3000クリュセイスって娘。<line-break>ここん家の一人娘なんだけどさ、<line-break>解放軍の首謀者やってんだわ。これが。<line-break>で、そのクリュセイスちゃんが<line-break>フゴーの所に逃げこんでるらしいの。<line-break>そこんとこ、知りたいんだなあ。<end>"
english = "You know a girl named Khryuseis? She's the only daughter of the family here, and wouldn't you know it, she's the ringleader of the Liberation Army. Word is little Khryuseis has run off to Hugo for protection. That's what I want you to find out.<end>"

