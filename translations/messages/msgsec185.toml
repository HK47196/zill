english = "We cannot share what we know with someone who would reveal a client's name so readily.<end>"

["1850060"]
japanese = "お引き取りください。<end>"
english = "Please leave.<end>"

["1850061"]
japanese = "ふむー。<line-break>見込みがあるのぉ。<end>"
english = "Hmm. You may have promise after all.<end>"

["1850062"]
japanese = "よろしいでしょう。<line-break>依頼人の名を簡単に明かさない。<line-break>そうでなくてはいけません。<end>"
english = "Very well. A client's name must not be revealed lightly. That is as it should be.<end>"

["1850063"]
japanese = "あとは、<line-break>情報を守るだけの力が<line-break>あるかどうかじゃのぉ。<end>"
english = "Now we must see whether you're strong enough to protect that information.<end>"

["1850064"]
japanese = "さて、そのことも、<line-break>証明していただけますかな？<line-break>我々を相手に。<end>"
