["1850050"]
japanese = "つまらんのぉ。<end>"
english = "How dull.<end>"

["1850051"]
japanese = "ほーほっほっほ。<line-break>そーですわねぇ。<end>"
english = "Ho, ho, ho, ho! Quite so.<end>"

["1850052"]
japanese = "あなたには、貴重な品を<line-break>お持ちいただいたご恩もあります。<line-break>\u3000<line-break>事の次第によっては、<line-break>情報をお教えしましょう。<end>"
english = "We are indebted to you for the valuable things you have brought us. Depending on the circumstances, we may be willing to tell you what we know.<end>"

["1850053"]
japanese = "信用できる人物なら<line-break>話すんじゃがのぉ。<end>"
english = "If you can be trusted, we might tell you.<end>"

["1850054"]
japanese = "私の質問にお答えください。<line-break>どなたに頼まれたのですか？<line-break>正直にお答えください。<end>"
english = "Please answer my question. Who sent you? Answer honestly.<end>"

