["1850067"]
japanese = "お見事です。<line-break>約束通り、お教えしましょう。\u3000\u3000<line-break>\u3000<line-break>クリュセイス様は、<line-break>貴重な報酬と引き換えに<line-break>我々がすでにお逃がししています。<end>"
english = "Splendid. As promised, we will tell you. We have already helped Khryuseis escape in exchange for a valuable reward.<end>"

["1850068"]
japanese = "リベルダムには、<line-break>すでにいらっしゃいません。<end>"
english = "She is no longer in Liberdam.<end>"

["1850069"]
japanese = "勝った。勝った。<end>"
english = "We won! We won!<end>"

["1850070"]
japanese = "まことに申しわけありませんが、<line-break>情報を流すには、力不足のようです。<line-break>お引き取りください。<end>"
english = "I am truly sorry, but you do not appear strong enough for us to entrust you with this information. Please leave.<end>"

["1850071"]
japanese = "冒険者か？\u3000名を名乗れ。<end>"
english = "An adventurer? State your name.<end>"

["1850072"]
japanese = "えーと、<value:$28>…。<line-break>フゴー邸に出入りのある者です。<end>"
english = "Let's see... <value:$28>. You have access to Hugo's residence.<end>"

["1850073"]
japanese = "よし、通れ。本来、今は中に入れないが、<line-break>カルラ様がフゴー邸に出入りできる人物を<line-break>捜しておいでだ。<line-break>居住区に向かえ。<line-break>急げよ。<end>"
english = "All right, pass. Ordinarily no one is allowed inside right now, but Lady Karula is looking for someone with access to Hugo's residence. Head to the residential district. Hurry.<end>"

["1850074"]
japanese = "現在、リベルダムは、封鎖中だ。<line-break>立ち去るがよい。<end>"
english = "Liberdam is under blockade. Leave at once.<end>"

["1850075"]
japanese = "クリュセイス様は、<line-break>今はいらっしゃらない。<line-break>日をあらためて、また来てくれ。<end>"
english = "Lady Khryuseis isn't here at present. Come back another day.<end>"

["1850076"]
japanese = "フゴーと面識があるとは、<line-break>大した冒険者だ。<end>"
english = "You know Hugo personally? You must be quite the adventurer.<end>"

["1850077"]
japanese = "カルラ様もさすがに<line-break>フゴーには手を出せんよ。<line-break>金の力はすごいな。<end>"
