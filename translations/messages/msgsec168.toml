["1680000"]
japanese = "ファーロス・ボリューム３その３開始<end>"
english = ""

["1680001"]
japanese = "…レムオンをかばうとは。<line-break>ゼネテスには自棄なところがあったが<line-break>そなたも、自滅型だったとはな。<line-break>覚えておくがよい。<line-break>手負いの鷹は、冷静なときよりも<line-break>危険だということを。<end>"
english = "So, you chose to protect Lemghon. Xenetes always had a self-destructive streak, but it seems you do as well. Remember this: a wounded hawk is more dangerous than one that has kept its composure.<end>"

["1680002"]
japanese = "こうなれば、いた仕方ない。<line-break>できる限りの手を打つまでだ。<line-break>ただ、ティアナの身が案じられる。<end>"
english = "It has come to this, then. We must do everything we can. Still, I fear for Tiana's safety.<end>"

["1680003"]
japanese = "カルラが迫っておるのに、<line-break>宮廷の勢力争いかと<line-break>あきれておるのか？<line-break>フフ、私もあきれておる。<line-break>だが、愚かと知っていても、<line-break>やらざるを得ぬ事もある。<end>"
english = "Are you appalled that, with Karula closing in, we are still engaged in a court power struggle? Heh, so am I. But there are things one must do even knowing they are foolish.<end>"

["1680004"]
japanese = "先の空中庭園のおり…<line-break>そなた、気づいたか？<line-break>…アトレイアだ。<line-break>あのときの<line-break>アトレイアの表情には<line-break>鬼気迫るものがあった。<end>"
english = "When we were last at the Hanging Gardens... did you notice? I mean Atleia. There was something frighteningly intense in her expression.<end>"

["1680005"]
japanese = "あの娘の人生には<line-break>少し、関わりがあってな。<line-break>気になるのだ…。<end>"
english = "I have had some small part in that girl's life. Naturally, I am concerned.<end>"

["1680006"]
japanese = "<value:$28>か。<line-break>ティアナを頼むぞ。<end>"
english = "Ah, <value:$28>. Take care of Tiana for me.<end>"

["1680007"]
japanese = "フフフ…。<line-break>その顔だと、気づいておらぬようだな。<line-break>\u3000<line-break>レムオンは、幼いころから<line-break>ティアナに惹かれていた。<end>"
english = "Heh heh heh... From that look on your face, I see you hadn't noticed. Lemghon has been drawn to Tiana since childhood.<end>"

["1680008"]
japanese = "ティアナもレムオンを<line-break>兄のように慕っているが、<line-break>それ以上の感情はない…。<line-break>あのタルテュバの一件で、<line-break>レムオンにもようやくそれが<line-break>わかったようだ。<end>"
english = "Tiana is fond of Lemghon as an older brother, but she feels nothing more for him. It seems that business with Tartyuba finally made Lemghon understand.<end>"

["1680009"]
japanese = "普段、冷静な男なだけに<line-break>逆上すると<line-break>何をしでかすかわからない。<line-break>無用な心配とは思うが、<line-break>気に留めておいてほしい。<end>"
english = "Because he is usually so composed, there is no telling what he might do if he loses his head. I may be worrying needlessly, but I want you to bear it in mind.<end>"

["1680010"]
japanese = "よく来てくれた、<line-break><value:$28>。<end>"
english = "Thank you for coming, <value:$28>.<end>"

["1680011"]
japanese = "そなたを頼りにしておる。<line-break>ティアナを守ってやってほしい。<line-break>\u3000<line-break>あのタルテュバの一件以来…<line-break>レムオン、それにアトレイアのことが<line-break>気にかかるのだ。<end>"
english = "I am relying on you. I want you to protect Tiana. Ever since that business with Tartyuba, I have been concerned about Lemghon―and Atleia as well.<end>"

["1680012"]
japanese = "ふたりの、ティアナに対する感情は<line-break>それぞれに単純ではない。<line-break>\u3000<line-break>それゆえ、我々には思いもよらぬ<line-break>行動に出るやもしれぬ。<line-break>ティアナを守ってやってほしい。<end>"
english = "Their feelings for Tiana are complicated, each in a different way. That may lead them to act in ways none of us could foresee. Please protect Tiana.<end>"

["1680013"]
japanese = "最近のレムオンの動きに<line-break>気になることはないか？<end>"
english = "Have you noticed anything troubling in Lemghon's recent movements?<end>"

["1680014"]
japanese = "レムオンは、幼いころから<line-break>ティアナに惹かれていた。<end>"
english = "Lemghon has been drawn to Tiana since childhood.<end>"

["1680015"]
japanese = "ティアナもレムオンを<line-break>兄のように慕っているが、<line-break>それ以上の感情はない…。<line-break>あのタルテュバの一件で、<line-break>レムオンにもようやくそれが<line-break>わかったようだ。<end>"
english = "Tiana is fond of Lemghon as an older brother, but she feels nothing more for him. It seems that business with Tartyuba finally made Lemghon understand.<end>"

["1680016"]
japanese = "普段、冷静な男なだけに<line-break>逆上すると<line-break>何をしでかすかわからない。<line-break>無用な心配とは思うが、<line-break>気に留めておいてほしい。<end>"
english = "Because he is usually so composed, there is no telling what he might do if he loses his head. I may be worrying needlessly, but I want you to bear it in mind.<end>"

["1680017"]
japanese = "それから、ティアナの方も、<line-break>何か様子がおかしかった。<line-break>気づかってやってくれ。<line-break>フフ…、娘を気づかうのは<line-break>本来は母親の役目なのだろうがな。<end>"
english = "And Tiana herself seemed somehow out of sorts. Look after her for me. Heh... I suppose worrying over a daughter should rightfully be her mother's duty.<end>"

["1680018"]
japanese = "近ごろ、ティアナについて<line-break>気になることはないか？<line-break>\u3000<line-break>舞踏会で様子がおかしかった。<line-break>もともと気の強い娘だが<line-break>あのような形相は見たことがない。<end>"
english = "Have you noticed anything troubling about Tiana lately? She was behaving strangely at the ball. She has always been strong-willed, but I have never seen such a look on her face.<end>"

["1680019"]
japanese = "…確かに気の回しすぎかもしれぬ。<end>"
english = "Perhaps I am reading too much into it.<end>"

["1680020"]
japanese = "アトレイアも変わった。<line-break>明るくなった。<line-break>\u3000<line-break>最近、空中庭園でよく見かけるが、<line-break>笑顔であいさつをするようになった。<end>"
english = "Atleia has changed as well. She is much more cheerful. I often see her in the Hanging Gardens these days, and now she greets me with a smile.<end>"

["1680021"]
japanese = "フフ…、あの娘の人生には<line-break>少し、関わりがあってな。<line-break>うれしいことだ。<end>"
english = "Heh... I have had some small part in that girl's life. That makes me glad.<end>"

["1680022"]
japanese = "<value:$28>か。<line-break>今朝、空中庭園で<line-break>アトレイアに会って驚いた。<line-break>目を見張るほど美しくなった。<line-break>…そう思わぬか？<end>"
english = "Ah, <value:$28>. I met Atleia in the Hanging Gardens this morning, and she took me by surprise. She has grown remarkably beautiful. Do you not agree?<end>"

["1680023"]
japanese = "<if><value:$29><equal>%0恋をすれば<line-break>女は変わる。<line-break>美しくなる。<line-break><value:$28>、<line-break>心当たりはないか？<end>誰かがアトレイアを<line-break>孤独の闇から<line-break>解放してくれたのだろう。<line-break>その者に<line-break>感謝しておくとしよう。<end>"
english = "<if><value:$29><equal>%0Love changes a woman. It makes her beautiful. Does that bring anyone to mind, <value:$28>?<end>Someone must have freed Atleia from the darkness of her solitude. I shall have to thank that person.<end>"

["1680024"]
japanese = "<value:$28>か。<line-break>長い間、私をわずらわせていた問題が<line-break>ひとつ片付きそうだ。<line-break>レムオン…、あの男も終わりだ。<line-break>坊やの皮肉が聞けなくなるのは、<line-break>さびしい気もするが…。<end>"
english = "Ah, <value:$28>. It seems one of the problems that has plagued me for so long is about to be resolved. Lemghon... that man is finished. Though I may rather miss the boy's barbed remarks.<end>"

["1680025"]
japanese = "あの誇り高い男が堕ちていくのを<line-break>この玉座から見守ってやるとしよう。<end>"
english = "I shall watch from this throne as that proud man falls.<end>"

["1680026"]
japanese = "<value:$28>か。<line-break>レムオン坊やとはうまくいっておるか？<end>"
english = "Ah, <value:$28>. Are you getting along with young Lemghon?<end>"

["1680027"]
japanese = "フフフ…、<line-break>あの男、他人と仲よくやれるような<line-break>人間ではない。<line-break>屋敷を追い出されない以上、<line-break>この上なく、うまくいっていると<line-break>見るべきだろう。<end>"
english = "Heh heh heh... That man is hardly capable of getting along with anyone. If he has not thrown you out of his manor, I would say matters could not be going better.<end>"

["1680028"]
japanese = "その調子でレムオンの信用を得るのだ。<line-break>そして、油断させるのだ。<line-break>…ああいう男は、一度崩れればもろい。<end>"
english = "Keep at it and earn Lemghon's trust. Then lull him into complacency. A man like that is fragile once he begins to crack.<end>"

["1680029"]
japanese = "<value:$28>よ。<line-break>期待している。<line-break>フリントのこと、忘れるな。<end>"
english = "<value:$28>, I have high hopes for you. Do not forget Flint.<end>"

["1680030"]
japanese = "<value:$28>、<line-break>そなたいくつになる？<end>"
english = "<value:$28>, how old are you?<end>"

["1680031"]
japanese = "そうか、ティアナと同じか。<line-break>\u3000<line-break>\u3000<line-break>我が娘ティアナは、<line-break>王宮の外の人間を知らぬ。<line-break>周りに年齢の近い者も少ない。<end>"
english = "I see. The same age as Tiana. My daughter knows no one outside the royal palace, and there are few people her age around her.<end>"

["1680032"]
japanese = "そなたならば、<line-break>よい話相手になるだろう。<line-break>\u3000<line-break>だが、注意するがいい。<line-break>ティアナは、この私でさえ<line-break>手を焼くほど、したたかな娘だ。<end>"
english = "You would make a good companion for her. But be warned: Tiana is shrewd enough to give even me trouble.<end>"

["1680033"]
japanese = "<value:$28>か。<line-break>ゼネテスはどうしておる？<line-break>総司令らしく振る舞っておるか？<end>"
english = "Ah, <value:$28>. How is Xenetes faring? Is he conducting himself like a commander-in-chief?<end>"

["1680034"]
japanese = "フフ…、厳しい評価だ。<line-break>まあ、よい。<line-break>最初から期待しておらぬ。<line-break>だが、ゼネテスは<line-break>そなたを高く買っているようだ。<end>"
english = "Heh... A harsh assessment. No matter. I expected nothing of him from the start. Xenetes, however, seems to think highly of you.<end>"

["1680035"]
japanese = "その期待に応えてやってほしい。<line-break>そなたにならば、できるはずだ。<end>"
english = "I hope you will live up to his expectations. I believe you can.<end>"

["1680036"]
japanese = "<value:$28>か。<line-break>\u3000<line-break>\u3000<line-break>ゼネテスとはうまくやっているか？<end>"
english = "Ah, <value:$28>. Are you getting along with Xenetes?<end>"

["1680037"]
japanese = "あれは器用で頭もいいが、<line-break>立ち回りがヘタだ。<line-break>…敵を作りやすい。<end>"
english = "He is capable and clever, but he handles himself poorly. He makes enemies all too easily.<end>"

["1680038"]
japanese = "だが、そなたには<line-break>人を惹きつける力がある。<line-break>\u3000<line-break>その魅力が<line-break>ゼネテスを救うこともあるだろう。<line-break>力になってやってほしい。<end>"
english = "But you have a gift for drawing people to you. That quality may yet save Xenetes. I want you to stand by him.<end>"

["1680039"]
japanese = "フリントの子、<line-break><value:$28>…。<line-break>\u3000<line-break>…いい目をしている。<line-break>無限の可能性を感じさせる目だ。<end>"
english = "Flint's child, <value:$28>... You have a fine look in your eyes. It speaks of limitless potential.<end>"

["1680040"]
japanese = "もし、そなたが平穏を望むならば<line-break>その望みは捨てた方がよい。<line-break>\u3000<line-break>そなたに秘められた可能性が<line-break>そなたをそっとしては<line-break>おかぬだろう。<end>"
english = "If you desire a peaceful life, you would do well to abandon that hope. The potential within you will not allow you to live undisturbed.<end>"

["1680041"]
japanese = "フリントの子、<line-break><value:$28>…。<line-break>\u3000<line-break>…いい目をしている。<line-break>無限の可能性を感じさせる目だ。<end>"
english = "Flint's child, <value:$28>... You have a fine look in your eyes. It speaks of limitless potential.<end>"

["1680042"]
japanese = "もし、そなたが平穏を望むならば<line-break>その望みは捨てた方がよい。<line-break>\u3000<line-break>そなたに秘められた可能性が<line-break>そなたをそっとしては<line-break>おかぬだろう。<end>"
english = "If you desire a peaceful life, you would do well to abandon that hope. The potential within you will not allow you to live undisturbed.<end>"

["1680043"]
japanese = "<value:$28>か。<line-break>旅はどうだ？<line-break>\u3000<line-break>今は存分に世界を見て回ることだ。<line-break>そなたには、それが許されている。<end>"
english = "Ah, <value:$28>. How are your travels? For now, see as much of the world as you can. You have that freedom.<end>"

["1680044"]
japanese = "私は死ぬまで、いや、<line-break>死んだあともこの王宮を<line-break>出ることはないだろう。<line-break>もはや、それを不幸とは思わぬが、<line-break>そなたを見ていると<line-break>うらやましくもある。<end>"
english = "I shall never leave this royal palace―not until I die, nor even after death. I no longer consider that a misfortune, yet when I look at you, I cannot help but feel a little envy.<end>"

["1680045"]
japanese = "<value:$28>、<line-break>そなたいくつになる？<end>"
english = "<value:$28>, how old are you?<end>"

["1680046"]
japanese = "そうか、ティアナと同じか。<line-break>\u3000<line-break>\u3000<line-break>我が娘ティアナは、<line-break>王宮の外の人間を知らぬ。<line-break>周りに年齢の近い者も少ない。<end>"
english = "I see. The same age as Tiana. My daughter knows no one outside the royal palace, and there are few people her age around her.<end>"

["1680047"]
japanese = "そなたならば、<line-break>よい話相手になるだろう。<line-break>\u3000<line-break>だが、注意するがいい。<line-break>ティアナは、この私でさえ<line-break>手を焼くほど、したたかな娘だ。<end>"
english = "You would make a good companion for her. But be warned: Tiana is shrewd enough to give even me trouble.<end>"

["1680048"]
japanese = "七竜家当主の方々との<line-break>会談のお時間でございます。<end>"
english = "It is time for your meeting with the heads of the Seven Dragon Houses.<end>"

["1680049"]
japanese = "そうか。<line-break>\u3000<line-break>\u3000<line-break><value:$28>よ。<line-break>また来るとよい。<end>"
english = "I see. Do come again, <value:$28>.<end>"

["1680050"]
japanese = "<value:$28>、<line-break>そなたには礼を言わねばならぬ。<end>"
english = "<value:$28>, I owe you my thanks.<end>"

["1680051"]
japanese = "ティアナがずいぶんと<line-break>世話になっているそうではないか。<end>"
english = "I hear you have done a great deal for Tiana.<end>"

["1680052"]
japanese = "王宮を抜け出しての密会とは、<line-break>ティアナがのぼせ上がるのも<line-break>無理はない。<line-break>そなたは、思いのほか<line-break>女心をつかむのがうまいようだ。<end>"
english = "Sneaking out of the royal palace for a secret rendezvous―no wonder Tiana is so taken with you. You have more of a way with women than I expected.<end>"

["1680053"]
japanese = "…そなたを責める気は毛頭ない。<line-break>あの子は、誰とでも気兼ねなく<line-break>付き合っているようだが、本当は…<line-break>本当は、心を開くことを<line-break>知らなかった不幸な娘。<line-break>そのティアナが心を開こうとしている。<end>"
english = "I have no intention of blaming you. She may seem perfectly at ease with everyone, but the truth is... the truth is, she was an unhappy girl who never learned to open her heart. And now Tiana is trying to do just that.<end>"

["1680054"]
japanese = "…ゼネテスを婿に選んだのは、<line-break>早計だったかもしれぬ。<end>"
english = "Perhaps I was too hasty in choosing Xenetes as her husband.<end>"

["1680055"]
japanese = "フフフ…、はっきり言うがいい。<line-break>ゼネテスを次期国王につけ<line-break>ファーロス家が王位を簒奪する。<line-break>雌狐エリスが、そう企んでいると<line-break>言うのであろう？<end>"
english = "Heh heh... Go on, say it plainly. The vixen Eris means to put Xenetes on the throne as the next king and have House Pharos usurp the throne. That is what you mean to say, is it not?<end>"

["1680056"]
japanese = "悪い話ではないが、<line-break>ティアナを不幸にしてまで<line-break>実現する価値はない。<line-break>ティアナの婿は<line-break>ファーロス家の者でなくとも<line-break>よいのだ。<end>"
english = "It is not an unattractive prospect, but it is not worth making Tiana miserable. Her husband need not come from House Pharos.<end>"

["1680057"]
japanese = "ただ、ティアナを幸せにできる<line-break>男であれば…。<end>"
english = "He need only be a man who can make Tiana happy...<end>"

["1680058"]
japanese = "七竜家当主の方々との<line-break>会談のお時間でございます。<end>"
english = "It is time for your meeting with the heads of the Seven Dragon Houses.<end>"

["1680059"]
japanese = "そうか。<line-break><value:$28>よ。<line-break>これからもティアナを頼む。<line-break>私の命より大事な娘だ。<end>"
english = "Very well. <value:$28>, please continue to look after Tiana. She is dearer to me than life itself.<end>"

["1680060"]
japanese = "<value:$28>か。<line-break>よく来た。<end>"
english = "Ah, <value:$28>. Welcome.<end>"

["1680061"]
japanese = "王妃様、シドア候が<line-break>面会を求めております。<end>"
english = "Your Majesty, Marquis Sidoa requests an audience.<end>"

["1680062"]
japanese = "待たせておけ。<end>"
english = "Let him wait.<end>"

["1680063"]
japanese = "３時間前からお待ちですが。<end>"
english = "He has already been waiting for three hours.<end>"

["1680064"]
japanese = "構わぬ。<line-break>その程度の能しかない男だ。<end>"
english = "No matter. That is the extent of the man's ability.<end>"

["1680065"]
japanese = "４時間でも５時間でも待つだろう。<line-break>七竜家の当主であろうと、<line-break>いまや私に逆らうことはできない。<end>"
english = "He will wait four hours, or five if need be. He may be the head of one of the Seven Dragon Houses, but he cannot defy me now.<end>"

["1680066"]
japanese = "フフ…、望んでこうなったのではない。<line-break>私は権力を求めて<line-break>王室へ嫁いだのではないのだ。<end>"
english = "Heh... I never asked for any of this. I did not marry into the royal family in pursuit of power.<end>"

["1680067"]
japanese = "陛下はファーロス家の力が<line-break>目当てだった。<line-break>仕方ない。大貴族の娘なのだからな。<line-break>だが、王室に入った当初、<line-break>あれほど陛下が冷たくされたのは…<line-break>つらかった…。<end>"
english = "His Majesty wanted the power of House Pharos. That was only to be expected; I was the daughter of a great noble house. But when I first entered the royal family, His Majesty treated me so coldly... It was painful.<end>"

["1680068"]
japanese = "だからこそ、ティアナを<line-break>身ごもったときの喜びは大きかった。<line-break>\u3000<line-break>ティアナこそ、<line-break>陛下と私とをつなぐ<line-break>きずなになるはずだった。<end>"
english = "That was why I felt such joy when I conceived Tiana. She was to be the bond that united His Majesty and me.<end>"

["1680069"]
japanese = "だが、やがて<line-break>王宮に政変が起こった。<line-break>…テジャワの変と呼ばれている。<line-break>ナグイゼ伯テジャワは、<line-break>国王を廃し、先代の王の娘、<line-break>幼いアトレイアを王位につけ…<end>"
english = "But in time, there was a political upheaval at the royal court. It is known as the Tejava Incident. Count Tejava of Nagize sought to depose the king and place young Atleia, daughter of the previous king, upon the throne...<end>"

["1680070"]
japanese = "政権をほしいままにしようと<line-break>したのだ。<end>"
english = "The aim was to seize control of the government and wield power at will.<end>"

["1680071"]
japanese = "私は、誰よりも先に陰謀に気づき、<line-break>これを阻止するため奔走した。<end>"
english = "I was the first to uncover the conspiracy, and I did everything in my power to stop it.<end>"

["1680072"]
japanese = "それまで、侍女としか口をきいたことの<line-break>なかった私が、独断で兵を動かし、<line-break>陰謀に加担した者全員を検挙した。<line-break>だがそれは、有力貴族全体を<line-break>敵に回すことを意味した。<end>"
english = "Until then, I had spoken to no one but my ladies-in-waiting. Yet acting entirely on my own, I mobilized the troops and arrested every conspirator. In doing so, however, I made enemies of all the great nobles.<end>"

["1680073"]
japanese = "当時、七竜家と呼ばれる有力貴族は<line-break>王室と肩を並べるほどの<line-break>力を誇っていた。<line-break>正面から戦っても勝ち目はない…。<line-break>そこで、各家の不和を誘うため<line-break>謀略に通じるようになった。<end>"
english = "In those days, the great nobles known as the Seven Dragon Houses wielded power rivaling that of the royal family. I could never have defeated them in open conflict. So I learned the arts of intrigue, setting the houses against one another.<end>"

["1680074"]
japanese = "一方、クーデターの失敗を知った<line-break>前王妃は、娘のアトレイアを道連れに<line-break>服毒自殺を謀った。<end>"
english = "Meanwhile, when the former queen learned that the coup had failed, she tried to poison herself and take her daughter Atleia with her.<end>"

["1680075"]
japanese = "私は、アトレイアを救うため、<line-break>毒にも詳しくなった。<line-break>\u3000<line-break>家族を守りたいがため、<line-break>必死で戦った。<line-break>…そして、これがその結果だ。<end>"
english = "To save Atleia, I became well versed in poisons. I fought desperately, wanting only to protect my family. And this is the result.<end>"

["1680076"]
japanese = "貴族は力を失った。<line-break>ティアナは母を嫌悪している。<line-break>そして、私の夫は…<line-break>国王セルモノーは<line-break>政治から離れ、<line-break>すべてにおいてあの調子だ。<end>"
english = "The nobles have lost their power. Tiana despises her mother. And my husband... King Selmorno has withdrawn from politics, and he is like that in all things.<end>"

["1680077"]
japanese = "…いっそ、あの政変で殺されておけば<line-break>みな、幸せだったのかもしれぬ。<line-break>そう思いもしたものだ。<line-break>最善だったとは思わぬ。<line-break>だが、後悔はすまい…。<line-break>今はそう思っている。<end>"
english = "There were times when I thought perhaps everyone would have been happier if I had been killed in that upheaval. I do not believe it was the best course. But I will not regret it. That is how I see it now.<end>"

["1680078"]
japanese = "さて、そろそろ<line-break>シドア候の<line-break>愚痴に耳を貸してくれようか。<line-break><value:$28>、<line-break>はずしてくれぬか？<line-break>\u3000<line-break>また来るがよい。<end>"
english = "Well, I suppose it is time I listened to Marquis Sidoa's grievances. <value:$28>, would you leave us? Come and see me again.<end>"

["1680079"]
japanese = "陛下、<line-break>ようこそお越しくださいました。<end>"
english = "Your Majesty, welcome.<end>"

["1680080"]
japanese = "王妃に逆らえる者など<line-break>このロストールにはおらぬ。\u3000\u3000<line-break>\u3000<line-break>ふふ、その王妃のお呼びとあれば<line-break>足を運ばぬわけにはいくまい？<end>"
english = "No one in Rostorl would dare defy the queen. Heh. And when the queen herself summons me, how could I refuse to come?<end>"

["1680081"]
japanese = "陛下、本日はともに食事でもと…。<line-break>私が料理をいたしました。<line-break>\u3000<line-break>すぐに運ばせましょう。<line-break>しばし、お待ちください。<end>"
english = "Your Majesty, I thought we might dine together today. I prepared the meal myself. I shall have it brought in at once. Please wait just a moment.<end>"

["1680082"]
japanese = "いかんな。王妃は忙しい身。<line-break>国の柱ではないか。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>王妃に料理などさせておいては<line-break>国政はどうなる？<line-break>余のような頼りない王に任せる気か？<end>"
english = "That will not do. The queen is far too busy. You are the pillar of this nation, are you not? If you spend your time cooking, what will become of the affairs of state? Do you mean to leave them to an undependable king like me?<end>"

["1680083"]
japanese = "おたわむれを。<line-break>陛下なくして<line-break>国政が立ち行きましょうか？<line-break>夫のために料理をするのは妻の役目。<line-break>私にとって、陛下のために<line-break>料理することは楽しみでございます。<end>"
english = "You jest, Your Majesty. How could the state function without you? It is a wife's duty to cook for her husband, and it gives me great pleasure to cook for you.<end>"

["1680084"]
japanese = "結婚以来、そなたの料理に\u3000\u3000\u3000\u3000\u3000<line-break>余が手をつけたことは<line-break>一度もなかったが、<line-break>それでも、余のために料理を<line-break>するのが楽しいか…。奇特なことよ。<line-break>ふふ、エリスは女の鑑よ。よい妻だ。<end>"
english = "Not once since our marriage have I touched your cooking, yet you still take pleasure in cooking for me? How remarkably devoted. Heh. Eris, you are a model among women. A fine wife indeed.<end>"

["1680085"]
japanese = "しかし、そこまでされると<line-break>かえって、人は勘ぐるものでな。<line-break>特にファーロスの雌狐の料理とあれば。<end>"
english = "But when one goes to such lengths, it only invites suspicion―especially when the food was prepared by the Vixen of Pharos.<end>"

["1680086"]
japanese = "毒をお懸念でしたら、<line-break>私が陛下の毒味をつとめましょう。<end>"
english = "If Your Majesty fears poison, I shall taste the food for you.<end>"

["1680087"]
japanese = "ふっ、戯れ言よ。<line-break>余にはまだ利用価値がある。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ティアナとゼネテスが結婚するまでは<line-break>余に死なれては困るであろうからな。<line-break>…毒など考えられぬことじゃ。<end>"
english = "Hmph. I was only jesting. I still have my uses. Until Tiana and Xenetes are married, my death would be most inconvenient for you. Poison is quite out of the question.<end>"

["1680088"]
japanese = "では、料理を運ばせましょう。<end>"
english = "Then I shall have the meal brought in.<end>"

["1680089"]
japanese = "それには及ばぬ。食欲がないのだ。<line-break>王妃よ。これ以上、用がないのなら<line-break>余は退出してもよいかな。<end>"
english = "There is no need. I have no appetite. My queen, if you have no further business with me, may I withdraw?<end>"

["1680090"]
japanese = "…よろしゅうございます、陛下。<end>"
english = "...Very well, Your Majesty.<end>"

["1680091"]
japanese = "ふふふ、下がれでよい。<line-break>王妃がこのロストールの主<line-break>なのだからな。ははは…。<end>"
english = "Heh heh. You may simply order me to leave. After all, it is the queen who rules Rostorl. Ha ha ha...<end>"

["1680092"]
japanese = "遠慮することはない。<line-break>入るがよい。<end>"
english = "There is no need to stand on ceremony. Come in.<end>"

["1680093"]
japanese = "気にすることはない。<line-break>…慣れた。<line-break>\u3000<line-break>…さすがに嫁いですぐの時は<line-break>つらかったがな。<end>"
english = "Pay it no mind. I am used to it now. Though I admit, it was painful just after I married.<end>"

["1680094"]
japanese = "フフ、事情はわかっていると思う。\u3000\u3000<line-break>残り物ですまぬが、<line-break>料理を食べてくれぬか？<line-break>食べ物を捨てられぬ性分でな。<line-break>ひとりで食べてもよいが<line-break>それは、さすがにさびしい。<end>"
english = "Heh. I expect you understand what happened. Forgive me for offering you leftovers, but would you share the meal with me? I cannot bear to waste food. I could eat it alone, but that would be rather lonely.<end>"

["1680095"]
japanese = "私は料理には自信があるのだ。<line-break>娘時分に、将来の夫のためと<line-break>みっちりと仕込まれたのでな。<line-break>裁縫も機織りも一生懸命覚えた。<line-break>意外であろう？<end>"
english = "I am quite confident in my cooking. As a girl, I was thoroughly trained in it for the sake of my future husband. I also worked hard to learn sewing and weaving. Surprising, is it not?<end>"

["1680096"]
japanese = "フフフ、やさしいのだな。<line-break>それならば、ともに食べてくれるか？<line-break>ファーロスの雌狐の料理を。<end>"
english = "Heh heh heh. How kind of you. Then will you dine with me and sample the Vixen of Pharos's cooking?<end>"

["1680097"]
japanese = "礼を言う。<line-break>さっそく料理を運ばせよう。<end>"
english = "Thank you. I shall have the meal brought in at once.<end>"

["1680098"]
japanese = "今日は…すまぬな。<line-break><value:$28>。<end>"
english = "About today... I'm sorry, <value:$28>.<end>"

["1680099"]
japanese = "よ、<value:$28>じゃねえか。<line-break>元気かい？<end>"
english = "Hey, if it isn't <value:$28>. How've you been?<end>"

["1680100"]
japanese = "普段はこっちじゃ飲まないんだが<line-break>料理がイケてるんでな。<line-break>たまに来てるんだ。<line-break>料理っていやあ、実はエリスの叔母貴は<line-break>かなり、料理がうまいんだぜ。<line-break>意外だろ？<end>"
english = "I don't usually drink here, but the food's good, so I stop by now and then. Speaking of food, Eris's aunt is actually one hell of a cook. Surprised?<end>"

["1680101"]
japanese = "叔母貴の料理を食う機会があってさ。<line-break>あんまり、うまいんでな。<line-break>俺は叔母貴の分まで食っちまったよ。<end>"
english = "I had a chance to try her cooking once. It was so good, I ended up eating her share too.<end>"

["1680102"]
japanese = "<if><value:$29><equal>%0ま、なんだ。結婚したら、<line-break>嫁さんの作るもんをうまいうまいって<line-break>食ってやれる男になれよ。<line-break>なんでって…、<line-break>ま、なんでもだ。<end>ま、なんだ。お前さんも<line-break>誰かを好きになるだろうけれど<line-break>好きになる相手は考えなくちゃな。<line-break>失敗すると、つらいと思うぜ。<line-break>ま、恋愛ってのは、そんなに<line-break>割り切れたもんでもないんだろうがな。<end>"
english = "<if><value:$29><equal>%0Well, when you get married, be the kind of man who eats whatever his wife makes and tells her how good it is. Why? Well... never mind.<end>Well, you'll fall for someone someday, but you'd better think carefully about who. Choose badly and it'll hurt. Not that love's something you can reason out so neatly, I suppose.<end>"

