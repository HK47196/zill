english = "Still, if you ever need my help, call for me.<end>"

["1350048"]
japanese = "俺には、どうしても<line-break>お前さんが関わっていることのほうが<line-break>大事だって思えるんでね。<end>"
english = "Somehow, anything involving you seems more important to me.<end>"

["1350049"]
japanese = "確か、<value:$28>たちは、<line-break>賢者の森の猫屋敷を中継に<line-break>してんだったな。<end>"
english = "If I remember right, <value:$28>, you and your companions use the Cat Manor in Sage's Forest as a way station.<end>"

["1350050"]
japanese = "俺のことはよく知ってんだろ？<line-break>我ながら、まっすぐ向かう保証は<line-break>ないもんでな。<end>"
english = "You know me well enough. Even I can't promise I'll go straight there.<end>"

["1350051"]
japanese = "あーあ、やだねえ！<line-break>そう辛気くせえ顔されたって、<line-break>ちっともよくはならねえよ！<end>"
english = "Oh, spare me! Putting on such a gloomy face won't make me any better!<end>"

["1350052"]
japanese = "危うく踏みとどまったシャバの<line-break>うまい酒と…<line-break> <line-break>起きたコトがコトだ、途中で寄らなきゃ<line-break>ならねえところもあるだろうしな。<end>"
english = "Some good drink here in the world of the living I nearly left behind... And after everything that's happened, there are probably places I'll need to stop along the way.<end>"

["1350053"]
japanese = "ま、何にせよ、お前が俺の力を<line-break>必要とする時まで、ちゃんと<line-break>万全にしとくから、安心しなって。<end>"
