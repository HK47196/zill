["1350000"]
japanese = "ジラーク、ボリューム４開始<end>"
english = ""

["1350001"]
japanese = "知っていると思うが、<line-break>俺とエストは母親が違う。<line-break>実の母はダルケニスだった。<line-break>義母はダルケニスの俺に<line-break>よくしてくれ、俺を当主にまでした。<line-break>実の子のエストを差し置いてな。<end>"
english = "You may already know this, but Est and I had different mothers. My birth mother was a Darkenith. My stepmother treated me well despite my being Darkenith, and even made me head of the family instead of her own son, Est.<end>"

["1350002"]
japanese = "俺がダルケニスであることなど関係なく<line-break>義母は、俺のことを才能があると<line-break>よく、はげましてくれた。<line-break>その義母が死ぬとき、<line-break>初めて実の母の消息を話してくれた。<line-break>母が冒険者に討たれたことを…。<end>"
english = "My stepmother never cared that I was Darkenith. She often encouraged me, saying I had talent. Only as she lay dying did she finally tell me what had become of my birth mother: adventurers had slain her.<end>"

["1350003"]
japanese = "義母は、ダルケニスだからと<line-break>俺が自信をなくすのを恐れて、<line-break>死の間際まで言い出せなかったのだ。<line-break>だが、俺にはそんな義母が偽善に思えた。<line-break>そして、俺は義母の心配に違わず<line-break>心を閉ざした、かたくなな男になった。<end>"
english = "My stepmother feared I would lose faith in myself because I was Darkenith, so she kept silent until her dying breath. But her concern struck me as hypocrisy. And just as she had feared, I closed my heart and became a bitter, obstinate man.<end>"

["1350004"]
japanese = "お前に会うまでは、な…<end>"
english = "Until I met you...<end>"

["1350005"]
japanese = "ダルケニスだからというだけで<line-break>無条件に殺される、そんな世の中で<line-break>愛や正義を語る奴が気に入らなかった。<line-break>無論、冒険者もな。<line-break>貴様のような正義ぶった<line-break>甘っちょろい冒険者は大嫌いだった。<end>"
english = "In a world where one could be killed without question merely for being Darkenith, I despised anyone who spoke of love or justice. Adventurers included, of course. I especially hated naive, self-righteous adventurers like you.<end>"

["1350006"]
japanese = "…なのに、妙な話だな。<line-break>貴様のような甘っちょろい冒険者に<line-break>俺は救われている。<line-break>貴様はつまらない正義感の持ち主なのに<line-break>ダルケニスの俺を殺すどころか<line-break>自分を犠牲にして助けてくれている。<end>"
english = "And yet, how strange. I have been saved by just such a naive adventurer. For all your petty sense of justice, instead of killing me for being Darkenith, you have sacrificed yourself to help me.<end>"

["1350007"]
japanese = "結局、自分ひとりで<line-break>こだわって<line-break>世界をゆがめていたんだな。<end>"
english = "In the end, I was the only one clinging to it, twisting the world to fit my view.<end>"

["1350008"]
japanese = "教えてくれ<line-break>あの晩のことをゼネテスが<line-break>知っているようだったのは、<line-break>奴があそこにいたからなのだろう？<line-break>そして貴様と一緒に、<line-break>俺を救ったからなのだろう？<end>"
english = "Tell me. Xenetes seemed to know what happened that night because he was there, didn't he? Because he helped you save me?<end>"

["1350009"]
japanese = "…そうか。<end>"
english = "So that's how it was.<end>"

["1350010"]
japanese = "…仲間に入れてくれ。<line-break> <line-break> <line-break>冒険者になって、<line-break>お前とともに歩きたい、そして<line-break>あの男が見てきた世界を見たいのだ。<end>"
english = "Let me join you. I want to become an adventurer and walk beside you. I want to see the world that man saw.<end>"

["1350011"]
japanese = "礼を言う、<value:$28>。<end>"
english = "You have my thanks, <value:$28>.<end>"

["1350012"]
japanese = "なるほど、では、その猫屋敷とやらで<line-break>声がかかるのを待てばよいのだな？<end>"
english = "I see. Then I should wait at this Cat Manor of yours until I am called for, yes?<end>"

["1350013"]
japanese = "いろいろなことが起きた…。<line-break>これから俺にも整理せねばならん考えが<line-break>いろいろと浮かんでくるのかもしれん。<line-break>それらをまとめつつ、<line-break>冒険への旅立ちを待つとしよう。<line-break>では、先に行く。<end>"
english = "Much has happened. I expect many thoughts will come to me now, thoughts I must put in order. I shall sort through them as I await the day we set out. I will go on ahead.<end>"

["1350014"]
japanese = "…あのとき、<line-break>俺がダルケニスとして覚醒したとき<line-break>貴様もいたのか、ゼネテス。<end>"
english = "When I awakened as a Darkenith... you were there too, Xenetes?<end>"

["1350015"]
japanese = "んー、まあ、な。<end>"
english = "Mm... yeah, I was.<end>"

["1350016"]
japanese = "…そして、俺を救った。<line-break>今もだ…<line-break>なぜだ？<end>"
english = "And you saved me. You still are... Why?<end>"

["1350017"]
japanese = "なぜって？<end>"
english = "Why, you ask?<end>"

["1350018"]
japanese = "俺はファーロス家とは敵対していた。<line-break>お前たちを滅ぼそうとした。<line-break>いや、それ以前に俺はダルケニスだ。<end>"
english = "I was an enemy of House Pharos. I tried to destroy all of you. More than that, I am Darkenith.<end>"

["1350019"]
japanese = "ふーん。<line-break>そりゃ、見解の相違だな。<line-break> <line-break>俺には、お前さんが<line-break>助けを求めてるような気がしたんだ。<line-break>それだけさ。<end>"
english = "Huh. I suppose we saw things differently. It seemed to me like you were asking for help. That's all.<end>"

["1350020"]
japanese = "許してくれ…とは言わぬ。<line-break>許されることではないからな。<line-break>ただ、一緒に旅をさせてくれ。<line-break>…俺も、<line-break>お前たちの見てきた世界が<line-break>見たいのだ。<end>"
english = "I will not ask you to forgive me. What I did cannot be forgiven. Just let me travel with you. I too want to see the world you have seen.<end>"

["1350021"]
japanese = "いいだろ。<line-break>なんも、問題はねえ。<line-break>そうだろ、<value:$28>？<end>"
english = "Sure. I don't see any problem. Right, <value:$28>?<end>"

["1350022"]
japanese = "よし、すべてよし。<line-break>んじゃ、ま、晴れて出直しってことで…<line-break>俺はゼネテス、冒険者だ。<line-break>これからよろしく頼むぜ。<line-break>冒険者<value:$28>、<line-break>そして、冒険者レムオンよ。<end>"
english = "Good, then it's settled. A fresh start all around. I'm Xenetes, adventurer. Glad to have you with us, Adventurer <value:$28> and Adventurer Lemghon.<end>"

["1350023"]
japanese = "あ、ああ。<line-break>よろしく頼む、<line-break>冒険者、ゼネテス。<end>"
english = "Y-yes. Likewise... Adventurer Xenetes.<end>"

["1350024"]
japanese = "それと、だ。<end>"
english = "One more thing.<end>"

["1350025"]
japanese = "………………？<end>"
english = "...?<end>"

["1350026"]
japanese = "確か、<value:$28>たちは、<line-break>賢者の森の猫屋敷を中継に<line-break>してんだったな。<end>"
