["1350037"]
japanese = "俺なら、なんとかなったって<line-break>思うほど、傲慢じゃないさ。<line-break>ただ責任も感じないほど図太くもない。<line-break>シャリはティアナが欲しかったんだ。<line-break>そして、俺はみすみす<line-break>奴にティアナを渡してしまった…。<end>"
english = "I'm not arrogant enough to think I could have fixed everything. But I'm not so callous that I feel no responsibility. Shalli wanted Tiana, and I let him take her right from under my nose.<end>"

["1350038"]
japanese = "シャリがいったい何をたくらんで<line-break>こんなことをしたのかは<line-break>わからない。<line-break>だが、こんなにあっさりと<line-break>ロストールを捨てたからには<line-break>もっと、でかい何かが目的なはずだ。<end>"
english = "I don't know what Shalli was plotting when he did this. But if he abandoned Rostorl so readily, he must be after something much bigger.<end>"

["1350039"]
japanese = "<value:$28>、<line-break>一緒に旅に連れていってくれ。<line-break>頼む…。<end>"
english = "<value:$28>, let me travel with you. Please.<end>"

["1350040"]
japanese = "確か、<value:$28>たちは、<line-break>賢者の森の猫屋敷を中継に<line-break>してんだったな。<end>"
english = "If I remember right, <value:$28>, you and your companions use the Cat Manor in Sage's Forest as a way station.<end>"

["1350041"]
japanese = "お前が俺の力を必要とする時までにゃ、<line-break>ちゃんと万全にしとくから、<line-break>安心しなって。<line-break>じゃあな、<value:$28>。<end>"
english = "I'll be back in fighting shape by the time you need me, so don't worry. See you around, <value:$28>.<end>"

["1350042"]
japanese = "ディンガル軍なら大丈夫だ。<line-break>カルラはロストールに攻めてこられない。<end>"
english = "The Dyneskal Army won't be a problem. Karula can't attack Rostorl.<end>"

["1350043"]
japanese = "帝国宰相殿の目線で考えてみな。<line-break>カルラにロストールを占領させるなんて<line-break>虎に翼を与えるようなもんだ。<line-break>ロストールが無力化しているのなら<line-break>カルラに軍を進めさせるより<line-break>有利に講和したほうがよっぽどいい。<end>"
english = "Look at it from the Imperial Chancellor's point of view. Letting Karula occupy Rostorl would be like giving wings to a tiger. If Rostorl has already been neutralized, it makes far more sense to negotiate peace from a position of strength than to let Karula advance.<end>"

["1350044"]
japanese = "追加メッセージここから<end>"
english = ""

["1350045"]
japanese = "さあな。カルラほどの戦略眼を持つ将が<line-break>そのへん無視してまで、俺たちを完全に<line-break>潰そうとした理由まではわからないね。<end>"
english = "Who knows? I can't say why a commander with Karula's strategic eye would ignore all that just to wipe us out completely.<end>"

["1350046"]
japanese = "やれやれ、ロストールもメチャクチャだ。<line-break>問題は山積み。<line-break>これから立て直しが大変だな。<end>"
english = "What a mess. Rostorl is in complete disarray too, and the problems are piling up. Rebuilding it won't be easy.<end>"

["1350047"]
