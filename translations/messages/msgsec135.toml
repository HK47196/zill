["1350058"]
japanese = "人間、追いつめられるとダメだね。<line-break>こいつは、<line-break>あとで念入りに処分しなきゃな。<end>"
english = "People really lose their heads when they're cornered. I'll have to make very sure this gets destroyed later.<end>"

["1350059"]
japanese = "<value:$28>様、<line-break>助け出していただいて<line-break>本当にありがとうございます。<end>"
