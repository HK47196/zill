["1350060"]
japanese = "これから、ですか？<line-break>はい。実はずっとやりたいと<line-break>考えていたことがあるのです。<end>"
english = "What will I do now? Well, there is something I have long wanted to do.<end>"

["1350061"]
japanese = "<value:$28>様に出会って<line-break>私、ロストールの人々ともっと<line-break>仲良くなりたいと思っておりました。<line-break>二度の兵乱とこの度の内乱で<line-break>ロストールも大きな痛手を受け、<line-break>困っている人も多いことでしょう。<end>"
english = "Ever since meeting you, <value:$28>, I have wanted to grow closer to the people of Rostorl. Two wars and this latest civil conflict have dealt Rostorl a grievous blow. Many people must be suffering.<end>"

["1350062"]
japanese = "こういう方を助け、広く人とふれあい<line-break>これからのロストールについて<line-break>考えていきたいと思っています。<end>"
english = "I want to help those people, meet people from all walks of life, and consider what Rostorl's future should be.<end>"

["1350063"]
japanese = "リューガ邸の一室を、ロストール復興の<line-break>本拠として提供していただけないか、<line-break>エスト様にお願いしようと思うのです。<line-break>破壊もまぬがれたようですし、<line-break>何より、王宮にいるよりも<line-break>町の方々の声がよく届くはずですもの。<end>"
english = "I intend to ask Lord Est to provide a room in the Ryuga residence as a base for Rostorl's reconstruction. It appears to have escaped destruction, and above all, the voices of the townspeople will reach me far more readily there than at the palace.<end>"

["1350064"]
japanese = "<value:$28>様にも<line-break>助けていただきたいことが<line-break>多々出てくると思います。<line-break>お忙しいとは存じますが<line-break>お時間があればお寄りください。<end>"
english = "I expect there will be much I must ask of you as well, <value:$28>. I know you are busy, but please visit when you have the time.<end>"

["1350065"]
japanese = "<value:$28>様、<line-break>助け出していただいて<line-break>本当にありがとうございます。<end>"
english = "Thank you so very much for rescuing me, <value:$28>.<end>"

["1350066"]
japanese = "これから…ですか？<line-break>具体的なことは考えていないのですが<line-break>王都のみなさんのために何かしようと。<line-break>王都もこの事件で荒れてしまいました。<line-break>王家の人間として、みなさんのために<line-break>率先して事に当たらないと。<end>"
english = "What will I do now? I have no specific plans, but I want to do something for everyone in the capital. This incident has left the city in ruins. As a member of the royal family, I must take the lead in helping its people.<end>"

["1350067"]
japanese = "…王女ですもの。<line-break>そう言わないといけないんですよね…<line-break>きっと。<end>"
english = "I am a princess, after all. That is what I am supposed to say... surely.<end>"

["1350068"]
japanese = "…王女、王女、王女。<line-break>…では、王女でない私は<line-break>何者なのでしょう？<end>"
english = "Princess, princess, princess... Then who am I, if I am not a princess?<end>"

["1350069"]
japanese = "母は…あの人はとてもきれいです。<line-break>お父様には釣り合わない。<line-break>…きっと、誰かがいたはずです。<line-break>きっと、私は王女ですらない…<line-break>ただいつもへらへらと笑顔でいる<line-break>他人に媚びを売るだけの情けない女！<end>"
english = "My mother... that woman is so beautiful. Far too beautiful for Father. There must have been someone else. Surely I am not even a princess... just a pathetic woman who simpers and smiles, forever currying favor with everyone!<end>"

["1350070"]
japanese = "だから、放っておいて！<end>"
english = "So leave me alone!<end>"

["1350071"]
japanese = "<value:$28>様。<end>"
english = "<value:$28>...<end>"

["1350072"]
japanese = "手紙？<line-break>ゼネテス様の？<end>"
english = "A letter? From Lord Xenetes?<end>"

["1350073"]
japanese = "\u3000これを読んでるってことは<line-break>\u3000\u3000俺は死んだってことか。<end>"
english = "If you're reading this, I guess that means I'm dead.<end>"

["1350074"]
japanese = "\u3000\u3000後悔しないようには生きてきたつもりだが、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000いざ死ぬとなると、<line-break>\u3000\u3000\u3000結構やり残したことがあるもんだ。<end>"
english = "I tried to live without regrets, but now that death's staring me in the face, it turns out I've left quite a lot undone.<end>"

["1350075"]
japanese = "\u3000\u3000もし、ティアナに会うことがあったら<line-break>\u3000\u3000\u3000\u3000\u3000伝えて欲しいことがある。<end>"
english = "If you ever see Tiana, there's something I want you to tell her.<end>"

["1350076"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000ティアナへ<line-break>\u3000\u3000あんたがどんなに疑いを持とうとも<line-break>\u3000\u3000\u3000\u3000\u3000あんたは叔母貴の娘だ。<end>"
english = "Tiana, no matter what doubts you may have, you are my aunt's daughter.<end>"

["1350077"]
japanese = "\u3000\u3000\u3000叔母貴は王を愛していた。<line-break>\u3000\u3000\u3000愛されようと必死だった。<line-break>\u3000\u3000\u3000\u3000\u3000他の誰もいないさ。<end>"
english = "My aunt loved the king. She tried desperately to win his love. There was no one else.<end>"

["1350078"]
japanese = "\u3000\u3000\u3000あんたの無理解は叔母貴を苦しめていた。<line-break>\u3000\u3000\u3000叔母貴ががんばったってどうにもならん。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000あんたが嫌っていたのは、<line-break>\u3000\u3000\u3000\u3000\u3000あんた自身だったんだからな。<end>"
