english = "<select><value:$20>%3You know... seeing <value:$28> makes me so happy. My beloved brother is missing, so I shouldn't even be thinking about that... I feel awful about myself for it.<end>Until now, I never imagined anyone could become more important to me than my brother. Right now, though, I think I shouldn't be thinking about that...<end>Whether it's my brother or <value:$28>, men have it easy. They don't care how a woman might feel.<end>"

