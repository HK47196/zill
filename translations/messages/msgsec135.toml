english = "Of course... In your condition, you cannot return to adventuring immediately.<end>"

["1350031"]
japanese = "あーあ、やだねえ！<line-break>そう辛気くせえ顔されたって、<line-break>ちっともよくはならねえよ！<end>"
english = "Oh, spare me! Putting on such a gloomy face won't make me any better!<end>"

["1350032"]
japanese = "必要なのは、栄養と休養、<line-break>危うく踏みとどまったシャバの<line-break>うまい酒と…<line-break>起きたコトの、後腐れない決着だ。<end>"
english = "What I need is food and rest, some good drink here in the world of the living I nearly left behind... and a clean end to everything that's happened.<end>"

["1350033"]
japanese = "何にせよ、<value:$28>…<line-break> <line-break> <line-break>お前が俺の力を必要とする時までにゃ、<line-break>ちゃんと万全にしとくから、<line-break>安心しなって。<end>"
english = "Anyway, <value:$28>, I'll be back in fighting shape by the time you need me. Don't worry.<end>"

["1350034"]
japanese = "じゃあな、<value:$28>。<end>"
english = "See you around, <value:$28>.<end>"

["1350035"]
