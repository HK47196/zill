["1350417"]
japanese = "内部でもめる時間を与えるためにね。<line-break>予定通りレムオンは出兵拒否。<line-break>前の戦いでビビってた貴族も付和雷同。<line-break>で、王妃側が困って屈服すると思いきや、<line-break>ライバルのゼネテスが出ばって<line-break>あたしの軍を破っちゃった。<end>"
