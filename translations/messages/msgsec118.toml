["1180037"]
japanese = "おやおや。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>久しぶりに帰ってきたと思ったら、<line-break>さっそくおねだりですか？<line-break>おみやげを持ってくるくらいが<line-break>普通なんですが…<line-break>育て方を間違えましたかねえ？<end>"
english = "Well, well. You finally come home after all this time, and the first thing you do is ask me for something? Most sons would at least bring a gift. Perhaps I raised you wrong.<end>"

["1180038"]
japanese = "ところで、<line-break>お仲間はどうしたのですか？<end>"
english = "By the way, what became of your companions?<end>"

["1180039"]
japanese = "あなたとの戦いに\u3000\u3000\u3000\u3000\u3000\u3000<line-break>他の者の力を借りる気などない。<line-break>\u3000<line-break>己の力のみで、決着をつける。<line-break>それがあなたへの礼儀だ。<line-break>我が父よ。<end>"
