["1180012"]
japanese = "かつて、魔王バロルの娘エスリンは、<line-break>破壊神の円卓騎士バルザーの子を<line-break>身ごもった。<line-break>けれど、魔王バロルは、<line-break>エスリンの首をかき切って<line-break>森に捨てたわ。<end>"
english = "Long ago, Ethlinn, daughter of Balor, Demon King, conceived a child by Baltzer, a Knight of the Round Table serving the God of Destruction. But Balor slit Ethlinn's throat and left the body in the forest.<end>"

["1180013"]
japanese = "バロルの娘の子がバロルを滅ぼす<line-break>という妖術宰相ゾフォルの予言を<line-break>真に受けてね。<line-break>父さんは森でエスリンの屍を見つけ<line-break>そのお腹の子を救ったの。<end>"
english = "He took the Sorcerous Chancellor Zofor's prophecy to heart: a child born to Balor's daughter would destroy Balor. Father found Ethlinn's body in the forest and saved the child in the womb.<end>"

["1180014"]
japanese = "…その赤ん坊がネメアよ。<line-break>\u3000<line-break>\u3000<line-break>そして、私とネメアは兄妹として<line-break>育てられた…。でも、今の兄さんは、<line-break>もう昔の兄さんではないわ。<end>"
english = "That child was Nemea. Nemea and I were raised as brother and sister... But my brother isn't the man he once was.<end>"

["1180015"]
