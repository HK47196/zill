english = "<if><value:$01><equal>3Hm, this fighting spirit... Could it be Nemea...?<end><if><value:$01><equal>4I-I think I feel some kind of... incredible pressure.<end><if><value:$01><equal>5H-hey! You feel that incredible pressure too?!<end><if><value:$01><equal>6W-what is that...? I'm not imagining it, am I? That pressure is incredible!<end><if><value:$01><equal>13That oppressive presence...! Who is it?!<end><if><value:$01><equal>10S-sis! I feel this incredible pressure!<end><if><value:$01><equal>14Hmm. What is this overwhelming presence...?<end><if><value:$01><equal>15Hey, <value:$28>. Don't you feel that oppressive presence?<end><if><value:$01><equal>17W-what is this?! This awful pressure!<end><if><value:$01><equal>19Hey... can you feel that? It's really intimidating, <value:$28>...<end><if><value:$01><equal>11Th-this fighting spirit... Nemea...?!<end><if><value:$01><equal>21That oppressive presence...! What in the...?<end><if><value:$01><equal>23Th-this fighting spirit... Could it be Nemea...?!<end><if><value:$01><equal>27That oppressive presence...! Who is it?!<end><if><value:$01><equal>26What is this overwhelming presence...?!<end><if><value:$01><equal>24What an oppressive presence... Who... is it?<end><if><value:$01><equal>25There's something really intimidating here...<end><if><value:$01><equal>192...! S-such overwhelming... power...!<end><if><value:$01><equal>193<value:$28>...! Th-this presence... it's overwhelming! I'm scared! I'm scared!<end><if><value:$01><equal>194Th-this overwhelming presence...! No mistake! It's... him.<end><if><value:$01><equal>191S-such an intimidating presence. Who is it?!<end><if><value:$01><equal>190What tremendous fighting spirit! Is that Nemea?!<end>M-maybe it's just me...? But I can feel this oppressive presence...<end>"

