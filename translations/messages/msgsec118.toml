["1180017"]
japanese = "ネメアも闇の神器を狙っていることは、<line-break>もう知っているかしら？<line-break>ネメアは、次の神器を見つけたのよ。<line-break>場所は、猫屋敷。<line-break>ねらいは、オルファウスが所有する<line-break>魂吸いの指輪。<end>"
