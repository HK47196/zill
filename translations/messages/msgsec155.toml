["1550026"]
japanese = "これはセヅネの根というものです。<line-break>これを持つと、ＶＩＴが下がるので<line-break>注意してください。<line-break><line-break>また、これはかなり危険なものなので、<line-break>捨てるなら元のところへ返してください。<line-break>それが冒険者の心得というものです。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000冒険者ギルド<end>"
english = "This is Sezune Root. Be careful: carrying it lowers ＶＩＴ. It is also quite dangerous, so if you discard it, return it to where you found it. That is the adventurer's code. ―Adventurers' Guild<end>"

