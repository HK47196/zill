["230040"]
japanese = "手に入れたいものがあるんだ。<line-break><value:$15>なんだけどね。<line-break>なにしろモンスターがたくさんいるもんでね、<line-break>あたしたちじゃ取りにいけないのさ。<line-break><value:$15>を探して持ってきてもらえる？<line-break><value:$1B>日以内にやってくれたら、<line-break><value:$1A>ギア払うよ。<end>"
english = "There's something we want: <value:$15>. There are so many monsters around that we can't go and get it ourselves. Could you find <value:$15> and bring it back? Complete the job within <value:$1B> days and we'll pay <value:$1A> Gea.<end>"

["230041"]
japanese = "<value:$15>が、必要になりました。<line-break>そこで、冒険者の方にお願いしようと思います。<line-break>期限は、<value:$1B>日以内。<line-break>お礼は、<value:$1A>ギアとさせていただきます。<end>"
english = "<value:$15> is now needed, so an adventurer's help is requested. Deadline: within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["230042"]
japanese = "旅の途中、モンスターに襲われ、<line-break><value:$15>をなくしてしまいました。<line-break>どうか、モンスターの住みかに向かい、<line-break>取り返してきてください。<line-break>謝礼は、<value:$1A>ギア用意しました。<line-break>期限は、<value:$1B>日以内でお願いします。<end>"
