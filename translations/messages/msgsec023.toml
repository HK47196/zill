["230044"]
japanese = "村の女たちが作っている装飾品の材料で、<line-break>必要な物があってな。<line-break><value:$15>なんだが、見つけて<line-break>持ち帰ってもらえんか。<line-break>すまないが、<value:$1B>日以内で頼みたい。<line-break>報酬は、<value:$1A>ギアでどうかな？<end>"
english = "We need material for the ornaments made by the women of the village: <value:$15>. Could you find it and bring it back? Please complete the job within <value:$1B> days. How does <value:$1A> Gea sound as a reward?<end>"

["230045"]
japanese = "様々な道具を扱う我々にとって、材料の採取は<line-break>欠かせない仕事なのですが、<line-break>外はモンスターが多くて、非常に困っています。<line-break>代わりに材料を採ってきてもらえませんか？<line-break><value:$15>を持ち帰ってください。<line-break>期限は、<value:$1B>日以内。<line-break>お礼は、<value:$1A>ギアでどうでしょうか。<end>"
english = "Gathering materials is essential to our trade in all kinds of tools, but the many monsters outside have put us in a difficult position. Could you gather material in our place? Please bring back <value:$15> within <value:$1B> days. Would <value:$1A> Gea be acceptable as a reward?<end>"

["230046"]
japanese = "あんたたちを見込んで頼みたいことがあるんだ。<line-break><value:$15>の探索と入手だ。<line-break>モンスターがよく出る所らしいから、<line-break>うまくやってくれよ。<line-break><value:$1B>日以内が期限。<line-break>報酬は、<value:$1A>ギアだぜ。<end>"
