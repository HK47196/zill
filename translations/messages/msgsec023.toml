["230033"]
japanese = "我がフゴー商会では、宿屋だけでなく、<line-break>手広い商売をしております。各種材料の調達も<line-break>そのひとつですが、入手困難なものが<line-break>ありまして、その探索をお願いしたいのです。<line-break><value:$15>というものですが、<line-break>報酬<value:$1A>ギアで、<value:$1B>日以内、<line-break>という条件でお願いできませんか？<end>"
english = "Hugo Trading Company runs an inn and other businesses. Please find the hard-to-get material <value:$15>. Reward: <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["230034"]
japanese = "いや、参りました。街の外にでかけていたら、<line-break>モンスターに出くわしてしまいました。<line-break>なんとか逃げることはできたのですが、大事な<line-break><value:$15>を落としてしまいました。<line-break>探して持ち帰ってくださる冒険者はいませんか。<line-break><value:$1B>日以内にやってくださったのならば、<line-break><value:$1A>ギアさしあげます。<end>"
english = "What a mess. Monsters appeared during a trip outside town. Escape was possible, but an important possession was dropped in the process: <value:$15>. Is there an adventurer who can find it and bring it back? Complete the job within <value:$1B> days to receive <value:$1A> Gea.<end>"

["230035"]
japanese = "我が邸の高級料理の隠し味<value:$15>を<line-break>持ち帰ってほしい。危険なところにあるのだが、<line-break>貴重な材料ゆえ、ぜひ欲しい。<line-break>褒美として、<value:$1A>ギアとらそう。<line-break><value:$1B>日以内に頼むぞ。<end>"
english = "Bring back <value:$15>, the secret ingredient in the fine cuisine served at this estate. It is found in a dangerous place, but it is a precious ingredient and must be obtained. A reward of <value:$1A> Gea shall be granted. Complete the task within <value:$1B> days.<end>"

["230036"]
japanese = "使いの者が、途中でモンスターに襲われ、<line-break>荷物を置いて逃げてきてしまいました。<line-break>荷物の中の<value:$15>だけは、<line-break>とりかえさねばなりません。<line-break>探索を行い、品物を持ち帰ってください。<line-break><value:$1A>ギアを用意しました。<line-break><value:$1B>日以内でお願いします。<end>"
english = "Our messenger was attacked by monsters along the way and had to abandon the baggage to escape. At the very least, we must recover <value:$15> from it. Search for the baggage and bring the item back. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["230037"]
japanese = "村の特産品の材料を採ってきてくだされ。<line-break>戦いの素人が採りに行くには<line-break>ちとやっかいな品物での。<line-break><value:$15>というんじゃ。<line-break><value:$1B>日以内に頼むよ。<line-break>あんまり多くはないが、お礼もするつもりじゃ。<end>"
english = "Please gather material for one of our village specialties. The item is a bit too troublesome for anyone inexperienced in combat to collect. It is called <value:$15>. Please bring it back within <value:$1B> days. We cannot offer much, but there will be a reward.<end>"

["230038"]
japanese = "<value:$15>を手に入れる必要があります。<line-break>これがあれば商売がうまくいくのです。<line-break><value:$15>を捜し、持ち帰ってください。<line-break>期限は<value:$1B>日以内といたします。<line-break><value:$1A>ギアの報酬をお支払いします。<end>"
english = "<value:$15> is needed. With it, business will prosper. Find <value:$15> and bring it back. Deadline: within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

