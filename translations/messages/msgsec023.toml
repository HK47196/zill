["230043"]
japanese = "自治には、ある程度の軍備も必要です。<line-break>このたび装備の充実のために、材料である<line-break><value:$15>が、必要となりました。<line-break><value:$1B>日以内で、探索し、持ち帰ってください。<line-break>報酬は、<value:$1A>ギアです。<end>"
