["230019"]
japanese = "<value:$15>を探し出し、<line-break>持ち帰る冒険者を募集している。<line-break>報酬は、<value:$1A>ギア。<line-break>期限は、<value:$1B>日以内である。<line-break>途中、モンスターの襲撃が予想される。<line-break>精強な戦士の応募を期待している。<end>"
english = "Seeking an adventurer to find and bring back <value:$15>. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days. Monster attacks are expected along the way. Strong, capable fighters are encouraged to apply.<end>"

["230020"]
japanese = "<value:$15>を持ち帰ってくださる方を<line-break>募集しています。取りに行きたいのですが、<line-break>モンスターがたくさんいて近づけません。<line-break><value:$1B>日以内にやっていただけたならば、<line-break><value:$1A>ギア進呈いたします。<end>"
english = "Seeking someone to bring back <value:$15>. Retrieving it directly would be preferable, but the many monsters make it impossible to get close. Complete the job within <value:$1B> days to receive <value:$1A> Gea.<end>"

["230021"]
japanese = "我々の魔道研究において、<line-break><value:$15>が必要になった。<line-break>至急入手する必要がある。<line-break><value:$15>を探索、入手して帰還せよ。<line-break><value:$1B>日以内を期限とする。<line-break>成功すれば、<value:$1A>ギアの報酬を与える。<end>"
english = "Our magical research now requires <value:$15>, and it must be obtained urgently. Search for <value:$15>, secure it, and return. Deadline: within <value:$1B> days. Reward upon success: <value:$1A> Gea.<end>"

["230022"]
japanese = "日頃はご愛顧をいただきありがとうございます。<line-break>私ども道具屋ギルドは、<value:$15>を<line-break>入手する必要に迫られています。<line-break><value:$15>を探して持ち帰ってください。<line-break><value:$1B>日以内、<value:$1A>ギアの報酬です。<end>"
english = "Thank you for your continued patronage. The Item Merchants' Guild urgently needs <value:$15>. Please find <value:$15> and bring it back. Deadline: within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["230023"]
japanese = "毎度どうも。いつも世話になってるね。<line-break>今回の依頼は、<value:$15>の探索なんだ。<line-break>仕事上でこいつが必要になってね。<line-break><value:$1B>日以内に持ち帰ってほしいんだ。<line-break>お礼は、<value:$1A>ギアだ。<end>"
english = "Thanks as always. Your help is always appreciated. This time, the request is to find <value:$15>. It's needed for work, so please bring it back within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["230024"]
japanese = "神殿に救いを求めて来る者に<line-break>分け与えるための品が不足しております。<line-break>材料となる<value:$15>を<line-break>探して持ち帰ってください。<line-break><value:$1A>ギアを寸志として進呈いたします。<line-break><value:$1B>日以内にやりとげるようお願いします。<end>"
english = "We are running short of items to distribute to those who come to the temple seeking aid. Please find and bring back <value:$15>, which is needed to make them. We offer a modest reward of <value:$1A> Gea. Please complete the task within <value:$1B> days.<end>"

["230025"]
japanese = "<value:$15>が必要になりましたので、<line-break>探して持ち帰ってきていだたきたいのです。<line-break>モンスターが多くいるので、<line-break>充分に注意なさってください。<line-break>お礼は、<value:$1A>ギア。<line-break>期限は、<value:$1B>日以内です。<end>"
english = "Please find and bring back <value:$15>. Many monsters are present, so take great care. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["230026"]
japanese = "旅の途中、大事な<value:$15>を<line-break>なくしてしまいました。探しに行こうにも、<line-break>モンスターがたくさんいた場所なので、<line-break>とても戻る気になれません。<line-break>どうか探して持ち帰ってください。<line-break><value:$1A>ギアのお礼をいたします。<line-break><value:$1B>日以内にお願いします。<end>"
english = "A precious possession was lost while traveling: <value:$15>. The place was full of monsters, and going back is out of the question. Please find it and bring it back. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["230027"]
japanese = "使いの者が何者かに襲われた。<line-break>幸い無事に逃げ帰ったが、その途中で、<line-break><value:$15>をなくしてしまったようだ。<line-break>この品を見つけ出し、持ち帰ってくれ。<line-break>褒美は、<value:$1A>ギアである。<line-break><value:$1B>日以内に仕事を済ませてほしい。<end>"
english = "Our messenger was attacked by someone. Fortunately, the messenger escaped unharmed, but apparently lost <value:$15> along the way. Find the item and bring it back. Reward: <value:$1A> Gea. Complete the job within <value:$1B> days.<end>"

["230028"]
japanese = "自衛用にギルドで独自に作っている武具の材料、<line-break><value:$15>を採ってきて欲しい。<line-break>危険な場所にあるから、気をつけていってくれ。<line-break><value:$1A>ギア用意した。<line-break>期限は、<value:$1B>日以内だ。<end>"
english = "Gather and bring back <value:$15>, a material the Guild uses to make its own arms and armor for self-defense. It is found in a dangerous place, so be careful. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["230029"]
japanese = "必要な物があるんじゃ。<line-break><value:$15>なんじゃがの、<line-break>見つけて持ってきてくれんかの。<line-break>すまんが、<value:$1B>日以内にやってもらえんか。<line-break>みなで出しあって<value:$1A>ギア集めたんじゃ。<line-break>お礼は、これでどうかのう。<end>"
english = "There's something we need: <value:$15>. Could you find it and bring it back? Please complete the job within <value:$1B> days. Everyone pooled what they could and raised <value:$1A> Gea. Would that do as a reward?<end>"

["230030"]
japanese = "毎度ご利用感謝いたしております。<line-break>このたびはこちらからのお願いになります。<line-break><value:$15>を、発見し入手してください。<line-break><value:$1A>ギアのお礼を用意できます。<line-break><value:$1B>日以内でぜひお願いします。<end>"
english = "Thank you for your continued patronage. This time, we have a request for you: please find and obtain <value:$15>. We can offer <value:$1A> Gea as thanks. Please complete the job within <value:$1B> days.<end>"

["230031"]
japanese = "お前さんたちでなければできない仕事だぜ。<line-break><value:$15>を探し出し持ち帰ることだ。<line-break><value:$1A>ギア用意した。<value:$1B>日以内で頼む。<line-break>モンスターがうろついてて、危ないからな。<line-break>気をつけろよ。<end>"
english = "This is a job only you can handle. Find <value:$15> and bring it back. Reward: <value:$1A> Gea. Get it done within <value:$1B> days. Monsters are roaming the area, so watch yourselves.<end>"

["230032"]
japanese = "頼みたいことがあります。<line-break><value:$15>を探し出して、<line-break>手に入れてきてください。<line-break><value:$1A>ギアで、期日は<value:$1B>日以内です。<line-break>モンスターが多数いる場所での探索なので、<line-break>冒険のプロである冒険者の方にお任せします。<end>"
