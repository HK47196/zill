japanese = "酒場は、闘技場の戦士さんたちのいこいの場。<line-break>とってもうまい特製の酒を用意してるよ。<line-break>こいつを作るには秘密があってね。<line-break><value:$15>がいるんだが、<line-break>危険なところにあるんだ。<line-break>代わりに採ってきてくれないか？<line-break>報酬は<value:$1A>ギア、<value:$1B>日以内で頼むよ。<end>"
english = "The tavern is where the arena fighters come to relax, and we keep a delicious house liquor on hand. Its secret ingredient is <value:$15>, but it is found in a dangerous place. Could you gather it for us? Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["230048"]
japanese = "我がフゴー商会では、宿屋だけでなく、<line-break>手広い商売をしております。各種材料の調達も<line-break>そのひとつですが、入手困難なものが<line-break>ありまして、その探索をお願いしたいのです。<line-break><value:$15>というものですが、<line-break>報酬<value:$1A>ギアで、<value:$1B>日以内、<line-break>という条件でお願いできませんか？<end>"
english = "Hugo Trading Company runs an inn and other businesses. Please find the hard-to-get material <value:$15>. Reward: <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["230049"]
japanese = "<value:$15>を探し出し、入手してほしい。<line-break>期限は、<value:$1B>日以内。<line-break>報酬は、<value:$1A>ギアとする。<end>"
