["1870001"]
japanese = "今日はノエルの使いで<line-break>お前に会いに来た。<line-break><line-break>シルヴァを襲ったソウルイーターが<line-break>竜王の島に現れたのだ。ノエルは先に<line-break>竜王の島へ向かった。<end>"
english = "I've come to see you today on Noel's behalf. The Soul Eater that attacked Silva has appeared on Dragon King's Island. Noel has already gone on ahead.<end>"

["1870002"]
japanese = "私は、今のノエルの力では<line-break>ソウルイーターに勝つのは難しいと<line-break>止めたのだが、聞き入れられなかった。<line-break>逆に、お前に加勢を頼んでくるように<line-break>言われてな、こうして出向いた<line-break>というわけだ。<end>"
english = "I tried to stop her. With Noel's current strength, defeating the Soul Eater would be difficult, but she refused to listen. Instead, she sent me to ask for your help. That is why I am here.<end>"

["1870003"]
japanese = "<value:$28>。<line-break>ノエルの求めに応じて、今すぐに<line-break>竜王の島へ出向く気があるか？<end>"
english = "<value:$28>. Will you answer Noel's request and leave for Dragon King's Island at once?<end>"

["1870004"]
japanese = "今すぐに行く<end>"
english = "I'll go right away.<end>"

["1870005"]
japanese = "今は忙しい<end>"
english = "I'm busy right now.<end>"

["1870006"]
japanese = "そうか。それなら急いでもらおう。<line-break>今ならノエルに追いつけるかもしれぬ。<line-break>\u3000<line-break>今のノエルは自分が見えていない。<line-break>危険を省みずに無茶するかも<line-break>しれんからな。<end>"
english = "Good. Then make haste. You may still be able to catch up with Noel. She is not thinking clearly right now. She may do something reckless without regard for the danger.<end>"

["1870007"]
japanese = "そうか。仕方ないな。<line-break>ノエルは悲しむだろうが、<line-break>お前にも都合があるだろう。<line-break>せめて、ノエルの勝利を祈って<line-break>やってくれ。それではな。<end>"
english = "I see. Very well. Noel will be saddened, but you have your own affairs to consider. At least pray for her victory. Farewell.<end>"

["1870008"]
japanese = "ここが竜王様のおられる島だ。<line-break>ノエルはすでにソウルイーターと<line-break>戦っているかもしれぬな。<line-break>お前も急いでくれ。<end>"
english = "This is the island where the Dragon King resides. Noel may already be fighting the Soul Eater. You'd better hurry as well.<end>"

["1870009"]
japanese = "あぁ…レイヴン…<line-break>カフィン…<line-break>こんなことに…なるなんて…。<end>"
english = "Oh... Raven... Coffin... I never thought this would happen...<end>"

["1870010"]
japanese = "あ…<line-break><value:$28>…さん。<line-break>来てくれたんですね…。<end>"
english = "Oh... <value:$28>... You came...<end>"

["1870011"]
japanese = "ノエル、無事か？<end>"
english = "Noel, are you all right?<end>"

["1870012"]
japanese = "ナーシェス…。<line-break>…ごめんなさい、<line-break>あなたの言うとおりだった…。<line-break>レイヴンも…カフィンも<line-break>私を守って…。<line-break>…あぅっ！<end>"
english = "Narscess... I'm sorry. You were right... Raven and Coffin, they both protected me... Ngh!<end>"

["1870013"]
japanese = "ノエル、無理をするな。<end>"
english = "Noel, do not push yourself.<end>"

["1870014"]
japanese = "<value:$28>、<line-break>レイヴンとカフィンのふたりは<line-break>私がみる。<line-break>ソウルイーターは手負いだ。<line-break>今なら倒せるだろう。<line-break>任せるぞ。<end>"
english = "<value:$28>, I will tend to Raven and Coffin. The Soul Eater is wounded. You should be able to defeat it now. I leave it to you.<end>"

["1870015"]
japanese = "…<value:$28>さん。<end>"
english = "<value:$28>...<end>"

["1870016"]
japanese = "…お願いします<line-break>みんなの命を…。<end>"
english = "Please... save everyone's lives...<end>"

["1870017"]
japanese = "…<value:$28>さん。<line-break>ありがとうございます。<line-break>ソウルイーターを倒してくれて。<line-break>…でも、ふたりが、<line-break>カフィンも、レイヴンも<line-break>目をあけてくれないんです…。<end>"
english = "<value:$28>... Thank you for defeating the Soul Eater. But neither of them―Coffin or Raven―will open their eyes...<end>"

["1870018"]
japanese = "…やっと、<line-break>ソウルイーターを倒したのに…。<line-break>こんなはずじゃ、なかったのに…。<line-break>わたし、何をやってるんだろう…<line-break>また、同じ過ちをくりかえして…<line-break>また、大切な人たちを失って…。<end>"
english = "We finally defeated the Soul Eater... This wasn't how it was supposed to end. What am I even doing? Repeating the same mistake again... Losing the people I love all over again...<end>"

["1870019"]
japanese = "ノエル、このふたりを生き返らせる<line-break>手段はないでもない。<end>"
english = "Noel, there may yet be a way to bring these two back to life.<end>"

["1870020"]
japanese = "今、なんて…？<end>"
english = "What did you just say...?<end>"

["1870021"]
japanese = "このふたりを生き返らせる手段は<line-break>ないでもない、そう言ったのだ。<end>"
english = "I said there may yet be a way to bring these two back to life.<end>"

["1870022"]
japanese = "え？\u3000え！？<line-break>…それは、どうすれば…？<end>"
english = "What? There is?! What do I have to do...?<end>"

["1870023"]
japanese = "ここは、竜王様のおられる地。<line-break>竜王様に願うのだ。ふたりの復活を。<end>"
english = "This is the land where the Dragon King dwells. Pray to the Dragon King for their resurrection.<end>"

["1870024"]
japanese = "竜王様に…願う…？<end>"
english = "Pray... to the Dragon King?<end>"

["1870025"]
japanese = "オズワルドは以前より竜王様への<line-break>信仰があつかった。お前も幼少より、<line-break>竜王様に祈りを捧げてきたのだろう？<end>"
english = "Oswald has long been a land of deep devotion to the Dragon King. You have offered prayers to the Dragon King since childhood, have you not?<end>"

["1870026"]
japanese = "え？\u3000あ、はい。<line-break>いつも、お祈りには<line-break>参加してましたけど…。<end>"
english = "Oh? Ah, yes. I always took part in the prayers, but...<end>"

["1870027"]
japanese = "そのお前の願いなら、<line-break>無限のソウルを持つお前の<line-break>願いであるのなら、<line-break>竜王様がお聞き届けに<line-break>なるやもしれぬ。<line-break>さぁ、願うがいい。<end>"
english = "Then the Dragon King may heed your plea―yours, who possesses the Infinite Soul. Go. Make your wish.<end>"

["1870028"]
japanese = "竜王様、どうかわたし、<line-break>ノエル・シルヴァの<line-break>願いをお聞き届けください。\u3000\u3000\u3000<line-break>竜王様に捧げられた町、<line-break>オズワルドの人々の命を救うために<line-break>戦った、勇気ある友人たち…<end>"
english = "Dragon King, please hear the plea of Noel Silva. My brave friends fought to save the lives of the people of Oswald, a town devoted to you...<end>"

["1870029"]
japanese = "カフィン、レイヴン、両名の<line-break>ソウルの復活を！<end>"
english = "Restore the Souls of Coffin and Raven!<end>"

["1870030"]
japanese = "こ、この声は…！<end>"
english = "Th-this voice...!<end>"

["1870031"]
japanese = "…竜王様だ。<end>"
english = "It is the Dragon King...<end>"

["1870032"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000我を崇めし娘、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ノエルよ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000汝の願い、しかと聞いた。<end>"
english = "Noel, maiden who worships me, Bearer of the Infinite Soul. I have heard your plea.<end>"

["1870033"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000我が力をもってすれば、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000汝の願いを聞き届けるのは<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000たやすいこと。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000だが…<end>"
english = "With my power, granting your wish would be a simple matter. But...<end>"

["1870034"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000だが、そのときは\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000汝は我の授けし使命を<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000果たさねばならぬ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000それでも、よいか？<end>"
english = "But if I do, you must fulfill the mission I bestow upon you. Do you accept, even so?<end>"

["1870035"]
japanese = "竜王様の…使命…？\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>はい、かまいません！<line-break>わたしにできることなら<line-break>何でもします！<end>"
english = "A mission... from the Dragon King? Yes, I accept! If it's something I can do, I'll do anything!<end>"

["1870036"]
japanese = "わたしの大切な人たちを<line-break>助けるためなら、<line-break>なんだって…！<end>"
english = "If it will save the people I love, I'll do anything...!<end>"

["1870037"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000その言葉、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000偽りはないか？<line-break>\u3000<line-break>\u3000<end>"
english = "Do you speak those words truly?<end>"

["1870038"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よかろう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000汝の願い、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000しかと聞き届けた。<line-break>\u3000<end>"
english = "Very well. Your wish is granted.<end>"

