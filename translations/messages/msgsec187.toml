["1870046"]
japanese = "ノエル、<line-break>ありがとう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>よかったね。あんたが<line-break>がんばってるってこと、<line-break>ちゃんと見てくれてる方がいたんだ。<end>"
english = "Noel, thank you. Isn't it wonderful? Someone has been watching over you and sees how hard you've been trying.<end>"

["1870047"]
japanese = "…うん。<end>"
english = "...Yeah.<end>"

["1870048"]
japanese = "ノエル。<line-break>そして、カフィン、レイヴン。<line-break>\u3000<line-break>竜王様の与えられた奇跡の力を<line-break>いつまでも忘れないことだ。<end>"
