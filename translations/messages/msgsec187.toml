["1870052"]
japanese = "<value:$28>さん、<line-break>今日は本当に<line-break>ありがとうございました！\u3000\u3000\u3000\u3000<line-break>わたし、<value:$28>さんなら<line-break>きっと、助けに来てくれるって<line-break>信じてたんです！<end>"
english = "<value:$28>, thank you so much for everything today! I knew <value:$28> would come to help us!<end>"

["1870053"]
japanese = "わたし、よかったです。<line-break><value:$28>さんという人に<line-break>出会うことができて！<end>"
english = "I'm so glad I got to meet someone like you, <value:$28>!<end>"

["1870054"]
japanese = "それでは、帰りましょうか！<end>"
