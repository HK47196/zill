["1870055"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ノエルよ…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000我との約束、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000忘れるでないぞ。<line-break>\u3000<end>"
english = "Noel... Do not forget your promise to me.<end>"

["1870056"]
japanese = "<value:$28>さん、<line-break>わたしたち、<line-break>一度オズワルドに戻ってみます。<line-break>でも、冒険者はやめません。<line-break>ですから、オズワルドを出たら<line-break>またお会いしましょう！<end>"
english = "<value:$28>, we're going back to Oswald for a while. But we won't stop being adventurers. So once we leave Oswald, let's meet again!<end>"

["1870057"]
japanese = "<value:$28>、<line-break>あたしたちを助けに来てくれて、<line-break>本当にありがとう。<line-break>あたしは今まで、<line-break>竜王様のご加護ってものを<line-break>そんなには信じてなかったけど、<end>"
english = "<value:$28>, thank you so much for coming to save us. Until now, I never really believed in the Dragon King's protection, but...<end>"

["1870058"]
japanese = "あなたとノエルを会わせてくれた<line-break>ことには、感謝したいわ。<end>"
english = "But I am grateful to the Dragon King for bringing you and Noel together.<end>"

["1870059"]
japanese = "では、<value:$28>さん、<line-break>失礼します！<end>"
