["2370015"]
japanese = "そうだ。<line-break>それが君の支えであり、<line-break>生きる理由だった。<line-break>同じように、<line-break>人はみな心の支えを求めている。<line-break>\u3000<line-break>だが、何を支えに選ぶかは<line-break>人によって違う。<end>"
