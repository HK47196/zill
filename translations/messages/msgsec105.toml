["1050091"]
japanese = "そう言われても仕方がない状況よ。<line-break>非市民なんて、しょせんそんなものよ。<line-break>\u3000<line-break>それより、感謝なさい。わたくしが、<line-break>あなたのために補償金を払って、<line-break>犯罪者ではなくしてあげたのだから。<end>"
