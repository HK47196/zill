["1050095"]
japanese = "だからわたくし、<line-break>かわいそうなあなたに<line-break>チャンスを用意してあげたの。<end>あなたにはこれから、闘技場の<line-break>剣闘士として戦ってもらうわ。<line-break>もちろん、補償金の返済のために。<end>"
english = "So I have graciously arranged an opportunity for you, poor thing.<end>From now on, you will fight as a gladiator in the arena. To repay the compensation, of course.<end>"

["1050096"]
japanese = "あなたに選択や主張の権利はないの。<line-break>さあ、魔道具屋、あの腕輪を。<end>"
english = "You have no right to choose or object. Now, Magic-Item Dealer, bring me that bracelet.<end>"

["1050097"]
japanese = "フヒュヒュ。<line-break>クリュセイスお嬢様。<line-break>こちらに。<end>"
english = "Fuh-hyu-hyu. Lady Khryuseis, over here.<end>"

["1050098"]
japanese = "この腕輪は<line-break>夢魔の羽と呼ばれる魔道具よ。<line-break>\u3000<line-break>夜、眠っている間に<line-break>あなたの体は闘技場に運ばれるの。<line-break>腕輪を外さない限り、ずっと。<end>"
