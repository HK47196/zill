["1050074"]
japanese = "…ごめんなさい。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>謝っても許してもらえるとは<line-break>思っていません。でも、一度、<line-break>はっきりと言っておきたかった。<end>"
english = "…I'm sorry. I don't expect an apology to earn your forgiveness. But I wanted to say it plainly, just once.<end>"

["1050075"]
