japanese = "何を言ってもムダね。<line-break>あなたの試合は明日から組んであるわ。<line-break>あなたの休む部屋も用意してあります。<line-break>せいぜい、そこでゆっくり休むことね。<line-break>あなたには、夜はもう二度と<line-break>訪れないかもしれないのだから。<end>"
