english = "<select><value:$20>%3My ancestor was named Strahugo, you know. They say he was a renowned noble thief. Quite an honor, isn't it? Not that I care.<end>They say Strahugo laid the foundations of the Adventurers' Guild. A great man, he was.<end>They say Strahugo's favorite dagger is somewhere out there. I wonder where it could be.<end>"

