["800014"]
japanese = "<if><value:$01><equal>3金環食が始まったぞ。<line-break>終わるまで、Ｘ分と言うところか…。<end><if><value:$01><equal>4わぁ、金環食が始まったみたい。<line-break>終わるまで、あと、えーと、<line-break>Ｘ分ってとこかな。<end><if><value:$01><equal>5へっ、金環食だ。<line-break>ナイーブな奴がビックリした！<line-break>敏感ショーック！\u3000ってな。ププッ。<line-break>今日も俺はさえてるぜ！<line-break>あと、Ｘ分ってとこだな。<line-break>おい、聞いてるか？<end><if><value:$01><equal>8金環食です。<line-break>あとＸ分続きます。<line-break>でも、うーん、どうなんでしょうねえ？<line-break>ま、いいでしょう。<line-break>何事も勉強ですから。<end><if><value:$01><equal>12美しい…。<line-break>金環食だぜ。<line-break>あとＸ分ってとこだな。<end><if><value:$01><equal>13…金環食だ。<line-break>あとＸ分か。<end><if><value:$01><equal>10姉ちゃん、金環食だ。<line-break>ウヒョー！<line-break>きれいだよなー。<line-break>…あ、そうそう、<line-break>あとＸ分だぜ。<line-break>姉ちゃん。<end><if><value:$01><equal>14見てみい。<line-break>金環食じゃ。<line-break>あとＸ分続くぞ。<end><if><value:$01><equal>15あ、ねえ、<value:$28>、<line-break>金環食が始まったみたいだ。<line-break>Ｘ分続くんだったよね、これ。<end><if><value:$01><equal>16金環食だ。<line-break>あとＸ分だな。<line-break>行くぞ。<end><if><value:$01><equal>17あ、あれ、あれが、金環食よ！<line-break>きれい…。<line-break>\u3000<line-break>１６００年も生きてて、<line-break>何百回とあったはずなのに…。<line-break>ちゃんと見たの、初めて…。<end><if><value:$01><equal>18兄弟子、金環食ですぞ！<line-break>なんかイイ感触ですな！<line-break>………………。<line-break>いまいちであったか…。<line-break>ああ、それそれ、<line-break>あとＸ分ですぞ、兄弟子！<end><if><value:$01><equal>19ああーっ、金環食だよぉ！<line-break>ルルアンタ、はじめて！<line-break>きっれーい。<line-break>これがあとＸ分で<line-break>終わっちゃうのかぁ。<line-break>もったいないなぁー。<end><if><value:$01><equal>20…金環食だ。<line-break>\u3000<line-break>\u3000<line-break>…あとＸ分で終わる。<line-break>花も何もかも、<line-break>美しい者は…一瞬だ。<end><if><value:$01><equal>22きれいだあー。<line-break>金環食…。<line-break>あと、Ｘ分で終わっちゃうけどね。<end>金環食が始まったわ。<line-break>終わるまで、ざっとＸ分ってとこね。<end>"
english = "<if><value:$01><equal>3The annular eclipse has begun. I'd say there are about Ｘ minutes until it ends...<end><if><value:$01><equal>4Wow, looks like the annular eclipse has started. Let's see... I guess there are about Ｘ minutes left.<end><if><value:$01><equal>5Heh, an annular eclipse. Some sensitive guy got a shock! Sensitivity shooock! Heh heh. I'm sharp as ever today! About Ｘ minutes left. Hey, are you listening?<end><if><value:$01><equal>8It's an annular eclipse. It will last another Ｘ minutes. Although, hmm... what are we to make of that? Well, never mind. Everything is a learning experience.<end><if><value:$01><equal>12Beautiful... An annular eclipse. About Ｘ minutes left.<end><if><value:$01><equal>13An annular eclipse... Ｘ minutes left.<end><if><value:$01><equal>10Sis, it's an annular eclipse. Woo-hoo! Pretty, isn't it? Oh, right, there are Ｘ minutes left. Sis.<end><if><value:$01><equal>14Take a look. It's an annular eclipse. It'll last another Ｘ minutes.<end><if><value:$01><equal>15Oh, hey, <value:$28>. Looks like the annular eclipse has started. This lasts Ｘ minutes, right?<end><if><value:$01><equal>16It's an annular eclipse. Ｘ minutes left. Let's go.<end><if><value:$01><equal>17Oh! That... that's the annular eclipse! It's beautiful... I've lived for sixteen hundred years, and there must have been hundreds of them, but this is the first time I've ever actually watched one...<end><if><value:$01><equal>18Senior disciple, it's an annular eclipse! You might say it has a fine ring to it! ...Not one of my better efforts, perhaps. Oh, yes, there are Ｘ minutes left, senior disciple!<end><if><value:$01><equal>19Ahhh, it's an annular eclipse! Lulluantha's never seen one before! So pretty! And it'll all be over in Ｘ minutes? What a waste!<end><if><value:$01><equal>20An annular eclipse... It will end in Ｘ minutes. Flowers, everything beautiful... all last but a moment.<end><if><value:$01><equal>22So pretty... An annular eclipse. It'll be over in Ｘ minutes, though.<end>The annular eclipse has begun. Roughly Ｘ minutes until it ends.<end>"

