["1090077"]
japanese = "カルラはロストールで反乱が起こることを<line-break>見越していた。クーデターで混乱する王都に軍を<line-break>進めようとしたカルラだったが、ベルゼーヴァの<line-break>命により、攻撃は中止された。ベルゼーヴァは<line-break>ネメア死すの報を受け、カルラの勢力の強大化を<line-break>危ぶんだのである。カルラもネメア死後、情勢が<line-break>流動化することを想定し、ロセンに撤兵した。<line-break>ロストールでは王女アトレイアが、<line-break>政治の立て直しを図っている。また、王女はエリ<line-break>エナイ邸で民衆と王都の復興活動も行っている。<end>"
english = "Karula had anticipated an uprising in Rostorl. She intended to advance her army into the royal capital amid the chaos of the coup, but the attack was canceled on Beelzeva's orders. Upon receiving the report that Nemea was dead, Beelzeva feared Karula's power would grow too great. Karula, too, anticipated that the political situation would become volatile after Nemea's death and withdrew to Rocen. In Rostorl, Princess Atleia is working to restore the government. From the Elienai estate, the princess is also working alongside the populace to rebuild the royal capital.<end>"

