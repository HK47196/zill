japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090013"]
japanese = "テラネに住む<value:$28>とナッジ、そして<line-break>ヴァンの３人は、友情という絆で結ばれていた。<line-break>ある日、ヴァンが町の広場でガルドランという<line-break>冒険者とケンカをして、大ケガを負ってしまう。<line-break>ヴァンの父親は怒りに震え、<value:$28>と<line-break>ナッジに向かい、ヴァンのケガはお前らのせいだ<line-break>となじる。大切な仲間が傷ついた悲しさと、<line-break>自分の無力さに対するくやしさから、ふたりは<line-break>ガルドランを倒し、ヴァンの仇を討つために<line-break>テラネの町を旅立つのだった。<end>"
english = "<value:$28>, Nadge, and Van were three friends living in Terane. One day, Van got into a fight with an adventurer named Girldlan in the town square and was badly injured. Trembling with rage, Van's father blamed <value:$28> and Nadge, declaring that Van's injuries were their fault. Grieving for their dear friend and bitter at their own powerlessness, the two left Terane to defeat Girldlan and take revenge for Van.<end>"

["1090014"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090015"]
japanese = "ロストールに住む<value:$28>は、幼い頃に<line-break>両親をなくし、幼なじみの少女アイリーンの家に<line-break>世話になっていた。ある日、町に言葉を話す<line-break>ゴブリンが現れ、禁断の聖杯を盗まれるという<line-break>事件が起きた。<value:$28>とアイリーンは<line-break>聖杯を取り返しに行くが失敗し、ゴブリンを<line-break>逃がしてしまう。自分の無力さを痛感した<line-break><value:$28>は、自分を鍛えるため、そして<line-break>自分の手でゴブリンから聖杯を取り戻すため、<line-break>冒険の旅に出る決心をするのであった。<end>"
english = "<value:$28> had lost both parents at an early age and lived in Rostorl under the care of childhood friend Irene's family. One day, a Goblin that could speak appeared in town and stole the Forbidden Grail. <value:$28> and Irene went to retrieve the Grail, but failed and allowed the Goblin to escape. Feeling powerless, <value:$28> resolved to set out, train, and reclaim the Grail from the Goblin personally.<end>"

["1090016"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090017"]
japanese = "古の遺跡を抱く町、オズワルド。<line-break>そこに住む<value:$28>は、<line-break>母アスティアと穏やかな日々をすごしていた。<line-break>しかし、それは長くは続かなかった。<line-break>遺跡から魔人・ヴァシュタールが甦り、<line-break>母アスティア、そしてオズワルドの人々の<line-break>ソウルを奪ったのである。ただ一人、<line-break>生き残った<value:$28>は、<line-break>ヴァシュタールを倒し、ソウルを奪還するための<line-break>長い旅に出るのだった。<end>"
english = "Oswald was a town built around ancient ruins. Astia and her child, <value:$28>, lived peacefully there, but their peace did not last. The demon Vashtar rose again from the ruins and stole the Souls of Astia and the people of Oswald. The sole survivor, <value:$28>, set out on a long journey to defeat Vashtar and recover the stolen Souls.<end>"

["1090018"]
japanese = "ボルボラ変死<end>"
english = "Bolbora Dies Mysteriously<end>"

["1090019"]
japanese = "ノーブルの代官ボルボラが突然死亡した。<line-break>死因は事故とも病気とも言うが真偽は定かでは<line-break>ない。ボルボラは悪代官として有名で、彼の悪行<line-break>に堪えかねた村人に殺害されたと言う噂もある。<line-break>また、ボルボラは主人のレムオン公爵を裏切り、<line-break>その政敵であるエリス王妃と組んでレムオンを<line-break>陥れようとしたため、レムオンによって殺された<line-break>という噂も貴族の間ではささやかれている。<line-break><end>"
english = "Bolbora, governor of Noble, died suddenly. Some attribute his death to an accident and others to illness, but the truth remains uncertain. Bolbora was notorious as a corrupt governor, and one rumor holds that villagers driven beyond endurance by his abuses murdered him. Nobles whisper another rumor: Bolbora betrayed his master, Duke Lemghon, and joined Lemghon's political rival Queen Eris in a plot to bring him down, leading Lemghon to kill Bolbora.<end>"

["1090020"]
japanese = "ネメア、帝位につく<end>"
english = "Nemea Ascends the Throne<end>"

["1090021"]
japanese = "かつて魔王バロルを倒し勇者と呼ばれたネメアは<line-break>叔父にあたるディンガル帝国皇帝エリュマルクを<line-break>殺害し帝位につく。そして、宰相ベルゼーヴァの<line-break>もと軍隊を大動員し、帝国内務統括、玄武将軍に<line-break>ザギヴ・ディンガルを、白虎将軍にコーンス族の<line-break>ジラークを、朱雀将軍にディンガル統一の名将と<line-break>して名高いアンギルダン・ゼイエンを、青竜将軍<line-break>に無名の少女カルラ・コルキアを、それぞれ抜擢<line-break>する。皇帝ネメアは彼らを率いて、未だ成功した<line-break>者のいない世界統一を目指すのだった。<end>"
english = "Once hailed as the Hero for defeating Balor, Demon King, Nemea killed his uncle, Dyneskal Emperor Elmark, and seized the throne. Under Chancellor Beelzeva, he mobilized a vast army. He named Zagiv Dyneskal Director of Internal Affairs and Black Tortoise General; Zsilak of the Konsu White Tiger General; Angeerdan Zeyen, famed commander of Dyneskal's unification, Vermilion Bird General; and the unknown girl Karula Korkia Azure Dragon General. Leading them, Nemea sought to unite the world, a feat no one had achieved.<end>"

["1090022"]
japanese = "青竜将軍カルラの東方攻略<end>"
english = "Azure Dragon General Karula's Eastern Conquest<end>"

["1090023"]
japanese = "ディンガル帝国の東方には、東方６カ国と呼ばれ<line-break>る６つの小王国があった。ネメアから東方攻略の<line-break>命を受けた青竜将軍カルラは、この６つの国を<line-break>わずか数週間で滅ぼした。６カ国の盟主ロセンの<line-break>愚王ペウダは、小娘とバカにした彼女の実力を<line-break>自らの死によって知ることとなる。彼女の占領地<line-break>に対する態度は徹底しており、特にロセン王家の<line-break>人間については年齢性別に関わらずことごとく<line-break>処刑した。以後、彼女のことを人々は畏敬を込め<line-break>神速の戦術家と、恐怖を込め青い死神と呼んだ。<end>"
english = "East of the Dyneskal Empire lay six small kingdoms known as the Six Eastern Nations. Ordered by Nemea to conquer the east, Azure Dragon General Karula destroyed all six in mere weeks. Peuda, the foolish king of Rocen and leader of the six nations, had dismissed her as a mere girl; he learned her true ability only in death. Her policy toward occupied lands was uncompromising. Every member of Rocen's royal family was executed, regardless of age or sex. Thereafter, people called her the Lightning Tactician in awe and the Blue Reaper in fear.<end>"

["1090024"]
japanese = "アンギルダン、分断の山脈を越える<end>"
english = "Angeerdan Crosses the Dividing Mountains<end>"

["1090025"]
japanese = "皇帝ネメアの世界統一構想のもと南方攻略軍司令<line-break>朱雀将軍アンギルダンがついにロストール攻略に<line-break>動き出した。大兵力の動員を予想したロストール<line-break>側は帝国軍が大量輸送の必要から、海路を採ると<line-break>予想し、その上陸地点を叩く作戦にでた。<line-break>しかしアンギルダンは、少数の精兵で分断の山脈<line-break>を越え、大街道沿いの都市を電撃的速度で次々と<line-break>占領した。分断の山脈を軍隊が越えたのは歴史上<line-break>いまだかつてない壮挙である。こうして、帝国軍<line-break>は王都ロストールに王手をかけた。<end>"
english = "Under Emperor Nemea's plan to unite the world, Vermilion Bird General Angeerdan, commander of the Southern Campaign Army, finally moved against Rostorl. Expecting a massive army, Rostorl believed the Imperial Army would come by sea and planned to strike its landing site. Instead, Angeerdan crossed the Dividing Mountains with a small elite force, swiftly capturing cities along the great highway. No army had ever crossed the mountains before. The Imperial Army now threatened Rostorl's royal capital.<end>"

["1090026"]
japanese = "アンギルダンがロストール軍を破る<end>"
english = "Angeerdan Defeats the Rostorl Army<end>"

["1090027"]
japanese = "アンギルダン山越えの報を受けたロストール軍<line-break>総司令ノヴィン・ファーロスは、それを討つべく<line-break>軍を反転させる。これに対し、彼の息子ゼネテス<line-break>は隊列を整えつつ、ゆっくりと帝国軍を牽制し、<line-break>その上で王都守備軍と連係攻撃せよと説いた。<line-break>だが、その策は聞き入れられず、隊列が乱れた<line-break>まま到着したロストール軍はディンガル軍の攻撃<line-break>を受け、壊滅する。ノヴィンをはじめロストール<line-break>の名だたる貴族が、この戦いの中、命を落とす。<line-break><end>"
english = "Upon hearing that Angeerdan had crossed the mountains, Novin Pharos, commander-in-chief of the Rostorl Army, turned his forces back to engage him. His son Xenetes urged him to maintain formation while slowly checking the Imperial Army, then coordinate an attack with the capital's garrison. The advice went unheeded. The Rostorl Army arrived with its ranks in disarray, came under attack from the Dyneskal Army, and was annihilated. Novin and many of Rostorl's most prominent nobles died in the battle.<end>"

["1090028"]
japanese = "ゼネテスがアンギルダンを破る<end>"
english = "Xenetes Defeats Angeerdan<end>"

["1090029"]
japanese = "ロストール軍を壊滅させたアンギルダンは深追い<line-break>を禁じ、全軍に物資の現地調達開始を命じた。<line-break>不安材料だった物資もこれにより補充され、<line-break>アンギルダンのロストール占領を阻むものはない<line-break>かに見えた。が、徴発隊が繰り出して中枢部が<line-break>手薄になった機をとらえ、敗残兵を驚くべき早さ<line-break>で立て直したゼネテスは奇襲をかける。朱雀将軍<line-break>討ち死にの声があがり、将を失った帝国軍は潰走<line-break>する。この戦いで、ゼネテスは奇跡の名将と呼ば<line-break>れたがロストールの被害も甚大なものがあった。<end>"
english = "After annihilating the Rostorl Army, Angeerdan forbade pursuit and ordered all forces to requisition supplies locally. Once supplied, his occupation of Rostorl seemed unstoppable. But when the requisition parties left the army's center exposed, Xenetes seized the opportunity. He quickly rallied the routed survivors and launched a surprise attack. Cries that the Vermilion Bird General had fallen sent the leaderless Imperial Army fleeing. Xenetes became known as the Miracle General, though Rostorl also suffered immense losses.<end>"

["1090030"]
japanese = "ジラークがアキュリュースを陥落させる<end>"
english = "Zsilak Captures Aqyurius<end>"

["1090031"]
japanese = "アキュリュースを囲む湖グラジェオンの足跡<line-break>には、ミズチと呼ばれる水の妖精が住んでおり、<line-break>軍船が湖を渡ろうとすると、それを沈めていた。<line-break>謎の魔道士シャリを雇ったディンガル帝国の<line-break>白虎将軍ジラークは、難攻不落のアキュリュース<line-break>攻略を開始した。開戦直後、シャリがミズチを<line-break>一掃したことで勝敗は決まり、ディンガル軍は、<line-break>難なくアキュリュース占領に成功する。<line-break>シャリは、その謝礼に水の巫女イークレムンを<line-break>さらって姿を消したのだった。<end>"
english = "The waters of Lake Glajeon, which surrounded Aqyurius, were home to water spirits called Mizuchi. Whenever warships attempted to cross the lake, the Mizuchi sank them. Zsilak, the White Tiger General of the Dyneskal Empire, hired the mysterious mage Shalli and began his assault on impregnable Aqyurius. The outcome was decided soon after hostilities began, when Shalli wiped out the Mizuchi. The Dyneskal Army then occupied Aqyurius with ease. As his reward, Shalli abducted the Priestess of Water Iiklmn and disappeared.<end>"

["1090032"]
japanese = "青竜将軍カルラがリベルダムを占領する<end>"
english = "Azure Dragon General Karula Occupies Liberdam<end>"

["1090033"]
japanese = "東方国家群を数週間で攻め滅ぼし、勢いにのる<line-break>カルラは、いよいよ自由都市リベルダム攻略に<line-break>動き始める。カルラは、リベルダムの有力商人<line-break>アンティノを抱き込み、リベルダムを列強諸国<line-break>から守ってきた城門を内から開けさせる。<line-break>難なく都市に侵攻した青竜軍は、世界の商業と<line-break>文化の中心地リベルダムを焼き払い<line-break>見せしめとして徹底的に破壊してしまう。<line-break>また、リベルダムに潜んでいたロセン解放軍も、<line-break>主要メンバーが逮捕されるなど壊滅状態に陥る。<end>"
english = "Fresh from destroying the eastern nations in a matter of weeks, Karula moved at last against Free City Liberdam. She won over Antino, an influential Liberdam merchant, and had him open the city's gates from within. These gates had protected Liberdam from the great powers. The Azure Dragon Army entered with ease, burned Liberdam, the world's center of commerce and culture, and utterly destroyed it as a warning. The Rocen Liberation Army concealed in Liberdam was also all but destroyed, with leading members among those arrested.<end>"

["1090034"]
japanese = "カルラ、ロストール攻略を発表<end>"
english = "Karula Announces the Rostorl Campaign<end>"

["1090035"]
japanese = "東方諸国、リベルダムと、これまで神速の奇襲で<line-break>勝利をおさめてきたディンガル帝国の青竜将軍<line-break>カルラは、大々的にロストール攻略を発表した。<line-break>カルラ率いる青竜軍の兵力は、先のアンギルダン<line-break>との戦いで疲弊しているロストール軍の５倍は<line-break>あると言われ、この発表を聞いたロストールの<line-break>人々は貴族、民衆を問わず大きな衝撃を受けた。<line-break><line-break><line-break><end>"
english = "After winning victories over the Eastern Nations and Liberdam through lightning-fast surprise attacks, Karula, Azure Dragon General of the Dyneskal Empire, publicly announced the Rostorl Campaign. The Azure Dragon Army under her command was said to be at least five times the size of the Rostorl Army, already exhausted by its recent battle with Angeerdan. Nobles and commoners throughout Rostorl were deeply shaken by the announcement.<end>"

["1090036"]
japanese = "カルラとゼネテスが激突<end>"
english = "Karula and Xenetes Clash<end>"

["1090037"]
japanese = "青竜将軍カルラ率いる青竜軍とゼネテス率いる<line-break>ロストール軍は、虹色の山脈のふもとで<line-break>激突する。戦力的に劣るゼネテス軍は、<line-break>空の本陣を敷き、青竜軍を足止めし、<line-break>合わせてネメア死すの偽情報を流す。<line-break>ゼネテス軍は動揺する青竜軍の隙を突き<line-break>背後から奇襲をかけ、緒戦の勝利をものにした。<line-break><line-break><line-break><end>"
english = "The Azure Dragon Army led by Azure Dragon General Karula clashed with the Rostorl Army led by Xenetes at the foot of the Rainbow Mountains. Outmatched in strength, Xenetes' Army set up an empty command camp to delay the Azure Dragon Army and spread the false report that Nemea had died. Exploiting the resulting confusion, Xenetes' Army launched a surprise attack from the rear and secured victory in the opening engagement.<end>"

["1090038"]
japanese = "ネメア死す<end>"
english = "Nemea Dies<end>"

["1090039"]
japanese = "ディンガル帝国皇帝となったネメアは、新たに<line-break>任命した将軍たちに世界統一を命じると、自分は<line-break>数人の部下を連れて、闇の神器を探す旅に出る。<line-break>青竜将軍カルラのロストール攻略にあわせるよう<line-break>に、神器を求めロストール近郊のゼグナ鉱山を<line-break>訪れるネメアだったが、システィーナの伝道師の<line-break>ひとりジュサプブロスによって次元のはざまに<line-break>落とされてしまう。同時期にゼネテスによって<line-break>流された噂が、このことと一致したため、<line-break>ネメア死すという話は事実として世界に広まる。<end>"
english = "After becoming emperor of Dyneskal, Nemea ordered his newly appointed generals to unite the world, then set out with several subordinates in search of the Artifacts of Darkness. Around the time Azure Dragon General Karula began the Rostorl Campaign, Nemea visited Zegna Mine near Rostorl in search of one such artifact. There, Jusabros, one of Sistina's missionaries, cast him into the Interdimensional Rift. A rumor spread by Xenetes at about the same time happened to coincide with these events, and the report of Nemea's death spread throughout the world as fact.<end>"

["1090040"]
japanese = "カルラとジラークが激突する<end>"
english = "Karula and Zsilak Clash<end>"

["1090041"]
japanese = "大軍で攻めるのが不利と考えたカルラは、少数の<line-break>精鋭を引き連れて、アルノートゥンに立てこもる<line-break>ジラークを攻めた。人間によって虐げられた同族<line-break>を救うため、聖光石の魔力を利用してコーンス族<line-break>による世界支配を目指したジラークだったが、<line-break>乱戦の中、命を落とす。ジラークが死んだことに<line-break>より、反乱は鎮圧された。反乱鎮圧後、カルラは<line-break>コーンスに対するあらゆる迫害を禁じた。<line-break>これにより、コーンス族の反乱は終息した。<line-break><end>"
english = "Believing that a large army would be at a disadvantage, Karula took a small elite force and attacked Zsilak, who was barricaded in Alnortun. Seeking to save fellow Konsu oppressed by humans, Zsilak had aimed to harness the magic of the Holy Light Stone and establish worldwide rule by the Konsu, but he died in the chaotic fighting. With Zsilak's death, the uprising was suppressed. Afterward, Karula prohibited all persecution of the Konsu. This brought the Konsu rebellion to an end.<end>"

["1090042"]
japanese = "空中都市の飛行を阻止する<end>"
english = "Flight of the Floating City Prevented<end>"

["1090043"]
japanese = "シャリからエアを守った<value:$28>と<line-break>エステルは、空中都市を復活させるという<line-break>シャリの野望を阻止するために、エアの力で<line-break>ラドラスに飛ぶ。制御の間へ向かう途中、<line-break>シャリとレムゲドンが立ちふさがるが、<line-break>これを退け、制御の間にたどり着く。<line-break>制御の間に入ったエステルは、空中都市に関わる<line-break>４人の巫女の悲しい宿命を断ち切るために、<line-break>他の巫女たちと力を合わせ、空中都市の制御球を<line-break>破壊し、その力を封印することに成功する。<end>"
english = "After protecting Er from Shalli, <value:$28> and Esther flew to Ladras using Er's power to stop Shalli's ambition of reviving the Floating City. On the way to the control chamber, Shalli and Lemgedon blocked their path, but the two defeated both adversaries and reached the chamber. Once inside, Esther joined forces with the other priestesses to break the tragic fate of the four priestesses connected to the Floating City. Together they destroyed the city's control sphere and succeeded in sealing its power.<end>"

["1090044"]
japanese = "空中都市墜落<end>"
english = "Floating City Crashes<end>"

["1090045"]
japanese = "シャリがさらった４人の巫女を助けに、<line-break>空中都市へ向かった<value:$28>は、<line-break>シャリと戦う。そして、空中都市の落下を防ぐ<line-break>ために、動力の間にいる巫女のもとへ急ぐが、<line-break>落下までにたどり着くことはできなかった。<line-break><value:$28>は、巫女の最後の力によって<line-break>脱出できたものの、残された４人の巫女と<line-break>ラドラスの民たちは、空中都市と運命を共にし、<line-break>竜骨の砂漠に沈んでいった…。<end>"
english = "<value:$28> went to the Floating City to rescue the four priestesses abducted by Shalli and fought Shalli there. The attempt to reach the priestess in the power chamber and stop the city from falling came too late. The priestess used the last of her power to let <value:$28> escape, but the four priestesses left behind and the people of Ladras shared the Floating City's fate and sank into the Dragonbone Desert…<end>"

["1090046"]
japanese = "封印された空中都市<end>"
english = "The Sealed Floating City<end>"

["1090047"]
japanese = "魔道士シャリはラドラスの４人の巫女を誘拐し、<line-break>ラドラスの遺産、空中都市を復活させ、その力で<line-break>地上を焼き払い、大混乱を巻き起こそうとした。<line-break><value:$28>は動力の間で巫女たちを救い、<line-break>シャリの企みを大惨事になる前に打ち砕いた。<line-break>空中都市は竜骨の砂漠へと墜落し、<line-break>その力を永久に封印され、ラドラスの巫女たちは<line-break>何代にもわたった悲しい宿命から解放された。<line-break><line-break><end>"
english = "The mage Shalli abducted the four priestesses of Ladras and revived Ladras's legacy, the Floating City, intending to burn the ground below with its power and cause widespread chaos. <value:$28> rescued the priestesses in the power chamber and shattered Shalli's plot before it became a catastrophe. The Floating City crashed into the Dragonbone Desert and its power was sealed forever, freeing the priestesses of Ladras from a tragic fate borne for generations.<end>"

["1090048"]
japanese = "空中都市浮上<end>"
english = "Floating City Rises<end>"

["1090049"]
japanese = "砂漠にある都市ラドラスが、その魔道王国時代の<line-break>機能を発動。攻撃力を持った空中都市として<line-break>空へと飛び立った。しかし、眠りから目覚めた<line-break>竜王の攻撃で、太古の超兵器である空中都市は、<line-break>その秘めた破壊の力を振るうことなく、<line-break>再び地へと落ちていった。<line-break>そして、いにしえの力を今に受け継いだ<line-break>巫女と呼ばれる４人の少女たちも、<line-break>空中都市と運命を共にし、そのはかない命を<line-break>散らしたのだった。<end>"
english = "Ladras, a city in the desert, activated functions dating from its days as a Magic Kingdom and rose into the sky as an armed Floating City. Yet an attack by the Dragon King, newly awakened from slumber, sent the ancient superweapon crashing back to earth before it could unleash the destructive power hidden within. The four girls known as priestesses, heirs to ancient power in the present age, shared the Floating City's fate, and their fleeting lives came to an end.<end>"

["1090050"]
japanese = "封士消息を絶つ<end>"
english = "Sealer Goes Missing<end>"

["1090051"]
japanese = "アルノートゥンの高名な神官、封士イオンズが<line-break>消息を絶った。<line-break>イオンズは高い法力とその人柄から、人望が厚く<line-break>その広い見識はアルノートゥンの国家運営に<line-break>欠かせないものであった。<line-break>その封士の失踪は、アルノートゥンに大きな<line-break>損失をもたらすのは確実だと思われる。<line-break>失踪直後に子供の姿をした魔道士が目撃されて<line-break>おり、神殿は事件との関連性を調査している。<end>"
english = "Ions, a renowned priest of Alnortun and a Sealer, has disappeared. Ions was deeply respected for great spiritual power and character, while broad learning made the priest indispensable to the governance of Alnortun. The Sealer's disappearance is expected to prove a major loss for Alnortun. A mage in the form of a child was seen shortly afterward, and the temple is investigating a possible connection to the incident.<end>"

["1090052"]
japanese = "玄武将軍失踪す<end>"
english = "Black Tortoise General Goes Missing<end>"

["1090053"]
japanese = "ディンガル帝国の内務統括、玄武将軍ザギヴが<line-break>青竜将軍カルラの領内を視察中に失踪した。<line-break>青竜軍の発表によれば、ザギヴは青竜軍の領内に<line-break>入る前にロセン解放軍に襲撃されたとのこと。<line-break>現場は強大な爆発により草一本残っておらず、<line-break>ザギヴの生存は絶望的となり捜索は打ち切られた。<line-break>玄武将軍職は空席となり、内務統括は宰相である<line-break>ベルゼーヴァが兼任、玄武軍の指揮は副官である<line-break>ガラーナ・イガヴィルが執ることとなった。<line-break><end>"
english = "Zagiv, the Dyneskal Empire's Black Tortoise General and Director of Internal Affairs, vanished while inspecting Azure Dragon General Karula's territory. The Azure Dragon Army said the Rocen Liberation Army attacked him before he entered its territory. A huge explosion left nothing at the scene; Zagiv's survival was deemed hopeless, and the search ended. The Black Tortoise General's post was left vacant. Chancellor Beelzeva also oversaw internal affairs, while deputy Garana Igavir took command of the Black Tortoise Army.<end>"

["1090054"]
japanese = "エンシャント住民消滅す<end>"
english = "Ancient's Residents Vanish<end>"

["1090055"]
japanese = "ディンガル帝国の帝都エンシャントの住民が<line-break>姿を消した。<line-break>ネメア死後、空位になっていた皇帝の座に、<line-break>皇帝の一族であるザギヴが就任し、破壊神復活の<line-break>ため、住民のソウルを奪ったのである。<line-break>宰相ベルゼーヴァはザギヴに追われ、行方不明。<line-break>ゾフォルの「ザギヴがディンガルを支配する」<line-break>という予言が不吉な形で成就したことになる。<line-break>エンシャントは、破壊神復活をもくろむ一味に<line-break>支配され、街中をモンスターが徘徊している。<end>"
english = "The residents of Ancient, the Imperial Capital of the Dyneskal Empire, have vanished. After Nemea's death, Zagiv, a member of the imperial family, took the vacant throne and stole the residents' Souls to revive the God of Destruction. Hunted by Zagiv, Chancellor Beelzeva is missing. Zofor's prophecy that “Zagiv will rule Dyneskal” has thus come true in an ominous form. Ancient is controlled by the group seeking to revive the God of Destruction, and Monsters roam its streets.<end>"

["1090056"]
japanese = "エンシャント住民消滅す<end>"
english = "Ancient's Residents Vanish<end>"

["1090057"]
japanese = "ディンガル帝国の帝都エンシャントの住民が消滅<line-break>した。<line-break>破壊神復活をもくろむ妖術宰相ゾフォルらにより<line-break>帝都が急襲され、エンシャント住民のソウルが<line-break>が奪われたのである。<line-break>現在、帝都はゾフォルらの手に落ちており、帝国<line-break>宰相ベルゼーヴァは行方不明。エンシャントは<line-break>モンスターが徘徊する魔都と化している。<line-break><line-break><end>"
english = "The residents of Ancient, the Imperial Capital of the Dyneskal Empire, have disappeared. The capital was attacked without warning by Sorcerous Chancellor Zofor's group, which sought to revive the God of Destruction and stole the Souls of Ancient's residents. The capital has now fallen to Zofor's group, while Imperial Chancellor Beelzeva is missing. Ancient has become a demonic city where Monsters roam.<end>"

["1090058"]
japanese = "妖術宰相ゾフォル倒れる<end>"
english = "Sorcerous Chancellor Zofor Falls<end>"

["1090059"]
japanese = "破壊神ウルグの復活を企む妖術宰相ゾフォルらが<line-break><value:$28>の活躍で倒された。<line-break>ゾフォルらは破壊神復活のため、エンシャントを<line-break>占領し、その全住民のソウルを奪っていた。<line-break>ゾフォルの死にともない、奪われたソウルが住民<line-break>のもとに戻ると予測されていたが、そうはならず<line-break>エンシャントは無人の街のままである。<line-break>ゾフォルにはまだ仲間がおり、その者が引き続き<line-break>破壊神復活をねらって住民のソウルを保持して<line-break>いる可能性が高く、不安と緊張が高まっている。<end>"
english = "Thanks to <value:$28>, Sorcerous Chancellor Zofor and the others plotting the revival of Ulugh, the God of Destruction, were defeated. Zofor's group had occupied Ancient and stolen the Souls of every resident to revive the God of Destruction. The stolen Souls were expected to return when Zofor died, but this did not happen, and Ancient remains empty. An accomplice of Zofor remains at large and is likely still holding the residents' Souls while pursuing the god's revival. Anxiety and tension are mounting.<end>"

["1090060"]
japanese = "エルファス、神になる<end>"
english = "Elfas Becomes a God<end>"

["1090061"]
japanese = "闇の王女によって世界中の町が闇の巨人の襲撃を<line-break>受け、全世界が恐怖と混乱に飲み込まれた。<line-break>奇跡により信望と信仰を集めていたエルファスは<line-break>世界の救済のためにソウルをエルファスに委ねる<line-break>ように呼びかけて世界中の人からソウルを奪い、<line-break>その力で全能の存在と化した。<line-break>闇の王女はエルファスの力を使い、世界を完全に<line-break>虚無へと帰そうとしている。<line-break><line-break><end>"
english = "The Princess of Darkness unleashed Giants of Darkness upon towns across the world, plunging the whole world into fear and chaos. Elfas had won esteem and faith through miracles. Calling on people to entrust their Souls to him for the salvation of the world, he took Souls from people everywhere and used their power to become an omnipotent being. The Princess of Darkness now seeks to use Elfas's power to return the entire world to the Void.<end>"

["1090062"]
japanese = "ジラーク反乱す<end>"
english = "Zsilak Rebels<end>"

["1090063"]
japanese = "白虎将軍ジラークが人類に対して宣戦布告した。<line-break>ネメア亡きディンガル指導部に種族平等社会は、<line-break>不可能であると判断したようである。<line-break>アルノートゥンには莫大な量の魔力増幅鉱石、<line-break>聖光石が埋蔵されているとの噂があり、これが<line-break>事実であるならば、戦況を一変させる<line-break>ことも不可能でない。<line-break>事態を重く見たディンガル帝国は、ロストール<line-break>攻略中だった青竜軍を帰還させ、これの討伐に<line-break>差し向けた。<end>"
english = "White Tiger General Zsilak declared war on humanity. He apparently judged a society of racial equality impossible under Dyneskal's post-Nemea leadership. Alnortun is rumored to hold vast deposits of Holy Light Stone, an ore that amplifies magical power. If true, the deposits could transform the course of the war. Recognizing the gravity of the situation, the Dyneskal Empire recalled the Azure Dragon Army from the Rostorl Campaign and sent it to suppress Zsilak.<end>"

["1090064"]
japanese = "ジラークの乱、終結す<end>"
english = "Zsilak's Rebellion Ends<end>"

["1090065"]
japanese = "ジラークは<value:$28>の活躍で倒された。<line-break>アルノートゥンにおけるコーンスの反乱は<line-break>ここに終結した。<line-break>ディンガル帝国はコーンスに対する迫害を禁止、<line-break>登用は種族に関わらず、能力によるという<line-break>ネメアの種族平等路線が継続されることを<line-break>発表した。なお、その後の調査により、<line-break>この反乱の影にアキュリュース攻略でジラークに<line-break>協力した魔道士シャリが暗躍していたことが<line-break>判明している。<end>"
english = "Zsilak was defeated through the efforts of <value:$28>. The Konsu Rebellion in Alnortun ended. The Dyneskal Empire prohibited persecution of the Konsu and announced the continuation of Nemea's policy of racial equality, under which appointments would be based on ability regardless of race. A later investigation revealed that the mage Shalli, who had aided Zsilak in the campaign against Aqyurius, had been working behind the scenes of the rebellion.<end>"

["1090066"]
japanese = "ジラークの乱、終結す<end>"
english = "Zsilak's Rebellion Ends<end>"

["1090067"]
japanese = "ジラークはカルラ率いる青竜軍によって<line-break>倒された。<line-break>ディンガル帝国はコーンス族討伐令を発し、<line-break>コーンス族は追われる存在となった。<line-break>なお、その後の調査により、<line-break>この反乱の影にアキュリュース攻略でジラークに<line-break>協力した魔道士シャリが暗躍していたことが<line-break>判明している。<line-break><line-break><end>"
english = "Zsilak was defeated by the Azure Dragon Army led by Karula. The Dyneskal Empire issued an order for the suppression of the Konsu, who became a hunted people. A later investigation revealed that the mage Shalli, who had aided Zsilak in the campaign against Aqyurius, had been working behind the scenes of the rebellion.<end>"

["1090068"]
japanese = "束縛の腕輪奪取<end>"
english = "Bracelet of Binding Seized<end>"

["1090069"]
japanese = "ディンガル帝国がウルカーンを陥落させた。<line-break>ウルカーンは魔道士たちの操る溶岩の兵士マグマ<line-break>ゴーレムの力で、進攻してくる敵の軍を退け、<line-break>数百年にわたって独立を守ってきた。<line-break>だが、ディンガル皇帝ネメアの単騎突入の前に<line-break>マグマゴーレム部隊は一瞬で壊滅、ウルカーンは<line-break>陥落した。長老シェムハザは闇の神器、<line-break>束縛の腕輪を所持しており、その力を解放して<line-break>抵抗したが<value:$28>によって<line-break>倒された。<end>"
english = "The Dyneskal Empire captured Ulkarne. For centuries, Ulkarne had preserved its independence by repelling invading armies with Magma Golems, lava soldiers controlled by mages. But Nemea, emperor of Dyneskal, charged in alone and annihilated the Magma Golem units in an instant, and Ulkarne fell. Elder Shemhaza possessed the Bracelet of Binding, an Artifact of Darkness, and released its power to resist, but <value:$28> defeated him.<end>"

["1090070"]
japanese = "束縛の腕輪奪取<end>"
english = "Bracelet of Binding Seized<end>"

["1090071"]
japanese = "ディンガル帝国がウルカーンを陥落させた。<line-break>ウルカーンは魔道士たちの操る溶岩の兵士マグマ<line-break>ゴーレムの力で、進攻してくる敵の軍を退け、<line-break>数百年にわたって独立を守ってきた<line-break>だが、ディンガル皇帝ネメアの単騎突入の前に<line-break>マグマゴーレム部隊は一瞬で壊滅、ウルカーンは<line-break>陥落した。長老シェムハザは闇の神器、<line-break>束縛の腕輪を所持しており、その力を解放して<line-break>抵抗したが、ネメアの敵ではなかった。<line-break>束縛の腕輪はネメアの手に落ちることになった。<end>"
english = "The Dyneskal Empire captured Ulkarne. For centuries, Ulkarne had preserved its independence by repelling invading armies with Magma Golems, lava soldiers controlled by mages. But Nemea, emperor of Dyneskal, charged in alone and annihilated the Magma Golem units in an instant, and Ulkarne fell. Elder Shemhaza possessed the Bracelet of Binding, an Artifact of Darkness, and released its power to resist, but he was no match for Nemea. The Bracelet of Binding thus fell into Nemea's hands.<end>"

["1090072"]
japanese = "ロストールでクーデター発生<end>"
english = "Coup in Rostorl<end>"

["1090073"]
japanese = "ディンガル帝国の進攻で守備隊が出払った王都で<line-break>かねて王妃エリスと対立していた上流貴族たちが<line-break>エリエナイ公レムオンを中心に決起。<line-break>王妃エリスを殺害、その甥ゼネテス総司令を<line-break>処刑しようとした。<line-break>クーデターは意外な形で終結した。<line-break>闇の力に魅入られた王女ティアナが乱入し、<line-break>貴族達を殺害して逃亡したのである。<line-break>現在のところ、王女ティアナの行方は<line-break>分かっていない。<end>"
english = "With the garrison absent from the royal capital because of the Dyneskal Empire's advance, high nobles long opposed to Queen Eris rose in revolt under Lemghon, Duke of Elienai. They killed Queen Eris and attempted to execute her nephew, Commander-in-Chief Xenetes. The coup ended unexpectedly when Princess Tiana, enthralled by the power of darkness, stormed in, killed the nobles, and fled. Princess Tiana's whereabouts remain unknown.<end>"

