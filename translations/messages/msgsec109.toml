japanese = "ディンガル帝国の進攻で守備隊が出払った王都で<line-break>かねて王妃エリスと対立していた上流貴族たちが<line-break>エリエナイ公レムオンを中心に決起。<line-break>王妃エリスを殺害、その甥ゼネテス総司令を<line-break>処刑しようとした。<line-break>クーデターは意外な形で終結した。<line-break>闇の力に魅入られた王女アトレイアが乱入し、<line-break>貴族達を殺害して逃亡したのである。<line-break>現在のところ、王女アトレイアの行方は<line-break>分かっていない。<end>"
english = "With the garrison absent from the royal capital because of the Dyneskal Empire's advance, high nobles long opposed to Queen Eris rose in revolt under Lemghon, Duke of Elienai. They killed Queen Eris and attempted to execute her nephew, Commander-in-Chief Xenetes. The coup ended unexpectedly when Princess Atleia, enthralled by the power of darkness, stormed in, killed the nobles, and fled. Princess Atleia's whereabouts remain unknown.<end>"

