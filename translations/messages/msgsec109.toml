["1090000"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090001"]
japanese = "旅の商人として世界を回る父フリントと、世話<line-break>好きな少女ルルアンタ。<value:$28>と彼ら<line-break>の日常は、フリントが盗賊の凶刃に倒れた時に<line-break>終わりを告げた。フリントは<value:$28>に<line-break>自分が実はロストール王妃エリス直属の密偵で<line-break>あることを明かし、ノーブルの代官ボルボラから<line-break>の密書を託す。<value:$28>は父に代わり、<line-break>エリスに密書を届けるが、フリントは帰らぬ人と<line-break>なってしまった。父の死の悲しみを乗り越え、<line-break><value:$28>の冒険の旅が始まった。<end>"
english = "Flint, father to <value:$28>, was a merchant who traveled the world, while Lulluantha was a caring young girl. Their life together ended when Flint was cut down in a bandit attack. Flint revealed his true identity as a spy directly serving Eris, Queen of Rostorl, and entrusted <value:$28> with a Secret Letter from Bolbora, governor of Noble. <value:$28> delivered the Secret Letter to Eris in Flint's stead, but Flint never returned. Overcoming the grief of a father's death, <value:$28> set out on a journey of adventure.<end>"

["1090002"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090003"]
japanese = "大陸地図にもない小さな村、ミイスを、魔人<line-break>アーギルシャイアが襲う。ミイスの神殿にある<line-break>忘却の仮面を欲した彼女は、魔獣デスギガースを<line-break>引き連れて神殿を襲撃。<value:$28>の父で<line-break>ある神官ダディアスを殺し、村を焼き尽くした。<line-break><value:$28>の兄、神官戦士ロイは、単身<line-break>デスギガースと対峙、勝利したが、彼自身もまた<line-break>アーギルシャイアと共に姿を消してしまった。<line-break>そこに現れたロイの友人と名乗る男、セラと共に<line-break><value:$28>は兄の行方を探す旅に出た。<end>"
english = "The demon Argyleshire attacked Miis, a tiny village absent even from maps of the continent. Seeking the Mask of Oblivion kept in the temple of Miis, she assaulted the temple with the demonic beast Death Gigas. She killed Dadyas, the priest who was father to <value:$28>, and burned the village to the ground. Roy, the older brother of <value:$28> and a priest-warrior, faced Death Gigas alone and prevailed, but then vanished along with Argyleshire. A man named Sera appeared, claiming to be Roy's friend, and <value:$28> set out with him to search for Roy.<end>"

["1090004"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090005"]
japanese = "ノーブルの町は、代官ボルボラの悪政に苦しんで<line-break>いた。<value:$28>とチャカの姉弟は、町の<line-break>有志とともにボルボラに対する反乱を企てる。<line-break>しかしそれは、ノーブルの領主レムオンの失脚を<line-break>狙うロストール王妃エリスの巧妙な計画だった。<line-break>事態を察知しノーブルへ来たレムオンと共に<line-break>ボルボラを倒した<value:$28>だったが、<line-break>同時に彼女たち姉弟はノーブルを離れることを<line-break>余儀なくされる。生まれ育った町並みをあとに、<line-break>ふたりはレムオンとともに旅に出たのだった。<end>"
english = "Noble suffered under Governor Bolbora's misrule. <value:$28> and her younger brother Chaka joined concerned townspeople in plotting a rebellion against him. Yet the rebellion was part of a cunning plan by Eris, Queen of Rostorl, to bring about the downfall of Lemghon, lord of Noble. Lemghon learned what was afoot and came to Noble. With his help, <value:$28> defeated Bolbora, but in the process the siblings were forced to leave town. Leaving behind the streets where they had grown up, the two set out with Lemghon.<end>"

["1090006"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090007"]
japanese = "エンシャントのはずれにある魔道の塔で目覚めた<line-break><value:$28>は記憶を失っていた。<line-break>自分が何者かもわからない状態で魔物に襲われ、<line-break>窮地に陥ったところを、偶然その場にいあわせた<line-break>ディンガル帝国宰相・ベルゼーヴァに救われる。<line-break><value:$28>はベルゼーヴァの助言に従い<line-break>冒険者として身を立てようと、ギルドを訪れる。<line-break>そこで出会ったイーシャという名のわけありげな<line-break>冒険者の少女に、半ば強引に連れ出され、<line-break><value:$28>の自分を捜す旅は始まった。<end>"
english = "<value:$28> awoke in the Arcane Tower on the outskirts of Ancient with no memories; even the amnesiac's own identity was a mystery. A Monster attacked and drove the amnesiac into desperate straits, but Beelzeva, Chancellor of the Dyneskal Empire, happened to be there and came to the rescue. Following Beelzeva's advice, <value:$28> went to the Guild to seek work as an adventurer. There, a mysterious young adventurer named Iria all but dragged <value:$28> away, and the search for a lost identity began.<end>"

["1090008"]
japanese = "旅立ち<end>"
english = "Setting Out<end>"

["1090009"]
japanese = "ノーブルの町は、代官ボルボラの悪政に苦しんで<line-break>いた。<value:$28>とチャカの姉弟は、町の<line-break>有志とともにボルボラに対する反乱を企てる。<line-break>しかしそれは、ノーブルの領主レムオンの失脚を<line-break>狙うロストール王妃エリスの巧妙な計画だった。<line-break>事態を察知しノーブルへ来たレムオンと共に<line-break>ボルボラを倒した<value:$28>だったが、<line-break>同時に彼女たち姉弟はノーブルを離れることを<line-break>余儀なくされる。生まれ育った町並みをあとに、<line-break>ふたりはレムオンとともに旅に出たのだった。<end>"
