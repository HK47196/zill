english = "There's a girl named Lufren at the inn in Amiral. You ought to go and meet her.<end>"

["470010"]
japanese = "ディードの使い方はわかっと～るのね。<end>"
english = "So you know how to use a Deed, eh?<end>"

["470011"]
japanese = "それなら、ディードを使って大活躍して<line-break>わしの偉さを広めて欲しいんじゃね。<end>"
