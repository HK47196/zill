["2240002"]
japanese = "ふははははは！<line-break>男は、乙女の涙の数だけ強くなる！<line-break>未来の勇者ガルドラン、ついに参上！<line-break>さあ、可憐な少女よ<line-break>すぐさま悪党どもから助けてやる！<line-break>思うさま美しい笑顔の準備をするのだ。<line-break>未来の勇者の熱き魂を感じろ！<line-break>俺様に助けられる幸運をかみしめろ！<line-break>もはや涙など捨ててしまうがいい！<end>"
english = "Fwahahahaha! A man grows stronger with every tear a maiden sheds! Girldlan, the Hero of the future, has arrived at last! Fair maiden, I shall rescue you from these villains at once! Prepare to smile your loveliest smile! Feel the fiery spirit of the future Hero! Savor the good fortune of being rescued by me! You may cast aside your tears now!<end>"

["2240003"]
japanese = "さあ、悪党どもめ、改心の時間だ！<line-break>俺の正義の心を槍から注入してやろう！<line-break>食らえ！\u3000必殺！\u3000悪者成敗勇者槍！<end>"
english = "Now, villains, it is time to repent! I shall inject my righteous heart into you through my spear! Take this! Finishing move: Hero's Spear of Villain-Smiting!<end>"

["2240004"]
japanese = "フッ…。<line-break>また増やしてしまったな。<line-break>輝かしい英雄叙事詩の１ページを。<end>"
english = "Hmph... Another page added to my glorious heroic epic.<end>"

["2240005"]
japanese = "さあ、もう怖がることはない。<line-break>こっちへおいで、お嬢さん。<end>"
english = "There is nothing to fear now. Come here, young lady.<end>"

["2240006"]
japanese = "ウッ…、ウッ…。<end>"
english = "*Sob... sob...*<end>"

["2240007"]
japanese = "貴様ッ！\u3000俺の彼女に手を出すなッ！<end>"
english = "You! Stay away from my girl!<end>"

["2240008"]
japanese = "…何だ、貴様は？<end>"
english = "What...? Who are you?<end>"

["2240009"]
japanese = "黙れ、この盗賊ッ！<line-break>今すぐ彼女から離れないと<line-break>たたじゃすまないぞッ！<end>"
english = "Shut up, you bandit! Get away from her right now, or you'll pay for it!<end>"

["2240010"]
japanese = "ふははは！\u3000この早とちりさんめがっ！<line-break>見てわからんのか、この状況が？<line-break>これだから素人は困るのだ。<line-break>俺様の槍からほとばしる熱き魂に触れ<line-break>彼女は、小さな胸を打ち震わせ<line-break>感動の涙を流しているにすぎん！<end>"
english = "Fwahahaha! You jumped to conclusions, you fool! Can't you see what's going on? This is the trouble with amateurs. The fiery spirit surging from my spear has set her little chest trembling and moved her to tears, that's all!<end>"

["2240011"]
japanese = "ふっ、礼はいらん。<line-break>ただ、未来の勇者ガルドランの勇姿を<line-break>その魂に刻んでおくがいい…。<line-break>そして貴様も、思うさま<line-break>熱き魂をほとばしらせるのだ。<line-break>この俺様に憧れて、な。<end>"
english = "Hmph. No thanks are necessary. Simply engrave the gallant figure of Girldlan, the Hero of the future, upon your soul. Then let your own fiery spirit surge forth to your heart's content, in admiration of me.<end>"

["2240012"]
japanese = "待て、逃がすかッ！<end>"
english = "Stop! You won't get away!<end>"

["2240013"]
japanese = "どわっ！！<end>"
english = "Gwaaah!!<end>"

["2240014"]
japanese = "…え？<line-break>俺様…刺され…た…？<end>"
english = "What...? I've been... stabbed...?<end>"

["2240015"]
japanese = "おい、大丈夫か！？<line-break>しっかりしろ！<end>"
english = "Hey, are you all right?! Stay with us!<end>"

["2240016"]
japanese = "…ふっ、な、なんのことだ？<line-break>常識で考えろ！\u3000…素人の攻撃を<line-break>未来の勇者が食らうはず…なかろう！<end>"
english = "Hmph... W-what are you talking about? Use your common sense! The Hero of the future could never be struck by an amateur's attack... obviously!<end>"

["2240017"]
japanese = "ぐわっ…。<end>"
english = "Gwah...<end>"

["2240018"]
japanese = "ダメだよ！<line-break>しばらくジッとしてて。<line-break>手当てしてあげるから。<end>"
english = "No! Keep still for a while. I'll tend to your wound.<end>"

["2240019"]
japanese = "ふっ…心配するな、少年たちよ！<line-break>未来の勇者の力を見るがいい！<line-break>正義の力で傷がふさがってい…<line-break>んぐあっ！\u3000痛い！\u3000ふさがらないッ！<line-break>お、俺様に手傷を負わせるとは…<line-break>あの少年…なかなかやるな！<end>"
english = "Hmph... Fear not, boys! Behold the power of the future Hero! The power of justice is closing my wound―ngwaaah! It hurts! It isn't closing! T-to think that boy managed to wound me... He's rather good!<end>"

["2240020"]
japanese = "バカなこと言ってないで<line-break>おとなしくそこに座れよ…。<end>"
english = "Stop talking nonsense and sit still...<end>"

["2240021"]
japanese = "…ふっ、未来の勇者の危機を見過ごせぬ<line-break>貴様たちの正義の行い、受けてやろう！<line-break>…痛いっ！\u3000…もっとやさしくしてッ！<end>"
english = "Hmph... You cannot stand by while the future Hero is in peril. Very well! I shall accept your righteous aid! Ow! Be gentler!<end>"

["2240022"]
japanese = "よし！\u3000これで大丈夫だよ。<end>"
english = "There! You'll be all right now.<end>"

["2240023"]
japanese = "…おお、勇者復活！<end>"
english = "Oh! The Hero is back!<end>"

["2240024"]
japanese = "ねえ、ガルドラン。<line-break>まさかとは思うけどさっきの少年に<line-break>仕返しするつもりじゃないよね？<end>"
english = "Hey, Girldlan. You're not seriously planning to get back at that boy, are you?<end>"

["2240025"]
japanese = "ふはははは、青い、青すぎるぞ！<line-break>逆恨み、やっかみ、仕返し、闇討ち…<line-break>そんな言葉は、俺様の辞書に存在せん！<line-break>未来の勇者の辞書にある言葉は<line-break>ただひとつ！<line-break>「熱き魂」のみ！<end>"
english = "Fwahahahaha! How naive! Far too naive! Resentment, envy, revenge, ambush... Such words do not exist in my dictionary! The future Hero's dictionary contains but one phrase: “fiery spirit”!<end>"

["2240026"]
japanese = "そうなんだ。…ごめん。<end>"
english = "Oh. Sorry.<end>"

["2240027"]
japanese = "少年が少しばかり早とちりのマヌケでも<line-break>俺様のおかげで少女が救われたのだ。<line-break>それで充分ではないか…。<end>"
english = "The boy may be a bit of a fool who jumps to conclusions, but thanks to me, the girl was saved. Isn't that enough?<end>"

["2240028"]
japanese = "ガルドラン…。お前ってやつは<line-break>確かに勇者の中の勇者だぜ…。<end>"
english = "Girldlan... You really are a hero among heroes...<end>"

["2240029"]
japanese = "フッ…。<line-break>わかってくれればいいんだ。<line-break>熱き魂の同志よ。<end>"
english = "Hmph... That's all I ask, my comrade in fiery spirit.<end>"

["2240030"]
japanese = "さらばだ、諸君。<line-break>正義の心が呼び合う限り<line-break>また会える日もあるだろう。<line-break>くじけそうになった時は<line-break>夜空を見上げて俺様のことを<line-break>思い出すがいい。<line-break>未来の勇者、ガルドランを！<end>"
english = "Farewell, all of you. So long as righteous hearts call to one another, the day may come when we meet again. Whenever you're about to lose heart, look up at the night sky and remember me: Girldlan, the Hero of the future!<end>"

