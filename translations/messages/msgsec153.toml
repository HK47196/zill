["1530000"]
japanese = "エルファス\u3000ボリューム４\u3000開始<end>"
english = ""

["1530001"]
japanese = "天空神ノトゥーンよ。<line-break>アンギルダン将軍とともに出征した<line-break>私の恋人ラルフの安否を教えてください。<line-break>どうか、その大いなるお力をもって…<line-break>お示しください…。<line-break>どうか…。<end>"
english = "O Notun, the Sky God. Please tell me what has become of my beloved Ralph, who went to war with General Angeerdan. By your great power, I beg you... show me. Please...<end>"

["1530002"]
japanese = "マータ、僕だよ、ラルフだよ。<end>"
english = "Marta, it's me. It's Ralph.<end>"

["1530003"]
japanese = "ラルフ！？<end>"
english = "Ralph?!<end>"

["1530004"]
japanese = "ゴメンね、マータ。<line-break>僕は、君とは、もう、会えない。\u3000\u3000<line-break>かなしいけれど、僕は戦死した。<line-break>君は悲しむことだろう。<line-break>だけど、僕のことはあきらめてくれ。<end>"
english = "I'm sorry, Marta. I can't ever see you again. It grieves me to say it, but I was killed in battle. I know you'll mourn me, but please... let me go.<end>"

["1530005"]
japanese = "いや！<line-break>そんな、そんなのイヤ！<line-break>ラルフ、そんな！<end>"
english = "No! No, I won't accept that! Ralph, you can't...!<end>"

["1530006"]
japanese = "こうして死んでもなお会いに行くことが<line-break>君をいっそう悲しませるのではないかと<line-break>僕は悩んでいた。<line-break>だけど、ゴメン、マータ。<line-break>君のことがずっと心に掛かっていた。<line-break>君に最後に会わずにいられなかった。<end>"
english = "I was afraid that coming to see you, even after my death, would only cause you more pain. But I'm sorry, Marta. I couldn't stop worrying about you. I had to see you one last time.<end>"

["1530007"]
japanese = "勝手な言いぐさだけど、<line-break>僕のことでいつまでも悲しまないで<line-break>早く元気になってくれると、うれしい。<line-break>それじゃ…<line-break>最後に会えてよかった。<line-break>マータ…。<end>"
english = "I know it's selfish of me to say this, but it would make me happy if you didn't grieve over me forever and could get back to your old self soon. Well... I'm glad I got to see you one last time. Marta...<end>"

["1530008"]
japanese = "ラルフ…。<end>"
english = "Ralph...<end>"

["1530009"]
japanese = "…おせっかいだな。<line-break>死者の願いなど<line-break>無視するべきなのだ。<end>"
english = "How meddlesome. The wishes of the dead ought to be ignored.<end>"

["1530010"]
japanese = "だって、あの野ざらしの死体には<line-break>とっても強い願いが残ってたんだ。<line-break>放っておけないよ。<end>"
english = "But such a powerful longing remained in that corpse lying out in the open. I couldn't just leave it.<end>"

["1530011"]
japanese = "…黙っていれば、あの女は<line-break>恋人を待つ自分に陶酔しながら、<line-break>ここで飽きるまでお祈りができたのだ。<line-break>幸福なままにな。<line-break>死者のために生きている人間の<line-break>幸福を壊すとは愚かなことだ。<end>"
english = "Had you kept silent, that woman could have stayed here praying until she tired of it, intoxicated by the thought of herself waiting for her lover. She could have remained happy. It is foolish to destroy the happiness of the living who devote themselves to the dead.<end>"

["1530012"]
japanese = "生きている人間の傷は時間がいやす。<line-break>けど、時間がすり抜ける死者の心の傷は<line-break>何もいやすことがないんだよ。<line-break>君もアズラゴーザの件で忙しいんだろ。<line-break>こんな所で油売ってないで、行きなよ。<line-break>…おっと、勇者さまがおいでだよ。<end>"
english = "Time heals the wounds of the living. But the dead lie beyond time's reach, so nothing can heal their wounded hearts. You're busy with that Azuragoza business too, aren't you? Stop dawdling here and get going. Oh, look. The Hero has arrived.<end>"

["1530013"]
japanese = "いくら、君でも<line-break>神の前で事をかまえるほど<line-break>神を信じていないわけではないだろう？<end>"
english = "Even you aren't so lacking in faith that you'd start a fight before a god, are you?<end>"

["1530014"]
japanese = "あせらなくても、十分強くなったら、<line-break>相手してあげるよ。<line-break>じゃあね。<end>"
english = "No need to rush. Once you're strong enough, I'll take you on. See you.<end>"

["1530015"]
japanese = "ありがとうございます、エルファス様。<end>"
english = "Thank you, Lord Elfas.<end>"

["1530016"]
japanese = "ああ、救世主様！<line-break>あれほどの食料をいただけるなんて！<end>"
english = "Oh, Savior! To think you would give us so much food!<end>"

["1530017"]
japanese = "信じ祈る者を、神は見捨てはしない。<line-break>裁きを受けたこの街で<line-break>なおも生き抜く者に許されること。<line-break>それは、ただ祈ることだ。<line-break>神を信じ、すがることだ。<end>"
english = "God will not forsake those who believe and pray. For those who still endure in this city under judgment, only one thing is permitted: prayer. Believe in God and turn to God for salvation.<end>"

["1530018"]
japanese = "今、真の裁きが降ろうとしている。<line-break>世界が滅びる日が迫っている。<line-break>\u3000<line-break>祈るのだ。すべてを投げ捨て<line-break>神にすがるのだ。<end>"
english = "True judgment is about to descend. The day the world ends draws near. Pray. Cast everything aside and seek refuge in God.<end>"

["1530019"]
japanese = "神は、その祈りを<line-break>聞き届けてくださるだろう。<end>"
english = "God will surely hear your prayers.<end>"

["1530020"]
japanese = "くだない説教はやめないか！<line-break>さあ、みなも耳を貸すんじゃない。<end>"
english = "Enough of this foolish sermon! Everyone, don't listen to him!<end>"

["1530021"]
japanese = "ちょっと、あんた！<line-break>救世主様に何するんだい！<line-break>\u3000<line-break>このお方はね、あたしたちに<line-break>食べ物を恵んでくださったんだよ。<end>"
english = "Hey, you! What do you think you're doing to the Savior? He gave us food!<end>"

["1530022"]
japanese = "そうさね。<line-break>このお方に指一本でも触れたら<line-break>ただじゃおかんわい。<end>"
english = "That's right. Lay so much as a finger on him and you won't get away with it!<end>"

["1530023"]
japanese = "黙らないか！<line-break>破滅を説くような男の話を<line-break>信じてはダメだ！<end>"
english = "Silence! Don't believe a man who preaches doom!<end>"

["1530024"]
japanese = "この男は連行する！<end>"
english = "We're taking this man into custody!<end>"

["1530025"]
japanese = "さあ、来るんだ！<end>"
english = "Come along!<end>"

["1530026"]
japanese = "なんだお前は？<line-break>邪魔をするな！<end>"
english = "Who are you? Stay out of this!<end>"

["1530027"]
japanese = "…相変わらず血の気が多いな。<line-break>君は、騒ぎを見ると<line-break>放っておけない性分のようだ。<end>"
english = "Still as hotheaded as ever, I see. Whenever there's trouble, you just can't stay out of it.<end>"

["1530028"]
japanese = "君の腕は買うけれど、<line-break>その性格はいただけない。<line-break>\u3000<line-break>…操りにくいからね。<line-break>そういう人形は。<end>"
english = "I value your skill, but not that temperament of yours. It makes a puppet like you difficult to control.<end>"

["1530029"]
japanese = "…相変わらず血の気が多いな。<line-break>騒ぎを見ると放っておけない<line-break>性分のようだ、君は。<line-break>僕が言ったことを<line-break>覚えているだろう？<end>"
english = "Still as hotheaded as ever, I see. Whenever there's trouble, you just can't stay out of it. You remember what I told you, don't you?<end>"

["1530030"]
japanese = "力にすがるのは愚かなことだ。<line-break>力はただ、より強い力によって<line-break>叩き伏せられるのみ…。<line-break>…君のために言ってるんだ。<end>"
english = "It is foolish to rely on power. Power is only ever crushed by a greater power. I'm saying this for your own good.<end>"

["1530031"]
japanese = "余計なことをしてくれた。<line-break>放っておいてくれれば、<line-break>よかったのに…。<end>"
english = "You interfered where you weren't wanted. You should have left me alone.<end>"

["1530032"]
japanese = "僕が礼を言うとでも思ったのか？<end>"
english = "Did you expect me to thank you?<end>"

["1530033"]
japanese = "君、僕を知らないのか…？<line-break>それなら、礼を言う代わりに<line-break>ひとつ忠告しよう。<line-break>力にすがるのは愚かなことだ。<line-break>力はただ、より強い力によって<line-break>叩き伏せられるのみだ。<end>"
english = "You don't know who I am? Then instead of thanking you, let me offer you a warning. It is foolish to rely on power. Power is only ever crushed by a greater power.<end>"

["1530034"]
japanese = "僕は神が遣わしたる救世主<line-break>エルファス。<line-break>僕の言葉は、神の言葉だ。<end>"
english = "I am Elfas, the Savior sent by God. My words are the words of God.<end>"

["1530035"]
japanese = "君の名…、聞いておきたい。<end>"
english = "I would like to know your name.<end>"

["1530036"]
japanese = "<value:$28>…。<line-break>君とは、また会いそうな気がするよ。<end>"
english = "<value:$28>... I have a feeling we'll meet again.<end>"

["1530037"]
japanese = "わしらが生きていられるのは、<line-break>エルファス様のおかげじゃ。<line-break>ありがたや、ありがたや。<end>"
english = "It's thanks to Lord Elfas that we're still alive. Bless him. Bless him.<end>"

["1530038"]
japanese = "あのお方に手を上げるなんて。<line-break>まったく、ディンガルのやつらと来たら。<end>"
english = "How dare they raise a hand against him. Those wretched Dyneskal...<end>"

["1530039"]
japanese = "神よ、感謝します。<end>"
english = "God, I give thanks.<end>"

["1530040"]
japanese = "やっと気が付いたか。<end>"
english = "Finally awake, are you?<end>"

["1530041"]
japanese = "あいつらなら、僕が追い払った。<line-break>\u3000<line-break>\u3000<line-break>やってくれるね、君も。<line-break>でも、どうせ邪魔をするなら<line-break>もっと他に方法があるだろう？<end>"
english = "I drove them off. You really are something, you know. But if you were going to interfere, couldn't you have found a better way?<end>"

["1530042"]
japanese = "やっと気が付いたか。<end>"
english = "Finally awake, are you?<end>"

["1530043"]
japanese = "あいつらなら、僕が追い払った。<line-break>\u3000<line-break>\u3000<line-break>少しは自分の力をわきまえてくれ。<line-break>次はもう、君を助けたりしないよ。<end>"
english = "I drove them off. Try to understand the limits of your strength. I won't save you again.<end>"

["1530044"]
japanese = "やっと気が付いたか。<end>"
english = "Finally awake, are you?<end>"

["1530045"]
japanese = "あいつらなら僕が片付けた。<line-break>君が気を失っている間にね。<line-break>\u3000<line-break>君の無責任なお節介の礼に<line-break>ひとつ忠告しよう。<line-break>…自分の力を過信しないことだ。<end>"
english = "I dealt with them while you were unconscious. In return for your reckless meddling, let me offer you a warning: do not place too much faith in your own strength.<end>"

["1530046"]
japanese = "力にすがるのは愚かなことだ。<line-break>力はただ、より強い力によって<line-break>叩き伏せられるのみだ。<end>"
english = "It is foolish to rely on power. Power is only ever crushed by a greater power.<end>"

["1530047"]
japanese = "君、僕を知らないのか？<line-break>\u3000<line-break>\u3000<line-break>僕は神が遣わしたる<line-break>救世主エルファス。<line-break>僕の言葉は、神の言葉だ。<end>"
english = "You don't know who I am? I am Elfas, the Savior sent by God. My words are the words of God.<end>"

["1530048"]
japanese = "君の名…、聞いておきたい。<end>"
english = "I would like to know your name.<end>"

["1530049"]
