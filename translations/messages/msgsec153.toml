english = "<value:$28>... I have a feeling we'll meet again.<end>"

["1530050"]
japanese = "き、消えた！？<end>"
english = "G-gone?!<end>"

["1530051"]
japanese = "こっちだ。<end>"
english = "Over here.<end>"

["1530052"]
japanese = "く、くそぉ…。<end>"
english = "D-damn it...<end>"

["1530053"]
japanese = "うわっ。<line-break>ま、待て…！<end>"
english = "Agh! W-wait!<end>"

["1530054"]
japanese = "こ、ここはいったん退こう。<end>"
english = "L-let's retreat for now.<end>"

["1530055"]
japanese = "エルファス様！<line-break>ありがとうございます。<end>"
english = "Lord Elfas! Thank you!<end>"

["1530056"]
japanese = "救世主様！<end>"
