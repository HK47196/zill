["380080"]
japanese = "ま、こんな感じだ。<line-break>参考になったかい？<line-break>ならないようしゃべってるんだが。<line-break>まだ、俺のおしゃべりに<line-break>つきあってくれる気はあるかい？<line-break>ヒマつぶしに何か教えてやれるかもな。<end>"
