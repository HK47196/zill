["380084"]
japanese = "チョット好意的になりつつある。<line-break>だが、あくまでもチョット！<line-break>つまりオトモダチ未満な関係だぜ。<end>"
english = "You're starting to warm to each other a little. But only a little! In other words, you're not even friends yet.<end>"

["380085"]
