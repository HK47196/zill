["2230005"]
japanese = "マジかよ、面倒見がよすぎだぜ。<line-break>ま、でもそこが<value:$28>の<line-break>いいところか…。<line-break>とりあえず、そうと決まったら<line-break>さっさと追いかけようぜ。<line-break>\u3000<line-break>聖光石の廃坑って言ってたから<line-break>今からでも間に合うはずだ。<end>"
english = "Seriously? You're too kind for your own good. Then again, I guess that's what's good about <value:$28>... Anyway, now that that's settled, let's hurry and catch up. Girldlan said it was the abandoned Holy Light Stone mine, so we should still make it if we go now.<end>"

["2230006"]
japanese = "…だよなぁ、ほっとこう。<line-break>あいつと関わるだけ損だもんな。<line-break>\u3000<line-break>どうせ、ろくでもないことに<line-break>決まってるよ。<end>"
english = "Yeah, you're right. Let's leave it alone. Getting involved is nothing but trouble. Whatever's going on, it can't be anything good.<end>"

