["2230001"]
japanese = "感じるぞ、乙女が助けを呼ぶ声を！<line-break>ふっ、熱き魂の伝説がまたひとつ、<line-break>俺様のものになりたがってるようだな。<line-break>ふははは、乙女よ、待っているがいい！<line-break>未来の勇者は、悲しむ女性を裏切らん！<line-break>場所は確か聖光石の廃坑だったな！<end>"
english = "I sense it: the voice of a maiden calling for help! Ha! It seems another legend of a fiery soul yearns to be mine. Hahahaha! Wait for me, maiden! A future Hero never fails a woman in distress! It was the abandoned Holy Light Stone mine, if I remember correctly!<end>"

["2230002"]
japanese = "なんなんだよ、あいつはいきなり！？<line-break>相変わらず、わけわかんねー。<line-break>\u3000<line-break>でも、あいつまた何か<line-break>ろくでもないこと<line-break>しでかしそうな予感がするぜ…。<line-break>どうする？\u3000ほっとくのか？<end>"
english = "What's with Girldlan all of a sudden?! Same as ever, none of it makes any damn sense. Still, I've got a bad feeling Girldlan's about to get up to no good again... What do we do? Stay out of it?<end>"

["2230003"]
japanese = "心配だから追いかける<end>"
