["1320000"]
japanese = "エア\u3000ボリューム４開始<end>"
english = ""

["1320001"]
japanese = "（あれが…、空中都市…。<line-break>\u3000もしかしたらあの中には<line-break>\u3000彼女がいたのかもしれない…。）<end>"
english = "(That's... the Floating City... Maybe she was in there...)<end>"

["1320002"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000小さき者よ…<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000エアの心を乱すな…。<line-break>\u3000\u3000\u3000\u3000\u3000２度とここを訪れるでない。<line-break>\u3000<end>"
english = "Little one... Do not disturb Er's heart. Never return here again.<end>"

["1320003"]
japanese = "\u3000\u3000\u3000エアは世界の均衡を守るべき装置。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000強大な力を持ちながら、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000希望なきゆえに野心を抱かず、\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000絶望ゆえに従順…。\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Er is a device meant to preserve the Balance of the World. Though she possesses immense power, without hope she harbors no ambition, and in despair remains obedient...<end>"

["1320004"]
japanese = "\u3000\u3000\u3000\u3000竜王様はエアという道具を\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000手放すおつもりはない…。<line-break>\u3000\u3000汝にエアの手を引いて、希望の地へ<line-break>\u3000\u3000\u3000連れて行かせるわけにはゆかぬ…。\u3000\u3000<end>"
english = "The Dragon King has no intention of relinquishing the tool called Er... I cannot allow you to take Er by the hand and lead her to a land of hope...<end>"

["1320005"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000汝、小さき者よ…、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000次に我の姿を見るときは、<line-break>\u3000\u3000\u3000我の息吹に身を焼かれるときだと思え。<end>"
english = "You, little one... Know that the next time you behold me will be when my breath sears your flesh.<end>"

["1320006"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000愚かなり…。<line-break>\u3000\u3000\u3000\u3000我が警告を無視するとは…。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "Foolish... To think you would ignore my warning...<end>"

["1320007"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000竜はいかなる時も<line-break>\u3000\u3000\u3000\u3000\u3000真なる言葉しかはかぬこと、<line-break>\u3000\u3000\u3000\u3000その身をもって思い知るがよい。\u3000\u3000\u3000<end>"
english = "Learn firsthand that a dragon always speaks nothing but the truth.<end>"

["1320008"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000エアか…？<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我が小さき娘か…？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "Er...? My little daughter...?<end>"

["1320009"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000見よ、我は死ぬ。<line-break>\u3000\u3000\u3000見よ、無限のソウルを持つ者を…。\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000汝にすら、すべてを見ること<line-break>\u3000\u3000\u3000\u3000\u3000\u3000あたわざる者を…。<end>"
english = "Behold, I die. Behold the Bearer of the Infinite Soul... one whom even you cannot see in full...<end>"

["1320010"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000希望は…ある…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000どんなところにも<line-break>\u3000\u3000\u3000\u3000\u3000\u3000絶望さえしなければ<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000希望はあるのだ。<end>"
english = "There is... hope. Hope can be found anywhere, so long as you do not despair.<end>"

["1320011"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000風の巫女よ…風になれ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000お前の母たちが<line-break>\u3000\u3000\u3000\u3000\u3000\u3000逃れたいと願っていた<line-break>\u3000\u3000\u3000\u3000\u3000地獄のくびきから逃れよ…。\u3000\u3000\u3000\u3000<end>"
english = "Priestess of Wind... become the wind. Escape the yoke of hell from which your mothers longed to be free...<end>"

["1320012"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000この者ならば、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000お前を縛る鎖をも<line-break>\u3000\u3000\u3000\u3000\u3000軽々と引きちぎるだろう…。<line-break>\u3000<end>"
english = "This one could easily tear apart even the chains that bind you...<end>"

["1320013"]
japanese = "\u3000\u3000\u3000\u3000\u3000我は翔王と名乗りながら、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000すべてが自由にならなかった。<line-break>\u3000\u3000\u3000\u3000この巨大な翼も竜王の束縛を<line-break>\u3000\u3000\u3000\u3000振り切ることはできなかった。<end>"
english = "Though I called myself the Soaring King, I was never wholly free. Even these enormous wings could not shake off the Dragon King's bonds.<end>"

["1320014"]
japanese = "\u3000\u3000\u3000\u3000だが、死に臨んで我は自由だ。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000風よ、小さき娘よ…。<line-break>\u3000\u3000\u3000\u3000お前も…自由に、なるのだ…。<end>"
english = "Yet now, as death approaches, I am free. O wind, my little daughter... You too... shall be free...<end>"

["1320015"]
japanese = "翔王…様…。<end>"
english = "Soaring King... my lord...<end>"

["1320016"]
japanese = "<if><value:$01><equal>12…竜の強さはあんなものじゃない。<line-break>翔王はお前さんに<line-break>倒してもらいたかったんだ…。 <end><if><value:$01><equal>20死に急ぐか…翔王…。<line-break>…全力のお前と戦いたかった。 <end><if><value:$01><equal>8なんとも…悲しい魂ですね。<line-break>このような形でしか、あなたに<line-break>運命を託せなかったのですから。 <end><if><value:$01><equal>16…高潔な魂は束縛を拒む。<line-break>死を望み、本気を出さぬか、翔王…。<line-break>\u3000<line-break>私は全力で戦った。<line-break>真に強き者への礼儀だ…。 <end><if><value:$01><equal>11<value:$28>…。<line-break>竜の本来の強さはこの程度じゃないわ。<line-break>彼…あなたに倒されたがっていたのね。 <end><if><value:$01><equal>3竜の強さはこんなものではない。<line-break><value:$28>よ、<line-break>翔王はお主に倒されたかったんじゃな。 <end>………………。 <end>"
english = "<if><value:$01><equal>12A dragon is far stronger than that. The Soaring King wanted to lose to you...<end><if><value:$01><equal>20So eager to die, Soaring King...? I wanted to fight you at your full strength.<end><if><value:$01><equal>8What a sorrowful soul. There was no other way to entrust destiny to you.<end><if><value:$01><equal>16A noble soul refuses to be bound. Do you seek death and refuse to fight in earnest, Soaring King...? I fought with all my strength. It is the courtesy owed to the truly strong...<end><if><value:$01><equal>11<value:$28>... That was nowhere near a dragon's true strength. The Soaring King... wanted to lose to you.<end><if><value:$01><equal>3A dragon is far stronger than that. <value:$28>, the Soaring King wanted to lose to you.<end>...<end>"

["1320017"]
japanese = "…出ていって…くれぬか？<end>"
english = "…Could you… leave?<end>"

