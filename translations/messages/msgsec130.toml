["1300000"]
japanese = "エア\u3000ボリューム１その１開始<end>"
english = ""

["1300001"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000小さき者よ、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000我に話しかけるな。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我が息吹を恐れぬか？<line-break>\u3000<end>"
english = "Little one, do not address me. Do you not fear my breath?<end>"

["1300002"]
japanese = "すみませんでした<end>"
english = "I'm sorry.<end>"

["1300003"]
japanese = "何様のつもりだ<end>"
english = "Who do you think you are?<end>"

["1300004"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000ならば、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無礼なマネは慎むことだ。<line-break>\u3000<line-break>\u3000<end>"
english = "Then see that you refrain from such insolence.<end>"

["1300005"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000愚かな。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000身の程を思い知るがよい。<line-break>\u3000<line-break>\u3000<end>"
english = "Fool. Know your place.<end>"

["1300006"]
japanese = "翔王様！<end>"
english = "Soaring King!<end>"

["1300007"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000エアか…？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000我が小さき娘か…？<line-break>\u3000<line-break>\u3000<end>"
english = "Er...? My little daughter...?<end>"

["1300008"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000見よ、我は死ぬ…。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000見よ、無限のソウルを持つ者を…。<line-break>\u3000\u3000\u3000\u3000\u3000汝すら、すべてを見ること<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000あたわざる者を…。<end>"
english = "Behold, I die... Behold the Bearer of the Infinite Soul... one whom even you cannot see in full...<end>"

["1300009"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000希望は…ある…。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000どんなところにも<line-break>\u3000\u3000\u3000\u3000\u3000\u3000絶望さえしなければ<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000希望はあるのだ…。<end>"
english = "There is... hope... Wherever you may be, so long as you do not despair, there is hope...<end>"

["1300010"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000風の巫女よ…風になれ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000お前の母たちが逃れたいと願っていた<line-break>\u3000\u3000\u3000\u3000\u3000地獄のくびきを逃れよ…。<line-break>\u3000<end>"
english = "Wind priestess... become the wind. Escape the yoke of hell from which your mothers longed to break free...<end>"

["1300011"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000この者ならば、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000お前を縛る鎖をも<line-break>\u3000\u3000\u3000\u3000\u3000軽々と引きちぎるだろう…。<line-break>\u3000<end>"
english = "This one could easily tear apart even the chains that bind you...<end>"

["1300012"]
japanese = "\u3000\u3000\u3000\u3000\u3000我は翔王と名乗りながら、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000すべてが自由にならなかった。<line-break>\u3000\u3000\u3000\u3000この巨大な翼も竜王の束縛を<line-break>\u3000\u3000\u3000\u3000振り切ることはできなかった。<end>"
english = "Though I called myself the Soaring King, I was never wholly free. Even these enormous wings could not shake off the Dragon King's bonds.<end>"

["1300013"]
japanese = "\u3000\u3000\u3000\u3000だが、死に臨んで我は自由だ。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000風よ、小さき娘よ…<line-break>\u3000\u3000\u3000\u3000お前も…自由に、なる…のだ…。<end>"
english = "But now, facing death, I am free. O wind, my little daughter... you too... shall be free...<end>"

["1300014"]
japanese = "翔王…様…。<end>"
english = "Soaring King... my lord...<end>"

["1300015"]
japanese = "…出ていって…くれぬか？<end>"
english = "…Could you… leave?<end>"

["1300016"]
japanese = "おのれ…。よくも…。<end>"
english = "Damn you... How dare you...<end>"

["1300017"]
japanese = "ば、バカな…。<line-break>未来が…読めなかっ…た…？<end>"
english = "I-impossible... I couldn't... read the future...?<end>"

["1300018"]
japanese = "ありがとう！<line-break>なんせさあ。翔王と<line-break>竜王でさえ一目置くエアが相手だろう？<line-break>どうしようかって思ってたんだ。<line-break>おかげで助かったよ。<line-break>うふふ、じゃ、もらってくね！<end>"
english = "Thank you! I mean, you were up against Er―someone even the Soaring King and the Dragon King take seriously, right? I didn't know what I was going to do. You really saved me. Hee-hee! Well, I'll be taking it, then!<end>"

["1300019"]
japanese = "母よ…。<end>"
english = "Mother...<end>"

["1300020"]
japanese = "\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000あなたが来るのを待っていました。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000私は風の精霊神プレシオーネ。<line-break>\u3000\u3000もしもあなたに、私の期待にそうだけの<line-break>\u3000\u3000\u3000\u3000\u3000力があれば、私はあなたに<line-break>\u3000\u3000\u3000\u3000\u3000最高の風を授けましょう。<end>"
english = "Bearer of the Infinite Soul, I have been waiting for you. I am Pressione, spirit god of the wind. If your power proves equal to my expectations, I shall bestow upon you the supreme wind.<end>"

["1300021"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000この奥に潜み\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000あのお方の力を封じている<line-break>\u3000\u3000\u3000\u3000\u3000\u3000憎きアビスの息の根を<line-break>\u3000\u3000\u3000\u3000\u3000\u3000見事止めてくるのです。<end>"
english = "Go into the depths, where the loathsome Abyss lurks and seals away the power of the exalted one, and put an end to it.<end>"

["1300022"]
japanese = "やってみます<end>"
english = "I'll give it a try.<end>"

["1300023"]
japanese = "興味ないです<end>"
english = "I'm not interested.<end>"

["1300024"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000そうですか。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000では、私はあなたを<line-break>\u3000\u3000\u3000\u3000封印の扉へと運びましょう。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000そこで、清き風の光に身を投じ<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000その先にある地で<line-break>\u3000\u3000\u3000\u3000巨人アビスに挑んでください。<end>"
english = "I see. Then I shall carry you to the sealed door. There, cast yourself into the pure light of the wind, then challenge the giant Abyss in the land beyond.<end>"

["1300025"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000いいでしょう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000アビスの餌食となってしまっては<line-break>\u3000\u3000\u3000\u3000\u3000\u3000意味がありません。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000アビスを引き裂くだけの<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000力を付けたなら、<line-break>\u3000\u3000\u3000\u3000もう一度来るとよいでしょう。<end>"
english = "Very well. It would serve no purpose for you to fall prey to Abyss. Return once you have gained the strength to tear Abyss apart.<end>"

["1300026"]
japanese = "\u3000\u3000\u3000\u3000\u3000何を戸惑っているのです。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000風の力が欲しくはないのですか？<end>"
english = "Why do you hesitate? Do you not desire the power of the wind?<end>"

["1300027"]
japanese = "力が欲しい<end>"
english = "I want that power.<end>"

["1300028"]
japanese = "今はやめておく<end>"
english = "Not right now.<end>"

["1300029"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000では、お行きなさい。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000アビスを倒したとき、あなたに<line-break>\u3000\u3000\u3000\u3000\u3000最高の風を授けましょう。<end>"
english = "Then go. When you have defeated Abyss, I shall grant you the greatest wind.<end>"

["1300030"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000いいでしょう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000アビスの餌食となってしまっては<line-break>\u3000\u3000\u3000\u3000\u3000\u3000意味がありません。<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000アビスを引き裂くだけの<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000力を付けたなら、<line-break>\u3000\u3000\u3000\u3000もう一度来るとよいでしょう。<end>"
english = "Very well. There would be no point if you were to fall prey to Abyss. Return once you have gained enough strength to tear Abyss apart.<end>"

["1300031"]
japanese = "悪しき風に送られて<line-break>深淵をのぞきに来たか？<line-break>風よりも軽き生命の人の子よ…。<line-break>ここにあるは、<line-break>真なる闇と破壊…。<line-break>触れることは許されぬ。<end>"
english = "Has an evil wind borne you here to gaze into the abyss? O child of man, whose life is lighter than the wind... Here lie true darkness and destruction. None may touch them.<end>"

["1300032"]
japanese = "ゆえに、何人をも近寄らせぬ。<line-break>バイアス様の力をいただきし<line-break>この土の巨人、アビスがな…！<end>"
english = "Therefore, I allow none to draw near. For I am Abyss, the giant of earth, granted the power of Lord Bias!<end>"

["1300033"]
japanese = "バカな…！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>バイアス様より…いただいた<line-break>この…体が…。<line-break>人の子よ…<line-break>己の罪をいずれ…知るがよい…<line-break>そして、絶望とともに悔いるがよい…。<end>"
english = "Impossible...! This body... bestowed upon me by Lord Bias... Child of man... one day you shall know your sin... and rue it in despair.<end>"

["1300034"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000よくやりました、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000無限のソウルを持つ者よ……。<end>"
english = "Well done, Bearer of the Infinite Soul...<end>"

["1300035"]
japanese = "\u3000\u3000\u3000\u3000よくぞ、アビスを倒しました。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000約束どおり、あなたに最高の風を<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000授けましょう。<line-break>\u3000<line-break>\u3000\u3000\u3000あなたの魔道の力が極限まで高まり<line-break>\u3000\u3000\u3000\u3000\u3000内なる風がまきあがる時<line-break>\u3000\u3000\u3000\u3000この最高の風はあなたを包み<line-break>\u3000\u3000\u3000\u3000仇なす者を切り刻むでしょう。<end>"
english = "You have done well to defeat Abyss. As promised, I shall bestow upon you the supreme wind. When your magical power reaches its utmost and the wind within you rises, this supreme wind will envelop you and cut all who oppose you to pieces.<end>"

["1300036"]
japanese = "風の最高位の魔法が解放された。<end>"
english = "The highest-level wind spell has been unlocked.<end>"

["1300037"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000さぁ、お行きなさい。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。<end>"
english = "Now go, Bearer of the Infinite Soul.<end>"

["1300038"]
japanese = "\u3000\u3000\u3000\u3000待っていました、<value:$28>。<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000アビスに打ち勝つだけの力をつけ、\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000再びここを訪れたのですね。\u3000\u3000\u3000\u3000<end>"
english = "I have been waiting for you, <value:$28>, Bearer of the Infinite Soul. You have gained the strength to overcome Abyss and returned here once more.<end>"

["1300039"]
japanese = "その通りです<end>"
english = "That's right.<end>"

["1300040"]
japanese = "そんなわけじゃ…<end>"
english = "Not exactly...<end>"

