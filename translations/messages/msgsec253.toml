["2530006"]
japanese = "だが、その前にひとつだけ<line-break><value:$28>に確かめておきたい。<line-break>\u3000<line-break>君はシャロームに従うつもりなのか？<line-break>もしそうであれば、君とはここまでだ。<line-break>答えてくれ、<value:$28>？<end>"
