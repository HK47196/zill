["170000"]
japanese = "よお、ヒヨッコ。俺に何の用だ？<end>"
english = "Hey, rookie. What can I do for you?<end>"

["170001"]
japanese = "よお、だいぶいい顔つきになってきたな。<line-break>今日はどうしたんだ？<end>"
english = "Hey, you're starting to look the part. What brings you here today?<end>"

["170002"]
japanese = "よお、噂は聞いてるぜ。頑張ってるじゃないか。<line-break>さて、今日は何をしたいんだ？<end>"
english = "Hey, I've heard the stories. You're doing well for yourself. So, what can I do for you today?<end>"

["170003"]
japanese = "よお、ずいぶんと立派な冒険者になったな。<line-break>よし、俺もいっちょ腕を振るわないとな。<end>"
english = "Hey, you've become quite the adventurer. All right, I'd better put my skills to work too.<end>"

["170004"]
japanese = "他に用事があるんなら言ってくれ。<line-break>遠慮なんかするんじゃないぜ。<end>"
english = "If there's anything else you need, just say the word. Don't hold back.<end>"

["170005"]
japanese = "じゃあ、また来てくれよ。<end>"
english = "Well, come back anytime.<end>"

["170006"]
japanese = "%s\u3000攻撃力%u<line-break>強度%u\u3000階級%u\u3000ＥＣ%u\u3000ＥＳ%s<line-break>%sの特殊効果を持っている<end>"
english = "%s\u3000Attack Power %u\u3000Strength %u\u3000Rank %u\u3000ＥＣ %u\u3000ＥＳ %s\u3000Special Effect: %s<end>"

["170007"]
japanese = "%s\u3000攻撃力%u<line-break>強度%u\u3000階級%u\u3000ＥＣ%u\u3000ＥＳ%s<line-break>特殊効果は持っていない<end>"
english = "%s\u3000Attack Power %u\u3000Strength %u\u3000Rank %u\u3000ＥＣ %u\u3000ＥＳ %s\u3000No special effect<end>"

["170008"]
japanese = "%s\u3000防御力%u<line-break>強度%u\u3000階級%u\u3000ＥＣ%u\u3000ＥＳ%s<line-break>%sの特殊効果を持っている<end>"
english = "%s\u3000Defense Power %u\u3000Strength %u\u3000Rank %u\u3000ＥＣ %u\u3000ＥＳ %s\u3000Special Effect: %s<end>"

["170009"]
japanese = "%s\u3000防御力%u<line-break>強度%u\u3000階級%u\u3000ＥＣ%u\u3000ＥＳ%s<line-break>特殊効果は持っていない<end>"
english = "%s\u3000Defense Power %u\u3000Strength %u\u3000Rank %u\u3000ＥＣ %u\u3000ＥＳ %s\u3000No special effect<end>"

["170010"]
japanese = "そいつはちょっと…無理だな。<line-break>できがよすぎて、それ以上鍛えようがないぜ。<end>"
english = "That one's a bit... no. It's already so well made, there's nothing more I can do to improve it.<end>"

["170011"]
japanese = "なるほど、あんたの注文はよくわかった。<line-break>さっそく仕事にうつるが、かまわないな？<end>"
english = "All right, I know what you want. I'll get started right away. That's all right with you, right?<end>"

["170012"]
japanese = "よし、ちょっとばかし待ってろよ…<end>"
english = "Right, give me a moment...<end>"

["170013"]
japanese = "そら、仕上がった！\u3000なかなかのもんだろ。<line-break>我ながらいい仕事をしたって感じだぜ。<end>"
english = "There, finished! Not bad, eh? That's a fine bit of work, if I say so myself.<end>"

["170014"]
japanese = "おいおい、それ以上抱えたら動けなくなるぜ。<line-break>何かいらないものを処分したほうがいいな。<end>"
english = "Hold on. Carry any more and you won't be able to move. You'd better get rid of something you don't need.<end>"

["170015"]
japanese = "じゃあ、これでいいんだな。<end>"
english = "So, this is what you want?<end>"

["170016"]
japanese = "そうか、ありがとうよ。<line-break>自分好みに鍛えてやってくれ。<end>"
english = "All right, thanks. Hone it to your liking.<end>"

["170017"]
japanese = "アイテムと装備品、どっちを売ってくれるんだ？<end>"
english = "What are you selling, items or equipment?<end>"

["170018"]
japanese = "アイテムは１つも持っていないじゃないか。<line-break>からかうのは、やめて欲しいもんだな。<end>"
english = "You don't have a single item. Come on, don't mess with me.<end>"

["170019"]
japanese = "持ってる装備品は全部装備しているじゃないか。<line-break>装備している物は買い取れないよ。<end>"
english = "All the equipment you own is in use. I can't buy anything you have equipped.<end>"

["170020"]
japanese = "こいつをいくつ売ってくれるんだ？<end>"
english = "How many of these are you selling?<end>"

["170021"]
japanese = "じゃ、こいつを買い取るがかまわないな？<line-break>あとで返してくれなんて言うなよ。<end>"
english = "Right, I'll buy this from you. You're sure? Don't come asking for it back later.<end>"

["170022"]
japanese = "これは、俺にとっては価値のないものだね。<line-break>すまないが、買い取ることはできないな。<end>"
english = "This is worthless to me. Sorry, but I can't buy it.<end>"

["170023"]
japanese = "そうか、ありがとうよ。<line-break>お互い、いい商売をしたな。<end>"
english = "All right, thanks. A good deal for both of us.<end>"

["170024"]
japanese = "悪いが、この名前は変えられないな。<line-break>今以上によい名があるとは、思えないんでね。<end>"
english = "Sorry, but I can't change this name. I can't imagine a better one.<end>"

["170025"]
japanese = "じゃ、<value:$15>ってのはどうだ？<line-break><end>"
english = "Then how about <value:$15>?<end>"

["170026"]
japanese = "名前を入力してください。<line-break><end>"
english = "Please enter a name.<end>"

["170027"]
japanese = "方向キーでカーソル移動、①ボタンで決定。<line-break><end>"
english = "Use the directional buttons to move the cursor, and press the ① button to confirm.<end>"

["170028"]
japanese = "８文字まで入力できます。<end>"
english = "You can enter up to 8 characters.<end>"

["170029"]
japanese = "それじゃ、また来てくれよ。<line-break>それから、武器の手入れはまめにしろよ。<end>"
english = "Come back anytime. And be sure to keep your weapons in good shape.<end>"

["170030"]
japanese = "どいつを鍛えるんだい？<end>"
english = "Which one do you want upgraded?<end>"

["170031"]
japanese = "どいつの名前を変えるんだい？<end>"
english = "Which one do you want to rename?<end>"

["170032"]
japanese = "攻撃力と重量のバランスがいい武器だ。<line-break>ダブルブレードのスキルで二刀流も可能だ。<end>"
english = "This weapon offers a good balance of Attack Power and weight. With the Double Blade skill, you can also use it for Dual Wielding.<end>"

["170033"]
japanese = "両手持ちの大きな剣だ。攻撃力は抜群だぜ。<line-break>ただ、重いから、非力だと扱いづらいがな。<end>"
english = "It's a large, two-handed sword with outstanding Attack Power. But it's heavy, so you'll have trouble handling it if you're not very strong.<end>"

["170034"]
japanese = "両手持ちの槍だ。後列の敵にも攻撃できるぜ。<line-break>攻撃力も高いぞ。<end>"
english = "It's a two-handed spear that can even hit enemies in the back row. Its Attack Power is high, too.<end>"

["170035"]
japanese = "両手持ちの斧だ。攻撃力は最高だがその分重い。<line-break>かなり腕力がないと、使いこなせないだろうな。<end>"
english = "It's a two-handed axe. It has the highest Attack Power, but it's correspondingly heavy. You'll need a lot of strength to wield it effectively.<end>"

["170036"]
japanese = "軽いから、速攻でいくならこいつがおすすめだ。<line-break>ダブルブレードのスキルで二刀流も可能だしな。<end>"
english = "It's light, so I'd recommend this one if you want to attack quickly. With the Double Blade skill, you can also use it for Dual Wielding.<end>"

["170037"]
japanese = "飛び道具だから、離れていても攻撃できるし<line-break>飛んでいる敵が相手でも命中度は落ちないぞ。<end>"
english = "Since it's a ranged weapon, you can attack from a distance, and its accuracy won't drop even against flying enemies.<end>"

["170038"]
japanese = "軽いから、すばやく動けて２連続攻撃ができる。<line-break>ただ、一撃の攻撃力は低いな。<end>"
english = "It's light, so you can move quickly and attack twice in a row. The downside is that each hit has low Attack Power.<end>"

["170039"]
japanese = "ダミーメッセージ<end>"
english = "Dummy message<end>"

["170040"]
japanese = "とても軽いから、すばやさ重視ならおすすめだ。<line-break>もっとも身軽な分、防御力は低いぞ。<end>"
english = "It's very light, so I'd recommend it if you value agility. The trade-off for that freedom of movement is low defense.<end>"

["170041"]
japanese = "防御力と重さのバランスがよいのが特徴だ。<line-break>冒険者の標準的な防具といえるな。<end>"
english = "Its strength lies in its good balance of defense and weight. You could call it the standard armor for adventurers.<end>"

["170042"]
japanese = "上半身を完全に守ることができる防具だ。<line-break>前列で戦う冒険者なら、これがおすすめだ。<end>"
english = "This armor provides complete protection for the upper body. I'd recommend it for adventurers who fight in the front row.<end>"

["170043"]
japanese = "最高の防御力を誇る反面、非常に重い防具だ。<line-break>すばやさよりも、防御力を重視するならこれだ。<end>"
english = "It boasts the highest defense, but it's also extremely heavy. If you value defense over agility, this is the one.<end>"

