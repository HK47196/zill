["2030002"]
japanese = "くしゃみが出たんで、<line-break>もしやと思ったんですが、<line-break>また私の話ですか、ネモ？<end>"
english = "I sneezed, so I had a feeling... Are you talking about me again, Nemo?<end>"

["2030003"]
japanese = "コイツは昔っから野放図でな。<line-break>まあ、その点は今とたいして<line-break>変わっちゃいないが…。<line-break>昔はもっとヒドかったんだ。<line-break>なにしろ、よく俺様の授業中に<line-break>グースカ寝てやがったからな。<line-break>たまに、姿が見えないと思ったら<line-break>そん時は森の中でのんきに<line-break>お昼寝ときたもんだ。<end>"
english = "This guy's always done whatever he pleases. Not that he's changed much in that respect... but he was even worse back then. He used to snore his way through my classes. And whenever he was nowhere to be seen, sure enough, he'd be off in the woods napping without a care in the world.<end>"

["2030004"]
japanese = "しかも怒鳴ろうが殴ろうが<line-break>まったく起きやしねえ。<line-break>\u3000<line-break>あれだけ根性入れて眠ってたのは<line-break>天界でもお前だけだろうよ。<end>"
english = "No amount of shouting or hitting would wake him, either. You must've been the only one in the whole celestial realm who could sleep with that kind of determination.<end>"

["2030005"]
japanese = "根性じゃありません、呪文ですよ。<line-break>自分にスリープの呪文を<line-break>かけていたんです。<end>"
english = "It wasn't determination. It was a spell. I cast Sleep on myself.<end>"

["2030006"]
japanese = "………………。<line-break>お前なぁ…。<line-break>\u3000<line-break>そうまでして、俺の授業が<line-break>聞きたくなかったのかよ！<line-break>\u3000<line-break>ははぁ、わかったぞ。<line-break>さては俺様の授業が高度すぎて、<line-break>ついてこられなかったんだな。<end>"
english = "You... You went that far to avoid listening to my classes?! Ah, now I get it. My lessons were too advanced for you to keep up, weren't they?<end>"

["2030007"]
japanese = "むしろ逆でしたかね。<line-break>\u3000<line-break>\u3000<line-break>すでに自分の知っている知識を<line-break>授業で繰り返されても<line-break>つまらないだけですよ。<end>"
english = "Quite the opposite, really. There's nothing interesting about sitting through lessons on things I already know.<end>"

["2030008"]
