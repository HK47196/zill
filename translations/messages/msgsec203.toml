["2030010"]
japanese = "でも、ネモの授業はなかなか<line-break>興味深かったですよ。<line-break>だから、たまに起きていたんです。<line-break>他の先生方の授業は退屈すぎて<line-break>ほとんど眠ってましたから。<line-break>\u3000<line-break>それだけでもネモの授業は<line-break>優秀だったと思いますよ。<end>"
english = "Still, Nemo's classes were fairly interesting. That's why I was awake for them now and then. The other teachers' lessons were so dull that I slept through nearly all of them. By that measure alone, I'd say Nemo's classes were excellent.<end>"

["2030011"]
japanese = "…なんか、素直に喜べねえな。<line-break>学問よりも先に、もう少し礼節を<line-break>学ばせるべきだったか…。<end>"
english = "Somehow, I can't quite bring myself to be pleased. Maybe I should've taught you a few more manners before I taught you anything scholarly...<end>"

["2030012"]
japanese = "今頃反省しても遅いと思いますけど。<line-break>\u3000<line-break>\u3000<line-break>さて、ネモがもっと悪い記憶を<line-break>掘り起こさないうちに<line-break>退散するとしましょうか。<end>"
