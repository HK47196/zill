["2030001"]
japanese = "<value:$28>か…。<line-break>俺もヒマだし、せっかくだから<line-break>少し話につきあえよ。<line-break>俺が昔、天界で先生をやっていた頃、<line-break>オルファウスが問題児だったってことは<line-break>以前、話したよな？<end>"
