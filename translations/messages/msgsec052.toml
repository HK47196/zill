["520161"]
japanese = "我はディンガル帝国の<line-break>朱雀将軍アンギルダン！<line-break>この遠征軍の総司令官である！\u3000\u3000\u3000<line-break>ノーブル伯<value:$28>よ。<line-break>お主の名はロストールが滅びようとも<line-break>永遠に語りつがれようぞ。<end>"
english = "I am Angeerdan, Vermilion Bird General of the Dyneskal Empire and supreme commander of this expeditionary force! Count <value:$28> of Noble, even if Rostorl should fall, your name will be spoken of for all eternity!<end>"

["520162"]
japanese = "では、まいる！<line-break>ノーブル伯<value:$28>！<end>"
english = "Now, have at you, Count <value:$28> of Noble!<end>"

["520163"]
japanese = "…ガアアアアッ！<end>"
english = "Graaaargh!<end>"

["520164"]
japanese = "ふぅ…、ふぅ…わ、わしも<line-break>…ここで、死ぬわけにはゆかぬ。\u3000\u3000\u3000<line-break>兵どもの命を背負っておるのでな。<line-break>手強き敵であった…。<line-break>わしの手で、介錯しよう。<line-break>奮戦へのせめてもの手向けじゃ。<end>"
english = "Hah... hah... I-I cannot die here. I bear the lives of my soldiers upon my shoulders. You were a formidable foe... I shall end your suffering with my own hand. Let this be my final tribute to your valor.<end>"

