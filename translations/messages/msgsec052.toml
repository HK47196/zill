["520000"]
japanese = "ファーロス・ボリューム２その２開始<end>"
english = ""

["520001"]
japanese = "おい、放浪者！<line-break>よいところへ来た。来い！\u3000\u3000\u3000<line-break>\u3000<line-break>エリスが緊急召集をかけてきた。<line-break>…どうやら、<line-break>ディンガルが動き出すらしい。<end>"
english = "Hey, wanderer! Good timing. Come here! Eris has called an emergency meeting. It sounds like Dyneskal is making its move.<end>"

["520002"]
japanese = "エリエナイ公レムオン様と<line-break>ノーブル伯<value:$28>様が<line-break>おいでです、総司令閣下。<end>"
english = "Duke Lemghon of Elienai and Count <value:$28> of Noble have arrived, Commander-in-Chief.<end>"

["520003"]
japanese = "…仕方ない、では<line-break>始めるとしよう。<end>"
english = "Very well. Let us begin.<end>"

["520004"]
japanese = "どうやら、近く、<line-break>ディンガルが攻めてくるらしい。<end>"
english = "It appears Dyneskal will attack soon.<end>"

["520005"]
japanese = "根拠は？<end>"
english = "What evidence do we have?<end>"

["520006"]
japanese = "間者の報告。<line-break>兵、兵糧の備蓄。<end>"
english = "Reports from our spies. Troops are being assembled, and provisions stockpiled.<end>"

["520007"]
japanese = "…なるほど。<end>"
english = "I see.<end>"

["520008"]
japanese = "敵将はディンガル帝国南方攻略軍総司令官、<line-break>朱雀将軍アンギルダンだ。<line-break>\u3000<line-break>残念ながら、作戦、進軍路などは不明である。<line-break>だが、敵もこの大国ロストールに挑むからには<line-break>並々ならぬ決意で攻め来ることが予想される。<end>"
english = "The enemy commander is Angeerdan, the Vermilion Bird General and commander-in-chief of the Dyneskal Empire's southern campaign army. Unfortunately, we know nothing of the enemy's plans or route of advance. But in challenging a great power such as Rostorl, the enemy will surely come with extraordinary resolve.<end>"

["520009"]
japanese = "おそらく大軍で押し寄せるであろう<line-break>ディンガル帝国軍に対し、我らロストールも<line-break>全力をもって対抗せねばならない。<end>"
english = "The Dyneskal imperial forces will likely descend upon us in great numbers. Rostorl must meet them with all the strength at our command.<end>"

["520010"]
japanese = "なるほど…、わかりました。<line-break>陛下、迎撃軍の指揮は私めにお任せを。<end>"
english = "Understood. Your Majesty, entrust me with command of the force sent to meet them.<end>"

["520011"]
japanese = "経験のない若造は引っ込んでいるがよい。<line-break>ロストール軍総司令であるわしが指揮をとる。<end>"
english = "An inexperienced whelp should stand aside. I am commander-in-chief of Rostorl's army, and I shall take command.<end>"

["520012"]
japanese = "実戦経験のないのは閣下も同じ。<line-break>ロストールはずっと平和でしたから。\u3000<line-break>\u3000<line-break>先の戦は先王フェロヒア様が<line-break>魔王バロル治めるディンガルに進攻した<line-break>２０年も前になろうという負け戦だ。<end>"
english = "You have no experience in battle either, Commander-in-Chief. Rostorl has long been at peace. Our last war was the failed invasion of Dyneskal, then ruled by Balor, Demon King, led by the late King Ferohia nearly twenty years ago.<end>"

["520013"]
japanese = "あなたはそれに参加なさらなかった。<line-break>だからこそ、先王が亡くなられたほどの<line-break>戦のあとでも生きておられる。<end>"
english = "You did not take part. That is precisely why you survived a war that claimed even the late king.<end>"

["520014"]
japanese = "…エリエナイ公、無礼であろう。<line-break>こ、言葉を慎まれよ。<end>"
english = "Duke of Elienai, that was insolent. M-mind your words.<end>"

["520015"]
japanese = "この作戦の指揮は総司令であるわしがとり、<line-break>我が息子が副司令となる。<end>"
english = "As commander-in-chief, I shall command this operation. My son will serve as deputy commander.<end>"

["520016"]
japanese = "やれやれ、何かと思えば！\u3000\u3000\u3000\u3000\u3000<line-break>まったく、あきれかえる。<line-break>\u3000<line-break>今回の戦はファーロスのドラ息子殿に<line-break>手柄を立てさせるための<line-break>戦だったのですか？<end>"
english = "Good grief, so that is what this is about! How utterly absurd. Is this war merely an opportunity for the spoiled son of Pharos to win himself some glory?<end>"

["520017"]
japanese = "黙れ！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<end>"
english = "Silence!<end>"

["520018"]
japanese = "そういえば、ファーロスの御曹司には<line-break>めったに宮廷に来られぬゆえ、<line-break>まだ一度もお目にかかったことがない。<line-break>おられるなら、教えていただきたい。<line-break>総司令閣下、ご子息は、いったい<line-break>どこにおられるのです？<end>"
english = "Come to think of it, the young heir of Pharos appears at court so rarely that I have never met him. If he is here, perhaps you could point him out. Commander-in-Chief, just where is your son?<end>"

["520019"]
japanese = "…まだ…来ておらぬ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<end>"
english = "He has not... arrived yet.<end>"

["520020"]
japanese = "ロストール王国の大事に<line-break>副司令殿は遅刻か！？\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>フッ、あきれはてて<line-break>ものも言えませんな。<line-break>ノヴィン・ファーロス総司令閣下？<end>"
english = "The deputy commander is late to a council concerning the very fate of the Kingdom of Rostorl? Hmph. I am quite lost for words, Commander-in-Chief Novin Pharos.<end>"

["520021"]
japanese = "総司令閣下、ご令息である副司令閣下<line-break>ゼネテス・ファーロス閣下、お越しです。<end>"
english = "Commander-in-Chief, your son, Deputy Commander Xenetes Pharos, has arrived.<end>"

["520022"]
japanese = "よ。…ヒック。<line-break>皆さんおそろいで。へへ…。<end>"
english = "Hey. Hic. Everyone's here, I see. Heh...<end>"

["520023"]
japanese = "ま、まさか…、<line-break>…泥酔して…おいでなのか？<end>"
english = "S-surely not... Are you completely drunk?<end>"

["520024"]
japanese = "よ。奇遇だな。<line-break><value:$28>。<end>"
english = "Hey. Fancy meeting you here, <value:$28>.<end>"

["520025"]
japanese = "へへ…へへ…。<end>"
english = "Heh... heh...<end>"

["520026"]
japanese = "ロストール王国存亡に関わる会議に<line-break>遅刻するだけではなく<line-break>あまつさえ、泥酔して現れるとは…！<line-break>このあきれはてた所行！<line-break>ファーロス家は王国をないがしろに<line-break>しているのではないかと思われますが？<end>"
english = "Not only do you arrive late to a council upon which Rostorl's very survival depends, you appear blind drunk! Such disgraceful conduct suggests that House Pharos holds the kingdom itself in contempt. Would you not agree?<end>"

["520027"]
japanese = "よ。お初にお目にかかる。<end>"
english = "Hey. Pleased to meet you.<end>"

["520028"]
japanese = "<if><value:$2A><less>50俺はゼネテス・ファーロス、<line-break>ドラ息子だ。<line-break>よろしくな。<line-break>あんたが<value:$28>だな。<line-break>評判は聞いてるぜ。<end>俺はゼネテス・ファーロス<line-break>ドラ息子だ。<line-break>よろしくな。<line-break>あんたが<value:$28>だな。<line-break>評判は聞いてるぜ、<line-break><value:$2B>さん。<end>"
english = "<if><value:$2A><less>50I'm Xenetes Pharos, the spoiled son. Good to meet you. You're <value:$28>, right? I've heard about you.<end>I'm Xenetes Pharos, the spoiled son. Good to meet you. You're <value:$28>, right? I've heard about you, <value:$2B>.<end>"

["520029"]
japanese = "と、とにかく、ロストール王国の危機に<line-break>このていたらくとは！\u3000総司令閣下！<line-break>あまりと言えばあまりではないですか？<end>"
english = "I-in any event, for him to behave this way while the Kingdom of Rostorl is in peril! Commander-in-Chief, surely this goes beyond all bounds?<end>"

["520030"]
japanese = "帰れ、ゼネテス！<line-break>体面が悪い！\u3000帰るのだ。<end>"
english = "Go home, Xenetes! You are disgracing us. Go!<end>"

["520031"]
japanese = "副司令だからって<line-break>無理矢理連れてきておいて…\u3000\u3000\u3000<line-break>\u3000<line-break>来てみれば、いきなり帰れじゃ<line-break>帰れませんよ、父上。<line-break>会議に加えさせてもらいましょう。<end>"
english = "You dragged me here because I'm deputy commander, and now that I've come, you immediately tell me to leave? I can't do that, Father. I'll be joining the council.<end>"

["520032"]
japanese = "フッ、あきれ果てた茶番だ。\u3000\u3000<line-break>私も忙しい身なので、<line-break>本日は退出させていただきたい。<end>"
english = "Hmph. What an appalling farce. I am a busy man, so I believe I shall take my leave for today.<end>"

["520033"]
japanese = "エリエナイ公、そなたには王都守備軍の<line-break>指揮をとってもらわねばならぬ。<line-break>作戦会議には参加していただこう。<end>"
english = "Duke of Elienai, you are to command the capital's defense force. You must remain for the council.<end>"

["520034"]
japanese = "フッ、総司令閣下は<line-break>必勝の策をもって、<line-break>出撃されるのではないのですかな？\u3000\u3000<line-break>閣下が負けるのでなければ<line-break>王都守備など不要なはず。…それとも、<line-break>敗北の公算の方が高いのですかな？<end>"
english = "Hmph. Surely the Commander-in-Chief marches with an infallible plan for victory? If you do not lose, there should be no need to defend the capital. Or do you consider defeat the likelier outcome?<end>"

["520035"]
japanese = "何をバカな！\u3000貴殿の手など借りぬ。<line-break>さっさと帰られるといい、<line-break>エリエナイ公！<end>"
english = "What nonsense! I need no help from you. You may leave at once, Duke of Elienai!<end>"

["520036"]
japanese = "フッ、閣下がそうおっしゃるなら、<line-break>戻るとしましょう。<line-break>\u3000<line-break>さて、ノーブル伯、<line-break>卿はどうなされるのかな？<line-break>愚者の会議から一緒に戻られるか？<end>"
english = "Hmph. If that is the Commander's wish, I shall go. Now then, Count of Noble, what will you do? Will you leave this council of fools with me?<end>"

["520037"]
japanese = "戻る<end>"
english = "Leave<end>"

["520038"]
japanese = "戻らない<end>"
english = "Stay<end>"

["520039"]
japanese = "では、私と<value:$28>は<line-break>これにて退出いたします。<line-break>失礼。<end>"
english = "Then <value:$28> and I shall take our leave. Excuse us.<end>"

["520040"]
japanese = "フッ、国の大事だというのに<line-break>ファーロス家のごり押しには<line-break>まいったものだ。<line-break>まったくの茶番だった。<line-break>それではな。<line-break><value:$28>。<end>"
english = "Hmph. The nation faces a crisis, yet House Pharos still forces its own way. The entire affair was a farce. Farewell, <value:$28>.<end>"

["520041"]
japanese = "…勝手にするがいい！<end>"
english = "Do as you please!<end>"

["520042"]
japanese = "余も疲れた。<line-break>余も退出させてもらおう。<end>"
english = "I too am weary. I shall take my leave.<end>"

["520043"]
japanese = "陛下、お供いたします。<end>"
english = "Your Majesty, I shall accompany you.<end>"

["520044"]
japanese = "王妃がおらねば、らちがあくまい。<line-break>余のような用なしとはわけが違う。<end>"
english = "Nothing will be settled without the queen. Unlike me, you are not superfluous here.<end>"

["520045"]
japanese = "…夫を気遣うのは<line-break>妻の役目でございます。<end>"
english = "It is a wife's duty to care for her husband.<end>"

["520046"]
japanese = "王国の実権を握るような<line-break>お偉い王妃様に気遣ってもらえるとは<line-break>余も大した幸せ者じゃ。<line-break>フフフ…そうではないか？<line-break>余には過ぎたことよ。<line-break>…余にかまうな、エリス。<end>"
english = "What a fortunate man I am, to receive the concern of so exalted a queen―the woman who holds the kingdom's true power. Heh... Would you not agree? It is more than I deserve. Leave me be, Eris.<end>"

["520047"]
japanese = "…陛下。<end>"
english = "Your Majesty...<end>"

["520048"]
japanese = "うぉほん、では作戦の説明をする。<line-break>おい、副官！\u3000説明せよ！<end>"
english = "Ahem. Now for the explanation of our plan. Adjutant! Explain it!<end>"

["520049"]
japanese = "はっ、では説明いたします。\u3000\u3000\u3000<line-break>地図をご覧ください。<line-break>\u3000<end>"
english = "Yes, sir. Allow me to explain. Please look at the map.<end>"

["520050"]
japanese = "帝国軍は大量の兵員と兵糧、物資を<line-break>輸送する必要から、<line-break>海路を利用すると考えられます。<end>"
english = "The imperial army must transport vast numbers of troops, provisions, and supplies. We therefore believe it will travel by sea.<end>"

["520051"]
japanese = "我々は南岸地帯に主軍を駐屯させ、<line-break>敵が上陸に使用可能地点を重点的に警戒し、<line-break>敵を上陸時に急襲、殲滅します。<end>"
english = "We will station our main force along the southern coast and closely watch every viable landing point. We will strike as the enemy comes ashore and annihilate it.<end>"

["520052"]
japanese = "以上です。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>何か質問は？<line-break>\u3000<end>"
english = "That concludes the briefing. Any questions?<end>"

["520053"]
japanese = "帝国軍が内海を縦断するという<line-break>その根拠は？<end>"
english = "What is your basis for assuming the imperial army will cross the Inland Sea?<end>"

["520054"]
japanese = "な、何を言い出すのだ、ゼネテス。<line-break>常識だ！\u3000他に考えられまい！<end>"
english = "W-what are you talking about, Xenetes? It is obvious! There can be no other route!<end>"

["520055"]
japanese = "戦争は常識でするもんじゃない。<line-break>説明を求める。<end>"
english = "You don't wage war on common sense. I want an explanation.<end>"

["520056"]
japanese = "大量の兵士、兵糧、物資を輸送するためには<line-break>海路でなければ、ドワーフの地下王国を<line-break>通る方法しか考えられませんが…<line-break>ドワーフの地下王国は人間の勢力争いには<line-break>まったくの中立を表明しております。<line-break>軍隊が通行することを許しておりません。<end>"
english = "To transport so many soldiers, provisions, and supplies, the only alternative to the sea would be passage through the Dwarven Underground Kingdom. But the Dwarves have declared complete neutrality in human struggles for power. They permit no armies to pass.<end>"

["520057"]
japanese = "そのため、海路しか<line-break>大量の兵士、兵糧、物資を輸送する\u3000\u3000\u3000\u3000<line-break>手段はなく…<end>"
english = "Thus, the sea is the only means of transporting so many soldiers, provisions, and supplies...<end>"

["520058"]
japanese = "…俺が聞きたいのは、<line-break>なんで大軍で攻めてくると<line-break>思ったのか、だ。<end>"
english = "What I'm asking is why you think they're coming with a huge army.<end>"

["520059"]
japanese = "お前は何を言いたいのだ？<line-break>もういい！<line-break>やる気がないなら、口を出すな！<end>"
english = "What are you trying to say? Enough! If you have no intention of helping, keep out of this!<end>"

["520060"]
japanese = "俺がアンギルダンのとっつぁんなら<line-break>こうは動かない。<line-break>\u3000<line-break>ロストールには十分な国力がある。<line-break>上陸しそうなところを見張ってて<line-break>叩くのが可能なのはすぐわかるからな。<end>"
english = "If I were old Angeerdan, I wouldn't do it this way. Rostorl has ample strength. He'll know we can watch the likely landing sites and hit him there.<end>"

["520061"]
japanese = "では、敵はどう出ると？<end>"
english = "Then what do you believe the enemy will do?<end>"

["520062"]
japanese = "それほど大軍でない精兵で<line-break>分断の山脈の上を越える！<end>"
english = "They'll cross the Dividing Mountains with a smaller force of elite troops!<end>"

["520063"]
japanese = "バカな！<line-break>第一、そんなこと、前例がない！<end>"
english = "Absurd! There is no precedent for such a thing!<end>"

["520064"]
japanese = "なら、前例になればいい。<line-break>説明する。<end>"
english = "Then they'll set the precedent. Let me explain.<end>"

["520065"]
japanese = "まずは、これ見よがしに<line-break>兵糧を用意したり、情報を流し、<line-break>俺らを南岸へ出撃させる。<end>"
english = "First, they'll make a show of stockpiling provisions and leak information to lure us down to the southern coast.<end>"

["520066"]
japanese = "帝国軍はそのスキに、<line-break>分断の山脈を越えて、ドワーフの<line-break>大街道沿いの都市を占領してしまう。\u3000<end>"
english = "While we're occupied there, the imperial army will cross the Dividing Mountains and seize the cities along the great Dwarven highway.<end>"

["520067"]
japanese = "そうすれば、王都まで、<line-break>ドワーフが作ったご立派な大街道で<line-break>なんの障害もなく一直線だ。<end>"
english = "From there, that magnificent Dwarven highway gives them a straight, unobstructed road to the capital.<end>"

["520068"]
japanese = "これで、王都ロストールは、<line-break>のどもとに剣を突きつけられたも同然、<line-break>チェックメイトだ。<line-break>さっきそろえた兵員も物資も兵糧も<line-break>そのあとで、ドワーフの地下王国を<line-break>ゆっくりと、通しゃいい。<end>"
english = "That puts a sword to the throat of the capital, Rostorl. Checkmate. Afterward, they can take all those troops, supplies, and provisions they've assembled and move them leisurely through the Dwarven Underground Kingdom.<end>"

["520069"]
japanese = "兵隊が隊列そろえてこそ軍隊だ。<line-break>連中がバラバラに通行するのを<line-break>とめはしないだろうぜ。<line-break>俺たちが一杯食わされたって<line-break>戻ってきたときには、俺たちを迎え撃つ<line-break>準備は万端整ってるって寸法だ。<end>"
english = "Soldiers are only an army when they march in formation. The Dwarves probably won't stop them passing through separately. By the time we realize we've been fooled and make it back, the enemy will be fully prepared to meet us.<end>"

["520070"]
japanese = "俺らが戻ってくる気配がないんなら、<line-break>そのまま、ロストールを落とせばいい。<line-break>王都さえ落ちれば向こう様のもんだ。<line-break>ロストールは貴族制の国だ。<line-break>王を失った貴族たちが分裂して、<line-break>たくさんの小国が乱立することになる。<end>"
english = "If we show no sign of returning, they can simply take Rostorl. Once the capital falls, they've won. Rostorl is an aristocratic state. Without the king, the nobles will split apart and leave the land divided into a host of petty kingdoms.<end>"

["520071"]
japanese = "あとは、それをひとつずつ<line-break>たんねんに各個撃破していけばいい。\u3000<line-break>ま、そういう筋書きだな。<end>"
english = "Then they can carefully destroy those kingdoms one by one. That's how the plan would go.<end>"

["520072"]
japanese = "そんな…、考えられない…！<end>"
english = "That's... unthinkable!<end>"

["520073"]
japanese = "考えられないところを突くから<line-break>一番、効果があるんだよ。<end>"
english = "That's precisely why it would work so well.<end>"

["520074"]
japanese = "しかし、大軍でないにしろ、<line-break>都市をひとつ落とせるだけの軍隊が<line-break>兵糧を持って山脈を越えられるものか！<end>"
english = "Even if it is not a vast army, could a force large enough to capture a city carry its provisions across the mountains?<end>"

["520075"]
japanese = "必要最低限の兵糧だけ持たせて<line-break>危機感をつのらせ、<line-break>兵に全力を出させるんです。<line-break>そのあとは、現地調達、<line-break>もっと洗練された言葉で言えば<line-break>略奪でまかなうことになる…。<end>"
english = "Give the troops only the bare minimum of provisions. The danger will force them to give everything they have. After that, they live off the land―or, to use the more refined term, they pillage.<end>"

["520076"]
japanese = "略奪？<line-break>そんな下劣で非道なことを！<end>"
english = "Pillage? Such depravity! Such inhumanity!<end>"

["520077"]
japanese = "戦争は手段を選びません。<end>"
english = "War does not allow us to pick and choose our methods.<end>"

["520078"]
japanese = "ゼネテス、お前は…、<line-break>なんと恐ろしく、不愉快なことを\u3000\u3000<line-break>言うのだ！<line-break>わしには、お前が言うような<line-break>悪魔のごとき作戦など思いもつかん。<end>"
english = "Xenetes, what a horrifying and repugnant thing to say! I could never conceive of a devilish plan like the one you describe.<end>"

["520079"]
japanese = "敵もそんな下劣なことをするような<line-break>連中とは考えられない。<line-break>当初の作戦で上陸する敵を叩く！<end>"
english = "Nor can I believe the enemy capable of anything so vile. We will proceed with the original plan and strike them as they land!<end>"

["520080"]
japanese = "自分が見たいような世界しか\u3000\u3000\u3000<line-break>見る気がないようだな…。<line-break>やれやれ。<line-break>みすみす、自分が殺されるやり方で<line-break>攻めてくる奴がいるわけがない。<end>"
english = "It seems you'll only see the world the way you want it to be. Good grief. No one is going to attack in a way that plainly gets them killed.<end>"

["520081"]
japanese = "親父は自分の世界観のためなら、<line-break>いくら人が死んでも<line-break>かまわないようだな。<end>"
english = "Seems Father doesn't care how many people die, so long as his view of the world stays intact.<end>"

["520082"]
japanese = "助けてくれてありがとよ。<line-break><value:$28>…。<line-break>\u3000<line-break>…さて、このまま、<line-break>親父の策で行くことになると<line-break>兵や民がかなり死ぬことになる。<end>"
english = "Thanks for backing me up, <value:$28>. Now, if we go ahead with Father's plan, a great many soldiers and civilians are going to die.<end>"

["520083"]
japanese = "それだけは避けなきゃならん。<line-break>面倒だが、なんか別の策を\u3000\u3000\u3000\u3000<line-break>練っておかなきゃな。<end>"
english = "We have to prevent that. Troublesome as it is, I'll have to come up with another plan.<end>"

["520084"]
japanese = "ま、お前さんが<line-break>味方にいてくれたってのが\u3000\u3000<line-break>せめてもの救いだな。<line-break><value:$28>、<line-break>戦の時には、俺の陣に来てくれ。<line-break>考えがある。<end>"
english = "At least I've got you on my side. That's some comfort. <value:$28>, come to my camp when the war begins. I have an idea.<end>"

["520085"]
japanese = "ロストールの総司令ノヴィン・ファーロスは、\u3000<line-break>ディンガル軍が海路を進軍すると予測し、<line-break>これを迎え撃つべく軍を進めた。<end>"
english = "Novin Pharos, commander-in-chief of Rostorl, predicted that the Dyneskal Army would advance by sea and marched out to intercept it.<end>"

["520086"]
japanese = "しかし、ディンガルの将アンギルダンは<line-break>海路を進軍する方法を採らず、<line-break>精兵を率いて、分断の山脈を越える道を選んだ。<end>"
english = "But Angeerdan, the Dyneskal commander, rejected the sea route. Leading a force of elite troops, he chose instead to cross the Dividing Mountains.<end>"

["520087"]
japanese = "分断の山脈を越えて、<line-break>大陸の別の側を攻める戦法は、<line-break>いまだかつてない壮挙であった。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><line-break>アンギルダンは、電撃的に<line-break>大街道沿いの都市を攻撃、次々と占領。<line-break>王都ロストール攻略に王手をかけた。<end>"
english = "Crossing the Dividing Mountains to attack the far side of the continent was an unprecedented feat. Angeerdan launched a lightning offensive against the cities along the great highway, capturing them one after another. The Rostorl Campaign was now one move from victory.<end>"

["520088"]
japanese = "対して、ノヴィン率いるロストール軍は\u3000\u3000\u3000\u3000<line-break>大街道のアンギルダンを迎え撃つべく<line-break>その大軍を急行させた。<end>"
english = "In response, the vast Rostorl army under Novin hurried to intercept Angeerdan on the great highway.<end>"

["520089"]
japanese = "よ。<line-break>お待たせ。<end>"
english = "Hey. Sorry to keep you waiting.<end>"

["520090"]
japanese = "ああ、俺が貴族の息子だとは\u3000\u3000\u3000\u3000\u3000<line-break>お前さんには<line-break>言ってなかったかもな。<line-break>だが、お前さん、<line-break>俺が貴族の…ファーロス家の跡取りだと<line-break>知ったら、態度を変えたのか？<end>"
english = "Maybe I never told you I was a nobleman's son. But if you'd known I was a noble―and heir to House Pharos―would you have treated me any differently?<end>"

["520091"]
japanese = "違うだろう？<line-break>俺は、少なくともそう信じてたんでな。<line-break>それなら言わなくてもいいだろ？<end>"
english = "You wouldn't have, would you? At least, that's what I believed. So there was no need to tell you.<end>"

["520092"]
japanese = "しかし、親父にも困ったもんだ。\u3000\u3000\u3000<line-break>今から軍を急がせても<line-break>間に合わないって。<line-break>急ぐもんだから隊列がバラバラだ。<line-break>アンギルダンのエジキになりに<line-break>行くようなもんだな、こりゃ。<end>"
english = "Father really is hopeless. Even if he forces the army onward now, it won't arrive in time. The rush has already broken the formation apart. At this rate, we're marching straight into Angeerdan's jaws.<end>"

["520093"]
japanese = "さっき、親父にはそう言ってきたさ。<line-break>そうしたら、不吉なことは言うなって\u3000<line-break>殴られたよ。<line-break>現状の方がよっぽど不吉なんだがな。\u3000<line-break>困ったもんだ。<end>"
english = "I told Father as much a moment ago. He hit me and said not to speak of ill omens. The situation itself is a far worse omen, if you ask me. He's hopeless.<end>"

["520094"]
japanese = "ここは動かずに、<line-break>レムオンの王都守備軍と連携して、<line-break>挟み撃ちの構えで敵を牽制すべきだ…<line-break>そう言って、火に油だ。<line-break>親父は、レムオンがよほど嫌いらしい。<end>"
english = "I told him we should hold our position, coordinate with Lemghon's capital defense force, and keep the enemy in check with the threat of a pincer attack. That only made him angrier. Father must truly hate Lemghon.<end>"

["520095"]
japanese = "ロストール貴族の名誉にかけて<line-break>敵の侵入を、黙っ見ているわけには<line-break>いかないってさ。<line-break>巻き込まれる兵にとっちゃいい迷惑だ。<line-break>とにかく説得は続けよう。<line-break>…兵の命がかかってる。<end>"
english = "He says the honor of Rostorl's nobility won't allow him to stand by while the enemy invades. The soldiers dragged into it are the ones who'll suffer. I'll keep trying to persuade him. Their lives depend on it.<end>"

["520096"]
japanese = "しかし、ゼネテスの説得は聞き入れられず、<line-break>隊列が乱れたまま到着したロストール軍は\u3000<line-break>アンギルダンの攻撃を受け、壊滅した。<line-break><line-break>総司令ノヴィン・ファーロスをはじめ<line-break>ロストールの名だたる貴族が、<line-break>この戦いの中で命を落とした。<end>"
english = "But Xenetes's pleas went unheeded. The Rostorl army arrived with its formation still in disarray, and Angeerdan's attack annihilated it. Commander-in-Chief Novin Pharos and many of Rostorl's most renowned nobles lost their lives in the battle.<end>"

["520097"]
japanese = "ルブルグ伯タルテュバ・リューガは<line-break>自分の軍を捨て、ひとりだけ極秘に逃走。\u3000\u3000<line-break>命は助かったが、その評判は地に落ちた。<end>"
english = "Count Tarteuba Ryuga of Ruburg abandoned his army and secretly fled alone. He survived, but his reputation was ruined.<end>"

["520098"]
japanese = "ディンガル帝国軍アンギルダンは、<line-break>ロストール軍を壊滅させると、深追いを禁じ、<line-break>全軍に物資の現地調達を命じた。<end>"
english = "After annihilating the Rostorl army, Angeerdan forbade pursuit and ordered the entire Dyneskal imperial army to procure supplies locally.<end>"

["520099"]
japanese = "…と、総司令閣下は自刃なされ、<line-break>ロストール貴族にふさわしい<line-break>見事な最期を遂げられました。<end>"
english = "And so the Commander-in-Chief took his own life, meeting a splendid end worthy of a Rostorl noble.<end>"

["520100"]
japanese = "やれやれ、これだけの人数を<line-break>こんな状況に落とし込んでおいて、<line-break>ご自分は貴族の誇りと心中、か。<end>"
english = "Good grief. After landing all these people in this mess, he chose to die with his noble pride.<end>"

["520101"]
japanese = "かくなる上は、ゼネテス様にも<line-break>誇りを汚さず、潔く自刃なさるようにと<line-break>閣下はおっしゃっておいででした。<end>"
english = "The Commander also said that, matters having come to this, Lord Xenetes should preserve his honor and take his own life with dignity.<end>"

["520102"]
japanese = "そんなロマンチズムに<line-break>つきあう気はないな。<end>"
english = "I've no intention of indulging that sort of romanticism.<end>"

["520103"]
japanese = "閣下はこうもおっしゃっておいででした。<line-break>ゼネテス様には、やや貴族としての<line-break>常識にかけるところがある。<line-break>命を惜しみ、おめおめと生き残ろうと<line-break>するならば、ゼネテス様の介錯を<line-break>してさしあげるようにと…！<end>"
english = "The Commander said something else as well. Lord Xenetes is somewhat lacking in the common sense expected of a nobleman. If you should cling to life and shamelessly try to survive, I was to act as your second and see to your death myself!<end>"

["520104"]
japanese = "さ～て、と。<line-break>生き残る方法を考えなきゃ、だな。\u3000\u3000<line-break>\u3000<line-break>アンギルダンのとっつぁんは<line-break>俺らの殲滅よりも、<line-break>物資調達の方を優先させた。<end>"
english = "Well then. Time to work out how to survive. Old Angeerdan has placed securing supplies ahead of finishing us off.<end>"

["520105"]
japanese = "アンギルダンのとっつぁんは正しい。<line-break>レムオンの王都守備軍が<line-break>攻めてくる可能性を考えるなら…<line-break>戦意をなくし、無力化した<line-break>俺らを無視して、自分たちの防備を<line-break>固める準備を急ぐのは、理の当然だ。<end>"
english = "Old Angeerdan's reasoning is sound. With the possibility that Lemghon's capital defense force may attack, it makes perfect sense to ignore us as a demoralized, neutralized force and hurry to strengthen his own defenses.<end>"

["520106"]
japanese = "だが、それが今回は間違いでな。<line-break>俺たちはまだ、<line-break>戦意はなくしちゃいなかったりする。\u3000<end>"
english = "But this time, that happens to be a mistake. We haven't quite lost our will to fight yet.<end>"

["520107"]
japanese = "俺はあきらめの悪い男でな。\u3000\u3000\u3000<line-break>生き残るためのガッツなら<line-break>売るほどある。<line-break>今なら向こうさんも攻めてくるとは<line-break>思ってない。徴発隊も出払っていて<line-break>敵中枢部に直でなぐり込む好機だ！<end>"
english = "I'm a stubborn man. When it comes to the will to survive, I've got plenty to spare. They won't expect us to attack now, and their requisitioning parties are all away. It's the perfect chance to strike straight at their command!<end>"

["520108"]
japanese = "無傷な俺の部隊を中心に<line-break>ロストール軍の敗残兵をまとめ、<line-break>敵ディンガル軍中枢を叩く！\u3000\u3000\u3000\u3000\u3000<line-break>アンギルダンのとっつぁんを倒せば<line-break>残りのディンガル軍は浮き足だって<line-break>無力化する！\u3000ねらうは朱雀将軍のみ！<end>"
english = "We'll rally the remnants of Rostorl's army around my unscathed unit and strike the heart of the Dyneskal Army! Once old Angeerdan falls, the remaining Dyneskal forces will lose their nerve and cease to be a threat. The Vermilion Bird General is our sole target!<end>"

["520109"]
japanese = "お前は、俺が軍をまとめる間に、<line-break>先鋒を率い、先に帝国軍に突っ込んで、<line-break>大暴れしてくれ。<line-break>お前の活躍を聞けば、<line-break>敗残兵の集まりもよくなる。<line-break>危険な任務だが、お前しか頼れん。<end>"
english = "While I rally the army, take the vanguard and charge into the imperial forces ahead of us. Give them hell. Word of your exploits will draw more survivors to our banner. It's dangerous, but you're the only one I can trust with it.<end>"

["520110"]
japanese = "５分でいい。<line-break>頼むぜ、<value:$28>。<end>"
english = "Just give me five minutes. I'm counting on you, <value:$28>.<end>"

["520111"]
japanese = "バカな！\u3000ロストール軍だと！<end>"
english = "Impossible! The Rostorl army?<end>"

["520112"]
japanese = "徴発のため、ほとんど<line-break>軍が出払っているときに！<end>"
english = "Now, when nearly all our forces are out requisitioning supplies!<end>"

["520113"]
japanese = "奇襲だ！<line-break>とにかく、もみつぶせ！<end>"
english = "It's a surprise attack! Crush them at once!<end>"

["520114"]
japanese = "くっ、どうしたことだ！<line-break>ロストール軍が復活したとは！<end>"
english = "Damn! How can this be? The Rostorl army has rallied!<end>"

["520115"]
japanese = "ゼネテス…、<line-break>そうか、お主がおったのか！\u3000\u3000\u3000<line-break>\u3000<line-break>お主ならば、あの敗軍を<line-break>まとめる器量がある！<line-break>くっ、ぬかったわ！<end>"
english = "Xenetes... Of course, you were there! You have the skill to rally that defeated army. Damn it, I miscalculated!<end>"

["520116"]
japanese = "お主がおるとわかっておれば、<line-break>敗残兵の殲滅を優先させたものを！<line-break>\u3000<end>"
english = "Had I known you were there, I would have made annihilating the survivors my first priority!<end>"

["520117"]
japanese = "…とっつぁん、<line-break>悪いが、命をもらう。\u3000\u3000<line-break>\u3000<line-break>…ロストールの兵の<line-break>命がかかっているんでな。<end>"
english = "Sorry, old man, but I'm taking your life. The lives of Rostorl's soldiers depend on it.<end>"

["520118"]
japanese = "はい、そうですかと<line-break>くれてやるわけにはいかんな。<line-break>\u3000<line-break>こっちも<line-break>ディンガルの兵の命が<line-break>かかっておるのでな！<end>"
english = "I cannot simply hand it over because you ask. The lives of Dyneskal's soldiers depend on me as well!<end>"

["520119"]
japanese = "フフ……、<line-break>運命の女神は残酷なものよ！\u3000\u3000\u3000<line-break>ここまで来て、わしを見限るとはな…。<line-break>ゼネテスよ…。<line-break>お主ほどの男が…ファーロスの…<line-break>跡取りだったとは…、うぐっ…。<end>"
english = "Heh... The Goddess of Fate is cruel indeed! To forsake me after I have come so far... Xenetes... To think a man such as you was heir to Pharos... Guh...<end>"

["520120"]
japanese = "退け！<line-break>バラバラに地下王国を通るのだ！<line-break>みな…生き延びるの…じゃ…！<end>"
english = "Retreat! Pass through the Underground Kingdom separately! All of you... survive...!<end>"

["520121"]
japanese = "朱雀将軍が討ち取られたぞ！<end>"
english = "The Vermilion Bird General has been slain!<end>"

["520122"]
japanese = "退け！\u3000退けええい！<end>"
english = "Retreat! Retreeeat!<end>"

["520123"]
japanese = "敗残兵を驚くべき早さで立て直した<line-break>ゼネテスの奇襲により、アンギルダンが<line-break>討ち取られると、帝国軍は潰走した。<end>"
english = "Xenetes rallied the defeated troops with astonishing speed and launched a surprise attack. When Angeerdan was slain, the imperial army broke and fled.<end>"

["520124"]
japanese = "この戦いで、ゼネテスの声望は<line-break>一気に上がり、奇跡の名将と呼ばれたが、<line-break>ロストールの被害も甚大なものがあった。<end>"
english = "The battle made Xenetes's reputation soar, and he became known as a miraculous general. Yet Rostorl, too, had suffered grievous losses.<end>"

["520125"]
japanese = "…千年樹に刻まれし竜綱の盟約に基づき<line-break>我、ロストール王<line-break>セルモノー・リューは…<line-break>汝、ゼネテス・ファーロスを<line-break>ファーロス家当主と認め、その功により<line-break>ロストール王国軍総司令に任ずる。<end>"
english = "By the Covenant of the Dragon's Bond, graven upon the Thousand-Year Tree, I, Selmono Ryu, King of Rostorl, hereby recognize you, Xenetes Pharos, as head of House Pharos and, in honor of your service, appoint you commander-in-chief of the army of the Kingdom of Rostorl.<end>"

["520126"]
japanese = "最高の殊勲こそ<line-break>ファーロスのドラ息子に奪われたが、<line-break>第二の殊勲には、お前が認められた。<line-break>ファーロスの次というのが気に入らんが<line-break>よくぞ、リューガ家の面目を<line-break>施してくれた。俺もうれしい。<end>"
english = "The highest distinction may have gone to that spoiled son of Pharos, but you were recognized for the second-highest. I dislike seeing you placed behind a Pharos, but you have done well to restore the good name of House Ryuga. That pleases me too.<end>"

["520127"]
japanese = "タルテュバのバカが、臆病風に吹かれ、<line-break>兵を捨てて、自分だけこっそり逃げて…<line-break>\u3000<end>"
english = "That fool Tarteuba lost his nerve, abandoned his soldiers, and slipped away alone...<end>"

["520128"]
japanese = "自分の顔とリューガ家にたっぷりと\u3000\u3000<line-break>泥を塗ってくれたのでな。<line-break>お前は見事に名誉を挽回してくれた。<line-break>俺はそれを喜んでいるのだ。<line-break>お前の成功を喜んでいるわけではない。<line-break>…カン違いはするな。<end>"
english = "He thoroughly disgraced himself and House Ryuga. You have splendidly restored our honor, and that is what pleases me. It is not your success itself that I celebrate. Do not misunderstand.<end>"

["520129"]
japanese = "ノーブル伯、<line-break><value:$28>・リューガ。<end>"
english = "Count <value:$28> Ryuga of Noble.<end>"

["520130"]
japanese = "ほら、行け。<end>"
english = "Go on, then.<end>"

["520131"]
japanese = "やれやれ、肩が凝った。<line-break>大げさな式典だったな。<line-break>\u3000<line-break>お互い、これから<line-break>めんどくさいことになるな。<line-break>それじゃあな。<end>"
english = "Good grief, my shoulders are killing me. What an overblown ceremony. Looks like things are going to be a nuisance for both of us from now on. See you around.<end>"

["520132"]
japanese = "<value:$28>の<line-break>名声値が上がった。<end>"
english = "<value:$28>'s Fame increased.<end>"

["520133"]
japanese = "総司令閣下、<line-break>ノーブル伯<value:$28>様が<line-break>おいでです。<end>"
english = "Commander-in-Chief, Count <value:$28> of Noble has arrived.<end>"

["520134"]
japanese = "<if><value:$29><equal>%0レムオンの弟か…。<end>レムオンの妹か…。<end>"
english = "<if><value:$29><equal>%0Lemghon's brother...<end>Lemghon's sister...<end>"

["520135"]
japanese = "では、作戦会議を始める。<end>"
english = "Let us begin the council of war.<end>"

["520136"]
japanese = "ディンガル軍は我々の予想に違い<line-break>内海を縦断する進軍路をとらず、<line-break>分断の山脈越えで王国領に進入した。<end>"
english = "Contrary to our expectations, the Dyneskal Army did not cross the Inland Sea. It entered the kingdom by crossing the Dividing Mountains.<end>"

["520137"]
japanese = "ゼネテス殿の予想通りだ。<end>"
english = "Just as Lord Xenetes predicted.<end>"

["520138"]
japanese = "総司令閣下、<line-break>ご子息のゼネテス殿は？<end>"
english = "Commander-in-Chief, where is your son, Lord Xenetes?<end>"

["520139"]
japanese = "あまり聞き分けがないのでな。\u3000\u3000\u3000<line-break>後方に配置した。<line-break>\u3000<line-break>帝国の進入に対し、<line-break>動くべきではないなどと、<line-break>愚にもつかないことばかり言うのだ。<end>"
english = "He refused to listen, so I stationed him in the rear. He kept spouting nonsense about how we should not move against the imperial incursion.<end>"

["520140"]
japanese = "ヒャーヒャッヒャッ！<line-break>とんだ、腰抜けだな。<line-break>ファーロスのドラ息子は。\u3000<line-break>後方に置いておいた方がいい。<line-break>危険も少ないからな。<line-break>まったくのクズの臆病者だ。<end>"
english = "Hya-hya-hya! What a coward that spoiled son of Pharos is! Best leave him in the rear, where there is less danger. A worthless, craven wretch!<end>"

["520141"]
japanese = "…コホン。とにかくだ。<line-break>敵が都市を占領し、地歩を固めないうちに<line-break>早急に敵をうち破る必要がある。<line-break>そのために、我々は軍を急行させ、<line-break>敵に対し、奇襲をかける所存である。\u3000\u3000<line-break>何か質問は？<end>"
english = "Ahem. In any event, we must defeat the enemy quickly, before they can occupy the cities and consolidate their position. We therefore intend to force-march our army and launch a surprise attack. Any questions?<end>"

["520142"]
japanese = "敵はこちらが来るのを予測しているのでは？<end>"
english = "Could the enemy be expecting us?<end>"

["520143"]
japanese = "軍を急行させては、隊列が乱れるのでは？<end>"
english = "Will a forced march not throw our formation into disarray?<end>"

["520144"]
japanese = "何もない<end>"
english = "No questions<end>"

["520145"]
japanese = "だからこそ、急ぐのだ。<line-break>敵がこちらを待ちかまえる用意を<line-break>する前に、敵を叩かねばならない！<end>"
english = "That is precisely why we must hurry. We must strike before the enemy can prepare to meet us!<end>"

["520146"]
japanese = "ノーブル伯、<line-break>では、どうしろというのだ、<line-break>侵略者が攻めてきているのに。<line-break>放っておくつもりか？<line-break>そのようなことができるのか？<line-break>それでもロストール貴族か？<end>"
english = "Then what would you have us do, Count of Noble? Invaders are advancing upon us. Do you propose that we ignore them? Could you truly do such a thing? Are you not a noble of Rostorl?<end>"

["520147"]
japanese = "そうか。<end>"
english = "Very well.<end>"

["520148"]
japanese = "では、会議は以上だ<line-break>各人の奮戦を望む。<end>"
english = "That concludes the council. I expect every one of you to fight valiantly.<end>"

["520149"]
japanese = "ロストール軍総司令ノヴィン・ファーロスは\u3000\u3000<line-break>ディンガル帝国軍の海路による進攻を<line-break>予測し、上陸地点で攻撃すべく軍を進めた。<end>"
english = "Novin Pharos, commander-in-chief of the Rostorl army, predicted that the Dyneskal imperial forces would advance by sea. He moved his army to attack at their landing point.<end>"

["520150"]
japanese = "しかし、ディンガルの将アンギルダンが選んだ\u3000<line-break>道は海路ではなく、分断の山脈を越えるという<line-break>歴史上、誰も取らなかった進軍路であった。<end>"
english = "But Angeerdan, the Dyneskal commander, did not choose the sea route. Instead, he took a route unprecedented in history, crossing the Dividing Mountains.<end>"

["520151"]
japanese = "アンギルダン率いるディンガル軍は\u3000\u3000\u3000\u3000\u3000\u3000<line-break>大街道沿いの都市を電撃的に占領。<line-break>王都ロストール攻略に王手をかけた。<end>"
english = "The Dyneskal Army under Angeerdan captured the cities along the great highway in a lightning offensive. The Rostorl Campaign was now one move from victory.<end>"

["520152"]
japanese = "対して、ノヴィン率いるロストール軍は<line-break>これを迎撃すべく、軍を戻した。<line-break>しかし、これはアンギルダンに予測されていた。<line-break><line-break>急行したため隊列もバラバラなロストール軍は<line-break>待ち受けていたディンガル軍によって<line-break>完膚無きまでに叩きのめされ、壊乱した。<end>"
english = "The Rostorl army under Novin turned back to intercept the invaders, but Angeerdan had anticipated this. Forced to hurry, the Rostorl army arrived with its formation in tatters. The waiting Dyneskal Army crushed it utterly and sent it into rout.<end>"

["520153"]
japanese = "総司令ノヴィン・ファーロスをはじめ\u3000\u3000\u3000\u3000\u3000<line-break>ロストールの貴族が多く、乱戦の中で<line-break>命を落とした。<end>"
english = "Commander-in-Chief Novin Pharos and many other Rostorl nobles lost their lives in the chaos of battle.<end>"

["520154"]
japanese = "の、ノーブル伯、お逃げください！<line-break>ぐわっ！<end>"
english = "C-Count of Noble, run! Gah!<end>"

["520155"]
japanese = "ノーブル伯！\u3000ぐわっ！<line-break>た、助けてください！\u3000ぐわー！<end>"
english = "Count of Noble! Gah! P-please, help me! Aagh!<end>"

["520156"]
japanese = "やんごとなき貴族とお見受けする。<line-break>天命は我らが皇帝ネメア様にあり！<line-break>お命頂戴！<end>"
english = "You appear to be a noble of exalted birth. Heaven's mandate rests with our Emperor Nemea! Your life is mine!<end>"

["520157"]
