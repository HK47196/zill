["1220000"]
japanese = "（ディンガル帝国の朱雀将軍になった<line-break>\u3000アンギルダンから、自分の副将に<line-break>\u3000なるようにとの手紙をもらった）<line-break>（アンギルダンの頼みを聞いて、<line-break>\u3000副将になるためにエンシャントの城へ<line-break>\u3000行こうか、それとも断りに…）<end>"
english = "(Angeerdan, now the Vermilion Bird General of the Dingal Empire, sent a letter asking me to become his deputy.) (Should I accept Angeerdan's request and go to the castle in Ancient to become his deputy, or go there to decline...?)<end>"

["1220001"]
japanese = "朱雀将軍から自分の副将になるよう<line-break>誘われたって本当なの！？<line-break>それってすごいことよ。<line-break>うらやましいな…。<line-break>もちろん誘いを受けるんでしょ。<line-break>こんなチャンスは二度とないわよ。<end>"
english = "Is it true the Vermilion Bird General asked you to become his deputy!? That's incredible. I'm so jealous... Of course you're going to accept. You'll never get another chance like this.<end>"

["1220002"]
japanese = "………………。<end>"
english = "...............<end>"

["1220003"]
japanese = "冒険者から朱雀軍の副将になるなんて<line-break>かなりの強運の持ち主かも。<line-break>この若さで副将に出世ということは…<line-break>数年後にはディンガル皇帝とか…。<line-break>これは玉のこしねらいでアタックする<line-break>しかないかも…。<end>"
english = "Going from adventurer to deputy commander of the Vermilion Bird Army... You must be incredibly lucky. If you've risen to deputy commander at such a young age, then in a few years you might be Emperor of Dingal... Maybe I should make a move and marry into power...<end>"

["1220004"]
japanese = "アンギルダンがレターをくレター？<line-break>なんで俺じゃなくてお前に来るんだよ！<line-break>どう考えても俺の方が強いのによ。<line-break>ところで、アンギルダンって誰だ？<line-break>何！\u3000騎士だってぇ！<line-break>急いでエンシャントに行かナイト！<end>"
english = "Angeerdan sent you a letter? Why'd it come to you instead of me!? I'm obviously stronger than you. By the way, who's Angeerdan? What!? He's a knight? Then we'd better not wait all night―hurry to Ancient!<end>"

["1220005"]
japanese = "アンギルダン？<line-break>もしかして真紅のプレートアーマーを<line-break>身につけたお爺さんのこと？<line-break>へ～、あの人ってすごい人だったのね。<line-break>実はボク、リベルダムの酒場で<line-break>ごちそうになったことがあるんだ。<end>"
english = "Angeerdan? You mean the old man in crimson plate armor? Huh, so he was someone important. He actually treated me to a meal at the tavern in Liberdam once.<end>"

["1220006"]
japanese = "アンギルダンがあなたを副将に招く？<line-break>…それは良かったわね。せいぜい<line-break>戦死しないように気をつけるといいわ。<end>"
english = "Angeerdan invited you to be his deputy? ...How nice for you. Do try not to get killed in battle.<end>"

["1220007"]
japanese = "帝国軍朱雀将軍の副将に、あなたが？<line-break>それはすごい出世ですねえ。<line-break>…え、受けるかどうか迷ってる？<line-break>存分、考え、悩むといいでしょう。<line-break>それだけの価値があることです。<end>"
english = "You, deputy to the imperial army's Vermilion Bird General? That is quite a promotion. ...What? You're unsure whether to accept? Take all the time you need to think and agonize over it. A decision like this deserves no less.<end>"

["1220008"]
japanese = "アンギのおっさんに認められるなんて、<line-break>やるじゃん、<value:$28>。<line-break><line-break>帝国軍に入ったら、このカルラさんも<line-break>色々教えてあげるよ～。<line-break>手取り足取り、なんてね。<end>"
english = "Not bad, <value:$28>. You even earned old Angie's approval. If you join the imperial army, Karula can teach you all sorts of things. Hand over hand, every step of the way... Just kidding.<end>"

["1220009"]
japanese = "姉ちゃん、アンギルダンの手紙には<line-break>なんて書いてあったのか教えてくれよ。<line-break>えっ、見せてくれるって。どれどれ…<line-break>…すごいよ姉ちゃん！<line-break>アンギルダンに副将を頼まれるなんて。<line-break>もちろんエンシャントへ行くんだよな。<end>"
english = "Sis, tell me what Angeerdan's Letter said. What, you'll let me see it? Let's have a look... Wow, Sis! Angeerdan asked you to be his deputy! You're going to Ancient, right?<end>"

["1220010"]
japanese = "一介の冒険者から副将を選ぶとは。<line-break>アンギルダンも思い切ったことを。<line-break>さすがは歴戦の老将ということかしら。<end>"
english = "Choosing a mere adventurer as his deputy... That was a bold decision, even for Angeerdan. I suppose that is what one should expect from a veteran general.<end>"

["1220011"]
japanese = "アンギルダンのとっつぁんも人を<line-break>見る目があるねー。俺も同じ立場なら<line-break>お前さんを副将にするだろうな。<line-break>どうする？\u3000エンシャントへ行くかい。<line-break>俺に遠慮する必要はこれっぽっちも<line-break>ないぜ。自分の思うようにするといい。<end>"
english = "Old Angeerdan has a good eye for people. If I were in his position, I'd make you my deputy too. So, what will you do? Go to Ancient? Don't hold back on my account―not even a little. Do whatever you think is right.<end>"

["1220012"]
japanese = "アンギルダンが自分の副将に<line-break>お前を選んだのか…。<line-break>大胆な男だな。<line-break>どうする？\u3000誘いを受けるなら<line-break>迷わずエンシャントへ向かえ。<end>"
english = "Angeerdan chose you as his deputy...? He's a bold man. What will you do? If you're accepting his offer, head straight for Ancient.<end>"

["1220013"]
japanese = "なんと！\u3000アンギルダン殿がお主を<line-break>自分の副将として取り立ててくれると<line-break>言うのか。それはすごいことじゃな。<line-break>それで、お主はどうするつもりじゃ。<line-break>アンギルダン殿はお主が来るのを<line-break>今や遅しと待っておるのじゃぞ。<end>"
english = "What! Lord Angeerdan means to elevate you to the position of his deputy? That is remarkable indeed. So, what do you intend to do? Lord Angeerdan is waiting impatiently for you to arrive.<end>"

["1220014"]
japanese = "アンギルダンさんは、自分の副将に<line-break>なるよう誘ってくれたんでしょ。<line-break><value:$28>どうするの？<line-break>アンギルダンさんは、エンシャントで<line-break><value:$28>のことを待っている<line-break>と思うよ。<end>"
english = "Angeerdan asked you to become his deputy, right? What will you do, <value:$28>? I think Angeerdan is waiting for <value:$28> in Ancient.<end>"

["1220015"]
japanese = "………………。<end>"
english = "...............<end>"

["1220016"]
japanese = "ふーん、あんた戦争に行くつもりなの。<line-break>アンギルダンの副将になるっていうのは<line-break>そういうことなんでしょ。<line-break>アタクシは遠慮させてもらうわ。<line-break>高貴で優雅なエルフのアタクシは人間の<line-break>醜い争いになど巻き込まれたくないの。<end>"
english = "Oh? So you're planning to go to war. That's what becoming Angeerdan's deputy means, isn't it? Count me out. I am a noble and elegant Elf, and I have no desire to be dragged into the ugly conflicts of humans.<end>"

["1220017"]
japanese = "アンギルダン殿は騎士ですぞ。<line-break>兄弟子、ぐずぐすしていてはダメです。<line-break>急いでエンシャントへ行かナイト！<line-break>………………。<line-break>使い古されたネタで申し訳ありませぬ。<end>"
english = "Lord Angeerdan is a knight, Senior Disciple. This is no time to dawdle. Hurry to Ancient―don't wait all knight! ............... Forgive me for resorting to such a tired joke.<end>"

["1220018"]
japanese = "アンギルダンのお爺ちゃんは<line-break>ディンガル帝国の朱雀将軍に<line-break>なったんだよねぇ。<line-break>ルルアンタ、副将には興味ないけど<line-break>アンギルダンのお爺ちゃんに<line-break>会いたくなってきちゃった。<end>"
english = "Grandpa Angeerdan became the Dingal Empire's Vermilion Bird General, right? Lulluantha isn't interested in being a deputy, but now I want to see Grandpa Angeerdan.<end>"

["1220019"]
japanese = "………………。<line-break><line-break><line-break>アンギルダンの願いを聞いてやれ。<end>"
english = "............... Grant Angeerdan's request.<end>"

["1220020"]
japanese = "お前がアンギルダン、つまり、<line-break>ディンガル帝国朱雀将軍の副将に？<line-break>関係ない。誰であろうと、な。<end>"
english = "You? Deputy to Angeerdan―the Dingal Empire's Vermilion Bird General? It makes no difference. No matter who you are.<end>"

["1220021"]
japanese = "アンギルダンの副将ってことは<line-break>ディンガル帝国朱雀将軍の副将だよね。<line-break>冒険者から副将なんて大出世だよ。<line-break>だんだん英雄伝説っぽくなってきた！<line-break>これはもう、その話にのるしかないね。<line-break>すぐにエンシャントの城へ行かないと！<end>"
english = "Being Angeerdan's deputy means being deputy to the Dingal Empire's Vermilion Bird General, right? Going from adventurer to deputy commander is an enormous promotion. This is starting to feel like a heroic legend! You simply have to accept. Hurry to the castle in Ancient!<end>"

["1220022"]
japanese = "朱雀将軍が君を副将に選んだか。<line-break>君の素質を見抜くとは、<line-break>さすがアンギルダンは目ざといな。<end>"
english = "So the Vermilion Bird General chose you as his deputy. Angeerdan was sharp enough to recognize your potential. Impressive.<end>"

["1220023"]
japanese = "おめでたく思います。…が、<line-break>そのようなことを誰彼かまわず<line-break>触れ回って、危険はないのですか？<end>"
english = "I am happy for you. However... is it safe to go around telling everyone about such a thing?<end>"

["1220024"]
japanese = "ガッカリだよ、<value:$28>。<line-break>それを受けちゃったら、<line-break>私たち、敵同士になるんだよ！？<end>"
english = "I'm disappointed, <value:$28>. If you accept, we'll become enemies!<end>"

["1220025"]
japanese = "そうか、ディンガルに仕官するのか…。<line-break>ならば、覚えておいてくれ、<line-break><value:$28>。<line-break>統治と占領、この２つが、必ずしも<line-break>同じ意味ではないということをな…。<end>"
english = "I see. So you will enter Dingal's service... Then remember this, <value:$28>: governing and occupying do not necessarily mean the same thing.<end>"

["1220026"]
japanese = "<value:$28>が、朱雀将軍の<line-break>副将に大抜擢されるとは…。<line-break><line-break>祝ってやりたいが、今一度よく<line-break>考えて決断するといい。その出世は、<line-break>戦場に通じているのだからな。<end>"
english = "To think <value:$28> would be chosen for the great honor of serving as the Vermilion Bird General's deputy... I want to congratulate you, but think it over once more before deciding. That promotion leads directly to the battlefield.<end>"

["1220027"]
japanese = "あのアンギルダンから<line-break>副将になってくれと頼まれるなんて、<line-break>腕を上げたな、<value:$28>。<line-break>しかし、そうなると<line-break>ロストールを攻めることになるのか…。<end>"
english = "For Angeerdan himself to ask you to be his deputy... You've come a long way, <value:$28>. But would that mean attacking Rostorl...?<end>"

["1220028"]
japanese = "朱雀将軍アンギルタンの副将に？<line-break>彼の目にとまるなんて、さすがね。<end>"
english = "Deputy to Vermilion Bird General Angeerdan? Impressive, catching his attention like that.<end>"

["1220029"]
japanese = "………………。<end>"
english = "...............<end>"

["1220030"]
japanese = "ディンガル帝国の朱雀軍の副将に<line-break>なるんですか？<line-break>\u3000<line-break>ロストールを<value:$28>さんが<line-break>攻めるってことですよね？<line-break>いえ、なんでもないです…。<end>"
english = "You're becoming a deputy commander in the Dingal Empire's Vermilion Bird Army? That means <value:$28> will attack Rostorl, doesn't it? No, it's nothing...<end>"

["1220031"]
japanese = "………………。<end>"
english = "...............<end>"

["1220032"]
japanese = "（エンシャントの南東にある賢者の森。<line-break>\u3000そこには運命に選ばれた人間のみが<line-break>\u3000入れる屋敷があるらしい）<line-break>（冒険者ギルドの主人が言うには、<line-break>\u3000未来の勇者を自称するガルドランは<line-break>\u3000その猫屋敷へ向かったようだ）<end>"
english = "(Southeast of Ancient lies the Sage's Forest. It is said to contain a manor that only humans chosen by destiny may enter.) (According to the master of the Adventurers' Guild, Girldlan, the self-proclaimed future Hero, has set out for that Cat Manor.)<end>"

["1220033"]
japanese = "私の聞いた話によると、ガルドランは<line-break>賢者の森へ向かったらしいわ。<line-break>猫屋敷に通れるつもりなのね。<end>"
english = "From what I've heard, Girldlan has gone to the Sage's Forest. He must think he can gain entry to Cat Manor.<end>"

["1220034"]
japanese = "あやつ、賢者の森へ行ったそうじゃ。<line-break>運命に選ばれた者のみ通れるという<line-break>賢者殿に会えるつもりなのじゃなあ。<end>"
english = "I hear that fellow went to the Sage's Forest. He must think the Sage, who receives only those chosen by destiny, will meet with him.<end>"

["1220035"]
japanese = "ガルドラン様が賢者の森へ行ったという<line-break>ことはですね～、運命に選ばれた者だ<line-break>っていう自覚があるからです！<line-break>賢者様が会ってくれなかったら、<line-break>少しは落ち着きが出るんでしょうか？<line-break>そうなるといいですね～！\u3000きゃっ！<end>"
english = "Lord Girldlan went to the Sage's Forest because he considers himself one of those chosen by destiny! If the Sage refuses to see him, do you think he might calm down a little? I certainly hope so! Eek!<end>"

["1220036"]
japanese = "ガルドランの野郎は、賢者の森へ<line-break>行ったらしいぜ！\u3000くっそ～！<line-break>俺より先に猫遊びするつもりだな！<end>"
english = "That bastard Girldlan went to the Sage's Forest! Damn it! He's going to play with the cats before I do!<end>"

["1220037"]
japanese = "ボクが聞いたところによるとね、<line-break>ガルドランは賢者の森へ行ったって！<line-break>猫屋敷まで踏み込むつもりなのかな？<end>"
english = "From what I heard, Girldlan went to the Sage's Forest! I wonder if he plans to venture all the way into Cat Manor.<end>"

["1220038"]
japanese = "ガルドラン？<line-break>どこへ行ったかということ以前に、<line-break>それが誰だったかが思い出せない…。<end>"
english = "Girldlan? Never mind where he went―I can't even remember who he was...<end>"

["1220039"]
japanese = "まあ、私は黙っていましょうかね。<line-break>人を選ぶのは、運命、ですから…。<line-break>ふふふっ。<end>"
english = "Perhaps I should keep quiet. After all, destiny is what chooses people... Heh heh.<end>"

["1220040"]
japanese = "ああ、あのうるっさいヤツね。<line-break>酒場ではどうやら賢者の森へ行くって<line-break>叫んでたらしいけど…？<end>"
english = "Oh, that obnoxiously loud fellow. Apparently he was shouting in the tavern about going to the Sage's Forest...?<end>"

["1220041"]
japanese = "大変だ、姉ちゃん！<line-break>ガルドランの奴、賢者の森の猫屋敷へ<line-break>向かったらしいんだ！<line-break>姉ちゃんや俺を差し置いて、<line-break>ガルドランが賢者様に会っちゃったら<line-break>俺、たまんなく悔しいぜ！<end>"
english = "This is bad, Sis! That Girldlan fellow is heading for Cat Manor in the Sage's Forest! If Girldlan meets the Sage before you or me, I'll be beside myself with frustration!<end>"

["1220042"]
japanese = "ガルドラン？\u3000勇者を名乗る冒険者？<line-break>冒険者であるあなたを差し置いて、<line-break>私がその行方を知るはずがないわ。<end>"
english = "Girldlan? The adventurer who calls himself a Hero? If you, an adventurer, do not know where he went, how could I possibly know?<end>"

["1220043"]
japanese = "ああ、ガルドランだろ？<line-break>酒場でな、賢者の森へ行くって<line-break>声高に叫んでたみたいだぜ？<line-break>運命に選ばれた者だなんて平気で<line-break>言えるんだからな。いやはや、<line-break>恐れ入っちまうぜ。<end>"
english = "Oh, Girldlan? Apparently he was loudly proclaiming in the tavern that he was going to the Sage's Forest. Anyone who can casually call himself chosen by destiny is truly something else. I'm almost impressed.<end>"

["1220044"]
japanese = "ガルドランは賢者の森へ行った。<line-break>猫屋敷まで通るつもりなのだろうが、<line-break>まず十割方、不可能だろうな。<end>"
english = "Girldlan went to the Sage's Forest. He probably intends to make it as far as Cat Manor, but there is virtually no chance of that.<end>"

["1220045"]
japanese = "おお、あの勇者気取りはな、<line-break>賢者の森へと行ったらしいぞ。<line-break>エンシャントの南東じゃ。<end>"
english = "Ah, that would-be Hero apparently went to the Sage's Forest. It lies southeast of Ancient.<end>"

["1220046"]
japanese = "ガルドランは賢者の森にある<line-break>猫屋敷へ向かったらしいね。<line-break>僕たちもいそいで追いかけようよ。<end>"
english = "Apparently Girldlan has headed for Cat Manor in the Sage's Forest. Let's hurry after him.<end>"

["1220047"]
japanese = "ガルドランは賢者の森へ向かった。<line-break>猫屋敷の賢者に会うつもりらしいな。<line-break>会えるかどうかは運命次第だが…。<end>"
english = "Girldlan went to the Sage's Forest. Apparently he means to meet the Sage of Cat Manor. Whether he succeeds is up to destiny...<end>"

["1220048"]
japanese = "ガルドラン？\u3000冒険者？<line-break>よして頂戴。そんな下賎なことは、<line-break>アタクシより酒場の親父の専門だわ。<line-break>"
english = "Girldlan? An adventurer? Spare me. Such lowly matters are the tavern keeper's concern, not mine."

["1220049"]
japanese = "エラーメッセージです。<end>"
english = "This is an error message.<end>"

["1220050"]
japanese = "ルルアンタ、知ってるよぉ。<line-break>ガルドランは賢者の森目指して<line-break>駆けてったんだよぉ！<end>"
english = "Lulluantha knows! Girldlan went running toward the Sage's Forest!<end>"

["1220051"]
japanese = "…賢者の森だ。<line-break>勝手に行くといいだろう。<end>"
english = "...The Sage's Forest. Go there if you want.<end>"

["1220052"]
japanese = "ガルドラン？<line-break>冒険者の行く場所など、知らん。<line-break>酒場か、宿屋ではないのか…。<end>"
english = "Girldlan? I know nothing of the places adventurers frequent. Perhaps a tavern or an inn...<end>"

["1220053"]
japanese = "ガルドランは、エンシャント南東の<line-break>賢者の森に向かったらしいよ！<line-break><line-break>猫屋敷の賢者様に会うつもりだとは<line-break>思うけど、運命は味方について<line-break>くれるのかな～？<end>"
english = "Apparently Girldlan headed for the Sage's Forest southeast of Ancient! I imagine he means to meet the Sage of Cat Manor, but I wonder if destiny will favor him.<end>"

["1220054"]
japanese = "賢者の森へと向かったらしいな。<line-break>猫屋敷の賢者が会ってくれると<line-break>考えているらしいが…。<end>"
english = "Apparently he headed for the Sage's Forest. He seems to think the Sage of Cat Manor will meet with him...<end>"

["1220055"]
japanese = "その者なら、賢者の森へ行ったと<line-break>聞きましたよ。猫屋敷の賢者様に<line-break>会えると考えてのことじゃ？<end>"
english = "I heard that person went to the Sage's Forest. Presumably in the belief that the Sage of Cat Manor would grant an audience?<end>"

["1220056"]
japanese = "ガルドラン…？<line-break>ヴィア、そんな人、<line-break>知らないよ。<end>"
english = "Girldlan...? Via doesn't know anyone like that.<end>"

["1220057"]
japanese = "自称未来の勇者が、<line-break>おのれの素質を試しに行ったか。<line-break><line-break>やめておけばいいものを。<line-break>賢者の森はそんなに甘くはない。<line-break>立ち直れなくなるぞ。<end>"
english = "So the self-proclaimed future Hero has gone to test his potential. He should have left well enough alone. The Sage's Forest is not so forgiving. This may crush him beyond recovery.<end>"

["1220058"]
japanese = "ガルドランというと…<line-break>ああ、あの、未来の勇者などと<line-break>自分で叫んでいた男か。<line-break>賢者の森へと向かったと聞いたが、<line-break>賢者のいる猫屋敷までたどり着くのは<line-break>おそらく無理だろうな。<end>"
english = "Girldlan...? Ah, the man who went around proclaiming himself the future Hero. I heard he headed for the Sage's Forest, but he will probably never reach Cat Manor, where the Sage resides.<end>"

["1220059"]
japanese = "………………。<end>"
english = "...............<end>"

["1220060"]
japanese = "自称勇者様なら賢者の森に向かった<line-break>らしいわ。自分が運命に選ばれた者って<line-break>思い込んでるのね。<end>"
english = "Apparently our self-proclaimed Hero went to the Sage's Forest. He really believes he was chosen by destiny.<end>"

["1220061"]
japanese = "………………。<end>"
