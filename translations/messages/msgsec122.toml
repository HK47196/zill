english = "The beast is near the Korol Stone deposits in Bewildering Cave, right? Then it must be at the very back. It's a beautiful place, with Korol Stone shining in all sorts of colors.<end>"

["1220182"]
japanese = "幻惑の洞窟は内部がとても狭くなって<line-break>いたはずだ。ましてや、<line-break>敵の獣の正体は一切不明…。<line-break>不意を突かれれば、君といえど簡単に<line-break>命を失うことになるかもしれない。<line-break>アミラルの人々を、失望させるなよ。<end>"
english = "The passages inside Bewildering Cave are extremely narrow, if I recall. Worse, we know nothing at all about the beast. If it catches you by surprise, even you might easily lose your life. Do not disappoint the people of Amiral.<end>"

["1220183"]
japanese = "幻惑の洞窟に潜む獣退治というのが、<line-break><value:$28>様が今回<line-break>お引き受けになった依頼です。<line-break>洞窟最深部のコロル石の採掘所あたりに<line-break>その獣は出没するらしいのですが、<line-break>残念ながら、詳細は一切不明です。<end>"
english = "The request <value:$28> has accepted is to slay the beast lurking in Bewildering Cave. It apparently appears near the Korol Stone mine at the cave's deepest point, but unfortunately, no further details are known.<end>"

["1220184"]
japanese = "幻惑の洞窟の奥に、<line-break>ものすごい獣が出るんだって。<line-break>ものすごいらしいよ。<end>"
english = "They say a fearsome beast appears deep inside Bewildering Cave. Apparently it really is fearsome.<end>"

["1220185"]
japanese = "わしに一種特殊な勘があると言ったら、<line-break><value:$28>、おぬしは<line-break>それを信じてくれるか？<line-break>…幻惑の洞窟の、凶暴かつ巨大な獣。<line-break>それが怒りとともに発している悲しみを<line-break>わしはふと直感した気がするのじゃ。<end>"
english = "If I told you I possessed a certain special intuition, would you believe me, <value:$28>? That huge, ferocious beast in Bewildering Cave... I feel I somehow sensed the sorrow it gives off along with its rage.<end>"

["1220186"]
japanese = "最近、この手の依頼が<line-break>増えているような気がしないか？<line-break>冒険者としては腕が鳴るところだが…<line-break>敵も生命あるものだと意識すると、<line-break>罪を自覚してしまいそうになる。<line-break>せめて…今回も、祈りを捧げよう。<end>"
english = "Does it not feel as though requests like this have become more common lately? As an adventurer, the challenge excites me... But when I remember that our enemies are living beings too, I begin to feel the weight of sin. At the very least... let us offer a prayer again this time.<end>"

["1220187"]
japanese = "お前はなんにでも首を突っ込むんだな。<line-break>俺もほっとくことができない性分だから<line-break>気持ちはわかるけどな。<line-break>引き受けたからには、手を抜くなよ。<line-break>獣のいる幻惑の洞窟へ向かうぞ。<end>"
english = "You stick your nose into everything. I understand, though―I'm not the sort who can ignore trouble either. Since you accepted the job, don't hold back. We're heading to Bewildering Cave, where the beast is.<end>"

["1220188"]
japanese = "<value:$28>って人がよすぎよ。<line-break>あんな依頼引き受けちゃうなんて、<line-break>ほんと、お人好しね。<line-break>あの冒険者もプライドが無いのかしら。<line-break>ま、いいわ。幻惑の洞窟にいる獣を<line-break>倒しに行きましょ。<end>"
english = "You're far too kind, <value:$28>. Accepting a request like that―you really are a soft touch. Doesn't that adventurer have any pride? Oh well. Let's go slay the beast in Bewildering Cave.<end>"

["1220189"]
japanese = "………………。<end>"
english = "...............<end>"

["1220190"]
japanese = "<value:$28>さんってすごいです。<line-break>今日会った人のために、<line-break>危険な仕事を引き受けるだなんて…。<line-break>そういうところが私…<line-break>あ、いえ、なんでもないんです。<line-break>幻惑の洞窟に急ぎましょう！<end>"
english = "You're amazing, <value:$28>. Taking on a dangerous job for someone you only met today... That part of you makes me... Oh, n-no, it's nothing. Let's hurry to Bewildering Cave!<end>"

["1220191"]
japanese = "………………。<end>"
english = "...............<end>"

["1220192"]
japanese = "（ロセンの冒険者ギルドで、<line-break>\u3000火山岩地帯にいる魔物を倒すよう<line-break>\u3000依頼されたな）<line-break>（魔物を倒したら、<line-break>\u3000忘れずに報告しないと…）<end>"
english = "(At the Adventurers' Guild in Rocen, I accepted a request to slay the monster in the Volcanic Rock Zone.) (Once it is defeated, I must remember to report back...)<end>"

["1220193"]
japanese = "神官の話だと、その魔物は<line-break>とてつもない闇の力を持っている<line-break>らしいじゃない。<line-break>自分の実力を過信して挑めば、<line-break>命を落とすわよ。<end>"
english = "According to the priest, that monster possesses tremendous dark power. If you challenge it out of overconfidence in your abilities, it will cost you your life.<end>"

["1220194"]
japanese = "こたびの魔物は、とてつもない闇の力を<line-break>持っておるというではないか。<line-break>お主、魔物を倒す自信はあるのか？<line-break>火山岩地帯は火属性のモンスターが<line-break>多く出るところだ。<line-break>風属性の武器が欲しいものだがな。<end>"
english = "They say this monster possesses tremendous dark power. Are you confident you can defeat it? The Volcanic Rock Zone is crawling with Fire-element monsters. A Wind-element weapon would come in handy.<end>"

["1220195"]
japanese = "<value:$28>様の活躍は、<line-break>ロセンにも届いているんですね。<line-break>すばらしいですわ。<line-break>がんばって闇の魔物を<line-break>退治してくださいね。<line-break>私、応援してますから。<end>"
english = "Word of your exploits has reached Rocen too, <value:$28>. How wonderful. Do your best to defeat the dark monster. I'll be cheering you on.<end>"

["1220196"]
japanese = "闇の魔物がどうしたよ！<line-break>俺たちにかかりゃ敵じゃないぜ。<line-break>さっさと火山岩地帯へ行くぞ。<line-break>まさか、闇の魔物だからって<line-break>やみるつもりじゃないだろうな！<end>"
english = "Who cares if it's a dark monster? It's no match for us. Let's get to the Volcanic Rock Zone already. You're not going to let a little darkness make you turn tail, are you?<end>"

["1220197"]
japanese = "キミがロセンで引き受けた仕事だね。<line-break>ギルドに依頼してきた神官の話だと、<line-break>闇の力を持った魔物なんでしょ。<line-break>どう？\u3000やっつける自信あるの？<line-break>ボク…キミにはあまり無茶を<line-break>しないで欲しいな。<end>"
english = "This is the job you took in Rocen, right? The priest who brought the request to the Guild said the monster possesses dark power. So? Think you can beat it? I...don't want you taking too many risks.<end>"

["1220198"]
japanese = "ディンガルは何をしている？<line-break>闇の魔物が出没していると言うのに、<line-break>その退治を冒険者ごときに任すつもり？<line-break><value:$28>が通りかかったのは、<line-break>幸いだったとしか言い様がないわ。<line-break>火山岩地帯へ向かうわよ！<end>"
english = "What is Dingal doing? A dark monster is on the loose, yet its extermination is being left to a mere adventurer? It was extraordinarily fortunate that <value:$28> happened to pass by. We're heading for the Volcanic Rock Zone!<end>"

["1220199"]
japanese = "ロセンの神官殿の話では、<line-break>火山岩地帯の魔物は、<line-break>闇の力を持つらしいですねえ。<line-break>なかなか手ごわいかもしれません。<line-break>心してかかった方が良さそうですよ。<end>"
english = "According to the priest from Rocen, the monster in the Volcanic Rock Zone possesses dark power. It may prove quite formidable. You'd best take it seriously.<end>"

["1220200"]
japanese = "火山岩地帯に、闇の魔物ねえ。<line-break>行く前に、装備を再確認した方が<line-break>いいかもよ、<value:$28>。<line-break>ちょ～っとややこしいけどさ、<line-break>その辺しっかりできる冒険者って、<line-break>カッコいいよ、やっぱさ。<end>"
english = "A dark monster in the Volcanic Rock Zone, huh? You might want to double-check your equipment before you go, <value:$28>. It's kind of a pain, but an adventurer who takes care of that stuff properly is pretty cool, you know?<end>"

["1220201"]
japanese = "姉ちゃん、火山岩地帯はロセンの<line-break>南東にあるんだぜ。<line-break>知ってたか？<line-break>魔物を倒したあとの報告は、<line-break>ロセンの冒険者ギルドに行くんだぜ。<end>"
english = "Hey, miss, the Volcanic Rock Zone is southeast of Rocen. Did you know that? Once you've defeated the monster, report back to the Adventurers' Guild in Rocen.<end>"

["1220202"]
japanese = "火山岩地帯に出没している魔物が、<line-break>闇の力を持っている、ですって…？<line-break><line-break>…知らなかった。<line-break><value:$28>、私からも、<line-break>どうか退治をお願いするわ。<end>"
english = "The monster appearing in the Volcanic Rock Zone has dark power...? I...didn't know. Please, <value:$28>. I too ask you to defeat it.<end>"

["1220203"]
japanese = "竜王の覚醒が原因かどうかわからんが、<line-break>闇の力を持った魔物が封印を解かれて<line-break>うろつくことが多くなっている。<line-break>今回のも、そのたぐいかもしれんな。<line-break>お前さんなら問題ないと思うが、<line-break>油断するなよ。<end>"
english = "I don't know whether the Dragon King's Awakening is to blame, but more and more monsters with dark power have been breaking free of their seals and roaming about. This one may be another of that sort. I don't expect you'll have any trouble, but don't let your guard down.<end>"

["1220204"]
japanese = "闇の力を持つ魔物か…。<line-break>気になる事がある。<line-break>付き合ってやってもいいぞ。<end>"
english = "A monster with dark power... There's something I want to look into. I suppose I could come along.<end>"

["1220205"]
japanese = "とてつもない闇の力を持つ魔物とな？<line-break>火山岩地帯に、そのような魔物が<line-break>おるとは初耳じゃぞ。<line-break>火山岩地帯には火草の種を求めて<line-break>冒険者が集まるぞ。<line-break>被害者が出る前に退治せねばな。<end>"
english = "A monster with tremendous dark power, you say? This is the first I've heard of such a monster in the Volcanic Rock Zone. Adventurers gather there in search of Firegrass Seeds. We must defeat it before anyone comes to harm.<end>"

["1220206"]
japanese = "ロセンの冒険者ギルドで引き受けた<line-break>仕事のことだね。<line-break>たしか、依頼者は神官だったかな。<line-break>神官の話だと魔物からは、<line-break>ものすごい闇の力が感じられたそう<line-break>だから、用心しないとね。<end>"
english = "This is about the job you took at the Adventurers' Guild in Rocen, right? If I remember correctly, the client was a priest. The priest apparently sensed tremendous dark power coming from the monster, so we'd better be careful.<end>"

["1220207"]
japanese = "一言助言を言わせてもらえるなら、<line-break>火属性の敵には風属性、闇属性には<line-break>聖属性の攻撃が有効だ。<line-break>知恵と機転もまた我々の武器。<line-break>…そういうことだな。<end>"
english = "If I may offer one piece of advice: Wind-element attacks are effective against Fire-element enemies, while Holy-element attacks are effective against Dark-element enemies. Wisdom and resourcefulness are also weapons at our disposal. ...That's the idea.<end>"

["1220208"]
japanese = "何度も言うけどアタクシは、<line-break>高貴で優雅で知性あふれる<line-break>エルフなのよ、エ・ル・フ。<line-break>そのアタクシがど～して<line-break>山登りなんてしないと<line-break>いけないのよ！<end>"
english = "How many times must I say it? I am a noble, graceful, brilliant elf. An e-l-f! So why in the world must someone like me go climbing mountains?!<end>"

["1220209"]
japanese = "すさまじい闇の力を持つ魔物ですか…。<line-break>ま～ものにもよりますが、<line-break>闇だけにやみといたほうがいいですぞ。<end>"
english = "A monster with tremendous dark power, you say...? Well, it depends on the monster, but with darkness like that, perhaps you'd best call it a night.<end>"

["1220210"]
japanese = "今度は火山岩地帯に行くの？<line-break><value:$28>が有名になったから、<line-break>いろんな人が頼ってくるね。<line-break>たくさんお仕事して疲れたら、<line-break>無理しないで休んでね。<end>"
english = "Are you going to the Volcanic Rock Zone this time? Now that you're famous, <value:$28>, all sorts of people come asking for help. If all that work wears you out, don't push yourself. Be sure to rest.<end>"

["1220211"]
japanese = "………………。<line-break><line-break><line-break>戦いは生か死だ。<line-break>気を抜いた者が死ぬ。<end>"
english = "……………… Battle is life or death. Those who let their guard down die.<end>"

["1220212"]
japanese = "冒険者ギルドに泣きついてくるとは…<line-break>闇を払うのこそ、神官最大の仕事では<line-break>なかったのか？<line-break>ふん…それだけ世は<line-break>怠慢に満ちているということか。<line-break>嘆かわしい限りだな。<end>"
english = "To think a priest would go crying to the Adventurers' Guild... Was driving back the darkness not a priest's greatest duty? Hmph. Is this how thoroughly the world has succumbed to indolence? How deplorable.<end>"

["1220213"]
japanese = "火山岩地帯って、渦巻きの岩が<line-break>あるところだね。<line-break>昔から気になってたんだぁ。<line-break>ボクのカンだと、あそこが怪しいよ。<line-break>あーゆーとこに魔人とか闇の力を<line-break>持った魔物とかが集まるものなのさ。<end>"
english = "The Volcanic Rock Zone is where those spiral-shaped rocks are, right? I've been curious about that place for ages. My instincts tell me there's something suspicious about it. Places like that always attract fiends and monsters with dark powers.<end>"

["1220214"]
japanese = "竜王の覚醒以来、闇の魔物の<line-break>出現を耳にする機会が<line-break>明らかに増えてきている。<line-break>変革の時代が到来したという<line-break>証なのか…。<end>"
english = "Since the Dragon King's Awakening, reports of dark monsters have clearly become more frequent. Could this be proof that an age of upheaval has arrived...?<end>"

["1220215"]
japanese = "火山岩地帯に現れるという魔物は、<line-break>ロセンの神官の現によれば、<line-break>闇の力を持つもののようです。<line-break>こちらも闇属性に耐えうるような<line-break>防備を調えておかねば、<line-break>危険かもしれません。<end>"
english = "According to the priest from Rocen, the monster said to appear in the Volcanic Rock Zone seems to possess dark power. It may be dangerous unless we equip ourselves to withstand the Dark element as well.<end>"

["1220216"]
japanese = "火山岩の近くにいる魔物は、<line-break>闇の力を持つって言ったよ。<line-break>気をつけないとね。<end>"
english = "The monster near the volcanic rocks was said to have dark power. We'd better be careful.<end>"

["1220217"]
japanese = "神官ともあろう人間が、闇の力を持つ<line-break>魔物退治を他人任せにするとは…！<line-break>…ま、叫んでおっても仕方ない。<line-break>魔物の方も、おざなりされるよりは<line-break>手厚く弔われた方が幸せに決まっとる。<line-break>火山岩地帯へ行こうぞ、<end>"
english = "For a priest to leave the slaying of a monster with dark power to someone else...! Still, there is no point in shouting about it. The monster will surely be happier receiving a proper burial than being treated as an afterthought. Let us go to the Volcanic Rock Zone.<end>"

["1220218"]
japanese = "冒険者として名が知れたことで<line-break>多くの人々に頼られるように<line-break>なったのは誇るべきだ。<line-break>彼らの期待に答えるためにも、<line-break>視野は広く持たないといけないぞ。<end>"
english = "You should be proud that your renown as an adventurer has led so many people to rely on you. To live up to their expectations, you must keep a broad perspective.<end>"

["1220219"]
japanese = "神官の話だと、闇の力を持つ魔物は<line-break>火山岩地帯にいるらしいな。<line-break>\u3000<line-break>今回は何か危険な匂いがする。<line-break>いつも以上に気を引き締めていくぞ。<end>"
english = "According to the priest, the monster with dark power is in the Volcanic Rock Zone. Something about this job smells dangerous. We'll need to stay even more alert than usual.<end>"

["1220220"]
japanese = "どうやら今回の魔物退治は<line-break>少し危険みたいね。<line-break>\u3000<line-break>万全の態勢で火山岩地帯に<line-break>向かいましょ。<end>"
english = "It sounds like hunting this monster may be a little dangerous. Let's make sure we're fully prepared before heading to the Volcanic Rock Zone.<end>"

["1220221"]
japanese = "………………。<end>"
english = "………………<end>"

["1220222"]
japanese = "今回の依頼って危険じゃないですか？<line-break>だってすごい闇の力を持ってるって<line-break>神官の方がおっしゃってましたし…。<line-break>…そうですよね。それでも行くのが<line-break><value:$28>さんですよね。<line-break>私もほんの少しですけど力になります。<end>"
english = "Isn't this request dangerous? The priest said the monster has tremendous dark power... Yes, I know. You'd go anyway, wouldn't you, <value:$28>? I may not be much help, but I'll do what little I can.<end>"

["1220223"]
japanese = "………………。<end>"
english = "………………<end>"
