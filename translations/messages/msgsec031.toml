["310278"]
japanese = "大通り<end>"
english = "Main Street<end>"

["310279"]
japanese = "<select><value:$20>%3お代官様はあんたに業を煮やして、\u3000\u3000<line-break>最近じゃ戦闘用のモンスターを<line-break>買い込んで飼ってなさる。<line-break>まったく、あんたのせいで<line-break>どんどん、状況がひどくなってくるよ。<end>ここの代官ボルボラ様は<line-break>とにかく残虐な人さ。<line-break>逆らった人間の末路と来たら！\u3000<line-break>この前姿を消したあの男、<line-break>ボルボラが買い付けたあの怪物の<line-break>エサにされたって言うよ！<end>お代官様は戦闘用のモンスターを\u3000\u3000\u3000\u3000<line-break>飼ってなさる。<line-break>逆らえるわけがない。<line-break>だけど、あの旅の商人さんの言うとおり、<line-break>このまま黙っていたら、<line-break>うちのかわいい娘だって、いつ…。<end>"
english = "<select><value:$20>%3The magistrate's lost patience with you. Lately, he's been buying up monsters trained for combat and keeping them here. Honestly, because of you, things just keep getting worse.<end>Bolbora, the magistrate here, is a cruel man. You should see what happens to anyone who defies him! They say that man who disappeared recently was fed to the monster Bolbora bought!<end>The magistrate keeps monsters trained for combat. We can't possibly stand against him. But that traveling merchant was right. If we stay silent, who knows when my darling daughter might be...<end>"

["310280"]
japanese = "<select><value:$20>%2あのお兄ちゃんは<line-break>やみのじんぎっていうものを\u3000\u3000<line-break>探してるんだって。<line-break>カワイイ顔してるのに、<line-break>なんかヘンなの！<line-break>あんまし、モテそうにないよね！<end>あのお兄ちゃんは、<line-break>お兄ちゃんのお兄ちゃんに<line-break>この町で会うつもりなんだって！<end>"
english = "<select><value:$20>%2I heard that young man is looking for something called the Dark Artifact. He has such a cute face, but he's so weird! I bet he doesn't get many admirers!<end>I heard that young man came to this town to meet his big brother!<end>"

["310281"]
japanese = "お母さんが、<line-break>お姉ちゃんとお話ししちゃダメだって。<line-break>コワイお代官様ににらまれるんだって。<end>"
english = "My mother said I'm not allowed to talk to you. She says talking to you would make the scary magistrate angry.<end>"

["310282"]
japanese = "長老の家<end>"
english = "Elder's House<end>"

["310283"]
japanese = "<select><value:$20>%3ボルボラは恐ろしい…。<line-break>奴が凶暴な戦闘用モンスターを<line-break>飼っているの、知ってるだろ？\u3000<line-break>俺、あんな奴に喰われたくねえ！<line-break>奴がどんなに悪いことしてても<line-break>目をつぶっとくに限るんだ！<end>どうせ俺は意気地なしだよ！<line-break>だけど、しょうがないだろ！<line-break>みんなが、お前みたいに生きられないんだ！<end>ボルボラが重税で私腹を肥やそうと<line-break>ゴロツキを雇って乱暴を働こうと、<line-break>とにかく、見て見ぬふりだ。<line-break>ボルボラが飼ってる<line-break>あの戦闘モンスターの<line-break>エサになりたくなければな。<end>"
english = "<select><value:$20>%3Bolbora scares the hell out of me. You know he keeps a vicious combat monster, right? I don't want that thing eating me! Whatever terrible things he does, you're better off turning a blind eye!<end>Fine, I'm a coward! But what choice do I have? We can't all live the way you do!<end>Whether Bolbora lines his pockets with heavy taxes or hires thugs to rough people up, just look the other way. Unless you want to end up as food for that combat monster of his.<end>"

["310284"]
japanese = "\u3000<end>"
english = ""

["310285"]
japanese = "ギルド<end>"
english = "Guild<end>"

["310286"]
japanese = "<select><value:$20>%3よぉ、<value:$28>。<line-break>まーた、お代官の手下ともめたって？<line-break>血の気の多いこった。<line-break>お前にノーブルは狭すぎるのかもな。<line-break>どうだ？\u3000冒険者になって<line-break>世界を旅してみないか？<end>ボルボラは弟の畑をおどしとった…。<line-break>弟は生きるために冒険者になり、<line-break>ムリな仕事をして…。<line-break>お、おう、<value:$28>。<line-break>いつからそこにいたんだ？<line-break>ヘンなこと…聞いちゃいないよな？<end>…あの旅の商人の言うとおりだ。<line-break>こんな日が続いていいわけがない。<line-break>いつか…。<end>"
english = "<select><value:$20>%3Hey, <value:$28>. I hear you've been tangling with the magistrate's men again. You certainly are spoiling for a fight. Maybe Noble's just too small for you. What do you say? Why not become an adventurer and see the world?<end>Bolbora was making threats against my brother's farm... My brother became an adventurer just to survive, took on a job that was too much for him, and... O-oh, <value:$28>. How long have you been standing there? You didn't hear anything strange, did you?<end>That traveling merchant was right. Things can't go on like this. Someday...<end>"

["310287"]
japanese = "<select><value:$20>%3ある街の代官の非道に怒った<line-break>ある若い冒険者が、代官に挑んだの。<line-break>ある朝、彼は無惨な死体になっていたわ。<line-break>バカな男だったわ…。<line-break>ホント…バカな…。<end>また、ボルボラたちとケンカ？<line-break>熱いわね。<line-break>バカみたい。<line-break>…でも、あの商人が言ったように<line-break>熱くなれない私の方が<line-break>バカなのかもしれない…。<end>あら、<value:$28>。<line-break>悪代官ボルボラとのケンカで<line-break>すっかり英雄気どりね。<line-break>ごめんあそばせ。<line-break>お気にさわったかしら？<end>"
english = "<select><value:$20>%3A young adventurer once challenged a town magistrate, outraged by his cruelty. Then one morning, he was nothing but a mangled corpse. He was a fool... He really was... a fool...<end>Another fight with Bolbora and his men? You do get worked up. It's absurd. But as that merchant said, perhaps I'm the fool for not being able to get worked up...<end>Oh, <value:$28>. After your fight with the wicked magistrate Bolbora, you're quite the hero now. My apologies. Did I offend you?<end>"

["310288"]
japanese = "<select><value:$20>%3この町はロストール王国の田舎町。<line-break>領主は大貴族のリューガ家で、<line-break>その代官のボルボラが治めています。<end>代官のボルボラが悪い人で、<line-break>住民や旅人に重い税をかけて、<line-break>私腹を肥やしているのですね。<end>この町の門を出たところに<line-break>ノーブルの森と呼ばれる森がありますが、<line-break>冒険者が探検するほどの所じゃないですね。<line-break>それで世界地図には<line-break>書きとめられていないのでしょう。<end>"
english = "<select><value:$20>%3This is a country town in the Kingdom of Rostorl. It belongs to the great noble house of Ryuga and is governed by their magistrate, Bolbora.<end>Magistrate Bolbora is a wicked man. He levies heavy taxes on residents and travelers alike, all to line his own pockets.<end>Just beyond the town gate lies a wood called Noble Forest, but it hardly warrants an adventurer's expedition. That must be why it isn't marked on the world map.<end>"

["310289"]
japanese = "闇の神器というのは<line-break>伝説によると破壊神復活に使われた<line-break>強力な１２個の魔道器の総称です。<line-break>しかし、そのようなものが<line-break>現実に存在するのでしょうか？<end>"
english = "According to legend, twelve powerful magical devices known collectively as the Dark Artifacts were used to resurrect the God of Destruction. But could such things truly exist?<end>"

["310290"]
japanese = "ギルドの主人も<line-break>よくここにいるあのキレイな人も<line-break>反乱に参加してて、いませんよ。<line-break>わ、私は探検家ですから、<line-break>反乱は本分じゃないんで…。<line-break>今回はパスです。<end>"
english = "The Guildmaster and that good-looking person who's often here are both away taking part in the rebellion. I-I'm an explorer; rebellion isn't really my line of work, so... I'll sit this one out.<end>"

["310291"]
japanese = "鍛冶屋<end>"
english = "Blacksmith<end>"

["310292"]
japanese = "おう、<value:$28>！<line-break>俺も武器を作ったりして<line-break>反乱を応援させてもらってるぜ。<line-break>俺も金持ちじゃあねえから、<line-break>ただで作ってやるわけには<line-break>いかねえんだがよ。<end>"
english = "Hey, <value:$28>! I'm doing my part for the rebellion, making weapons and all. I'm not made of money myself, though, so I can't exactly do it for free.<end>"

["310293"]
japanese = "道具屋<end>"
english = "Item Shop<end>"

["310294"]
japanese = "ああ、<value:$28>。<line-break>誰かがケガをなさるといけないので<line-break>私もずっと店を開けているんですよ。<end>"
english = "Ah, <value:$28>. I wouldn't want anyone getting hurt, so I've been keeping my shop open the whole time as well.<end>"

["310295"]
japanese = "<select><value:$20>%3フン！\u3000悪代官ボルボラに刃向かって<line-break>英雄気どりのようじゃが、<line-break>わしらにはいい迷惑じゃ。<line-break>お前が刃向かうから<line-break>ボルボラの機嫌が悪くなり、<line-break>とばっちりがわしらにも来るんじゃ。<end>お前のおやじ殿とは長老と一緒に\u3000\u3000<line-break>この町を切り開いた仲じゃ。<line-break>じゃから言わせてもらうぞ。<line-break>いいか。<line-break>つまらぬ正義の味方ごっこはやめろ。<line-break>大変なことになってからでは遅い。<end>まったく、騒ぎばかり起こしおって。<line-break>わしの珍品集めのジャマにならんように<line-break>してほしいもんじゃわい。<end>"
english = "<select><value:$20>%3Hmph! You may fancy yourself a hero for standing up to that corrupt magistrate Bolbora, but you're only making trouble for the rest of us. When you defy him, Bolbora's temper worsens, and we suffer the consequences too.<end>Your father, the elder, and I opened up this town together. So let me tell you something: stop playing at being some champion of justice. Once something terrible happens, it'll be too late.<end>Always stirring up trouble, aren't you? Just see that it doesn't interfere with my collection of curios.<end>"

["310296"]
japanese = "宿屋<end>"
english = "Inn<end>"

["310297"]
japanese = "<select><value:$20>%3いやいや、礼にはおよびませんよ。\u3000\u3000<line-break><value:$28>さん。<line-break>当然のことをしたまでです。<line-break>それよりも、お気づきになりましたか？<line-break>町の人の雰囲気を…。<line-break>やっと立ち上がる気になられたようだ。<end>いえいえ、礼にはおよびませんよ、\u3000<line-break><value:$28>さん。<line-break>大したことじゃない。<line-break>あなたの方こそ、<line-break>大した仕事をなさったようですね。<line-break>…予定より早く、事が運ぶようだ。<end>ルルアンタにお会いになりましたか。<line-break>あのリルビーの女の子は<line-break>私にとって娘のようなものです。<line-break>ほんとうにやさしい、いい子です。<line-break>またノーブルに来たときには<line-break>お友達になってやってください。<end>"
english = "<select><value:$20>%3No, no, there's no need to thank me, <value:$28>. I only did what anyone would. More importantly, have you noticed the mood among the townspeople? It seems they've finally found the will to rise up.<end>No, no need to thank me, <value:$28>. It was nothing. You're the one who seems to have accomplished something remarkable. It appears events will unfold sooner than planned.<end>Have you met Lulluantha? That Lilubee girl is like a daughter to me. She's such a kind, good-hearted girl. The next time you come to Noble, please be a friend to her.<end>"

["310298"]
japanese = "は、は、はは、反乱ですか？<end>"
english = "R-r-r-rebellion?<end>"

["310299"]
japanese = "お泊まりじゃ…ない…ですよね。<line-break>ご立派な自分の家が<line-break>大通りにあるんですから。<end>"
english = "You won't be staying the night... will you? Not when you have such a fine house of your own on the main street.<end>"

["310300"]
japanese = "は、反乱？<line-break>ああ、フリントさんの<line-break>言ったとおりになった。<end>"
english = "R-rebellion? Ah. It's just as Flint said.<end>"

["310301"]
japanese = "あなたをねらっている<line-break>お代官の手下と騒動があって、<line-break>お客様に迷惑がかかると…その…。<end>"
english = "If there's trouble with the magistrate's men who are after you, and my guests are inconvenienced... well...<end>"

["310302"]
japanese = "で、できれば、<line-break>お客様を騒ぎに巻き込まないで\u3000\u3000<line-break>いただきたいのですが…。<end>"
english = "I-if possible, I'd rather you didn't get the guests caught up in any trouble...<end>"

["310303"]
japanese = "広場<end>"
english = "Plaza<end>"

["310304"]
japanese = "<select><value:$20>%2代官ボルボラは、残酷で執念深い。<line-break>逆らうと、ひどい仕返しをくう。<line-break>だからボルボラの悪行を見て見ぬふりだ。<line-break>だけど、みんな、心の底では<line-break>ボルボラに立ち向かうお前のことを<line-break>応援してるんだよ。<end>ボルボラは恐ろしい…。<line-break>だが、このまま重税のために働いて<line-break>奴に殺されるのを待つのか？<line-break>イヤだ！<line-break>あの旅の商人の言うとおりだ…！<line-break>せめてボルボラの怪物が死ねば…！<end>"
english = "<select><value:$20>%2Magistrate Bolbora is cruel and vindictive. Defy him, and he'll take terrible revenge. That's why we turn a blind eye to his crimes. But deep down, everyone is rooting for you to stand against him.<end>Bolbora is terrifying... But are we supposed to keep working just to pay his crushing taxes and wait for him to kill us? No! That traveling merchant was right... If only Bolbora's monster would die...<end>"

["310305"]
japanese = "<select><value:$20>%3ごめんなさいね。<line-break>あなたたちの助けになれなくて。<line-break>私たちは、ボルボラ様が恐くて…。<end>…代官のボルボラが<line-break>こんなに悪事を働いているのに<line-break>領主様は何してるのかしら？<end>ここのご領主は<line-break>名門リューガ家のご当主様である\u3000<line-break>エリエナイ公爵様なの…。<line-break>王都での政争でお忙しくって<line-break>星の数ほどある領地のひとつなんて<line-break>まったく忘れてらっしゃるんだわ。<end>"
english = "<select><value:$20>%3I'm sorry we can't help you. We're all so afraid of Lord Bolbora...<end>Magistrate Bolbora is committing all these terrible crimes... What in the world is our ruler doing?<end>This land is ruled by the Duke of Elienai, head of the distinguished House Ryuga... Political struggles in the royal capital keep him so busy that one domain among countless others has been forgotten entirely.<end>"

["310306"]
japanese = "<select><value:$20>%2ボルボラ様の手下の俺の前に<line-break>ノコノコ現れるとは<line-break>大した度胸だな、コラ！<end>ちょっと、腕が立つからって\u3000<line-break>うぬぼれてっと、<line-break>足下すくわれっぞ、コラ！<end>"
english = "<select><value:$20>%2You've got some nerve, strolling right up to one of Lord Bolbora's underlings!<end>You may be pretty good in a fight, but get too full of yourself and someone'll knock you off your feet!<end>"

["310307"]
japanese = "ひいっ！\u3000ご、ごめんなさい！<line-break>ウ、ウソですウソです！<line-break>お、俺を殴らないで！<end>"
english = "Eek! I-I'm sorry! I was lying, I swear! D-don't hit me!<end>"

["310308"]
japanese = "<select><value:$20>%3<value:$28>は<line-break>つよくって、カッコよくて<line-break>だーいすき！！<end>ぼくも大きくなったら、<line-break><value:$28>みたいに<line-break>つよーくなるんだ！<end><value:$28>、<line-break>これからもイジワルな<line-break>ボルボラ様をこらしめてね！<end>"
english = "<select><value:$20>%3I love <value:$28>! So strong and so cool!<end>When I grow up, I'm gonna be strong like <value:$28>!<end><value:$28>, keep teaching that mean Lord Bolbora a lesson!<end>"

