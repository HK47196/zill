japanese = "俺も行くぜ！<line-break>あんたには助けられっぱなしだ！<line-break>これじゃ、俺の気がすまねえ！<line-break>それに…、<line-break>もう、ノーブルの町には<line-break>いられないだろうしな。<end>"
english = "I'm coming too! You've done nothing but help me. I can't leave it at that! Besides... I doubt I can stay in Noble any longer.<end>"

["310274"]
japanese = "フッ、それもよかろう。<line-break>煮え切らない貴族どもには<line-break>うんざりしていたところだ。<line-break>気概のある奴がほしかった。<line-break>本格的にお前たちを利用させてもらう。<line-break>覚悟するのだな。<end>"
english = "Hmph. Very well. I was growing tired of those spineless nobles. I needed someone with some backbone. From now on, I intend to make full use of all of you. Be prepared.<end>"

["310275"]
japanese = "ったく、こいつの場合、<line-break>本気か冗談かわからねえからな。<end>"
english = "Damn. There's no telling whether that was serious or a joke.<end>"

