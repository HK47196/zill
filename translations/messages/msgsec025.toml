["250000"]
japanese = "一度も戦闘をしなけりゃ、ボーナスが出る。<line-break>うまくやれよ。<end>"
english = "If you avoid fighting altogether, you'll get a bonus. Play it smart.<end>"

["250001"]
japanese = "我が帝国の<value:$17><value:$16>を<line-break><value:$15>まで<line-break>無事送り届ける護衛者を募集する。<line-break>報酬は、<value:$1A>ギア。<line-break>期限は、<value:$1B>日以内である。<end>"
english = "Escort wanted to deliver the Empire's <value:$17><value:$16> safely to <value:$15>. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days.<end>"

["250002"]
japanese = "市民ギルドの<value:$17><value:$16><line-break>が、<value:$15>まで行かねばなりません。<line-break>しかし、道中は危険なので、<line-break>護衛してくださる方を募集したいと思います。<line-break><value:$1A>ギアのお礼で、<line-break><value:$1B>日以内にやっていただける方、<line-break>ぜひお願いします。<end>"
english = "The Citizens' Guild's <value:$17><value:$16> must travel to <value:$15>, but the road is dangerous. We are seeking an escort. Reward: <value:$1A> Gea. Please complete the journey within <value:$1B> days.<end>"

["250003"]
japanese = "道中の護衛をする者を募集する。<line-break>当アカデミーの<value:$17><line-break><value:$16>の<value:$15>までの<line-break>行程に同行し、危険が迫ったならば<line-break>回避してほしい。<line-break>報酬は、<value:$1A>ギア。<line-break><value:$1B>日以内に送り届けてほしい。<end>"
english = "Escort wanted. Accompany the Academy's <value:$17><value:$16> on the journey to <value:$15>, avoiding any danger that arises. Reward: <value:$1A> Gea. Safe arrival is required within <value:$1B> days.<end>"

["250004"]
japanese = "冒険者の方々には、お世話になっております。<line-break>このたびお願いするのは、旅の道中の護衛です。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>まで行く間、<line-break>同行して身を守ってください。<line-break>お礼は、<value:$1A>ギア用意しました。<line-break><value:$1B>日以内に着くようにお願いします。<end>"
english = "Thank you, adventurers, for all your help. We now need an escort for a journey. Please accompany and protect this town's <value:$17><value:$16> on the way to <value:$15>. Reward: <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250005"]
japanese = "いつも世話になってるな。頼みたいことがある。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>まで行くんだが、<line-break>通り道が危険でな。守ってやってほしいんだ。<line-break>腕のいい冒険者をつけてやってくれ。<line-break>報酬は、<value:$1A>ギアだ。<line-break><value:$1B>日以内に送り届けてくれよ。<end>"
english = "Another job for a skilled adventurer: escort this town's <value:$17><value:$16> to <value:$15>; the road is dangerous. Reward: <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["250006"]
japanese = "世が乱れており、残念ながら旅の道中の安全が<line-break>確保されているとはいえません。<line-break>そこでお願いがございます。<line-break>我が神殿の<value:$17><value:$16>が、<line-break><value:$15>に行く間の護衛です。<line-break><value:$1A>ギアを寸志といたします。<line-break><value:$1B>日以内に目的地まで送り届けてください。<end>"
english = "Safe travel cannot be assured. Please escort our temple's <value:$17><value:$16> to <value:$15>. We offer a modest <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["250007"]
japanese = "我が宿に泊まられた<line-break><value:$17><value:$16>様を<line-break><value:$15>までお送りください。<line-break>お礼は、<value:$1A>ギア。<line-break><value:$1B>日以内に<line-break>お送りくださるようお願いします。<end>"
english = "Please escort <value:$17><value:$16>, a guest at our inn, to <value:$15>. Reward: <value:$1A> Gea. Please complete the journey within <value:$1B> days.<end>"

["250008"]
japanese = "私を<value:$15>まで<line-break>送ってもらえませんか？<line-break>最近は、街道も危険になりましたので、<line-break>護衛をお願いしたいのです。<line-break><value:$1A>ギアのお礼をいたします。<line-break><value:$1B>日以内に送り届けてくださる方、<line-break>待っています。<end>"
english = "Could someone take me to <value:$15>? The highways have grown dangerous lately, so I need an escort. I will pay <value:$1A> Gea. I await someone who can get me there within <value:$1B> days.<end>"

["250009"]
japanese = "ロストールから<value:$15>までの行程には<line-break>多くの危難が待ち構えておる。<line-break>このたび当家の<value:$17><line-break><value:$16>が出向くにあたり、<line-break>腕の立つ者に護衛を頼みたい。<line-break>褒美は、<value:$1A>ギアだ。<line-break><value:$1B>日以内に向こうに着くように頼む。<end>"
english = "Many perils await on the road from Rostorl to <value:$15>. As our house's <value:$17><value:$16> must make the journey, I wish to hire a capable escort. Reward: <value:$1A> Gea. Arrival is required within <value:$1B> days.<end>"

["250010"]
japanese = "市民ギルドの<value:$17><value:$16><line-break>が、<value:$15>まで出かけます。<line-break>道中は危険と聞いているので、とても心配です。<line-break>強い冒険者の方、護衛をお願いできませんか？<line-break><value:$1A>ギアご用意しました。<line-break><value:$1B>日以内に到着できるようお願いします。<end>"
english = "The Citizens' Guild's <value:$17><value:$16> is traveling to <value:$15>. I hear the road is dangerous, and I'm very worried. Would a strong adventurer please serve as escort? I have prepared <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250011"]
japanese = "このごろは旅の道中も安全ではないのう。<line-break>強くもない者の一人旅は無謀じゃて。<line-break>じゃが、村の<value:$17><value:$16>が、<line-break><value:$15>まで出向かねばならんのじゃ。<line-break>そこで、あんたがたに護衛を頼みたいのじゃ。<line-break>みなで金を出しあって<value:$1A>ギア用意した。<line-break><value:$1B>日以内に到着させてやってくれんか。<end>"
english = "Travel isn't safe these days. Please escort the village's <value:$17><value:$16> to <value:$15>. We pooled <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["250012"]
japanese = "毎度ありがとうございます。<line-break>このたびは私どもからのお願いがございます。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>に出かけるにあたって、<line-break>護衛の方をお願いしたいのです。<line-break>当方としては、<value:$1A>ギアご用意できます。<line-break><value:$1B>日以内に到着してくださるよう願います。<end>"
english = "Thank you for your continued patronage. We have a request: this town's <value:$17><value:$16> will be traveling to <value:$15>, and we would like to arrange an escort. We can offer <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250013"]
japanese = "腕自慢のお前さんたちにうってつけの仕事だ。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>に行く間の護衛を依頼したい。<line-break><value:$1A>ギア用意したから、<line-break><value:$1B>日以内にたどりつくよう頼むぜ。<line-break>うまくいかなきゃいい武器が作れなくなる。<line-break>任せたぜ。<end>"
english = "A job for skilled fighters: escort this town's <value:$17><value:$16> to <value:$15>. Reward: <value:$1A> Gea. Deadline: <value:$1B> days. If you fail, we can't make good weapons. I'm counting on you.<end>"

["250014"]
japanese = "この町の<value:$17><line-break><value:$16>を<value:$15>まで送り<line-break>届けたいんですよ。<line-break>でも街の外は最近、危ないんですよ。<line-break><value:$1A>ギアをお礼としてさしあげますから、<line-break><value:$1B>日以内に目的地に着けるよう、<line-break>護衛をお願いします。<end>"
english = "We need to get this town's <value:$17><value:$16> to <value:$15>, but it's been dangerous outside town lately. We'll pay <value:$1A> Gea, so please provide an escort and reach the destination within <value:$1B> days.<end>"

["250015"]
japanese = "旅は安全でなければなりません。<line-break>それを提供するのも私どもの役目です。<line-break>この街から<value:$15>まで行かれる<line-break><value:$17><value:$16>様の護衛を<line-break>お願いします。<line-break><value:$1A>ギアの報酬で、<line-break><value:$1B>日以内が到着の期限です。<end>"
english = "Travel should be safe, and providing that safety is part of our duty. Please escort <value:$17><value:$16> from this city to <value:$15>. Reward: <value:$1A> Gea. Arrival deadline: within <value:$1B> days.<end>"

["250016"]
japanese = "<value:$15>まで行くんだけど、<line-break>危ないから誰か守ってくれませんか？<line-break>お礼に<value:$1A>ギア差し上げます。<line-break><value:$1B>日以内に向こうまで送ってください。<end>"
english = "I'm going to <value:$15>, but it's dangerous. Could someone protect me? I'll pay <value:$1A> Gea. Please get me there within <value:$1B> days.<end>"

["250017"]
japanese = "当家の<value:$17><value:$16>の<line-break>護衛を引き受けてくれる者を探している。<line-break>目的地は、<value:$15>である。<line-break>褒美は、<value:$1A>ギアとらせる。<line-break><value:$1B>日以内で、無事に送り届けるように。<end>"
english = "I seek someone to escort our house's <value:$17><value:$16>. Destination: <value:$15>. Reward: <value:$1A> Gea. Deliver the traveler safely within <value:$1B> days.<end>"

["250018"]
japanese = "市民ギルドの<value:$17><value:$16><line-break>が、どうしてもはずせない用事のために、<line-break><value:$15>に行かねばなりません。<line-break>冒険者の方に護衛をお願いします。<line-break><value:$1A>ギアを用立てました。<line-break><value:$1B>日以内に目的地まで送り届けてください。<end>"
english = "The Citizens' Guild's <value:$17><value:$16> must travel to <value:$15> on unavoidable business. We ask an adventurer to serve as escort. We have raised <value:$1A> Gea. Please deliver the traveler to the destination within <value:$1B> days.<end>"

["250019"]
japanese = "村の<value:$17><value:$16>が、<line-break><value:$15>に行かなきゃなんないんだ。<line-break>通り道には、モンスターとか盗賊とかが<line-break>出てきてとてもおっかないらしい。<line-break>なんとか<value:$1A>ギア用意できたから、<line-break>護衛を頼まれてほしいんだ。<line-break><value:$1B>日以内に着いてくれ。<end>"
english = "The village's <value:$17><value:$16> has to go to <value:$15>. They say monsters and bandits appear along the road, and it sounds terrifying. We somehow managed to raise <value:$1A> Gea, so please take the escort job. Get there within <value:$1B> days.<end>"

["250020"]
japanese = "この町の<value:$17><value:$16>が、<line-break><value:$15>に行くことになりました。<line-break>護衛を務めてくださる方を募集します。<line-break><value:$1A>ギアをお礼としてさしあげます。<line-break>到着の期限は、<value:$1B>日以内です。<end>"
english = "This town's <value:$17><value:$16> will be traveling to <value:$15>. We are seeking someone to serve as escort. Reward: <value:$1A> Gea. Arrival deadline: within <value:$1B> days.<end>"

["250021"]
japanese = "旅の者の護衛を頼みたい。<line-break><value:$17><value:$16>が、<line-break><value:$15>まで行く。<line-break>報酬は、<value:$1A>ギア。<line-break>期限は<value:$1B>日以内。<line-break>道中は戦闘要員がいなければ危険な場所だ。<line-break>あんたたちの腕に期待してるよ。<end>"
english = "I need an escort for a traveler. <value:$17><value:$16> is going to <value:$15>. Reward: <value:$1A> Gea. Deadline: within <value:$1B> days. The route is dangerous without someone capable of fighting. I'm counting on your skill.<end>"

["250022"]
japanese = "この町の<value:$16>が、<line-break>用事で<value:$15>に行くことになってね。<line-break>物騒だから襲ってくる奴を<line-break>追い払ってくれる人を探してるんだよ。<line-break>お礼は、<value:$1A>ギア。<line-break><value:$1B>日以内に連れてってくれる人、<line-break>お願いね。<end>"
english = "This town's <value:$16> has business in <value:$15>. With things so dangerous, we're looking for someone to drive off any attackers. Reward: <value:$1A> Gea. Please take the traveler there within <value:$1B> days.<end>"

["250023"]
japanese = "毎度ご利用ありがとうございます。<line-break><value:$17><value:$16>様が、<line-break><value:$15>に行かれます。<line-break>私どもの調べでは、道中は危険とのこと。<line-break>そこで護衛を依頼したいと思います。<line-break>謝礼として<value:$1A>ギア。<line-break><value:$1B>日以内の到着をお願いします。<end>"
english = "Thank you for your continued patronage. <value:$17><value:$16> will be traveling to <value:$15>. Our inquiries indicate that the road is dangerous, so we would like to hire an escort. Reward: <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250024"]
japanese = "<value:$15>に行くことになったのですが、<line-break>最近は魔物が多くて危ないと聞いています。<line-break>そこで護衛してくれる方を探しています。<line-break>お礼として<value:$1A>ギアを用意しました。<line-break><value:$1B>日以内に到着できるようお願いします。<end>"
english = "I am traveling to <value:$15>, but I hear the recent increase in monsters has made the journey dangerous. I am therefore seeking an escort. Reward: <value:$1A> Gea. Please ensure arrival within <value:$1B> days.<end>"

["250025"]
japanese = "このたび、自治連の<value:$16>が、<line-break><value:$15>まで出向くことになっています。<line-break>その護衛を依頼したいと思います。<line-break><value:$1A>ギア用意しました。<line-break><value:$1B>日以内に到着してください。<end>"
english = "The <value:$16> of the Self-Governance Union will be traveling to <value:$15>. We would like to hire an escort. Reward: <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250026"]
japanese = "村の<value:$17><value:$16>が、<line-break><value:$15>まで出かけるの。でも最近、<line-break>旅行者を襲う奴らの噂をよく聞くの。<line-break>どなたか守ってやってくれませんか？<line-break>少ないけれど、<value:$1A>ギア用意しましたわ。<line-break><value:$1B>日以内に向こうに着けるようにお願いね。<end>"
english = "Please escort the village's <value:$17><value:$16> to <value:$15>; travelers have been attacked lately. It's not much, but we offer <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["250027"]
japanese = "冒険者の方々に依頼したいことがございます。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>まで行く間の護衛です。<line-break>お礼は、<value:$1A>ギア。<line-break>到着日限は、<value:$1B>日以内でどうでしょうか。<line-break>途中にはかなりの危険が考えられます。<line-break>よろしくお願いいたします。<end>"
english = "I have a request for the adventurers. Please escort this town's <value:$17><value:$16> to <value:$15>. Reward: <value:$1A> Gea. Would an arrival deadline of <value:$1B> days be acceptable? Considerable danger is expected along the way. Thank you.<end>"

["250028"]
japanese = "<value:$17><value:$16>が、<line-break><value:$15>まで行くんだが、<line-break>何が起こるかわからんから、護衛を頼みたい。<line-break>報酬は、<value:$1A>ギア。<line-break><value:$1B>日以内に着くのが条件だぜ。<end>"
english = "<value:$17><value:$16> is traveling to <value:$15>, and there's no telling what might happen, so I want an escort. Reward: <value:$1A> Gea. You have to arrive within <value:$1B> days.<end>"

["250029"]
japanese = "この町の<value:$16>が、<line-break>大事な用事で<value:$15>に出かけるんだ。<line-break>でも、戦いの心得があるわけじゃないから、<line-break>襲ってくる奴がいたらどうしようもないよ。<line-break><value:$1A>ギアを払うから、<line-break><value:$1B>日以内に着けるよう護衛を頼むよ。<end>"
english = "This town's <value:$16> is traveling to <value:$15> on important business. Without any combat training, there would be no way to handle an attack. I'll pay <value:$1A> Gea, so provide an escort and arrive within <value:$1B> days.<end>"

["250030"]
japanese = "旅の方の安全をお守りするのも<line-break>我々フゴー宿屋の使命のひとつです。<line-break>このたび<value:$15>に出向かれる<line-break><value:$17><value:$16>様の<line-break>護衛をお願いします。<line-break><value:$1A>ギアで、引き受けていただけませんか？<line-break><value:$1B>日以内に送り届けてください。<end>"
english = "Protecting travelers is one of the missions of Hugo Inn. Please escort <value:$17><value:$16> to <value:$15>. Would you accept the job for <value:$1A> Gea? Complete the journey safely within <value:$1B> days.<end>"

["250031"]
japanese = "私の<value:$17><value:$16>を<line-break><value:$15>まで無事に送り届けてほしい。<line-break>報酬は、<value:$1A>ギア。<line-break>到着期限は、<value:$1B>日以内とする。<end>"
english = "Deliver my <value:$17><value:$16> safely to <value:$15>. Reward: <value:$1A> Gea. Arrival deadline: within <value:$1B> days.<end>"

["250032"]
japanese = "<value:$15>まで<line-break>無事に送り届けてもらえませんか？<line-break>お礼は、<value:$1A>ギアです。<line-break><value:$1B>日以内に向こうに着きたいので、<line-break>よろしくお願いします。<end>"
english = "Could you deliver me safely to <value:$15>? Reward: <value:$1A> Gea. I want to arrive within <value:$1B> days, so please help.<end>"

["250033"]
japanese = "道中の危険を排除する勇者を募集する。<line-break>精強な戦士諸君の応募を心待ちにしている。<line-break>護衛対象：<value:$17><value:$16><line-break>目的地\u3000：<value:$15><line-break>到着期限：<value:$1B>日以内<line-break>報酬\u3000\u3000：<value:$1A>ギア<end>"
english = "Heroes wanted to eliminate danger along the road. We eagerly await applications from mighty warriors. Escort target: <value:$17><value:$16>. Destination: <value:$15>. Arrival deadline: within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["250034"]
japanese = "市民ギルドの<value:$16>が、<line-break><value:$15>に行くことになりました。<line-break>道々のことを考えると、<line-break>護衛をつけたほうがいいと思いましてね。<line-break><value:$1A>ギアさしあげますので、<line-break><value:$1B>日以内に連れていってもらえませんか？<end>"
english = "The Citizens' Guild's <value:$16> will be traveling to <value:$15>. Considering the road ahead, we believe an escort would be wise. We'll pay <value:$1A> Gea. Could you get the traveler there within <value:$1B> days?<end>"

["250035"]
japanese = "ちょっと用事がありましてね、<line-break><value:$15>まで人をやらねばなりません。<line-break>でも、途中は危険がいっぱいなんですよ。<line-break>そんなわけで、村の<value:$16>を<line-break>守ってください。<line-break>報酬は、<value:$1A>ギアです。<line-break><value:$1B>日以内に着けるように頼みますよ。<end>"
english = "We have some business in <value:$15> and must send someone there, but the road is full of danger. Please protect the village's <value:$16>. Reward: <value:$1A> Gea. Please arrive within <value:$1B> days.<end>"

["250036"]
japanese = "近頃、旅の道程はたいへん物騒です。<line-break>この町の<value:$17><value:$16>が、<line-break><value:$15>に行くまでの護衛を<line-break>どなたかしていただけませんか。<line-break><value:$1A>ギアを支払いましょう。<line-break><value:$1B>日以内にこなせる方にお願いします。<end>"
english = "Travel has become terribly dangerous lately. Would someone please escort this town's <value:$17><value:$16> to <value:$15>? Payment: <value:$1A> Gea. Please accept only if you can complete the job within <value:$1B> days.<end>"

["250037"]
japanese = "この町の<value:$17><value:$16>が、<line-break><value:$15>に向かうんだが、<line-break>途中にはモンスターやら盗賊やらが出るんで、<line-break>１人じゃ危なくていけねぇ。<line-break>で、護衛をお願いしてぇんだわ。<line-break><value:$1A>ギア用意したからよ。<line-break><value:$1B>日以内に到着させてやってくれ。<end>"
english = "This town's <value:$17><value:$16> is headed to <value:$15>, but monsters and bandits appear along the way, making it too dangerous to travel alone. So I need an escort. I've prepared <value:$1A> Gea. Get the traveler there within <value:$1B> days.<end>"

["250038"]
japanese = "<value:$15>にいる人に用事があるんで、<line-break>この町の<value:$16>が<line-break>行くことになったんだ。<line-break>でも、近ごろは街道も危険だからね。<line-break>護衛をつけたいと思うのさ。<line-break><value:$1A>ギア出すよ。<line-break><value:$1B>日以内に連れていってくれよな。<end>"
english = "We have business with someone in <value:$15>, so this town's <value:$16> is going there. The highways have been dangerous lately, so I want to arrange an escort. I'll pay <value:$1A> Gea. Get the traveler there within <value:$1B> days.<end>"

["250039"]
