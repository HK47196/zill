["870017"]
japanese = "あたし、カルラ。<line-break>ブゾリの上司。ボス。偉い人。\u3000<line-break>\u3000<line-break>ディンガルの東方攻略軍司令。<line-break>でもって青竜将軍。<line-break>ヨロシクぅ。<end>"
english = "I'm Karula. Buzori's superior. The boss. The big shot. Commander of Dyneskal's Eastern Campaign Army, and Azure Dragon General. Nice to meet you.<end>"

["870018"]
japanese = "ブゾリって、たぶん、<line-break>あんたみたいなの好みだよ。<end>"
english = "I bet you're just Buzori's type.<end>"

["870019"]
japanese = "だって、これ見てよ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>光太子ルグの絵。<line-break>\u3000<line-break>あんたに会ったとき、<line-break>どっかで見た感じだなって思ったら、<line-break>あんた、光太子ルグに似てるのよ。<end>"
english = "Just look at this. It's a portrait of Lug, the Prince of Light. When I met you, you seemed familiar somehow. Now I know why: you look like Lug.<end>"

["870020"]
japanese = "知らないの？\u3000光太子ルグってのはね。<line-break>魔王バロルの息子よ。<line-break>\u3000<line-break>美少年で理想家で正義の人でやさしくて<line-break>思いやりがあって、民にも人気があって<line-break>切れ者だったってゆーわね。<end>"
english = "You don't know? Lug, the Prince of Light, was the son of Balor, Demon King. They say he was a beautiful boy: an idealist, just, kind, thoughtful, popular with the people, and clever, too.<end>"

["870021"]
japanese = "そんな坊やは長生きできないものよ。\u3000<line-break>オヤジに逆らって、<line-break>殺されちゃったわ。<end>"
english = "Boys like that never live long. He defied his old man and got himself killed.<end>"

["870022"]
japanese = "うっそー。ベドブの絵まで<line-break>飾ってあんじゃん。悪趣味ー。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ベドブってのは、ルグの側近で乳兄弟。<line-break>絶世の美少年で、愛の狩人って<line-break>異名もあったくらい。<end>"
english = "No way. There's even a portrait of Bedb hanging here. What awful taste. Bedb was Lug's close attendant and milk brother. He was said to be the most beautiful boy alive. They even called him the Hunter of Love.<end>"

["870023"]
japanese = "切れ者で、まぁ、ネメア様に対する<line-break>ベルゼーヴァみたいな感じね。<line-break>要するに、あんな感じの関係。<end>"
english = "Sharp, too. Sort of like Beelzeva is to Lord Nemea. You know, that kind of relationship.<end>"

["870024"]
japanese = "ま、ベルゼーヴァほど、<line-break>忠義じゃなかったみたいだけどね。\u3000\u3000<line-break>\u3000<line-break>ルグがバロルに刃向かって、<line-break>バロルにルグが殺されたとき、<line-break>自分だけは逃げて助かったみたいだし。<end>"
english = "Though he doesn't seem to have been as loyal as Beelzeva. When Lug rebelled against Balor and Balor killed him, Bedb apparently escaped and saved his own skin.<end>"

["870025"]
japanese = "民衆っておバカだからあ、<line-break>ルグみたいなのに<line-break>すぐ肩入れすんじゃん？<line-break>だからベドブのほうは<line-break>とばっちり食らって、伝説ではね、<line-break>その後ガマガエルになったって言うわ。<end>"
english = "The masses are so stupid. They're always quick to take the side of someone like Lug, aren't they? So Bedb got caught in the backlash. Legend says he became a toad afterward.<end>"

["870026"]
japanese = "…にしても、<line-break>このあたしを待たすだなんて。\u3000\u3000<line-break>\u3000<line-break>あのブタガエルも<line-break>本物のガマガエルに<line-break>変えちゃらにゃいかんみたいやね。<end>"
english = "Still, making me wait like this... Looks like I'll have to turn that pig-frog into a real toad.<end>"

["870027"]
japanese = "たぶん、待ってても無駄よー。<line-break>どっかで賄賂もらってるか、<line-break>悪巧みしてるかだから。<end>"
english = "Waiting's probably pointless. Probably off somewhere taking bribes or plotting something nasty.<end>"

["870028"]
japanese = "じゃね。<end>"
english = "See you.<end>"

["870029"]
japanese = "はっ！\u3000<value:$28>様<line-break>どうぞ、お通りください！<end>"
english = "Yes, <value:$28>! Please, go right in!<end>"

["870030"]
japanese = "ルグ様…、もう少しです。<line-break>本来ディンガルの帝座にあるべきは…<line-break>\u3000<line-break>ザギヴの小娘でも、ネメアでも<line-break>カルラでも、エリュマルクでもない。<line-break>ルグ様…あなただったはずなのです。<end>"
english = "Lord Lug... it will not be much longer. Dyneskal's imperial throne was never meant for that Zagiv girl, nor for Nemea, Karula, or Eryumark. Lord Lug... it should have been yours.<end>"

["870031"]
japanese = "あなたがバロル帝に反旗を翻し、<line-break>敗れ、バロル帝の軍勢に囲まれたとき<line-break>あなたは私を瞬間移動で逃がしました。<line-break>…私はあなたに捨てられたと思いこみ、<line-break>あなたのもとに戻ることなく、魔法で<line-break>姿を変え、生き延びることにしました。<end>"
english = "When you raised the banner of rebellion against Emperor Balor, you were defeated and surrounded by his forces. You teleported me to safety. But I convinced myself that you had cast me aside. Instead of returning to you, I used magic to change my form and chose to survive.<end>"

["870032"]
japanese = "その時の失敗でこの醜い姿になったのも<line-break>当然のことだったのですね…。だって<line-break>私は本当に愚かだったんですから…。<line-break>命がけで守るべきものなんて存在しない<line-break>…そんな愚かなことを自暴自棄になって<line-break>そのときは、信じていたのですから…。<end>"
english = "It was only fitting that my failure then left me in this hideous form. I truly was a fool. In my despair, I believed there was nothing worth protecting with my life. Such utter foolishness.<end>"

["870033"]
japanese = "そんな私にあのコが教えてくれました。<line-break>あなたの姿をしたあのコが<line-break>すさんでいた私に教えてくれました。<line-break>私が間違っているって…。<line-break>命がけで守るものが存在しない人生…<line-break>そんなものに生きる価値はありません。<end>"
english = "Then that child taught me. That child who looked like you showed me, bitter as I had become, that I was wrong. A life with nothing worth risking your life to protect is no life worth living.<end>"

["870034"]
japanese = "ルグ様、私はあのコを帝位につけます。<line-break>あなたではなくあのコを帝位につけ、<line-break>そして、今度こそ、守って見せます…。<end>"
english = "Lord Lug, I will place that child upon the imperial throne. Not you, but that child. And this time, I will protect that child.<end>"

["870035"]
japanese = "ありゃ、<value:$28>じゃん。<line-break>元気ぃ？<end>"
english = "Well, look who it is. How've you been, <value:$28>?<end>"

["870036"]
japanese = "それは、結構。<line-break><value:$28>はあたしの<line-break>部下なんだから、<line-break>いざというときのために<line-break>体調を整えておいてよね。<end>"
english = "Good. You're under my command, <value:$28>, so keep yourself in fighting shape for when the time comes.<end>"

["870037"]
japanese = "とは、言っても次の戦いまで、<line-break>もうちょいかかるから<line-break>しばらくは冒険を続けてて。<line-break>そんじゃ、そういうことで<line-break>ばりばり腕を上げちゃって<line-break>ちょうだいな。<end>"
english = "That said, it'll be a little while before the next battle, so keep adventuring in the meantime. Off you go, then. Make sure you really hone those skills.<end>"

["870038"]
japanese = "ちょっと、ちょっと。<line-break>あたし、言わなかったけ？<line-break>あたしの前では元気出してよね。<line-break>あまり元気そうじゃないと、<line-break>周りにいる人間にも伝染して、<line-break>やる気が下がっちゃうんだよね。<end>"
english = "Hey, wait a minute. Didn't I tell you? Try to perk up when you're around me. If you don't look lively enough, it rubs off on everyone else and saps their motivation.<end>"

["870039"]
japanese = "まぁ、それ以上に<line-break>あたし嫌いなんだけどね。<line-break>くよくよしてる奴、見るの。<end>"
english = "More importantly, I just hate looking at people who sit around moping.<end>"

["870040"]
japanese = "そんで、せっかく来てもらったけど、<line-break>まだ、しばらく戦争やんないから、<line-break>冒険を続けてて。<line-break>そんじゃ、そういうことで<line-break>ばりばり腕を上げちゃって<line-break>ちょうだいな。<end>"
english = "Anyway, I appreciate you coming, but we won't be going to war for a while yet, so keep adventuring. Off you go, then. Make sure you really hone those skills.<end>"

