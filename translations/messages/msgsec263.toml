["2630001"]
japanese = "ふむ、お主の仲間の女性が<line-break>ほほに傷のある男を捜しておって<line-break>それが、わしではないかと？<end>"
english = "Hmm. A woman among your companions is looking for a man with a scar on his cheek, and you think that man might be me?<end>"

["2630002"]
japanese = "わーはっはっはっ。<line-break>いくらなんでもそれは<line-break>人違いじゃろう。<line-break>確かにわしの顔にも傷はあるが、<line-break>女性に捜してもらえるほどの<line-break>色男ではないぞ。<end>"
english = "Wah-ha-ha-ha! Surely you have the wrong man. True, I have a scar on my face, but I am hardly handsome enough to have a woman searching for me.<end>"

["2630003"]
japanese = "ほほに傷のある男なら、<line-break>他にひとり知っておる。<line-break>興味があるのなら案内して進ぜよう。<end>"
english = "I do know one other man with a scar on his cheek. If you are interested, I shall take you to him.<end>"

["2630004"]
japanese = "このクリスタルに入っている男の名は<line-break>ジリオン…。お主と同じく、<line-break>無限のソウルの持ち主じゃった。<line-break>かつてロストールの王権をめぐる<line-break>テジャワの変という争乱があってな。<line-break>ジリオンはそれに巻きこまれたのよ。<end>"
english = "The man within this crystal is named Zillion. Like you, he possessed an Infinite Soul. Long ago, there was a conflict over the throne of Rostorl known as the Tejava Incident. Zillion was caught up in it.<end>"

["2630005"]
japanese = "当時、ジリオンと親しかった女の子…。<line-break>イーシャという娘がおってな。<line-break>\u3000<line-break>彼女はテジャワの変の果てに<line-break>悪人の手でソウルを切り離されたのだ。<line-break>\u3000<line-break>無論、ソウルを失えばその娘は消滅じゃ。<line-break>そこでジリオンは決断を下した。<line-break>\u3000<line-break>自分のソウルと闇の神器・同化の髪飾りの<line-break>力を使ってイーシャの想いを支え、<line-break>彼女の命を存続させることを、な。<line-break>同化の髪飾りは確かにどんな欲望も<line-break>かなえるが、その欲望が<line-break>満たされることは決してない…。<end>"
english = "At the time, there was a girl named Iria who was close to Zillion. By the end of the Tejava Incident, an evildoer had severed her Soul from her. Without her Soul, of course, Iria would cease to exist. So Zillion made his choice: he would use his own Soul and the power of the Dark Artifact known as the Hair Ornament of Assimilation to sustain Iria's inner life and keep her alive. The Hair Ornament of Assimilation can grant any desire, but it can never satisfy it.<end>"

["2630006"]
japanese = "かくて、ジリオンの<line-break>イーシャを救いたいという願いは<line-break>かなった。<line-break>じゃが、ジリオン自身は、こうして<line-break>イーシャと言葉を交わすこともできず、<line-break>クリスタルの中で眠り続けておる。<line-break>まったく因果な宿命よ。<line-break>でも、それがジリオンの望んだ道<line-break>だったのじゃ。<end>"
english = "And so Zillion's wish to save Iria was granted. Yet Zillion himself cannot even speak with her. He remains asleep within the crystal, just as you see him now. A cruel fate indeed. But it was the path Zillion chose.<end>"

["2630007"]
japanese = "おっと、今の話はジリオンから<line-break>固く口止めされておるから、<line-break>くれぐれも内密にな。<line-break>お主は信頼のおける人間だと<line-break>思ったからこそ教えたんじゃ。<line-break><line-break>さあ、長居は無用じゃ。行こうか。<end>"
english = "Oh! Zillion told me in no uncertain terms not to tell anyone what I just told you, so keep it strictly between us. I only told you because I thought you could be trusted. Now, there's no point lingering here. Shall we go?<end>"

