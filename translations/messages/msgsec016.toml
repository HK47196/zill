english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160119"]
japanese = "エルフが住んでいるといわれる４つの森<line-break>のひとつ。<line-break>森の奥の方に紫色のヤンバイ草が群生し<line-break>ている。<line-break><end>"
english = "One of four forests said to be inhabited by Elves. Purple Yanbai Herb grows in abundance deep in the forest.<end>"

