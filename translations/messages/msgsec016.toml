english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160121"]
japanese = "同じような風景が続く、迷路のような洞<line-break>窟。<line-break>最深部に宝石のように輝くコロル石の鉱<line-break>脈がある。<line-break><end>"
english = "A maze-like cave where the scenery seems to repeat endlessly. At its deepest point is a vein of Korol Stone that gleams like gemstones.<end>"

["160122"]
japanese = "入口あたりは安全だが、奥には行かない方がいい<line-break>ぜ。いきなりモンスターが強くなるからな。<end>"
english = "It's safe around the entrance, but you shouldn't go any deeper. The monsters suddenly get much stronger.<end>"

["160123"]
japanese = "エンシャント旧市街にある古い塔。１２<line-break>００年以上前に建設され、魔道研究の中<line-break>心となっていたが、今は廃墟となってい<line-break>る。闇に咲く赤い闇中花を採取できる。<line-break><end>"
english = "Ancient Old Town's tower is over 1,200 years old. Once a magic research center, it is now ruined. Red Darkblooms grow in darkness and can be gathered.<end>"

