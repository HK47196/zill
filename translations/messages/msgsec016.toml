["160090"]
japanese = "冒険に慣れてきたころに行くといいぜ。<line-break>いい訓練になる。<end>"
english = "Go once you've gotten used to adventuring. It'll be good training.<end>"

["160091"]
japanese = "大陸一広大で非常に迷いやすい森。<line-break>森の中には、太い幹のトヅカネの木や、<line-break>紫色のハヤスの葉、日当たりのよいとこ<line-break>ろに生えるキッカネの香草が見られる。<line-break><end>"
english = "The continent's largest forest, and easy to get lost in. Thick Tozukane trees, purple Hayasu Leaves, and sunny Kikkane Herbs grow here.<end>"

["160092"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160093"]
japanese = "廃墟同然の古い塔。なんのために建てら<line-break>れたのかは不明。何者かが住み着いてい<line-break>るという噂がある。きれぐもの巣と風旅<line-break>鳥の羽が採取できる。<line-break><end>"
english = "An old tower, nearly a ruin. Its purpose is unknown, and someone is rumored to live there. Kiregumo Nests and Windfarer Feathers can be gathered.<end>"

["160094"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160095"]
japanese = "最近、竜王の覚醒の際に噴火があった。<line-break>頂上付近では、今も溶岩が湧き出してい<line-break>て、貴重な資源である炎竜岩を採取でき<line-break>る。<line-break><end>"
english = "The Dragon King's Awakening recently caused an eruption. Lava still wells up near the summit, where valuable Flame Dragon Rock can be gathered.<end>"

["160096"]
japanese = "そこそこ強けりゃ途中までは行けるだろうが…。<line-break>悪いことは言わん。奥まではやめときな。<end>"
english = "If you're reasonably strong, you can probably make it partway in... But take my advice: don't venture into the depths.<end>"

["160097"]
japanese = "岩の間から立ちのぼる噴煙で、山全体が<line-break>煙に包まれている。火属性のモンスター<line-break>が多く棲息している。<line-break>まれに錬剛石が落ちていることがある。<line-break><end>"
english = "Smoke rising from between the rocks shrouds the entire mountain. Many Fire-element monsters live there. Tempering Stones can occasionally be found as well.<end>"

["160098"]
japanese = "駆け出しの冒険者が行っても大丈夫なところ<line-break>だよ。慣れてきたら奥まで行ってみな。<end>"
english = "It's safe enough for a novice adventurer. Once you've got some experience, try going all the way in.<end>"

["160099"]
japanese = "谷底には巨大な生物の骨と洞窟がある。<line-break>谷に下りる途中、風桜の木が自生してい<line-break>て、その黄色い実を採取できる。<line-break><line-break><end>"
english = "Gigantic creature bones and a cave lie at the valley floor. Windcherry trees grow on the descent; their yellow fruit can be gathered.<end>"

["160100"]
japanese = "駆け出しの冒険者が行っても大丈夫なところ<line-break>だよ。慣れてきたら奥まで行ってみな。<end>"
english = "It's safe enough for a novice adventurer. Once you've got some experience, try going all the way in.<end>"

["160101"]
japanese = "谷の入り口にたくさんの穴があいている<line-break>巨大な風気岩が露出している。北の谷間<line-break>と同様に、風桜が自生している。<line-break>谷底には小さな洞窟がある。<line-break><end>"
english = "At the entrance stands a huge, hole-riddled Windstone. As in North Valley, Windcherry trees grow here. A small cave lies on the valley floor.<end>"

["160102"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160103"]
japanese = "ふもとには涌き水があり、そこから<line-break>ハッケエの滴が採取できる。<line-break>風精の結晶の主要な産地でもある。<line-break>まれに錬剛石が落ちていることもある。<line-break><end>"
english = "A spring at the foot yields Hakkee Droplets. It is also a major source of Wind Spirit Crystals; Tempering Stones are sometimes found there.<end>"

["160104"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160105"]
japanese = "ラミリー山から吹き下ろす風がたまり、<line-break>風の属性が強い荒野。<line-break>ラミリー山側の崖の近くに、サマシごけ<line-break>が繁茂しているところがある。<line-break><end>"
english = "A Wind-aligned wasteland where winds from Mount Ramiri collect. Samashi Moss grows thickly by the cliffs on the Mount Ramiri side.<end>"

["160106"]
japanese = "冒険に慣れてきたころに行くといいぜ。<line-break>いい訓練になる。<end>"
english = "Go once you've gotten used to adventuring. It'll be good training.<end>"

["160107"]
japanese = "多数のモンスターが住みついている。<line-break>洞窟の中ほどには、宝石のように輝くコ<line-break>ロル石の鉱脈が存在する。<line-break>洞窟の最深部には、大きな空洞がある。<line-break><end>"
english = "Many monsters live here. A gemstone-like Korol Stone vein runs through the cave's middle; a large chamber lies at its deepest point.<end>"

["160108"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160109"]
japanese = "洞窟最深部に海へと続く地底湖がある。<line-break>そのためか水属性のモンスターが住みつ<line-break>いている。洞窟の中ほどには、宝石のよ<line-break>うに輝くコロル石の鉱脈がある。<line-break><end>"
english = "At the cave's deepest point is a sea-linked lake, perhaps drawing Water-element monsters. A gemstone-like Korol Stone vein runs through its middle.<end>"

["160110"]
japanese = "駆け出しの冒険者が行っても大丈夫なところ<line-break>だよ。慣れてきたら奥まで行ってみな。<end>"
english = "It's safe enough for a novice adventurer. Once you've got some experience, try going all the way in.<end>"

["160111"]
japanese = "テラネの東にある山。大陸一の標高を誇<line-break>る。中腹にはノトゥーン神殿があり、多<line-break>くの巡礼者が訪れる。<line-break><line-break><end>"
english = "A mountain east of Terane and the tallest on the continent. Notun Temple stands halfway up its slopes and is visited by many pilgrims.<end>"

["160112"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160113"]
japanese = "最深部に墓地があるため、土地の人はあ<line-break>まり近寄ろうとはしない。この墓地がい<line-break>つの時代の誰のためのものなのかはわか<line-break>っていない。<end>"
english = "Locals avoid it because a graveyard lies at its deepest point. No one knows its era or for whom it was built.<end>"

["160114"]
japanese = "出てくるモンスターも強くないし、<line-break>駆け出しの冒険者が行っても大丈夫だな。<end>"
english = "The monsters there aren't very strong. Even a novice adventurer should be fine.<end>"

["160115"]
japanese = "エルフが住んでいるといわれる４つの森<line-break>のひとつ。人の手が入り始めているせい<line-break>かエルフの痕跡はほとんど見られない。<line-break>紫色をしたヤンバイ草を採取できる。<line-break><end>"
english = "One of four forests said to house Elves. Human encroachment may explain why almost no Elven trace remains. Purple Yanbai Herb can be gathered.<end>"

