["740000"]
japanese = "アーギルシャイアメッセージvol6開始<end>"
english = ""

["740001"]
japanese = "…俺、どうにも<line-break>セラって苦手なんだよな。<end>"
english = "I just can't seem to get along with Sera.<end>"

["740002"]
japanese = "へへっ、こっちから、働きかけないで<line-break>うち解けられるかよ。バーカ。<end>"
english = "Heh. How are we supposed to get to know him if we don't make the first move, idiot?<end>"

["740003"]
japanese = "ヴァンほどのバカならさ、<line-break>バカやってもバカで済むけど…<line-break>\u3000<line-break>俺、やっぱ、うちとけるために<line-break>セラにバカなことやるのって<line-break>ヤバい気がするんだけどな。<end>"
english = "Van can act like an idiot and get away with it because he is one. But doing something stupid just to get closer to Sera? I've got a bad feeling about that.<end>"

["740004"]
japanese = "ノーブルで悪代官相手にやりあってた<line-break>奴が、ビビってんじゃねえよ。いくぜ。<end>"
english = "You stood up to that crooked magistrate in Noble. Don't start quaking now. Come on.<end>"

["740005"]
japanese = "はい！\u3000ちょっとかっこいい冒険者の<line-break>女性に対する意識調査に参りました！<line-break>\u3000<line-break>ちょっとニヒルで、影があり<line-break>そして、愛想はメチャクチャ悪い、<line-break>カッコいい冒険者の代表セラさん！<end>"
english = "Hello! We're here to survey one rather dashing adventurer on his opinions of women! Sera, our model dashing adventurer: a touch cynical, a little mysterious, and spectacularly unfriendly!<end>"

["740006"]
japanese = "一緒に冒険する女性冒険者は<line-break>果たして彼の目にはどう映っているか！<line-break>さっそく聞いてみましょう！<end>"
english = "How does he see the female adventurers who travel with him? Let's find out!<end>"

["740007"]
japanese = "…バカどもが、<line-break>何をバカなことを。<end>"
english = "Fools. What is this idiocy?<end>"

["740008"]
japanese = "アイリーンさんはどうですか？<end>"
english = "What do you think of Irene?<end>"

["740009"]
japanese = "頭でっかちの理屈倒れだ。<line-break>意地とプライドだけの女だな。<line-break>\u3000<line-break>これなら、<line-break>あの女の師のオッシという奴も<line-break>大した奴ではないな。<end>"
english = "She's all theory and no substance, with nothing but stubbornness and pride. Judging by that, her master, this Ossi fellow, can't amount to much either.<end>"

["740010"]
japanese = "うーん、しょっぱなから<line-break>辛口だ～！<end>"
english = "Ooh, starting off harsh!<end>"

["740011"]
japanese = "ユーリスさんは<line-break>どうでしょうか。<end>"
english = "What about Julls?<end>"

["740012"]
japanese = "…バカは嫌いだ。<end>"
english = "I hate fools.<end>"

["740013"]
japanese = "一刀両断ですね～！<end>"
english = "Cut down in one stroke!<end>"

["740014"]
japanese = "エステルさんは、どうでしょう？<end>"
english = "And what about Esther?<end>"

["740015"]
japanese = "…うざい。<end>"
english = "Annoying.<end>"

["740016"]
japanese = "うわ、ひどい。<end>"
english = "Wow. That's cruel.<end>"

["740017"]
japanese = "オイフェさんは<line-break>どうでしょうかね～。<end>"
english = "So, what about Aoife?<end>"

["740018"]
japanese = "…頭に血が上りやすいエルフとは<line-break>珍品だな。それ以上に迷惑な女だ。<line-break>それだけだ。<end>"
english = "A hotheaded Elf is quite the curiosity. More than that, she's a nuisance. That is all.<end>"

["740019"]
japanese = "本人がいたら、<line-break>血の雨が降るな。<end>"
english = "If she were here, we'd be in for a bloodbath.<end>"

["740020"]
japanese = "カルラはどうでしょうか？<end>"
english = "What about Karula?<end>"

["740021"]
japanese = "…あの女については常識を疑う。<line-break>もっとも、常識なんてものを<line-break>装備しているとは思えないがな。<end>"
english = "I question whether that woman has any common sense. Then again, I doubt she comes equipped with such a thing.<end>"

["740022"]
japanese = "言いたい放題だな…。<end>"
english = "He's saying whatever he pleases.<end>"

["740023"]
japanese = "ザギヴはどうでしょうか？<end>"
english = "What about Zagiv?<end>"

["740024"]
japanese = "…ダメな女の見本だな。<end>"
english = "A perfect example of a hopeless woman.<end>"

["740025"]
japanese = "うわ！\u3000勇者だな、セラって！<line-break>ザギヴは怒らせたら恐いんだぞ…。<end>"
english = "Whoa! Sera's got guts! Zagiv's terrifying if you make her angry...<end>"

["740026"]
japanese = "フェティはどんなもんでしょう。<end>"
english = "What do you make of Fety?<end>"

["740027"]
japanese = "…お前にきいてやる。<line-break>どうなのだ？<end>"
english = "I'll ask you instead. What do you think?<end>"

["740028"]
japanese = "え、へへっ！<line-break>ちょっと…、ちょっと…かな。<end>"
english = "Huh? Heh! Maybe a little... just a little.<end>"

["740029"]
japanese = "俺は、かなり、<line-break>あるいは、まったく、だ。<end>"
english = "For me, quite a lot―or completely.<end>"

["740030"]
japanese = "とりつくしまもない…。<end>"
english = "There's no getting through to him...<end>"

["740031"]
japanese = "ルルアンタは、どうっすか？<end>"
english = "How about Lulluantha?<end>"

["740032"]
japanese = "さすがはリルビーだ。<line-break>媚びを売るのがうまい。<end>"
english = "A true Lilbie. She knows how to ingratiate herself.<end>"

["740033"]
japanese = "あのルルアンタのことを<line-break>ここまで悪くとれるとは…<line-break>セラ…おそるべし！<end>"
english = "To think anyone could see even Lulluantha in such a bad light... Sera is terrifying!<end>"

["740034"]
japanese = "ダメだぜ、ヴァン。<line-break>ちっとも、話がはずまない。<end>"
english = "This is no good, Van. The conversation's going nowhere.<end>"

["740035"]
japanese = "バカ、女なら<line-break>もう１人いるだろ。<end>"
english = "Idiot. There's one more woman, isn't there?<end>"

["740036"]
japanese = "え、姉ちゃんのこともきくの？<line-break>やめようぜ、ヴァン。<end>"
english = "What, you're asking about my big sis too? Let's not, Van.<end>"

["740037"]
japanese = "なに言ってんだよ。<line-break>アレだって女だぞ。<end>"
english = "What are you talking about? That thing's a woman too.<end>"

["740038"]
japanese = "えー、では<value:$28>さんは<line-break>いかがでしょうか？\u3000セラさん。<end>"
english = "Well then, Sera, what do you think of <value:$28>?<end>"

["740039"]
japanese = "…<value:$28>、か。<line-break>凶暴な女だな。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ま、最近はだいぶ<line-break>かわいらしくなってきた<line-break>感じがするがな。<end>"
english = "<value:$28>, huh? A violent woman. Still, she does seem to have gotten a lot cuter lately.<end>"

["740040"]
japanese = "え？<line-break>ほめた？<end>"
english = "Huh? Was that a compliment?<end>"

["740041"]
japanese = "…ひ、ヒヨッコどもは<line-break>さっさと寝ろ。<end>"
english = "Y-you greenhorns, get to bed.<end>"

["740042"]
japanese = "ププッ…、おっもしれえー！<line-break>今の聞いたかよ、チャカ？<end>"
english = "Pfft... This is hilarious! Did you hear that, Chaka?<end>"

["740043"]
japanese = "ヴァンのバカヤロウ！<line-break>つまり…、つまり、セラは…！<line-break>\u3000<line-break>ああ、くそっ！\u3000だから<line-break>姉ちゃんのことは<line-break>ききたくなかったんだよぉ！<end>"
english = "You idiot, Van! That means... that means Sera...! Ah, hell! This is why I didn't want to ask about my big sis!<end>"

["740044"]
japanese = "チャカのアレも、ホント<line-break>どうしようもないな。<end>"
english = "That thing with Chaka really is hopeless.<end>"

