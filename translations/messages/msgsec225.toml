["2250000"]
japanese = "名脇役ガルドラン物語3用開始<end>"
english = ""

["2250001"]
japanese = "ふっ、また会ったな。<line-break>困った奴め…。<line-break>\u3000<line-break>隠すことはない！<line-break>未来の勇者が気になって気になって<line-break>追いかけてきてしまったのだな。<end>"
english = "Heh, we meet again. What am I going to do with you...? No need to hide it! You couldn't stop thinking about the future Hero, so you came chasing after me.<end>"

["2250002"]
japanese = "ふっ、何も恥ずかしがることはない。<line-break>貴様のような思春期によくあることだ。<line-break>病気ではないから心配するな！<line-break>そんな貴様たちに教えておこう！<line-break>憧れだけではどうにもならない<line-break>厳しい「勇者の条件」を！<end>"
english = "Heh, there's nothing to be ashamed of. It's perfectly common at your age. It's not an illness, so don't worry! Now let me teach you both something: the stringent conditions for becoming a Hero―conditions that mere admiration can never satisfy!<end>"

["2250003"]
japanese = "ふはは！\u3000思うさま悩むがいい！<line-break>このガルドラン様のことで<line-break>頭も胸もいっぱいにするがいいさ！<line-break>だが、俺様は、今、急いでいる。<line-break>待っていられないから答えを教えよう。<line-break>さあ、よく聞くがいい、感謝と共に！<end>"
english = "Fwahaha! Agonize over it to your heart's content! Fill your head and heart with thoughts of the great Girldlan! But I am in a hurry, and I cannot wait for you to work it out. So I shall give you the answer. Listen well―and be grateful!<end>"

["2250004"]
japanese = "勇者の条件…<line-break>それは勇者を心から慕う美しい王女！<line-break>それが答えだ！俺様のことを激しく慕いながら、<line-break>身分の壁に阻まれて、告白もできず<line-break>俺様に小さな胸を震わせる王女だ！<end>"
english = "The requirement of a Hero... is a beautiful princess who adores him with all her heart! That is the answer! A princess who yearns passionately for me, yet cannot confess her love because the barrier of rank stands between us, leaving her little bosom trembling for me!<end>"

["2250005"]
japanese = "アキュリースにひとり、<line-break>美しい巫女がいるという…。<line-break>彼女こそ、俺様を慕う王女に違いない！<line-break>だから、急いで彼女のもとへ<line-break>俺様は伝えにゆかねばならぬのだ！<line-break>勇者は身分の壁など軽く越えられると！<end>"
english = "They say there is a beautiful Priestess in Aqyurius... She must be the princess who adores me! I must hurry to her side and tell her that no barrier of rank can stand in a Hero's way!<end>"

["2250006"]
japanese = "ふっ、その点、俺様にぬかりはない！<line-break>ロストールの王女の所にはもう行った！<line-break>無粋な衛兵に阻まれてしまったがな。<line-break>そこで、ロストールの王女には悪いが<line-break>勇者を慕う王女はここの巫女に決めた。<line-break>巫女でも王女でも、俺様には変わらん！<end>"
english = "Hah! I have already seen to that! I went to the princess of Rostorl, but some boorish guards barred my way. So, with apologies to her, I have decided that the princess who adores the Hero shall be the priestess here. Priestess or princess, it makes no difference to me!<end>"

["2250007"]
japanese = "全然、違うと思うけど…。<end>"
english = "I don't think that's right at all...<end>"

["2250008"]
japanese = "小さい…。<line-break><line-break><line-break>小さいぞ、小僧オオオオ！！<line-break>勇者になりたければ<line-break>もっと大局的に物事を見るのだ！<end>"
english = "Such small thinking... Too small, booooooy! If you wish to become a Hero, you must learn to see the larger picture!<end>"

["2250009"]
japanese = "そりゃあ、勇者には憧れるけど…。<line-break>そもそもボクだって<line-break>その巫女のひとりなんだよね…。<end>"
english = "I mean, I do admire Heroes... But I'm one of those Priestesses myself, you know...<end>"

["2250010"]
japanese = "ワーハッハッハッ。<line-break>小僧、これも教えておくぞ。<line-break>巫女とは、女性だ。<end>"
english = "Wahahahaha! Boy, let me teach you one more thing. Priestesses are women.<end>"

["2250011"]
japanese = "それとも、俺様に憧れるあまり、<line-break>俺様の恋人になろうと思ってるのか！？<line-break>恐ろしい…恐ろしい妄想だぞ、小僧！<end>"
english = "Or do you admire me so much that you intend to become my sweetheart?! What a horrifying... truly horrifying fantasy, boy!<end>"

["2250012"]
japanese = "そ、そんなこと言われても…。<end>"
english = "I-I don't know what you expect me to say to that...<end>"

["2250013"]
japanese = "小僧！\u3000勇者になりたければ<line-break>ごちゃごちゃ言いわけはするな！<line-break>男らしくないぞ！<end>"
english = "Boy! If you wish to become a Hero, stop making excuses! It's unmanly!<end>"

["2250014"]
japanese = "お、男らしくないって…！？<end>"
english = "U-unmanly?!<end>"

["2250015"]
japanese = "おっと、こうしてはおれん！<line-break>この間にも巫女は俺様に恋焦がれて<line-break>心を痛めているのだった！<line-break>さあ、巫女よ、可憐な胸をときめかせ、<line-break>勇者の熱き魂みなぎる両腕に<line-break>飛びこんでくるがいい！<end>"
english = "Ah, I have no time to waste! Even now, the Priestess is pining for me, her heart aching with love! Come, fair Priestess! Let your tender heart race, and fling yourself into these arms, surging with the fiery spirit of a Hero!<end>"

["2250016"]
japanese = "ううん、大丈夫…。<line-break>あまり気にしてないから…。<line-break>\u3000<line-break>…でも、ボクって、<line-break>他の人には男の子に見えるのかな？<end>"
english = "No, it's all right. It doesn't bother me that much... But do other people really think I look like a boy?<end>"

["2250017"]
japanese = "可愛い女の子だよ<end>"
english = "You're a cute girl.<end>"

["2250018"]
japanese = "見える<end>"
english = "You do.<end>"

["2250019"]
japanese = "エヘヘ…。そうだよね。<line-break>ボク、正真正銘女の子だし。<line-break>ありがとう、<value:$28>。<line-break>あいつのせいで、ちょっと<line-break>自信をなくすところだったよ。<end>"
english = "Hee hee... You're right. I am a girl, through and through. Thanks, <value:$28>. He nearly made me lose confidence in myself.<end>"

["2250020"]
japanese = "どうして？\u3000…どうしてなの？<line-break>そんなに女の子として<line-break>魅力ないかなぁ、ボク…？<end>"
english = "Why? Why do you think so? Am I really that unattractive as a girl...?<end>"

["2250021"]
japanese = "えっ、違う！？\u3000この服が？<line-break>女の子っぽく見えないって？<end>"
english = "What, that's not it?! It's these clothes? They don't make me look feminine?<end>"

["2250022"]
japanese = "…そっか。じゃあ、女の子っぽい服を<line-break>着ていればいいんだね？<end>"
english = "Oh, I see. So I just need to wear something more feminine?<end>"

["2250023"]
japanese = "わかった。<line-break>じゃあ今度、着てくるから、<line-break>楽しみに待っててよ！<end>"
english = "All right. I'll wear something like that next time, so you have that to look forward to!<end>"

