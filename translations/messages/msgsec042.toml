["420000"]
japanese = "リューガ・ボリューム１その１開始<end>"
english = ""

["420001"]
japanese = "今からロストール王妃エリスと会う。<line-break>奴はファーロスの雌狐の異名をとる<line-break>謀略家だ。とにかく、気をつけろ。<end>"
english = "The next meeting is with Queen Eris of Rostorl. She's a master of intrigue, known as the Vixen of Pharos. Whatever you do, keep your guard up.<end>"

["420002"]
japanese = "エリスについてもう少し尋ねる<end>"
english = "Ask more about Eris<end>"

["420003"]
japanese = "うなずく<end>"
english = "Nod<end>"

["420004"]
japanese = "奴は七竜家の筆頭ファーロス家の出だ。<line-break>ファーロス家は権勢がある家柄でな。<line-break>\u3000<line-break>今の王セルモノーもエリスを妻にして<line-break>ファーロス家の後押しを得、<line-break>王位についたほどだ。<end>"
english = "She comes from House Pharos, foremost of the Seven Dragon Houses. House Pharos wields considerable influence. The current king, Selmonor, gained the house's backing by marrying Eris, and that support was enough to put him on the throne.<end>"

["420005"]
japanese = "しかし、実家の力などあの女の謀略に\u3000<line-break>比べれば、大したことはない。<line-break>今の当主ノヴィンは能なしだしな。<line-break>あの女は謀略でふたつの国を滅ぼした。<line-break>おかげで、今や分断の山脈より南は<line-break>すべて、ロストールの勢力下だ。<end>"
english = "But her family's power is nothing beside that woman's gift for intrigue. Its current head, Novin, is an incompetent fool. She brought two countries to ruin through her schemes. Now everything south of the Dividing Mountains lies within Rostorl's sphere of influence.<end>"

["420006"]
japanese = "あの自由都市リベルダムですらも<line-break>有力者であるクロイス家を取り込んで、<line-break>ほぼロストールの勢力下に収めている。<line-break>国内でも、貴族の力をそいで<line-break>王権の強化と中央集権化を進めている。<line-break>これも着実に成果を収めつつある。<end>"
english = "Even the Free City Liberdam has been brought almost entirely into Rostorl's sphere of influence by winning over the powerful Krois family. Within Rostorl itself, she is weakening the nobility while strengthening royal authority and centralizing power. Those efforts, too, are steadily bearing fruit.<end>"

["420007"]
japanese = "そして、奴は娘である王女ティアナを\u3000<line-break>甥であるノヴィンの息子と<line-break>結婚させようとしている。<line-break>つまり、強化された王位を<line-break>ファーロス家に婚姻によって<line-break>継承させようとしているのだ。<end>"
english = "And now she intends to marry her daughter, Princess Tiana, to the son of her nephew Novin. In other words, she means to pass the strengthened crown to House Pharos through marriage.<end>"

["420008"]
japanese = "俺はこれに貴族を率いて反対している。<line-break>そのため、エリスとは対立している。<line-break>だから、奴は俺を消そうとやっきだ。<line-break>俺の領地であるノーブルの反乱も<line-break>その一環に過ぎない。これからも、<line-break>どんな罠が控えているかわからん…。<end>"
english = "I am leading the nobles in opposition to that plan, which has put me at odds with Eris. That is why she is so determined to dispose of me. The uprising in Noble, my own territory, was merely one part of it. There is no telling what traps may still lie ahead.<end>"

["420009"]
japanese = "フッ、何も考えずにうなずくか…。<end>"
english = "Hmph. So you simply nod without giving it any thought.<end>"

["420010"]
japanese = "まあ、根拠のない頼もしさも\u3000\u3000\u3000<line-break>いいものだ。<end>"
english = "Still, there is something reassuring about such utterly baseless confidence.<end>"

["420011"]
japanese = "お待ちしていた、エリエナイ公。<end>"
english = "I have been expecting you, Duke Elienai.<end>"

["420012"]
japanese = "そなたの領地で物騒な事件が<line-break>あったと聞くが？<end>"
english = "I hear there was a troubling incident in your domain. Is that so?<end>"

["420013"]
japanese = "さすがにお耳が早い。<line-break>ノーブルの代官ボルボラが死にました。<end>"
english = "News travels swiftly to Your Majesty. Bolbora, the governor of Noble, is dead.<end>"

["420014"]
japanese = "ほう？<end>"
english = "Oh?<end>"

["420015"]
japanese = "事故死です。<end>"
english = "It was an accident.<end>"

["420016"]
japanese = "フフ、エリエナイ公、<line-break>私は死因までは尋ねてはおらぬが？<end>"
english = "Heh. Duke Elienai, I did not ask how he died.<end>"

["420017"]
japanese = "一応、ご報告申し上げたまで。\u3000\u3000<end>"
english = "I merely thought it best to inform you.<end>"

["420018"]
japanese = "弟エストが処理にあたっています。<line-break>近日中に詳細をご報告できるかと。<end>"
english = "My younger brother Est is handling the matter. I expect to have a full report for you shortly.<end>"

["420019"]
japanese = "では、それを待とう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>しかし、残念なことよ。<line-break>ボルボラに聞きたいことがあったのだが<line-break>むくろを問いただすわけにもいくまい。<end>"
english = "Then I shall wait for it. Still, what a pity. I had questions for Bolbora, but one can hardly interrogate a corpse.<end>"

["420020"]
japanese = "領主の私に<line-break>答えられることでしたら…。<end>"
english = "If they are questions I can answer as his lord...<end>"

["420021"]
japanese = "先日、ボルボラが<line-break>これを送りつけてきた。<end>"
english = "Bolbora sent me this the other day.<end>"

["420022"]
japanese = "今は亡き、先代のエリエナイ公<line-break>…そなたの父上が女に宛てた書簡だ。<end>"
english = "It is a letter addressed to a woman by the late Duke Elienai, your father and predecessor.<end>"

["420023"]
japanese = "女にですと！？<end>"
english = "A woman!?<end>"

["420024"]
japanese = "こ、これは…なんたること！\u3000\u3000\u3000\u3000\u3000<line-break>貴殿の父上は、妻以外の女性に<line-break>子供を産ませていたようだ。<end>"
english = "Th-this is... outrageous! It appears your father sired a child with a woman other than his wife.<end>"

["420025"]
japanese = "いや、待て。<line-break>エストの誕生には、我々もかけつけた。<line-break>…ということは、貴殿がその女性の…。<end>"
english = "No, wait. We were there for Est's birth. Then that would mean you are that woman's...<end>"

["420026"]
japanese = "故人の恋文をのぞき読むとは<line-break>いい趣味をお持ちですな。<end>"
english = "Reading a dead man's love letters. What refined tastes you have.<end>"

["420027"]
japanese = "コホン…確かに、<line-break>ファーロス家の当主に<line-break>あるまじき不作法だった。\u3000\u3000\u3000\u3000<line-break>しかし、この手紙から判断すれば<line-break>貴殿は不当にリューガ家当主の座に<line-break>ついたことになる。<end>"
english = "Ahem... I admit that was conduct unbecoming the head of House Pharos. However, judging by this letter, you took your place as head of House Ryuga illegitimately.<end>"

["420028"]
japanese = "ふふん、エリエナイ公…\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>いや、レムオン。<line-break>これで貴殿も終わりだな。<end>"
english = "Hmph. Duke Elienai... No, Lemghon. This is the end of you.<end>"

["420029"]
japanese = "手紙の入手経路を明かさぬまま<line-break>ボルボラが死んだとあっては、<line-break>これを鵜呑みするわけにもいかぬ。<end>"
english = "With Bolbora dead before revealing where he obtained the letter, we cannot simply accept it at face value.<end>"

["420030"]
japanese = "しかし、手紙を手に入れた直後の\u3000<line-break>事故死とは…<line-break>\u3000<line-break>偶然にしては、<line-break>できすぎていると思わぬか？<end>"
english = "But for him to die in an accident just after obtaining it... Do you not find that rather too convenient to be mere coincidence?<end>"

["420031"]
japanese = "しかも、ボルボラはノーブルで<line-break>横暴を働き、そなたを困らせていた<line-break>というではないか。<line-break>この上ない幸運であったな。<line-break>エリエナイ公。<end>"
english = "And did Bolbora not abuse his authority in Noble, causing you no small trouble? His death was extraordinarily fortunate for you, Duke Elienai.<end>"

["420032"]
japanese = "フッ…、おたわむれを。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>彼は有能な男でした。現にこれまで、<line-break>ボルボラのあとを任せられる者が<line-break>おらず、頭を悩ませておりました。<end>"
english = "Heh... You jest. He was a capable man. Indeed, I have been at a loss because no one could be found to take his place.<end>"

["420033"]
japanese = "ですが、ようやくその結論が<line-break>得られたので、今日はその件について<line-break>お願いに上がった次第です。<line-break>ノーブルの支配を、<line-break>我が妹<value:$28>に<line-break>任せたく存じます。<end>"
english = "But I have finally found my answer, and that is why I came today with a request. I would entrust the governance of Noble to my younger sister, <value:$28>.<end>"

["420034"]
japanese = "妹？<end>"
english = "Your sister?<end>"

["420035"]
japanese = "ここに連れてまいりました。<end>"
english = "I have brought her here.<end>"

["420036"]
japanese = "エストの他に兄弟があったとは、<line-break>初耳だが。<end>"
english = "This is the first I have heard of you having another sibling besides Est.<end>"

["420037"]
japanese = "わけあって、<line-break>公にはしておりませんでした。<line-break>\u3000<line-break>そのわけは…<line-break>申し上げなくとも<line-break>おわかりでしょう。<end>"
english = "For certain reasons, I have kept her existence from public knowledge. I need hardly explain what those reasons were.<end>"

["420038"]
japanese = "この少女こそ、<line-break>…この手紙にある子供だと？<end>"
english = "You mean this girl is the child mentioned in the letter?<end>"

["420039"]
japanese = "ボルボラ亡きあとのノーブルを<line-break>統制するために、<line-break>\u3000<line-break>なにとぞ、<line-break>我が妹<value:$28>に<line-break>ノーブルの伯爵の称号を。<end>"
english = "To maintain order in Noble after Bolbora's death, I beg you to grant my younger sister, <value:$28>, the title of Countess of Noble.<end>"

["420040"]
japanese = "ならん！\u3000ならん！！<line-break>ふざけたことを！<end>"
english = "Absolutely not! I will not permit this nonsense!<end>"

["420041"]
japanese = "陛下、<line-break>どうかこの者に伯爵の称号を。<line-break>\u3000<line-break>事情が事情です。<line-break>手続きは追って行うこととし、<line-break>この場で叙任なされては？<end>"
english = "Your Majesty, please grant this person the title. Given the circumstances, could the formalities not follow later and the investiture take place here and now?<end>"

["420042"]
japanese = "ああ…。<line-break>王妃がそう言うのであればな…。<line-break>\u3000<line-break><value:$28>と言ったか。<line-break>そなたをロストール王国の伯爵、<line-break>そして、特別に白竜騎士に叙任する。<end>"
english = "Very well... If that is the Queen's wish. Your name was <value:$28>, was it not? I hereby appoint you a count of the Kingdom of Rostorl and, by special dispensation, a White Dragon Knight.<end>"

["420043"]
japanese = "騎士の証である盾だ。<line-break>受け取るがよい。<end>"
english = "This shield is the badge of your knighthood. Take it.<end>"

["420044"]
japanese = "迅速なご処置、<line-break>心より感謝いたします。<end>"
english = "You have my deepest gratitude for acting so swiftly.<end>"

["420045"]
japanese = "リューガ家は、陛下に<line-break>以後、いっそうの忠誠を誓いましょう。<end>"
english = "From this day forth, House Ryuga pledges even greater loyalty to Your Majesty.<end>"

["420046"]
japanese = "…ふん、ぬけぬけと。<end>"
english = "Hmph. Shameless.<end>"

["420047"]
japanese = "ノヴィン閣下。何か？<end>"
english = "Lord Novin. Did you say something?<end>"

["420048"]
japanese = "い、いや。ロストールのために、<line-break>せいぜい骨を折ってくれたまえ。<end>"
english = "N-no. Do your utmost for Rostorl.<end>"

["420049"]
japanese = "予は疲れた。先に休ませてもらう。<end>"
english = "I am weary. I shall retire now.<end>"

["420050"]
japanese = "なぜ、レムオンの言いなりになる！<line-break>あんな素性も知れぬ女に<line-break>伯爵の称号など…<end>"
english = "Why did you give Lemghon exactly what he wanted? Granting the title of countess to a woman of unknown origins...<end>"

["420051"]
japanese = "レムオン坊やに貸しを作ったまで。\u3000\u3000<line-break>これで懸案の中央集権化を進める法案が<line-break>すんなり元老院を通過する。<end>"
english = "I merely put young Lemghon in my debt. Now the bill advancing our long-planned centralization will pass smoothly through the Senate.<end>"

["420052"]
japanese = "しかも、腹違いの妹を隠していたことが<line-break>知れれば、レムオンの信望は<line-break>少なからず落ちるはず…。<end>"
english = "And once it becomes known that Lemghon concealed a half sister, his standing will suffer considerably.<end>"

["420053"]
japanese = "…！\u3000さすがは我が妹よ！<line-break>レムオンめ、そうとは知らずに…。<line-break>\u3000<line-break>ハハハハ！<line-break>小僧めに、一杯食わせてやれて<line-break>せいせいしたわ！<end>"
english = "Ah! Brilliant, my sister! And Lemghon never suspected a thing... Hahahaha! It feels splendid to have outwitted that whelp!<end>"

["420054"]
japanese = "それしきのことが見抜けぬ男では<line-break>あるまい。…愚かな兄を持ったものだ。<line-break>\u3000<line-break>それにしても、<line-break><value:$28>という娘…。<end>"
english = "Lemghon is no man to overlook something so obvious. What a foolish brother I have. Still, that girl called <value:$28>...<end>"

["420055"]
japanese = "無限の可能性を感じさせる…。\u3000\u3000<line-break>あの目の輝きはどうだ。<line-break>\u3000<line-break>フフフ…、<line-break>レムオン坊やも楽しませてくれる。<end>"
english = "Such limitless potential... And that light in her eyes. Heh heh... Young Lemghon does know how to entertain me.<end>"

["420056"]
japanese = "とりあえず、礼を言う。<line-break>おかげで難局を切り抜けられた。<end>"
english = "First, you have my thanks. You helped me through a difficult situation.<end>"

["420057"]
japanese = "紹介する。この館の執事だ。<line-break>セバスチャンという。<end>"
english = "Let me introduce you. This is Sebastian, the butler of the house.<end>"

["420058"]
japanese = "お目にかかり、光栄です。<line-break>ご用はなんなりと<line-break>この私めにお申しつけください。\u3000\u3000\u3000<line-break>大したご用意はできませんが、いつでも<line-break><value:$28>様をお迎えできるよう、<line-break>お待ちいたしております。<end>"
english = "It is an honor to meet you. Whatever you may require, you need only ask. I cannot offer anything too grand, but I shall always be waiting, ready to welcome you, <value:$28>.<end>"

["420059"]
japanese = "それでは失礼いたします。<end>"
english = "Now, if you will excuse me.<end>"

["420060"]
japanese = "彼の言うことは聞いておいた方がいい。<line-break>この館で一番の権力者だ。フフフ…。<line-break>\u3000<line-break>とにかく、お前はロストールで<line-break>１、２を争う大貴族リューガ家の<line-break>一員となってしまったのだ。<end>"
english = "You would do well to heed him. He's the most powerful man in this manor. Heh heh... In any case, you've ended up a member of House Ryuga, one of the two foremost noble houses in Rostorl.<end>"

["420061"]
japanese = "本来なら処刑されるところ<line-break>だったのだからな。<line-break>そのくらい耐えろ。<line-break>よいな、<line-break>我が妹、<value:$28>よ。<line-break>また、帰ってこい。<end>"
english = "By rights, you would have been executed. Put up with that much. Understood, my sister, <value:$28>? Come back again.<end>"

["420062"]
japanese = "…不思議な女だ。<line-break>可能性の女神がいれば、<line-break>あんな感じか…。<line-break>まあいい。バカで退屈な貴族どもには<line-break>飽き飽きしていた。奴がいれば<line-break>脳が腐らずにすみそうだ。<end>"
english = "What a strange woman. If there were a goddess of possibility, perhaps that is what she would be like. No matter. I have had my fill of dull-witted, tedious nobles. With her around, perhaps my brain will be spared from rotting.<end>"

["420063"]
japanese = "貴様がノーブルの新しい領主、\u3000\u3000<line-break>ノーブル伯だな！<end>"
english = "You're Noble's new lord―the Count of Noble, aren't you?!<end>"

["420064"]
japanese = "お前ら貴族のせいで<line-break>姉ちゃんは処刑されたんだ！<line-break>姉ちゃんの仇だ！\u3000死んでもらう！<end>"
english = "Damn it! Kill that damned noble!<end>"

["420065"]
japanese = "くそっ！<line-break>殺せ！\u3000貴族め！<end>"
english = "Damn it! Kill that damned noble!<end>"

["420066"]
japanese = "…ね、姉ちゃん？<line-break>処刑されたはず…でも、似てる…。<end>"
english = "S-Sis? But you were supposed to have been executed... Still, you look so much like her.<end>"

["420067"]
japanese = "貴族とは思えない洗練されない感じ。<line-break>平たく言えばガサツそうなところ…。<line-break>\u3000<line-break>これがエリエナイ公レムオンの妹とは<line-break>とても思えない容姿…。<line-break>雰囲気から姿からそっくりだ…。<end>"
english = "You don't have a noble's refinement. To put it bluntly, you seem downright rough. You hardly look like the sister of Lemghon, Duke of Elienai... But your manner, your appearance―everything is just like her.<end>"

["420068"]
japanese = "いったあ！\u3000間違いないや！<line-break>やっぱり、姉ちゃんだろ！<end>"
english = "Ow! That settles it! I knew you were my sister!<end>"

["420069"]
japanese = "まったく、すぐ手が出るんだから！<line-break>俺がバカになったらどうすんだよ！<end>"
english = "Honestly, you're always so quick to hit me! What if you knock me stupid?!<end>"

["420070"]
japanese = "チャカは少し頭が悪くなった。<line-break>ＩＮＴが１下がった。<end>"
english = "Chaka got a little less intelligent. ＩＮＴ decreased by 1.<end>"

["420071"]
japanese = "チャカは少し打たれ強くなった。<line-break>ＶＩＴが１上がった。<end>"
english = "Chaka got a little better at taking hits. ＶＩＴ increased by 1.<end>"

["420072"]
japanese = "…でも、いったい<line-break>どういうことなんだ？\u3000\u3000<line-break>\u3000<line-break>処刑されたんじゃ<line-break>なかったのか？<line-break>それにノーブル伯って…。<end>"
english = "But what in the world is going on? Weren't you executed? And what's this about being the Count of Noble...?<end>"

["420073"]
japanese = "…なるほどね。<line-break>そういうことだったのか。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>確かに、あのときの俺は<line-break>姉ちゃんが殺されるの一点張りで<line-break>まともに話も聞かなかったろうけどさ。<end>"
english = "Oh, so that's what happened. I suppose I was so convinced they were going to kill you that I wouldn't listen to a word anyone said.<end>"

["420074"]
japanese = "それにしても、殴り倒して置いてくより<line-break>マシなやり方があったはずだと思うぜ？<line-break>姉ちゃん。<end>"
english = "Even so, Sis, you could've found a better way than knocking me out and leaving me there.<end>"

["420075"]
japanese = "ノーブルへ帰れって言うんだろうけど、<line-break>俺、帰らないよ。<line-break>\u3000<line-break>もともと、ノーブル伯を殺して<line-break>死ぬつもりだったんだ。<line-break>俺も姉ちゃんと同じ、死人になるよ。<end>"
english = "I know you'll tell me to go back to Noble, but I won't. I was planning to kill the Count of Noble and die anyway. Then I'd be one of the dead too, just like you.<end>"

["420076"]
japanese = "姉ちゃんは<line-break>俺だけ、生かしておくつもりで\u3000\u3000\u3000<line-break>黙って出ていったんだろうけどさ、<line-break>俺はやっぱり、<line-break>ノーブルで生きてるより、<line-break>姉ちゃんと一緒に死んでいたいよ。<end>"
english = "I know you slipped away without a word because you wanted me to live. But I'd still rather die with you than go on living in Noble.<end>"

["420077"]
japanese = "俺も一緒に連れて行ってよ。\u3000\u3000\u3000\u3000\u3000<line-break>そうじゃなきゃ、ノーブル伯の<line-break>正体ばらすぜ。<end>"
english = "Take me with you. Otherwise, I'll expose the Count of Noble's true identity.<end>"

["420078"]
japanese = "やったあ！<line-break>やっぱ姉ちゃん、話がわかる！<end>"
english = "Yes! I knew you'd see reason, Sis!<end>"

["420079"]
japanese = "姉ちゃん、冒険者としてやっていこう！<line-break>これからは自由にさ！<end>"
english = "Sis, let's become adventurers! We can live free from now on!<end>"

["420080"]
