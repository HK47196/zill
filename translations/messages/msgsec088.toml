["880039"]
japanese = "ウッソだぁ、ボクにはわかるんだから。<line-break>キミ、絶対そんな感じしないもん。<line-break>\u3000<line-break>ボクもリベルダムに最初に来たころは<line-break>市民じゃないってことに<line-break>引け目を感じてたけどさ。<end>"
