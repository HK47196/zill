english = "Oh, you mean Liberdam? Sorry, but I'm...<end>"

["880015"]
japanese = "ボクがリベルダム出身じゃない<line-break>ことぐらいすぐわかるだって？<line-break>\u3000<line-break>どーせボクは<line-break>小汚いカッコした非市民だよ。<line-break>キミだって非市民じゃないか？<end>"
english = "You could tell right away I'm not from Liberdam? Well, I guess I'm just a grubby-looking non-citizen. But aren't you a non-citizen too?<end>"

["880016"]
japanese = "非市民じゃない<end>"
