english = "Hmm. So your name's <value:$28>. Anyway, I'm in Liberdam a lot, so let's meet again sometime. Bye!<end>"

["880013"]
japanese = "あれ、<line-break><value:$28>じゃない？<end>"
english = "Hey, isn't that <value:$28>?<end>"

["880014"]
