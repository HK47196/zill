["880075"]
japanese = "…たっぷりこき使ってやる、<line-break>冒険の旅はつらいぞって…。<line-break>\u3000<line-break>いやーん！<line-break>やっぱりボクって<line-break>肉体労働専門なのね？<end>"
english = "You mean you'll work me to the bone and show me how hard the adventuring life is...? Nooo! So I really am just here for the heavy lifting?<end>"

["880076"]
japanese = "もー！\u3000冒険の仲間になろうって<line-break>言ってるだけじゃん！<line-break>ボク、待ってるからねー！<end>"
english = "Come on! I'm only saying I want to join you on your adventures! I'll be waiting!<end>"

["880077"]
japanese = "<value:$28>、ごめん。<line-break>ボク、ちょっと用事があって、しばらく<line-break>キミと一緒に冒険できないんだ…。<line-break>多分、呼び出しにも応えられない…。<line-break>でも……、絶対戻ってくるから、<line-break>何も聞かないで行かせてほしい。<end>"
english = "<value:$28>, I'm sorry. There's something I need to take care of, so I won't be able to go adventuring with you for a while. I probably won't be able to come when you call, either... But I promise I'll come back. Please, just let me go without asking any questions.<end>"

["880078"]
japanese = "ホントごめんなさい！<end>"
english = "I'm so sorry!<end>"

["880079"]
