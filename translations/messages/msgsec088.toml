["880018"]
japanese = "へへーん。そんなのウソだね。\u3000\u3000\u3000\u3000<line-break>ボクの目は節穴じゃないぞ。<line-break>\u3000<line-break>ボクは人を見る目には自信があるんだ。<line-break>キミってさぁ、ぜ～んぜん<line-break>市民って感じしないもん。<end>"
english = "Heh! That's a lie. I know what I'm looking at. I'm a pretty good judge of people, you know. And you don't seem like a citizen at all.<end>"

["880019"]
japanese = "あ、言っておくけど、<line-break>悪い意味で言ってんじゃないよ。<line-break>\u3000<line-break>自分では何もしてないのに<line-break>いばり散らしてるだけのリベルダム市民<line-break>なんて、ボク大っ嫌いだから。<end>"
english = "Oh, and I don't mean that in a bad way. I can't stand Liberdam citizens who've never accomplished anything themselves and do nothing but lord it over everyone.<end>"

["880020"]
japanese = "そんなことないよ。<line-break>むしろ、市民って聞くと<line-break>構えちゃうかな。<line-break>まぁ、ボクだって<line-break>市民はみんな悪者だなんて<line-break>考えてるわけじゃないけどさ。<end>"
english = "Not at all. If anything, hearing that someone's a citizen puts me on my guard. Not that I think every citizen is bad, of course.<end>"

["880021"]
japanese = "ボク、市民かどうかなんて<line-break>つまらないレベルで人を見ないから。<line-break>\u3000<end>"
english = "I don't judge people on something as petty as whether they're citizens.<end>"

["880022"]
japanese = "それじゃあね、<value:$28>。<line-break>見たい試合があるからボクは行くよ。<line-break>またね。<end>"
english = "Well, see you around, <value:$28>. There's a match I want to watch, so I'd better go. Bye!<end>"

["880023"]
japanese = "あぁ、そうだよ。<line-break>ボクも時々闘技場に出るんだ。<line-break>\u3000<line-break>見ての通りだから<line-break>そんなに強い相手とは<line-break>試合にならないけどね。<end>"
english = "Yeah, that's right. I fight in the arena sometimes too. As you can see, though, I'm no match for anyone too strong.<end>"

["880024"]
japanese = "そういう<value:$28>は<line-break>どうなんだい？<line-break>結構、強いんじゃない？\u3000\u3000\u3000<end>"
english = "What about you, <value:$28>? You're pretty strong, aren't you?<end>"

["880025"]
japanese = "まぁね<end>"
english = "Yeah, I guess.<end>"

["880026"]
japanese = "まだまだ駆け出し<end>"
