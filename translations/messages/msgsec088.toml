english = "A clock is made up of all kinds of parts, right? Each individual part just repeats the same motion over and over.<end>"

["880045"]
japanese = "でもさ、そのなかの１個だけでも<line-break>動くのをやめてしまったら、<line-break>時計全体は止まってしまうんだよね…。<line-break>ひとつの部品がヤダって言ったら…。<line-break>\u3000<line-break>\u3000<end>"
