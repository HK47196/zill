english = "But now I think it's much more pathetic to be born into a citizen family, accomplish nothing yourself, and still strut around boasting about being a citizen. It's not like you chose the family you were born into.<end>"

["880041"]
japanese = "あはっ！\u3000やっぱりわかる？<line-break>そうなんだよ。いろんなモノを見て<line-break>感動していかなきゃダメだよね。<end>"
