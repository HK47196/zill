["880000"]
japanese = "エステルメッセージVOL1開始<end>"
english = ""

["880001"]
japanese = "ちぇっ、ちょっと見せてくれても<line-break>いいのにな。<end>"
english = "Aw, come on. It wouldn't hurt to let me take a quick look.<end>"

["880002"]
japanese = "わあっ。すいませんっ！<line-break>ま、まだ何もしてませんっ。\u3000\u3000<line-break>\u3000<line-break>エステル・ズゥ、非市民ですっ！<line-break>職業は冒険者ですっ！<line-break>ちゃんとギルドに登録してま…。<end>"
english = "Ah! Sorry! I-I haven't done anything yet! Esther Zuu, noncitizen! Occupation: adventurer! I'm properly registered with the Guild...<end>"

["880003"]
japanese = "…なんだ、都市治安警官じゃないのか。<line-break>おどかさないでよ…。まったく。<line-break>\u3000<line-break>…って、治安警官があんまり非市民に<line-break>横柄で権力的なんで、ついヒクツに<line-break>なっちゃったボクもボクだけどね。<end>"
english = "Oh, you're not a city security officer. Don't scare me like that... Honestly. Then again, city security officers are so overbearing and authoritarian toward noncitizens that I automatically start groveling. I suppose that's my fault, too.<end>"

["880004"]
japanese = "見てよ、この時計塔。<line-break>大陸一でっかい魔法仕掛けの時計。<end>"
english = "Look at this clock tower. It's the biggest magic-powered clock on the continent.<end>"

["880005"]
japanese = "でも、非市民にそんなもの見せる<line-break>必要はないってさ。<line-break>さっき断られちゃった。<line-break>だから、忍び込んで見ちゃおうって<line-break>決心したときにキミが来たんで、<line-break>ボクはビックリさせられたわけ。<end>"
english = "But apparently there's no reason to show something like that to a noncitizen. They turned me away just now. I'd just decided to sneak in and see it for myself when you showed up, so you gave me quite a fright.<end>"

["880006"]
japanese = "あのさ、<line-break>動いているってすごいよね…。<line-break>\u3000<line-break>ボクの住んでいるところにも<line-break>魔法仕掛けのものがたくさん<line-break>あるんだけどさ…。<end>"
english = "You know, it's amazing that it actually works... There are plenty of magic-powered things where I live, too, but...<end>"

["880007"]
