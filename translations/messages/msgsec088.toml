english = "I had to leave Liberdam for a while on some business. And... thanks for the other day. Sorry I left without even thanking you. Are you mad at me?<end>"

["880064"]
japanese = "てへへ、ありがと。<line-break>で、あのさ。ありがとついでに、<line-break>ちょっと頼まれてほしいんだけど…。<line-break>首飾りを探してほしいんだ。<line-break>竜骨の砂漠に落ちている…。<end>"
english = "Hee hee, thanks. So, um... since I'm already thanking you, could I ask a little favor? I want you to find a necklace. It's lying somewhere in the Dragonbone Desert...<end>"

