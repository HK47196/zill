english = "Oh, don't worry about the crystal! Would you hold on to it for me...?<end>"

["880072"]
japanese = "よかった…。そうじゃなきゃ…\u3000\u3000\u3000\u3000<line-break>意味がないんだ…。<line-break>\u3000<line-break>あっ、えっ、その<line-break>…ハハハ、何でもないよ！\u3000独り言！<line-break>あんまり根ほり葉ほり聞かないの！<end>"
english = "Good... Otherwise, there wouldn't be any point... Oh! Uh, I mean... Ha ha ha, it's nothing! Just talking to myself! Don't go prying into everything!<end>"

["880073"]
japanese = "えっ、あっ、報酬…？<line-break>アハハハ…。<line-break>…体で払うって、ダメ？<line-break>あ、変な意味じゃなくて、<line-break>ボクがキミのパーティーに<line-break>入るってことなんだけどね。<end>"
english = "Huh? Oh, a reward...? Ah ha ha ha... Could I pay you with my body? Oh, not like that! I mean, I could join your party.<end>"

["880074"]
japanese = "えーっ！\u3000あのっ！\u3000そのっ！<line-break>…ボクなんかで…いいの？<end>"
