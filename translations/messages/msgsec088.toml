["880011"]
japanese = "そんなに否定するんなら\u3000\u3000\u3000\u3000<line-break>別に何者でもいいけどさ。<line-break>\u3000<line-break>とにかく、<line-break>ボク、リベルダムによくいるし、<line-break>また会おうよ。じゃあね！<end>"
