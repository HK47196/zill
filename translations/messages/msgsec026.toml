["260000"]
japanese = "（ロストールの西にある城塞都市跡で<line-break>\u3000怪現象が起きるという噂がある。<line-break>\u3000その調査を依頼された）<line-break>（怪現象の正体がわかったら、<line-break>\u3000冒険者ギルドに報告へ行かないと<line-break>\u3000いけないな…）<end>"
english = "(There are rumors of a strange phenomenon at the Fortress City Ruins west of Rostorl. I was asked to investigate.) (Once I find out what is behind it, I'll have to report back to the Adventurers' Guild...)<end>"

["260001"]
japanese = "城塞都市跡で目撃されてる<line-break>怪現象のことよね。<line-break><line-break>怪現象の正体を調べたら<line-break>冒険者ギルドに報告するのも<line-break>忘れないようにしないとね。<end>"
english = "You mean the strange phenomenon seen at the Fortress City Ruins, right? Once we find out what it really is, we must remember to report back to the Adventurers' Guild.<end>"

["260002"]
japanese = "城塞都市跡のモンスターは手強いぞ。<line-break>準備をしっかりして調査にいくべきで<line-break>あろうな。<line-break>怪現象の正体がわかったら、<line-break>冒険者ギルドに報告するよう<line-break>頼まれておることも忘れてはならぬぞ。<end>"
english = "The monsters at the Fortress City Ruins are formidable. You should prepare thoroughly before investigating. And once you uncover the truth behind the strange phenomenon, do not forget that you were asked to report back to the Adventurers' Guild.<end>"

["260003"]
japanese = "生きているような黒い闇が<line-break>現れるっていう噂なんですよ。<line-break>やっぱり、調べに行きます？<end>"
english = "They say a black darkness that seems alive appears there. Are you going to investigate after all?<end>"

["260004"]
japanese = "城塞都市跡に現れる黒い闇みたいのの<line-break>正体を調べて、冒険者ギルドに<line-break>報告すればいいだけだろ。<line-break>簡単じゃねえか！<line-break>さっそく出かけようぜ。<line-break>この仕事は楽勝だな。<end>"
english = "All we have to do is find out what that thing resembling black darkness at the Fortress City Ruins really is and report it to the Adventurers' Guild. Sounds easy! Let's get going. This job'll be a breeze.<end>"

["260005"]
japanese = "城塞都市跡に黒い闇みたいな生き物が<line-break>現れるって噂だよね。<line-break>うん、ボクも聞いたことがある。<line-break>ボク、そいつの正体に興味あるな。<line-break>ねえ、調べに行こうよ。<line-break>キミもそいつの正体、知りたいでしょ。<end>"
english = "There's a rumor that some creature like black darkness appears at the Fortress City Ruins, right? Yeah, I've heard it too. I'm curious what it really is. Hey, let's go investigate. You want to know too, don't you?<end>"

["260006"]
japanese = "城塞都市跡で発生しているという<line-break>怪現象の真相を見極めればいいのね。<line-break>簡単な仕事よ。<end>"
english = "So all we have to do is uncover the truth behind the strange phenomenon at the Fortress City Ruins. An easy job.<end>"

["260007"]
japanese = "城塞都市跡で起こる怪現象の<line-break>真相を見極めて報告せよという<line-break>お仕事でしたね。<line-break>あそこは古代王国の遺跡ですから、<line-break>確かに、尋常でないものが<line-break>ありそうな場所ではあります。<line-break>お気をつけて、<value:$28>。<end>"
english = "Our task was to uncover and report the truth behind the strange phenomenon at the Fortress City Ruins. Those are the ruins of an ancient kingdom, so they certainly seem like the sort of place where something extraordinary might be found. Take care, <value:$28>.<end>"

["260008"]
japanese = "城塞都市跡？<line-break>そんな活気もないようなとこへ<line-break>わざわざ行くとは、<line-break><value:$28>サンも、<line-break>全くご苦労なこって。<line-break>おまけに、怪現象が起こるんだって？<line-break>おまけ、じゃないか。その正体を<line-break>ギルドに報告する仕事だったね。<end>"
english = "The Fortress City Ruins? Going out of your way to visit such a lifeless place? You sure go to a lot of trouble, <value:$28>. And there's a strange phenomenon on top of that? No, wait, that's the whole point. Your job was to find out what it is and report it to the Guild.<end>"

["260009"]
japanese = "姉ちゃんも聞いたのか？<line-break>黒い闇みたいな生き物が現れるって話。<line-break>やっぱり気になるよな。<line-break>正体を調べてきてくれたら、<line-break>報酬を出すって冒険者ギルドの主人も<line-break>言ってたし、調べにいってみようか。<end>"
english = "You heard about it too, sis? The story about a creature like black darkness appearing? Hard not to be curious. The master of the Adventurers' Guild said there'd be a reward if we found out what it was, so shall we investigate?<end>"

["260010"]
japanese = "城塞都市跡で起こる怪現象を調べる？<line-break><line-break><line-break>…いかにも、命知らずな冒険者の<line-break>やりそうなことね。<end>"
english = "Investigate the strange phenomenon at the Fortress City Ruins? ...Yes, that does sound exactly like something a foolhardy adventurer would do.<end>"

["260011"]
japanese = "城塞都市跡に、黒い闇みたいな<line-break>生き物が現れるって話のことだな。<line-break>けっこう話題になってるぜ。<line-break>俺もギルドの主人に、そいつの正体を<line-break>調べてくれって頼まれちまったよ。<line-break>どうする？\u3000行ってみるかい？<end>"
english = "You mean the story about a creature like black darkness appearing at the Fortress City Ruins. It's become quite the topic. The Guild master asked me to find out what it is too. Well? Shall we go?<end>"

["260012"]
japanese = "城塞都市跡に、黒い闇のような生き物が<line-break>現れるという噂のことだな。<line-break>俺も気になっていた。<line-break>調べてみる価値はあるかもしれん。<line-break>行ってみるか…。<end>"
english = "You mean the rumor that a creature like black darkness appears at the Fortress City Ruins. I was curious about it too. It may be worth investigating. Shall we go...?<end>"

["260013"]
japanese = "城塞都市跡に、黒い闇のような生き物が<line-break>現れるという話のことじゃろう。<line-break>お主も耳にしておったか。<line-break>正体をつきとめれば報酬も払うと<line-break>冒険者ギルドは言っておるようじゃ。<line-break>どれ、わしらも調べに行くとするかの。<end>"
english = "You mean the story of a creature like black darkness appearing at the Fortress City Ruins. So you had heard it too. Apparently the Adventurers' Guild has offered a reward if we discover its true nature. Well then, let us go investigate it ourselves.<end>"

["260014"]
japanese = "うん。<line-break>城塞都市跡に黒い闇のような生き物が<line-break>現れるって噂のことだね。<line-break><value:$28>も調べに行くつもり？<line-break>正体がわかったら冒険者ギルドに<line-break>報告するのを忘れないでよ。<end>"
english = "Right. It's the rumor about a creature like black darkness appearing at the Fortress City Ruins. Are you planning to investigate too, <value:$28>? If you discover what it is, don't forget to report back to the Adventurers' Guild.<end>"

["260015"]
japanese = "………………。<end>"
english = "……………….<end>"

["260016"]
japanese = "も、もちろん知っているわよ。<line-break>城塞都市跡に、あんたたち人間の<line-break>大好きな宝がたくさんあるのよ。<line-break>それを求めて低能な冒険者が<line-break>ぞろぞろ集まってるわけ。<line-break>わかった！？\u3000もう聞かないでよね！<end>"
english = "O-of course I know! The Fortress City Ruins are full of the treasure you humans love so much. That's why dim-witted adventurers flock there in droves. Understand?! Now stop asking me!<end>"

["260017"]
japanese = "城塞都市はロストール城の西、<line-break>つまり城西にあるでござる。<line-break>城塞と城西…。<line-break>今日の拙者、いつになく冴えて<line-break>ござるな。<line-break>兄弟子、いかがでござろう。<end>"
english = "The Fortress City lies west of Rostorl Castle―in the castle's west, as it were. Fortress city, castle's west... I am unusually sharp today. What say you, senior disciple?<end>"

["260018"]
japanese = "城塞都市跡に黒い闇のような生き物が<line-break>現れるんだってぇ。<line-break><value:$28>も調べに行くの？<line-break>正体がわかったら教えてねって<line-break>冒険者ギルドのおじさんが言ってたよ。<line-break>忘れずに教えてあげてよ。<end>"
english = "They say a creature like black darkness appears at the Fortress City Ruins. Are you going to investigate too, <value:$28>? The man at the Adventurers' Guild said to tell him if you find out what it is. Don't forget, okay?<end>"

["260019"]
japanese = "……………。<line-break><line-break><line-break>黒い闇に似た生物が現れるという。<end>"
english = "……………. They say a creature resembling black darkness appears there.<end>"

["260020"]
japanese = "城塞都市跡に闇のように黒い何かが<line-break>うごめいているという噂話は<line-break>俺も耳にした。<line-break>しかし、報酬が出るからと言って<line-break>自分から首を突っ込む奴がいようとは、<line-break>そしてそれがお前とは予想しなかった。<end>"
english = "I too have heard the rumor that something as black as darkness writhes in the Fortress City Ruins. Yet even with a reward offered, I never expected anyone to go meddling of their own accord―least of all you.<end>"

["260021"]
japanese = "話題になってるから、知ってるよ。<line-break>城塞都市跡に黒い闇のような生き物が<line-break>現れるって話だよねぇ。<line-break>ぼくも興味あったんだぁ。<line-break><value:$28>、調べに行くの？<line-break>ぼくも連れていってよ。<end>"
english = "Of course I know; everyone's talking about it. It's the story about a creature like black darkness appearing at the Fortress City Ruins, right? I was curious too. Are you going to investigate, <value:$28>? Take me with you.<end>"

["260022"]
japanese = "城塞都市跡にうごめく、<line-break>闇のように黒い何か、か。<line-break><line-break>浅学な連中はそれを<line-break>生き物だとか言っているようだが…<line-break><line-break>フッ、まあ、真相究明は<line-break>命知らずな<value:$28>、<line-break>君にゆだねるとしよう。<end>"
english = "Something as black as darkness, writhing in the Fortress City Ruins... The ignorant masses seem to be calling it a creature, but... Hmph. I shall leave the search for truth to you, the foolhardy <value:$28>.<end>"

["260023"]
japanese = "城塞都市跡の噂は私も聞きました。<line-break>黒い闇のような何かがいると…。<line-break>私も、お供いたします。<end>"
english = "I have heard the rumors about the Fortress City Ruins too. They say something like black darkness is there... I shall accompany you.<end>"

["260024"]
japanese = "私も、城塞都市跡は聞いたの。<line-break>闇のような不吉な何かがいるんだって？<line-break>私も行くよ。お兄ちゃん。<end>"
english = "I've heard about the Fortress City Ruins too. There's something ominous there, like darkness itself? I'll come too, big brother.<end>"

["260025"]
japanese = "城塞都市跡で怪現象が起こる、とな。<line-break>うごめく闇のような何か…。<line-break>ふうむ、どうも嫌な予感がするわい。<end>"
english = "A strange phenomenon at the Fortress City Ruins, you say? Something like writhing darkness... Hmm. I have a bad feeling about this.<end>"

["260026"]
japanese = "城塞都市跡で起こる怪現象のことは、<line-break>私もついこの間耳にしたばかりだ。<line-break>冒険者の間では噂らしいな。<line-break>しかし、場所が不気味な古代王国の<line-break>遺跡だというのもあって、<line-break>なかなか腰をあげる者がいない、とも。<line-break>…私か？\u3000まあ、<line-break><value:$28>が行くというなら、<line-break>付き合わんでもないが…。<end>"
english = "I only recently heard about the strange phenomenon at the Fortress City Ruins myself. It seems to be a rumor among adventurers. But since the place is the eerie ruin of an ancient kingdom, they say few are willing to make the trip. ...Me? Well, if <value:$28> is going, I suppose I might come along...<end>"

["260027"]
japanese = "………………。<end>"
english = "……………….<end>"

["260028"]
japanese = "城塞都市跡の噂？<line-break>黒い闇みたいな生き物がいるとか、<line-break>怪現象が起きるっていう話ね。<line-break>ギルドから報酬も出るし、<line-break>行ってみる？<end>"
english = "The rumor about the Fortress City Ruins? The one about a creature like black darkness and strange phenomena occurring there. The Guild is offering a reward, so shall we go?<end>"

["260029"]
japanese = "………………。<end>"
english = "……………….<end>"

["260030"]
japanese = "私もお客さんから<line-break>聞いたことがあります。<line-break>\u3000<line-break>なんでも城塞都市跡に<line-break>黒い闇のようなお化けが出るとか…。<line-break>し、調べにいっちゃうんですか？<end>"
english = "I've heard about it from customers too. Apparently a ghost like black darkness appears at the Fortress City Ruins... A-are you really going to investigate?<end>"

["260031"]
japanese = "………………。<end>"
english = "……………….<end>"

["260032"]
japanese = "（次元のはざまに落ちたネメアを<line-break>\u3000助けるために、大陸の南西にある島へ<line-break>\u3000行かなくてはならない）<end>"
english = "(To rescue Nemea from the Interdimensional Rift, I must go to the island southwest of the continent.)<end>"

["260033"]
japanese = "大陸の南西にある島に行けば、<line-break>ネメア様を助けることができるのね？<line-break>行きましょう、<value:$28>！<end>"
english = "We can save Nemea if we go to the island southwest of the continent, right? Let's go, <value:$28>!<end>"

["260034"]
japanese = "大陸の南西にある島といえば、<line-break>闇の門の島と呼ばれておる場所じゃ。<line-break>行こうぞ、<value:$28>よ！<end>"
english = "The island southwest of the continent is the place called the Island of the Dark Gate. Let us go, <value:$28>!<end>"

["260035"]
japanese = "大陸の西側の海は、民間船はもちろん、<line-break>海賊だって寄りつかない場所ですよ。<line-break>そんな所に行くんですか？<end>"
english = "Not even pirates venture into the seas west of the continent, let alone civilian ships. Are you really going to such a place?<end>"

["260036"]
japanese = "勇者様を俺たちが助けるなんて、<line-break>くぅううううう、燃えるぜぇ！<line-break>行くぜぇ、<value:$28>！<end>"
english = "Us, rescuing the Hero? Ooooh, I'm fired up! Let's go, <value:$28>!<end>"

["260037"]
japanese = "ネメアを助けることができるのは、<line-break>ボクたちだけなんだ。<line-break>行こうよ、<value:$28>。<line-break>次元のはざまにつながっている<line-break>大陸の南西にある島、<line-break>闇の門の島に！<end>"
english = "We're the only ones who can save Nemea. Let's go, <value:$28>―to the Island of the Dark Gate, southwest of the continent, which connects to the Interdimensional Rift!<end>"

["260038"]
japanese = "私はなんとしても、<line-break>ネメア様を救いたいの！<line-break>力を貸して、<value:$28>！<line-break>オルファウスの言っていた<line-break>大陸の南西にある島、<line-break>闇の門の島へ行くのよ！<end>"
english = "I want to save Nemea, no matter what! Lend me your strength, <value:$28>! We're going to the island southwest of the continent that Orphaus mentioned: the Island of the Dark Gate!<end>"

["260039"]
japanese = "大陸の南西、闇の門の島です。<line-break>困難が待ち受けているでしょうが、<line-break>あなたの力を信じていますよ。<end>"
english = "Our destination is the Island of the Dark Gate, southwest of the continent. Hardship doubtless awaits, but I believe in your strength.<end>"

["260040"]
japanese = "やっぱ、ネメア様がいないと<line-break>ディンガル帝国ってダメなのよ。<line-break>くやしいけど、あたしじゃ力不足なの。<line-break>だから、ネメア様を助けに行くわよ。<line-break>大陸の南西にある島、闇の門の島へね。<line-break><end>"
english = "The Dingal Empire really is hopeless without Nemea. I hate to admit it, but I'm not strong enough. So we're going to rescue Nemea on the island southwest of the continent: the Island of the Dark Gate.<end>"

["260041"]
japanese = "大切な事だから確認しとくけど、<line-break>姉ちゃん、オルファウスの話<line-break>忘れてないよな？<line-break>俺たちの目的はネメア救出だぜ。<line-break>そして目的地は大陸の南西にある島だ。<line-break>姉ちゃん、がんばろうな。<end>"
english = "This is important, so let's make sure: you haven't forgotten what Orphaus said, have you, sis? Our objective is to rescue Nemea, and our destination is the island southwest of the continent. Let's give it our best.<end>"

["260042"]
japanese = "ネメア様が…まだ、助かる…？<line-break><line-break><line-break>私からもお願いします、<line-break><value:$28>。<end>"
english = "Nemea can... still be saved...? Please, <value:$28>. I beg you.<end>"

["260043"]
japanese = "破壊神の復活を阻止するためにも、<line-break>ネメアを次元のはざまから<line-break>救出しなきゃならんな。<line-break>そのためにゃ、大陸の南西にある島へ<line-break>行けばいいんだろ。<line-break>何が待っているか楽しみじゃないか。<end>"
english = "We must rescue Nemea from the Interdimensional Rift, if only to prevent the God of Destruction's return. For that, we go to the island southwest of the continent, right? I can't wait to see what awaits us.<end>"

["260044"]
japanese = "大陸の南西にある島へ行くぞ。<line-break>そこで次元のはざまに落ちた<line-break>ネメアを救うのだ。<end>"
english = "We're going to the island southwest of the continent. There we will rescue Nemea, who fell into the Interdimensional Rift.<end>"

["260045"]
japanese = "大陸の南西にある島とは、<line-break>闇の門の島のことかのう。<line-break>ま、行ってみればわかる事じゃな。<line-break>ネメア殿を破壊神ウルグに<line-break>するわけにはいかぬからのう。<line-break>何としても助けるのじゃ。<end>"
english = "Could the island southwest of the continent be the Island of the Dark Gate? Well, we shall know once we go. We cannot allow Nemea to become Urg, the God of Destruction. We must save him at any cost.<end>"

["260046"]
japanese = "ネメアさんを破壊神なんかに<line-break>させちゃいけないよ！<line-break>僕は絶対に助けてみせる。<line-break><value:$28>も<line-break>力を貸してくれるよね。<line-break>行こうよ、闇の門の島へ！<end>"
english = "We can't let Nemea become the God of Destruction! I swear I'll save him. You'll lend me your strength too, won't you, <value:$28>? Come on, let's go to the Island of the Dark Gate!<end>"

["260047"]
japanese = "………………。<end>"
english = "……………….<end>"

["260048"]
japanese = "ネメアなんて興味ないけど、<line-break>破壊神に復活されたりしたら<line-break>アタクシたちエルフは大迷惑よ！<line-break>大陸の南西にある島に行って、<line-break>破壊神の復活を止めさせるわよ！<end>"
english = "I have no interest in Nemea, but if the God of Destruction returns, we Elves will be terribly inconvenienced! We're going to the island southwest of the continent to stop that resurrection!<end>"

["260049"]
japanese = "ネメア救出ボゲー<line-break>a<end>"
english = "Rescue Nemea Bogee a<end>"

["260050"]
japanese = "ネメアさんを助けないと<line-break>破壊神になっちゃうんでしょ？<line-break>それって絶対にダメだよぉ！<line-break>大陸の南西にある島に行けば<line-break>ネメアさんを助けられるんだよ。<line-break><value:$28>、助けに行くよね？<end>"
english = "If we don't save Nemea, he'll become the God of Destruction, right? We absolutely can't let that happen! We can save him by going to the island southwest of the continent. You're going to help, aren't you, <value:$28>?<end>"

["260051"]
japanese = "……………。<line-break><line-break><line-break>闇の門の島へ行くぞ。<end>"
english = "……………. We're going to the Island of the Dark Gate.<end>"

["260052"]
japanese = "次元のはざまに落とされてなお<line-break>生を保つとは、さすがは勇者ネメアだ。<line-break>しかし、それが限界か。<line-break>大陸南西の島とやらに向かうぞ、<line-break><value:$28>。<line-break>破壊神など、降臨させてはならん。<end>"
english = "Still alive after being cast into the Interdimensional Rift―worthy indeed of Nemea the Hero. But perhaps this is the limit. We leave for that island southwest of the continent, <value:$28>. The God of Destruction must not be allowed to descend.<end>"

["260053"]
japanese = "勇者ネメアが破壊神になったら、<line-break>世界中の吟遊詩人が大騒ぎだよ。<line-break>それは、ぼくとしても困るなぁ。<line-break>大陸南西にある闇の門の島に行って、<line-break>破壊神の復活を阻止しようよ。<line-break>ネメアの救出もできてお得だしね。<end>"
english = "If Nemea the Hero becomes the God of Destruction, bards all over the world will make an enormous fuss. That would be a problem for me too. Let's go to the Island of the Dark Gate southwest of the continent and prevent the God of Destruction's return. We get to rescue Nemea too, so it's quite a bargain.<end>"

["260054"]
japanese = "ネメア様が生きておられる！<line-break>闇の門の島で、まだ…まだ、<line-break>お救いできる！<line-break><value:$28>、頼む！<line-break>何としてもネメア様を<line-break>お救いしてくれ！<end>"
english = "Nemea is alive! There is still... still a chance to save him on the Island of the Dark Gate! Please, <value:$28>! Save Nemea, no matter what it takes!<end>"

["260055"]
