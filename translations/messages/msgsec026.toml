english = "……………….<end>"

["260128"]
japanese = "（ゴブゴブ団を名乗る３匹のゴブリンに<line-break>\u3000奪われた聖杯を取り戻すために<line-break>\u3000アイリーンと旅に出たんだ）<line-break>（冒険者をやってれば、どこかの洞窟で<line-break>\u3000バッタリ出くわすかもしれない。<line-break>\u3000その時のために強くならなきゃ）<end>"
english = "(I set out with Irene to recover the Grail stolen by the three Goblins calling themselves the Gob-Gob Gang.) (If I keep working as an adventurer, I may run into them unexpectedly in some cave. I need to grow stronger for that moment.)<end>"

["260129"]
japanese = "３匹のゴブリンに奪われた聖杯ね。<line-break>あいつら聖杯のおかげで話ができる<line-break>ようになったって喜んでたけど…。<line-break>私たちだって聖杯を取り戻すまで<line-break>ロストールには帰れないんだからね。<end>"
english = "The Grail stolen by those three Goblins. They were delighted that it had given them the ability to talk, but... We cannot return to Rostorl until we recover it.<end>"

["260130"]
japanese = "禁断の聖杯を持っておるのが、<line-break>ゴブゴブ団なのじゃな。<line-break>話をするゴブリンとはおもしろい。<line-break>妙な必殺技を使うということじゃが、<line-break>な～に、わしがおる以上安心するが<line-break>よいぞ。早く戦いたいものよのう。<end>"
english = "So the Gob-Gob Gang has the Forbidden Grail. Talking Goblins―how interesting. I hear they use some peculiar special attacks, but fear not while I am here. I can hardly wait to fight them.<end>"

["260131"]
japanese = "ゴブゴブ団って名乗るゴブリンたちが<line-break>持ってるんですよね。それで魔人も<line-break>聖杯をねらっている…。<line-break>私ってけっこう記憶力っていいんです。<line-break>でも、どうしますか？\u3000魔人ってたぶん<line-break>強いですよ。私、逃げちゃうかも…。<end>"
english = "The Goblins calling themselves the Gob-Gob Gang have it, right? And a fiend is after the Grail too... I have quite a good memory, you know. But what should we do? The fiend is probably strong. I might run away...<end>"

["260132"]
japanese = "ゴブリンのくせにゴブゴブ団なんて<line-break>かっこいい名前をつけやがって。<line-break>ちょっとくやしいじゃねえか。<line-break>ダジャレを知らない不届き者なら<line-break>聖杯を取り返すついでに<line-break>成敗してしてやるぜ！<end>"
english = "They're Goblins, yet they had the nerve to give themselves a cool name like the Gob-Gob Gang. I'm a little jealous. If those insolent fools don't appreciate puns, I'll punish them while we're taking back the Grail!<end>"

["260133"]
japanese = "オルファウスさんの話だと魔人のひとり<line-break>アーギルシャイアもねらっているんだ。<line-break>彼女の方が先に手にいれたりしたら…。<line-break>ゴメン…弱気になっちゃダメだよね。<line-break>彼女より先にゴブリンたちを<line-break>捜し出して、聖杯を取り戻そうよ。<end>"
english = "According to Orphaus, one of the fiends, Argyleshire, is after it too. If she gets it first... Sorry. I shouldn't lose heart, should I? Let's find the Goblins before she does and recover the Grail.<end>"

["260134"]
japanese = "持ち主に英知を与える禁断の聖杯。<line-break>その力によって話すことのできるように<line-break>なった３匹のゴブリンを捜すのね？<line-break>お前が魔人アーギルシャイアより先に<line-break>禁断の聖杯を手に入れられるかどうか<line-break>見届けさせてもらうわ。<end>"
english = "The Forbidden Grail grants wisdom to its bearer, and its power enabled three Goblins to speak. You are going to find them, yes? I shall watch and see whether you can obtain the Forbidden Grail before the fiend Argyleshire.<end>"

["260135"]
japanese = "禁断の聖杯は、ゴブゴブ団を名乗る<line-break>３匹のゴブリンが持っています。<line-break><line-break>破壊神ウルグの円卓の騎士のひとり<line-break>アーギルシャイアも聖杯を狙って<line-break>いますから早めに手に入れてください。<end>"
english = "The Forbidden Grail is in the hands of three Goblins calling themselves the Gob-Gob Gang. Argyleshire, one of the Knights of the Round Table serving Urg, the God of Destruction, is also after the Grail, so please recover it quickly.<end>"

["260136"]
japanese = "ゴブゴブ団なんてゴブリンの浅知恵<line-break>にしてはいいネーミングセンスよね。<line-break><line-break>だ・け・ど、世界の平和を守るために<line-break>禁断の聖杯を返してもらわないとね。<line-break>魔人なんかには負けないわよ。<end>"
english = "For Goblins of such limited wit, “Gob-Gob Gang” shows surprisingly good naming sense. But we still need them to return the Forbidden Grail so we can protect world peace. I won't lose to some fiend.<end>"

["260137"]
japanese = "姉ちゃんどうすんだよ。賢者様の頼みを<line-break>聞いてやるのか…いや、聞くんだろな。<line-break>昔っから色男に弱いからな姉ちゃんは。<line-break>それなら早くゴブリンどもを見つけて<line-break>禁断の聖杯とやらを手に入れようぜ。<line-break>魔人が見つけるより先にさ。<end>"
english = "What are you going to do, sis? Take the sage up on his request...? No, of course you will. You've always had a weakness for handsome men. In that case, let's hurry and find those Goblins, then get this Forbidden Grail before the fiend finds it.<end>"

["260138"]
japanese = "禁断の聖杯は破壊神を蘇らせるために<line-break>造られた闇の神器のひとつよ。<line-break><line-break>禁断の聖杯には、持ち主に英知を与える<line-break>力があるのよ。ゴブリンが賢くなった<line-break>のも、その力が原因でしょうね。<end>"
english = "The Forbidden Grail is one of the dark artifacts created to resurrect the God of Destruction. It has the power to grant wisdom to its bearer. That power must be what made the Goblins intelligent.<end>"

["260139"]
japanese = "ゴブリンどももやっかいな物を奪って<line-break>くれたもんだぜ。<line-break>ま、闇の神器だからなぁ。<line-break>しゃーねーな。魔人に奪われると<line-break>やっかいだからゴブリンどもを見つけて<line-break>聖杯を取り戻すとすっか。<end>"
english = "Those Goblins just had to steal something troublesome, didn't they? Well, it is a dark artifact. Can't be helped. It'll be even more trouble if a fiend takes it, so let's find those Goblins and get the Grail back.<end>"

["260140"]
japanese = "魔人アーギルシャイア…。<line-break>奴に聖杯を渡すわけにはいかない。<line-break><line-break>なんとしても奴より先に禁断の聖杯を<line-break>手に入れるぞ。これ以上、犠牲者を…<line-break>罪を犯させるわけにはいかないのだ！<end>"
english = "The fiend Argyleshire... We cannot let the Grail fall into her hands. Whatever it takes, we will secure the Forbidden Grail first. I cannot let her claim any more victims... commit any more sins!<end>"

["260141"]
japanese = "オルファウス殿の話では３匹のゴブリン<line-break>…ゴブゴブ団とか名乗っとる<line-break>奴らが持っておるというのじゃな。<line-break>しかも魔人がねらっておるらしいとな。<line-break>ならば、なんとしても魔人より先に<line-break>聖杯を取り戻さんといかんのう。<end>"
english = "According to Lord Orphaus, three Goblins have it... fellows calling themselves the Gob-Gob Gang, or some such. And it seems a fiend is after it as well. Then we must recover the Grail before that fiend does, no matter what.<end>"

["260142"]
japanese = "オルファウスさんにゴブリンたちから<line-break>禁断の聖杯を取り戻してくれるよう<line-break>頼まれたんだよね。<line-break>魔人アーギルシャイアもねらっている<line-break>みたいだし、早くゴブリンたちを見つけ<line-break>ないといけないね。<end>"
english = "Orphaus asked us to recover the Forbidden Grail from the Goblins, right? The fiend Argyleshire seems to be after it too, so we need to find the Goblins quickly.<end>"

["260143"]
japanese = "………………。<end>"
english = "……………….<end>"

["260144"]
japanese = "禁断の聖杯？\u3000闇の神器？<line-break>高貴なエルフのアタクシが知らない単語<line-break>を並べて困らせようっていうのね。<line-break>残念だったわね。優雅で気品あふれる<line-break>エルフには、人間の粗野で下品な知識は<line-break>不必要なの。わかったかしら？<end>"
english = "The Forbidden Grail? A dark artifact? You're trying to fluster noble moi with a string of words I don't know. Too bad. A graceful, refined Elf has no need for the crude, vulgar knowledge of humans. Is that clear?<end>"

["260145"]
japanese = "聖杯を狙う魔人など拙者が<line-break>成敗してくれる…。<line-break><line-break>聖杯と成敗がダジャレになって<line-break>いるのですが、どうですかな？<line-break>やっぱり、ダメですか…。<end>"
english = "I shall give any fiend after the Grail a grave reckoning... You see, “Grail” and “grave” make a pun. What do you think? No good after all...?<end>"

["260146"]
japanese = "聖杯を持っているゴブリン３匹は<line-break>ゴブゴブ団って名乗ってるんだよね。<line-break>それでね、お話できるんでしょ。<line-break>なんとかお願いして、聖杯を渡して<line-break>もらえないかなぁ。<end>"
english = "The three Goblins with the Grail call themselves the Gob-Gob Gang, right? And they can talk, can't they? Maybe we could ask nicely and persuade them to give us the Grail.<end>"

["260147"]
japanese = "………………。<line-break><line-break><line-break>闇の神器のひとつらしいな。<line-break>魔人アーギルシャイアもねらっている。<line-break>ゴブリンどもを捜すのだ。<end>"
english = "………………. It appears to be one of the dark artifacts. The fiend Argyleshire is after it as well. Find those Goblins.<end>"

["260148"]
japanese = "破壊神ウルグを復活させるために<line-break>造られた１２の闇の神器のひとつ…<line-break>ゴブリンもやっかいな物を盗んだな。<line-break>魔人アーギルシャイアに渡すわけにも<line-break>いかない以上、俺たちがゴブリンから<line-break>奪い返すしかないな。<end>"
english = "One of the twelve dark artifacts created to resurrect Urg, the God of Destruction... Those Goblins stole something truly troublesome. Since we can't let it fall into Argyleshire's hands, we'll have to take it back from them ourselves.<end>"

["260149"]
japanese = "ゴブゴブ団に奪われし禁断の聖杯。<line-break>闇の神器と呼ばれる聖杯を求め旅を<line-break>する吟遊詩人と勇者…。<line-break>その行く手を阻む魔人アーギルシャイア<line-break>との激しい死闘…うん！\u3000いいよこれ！<line-break>ぼくたち伝説になれるかもしれないね。<end>"
english = "The Forbidden Grail, stolen by the Gob-Gob Gang. A bard and a hero journey in search of the Grail known as a dark artifact... A fierce battle to the death against the fiend Argyleshire, who bars the way... Yes! This is good! We might become legends!<end>"

["260150"]
japanese = "禁断の聖杯のありかだと？<line-break><line-break><line-break>まあ、ディンガル諜報部を使えば<line-break>造作もなく調べがつくだろうが…<end>"
english = "You want to know where the Forbidden Grail is? Well, Dingal Intelligence could discover that easily enough, but...<end>"

["260151"]
japanese = "その…ゴブゴブ団？\u3000という方々が、<line-break>禁断の聖杯を持ち逃げしていると。<line-break>やっかいですね…。<end>"
english = "These people called the... Gob-Gob Gang? They have absconded with the Forbidden Grail. How troublesome...<end>"

["260152"]
japanese = "禁断の聖杯って…<line-break>魔人が狙ってるんでしょ？<line-break>そんなの持って動いてるなんて…<line-break>ゴブリンは危険を感じないのかな？<end>"
english = "The Forbidden Grail... A fiend is after it, right? Carrying something like that around... Don't the Goblins sense the danger?<end>"

["260153"]
japanese = "かのゴブリンめら、<line-break>さすがに禁断の聖杯の<line-break>恐ろしさまでは知らぬのだろう。<line-break>このままではきゃつらの身を、<line-break>どんな災厄が襲うか知れぬ。<line-break>急ぎ、ゴブリンたちを探し出すのじゃ！<end>"
english = "Those Goblins surely do not understand how terrifying the Forbidden Grail truly is. There is no telling what calamity may befall them if this continues. Hurry and find the Goblins!<end>"

["260154"]
japanese = "聖杯の力か、あのゴブリンたちは<line-break>行動力も高い。どこで出くわすか、<line-break>わかったものじゃない。<line-break>そのチャンスを逃さないためにも、<line-break>腕を鍛えておかないとな、<line-break><value:$28>。<end>"
english = "Maybe it's the Grail's power, but those Goblins certainly get around. There's no telling where we might run into them. We need to keep our skills sharp so we don't miss our chance, <value:$28>.<end>"

["260155"]
japanese = "放っておくわけにもいかないだろう。<line-break>魔人アーギルシャイアより先に <line-break>ゴブリンたちを見つけるんだ。<end>"
english = "We can't just leave this alone. Find the Goblins before the fiend Argyleshire does.<end>"

["260156"]
japanese = "聖杯を持つゴブリンたちを<line-break>魔人アーギルシャイアより先に<line-break>見つけ出さないと。<line-break>闇の神器を魔人の手に、<line-break>渡すわけにはいかないわ。<end>"
english = "We have to find the Goblins carrying the Grail before the fiend Argyleshire does. We can't let a dark artifact fall into a fiend's hands.<end>"

["260157"]
japanese = "闇の神器が魔人アーギルシャイア<line-break>の手に渡ると危険です。 <line-break>\u3000<line-break>探索を急いだ方がいいでしょう。<end>"
english = "It would be dangerous for the dark artifact to fall into the fiend Argyleshire's hands. We should hurry our search.<end>"

["260158"]
japanese = "オルファウスさんのお話だと<line-break>聖杯を持ったゴブリンたちを<line-break>魔人がねらっているらしいです。<line-break>魔人に聖杯を取られちゃう前に<line-break>ゴブリンたちを見つけないとですね！<line-break>でも…どこにいるんでしょう？<end>"
english = "According to Orphaus, a fiend is apparently after the Goblins carrying the Grail. We need to find the Goblins before the fiend takes it! But... where could they be?<end>"

["260159"]
japanese = "………………。<end>"
english = "……………….<end>"

["260160"]
japanese = "（猫屋敷のオルファウスと自称魔人の<line-break>\u3000猫ネモの話だと、３匹のゴブリンは<line-break>\u3000エンシャントへ向かったらしい）<line-break>（魔人アーギルシャイアより先に手に<line-break>\u3000入れるためにも、エンシャントへ早く<line-break>\u3000行って町中を捜さなきゃいけない）<end>"
english = "(According to Orphaus of Cat Manor and Nemo, the cat who calls himself a fiend, the three Goblins apparently headed for Ancient.) (To get the Grail before the fiend Argyleshire does, I need to hurry to Ancient and search the whole city.)<end>"

["260161"]
japanese = "オルファウスさんの話だと、あいつら<line-break>エンシャントへ向かったんでしょ。<line-break>宿屋とか酒場とか捜してみましょう。<line-break>町中をうろつくゴブリンなんて<line-break>珍しいもの。絶対に目撃者が<line-break>いるはずよ！<end>"
english = "Orphaus said those three headed for Ancient, right? Let's check the inns and taverns. Goblins wandering around the city would be unusual. Someone must have seen them!<end>"

["260162"]
japanese = "猫屋敷の賢者殿の話では、<line-break>ゴブゴブ団を名乗る３匹のしゃべる<line-break>ゴブリンはエンシャントにおるのだな。<line-break>そこまでわかっとるんだ、<line-break>迷うことなくエンシャントを<line-break>捜してみようではないか。<end>"
english = "According to the sage of Cat Manor, the three talking Goblins who call themselves the Gob-Gob Gang are in Ancient. Since we know that much, let us waste no time searching Ancient.<end>"

["260163"]
japanese = "オルファウスさんの話だと、<line-break>エンシャントにいるんですよね？<line-break>行ってみましょうよ！<line-break>アーギルシャイアより先に見つけないと<line-break>大変なことになっちゃいますよ。<end>"
english = "Orphaus said they're in Ancient, right? Let's go! If we don't find them before Argyleshire, something terrible could happen.<end>"

["260164"]
japanese = "エンシャントへ行ったって話なんだろ。<line-break>だったら行けばいいじゃねえか。<line-break>何を迷う必要があるんだよ。<line-break>もしゴブリンどもがいなかったら<line-break>猫屋敷に帰って、俺らをだました<line-break>エセ賢者をぶん殴ってやる。<end>"
english = "We heard they went to Ancient, right? Then let's just go. What's there to hesitate about? If the Goblins aren't there, we'll go back to Cat Manor and beat up that sham sage for tricking us.<end>"

["260165"]
japanese = "オルファウスさんからエンシャントに<line-break>いるって聞いたんだよね。<line-break>それなら迷う事なんてないよ。<line-break>ボク、賢者様の事は信用してもいいと<line-break>思うよ。べ、別に確信があるわけじゃ<line-break>ないけど…。<end>"
english = "Orphaus told us they're in Ancient, right? Then there's nothing to hesitate over. I think we can trust the sage. N-not that I'm completely sure or anything...<end>"

["260166"]
japanese = "オルファウスの言うことには、<line-break>三匹のしゃべるゴブリンは、<line-break>エンシャントにいるらしいわ。<line-break>寄り道していると追い抜くわよ、<line-break><value:$28>。<end>"
english = "According to Orphaus, the three talking Goblins are apparently in Ancient. If we keep making detours, we'll be beaten to them, <value:$28>.<end>"

["260167"]
japanese = "おやまあ、まだ出会ってなかったの<line-break>ですか。やれやれ、私の話を聞いて<line-break>なかったのか忘れちゃったのか…。<line-break>まだいるかどうかはわかりませんが<line-break>エンシャントの酒場に<line-break>行ってみましょう。<end>"
english = "Oh my, you still haven't found them? Good grief. Either you weren't listening to me, or you've forgotten... I don't know whether they're still there, but let's try the tavern in Ancient.<end>"

["260168"]
japanese = "うっそー、せっかく猫屋敷の賢者様に<line-break>教えていただいたのにお忘れに<line-break>なったのですか？<line-break>ああ、なんともったいないことを…。<line-break>しょうがないのでエンシャントの酒場に<line-break>でも行ってみましょう…な～んてね。<end>"
english = "No way! You forgot after the sage of Cat Manor was kind enough to tell you? Oh, what a terrible waste... I suppose we'll just have to try the tavern in Ancient or something... Just kidding.<end>"

["260169"]
japanese = "姉ちゃん、もう忘れたのかよ。<line-break>まだ若いのにかわいそうになぁ。<line-break>もしかして賢者様に見とれてたのか？<line-break>あっ、ゴメン！\u3000冗談だよ姉ちゃん。<line-break>エンシャントだよ、賢者様の話だと。<line-break>教えたんだからその手を下ろしてよ。<end>"
english = "Sis, have you forgotten already? How sad, when you're still so young. Were you too busy admiring the sage? Oh, sorry! I'm joking, Sis. The sage said Ancient. I've told you now, so put that hand down.<end>"

["260170"]
japanese = "………………。<end>"
english = "……………….<end>"

["260171"]
japanese = "ゴブゴブ団を名乗る３匹のゴブリンは<line-break>エンシャントにいるってオルファウスは<line-break>言っていたよな…違ったかな。<line-break>まあ、エンシャントへ行ってみようや。<line-break>酒場とか宿屋とか奴らの行きそうな所を<line-break>中心に捜してみるとしようや。<end>"
english = "Orphaus said the three Goblins calling themselves the Gob-Gob Gang were in Ancient... didn't he? Well, let's go to Ancient. We can focus our search on places they're likely to visit, like taverns and inns.<end>"

["260172"]
japanese = "エンシャントだ！<line-break>奴らはエンシャントにいると<line-break>オルファウスに聞いたのだろう！<line-break>アーギルシャイアより先にヤツらを<line-break>見つけて禁断の聖杯を手に入れる。<line-break>これ以上、犠牲者は出さない。<end>"
english = "Ancient! Orphaus told you they're in Ancient! We'll find them before Argyleshire and secure the Forbidden Grail. There will be no more victims.<end>"

["260173"]
japanese = "うむ、オルファウス殿はエンシャントを<line-break>捜してみるようおっしゃっておった<line-break>そうじゃが、どうするかの？<line-break>ゴブリンどもも腹も減るし眠くもなる<line-break>であろう。宿屋か酒場あたりがねらい目<line-break>じゃと思うのじゃがどうじゃ？<end>"
english = "Hmm. I hear Orphaus advised us to search Ancient. What shall we do? Goblins grow hungry and sleepy too. I think an inn or tavern would be our best bet. What say you?<end>"

["260174"]
japanese = "オルファウスさんは、エンシャントを<line-break>捜すように言っていたんだよね？<line-break>助言に従ってエンシャントに行こうよ。<line-break>エンシャントは都会だけど、話のできる<line-break>ゴブリンなんて珍しいから、<line-break>すぐに見つかるんじゃないのかな。<end>"
english = "Orphaus said to search Ancient, right? Let's follow that advice and go there. Ancient is a big city, but talking Goblins are so unusual that we might find them right away.<end>"

["260175"]
japanese = "………………。<end>"
english = "……………….<end>"

["260176"]
japanese = "高貴なエルフのアタクシが低能で<line-break>不細工極まりないゴブリンどもの<line-break>ことなんて知るわけないでしょ！<line-break>ゴブリンのゴの字を聞いただけで<line-break>優雅なアタクシの耳が汚れてしまうわ！<line-break>二度と口にしないでちょうだい！<end>"
english = "Why would a noble Elf such as moi know anything about those witless, hideously ugly Goblins?! Merely hearing the first sound of “Goblin” sullies my elegant ears! Never mention them again!<end>"

["260177"]
japanese = "兄弟子！<line-break>話すゴブリンなぞ<line-break>見・放しましょうぞ！<line-break>………………。<line-break>修行しなおす所存。<line-break>ごめん！<end>"
english = "Senior disciple! Let us aban-don those talking Goblins! ………………. I intend to begin my training anew. Sorry!<end>"

["260178"]
japanese = "オルファウスさんがゴブリンたちは<line-break>エンシャントにいるって<line-break>教えてくれたんでしょ？<line-break>エンシャントは大きな町だから捜すの<line-break>大変かもしれないけど安心していいよ。<line-break>だってルルアンタがついてるもん。<end>"
english = "Orphaus told you the Goblins are in Ancient, right? Ancient is a big city, so finding them might be hard, but don't worry. You've got Lulluantha with you!<end>"

["260179"]
japanese = "………………。<line-break><line-break><line-break>エンシャントだ。<line-break>あとは知らん。<end>"
english = "………………. Ancient. That's all I know.<end>"

["260180"]
japanese = "猫屋敷の賢者とやらに教えてもらった<line-break>のだろう。忘れてしまったのか？<line-break>確か、エンシャントではなかったか。<line-break>俺もそれ以上のことは知らん。<line-break>あとは自分の力で捜すのだな。<end>"
english = "That so-called sage at Cat Manor told you, did he not? Have you forgotten? If I recall correctly, it was Ancient. I know nothing beyond that. You'll have to search on your own.<end>"

["260181"]
japanese = "ゴブゴブ団を名乗る話すことの<line-break>できるゴブリンたちのことでしょ。<line-break>話ができるゴブリンってすごいよねぇ。<line-break>えっ！\u3000どこにいるのかって？<line-break>オルファウスさんにエンシャントを<line-break>捜せって教えてもらったんでしょ。<end>"
english = "You mean the talking Goblins who call themselves the Gob-Gob Gang, right? Goblins that can talk are amazing, aren't they? What? You want to know where they are? Orphaus told you to search Ancient, didn't he?<end>"

["260182"]
japanese = "君は、ゴブリンの行き先まで私に<line-break>聞こうというのかね？<line-break>私はそこまで暇な人間ではない。<end>"
english = "You mean to ask me where the Goblins went as well? I am not so idle as that.<end>"

["260183"]
japanese = "ゴブゴブ団？<line-break>申し訳ございません。ゴブリンの考える<line-break>ことまでは、ちょっと…。<end>"
english = "The Gob-Gob Gang? My apologies. I couldn't begin to guess what a Goblin might be thinking...<end>"

["260184"]
japanese = "ゴブゴブ団なら<line-break>エンシャントへ行ったんだって。<line-break>…目立つよね、あの三匹。<end>"
english = "I heard the Gob-Gob Gang went to Ancient. Those three really stand out, don't they...<end>"

["260185"]
japanese = "オルファウス殿の言によるならば、<line-break>ゴブリンめらはエンシャントへ向かった<line-break>そうじゃな。<line-break>エンシャントのような人の多い町中では<line-break>おそらく目立つじゃろうから、<line-break>それだけにわしらも遅れはとれぬぞ。<end>"
english = "According to Orphaus, the wretched Goblins headed for Ancient. They will probably stand out in a crowded city like that, which is all the more reason we cannot afford to fall behind.<end>"

["260186"]
japanese = "猫屋敷の賢者様の言うことには、<line-break>ゴブゴブ団はエンシャントへ<line-break>向かったらしいじゃないか。<line-break>人間と同じ思考をするかは<line-break>わからないが、<line-break>酒場や宿屋をあたってみよう。<end>"
english = "The sage of Cat Manor apparently said the Gob-Gob Gang headed for Ancient. I don't know whether they think like humans, but let's check the taverns and inns.<end>"

["260187"]
japanese = "エンシャントに向かったと <line-break>あの猫が言っていたな。<line-break><line-break>酒場やギルドで聞き込みをすれば<line-break>何かわかるかもしれないな。<end>"
english = "That cat said they headed for Ancient. If we ask around at the taverns and the Guild, we might learn something.<end>"

["260188"]
japanese = "たしか、エンシャントに<line-break>向かったって言ってたわね。<line-break><line-break>しゃべるゴブリンなんて珍しいから、<line-break>街の人が目撃してるはずだわ。<end>"
english = "If I remember correctly, we were told they headed for Ancient. Talking Goblins are so unusual that someone in the city must have seen them.<end>"

["260189"]
japanese = "………………。<end>"
english = "……………….<end>"

["260190"]
japanese = "猫さんの話だと、ゴブゴブ団は<line-break>エンシャントに向かったそうです。<line-break>\u3000<line-break>きっと街の人がしゃべるゴブリンたちを<line-break>見かけているはずです。<line-break>色んな人に話を聞いてみましょう！<end>"
english = "According to the cat, the Gob-Gob Gang headed for Ancient. Someone in the city must have seen those talking Goblins. Let's ask around!<end>"

["260191"]
japanese = "………………。<end>"
english = "……………….<end>"

["260192"]
japanese = "（オルファウスにゴブゴブ団を名乗る<line-break>\u3000３匹のゴブリンたちから取り戻す<line-break>\u3000よう頼まれた。闇の神器のひとつ）<line-break>（魔人アーギルシャイアも聖杯を狙って<line-break>\u3000いるので、一刻も早く手に入れないと<line-break>\u3000いけない）<end>"
english = "(Orphaus asked me to recover one of the dark artifacts from the three Goblins calling themselves the Gob-Gob Gang.) (The fiend Argyleshire is also after the Grail, so I must obtain it as quickly as possible.)<end>"

["260193"]
japanese = "あの聖杯は闇の神器なんて呼ばれる<line-break>古代の魔道器だったのね…。<line-break>ぐずぐずしていられないわ。<line-break>一刻も早く３匹のゴブリンを見つけて<line-break>聖杯を奪い返すのよ。アーギルシャイア<line-break>なんて魔人より先にね。<end>"
english = "So that Grail was an ancient magical device known as a dark artifact... We can't waste time. We have to find the three Goblins at once and take the Grail back before that fiend Argyleshire does.<end>"

["260194"]
japanese = "禁断の聖杯を持っておるのが、<line-break>ゴブゴブ団なのじゃな。<line-break>話をするゴブリンとはおもしろい。<line-break>妙な必殺技を使うということじゃが、<line-break>な～に、わしがおる以上安心するが<line-break>よいぞ。早く戦いたいものよのう。<end>"
english = "So the Gob-Gob Gang has the Forbidden Grail. Talking Goblins―how interesting. I hear they use some peculiar finishing moves, but fear not while I am here. I can hardly wait to fight them.<end>"

["260195"]
japanese = "ゴブゴブ団って名乗るゴブリンたちが<line-break>持ってるんですよね。それで魔人も<line-break>聖杯をねらっている…。<line-break>私ってけっこう記憶力っていいんです。<line-break>でも、どうしますか？\u3000魔人ってたぶん<line-break>強いですよ。私、逃げちゃうかも…。<end>"
english = "The Goblins calling themselves the Gob-Gob Gang have it, right? And a fiend is after the Grail too... I have quite a good memory, you know. But what should we do? The fiend is probably strong. I might run away...<end>"

["260196"]
japanese = "ゴブリンのくせにゴブゴブ団なんて<line-break>かっこいい名前をつけやがって。<line-break>ちょっとくやしいじゃねえか。<line-break>ダジャレを知らない不届き者なら<line-break>聖杯を取り返すついでに<line-break>成敗してしてやるぜ！<end>"
english = "They're Goblins, yet they had the nerve to give themselves a cool name like the Gob-Gob Gang. Makes me a little jealous. If those insolent fools don't appreciate puns, I'll punish them while we're taking back the Grail!<end>"

["260197"]
japanese = "オルファウスさんの話だと魔人のひとり<line-break>アーギルシャイアもねらっているんだ。<line-break>彼女の方が先に手にいれたりしたら…。<line-break>ゴメン…弱気になっちゃダメだよね。<line-break>彼女より先にゴブリンたちを<line-break>捜し出して、聖杯を取り戻そうよ。<end>"
english = "According to Orphaus, one of the fiends, Argyleshire, is after it too. If she gets it first... Sorry. I shouldn't lose heart, should I? Let's find the Goblins before she does and recover the Grail.<end>"

["260198"]
japanese = "持ち主に英知を与える禁断の聖杯。<line-break>その力によって話すことのできるように<line-break>なった３匹のゴブリンを捜すのね？<line-break>お前が魔人アーギルシャイアより先に<line-break>禁断の聖杯を手に入れられるかどうか<line-break>見届けさせてもらうわ。<end>"
english = "The Forbidden Grail grants wisdom to its bearer. You're searching for the three Goblins who gained the power of speech from it, yes? I shall watch and see whether you can obtain the Forbidden Grail before the fiend Argyleshire.<end>"

["260199"]
japanese = "禁断の聖杯は、ゴブゴブ団を名乗る<line-break>３匹のゴブリンが持っています。<line-break><line-break>破壊神ウルグの円卓の騎士のひとり<line-break>アーギルシャイアも聖杯を狙って<line-break>いますから早めに手に入れてください。<end>"
english = "The Forbidden Grail is in the hands of three Goblins calling themselves the Gob-Gob Gang. Argyleshire, one of the Knights of the Round Table serving Urg, the God of Destruction, is also after the Grail, so please obtain it quickly.<end>"

["260200"]
japanese = "ゴブゴブ団なんてゴブリンの浅知恵<line-break>にしてはいいネーミングセンスよね。<line-break><line-break>だ・け・ど、世界の平和を守るために<line-break>禁断の聖杯を返してもらわないとね。<line-break>魔人なんかには負けないわよ。<end>"
english = "For Goblins of such limited wit, “Gob-Gob Gang” is a surprisingly good name. But―we need them to return the Forbidden Grail so we can protect world peace. I won't lose to some fiend!<end>"

["260201"]
japanese = "姉ちゃんどうすんだよ。賢者様の頼みを<line-break>聞いてやるのか…いや、聞くんだろな。<line-break>昔っから色男に弱いからな姉ちゃんは。<line-break>それなら早くゴブリンどもを見つけて<line-break>禁断の聖杯とやらを手に入れようぜ。<line-break>魔人が見つけるより先にさ。<end>"
english = "What're you going to do, Sis? Are you going to do what the sage asked? Well... yeah, of course you are. You've always had a weakness for handsome men. In that case, let's hurry up, find those Goblins, and get this so-called Forbidden Grail before the fiend does.<end>"

["260202"]
japanese = "禁断の聖杯は破壊神を蘇らせるために<line-break>造られた闇の神器のひとつよ。<line-break><line-break>禁断の聖杯には、持ち主に英知を与える<line-break>力があるのよ。ゴブリンが賢くなった<line-break>のも、その力が原因でしょうね。<end>"
english = "The Forbidden Grail is one of the dark artifacts created to resurrect the God of Destruction. It has the power to grant wisdom to its bearer. That power is probably what made the Goblins intelligent.<end>"

["260203"]
japanese = "ゴブリンどももやっかいな物を奪って<line-break>くれたもんだぜ。<line-break>ま、闇の神器だからなぁ。<line-break>しゃーねーな。魔人に奪われると<line-break>やっかいだからゴブリンどもを見つけて<line-break>聖杯を取り戻すとすっか。<end>"
english = "Those Goblins just had to steal something troublesome, didn't they? Well, it is a dark artifact. Can't be helped. It'll be even more trouble if a fiend takes it, so let's find those Goblins and get the Grail back.<end>"

["260204"]
japanese = "魔人アーギルシャイア…。<line-break>奴に聖杯を渡すわけにはいかない。<line-break><line-break>なんとしても奴より先に禁断の聖杯を<line-break>手に入れるぞ。これ以上、犠牲者を…<line-break>罪を犯させるわけにはいかないのだ！<end>"
english = "The fiend Argyleshire... We cannot let her have the Grail. Whatever it takes, we will secure the Forbidden Grail before she does. I cannot let her claim any more victims... commit any more sins!<end>"

["260205"]
japanese = "オルファウス殿の話では３匹のゴブリン<line-break>…ゴブゴブ団とか名乗っとる<line-break>奴らが持っておるというのじゃな。<line-break>しかも魔人がねらっておるらしいとな。<line-break>ならば、なんとしても魔人より先に<line-break>聖杯を取り戻さんといかんのう。<end>"
english = "According to Orphaus, three Goblins have it... fellows calling themselves the Gob-Gob Gang, or some such. And it seems a fiend is after it as well. Then we must recover the Grail before that fiend does, no matter what.<end>"

["260206"]
japanese = "オルファウスさんにゴブリンたちから<line-break>禁断の聖杯を取り戻してくれるよう<line-break>頼まれたんだよね。<line-break>魔人アーギルシャイアもねらっている<line-break>みたいだし、早くゴブリンたちを見つけ<line-break>ないといけないね。<end>"
english = "Orphaus asked us to recover the Forbidden Grail from the Goblins, right? It looks like the fiend Argyleshire is after it too, so we need to find the Goblins quickly.<end>"

["260207"]
japanese = "………………。<end>"
english = "……………….<end>"

["260208"]
japanese = "禁断の聖杯？\u3000闇の神器？<line-break>高貴なエルフのアタクシが知らない単語<line-break>を並べて困らせようっていうのね。<line-break>残念だったわね。優雅で気品あふれる<line-break>エルフには、人間の粗野で下品な知識は<line-break>不必要なの。わかったかしら？<end>"
english = "The Forbidden Grail? A dark artifact? You're trying to trouble noble moi by rattling off words I don't know. Too bad. A graceful, refined Elf has no need for the crude and vulgar knowledge of humans. Is that clear?<end>"

["260209"]
japanese = "聖杯を狙う魔人など拙者が<line-break>成敗してくれる…。<line-break><line-break>聖杯と成敗がダジャレになって<line-break>いるのですが、どうですかな？<line-break>やっぱり、ダメですか…。<end>"
english = "Any fiend who seeks the Grail shall be assailed by me... You see, “Grail” and “assail” are supposed to make a pun. What do you think? It still doesn't work, does it...<end>"

["260210"]
japanese = "聖杯を持っているゴブリン３匹は<line-break>ゴブゴブ団って名乗ってるんだよね。<line-break>それでね、お話できるんでしょ。<line-break>なんとかお願いして、聖杯を渡して<line-break>もらえないかなぁ。<end>"
english = "The three Goblins with the Grail call themselves the Gob-Gob Gang, right? And they can talk, can't they? Maybe we could ask nicely and somehow persuade them to hand over the Grail.<end>"

["260211"]
japanese = "………………。<line-break><line-break><line-break>闇の神器のひとつらしいな。<line-break>魔人アーギルシャイアもねらっている。<line-break>ゴブリンどもを捜すのだ。<end>"
english = "………………. Apparently, it's one of the dark artifacts. The fiend Argyleshire is after it too. Find those Goblins.<end>"

["260212"]
japanese = "破壊神ウルグを復活させるために<line-break>造られた１２の闇の神器のひとつ…<line-break>ゴブリンもやっかいな物を盗んだな。<line-break>魔人アーギルシャイアに渡すわけにも<line-break>いかない以上、俺たちがゴブリンから<line-break>奪い返すしかないな。<end>"
english = "One of the twelve dark artifacts created to resurrect Urg, the God of Destruction... Those Goblins stole something truly troublesome. Since we can't let it fall into the fiend Argyleshire's hands, we'll have to take it back from the Goblins ourselves.<end>"

["260213"]
japanese = "ゴブゴブ団に奪われし禁断の聖杯。<line-break>闇の神器と呼ばれる聖杯を求め旅を<line-break>する吟遊詩人と勇者…。<line-break>その行く手を阻む魔人アーギルシャイア<line-break>との激しい死闘…うん！\u3000いいよこれ！<line-break>ぼくたち伝説になれるかもしれないね。<end>"
english = "The Forbidden Grail, stolen by the Gob-Gob Gang. A bard and a hero journey in search of the Grail known as a dark artifact... A fierce battle to the death with the fiend Argyleshire, who bars the way... Yes! This is good! We might become legends!<end>"

["260214"]
japanese = "魔人アーギルシャイアが<line-break>動き出したか…。<line-break><line-break>禁断の聖杯、闇の神器が、<line-break>それほど価値のあるものだと<line-break>証明していることに他ならない。<line-break>我々も、遅れはとれんな。<end>"
english = "So the fiend Argyleshire has made a move... That alone proves just how valuable the Forbidden Grail, a dark artifact, must be. We cannot afford to fall behind.<end>"

["260215"]
japanese = "禁断の聖杯を持ち逃げしている<line-break>ゴブリンたち、ゴブゴブ団を、<line-break>魔人アーギルシャイアが狙っている…。<line-break>賢者様の言うことに間違いは<line-break>ないでしょう。とすれば、<line-break>かわいそうですが、今頃はきっと…。<end>"
english = "The fiend Argyleshire is hunting the Goblins who made off with the Forbidden Grail―the Gob-Gob Gang... The sage is surely not mistaken. If that's true, then regrettably, by now they must surely have...<end>"

["260216"]
japanese = "猫屋敷の賢者様のお言葉には<line-break>万に一つの間違いもないんだって。<line-break><line-break>魔人アーギルシャイアが<line-break>禁断の聖杯を狙っているとすると、<line-break>そのゴブリンたち、今頃はきっと…。<end>"
english = "They say there isn't even a one-in-ten-thousand chance that the sage of Cat Manor could be wrong. If the fiend Argyleshire is after the Forbidden Grail, then by now those Goblins must surely have...<end>"

