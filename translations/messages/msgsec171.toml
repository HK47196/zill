japanese = "<if><value:$01><equal>2この亀裂…。<line-break>さっきの声が言ってたのはこれね。<line-break>これじゃ進めそうもないわね。 <end><if><value:$01><equal>3なんじゃ、これはまたえらく大胆に<line-break>道を断ってくれたもんじゃのう。<line-break>これではさすがに進めぬか。 <end><if><value:$01><equal>4これはすごいわ。<line-break>道を断つにも限度があるかも。 <end><if><value:$01><equal>5だあぁぁぁぁ！？<line-break>ここまでやるか普通？<line-break>しゃあないな。引き返すか。 <end><if><value:$01><equal>6これじゃ先に進めないね。<line-break>こんな亀裂、飛び越せないよ。<line-break><value:$28>、戻ろう。 <end><if><value:$01><equal>7これでは先に進めないわね。<line-break>戻るしかないわ。 <end><if><value:$01><equal>9あ～あ、<line-break>これはまたわかりやすすぎるくらい<line-break>先に進めないじゃん。戻ろっか。 <end><if><value:$01><equal>12これじゃあ、先に進めないな。<line-break>仕方ない、戻るとしようや。 <end><if><value:$01><equal>13…これでは、<line-break>先には進めんな。<line-break>引き返すぞ。 <end><if><value:$01><equal>10姉ちゃん！\u3000見ろよこれ。<line-break>まったく、むちゃくちゃするよな。<line-break>しゃあないな、帰ろうか。 <end><if><value:$01><equal>14これでは先に進めんわい。<line-break>戻るしかないのう。 <end><if><value:$01><equal>15ねえ、<value:$28>、<line-break>これじゃ先に進めないよ。<line-break>戻るしかないね。 <end><if><value:$01><equal>17ちょっと、これはどういうことなの！？<line-break>ここまでは無駄足だったわけ？<line-break>キー！！\u3000さっさと戻るのよー！ <end><if><value:$01><equal>19<value:$28>、すごい穴だよ。<line-break>これじゃあ、先に進めないよぉ。<line-break>ねぇ、戻ろう。 <end><if><value:$01><equal>20…戻るぞ。 <end><if><value:$01><equal>11戻るしかなさそうね。<end><if><value:$01><equal>21戻るしかないようだな。<end><if><value:$01><equal>23これでは先に進めないな。<line-break>戻ろう。<end><if><value:$01><equal>27これでは先に進めないな。<line-break>戻ろう、<value:$28>。<end><if><value:$01><equal>26これではさすがに進めぬな。 <line-break>戻るしかなさそうじゃな。<end><if><value:$01><equal>24これでは先に進めませんね。<line-break>戻りましょう、<value:$28>様。<end><if><value:$01><equal>25すごい穴ね。<line-break>これじゃあ、先に進めないよ。<line-break>ねぇ、戻ろう。 <end><if><value:$01><equal>192これでは先に進めません。<line-break>これは戻ったほうがよさそうですね。<end><if><value:$01><equal>193すごい亀裂…。<line-break>まさかここまでするなんて。<line-break>仕方ありません、戻りましょう。<end><if><value:$01><equal>194この亀裂は…。<line-break>やってくれたな海王。<line-break>これでは戻るしかない。<end><if><value:$01><equal>191これはすごいわね。<line-break>…って感心してる場合じゃないんだわ。<line-break>残念だけど、戻るしかないわね。<end><if><value:$01><equal>190これでは先に進めないな。<line-break>引き返すしかなさそうだ。<end>あらら。<line-break>これじゃあ、先に進めないよ。<line-break>すごいね、海王の力って。<line-break>しょうがない、戻ろっか。 <end>"
english = "<if><value:$01><equal>2This fissure... So this is what that voice was talking about. It doesn't look like we can go any farther.<end><if><value:$01><equal>3Well, now. That's certainly one bold way to cut off the road. No getting past this, I suppose.<end><if><value:$01><equal>4That's incredible. This may be taking “cutting off the road” a bit too far.<end><if><value:$01><equal>5Gaaah!? Isn't this going a little too far? Nothing for it. Let's turn back.<end><if><value:$01><equal>6We can't go any farther. There's no jumping across a fissure this big. Let's go back, <value:$28>.<end><if><value:$01><equal>7We can't go any farther. We'll have to turn back.<end><if><value:$01><equal>9Oh, come on. It couldn't be any more obvious that we're not getting through here. Want to head back?<end><if><value:$01><equal>12We can't go any farther. Nothing for it. Let's head back.<end><if><value:$01><equal>13...We can go no farther. We're turning back.<end><if><value:$01><equal>10Sis! Look at this. This is completely insane, isn't it? Nothing for it. Let's go back.<end><if><value:$01><equal>14No getting any farther this way. We'll have to turn back.<end><if><value:$01><equal>15Hey, <value:$28>, we can't go any farther. We'll have to turn back.<end><if><value:$01><equal>17Wait, what is this!? Did we come all this way for nothing? Aaargh! Hurry up, we're going back!<end><if><value:$01><equal>19<value:$28>, look at the size of that hole. We can't go any farther. Come on, let's go back.<end><if><value:$01><equal>20...We're going back.<end><if><value:$01><equal>11Looks like we'll have to turn back.<end><if><value:$01><equal>21It seems we have no choice but to turn back.<end><if><value:$01><equal>23We can't go any farther. Let's turn back.<end><if><value:$01><equal>27We can't go any farther. Let's turn back, <value:$28>.<end><if><value:$01><equal>26There's no getting past this. It looks as though we'll have to turn back.<end><if><value:$01><equal>24We cannot go any farther. Please, <value:$28>, let us turn back.<end><if><value:$01><equal>25That's quite a hole. We can't go any farther. Come on, let's go back.<end><if><value:$01><equal>192We cannot go any farther. It would be best to turn back.<end><if><value:$01><equal>193What a fissure... I never thought it would be taken this far. We have no choice. Let us turn back.<end><if><value:$01><equal>194This fissure... You've really done it now, Sea King. We have no choice but to turn back.<end><if><value:$01><equal>191Now that's impressive. ...Wait, this is no time to admire it. It's a shame, but we'll have to turn back.<end><if><value:$01><equal>190We can't go any farther. It looks like we'll have to turn back.<end>Oh, wow. We can't go any farther. The Sea King's power really is something. Nothing for it. Let's head back.<end>"

["1710128"]
japanese = "<value:$28>じゃない。<line-break>私に何か？<end>"
english = "Well, if it isn't <value:$28>. Do you need something from me?<end>"

["1710129"]
japanese = "水の精霊神？<line-break>いえ、知らないわね…。<line-break>\u3000<line-break>私たち海賊はどちらかというと<line-break>水の精霊神っていうより海の神様、<line-break>つまり、海王さまを信仰してるから。<end>"
english = "The Water Spirit God? No, I can't say I've heard of it. We pirates tend to worship the god of the sea―the Sea King―rather than the Water Spirit God.<end>"

["1710130"]
japanese = "え！？\u3000海王さまの声を？<line-break><value:$28>、あなたって<line-break>すごい冒険をしているのね…。<line-break>海王さまはしぶきの群島の奥、水に<line-break>包まれた島にいると言われているわ。<line-break>まあ、迷信でしょうけどね。<end>"
english = "What!? You heard the Sea King's voice? <value:$28>, you're having quite an adventure. They say the Sea King dwells on an island enveloped in water, deep within the Spray Archipelago. Though I suppose that's only superstition.<end>"

["1710131"]
japanese = "前に話したかもしれないけど、<line-break>しぶきの群島は危険な場所よ。<line-break>行くならとめないけど、気をつけて。<end>"
english = "I may have told you this before, but the Spray Archipelago is a dangerous place. I won't stop you from going, but be careful.<end>"

["1710132"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ…、\u3000\u3000\u3000<line-break>\u3000\u3000\u3000この先は、空と水とが交わりし世界。<line-break>\u3000\u3000人の子であるあなたでは、これより先に<line-break>\u3000\u3000\u3000\u3000\u3000進むこと、かないませぬ…。<end>"
english = "Bearer of the Infinite Soul... Beyond here lies a world where sky and water meet. As a child of man, you cannot venture any farther...<end>"

["1710133"]
japanese = "\u3000\u3000しかし、あなたがこの先へと進むことは\u3000\u3000<line-break>\u3000\u3000\u3000\u3000私の望むところでもあります。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000私に残された力で<line-break>\u3000\u3000\u3000\u3000あなたの道をひらきましょう…。<end>"
english = "And yet, I too wish for you to go on. With what power remains to me, I shall open the way for you...<end>"

["1710134"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000これでこの先の地も\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000あなたを受けいれることでしょう。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000さあ、進みなさい。<line-break>\u3000\u3000そして、おいでなさい。私のもとへ…。<line-break>\u3000\u3000\u3000私は水の精霊神アキュリュース…。<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000さあ、進みなさい…。<end>"
english = "Now the land ahead should accept you. Go forth. And come to me... I am Aqyurius, the spirit god of water... Bearer of the Infinite Soul, go forth...<end>"

["1710135"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000愚かなる人の子よ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000我が言葉に耳を傾けず、ここまで来たか…。<line-break>\u3000\u3000大いなる秩序のため、海王の名において<line-break>\u3000\u3000\u3000\u3000\u3000汝を先に進ませはせぬ。<end>"
english = "Foolish child of man. So you have come this far without heeding my words... For the sake of the great order, and in the name of the Sea King, I shall let you go no farther.<end>"

["1710136"]
japanese = "ならば戦うまで！<end>"
english = "Then it's a fight!<end>"

["1710137"]
japanese = "秩序は大切ですね<end>"
english = "Order is important, isn't it?<end>"

["1710138"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000愚かなる人の子よ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000身の程を知れい！<end>"
english = "Foolish child of man. Know your place!<end>"

["1710139"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000愚かな…。<line-break>\u3000\u3000\u3000\u3000\u3000大いなる秩序の価値が<line-break>\u3000\u3000\u3000\u3000\u3000汝にはわからぬのか…。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我には見える…。<line-break>\u3000\u3000\u3000\u3000\u3000秩序を失いし世界の<line-break>\u3000\u3000\u3000\u3000\u3000混沌にあえぐ様が…。<end>"
english = "You fool... Can you not understand the value of the great order? I can see it... a world bereft of order, writhing in chaos...<end>"

["1710140"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000それでよい。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000秩序こそこの世界において<line-break>\u3000\u3000\u3000\u3000\u3000\u3000もっとも尊きものなり。<line-break>\u3000\u3000\u3000\u3000さあ、汝の世界へ戻るがいい…。<end>"
english = "That is as it should be. Nothing in this world is more precious than order. Now, return to your world...<end>"

["1710141"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000何をしておる。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000早く引き返すがよい。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000いたずらに命を<line-break>\u3000\u3000\u3000\u3000\u3000\u3000縮めることはあるまい。<end>"
english = "What are you doing? Turn back at once. Do not cut your life short for nothing.<end>"

["1710142"]
japanese = "一緒に戦うお仲間以外の方を<line-break>ご案内するわけにはいきません。\u3000\u3000<line-break>\u3000<line-break>どうか、そちらに連れておられる方と<line-break>お別れになられてから<line-break>もう一度ここにいらしてください。<end>"
english = "I'm afraid I can only guide those who fight alongside you. Please part company with anyone else accompanying you, then return here.<end>"

["1710143"]
japanese = "<value:$28>様、<line-break>アンギルダン様から伝言です。\u3000\u3000\u3000<line-break>\u3000<line-break>ジラーク軍は今のところ動く気配なし。<line-break>どうやら東を攻めている死神カルラに<line-break>歩調をあわせる腹づもりらしい。<end>"
english = "<value:$28>, I have a message from Angeerdan. For now, Zsilak's Army shows no sign of moving. It seems they intend to coordinate with Karula the Death God, who is attacking the east.<end>"

["1710144"]
japanese = "青竜軍に大きな動きがあった時に<line-break>早急に本陣へ戻ればよいであろう。\u3000<line-break>わしもしばらく旅にでも出るわ。<line-break>…との事です。<line-break>以上、確かにお伝えしました。<line-break>\u3000<end>"
english = "“If the Azure Dragon Army makes any major move, a swift return to the main camp should suffice. I'll go traveling for a while myself.” That was his message. I have relayed it to you in full.<end>"

["1710145"]
japanese = "どうして、人は争うのでしょう？<line-break>争いは悲しみを広げていくというのに。<end>"
english = "Why do people fight when conflict only brings more sorrow?<end>"

