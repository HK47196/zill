["550009"]
japanese = "かつて、この地には<line-break>魔物が住みついておった。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>すべてを石に変えてしまう<line-break>恐ろしい魔物じゃ。<end>"
english = "Long ago, a monster made its lair in this land. It was a fearsome creature that turned everything to stone.<end>"

["550010"]
japanese = "そこへ１人の勇者が現れ、<line-break>この神殿に魔物を封じた。<line-break>その勇者が使った剣があれじゃ。\u3000\u3000\u3000<line-break>地中深く刺さったその剣は、<line-break>いかなる怪力の持ち主にも<line-break>引き抜くことができん。<end>"
english = "Then a hero appeared and sealed the monster within this temple. That is the sword the hero wielded. Its blade lies buried deep in the earth, and no one, however mighty, can pull it free.<end>"

["550011"]
japanese = "この世を救う使命を負った勇者だけが、<line-break>あの剣を引き抜くことができるという…<line-break>古くからの言い伝えじゃ。<end>"
english = "It is said that only the Hero charged with saving the world can draw that sword. So the old legend goes.<end>"

["550012"]
japanese = "<select><value:$20>%2今までに何人があの剣に挑んだかねぇ。<line-break>でも成功したためしは一度もないよ。<end>あの娘は領主様の１人娘ノエルさ。<line-break>身体は小さいけど、剣の腕は確かだよ。<end>"
english = "<select><value:$20>%2Who knows how many people have tried to pull out that sword? Not one has ever succeeded.<end>That girl is Noel, the lord's only daughter. She may be small, but she's a fine swordswoman.<end>"

["550013"]
japanese = "ときどき、こうやって村の力自慢や<line-break>通りがかりの冒険者が挑戦するのさ。<line-break>それをひやかすのが、わしの道楽でね。<end>"
english = "Every so often, one of the village strongmen or a passing adventurer gives it a try. Heckling them is a little hobby of mine.<end>"

["550014"]
japanese = "<select><value:$20>%3ノエル様は、足におケガをなされた\u3000\u3000<line-break>お父上の代わりに、ときどき、付近の<line-break>怪物退治などにも活躍されている。<line-break>剣の腕もたつ、なかなか利発な<line-break>お嬢さんだ。しかし、惜しいことだ。<line-break>男だったら、竜騎士にもなれたものを。<end>ここの領主様は、<line-break>かつてこの地を荒らした石化獣を\u3000\u3000<line-break>倒した勇者の子孫さ。<line-break>つまり、ノエル様は<line-break>あの剣の持ち主の子孫というわけだ。<line-break>きっと、引き抜くことができるよ。<end>ノエル様からは<line-break>かねがね、英雄の気を感じていたのだ。<end>"
english = "<select><value:$20>%3Lady Noel sometimes takes her injured father's place and helps slay monsters in the surrounding area. Her father injured his foot, and she is intelligent and highly skilled with a sword. A pity, though. Had she been a man, she might even have become a Dragon Knight.<end>The lord here is descended from the hero who defeated the Petrifying Beast that once ravaged this land. In other words, Lady Noel is a descendant of that sword's owner. I'm sure she can pull it out.<end>I have long sensed the spirit of a hero in Lady Noel.<end>"

["550015"]
japanese = "こんな地図にも載っていないような<line-break>珍しい村で、こんな珍しい風習があったなんて。<line-break>実際に世界を旅してないとわからなかったなあ。<line-break>あ、私は数が減って、珍しい存在になった<line-break>コーンスの旅人です。<line-break>う～ん、自分の目で確かめないとなあ。<end>"
english = "Who would have thought a rare little village, one that isn't even on the map, would have such an unusual custom? I'd never have known without actually traveling the world. Oh, I'm a traveler of the Korns, who have grown so few that we're a rare sight ourselves. Hmm. You really do have to see things with your own eyes.<end>"

["550016"]
japanese = "…ふっ、<line-break>竜王様のおっしゃるとおりだ。<end>"
english = "Hmph. The Dragon King was right.<end>"

["550017"]
