["550024"]
japanese = "<if><value:$01><equal>13…やめておけ。お前程度のひよっこが<line-break>首を突っ込むべきことではない。<line-break><line-break>…と言っても、<line-break>行く気なのだろう？<line-break>死んで後悔しても、知らんぞ。<end><if><value:$01><equal>14そうじゃな。<line-break>行ってみよう。<end><if><value:$01><equal>19そうだね。<line-break>行ってみよ？<end><if><value:$01><equal>10そうだね、姉ちゃん。<line-break>行ってみよう。<end>そうだね。<line-break>行ってみよう。<end>"
