english = "<if><value:$01><equal>2Don't scare me like that! I thought you were dead.<end><if><value:$01><equal>13Hmph. Do not cause needless concern.<end><if><value:$01><equal>10Sis... thank goodness.<end><if><value:$01><equal>14<value:$28>, are you properly alive?<end><if><value:$01><equal>15Thank goodness. <value:$28>, I was so worried.<end><if><value:$01><equal>17W-w-w-w-what?! If you're alive, then get up already! An inferior life-form like you has no business making a noble Elf such as myself worry. You're five hundred years too young!<end><if><value:$01><equal>18Senior disciple... have you regained consciousness?<end><if><value:$01><equal>4Eek! Looks like you're alive!<end><if><value:$01><equal>19Thank goodness! Are you all right?<end>Thank goodness! I was afraid you might never open your eyes.<end>"

