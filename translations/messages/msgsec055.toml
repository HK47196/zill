["550022"]
japanese = "<if><value:$01><equal>13…みな同じ刺青がある。\u3000<line-break>…天空神の紋章に似た模様。<line-break>そうか、これが…。<end><if><value:$01><equal>15ねえ、<value:$28>、<line-break>みんな同じ刺青があるよ。<line-break><line-break>ほら、テラネにもある天空神の<line-break>紋章に似てるけど…<line-break>なんか、気味が悪いね…。<end><if><value:$01><equal>14なんと！\u3000\u3000\u3000\u3000\u3000<line-break>どいつもこいつも<line-break>同じ刺青をしておる。<end><if><value:$01><equal>19ねぇ、見て、見て、見てぇ！<line-break>みんな同じ目玉の\u3000\u3000\u3000\u3000\u3000<line-break>刺青してるよぉ！<end>姉ちゃん、大発見だ！<line-break>こいつら、みんな同じ刺青してる。<line-break><line-break>なんだろう、この模様…。<line-break>目玉みたいだ！<end>"
english = "<if><value:$01><equal>13They all bear the same tattoo. A design resembling the Sky God's emblem. So this is...<end><if><value:$01><equal>15Hey, <value:$28>, they all have the same tattoo. It looks like the emblem of the Sky God you see in Terane, but... there's something unsettling about it.<end><if><value:$01><equal>14Well now! Every last one of them bears the same tattoo.<end><if><value:$01><equal>19Hey, look, look, look! They've all got the same eyeball tattoo!<end>Sis, I've made a huge discovery! These people all have the same tattoo. What's this design supposed to be? It looks like an eyeball!<end>"

