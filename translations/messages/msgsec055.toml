["550019"]
japanese = "そうね、実際に見て、確かめなくちゃ。<line-break>オッシ先生もそう言ってたしね。<line-break><line-break>行きましょ、<value:$28>。<line-break>あいつらが何してるか、確かめて<line-break>悪いことなら、くいとめなきゃ。<end>"
english = "Right. We have to see for ourselves and make sure. Ossi said the same thing. Come on, <value:$28>. Let's find out what they're doing, and if it's something bad, we have to stop it.<end>"

["550020"]
japanese = "見てよ！\u3000この人たち、<line-break>みんな、同じ刺青してる…。<line-break><line-break>天空神ノトゥーンの紋章…？<line-break>いや、ちょっと違う。<line-break>どこか、まがまがしい…。<end>"
