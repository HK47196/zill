english = "<if><value:$01><equal>22I know you're thinking of <value:$28>, but you're being a bad guardian to him.<end><if><value:$01><equal>15I know you're thinking of <value:$28>, but you're being a bad guardian to <value:$28>.<end>I know you're thinking of <value:$28>, but you need to try harder to understand Irene too.<end>"

