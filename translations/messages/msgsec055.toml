japanese = "<if><value:$01><equal>2なぁに？\u3000あの娘が気になるの？<line-break>私はいいけど、フェルムちゃんが<line-break>聞いたら、悲しむわよ？<end><if><value:$01><equal>6あの娘…。<line-break>相当、ショックみたいだよ。<line-break>助けにいって…あげなよ。<end><if><value:$01><equal>12とりあえずは<line-break>あの娘をなんとかしてやんなきゃ、な。<end><if><value:$01><equal>13…放っておけ。<line-break>どうせ、自決する。\u3000\u3000\u3000<line-break>\u3000<line-break>関わるだけ時間のムダだ。<line-break>死にたい奴は<line-break>勝手に死ねばいい。<end><if><value:$01><equal>10姉ちゃん、なにやってんだよ！<line-break>早く、追わなきゃ…って<line-break>あ…。<line-break>…そうだよな、姉ちゃん。<line-break>ひとり、助かってる人がいたんだ。<line-break>そっちが、先か。<end><if><value:$01><equal>14おお、そうじゃ。<line-break>助かった娘っこが<line-break>おったのじゃったな。<end><if><value:$01><equal>15そうだ、あの娘…。<end><if><value:$01><equal>17…って、なによぉぉお！<line-break>そんな下等生物なんて<line-break>放っておいて、アタクシを讃えるのよ！<end><if><value:$01><equal>18…その子供を助けるので？<line-break>兄弟子。<end><if><value:$01><equal>4うふふ、<value:$28>ったら<line-break>あそこの女の子を見つめてる。<line-break>\u3000<line-break>あのノエルってコは<line-break>ショックで自分を失ってるのに<line-break>どうするつもりなのかな？<end><if><value:$01><equal>19あっ、そっか！<line-break>確かにあの人の心配してる<line-break>場合じゃなかった。<line-break>あのお姉ちゃん<line-break>…ノエル…だっけ？<line-break>助けなきゃだった。<end>…黒づくめの男にも逃げられた以上、<line-break>この村の人を救う方法はわからない。<line-break>\u3000<line-break>とりあえず、彼女…ノエルだっけ？<line-break>そのノエルだけでも救わなくちゃだよ。<line-break>ね？\u3000<value:$28>。<end>"
english = "<if><value:$01><equal>2What is it? Interested in that girl? I don't mind, but Ferme would be upset if she heard.<end><if><value:$01><equal>6That girl... She looks badly shaken. Go... help her.<end><if><value:$01><equal>12First things first. We have to do something for that girl.<end><if><value:$01><equal>13Leave her. She'll kill herself anyway. Getting involved is a waste of time. If she wants to die, let her.<end><if><value:$01><equal>10Sis, what are you doing? We have to hurry after it... Oh. Right, Sis. Someone survived. We should see to her first.<end><if><value:$01><equal>14Ah, yes. There was a young lass who survived.<end><if><value:$01><equal>15Right, that girl...<end><if><value:$01><equal>17Wait, what?! Forget that lowly creature and praise me!<end><if><value:$01><equal>18Are you going to help that child, senior disciple?<end><if><value:$01><equal>4Hee-hee, look at <value:$28>, staring at that girl over there. Noel seems so shocked she's beside herself. I wonder what you're planning to do?<end><if><value:$01><equal>19Oh, right! This isn't the time to worry about that person. That girl... Noel, was it? We were supposed to help her.<end>Now that the man in black has escaped too, we have no idea how to save the people of this village. But for now, we have to save her... Noel, wasn't it? At least we have to save Noel. Right, <value:$28>?<end>"

