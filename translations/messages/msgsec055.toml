japanese = "<if><value:$01><equal>2あと少しだったのに…。<line-break>それに、あの、黒づくめも<line-break>逃がしちゃったみたいね…。<line-break><value:$28><line-break>だいじょうぶ？<line-break>ケガはない？<end><if><value:$01><equal>6怪物…逃げちゃった。ううん。<line-break>あのままじゃ、こっちが危なかった…<line-break>見逃してもらったって言うべきかな。<line-break>さっきの黒づくめの男もいない…。<end><if><value:$01><equal>12あの、黒づくめの男も\u3000<line-break>逃がしちまったようだ。<line-break>ここをもとに戻す手がかりはなし、か。<end><if><value:$01><equal>13…黒づくめの方も<line-break>逃げたようだ。<end><if><value:$01><equal>10くそっ、逃がすかよ。<line-break>これ以上、誰かを石にさせるもんか！<line-break>姉ちゃん、追おう！<end><if><value:$01><equal>14逃げおったか…。<line-break>ま、わしらに勝てる相手ではない。<line-break>命があっただけでももうけものじゃな。<line-break>そう言えば、あの黒づくめは…？<line-break>あやつ、最後には、<line-break>改心しよった感じじゃったが。<end><if><value:$01><equal>15怪物も<line-break>…それに、あの黒ずくめの男も、<line-break>逃げちゃったね。<line-break>見逃してもらった、とか、<line-break>運がよかった、という方が<line-break>正しい言い方かもね…。<end><if><value:$01><equal>17高貴なエルフのアタクシにかかれば<line-break>あんな怪物、軽いわ！\u3000物足りないわ！<line-break>楽勝だわ！<line-break>フフ、あの黒づくめも逃げたようね。<line-break>さ、ド下等生物の<value:$28>、<line-break>この偉大なアタクシを讃えてよくてよ！<end><if><value:$01><equal>18黒づくめもおりませぬ。<line-break>…逃げた様子ですな。<end><if><value:$01><equal>4きゃっ、怪物も逃げたし<line-break>黒づくめもいないわ。<line-break>これって、助かったのかも！<end><if><value:$01><equal>19あの怪物にも、黒づくめにも<line-break>逃げられちゃったね。<line-break><value:$28>。<line-break>でも、あの黒づくめの人、<line-break>頭が痛そうにしてたけど…<line-break>大丈夫かなあ。<end>あ～あ、逃げられちゃったよ。<line-break>でも、あんな怪物、<line-break>今のぼくたちには倒せないよぉ。<end>"
english = "<if><value:$01><equal>2We were so close... And it looks like the one in black got away too. <value:$28>, are you all right? Are you hurt?<end><if><value:$01><equal>6The monster got away... No. If that had gone on, we'd have been in danger. Maybe I should say it let us go. And the man in black from before is gone too...<end><if><value:$01><equal>12Looks like we let the man in black get away too. So much for finding a way to restore this place.<end><if><value:$01><equal>13It seems the one in black escaped as well.<end><if><value:$01><equal>10Damn it, I'm not letting it get away! I won't let anyone else be turned to stone! Sis, let's go after it!<end><if><value:$01><equal>14So it escaped... Well, it was no match for us. It should count itself lucky to be alive. Speaking of which, where is the one in black? The one in black seemed to have had a change of heart by the end.<end><if><value:$01><equal>15The monster... and the man in black both got away. Then again, perhaps it's more accurate to say we were spared. Or just lucky...<end><if><value:$01><equal>17A monster like that is nothing before a noble Elf such as myself! Too easy! Hardly worth my time! Hm-hm, and it seems the one in black fled as well. Now, <value:$28>, you lowest of lowly creatures, you may praise my greatness!<end><if><value:$01><equal>18The one in black is gone as well. It appears that one escaped.<end><if><value:$01><equal>4Eek! The monster got away, and the one in black is gone too. Maybe that means we're safe!<end><if><value:$01><equal>19The monster and the one in black both got away, <value:$28>. But the person in black seemed to have a headache... I wonder if everything's all right.<end>Aw, it got away. But there's no way we could defeat a monster like that as we are now.<end>"

