english = "The Inscription Order is one of the sects devoted to Notun, the Sky God. Originally, its members traveled the lands sealing away evil.<end>"

["550371"]
japanese = "中世には神聖王サラミスによって、<line-break>異端とされ、<line-break>ほとんどの宗徒が処刑された…。<line-break>だが、その生き残りは地下へ潜って<line-break>暗殺集団・告死天使を組織し、<line-break>歴史の裏舞台で暗躍を続けた。<end>"
english = "In the Middle Ages, Holy King Salamis declared them heretics, and nearly all their adherents were executed. The survivors went underground and formed the assassin order known as the Angels of Death, continuing to work in the shadows of history.<end>"

["550372"]
