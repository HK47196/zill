["550084"]
japanese = "<if><value:$01><equal>22アイリーン、それはないよ。\u3000\u3000\u3000\u3000<line-break>少し、ひどいと思うなぁ。<line-break><value:$28>は君のこと<line-break>心配してくれてるんだよ？<line-break>やさしさ、理解してあげなきゃ。<end><if><value:$01><equal>15ねえ、アイリーン、それはないよ。\u3000<line-break>少し、ひどいと思う。<line-break>\u3000<line-break><value:$28>は君のこと<line-break>心配してくれてるんだよ？<line-break>やさしさ、理解してあげなきゃ。<end>アイリーン、ひどいよ。\u3000\u3000\u3000\u3000\u3000<line-break>ルルアンタ、悲しい！<line-break>\u3000<line-break>ねえ、<value:$28>は<line-break>アイリーンのこと<line-break>心配してくれてるんだよぉ？。<end>"
english = "<if><value:$01><equal>22Irene, that's uncalled for. It's a little cruel. <value:$28> is worried about you, you know. You should appreciate that kindness.<end><if><value:$01><equal>15Irene, that's uncalled for. It's a little cruel. <value:$28> is worried about you, you know. You should appreciate that kindness.<end>Irene, that's mean. Lulluantha is sad! <value:$28> is worried about you, you know?<end>"

["550085"]
