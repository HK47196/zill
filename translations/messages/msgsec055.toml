japanese = "<if><value:$01><equal>2残念だけど、逃げられたようね。<end><if><value:$01><equal>13…逃げられた。<line-break>怪物にも、あの男にも…。<end><if><value:$01><equal>10怪物にも、あの黒づくめにも<line-break>逃げられちまったよ、姉ちゃん。<line-break>…ちくしょう！<end><if><value:$01><equal>14逃げおったか…。<line-break>ま、わしらに勝てる相手ではない。<line-break>命があっただけでももうけものじゃな。<line-break>そう言えば、あの黒づくめも…？<line-break>あやつ、最後には、<line-break>改心しよった感じじゃったが。<end><if><value:$01><equal>15ひどい目にあったけど<line-break>どうやら助かったみたいだ。<line-break>…見逃してもらったんだね。<line-break>いや、もしかしたら、<line-break>あの黒づくめに助けられたのかも…。<end><if><value:$01><equal>17もう怪物もあの黒づくめもいなくてよ。<line-break>まったく、だらしなくてよ、あなた。<line-break>\u3000<line-break>ま、あなた１人、どんな目にあっても<line-break>別にかまわないけれど<line-break>高貴なエルフであるアタクシまで…<end><if><value:$01><equal>18どうやら助かった様子。<line-break>怪物にもとどめを刺されなんだとは、<line-break>あの黒づくめに助けられましたかな？<end><if><value:$01><equal>4私、アカデミーではいじめっ子に、<line-break>家ではお義母さんにいじめられてたから、<line-break>すごく、打たれ強いの！\u3000きゃっ！<line-break>あ、それより、あの怪物も<line-break>黒づくめの人も逃げちゃったのね。\u3000\u3000<line-break>助かっちゃったかも！<end><if><value:$01><equal>19あの怪物にも、黒づくめにも<line-break>逃げられちゃったね。<line-break><value:$28>。<line-break>でも、あの黒づくめの人、<line-break>頭が痛そうにしてたけど…<line-break>大丈夫かなあ。<end>あ～あ、逃げられちゃったよ。<line-break>でも、あんな怪物、<line-break>今のぼくたちには倒せないよぉ。<end>"
english = "<if><value:$01><equal>2Unfortunately, it looks like they got away.<end><if><value:$01><equal>13They escaped. The monster and that man...<end><if><value:$01><equal>10The monster and the one in black both got away, Sis. Damn it!<end><if><value:$01><equal>14So it escaped... Well, it was no foe we could defeat. We are fortunate simply to be alive. Come to think of it, where is the one in black? By the end, that one seemed to have had a change of heart.<end><if><value:$01><equal>15That was awful, but it looks like we survived. We must've been spared. Or maybe the one in black saved us...<end><if><value:$01><equal>17The monster and the one in black are both gone. Honestly, you are utterly hopeless. Not that I care what happens to you, but to drag a noble Elf such as myself into it...<end><if><value:$01><equal>18It appears we survived. Since the monster did not finish us off, might the one in black have saved us?<end><if><value:$01><equal>4I was bullied by bullies at the Academy and by my stepmother at home, so I can take a real beating! Eek! Oh, but never mind that. The monster and the person in black both ran away. Maybe we got lucky!<end><if><value:$01><equal>19The monster and the one in black both got away, <value:$28>. But the person in black seemed to have a headache... I wonder if that person is all right.<end>Oh, they got away. But there's no way we could defeat a monster like that as we are now.<end>"

["550257"]
japanese = "<if><value:$01><equal>2なぁに？\u3000気がついたら<line-break>すぐ女の子の方に行くわけ？<line-break>\u3000<line-break>べ、別にあたしはいいけど<line-break>フェルムちゃんが悲しむんじゃ<line-break>ないかなーって、思ってさ。<end><if><value:$01><equal>13…放っておけ。<line-break>どうせ、自決する。\u3000\u3000\u3000<line-break>\u3000<line-break>関わるだけ時間のムダだ。<line-break>死にたい奴は<line-break>勝手に死ねばいい。<end><if><value:$01><equal>10…そっか。<line-break>失敗をくいるより<line-break>今、できること、か…、姉ちゃん。<end><if><value:$01><equal>14おお、そうじゃ。<line-break>助かった娘っこが<line-break>おったのじゃったな。<end><if><value:$01><equal>15あ、そうだ。<line-break>ノエルって言ったっけ。<line-break>あのコを助けなくちゃ…。<end><if><value:$01><equal>17何よぉ！\u3000あんな下等生物助けても<line-break>ロクなことはなくてよぉ！\u3000あんなのは<line-break>放っておいて、アタクシの話を聞くの！<end><if><value:$01><equal>18ボルダンには、敗北はこの上ない屈辱。<line-break>…あの人間の貴族の娘にとっても<line-break>そうなのでござろうか？<end><if><value:$01><equal>4あの人は、ずーっとあんな感じかな。\u3000<line-break>たぶん、頭よすぎるのかも。<line-break>きゃっ！<line-break>うふふふ。頭いい人間に、私が<line-break>ひそかに嫉妬と悪感情を持ってるのが、<line-break>よくわかるセリフを言っちゃったかな！<end><if><value:$01><equal>19あっ、そっか！<line-break>確かにあの人の心配してる<line-break>場合じゃなかった。<line-break>あのお姉ちゃん<line-break>…ノエル…だっけ？<line-break>助けなきゃだった。<end>…黒づくめの男にも逃げられた以上、<line-break>この村の人を救う方法はわからない。<line-break>\u3000<line-break>とりあえず、彼女…ノエルだっけ？<line-break>そのノエルだけでも救わなくちゃだよ。<line-break>ね？\u3000<value:$28>。<end>"
english = "<if><value:$01><equal>2What, the moment you wake up, you run straight to another girl? N-not that I care. I just thought Ferme might be upset.<end><if><value:$01><equal>13Leave her. She'll kill herself anyway. Getting involved is a waste of time. People who want to die can do as they please.<end><if><value:$01><equal>10Right... Instead of dwelling on our failure, we should do what we can now, Sis.<end><if><value:$01><equal>14Ah, yes. There was that young lass who survived.<end><if><value:$01><equal>15Oh, right. Noel, wasn't it? We have to help her...<end><if><value:$01><equal>17What?! Nothing good will come of helping an inferior life-form like that! Leave her and listen to me!<end><if><value:$01><equal>18To a Boldan, there is no greater humiliation than defeat. Is it the same for that human nobleman's daughter?<end><if><value:$01><equal>4Is that person always like that? Maybe it's from being too clever. Eek! Hee hee hee. Did I just say something that makes my secret jealousy and ill will toward clever people painfully obvious?<end><if><value:$01><equal>19Oh, right! This really isn't the time to be worrying about that person. That lady... Noel, was it? We have to help her.<end>Now that the man in black has escaped too, we don't know how to save the villagers. But at least we have to save her... Noel, wasn't it? Right, <value:$28>?<end>"

["550258"]
japanese = "<if><value:$01><equal>2…ちょ、ちょっと！<line-break><value:$28>！<end><if><value:$01><equal>13…フッ、やれやれ、<line-break>しょうがない奴だ。<end><if><value:$01><equal>10とにかく、今できることは<line-break>そのコを助けることだよな。<end><if><value:$01><equal>14…ショックじゃったのじゃろうな。<line-break>まるで、ふぬけのようじゃ。<end><if><value:$01><equal>15…ひとりぼっちで生き残って<line-break>つらいだろうな、あのコ。<end><if><value:$01><equal>17こらこらこら！\u3000高貴なエルフである<line-break>アタクシをおいていくなんて<line-break>８００年早くてよぉ！<end><if><value:$01><equal>18…その子もつらかろう。<line-break>自分の村がこの有様では…。<end><if><value:$01><equal>4あ、助けにいくんだ。<line-break>うふふ、ホントにおせっかいさん！<end><if><value:$01><equal>19ねえ、ノエルってお姉ちゃん、<line-break>だいじょうぶそう？<line-break><value:$28>。<end>…でも、立ち直れるかな。<line-break>彼女…。<end>"
english = "<if><value:$01><equal>2W-wait! <value:$28>!<end><if><value:$01><equal>13Hmph. What a hopeless fool.<end><if><value:$01><equal>10Anyway, what we can do now is help that girl.<end><if><value:$01><equal>14The shock must've left her an empty shell.<end><if><value:$01><equal>15It must be awful, being the only one left alive...<end><if><value:$01><equal>17Now see here! You're eight hundred years too young to leave a noble Elf such as myself behind!<end><if><value:$01><equal>18That child must be suffering too, with the village reduced to this...<end><if><value:$01><equal>4Oh, you're going to help her? Hee hee, you really can't help meddling!<end><if><value:$01><equal>19Do you think Noel will be all right, <value:$28>?<end>But will she ever recover from this...?<end>"

