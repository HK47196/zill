["1500050"]
japanese = "アキュリュースは聖なる町だ。<line-break>神の守護のもと<line-break>戦乱と破壊を免れてきた。<end>"
english = "Aqyurius is a holy city. Under God's protection, it has been spared the ravages of war and destruction.<end>"

["1500051"]
japanese = "だが、人は平和だけでは飽きたらず、<line-break>神の座所を売り物にして人を集め、<line-break>金を取り、私腹を肥やしている。<line-break>神への感謝もなく、祈りもなく、<line-break>ただ己の欲望のために<line-break>神を利用している。<end>"
english = "But peace alone was not enough for its people. They made God's dwelling place into an attraction, drawing crowds, taking their money, and lining their own pockets. They offer neither thanks nor prayers to God. They use God only to satisfy their own desires.<end>"

["1500052"]
japanese = "神はその傲慢を打ち砕くだろう。<line-break>アキュリュースは滅ぶであろう。<line-break>\u3000<line-break>傲慢を捨てよ。すべてを投げ捨てよ。<line-break>ただ、真の神にのみ、すがるがよい。<end>"
english = "God shall crush their arrogance. Aqyurius shall perish. Cast aside your pride. Cast aside everything. Cling to the true God alone.<end>"

["1500053"]
japanese = "さぁ、もう十分でしょう。<line-break>終わったなら帰ってください。<end>"
english = "That's quite enough. If you're finished, please leave.<end>"

["1500054"]
japanese = "こんな話が広まったら<line-break>せっかくの観光客が帰ってしまうよ。<end>"
english = "If talk like that gets around, we'll lose all the tourists we went to such trouble to attract.<end>"

["1500055"]
japanese = "ほら、あんたも行った行った！<end>"
english = "Come on, you too. Off you go!<end>"

["1500056"]
japanese = "残る<end>"
english = "Stay<end>"

["1500057"]
japanese = "去る<end>"
english = "Leave<end>"

["1500058"]
japanese = "ふぅ…。<line-break>まさか、この男の言葉を信じているのかい？<line-break>\u3000<line-break>こういうのは、たくさんいるんだ。<line-break>簡単に信じちゃダメだよ。<end>"
english = "Phew... You don't actually believe what this man is saying, do you? There are plenty of people like him around. Don't be so quick to believe such claims.<end>"

["1500059"]
japanese = "さ、あんたも。<line-break>誰に頼まれたのか知りませんが、<line-break>いいかげんにしてくださいよ、まったく。<end>"
english = "And you, too. I don't know who put you up to this, but enough is enough. Honestly.<end>"

["1500060"]
japanese = "神の声を解さぬ愚者よ。<line-break>我は神の遣いだ。<line-break>我の言葉を信じよ。<line-break>さもなくば…、<line-break>滅びあるのみだ。<end>"
english = "Fool, deaf to the voice of God. I am God's messenger. Believe my words. If you do not... only destruction awaits.<end>"

