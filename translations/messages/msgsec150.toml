["1500044"]
japanese = "神は怒っておいでだ。<line-break>この私を試すことは<line-break>神を試すことに他ならない。<line-break>神はその傲慢を打ち砕くだろう。<line-break>傲慢を捨てよ。すべてを投げ捨てよ。<line-break>ただ、真の神にのみ、すがるがよい。<end>"
english = "God is angered. To test me is nothing less than to test God. God shall crush that arrogance. Cast aside your arrogance. Cast aside everything. Cling only to the true God.<end>"

["1500045"]
japanese = "エルファス様は奇跡を見せてくださった。<line-break>あのお方は救世主だ。<end>"
