["1500001"]
japanese = "おい、さっさと歩かないか！<line-break>エセ救世主め！<end>"
english = "Hey, hurry up, you sham savior!<end>"

["1500002"]
japanese = "………………。<end>"
english = "...<end>"

["1500003"]
japanese = "ああ、救世主様に、<line-break>ノクサの生まれ変わりであるお方に<line-break>なんてことを…。<end>"
english = "Oh, how could you do such a thing to the Savior, the reincarnation of Nokusa...?<end>"

["1500004"]
japanese = "罰当たりな…<line-break>神よ、どうかお許しください。<end>"
english = "Such sacrilege... God, please forgive us.<end>"

["1500005"]
japanese = "この男は救世主などではないぞ。<line-break>この男の世迷い言など信じるな。<line-break>信じた者は、同罪とみなす。<line-break>頭を冷やせ！<line-break>世界が滅びるものか！<end>"
english = "This man is no Savior. Don't believe his mad ravings. Anyone who does will be judged equally guilty. Come to your senses! The world is not going to end!<end>"

["1500006"]
japanese = "お前こそ頭を冷やすがいい。<line-break>滅びの日はそこまで迫っている。<end>"
english = "You are the one who should come to your senses. The day of destruction is nearly upon us.<end>"

["1500007"]
japanese = "黙れ！<line-break>貴様が救世主というのなら<line-break>その証拠を見せろ！<end>"
english = "Silence! If you're the Savior, then prove it!<end>"

["1500008"]
japanese = "剣は貴様の喉元に向いている。<line-break>本当に神の遣いなら、<line-break>素手で剣を受け止めてみろ！<line-break>奇跡を起こしてみろ！<end>"
english = "My sword is at your throat. If you truly are God's messenger, stop the blade with your bare hands! Show us a miracle!<end>"

["1500009"]
japanese = "いくぞっ！<end>"
english = "Here I come!<end>"

["1500010"]
japanese = "助けよう<end>"
english = "Help him<end>"

["1500011"]
japanese = "放っておこう<end>"
english = "Leave him be<end>"

["1500012"]
japanese = "なんだ、貴様！<line-break>刃向かう気か！<end>"
english = "Who the hell are you? You mean to defy us?<end>"

["1500013"]
japanese = "僕の邪魔をしたいなら<line-break>他にやり方があるだろう？<line-break>\u3000<line-break>せっかく、神の遣いである証拠を<line-break>見せてやろうと思ったのに。<end>"
english = "If you meant to interfere, surely you could have found another way. I was about to show them proof that I am God's messenger.<end>"

["1500014"]
japanese = "…とにかく、<line-break>今度、今みたいな真似をしたら<line-break>君でも容赦はしない。<end>"
english = "In any case, if you ever do that again, I won't show mercy―even to you.<end>"

["1500015"]
japanese = "エルファス様！<line-break>おケガはありませんか？<end>"
english = "Elfas! Are you hurt?<end>"

["1500016"]
japanese = "救世主様！<end>"
english = "Savior!<end>"

["1500017"]
japanese = "せっかく、神の遣いである証拠を<line-break>見せてやろうと思ったのに。<line-break>\u3000<line-break>また余計なことをしてくれたね。<end>"
english = "I was about to show them proof that I am God's messenger. You've interfered needlessly yet again.<end>"

["1500018"]
japanese = "エルファス様！<line-break>おケガはありませんか？<end>"
english = "Elfas! Are you hurt?<end>"

["1500019"]
japanese = "救世主様！<end>"
english = "Savior!<end>"

["1500020"]
japanese = "せっかく、神の遣いである証拠を<line-break>見せてやろうと思ったのに…。<line-break>\u3000<line-break>余計なことをしてくれたな。<end>"
english = "I was about to show them proof that I am God's messenger... You had no need to interfere.<end>"

["1500021"]
japanese = "僕が礼を言うとでも思ったのか？<end>"
english = "Did you think I would thank you?<end>"

["1500022"]
japanese = "君、僕を知らないのか…？<line-break>それならひとつ忠告しよう。<line-break>力にすがるのは愚かなことだ。<line-break>力はただ、より強い力によって<line-break>叩き伏せられるのみだ。<end>"
english = "You don't know who I am...? Then let me offer you one piece of advice. It is foolish to rely on strength. Strength can only be beaten down by greater strength.<end>"

["1500023"]
japanese = "僕は神が遣わしたる救世主、<line-break>エルファス。<line-break>僕の言葉は、神の言葉だ。<end>"
english = "I am Elfas, the Savior sent by God. My words are the words of God.<end>"

["1500024"]
japanese = "君の名…、聞いておきたい。<end>"
english = "Your name... I'd like to know it.<end>"

["1500025"]
japanese = "<value:$28>…。<line-break>君とは、また会いそうな気がするよ。<end>"
english = "<value:$28>... I have a feeling we'll meet again.<end>"

["1500026"]
japanese = "エルファス様！<end>"
english = "Elfas!<end>"

["1500027"]
japanese = "救世主様！<end>"
english = "Savior!<end>"

["1500028"]
japanese = "ようやくお目覚めか…。<line-break>\u3000<line-break>\u3000<line-break>君は僕の正体を知っているはずだ。<line-break>この僕があいつらに不覚をとるなど<line-break>ありえない…、違うか？<end>"
english = "Finally awake...? You know who I truly am. Surely you don't believe that rabble could ever get the better of me... do you?<end>"

["1500029"]
japanese = "わかっているなら、<line-break>邪魔をするのはやめてくれ。<line-break>\u3000<line-break>僕に挑もうというのなら話は別だが。<end>"
english = "If you understand that, then stop interfering. Unless you mean to challenge me yourself. That would be another matter.<end>"

["1500030"]
japanese = "ようやくお目覚めか…。<end>"
english = "Finally awake...?<end>"

["1500031"]
japanese = "あいつらのことなら片付いた。<line-break>神の力が、君をも救ってくれた。<line-break>\u3000<line-break>…言ったはずだよ。<end>"
english = "Those men have been dealt with. God's power saved you as well. I told you, didn't I?<end>"

["1500032"]
japanese = "力を信じても無駄だ。<line-break>力は、より大きな力に<line-break>叩き伏せられるだけだ。<end>"
english = "There is no point in putting your faith in strength. Strength is merely beaten down by greater strength.<end>"

["1500033"]
japanese = "ようやくお目覚めか…。<end>"
english = "Finally awake...?<end>"

["1500034"]
japanese = "あいつらのことなら片付いた。<line-break>神の力が、君をも救ってくれた。<line-break>\u3000<line-break>もう、あんな真似はやめてくれ。<line-break>迷惑だ…。<end>"
english = "Those men have been dealt with. God's power saved you as well. Don't do anything like that again. It's a nuisance...<end>"

["1500035"]
japanese = "君、僕を知らないのか…？<line-break>それなら、ひとつ忠告しよう。<line-break>\u3000<line-break>力にすがるのは愚かなことだ。<line-break>力はただ、より強い力によって<line-break>叩き伏せられるのみだ。<end>"
english = "You don't know who I am...? Then let me offer you one piece of advice. It is foolish to rely on strength. Strength can only be beaten down by greater strength.<end>"

