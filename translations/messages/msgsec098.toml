["980119"]
japanese = "ちょっと、<value:$28>。<line-break>どこに行くつもりよ。<line-break>そっちに行くと、森の出口よ。<line-break>早くゴブリンを追うのよ。<line-break>わかったわね、<value:$28>？<end>"
english = "Hey, <value:$28>. Where do you think you're going? That way leads out of the forest. Hurry up and go after the Goblin. Got it, <value:$28>?<end>"

["980120"]
japanese = "マルーンを失った。<end>"
english = "Lost Maroon.<end>"

["980121"]
japanese = "もちろん、できている<end>"
english = "Of course I'm ready.<end>"

["980122"]
japanese = "まだ、できてない<end>"
