english = "Very good. I'll prepare your room...<end>"

["980104"]
japanese = "あ、ご主人。すまないゴブが、<line-break>今日の宿泊はキャンセルするゴブ。<line-break>\u3000<line-break>我々も忙しい身ゴブ。<line-break>その辺りの事情をくんでほしいゴブ。<line-break>\u3000<end>"
