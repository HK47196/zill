english = "Thank you for waiting. Now, if you'll follow me to your room...<end>"

["980107"]
japanese = "そんなこと言ってる場合じゃないわ。<line-break>うだうだ言わないで、さっさと来る！<end>"
english = "We don't have time for this. Stop dawdling and get over here!<end>"

["980108"]
japanese = "オッシ先生の話では、リベルダム方面に<line-break>向かう奇妙なゴブリンの３匹組を<line-break>見た人がいたそうよ。<line-break>他に手がかりもないし、まずは<line-break>リベルダムに行くしかなさそうね。<end>"
english = "According to Master Ossi, someone saw a strange trio of Goblins heading toward Liberdam. We don't have any other leads, so it looks like we'll have to go to Liberdam first.<end>"

["980109"]
japanese = "それじゃ、リベルダムに行くわよ。<line-break>くすっ。<value:$28>、<line-break>頼りにしてるからね。<end>"
english = "All right, we're going to Liberdam. Heh. I'm counting on you, <value:$28>.<end>"

["980110"]
japanese = "さぁ、自由都市リベルダムに着いたわ。<line-break>もうすぐ夕方だけど、まだあいつらを<line-break>捜す時間はあるわよね。<end>"
english = "Here we are―the Free City Liberdam. It's nearly evening, but we still have time to look for them, don't we?<end>"

["980111"]
japanese = "うぅ…。確かに、この前は<line-break>暗闇で戦って不覚をとったわね…。<line-break>\u3000<line-break>わかったわ。<line-break>今日はもう宿屋に行きましょ。<line-break>でも、明日は朝からゴブリン捜しよ。<end>"
english = "Ugh... I suppose you're right. We did let them get the better of us last time, fighting in the dark. All right. Let's find an inn for tonight. But tomorrow morning, we're hunting goblins.<end>"

["980112"]
japanese = "あ、それと、あとで冒険者ギルドに<line-break>登録しておいた方がいいわね。<line-break>\u3000<line-break>ギルドに登録しておけば、<line-break>うまくいくと、あいつらの情報が<line-break>手に入るわ。<end>"
english = "Oh, and we should register with the Adventurers' Guild later. If we do, we might be able to get some information on them.<end>"

["980113"]
japanese = "それじゃ、街に入りましょ。<end>"
english = "Then let's head into the city.<end>"

["980114"]
japanese = "ねえ、知ってる？\u3000賢者の森の<line-break>猫屋敷には、運命に選ばれた者しか<line-break>入れないんだって。<line-break>あの変なゴブリンたちを追って<line-break>私たちは猫屋敷まで来たわ。<line-break>偶然だけどね。<end>"
english = "Did you know? They say only those chosen by fate can enter Cat Manor in Sage's Forest. We followed those strange goblins all the way there. By coincidence, of course.<end>"

["980115"]
japanese = "でも、それって、私たちが<line-break>運命に選ばれた者ってことよね。<line-break>\u3000<line-break>なんだか、これからの旅が<line-break>おもしろくなりそうね。<end>"
english = "But that means we're the ones chosen by fate, doesn't it? It feels as though our journey is about to get interesting.<end>"

["980116"]
japanese = "さぁ、ぐずぐずしてられないわ。<line-break>早くエンシャントに戻って<line-break>ゴブリンたちを追わなくちゃね。<end>"
english = "Come on, we can't waste any more time. We have to get back to Ancient and go after those goblins.<end>"

["980117"]
japanese = "あ、<value:$28>。<line-break>やっと来たわね。<line-break>\u3000<line-break>あいつらは賢者の森に向かったわ。<line-break>早く追うわよ。もちろん、<line-break>用意はできてるわよね？<end>"
english = "Ah, <value:$28>. There you are at last. They've headed for Sage's Forest. Let's hurry after them. You're ready, of course?<end>"

["980118"]
