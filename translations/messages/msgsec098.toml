english = "That's why I want to become strong enough to protect people. That person is gone now, but... I won't ever let something like that happen again.<end>"

["980067"]
japanese = "…ふふ、ごめんなさい。<line-break>うまく話せてないね、私。<end>"
english = "Heh... Sorry. I'm not explaining this very well, am I?<end>"

["980068"]
japanese = "私の方は、残念だけど、<line-break>まだ聖杯を取り戻せていないわ。<line-break>\u3000<line-break>これじゃあ、騎士になる以前に、<line-break>先生に顔向けもできない…。\u3000\u3000<end>"
english = "I'm afraid I still haven't recovered the Grail. Forget becoming a knight―I can't even face Master like this...<end>"

["980069"]
japanese = "先生、とても強いんだけど、<line-break>右腕のケガが悪くてね。<line-break>時々、無理をするから心配なのよ。<line-break>先生は話してくれないんだけど、<line-break>そのケガ、闇討ちでやられたんだって<line-break>聞いているわ。許せない話よね。<end>"
english = "Master is very strong, but the injury to the right arm is serious. Sometimes Master pushes too hard, and I worry. Master won't discuss it with me, but I heard the injury was inflicted in a sneak attack. It's unforgivable, isn't it?<end>"

["980070"]
japanese = "…その、闇討ちをした奴って、<line-break>今どこで何をしてるのかなあ？<end>"
english = "...I wonder where the person who carried out that sneak attack is now, and what they're doing.<end>"

["980071"]
japanese = "え？\u3000ふふ、いやねえ。<line-break>敵討ちとかなんて考えていないわよ。<line-break>たぶん先生も、望んでないわ。<line-break>そんなことより、もっと剣の腕を磨いて<line-break>早く騎士にならないとね。<end>"
english = "What? Heh, don't be silly. I'm not thinking about revenge. Master probably wouldn't want that either. I need to focus on honing my swordsmanship and becoming a knight as soon as I can.<end>"

["980072"]
japanese = "<if><value:$3D><equal>4あなたと一緒にいる<line-break>ユーリスってホントにヘンな子ね。<line-break>\u3000<line-break>騎士になるって、他の人のために<line-break>剣を振るんですね、スゴイ！\u3000だって。<line-break>くすっ。わけわからないわ。<end><if><value:$3D><equal>5あ、さっき、ヴァンに<line-break>いきなりダジャレを言われて<line-break>凍え死にそうだったわ。<line-break>あのダジャレ魔人、<line-break>本当になんとかしてよ。<line-break>彼のシャレ、寒すぎるのよ！<end><if><value:$3D><equal>6あのエステルって<line-break>妙に人なつっこいヘンな子、<line-break>あなたの連れだったわよね？<line-break>どう見ても大したことなさそうなのに<line-break>なんか、ふしぎな魔力みたいのを<line-break>感じるのよねえ。<end><if><value:$3D><equal>12あなたがうらやましいわ。<line-break>あの剣狼のゼネテスと一緒に<line-break>旅ができるなんて。<line-break>町の門のところで彼を見かけたの。<line-break>一見、だらしなさそうだったけど、<line-break>まったくスキがなかったわ…。<end><if><value:$3D><equal>13あなたって、確かにセラに比べたら<line-break>強くないんでしょうけど<line-break>彼より、よっぽど好感が持てるわ。<line-break>さっきだって…！<line-break>ホントにセラって失礼ね。<end><if><value:$3D><equal>10そうそう、あなたの弟にあったわ。<line-break>ふふ。<line-break>ホントにお姉ちゃん子ね。<line-break>…また、ちょっと<line-break>あいつのこと思い出しちゃった。<end><if><value:$3D><equal>14ねえ、聞いて。<line-break>さっき当代一の名工といわれる<line-break>あのデルガドを見かけたのよ。<line-break>私もがんばって、<line-break>彼の作った剣を持つような<line-break>立派な騎士になりたいな。<end><if><value:$3D><equal>15あのナッジっていう<line-break>コーンスの男の子<line-break>あなたの連れでしょう？<line-break>むこうでフラフラしてたわ。<line-break>気をつけないと悪い冒険者に<line-break>彼、襲われちゃうわよ。<end><if><value:$3D><equal>17あなたのパーティの生意気エルフ<line-break>あいかわらずね！<line-break><line-break>なーにが高貴なエルフよ。<line-break>なーにが１６００年生きているよ。<line-break>ホント気に入らないわ！<end><if><value:$3D><equal>18あ、さっき、ボゲーに<line-break>いきなりダジャレを言われて<line-break>脱力しちゃったわ。<line-break>あのダジャレボルダン、<line-break>本当になんとかしてよ。<end><if><value:$3D><equal>19さっき、ルルアンタにあったの。<line-break>彼女のほほえみを見てたら、<line-break>悩んでた気持ちがラクになって…。<line-break>リルビーって<line-break>ホント不思議な種族よね。<end>禁断の聖杯は、<line-break>まだ取り戻せていないわ。<line-break>がんばらなくちゃね。<line-break>聖杯を取り戻さないことには<line-break>みっともなくて<line-break>ロストールに帰れないもの。<end>"
english = "<if><value:$3D><equal>4That Julls traveling with you is a very strange girl. She said, “So becoming a knight means wielding a sword for other people? That's amazing!” Heh. I just don't get her.<end><if><value:$3D><equal>5Van sprang a pun on me just now. I nearly froze to death. Please do something about that fiend and his awful puns. His jokes are just too cold!<end><if><value:$3D><equal>6That oddly friendly, peculiar girl Esther is traveling with you, isn't she? She doesn't look like much, but I sense something like a strange magical power in her.<end><if><value:$3D><equal>12I'm envious. Imagine getting to travel with Xenetes, the Sword Wolf. I saw him by the town gate. He looked rather sloppy at first glance, but he didn't leave a single opening...<end><if><value:$3D><equal>13You may not be as strong as Sera, but you're much more likable. Just now, for instance...! Honestly, Sera is so rude.<end><if><value:$3D><equal>10Oh, that's right, I met your little brother. Heh. He really does adore his big sister. It made me think of that person again, just for a moment.<end><if><value:$3D><equal>14Listen! I just saw Dergado, the man they call the greatest craftsman of our age. I want to work hard and become a knight worthy of carrying one of his swords.<end><if><value:$3D><equal>15That Corns boy named Nadge is traveling with you, isn't he? He was wandering around over there. You'd better keep an eye on him, or some nasty adventurer might attack him.<end><if><value:$3D><equal>17That insolent Elf in your party hasn't changed a bit! A “noble Elf,” indeed. And sixteen hundred years old―so what? I really can't stand that Elf!<end><if><value:$3D><equal>18Bogee suddenly sprang a pun on me just now. It drained the life right out of me. Please do something about that pun-crazed Bordan.<end><if><value:$3D><equal>19I met Lulluantha just now. Seeing her smile made all my worries feel lighter... Lilbies really are a mysterious race, aren't they?<end>I still haven't recovered the Forbidden Grail. I need to keep trying. I'd be too ashamed to return to Rostorl without it.<end>"

["980073"]
japanese = "ふふ、また会ったわね。\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>。<line-break>\u3000<line-break>今日、私、とっても機嫌がいいの。<line-break>ね、暇があったら<line-break>ちょっと、つきあってくれない？<end>"
english = "Hee hee, we meet again, <value:$28>. I'm in a wonderful mood today. If you have some time, would you keep me company for a while?<end>"

["980074"]
japanese = "この間、カルラって人に会ったの。\u3000\u3000<line-break>すごく、カッコいい女の子なのよ。<line-break>\u3000<line-break>ロセンで愚王ペウダの手下が<line-break>村娘をさらおうとしてたの。<line-break>それに単身挑んでいたのがカルラよ。<end>"
english = "I met a girl named Karula the other day. She was incredibly cool. In Rocen, that fool King Peuda's men were trying to abduct a village girl, and Karula stood against them all by herself.<end>"

["980075"]
japanese = "カルラはそいつらをあっさり倒すと、<line-break>元凶であるペウダを倒すって言って<line-break>ロセンの王宮に乗り込んでいったの。<line-break>私？\u3000もちろんついていったわ。<line-break>で、途中ちょっと面倒もあったけど<line-break>ふたりでペウダをこらしめてやったの。<end>"
english = "Karula made short work of them, then said she was going after Peuda, the one behind it all, and stormed into the royal palace in Rocen. Me? Of course I went with her. We ran into a little trouble along the way, but the two of us gave Peuda a good thrashing.<end>"

["980076"]
japanese = "彼女、すごく強かったわ。<line-break>でね、腰に騎士章を下げてたの。<line-break>あれはディンガルの黒鎧騎士のものね。<end>"
english = "She was so strong. And she had a knight's insignia hanging at her waist. It was the insignia of Dyneskal's Black-Armored Knights.<end>"

["980077"]
japanese = "ディンガルって実力主義なのよ。<line-break>私も、ディンガルでなら<line-break>騎士になれるかもしれないわ。<end>"
english = "Dyneskal rewards ability above all else. Maybe I could become a knight there, too.<end>"

["980078"]
japanese = "ひとりで話しちゃってごめんなさい。<line-break>でも、なんだか、進むべき道が<line-break>見えた気がして、うれしくって…。<end>"
english = "Sorry, I've been doing all the talking. I just feel as though I've caught a glimpse of the path I should take, and it makes me so happy...<end>"

["980079"]
japanese = "それじゃあね。<line-break>縁があったら、また会いましょ。\u3000\u3000<end>"
english = "Goodbye, then. If fate allows, let's meet again.<end>"

["980080"]
japanese = "なによ。っるさいわねー。<line-break>お酒なんか飲んでないわよ。<line-break>\u3000<line-break>もう、余計なところで<line-break>干渉しないでよ。<line-break>なんか用？<end>"
english = "What? Oh, stop nagging. I haven't been drinking. And quit meddling where you're not wanted. Did you need something?<end>"

["980081"]
japanese = "…用もないのに<line-break>ただ、声をかけただけなのね。\u3000<line-break>\u3000<line-break>まあ、いいわ。<line-break>今日はゆっくりと語ってあげる。<line-break>そこに座りなさい。<end>"
english = "So you didn't actually need anything―you just called out to me. Well, fine. Today, I'll take my time and tell you a story. Sit down.<end>"

["980082"]
japanese = "す・わ・り・な・さ・い！<end>"
english = "Sit. Down. Now!<end>"

["980083"]
japanese = "私には幼なじみがいてね。<line-break>泣き虫でさ、頼りない奴だったわ。\u3000\u3000<line-break>\u3000<line-break>そいつが小さいころ、両親を亡くして<line-break>うちに引き取られることになったのね。<end>"
english = "I had a childhood friend. A crybaby, and utterly hopeless. My friend lost both parents at an early age and was taken in by my family.<end>"

["980084"]
japanese = "でさ、そいつがうちに来た日<line-break>私、いたずらして、<line-break>そいつを倉の中に閉じこめたの。\u3000\u3000\u3000<end>"
english = "The day my friend came to live with us, I played a prank and locked the kid in the storehouse.<end>"

["980085"]
japanese = "なんで閉じこめたかなんて<line-break>知らないわよ。子供のすることだもの。<line-break>\u3000<line-break>とにかく、そうしたら、そいつ<line-break>泣いちゃって。さすがに悪い気がして<line-break>私、そいつを倉の中から助け出したの。<end>"
english = "I don't know why I did it. I was a child; children do things like that. Anyway, my friend started crying. That made me feel guilty, so I let the kid out of the storehouse.<end>"

["980086"]
japanese = "そしたら、そいつ、私に感謝しちゃって<line-break>すっかり、私になついちゃってね。<line-break>それからは、ずっと私と一緒。<line-break>私も、そいつの保護者みたいな感じで<line-break>そいつのこと、守ってたのよ。<line-break>ホントにそれが当たり前だと思ってた。<end>"
english = "My friend was so grateful and grew completely attached to me. From then on, we were always together. I was like a guardian, always keeping my friend safe. I truly thought that was simply the way things were.<end>"

["980087"]
japanese = "そのとき？<line-break>謝ってないわ。<line-break>謝る機会を逸しちゃったのよ。\u3000\u3000<line-break>ま、そいつとあなたが<line-break>外見がよく似てたの。<line-break>ホント、瓜ふたつよ。<end>"
english = "Back then? No, I never apologized. I missed my chance. Anyway, you look just like my friend. The resemblance is uncanny.<end>"

["980088"]
japanese = "最初、声をかけたのも似てたから。<line-break>だから、ちょっと強引だったし、<line-break>くすっ、横柄だったでしょ？<end>"
english = "That's why I spoke to you in the first place. So I was a little pushy and, heh, rather high-handed, wasn't I?<end>"

["980089"]
japanese = "少しは、気を使って、<line-break>そうでもないとかフォローしてよ。<line-break>もう！<end>"
english = "You could at least spare my feelings and say I wasn't. Honestly!<end>"

["980090"]
japanese = "そいつ？<line-break>さっきから過去形で語ってるでしょ？\u3000<line-break>察しなさいよ。<line-break>死んじゃったわ。<line-break>私の目の前で<line-break>…私をかばって。<end>"
english = "My friend? I've been speaking in the past tense this whole time. Take the hint. My friend died right in front of me... shielding me.<end>"

["980091"]
japanese = "ロストールの平民街に<line-break>突然、怪物が出現した事件があって…\u3000<line-break>貴族のいたずら…らしいんだけどね。<line-break>で、一緒に怪物を退治に出たんだけど<line-break>そのとき、ね…。<line-break>ったく、弱いのにカッコつけて…。<end>"
english = "There was an incident in Rostorl's commoners' quarter. A monster suddenly appeared... Apparently, it was a prank by the nobility. We went out together to defeat it, and that was when... Damn fool. So weak, but still trying to act tough...<end>"

["980092"]
japanese = "そのとき、ふと、倉に閉じこめたこと、<line-break>思い出しちゃって…。あ…、もう<line-break>謝ることができないんだ…って。<line-break>空気みたいな奴だったけど<line-break>結構、大きな存在だったんだなって<line-break>そのとき、気づいて…。<end>"
english = "At that moment, I suddenly remembered locking my friend in the storehouse. I thought, “Oh... now I'll never be able to apologize.” My friend had always just been there, like the air. Only then did I realize what a large place my friend had held in my life...<end>"

["980093"]
japanese = "守ってやれなかった…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>もう少し、力があれば<line-break>守ってやれたのに…。<end>"
english = "I couldn't protect my friend... If I'd only been a little stronger, I could have...<end>"

["980094"]
japanese = "守りたかった…。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>…ごめんね。<line-break>変なこと、しゃべったね。<end>"
english = "I wanted to... I'm sorry. That was a strange thing to tell you.<end>"

["980095"]
japanese = "あーあ、まだグズグズ言ってる。<line-break>私、ダメね。自己嫌悪しちゃう。\u3000<line-break>\u3000<line-break>ホント、ゴメンね。<line-break>あなたってそいつに似てるから<line-break>つい、甘えちゃうのかもしれない。<end>"
english = "And here I am, still going on about it. I'm hopeless. I hate myself for this. I'm really sorry. You remind me so much of my friend that maybe I end up leaning on you.<end>"

["980096"]
japanese = "それじゃ、<line-break><value:$28>。<end>"
english = "Well then, <value:$28>.<end>"

["980097"]
japanese = "んにゃーん。<line-break>\u3000<end>"
english = "Mrrrow.<end>"

["980098"]
japanese = "誰なの、あなた！<line-break>私たちの邪魔をしないで！<end>"
english = "Who are you? Stay out of our way!<end>"

["980099"]
japanese = "それでは、オルファウスさん。<line-break>私たち、もう行きます。<line-break>本当にありがとうございました。<end>"
english = "Well then, Orphaus, we'll be going now. Thank you so much for everything.<end>"

["980100"]
japanese = "………………！<line-break>え？\u3000えええええっ！？<end>"
english = "...! What? Whaaaaat?!<end>"

["980101"]
