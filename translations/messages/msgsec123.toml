["1230169"]
japanese = "姉ちゃん、タルテュバの奴を見ていると<line-break>ボルボラを思い出さないか？<line-break>貴族ってイヤな人間ばかりなんだな。<line-break>ハンナの人形を持ってる王女様も<line-break>気位ばっか高い嫌味な女だったら<line-break>姉ちゃん自慢の平手でやっつけてよ。<end>"
