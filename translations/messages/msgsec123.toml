["1230174"]
japanese = "ゼネテスさんにもらった<line-break>銀竜の首飾りがあれば<line-break>秘密通路が見つかるんだってね。<line-break>城門の近くにあるらしいから<line-break>門衛に見つからないように<line-break>探さないといけないね。<end>"
