["1230163"]
japanese = "貴族なのに自分で買った人形でなくて<line-break>盗んだ人形をプレゼントするなんて<line-break>タルテュバは変人ですね。<line-break>もしかして人形を買いに行くのが<line-break>恥ずかしくて、おもわず盗んじゃった<line-break>のかもしれませんね。<end>"
