["1230173"]
japanese = "残念じゃ、わしがその場におれば、<line-break>タルテュバの首根っこをひっつかんで、<line-break>人形を取り返しにいかせたのじゃが。<line-break>まあ、ゼネテス殿の話が本当なら<line-break>城門の近くに秘密通路があるのじゃろ？<line-break>そこから城に乗り込もうぞ。<end>"
