["1230000"]
japanese = "（ロストールの冒険者ギルドで青年に、<line-break>\u3000城塞都市跡にいる魔物を<line-break>\u3000倒してくれと頼まれた）<line-break>（彼の仲間は、その魔物に殺された<line-break>\u3000らしい）<end>"
english = "(At the Adventurers' Guild in Rostorl, a young man asked you to defeat a monster in the Fortress City Ruins.) (Apparently, that monster killed his companions.)<end>"

["1230001"]
japanese = "あなたに仇討ちを依頼してきた青年の<line-break>仲間を殺した魔物は、<line-break>城塞都市跡にいるのよ。<line-break>駆け出しとはいえ冒険者を何人も<line-break>殺している魔物よ。<line-break>油断しないでね。<end>"
english = "The monster that killed the companions of the young man who asked you to avenge them is in the Fortress City Ruins. Novices though they were, it has killed several adventurers. Don't let your guard down.<end>"

["1230002"]
japanese = "その青年は、仲間の仇討ちのために、<line-break>自分のケガも省みず有り金をはたいて、<line-break>お主を雇ったのだな？<line-break>よし！\u3000その仇討ち、わしも手伝う。<line-break>共に魔物とやらを成敗しようぞ。<line-break>城塞都市跡に出発じゃ。<end>"
english = "So that young man spent every coin he had to hire you to avenge his companions, despite his own injuries? Very well! I shall help you avenge them. Together, we shall punish this monster. Let us depart for the Fortress City Ruins!<end>"

["1230003"]
japanese = "仇討ちなんて物騒ですね。<line-break>でも、時代錯誤な<line-break>男のロマンを感じます。<line-break><value:$28>様、<line-break>がんばってくださいね。<line-break>私、応援してますから。<end>"
english = "Vengeance is such a violent business. Still, it has the air of some old-fashioned male fantasy. Do your best, <value:$28>. I'll be cheering you on.<end>"

["1230004"]
japanese = "俺はいつでも出発できるぜ。<line-break>凶暴な魔物だろうが、何だろうが、<line-break>俺の鉄拳で叩きつぶしてやる！<end>"
english = "I'm ready to leave whenever you are. Savage monster or whatever else it may be, I'll smash it flat with my iron fist!<end>"

["1230005"]
japanese = "ロストールで会った<line-break>冒険者との約束を守るために、<line-break>城塞都市跡にいる魔物を倒すんだね。<line-break>相手は、冒険者を何人も殺している<line-break>凶暴な魔物だよ。<line-break>絶対に油断しちゃダメだからね。<end>"
english = "So you're going to defeat the monster in the Fortress City Ruins and keep your promise to the adventurer you met in Rostorl. It's a savage beast that's already killed several adventurers. You absolutely must not let your guard down.<end>"

["1230006"]
japanese = "仇討ちなのね…。<line-break>行くかどうかは、あなたが決めて。<line-break>私はあなたの意志に従うわ。<end>"
english = "So this is about revenge... Whether we go is up to you. I'll abide by your decision.<end>"

["1230007"]
japanese = "きっと、若すぎるあまり、<line-break>勇み足が過ぎたのでしょうね。<line-break>痛ましいことです。<line-break>城塞都市跡へ行くのなら、<line-break>せめてあなたは万全を期しなさい。<line-break>それが彼らのためでもあります。<end>"
english = "They were surely so young that they rushed in too recklessly. How tragic. If you go to the Fortress City Ruins, at least make every possible preparation. That would be for their sake as well.<end>"

["1230008"]
japanese = "仲間がもう死んじゃってるなら、<line-break><value:$28>が魔物を倒しても<line-break>何の得にもならないのにねぇ。<line-break>それでも仇討ちを依頼するんだから、<line-break>人の心って、不思議なもんだわ。<end>"
english = "With his companions already dead, <value:$28> gains nothing by defeating the monster. Yet he still asks for revenge. The human heart is a strange thing.<end>"

["1230009"]
japanese = "ロストールで受けた依頼だろ？<line-break>魔物に仲間を殺された冒険者の<line-break>仇を討ってやるんだよな。<line-break>姉ちゃんは、その魔物に勝つ自信が<line-break>あるから引き受けたんだろ？<line-break>まさか、そいつに同情したのか！<end>"
english = "This is the job you took in Rostorl, right? You're avenging the adventurer whose companions were killed by a monster. You accepted because you're confident you can beat it, right, sis? Don't tell me you felt sorry for the guy!<end>"

["1230010"]
japanese = "私には、その若者の気持ちが<line-break>痛いほどよくわかるわ。<line-break><line-break><value:$28>、<line-break>あなたが行かないのであれば、<line-break>私が城塞都市跡へ行くわ。<end>"
english = "I understand that young man's feelings all too painfully. <value:$28>, if you won't go, then I will go to the Fortress City Ruins myself.<end>"

["1230011"]
japanese = "お前さんは今や、駆け出しの<line-break>冒険者たちの目標だ。<line-break>やつらの期待を裏切らないためにも、<line-break>今回の仇討ちは成功させろよ。<line-break>城塞都市のモンスターは強い。<line-break>油断はするな。<end>"
english = "You've become a role model for novice adventurers. To live up to their expectations, make sure this quest for vengeance succeeds. The monster in the Fortress City Ruins is strong. Don't let your guard down.<end>"

["1230012"]
japanese = "城塞都市跡に現れる魔物か…。<line-break>気になる事がある。<line-break>付き合ってやってもいいぞ。<end>"
english = "A monster appearing in the Fortress City Ruins... Something about that concerns me. I suppose I could accompany you.<end>"

["1230013"]
japanese = "お主ほど有名になってしまうと、<line-break>他の冒険者の手本となるように<line-break>行動せねばいかんぞ。<line-break>城塞都市跡に現れる魔物とやらも、<line-break>ほっとけば犠牲者が増える一方じゃ。<line-break>ここは、お主が倒すしかないぞ。<end>"
english = "Now that you have become so famous, you must conduct yourself as an example to other adventurers. If this monster in the Fortress City Ruins is left alone, the number of victims will only grow. You have no choice but to defeat it.<end>"

["1230014"]
japanese = "ロストールの冒険者の間でも、<line-break>城塞都市跡の魔物は問題に<line-break>なっているみたいだよ。<line-break>ほっとけば新たな犠牲者が出るかも<line-break>しれないし、僕たちで何とかしようよ。<end>"
english = "It sounds like the monster in the Fortress City Ruins has become a problem for Rostorl's adventurers too. If we leave it alone, there may be more victims. Let's do something about it ourselves.<end>"

["1230015"]
japanese = "死んだ仲間の仇討ちか…。<line-break>無念を晴らしてやりたい気持ちは<line-break>私にもよくわかるが、<line-break>君まで犠牲になってはならない。<line-break>城塞都市跡に行くのなら、<line-break>万全を期すべきだ。<end>"
english = "Avenging fallen companions... I understand the desire to avenge them, but you must not become another victim. If you go to the Fortress City Ruins, you should make every possible preparation.<end>"

["1230016"]
japanese = "仇討ちなんて、<line-break>ほ～んと人間って野蛮よね。<line-break>だから戦争なんて起こすんだわ。<line-break>高貴で優雅で知性あふれる<line-break>アタクシたちを見習って欲しいものね。<end>"
english = "Revenge? Humans truly are so barbaric. That's why they start wars. They should learn from us: noble, graceful, and brimming with intellect.<end>"

["1230017"]
japanese = "あだー！\u3000ウッ！\u3000ちぃいいい！<line-break>仇討ちに失敗してケガをしたでござる。<line-break><line-break>少し冗長でござったな。<line-break>拙者、さらに精進する所存。<line-break>兄弟子もがんばってくだされ。<end>"
english = "Avenge―ow! Ugh! Gaaah! I failed to avenge them and was injured. That was a little long-winded. I intend to train even harder. Do your best as well, senior disciple.<end>"

["1230018"]
japanese = "ロストールの酒場で教えてもらったの。<line-break>城塞都市跡に凶暴な魔物が住み着いて<line-break>冒険者を襲っているんだってぇ。<line-break><value:$28>が倒してって<line-break>頼まれたのも、きっとその魔物だよ。<end>"
english = "I heard about it at a tavern in Rostorl. A vicious monster has settled in the Fortress City Ruins and is attacking adventurers. I bet it's the same monster <value:$28> was asked to defeat.<end>"

["1230019"]
japanese = "………………。<line-break><line-break><line-break>相手の力量を見誤れば、死ぬ。<line-break>忘れるな。<end>"
english = "........... Misjudge your opponent's strength and you die. Never forget that.<end>"

["1230020"]
japanese = "無力がために、次々仲間たちが<line-break>殺されていく…。<line-break>さぞ無念だったことだろうな。<line-break>しかし、仇討ちを他人に頼むと<line-break>なると、話は別だ。その者の命まで<line-break>捧げることとなったら、どうする。<end>"
english = "To be powerless as one companion after another is killed... The frustration must have been unbearable. But asking someone else to take revenge is another matter. What if it costs that person a life as well?<end>"

["1230021"]
japanese = "城塞都市跡で次々に冒険者を襲っている<line-break>魔物はね、キマイラみたいに頭が２個<line-break>あって、しっぽがヘビなんだって。<line-break>それからねロストールの冒険者たちは、<line-break><value:$28>が魔物を倒してくれる<line-break>のを待ち望んでるみたいだよ。<end>"
english = "They say the monster attacking adventurers in the Fortress City Ruins has two heads like a Chimera and a snake for a tail. And it sounds like the adventurers of Rostorl are eagerly waiting for <value:$28> to defeat it.<end>"

["1230022"]
japanese = "駆け出しの身で城塞都市跡に行くとは<line-break>軽率さゆえ身を滅ぼしたと<line-break>言われても仕方がない。<line-break>しかし、彼らのおかげで魔物の<line-break>危険さがわかったというわけだ。<line-break>放っておくわけにはいかないな。<end>"
english = "They were mere novices when they went to the Fortress City Ruins, so no one could deny that their recklessness cost them their lives. But thanks to them, we now know how dangerous the monster is. We cannot leave it alone.<end>"

["1230023"]
japanese = "町で聞いた噂が確かならば、<line-break>城塞都市跡に現れる魔物は、<line-break>かなり強大なもののようです。<line-break>仇討ちはともかく、このまま<line-break>放っておくのは、犠牲者を増やす<line-break>ことにつながるかもしれません。<end>"
english = "If the rumors we heard in town are true, the monster appearing in the Fortress City Ruins is extremely powerful. Revenge aside, leaving it alone may lead to more victims.<end>"

["1230024"]
japanese = "あの人たちのかたきを討ちに行くのね？<line-break>頑張ろう、<value:$28>。<end>"
english = "We're going to avenge those people, right? Let's do our best, <value:$28>.<end>"

["1230025"]
japanese = "…まこと、けしからん。<line-break>道理知らずの冒険者気取りが、<line-break>むざむざ落命なぞしおって！<line-break>城塞都市跡へ向かおう。<line-break>魔物は、獲物ではないのじゃ…。<end>"
english = "...Truly disgraceful. Those ignorant would-be adventurers went and threw their lives away! Let us head to the Fortress City Ruins. A monster is no mere quarry...<end>"

["1230026"]
japanese = "あの若者、さぞ無念だったろうな。<line-break>仲間が犠牲になっていくのを目の前に<line-break>どうもできなかったとは…。<line-break><value:$28>に出会えたのは<line-break>せめてもの幸いだっただろう。<line-break>これで仇が討たれるのだからな。<end>"
english = "That young man must have felt utterly helpless. To watch his companions fall and be unable to do anything... Meeting <value:$28> was at least one stroke of good fortune. Now they will be avenged.<end>"

["1230027"]
japanese = "依頼してきた男の仲間を殺した魔物は、<line-break>城塞都市跡にいるそうだ。<line-break><line-break>あいつの無念を晴らすために、<line-break>行くぞ、<value:$28>。<end>"
english = "The monster that killed the client's companions is apparently in the Fortress City Ruins. Let's go, <value:$28>, and lay his regrets to rest.<end>"

["1230028"]
japanese = "あの冒険者もかわいそうね…。<line-break>とにかく仇を討ってあげましょ。<line-break>魔物は城塞都市跡にいるわ。<line-break>でもね、相手の力を見誤るっていうのは<line-break>命に関わることなのよ。<line-break>肝に銘じておいて、<value:$28>。<end>"
english = "I feel sorry for that adventurer too... In any case, let's avenge his companions. The monster is in the Fortress City Ruins. But misjudging an opponent's strength can cost you your life. Take that to heart, <value:$28>.<end>"

["1230029"]
japanese = "………………。<end>"
english = "...........<end>"

["1230030"]
japanese = "魔物に仲間たちを殺された…。<line-break>その気持ち、よくわかります。<line-break><line-break>死んでいった彼の仲間たちのためにも、<line-break>城塞都市跡の魔物を倒しましょう。<end>"
english = "To have your companions killed by a monster... I know that pain well. For the sake of the companions he lost, let us defeat the monster in the Fortress City Ruins.<end>"

["1230031"]
japanese = "………………。<end>"
english = "...........<end>"

["1230032"]
japanese = "（テラネの冒険者ギルドで、<line-break>\u3000紺碧の洞窟を荒らす怪物の退治を<line-break>\u3000依頼された）<end>"
english = "(At the Adventurers' Guild in Terane, we were hired to defeat the monster ravaging Azure Cave.)<end>"

["1230033"]
japanese = "テラネで依頼された仕事ね。<line-break>紺碧の洞窟のコロル石は、<line-break>ディンガル帝国の収入源のひとつよ。<line-break>この仕事のできしだいでは、<line-break>私たちの働きが帝国に認められて<line-break>騎士になれる…なんて無理か。<end>"
english = "This is the job we took in Terane. The Korol Stone in Azure Cave is one of the Dingal Empire's sources of revenue. If we handle this job well, perhaps the Empire will recognize our service and make us knights... No, I suppose that's impossible.<end>"

["1230034"]
japanese = "５０００ギアとは、<line-break>帝国のコロル石採掘部門も<line-break>ずいぶんとケチじゃな。<line-break>紺碧の洞窟は、お主が依頼を受けた<line-break>テラネの北にある。<line-break>準備ができたら出発しようぞ。<end>"
english = "Five thousand Gea? The Empire's Korol Stone mining division is rather stingy. Azure Cave lies north of Terane, where you accepted the job. Let us depart once you are ready.<end>"

["1230035"]
japanese = "その怪物をやっつけるだけで<line-break>５０００ギアも、もらえるんですか！？<line-break>す、すごいです…。<line-break>冒険者って本当にもうかるんですね。<line-break>私、応援してますから、<line-break>がんばってくださいね。<end>"
english = "You get five thousand Gea just for defeating that monster?! Th-That's incredible... Adventurers really do make a lot of money. I'll be cheering you on, so do your best!<end>"

["1230036"]
japanese = "この怪物退治は、ほんとうに<line-break>テラネの冒険者ギルドで引き受けた<line-break>仕事なんだな！<line-break>よっしゃぁああ！<line-break>故郷に錦を飾るチャンス到来。<line-break>親父！\u3000おふくろ！\u3000見ててくれよ！<end>"
english = "You really took this monster-hunting job at the Adventurers' Guild in Terane, right? All riiight! My chance to return home in glory has finally come. Dad! Mom! Watch me!<end>"

["1230037"]
japanese = "テラネのギルドで依頼されて、<line-break>紺碧の洞窟へ怪物退治に行くんでしょ。<line-break>ふふふ、ボクには何でもお見通しさ。<line-break>報酬が５０００ギアだってこともね。<line-break>今回の報酬でボクの装備品を鍛えて<line-break>欲しいなぁ…なんてダメ？<end>"
english = "The Guild in Terane hired you to hunt a monster in Azure Cave, right? Heh heh, I know everything. Even that the reward is five thousand Gea. Maybe you could use the money to improve my equipment... No?<end>"

["1230038"]
japanese = "テラネで依頼されたのは、<line-break>紺碧の洞窟での怪物退治よ。<line-break><line-break>さすがに紺碧の洞窟まで行くとなると<line-break>辺境という気がするわね。<end>"
english = "The job you took in Terane is to hunt a monster in Azure Cave. Going all the way to Azure Cave really does feel like venturing into the frontier.<end>"

["1230039"]
japanese = "確か、テラネで依頼されたのは、<line-break>紺碧の洞窟の怪物退治だった<line-break>はずですね。<end>"
english = "If I remember correctly, the job you took in Terane was to hunt the monster in Azure Cave.<end>"

["1230040"]
japanese = "今度は紺碧の洞窟で怪物退治？<line-break>報酬が高いのはいいけど、<line-break>ずいぶん遠くまで行くのねぇ～。<end>"
english = "Now we're hunting a monster in Azure Cave? A big reward is nice, but we're going an awfully long way.<end>"

["1230041"]
japanese = "姉ちゃん聞いたぜ！<line-break>テラネで引き受けた怪物退治の仕事は、<line-break>成功報酬が５０００ギアなんだって！<line-break>俺、冒険者やっててよかったよ。<line-break>もちろん畑仕事も好きだけど、<line-break>それじゃ大金は手に入らないからな。<end>"
english = "Sis, I heard! The monster-hunting job you took in Terane pays five thousand Gea if you succeed! I'm glad I became an adventurer. I like farming too, of course, but it won't make me rich.<end>"

["1230042"]
japanese = "紺碧の洞窟といえば、コロル石の<line-break>採掘場がある。帝国側からしても<line-break>無関係の場所ではないわ。<end>"
english = "Azure Cave contains a Korol Stone mine. The Empire has a stake in the place too.<end>"

["1230043"]
japanese = "普通は帝国の依頼した仕事なんて、<line-break>腕利きの冒険者じゃないと<line-break>冒険者ギルドも紹介しないもんだ。<line-break>それが依頼されたってんだから、<line-break>お前さんも腕利き冒険者として、<line-break>世間に認められてるってことだぜ。<end>"
english = "Normally, the Adventurers' Guild only refers jobs from the Empire to highly skilled adventurers. Since they offered it to you, that means people now recognize you as a skilled adventurer too.<end>"

["1230044"]
japanese = "紺碧の洞窟の怪物か…。<line-break>気になる事がある。<line-break>付き合ってやってもいいぞ。<end>"
english = "The monster in Azure Cave... Something about that concerns me. I suppose I could accompany you.<end>"

["1230045"]
japanese = "帝国の騎士団もふがいないのう。<line-break>怪物退治など、自分たちで<line-break>やればよかろうに。<line-break>それとも、そのような事に<line-break>騎士団を出せない事情がある<line-break>ということじゃろうか。<end>"
english = "The Empire's knights are a sorry lot. Surely they could hunt the monster themselves. Or is there some reason they cannot deploy the knights for such a task?<end>"

["1230046"]
japanese = "テラネの町は冒険者に冷たいから、<line-break>あまり冒険者が集まらないんだ。<line-break>ギルドの主人も困っていたと思うよ。<line-break>だから、もしも僕たちがこの仕事を<line-break>失敗したら、他にやってくれる人は<line-break>いないよ。<end>"
english = "Terane isn't friendly to adventurers, so not many gather there. I think the Guildmaster was having trouble because of that. If we fail this job, there may be no one else willing to do it.<end>"

["1230047"]
japanese = "テラネのギルドで依頼されたのは<line-break>紺碧の洞窟の怪物退治だったな。<line-break>気を抜かず、解決しよう。<end>"
english = "The job we took at the Guild in Terane was to hunt the monster in Azure Cave. Let us stay alert and see it through.<end>"

["1230048"]
japanese = "ま～た飽きもせず怪物退治ぃ！<line-break>いつになったら冒険のすばらしさを<line-break>教えてくれるわけぇ？<line-break>高貴で知的なアタクシでも、<line-break>がまんの限界ってものがあるわよ！<end>"
english = "Hunting monsters again? Don't you ever get tired of it?! When are you going to show me the wonders of adventure? Even a noble and intellectual lady such as myself has limits to her patience!<end>"

["1230049"]
japanese = "紺碧の怪物を貝でぶつ！<line-break>略して、今回ぶつ！<line-break>かかってこんかい！<line-break>おそまつさまでござる。<end>"
english = "I'll conk the Azure monster with a conch! In short: conch-k it! Come and get conked! Thank you, thank you.<end>"

["1230050"]
japanese = "紺碧の洞窟の怪物を退治したら、<line-break><value:$28>、テラネのギルドへ<line-break>報告に行くんでしょ。<line-break>テラネのボンガさんはいい人だよぉ。<line-break>ルルアンタ、お菓子をもらっちゃった。<line-break>また今度遊びに行くんだぁ。<end>"
english = "After defeating the monster in Azure Cave, you're going to report back to the Guild in Terane, right, <value:$28>? Bonga in Terane is really nice. He gave Lulluantha some sweets! I'm going back to visit again sometime.<end>"

["1230051"]
japanese = "………………。<line-break><line-break><line-break>興味がない。<end>"
english = "........... I have no interest.<end>"

["1230052"]
japanese = "紺碧の洞窟も、ディンガルの<line-break>鉱物採掘場のひとつだと聞いた。<line-break><line-break>ならば、わざわざ俺たちが<line-break>出るまでもなかろう？<end>"
english = "I heard Azure Cave is one of Dingal's mineral mines. If so, surely there is no need for us to intervene.<end>"

["1230053"]
japanese = "紺碧の洞窟の地底湖ってきれいだよね。<line-break>きれいなものも見られて、報酬も<line-break>もらえるなんて一石二鳥だよ。<line-break>ボクはもう、行く気満々だからぁ。<line-break>いつでも出発できるよっ！<line-break>さあ、しゅっぱーつ！<end>"
english = "The underground lake in Azure Cave is beautiful, isn't it? We get to see something lovely and earn a reward too―the best of both worlds! I'm already raring to go. I can leave anytime! Come on, let's gooo!<end>"

["1230054"]
japanese = "報告によると紺碧の洞窟の魔物は<line-break>かなり手ごわい相手らしい。<line-break>君がしくじるとは思えんが…。<line-break>用心はしておいた方がよかろう。<end>"
english = "According to the reports, the monster in Azure Cave is a formidable opponent. I do not expect you to fail, but caution would still be wise.<end>"

["1230055"]
japanese = "紺碧の洞窟にはディンガルの<line-break>鉱物資源採掘場があります。<line-break><line-break>そこを取り戻したいというのなら、<line-break>帝国が動くべきではないでしょうか？<line-break>どうお考えです、<value:$28>様？<end>"
english = "Azure Cave contains one of Dingal's mineral extraction sites. If the Empire wants to reclaim it, should the Empire not take action itself? What do you think, <value:$28>?<end>"

["1230056"]
japanese = "紺碧の洞窟に行くんだよね。<line-break>でも、ディンガルの土地でしょ？<line-break>どうして冒険者にやらせるのかな？<end>"
english = "We're going to Azure Cave, right? But that's Dingal territory, isn't it? Why are they making adventurers handle it?<end>"

["1230057"]
japanese = "美しい地底湖とコロル石産出で知られる<line-break>紺碧の洞窟にも魔物が出現したとな。<line-break>闇の勢いは依然増している…。<line-break>封士と呼ばれた身、<line-break>いざ、紺碧の洞窟へ行くぞ！<end>"
english = "So a monster has appeared even in Azure Cave, famed for its beautiful underground lake and Korol Stone. The darkness continues to gather strength... As one once called a Sealer, I must answer the call. To Azure Cave!<end>"

["1230058"]
japanese = "紺碧の洞窟が次の目的地になるとは、<line-break>私たちもずいぶんと遠くへやってきた<line-break>ものだな。<line-break>岬の先は全て無限とも思える大海、<line-break>まさに最果ての地という感じだ。<end>"
english = "To think Azure Cave would be our next destination. We truly have come a long way. Beyond the cape lies nothing but a vast sea that seems infinite. It truly feels like the end of the world.<end>"

["1230059"]
