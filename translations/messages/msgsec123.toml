["1230061"]
japanese = "………………。<end>"
english = "...........<end>"

["1230062"]
japanese = "紺碧の洞窟で怪物を倒す依頼です。<line-break>報酬は、なんと５０００ギア！？<line-break>たくさんもらえるんですね。<end>"
english = "The job is to defeat a monster in Azure Cave. And the reward is five thousand Gea?! That's a lot of money.<end>"

["1230063"]
japanese = "………………。<end>"
english = "...........<end>"

["1230064"]
japanese = "（ウルカーンのギルドで会った男の子に<line-break>\u3000鳳凰山へ鳳凰を探しに行ってくれと<line-break>\u3000頼まれてしまった）<end>"
english = "(A boy we met at the Guild in Urkaan asked us to search Phoenix Mountain for a phoenix.)<end>"

["1230065"]
japanese = "鳳凰山に鳳凰を探しに行くって、本気？<line-break>あなたに鳳凰探しを頼んだ子が、<line-break>嘘を言ってるかもしれないのに…。<line-break>ほんと、お人好しよね。<line-break>そこがあなたのいいところ<line-break>なのかもしれないけど。<end>"
english = "Are you seriously going to Phoenix Mountain to look for a phoenix? The child who asked you may have been lying... You really are too kind for your own good. Though perhaps that's one of your better qualities.<end>"

["1230066"]
japanese = "鳳凰山に鳳凰探しとな？<line-break>ハハハハハハ…。<line-break>おもしろい！\u3000わしも手伝うぞ。<line-break>子どもの願いを聞いてやることも、<line-break>勇者としては大切な仕事だからな。<end>"
english = "Search Phoenix Mountain for a phoenix, you say? Ha ha ha ha ha! Fascinating! I shall help too. Granting a child's wish is also an important duty for a hero.<end>"

["1230067"]
japanese = "世界的に有名な冒険者、<line-break><value:$28>様に<line-break>１０ギアで仕事を頼むなんて…。<line-break>ほんっとに子どもって迷惑ですよね。<line-break>でも、そんな子どものわがままにも<line-break>つきあってあげるなんて立派ですね。<end>"
english = "Imagine asking the world-famous adventurer <value:$28> to do a job for ten Gea... Children truly are such a nuisance. Still, it is admirable of you to indulge such a selfish request.<end>"

["1230068"]
japanese = "鳳凰山に鳳凰を探しに行くのか！<line-break>おっもしれえじゃないか。<line-break>俺も行きたいぜ。<line-break>ところで、<line-break>鳳凰を見つけたらどうすんだ？<line-break>羽でも抜いて帰るのか？<end>"
english = "You're going to Phoenix Mountain to look for a phoenix? That sounds great! I want to come too. By the way, what'll you do if you find one? Pluck out a feather and bring it back?<end>"

["1230069"]
japanese = "ボクは、その子の話を信じるよ。<line-break>キミだって信じているから、<line-break>鳳凰探しを引き受けたんでしょ。<line-break>その子が嘘つきじゃないってことを<line-break>証明するためにも、<line-break>ぜったいに鳳凰を見つけようね。<end>"
english = "I believe that child's story. You accepted the search because you believe it too, right? Let's make sure we find the phoenix and prove that child isn't a liar.<end>"

["1230070"]
japanese = "鳳凰を見たという子供の言葉を<line-break>信じるとは、<value:$28>も<line-break>いいところがあるわね。<line-break>ギルドでは一蹴されていたけど、<line-break>腹黒い大人たちに比べれば、<line-break>子供はよほど信頼できるわ。<end>"
english = "So you believe the child who claims to have seen a phoenix. You do have some good qualities, <value:$28>. The Guild dismissed the story outright, but children are far more trustworthy than scheming adults.<end>"

["1230071"]
japanese = "子供の言うことを聞いてあげるとは<line-break><value:$28>もなかなか<line-break>余裕が出てきましたね。<line-break>行ってあげるといいでしょう。<line-break>その子が業を煮やして、自分で<line-break>確かめに走らないうちにね。<end>"
english = "Indulging a child's request shows that you have gained some composure, <value:$28>. You should go, before the child loses patience and runs off to investigate alone.<end>"

["1230072"]
japanese = "へぇ～、<value:$28>の<line-break>意外な一面発見！\u3000って感じねえ。<line-break>感心しちゃうわ。<line-break>じゃ、いっちょ、鳳凰山まで<line-break>行きましょうか、勇者様。<line-break>夢あるチビッ子のために！<end>"
english = "Well, well, an unexpected side of <value:$28>! I'm impressed. All right, let's take a trip to Phoenix Mountain, mighty Hero―for the sake of a little dreamer!<end>"

["1230073"]
japanese = "さすが、姉ちゃんはひと味違うよ。<line-break>世界中捜したって子どもの依頼を<line-break>受ける冒険者は姉ちゃんだけだぜ。<line-break>俺、姉ちゃんの弟だって誇りに思う。<line-break>俺も手伝うからさ、あの子のためにも<line-break>鳳凰を見つけような！<end>"
english = "I knew you were special, sis. Search the whole world and you wouldn't find another adventurer willing to accept a child's request. I'm proud to be your little brother. I'll help too, so let's find that phoenix for the kid!<end>"

["1230074"]
japanese = "周囲は何と言ったか知らないけれど、<line-break>私は、<value:$28>の判断は<line-break>正しいと思うわ。<line-break>鳳凰山にもモンスターはいる。<line-break>そんなところへ子供を行かせる<line-break>わけにはいかないもの…。<end>"
english = "I don't know what everyone else said, but I think you made the right decision, <value:$28>. There are monsters on Phoenix Mountain too. We cannot let a child go to such a place...<end>"

["1230075"]
japanese = "ウルカーンのギルドの主人に聞いたぜ。<line-break>お前さん、鳳凰山に鳳凰を<line-break>探しに行く依頼を受けたんだろ？<line-break>ギルドの主人は信じてなかったが、<line-break>鳳凰山に鳳凰が降り立つって伝説は<line-break>本当にあるんだ。信じていいと思うぜ。<end>"
english = "I heard from the Guildmaster in Urkaan. You took a job to search Phoenix Mountain for a phoenix, right? The Guildmaster didn't believe it, but there really is a legend that a phoenix descends upon Phoenix Mountain. I think you can believe the boy.<end>"

["1230076"]
japanese = "鳳凰山に鳳凰を探しにいくのか…。<line-break>気になる事がある。<line-break>付き合ってやってもいいぞ。<end>"
english = "You're going to Phoenix Mountain to search for a phoenix... Something about that concerns me. I suppose I could accompany you.<end>"

["1230077"]
japanese = "鳳凰山に鳳凰を探しに行くとな？<line-break>わはははは…、これは傑作じゃ。<line-break>わしも、ぜひ参加したいぞ。<line-break>もちろん冗談で付き合うのではないぞ。<line-break>お主が、その子を信じておるからこそ、<line-break>わしも信じておるのじゃからな。<end>"
english = "You mean to search Phoenix Mountain for a phoenix? Wah ha ha ha! What a marvelous idea. I insist on joining you. And I am not coming along as a joke. I believe because you believe that child.<end>"

["1230078"]
japanese = "鳳凰探し？<line-break>ああ、ウルカーンのギルドで、<line-break>男の子に頼まれた仕事だね。<line-break>その子の言うとおり、鳳凰山で鳳凰を<line-break>見つけられればいいんだけど…。<line-break>もし、いなかったらどうしようか？<end>"
english = "A phoenix hunt? Ah, the job that boy gave you at the Guild in Urkaan. I hope we can find a phoenix on Phoenix Mountain, just as he said... But what will we do if there isn't one?<end>"

["1230079"]
japanese = "鳳凰山には鳳凰が降り立つという<line-break>伝説が現にあるらしい。<line-break><line-break>その第一発見者が子供だというだけで、<line-break>鳳凰自体は本当にいるのかもしれない。<line-break>私としても、興味はあるな。<end>"
english = "Apparently there really is a legend that a phoenix descends upon Phoenix Mountain. The mere fact that a child was the first to spot it does not mean the phoenix itself is imaginary. I admit, I am interested.<end>"

["1230080"]
japanese = "鳳凰山に鳳凰を探しに行くぅ？<line-break>アナタ、もしかしてバカなの？<line-break>あの山に鳳凰がいるわけないでしょ！<line-break>山の名前が鳳凰山だからって<line-break>鳳凰がいる証拠にはならないのよ！<line-break>くだらなくって付き合ってられないわ。<end>"
english = "You're going to Phoenix Mountain to look for a phoenix? Are you an idiot? There's no way a phoenix lives on that mountain! Calling it Phoenix Mountain doesn't prove there's a phoenix there! This is too ridiculous for me to bother with.<end>"

["1230081"]
japanese = "ほーおー<line-break>鳳凰でござるか。<line-break>ほおーっておけばいいでござるよ。<line-break>ふふふふ…、<line-break>拙者もダジャレのコツがつかめて<line-break>きましたぞ。<end>"
english = "A fee-nix, you say? I say we should nix the whole affair. Heh heh heh... I am finally getting the hang of puns.<end>"

["1230082"]
japanese = "鳳凰山に鳳凰を探しに行くの？<line-break>ルルアンタも連れてって欲しいなあ。<line-break>だって鳳凰、見たことないんだもん。<line-break>もしダメなら捕まえてきてね。<line-break>約束だよ、ね、<value:$28>。<line-break>ルルアンタのお願いだよ。<end>"
english = "Are you going to Phoenix Mountain to look for a phoenix? Lulluantha wants to come too! I've never seen a phoenix before. If I can't come, catch it and bring it back, okay? Promise me, <value:$28>. It's Lulluantha's special request.<end>"

["1230083"]
japanese = "………………。<line-break><line-break><line-break>興味がない。<end>"
english = "........... I have no interest.<end>"

["1230084"]
japanese = "鳳凰山に鳳凰がいるというのか。<line-break>子供の言葉は信用できるとは言えんが、<line-break>おもしろい話ではあるな。<end>"
english = "A phoenix on Phoenix Mountain? I cannot say a child's word is reliable, but it is an intriguing story.<end>"

["1230085"]
japanese = "へぇ～、その子は鳳凰を見たのかぁ。<line-break>いいなー、いいなー、ボクも見たいな。<line-break>鳳凰探し、楽しそうだなぁー。<line-break>ねえねえ、<value:$28>～。<line-break>ボクも鳳凰探しに連れていってよ。<end>"
english = "Oh, that child saw a phoenix? Lucky! I want to see one too. Searching for a phoenix sounds like fun! Hey, <value:$28>―take me along on the phoenix hunt!<end>"

["1230086"]
japanese = "鳳凰が鳳凰山に降り立つということが<line-break>我が帝国に対して何を意味するのか、<line-break>そのことが気になる。<line-break>良い知らせであればいいが…。<end>"
english = "I wonder what a phoenix descending upon Phoenix Mountain would mean for our Empire. I hope it is a good omen...<end>"

["1230087"]
japanese = "その子の言うことによれば、<line-break>鳳凰山に本物の鳳凰が<line-break>降り立ったというのですね？<line-break><value:$28>様は<line-break>お優しいのですね。<end>"
english = "According to that child, a real phoenix descended upon Phoenix Mountain? You are very kind, <value:$28>.<end>"

["1230088"]
japanese = "鳳凰山の鳳凰、ヴィアも見てみたいな！<line-break>絶対ヴィアも連れてってよ、<line-break><value:$28>！<end>"
english = "Via wants to see the phoenix on Phoenix Mountain too! You have to take Via with you, <value:$28>!<end>"

["1230089"]
japanese = "鳳凰山の鳳凰じゃと？<line-break>ううむ、もしやそれが本物であれば<line-break>とてつもない瑞兆のはずなのじゃが…<line-break><value:$28>、頼む。<line-break>わしも連れて行ってくれい。<line-break>事実を見極めたいのじゃ。<end>"
english = "A phoenix on Phoenix Mountain? Hmm... If it is genuine, it should be an extraordinary omen of good fortune. Please, <value:$28>, take me with you. I wish to ascertain the truth.<end>"

["1230090"]
japanese = "鳳凰が降り立つという伝説は、<line-break>ウルカーンに古く伝えられている<line-break>ものらしい。<line-break>それが子供にまで受け継がれている。<line-break>私としては、どうか鳳凰に<line-break>実在してほしいと思うのだが…。<end>"
english = "The legend of a descending phoenix has apparently been passed down in Urkaan since ancient times. It has even survived among the children. For my part, I sincerely hope the phoenix truly exists...<end>"

["1230091"]
japanese = "俺はあの子の言葉を信じる。<line-break>お前も信じているんだろ、<line-break><value:$28>。<line-break>さあ鳳凰を探しに鳳凰山に行くぞ。<line-break>あの子を嘘つきにしないためにな。<end>"
english = "I believe that child. You do too, don't you, <value:$28>? Come, let's go to Phoenix Mountain and find the phoenix. We won't let that child be branded a liar.<end>"

["1230092"]
japanese = "<value:$28>は信じるのね。<line-break>鳳凰山に鳳凰がいるってあの子の言葉。<line-break>そうよね、あなたってそういう人よね。<line-break>それに付き合うあたしも、<line-break>そうとうお人好しなのかもね。<end>"
english = "You believe the child's claim that a phoenix is on Phoenix Mountain, don't you, <value:$28>? Of course you do. That's just the kind of person you are. And perhaps I'm quite the soft touch myself for going along with it.<end>"

["1230093"]
japanese = "………………。<end>"
english = "...........<end>"

["1230094"]
japanese = "優しいですね、<value:$28>さん。<line-break>あの子の依頼を引き受けるなんて。<line-break>信じているんですね、あの子の言葉を。<end>"
english = "You're very kind, <value:$28>, accepting that child's request. You believe what the child said, don't you?<end>"

["1230095"]
japanese = "………………。<end>"
english = "...........<end>"

["1230096"]
japanese = "（エステルに竜骨の砂漠で落とした<line-break>\u3000首飾りを探してくるよう<line-break>\u3000頼まれた）<line-break>（彼女に借りた水晶が導いてくれると<line-break>\u3000言うが本当だろうか…。彼女は、<line-break>\u3000リベルダムのギルドで待っている）<end>"
english = "(Esther asked you to find a necklace she lost in the Dragonbone Desert.) (She says the crystal she lent you will guide you, but can that really be true? She is waiting at the Guild in Liberdam.)<end>"

["1230097"]
japanese = "自分がなくした物を、<line-break>あなたに探しにいかせるなんて<line-break>エステルってどういう娘なの！<line-break>竜骨の砂漠は広いのよ。<line-break>彼女に借りた水晶の力で本当に<line-break>見つけられるのかしら？<end>"
english = "What kind of girl is Esther, sending you to find something she lost? The Dragonbone Desert is vast. Can the power of the crystal she lent you really lead us to it?<end>"

["1230098"]
japanese = "なくした首飾りと、<line-break>今、お主が持っておる水晶が<line-break>引き合うというのじゃな。<line-break>うむ、竜骨の砂漠に行ってみようぞ。<line-break>エステルとやらを信じてな。<end>"
english = "So the lost necklace and the crystal you now carry are drawn to one another. Very well, let us venture into the Dragonbone Desert and put our faith in this Esther.<end>"

["1230099"]
japanese = "竜骨の砂漠は広いですよ。<line-break>暑いし、迷うし、モンスターは出るし、<line-break>ぜんっぜんいいことないです。<line-break>しかも、ボランティアなんて…。<line-break><value:$28>様はやさしすぎます！<line-break>今後は、きっぱりと断ってくださいね。<end>"
english = "The Dragonbone Desert is huge. It's hot, you get lost, and there are monsters―there's nothing good about it! And you're doing this for free... You're far too kind, <value:$28>! From now on, you must refuse requests like this firmly.<end>"

["1230100"]
japanese = "あんなにでっかい竜骨の砂漠から<line-break>小さな首飾りを探すのかよ！<line-break>お前もお人好しだな…。<line-break>いくら、その水晶と引き合うったって<line-break>あてになんねえぜ。<line-break>うざい仕事だな。<end>"
english = "You're searching that enormous Dragonbone Desert for one tiny necklace? You're too nice for your own good... Even if the necklace and crystal attract each other, I wouldn't count on it. What an annoying job.<end>"

["1230101"]
japanese = "………………。<end>"
english = "...........<end>"

["1230102"]
japanese = "その水晶が首飾りと反応する？<line-break>それなら、エステル自らが<line-break>竜骨の砂漠へ行けばいいわ。<line-break>どうしてあなたが行く必要があるの？<end>"
english = "The crystal reacts to the necklace? Then Esther should go to the Dragonbone Desert herself. Why do you need to go?<end>"

["1230103"]
japanese = "…なるほど。<line-break>しかし、そんな便利な水晶があるなら<line-break>自分で行けばいいと思うのですがね。<line-break>きっと、何が何でも、<line-break><value:$28>に依頼したかった<line-break>ということなんでしょうね。ふふっ。<end>"
english = "...I see. Still, with such a convenient crystal, one would think she could go herself. I suppose she was determined to have <value:$28> do it, no matter what. Heh heh.<end>"

["1230104"]
japanese = "めんどくさそーだけど、ちょっと<line-break>ロマンチックなところが、<line-break>あんたの心を動かしたのね～。<line-break>わかるわ、その気持ち。<line-break>化け物退治ばっかりじゃなくって、<line-break>たまにはこういうのも楽しいわ。<end>"
english = "It sounds like a nuisance, but the touch of romance stirred your heart, didn't it? I understand. It might be fun to do something like this for once instead of always hunting monsters.<end>"

["1230105"]
japanese = "姉ちゃん本気かよ！<line-break>竜骨の砂漠の広さは知ってるだろ？<line-break>首飾りなんて見つかりっこないよ！<line-break>まったく姉ちゃんのお人好しも<line-break>相当なもんだけど、エステルってのも<line-break>あつかましいな。<end>"
english = "Are you serious, sis? You know how vast the Dragonbone Desert is! We'll never find a necklace in there! You're far too nice for your own good, but this Esther has some nerve too.<end>"

["1230106"]
japanese = "竜骨の砂漠で落とした首飾りを<line-break>探して来い？\u3000…そんな些細な<line-break>依頼まで引き受けるのね。<line-break>冒険者は何でも屋とは違うとは<line-break>思っていたけれど、<line-break>線引きは難しそうね。<end>"
english = "Find a necklace lost in the Dragonbone Desert? You even take on trivial errands like that. I thought adventurers were different from ordinary errand runners, but perhaps the line is difficult to draw.<end>"

["1230107"]
