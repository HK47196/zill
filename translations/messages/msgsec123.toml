english = "Azure Cave is north of Terane. Our opponent is probably powerful, so stay alert.<end>"

["1230060"]
japanese = "報酬が高ければ高いほど<line-break>危険なのよ、わかってるわよね？<line-break>気を引き締めてかかるのよ。<end>"
