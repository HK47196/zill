["2720001"]
japanese = "<value:$28>か…。<end>"
english = "<value:$28>...<end>"

["2720002"]
japanese = "ああ。天経院でのことか？<line-break>そうだな。仲間に加えてもらった以上<line-break>誤解されるのもイヤだしな。<line-break>俺はべつに悪いことをして<line-break>あのクリスタルに<line-break>封じこめられていたわけじゃない。<line-break>ちょっとした事情があったんだ。<line-break>イーシャと俺に関わることでな。<end>"
english = "Oh. You mean what happened at Tenkeiin? Fair enough. Now that you've taken me into your group, I don't want you getting the wrong idea. I wasn't sealed inside that crystal because I'd done something wrong. There were... circumstances. Something involving Iria and me.<end>"

["2720003"]
japanese = "不思議に思うかもしれんが、<line-break>俺とイーシャは同時に存在できない。<line-break>\u3000<line-break>イーシャがある事件に巻き込まれ、<line-break>自分のソウルを失ってしまったからだ。<end>"
english = "It may sound strange, but Iria and I can't exist at the same time. She was caught up in an incident and lost her Soul.<end>"

["2720004"]
japanese = "ああ。本来なら<line-break>ソウルを消された時点で<line-break>その人間はもうダメだ。<line-break>だが、なんだかんだあってな…。<line-break>俺は己がソウルを捨て、神器の力で、<line-break>イーシャを復活させたんだ。<line-break>そして俺はあのクリスタルの中に行き<line-break>イーシャは幸せに暮らす…。<line-break>それで何もかもうまくいくはずだった。<end>"
english = "Normally, once someone's Soul is erased, that's the end of it. But one thing led to another... I cast aside my own Soul and used the power of a divine artifact to bring Iria back. I would go into that crystal, and Iria would live a happy life. That was supposed to make everything right.<end>"

["2720005"]
japanese = "だけど、それを知ったイーシャは<line-break>俺が身代わりになっていることに<line-break>耐えきれず、<line-break>ジュサプブロスと取引をして、<line-break>自分がクリスタルに入ってしまった。<end>"
english = "But when Iria found out, she couldn't bear knowing I'd taken her place. She struck a bargain with Jusapubros and entered the crystal herself.<end>"

["2720006"]
japanese = "俺が出れば、あいつが消え、<line-break>あいつが出れば、俺が消える。<line-break>終わりのない堂々めぐりだな…。<end>"
english = "When I come out, she disappears. When she comes out, I disappear. We just keep going around in circles...<end>"

["2720007"]
japanese = "とにかく今、俺にできるのは<line-break>ジュサプブロスを捜しだし、<line-break>同化の髪飾りを取り返すことだけだ。<line-break>さしあたって<line-break>それ以外にイーシャを<line-break>もとに戻す方法もないんでな。<end>"
english = "For now, all I can do is find Jusapubros and recover the Hair Ornament of Assimilation. At present, there's no other way to restore Iria.<end>"

["2720008"]
japanese = "すまん。今日はもう疲れた。<line-break>先に休ませてもらう。<end>"
english = "Sorry. I'm tired tonight. I'm going to turn in.<end>"

["2720009"]
japanese = "<value:$28>か…。<end>"
english = "<value:$28>...<end>"

["2720010"]
japanese = "ああ。まだ起きていた。<line-break>イーシャのことが気になってな。<end>"
english = "Yeah, I was still awake. I was thinking about Iria.<end>"

["2720011"]
japanese = "クリスタルに入っている間、<line-break>俺はずっとイーシャのことを<line-break>想っていた。<line-break>あいつは今、誰を想い、<line-break>何を考えているんだろう？<end>"
english = "The whole time I was inside the crystal, I thought about Iria. I wonder who she's thinking of now, and what's on her mind.<end>"

["2720012"]
