["2720015"]
japanese = "だが、俺が考えているイーシャの幸せと<line-break>あいつが望んでいる本当の幸せは<line-break>もしかすると別なのかもしれない…。<line-break>今、ふと、そう考えていた。<end>"
english = "But perhaps what I think would make Iria happy isn't the happiness she truly wants... The thought just occurred to me.<end>"

["2720016"]
japanese = "そうだな。<line-break>まずはジュサプブロスから<line-break>同化の髪飾りを取り返さないと…。<line-break>今の俺にできるのは、<line-break>それだけだからな。<end>"
english = "You're right. First, I have to recover the Hair Ornament of Assimilation from Jusapubros. That's all I can do for now.<end>"

["2720017"]
japanese = "<value:$28>か…。<end>"
english = "<value:$28>...<end>"

["2720018"]
japanese = "ああ。夜空を眺めていた。<line-break>\u3000<line-break>\u3000<line-break>あのクリスタルに入る前は<line-break>星空がこれほど美しいと<line-break>感じることはなかった。<line-break>自分でも不思議なんだ。<line-break>今はなぜだか、素直に<line-break>感動することができる。<end>"
english = "Yeah. I was looking at the night sky. Before I entered that crystal, I'd never found the stars so beautiful. It's strange, even to me. For some reason, now I can simply let myself be moved by them.<end>"

["2720019"]
japanese = "俺はクリスタルから解放されて<line-break>今日まで、自分が生きているという<line-break>実感がなかった。<line-break>ただ、イーシャのために<line-break>かりそめの命を<line-break>もらっているだけだと…。<end>"
english = "Ever since I was freed from the crystal, I haven't truly felt alive. I thought this was only a temporary life I'd been given for Iria's sake...<end>"

["2720020"]
japanese = "俺とイーシャはテジャワの乱で出会い、<line-break>ときに味方として思いをぶつけ合い、<line-break>ときには敵として刃を交えた。<line-break>でも、最後は互いにわかり合えたと<line-break>信じていた。<line-break>\u3000<line-break>だからこそ俺はあいつに<line-break>幸せになってもらいたかった。<end>"
english = "I met Iria during the Tejava Incident. At times we stood together and laid our feelings bare; at others, we crossed blades as enemies. But in the end, I believed we'd come to understand each other. That was why I wanted her to find happiness.<end>"

["2720021"]
japanese = "俺は自分が犠牲になることで<line-break>イーシャを幸せにできると<line-break>考えていた。<line-break>それが…結果はどうだ。<line-break>\u3000<line-break>\u3000<line-break>イーシャは生きることを拒絶して<line-break>俺を復活させ、自分が<line-break>クリスタルに入ってしまった。<end>"
english = "I thought I could make Iria happy by sacrificing myself. And look how that turned out... Iria refused to go on living. She brought me back and entered the crystal herself.<end>"

["2720022"]
japanese = "教えてくれ、<value:$28>…。<line-break>俺は間違っていたのか？<line-break>\u3000<line-break>彼女にとって俺の行為は<line-break>重荷でしかなかったのか？<line-break>それとも俺の自己満足だったのか？<end>"
english = "Tell me, <value:$28>... Was I wrong? Were my actions nothing but a burden to her? Or did I only do it to satisfy myself?<end>"

["2720023"]
japanese = "わかっている。<line-break>俺は自分の選択に悔いている<line-break>わけじゃない。<line-break>ただ、イーシャが本当はどんな幸せを<line-break>望んでいたのか。<line-break>そんな疑問がたまに頭をよぎるんだ。<end>"
english = "I know. It's not that I regret my choice. I just sometimes find myself wondering what kind of happiness Iria truly wanted.<end>"

["2720024"]
japanese = "そうだな。<value:$28>。<line-break>俺の行動が正しかったかどうかは<line-break>俺自身にもわからない。<line-break>だけど、イーシャへの想いは真実だ。<line-break>それだけは胸を張って言える。<end>"
english = "You're right, <value:$28>. Even I don't know whether what I did was right. But my feelings for Iria are real. That much I can say with pride.<end>"

["2720025"]
japanese = "ありがとう。<value:$28>。<line-break>おかげで少し楽になった。<line-break>"
english = "Thank you, <value:$28>. I feel a little better now."

