english = "Why, <value:$28>...? Was I wrong? I believed there was only one right choice: if I sacrificed myself, Iria would be saved. But as I've traveled with you, I've begun to think that may not be the only answer. If so, where does my path lead from here...? What am I supposed to do? Tell me, <value:$28>.<end>"

["2720032"]
japanese = "そうだな。お前の言うとおり、<line-break>道はひとつだけじゃない。<line-break>\u3000<line-break>俺がまた犠牲となって<line-break>クリスタルに入っても<line-break>やはりイーシャは苦しむだろう。<line-break>そして、また同じ決断を<line-break>繰り返してしまうかもしれない。<line-break>\u3000<line-break>そんな虚しい堂々めぐりなんて<line-break>終わらせるべきなんだ。<end>"
english = "You're right. There isn't only one path. Even if I sacrificed myself again and returned to the crystal, Iria would still suffer. She might make the same choice all over again. This futile circle has to end.<end>"

["2720033"]
japanese = "ありがとう。<value:$28>。<line-break>\u3000<line-break>\u3000<line-break>俺自身が出さなければ<line-break>いけない答えなのに、<line-break>お前に甘えてしまった。<end>"
