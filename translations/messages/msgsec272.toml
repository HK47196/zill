english = "I was thinking about Lady Eris. I met her during the Tejava Uprising. She had such dignity, but she was kind as well. Iria loved her like an older sister. She saved my life, too. To be honest, perhaps I admired her a little. She was one of the reasons we fought in the uprising...<end>"

