english = "The Hair Ornament of Assimilation is a magical instrument belonging to Rahab, a Knight of the Dark Round Table. Rahab is known as the One Who Makes All One... The ornament was also at work behind the Tejava Uprising. Because of it, many people died, and one small child was left without a mother, without light, and without a future...<end>"

