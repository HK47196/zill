["2490006"]
japanese = "運命は<value:$28>の未来を<line-break>消そうとしているのではない。<line-break>\u3000<line-break>お前の内に眠る可能性が目覚め、<line-break>運命に打ち勝つことを待っているのだ。<end>"
english = "Fate is not trying to erase your future, <value:$28>. It is waiting for the potential dormant within you to awaken and overcome it.<end>"

["2490007"]
japanese = "お前が抱えている問題を私は知らない。<line-break>だが、これだけは言える。<line-break>\u3000<line-break>人は、<line-break>それぞれの運命を背負って生まれる。<line-break>そして、それを選ぶことはできない。<line-break>しかし、運命に流されることを拒否し、<line-break>どのように立ち向かうかを<line-break>決めることはできる。<line-break>運命に立ち向かった者すべてが<line-break>それを乗り越えられたわけでは<line-break>ないだろう。<line-break>だが、運命を乗り越えた者は、<line-break>立ち向かった者の中にしかいないのだ。<end>"
english = "I do not know what troubles you, but I can tell you this. We are each born bearing our own fate, and we cannot choose it. But we can refuse to be swept along by it and decide how we will face it. Not everyone who has stood against fate has overcome it. But no one has ever overcome fate without standing against it.<end>"

