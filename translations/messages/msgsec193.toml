["1930117"]
japanese = "<value:$28>が守ってくれるの？<line-break><line-break><line-break>…フフ、期待してるわ。<line-break>私もこの弓で、精一杯<line-break>バックアップさせてもらうから。<end>"
english = "You'll protect me, <value:$28>? Heh, I'm counting on you. I'll do everything I can to support you with this bow.<end>"

["1930118"]
japanese = "待たせたな、ふたりとも。<end>"
