japanese = "いずれ、みんな歌にするつもりだよ。<line-break>みんなの憎しみが、<line-break>時にいやされたころにね。<line-break>それまで、<line-break>キレイのかけらを求めて<line-break>旅をするつもり。<end>"
english = "Someday, once time has softened people's hatred, I'll turn each of them into a song. Until then, I'll keep traveling in search of fragments of beauty.<end>"

["1930094"]
japanese = "ぼくに一番キレイを見せてくれる<line-break><value:$28>と<line-break>一緒にね。<end>"
english = "Together with <value:$28>, who shows me more beauty than anyone.<end>"

["1930095"]
japanese = "来たか……。<end>"
english = "You've come...<end>"

["1930096"]
japanese = "決着をつけよう。<end>"
english = "Let us settle this.<end>"

["1930097"]
japanese = "そうですか、<line-break>この大陸を出ていくのですか。<end>"
english = "I see. So you're leaving the continent.<end>"

["1930098"]
japanese = "まぁ、それがいいかもしれませんね。<line-break>今のあなたの存在は、<line-break>あまりに巨大ですから。<line-break>ロストールとディンガルが<line-break>手を取り合って、バイアシオンは<line-break>ひとつになろうとしています。<end>"
english = "Well, perhaps that is for the best. You have become far too great a presence. Rostorl and Dyneskal are joining hands, and Baiashion is on the verge of becoming one.<end>"

["1930099"]
japanese = "あなたの存在は、<line-break>その流れをゆるがしかねない。<line-break>あなたの意志に関係なく、ね。<end>"
english = "Your presence could upset that course, whether you intend it or not.<end>"

["1930100"]
japanese = "人間は簡単に<line-break>他人を祭りあげたりするからな。<line-break>\u3000<line-break>これからの変革によって、<line-break>今まで持っていた力を<line-break>脅かされた連中が、<end>"
english = "Humans are quick to put others on a pedestal. The changes ahead will threaten the power some have long held.<end>"

["1930101"]
japanese = "<value:$28>の<line-break>名前を利用して反対勢力を作る<line-break>…あり得る話だ。<end>"
english = "Those people might use <value:$28>'s name to build an opposition movement.<end>"

["1930102"]
japanese = "そこまでいかないにしても、\u3000\u3000\u3000\u3000<line-break><value:$28>を冒険に出る前の<line-break><value:$28>として接してくれる<line-break>人は、もういないかもしれませんね。<line-break>ある意味、それが無限のソウルを<line-break>持ったことの代償かもしれません。<end>"
english = "Even if things never go that far, there may be no one left who can treat <value:$28> as <value:$28>, the person you were before setting out on your journey. In a sense, that may be the price of gaining the Infinite Soul.<end>"

["1930103"]
japanese = "それにしても、私たちの他にも\u3000<line-break>冒険で知り合った人たちが<line-break>いるでしょうに。<line-break>その人たちには何も告げずに<line-break>ひとりで行くなんて、<line-break>兄さんといい、あなたといい…。<end>"
english = "Still, you must have met others on your travels besides us. Leaving alone without a word to any of them... First my brother, and now you.<end>"

["1930104"]
japanese = "ケリュネイア、人はいろいろです。<line-break>それが、<value:$28>や<line-break>あの子なりの気の使い方なのですよ。<end>"
english = "Ceryneia, everyone is different. This is simply how <value:$28> and that child choose to show consideration.<end>"

["1930105"]
japanese = "わかってるわ、そんなこと。\u3000\u3000\u3000<line-break>でも、残される方にも、<line-break>それぞれの思いがある。<line-break><value:$28>なら、<line-break>わかってくれると思ったんだけど。<end>"
english = "I know that. But those left behind have feelings of their own. I thought <value:$28>, at least, would understand.<end>"

["1930106"]
japanese = "その辺にしておきなさい。<line-break><value:$28>だって<line-break>考えた上での選択でしょう。<end>"
english = "That will do. I'm sure <value:$28> thought carefully before making this choice.<end>"

["1930107"]
japanese = "それでは、そろそろ<line-break>あなたの望むところへ<line-break>お連れしましょう。<end>"
english = "Then it is time I took you where you wish to go.<end>"

["1930108"]
japanese = "さあ、どうぞ。<end>"
english = "Go on.<end>"

["1930109"]
japanese = "気をつけて、<value:$28>。<line-break>また、会える日まで。<end>"
english = "Take care, <value:$28>. Until we meet again.<end>"

["1930110"]
japanese = "<value:$28>！<end>"
english = "<value:$28>!<end>"

["1930111"]
japanese = "おや、もうひとりの連れの方が<line-break>来たみたいですね。<end>"
english = "Oh, it looks like your other companion is here.<end>"

["1930112"]
japanese = "久しぶりね、<value:$28>。<line-break>どう？\u3000しばらく会ってなかったけど<line-break>腕は上がった？<end>"
english = "It's been a while, <value:$28>. So, have you gotten any better since I last saw you?<end>"

["1930113"]
japanese = "フフ、期待してるわ。<line-break>これからはまた同じパーティーの<line-break>一員だもの。よろしくね。<end>"
english = "Heh, I'm counting on you. We're in the same party again, after all. It'll be good working with you.<end>"

["1930114"]
japanese = "まぁ、あなたがネメア様の足を<line-break>引っ張るなんてことは<line-break>ないでしょうけどね。<line-break>正直言って、私がふたりの邪魔に<line-break>ならないようにする方が<line-break>大変かもしれないし。<end>"
english = "Not that I expect you to hold Lord Nemea back. Honestly, I may have enough trouble just keeping out of the way of the two of you.<end>"

["1930115"]
japanese = "<value:$28>が守ってくれるの？<line-break>…それは仲間として？<line-break><line-break>それとも…<end>"
english = "You'll protect me, <value:$28>? As a comrade? Or...?<end>"

["1930116"]
japanese = "なんてね。冗談よ。<line-break>おくれをとらないように、<line-break>精一杯ついていくわ。<end>"
