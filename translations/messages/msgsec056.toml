["560894"]
japanese = "<if><value:$01><equal>4クリュセイスって、おバカさんかも！<line-break>考えてないで、謝ればよかったのに<line-break>死ぬまで、考えていたんだもん！<line-break><value:$28>も、考えないで<line-break>信じて、助けちゃえばよかったのに、<line-break>考えて死なせちゃった！\u3000きゃっ！<end><if><value:$01><equal>5自由都市リベルダムもこれで終わりか。<line-break>あっけないものだよな。<line-break>あんなに大きな街だったのによ。<line-break>…クリュセイス、ちょっと<line-break>かわいそうだったかもな。<line-break>どうして、見捨てたんだよ…。<end><if><value:$01><equal>6…こんなのって、ないよ。<line-break>ねぇ、<value:$28>。<line-break>どうしてこんなことになっちゃったの？<line-break>クリュセイス…いろいろあったけど、<line-break>やっぱり、かわいそうだった…。<line-break>最後の言葉、聞こえた？<end><if><value:$01><equal>11リベルダムが、崩壊してゆく…。<line-break>クリュセイスは、<line-break>生涯をこの町とともにしたのね…。<end><if><value:$01><equal>12…自分を責める必要はないさ。<line-break>ただ、無関係だと開き直ることも<line-break>いけねえ。<line-break>死んじまった人間はもう戻らない。<line-break>どうしようが、あるのは<line-break>たったひとつのその事実だけさ。<end><if><value:$01><equal>13…自分を殺そうとしていた女のために<line-break>お前は戦っていたというわけか。<line-break>フ、お前らしく間抜けな話だ。<line-break>これでお前の甘い考えが<line-break>治ればいいが…それにしても<line-break>街ひとつとは高い授業料だったな。<end><if><value:$01><equal>10自由都市リベルダムもこれで終わりか。<line-break>あっけないものなんだな。<line-break>あんなに大きな街だったのに。<line-break>…クリュセイス、<line-break>かわいそうだったよな。<end><if><value:$01><equal>14自由都市リベルダムも\u3000\u3000\u3000\u3000\u3000\u3000<line-break>これで終わりじゃな。<line-break>あっけないものじゃて。<line-break>アンティノは嫌らしい奴だったが、<line-break>あの嬢ちゃんはかわいそうな<line-break>ことじゃったな。<end><if><value:$01><equal>15あ、ねぇ、<value:$28>。<line-break>クリュセイスは、本当は<line-break>いい人だったんじゃ、ないかな。\u3000\u3000\u3000<line-break>自分の命がなくなっちゃうってときに\u3000<line-break>ごめんなさいって謝ってたもの。<line-break>きっと、前から謝りたかったんだよ…。<end><if><value:$01><equal>17はかない命の下等生物どもが作った街も<line-break>やっぱり、はかないわねー。もうパー？<line-break>８００年くらいしかもたないわけぇ？<line-break>人間が作って、戦争して、人間が壊す。<line-break>ずっとこの繰り返し。バカみたい！<line-break>ほーんと、よく飽きないわね～！<end><if><value:$01><equal>19…こんなのって、ないよぉ。<line-break>クリュセイス、かわいそうだよぉ。<line-break>最後の言葉、聞こえた？<line-break>ごめんなさいって言ってたよぉ。<line-break>ずっと前から<value:$28>に<line-break>謝ろうと思ってたんだと思うよ。<end><if><value:$01><equal>20………………。<end><if><value:$01><equal>24…<value:$28>様。<line-break>あなた様がご無事で、<line-break>ヴァイは何よりです。<line-break>ただ…。<end><if><value:$01><equal>25リベルダムが…燃えてく…。<line-break>一度壊れたものは、<line-break>もう二度と元には戻らないんだね…。<end><if><value:$01><equal>22自由都市リベルダム。<line-break>あんなにキレイだったのに…。<line-break>街の中はひどい有様だろうね。<line-break>…クリュセイス、<line-break>最後に、泣いてたね。<end><if><value:$01><equal>193リベルダムが…。<line-break>あんなに綺麗な街だったのに。<line-break>クリュセイスさん…。<line-break><value:$28>さん。<line-break>最後の言葉聞こえましたか？<line-break>ごめんなさいって言ってました。<end><if><value:$01><equal>191<value:$28>…。<line-break>つらくない？<line-break>大丈夫？<end><if><value:$01><equal>26リベルダムが、崩壊してゆく…。<line-break>クリュセイスは、<line-break>生涯をこの町とともにしたのか…。<end>"
english = "<if><value:$01><equal>4Maybe Khryuseis was a dummy! She could've just stopped thinking and apologized, but she kept thinking until she died! And <value:$28> could've stopped thinking, trusted her, and saved her, but you thought about it and let her die! Eek!<end><if><value:$01><equal>5So this is the end of the Free City Liberdam. Just like that. And it was such a huge city, too. Maybe I do feel a little sorry for Khryuseis. Why did you abandon her...?<end><if><value:$01><equal>6This can't be right. Hey, <value:$28>. How did it come to this? Khryuseis... after everything that happened, I still feel sorry for her. Did you hear her last words?<end><if><value:$01><equal>11Liberdam is collapsing... Khryuseis spent her whole life with this city.<end><if><value:$01><equal>12You don't need to blame yourself. But you can't just wash your hands of it, either. The dead aren't coming back. Whatever you do, that one fact remains.<end><if><value:$01><equal>13So you were fighting for a woman who had been trying to kill you. Hmph. Just the sort of foolishness I'd expect from you. Perhaps this will cure you of your naive way of thinking... Still, an entire city is a steep price for the lesson.<end><if><value:$01><equal>10So this is the end of the Free City Liberdam. Just like that. And it was such a huge city. I feel sorry for Khryuseis.<end><if><value:$01><equal>14So this is the end of the Free City Liberdam. Just like that. Antino was a vile fellow, but I do pity that young lady.<end><if><value:$01><equal>15Hey, <value:$28>. Do you think Khryuseis might really have been a good person? When she knew she was about to die, she said she was sorry. She must have wanted to apologize for a long time...<end><if><value:$01><equal>17Even a city built by short-lived, inferior creatures turns out to be short-lived. Gone already? It only lasted about eight hundred years? Humans build, humans wage war, humans destroy. Over and over again. How stupid! You'd think they'd get tired of it!<end><if><value:$01><equal>19This is awful. Poor Khryuseis. Did you hear her last words? She said she was sorry. I think she'd wanted to apologize to <value:$28> for a very long time.<end><if><value:$01><equal>20....................<end><if><value:$01><equal>24<value:$28>... Vai is simply relieved that you are safe. Only...<end><if><value:$01><equal>25Liberdam is burning... Once something is destroyed, it can never be restored to what it was...<end><if><value:$01><equal>22The Free City Liberdam. It was so beautiful... It must be terrible inside the city now. Khryuseis was crying at the end.<end><if><value:$01><equal>193Liberdam... It was such a beautiful city. Khryuseis... <value:$28>, did you hear her last words? She said she was sorry.<end><if><value:$01><equal>191<value:$28>... Does it hurt? Are you all right?<end><if><value:$01><equal>26Liberdam is collapsing... So Khryuseis spent her whole life with this city...<end>"

["560895"]
japanese = "<if><value:$01><equal>4<value:$28>も考えるバカだから、<line-break>燃える街見て、感傷に浸ってるわ。<line-break>なぐさめてあげたほうがいいかな…？<line-break>ほっとこうっと！<line-break>考えるバカにも、考えないバカにも<line-break>なに言っても、ムダだもん！<end><if><value:$01><equal>5最後の言葉、聞こえたか？<line-break>ごめんなさい…ずっとお前に<line-break>謝ろうと思ってたんだろうな。<line-break>結局、<line-break>俺たちが今まで戦ってきたのは<line-break>いったい、なんだったんだろうな…。<end><if><value:$01><equal>6ごめんなさい…<line-break>ずっと前から<value:$28>に<line-break>謝ろうと思ってたんだと思うよ。<line-break>おやじさんのロティが死んでから、<line-break>クリュセイスも必死だったんだ。<line-break>意地張って、弱みを見せまいと…。<end><if><value:$01><equal>11彼女は悲しんだかしら…？<line-break>もしかしたら…。<line-break><line-break>生まれ育った町と、自分の立場と…<line-break>それに一生をささげた彼女は、<line-break>私、とても立派だったと思うわ。<end><if><value:$01><equal>12もう行こう。<line-break>あんまりじっとにらんでても、<line-break>胸クソ悪くなるだけだぜ…。<end><if><value:$01><equal>13よく見ておくことだ。<line-break>この赤い空はお前の不覚が招いたのだ。<line-break>…気が済んだら、行くぞ。<end><if><value:$01><equal>10最後の言葉、聞こえた？<line-break>ごめんなさい…ずっと姉ちゃんに<line-break>謝ろうと思ってたんだろうな。<line-break>結局、俺たちがこれまで戦ってきたのは<line-break>いったい、なんだったんだろう…。<line-break>どうして、こうなっちまうんだろう？<end><if><value:$01><equal>14あの嬢ちゃんは、ずっとお前さんに<line-break>謝ろうと思って悩んでいたんじゃろう。<line-break>誰にも、言い出すこともできずにな。<line-break>結局、わしらがこれまで戦ってきたのは<line-break>いったい…<line-break>なんだったんじゃろうな…。<end><if><value:$01><equal>15自由都市リベルダムも、終わりだね。<line-break>これで、ひとつの街がなくなる。<line-break>あっけないものだね。<line-break>悲しいよね。<line-break>僕らはこんな結末を見るために<line-break>戦ってきたんじゃ、ないはずなのにね。<end><if><value:$01><equal>17ププ、ちょっとぉ、<value:$28>！<line-break>まさか、燃えてくだけの街を見て<line-break>感傷に浸ってるの？\u3000笑っちゃうわ！！<line-break>それより、こんな所、早く離れるのよ！<line-break>アタクシはおフロに入りたいのー！<line-break>煙と汗で気持ち悪くってよぉ！<end><if><value:$01><equal>19ずっと、ずっとなやんできたんだよ。<line-break>なやみを、誰にもうちあけられないで、<line-break>なやみを、ずっと、ひた隠しにして…<line-break>クリュセイス、つらかったと思うよ。<line-break>ルルアンタたちが、してきたことって<line-break>いったい、なんだったんだろうね…。<end><if><value:$01><equal>20…世は無常なり。<line-break>…ただ、それだけだ。<end><if><value:$01><equal>24…いえ、なんでもありません。<line-break>なんでも…。<line-break><line-break>………………。<end><if><value:$01><equal>25私たちは、生きてる。<line-break>生きてかなくちゃならないんだ。<line-break>クリュセイスのためにもね…。<end><if><value:$01><equal>22彼女、<line-break>ごめんなさいって、ずっと前から<line-break>言いたかったんだよ、きっと。<line-break>でも、最期に言えて、よかったよね。<line-break>ぼくさ、彼女が最後の最後に<line-break>キレイな笑顔で笑った気がするんだ。<end><if><value:$01><equal>26生まれ育った町と、自分の立場と…<line-break>それに一生をささげた…<line-break>立派だと思わんか？<end><if><value:$01><equal>193きっとクリュセイスさんも<line-break>悩んでいたんだと思います。<line-break>ずっと…。<line-break><value:$28>さんへの思いを<line-break>胸に抱えて、うちあけられずに<line-break>ずっと…。<end><if><value:$01><equal>191生き残っちゃったね…。<line-break><line-break><line-break>生き残っちゃうと<line-break>つらいことも、あるから…。<end>"
english = "<if><value:$01><equal>4<value:$28> is the kind of dummy who thinks, too, so now you're staring at the burning city and getting all sentimental. Maybe I should comfort you...? Nah! There's no point saying anything to dummies who think or dummies who don't!<end><if><value:$01><equal>5Did you hear her last words? She said she was sorry... She must've wanted to apologize to you for a long time. In the end, what were we even fighting for all this time...?<end><if><value:$01><equal>6She said she was sorry... I think she'd wanted to apologize to <value:$28> for a long time. After Lottie died, Khryuseis was desperate, too. She put up a brave front and refused to show any weakness...<end><if><value:$01><equal>11I wonder if she grieved... Perhaps she did. She devoted her entire life to the city where she was born and raised, and to her position... I think that was truly admirable.<end><if><value:$01><equal>12Let's go. Staring at it any longer will only make us sick...<end><if><value:$01><equal>13Look well. Your failure brought about this red sky. When you've had enough, we're leaving.<end><if><value:$01><equal>10Did you hear her last words? She said she was sorry... She must've wanted to apologize to you for a long time, sis. In the end, what were we even fighting for all this time...? Why does it have to end like this?<end><if><value:$01><equal>14That young lady must have agonized for a long time over wanting to apologize to you. She couldn't bring herself to tell anyone. In the end, what were we even fighting for all this time...?<end><if><value:$01><equal>15This is the end of the Free City Liberdam. A whole city is disappearing. Just like that. It's sad, isn't it? We weren't fighting to see an ending like this.<end><if><value:$01><equal>17Pfft! Oh, <value:$28>! Don't tell me you're getting sentimental over a city that's doing nothing but burn. How ridiculous! Never mind that. Let's get out of here! I want a bath! All this smoke and sweat feels disgusting!<end><if><value:$01><equal>19She worried for so, so long. She couldn't confide in anyone and kept it all hidden away... I think Khryuseis suffered terribly. What was everything Lulluantha and the others did even for...?<end><if><value:$01><equal>20All things are impermanent. That is all.<end><if><value:$01><equal>24No, it's nothing. Nothing... ....................<end><if><value:$01><equal>25We're alive. We have to keep living. For Khryuseis, too...<end><if><value:$01><equal>22I'm sure she'd wanted to say she was sorry for a long time. But at least she managed to say it at the end. You know, I think she smiled a beautiful smile at the very last moment.<end><if><value:$01><equal>26She devoted her life to the city where she was born and raised, and to her position... Don't you find that admirable?<end><if><value:$01><equal>193I'm sure Khryuseis had been troubled for a long time. She kept what she felt for <value:$28> in her heart, unable to speak of it... all that time.<end><if><value:$01><equal>191Still alive... Surviving can be painful, too...<end>"

