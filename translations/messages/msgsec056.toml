qual>191クリュセイス…<line-break>\u3000<line-break>\u3000<line-break>とりあえず逃げるわよ。<line-break>話はその後ね。<line-break>今は生きて脱出することだけ考えて。<end>…とにかく、今は<line-break>ここから出ることが先決だよ。<line-break>…行こう、<value:$28>。<end>"
english = "<if><value:$01><equal>4Eek! I seem to have wandered into a scene far too serious for me. Hee hee, what should I do...? Whatever happens, running away might be best! One thing's certain: if I stop to think, I've already lost! Come on, let's make our escape! Eek!<end><if><value:$01><equal>5We have to get away, fast. Let's clear out of this place! You can tell me about Khryuseis later, <value:$28>...<end><if><value:$01><equal>6Kh-Khryuseis... W-we have to get out of here now! Right, <value:$28>?<end><if><value:$01><equal>11Khryuseis... <value:$28>, we must withdraw.<end><if><value:$01><equal>12<value:$28>, you... Never mind. Right now, getting away comes first.<end><if><value:$01><equal>13Come. Our first priority is to get out of here.<end><if><value:$01><equal>10Sis... Why did you... Khryuseis... I mean, what about Khryuseis...? Never mind for now. You must have had your reasons. Let's just get out of here.<end><if><value:$01><equal>14<value:$28>! What in the world happened? Why did you not save this girl? No, this is no time to rebuke you. We must leave the city!<end><if><value:$01><equal>15<value:$28>, we have to get out of here now. All right? You can tell me about Khryuseis later. For now, let's go.<end><if><value:$01><equal>17What was all that? Another little farce among the lesser creatures? You are all beyond hope! I have had enough of this barbaric place! We're leaving at once! I've had enough! Enough! Enooough!<end><if><value:$01><equal>19<value:$28>! What happened to Khryuseis? Why didn't you save her? We have to get away for now! Come on, <value:$28>.<end><if><value:$01><equal>20We are leaving.<end><if><value:$01><equal>27<value:$28>... In any case, we must get out of here.<end><if><value:$01><equal>26What in the world happened? Why...? No, first we must leave the city!<end><if><value:$01><equal>193<value:$28>...! Wh-why did you let Khryuseis...?! Forgive me. I lost my composure. Escaping must come first now, mustn't it? W-we have to go...!<end><if><value:$01><equal>191Khryuseis... For now, we're getting out of here. We can talk afterward. Just concentrate on making it out alive.<end>Whatever happened, getting out of here must come first. Let's go, <value:$28>.<end>"

