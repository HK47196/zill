["110000"]
japanese = "<select><value:$33>お若いの…人はみな、必ず死ぬんじゃ。<line-break>その時、後悔せんでいいような<line-break>人生を送りなされ。<end>お若いの…人はみな、必ず死ぬんじゃ。<line-break>その時、後悔せんでいいような<line-break>人生を送りなされ。<end>強大な魔力を持った魔道王国ラドラスも<line-break>滅びの運命には逆らえなんだ。<line-break>勇者ネメアとて、やがては滅びる。<end>ロセンで処刑された王族の中には子供も<line-break>おったそうな。その子たちは人生の意味さえ<line-break>知らずに死んだのじゃろうな…。<end>ひとたび戦争となれば、畑は人馬に荒らされ<line-break>村は火をつけられる。戦争の目的がいかに<line-break>崇高であろうと許される行為ではない…。<end>リベルダムには行ってみたかね？<line-break>壊された建物の中には小さな幸福がたくさん<line-break>つまっていただろうに、むごいことよ…。<end>世の乱れは人の心の乱れだという。<line-break>これだけ乱れれば、人々も平穏を<line-break>望むじゃろう…。<end>世の乱れは人の心の乱れだという。<line-break>これだけ乱れれば、人々も平穏を<line-break>望むじゃろう…。<end>"
english = "<select><value:$33>Young one... everyone must die someday. Live so that when your time comes, you need not look back with regret.<end>Young one... everyone must die someday. Live so that when your time comes, you need not look back with regret.<end>Even the Magic Kingdom Ladras, for all its immense magical power, could not escape its destined destruction. In time, even Nemea the Hero will perish.<end>I hear there were children among the royals executed in Rocen. They must have died before they ever learned what life meant...<end>Once war begins, fields are trampled by soldiers and horses, and villages are put to the torch. However noble the cause, such deeds cannot be forgiven...<end>Have you been to Liberdam? Those ruined buildings must once have held so many little joys. How cruel...<end>They say disorder in the world reflects disorder in the human heart. With things this bad, surely people must long for peace...<end>They say disorder in the world reflects disorder in the human heart. With things this bad, surely people must long for peace...<end>"

["110001"]
japanese = "<if><value:$2C><less-equal>%9風の巫女エア様は、<line-break>天地千年を見通すことが<line-break>できる偉大なお方なのだ。<end><if><value:$2C><less-equal>%29エア様にわからぬことはない。<line-break>エア様の前で、くれぐれも隠し事など<line-break>してはいかんぞ。<end><if><value:$2C><less-equal>%49こうして他国の脅威におびえることなく<line-break>平和に暮らせるのもエア様のおかげだよ。<line-break>わしはいつも感謝しておるのだぞ。<end>君が強いのはよくわかる。<line-break>だからこそ勇み足でエア様を怒らせるような<line-break>ことだけはしないでくれよ。<end>"
english = "<if><value:$2C><less-equal>%9Lady Er, the Priestess of the Wind, is a great figure whose sight spans a thousand years of heaven and earth.<end><if><value:$2C><less-equal>%29Nothing escapes Lady Er. Whatever you do, keep no secrets from her.<end><if><value:$2C><less-equal>%49We owe it to Lady Er that we can live in peace, without fear of foreign threats. I give thanks for that every day.<end>I know how strong you are. All the more reason not to do anything rash and anger Lady Er.<end>"

["110002"]
japanese = "<select><value:$33>よそから来た人はエア様を<line-break>恐がるみたいだけど<line-break>とんでもない話だよ。<end>よそから来た人はエア様を<line-break>恐がるみたいだけど<line-break>とんでもない話だよ。<end>なかなかに手入れの行き届いた花壇だろ。<line-break>こうして花を愛でる余裕があるのが、<line-break>ここのいいところなんだよ。<end>この広場に描いてあるのは、<line-break>エア様と一緒にこの地を守ってくれる<line-break>翔王様のお姿なんだよ。<end>エア様はこの世のすべてを過去から未来まで<line-break>見通すことのできる偉大なお方なんだよ。<line-break>あのネメアだってエア様に会いに来たからね。<end>先祖が魔道王国ラドラスの民だから、エア様や<line-break>神官たちは魔法が得意なんだよ。あたしも<line-break>魔法で山のひとつでも吹き飛ばしてみたいねえ。<end>大陸のロストールやリベルダムは<line-break>大変なことになっているそうだね。<line-break>ここはこんなに平和なのにね。<end>大陸はもうすぐディンガル帝国に<line-break>統一されるって噂だよ。<line-break>そうすると次はここに攻め込むのかねえ…。<end>"
english = "<select><value:$33>People from elsewhere seem afraid of Lady Er, but that's utter nonsense.<end>People from elsewhere seem afraid of Lady Er, but that's utter nonsense.<end>The flower beds are well tended, aren't they? That's what makes this place so lovely: we have time to stop and admire the flowers.<end>The figure depicted here in the square is the Soaring King, who protects this land alongside Lady Er.<end>Lady Er is a great woman who can see everything in this world, from past to future. Even Nemea came to meet her, you know.<end>Lady Er and the priests are skilled in magic because their ancestors came from the Magic Kingdom Ladras. I'd like to try blowing away a mountain with magic myself.<end>I hear Rostorl and Liberdam over on the continent are in terrible trouble. Yet it's so peaceful here.<end>There's a rumor that the Dingal Empire will soon unite the continent. I wonder if they'll invade us next...<end>"

["110003"]
japanese = "<if><value:$2A><less-equal>%49自警団って危険な仕事が多そうだなあ…。<line-break>ボクは腕力に自信がないから<line-break>会計担当でいいよ。<end><if><value:$2A><less-equal>%100自警団っていっても、今までの仕事は<line-break>花壇を荒らしたピクシーをこらしめただけだよ。<line-break>平和すぎて仕事にならないよ～。<end><if><value:$2A><less-equal>%140自警団なんて言っているけど、団員は２人だよ。<line-break>強いモンスターが暴れたりしたらどうしよう…。<line-break><value:$28>のような人が団員ならな～。<end>大陸では戦争で家を焼かれたり家族を失ったり<line-break>した人が大勢いるのに、ここは本当に平和だね。<line-break>これもエア様のおかげなのかな。<end>"
english = "<if><value:$2A><less-equal>%49The town watch sounds like dangerous work... I'm not very strong, so I'll handle the accounts.<end><if><value:$2A><less-equal>%100We call ourselves a town watch, but all we've done so far is punish some Pixies for wrecking the flower beds. It's too peaceful to get any real work!<end><if><value:$2A><less-equal>%140We call ourselves a town watch, but there are only two of us. What if some powerful monster runs amok...? If only someone like <value:$28> would join.<end>So many people on the continent have had their homes burned or lost members of their families in the war, yet it's truly peaceful here. I wonder if we owe that to Lady Er too.<end>"

["110004"]
japanese = "<if><value:$2A><less-equal>%49アミラルじゃ自警団を組織して<line-break>町を守ってるんだってよ。<line-break>俺たちも海賊から町を守るために<line-break>組織したほうがいいかもな。<line-break>あんたは、どう思う？<end><if><value:$2A><less-equal>%100俺たちの町は、俺たちが守るっ！<line-break>う～ん、燃えるっ！\u3000燃えるぜぇ！<line-break>今日もやあぁぁぁあってやるぜっ！<end><if><value:$2A><less-equal>%140俺たち自警団のおかげで今日も平和だぜぇ！<line-break>エルズ自警団では団員を募集している。<line-break>君も我々と町の平和を守ろうじゃないかっ！<end>今日も空は晴れ渡り、心地よい風が吹く…。<line-break>この平和なひとときを自分たちが守っている<line-break>なんて…俺は今、最高に充実しているっ！<end>"
english = "<if><value:$2A><less-equal>%49I hear they've organized a town watch in Amiral. Maybe we should form one too, to defend our town from pirates. What do you think?<end><if><value:$2A><less-equal>%100Our town is ours to protect! Oh, I'm fired up! I'm really fired up! I'll give it everything I've got again today!<end><if><value:$2A><less-equal>%140Thanks to our town watch, peace reigns again today! The Elz Town Watch is recruiting. Join us and help defend the peace of our town!<end>The sky is clear again today, and a pleasant breeze is blowing... To think we're the ones protecting this peaceful moment... I've never felt more fulfilled!<end>"

["110005"]
japanese = "<select><value:$20>%4おっきくなったら船長になるんだ！<line-break>海の男だぞ。<end>海の男になるために、<line-break>足腰を鍛えるんだ！<line-break>がんばるぞ！<end>遅いぞ！<line-break>それじゃあ海の男になんて<line-break>なれないぞ。<end>今、特訓中なんだ。<line-break>邪魔しないでよ！<end>"
english = "<select><value:$20>%4When I grow up, I'm going to be a captain! A real man of the sea!<end>I've got to make my legs strong if I want to be a man of the sea! I'll work hard!<end>Too slow! You'll never become a man of the sea like that!<end>I'm training right now. Don't bother me!<end>"

["110006"]
japanese = "<select><value:$20>%4お兄ちゃん、<line-break>あたしも海の男になりたいよぉ。<end>お兄ちゃん、<line-break>走るの速すぎるよぉ～<line-break>あたしを何回も抜いちゃやだ～。<end>お兄ちゃん、<line-break>目が回るよぉ～<end>お兄ちゃん、<line-break>待ってぇ～、待ってよぉ～。<end>"
english = "<select><value:$20>%4Big brother, I want to be a man of the sea too!<end>Big brother, you run too fast! Stop lapping me over and over!<end>Big brother, I'm getting dizzy!<end>Big brother, wait! Wait for me!<end>"

["110007"]
japanese = "<select><value:$20>%4昔は海賊といえばワッシャー海賊だったのに、<line-break>最近は名を聞かなくなったなあ。<line-break><line-break>今でもフゴー商会の船だけを<line-break>襲っているのかな。<end>昔は海賊にも仁義があったものさ。<line-break>無抵抗の人間は殺さないし、モンスターに<line-break>襲われていたら助けてくれたしな。<end>今になって思えばワッシャー海賊は、\u3000\u3000\u3000\u3000<line-break>海賊というより海洋冒険者集団だったのかも<line-break>しれないな。<line-break>彼らがフゴー商会の船を襲うのは、フゴーが、<line-break>カンダカンの集めた宝を欲しがって嫌がらせを<line-break>したのが原因だというしな。<end>船旅で困るのは、モンスターに出会っても<line-break>逃げることができないってことだよな。<line-break>それさえなけりゃ快適なんだがな。<end>"
english = "<select><value:$20>%4Once, when people spoke of pirates, they meant the Washer Pirates. You hardly hear of them anymore. I wonder if they still attack only the Hugo Trading Company's ships.<end>Pirates used to have a code. They wouldn't kill anyone who didn't resist, and if monsters attacked you, they'd even come to your aid.<end>Looking back, perhaps the Washer Pirates were less pirates than a band of seafaring adventurers. They say they began attacking the Hugo Trading Company's ships because Hugo wanted the treasure Kandakan had gathered and started causing trouble over it.<end>The trouble with sea travel is that there's nowhere to run when you meet a monster. Without that, it'd be quite comfortable.<end>"

["110008"]
japanese = "<select><value:$20>%5エア様は、すべてを見通すことができる<line-break>魔法の水晶球を持ってらっしゃるのよ。<line-break>私も、子供たちの未来を知りたいわ。<end>ここはきれいなところでしょ。<line-break>こうやって子供たちが遊んでいる姿を見たり、<line-break>お花の手入れをしていると心がなごむの。<end>エア様は風の精霊神におつかえする<line-break>巫女でもあるのよ。<line-break>よい風が吹くのもエア様のおかげだわ。<end>エルズで悪いことをする人はいないわ。<line-break>だって、どんなに上手に隠してもエア様には<line-break>すべてお見通しなんですもの。<end>あなた、エア様に会いに来たのかしら？<line-break>エア様のいらっしゃる風の神殿へ続く道には<line-break>モンスターがいるから気をつけるのよ。<end>"
english = "<select><value:$20>%5Lady Er has a magic crystal ball that lets her see everything. I wish I could know the children's future too.<end>It's beautiful here, isn't it? Watching the children play and tending the flowers always puts me at ease.<end>Lady Er is also a priestess who serves the Wind Spirit God. We owe these pleasant winds to her as well.<end>No one does wrong in Elz. However cleverly it may be hidden, Lady Er sees everything.<end>Have you come to see Lady Er? There are monsters on the road to the Wind Temple where she is, so be careful.<end>"

["110009"]
japanese = "<select><value:$20>%5わしらドワーフは泳げんから<line-break>海を越えるのには勇気がいるんじゃぞ。<line-break>海に落ちたら最後、おぼれ死ぬからのう。<end>分断の山脈の地下にあるわしらの国に<line-break>行ったことはあるかの？<line-break>ひんやりとしてよい所じゃぞ。<line-break>ここは少し暑すぎるわい。<line-break>日陰はどこじゃ～。<end>船の上では、ず～っと柱にしがみついて<line-break>水平線を見ておったのじゃ。波間を見ておると<line-break>吸い込まれそうになってしまうからのう。<end>船旅は恐かったが、よい土産話ができたわい。<line-break>じゃが帰りも海を越えねばいかんと思うと<line-break>なかなか帰る決心がつかんでのう…。<end>ここにはエアという何でもご存知の<line-break>人間がおるそうじゃぞ。<line-break>わしも会いに行ってみようかのう。<end>"
english = "<select><value:$20>%5We Dwarves can't swim, so it takes courage for us to cross the sea. If we fall overboard, that's the end of us. We drown.<end>Have you ever visited our country beneath the Dividing Mountains? It's cool and pleasant there. This place is far too hot. Where's the shade?<end>On the ship, I clung to a post the whole time and stared at the horizon. Looking into the waves made me feel as though they'd pull me in.<end>The voyage frightened me, but at least it gave me a fine tale to tell. Still, knowing I must cross the sea again on the way home makes it very hard to leave...<end>I hear a human called Er lives here and knows everything. Perhaps I'll go and meet this Er.<end>"

["110010"]
japanese = "<select><value:$20>%4今日もよい風が吹いてるわ。<line-break>風はいろんなものを運んでくるの。<line-break>あなたも風と来たのよね？<end>見て、見て！<line-break>きれいな花が咲いているでしょ。<line-break>この花の種も風が運んでくれたのよ。<end>１日１日がとーっても幸せ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>今日はどんな花が咲くのかな？<line-break>今日はどんな人に会えるかな？<line-break>今日はどんな風が吹くのかな？<line-break>…なんて考えると楽しみでしょうがないの。<end>風の巫女エア様は墓地の奥にある<line-break>風の神殿にいらっしゃるのよ。<line-break>エルズが平和なのもエア様のおかげね。<end>"
english = "<select><value:$20>%4There's a lovely breeze again today. The wind carries all sorts of things. It brought you here too, didn't it?<end>Look, look! Isn't that flower pretty? The wind brought its seed here too.<end>Every single day makes me so happy. What flowers will bloom today? Who will I meet? What kind of wind will blow? Just thinking about it fills me with excitement.<end>Lady Er, the Priestess of the Wind, lives in the Wind Temple beyond the cemetery. Elz owes its peace to her.<end>"

["110011"]
japanese = "<if><value:$2A><less-equal>%49ここの人間はエアにずいぶんと従順なんだな。<line-break>もっとも何でもお見通しの水晶球を持たれては、<line-break>逆らいようもないのだろうがな。<end><if><value:$2A><less-equal>%120ここではエアの命令は絶対らしいな。<line-break>エアが殺せと命令すれば、それが子供でも<line-break>従わなければならないそうだ。<end>支配者にすべてを知られている暮らしなんて<line-break>俺にはがまんできないが、ここの人間は<line-break>毎日が楽しそうだよな。やはり慣れなのかな？<end>"
english = "<if><value:$2A><less-equal>%49The people here are remarkably obedient to Er. Then again, with that crystal ball seeing everything, I suppose there's no way to defy her.<end><if><value:$2A><less-equal>%120Er's word is apparently absolute here. If she ordered someone killed, even a child, people would have no choice but to obey.<end>I couldn't bear to live with a ruler who knew everything about me, but the people here seem happy enough every day. Perhaps they've simply grown used to it.<end>"

["110012"]
japanese = "<select><value:$20>%4ぼくたちリルビーは、<line-break>楽しいことが大好きなのさ。<line-break>ランラランララーン。<end>ぼくたちリルビー丈夫な体。<line-break>毒針、マヒガス何のその、<line-break>きかないよったらきかないよ～ん。<end>ぐるぐるぐるぐるぐる…<line-break>ベッドは大きいな～。<line-break>もう、大陸１周くらい歩いたかな？<end>宿屋のおじさんもかわいがってくれるし、<line-break>ずーっと、ここで回っていようかな。<end>"
english = "<select><value:$20>%4We Lilbies love anything fun! La-la, la-la-la!<end>We Lilbies are sturdy folk! Poison needles, paralysis gas―none of it works, no, none of it at all!<end>Round and round and round and round... This bed is huge! Have I walked all the way around the continent yet?<end>The innkeeper is fond of me too. Maybe I'll just keep circling here forever.<end>"

["110013"]
japanese = "<select><value:$33>ふぇー、疲れた疲れた。<line-break>船員もけっこうつらいなあ。<end>ふぇー、疲れた疲れた。<line-break>船員もけっこうつらいなあ。<end>休暇中はいつもここでゴロゴロしてるんだ。<line-break>航海中は、波にゆられて熟睡できないからね。<end>ロセンの港が使えるようになったから、<line-break>ますます仕事が増えて困っちゃうよ。<end>頼むよ～寝かせてくれよ～。<line-break>ぼくの貴重なゴロゴロ時間なんだから～。<line-break>数少ない休みは貴重なんだからさ～。<end>困っちゃったな。<line-break>リベルダムで休めないと、エンシャントや<line-break>ロセンまでずーっと海の上なんだよ。<end>ここは平和でいいな～。<line-break>君も知っていると思うけど<line-break>大陸は戦乱のまっただ中で大変だよ。<end>ロストールもディンガルも混乱していて、<line-break>うちの船はしばらく暇みたいだよ。<line-break>ゆっくり休めるけど、何か物足りないな。<end>"
english = "<select><value:$33>Whew, I'm exhausted. Being a sailor is pretty hard.<end>Whew, I'm exhausted. Being a sailor is pretty hard.<end>Whenever I'm on leave, I lie around here doing nothing. I can't sleep soundly at sea with the waves rocking the ship.<end>Now that Rocen's port is open again, I've got even more work to do. What a nuisance.<end>Please, just let me sleep. This is precious lounging time! I get so few days off; I can't waste them.<end>This is a problem. If we can't stop in Liberdam, we'll be at sea all the way to Ancient or Rocen.<end>It's nice and peaceful here. As you probably know, the continent's in terrible shape, right in the midst of war.<end>Rostorl and Dingal are both in turmoil, so our ship won't have much to do for a while. I can get plenty of rest, but somehow it feels like something's missing.<end>"

["110014"]
japanese = "<select><value:$20>%4欲しい物は、たくさんあるのに<line-break>金はなし。どれを買えばお得なのか…。<end>戦闘のことを考えると元気の薬と心の水は<line-break>必要だろうな…う～ん、迷っちゃう。<end>ブロークラストも捨てがたいな…<line-break>午睡の羽もけっこう役に立つし。<end>いざ！\u3000というときのために<line-break>恵みの風は買っておくべきかも<line-break>しれないな。でも…う～ん迷うよ。<end>"
english = "<select><value:$20>%4So many things I want, and no money to buy them. Which one would give me the best value...?<end>If I'm preparing for battle, I'll need some Vitality Medicine and Water of Mind... Hmm, I can't decide.<end>Blowcrust is tempting too... and a Siesta Feather can be quite useful.<end>Maybe I should buy a Blessing Wind for an emergency. But... hmm, I just can't decide.<end>"

["110015"]
japanese = "<if><value:$2C><less-equal>%9魔法とは精霊の力を操ること。<line-break>精霊力レベルが低いと強力な魔法は使えぬぞ。<end><if><value:$2C><less-equal>%29この地は風の属性に包まれておる。<line-break>土属性の攻撃が有効じゃぞ。<end><if><value:$2C><less-equal>%49疾風の魔弓という武器が、この地に眠っておる。<line-break>疾風が突き抜けるように敵を刺し貫く<line-break>伝説の弓なのじゃ。<end>究極の風属性魔法が、この地に眠っておる。<line-break>そのカギは風の精霊神にあると思うのじゃが<line-break>エアが恐ろしうて調べられんのじゃ。<end>"
english = "<if><value:$2C><less-equal>%9Magic is the art of controlling the power of spirits. If your spirit-power level is low, you cannot use powerful magic.<end><if><value:$2C><less-equal>%29This land is wreathed in the Wind element. Earth-element attacks will serve you well.<end><if><value:$2C><less-equal>%49A weapon called the Magic Bow of the Gale lies hidden in this land. It is a legendary bow that pierces enemies with the force of a driving gale.<end>The ultimate Wind-element magic lies hidden in this land. I believe the Wind Spirit God holds the key, but Er frightens me too much to investigate.<end>"

["110016"]
japanese = "<if><value:$2A><less-equal>%49魔法を極めたいなら<line-break>ディンガルの魔道アカデミーがいいわよ。<line-break>あそこの卒業生は優秀なんだから。<end><if><value:$2A><less-equal>%100武器や防具の属性を無属性にするには<line-break>神官様にお願いするのが一番よ。<line-break>よく忘れるから覚えときなさい。<end><if><value:$2A><less-equal>%150装備品を持てる数は決まってるのよ。<line-break>そろそろいらないものは捨てちゃいなさい。<end>あなた、<value:$28>でしょ。<line-break>世界一の冒険者に、あたしが教えられること<line-break>なんてないわよ。からかわないでよね。<end>"
english = "<if><value:$2A><less-equal>%49If you want to master magic, try the Academy of Magic in Dingal. Its graduates are excellent.<end><if><value:$2A><less-equal>%100The best way to make a weapon or piece of armor non-elemental is to ask a priest. You keep forgetting, so remember that.<end><if><value:$2A><less-equal>%150There's a limit to how much equipment you can carry. It's about time you threw out anything you don't need.<end>You're <value:$28>, aren't you? I couldn't possibly teach the world's greatest adventurer anything. Don't tease me.<end>"

["110017"]
japanese = "<if><value:$2C><less-equal>%9ラミリー山には行かない方がいい。<line-break>あんたじゃ弱すぎて、<line-break>死にに行くようなもんだ。<end><if><value:$2C><less-equal>%29よし！\u3000合格だ。<line-break>今の強さならラミリー山へ行っても大丈夫だな。<line-break>回復アイテムは多めに持っていけよ。<end><if><value:$2C><less-equal>%49ラミリー山は風の精霊神の座所に通じる山さ。<line-break>だけど座所へ行くには風の神殿を通る必要が<line-break>あるってのが問題なんだ。<end>風の神殿を通るにはエアの許可がいるだろ。<line-break>とうてい俺には無理だが、あんたなら<line-break>なんとかなるんじゃないかい？<end>"
english = "<if><value:$2C><less-equal>%9You'd better stay away from Mount Ramiri. You're far too weak; going there would be suicide.<end><if><value:$2C><less-equal>%29Good! You pass. You're strong enough for Mount Ramiri now. Take plenty of healing items with you.<end><if><value:$2C><less-equal>%49Mount Ramiri leads to the seat of the Wind Spirit God. The trouble is, you have to pass through the Wind Temple to reach it.<end>You need Er's permission to pass through the Wind Temple. I could never get it, but perhaps you can manage somehow.<end>"

["110018"]
japanese = "<select><value:$20>%4２階へは行かせぬぞえ。<line-break>この婆から、何もかも<line-break>持っていくつもりかえ。<end>年寄りじゃからといって、<line-break>バカにしておるのかえ。<line-break>この極道冒険者め！<end>勝手に人の家に入り込んで、<line-break>荒らしまわるなぞ不作法はなはだしいぞえ！<line-break>冒険者といえど、モラルを持ちなされ。<end>階段の先には何もないぞえ。<line-break>年寄りの言うことは聞くものじゃ。<end>"
english = "<select><value:$20>%4I won't let you go upstairs. Do you mean to take everything this old woman has?<end>Do you think you can make a fool of me because I'm old? You shameless adventurer!<end>Entering someone's home uninvited and rummaging through it is the height of bad manners! Adventurers ought to have some morals too.<end>There's nothing beyond those stairs. You should listen to your elders.<end>"

["110019"]
japanese = "<select><value:$33>ラミリー山には竜がおる。<line-break>翔王がのう…。<end>風の神殿には竜がおる。<line-break>翔王がのう…。<end>翔王はエルズの守護神じゃ。<line-break>エア様と翔王に守られたエルズは<line-break>無敵なのじゃ。<end>婆さんも言っておるじゃろう。<line-break>２階には何もないんじゃ。<line-break>早う出ていきなされ。<end>あんたの役に立つような話はない。<line-break>わしらの平穏な暮らしを壊さんでくれ。<line-break>早う出ていきなされ。<end>なん度来ても無駄じゃ。<line-break>２階へは絶対に行かせぬぞ。<line-break>早う出ていきなされ。<end>あんたも本当にしつこいのう。<line-break>２階には本当に何もないのじゃぞ。<line-break>どうして信じてくれぬのか。<end>いつかは２階へ上がれると思うとるじゃろ？<line-break>甘いわっ！\u3000どんなに待っても無理じゃぞ。<line-break>何もないんじゃからな。<end>"
english = "<select><value:$33>There is a dragon on Mount Ramiri. The Soaring King...<end>There is a dragon in the Wind Temple. The Soaring King...<end>The Soaring King is Elz's guardian deity. Protected by Lady Er and the Soaring King, Elz is invincible.<end>The old woman told you, didn't she? There's nothing upstairs. Now leave at once.<end>I have nothing useful to tell you. Please don't disturb our peaceful lives. Now leave at once.<end>It doesn't matter how many times you come back. I will never let you upstairs. Now leave at once.<end>You truly are persistent. There really is nothing upstairs. Why won't you believe me?<end>You think you'll get upstairs eventually, don't you? Not a chance! No matter how long you wait, it won't happen. There's nothing there.<end>"

["110020"]
japanese = "<select><value:$33>ここのところワッシャー海賊もおとなしくてね、<line-break>フゴー商会で働いている人間としては<line-break>助かっているよ。<end>ここのところワッシャー海賊もおとなしくてね、<line-break>フゴー商会で働いている人間としては<line-break>助かっているよ。<end>海賊はおとなしくなったけど、<line-break>かわりにモンスターが暴れるようになってね。<line-break>話が通じないだけに苦労しているよ。<end>君はロセンに行ってみたかな。<line-break>港が解放されたので、船に乗れば<line-break>８日で行けるよ。<end>ディンガルのネメアは本気で世界統一を<line-break>考えているようだね。<line-break>実現するかどうかは、ロストール次第だろうね。<end>せっかくロセンの港が使えるようになったと<line-break>思ったら、よりによってリベルダムが<line-break>破壊されるとは…。どうしたものかな。<end>フゴー商会本部もロセンに移転して、<line-break>これからはロセンを中心に仕事を進める<line-break>ことになったよ。<end>リベルダムが使えなくなって、ロストールへ<line-break>送る物資の流れが悪くなっていてね、<line-break>なんとかしたいのだけども…。<end>"
english = "<select><value:$33>The Washer Pirates have been quiet lately, which is a relief for those of us who work for the Hugo Trading Company.<end>The Washer Pirates have been quiet lately, which is a relief for those of us who work for the Hugo Trading Company.<end>The pirates have quieted down, but now the monsters are running wild instead. It's harder when you can't reason with them.<end>Have you visited Rocen? The port is open again, so you can reach it by ship in eight days.<end>Nemea of Dingal seems serious about uniting the world. Whether that happens will probably depend on Rostorl.<end>Just when Rocen's port finally became available, Liberdam had to be destroyed... What are we to do?<end>The Hugo Trading Company has moved its headquarters to Rocen. From now on, our business will be centered there.<end>With Liberdam out of use, the flow of supplies to Rostorl has slowed. I'd like to do something about it, but...<end>"

["110021"]
japanese = "<select><value:$33>エルズはいいところよ。<line-break>ロストールみたいに<line-break>ゴミゴミしてないしね。<end>エルズはいいところよ。<line-break>ロストールみたいに<line-break>ゴミゴミしてないしね。<end>エルズは年中暖かいし、花は美しいし、<line-break>住むには本当にいいところよ。<end>娯楽施設はなくても、美しい海があるわ。<line-break>泳ぎ疲れたら浜辺で一休みして、<line-break>おいしい果物を食べるの。<end>ロストールには貴族制度があるし、<line-break>リベルダムでは市民登録しないとスラム<line-break>行きだし、エルズにいるのが一番よ。<end>やっぱり都会よりここが一番よ。<line-break>エア様と翔王のおかげで他国も<line-break>そう簡単には攻めてこれないんだから。<end>うちの子も、やっとここのよさが<line-break>わかったみたいね。<line-break>まっ、あたしも昔は都会に憧れたものだけど。<end>うちの子も、やっとここのよさが<line-break>わかったみたいね。<line-break>まっ、あたしも昔は都会に憧れたものだけど。<end>"
english = "<select><value:$33>Elz is a lovely place. It isn't crowded and cluttered like Rostorl.<end>Elz is a lovely place. It isn't crowded and cluttered like Rostorl.<end>Elz is warm all year, and the flowers are beautiful. It's a wonderful place to live.<end>We may not have any places of amusement, but we have a beautiful sea. When you're tired from swimming, you can rest on the beach and eat delicious fruit.<end>Rostorl has its aristocratic system, and in Liberdam, anyone without citizen registration gets sent to the Slums. Elz is the best place to be.<end>This really is better than any city. Thanks to Lady Er and the Soaring King, other nations can't invade us so easily.<end>My child finally seems to understand what makes this place so special. Though I dreamed of city life when I was young too.<end>My child finally seems to understand what makes this place so special. Though I dreamed of city life when I was young too.<end>"

["110022"]
japanese = "<select><value:$33>ロストールやリベルダムみたいな都会へ<line-break>行ってみたいなあ。<end>ロストールやリベルダムみたいな都会へ<line-break>行ってみたいなあ。<end>リベルダムには大きな時計塔があるのよね。<line-break>行ってみたいなあ。<end>リベルダムには闘技場があるのよね。<line-break>エルズには、そんな娯楽施設なんてないのよ。<line-break>リベルダムに行きたいなあ。<end>こんな何もない町を出て、都会に住みたいなあ。<line-break>いっそのこと冒険者にでもなっちゃおっか？<end>リベルダム…壊れちゃったね。<line-break>やっぱり都会は恐いところなのかも。<end>あたし、やっぱりエルズでいいわ。<line-break>安心して毎日暮らしていけるのが一番だもの。<end>あたし、やっぱりエルズでいいわ。<line-break>安心して毎日暮らしていけるのが一番だもの。<end>"
english = "<select><value:$33>I'd love to visit a great city like Rostorl or Liberdam.<end>I'd love to visit a great city like Rostorl or Liberdam.<end>Liberdam has a huge clock tower, doesn't it? I'd love to see it.<end>Liberdam has an arena, doesn't it? Elz doesn't have anything like that for entertainment. I wish I could go to Liberdam.<end>I want to leave this town where there's nothing to do and live in a city. Maybe I should just become an adventurer.<end>Liberdam... was destroyed. Maybe cities really are frightening places.<end>I think I'll stay in Elz after all. Being able to live each day without fear matters most.<end>I think I'll stay in Elz after all. Being able to live each day without fear matters most.<end>"

["110023"]
japanese = "２階のボクと姉ちゃんの部屋には<line-break>行かせないぞ。<end>"
english = "I won't let you into the room my big sister and I share upstairs.<end>"

["110024"]
japanese = "<select><value:$20>%4働くぞ！\u3000俺は働くぞ！<line-break>この体が壊れるまで！<end>ボルダンは戦いに生きる者…<line-break>俺の相手はこの荷物なのだ！<end>荷物運びは俺たちの仕事だ。<line-break>人間に任せておくと時間がかかって<line-break>しょうがない。<end>じゃまじゃま、どいてくれ！<end>"
english = "<select><value:$20>%4I'll work! I'll work until this body breaks!<end>A Boldan lives for battle... and this cargo is my foe!<end>Hauling cargo is our work. Leaving it to humans takes far too long.<end>Out of the way! Move!<end>"

["110025"]
japanese = "<select><value:$20>%4力仕事には自信があるが、<line-break>頭脳労働は苦手だな。<end>航海のことはわからん。<line-break>難しいことは人間に任せて<line-break>荷物運びに励むのがいいのだ。<end>俺もがんばっているが、<line-break>あいつはもっとがんばっている。<line-break>負けるわけにはいかんのだ！<end>なんだ？\u3000難しい話が聞きたいなら<line-break>他の奴に聞いてくれ。<end>"
english = "<select><value:$20>%4I'm confident in my strength, but thinking isn't my strong suit.<end>I know nothing about sailing. Better to leave difficult matters to the humans and devote myself to hauling cargo.<end>I work hard, but someone else works even harder. I refuse to be beaten!<end>What? If you want to hear something complicated, ask someone else.<end>"

["110026"]
japanese = "<select><value:$33>給料も出たことだし、<line-break>今度アミラルによったら<line-break>家族にお土産を買ってかえります。<end>給料も出たことだし、<line-break>今度アミラルに寄ったら<line-break>家族にお土産を買って帰ります。<end>マストの上の見張り台から見える景色は<line-break>とてもステキなんです。<line-break>船員をやっててよかったです。<end>初めてロセンに行ったのですが、<line-break>暗い感じのするところでした。<line-break>あまり行きたくないですね。<end>この前はロセンの悪口を言ってしまいましたが、<line-break>撤回します。ロセンはすごく立派になってます。<line-break>広場のカルラ像には失笑しましたが…。<end>ど～しましょうか！<line-break>リベルダムが壊れちゃったんですよ！<line-break>これは大変なことじゃないですか！<end>中立のリベルダムがなくなって、<line-break>船長は仕事がやりづらくなったって<line-break>ぼやいてました。そんなものなんですかね。<end>しっかり働いたおかげで、見習いから<line-break>正式な船員に昇格することになりました。<line-break>さっそく家族に報告します。<end>"
english = "<select><value:$33>Now that I've been paid, I'll buy souvenirs for my family the next time we stop in Amiral.<end>Now that I've been paid, I'll buy souvenirs for my family the next time we stop in Amiral.<end>The view from the lookout atop the mast is wonderful. I'm so glad I became a sailor.<end>I visited Rocen for the first time, but it felt like a gloomy place. I don't particularly want to go back.<end>I spoke badly of Rocen before, but I take it back. It's become quite splendid. Though I couldn't help laughing at the statue of Karula in the square...<end>What are we going to do? Liberdam has been destroyed! Isn't that a terrible disaster?<end>The captain was complaining that business has become harder now that neutral Liberdam is gone. Is that how it works?<end>All my hard work has paid off: I'm being promoted from apprentice to full sailor. I'll tell my family right away.<end>"

["110027"]
japanese = "<if><value:$2C><less-equal>%9海王って知ってるか？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>俺は見たんだよ。<line-break><line-break>巨大な影が船の下を<line-break>通り過ぎていったのを…。<line-break>ありゃあ、絶対に海王にちがいない。<end><if><value:$2C><less-equal>%29海王は海の守り神みたいなものでな、<line-break>アミラルの広場には像もある。<line-break>見たことあるだろ？<end><if><value:$2C><less-equal>%49竜王、海王、翔王ってのが<line-break>いわゆる世界三大ドラゴンだな。<line-break>で、俺は幸運にも海王に会ったってわけだ。<end><value:$28>って言ったら<line-break>大陸最強の冒険者じゃないか。<line-break>あんたならドラゴンも倒せるかもな。<end>"
english = "<if><value:$2C><less-equal>%9Have you heard of the Sea King? I saw it. A gigantic shadow passed beneath the ship... It had to be the Sea King.<end><if><value:$2C><less-equal>%29The Sea King is something like a guardian deity of the sea. There's even a statue of it in Amiral's square. You've seen it, haven't you?<end><if><value:$2C><less-equal>%49The Dragon King, Sea King, and Soaring King are the so-called Three Great Dragons of the World. And I was lucky enough to encounter the Sea King.<end><value:$28>? You're the strongest adventurer on the continent! You might even be able to defeat a dragon.<end>"

["110028"]
japanese = "<select><value:$20>%3主人の仕事がうまくいったら<line-break>お手伝いさんを雇って楽をしたいわ。<line-break>毎日忙しくて忙しくて…。<end>家事が一段落ついたら、<line-break>主人の仕事を手伝わないといけないわ。<line-break>ほんとに忙しいわね。 <end>私の夢は、我が社を世界一の貿易会社に<line-break>することなのよ。そのためには<line-break>このくらいの苦労なんてへっちゃらよ。<end>"
english = "<select><value:$20>%3If my husband's business succeeds, I'd like to hire a maid and take things a little easier. Every day is so terribly busy...<end>Once the housework is done, I have to help with my husband's business. I really am busy.<end>My dream is to make our company the greatest trading company in the world. A little hardship like this is nothing if it helps me get there.<end>"

["110029"]
japanese = "<select><value:$33>今、忙しいところなのだ。<line-break>ちょっと邪魔をしないでくれ。<end>今、忙しいところなのだ。<line-break>ちょっと邪魔をしないでくれ。<end>アミラルへの荷は<line-break>果物を中心にするか…。<line-break>帰りの船には錬剛石を積むかな。<end>ロセンへの航路が復活したか！<line-break>さっそくロセン行きの船を確保しなければ…。<end>ロセンは復興のために<line-break>大量の建築資材を必要としている…。<line-break>ふふふふ…これはチャンスだな。<end>リベルダムが使えなくなると<line-break>ロセン航路の補給ができなくなるぞ。<line-break>これは大きな誤算だ…。<end>リベルダムの商人たちは拠点を失って<line-break>昔ほどの勢いがなくなっている。<line-break>ここで差をつければ夢もかなうぞ！<end>ロセン航路も安定してきたことだし、<line-break>ロセンに支社をつくって社員を雇うかな。<line-break>妻にも楽をさせてやりたいし。<end>"
english = "<select><value:$33>I'm busy right now. Please don't bother me.<end>I'm busy right now. Please don't bother me.<end>Perhaps I should send mostly fruit to Amiral... Then load the ship with tempered adamant for the return voyage.<end>The route to Rocen is open again! I must secure a ship bound for Rocen at once...<end>Rocen needs vast quantities of building materials for the reconstruction... Heh heh heh... This is quite an opportunity.<end>If Liberdam becomes unusable, we won't be able to resupply the Rocen route. That's a serious miscalculation...<end>Liberdam's merchants have lost their base of operations, and they aren't the force they once were. If I can pull ahead of them now, my dream could come true!<end>Now that the Rocen route has settled down, perhaps I'll open a branch there and hire some employees. I'd like to make life easier for my wife too.<end>"

["110030"]
japanese = "この島から出るには、船に乗るしかないぞ。<line-break>出るつもりなら船代を払ってくれよな。<line-break>無賃乗船させると船長に怒られちまうんだ。<end>"
english = "The only way off this island is by boat. If you're planning to leave, you'll have to pay the fare. The captain'll chew me out if I let you aboard without paying.<end>"

