["2710000"]
japanese = "ジリオン＆イーシャイベント13用開始<end>"
english = ""

["2710001"]
japanese = "（イオンズから聞いた<line-break>\u3000イーシャという娘のことが<line-break>\u3000気になるな…。）<end>"
english = "(I can't help wondering about that girl Iria, the one Ions told me about...)<end>"

["2710002"]
japanese = "本当にジリオンを<line-break>よみがえらせてくれるのね？<end>"
english = "You really will bring Zillion back, won't you?<end>"

["2710003"]
japanese = "無論だ。その返礼として、<line-break>君のなかにある闇の神器、<line-break>同化の髪飾りはいただくがね。<line-break>あと、彼が解放されると同時に<line-break>今度はソウルを失った君が<line-break>あのクリスタルに入ることになる。<line-break>その覚悟はできているかい？<end>"
english = "Of course. In return, I'll take the dark artifact within you: the Hair Ornament of Assimilation. And the moment he's freed, you'll lose your Soul and enter that crystal in his place. Are you prepared for that?<end>"

["2710004"]
japanese = "構わないわ。やってちょうだい。<end>"
english = "That's fine. Do it.<end>"

["2710005"]
japanese = "こんな酔狂につきあうのも久しぶりだな。<line-break>ま、俺は同化の髪飾りが手に入れば<line-break>文句はないがね。始めるぞ。<end>"
english = "It's been a while since I've gone along with madness like this. Still, as long as I get the Hair Ornament of Assimilation, I've no complaints. Let's begin.<end>"

["2710006"]
japanese = "お初にお目にかかる。たしかイーシャは<line-break>ジリオン…と呼んでいたかな。<line-break>俺はジュサプブロス。<end>"
english = "A pleasure to meet you. Iria called you Zillion, if I recall. I'm Jusabros.<end>"

["2710007"]
japanese = "そんなことはどうでもいい。<line-break>なぜ、イーシャの願いをかなえた？<end>"
english = "That doesn't matter. Why did you grant Iria's wish?<end>"

["2710008"]
japanese = "おいおい。<line-break>俺はクリスタルから<line-break>君を解放してやったんだぜ？<line-break>礼を言うのならともかく、<line-break>非難するのは筋違いだと思うがね。<end>"
english = "Now, now. I freed you from the crystal, didn't I? You ought to be thanking me. Blaming me seems rather unreasonable.<end>"

["2710009"]
japanese = "お前がイーシャをそそのかしたのか？<end>"
english = "Did you put Iria up to this?<end>"

["2710010"]
japanese = "君が勝手に選んだ自己犠牲の道が、<line-break>イーシャには理解できなかった。<line-break>それだけのことだよ。<line-break>君にとっての正解が、<line-break>他者にとっても正解とは限らない。<line-break>そうだろ？<line-break>まあ、そもそもこの世に正解なんて<line-break>存在しないんだがね。<line-break>\u3000<line-break>結局、あるのは行動とその結果だけ。<line-break>おわかりかな、ジリオン君？<end>"
english = "Iria couldn't understand the path of self-sacrifice you chose for yourself. That's all. What seems right to you isn't necessarily right to anyone else. Wouldn't you agree? Of course, there are no right answers in this world to begin with. In the end, all we have are actions and their consequences. Do you follow, Zillion?<end>"

["2710011"]
japanese = "減らず口はそこまでだ。<line-break>同化の髪飾りは返してもらう。<end>"
english = "That's enough of your glib talk. Give back the Hair Ornament of Assimilation.<end>"

["2710012"]
japanese = "ここで君を始末しても<line-break>契約違反にはならないよな。<line-break>きちんと復活させてやったんだから。<end>"
english = "If I dispose of you here, that won't violate the contract, will it? I did resurrect you exactly as promised.<end>"

["2710013"]
japanese = "おやおや。誰かと思えば…。<line-break>こんな所で無限のソウルの持ち主が<line-break>しゃしゃり出てきたか。<end>"
english = "Well, well. Look who it is... The bearer of the Infinite Soul, barging in here of all places.<end>"

["2710014"]
japanese = "ただ働きは好きじゃないが、<line-break>降りかかる火の粉ぐらいは<line-break>払っておかないとね。<end>"
english = "I don't care to work for free, but I should at least deal with threats that come my way.<end>"

["2710015"]
japanese = "まいったな。<line-break>イーシャの願いをかなえるのに<line-break>魔力を使いすぎたか。<line-break>この状態で無限のソウルの持ち主を<line-break>相手にするのは分が悪すぎる。<line-break>ここは逃げの一手だね。<end>"
english = "This is awkward. Did I use too much magic granting Iria's wish? In this state, the odds are far too poor against the bearer of the Infinite Soul. Time to run.<end>"

["2710016"]
japanese = "待て、逃がすか！<end>"
english = "Wait! You're not getting away!<end>"

["2710017"]
japanese = "同化の髪飾りは手に入れたし、<line-break>俺はここで失礼させていただくよ。<end>"
english = "I have the Hair Ornament of Assimilation, so I'll take my leave.<end>"

["2710018"]
japanese = "くっ、逃げられたか。<end>"
english = "Damn, he got away.<end>"

["2710019"]
japanese = "助かった。礼を言う。<line-break>よければ名前を聞かせてくれ。<end>"
english = "You saved me. Thank you. If you don't mind, may I have your name?<end>"

["2710020"]
japanese = "<value:$28>か…。<line-break>俺はジリオン。<line-break>縁があったら、また会おう。<end>"
english = "<value:$28>... I'm Zillion. Perhaps we'll meet again someday.<end>"

["2710021"]
japanese = "そうだ。<line-break>あのジュサプブロスという男を<line-break>追うつもりだ。<line-break>奴が持って逃げた同化の髪飾りを<line-break>絶対に取り返す。<end>"
english = "Yes. I intend to pursue that man, Jusabros. I will get back the Hair Ornament of Assimilation he fled with, no matter what.<end>"

["2710022"]
japanese = "<value:$28>の仲間に？<line-break>\u3000<line-break>\u3000<line-break>いいのか？\u3000奴は手強いぞ。<line-break>俺が一緒にいると、<line-break>お前に迷惑がかかるかもしれん。<end>"
english = "You want me to join <value:$28>? Are you sure? He's a formidable opponent. Having me with you may only cause you trouble.<end>"

["2710023"]
japanese = "それでも構わないと言うのか…？<end>"
english = "And you still don't mind...?<end>"

["2710024"]
japanese = "くっ。どうやら<value:$28>が<line-break>正しいようだな。<line-break><line-break>長い間眠りつづけていた俺の身体では<line-break>奴を追うことすら、<line-break>ままならないようだ。<end>"
english = "Damn. It seems <value:$28> was right. After sleeping for so long, this body of mine can't even manage to pursue him.<end>"

["2710025"]
japanese = "ありがとう。恩に着る。<line-break>よろしく頼む。<end>"
english = "Thank you. I'm in your debt. I'll be counting on you.<end>"

["2710026"]
japanese = "猫屋敷の転送機？<line-break>その機械なら俺がどこにいても<line-break>呼び寄せられるのか…。<line-break>わかった。俺にできることがあれば<line-break>いつでも力を貸そう。<end>"
english = "The Cat Manor teleporter? That device can summon me no matter where I am...? Very well. Whenever you need me, I'll lend whatever aid I can.<end>"

