["730043"]
japanese = "フフ、あなたは、心をなくした人形…。<line-break>忘却の仮面の騎士だもの。<line-break>そう言うでしょうね。<line-break>でも、仮面の下のあなたが<line-break>そんなことを言うとは<line-break>思ってなかったのだけれど？<end>"
