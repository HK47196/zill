["730020"]
japanese = "質問を変えよう。<line-break>なぜ、貴様のような非力な者が<line-break>この私に勝てると思ったのだ？\u3000\u3000<line-break>この最強の円卓騎士、<line-break>開け放つものヴァシュタールに。<end>"
