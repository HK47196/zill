["730025"]
japanese = "飼っているのではないわ…。\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>私のサイフォスに<line-break>手をかけるなら…<line-break>あなたを殺すわ、ヴァシュタール。<end>"
english = "Xiphos is no pet... Lay a hand on my Xiphos, and I will kill you, Vashtar.<end>"

["730026"]
japanese = "フッ、笑止な…。<line-break>貴様が私を殺すだと？<line-break>ぜひとも殺してほしいものだ。<end>"
english = "Hmph. How absurd... You, kill me? I would very much like you to kill me.<end>"

["730027"]
japanese = "おもしろい冗談の礼だ。<line-break>今は殺さぬ。<line-break>２度と私の前に顔を出すな。\u3000\u3000<line-break>来るべきウルグ様の終末の業火に<line-break>その人間ともども焼かれて<line-break>同じ時に死ぬるがよい。<end>"
english = "Consider this my thanks for the amusing joke: I will spare you for now. Never show your face before me again. When Lord Urg's final conflagration comes, burn with that human, and may you die together.<end>"

["730028"]
japanese = "深入りしすぎると<line-break>つらいだけだぞ。<line-break>フッ、愚か者が…。<end>"
english = "Get in too deep and you'll only suffer. Hmph. Fool...<end>"

["730029"]
