english = "Nadge seems nice, but he can be pretty blunt sometimes.<end>"

["730008"]
japanese = "…まあな。<end>"
english = "Well, yeah.<end>"

["730009"]
japanese = "…俺の姉のことを<line-break>聞きに来たのか。<end>"
