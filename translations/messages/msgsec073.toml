["730048"]
japanese = "あなたを置いていく気はないわ。<line-break>あなたは私の一番のお気に入りの<line-break>オモチャなの。<line-break>見てなさい。<line-break>精霊の生命を魔法の火種程度に考えて<line-break>次々と奪っていった人間たちよ…。<end>"
english = "I have no intention of leaving you behind. You're my favorite toy. Just watch, you humans who took the spirits' lives one after another, treating them as no more than kindling for your magic...<end>"

["730049"]
japanese = "私は精霊たちの死の苦しみから<line-break>生まれた魔人…。<line-break>\u3000<line-break>すべての生きとし生けるものに<line-break>死の苦しみを教えてあげるわ！<end>"
