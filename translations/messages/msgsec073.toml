["730021"]
japanese = "アスティアに続いて貴様も背信するか？<line-break>私の配下の円卓騎士に<line-break>ふたりも裏切り者が出るとはな…。<line-break>質問を変えよう。<line-break>教えてくれ、アーギルシャイアよ。<line-break>女とは、裏切るものなのか？<end>"
english = "Will you betray me too, after Astia? Two traitors among the Knights of the Round Table under my command... Let me ask you something else, Argyleshire. Is betrayal simply a woman's nature?<end>"

["730022"]
japanese = "アーギルシャイア様！<end>"
english = "Lady Argyleshire!<end>"

["730023"]
japanese = "サイフォス！<end>"
