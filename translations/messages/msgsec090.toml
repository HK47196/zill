["900000"]
japanese = "ツェラシェルメッセージVOL1開始<end>"
english = ""

["900001"]
japanese = "冒険者登録かい？<line-break>そこに名前を書いてくれ。<end>"
english = "Here to register as an adventurer? Write your name there.<end>"

["900002"]
japanese = "幻術計振れておらず<line-break>犯罪登録当てはまらず。\u3000\u3000\u3000<line-break>\u3000<line-break>おめでとう。<line-break>あんたも冒険者として<line-break>登録されたよ。<end>"
english = "No reading on the illusion meter, and no match in the criminal registry. Congratulations. You're now registered as an adventurer too.<end>"

["900003"]
japanese = "これからは、バリバリ仕事して<line-break>名をあげていってくれよ。<line-break>がんばりな！<end>"
english = "Now get out there, take on plenty of work, and make a name for yourself. Good luck!<end>"

["900004"]
japanese = "そういえば、こんな噂知ってるかい？ \u3000<line-break>エンシャントの南東の賢者の森深くに \u3000<line-break>猫屋敷ってのがあるらしいんだがね。 \u3000<line-break>これが不思議なことに、そこに行っても<line-break>誰も屋敷なんて見たことがねえんだ。<line-break>運命に選ばれた者だけ入れるんだとさ。<end>"
english = "By the way, have you heard this rumor? There's supposed to be a manor called Cat Manor deep in the Sage's Forest, southeast of Ancient. But here's the strange part: no one who's gone there has ever seen a manor. The story goes that only those chosen by fate can enter.<end>"

["900005"]
japanese = "不思議な話だろう？<line-break>誰も見たこともない屋敷の噂だなんて。<line-break>ま、運試しに行ってみたらどうだい。<end>"
english = "Strange, isn't it? A rumor about a manor no one's ever seen. Well, why not go and try your luck?<end>"

["900006"]
japanese = "おじょおさぁんん！！<line-break>君は幸せ者だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>今、君は俺様とつきあうチャンスを<line-break>手に入れたぞ。さあ、俺様の愛の胸に<line-break>飛び込んでくるがいい！<end>"
english = "Young laaady! What a lucky girl you are! You've just been given the chance to go out with me. Now come, fling yourself into my loving arms!<end>"

["900007"]
japanese = "結構です。<end>"
english = "No, thank you.<end>"

["900008"]
japanese = "ハッハァー！<line-break>俺様の名を聞いても<line-break>そういう風に冷たくあしらえるかな。<end>"
english = "Ha-ha! Let's see if you can still brush me off so coldly once you've heard my name.<end>"

["900009"]
japanese = "俺様は未来の勇者、ガルドラン様だ。<line-break>さぁ、デートしたくなってきただろう？<end>"
english = "I am the future Hero, the great Girldlan! You're starting to want that date now, aren't you?<end>"

["900010"]
japanese = "兄が一緒ですから。<end>"
english = "My brother is with me.<end>"

["900011"]
japanese = "そんなアニキは捨て置け！<line-break>未来の勇者が許す！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>君の瞳に俺様への恋の炎が燃えている。<line-break>未来の勇者にはガマンは無用さ！<line-break>俺様と甘いロマンの海に漕ぎ出すんだ！<end>"
english = "Forget that brother of yours! The future Hero gives you leave! I see the flames of your love for me burning in your eyes. And the future Hero has no need for restraint! Come, set sail with me upon a sweet sea of romance!<end>"

["900012"]
japanese = "兄が来る前に<line-break>腕を放した方がいいですよ。<end>"
english = "You should let go of my arm before my brother gets here.<end>"

["900013"]
japanese = "君は俺様を愛している。<line-break>いや、愛さなくてはいけないのだ。\u3000<line-break>\u3000<line-break>俺様の腕から熱い鼓動を感じ取れえ！<line-break>そして、君の愛の脈拍を<line-break>俺様の愛の脈拍と共鳴させるんだあ！<end>"
english = "You love me. No, you must love me! Feel the fevered pulse in my arm! Then let the pulse of your love beat in harmony with mine!<end>"

["900014"]
japanese = "妹の手を放せ。<end>"
english = "Let go of my sister's hand.<end>"

["900015"]
japanese = "なんだと？<line-break>俺様が未来の勇者ガルドランだと知って<line-break>そういうことを言ってるのか？<end>"
english = "What? You know that I am Girldlan, the future Hero, and you still speak to me like that?<end>"

["900016"]
japanese = "…お前が未来の勇者だというなら、<line-break>この世界の未来は見たくないな。<end>"
english = "If you're the future Hero, I'd rather not see the future of this world.<end>"

["900017"]
japanese = "くっ！\u3000未来の勇者をバカにしたな！<line-break>正義の鉄槌を食らいたいようだな！\u3000<line-break>\u3000<line-break>よかろう！\u3000未来の勇者である俺様が<line-break>チンケな悪役のセリフはやっちまえと<line-break>覚えてろで十分なことを教えてやる！<end>"
english = "Gah! You dare mock the future Hero! It seems you're eager to taste the hammer of justice! Very well! I, the future Hero, shall teach you that a third-rate villain needs only two lines: “Get him!” and “You'll pay for this!”<end>"

["900018"]
japanese = "妹を侮辱するからだ。<end>"
english = "That's for insulting my sister.<end>"

["900019"]
japanese = "ごめんなさい。兄さん。<line-break>その技…、使いたくないんでしょう？<end>"
english = "I'm sorry, Brother. You didn't want to use that technique, did you?<end>"

["900020"]
japanese = "お前たちのためなら、いいさ。<line-break>それより大丈夫か？<end>"
english = "For all of you, I don't mind. More importantly, are you all right?<end>"

["900021"]
japanese = "ええ。<end>"
english = "Yes.<end>"

