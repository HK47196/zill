["2640017"]
japanese = "ううん。<line-break>あちこちで人に訊いているけど<line-break>まだ、これといった手がかりは…。<line-break>でも、どこにいようと<line-break>あいつがあたしのために<line-break>何かをしてるってことは感じるの。<line-break>たぶん、あいつががんばってるから<line-break>あたしがこうしていられるって…。<line-break>\u3000<line-break>こんな感覚、うまく説明できないから、<line-break>話しても笑われるだけだと<line-break>思うけど…。<end>"
