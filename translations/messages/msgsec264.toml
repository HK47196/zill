english = "I was remembering the past―the political upheaval in Rostorl known as the Tejava Incident. It was an ugly struggle started by nobles who sought to strip House Pharos of its power. A great deal of blood was shed, and it changed Zillion's fate and mine completely... Not that anything can be done about it now...<end>"

["2640026"]
japanese = "<value:$28>…。<end>"
english = "<value:$28>...<end>"

["2640027"]
