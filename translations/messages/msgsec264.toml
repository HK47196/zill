english = "But there's something about you that reminds me of him, <value:$28>. You're kind and strong, and you work so hard for other people... I used to live entirely on my own. I naively believed I was strong because I had nothing to lose. But after meeting Zillion and you, I learned for the first time that I could become strong for someone else's sake...<end>"

