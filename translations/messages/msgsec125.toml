english = "Advancing what they call humanity's advancement would require tremendous power. Perhaps he went in search of it. New Moon Tower, the Arcane Tower... I've heard that unusual magic was sealed in those places. If you're curious, go. Asking anyone else is a waste of time.<end>"

["1250270"]
japanese = "キーワードは人類の革新じゃな。<line-break>やはり、強い力が必要ではないかの？<line-break><line-break>昔、新月の塔に恐ろしい魔法が<line-break>封印されていると聞いたことがある。<line-break>行ってみるのも手じゃな。<end>"
english = "The key is humanity's advancement. Would that not require great power? Long ago, I heard that terrifying magic was sealed in New Moon Tower. It may be worth investigating.<end>"

["1250271"]
japanese = "ベルゼーヴァにしろ、シャロームにしろ<line-break>人類の革新を進めるには大きな力が<line-break>必要になると思うんだ。<line-break>…新月の塔。<line-break>ここには恐ろしい魔法が封じられたと<line-break>確か、聞いたことがあるよ。<end>"
english = "Whether it's Beelzeva or Shalom, I think advancing humanity would require immense power. ...New Moon Tower. If I remember correctly, I heard that terrifying magic was sealed there.<end>"

["1250272"]
japanese = "………………。<end>"
english = "...<end>"

["1250273"]
japanese = "ベルゼーヴァが消えた先、ですって？<line-break>どうして、アタクシが下等生物の行方を<line-break>言わなきゃいけないの！<line-break>下等生物の考えなんて<line-break>高貴で優雅で知性あふれる<line-break>アタクシたちには関係ないわ。<end>"
english = "Where Beelzeva disappeared to? Why should I tell you the whereabouts of some inferior creature? What inferior creatures think is no concern of noble, graceful, brilliant beings like us.<end>"

["1250274"]
japanese = "ベルゼ失敗のボゲー<line-break>ベルゼ失敗のボゲー<line-break>ベルゼ失敗のボゲー<line-break>ベルゼ失敗のボゲー<line-break>ベルゼ失敗のボゲー<line-break>ベルゼ失敗のボゲー<end>"
english = "Beelze Failure, Bogee! Beelze Failure, Bogee! Beelze Failure, Bogee! Beelze Failure, Bogee! Beelze Failure, Bogee! Beelze Failure, Bogee!<end>"

["1250275"]
japanese = "前に見たあの人の目…怖かったよぉ…。<line-break>あの人、ぜったい怖いことを考えてる…。<line-break>前にギルドで、こんな話を聞いたんだ。<line-break>魔導の塔と新月の塔には、<line-break>むかし、怖い魔法が封じられんだって…。<line-break>行ってみる？\u3000<value:$28>？<end>"
english = "The look in his eyes when I saw him before... It was scary... He's definitely planning something frightening... I heard something at the Guild once: terrifying magic was sealed long ago in the Arcane Tower and New Moon Tower... Want to check them out, <value:$28>?<end>"

["1250276"]
japanese = "…新月の塔…。<line-break>闇の力が眠るという…。<line-break>行ってみるがいい。<end>"
english = "...New Moon Tower... They say the power of darkness sleeps there... You should go.<end>"

["1250277"]
japanese = "ベルゼーヴァの消えた先を<line-break>探していると？<line-break><line-break>新月の塔か、夢幻の湖か…。<line-break>奴は以前からこの二箇所を<line-break>調査していたらしい。<end>"
english = "You're searching for where Beelzeva disappeared to? New Moon Tower or the Lake of Illusions... Apparently, he'd been investigating those two places for some time.<end>"

["1250278"]
japanese = "♪古き力は眠りについた…<line-break>♪古き闇は新月の下に…<line-break>♪古き光は夢幻の彼方…<line-break>この伝承が本当なら…<line-break>そこにいるような気がするんだ。<end>"
english = "♪ Ancient power fell asleep... ♪ Ancient darkness lies beneath the new moon... ♪ Ancient light lies beyond illusion... If the legend is true... I have a feeling that's where he is.<end>"

["1250279"]
japanese = "魔導の塔、夢幻の湖…。<line-break><line-break><line-break>私は、そこへ禁呪を求めに行ったのだ。<line-break>人間の、さらなる進歩のために…！<end>"
english = "The Arcane Tower, the Lake of Illusions... I went there in search of Forbidden Spells. For humanity's further advancement...!<end>"

["1250280"]
japanese = "ベルゼーヴァの行方、ですか。<line-break>そうですね。<line-break>新月の塔、夢幻の湖、魔道の塔。<line-break>ベルゼーヴァは以前、人目を忍んで<line-break>これらの場所に出かけていたようです。<line-break>行かれてみてはいかがでしょう？<end>"
english = "Beelzeva's whereabouts? Let's see. New Moon Tower, the Lake of Illusions, the Arcane Tower. It seems Beelzeva used to visit those places in secret. Why not investigate them?<end>"

["1250281"]
japanese = "消えたベルゼーヴァの行方…。<line-break>むかし、ヴァイと調べてたんだけど、<line-break>新月の塔や夢幻の湖や魔道の塔…<line-break>こういったところに行ってたみたい。<line-break>行ってみる？\u3000お兄ちゃん？<end>"
english = "Where did Beelzeva disappear to...? Vai and I looked into it a long time ago. It seems he used to visit places like New Moon Tower, the Lake of Illusions, and the Arcane Tower... Want to check them out, Big Brother?<end>"

["1250282"]
japanese = "奴らが求めていたものは力じゃ。<line-break>とすれば、やばり禁呪じゃろう。<line-break><line-break>しかし、聖の禁呪が眠るとされる<line-break>遺跡は発見されていない。となれば、<line-break>残るは新月の塔しかあるまい。<end>"
english = "What they sought was power. That would point to a Forbidden Spell. Yet the ruins said to hold the Holy Forbidden Spell have never been discovered. That leaves only New Moon Tower.<end>"

["1250283"]
japanese = "人類の革新には大きな力が必要だ。<line-break>とすれば、魔道の塔や新月の塔は<line-break>どうだろう？<line-break>あそこにはかつて、<line-break>強大無比な魔法が封じられたと聞く。<end>"
english = "Humanity's advancement requires immense power. With that in mind, what about the Arcane Tower or New Moon Tower? I hear that incomparably powerful magic was once sealed there.<end>"

["1250284"]
japanese = "すまないが心当たりがない。<line-break>ベルゼーヴァの近くにいた人間なら<line-break>何か知っているかもしれない。<end>"
english = "I'm sorry, but nothing comes to mind. Someone who spent time around Beelzeva might know something.<end>"

["1250285"]
japanese = "ちょっとわからないわ。<line-break>でも革新って言うくらいだし<line-break>強力な力が必要よね。<line-break>どこか強力な力が封じられた場所に<line-break>いるんじゃない？<end>"
english = "I'm not really sure. But if it's called an advancement, it must require tremendous power. Don't you think he might be somewhere that such power has been sealed away?<end>"

["1250286"]
japanese = "ベルゼーヴァの行方…ですか。<line-break>私では…お役に立てません。<line-break>申しわけありません…。<end>"
english = "Beelzeva's whereabouts...? I'm afraid... I can't help you. My apologies...<end>"

["1250287"]
japanese = "ベルゼーヴァさんの行き先ですか？<line-break>ちょっと思いつきません。<line-break>\u3000<line-break>もしかしたら今までベルゼーヴァさんに<line-break>会ったことがある場所にいるのかも。<end>"
english = "Where did Beelzeva go? Nothing comes to mind. Maybe he's somewhere you've encountered him before.<end>"

["1250288"]
japanese = "ベルゼーヴァの消えた先か。<line-break>奴は力を求めているし<line-break>それを得られる所に行ったはずだ。<line-break>新月の塔に<line-break>強力な魔法が封印されているけど、<line-break>もしかしたら…。<end>"
english = "Where did Beelzeva disappear to? He's seeking power, so he must have gone somewhere he could obtain it. Powerful magic is sealed in New Moon Tower, so perhaps...<end>"

["1250289"]
japanese = "（地の精霊神グラジェオンが、<line-break>\u3000転送装置の先の聖なる座所で<line-break>\u3000エステルを呼んでいる）<line-break>（グラジェオンはエステルに<line-break>\u3000試練を受けさせ、<line-break>\u3000巫女として目覚めさせるつもりだ）<line-break>（エステルは行きたいと言っている…）<end>"
english = "(Grajeon, the Spirit God of Earth, is calling Esther to the sacred seat beyond the teleportation device.) (Grajeon intends to put Esther through a trial and awaken her as a shrine maiden.) (Esther says she wants to go...)<end>"

["1250290"]
japanese = "転送装置の先には、グラジェオンがいる<line-break>聖なる座所があるのね。<line-break><line-break>エステルはそこで試練を受けて、<line-break>グラジェオンに仕える巫女になる。<line-break><line-break>エステルに聞いてみて決めれば？<line-break>これは彼女自身の問題なんだし。<end>"
english = "Beyond the teleportation device is the sacred seat where Grajeon awaits. Esther will undergo a trial there and become a shrine maiden who serves Grajeon. Why not ask Esther and then decide? This concerns her personally, after all.<end>"

["1250291"]
japanese = "地の精霊神グラジェオンが<line-break>エステルを呼んでおるのか。<line-break><line-break>エステル自身がグラジェオンに<line-break>仕えたいと言うのなら、<line-break>止めはしまい。<line-break>しかし、シャリは何と言った？<line-break>ワシはそれが気にかかってならん…。<end>"
english = "Grajeon, the Spirit God of Earth, is calling Esther? If Esther herself wishes to serve Grajeon, I will not stop her. But what did Shalli say? I cannot help worrying about that...<end>"

["1250292"]
japanese = "グラジェオンの巫女になれば、<line-break>エステル様は超強大な力を手にすることが<line-break>できるんですって！<line-break>力って、魔力のことかしら？<line-break>だったら、うらやましいかも！<line-break>ユーリスも巫女になってみたいかも！<line-break>あ、グラジェオン様のところへは、<line-break>転送装置で行けるみたいですよ。<end>"
english = "They say Lady Esther will gain incredible power if she becomes Grajeon's shrine maiden! Does power mean magical power? If so, I might be jealous! Julls might like to become a shrine maiden too! Oh, and it seems the teleportation device leads to where Grajeon is.<end>"

["1250293"]
japanese = "エステルがそんなにたのミコむんなら、<line-break>巫女でも何でもやらせてやりゃいいと<line-break>俺は思うぜ。<line-break>冗談言ってる場合じゃねえ？<line-break>俺はいつだって大マジだ！<line-break>さっさと転送装置に乗ろうぜ！<end>"
english = "If Esther's begging that hard, I say let her become a shrine maiden or whatever else she wants. This is no time for jokes? I'm always completely serious! Let's get on that teleportation device already!<end>"

["1250294"]
japanese = "お願い、<value:$28>。<line-break>ボク、みんなの足手まといには<line-break>なりたくないんだよ。<line-break>地の精霊神グラジェオンの試練を<line-break>受けて、巫女になれれば、<line-break>きっともっと強くなれる！<line-break>…ボク、<value:$28>を<line-break>守りたいんだよ。<end>"
english = "Please, <value:$28>. I don't want to hold everyone back. If I can undergo the trial of Grajeon, the Spirit God of Earth, and become a shrine maiden, I'm sure I'll grow stronger! ...I want to protect <value:$28>.<end>"

["1250295"]
japanese = "エステルが地の精霊神グラジェオンに<line-break>仕える、魔導文明の巫女のひとり…。<line-break><line-break>例えそうだとして、お前は、エステルを<line-break>巫女にさせるつもりなのか？<line-break><line-break>結果として、それがシャリの思惑と重なる<line-break>ということを忘れるな。<end>"
english = "Esther may be one of the shrine maidens of the arcane civilization who serve Grajeon, the Spirit God of Earth... Even if that is true, do you intend to let Esther become a shrine maiden? Do not forget that the outcome would align with Shalli's designs.<end>"

["1250296"]
japanese = "太古の魔導文明に目をつけてくるとは…<line-break>シャリは相当厄介な相手ですね。<line-break><line-break>それでも、決断するのはあなた…<line-break>そしてエステル自身です。<line-break>重々、お気をつけなさい。<end>"
english = "For Shalli to set his sights on the ancient arcane civilization... He is a formidable adversary indeed. Even so, the decision belongs to you and to Esther herself. Exercise the utmost caution.<end>"

["1250297"]
japanese = "へえ～、エステルちゃんが<line-break>太古の魔導文明の巫女かもしれない<line-break>とはね～。<line-break>で、カノジョは、正式に巫女に<line-break>なりたいって言ったんだよね？<line-break>だったら、何を迷ってることがあんのさ。<line-break>かわいい女の子の願いは聞いてやるために<line-break>あるようなもんだよ？<line-break>それが世界のハメツにつながってることも<line-break>けっこう、あるんだけどね。<end>"
english = "Well, well. So Esther might be a shrine maiden of the ancient arcane civilization. And she said she wants to become a proper shrine maiden, right? Then what is there to hesitate over? Pretty girls' wishes are practically made to be granted. Though they do lead to the end of the world surprisingly often.<end>"

["1250298"]
japanese = "エステルさんがあんなに頼んでんのに、<line-break>迷ってんのかよ、姉ちゃん！<line-break><line-break>わかってる。シャリが言ってたことが<line-break>気になってるってんだろ？<line-break><line-break>でも、だから姉ちゃんが一緒に<line-break>行くんじゃないかよ。<line-break>あんなチビ、姉ちゃんの怪力で…<line-break>い、痛えっ！<line-break>頭の形が変わったらどうすんだ！<end>"
english = "Esther begged you that hard, and you're still hesitating, Sis? I know. You're worried about what Shalli said, right? But that's exactly why you're going with her. A little runt like that is no match for your monstrous strength... Ow! What if you change the shape of my skull?!<end>"

["1250299"]
japanese = "エステルが何を望んでいるか、<line-break>そんなことは問題ではない。<line-break><line-break>出現する新たな力によって、<line-break>歴史は間違いなく混乱する。<line-break><line-break>それを恐れないというのなら、<line-break>言う通りにしてやるといいわ。<line-break>エステルと、あのシャリの言う通りに。<end>"
english = "What Esther wants is irrelevant. The emergence of a new power will unquestionably throw history into turmoil. If that does not frighten you, then grant the request. Do as Esther and that Shalli say.<end>"

["1250300"]
japanese = "魔導文明復活の鍵を握る地の巫女、<line-break>エステルはそれになるため、精霊神の<line-break>座所に行きたいってんだろ。<line-break><value:$28>、お人よしの<line-break>お前さんが、エステルの望む通りに<line-break>してやりたいって気持ちはわかるぜ。<line-break>ただ、この件に関しちゃ、もっと<line-break>慎重に考えた方がいいかもしれねえ。<line-break><line-break>ロストールの酒場の看板娘になりたい…<line-break>なんてえ話とは、<line-break>あまりにもスケールが違うからな。<end>"
english = "Esther wants to go to the Spirit God's seat so she can become the Earth Shrine Maiden who holds the key to reviving the arcane civilization, right? <value:$28>, I know you're softhearted and want to give Esther what she wants. But this may be something you ought to consider more carefully. It's on a completely different scale from wanting to become the tavern's poster girl in Rostorl.<end>"

["1250301"]
japanese = "精霊神グラジェオンの座所を訪れ、<line-break>試練を受けたエステルが<line-break>魔導文明の地の巫女となる…？<line-break>面白い。<line-break>お前が行くというなら、<line-break>付き合ってもいいぞ。<end>"
english = "Esther will visit the seat of Grajeon the Spirit God, undergo the trial there, and become the Earth Shrine Maiden of the arcane civilization...? Interesting. If you're going, I wouldn't mind accompanying you.<end>"

["1250302"]
japanese = "エステルが魔導文明復活の鍵を握る<line-break>巫女のひとりかもしれんとはなあ…。<line-break>本当なら、これは大変なことじゃぞ。<line-break>エステル自身も求めていることじゃ、<line-break>精霊神グラジェオンの聖座とやらに、<line-break>真偽を確かめに赴こうではないか。<end>"
english = "To think Esther might be one of the shrine maidens who hold the key to reviving the arcane civilization... If true, this is momentous indeed. Esther herself desires it, so let us visit what they call Grajeon the Spirit God's Holy Seat and discover the truth.<end>"

["1250303"]
japanese = "精霊神グラジェオンの聖座に行くことで<line-break>エステルは地の巫女になれる…。<line-break><line-break>エステルがそうなりたって思うのは<line-break>いいと思うよ。でも、そのせいで、<line-break>魔導文明とかが復活するんでしょ？<line-break>それが悪い結果を呼びはしないか、<line-break>僕、それがちょっと心配だよ。<end>"
english = "Esther can become the Earth Shrine Maiden by going to Grajeon the Spirit God's Holy Seat... I think it's fine for Esther to want that. But it would revive the arcane civilization or something, wouldn't it? I'm a little worried that might have bad consequences.<end>"

["1250304"]
japanese = "精霊神グラジェオンに連なる巫女の<line-break>魔力も、それを鍵に蘇るという<line-break>魔導文明の力も…<line-break>問題は、それが正しき方向に<line-break>使われるか否か、というところだ。<line-break><line-break>そして、さらに言えば、<line-break>何が正しいのかを、誰が判断するのか？<line-break>それこそが最大の問題だ。<end>"
english = "The magical power of a shrine maiden linked to Grajeon the Spirit God, and the power of the arcane civilization said to be revived through her... The question is whether that power will be used for the right purpose. More fundamentally, who decides what is right? That is the greatest question of all.<end>"

["1250305"]
japanese = "エステルが精霊神の聖座へ行って、<line-break>選ばれし地の巫女になるですって？<line-break><line-break>ふ、ふん、悔しくなんかないわよ。<line-break>高雅なアタクシは、土臭い民族信仰の<line-break>巫女なんかに憧れたりしなくてよ。<line-break>え？\u3000超高度な魔導文明ですって？<line-break>そ、そんなことをアタクシに<line-break>聞かせてどーーしようってのよ！<end>"
english = "Esther is going to the Spirit God's Holy Seat to become the chosen Earth Shrine Maiden? H-hmph! I'm not jealous. A refined lady like me would never envy a shrine maiden of some dirt-reeking folk religion. What? An extraordinarily advanced arcane civilization? W-why would you tell me thaaat?!<end>"

["1250306"]
japanese = "聖座のボゲー<line-break>聖座のボゲー<line-break>聖座のボゲー<line-break>聖座のボゲー<line-break>聖座のボゲー<line-break>聖座のボゲー<end>"
english = "Holy Seat Bogee! Holy Seat Bogee! Holy Seat Bogee! Holy Seat Bogee! Holy Seat Bogee! Holy Seat Bogee!<end>"

["1250307"]
japanese = "グラジェオンの聖座ってとこに行けば<line-break>エステルは地の巫女になれるんだって。<line-break><line-break>エステルがなりたいっていうんなら<line-break>それがいいと思うけどぉ、<line-break>前のエステルじゃなくなっちゃったら、<line-break>ルルアンタ、さびしいな…。<end>"
english = "They say Esther can become the Earth Shrine Maiden if she goes to a place called Grajeon's Holy Seat. If Esther wants to become one, I think that's fine, but... Lulluantha would be sad if Esther wasn't the same anymore...<end>"

["1250308"]
japanese = "………………。<line-break><line-break><line-break>重大なのは、<line-break>地の巫女が現れるということより、<line-break>それにより魔導文明とやらが、<line-break>復活するかもしれぬ、<line-break>ということではないのか。<line-break><line-break>………………。<end>"
english = "... What matters is not so much the appearance of the Earth Shrine Maiden as the possibility that this may revive the so-called arcane civilization. ...<end>"

["1250309"]
japanese = "精霊神グラジェオンの聖座へ行き、<line-break>その試練を受けることで、<line-break>エステルが地の巫女となる…。<line-break>エステルがお前を頼っている以上、<line-break>決断する権利はお前にある。<line-break><line-break>滅んだ魔導文明がにわかに復活し、<line-break>ディンガルを、そして世界を焼くか、<line-break>それとも…。<line-break>それが、お前にかかっている。<end>"
english = "Esther will go to Grajeon the Spirit God's Holy Seat, undergo the trial there, and become the Earth Shrine Maiden... Since Esther is relying on you, the decision is yours to make. The fallen arcane civilization may suddenly return and burn Dingal, and then the world, or else... It all depends on you.<end>"

["1250310"]
japanese = "グラジェオンの座所に行けば、<line-break>エステルは地の巫女になれるんだって。<line-break>エステルはそれを望んでるんだよね？<line-break>だったら、一緒に行ってあげるのが、<line-break>スマートってものじゃないかな。<line-break><line-break>もちろん行くよ。<line-break>精霊の神様なんてものは、<line-break>めったに見られるもんじゃないからね。<end>"
english = "They say Esther can become the Earth Shrine Maiden if she goes to Grajeon's seat. That's what Esther wants, right? Then going with her would be the smart thing to do. Of course I'm coming. You rarely get a chance to see a god of the spirits.<end>"

["1250311"]
japanese = "精霊神が巫女をその聖座へと<line-break>招いているだと…。<line-break><line-break>聞けば、巫女は強力な魔力を秘め、<line-break>なおかつ魔導文明復活の鍵も<line-break>握っているというではないか。<line-break>おお、そこにこそ、<line-break>私が夢見る人間進歩の次なる段階が<line-break>含有されているのではないか…！<end>"
english = "A Spirit God is inviting a shrine maiden to its Holy Seat...? I hear the shrine maiden harbors tremendous magical power and also holds the key to reviving the arcane civilization. Ah! Could that contain the next stage in human progress that I have dreamed of...?!<end>"

["1250312"]
