["70000"]
japanese = "<select><value:$33>貴様何者だ！<line-break>まさか国王陛下のお命を狙う<line-break>ディンガルの刺客か！<end>貴様何者だ！<line-break>まさか国王陛下のお命を狙う<line-break>ディンガルの刺客か！<end>貴様何者だ！<line-break>まさか国王陛下のお命を狙う<line-break>ディンガルの刺客か！<end>ここはディンガル帝国ロセン総督府である。<line-break>カルラ将軍へ何か用があるのか？<line-break>そうでないなら早々に立ち去るがよかろう。<end>ここはディンガル帝国ロセン総督府である。<line-break>カルラ将軍へ何か用があるのか？<line-break>そうでないなら早々に立ち去るがよかろう。<end>ここはディンガル帝国ロセン総督府である。<line-break>用がない者を通すわけにはいかぬ。<line-break>早々に立ち去るがよかろう。<end>ここはディンガル帝国ロセン総督府である。<line-break>用がない者を通すわけにはいかぬ。<line-break>早々に立ち去るがよかろう。<end>ここはディンガル帝国ロセン総督府である。<line-break>用がない者を通すわけにはいかぬ。<line-break>早々に立ち去るがよかろう。<end>"
english = "<select><value:$33>Who are you? Are you an assassin from Dingal, here to take His Majesty the King's life?<end>Who are you? Are you an assassin from Dingal, here to take His Majesty the King's life?<end>Who are you? Are you an assassin from Dingal, here to take His Majesty the King's life?<end>This is the Rocen Governor-General's Office of the Dingal Empire. Do you have business with General Karula? If not, you would do well to leave at once.<end>This is the Rocen Governor-General's Office of the Dingal Empire. Do you have business with General Karula? If not, you would do well to leave at once.<end>This is the Rocen Governor-General's Office of the Dingal Empire. No one without business here may pass. You would do well to leave at once.<end>This is the Rocen Governor-General's Office of the Dingal Empire. No one without business here may pass. You would do well to leave at once.<end>This is the Rocen Governor-General's Office of the Dingal Empire. No one without business here may pass. You would do well to leave at once.<end>"

["70001"]
japanese = "<if><value:$2A><less-equal>%49自分が腕の立つ冒険者だというのか？<line-break>笑わせるな！\u3000<value:$28>の名など<line-break>聞いたこともない。早々に立ち去れい。<end><if><value:$2A><less-equal>%100自分が最近頭角を現してきた<line-break><value:$28>だというのか。<line-break>ふむ、確かに名前は聞いたことはあるが…。<line-break>本当に<value:$28>かどうか<line-break>わからぬ以上、ここを通すわけにはいかぬ。<line-break>早々に立ち去れい。<end>おお、あなたが<value:$2B>の<line-break>異名をとる<value:$28>殿か。<line-break>確かに並々ならぬ面構え。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>しかし、たとえ<value:$28>殿であっても<line-break>許可もなしにここを通すわけにはいきませぬ。<line-break>どうか、今回はおとなしく帰ってくだされ。<end>"
english = "<if><value:$2A><less-equal>%49You call yourself a skilled adventurer? Don't make me laugh! I've never even heard the name <value:$28>. Now be gone.<end><if><value:$2A><less-equal>%100You claim to be <value:$28>, the adventurer who's recently begun making a name for yourself? Hmm. I have heard the name, but unless I can be sure you truly are <value:$28>, I cannot let you pass. Be gone.<end>Oh! So you are <value:$28>, known as <value:$2B>. You certainly have an impressive look about you. Even so, I cannot let you pass without permission, not even if you are indeed <value:$28>. Please, turn back without a fuss this time.<end>"

["70002"]
japanese = "<select><value:$33>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>東方６国家の盟主と言われた<line-break>ロセン王国も今は大陸最悪の国だよ。<line-break>すべてはペウダのせいだよ。<end>うれしいねえ、ペウダが処刑されて\u3000\u3000\u3000\u3000<line-break>この国にも平和が戻ってきたんだ。<line-break>すべてはディンガル帝国のおかげだよ。<line-break>ロセンを悪魔から解放してくれたのは<line-break>カルラっていう少女だっていうじゃないか。<line-break>ああ、私たちにとっては女神様だよ。<end>ロセンも少しずつだけど昔の活気を\u3000<line-break>取り戻しているよ。他国に逃げていた<line-break>人々も戻ってきてるしねえ。<line-break>ただ、高い税金が…。<line-break>いや、ペウダのころにくらべれば<line-break>ましだから文句はいえないね。<end>確かにカルラ将軍のおかげで、ロセンは急速に<line-break>昔の繁栄を取り戻しているよ。破壊された<line-break>町並みも少しずつ修復されているしね。<line-break>でもね、地方じゃペウダの時代と変わらない<line-break>くらい重い税金を徴収されて苦しんでいる<line-break>人々がいるんだよ。<end>カルラ将軍のリベルダム破壊で、\u3000\u3000\u3000\u3000\u3000\u3000<line-break>リベルダムの商人たちも闘技場も<line-break>ここに引っ越してきたね。<line-break>しかし、重い税金に苦しめられた地方の人々や<line-break>故郷を失ったリベルダムの難民を思うと<line-break>素直に喜ぶことはできないよ。<end>ネメア様が行方不明になったという噂が<line-break>真実なら、ディンガル帝国は<line-break>どうなってしまうのだろう…。<end>"
english = "<select><value:$33>The Kingdom of Rocen was once called the leader of the six eastern nations. Now it's the worst country on the continent. It's all Peuda's fault.<end>The Kingdom of Rocen was once called the leader of the six eastern nations. Now it's the worst country on the continent. It's all Peuda's fault.<end>The Kingdom of Rocen was once called the leader of the six eastern nations. Now it's the worst country on the continent. It's all Peuda's fault.<end>I'm so glad. Peuda has been executed, and peace has returned to this country. We owe it all to the Dingal Empire. They say it was a girl named Karula who freed Rocen from that devil. Ah, she's a goddess to us.<end>Little by little, Rocen is regaining its old vitality. People who fled to other countries are coming back, too. The taxes are high, though... No, they're still not as bad as they were under Peuda, so I suppose I can't complain.<end>Thanks to General Karula, Rocen is certainly regaining its former prosperity at remarkable speed. The ruined streets are being rebuilt bit by bit, too. But out in the provinces, people are suffering under taxes as heavy as they were in Peuda's time.<end>After General Karula destroyed Liberdam, its merchants and arena moved here. But when I think of the people in the provinces crushed by heavy taxes, and the refugees from Liberdam who lost their homes, I can't simply celebrate.<end>If the rumor that Lord Nemea has disappeared is true, what will become of the Dingal Empire...?<end>"

["70003"]
japanese = "<select><value:$33>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>俺たちからしぼり取った税金でリベルダムから<line-break>モンスターを買い、慰み者にした娘たちを<line-break>そのエサにする…。<line-break>奴は、ペウダは人間じゃねえ。<line-break>神はどうして悪魔の所業を見過ごすのか…。<line-break>俺たちは悪夢がさめるのを待つしかないのか。<end>ペウダが、悪魔がロセンからいなくなった！<line-break>天空神は我々を見捨てなかったんだ！<line-break>神よ、そしてディンガル帝国万歳！<end>これがロセンをペウダから解放してくれた青竜<line-break>将軍カルラの像だよ。こんなにかわいい少女が<line-break>俺たちの救世主だなんて信じられないよな。<end>青竜将軍カルラは戦争の天才だよ。<line-break>リベルダムをあっというまに<line-break>占領してしまうんだからな。<end>カルラ様が本気を出せば、<line-break>ロストールのへなちょこ騎士なんて<line-break>目じゃないね。<end>ネメアが本当に死んだのなら、<line-break>次の皇帝にはカルラ様がいいな。<line-break>強いし美しいし文句なしだよ。<end>"
english = "<select><value:$33>He uses the taxes wrung out of us to buy monsters from Liberdam, then feeds them the girls he's used for his pleasure... Peuda isn't human. Why does God turn a blind eye to such devilry? Can we do nothing but wait for this nightmare to end?<end>He uses the taxes wrung out of us to buy monsters from Liberdam, then feeds them the girls he's used for his pleasure... Peuda isn't human. Why does God turn a blind eye to such devilry? Can we do nothing but wait for this nightmare to end?<end>He uses the taxes wrung out of us to buy monsters from Liberdam, then feeds them the girls he's used for his pleasure... Peuda isn't human. Why does God turn a blind eye to such devilry? Can we do nothing but wait for this nightmare to end?<end>Peuda, that devil, is gone from Rocen! The Sky God did not forsake us! Glory to God, and long live the Dingal Empire!<end>This is the statue of Karula, the Azure Dragon General who freed Rocen from Peuda. Hard to believe such a pretty young girl is our Savior, isn't it?<end>Karula, the Azure Dragon General, is a genius at war. She conquered Liberdam in no time at all.<end>If Lady Karula gets serious, Rostorl's pathetic knights won't stand a chance.<end>If Nemea really is dead, I'd like Lady Karula to be the next emperor. She's strong and beautiful. What more could you ask for?<end>"

["70004"]
japanese = "<select><value:$33>ペウダはディンガルのネメアが恐いのさ。\u3000\u3000<line-break>ディンガル攻めの際、略奪に夢中のところを<line-break>ネメアに反撃されて命からがら逃げたからね。<line-break>だから城壁を高くして、街道も海路も封鎖して<line-break>自分は城にこもってブルブル震えてるんだよ。<line-break>奴は逃げることしかできない最低の人間さ。<end>ペウダはディンガルのネメアが恐いのさ。\u3000\u3000<line-break>ディンガル攻めの際、略奪に夢中のところを<line-break>ネメアに反撃されて命からがら逃げたからね。<line-break>だから城壁を高くして、街道も海路も封鎖して<line-break>自分は城にこもってブルブル震えてるんだよ。<line-break>奴は逃げることしかできない最低の人間さ。<end>ペウダはディンガルのネメアが恐いのさ。\u3000\u3000<line-break>ディンガル攻めの際、略奪に夢中のところを<line-break>ネメアに反撃されて命からがら逃げたからね。<line-break>だから城壁を高くして、街道も海路も封鎖して<line-break>自分は城にこもってブルブル震えてるんだよ。<line-break>奴は逃げることしかできない最低の人間さ。<end>ディンガル帝国青竜将軍カルラの像か…。<line-break>確かに愚王ペウダからロセンを<line-break>解放してくれた救世主なんだけど、<line-break>町の真ん中に自分の像を建てるってのは<line-break>あんまりいい趣味じゃないね。<line-break>でも、かわいいから個人的に許す。<end>カルラ将軍って恐いよな。<line-break>自分に逆らう人間は皆殺しにしそうだし…<line-break>武器が死神の鎌ってのも問題だよ。<end>いくらリベルダムの武器商人が憎いからって<line-break>徹底的に破壊することはないと思うけどな。<line-break>あれじゃ自分を憎む人間を増やすだけだよ。<end>連戦連勝のカルラ将軍も、今度ばかりは<line-break>慎重にいかないといけないだろうね。<line-break>なんといっても相手はゼネテスだから。<end>ネメア死すの噂は恐らくゼネテス陣営が流した<line-break>偽情報だろうね。ただ、火のないところに<line-break>煙はたたないという言葉もあるからな。<end>"
english = "<select><value:$33>Peuda is terrified of Nemea of Dingal. When Peuda invaded Dingal, Nemea struck back while he was busy looting, and Peuda barely escaped alive. That's why he raised the walls and sealed off both the roads and the sea routes. Now he hides in the castle, trembling in fear. He's the lowest kind of man, good for nothing but running away.<end>Peuda is terrified of Nemea of Dingal. When Peuda invaded Dingal, Nemea struck back while he was busy looting, and Peuda barely escaped alive. That's why he raised the walls and sealed off both the roads and the sea routes. Now he hides in the castle, trembling in fear. He's the lowest kind of man, good for nothing but running away.<end>Peuda is terrified of Nemea of Dingal. When Peuda invaded Dingal, Nemea struck back while he was busy looting, and Peuda barely escaped alive. That's why he raised the walls and sealed off both the roads and the sea routes. Now he hides in the castle, trembling in fear. He's the lowest kind of man, good for nothing but running away.<end>So that's a statue of Karula, the Dingal Empire's Azure Dragon General... She is the Savior who freed Rocen from the foolish King Peuda, but putting up a statue of yourself in the middle of town is in rather poor taste. Still, she's cute, so I'll let it pass.<end>General Karula is frightening, isn't she? She looks as though she'd slaughter anyone who defied her... And the fact that her weapon is a reaper's scythe doesn't help.<end>No matter how much she hated Liberdam's arms merchants, I don't think she had to destroy the place so thoroughly. That will only give more people reason to hate her.<end>General Karula has won battle after battle, but she'll have to be cautious this time. Her opponent is Xenetes, after all.<end>The rumor of Nemea's death is probably false information spread by Xenetes's camp. Still, as the saying goes, there's no smoke without fire.<end>"

["70005"]
japanese = "<select><value:$20>%2東方諸国の盟主と呼ばれたロセンも<line-break>ずいぶん荒れ果ててしまったなあ。<line-break>まるでリベルダムのスラムだよ。<end>ここはいつになったら修理してくれるのかな。<line-break>住宅地の方は、ずいぶんときれいになって<line-break>いるのになあ。<end>"
english = "<select><value:$20>%2Rocen was once called the leader of the Eastern Nations, but look how badly it's fallen into ruin. It's like the Slums of Liberdam.<end>When are they going to repair this part of town? The residential quarter is already looking much better.<end>"

["70006"]
japanese = "<select><value:$33>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>悪魔はペウダだけじゃない。<line-break>ペウダに武器やモンスターを売る<line-break>リベルダムの商人も悪魔だよ。<end>みんなペウダが処刑されて喜んでいるけど<line-break>何がうれしいんだい。ロセンの支配者が<line-break>ペウダからディンガル帝国に代わっただけだよ。<line-break>あたしたちの暮らしがよくなるって保証は<line-break>どこにもないんだ。もっと悲惨な生活が<line-break>待っているかもしれないのにさ。<end>自ら解放軍を名乗ってロセン王家再興を目指す<line-break>集団がいるらしいね。しかも旗印がリベルダムの<line-break>武器商人ロティの娘なんて笑っちゃうよ。<line-break>ペウダがあたしらの税金で武器を買って<line-break>さんざんもうけさせてやったのに、<line-break>こんどは国まで売ってやるつもりなのかね。<end>リベルダムが破壊されたもんで、<line-break>あのフゴーが引っ越してきたよ。<line-break>ギルドのとなりの建物がそうだよ。<end>戦争、戦争って…。<line-break>カルラは戦争以外に興味がないのかね。<line-break>少しはロセン復興に力を入れて欲しいよ。<end>すべては救世主エルファス様の予言通りに<line-break>なってきたねえ。<line-break>本当に世界は滅んでしまうのかい？<end>"
english = "<select><value:$33>Peuda isn't the only devil. The merchants of Liberdam who sell him weapons and monsters are devils too.<end>Peuda isn't the only devil. The merchants of Liberdam who sell him weapons and monsters are devils too.<end>Peuda isn't the only devil. The merchants of Liberdam who sell him weapons and monsters are devils too.<end>Everyone's celebrating Peuda's execution, but what is there to celebrate? Rocen has merely traded Peuda for the Dingal Empire as its ruler. There's no guarantee our lives will improve. Things could become even worse.<end>I hear there's a group calling itself the Liberation Army, aiming to restore Rocen's royal house. And their figurehead is the daughter of Lottie, an arms merchant from Liberdam. What a joke. Peuda bought weapons with our taxes and made Lottie a fortune. Now is the daughter planning to sell off the whole country as well?<end>After Liberdam was destroyed, that Hugo moved here. That's his building next to the Guild.<end>War, war, war... Does Karula care about nothing else? I wish she'd put some effort into rebuilding Rocen.<end>Everything is unfolding just as the Savior Elfas prophesied. Is the world truly going to end?<end>"

["70007"]
japanese = "<if><value:$2C><less-equal>%9ロセン周辺のモンスターは手強いぞ。<line-break>駆け出しの冒険者は近づかないほうが<line-break>賢明だと思うがな。<end><if><value:$2C><less-equal>%29ロセンの東にある火山岩地帯は\u3000\u3000\u3000\u3000\u3000<line-break>戦神ソリアスと破壊神ウルグの戦いで<line-break>噴火した炎竜山の溶岩でできたそうだよ。<line-break>モンスターは少々手強いが、お前の<line-break>レベルならそれほど苦戦もしないだろう。<line-break>今度行ってみるといい。<end><if><value:$2C><less-equal>%49精霊神は禁呪を守っているという。<line-break>その力を求めている冒険者も多いというが、<line-break>まだ、その力を得た者はいないそうだ。<end>精霊神を封じている巨人をすべて倒すと、<line-break>闇の女神ティラが復活するという伝説がある。<line-break>恐ろしい伝説だと思わないか？<end>"
english = "<if><value:$2C><less-equal>%9The monsters around Rocen are formidable. Novice adventurers would be wise to stay away.<end><if><value:$2C><less-equal>%29They say the Volcanic Rock Zone east of Rocen was formed from lava spewed by Flame Dragon Mountain during the battle between War God Solias and Urg, God of Destruction. The monsters there are rather tough, but at your level they shouldn't give you much trouble. You should visit sometime.<end><if><value:$2C><less-equal>%49It is said that the Spirit Gods guard the Forbidden Spells. Many adventurers seek that power, but apparently no one has obtained it yet.<end>Legend says that if every giant imprisoning the Spirit Gods is slain, Tira, Goddess of Darkness, will return. A frightening legend, don't you think?<end>"

["70008"]
japanese = "<if><value:$2C><less-equal>%29魔法が使えるようになるスペル系の\u3000\u3000\u3000<line-break>スキルは冒険の中で役に立つはずだ。<line-break>できるだけ習得しておいたほうがいいな。<end><if><value:$2C><less-equal>%49ロセンの北東にある地下墓地は迷宮になって<line-break>いるんだ。奥には巨大な墓があるらしいんだが<line-break>誰の墓かは学者が調べてもわからないそうだ。<end>新月の塔を知っているか？<line-break>ネガヴァニティアを持つ者には、<line-break>闇の禁呪を与えるらしいが本当だろうか。<end>"
english = "<if><value:$2C><less-equal>%29Spell-type skills that let you use magic should prove useful on your adventures. Learn as many as you can.<end><if><value:$2C><less-equal>%49The Underground Cemetery northeast of Rocen is a labyrinth. Apparently there's an enormous tomb deep inside, but even scholars have been unable to discover whose it is.<end>Do you know the New Moon Tower? They say it grants a Dark Forbidden Spell to anyone who possesses Negavanitia. I wonder if it's true.<end>"

["70009"]
japanese = "<if><value:$2A><less-equal>%49魔法を使うにはスキルも必要だけど、それと<line-break>同じくらい精霊力レベルが重要なんだ。<line-break>ＭＰが足りているのに使えない魔法があったら<line-break>精霊力レベルが足りないのかもしれないよ。<line-break>もし火属性の魔法が使えなかったら、それは<line-break>火の精霊力レベルが低いってことだからね。<end><if><value:$2A><less-equal>%100ネガヴァニティアというソウルがあるんだ。\u3000<line-break>闇属性の魔法を使うことのできる唯一のソウル<line-break>なんだけど、宿している人は少ないんだよ。<line-break>このソウルを宿すには、やさしさＫｉｎｄが<line-break>極端に低くないといけないんだ。闇の力を<line-break>使う人にやさしさは不要ってことなのかな。<end>ネガヴァニティアのソウルを宿していないと、<line-break>闇の禁呪は使えないよ。もっとも封印を<line-break>解くことができればの話だけどね。<end>"
english = "<if><value:$2A><less-equal>%49You need the right skill to cast magic, but your spirit power level is just as important. If you have enough ＭＰ but still can't cast a spell, your spirit power level may be too low. If you can't use Fire-element magic, for instance, that means your Fire spirit power level is low.<end><if><value:$2A><less-equal>%100There's a Soul called Negavanitia. It's the only Soul that allows the use of Dark-element magic, but very few people possess it. To harbor this Soul, your Ｋｉｎｄ must be extremely low. Does that mean anyone who uses the power of darkness has no need for kindness?<end>You can't use a Dark Forbidden Spell without the Negavanitia Soul. That's assuming you can break the seal, of course.<end>"

["70010"]
japanese = "<select><value:$20>%3ぼくがまだ子供だったころ、うちの爺さんが<line-break>毎夜のように昔話を聞かせてくれたんだ。<line-break>特に英雄伝説が面白かったよ。<end>ぼくも昔話にでてくるような英雄に<line-break>なろうと思っていたけど、<line-break>現実は厳しいものだね。<end>勇者ネメアは現代の英雄だね。<line-break>きっと彼の活躍は何百年たっても<line-break>伝説として語り継がれると思うよ。<end>"
english = "<select><value:$20>%3When I was a child, my grandfather used to tell me old stories almost every night. I especially loved the legends of heroes.<end>I once dreamed of becoming a hero like the ones in those old tales, but reality can be harsh.<end>Nemea the Hero is a hero of our own age. I'm sure tales of his deeds will still be told as legend centuries from now.<end>"

["70011"]
japanese = "<select><value:$20>%3フゴー美術館へようこそ。<line-break>世界中から集めた美術品の<line-break>数々をお楽しみください。<end>当美術館は、世界中から集めました<line-break>珍しい品々を展示しております。<line-break>ごゆっくりご鑑賞ください。<end>以前はリベルダムで展示していましたが、<line-break>事情によりこちらへ移って参りました。<line-break>今後ともよろしくお願いします。<end>"
english = "<select><value:$20>%3Welcome to the Hugo Museum. Please enjoy our collection of art from around the world.<end>Our museum exhibits rare objects gathered from across the world. Please take your time viewing the collection.<end>Our collection was formerly exhibited in Liberdam, but circumstances required us to relocate here. We hope you will continue to favor us with your patronage.<end>"

["70012"]
japanese = "<select><value:$20>%2俺はこのあいだまでリベルダムで冒険者を<line-break>やってたんだが、ここの美術品が気に入ってね。<line-break>いつも見てたいから警備員になったんだ。<end>ロセンは危険なところだからな。<line-break>俺のようなもと腕利き冒険者が<line-break>警備員として美術品を守っているんだ。<end>"
english = "<select><value:$20>%2Until recently, I was an adventurer in Liberdam. Then I took a liking to the art here. I wanted to look at it every day, so I became a guard.<end>Rocen is a dangerous place. That's why a former top-notch adventurer like me guards the artwork.<end>"

["70013"]
japanese = "<select><value:$33>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>ここにはフゴー様が世界中から<line-break>集めた珍しい品やすばらしい美術品が<line-break>数多く展示してある。<line-break>冒険者にとって自分の売った品が<line-break>ここに展示されるのは<line-break>たいへん名誉なことなんだぞ。<end>フゴー様は珍しい物を集めておられる。<line-break>何か珍しい品を持っているなら<line-break>必ず売りに来るのだぞ。<end>珍しい物を持っていないか？<line-break>珍しい物が手に入れば、フゴー様はたいそう<line-break>お喜びになるに違いない。<end>"
english = "<select><value:$33>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>This museum displays many rare objects and magnificent works of art that Lord Hugo gathered from around the world. For an adventurer, having something you've sold displayed here is a tremendous honor.<end>Lord Hugo collects rare objects. If you possess anything unusual, be sure to bring it here and sell it.<end>Do you have anything rare? If you acquire something unusual, Lord Hugo is sure to be delighted.<end>"

["70014"]
japanese = "<if><value:$2C><less-equal>%9禁呪を知っているかしら？\u3000<line-break>展示してある古代魔道王国時代の品に<line-break>ヒントがあるかもと思って来たのだけれど…。<line-break>精霊神に関係があるのは確かね。<line-break>もうちょっと調べてみようかしら。<end><if><value:$2C><less-equal>%29禁呪は全部で６個あるみたいね。<line-break>どれもこれも強力な呪文だから、制御するには<line-break>高い精霊力レベルが必要だわ。<end>火、水、土、風の属性を持った禁呪は、<line-break>各属性の精霊神が守っていることがわかったの。<line-break>でも、どうやって精霊神に会うかが問題よね。<end>"
english = "<if><value:$2C><less-equal>%9Do you know about the Forbidden Spells? I came here thinking the artifacts from the age of the Ancient Magic Kingdom might hold a clue... I'm certain the Spirit Gods are connected somehow. Perhaps I'll investigate a little more.<end><if><value:$2C><less-equal>%29There seem to be six Forbidden Spells in all. Every one of them is immensely powerful, so controlling them requires a high spirit power level.<end>I've learned that the Forbidden Spells of Fire, Water, Earth, and Wind are guarded by the Spirit God of each element. The problem is finding a way to meet those gods.<end>"

["70015"]
japanese = "<if><value:$2C><less-equal>%9剣聖レーグこそ、我らボルダンの誇り。<line-break>彼に勝てるものは、この世にはいないだろう。<line-break>お前ごときでは、一撃ともたないだろうな。<end><if><value:$2C><less-equal>%29剣聖レーグは勇者ネメアとともに<line-break>魔王バロルを倒したという。<line-break>ゼネテスとやらも、二撃ともたないだろうな。<end><if><value:$2C><less-equal>%49ロストールのレムオンという貴族は<line-break>二刀流の使い手らしいな。<line-break>だが、レーグの二刀流は無敵だ！<line-break>その男も、三撃ともたないだろうな。<line-break>レーグは最強の男だからな。<end>…たぶん無理だと思うが、<line-break>お前なら竜王にも勝てるかもしれんな。<line-break>たぶん無理だと思うが…<end>"
english = "<if><value:$2C><less-equal>%9Reig the Sword Saint is the pride of the Boldans. No one in this world could defeat him. Someone like you wouldn't withstand even one blow.<end><if><value:$2C><less-equal>%29They say Reig the Sword Saint defeated Balor, Demon King, alongside Nemea the Hero. Xenetes, or whatever his name is, wouldn't withstand two blows against him.<end><if><value:$2C><less-equal>%49I hear a Rostorl noble named Lemghon is skilled in Dual Wielding. But Reig's Dual Wielding is invincible! That man wouldn't withstand three blows against him. Reig is the strongest man!<end>I doubt it, but you might even be able to defeat the Dragon King. I doubt it, though...<end>"

["70016"]
japanese = "<if><value:$2C><less-equal>%15いいねえいいねえ、レーグ最高！\u3000<line-break>彼のような強い男が<line-break>生きている時代に生まれてよかったあ。<end><if><value:$2C><less-equal>%25ネメアとレーグの対決が見てみたいな。<line-break>歴史に残る好カード間違いなしだろ。<line-break>なあ、あんたはどっちを応援する？<end><if><value:$2C><less-equal>%35レーグを倒せるのはボルダンかドワーフの<line-break>戦士じゃないと無理か？\u3000人間にもがんばって<line-break>ほしいけどな。例えば<value:$28>とかよ。<end>レーグのようにいかにも強そうって<line-break>感じじゃないけど、<value:$28>も<line-break>けっこういいよな。<end>"
english = "<if><value:$2C><less-equal>%15Yes, yes! Reig is the best! I'm so glad I was born in an age when a strong man like him is alive.<end><if><value:$2C><less-equal>%25I'd love to see Nemea and Reig face each other. It would be a match for the history books. So, which one would you cheer for?<end><if><value:$2C><less-equal>%35Does it take a Boldan or a Dwarf warrior to defeat Reig? I'd like to see a human put up a fight, though. Someone like <value:$28>, for instance.<end><value:$28> may not look as obviously powerful as Reig, but still seems pretty good.<end>"

["70017"]
japanese = "レーグは確かに強い。<line-break>じゃが、まだ守りに隙があるわい。<end>"
english = "Reig is certainly strong. But there are still openings in his defense.<end>"

["70018"]
japanese = "<if><value:$2C><less-equal>%15さすがに剣聖の名を持つだけのことはある。<line-break>レーグの強さは本物だよ。<line-break><line-break>だが、わしとしては<line-break>彼と互角に戦えるヤツがいないと<line-break>試合がおもしろくないんだな。<end><if><value:$2C><less-equal>%25ゼネテスという冒険者が、<line-break>なかなかの腕前らしいじゃないか。<line-break>闘技大会でレーグと戦ってくれないかな。<end><if><value:$2C><less-equal>%35最近、気になっている冒険者がいるのだよ。<line-break>顔は知らないのだが見かけによらず強いらしい。<line-break>たしか、<value:$28>とかいったかな…。<end>おお、<value:$28>ではないか！<line-break>君なら永遠の王者になれるはずだ。<line-break>わたしは期待しているからな。<end>"
english = "<if><value:$2C><less-equal>%15Reig certainly deserves the title of Sword Saint. His strength is the real thing. But as far as I'm concerned, a match isn't much fun unless someone can fight him on equal terms.<end><if><value:$2C><less-equal>%25I hear an adventurer named Xenetes is quite skilled. I wonder if he'll fight Reig in the tournament.<end><if><value:$2C><less-equal>%35There's an adventurer who's caught my interest lately. I've never seen <value:$28>, but apparently the adventurer is stronger than appearances suggest.<end>Oh, if it isn't <value:$28>! I'm sure you can become the eternal champion. I have high hopes for you.<end>"

