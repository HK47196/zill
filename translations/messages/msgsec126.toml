japanese = "魔王バロルを倒し、世界を救った勇者。<line-break>その後、自分には叔父に当たるエリュマルクを<line-break>ディンガル皇帝に推し、自らその手助けをした。<line-break>しかしエリュマルクは彼に嫉妬し、１２の難事を<line-break>命ずる。それをことごとく成し遂げたネメアに<line-break>業を煮やしたエリュマルクは、無実の罪で死刑を<line-break>命じる。ここに至り、ネメアはエリュマルクを<line-break>見限り、放浪の旅に出るのだった。<end>"
english = "The Hero who defeated Balor and saved the world. After helping his uncle Eryumark become Dingal's emperor, Nemea is given the Twelve Labors and later condemned for a crime he did not commit. He abandons Eryumark and becomes a wanderer.<end>"

