japanese = "ディンガル帝国にある魔道アカデミーの１年生。<line-break>魔道アカデミー創立以来、最凶の劣等生である。<line-break>研究熱心なのだが、不器用で、いつもぶっとんだ<line-break>実験ばかりしているため、爆発事故が絶えない。<line-break>追試準備中に魔法実験に失敗、大爆発事故を起こ<line-break>し、アカデミーの校舎を吹き飛ばしてしまい、<line-break>現在、アカデミーから逃亡中である。<line-break>逃亡先でも魔法実験を繰り返しているらしい。<end>"
