["1260009"]
japanese = "ロストール攻略のため南下するディンガル軍を<line-break>迎撃すべく、総司令ノヴィン率いるロストール<line-break>軍は出撃する。その中にゼネテスの姿もあった。<line-break>ロストール軍はアンギルダンの山越え作戦の前に<line-break>敗れるが、ゼネテスは奇襲に備えて無傷であった<line-break>自分の部隊を中心に敗残兵を立て直し反撃する。<line-break>勝利に油断し陣形を崩していたディンガル軍は、<line-break>中枢を打ち破られ敗走する。<end>"
english = "Xenetes serves in Rostorl's army during the Rostorl Campaign. After Angeerdan defeats the army at the mountain crossing, he rallies the survivors around his unscathed unit and counterattacks. The Dingal Army breaks formation and retreats.<end>"

