japanese = "闇の神器である禁断の聖杯を盗んだとき、<line-break>その魔力で人語をしゃべるようになった３匹の<line-break>ゴブリンのひとり。人語はしゃべれても、元々<line-break>ゴブリンなので賢くはない。マルーンはその中<line-break>でも最弱でちょっとマヌケ。いつも他のふたりの<line-break>使い走りとなっている。<line-break><line-break>\u3000<end>"
