["1260029"]
japanese = "力の求道者。強い者と戦い、それを打ち破ること<line-break>を生きる目的としている。ネメアと出会い、<line-break>その強さにひかれ彼に従う。ネメアが闇の神器<line-break>探索の旅に出ると、オイフェ、ドルドラムと共に<line-break>ネメアに従い、<value:$28>と闇の神器の<line-break>争奪戦を行う。<line-break>\u3000<line-break>\u3000<end>"
english = "A seeker of strength whose purpose in life is to fight the strong and defeat them. Drawn to Nemea's strength upon meeting him, Zelig enters his service. When Nemea sets out in search of the Artifacts of Darkness, Zelig follows alongside Aoife and Doldrum, competing with <value:$28> to claim them.<end>"

