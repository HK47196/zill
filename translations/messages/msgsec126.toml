["1260004"]
japanese = "酒の臭いをさせ、無精ひげをはやし、だらしなく<line-break>胸をはだけて歩くという、無頼の男。<line-break>生まれつき身分の上下が存在し、<line-break>それを仕方がないとするロストールの貴族制度に<line-break>反発している。<line-break>その明るい人柄とざっくばらんなところから<line-break>冒険者や傭兵の間で特に人気がある。<line-break>\u3000<end>"
english = "A roguish man who reeks of alcohol and goes about unshaven, with his shirt carelessly open at the chest. He rebels against Rostorl's aristocratic system, which treats inequalities of birth as natural and unavoidable. His cheerful, forthright nature makes him especially popular among adventurers and mercenaries.<end>"

