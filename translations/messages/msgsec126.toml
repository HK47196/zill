japanese = "ワッシャー海賊キャプテン・カンダカンの娘。<line-break>海の冒険者といわれたカンダカンが、大好物の<line-break>シールミア貝を食べ過ぎて貝毒に当たり急死する<line-break>と、ひとり娘のヒルダリアが２代目キャプテンを<line-break>襲名する。偉大な父親の影を必死に追いかける<line-break>彼女だが、経験不足から父のように振る舞えない<line-break>自分を恥ずかしいと感じている。仁義や約束を<line-break>重んじ、果たせない約束は絶対に結ばない。<end>"
english = "Daughter of Washer Pirate captain Kandakan. After he dies of shellfish poisoning, Hildaria becomes captain. Ashamed of her inexperience, she strives to follow his example. She prizes honor and never makes a promise she cannot keep.<end>"

