["1260259"]
japanese = "剣聖の称号を持つ最強の戦士。<line-break>かつて勇者ネメアと戦って引き分けたとも、<line-break>ネメアと共に魔王バロルと戦ったとも噂される。<line-break>彼は強者との戦いを好み、リベルダムの闘技場で<line-break>ライバルを求め戦い続けている。<line-break>伝説の英雄イグザクスの愛用した武器と<line-break>伝えられる２本の剣、剛刃と閃刃を持つ。<line-break><end>"
english = "The mightiest warrior, bearing the title of Sword Saint. Rumor has it that he once fought the Hero Nemea to a draw, and that he fought alongside Nemea against Balor, Demon King. He relishes fighting the strong and continues to battle in Liberdam's arena in search of a rival. He carries two swords, Mighty Blade and Flash Blade, said to have been favored by the legendary hero Igzax.<end>"

