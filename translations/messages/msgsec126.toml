["1260049"]
japanese = "ロストールの貴族でルブルグ伯爵。王家の分家<line-break>リューガ家の血筋で、レムオンの従弟にあたる。<line-break>無能だが、それ故にプライドだけは異常に高い。<line-break>弱い者いじめが好きで、イヤなことがあると<line-break>自分に決して逆らえないスラムの住人に乱暴を<line-break>働き、時にはリベルダムから買い求めた<line-break>戦闘用モンスターをけしかけるなど、<line-break>非道の限りをつくす最低な男。<end>"
english = "A Rostorl noble and Count of Ruburg, descended from House Ryuga. Incompetent yet proud, Tarteuba bullies the weak and brutalizes Slums residents, even setting Liberdam combat monsters on them. He is thoroughly vile.<end>"

