["1260044"]
japanese = "破壊神の復活を目論むシスティーナの伝道師の<line-break>ひとり。ディンガル帝国のバロル帝に闇の力で<line-break>統治するように勧め、バロルを闇におとした。<line-break>バロルに与えた以下の予言、バロルは娘の子に<line-break>滅ぼされる。死より生まれし獅子が槍の主を<line-break>殺す。死の獅子に我らの主は降り神を倒す。<line-break>ザギヴがディンガルを統治する。の４つは有名。<line-break>バロルがネメアに倒されると逃亡する。<end>"
english = "A Sistina missionary seeking to revive the God of Destruction. He led Emperor Balor into darkness and gave him four famous prophecies, including that Balor would fall to his daughter's child. When Nemea defeats Balor, Zophor flees.<end>"

