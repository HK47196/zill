japanese = "ロセン王国の王。かつて、ディンガル帝国へ侵攻<line-break>した際に、ネメアに破れ、恐怖のあまりロセンの<line-break>城門を閉ざし、一切の人の出入りを禁じた。<line-break>そして国の予算はすべて軍事費につぎこみ、重税<line-break>で国民を苦しめていた。村娘をさらい、<line-break>モンスターのエサにするなど、非道の限りを<line-break>つくすものの、ディンガル帝国青竜将軍カルラの<line-break>攻撃によりロセン王国は滅び、彼は処刑される。<end>"
