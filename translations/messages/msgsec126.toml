["1260034"]
japanese = "ロストールの王。妻はファーロス家のエリス。<line-break>その間に娘ティアナをもうける。彼の兄である<line-break>先王が死んだとき、先王の子であるアトレイアは<line-break>まだ生まれていなかった。彼は、名家の娘エリス<line-break>を娶る事で強力な後ろ盾を得、王になる。<line-break>その時、愛のない結婚をしたことが彼に罪悪感を<line-break>抱かせ、それがエリスやティアナに対する冷たい<line-break>態度や政治への無関心に結び付いている。<end>"
english = "King of Rostorl, husband of Eris, and father of Tiana. He became king with House Pharos's backing after marrying Eris. Guilty over their loveless marriage, he is cold toward Eris and Tiana and indifferent to politics.<end>"

