japanese = "ディンガル帝国の宰相。ネメアの親友で<line-break>異常なほどに彼を慕い、忠実である。<line-break>バロル死後、エリュマルク帝の時代から政務を<line-break>統括する。エリュマルクに処刑されそうになった<line-break>ネメアが帝国を去るとエリュマルクを見限り、<line-break>密かにネメアを皇帝として受け入れる準備する。<line-break>ネメアが帝位につくと、その腹心としてネメアの<line-break>意思通りに帝国を動かす。<end>"
english = "Dingal's chancellor and Nemea's devoted friend. After Balor dies, he serves under Eryumark but secretly prepares for Nemea's return. When Nemea takes the throne, Beelzeva becomes his closest confidant and directs the empire.<end>"

