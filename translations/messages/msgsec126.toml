["1260069"]
japanese = "神官崩れの冒険者。金になる仕事であれば、<line-break>どんなことでも何でもやる男。本人はそれほど<line-break>腕は立たないのだが、双子の美人で腕の立つ妹<line-break>ヴァイライラとヴィアリアリがいて、危機に<line-break>陥ると助けてくれる。彼は何よりもまず、<line-break>この妹たちを大切にしている。ちなみに２番目に<line-break>大切なのは金。３番目が母親。<line-break>賭事には、からっきし弱いらしい。<end>"
english = "A former priest turned adventurer who will do absolutely anything if it pays. He is not especially capable himself, but his beautiful and highly skilled twin younger sisters, Vailaila and Vialiali, come to his aid whenever he is in danger. He values his sisters above all else. Money comes second, and his mother third. He also seems to be hopeless at gambling.<end>"

