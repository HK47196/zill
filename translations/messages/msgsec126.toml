["1260154"]
japanese = "分裂していたディンガル帝国を統一し、戦乱の世<line-break>に終止符を打った英雄。皇帝即位後は、特権階級<line-break>を廃し、大改革を行った。しかし、最愛の妻で<line-break>彼の心の支えでもあったキャスリオンの死を<line-break>きっかけに、闇の強大な力を使って魔王となる。<line-break>ゾフォルに蘇らせた部下の魔人たちを率い、<line-break>恐怖で世界を支配しようとするが、勇者ネメアと<line-break>彼に従う３人の仲間により倒される。<end>"
