["1260054"]
japanese = "ロストールの貴族。王家の分家リューガ家の出で<line-break>レムオンやエストの従兄弟にあたる。<line-break>無能だが、プライドだけは異常に高い。<line-break>弱い者いじめが好きで、何かイヤなことがあると<line-break>自分に決して逆らえない民に乱暴を働いていた。<line-break>ティアナ王女に横恋慕し、恋敵であるゼネテスと<line-break>レムオンに嫉妬するあまり、怪物と化して彼らに<line-break>襲いかかるが、<value:$28>に倒された。<end>"
english = "A House Ryuga noble and Lemghon's cousin. Though incompetent, he bullies the weak. Infatuated with Princess Tiana, he becomes jealous of Xenetes and Lemghon, turns into a monster, and attacks them before <value:$28> defeats him.<end>"

