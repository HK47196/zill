["1260124"]
japanese = "エリュマルクを見限り放浪の旅に出たネメアは、<line-break>破壊神ウルグの復活を図る魔人バルザーを倒す。<line-break>そこで彼はゾフォルの予言について知る。<line-break>それによれば、破壊神ウルグが降臨するのは、<line-break>他ならぬネメアにであり、この運命を変えること<line-break>はできないという。その後、ネメアは帝都に戻り<line-break>エリュマルクを殺し帝位につくと、新たに任命し<line-break>た４人の将軍に世界統一を命じるのだった。<end>"
english = "While wandering, Nemea defeats Baltzer, who seeks to revive Urg. He learns Urg will descend upon him, then returns to kill Eryumark and become Dingal's emperor. He appoints four generals to unify the world.<end>"

