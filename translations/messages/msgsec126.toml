["1260024"]
japanese = "精神を斬る妖刀月光を操る剣士。<line-break>かつて自分が唯一認めた男ロイと冒険し、<line-break>妖刀月光と聖剣日光を発見する。<line-break>ふたりは友情の証としてセラは月光を<line-break>ロイは日光をそれぞれ所有することにする。<line-break>行方不明の姉シェスターを捜すうちに、<line-break><value:$28>に出会い、ともに旅をすること<line-break>になる。<end>"
english = "Sera wields Moonlight, a Demon Blade that cuts the spirit. He and Roy found Moonlight and the Holy Sword Sunlight, then each took one as a token of friendship. Seeking his missing sister Shester, Sera meets <value:$28> and becomes a companion.<end>"

