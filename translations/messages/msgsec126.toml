japanese = "ロストール王家の分家リューガ家の当主で公爵。<line-break>母親がダルケニス族で、自分もそうであることを<line-break>隠していたが、エリス王妃の雇ったツェラシェル<line-break>によって暴かれてしまう。<line-break>ダルケニス族は人間に恐れられており、<line-break>レムオンの母親も冒険者によって殺されている。<line-break>弟のエストとは、母親が違う。<line-break>\u3000<end>"
english = "A duke and head of House Ryuga, a cadet branch of the Rostorl Royal House. His mother was a Darkenith, and he concealed that he was one as well, but Zelashell, hired by Queen Eris, exposed the truth. Humans fear the Darkenith, and Lemghon's mother was killed by adventurers. He and his younger brother Est have different mothers.<end>"

