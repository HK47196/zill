["1260254"]
japanese = "もとは施文院の告死天使。ネメア暗殺に失敗し、<line-break>その恐怖から感情に目覚めた。<line-break>行き倒れになっているところをノエルに介抱され<line-break>それ以来、ノエルを影から守るようになる。<line-break>レイヴンはノエルの元を去るとき、その記憶を<line-break>奪い去った。施文院の秘密を知る者には<line-break>告死天使の魔の手が伸びるからである。<line-break>\u3000<end>"
english = "Formerly an Angel of Death from the Shimon Institute. After failing to assassinate Nemea, Raven's fear awakened emotion in him. Noel found him collapsed by the roadside and cared for him, and Raven thereafter protected Noel from the shadows. When Raven left Noel, he took away her memories, for the Angels of Death come for anyone who knows the Shimon Institute's secrets.<end>"

