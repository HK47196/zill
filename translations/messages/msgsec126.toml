["1260134"]
japanese = "自分に破壊神ウルグが降臨することを知った<line-break>ネメアは、その呪われた運命に逆らうため行動を<line-break>起こす。破壊神と戦うために人間の力を結集しよ<line-break>うと部下の将軍たちに世界統一を命じ、自らは<line-break>闇の神器を集める旅に出る。しかし、ゼグナ鉱山<line-break>でジュサプブロスにより次元のはざまに落とされ<line-break>てしまい行方不明となる。<value:$28>が<line-break>破壊神を倒した時、その呪縛から解放される。<end>"
english = "Knowing Urg will descend upon him, Nemea seeks the Artifacts of Darkness and orders his generals to unify the world. Jusapubros casts him into the Interdimensional Rift. When <value:$28> defeats Urg, Nemea is freed from the curse.<end>"

