japanese = "素早い身のこなしで敵を倒す、凄腕のシーフ。<line-break>もうひとりの無限のソウルの持ち主、ノエルに<line-break>影のようにつきしたがう。<line-break>ナーシェスはレイヴンのことを警戒しており<line-break>レイヴンのパーティー入りには反対していたが<line-break>カフィンとノエルの賛成でパーティに参加する<line-break>ことになった。<line-break>\u3000<end>"
english = "A master thief who dispatches enemies with swift, agile movements. Raven follows Noel, another bearer of the Infinite Soul, like a shadow. Narscess was wary of Raven and opposed allowing him into the party, but Coffin and Noel were in favor, so Raven ultimately joined.<end>"

