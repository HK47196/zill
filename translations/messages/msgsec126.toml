english = "A duke and head of House Ryuga, a cadet branch of the Rostorl Royal House. He also holds a claim to the throne. As the standard-bearer for nobles who oppose Queen Eris's attempts to concentrate power in House Pharos, he wages a cold war of intrigue against her at court. The archaeologist Est is his younger half brother.<end>"

