japanese = "東方諸国の盟主ロセン王国の王。リベルダムの<line-break>武器商人ロティやロストールのエリス王妃に<line-break>そそのかされて、ディンガル帝国に攻め込み、<line-break>略奪の限りを尽くした。このときカルラの両親を<line-break>殺している。ネメアに敗れると、恐怖のあまり<line-break>ロセンの城門を閉ざし、一切の人の出入りを<line-break>禁じた。そして国の予算はすべて軍事費に<line-break>つぎこみ重税で国民を苦しめている。<end>"
english = "King of Rocen and leader of the Eastern Nations. Incited by Lottie and Eris, he invaded Dingal and killed Karula's parents. Defeated by Nemea, he seals Rocen, spends its budget on the military, and crushes his people with taxes.<end>"

