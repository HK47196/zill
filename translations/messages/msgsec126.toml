["1260139"]
japanese = "破壊神ウルグの円卓騎士のひとり。本来は老いた<line-break>白豹の姿をしている。古代の魔法に通じている<line-break>ことから「名前を知るもの」の異名を持つ。<line-break>南の空に輝く猫座の老人星の精霊だったが、地に<line-break>没し、そのまま堕落して魔人となる。ゾフォルに<line-break>より復活し、魔王バロルの魔獣軍を率いるが、<line-break>ネメアに敗れ、オルファウスに猫の姿へ変えられ<line-break>てしまう。<end>"
english = "A Knight of the Round Table serving Urg. Nemo is an ancient white leopard called the One Who Knows Names. Revived by Zophor, he commands Balor's magical beasts, but Nemea defeats him and Orphaus turns him into a cat.<end>"

