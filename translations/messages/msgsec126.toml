["1260129"]
japanese = "ディンガル皇帝として即位したネメアは、<line-break>部下の将軍たちに世界統一を命じる。<line-break>そして自分自身は、オイフェ、ドルドラム、<line-break>ゼリグを伴い、世界中に眠る闇の神器を<line-break>探し求める旅に出る。<line-break>しかし、ゼグナ鉱山におけるジュサプブロスとの<line-break>戦いで、次元のはざまへ落とされてしまう。<line-break>\u3000<end>"
english = "After ascending the throne as emperor of Dingal, Nemea orders his generals to unify the world. Nemea personally sets out with Aoife, Doldrum, and Zelig to seek the Artifacts of Darkness lying dormant throughout the world. During a battle with Jusapubros in Zegna Mine, however, Nemea is cast into the Interdimensional Rift.<end>"

