["1260079"]
japanese = "ロストール王国の王女。<line-break>セルモノー王とエリス王妃の間のひとり娘で<line-break>ロストールの第一王位継承権保持者。<line-break>母エリスのやり方に反感を覚えており、自分は<line-break>エリスが、どこぞの男と浮気してできた子供だと<line-break>さえ思っている。エリスの意向で、ロストールの<line-break>名門貴族七竜家の筆頭ファーロス家の一人息子<line-break>とは許嫁どうしである。<end>"
english = "Princess of the Kingdom of Rostorl. The only daughter of King Selmono and Queen Eris, she is first in line to the Rostorl throne. She resents her mother Eris's methods and even believes herself to be the child of an affair Eris had with some unknown man. At Eris's behest, she is betrothed to the sole son of House Pharos, foremost among Rostorl's distinguished Seven Dragon Houses.<end>"

