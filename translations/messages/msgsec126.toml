["1260089"]
japanese = "ロストール王国の女王。<line-break>セルモノー没後王位を継承し、国事を司る。<line-break>騎士階級や平民から有能な人材を抜擢し、<line-break>体制の立て直しをはかる。<line-break>開かれた政治をめざし、リューガ邸で<line-break>市民とともに活動するなど多忙な日々を<line-break>送っている。<end>"
english = "Queen of the Kingdom of Rostorl. She succeeds to the throne after Selmono's death and conducts the affairs of state. Recruiting talented people from the knightly class and the common folk, she works to rebuild the government. She leads a busy life pursuing more open rule, including working alongside citizens at the Ryuga estate.<end>"

