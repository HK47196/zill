english = "A descendant of Priestess Uru, the Priestess of Fire who was one of the four priestesses of the ancient Magic Kingdom Ladras. Her true nature is that of an artificial human created by Shemhaza, an elder of Vulcane. After losing her role as guardian of the Spirit God's seat, she sets out with <value:$28> in search of a new role.<end>"

