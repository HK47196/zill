["1260074"]
japanese = "もとは施文院随一の暗殺者だったが、双子の妹、<line-break>ヴァイライラとヴィアリアリを施文院から抜け<line-break>させようとして、エルファスの怒りを買い、<line-break>呪いをかけられた。<line-break>この呪いは激痛とともに、少しづつ肉体から動く<line-break>力を奪っていき、最終的には死に至らしめる。<line-break>死期が近づいており、残される妹達を<line-break>悲しませないで消える方法を探しているようだ。<end>"
english = "Once Shimonin's finest assassin, he was cursed for trying to free his twin sisters, Vailaila and Vialiali. The curse causes agony, slowly paralyzes him, and will kill him. Near the end, he seeks a way to vanish without saddening them.<end>"

