["1260019"]
japanese = "剣狼の異名をとるほどの凄腕の剣士。兵を<line-break>操っては、朱雀将軍アンギルダンに続いて、青竜<line-break>将軍カルラまでも撃退したほどの名将である。<line-break>ロストールのクーデターで処刑されかけたが、<line-break><value:$28>に救出され、行動を共にする。<line-break>ロストールの守護神ともてはやされていたが、<line-break>ゼネテスはあい変わらず、酒と女と自由を愛する<line-break>ざっくばらんな冒険者のままである。<end>"
english = "The Sword Wolf is a peerless swordsman and commander. Condemned in Rostorl's coup, he is saved by <value:$28> and travels with his rescuer. Though called Rostorl's Guardian, Xenetes remains an easygoing adventurer devoted to drink, women, and freedom.<end>"

