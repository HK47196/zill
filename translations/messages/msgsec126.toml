japanese = "ネメアに仕えるドワーフの神官戦士。<line-break>戦神ソリアスを信仰している。<line-break>皇帝になったネメアのもと、オイフェ、ゼリグと<line-break>ともに闇の神器を求め、旅をする。<line-break>墓場を散歩し、墓標に人生を見るという、<line-break>風変わりな趣味を持つ。<line-break>\u3000<line-break>\u3000<end>"
english = "A Dwarf priest-warrior who serves Nemea and worships the War God Solias. After Nemea becomes emperor, Doldrum travels with Aoife and Zelig in search of the Artifacts of Darkness. He has the unusual hobby of strolling through graveyards and contemplating the lives represented by the gravestones.<end>"

