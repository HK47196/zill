["1260094"]
japanese = "当代一の刀鍛冶。<line-break>彼が鍛えた剣は、ドワーフ特有の繊細な彫り物が<line-break>施された美しい外見と、岩をも切り裂く切れ味を<line-break>備えた名剣として諸国の王や騎士に高く評価され<line-break>ていた。<line-break>ところが彼は、突然、武器を造ることをやめて<line-break>しまう。<line-break>\u3000<end>"
english = "The foremost bladesmith of the age. The swords he forged were prized by kings and knights of many lands as masterpieces, combining beautiful Dwarven engraving with edges sharp enough to cleave stone. Then, without warning, he stopped making weapons.<end>"

["1260095"]
