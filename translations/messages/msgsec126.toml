japanese = "魔道の塔に封印されたシャロームが、超人類を<line-break>生み出すという野望を達成するために、作り上げ<line-break>た人間。自らも人類の革新を信じ、ネメアこそが<line-break>人類を新たな存在へ導く者と確信する。<line-break>また、<value:$28>にも人類を導きうる資質<line-break>を見出し、力を貸すようになった。<line-break> <line-break> <end>"
