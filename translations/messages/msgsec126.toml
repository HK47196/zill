["1260084"]
japanese = "セルモノー王とエリス王妃の間のひとり娘で<line-break>ロストールの第一王位継承権保持者。<line-break>王女という役割をなくせば、自分というものが<line-break>ない、空虚な存在だとシャリに思いこまされ、<line-break>闇の王女に堕ちる。レムオンをそそのかし、<line-break>リューガの変を起こさせ、母エリスや<line-break>身のまわりの貴族を一掃した。世界を破滅させる<line-break>ために暗躍している。<end>"
english = "Rostorl's heir and Selmono and Eris's only daughter. Shalli convinces her she is nothing without being a princess, and she becomes the Princess of Darkness. She has Lemghon instigate the Ryuga Incident and works toward the world's destruction.<end>"

