["1260064"]
japanese = "ノーブル出身の少年で、<value:$28>の<line-break>生意気な弟。姉である<value:$28>のことを<line-break>尊敬しており、また、亡き父が遺した畑を大切に<line-break>思っている。少々シスターコンプレックスぎみ。<line-break>身分制度を後ろ盾に威張る貴族が大嫌いで、<line-break>領民に嫌がらせばかりするノーブルの悪代官<line-break>ボルボラに姉とともに立ち向かう。<line-break>\u3000<end>"
english = "A cheeky boy from Noble and <value:$28>'s younger brother. He admires his elder sister, <value:$28>, and treasures their late father's field. He despises nobles who abuse class privilege and helps her oppose Noble's corrupt magistrate Bolbora.<end>"

