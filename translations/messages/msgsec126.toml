japanese = "テラネの町出身の心優しいコーンス族の少年。<line-break>その外見から無意味な偏見を持たれており、<line-break>特に町の有力者でもある親友ヴァンの父親には<line-break>目の敵にされ、町の厄介者として疎まれていた。<line-break>ヴァンがガルドランという冒険者にケガを<line-break>負わされたとき、助けられなかったくやしさから<line-break>守りたい者を守るための力を求めて、<line-break>また友の仇をとるために旅に出る。<end>"
