["1260239"]
japanese = "初めて森を出て人間と冒険をしたエルフの女性。<line-break>８００年前、神聖王国の賢王アルキュオネらと<line-break>旅をした。邪竜エルアザルを倒したあと、彼女は<line-break>請われて聖都エンシャントに残り、アルキュオネ<line-break>のもとで清浄の時代という有史最高の時代を<line-break>築いた。彼女は冒険エルフの祖としてカリスマ<line-break>的存在となり、エルフたちに森を出て世界を見て<line-break>回るよう呼びかけている。<end>"
