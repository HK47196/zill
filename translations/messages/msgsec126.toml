["1260104"]
japanese = "エルフの魔道士。<line-break>もうひとりの無限のソウルの持ち主、ノエルを<line-break>見いだし、保護者のように付き添っている。<line-break>高慢で発言にトゲがあるが、ノエルパーティーの<line-break>参謀としてノエルに信頼されている。<line-break><value:$28>に対して意味ありげなセリフを<line-break>吐き、世界の何かを知っていると感じさせる。<end>"
english = "An Elven mage. After discovering Noel, the other bearer of an Infinite Soul, Narscess accompanies her like a guardian. Arrogant and sharp-tongued, he nevertheless has Noel's trust as the Noel Party's strategist. Cryptic remarks directed at <value:$28> suggest that he knows some secret about the world.<end>"

