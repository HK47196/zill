english = "<if><value:$01><equal>2Shalli is finally about to make his move in Ladras. Let's hurry. Esther is in danger.<end><if><value:$01><equal>3Esther and Shalli are both in Ladras. We must hurry, <value:$28>. We have to reach Ladras as quickly as we can.<end><if><value:$01><equal>4Lady Esther is a captive, waiting in Ladras for a prince to rescue her... Ah! But fate can be cruel. Perhaps it won't be a prince who comes to her rescue, but <value:$28>.<end><if><value:$01><equal>5Come on, <value:$28>! We're going to save Esther. I'm sure she's waiting for us to rescue her in Ladras.<end><if><value:$01><equal>13Leave it. We're merely rid of some deadweight... Though you'll go to the rescue regardless, won't you? Very well.<end><if><value:$01><equal>10Come on, sis, we have to hurry. Esther will be in danger if we don't get there soon. She's dealing with Shalli, after all.<end><if><value:$01><equal>14We must make haste for Ladras and rescue Esther. Shalli is our foe, after all. Who knows what he might do with Ladras's magical technology...<end><if><value:$01><equal>15Come on, let's go to Ladras. We have to save Esther.<end><if><value:$01><equal>17I've got it! It all makes sense! Of course it does―I'm a noble Elf! Shalli is after Ladras! Yes, he kidnapped Esther so he could seize its magical technology! To Ladras!<end><if><value:$01><equal>19We have to hurry, <value:$28>. We have to save Esther! We have to get to Ladras!<end><if><value:$01><equal>27Let's hurry, <value:$28>. To Ladras!<end><if><value:$01><equal>26Make haste! What is that wretch Shalli planning?<end><if><value:$01><equal>193We have to hurry, <value:$28>! We absolutely must save Esther!<end><if><value:$01><equal>191Let's go, <value:$28>. We have to hurry and save Esther. Who knows what Shalli might do...!<end><if><value:$01><equal>190We're going to save Esther! We have to hurry. Who knows what Shalli might do...<end>We're going to Ladras to save Esther, aren't we? We'd better hurry. We're dealing with Shal