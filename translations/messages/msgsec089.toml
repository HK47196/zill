["890000"]
japanese = "エステルメッセージVOL4開始<end>"
english = ""

["890001"]
japanese = "<value:$28>…さんだな？<end>"
english = "You're <value:$28>, aren't you?<end>"

["890002"]
japanese = "ま、待ってください！<line-break>私たちは怪しいものではありません！<line-break>その水晶、エステル様からもらったんですね？<end>"
english = "W-wait! We're not up to anything suspicious! Lady Esther gave you that crystal, didn't she?<end>"

["890003"]
japanese = "それは、エステル様ご自身の<line-break>意志でしか外れないもの。<line-break>あなた様を信用してお話しします。<line-break>私たちは砂漠の一族。<line-break>竜骨の砂漠奥深くにある魔道王国の遺産、<line-break>ラドラスに住まう者です。<end>"
english = "That crystal cannot be removed unless Lady Esther wills it. We trust you, so we will explain. We are the desert clan, inhabitants of Ladras, a legacy of the Kingdom of Sorcery deep within the Dragonbone Desert.<end>"

["890004"]
japanese = "そして、エステル様は<line-break>我ら砂漠の一族の族長なのです。<line-break>\u3000<end>"
english = "And Lady Esther is the chief of our desert clan.<end>"

["890005"]
japanese = "中世、世界は神聖王国と魔道王国に<line-break>大きく二分されていました。<line-break>魔道王国は魔道技術により栄えていました。\u3000\u3000<line-break>しかし、支配者層に内部分裂が起こり、<line-break>そこを神聖王国の征服王ラムゼーにつかれ、<line-break>滅亡してしまったのです。<end>"
english = "In the Middle Ages, the world was largely divided between the Holy Kingdom and the Kingdom of Sorcery. The Kingdom of Sorcery prospered through its sorcerous technology. But its ruling class split into opposing factions, and Ramsey, the Holy Kingdom's Conqueror King, seized the opportunity to destroy it.<end>"

["890006"]
japanese = "滅亡時、魔道王国の支配者のひとり、ズゥは<line-break>その魔道技術がラムゼーの手に渡るのを恐れ、<line-break>魔法で砂漠を作って魔道王国を砂に沈めました。<line-break>私たちは、その砂漠に埋もれた<line-break>魔道王国の遺産を、外部の人間から守るために<line-break>残された砂漠の一族なのです。<end>"
english = "As the kingdom fell, one of its rulers, Zuu, feared that its sorcerous technology would fall into Ramsey's hands. Using magic, Zuu created a desert and buried the Kingdom of Sorcery beneath the sands. We are the desert clan left behind to protect the kingdom's buried legacy from outsiders.<end>"

["890007"]
japanese = "無論、砂の上で生きられるわけはありません。\u3000<line-break>我々は、ラドラスで生活しているのです。<line-break>\u3000<line-break>ラドラスでは、砂漠の中にいるのが<line-break>ウソのように暮らしやすい環境になっていて、<line-break>食べ物も飲み物も用意してくれるのです。<end>"
english = "Naturally, we cannot live on the surface of the sands. We live in Ladras. Life there is so comfortable that it is hard to believe we are in the middle of a desert. Ladras even provides our food and drink.<end>"

["890008"]
japanese = "ただ、この技術が外部の者に渡らないように、<line-break>不定期的にラドラスが族長の血統の者が<line-break>ラドラス内にいるかを調べます。<line-break>ラドラス内に族長がいないと、ラドラスが<line-break>異邦人によって占拠されたと判断され、<line-break>魔道技術の秘密を守るため、砂に沈むのです。<end>"
english = "To keep this technology from falling into outside hands, Ladras checks at irregular intervals to ensure that someone of the chief's bloodline is present. If the chief is absent, Ladras concludes that outsiders have occupied the city and sinks beneath the sand to protect the secrets of its sorcerous technology.<end>"

["890009"]
japanese = "…そこで、族長であるエステル様なのです。\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>エステル様は好奇心がお強く、<line-break>よく、ラドラスを抜けて<line-break>砂漠の外へ冒険に出かけられます。<end>"
english = "That brings us to our chief, Lady Esther. She is intensely curious and often slips out of Ladras to go adventuring beyond the desert.<end>"

["890010"]
japanese = "それで九柱のチェックのために、エステル様を\u3000<line-break>連れ戻しにまいったおりにあなた様に出会い、<line-break>この前のようなことになってしまったのです。<line-break>責任感の強いお方ですので、<line-break>タイミングを見てはラドラスに戻って<line-break>チェックを受けてくださるのですが…<end>"
english = "When we came to bring Lady Esther back for the Nine Pillars' inspection, we encountered you, and that led to what happened before. She has a strong sense of responsibility, so she usually finds an opportunity to return to Ladras for the inspection, but...<end>"

["890011"]
japanese = "今回は、会いたい人がいるからと<line-break>聞き分けていただけず、<line-break>あのような事態になったのです。<end>"
english = "This time, she insisted that there was someone she wanted to see and refused to listen to us. That is how matters came to such a pass.<end>"

["890012"]
japanese = "まあ、あのときのことはもういいのです。<line-break>本題に入りましょう。<line-break>また、チェックの時が近づいております。<line-break>ですが、エステル様が戻られないのです。<line-break>我々はエステル様の身に<line-break>何か起こったのではと案じております。<end>"
english = "But never mind what happened then. Let us come to the point. Another inspection is drawing near, but Lady Esther has not returned. We fear something may have happened to her.<end>"

["890013"]
japanese = "エステル様に水晶を託された<line-break>あなた様を信用してお願いいたします。<line-break>どうか、エステル様を捜してください。\u3000\u3000<line-break>その水晶は、エステル様の首飾りと<line-break>引き合います。今、エステル様を捜せるのは<line-break>あなた様だけなのです。<end>"
english = "Lady Esther entrusted that crystal to you, so we place our trust in you as well. Please, find her. The crystal is drawn to Lady Esther's necklace. You are the only person who can find her now.<end>"

["890014"]
japanese = "エステル様が戻らなければ、<line-break>我々はあと１ケ月で、ラドラスもろとも\u3000\u3000<line-break>砂に沈むことになります。<line-break>どうか、エステル様を捜してください。<line-break>あと１ケ月しかないんです。<line-break>お願いします、<value:$28>さん。<end>"
english = "If Lady Esther does not return, then one month from now we will sink beneath the sand along with Ladras. Please find her. We have only one month left. I beg you, <value:$28>.<end>"

["890015"]
japanese = "ありがとうございます。<line-break>どうか、よろしくお願いします。<end>"
english = "Thank you. We are counting on you.<end>"

["890016"]
japanese = "（反応した…。リベルダムから<line-break>\u3000そう遠くないダンジョンだな…。）<end>"
english = "(It reacted... That dungeon isn't far from Liberdam...)<end>"

["890017"]
japanese = "大変だ、<value:$28>！<line-break>エステルがシャリにさらわれちゃった！<end>"
english = "<value:$28>, it's terrible! Shalli kidnapped Esther!<end>"

["890018"]
japanese = "<value:$28>、<line-break>それは…？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>お姉ちゃんの首飾り…。<line-break>これでお姉ちゃんの居所が<line-break>わかるんだね？<end>"
english = "<value:$28>, what's that...? Sis's necklace... We can use it to find out where she is, right?<end>"

["890019"]
japanese = "…竜骨の砂漠の真ん中…。<end>"
english = "The middle of the Dragonbone Desert...<end>"

["890020"]
japanese = "ラドラスのあたりだよ？<line-break>どうなってるの？\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>ねぇ、<value:$28>、<line-break>とにかく助けに行かなきゃ！<end>"
english = "That's near Ladras, isn't it? What's going on? Come on, <value:$28>, we have to go save her!<end>"

["890021"]
japanese = "僕、とにかく、情報をあつめるよ。<line-break>用があったら猫屋敷で呼んで。じゃね！<end>"
english = "I'll start gathering information. If you need me, call for me at Cat Manor. See you!<end>"

["890022"]
japanese = "<value:$28>様！<line-break>エステル様が、エステル様が！<line-break>シャリという魔術師にさらわれてしまいました！<end>"
english = "<value:$28>! Lady Esther... Lady Esther has been kidnapped by a sorcerer named Shalli!<end>"

["890023"]
japanese = "それは…エステル様の首飾りの水晶…。\u3000\u3000<line-break>それがあればエステル様の居場所が<line-break>わかるはず…。<end>"
english = "That is... the crystal from Lady Esther's necklace. With it, we should be able to find her...<end>"

["890024"]
japanese = "…竜骨の砂漠の真ん中…。<line-break>我らがラドラス…？\u3000バカな！\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "The middle of the Dragonbone Desert... Our Ladras...? Impossible!<end>"

["890025"]
japanese = "お姉ちゃんの首飾りが…。<line-break>これでお姉ちゃんの居所が<line-break>わかるんだね？<end>"
english = "Sis's necklace... We can use it to find out where she is, right?<end>"

["890026"]
japanese = "…竜骨の砂漠の真ん中…。\u3000<line-break>ラドラスのあたりだよ？<line-break>どうなってるの？<line-break>ねぇ、<value:$28>、<line-break>とにかく助けに行かなきゃ！<end>"
english = "The middle of the Dragonbone Desert... That's near Ladras, isn't it? What's going on? Come on, <value:$28>, we have to go save her!<end>"

["890027"]
japanese = "（…ここには確か、<line-break>\u3000地の精霊神の座所への道が…。）<end>"
english = "(If I remember correctly, there is a path here leading to the Seat of the Earth Spirit God...)<end>"

["890028"]
japanese = "（エステルは、ここに、<line-break>\u3000いるのかもしれない…）<end>"
english = "(Esther might be here...)<end>"

["890029"]
japanese = "ラドラスのチェックを受けている間は、<line-break>エステル様は外に出られないのです。<line-break>お待ちください。<end>"
english = "Lady Esther cannot go outside while Ladras is carrying out its inspection. Please wait.<end>"

["890030"]
japanese = "おかげでチェックに間に合ったよ。<line-break>ありがとう、<value:$28>。<line-break>\u3000<line-break>ねぇ、ちょっと座って話そっか。<end>"
english = "Thanks to you, I made it in time for the check. Thank you, <value:$28>. Hey, why don't we sit down and talk for a bit?<end>"

["890031"]
japanese = "あ、この衣装？<line-break>巫女の正装なんだ。<line-break>似合う？<end>"
english = "Oh, this outfit? It's a priestess's formal dress. Does it suit me?<end>"

["890032"]
japanese = "えへへ、ありがと。<line-break>ねえ、座らない？<end>"
english = "Hehe, thanks. Hey, want to sit down?<end>"

["890033"]
japanese = "チェックが終わったあと、<line-break>ボク、いつもここに来るんだ。<line-break>\u3000<line-break>ここは、ラドラスから外が見える<line-break>たったひとつの場所だから。<line-break>\u3000<end>"
english = "I always come here after the check. It's the only place in Ladras where you can see the world outside.<end>"

["890034"]
japanese = "ラドラスはね、古代の魔道王国の<line-break>遺産のおかげで、砂漠の真ん中でも<line-break>生活できる環境が整えられているんだ。<line-break>だから飲み物にも食べ物にも<line-break>困ったことがない…。<line-break>\u3000<end>"
english = "The legacy of the ancient magical kingdom makes Ladras livable even in the middle of the desert. We've never had to worry about food or drink...<end>"

["890035"]
japanese = "でもボクたちは、古代の魔道王国の遺産<line-break>っていうのが、他にどんなすごいことを<line-break>秘めているのか、知らないんだ。<line-break>動いているのも、このラドラスの<line-break>居住システムだけ。<line-break>他の魔道文明は眠ったまんまさ。<end>"
english = "But we have no idea what other wonders the legacy of the ancient magical kingdom might hold. The only thing still operating is Ladras's habitation system. The rest of its magical civilization remains dormant.<end>"

["890036"]
japanese = "魔道王国の遺産は、魔道王国を支配した<line-break>４人の巫女の血を引く者が集まった時、<line-break>復活するという…。<line-break>ボクは一応、ここの族長なんだけど、<line-break>それでも、そういう巫女とか、<line-break>遺産とかのことはよく知らないんだ。<end>"
english = "They say the legacy of the magical kingdom will awaken when the descendants of the four priestesses who ruled it come together... I'm supposed to be the chief here, but even I don't know much about those priestesses or the legacy.<end>"

["890037"]
japanese = "それでも復活の日まで、<line-break>ボクたちはこのラドラスに飼われて、<line-break>ここを守り続けなくちゃならない。<line-break>それが運命…ってやつ。<line-break><line-break><end>"
english = "Even so, until the day it awakens, Ladras will keep us penned up here, and we'll have to go on guarding it. That's what they call fate...<end>"

["890038"]
japanese = "うんざりだ。<line-break>ボクはそんなことのためだけに<line-break>生きていくなんて気はない。<line-break>こんな所でずっと、誰かのために<line-break>埋もれて生きていくなんて…<line-break>がまんできないんだ。<end>"
english = "I'm sick of it. I won't live my whole life just for that. I can't stand the thought of staying buried in a place like this forever, living for someone else...<end>"

["890039"]
japanese = "ね、また、一緒に旅をしよ？<line-break>いいでしょ？<line-break>\u3000<end>"
english = "Hey, let's travel together again. All right?<end>"

["890040"]
japanese = "パーティーに加える<end>"
english = "Add Esther to the party<end>"

["890041"]
japanese = "今はいい<end>"
english = "Not right now<end>"

["890042"]
japanese = "がんばるからね。<line-break>出発するときに、合流するよ。<line-break>じゃあ、あとでね。<end>"
english = "I'll do my best. I'll meet up with you when you're ready to leave. See you later.<end>"

["890043"]
japanese = "うん、わかった。<line-break>じゃあ、猫屋敷で呼んでね。<line-break>待ってるから。<end>"
english = "All right. Then call for me at Cat Manor. I'll be waiting.<end>"

["890044"]
japanese = "じゃあ、猫屋敷で呼んでね。<line-break>待ってるから。<line-break>\u3000<end>"
english = "Then call for me at Cat Manor. I'll be waiting.<end>"

["890045"]
japanese = "こんばんは、エステル。<line-break>ごきげんはいかが？<end>"
english = "Good evening, Esther. How are you?<end>"

["890046"]
japanese = "シャリ！<end>"
english = "Shalli!<end>"

["890047"]
japanese = "うわ、嫌われたもんだなあ。<line-break>僕は君に会うために<line-break>飛んできたってのにさ。<line-break>ねえ、エステル。<line-break>君って、<value:$28>の<line-break>役に立ってるの？<end>"
english = "Wow, you really do hate me. And after I came flying all this way just to see you. Tell me, Esther―are you any use to <value:$28>?<end>"

["890048"]
japanese = "な…！<line-break>いきなり何を言い出すんだよ！？<end>"
english = "Wh-what?! Where did that come from?!<end>"

["890049"]
japanese = "ほら、こうやって君はいつも<line-break><value:$28>に支えられてる。<line-break>もしかして、足手まといなんじゃない？<end>"
english = "See? <value:$28> is always the one supporting you. Maybe you're just getting in the way.<end>"

["890050"]
japanese = "………………！<end>"
english = "...!<end>"

["890051"]
japanese = "だから僕はね、エステル。<line-break>君の本当の力を引き出してあげたいと<line-break>思って、君を迎えに来たんだ。<line-break>君は古代魔道王国ラドラスの<line-break>４人の巫女のひとり、<line-break>ズゥの血を引く地の巫女なんだよ。<end>"
english = "That's why I've come to take you with me, Esther. I want to bring out your true power. You're the Earth Maiden, descended from Zuu―one of the four maidens of the ancient Magic Kingdom Ladras.<end>"

["890052"]
japanese = "………………！？<end>"
english = "…!?<end>"

["890053"]
japanese = "君は本当はすごい魔力を持っているし、<line-break>古代の魔道文明だってよみがえらせる<line-break>力を持っているんだよ。<line-break>なのに、君は全然それに気付かずに<line-break>そうやって毎日を過ごしてる。<end>"
english = "You possess tremendous magical power. You even have the power to revive the ancient magical civilization. Yet you've gone on living day after day without ever realizing it.<end>"

["890054"]
japanese = "ありゃりゃ。<line-break>なんだか、エステル連れて行くのが\u3000<line-break>気まずい感じになっちゃったな。<line-break>ま、今はそんなに急いでないから<line-break>出なおしてくることにするよ。<line-break>じゃあねーん。<end>"
english = "Whoops. Taking Esther with me now would be rather awkward. Well, I'm not in any great hurry, so I'll come back another time. See you!<end>"

["890055"]
japanese = "ボクが…地の巫女…？<line-break>魔道王国ラドラスの巫女…？<end>"
english = "I'm... the Earth Maiden? A maiden of Magic Kingdom Ladras...?<end>"

["890056"]
japanese = "あ、アハハ…、ゴメン。<line-break>ちょっと、面食らっちゃった。<line-break>\u3000<line-break>シャリもいなくなったし<line-break>もう大丈夫だよ。<line-break>さ、寝よ寝よ。<end>"
english = "Ah, haha... sorry. That caught me off guard. Shalli's gone now, so everything's fine. Come on, let's get some sleep.<end>"

["890057"]
japanese = "き、キミは…シャリ！！<end>"
english = "Y-you're... Shalli!!<end>"

["890058"]
japanese = "空中都市ラドラス、<line-break>それを復活させるためには<line-break>４人の巫女が必要なんだ。<line-break>ねえ、エステル。<line-break>君が必要なんだ。<line-break>一緒に来てくれないかな？<end>"
english = "It takes four priestesses to restore the Floating City Ladras. Esther, I need you. Won't you come with me?<end>"

["890059"]
japanese = "誰がキミなんかと！<line-break>絶対、お断りだよ！！<end>"
english = "Like I'd ever go anywhere with you! Absolutely not!!<end>"

["890060"]
japanese = "大体、巫女ってなんだよ！？<line-break>ボクはそんなのじゃないよ！<end>"
english = "And what's all this about priestesses!? I'm not one of them!<end>"

["890061"]
japanese = "あれ、まだ知らないんだっけ？<line-break>君って、古代の巫女の血を引く<line-break>ラドラスの地の巫女なんだよ。<end>"
english = "Oh, you still don't know? You carry the blood of the ancient priestesses. You're the priestess of the land of Ladras.<end>"

["890062"]
japanese = "な！？<line-break>なんなんだよいきなり！！\u3000\u3000<line-break>\u3000<line-break>ボクはエステル！<line-break>確かにラドラス生まれだけど、<line-break>巫女なんて知るもんか！！<end>"
english = "What!? Where did that come from!? I'm Esther! Sure, I was born in Ladras, but I don't know anything about being a priestess!!<end>"

["890063"]
japanese = "やれやれ、<line-break>君って僕のことを<line-break>ホントに邪険にするんだね。<line-break>でも、来てもらうよ。<line-break>空中都市ラドラスが飛ぶことは<line-break>願いだからね。<end>"
english = "Honestly, you really don't want anything to do with me, do you? But you're coming anyway. The wish is for the Floating City Ladras to fly.<end>"

["890064"]
japanese = "ラドラスが…飛ぶ？<line-break>…空中都市だって？<line-break>そんなこと…。<line-break>…仮にキミの言ってることが<line-break>正しいとして、ラドラスを飛ばすことが<line-break>キミの願いなのか！？<end>"
english = "Ladras... will fly? You mean it's really a Floating City? That's... Even if what you're saying is true, is making Ladras fly your wish!?<end>"

["890065"]
japanese = "…僕の願い？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ううん、違うよエステル。<line-break>僕に願いなんかはないよ。<line-break>これは君の祖先たちの願いさ。<line-break>これを飛ばすことを願いつつ消えた<line-break>幾千幾万もの生命の遠い願い…。<end>"
english = "My wish? No, Esther. I don't have any wishes. This is the wish of your ancestors―the distant wish of the thousands upon tens of thousands of lives that vanished longing to see it fly...<end>"

["890066"]
japanese = "<value:$28>！！<end>"
english = "<value:$28>!!<end>"

["890067"]
japanese = "やっぱり来たね、<value:$28>。<line-break>もうお互い全然新鮮味がないね。\u3000<line-break>こういう展開ってさ。<line-break>君は、僕がまた怪物を呼び出して<line-break>君と戦わせたりするって思ってる。<line-break>そうでしょ？<end>"
english = "I knew you'd come, <value:$28>. This sort of thing has become rather predictable for both of us, hasn't it? You think I'm going to summon another monster and make you fight it. Am I right?<end>"

["890068"]
japanese = "でも、今回はちょっと趣向を変えて\u3000<line-break>そういうまどろっこしいのは<line-break>なしで行こうかな。<line-break>お互い、面倒なのはイヤでしょ？<line-break>じゃ、エステルはもらっていくから。<line-break>バイバ～イ。<end>"
english = "But I think I'll change things up this time and skip all that tedious business. Neither of us wants the bother, right? So I'll just take Esther. Bye-bye!<end>"

["890069"]
japanese = "ハァイ、エステル。<line-break>相変わらず元気そうだね。<end>"
english = "Hi, Esther. Looking lively as ever.<end>"

["890070"]
japanese = "…シャリ！<end>"
