english = "<if><value:$01><equal>2We have to hurry, <value:$28>. Esther's in danger. I just have this feeling. Of course she's in danger if she's been kidnapped, but there's more to it than that... I feel as if something terrible is about to happen in this tower...<end><if><value:$01><equal>3We must hurry, <value:$28>. We must reach those towers as swiftly as we can.<end><if><value:$01><equal>4Lady Esther is a captive, waiting in that tower for a prince to rescue her... Oh! But fate can be so cruel. Instead of a prince, she may find <value:$28> coming to her rescue.<end><if><value:$01><equal>5Let's go, <value:$28>! We've got to save Esther. I'm sure she's waiting for us to rescue her, right in the middle of the Dragonbone Desert.<end><if><value:$01><equal>13Forget it. We're simply rid of dead weight... Still, you're going to rescue her anyway, aren't you? Fine.<end><if><value:$01><equal>10Let's hurry, Sis. Esther will be in danger if we don't get there soon. Shalli's the one we're dealing with, after all.<end><if><value:$01><equal>14We must get there as swiftly as we can and rescue Esther. Shalli is the one we're dealing with. Who knows what he might do...<end><if><value:$01><equal>15Come on, let's go. We have to save Esther.<end><if><value:$01><equal>17I've got it! It just came to me! Of course it did―I am a noble Elf! Shalli is after that tower! And yes, yes, that's it! Esther has some connection to it too! We're going to Ladras!<end><if><value:$01><equal>19Let's hurry, <value:$28>. We have to save Esther!<end><if><value:$01><equal>27Let's hurry, <value:$28>. To Ladras!<end><if><value:$01><equal>26Hurry! What is that wretch Shalli plotting?<end><if><value:$01><equal>193We have to hurry, <value:$28>! We absolutely must save Esther!<end><if><value:$01><equal>191Let's go, <value:$28>. If we don't save Esther quickly, who knows what Shalli might do...!<end><if><value:$01><equal>190We're going to rescue Esther! If we don't hurry, who knows what Shalli might do...<end>You're going to the Dragonbone Desert, aren't you? To look for Esther. We'd better hurry. We're up against Shalli.<end>"

