e:$01><equal>193Esther's Crystal... Of course! This will tell us where she is! Hmm, something's appearing... Is that the Dragonbone Desert? But what is this tower...?<end><if><value:$01><equal>191I knew you could do it, <value:$28>. We can use Esther's Crystal to find her. Something's appearing. Is that the Dragonbone Desert? But what is this cluster of towers...?<end><if><value:$01><equal>190Esther's Crystal? Can it tell us where Esther is? I can see something. Is that the Dragonbone Desert? But what is this cluster of towers...?<end>Esther's Crystal! Oh, right! Maybe this can tell us where Esther is. Look, look! Something's appearing. It's the Dragonbone Desert, and there's a cluster of towers... Could it be the Floating City sung of in legend...?<end>"

