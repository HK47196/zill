["1080000"]
japanese = "（エンシャントの南東にある賢者の森。<line-break>\u3000その奥深くに猫屋敷と呼ばれる<line-break>\u3000誰も近づけない館があるらしい）<line-break>（噂によると、唯一運命に選ばれた者<line-break>\u3000だけが、猫屋敷を見つけることが<line-break>\u3000できるという）<end>"
