["1720087"]
japanese = "この町は、守られたのですね。<line-break>でも、イークレムン様は…。<end>"
english = "So the town has been saved. But Iiklmn...<end>"

["1720088"]
japanese = "ネメアにより西方攻略を命じられた\u3000<line-break>白虎将軍ジラークは、\u3000\u3000\u3000\u3000<line-break>難航不落といわれたアキュリュースを<line-break>ほぼ無傷のまま支配下に収めた。<end>"
english = "Ordered by Nemea to conquer the west, White Tiger General Zsilak brought the supposedly impregnable Aqyurius under his control almost entirely intact.<end>"

["1720089"]
japanese = "この作戦に貢献したシャリと名乗る<line-break>傭兵は、報酬として水の巫女の少女を<line-break>要求。彼女を連れていずこかへと<line-break>姿を消した。<end>"
english = "A mercenary calling himself Shalli, who had contributed to the campaign, demanded the Water Priestess, a young girl, as his reward. He then vanished with her, bound for parts unknown.<end>"

["1720090"]
japanese = "アンギルダンは\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ジラークとたもとを分かち、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>娘である水の巫女イークレムンを\u3000\u3000\u3000\u3000\u3000\u3000<line-break>取り戻すための旅の道を踏み出した。\u3000\u3000\u3000\u3000<end>"
english = "Angeerdan broke with Zsilak and set out on a journey to bring back his daughter Iiklmn, the Water Priestess.<end>"

["1720091"]
japanese = "\u3000\u3000\u3000一方、ジラークは大陸統一構想に従い\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000大陸北西部への進軍を計画。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000神聖都市アルノートゥン攻略に向けて\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000準備を始めていた。\u3000\u3000\u3000\u3000<end>"
english = "Meanwhile, following the plan to unify the continent, Zsilak planned an advance into the northwest and began preparing to capture the sacred city of Alnortun.<end>"

["1720092"]
japanese = "さて、邪魔が入ったが<line-break>先程までの話の続きだ。<line-break>\u3000<line-break>我々の支配下に<line-break>入ってはくれないかね？<end>"
english = "Now, despite that interruption, let us return to our discussion. Will you accept our rule?<end>"

["1720093"]
japanese = "な、何をバカなことを…っ！<end>"
english = "Wh-What nonsense...!<end>"

["1720094"]
japanese = "誰も傷つかないことが\u3000\u3000\u3000\u3000\u3000\u3000<line-break>イークレムン様の望み…。<line-break>\u3000<line-break>あなたがたに従いましょう。<line-break>ただし、街の人々の生活は<line-break>決しておびやかさないでください。<end>"
english = "Lady Iiklmn wished for no one to be hurt... We will submit to you. But you must never threaten the townspeople's way of life.<end>"

["1720095"]
japanese = "約束しよう。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>今後の支配については<line-break>後日あらためてお話しする。<line-break>では、失礼。<end>"
english = "You have my word. We will discuss the details of our rule another day. Now, if you will excuse me.<end>"

["1720096"]
japanese = "…年甲斐もなく<line-break>熱くなりすぎた…かの。<line-break>どうやらここが限界らしいわい。<line-break><value:$28>、<line-break>頼む、イークレムンを…いや、<line-break>わしの娘を助けてやってくれ。<end>"
english = "Perhaps I let myself get too worked up for a man my age... It seems this is as far as I go. <value:$28>, please. Save Iiklmn... No, save my daughter.<end>"

