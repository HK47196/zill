["1720000"]
japanese = "イークレムン\u3000Ｖ５－１\u3000開始<end>"
english = ""

["1720001"]
japanese = "おお。<value:$28>。<line-break>今から、ジラークにひとつ<line-break>言うてやろうと思っておるところじゃ。<line-break>ちょうどよい。<line-break>お主も来てくれ。<end>"
english = "Ah, <value:$28>. I was just about to have a word with Zsilak. Your timing is good. Come with me.<end>"

["1720002"]
japanese = "また、卿か。<end>"
english = "You again?<end>"

["1720003"]
japanese = "この状況、いかがするおつもりか？<line-break>このままでは、<line-break>いたずらに時と兵を損じるだけだ。<end>"
english = "What do you intend to do about this? At this rate, all we'll do is waste time and lose men.<end>"

["1720004"]
japanese = "無用な心配だ。<line-break>すでに手は打っている。<line-break>傭兵を雇った。強力な魔術師だ。\u3000<line-break>名をシャリという。<line-break>これをもって湖の大蛇に対応する。<line-break>進軍開始は明朝、以上だ。<end>"
english = "There's no cause for concern. I've already taken action. I hired a mercenary, a powerful sorcerer named Shalli. He will deal with the great serpent in the lake. The advance begins tomorrow morning. That is all.<end>"

["1720005"]
japanese = "アンギルダン将軍は<line-break>お帰りだそうだ。<line-break>お連れせよ。<end>"
english = "I hear General Angeerdan is leaving. Escort him out.<end>"

["1720006"]
japanese = "申しわけありません、将軍。<line-break>我々も白虎将軍のやり方には<line-break>不満なのですが…。<end>"
english = "Forgive us, General. We are none too pleased with the White Tiger General's methods either, but...<end>"

["1720007"]
japanese = "…わかっておる。<line-break>何も言わんでよい。<end>"
english = "I know. You needn't say anything.<end>"

["1720008"]
japanese = "死竜の洞窟の邪竜に<line-break>人を喰わせようとしておった者と<line-break>名が一致するが…。<end>"
english = "But the one who tried to feed people to the Evil Dragon in Dead Dragon Cave bore the same name...<end>"

["1720009"]
japanese = "なんと、シャリとは<line-break>そのような悪事を働く者なのか…。<line-break>\u3000<line-break>その者の目的は<line-break>いったい……。<end>"
english = "What? Shalli is capable of such wickedness...? What in the world could he be after...?<end>"

["1720010"]
japanese = "じゃが、わしらは<line-break>わしらにできることをするしかない。<line-break>\u3000<line-break><value:$28>、<line-break>明日は早いだろう。今日はもう<line-break>休んでしまうことにしよう。<end>"
english = "Still, we can only do what is within our power. <value:$28>, we will have an early start tomorrow. Let us get some rest.<end>"

["1720011"]
japanese = "白虎軍、総員乗船！<line-break>敵、アキュリュース守備傭兵団。<line-break>\u3000<line-break>全軍、進め！<end>"
english = "White Tiger Army, all hands aboard! The enemy is Aqyurius's defending mercenary corps. All forces, advance!<end>"

["1720012"]
japanese = "<value:$28>か…。<line-break>昨日はよく眠れたか？\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>…この戦、どう見る？<line-break>わしは何やらひどく不安じゃ。<line-break>胸騒ぎがしおる…。<end>"
english = "<value:$28>... Did you sleep well last night? What do you make of this battle? I cannot shake this unease. Something feels terribly wrong.<end>"

["1720013"]
japanese = "き、来ました！<line-break>例の大蛇です！！<end>"
english = "I-it's here! That giant serpent!!<end>"

["1720014"]
japanese = "さて、<line-break>ここで僕の出番なわけだね。<end>"
english = "Well, I suppose this is where I come in.<end>"

["1720015"]
japanese = "紹介する。<line-break>彼が魔道士シャリだ。<end>"
english = "Allow me to introduce him. This is Shalli, a mage.<end>"

["1720016"]
japanese = "なんだよ。邪険だなあ。<line-break>僕はただ雇われただけだよ。<line-break>\u3000<line-break>もちろん、自分の仕事には<line-break>全力を尽くすつもりだよ。<end>"
english = "What? Don't be so cold. I was only hired for the job. Of course, I intend to give it my all.<end>"

["1720017"]
japanese = "やあ、<value:$28>。<line-break>まさかこんな所で会えるなんて。<line-break>\u3000<line-break>世界は広いっていうけど<line-break>結構、人の世って狭いね。<end>"
english = "Hello, <value:$28>. I never imagined we'd meet somewhere like this. They say the world is vast, but the world of men is rather small, isn't it?<end>"

["1720018"]
japanese = "やあ、よろしく。\u3000\u3000\u3000<line-break>君は<value:$28>だよね？<line-break>\u3000<line-break>あはは、知ってるさ。<line-break>たとえ君は僕のこと<line-break>まだ知らなくってもね。<end>"
english = "Hello. A pleasure to meet you. You're <value:$28>, aren't you? Ahaha, of course I know. Even if you don't know me yet.<end>"

["1720019"]
japanese = "僕はシャリ。<line-break>人は東方の博士なんて呼ぶんだ。<line-break>よろしくね。<end>"
english = "I'm Shalli. People call me the Doctor of the East. A pleasure to meet you.<end>"

["1720020"]
japanese = "死竜に人を喰わせとったのは、<line-break>お主か！<end>"
english = "Was it you who fed people to the death dragon?!<end>"

["1720021"]
japanese = "何のことぉ？<line-break>いきなり失礼だなぁ、この人。<line-break>\u3000<line-break>まあいいや。<end>"
english = "What are you talking about? How rude, coming out with that all of a sudden. Ah, whatever.<end>"

["1720022"]
japanese = "んじゃ、お仕事に<line-break>精を出しちゃおうかな。<end>"
english = "Well then, I suppose I'd better get to work.<end>"

["1720023"]
japanese = "汝、吹きすさぶ風に生まれ、<line-break>汝、まきあがる土と現る。<line-break>\u3000<line-break>暗雲と共にいでよ！<line-break>汝！\u3000雄々しき雷よ！<line-break>我に仇なす者を撃て！！<end>"
english = "Thou, born of the raging wind, thou who appearest with the whirling earth―come forth with the dark clouds! O valiant thunder, strike down those who stand against me!!<end>"

["1720024"]
japanese = "ミ、ミズチが…。<end>"
english = "M-Mizuchi...<end>"

["1720025"]
japanese = "おお…。<line-break>すばらしい…。<end>"
english = "Oh... Magnificent...<end>"

["1720026"]
japanese = "いかがでございましょうか？<line-break>白虎将軍閣下。<end>"
english = "Was that to your satisfaction, Your Excellency, White Tiger General?<end>"

["1720027"]
japanese = "うむ。<end>"
english = "Yes.<end>"

["1720028"]
japanese = "危険だ、危険だぞ、ジラーク！\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>ミズチは水の精、身を焼いても<line-break>その力はこの世に残るやもしれん。<line-break>それがわからぬお主でもあるまい！？<end>"
english = "It's dangerous, Zsilak―dangerous! Mizuchi is a spirit of water. Even if you burn its body, its power may yet linger in this world. Do not tell me you fail to understand that!<end>"

["1720029"]
japanese = "その時はまた<line-break>その力を焼き滅ぼすまで。\u3000<line-break>\u3000<line-break>全軍前進！<line-break>アキュリュースに着岸せよ！<end>"
english = "Then we shall burn that power out of existence as well. All forces, advance! Make landfall at Aqyurius!<end>"

["1720030"]
japanese = "クッ…。<end>"
english = "Ngh...<end>"

["1720031"]
japanese = "む？\u3000なんじゃこの静けさは…？<line-break>迎撃の傭兵も現れんとは。<line-break>\u3000<line-break>まさか、罠か！？<end>"
english = "Hm? Why is it so quiet...? Not a single mercenary has come out to meet us. Could this be a trap?!<end>"

["1720032"]
japanese = "卿は本当に<line-break>考えの浅い御仁だな。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>罠を仕掛けたのだよ。<line-break>向こうではなく、こちらがね。<end>"
english = "You truly are a man of little foresight. There is a trap―but we laid it, not the other side.<end>"

["1720033"]
japanese = "あんたの話通り、<line-break>傭兵どもをまるめこんでおいたぜ。<line-break>あとはそっちの仕事…そうだよな？<end>"
english = "Just as you said, I won the mercenaries over. The rest is your job... right?<end>"

["1720034"]
japanese = "その通りだ。<line-break>ご苦労だったな。<end>"
english = "Precisely. Well done.<end>"

["1720035"]
japanese = "どうも。<line-break>また縁があったらよろしく。<end>"
english = "Much obliged. If our paths cross again, I hope we can do business.<end>"

["1720036"]
japanese = "…クズめ。<end>"
english = "...Scum.<end>"

["1720037"]
japanese = "ねえ、ジラーク将軍。<line-break>僕の報酬についても<line-break>忘れていないよね？<end>"
english = "Say, General Zsilak. You haven't forgotten about my payment, have you?<end>"

["1720038"]
japanese = "無論だ。<end>"
english = "Of course not.<end>"

["1720039"]
japanese = "全軍に伝令。<line-break>乗船したまま待機。<line-break>戦闘態勢は維持。<end>"
english = "Send word to all forces: remain aboard and stand by. Maintain battle readiness.<end>"

["1720040"]
japanese = "はっ！<end>"
english = "Yes, sir!<end>"

["1720041"]
japanese = "卿とシャリ、そして<line-break>そちらの傭兵は<line-break>私とともに来てもらおう。<line-break>水の神殿の巫女たちに<line-break>降伏を勧告する。<end>"
english = "You and Shalli will come with me, along with your mercenary escort. We will call upon the priestesses of the Water Temple to surrender.<end>"

["1720042"]
japanese = "無益な争いは不要だ。<line-break>我々はただアキュリュースを<line-break>我が帝国の支配下に置けばよい。<end>"
english = "There is no need for pointless conflict. We need only bring Aqyurius under the rule of our Empire.<end>"

["1720043"]
japanese = "無用な戦をせぬのはよいが…。<line-break>しかし、なんじゃ、<line-break>この言い知れぬ不安感は…。<end>"
english = "Avoiding needless battle is all well and good... But what is this inexplicable sense of unease...?<end>"

["1720044"]
japanese = "いやあ、こうも僕の都合通りに<line-break>事が進んじゃうと、なんだか<line-break>悪いなーって思っちゃうよ。あはは。<end>"
english = "Everything is going so perfectly for me that I'm starting to feel a little guilty. Ahaha.<end>"

["1720045"]
japanese = "そこまでです。<end>"
english = "That's far enough.<end>"

["1720046"]
japanese = "大いなる水の精、<line-break>ミズチを手にかけるとは…。<line-break>\u3000<line-break>そこまでして<line-break>このアキュリュースに<line-break>何を望まれる？<end>"
english = "You would even slay the great water spirit Mizuchi... What could you want from Aqyurius badly enough to do such a thing?<end>"

["1720047"]
japanese = "我々はただ、我らが帝ネメアの\u3000\u3000<line-break>偉大な治世を、あまねく大陸中に<line-break>広めたいと考えるのみだ。<line-break>無用な略奪や戦闘はしない。<line-break>約束しよう。それはこちらとしても<line-break>望むところではない。<end>"
english = "We seek only to extend the great reign of our emperor, Nemea, across the entire continent. There will be no needless pillaging or bloodshed. You have my word. We have no desire for either.<end>"

["1720048"]
japanese = "そちらが我々の意志に賛同し、<line-break>穏やかに帝国の支配下に入る事を<line-break>期待する。<end>"
english = "We hope you will support our cause and submit peacefully to imperial rule.<end>"

["1720049"]
japanese = "この町は水の精霊神をまつり、<line-break>水の精霊に祈りを捧げる聖地です。\u3000<line-break>\u3000<line-break>その聖地を守る者たちをかどわかし、<line-break>ミズチを殺すような者たちに<line-break>渡すことなどできません！！<end>"
english = "This town is sacred ground, where we worship the god of the water spirits and offer our prayers to the spirits of water. We cannot surrender it to people who would lead its guardians astray and kill the Mizuchi!<end>"

["1720050"]
japanese = "賛同してもらえぬのなら仕方ない。<line-break>沿岸に待機させた兵たちを<line-break>上陸させるまでだ。<end>"
english = "If you will not agree, so be it. I need only order the troops waiting offshore to land.<end>"

["1720051"]
japanese = "くっ…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<end>"
english = "Ngh...<end>"

["1720052"]
japanese = "あの、緊迫してるところを<line-break>悪いんだけど、<line-break>僕の報酬、もらってもいいかな？<end>"
english = "Sorry to interrupt such a tense moment, but could I have my reward now?<end>"

["1720053"]
japanese = "構わん。<line-break>好きにするがいい。<end>"
english = "I have no objection. Do as you please.<end>"

["1720054"]
japanese = "ねえ、君、イークレムンだよね？<line-break>\u3000<line-break>\u3000<line-break>僕は君に用があるんだ。<line-break>急で悪いんだけど、僕に<line-break>ついてきてくれないかなあ？<end>"
english = "Hey, you're Iiklmn, right? I have business with you. Sorry this is so sudden, but would you come with me?<end>"

["1720055"]
japanese = "なっ…！？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>ジラーク！<line-break>いったいどういう事だ！？<end>"
english = "What...?! Zsilak! What is the meaning of this?!<end>"

["1720056"]
japanese = "何を騒ぐことがある？\u3000\u3000\u3000\u3000\u3000\u3000<line-break>卿はあいかわらず<line-break>くだらないことで騒ぐのだな。<line-break>この者が要求した報酬は<line-break>イークレムンという巫女の身柄だ。<line-break>我々には何も問題あるまい。<end>"
english = "Why all this commotion? As ever, you make a fuss over the most trivial matters. The reward requested was custody of a priestess named Iiklmn. That poses no problem for us.<end>"

["1720057"]
japanese = "それはなりませぬ！<line-break>イークレムン様はいずれ水の巫女として<line-break>精霊神に仕えるお方。<line-break>そのような得体の知れぬ者に<line-break>渡すことは、決して許されませぬ！<end>"
english = "We cannot allow that! Lady Iiklmn is destined to serve the spirit god as the Priestess of Water. We will never hand her over to some suspicious stranger!<end>"

["1720058"]
japanese = "うわ、ひどい言われようだなあ。\u3000\u3000<line-break>でも、そんなこと言っていいの？<line-break>\u3000<line-break>僕、報酬もらえないなら<line-break>個人的にここで暴れちゃうよ？<line-break>さっきみたいな事もしちゃおうかな？<end>"
english = "Wow, that's a terrible thing to call me. But are you sure you want to say that? If I don't get my reward, I might just go on a rampage here myself. Maybe I'll do the same thing I did earlier.<end>"

["1720059"]
japanese = "やあ、君たちは\u3000\u3000\u3000\u3000\u3000\u3000<line-break>さっきの水蛇たちだね？<line-break>\u3000<line-break>僕が憎い？\u3000ならどうする？<line-break>ここで僕とまた戦おっか？<line-break>よーし、負けないぞ！！<end>"
english = "Hello. You're the water serpents from before, aren't you? Do you hate me? What are you going to do about it? Want to fight me again, right here? All right, I won't lose!<end>"

["1720060"]
japanese = "やめて！\u3000ミズチたち！！<line-break>あなたたちが戦うことはないわ！\u3000<line-break>\u3000<line-break>大丈夫…、私は大丈夫。<line-break>だから、お願い、もう怒らないで。<line-break>もう傷つかないで…。<end>"
english = "Stop, Mizuchi! You don't have to fight! It's all right... I'll be all right. So please, don't be angry anymore. Don't let yourselves be hurt again...<end>"

["1720061"]
japanese = "すごいね、イークレムン。<line-break>君はもう水の巫女としての力に<line-break>目覚めつつあるんだね。<end>"
english = "That's amazing, Iiklmn. You're already beginning to awaken to your power as the Priestess of Water.<end>"

["1720062"]
japanese = "ひとつ、約束してください。\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>私は、あなたについていきます。<line-break>そのかわり、この町と、町の人は<line-break>絶対に傷つけないでください。<end>"
english = "Promise me one thing. I'll go with you, but in return, you must not harm this town or anyone who lives here.<end>"

["1720063"]
japanese = "わかったよん。<line-break>僕が興味あるのは君だけだから<line-break>他なんかどうでもいいや。<line-break>じゃ、行こうか。<end>"
english = "All right, then! You're the only one I'm interested in, so I don't care about anything else. Come on, let's go.<end>"

["1720064"]
japanese = "イークレムン様！<end>"
english = "Lady Iiklmn!<end>"

["1720065"]
japanese = "すいません、みなさん。<line-break>あとはよろしくお願いします。<line-break>\u3000<line-break>つらいでしょうが<line-break>今は、耐えてください。<line-break>誰も傷つくことのないように。<end>"
english = "I'm sorry, everyone. I leave the rest to you. I know this will be hard, but for now, please endure it. We must see that no one is hurt.<end>"

["1720066"]
japanese = "はい…。<end>"
english = "Yes...<end>"

["1720067"]
japanese = "イークレムン！！<end>"
english = "Iiklmn!<end>"

["1720068"]
japanese = "ん？<end>"
english = "Hm?<end>"

["1720069"]
japanese = "これは…。<end>"
english = "This is...<end>"

["1720070"]
japanese = "どうしようというのだね？<line-break>朱雀将軍アンギルダン殿。<end>"
english = "What do you intend to do, Vermilion Bird General Angeerdan?<end>"

["1720071"]
japanese = "奴を追うのじゃ！<end>"
english = "After him!<end>"

["1720072"]
japanese = "なぜだね？<line-break>彼の行動は私との契約に違反しない。<line-break>つまり、何も問題はないのだよ。<line-break>卿の行動には不審な点が多い。<line-break>それ以上、私の意志に反するようなら<line-break>軍規に基づき罰を与える。<end>"
english = "Why? His actions do not violate his contract with me. In other words, there is no problem. Your own conduct, however, has given me ample cause for suspicion. Defy my will any further, and I will punish you under military law.<end>"

["1720073"]
japanese = "軍規がいかほどのものか！<line-break>わしはわしが正しいと思う道を行く！<end>"
english = "To hell with military law! I will follow the path I believe is right!<end>"

["1720074"]
japanese = "その言葉、<line-break>叛逆と見なさざるを得んな。\u3000\u3000<line-break>\u3000<line-break>朱雀将軍アンギルダン・ゼイエン！<line-break>その力量と、現在の状況を考え<line-break>この私が今、処罰する！！<end>"
english = "I have no choice but to regard those words as treason. Vermilion Bird General Angeerdan Zeyen! Given your abilities and our present circumstances, I shall carry out your punishment myself, here and now!<end>"

["1720075"]
japanese = "…なぜだ。<line-break>なぜ卿はそれほどまでに<line-break>あの娘にこだわる…。<end>"
english = "Why...? Why go so far for that girl...?<end>"

["1720076"]
japanese = "すまぬ。<line-break>こんなわしにも守らねばならぬ\u3000\u3000\u3000<line-break>絆があったようでな。<line-break>ここを平和的に支配下に置くという、<line-break>イークレムンとの約束は守ってくれ。<line-break>では、わしは行かせてもらうぞ。<end>"
english = "Forgive me. It seems even an old man like me has a bond he must protect. Keep your promise to Iiklmn and bring this place peacefully under your rule. Now, I shall be on my way.<end>"

["1720077"]
japanese = "すまなんだな、<value:$28>。<line-break>この老いぼれの降って湧いた親心に<line-break>お主までつきあわせてしまって。<line-break>今、このようになってしまってから<line-break>ようやく確信を持って言える。<line-break>あの娘は、わしの子じゃ。<end>"
english = "I'm sorry, <value:$28>. I've dragged you into this old fool's sudden fit of fatherly concern. Only now, after all that's happened, can I finally say it with certainty. That girl is my daughter.<end>"

["1720078"]
japanese = "これを見ろ。<end>"
english = "Look at this.<end>"

["1720079"]
japanese = "前に話したかの？<line-break>人魚のウロコで作った耳飾りじゃ。<line-break>イークレムンが落としていった…。<line-break>………………。<end>"
english = "Did I tell you about it before? It's an earring made from a mermaid's scale. Iiklmn dropped it...<end>"

["1720080"]
japanese = "<value:$28>、すまんが<line-break>今しばらく、わしに力を貸してくれ。<end>"
english = "<value:$28>, I'm sorry to ask, but lend me your strength a little longer.<end>"

["1720081"]
japanese = "では、わしは<line-break>船にいる兵たちに退却を命じてくる。<line-break>またあとで合流じゃ。<end>"
english = "Then I'll order the soldiers aboard the ship to withdraw. We'll meet up again afterward.<end>"

["1720082"]
japanese = "では、二手に分かれよう。<line-break>何かあったら、以前お主が話しとった<line-break>猫屋敷で呼び出してくれ。<end>"
english = "Then let us split up. If anything happens, summon me at the Cat Manor you mentioned before.<end>"

["1720083"]
