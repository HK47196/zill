japanese = "<if><value:$01><equal>2じゃ、また会いましょ。<line-break>がんばってね、<value:$28>。 <end><if><value:$01><equal>3うむ。ではわしは<line-break>酒場にでも行くことにしよう。<line-break>しばしさらばだ、<value:$28>。 <end><if><value:$01><equal>4いらなくなったら放り出すなんて<line-break>この機械って、けっこうひどいかも！<line-break><value:$28>様…さようなら！ <end><if><value:$01><equal>5じゃあな、<value:$28>。<line-break>またいつでも呼んでくれよ。<line-break>俺たちは仲間なんだからな！ <end><if><value:$01><equal>6<value:$28>…<line-break>また、一緒に冒険しようね。<line-break>絶対、絶対だからね！ <end><if><value:$01><equal>7じゃあ、私は私で冒険を続けるわ。<line-break>何かあったらすぐに呼ぶのよ。 <end><if><value:$01><equal>8では、私はみなさんの成功を<line-break>祈っていることにしましょう。<line-break>何か困ったら、また呼んでください。 <end><if><value:$01><equal>9う～ん、ここでいっぺんお別れですか。<line-break>ま、それはそれでしょうがないやね。<line-break>ほんじゃ、またね、<value:$28>。 <end><if><value:$01><equal>12ま、お前さんのことだ。<line-break>これも何か考えがあってのことだろう。<line-break>じゃあな、また呼んでくれ。 <end><if><value:$01><equal>13さらばだ。<line-break>お前だけでどこまでできるか<line-break>試してみるのもいいだろう。 <end><if><value:$01><equal>10じゃあな、姉ちゃん。<line-break>あんまり無理するなよ。<line-break>危なくなったら、いつでも呼ぶんだぜ。 <end><if><value:$01><equal>14さて、これからどうしたものか。<line-break>工房に戻るのもなんだしのう……。<line-break>うむ、大陸中の酒を飲んでまわるか。 <end><if><value:$01><equal>15さよなら、<value:$28>。<line-break>僕も、強くなるためにガンバるよ。<line-break>じゃ、また呼んでね。 <end><if><value:$01><equal>17あら？\u3000アタクシ抜きで大丈夫なわけ？<line-break>アタクシの存在の偉大さに気付いたら<line-break>いつでも呼んでくれてよくってよ。 <end><if><value:$01><equal>19お別れって、さびしいな。<line-break>でも、絶対また呼んでくれるよね？<line-break>だから、またね、<value:$28>。 <end><if><value:$01><equal>20しばしさらばだ。 <end><if><value:$01><equal>11また会いましょう。<end><if><value:$01><equal>21いつでも呼ぶがよい。<line-break>待っているぞ、<value:$28>。<end><if><value:$01><equal>23さらばだ、<value:$28>。 <end><if><value:$01><equal>27何かあったら、すぐ呼んでくれ。<end><if><value:$01><equal>26しばしさらばだ、<value:$28>。 <end><if><value:$01><equal>24いつでも呼んでください。<line-break>それでは失礼します。<end><if><value:$01><equal>25…また呼んでね。<line-break>絶対だよ！<end><if><value:$01><equal>192貴方と離れるのですね。<line-break>…了解、しました。<end><if><value:$01><equal>193お別れですね…。<line-break>また必ず呼んでくださいね！<end><if><value:$01><equal>194また、ひとりになるのか…。<line-break>これが、一番いやな瞬間だな…。<end><if><value:$01><equal>191またいつでも呼んでね。<line-break>じゃあね。<end><if><value:$01><equal>190今度会うまでに力をつけておく。<line-break>また呼んでくれ。<end>ひどいなあ。<line-break>君の歌はまだ完成していないのに。<line-break>仕方ない。今度また一緒に旅させてね。 <end>"
english = "<if><value:$01><equal>2Well, until we meet again. Good luck, <value:$28>.<end><if><value:$01><equal>3Very well. I think I'll pay a visit to the tavern. Farewell for now, <value:$28>.<end><if><value:$01><equal>4This machine just tosses you aside when it doesn't need you anymore. That's kind of awful! Farewell, <value:$28>...<end><if><value:$01><equal>5See you, <value:$28>. Call me again whenever you like. We're comrades, after all!<end><if><value:$01><equal>6<value:$28>... Let's go adventuring together again. You have to promise. Promise!<end><if><value:$01><equal>7I'll carry on with my own adventures, then. Call me at once if anything happens.<end><if><value:$01><equal>8Then I shall pray for everyone's success. If you run into any trouble, please call upon me again.<end><if><value:$01><equal>9Hmm, so this is where we part ways for a while. Well, I suppose that's how it goes. See you around, <value:$28>.<end><if><value:$01><equal>12Well, knowing you, there must be some reason for this. See you. Call me again sometime.<end><if><value:$01><equal>13Farewell. It may be worthwhile to see how far you can get on your own.<end><if><value:$01><equal>10See you, Sis. Don't push yourself too hard. If things get dangerous, call me anytime.<end><if><value:$01><equal>14Now, what shall I do? I don't much fancy returning to the workshop... Ah, I know. I'll drink my way around the whole continent.<end><if><value:$01><equal>15Goodbye, <value:$28>. I'll work hard so I can get stronger too. Call me again, okay?<end><if><value:$01><equal>17Oh? Are you sure you can manage without me? Once you realize just how magnificent my presence is, you may call upon me whenever you please.<end><if><value:$01><equal>19It's sad to say goodbye. But you'll definitely call me again, won't you? So... see you, <value:$28>.<end><if><value:$01><equal>20Farewell for now.<end><if><value:$01><equal>11Until we meet again.<end><if><value:$01><equal>21You may call upon me whenever you wish. I shall be waiting, <value:$28>.<end><if><value:$01><equal>23Farewell, <value:$28>.<end><if><value:$01><equal>27If anything happens, call me at once.<end><if><value:$01><equal>26Farewell for now, <value:$28>.<end><if><value:$01><equal>24Please call upon me whenever you need me. Now, if you'll excuse me.<end><if><value:$01><equal>25Call me again... You have to promise!<end><if><value:$01><equal>192So we're parting, then. ...Understood.<end><if><value:$01><equal>193So this is goodbye... Please, be sure to call me again!<end><if><value:$01><equal>194Alone again... This is the moment I hate most...<end><if><value:$01><equal>191Call me again anytime. Bye for now.<end><if><value:$01><equal>190I'll be stronger by the next time we meet. Call me again.<end>That's mean. Your song isn't even finished yet. Oh well. Let me travel with you again sometime, all right?<end>"

