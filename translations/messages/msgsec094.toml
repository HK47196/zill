en waiting for you, <value:$28>. Shall we be on our way?<end><if><value:$01><equal>25I've been waiting for you to call me. Let's get going right away.<end><if><value:$01><equal>192You're taking me with you, then.<end><if><value:$01><equal>193Thank you for calling me! We can... be together again.<end><if><value:$01><equal>194You are the light. I am the shield that guards it. Come, <value:$28>. Let us go.<end><if><value:$01><equal>191So you need my strength. All right, let's go.<end><if><value:$01><equal>190I've kept you waiting. Come, let's go.<end>Sorry to keep you waiting!! Another adventure with <value:$28>! All right, let's gooo!<end>"

