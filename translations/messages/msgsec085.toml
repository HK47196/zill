["850000"]
japanese = "カルラメッセージVOL2開始<end>"
english = ""

["850001"]
japanese = "早く！<line-break>総督府に知らせてください！<end>"
english = "Hurry! Please notify the Governor-General's Office!<end>"

["850002"]
japanese = "引き受ける<end>"
english = "Accept<end>"

["850003"]
japanese = "引き受けない<end>"
english = "Decline<end>"

["850004"]
japanese = "そ、そんな！\u3000こんな時に？<end>"
english = "N-no! At a time like this?<end>"

["850005"]
japanese = "何？\u3000それは本当か？<end>"
english = "What? Is that true?<end>"

["850006"]
japanese = "ブゾリは賄賂、陰謀、やり放題だ。<line-break>誰も、ロセンではブゾリに逆らえない。<end>"
english = "Buzori bribes and schemes with impunity. No one in Rocen can stand against Buzori.<end>"

["850007"]
japanese = "だが、ブゾリは有能だぞ。<line-break>あの破壊されたロセンをここまで<line-break>あっと言う間に復興させた。<end>"
english = "But Buzori is capable. Just look how far Buzori brought devastated Rocen in so little time.<end>"

["850008"]
japanese = "ブゾリはペウダが傾けたロセン経済を<line-break>あっと言う間に立て直したしな。<line-break>愚王ペウダよりは実績がある分マシだ。<end>"
english = "Buzori also turned Rocen's economy around in no time after Peuda brought it to the brink. At least there are results to show for it―more than can be said for that fool King Peuda.<end>"

["850009"]
japanese = "バカ言え。<line-break>ペウダより有能な分、始末が悪いんだ。<line-break>俺たちはブゾリの家畜みたいなもんだ。<end>"
english = "Don't talk nonsense. The fact that Buzori is more capable than Peuda only makes matters worse. We're little more than Buzori's livestock.<end>"

["850010"]
japanese = "物騒じゃな～い？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>その体に巻いた魔法爆雷を広場で<line-break>爆発させたらアタシや<line-break>そこの女の子まで死んじゃうでしょ？<end>"
english = "Isn't that a little dangerous? If you set off those magical blasting charges wrapped around your body here in the square, you'll kill me and that girl over there too, won't you?<end>"

["850011"]
japanese = "死にたいなら<line-break>ひとりで死んでちょうだい？<line-break>\u3000<line-break>アタシには、あんたのとは<line-break>比べものにならない、<line-break>すばらしーい人生があるの。<end>"
english = "If you want to die, please do it alone. I have a simply marvelous life, nothing like yours.<end>"

["850012"]
japanese = "何がお望みかしら？<end>"
english = "And what might you want?<end>"

["850013"]
japanese = "ロセンの解放だ。<line-break>ディンガルの豚め！<end>"
english = "The liberation of Rocen, you Dyneskal swine!<end>"

["850014"]
japanese = "人にものを頼むときは、<line-break>もう少し、お行儀よくするものよ？<end>"
english = "When you ask someone for a favor, you really ought to mind your manners.<end>"

["850015"]
japanese = "ペウダ王の仇にそんな真似ができるか。<end>"
english = "How could I show courtesy to King Peuda's enemy?<end>"

["850016"]
japanese = "ペウダ王、ねぇ？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>聞いて。そのペウダ王は酒色に溺れ、<line-break>国民を苦しめてたの。<line-break>町はさびれ、悲惨な状況だったわ…。<end>"
english = "King Peuda, you say? Listen. That King Peuda wallowed in drink and women while his people suffered. The town had fallen into decay. It was a wretched place...<end>"

["850017"]
japanese = "それをアタシがピンクの<line-break>かわいい町にしたの。<line-break>感謝されても、殺される覚えはないわ。<end>"
english = "I turned it into a cute little pink town. I deserve thanks, not death.<end>"

["850018"]
japanese = "うるさい！<line-break>いつか貴様らディンガルを殺し尽くす。<line-break>そしてロセン王家がこの国を再興するのだ！<end>"
english = "Shut up! One day, you Dyneskals will be slaughtered to the last! Then the royal house of Rocen will restore this country!<end>"

["850019"]
japanese = "ロセン王家…？\u3000カルラ様が<line-break>根絶やしにしたはずだけど？\u3000\u3000\u3000<line-break>\u3000<line-break>もしかして、愚王ペウダの叔母が<line-break>嫁いでいたリベルダムの武器商人<line-break>ロティの娘、クリュセイスのこと？<end>"
english = "The royal house of Rocen...? Lady Karula was supposed to have wiped it out. Unless you mean Khryuseis, daughter of Lottie, the Liberdam arms merchant who married that fool King Peuda's aunt?<end>"

["850020"]
japanese = "そうだ！<end>"
english = "That's right!<end>"

["850021"]
japanese = "武器商人は暴力で王の地位を買う気ね。<line-break>本当にいい犬を手に入れたこと。<line-break>理想を信じ、命を何とも思わない。<end>"
english = "So that arms merchant means to buy a throne with violence. What a fine dog he's found: one who believes in ideals and thinks nothing of life.<end>"

["850022"]
japanese = "殺せ！<end>"
english = "Kill!<end>"

["850023"]
japanese = "言われなくてもそうするわ。<line-break>こないだの爆破もあんたたちでしょ？<end>"
english = "I hardly need you to tell me that. You lot were behind the last bombing too, weren't you?<end>"

["850024"]
japanese = "そうだ。これで終わったと思うな！<line-break>ブゾリ！<end>"
english = "We were. Don't think this ends here, Buzori!<end>"

["850025"]
japanese = "ゲスねぇ。美しくないわ。<line-break>命はもっと尊いものよん。<end>"
english = "How vulgar. Not beautiful at all. Life is far more precious than that.<end>"

["850026"]
japanese = "パレードを続けるわよ。<line-break>死体は片付けて。美しくないわ。<end>"
english = "We'll carry on with the parade. Clear away the bodies. They're not beautiful.<end>"

["850027"]
japanese = "<value:$28>さん<line-break>…ですね。<end>"
english = "You must be <value:$28>.<end>"

["850028"]
japanese = "あなたの名声を聞いて、<line-break>ぜひ、頼みたいことがあってやってきました。<line-break>むろん報酬はたっぷりと、させてもらいます。<line-break>暗殺…<line-break>引き受けてもらえませんかね？<line-break>\u3000<end>"
english = "I've heard of your fame, and I've come with a request. You would, of course, be handsomely rewarded. An assassination... Would you be willing to take it on?<end>"

["850029"]
japanese = "興味がないわけじゃない。話だけ聞いてみる<end>"
english = "I'm not saying I'm uninterested. I'll listen, but that's all.<end>"

["850030"]
japanese = "断る<end>"
english = "Decline.<end>"

["850031"]
japanese = "では、詳しいお話はロセン総督府で…。<line-break>\u3000<line-break>\u3000<line-break>それでは失礼…。<line-break>\u3000<line-break>\u3000<end>"
english = "We'll discuss the details at the Rocen Governor-General's Office. If you'll excuse me.<end>"

["850032"]
japanese = "そうですか。では、失礼。<end>"
english = "Very well. If you'll excuse me.<end>"

["850033"]
japanese = "<value:$28>様、<line-break>お待ちしておりました。<end>"
english = "Welcome, <value:$28>. You were expected.<end>"

["850034"]
japanese = "さ、こちらへ…。<end>"
english = "Right this way, please.<end>"

["850035"]
japanese = "こちらが依頼主。<line-break>ロセン総督ブゾリ様です。<end>"
english = "This is the client, Governor-General Buzori of Rocen.<end>"

["850036"]
japanese = "いらっしゃーい。<line-break>最近、売り出し中の冒険者、<line-break><value:$28>ちゃんね？<line-break>アタシはブゾリ、<line-break>ロセンの総督をやってるわ。<end>"
english = "Welcooome! You're that up-and-coming adventurer, <value:$28>, aren't you? I'm Buzori, Governor-General of Rocen.<end>"

["850037"]
japanese = "ふふ、けっこう、<line-break>かわいい顔してるじゃなーい？<end>"
english = "My, my. Aren't you quite the pretty one?<end>"

["850038"]
japanese = "ふふ、それじゃ、さっそく<line-break>お仕事の話しにかかろうかしらん？<line-break>\u3000<line-break>リベルダムにいる、<line-break>あのテロリストどもの黒幕、<line-break>武器商人ロティを消してほしいの。<end>"
english = "Well then, shall we get straight down to business? I want you to take out Lottie, the arms dealer in Liberdam who's pulling the strings behind those terrorists.<end>"

["850039"]
japanese = "どうかしら？<end>"
english = "What do you say?<end>"

["850040"]
japanese = "引き受ける<end>"
english = "Accept<end>"

["850041"]
japanese = "引き受けない<end>"
english = "Decline<end>"

["850042"]
japanese = "じゃあ、裏切らないように<line-break>これに血で署名して…。<end>"
english = "Then sign this in blood, so I know you won't betray me...<end>"

["850043"]
japanese = "これは前金。<end>"
english = "Here's your advance.<end>"

["850044"]
japanese = "ロティを死体にしたら<line-break>来てちょうだい。<line-break>そのとき残りを払うわ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>急いだ方がいいわよ。<line-break>アタシも忙しいから、あなたひとりに<line-break>頼んでるわけじゃないから。<end>"
english = "Come back when Lottie's dead. I'll pay you the rest then. You'd better hurry. I'm busy too, so you're not the only one I've hired.<end>"

["850045"]
japanese = "じゃあね。<end>"
english = "See you.<end>"

["850046"]
japanese = "残念だわ…。それじゃ、<line-break>ここでアタシに約束してくれるかしら？<line-break>\u3000<line-break>アタシがあの武器商人を殺すのを<line-break>邪魔しないって。<end>"
english = "What a shame... Then will you promise me, here and now, that you won't interfere when I kill that arms dealer?<end>"

["850047"]
japanese = "邪魔しない<end>"
english = "I won't interfere.<end>"

["850048"]
japanese = "絶対阻止してみせる<end>"
english = "I'll stop it, no matter what.<end>"

["850049"]
japanese = "素直ね。いい生き方だわ。<line-break>損しないわよ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>フフ…だけど、人の言うなりに動いて、<line-break>人の思うままに踊らされて、<line-break>それで生きてるって言えるのかしら？<end>"
english = "So obedient. It's a good way to live. You won't lose out. Heh... But if you only do as you're told and let others pull your strings, can you really call that living?<end>"

["850050"]
japanese = "確かめさせて？<line-break>あなたの生きている意味を。<end>"
english = "Let me see for myself what gives your life meaning.<end>"

["850051"]
japanese = "見てるだけじゃなくって、実際に<line-break>体を動かしてみるのも悪くないでしょ。<line-break>\u3000<line-break>でも、出てって。<line-break>あなたの生き方、美しくないわ。<end>"
english = "Watching is one thing, but trying it for yourself wouldn't be so bad, would it? Still, get out. There's no beauty in the way you live.<end>"

["850052"]
japanese = "フフフ、元気いいのねぇ。<line-break>気に入ったわ。<line-break>だから、いいこと教えてあげる。\u3000<line-break>ロセンではねぇ、<line-break>アタシに逆らうものはいないわ。<line-break>アタシに逆らうことは命がけなの。<end>"
english = "Heh heh heh. You've got spirit. I like that, so I'll let you in on something. No one in Rocen defies me. Defy me, and you stake your life on it.<end>"

["850053"]
japanese = "命がけで守るに値するモノなんて<line-break>何もないわ。フフフ、行きなさい。<line-break>別の者を頼むから。<line-break>あなたは夢を見るといい。<line-break>愚か者の夢を。夢から覚めたなら<line-break>こっちへいらっしゃい。<end>"
english = "Nothing is worth risking your life to protect. Heh heh heh. Go on. I'll ask someone else. You can dream your fool's dream. When you wake from it, come back to me.<end>"

["850054"]
japanese = "（…ブゾリの刺客？）<end>"
english = "(...An assassin sent by Buzoli?)<end>"

["850055"]
japanese = "き、君は…？<end>"
english = "Y-you are...?<end>"

["850056"]
japanese = "お、お前は、<value:$28>！<line-break>よ、よくも、ロセンではアニキたちを！<line-break>\u3000<line-break>アニキたちはお前との戦いのあと<line-break>ぎっくり腰になって、<line-break>すげえ腰痛にうめいているんだ！<end>"
english = "Y-you're <value:$28>! How dare you, after what you did to the guys in Rocen! They threw their backs out fighting you, and now they're laid up groaning in agony!<end>"

["850057"]
japanese = "ついでだ。<line-break>その仇、取らせてもらう。<end>"
english = "And while I'm here, I'll avenge them.<end>"

["850058"]
japanese = "く、くそっ！<end>"
english = "D-damn it!<end>"

["850059"]
japanese = "…あ、ありがとう。<line-break>おかげで助かった。<end>"
english = "Ah... thank you. You saved me.<end>"

["850060"]
japanese = "お父様？\u3000今の騒ぎは？<end>"
english = "Father? What was that commotion?<end>"

["850061"]
japanese = "ああ、クリュセイスか…。刺客だ。<line-break>だが、この方に助けられたよ。<end>"
english = "Ah, Khryuseis... An assassin attacked me, but this person saved me.<end>"

["850062"]
japanese = "それは…。ありがとうございます。<end>"
english = "An assassin...? Thank you.<end>"

["850063"]
japanese = "君は<value:$28>君だね。<line-break>最近、一躍有名になった冒険者だ。<end>"
english = "You're <value:$28>, aren't you? The adventurer who's suddenly become so famous.<end>"

["850064"]
japanese = "<value:$28>さん…。<line-break>本当にありがとうございます。<line-break>お怪我はありませんか？<end>"
english = "<value:$28>... Thank you, truly. Are you hurt?<end>"

["850065"]
japanese = "そうか、やはり、<line-break>ロセン総督ブゾリのさしがねか…。<end>"
english = "So Buzoli, the governor of Rocen, was behind it after all...<end>"

["850066"]
japanese = "お前の母さんの一族を皆殺しにした<line-break>カルラの懐刀とも言われる男だ。<line-break>\u3000<line-break>重い税で、ロセンを趣味の悪い<line-break>リベルダムのまがい物に変え、<line-break>リベルダムに対抗している。<end>"
english = "He's said to be the right-hand man of Karula, the woman who slaughtered your mother's entire clan. He has burdened Rocen with heavy taxes, turning it into a tasteless imitation of Liberdam to rival the city.<end>"

["850067"]
japanese = "クリュセイス…。<line-break>今、ロセンの人々にとっては\u3000\u3000\u3000<line-break>お前だけが希望の光なのだ。<end>"
english = "Khryuseis... Right now, you are the only ray of hope the people of Rocen have.<end>"

["850068"]
japanese = "<value:$28>君、<line-break>どうか、私の願いを聞いてくれ。<line-break>\u3000<line-break>今、私はロセンの解放軍の<line-break>支援をしている。ロセンの人々を<line-break>ディンガルから解放するためだ。<end>"
english = "<value:$28>, please hear my request. I am supporting Rocen's Liberation Army so that its people may be freed from Dyneskal.<end>"

["850069"]
japanese = "正直、総督ブゾリの悪逆さのために<line-break>状況は芳しくない。<line-break>\u3000<line-break>どうだろう。君ほどの者が<line-break>協力してくれれば、士気も高まり、<line-break>ブゾリにも対抗できると思うのだが…。<end>"
english = "To be frank, Buzoli's atrocities have left us in a poor position. But with someone of your caliber helping us, morale would rise, and I believe we could stand against him. What do you say?<end>"

["850070"]
japanese = "無論、解放軍の支援はきれいごとだけが<line-break>理由じゃない。ディンガルの魔手が<line-break>リベルダムに及ばないためでもある。<end>"
english = "Of course, noble ideals are not my only reason for supporting the Liberation Army. I also mean to keep Dyneskal's grasp from reaching Liberdam.<end>"

["850071"]
japanese = "ディンガルの将軍カルラは非情な女だ。<line-break>王家の人間を老人まで処刑したという。<line-break>\u3000<line-break>あの女は戦火に踏みにじられた<line-break>人間の苦しみなどを知らないのだ。<line-break>人間の痛みがわからないのだ。<end>"
english = "Karula, Dyneskal's general, is a merciless woman. They say she executed even the elderly members of the royal family. She knows nothing of the suffering of those trampled beneath the fires of war. She cannot understand another person's pain.<end>"

["850072"]
japanese = "私はリベルダムの市民として、<line-break>そんな奴らにリベルダムが、<line-break>蹂躙されるのを黙視できない…。\u3000\u3000\u3000<line-break>そんな奴らに<line-break>ロセンが抑圧されているのも<line-break>看過できないのだ。<end>"
english = "As a citizen of Liberdam, I cannot stand by and watch such people lay waste to my city. Nor can I ignore Rocen's oppression at their hands.<end>"

["850073"]
japanese = "頼む、<line-break>私たちに力を貸してくれたまえ。\u3000\u3000\u3000<line-break><value:$28>君。<end>"
english = "Please, <value:$28>. Lend us your strength.<end>"

["850074"]
japanese = "そうか。ありがとう。君のような<line-break>同志を得られて心強い限りだ。<line-break>\u3000<line-break>では、また、来てくれたまえ。<line-break>そのとき、詳しい話をしよう。<end>"
english = "Thank you. It is deeply reassuring to have a comrade such as you. Come back again, and we will discuss the details then.<end>"

["850075"]
japanese = "そうか。…しょせん、君たちのような\u3000<line-break>自由人にはわからないのだな。<line-break>\u3000<line-break>自分の故郷に、住んでいる町に<line-break>侵略者の魔の手が伸びようが、<line-break>君らはそんなことはどうでもよいのだ。<end>"
english = "I see... In the end, free spirits like you cannot understand. It means nothing to you if an invader's grasp closes around your homeland or the town where you live.<end>"

["850076"]
japanese = "君らはどこか別の所へ<line-break>行けばいいだけだからな。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<end>"
english = "You can simply move on to somewhere else.<end>"

["850077"]
japanese = "私は君のことを<line-break>過大評価していたようだ。<line-break>\u3000<line-break>これは礼金だ。<line-break>ありがとう。<line-break>さぁ、行きたまえ。<end>"
english = "It seems I thought too highly of you. Here is your reward. Thank you. Now go.<end>"

["850078"]
japanese = "私たちだけでも、<line-break>侵略者たちに立ち向かっていく。<line-break>君の助けはいらない。<end>"
english = "We will face the invaders without you. We do not need your help.<end>"

["850079"]
japanese = "気がついたか？\u3000ちょうどいい。<line-break>今ロティも片づいたところだ。<line-break>お前も今から地獄に送ってやる。<end>"
english = "Awake, are you? Perfect timing. I've just finished off Lottie. Now I'll send you to hell too.<end>"

["850080"]
japanese = "お父様…？<line-break>ものすごい物音がしましたが。<end>"
english = "Father...? I heard a terrible crash.<end>"

["850081"]
japanese = "ちっ、人が来やがったか。<line-break>運のいい奴だ。<end>"
english = "Tch. Someone's coming. Lucky bastard.<end>"

["850082"]
japanese = "悪いことは言わねえ、<line-break>ぬれぎぬがイヤなら早く逃げることだ。\u3000<line-break>\u3000<line-break>リベルダムじゃな、<line-break>非市民の言うことなんて無視される。<line-break>お前が犯人じゃないって言っても無駄だ。<end>"
english = "Take my advice: if you don't want to be framed, get out of here fast. In Liberdam, no one listens to a non-citizen. It won't matter how much you protest your innocence.<end>"

["850083"]
japanese = "お父様？<end>"
english = "Father?<end>"

["850084"]
japanese = "き、君は…？<end>"
english = "Y-you are...?<end>"

["850085"]
japanese = "お父様？<end>"
english = "Father?<end>"

["850086"]
japanese = "<value:$28>様でありますね。<line-break>総督から伺っております。<line-break>どうぞ、お通りください！<end>"
english = "You are <value:$28>, correct? The governor said to expect you. Please, go right in!<end>"

["850087"]
japanese = "いらっしゃーい。<line-break>待ってたわ！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>嬉しいじゃない？<line-break>あのテロの親玉を殺してくれたなんて！<line-break>あ、これ、謝礼ね。<end>"
english = "Welcome! I've been waiting for you! Isn't it wonderful? You killed that terrorist ringleader! Oh, and here's your reward.<end>"

["850088"]
japanese = "あなたって、できるのねー。<line-break>アタシ有能な人ってシビレちゃうの。<line-break>美しいって思うわ。<line-break>どう、アタシの下で働かない？<line-break>仕事はちょっとダーティでハードよ。<line-break>でも、やりがいはあるわ。<end>"
english = "You really are good. Competence gives me such a thrill. It's beautiful. How would you like to work for me? The work is a little dirty and hard, but it's rewarding.<end>"

["850089"]
