["850151"]
japanese = "この調子よ。<line-break>ザギヴに張り付いていてね。\u3000\u3000\u3000<line-break>\u3000<line-break>奴を皇帝にするように<line-break>あなたが誘導し、<line-break>奴を自滅させるのよ。<end>"
english = "Keep it up. Stay close to Zagiv. Guide her into becoming emperor, then make her destroy herself.<end>"

["850152"]
japanese = "特に、何か大変事が起こったときは<line-break>何をさしおいても、政庁の<line-break>彼女のそばにいてちょうだい。<line-break>いいわね。<end>"
english = "Whenever something momentous happens, drop everything and stay beside her at the Government Hall. Understood?<end>"

["850153"]
japanese = "ンフフ、<line-break>うまくやったみたいじゃなーい？<end>"
english = "Heh heh... Looks like you pulled it off, didn't you?<end>"

["850154"]
japanese = "いいのいいの。<line-break>解放軍なんて捨て駒よ。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>アタシの部下じゃないし。<line-break>それよりもザギヴの信頼を<line-break>あなたが勝ち得たことの方が大事だわ。<end>"
english = "It's fine, it's fine. The Liberation Army is expendable. They're not my subordinates, after all. What matters is that you won Zagiv's trust.<end>"

["850155"]
japanese = "この調子でザギヴに取り入ってね。<line-break>こまめにザギヴのいる<line-break>エンシャントの政庁に出入りするの。<line-break>特に、何か大変事が起こったときは、<line-break>何をさしおいても<line-break>彼女のそばにいてちょうだい。<end>"
english = "Keep ingratiating yourself with Zagiv. Visit the Ancient Government Hall often while she's there. Whenever something momentous happens, drop everything and stay by her side.<end>"

["850156"]
japanese = "まずは彼女を皇帝に据えること。\u3000\u3000<line-break>いいわね。<end>"
english = "First, make her emperor. Understood?<end>"

["850157"]
japanese = "あの女、結構あなたのことを\u3000\u3000\u3000<line-break>信頼してるわ。この調子よ。<line-break>\u3000<line-break>とにかく、ティラの娘と呼ばれる<line-break>古代の闇の怪物殲滅をがんばって、<line-break>あの女の信頼を勝ち得てね？<end>"
english = "She trusts you quite a bit. Keep it up. For now, focus on exterminating the ancient monster of darkness known as the Daughter of Tira, and earn her trust.<end>"

["850158"]
japanese = "あの女が東方方面を調べるからって<line-break>あなたに護衛を依頼してきたら、<line-break>必ず受けるの。いいわね。<end>"
english = "If she asks you to escort her while she investigates the eastern region, be sure to accept. Understood?<end>"

["850159"]
japanese = "あなた、かなりザギヴの好感度\u3000\u3000\u3000\u3000<line-break>高いわよねえ。あの女、結構、<line-break>あなたのことを信頼してるわよ。<line-break>あの女は古代の闇の怪物の殲滅に<line-break>入れ込んでいるみたいだから。<line-break>その仕事をこなして点数を稼ぐのよ。<end>"
english = "Zagiv seems to like you very much. She trusts you quite a bit. She also appears obsessed with exterminating the ancient monsters of darkness, so complete those jobs and win more favor.<end>"

["850160"]
japanese = "そうそう、近いうちにあの女、<line-break>ウチを調べるっいってたわね。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>解放軍に襲わせて、<line-break>適当にごまかしちゃおうと<line-break>思ってたんだけど、使えるわ。<end>"
english = "Oh, yes. She said she'd be investigating us soon. I was going to have the Liberation Army attack her and use the confusion to cover things up, but this could prove useful.<end>"

["850161"]
japanese = "あの女が東方方面を調べるからって<line-break>護衛を依頼してきたら、必ず受けるの。<line-break>きっとあなたの株が上がるわ。<end>"
english = "If she asks you to escort her while she investigates the eastern region, be sure to accept. That should raise her opinion of you.<end>"

["850162"]
japanese = "あなた、ザギヴの受けがイイ感じよ。<line-break>このまま、がんばって<line-break>あの巨乳女に近づきなさい。<line-break>まず、とにかく<line-break>エンシャントの墓地にいる<line-break>あの女に声をかけるの。\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "You're making a good impression on Zagiv. Keep at it and get closer to that big-breasted woman. For now, just speak to her at the cemetery in Ancient.<end>"

["850163"]
japanese = "そして、あの女が入れ込んでいる<line-break>古代の怪物の殲滅の仕事を<line-break>請け負って、その仕事の数こなすのよ。<end>"
english = "Then take jobs exterminating the ancient monsters she's so obsessed with, and complete as many as you can.<end>"

["850164"]
japanese = "ザギヴはエンシャントの墓地の<line-break>自分の一族の墓によく出かけているわ。<line-break>見つけたら、積極的に話しかけて。<line-break>あのコ、人とのつきあい方を知らない<line-break>頭デッカチちゃんだから、結構ムッと<line-break>するだろうけど、ここはがまんよ。<end>"
english = "Zagiv often visits her family grave in the cemetery in Ancient. If you find her there, make a point of talking to her. She's a little know-it-all who has no idea how to deal with people, so she'll probably bristle, but just bear with her.<end>"

["850165"]
japanese = "あとねえ。ティラの娘と呼ばれる<line-break>古代の闇の怪物退治に<line-break>あの女、異様な執念を燃やしてるのよ。<line-break>ギルドでその仕事を受けて、<line-break>その仕事をこなすのよ。<line-break>いつか、あの女の信頼が得られるわ。<end>"
english = "One more thing. She's strangely obsessed with hunting down the ancient monsters of darkness known as the Daughters of Tira. Take those jobs at the Guild and see them through. In time, you'll earn her trust.<end>"

["850166"]
japanese = "頼りにしてるわよ<end>"
english = "I'm counting on you.<end>"

["850167"]
japanese = "ハァーイ、こちらを総督府の前まで<line-break>送ってあげてちょうだい？<end>"
english = "Hellooo! Would you please escort this person to the Governor-General's Office?<end>"

["850168"]
japanese = "はっ！\u3000<value:$28>様<line-break>どうぞ、お通りください！<end>"
english = "Yes! <value:$28>, please go right in!<end>"

["850169"]
japanese = "美少年ベドブ、愛の狩人…。<line-break>フフフ、かわいいでしょう？<line-break>でも、中身は今のアタシ以下よ。<line-break>だって、守りたかった人を\u3000\u3000\u3000<line-break>守れなかったんですもの…。<end>"
english = "Bedob the beautiful boy, hunter of love... Heh heh. Adorable, isn't he? But inside, he's even less of a person than I am now. He couldn't protect the person he wanted to protect...<end>"

["850170"]
japanese = "ごめんなさいね、待たせちゃって。<line-break>ちょっとヤボ用があった物だから。<line-break>じゃ、報告を聞きましょうか。<end>"
english = "Sorry to keep you waiting. I had a little business to take care of. Now, let's hear your report.<end>"

