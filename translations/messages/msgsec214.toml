["2140000"]
japanese = "異種族間の７用開始<end>"
english = ""

["2140001"]
japanese = "…<value:$28>さん。<line-break>どうしてここに？<end>"
english = "…<value:$28>. Why are you here?<end>"

["2140002"]
japanese = "…えっ、ヒューズが？<end>"
english = "…What? Hughes did?<end>"

["2140003"]
japanese = "そうですか。そんなことが…。<end>"
english = "I see. So that's what happened…<end>"

["2140004"]
japanese = "違います！<line-break>私は今もずっと<line-break>彼のことを想い続けています。<line-break>それどころか、この想いは<line-break>日増しに募るばかりです。<line-break>でも、だからこそ…。<end>"
english = "No! I still love him as much as ever. If anything, my feelings grow stronger with each passing day. But that is precisely why…<end>"

["2140005"]
japanese = "…彼に会うのが<line-break>怖くなってしまったのです。<end>"
english = "…I became afraid to see him.<end>"

["2140006"]
japanese = "…そう。怖いのです。<line-break>私たちエルフは人間と<line-break>比較にならないほど長命です。<line-break>いつか彼は、私を残して<line-break>先に死んでしまう…。<line-break>そして、私だけが生き続けていく。<line-break>ある日突然、彼がいなくなり、<line-break>幸せだった昨日までが嘘のように消え<line-break>悲しみの日々が始まるのです。<line-break>心に穴が空いたまま何千年と続く歳月を<line-break>苦しみと哀しみを背負いながら、無為に<line-break>生き続けなければならないのです…。<end>"
english = "…Yes. I am afraid. We elves live far longer than humans. Someday he will die before me, leaving me behind… and I alone will go on living. Then one day, he will suddenly be gone. All the happiness I had known until the day before will vanish as though it had all been a lie, and my days of sorrow will begin. For thousands of years, I will have to go on living a pointless existence, with a hole in my heart, bearing all that pain and grief…<end>"

["2140007"]
japanese = "…そんなこと、<line-break>私には…とても耐えられません。<line-break>\u3000<line-break>それで、彼に会えなくなって<line-break>しまったのです。<line-break>\u3000<line-break>愛の先に待っている絶望が、<line-break>私は恐ろしいのです。<end>"
english = "…I could never bear that. That is why I could no longer bring myself to see him. I am terrified of the despair waiting at the end of our love.<end>"

["2140008"]
japanese = "異種族間で恋を成就させることは<line-break>相互理解や共存にも増して難しい…。<line-break>\u3000<line-break>その点、お主は立派じゃ…。<end>"
english = "For two people of different races to find fulfillment in love is harder even than achieving mutual understanding or coexistence… In that respect, you have done admirably.<end>"

["2140009"]
japanese = "恋心で理性を失うこともなく<line-break>ちゃんと踏みとどまっておる。<line-break>\u3000<line-break>激情にかられ、ダークエルフに<line-break>身を落とすこともなく、な。<end>"
english = "You have not let love rob you of reason. You have held yourself back, rather than surrendering to passion and falling so far as to become a Dark Elf.<end>"

["2140010"]
japanese = "！！<end>"
english = "!!<end>"

["2140011"]
japanese = "しかし明日も、明後日も<line-break>踏みとどまっておられる保証はない。<line-break>\u3000<line-break>まずは彼に、<line-break>お主のすべての想いを<line-break>包み隠さずぶつけてみぬか？<end>"
english = "But there is no guarantee you will be able to hold back tomorrow, or the day after. Why not begin by telling him everything you feel, without concealing a thing?<end>"

["2140012"]
japanese = "…そうですね。おっしゃるとおりです。<end>"
english = "…Yes. You are right.<end>"

["2140013"]
japanese = "彼に会ったら伝えていただけますか？<line-break>私はここで待っています、と。<end>"
english = "If you see him, would you tell him that I am waiting here?<end>"

["2140014"]
japanese = "種族の違いを越え、つながりを<line-break>求めている者たちを見ておると<line-break>ひと肌脱いでやりたくなってな。<line-break>まったく年甲斐もない。<line-break>お節介焼きの神官じゃわい。<end>"
english = "When I see people reaching across the divide between races in search of a bond, I cannot help wanting to lend a hand. At my age, I should know better. What a meddlesome priest I am.<end>"

