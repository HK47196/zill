japanese = "あなたにとって、この地には<line-break>どのような意味があるのですか？\u3000\u3000\u3000<line-break>\u3000<line-break>ここには私と、私が守る封印、<line-break>それしかありません。<line-break>あなたが来るべき所ではないはずです。<end>"
english = "What meaning does this place hold for you? There is nothing here but me and the seal I guard. Surely this is not a place you should come to.<end>"

["1160116"]
japanese = "そこから先へは<line-break>通すことはできません。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>たとえ、残る命が短くても、<line-break>それが私の果たすべき役目です。<line-break>どうか、お引き取りください。<end>"
english = "I cannot allow you to go any farther. Even if I have little time left, this is the duty I must fulfill. Please, turn back.<end>"

["1160117"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よくぞ、来た。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。<line-break>\u3000\u3000\u3000\u3000我は火の精霊神ウルカーン。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000我が願いをかなえよ。<end>"
english = "Welcome, Bearer of the Infinite Soul. I am Ulkaan, the spirit god of fire. Grant my wish.<end>"

["1160118"]
japanese = "\u3000\u3000汝、この先の地にて、あのお方を封じる\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000憎き巨人を倒すのだ…。<line-break>\u3000\u3000さすれば我、汝に至高の炎を与えん…。<end>"
english = "In the land ahead, slay the hated giant who holds the revered one sealed away... Do so, and I shall grant you the supreme flame...<end>"

["1160119"]
japanese = "わかった<end>"
english = "Understood.<end>"

["1160120"]
japanese = "関係ない<end>"
english = "Not my concern.<end>"

["1160121"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000よし。なれば我、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000汝を封印の扉へとみちびかん。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000汝、猛き炎の光に身を投じ、<line-break>\u3000\u3000\u3000封印の巨人プネウマに挑むがよい。<end>"
english = "Very well. Then I shall guide you to the sealed door. Cast yourself into the fierce glow of the flames and challenge Pneuma, the sealed giant.<end>"

["1160122"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000そうか。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000ならば去るがよい。<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000しかし、我は待っているぞ。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000汝のごとき強き魂が<line-break>\u3000\u3000\u3000あの憎き巨人を倒しに現れることを。<end>"
english = "I see. Then go. But I shall be waiting for a mighty soul such as yours to appear and defeat that hateful giant.<end>"

["1160123"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000…どうした？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000怖じ気づいたか？<end>"
english = "…What is it? Have you lost your nerve?<end>"

["1160124"]
japanese = "そんなことはない<end>"
english = "Not at all.<end>"

["1160125"]
japanese = "やめておこうかな<end>"
english = "Maybe I should back out.<end>"

["1160126"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000ならば、行け。<line-break>\u3000\u3000\u3000\u3000彼の憎き巨人を打ち倒すのだ。<end>"
english = "Then go. Strike down that accursed giant.<end>"

["1160127"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000腰抜けめが。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000…まぁ、よいわ。<line-break>\u3000\u3000\u3000\u3000プネウマに挑まんとするなら<line-break>\u3000\u3000\u3000\u3000\u3000またいつでも来るがよい。<end>"
english = "You coward. …Well, no matter. If you intend to challenge Pneuma, you may return whenever you wish.<end>"

["1160128"]
japanese = "小賢しきかな、ウルカーンめ。<line-break>恥も知らずに<line-break>かような人の子を遣わしおって…。\u3000<line-break>汝もまた、愚かしくも哀れなる者よ。<line-break>奴の思惑も知らずに<line-break>のこのこと来るとはな。<end>"
english = "What a petty schemer you are, Urkaan. Shamelessly sending a child of man to do your bidding... And you, too, are a foolish, pitiable creature, coming here without the faintest notion of Urkaan's designs.<end>"

["1160129"]
japanese = "胎の封印を破らんとする者の命を<line-break>吹き消すことこそ我が使命。<line-break>己の無知と無力とを知るがよい！<end>"
english = "My charge is to snuff out the life of any who would break the seal of the womb. Know now your own ignorance and impotence!<end>"

["1160130"]
japanese = "ば、バカな…。<line-break>バイアス様よりいただきし我が力を<line-break>しりぞける人の子がいようとは…。<line-break>無知なる人の子よ…。<line-break>己が所業の意味に気づきしとき、<line-break>汝は罪の重さに耐えられぬぞ。<end>"
english = "I-impossible... That a child of man could repel the power Bias bestowed upon me... Ignorant child of man... When you learn the meaning of what you have done, the weight of your sin will be more than you can bear.<end>"

["1160131"]
japanese = "愚かなり…愚かなり……。<end>"
english = "Foolish... so foolish...<end>"

["1160132"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000よくやった…\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ……。<end>"
english = "You have done well... Bearer of the Infinite Soul....<end>"

["1160133"]
japanese = "\u3000\u3000\u3000\u3000\u3000よくぞ、プネウマを倒した。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000約束通り、汝に至高の炎を授けよう。\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>\u3000\u3000\u3000\u3000\u3000汝の魔道の資質満たされ、\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000内なる炎燃え盛るならば<line-break>\u3000\u3000\u3000この至高の炎、必ずや汝を助けん。\u3000\u3000\u3000<end>"
english = "Well done defeating Pneuma. As promised, I shall grant you the Supreme Flame. Should your gift for the magical arts reach its fullness and the flame within you blaze, this Supreme Flame will surely aid you.<end>"

["1160134"]
japanese = "火の最高位の魔法が解放された。<end>"
english = "The highest-level fire magic has been unlocked.<end>"

["1160135"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000では、さらばだ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000<value:$28>、<line-break>\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。<end>"
english = "Then farewell, <value:$28>, Bearer of the Infinite Soul.<end>"

["1160136"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000再び来たか。<value:$28>、<line-break>\u3000\u3000\u3000\u3000\u3000\u3000無限のソウルを持つ者よ。\u3000\u3000\u3000\u3000<line-break>\u3000\u3000\u3000\u3000\u3000\u3000プネウマを退治する気に<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000なったのだな？<end>"
english = "You have returned, <value:$28>, Bearer of the Infinite Soul. So, you have decided to defeat Pneuma?<end>"

["1160137"]
japanese = "しょうがないな<end>"
english = "Fine, if I have to.<end>"

["1160138"]
japanese = "関係ないってば<end>"
english = "It's got nothing to do with me!<end>"

