["1160000"]
japanese = "フレアメッセージ開始<end>"
english = ""

["1160001"]
japanese = "誰だ？<end>"
english = "Who are you?<end>"

["1160002"]
japanese = "冒険者…か。<line-break>何をお探しかな、人の家で？<end>"
english = "An adventurer, are you? What are you looking for in someone else's home?<end>"

["1160003"]
japanese = "探求、真理の追究、経験、体験…。<line-break>君たちは軽々しくそう口にする。<line-break>その言葉の本当の意味も知らずにな。<end>"
english = "Exploration, the pursuit of truth, experience, firsthand experience... You people speak of such things so lightly, without knowing what those words truly mean.<end>"

["1160004"]
japanese = "君の冒険の理由は問わないが<line-break>人の領域を土足で侵すようなことは<line-break>やめてほしいものだな。<end>"
english = "I won't ask why you go adventuring, but I'd rather you stopped barging into other people's territory.<end>"

["1160005"]
japanese = "まあ、君ひとりに言っても<line-break>仕方のないことだがね。<end>"
english = "Still, there is little point in telling you alone.<end>"

["1160006"]
japanese = "おおかた、アキュリュースを見て、<line-break>同じくラドラス４人の巫女と縁がある<line-break>この地にも何かあると思うのだろう？<end>"
english = "I suppose you saw Aqyurius and assumed there must be something here as well, since this place, too, has ties to one of the four priestesses of Ladras. Am I right?<end>"

["1160007"]
japanese = "あのような聖なる座所があるのは<line-break>風の巫女が作った街エルズと、<line-break>水の巫女の街アキュリュースだけだよ。<end>"
english = "Sacred seats like that exist only in Elz, the city founded by the Priestess of Wind, and Aqyurius, the city of the Priestess of Water.<end>"

["1160008"]
japanese = "同じくラドラスの火の巫女ウルと<line-break>縁があるとはいっても、この地には\u3000<line-break>火の精霊神の聖なる座所はない。<line-break>巫女の縁のある地に精霊神の座所が<line-break>あるなら、地の精霊神の座所は<line-break>いったい、どこにあるんだね？<end>"
english = "This place may likewise have ties to Priestess Uru, Ladras's Priestess of Fire, but there is no sacred seat of the elemental god of fire here. If every land connected to a priestess held the seat of an elemental god, then where, exactly, would the seat of the elemental god of earth be?<end>"

["1160009"]
japanese = "伝説では、地の巫女ズゥは\u3000\u3000\u3000\u3000<line-break>ラドラスの街を砂漠の中へと<line-break>沈めたという。<line-break>ならば地の精霊神の座所は、砂漠の<line-break>地下深くにあるとでもいうのかね？<end>"
english = "Legend says that Zuu, the Priestess of Earth, sank the city of Ladras into the desert. Are we to believe, then, that the seat of the elemental god of earth lies deep beneath the sands?<end>"

["1160010"]
japanese = "ハハハハ、バカな！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>いや失礼、冒険者の想像力には<line-break>驚かされるばかりだよ。<end>"
english = "Hahahaha! What nonsense! Forgive me. An adventurer's imagination never ceases to amaze me.<end>"

["1160011"]
japanese = "しかし、君には君の冒険があるように<line-break>こちらにはこちらの生活がある。<line-break>あまり、住人に迷惑はかけないでくれ。<end>"
english = "But just as you have your adventure, we have our own lives here. Please don't cause the townspeople too much trouble.<end>"

["1160012"]
japanese = "すまない。言葉が厳しかった。<line-break>ただ、わかってほしかったのだよ。<line-break>私もこの街の長老なのでな。<line-break>この町ウルカーンは、別に、<line-break>旅人をうとんでいるわけではない。<line-break>また、来たまえ。<end>"
english = "I'm sorry. My words were harsh. I only wanted you to understand. I am an elder of this town, after all. Urkaan does not shun travelers. Do come again.<end>"

["1160013"]
japanese = "どうしたの？<line-break>キミ、元気ないよ？<end>"
english = "What's wrong? You seem kind of down.<end>"

["1160014"]
japanese = "ふぅん、ウルカーンの長老に<line-break>そんなこと言われたんだ。<end>"
english = "Oh. So that's what the elder of Urukahn told you.<end>"

["1160015"]
japanese = "でも、長老の言うこと、ウソだよ。<line-break>ボク、巫女だからわかっちゃうんだ。<end>"
english = "But what the elder said isn't true. I can tell because I'm a priestess.<end>"

["1160016"]
japanese = "うん。ボク、感じるよ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>火の巫女はここにいる。<line-break>彼女の名前は…フレア…。<line-break>この町のどこかに、きっとボクたちが<line-break>見つけていない道があるんだよ。<line-break>調べてみようよ、<value:$28>。<end>"
english = "Yes. I can feel it. The Fire Priestess is here. Her name is... Flare... There must be a path somewhere in this town that we haven't found yet. Let's look for it, <value:$28>.<end>"

["1160017"]
japanese = "でも、ボクは、<line-break>ここに火の巫女もいるし<line-break>火の精霊神殿もあると思うけど？\u3000\u3000<line-break>だってさ、ラドラスにも地の精霊神の<line-break>座所への道が隠されてあったんだよ。<line-break>ここだってそうに違いないよ。<end>"
english = "But I think the Fire Priestess is here, and so is the temple of the Fire Spirit God. There was a hidden path to the seat of the Earth Spirit God in Ladras, remember? There has to be one here too.<end>"

["1160018"]
japanese = "ね、<value:$28>、<line-break>この町を、よーく、探してみようよ。<line-break>ボク、火の巫女に会ってみたいんだ。<end>"
english = "Come on, <value:$28>. Let's take a really good look around this town. I want to meet the Fire Priestess.<end>"

["1160019"]
japanese = "でもボクは、火の精霊神の神殿は<line-break>この町にあるんじゃないかと思うけど？<line-break>きっと、火の巫女もそこにいるよ。<line-break>ね、<value:$28>、<line-break>明日起きたら、もういっぺん<line-break>この町を、よーく探してみようよ。<end>"
english = "But I think the temple of the Fire Spirit God might be somewhere in this town. I'm sure the Fire Priestess is there too. Hey, <value:$28>, when we wake up tomorrow, let's give the town another really thorough search.<end>"

["1160020"]
japanese = "よし！<line-break>じゃ、今日はもう休もう。<line-break>明日からまた、がんばらなきゃね。<line-break>それじゃ、おやすみ。<line-break><value:$28>。<end>"
english = "All right! Let's call it a day. We'll have to get back to it tomorrow. Good night, <value:$28>.<end>"

["1160021"]
japanese = "火の巫女フレア様は、<line-break>人を避けておられる。<line-break>集中の邪魔になるからな。<end>"
english = "Lady Flare avoids other people. Their presence interferes with her concentration.<end>"

["1160022"]
japanese = "君も二度と精霊神殿には<line-break>近づかないことだ。<end>"
english = "You are not to go near the Spirit Temple again, either.<end>"

["1160023"]
japanese = "フレア様は、<line-break>火の精霊神ウルカーンに仕える\u3000\u3000\u3000<line-break>火の巫女なのだ。<line-break>同時に魔道王国ラドラスの<line-break>最後の４人の巫女のひとり、<line-break>火の巫女ウルの血を引く者でもある。<end>"
english = "Lady Flare is the Priestess of Fire who serves Urkhan, the Fire Spirit God. She is also descended from Priestess Uru of Fire, one of the last four priestesses of Magic Kingdom Ladras.<end>"

["1160024"]
japanese = "そして、同時にこの地にある\u3000\u3000\u3000<line-break>封印を見守り続ける者でも<line-break>あるわけだ。<line-break>君らには、火の精霊神殿に近づいて<line-break>フレア様の妨げになるようなことを<line-break>しないで欲しいものだ。<end>"
english = "She also keeps watch over the seal here. I would ask that none of you approach the Temple of the Fire Spirit or do anything that might disturb Lady Flare.<end>"

["1160025"]
japanese = "ウルカーンには魔道士が多い。\u3000\u3000\u3000<line-break>マグマゴーレムの技術を学ぼうという<line-break>魔道士たちがこの地に集うからだ。<line-break>ゆえに、この町は魔道士による自治が<line-break>行われている。その代表者として<line-break>私が長老をやっているというわけだ。<end>"
english = "Urkhan has many mages, drawn here to study the art of the Magma Golem. That is why the town is self-governed by its mages, and I serve as elder as their representative.<end>"

["1160026"]
japanese = "この町、ウルカーンを立てたのは<line-break>魔道王国４人の巫女のひとりウルだ。\u3000<line-break>\u3000<line-break>ウルは魔道王国の高度な魔道技術を<line-break>すべて封印し、この町を守るために<line-break>マグマゴーレムの技のみを遺したのだ。<end>"
english = "Uru, one of the Magic Kingdom's four priestesses, founded this town of Urkhan. Uru sealed away all of the kingdom's advanced magical arts, leaving behind only the art of the Magma Golem to protect the town.<end>"

["1160027"]
japanese = "このウルカーンや周りの土地は、\u3000\u3000\u3000<line-break>昔は海の底だったそうだ。<line-break>\u3000<line-break>しかし、火の巫女ウルがこの近辺の<line-break>火山を爆発させ、大地を作ったという。<line-break>ウルカーン誕生の伝説だよ。<end>"
english = "They say Urkhan and the surrounding lands once lay beneath the sea. But Priestess Uru of Fire caused the volcanoes here to erupt and created the land. That is the legend of Urkhan's birth.<end>"

["1160028"]
japanese = "誰…？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>…長老以外の…人…。<end>"
english = "Who...? Someone... other than the elder...<end>"

["1160029"]
japanese = "…ここは、<line-break>火の精霊神殿。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>私はフレア。<line-break>この神殿と、それに連なる<line-break>封印を守る…火の巫女。<end>"
english = "…This is the Temple of the Fire Spirit. I am Flare… the Fire Priestess who guards this temple and the seal linked to it.<end>"

["1160030"]
japanese = "その道を進むことは\u3000\u3000\u3000\u3000\u3000<line-break>なりません。<line-break>\u3000<line-break>この神殿の奥にある封印…、<line-break>それを守るのが私の役目。<line-break>どうか、お引き取りください。<end>"
english = "You must not go any farther. My duty is to guard the seal deep within this temple. Please, turn back.<end>"

["1160031"]
japanese = "誰…？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>…長老以外の…人…。<end>"
english = "Who...? Someone... other than the elder...<end>"

["1160032"]
japanese = "…ここは、<line-break>火の精霊神殿。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>私はフレア。<line-break>この神殿と、それに連なる<line-break>封印を守る…火の巫女。<end>"
english = "…This is the Temple of the Fire Spirit. I am Flare… the Fire Priestess who guards this temple and the seal linked to it.<end>"

["1160033"]
japanese = "何をしているんだね、君は！？<end>"
english = "What do you think you're doing?!<end>"

["1160034"]
japanese = "私は、火の巫女…。<line-break>この火の神殿で<line-break>封印を守るための存在…。<end>"
english = "I am the Fire Priestess… I exist to guard the seal in this fire temple…<end>"

["1160035"]
japanese = "はい、長老。<end>"
english = "Yes, Elder.<end>"

["1160036"]
japanese = "こんな所にまで足を踏み入れるとは<line-break>君たち冒険者は本当に<line-break>社会の理をわきまえないのだな。<line-break>早々に立ち去ってくれ。<line-break>観光地などと混同して、むやみに<line-break>足を踏み入れられては困るのだよ。<end>"
english = "To think you'd set foot in a place like this. You adventurers really don't understand the rules of society, do you? Please leave at once. This isn't a tourist attraction, and I can't have you wandering in as you please.<end>"

["1160037"]
japanese = "ここから先は通すわけにはいかん。<line-break>そもそも、君がここにいること自体<line-break>認めるわけにはいかないのだ。<line-break>さあ、早々に<line-break>ここから立ち去ってくれ。<end>"
english = "I cannot allow you to go any farther. In fact, I cannot allow you to be here at all. Now leave this place, at once.<end>"

["1160038"]
japanese = "その道を進むことは\u3000\u3000\u3000\u3000\u3000<line-break>なりません。<line-break>\u3000<line-break>この神殿の奥にある封印…、<line-break>それを守るのが私の役目。<line-break>どうか、お引き取りください。<end>"
english = "You must not go any farther. My duty is to guard the seal deep within this temple. Please, turn back.<end>"

["1160039"]
japanese = "私の役目は<line-break>ここにいて、神殿と<line-break>それに連なる封印を守ること。\u3000\u3000<line-break>それが私がここにいる理由です。<line-break>ですが、あなたはなんのために<line-break>こうしてここに足を運ぶのですか？<end>"
english = "My purpose is to remain here and guard the temple and the seals connected to it. That is why I am here. But what purpose brings you here?<end>"

["1160040"]
japanese = "ここには私の他に誰もいません。<line-break>またここに長老以外の人が\u3000<line-break>来ることもありません。<end>"
english = "There is no one here but me. And no one besides the Elder ever comes here.<end>"

["1160041"]
japanese = "…さびしくないか？\u3000…ですか？<line-break>それは必要としている人間に<line-break>事欠くことですね。<line-break>私は誰も必要としません。<line-break>だから必要としている人間に<line-break>事欠くことはありません。<end>"
english = "You ask if I am lonely? Loneliness is the lack of someone one needs. I need no one. Therefore, I lack no one I need.<end>"

["1160042"]
japanese = "…役目のためだけに生きることは<line-break>つらくはないか？\u3000…ですか？<end>"
english = "You ask if it is painful to live for nothing but my purpose?<end>"

["1160043"]
japanese = "針と糸は縫い物をするとき、\u3000\u3000<line-break>幸せではないでしょうか？<line-break>\u3000<line-break>その役目を果たせるということは<line-break>幸せではないでしょうか？<line-break>私は道具に生まれて幸せです。<end>"
english = "Wouldn't a needle and thread be happy when used for sewing? Isn't being able to fulfill one's role a kind of happiness? I am happy to have been born a tool.<end>"

["1160044"]
japanese = "あなたには私は必要でない。<line-break>私の存在はあなたの存在に<line-break>意味をなさない。<line-break>…それなのに、ここに来る。<end>"
english = "You have no need of me. My existence means nothing to yours. And yet you come here.<end>"

["1160045"]
japanese = "あなたの行動は<line-break>長老の行動と同じです。<line-break>そして、同様に不可解です。<end>"
english = "Your behavior is the same as the Elder's. And equally incomprehensible.<end>"

["1160046"]
japanese = "あなたは、<line-break>私を必要としているようには\u3000\u3000<line-break>感じられません。<line-break>それなのに、なぜ、何度もここに<line-break>来られるのですか？<line-break>私にはわかりません。<end>"
english = "I do not sense that you need me. So why do you keep coming here? I do not understand.<end>"

["1160047"]
japanese = "その道を進むことは\u3000\u3000\u3000\u3000\u3000<line-break>なりません。<line-break>\u3000<line-break>この神殿の奥にある封印…、<line-break>それを守るのが私の役目。<line-break>どうか、お引き取りください。<end>"
english = "You must not go any farther. My duty is to guard the seal deep within this temple. Please, turn back.<end>"

["1160048"]
japanese = "まだ何か、話があるのですか？<line-break>ですが、おそらく私には、あなたが<line-break>満足するような対応はできません。<line-break>あなたがなぜここに来るのか、<line-break>それが、私には<line-break>まったく理解できないので。<end>"
english = "Is there something else you wish to discuss? I doubt I can respond in a way that will satisfy you. I simply cannot understand why you come here.<end>"

["1160049"]
japanese = "…あなたはなぜ<line-break>ここに来るのですか？\u3000\u3000\u3000\u3000<line-break>私には理解できません。<line-break>その上、不安を感じます。<line-break>長老に対してよりも、ずっと。<end>"
english = "Why do you come here? I don't understand. And you make me uneasy―far more so than the Elder does.<end>"

["1160050"]
japanese = "あなたがここに現れると<line-break>言いようのない不安を感じます。\u3000\u3000<line-break>\u3000<line-break>ぐらつくような、燃え落ちるような、<line-break>不思議な感覚です。<line-break>あなたは、なぜここに来るのですか？<end>"
english = "Whenever you appear here, I feel an unease I cannot put into words. It is a strange sensation, as though I were wavering, burning away. Why do you come here?<end>"

["1160051"]
japanese = "何度ここに来られても、<line-break>ここには私と、私が守る封印以外\u3000\u3000\u3000<line-break>何もありません。<line-break>そして、封印には<line-break>近づけさせるわけにいきません。<line-break>あなたは、ここに用はないはずですが？<end>"
english = "No matter how often you come, there is nothing here but me and the seal under my protection. I cannot allow you near it. Surely you have no business here?<end>"

["1160052"]
japanese = "そうですか。あなたが<line-break>長老を殺したのですか。<end>"
english = "I see. So it was you who killed the Elder?<end>"

["1160053"]
japanese = "私に対して、<line-break>気を使う必要はありません。<end>"
english = "You need not spare my feelings.<end>"

["1160054"]
japanese = "そうですか…。長老が<line-break>亡くなられましたか。<end>"
english = "I see... The Elder has passed away.<end>"

["1160055"]
japanese = "それで、長老の束縛の腕輪は<line-break>どうなりました。<end>"
english = "Then what became of the Elder's Bracelet of Binding?<end>"

["1160056"]
japanese = "…そうですか。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>いえ、あなたには<line-break>別に関係のない話です。<line-break>すみませんでした。<end>"
english = "I see. No, it is nothing that concerns you. Forgive me.<end>"

["1160057"]
japanese = "そこから先へは<line-break>通すことはできません。\u3000\u3000\u3000<line-break>\u3000<line-break>それが私の役目です。<line-break>どうか、お引き取りください。<end>"
english = "I cannot allow you to go any farther. That is my duty. Please, turn back.<end>"

["1160058"]
