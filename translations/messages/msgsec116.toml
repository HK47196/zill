<value:$01><equal>21…くだらんな。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>このような弱い男の<line-break>後悔につきあう暇などないな。 <end><if><value:$01><equal>9うぅわ、しめっぽい。<line-break>こういうの、ちょ～っと<line-break>苦手なんだよね～。<line-break>そんなわけで、アタシは<line-break>退散させてもらうわ。<line-break>じゃあね。<value:$28>。 <end><if><value:$01><equal>20………………。<line-break>無益な。 <end><if><value:$01><equal>3…悲しいのう。<line-break>フレアという娘も、この男も。<line-break>\u3000<line-break>じゃが、どんなに悲しく、<line-break>間違っておっても、それもまた<line-break>愛の姿なんじゃろうのう…。 <end><if><value:$01><equal>11………………。<line-break>\u3000<line-break>\u3000<line-break>こんな愛し方って…<line-break>悲しすぎる…<end><if><value:$01><equal>27………………。<end><if><value:$01><equal>26な…なんということじゃ。<line-break> <line-break> <line-break>愛には姿はない…<line-break>じゃが、これでは何も救われん…フレアという娘も、この男も。<end><if><value:$01><equal>193これダメ！<line-break>これダメです！<line-break>こんなのってダメです！<line-break>だって、これじゃ…！<line-break>こんなんじゃ…！<line-break>ひどすぎます…。かわいそうです…。<end><if><value:$01><equal>191………………。<line-break><line-break><line-break>愛って、時に人を狂わせる…。<line-break>悲しいわね。<end><if><value:$01><equal>190間違ってる！<line-break>そんなものが愛のはずがない！<line-break><line-break>愛は壊すことじゃない！<line-break>壊してしまって<line-break>それを嘘で隠すことじゃない！<end>ちょ、ちょっとこれ、<line-break>ものすごいこと書いてるよ。<line-break>\u3000<line-break>…ん～、でも、きれいじゃないよね。<line-break>歌にできるような内容じゃないや。 <end>"
english = "<if><value:$01><equal>2... How... how could anyone do such a thing? Killing someone and just making a replacement... It's madness...<end><if><value:$01><equal>4... Maybe we shouldn't have read that...<end><if><value:$01><equal>5That left a really bad taste in my mouth... Wait! Then the Flare at the Temple of Fire now is the artificial one?<end><if><value:$01><equal>6No... Treating a human life like some mere object... Sorry, <value:$28>. I don't feel very well. I'll see you later.<end><if><value:$01><equal>12Well... That was quite a record of twisted love. So the Flare here now is the one he made... Just treat her in your own way.<end><if><value:$01><equal>13Ugly... and repulsive. This investigation was a waste of time.<end><if><value:$01><equal>10Sis! That's some pretty shocking stuff, isn't it!? He killed the woman he loved, then made another one... Why would anyone do something so senseless?!<end><if><value:$01><equal>14How sad... Both the girl called Flare and this man. Yet however tragic and misguided it may be, perhaps this too is a form that love can take...<end><if><value:$01><equal>15No! How could something like that be allowed?! I can't accept it. Flare... Both Flares... I feel so sorry for both of them...<end><if><value:$01><equal>17Oh, how ridiculous. What is wrong with this man? He's a fool. A complete fool. What was the point of coming to this musty place to read such a dreary story? What a waste of time.<end><if><value:$01><equal>7I see. So that was what happened... But Lord Nemea needed the divine artifact of darkness as well. I'm sorry. We trampled on your wish.<end><if><value:$01><equal>19I feel sorry for all three of them... Flare, the Flare he created, and that man too... <value:$28>, let's at least be kind to the Flare who's in the temple now.<end><if><value:$01><equal>8That was a truly tragic diary... Well, love comes in many forms, just as strength does.<end><if><value:$01><equal>21Pathetic. I have no time to indulge the regrets of such a weak man.<end><if><value:$01><equal>9Ugh, how depressing. I'm not very good with this sort of thing. So I'm getting out of here. Bye, <value:$28>.<end><if><value:$01><equal>20Pointless.<end><if><value:$01><equal>3How sad... Both the girl called Flare and this man. Yet however tragic and misguided it may be, perhaps this too is a form that love can take...<end><if><value:$01><equal>11... To love someone this way... It's too sad...<end><if><value:$01><equal>27...<end><if><value:$01><equal>26Wh-what a terrible thing... Love has no shape... but this saves no one. Not the girl called Flare, and not this man...<end><if><value:$01><equal>193No! This is wrong! It's all wrong! Because this... This is just... It's too horrible. I feel so sorry for them...<end><if><value:$01><equal>191... Love can sometimes drive people mad... How sad.<end><if><value:$01><equal>190It's wrong! That could never be love! Love isn't about destroying someone! It isn't destroying someone and then hiding it with a lie!<end>W-wait, this says some pretty shocking things. Hmm... But it isn't beautiful, is it? It's not the sort of story you could turn into a song.<end>"

