["1030096"]
japanese = "さすがに多少はやるようね。<line-break>その手でお父様を殺したのですもの。<line-break>\u3000<line-break>殺人で手を汚しているあなたに<line-break>とっては、これ以上ない<line-break>お金の稼ぎ方なのでしょうね。<end>"
english = "You do have some skill, I'll grant you that. You killed Father with those very hands, after all. For someone whose hands are already stained with murder, I suppose there could be no better way to earn money.<end>"

["1030097"]
japanese = "でも、今日の賞金だけでは\u3000\u3000\u3000\u3000\u3000\u3000<line-break>あなたの補償金の額には<line-break>とてもではないけど、足りないわ。<line-break>またここで戦ってもらうわ。<line-break>それまでは、自由になさい。<line-break>次に目覚めるまでの、わずかな時間を。<end>"
english = "But today's prize money is nowhere near enough to cover the compensation you owe. You will fight here again. Until then, you are free to do as you please for the little time you have before you awaken again.<end>"

["1030098"]
japanese = "やるわね。今日の相手はそれなりに\u3000<line-break>名のある闘士なのに。<line-break>\u3000<line-break>あなたも武器で生きている人だから、<line-break>そう簡単に負けたりは<line-break>しないのでしょうけど。<end>"
english = "Not bad. Your opponent today was a fighter of some renown. Then again, you make your living with a weapon, so I suppose you wouldn't lose so easily.<end>"

["1030099"]
