["1030095"]
japanese = "負けてばかりだと、いつまでたっても\u3000<line-break>借金は減らないわよ。<line-break>\u3000<line-break>また戦ってもらいますから、<line-break>それまでは、自由になさい。<line-break>次に目覚めるまでの、わずかな時間を。<end>"
