english = "But they tried to kill you, Brother.<end>"

["1030062"]
japanese = "…俺の言うことを聞け。<line-break>お前らには、<line-break>手に血を塗らせたくない。<end>"
english = "Do as I say. I don't want blood on your hands.<end>"

["1030063"]
japanese = "目的のものはいただいた。<line-break>それでいい。行くぞ。<end>"
english = "We have what we came for. That's enough. Let's go.<end>"

["1030064"]
japanese = "では、ブツはもらっていく。<line-break>じゃあな。<end>"
english = "We'll be taking the goods, then. See you around.<end>"

["1030065"]
japanese = "エステル<end>"
english = "Esther<end>"

["1030066"]
japanese = "ニスチル<end>"
english = "Nistil<end>"

["1030067"]
japanese = "エヌチノレ<end>"
english = "Enuchinore<end>"

["1030068"]
japanese = "引き受ける<end>"
english = "Accept<end>"

["1030069"]
japanese = "引き受けない<end>"
english = "Decline<end>"

["1030070"]
japanese = "目が覚めたようね。<line-break>どう？\u3000闘技場で迎える目覚めは？<end>"
english = "Looks like you're awake. So, how does it feel to wake up in the arena?<end>"

["1030071"]
japanese = "先日話した通り、今日から闘技場で<line-break>戦ってもらいます。あなた自身の<line-break>借金のために。<line-break>さあ、もう試合の準備は<line-break>整っています。行きなさい。<end>"
english = "As I told you the other day, starting today, you'll be fighting in the arena to pay off your debt. Everything is ready for your match. Now go.<end>"

["1030072"]
japanese = "いいですね？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>必ず、<value:$28>を<line-break>殺しなさい。<line-break>あくまで試合中の事故としてです。<line-break>手法は問いません。<line-break>成功したら、さらに報酬を払います。<end>"
english = "Do you understand? You are to kill <value:$28>, without fail. It must appear to be an accident during the match. I don't care how you do it. Succeed, and you will receive an additional reward.<end>"

["1030073"]
japanese = "くっくっく。試合中の事故は<line-break>闘技場ではよくあることだからな。\u3000<line-break>\u3000<line-break>闘技場好きのクリュセイスならではの<line-break>趣向というわけだ。<end>"
english = "Heh heh heh. Accidents during a match are common enough in the arena. Just the sort of scheme one would expect from arena-loving Khryuseis.<end>"

["1030074"]
japanese = "おじさま。あまりそのようなことを\u3000<line-break>おっしゃらないでください。<line-break>\u3000<line-break>闘技場をこのような形で汚すことには<line-break>心がとがめているのです。ですが、<line-break>これもお父様の仇を討つため…。<end>"
english = "Please, don't speak of it that way. It pains my conscience to sully the arena like this. But this, too, is to avenge Father...<end>"

["1030075"]
japanese = "きっと、お父様も<line-break>お喜びになられるはずです…。<end>"
english = "I'm sure Father would be pleased...<end>"

["1030076"]
japanese = "目が覚めたようね。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>剣闘士<value:$28>。<line-break>\u3000<line-break>今日も闘技場で戦ってもらいます。<line-break>もう試合の準備は整っています。<line-break>さぁ、行きなさい。<end>"
english = "So you're awake, Gladiator <value:$28>. You'll be fighting in the arena again today. Everything is ready for your match. Now go.<end>"

["1030077"]
japanese = "試合の準備はできているようね。<line-break>でも、もうその必要はなくなったわ。<end>"
english = "Looks like everything's ready for the match. But that won't be necessary anymore.<end>"

["1030078"]
japanese = "あなたには、<line-break>別の仕事をしてもらうことにしたわ。<line-break>\u3000<line-break>せっかく、高いお金を出したのに、<line-break>間違って死なれでもしたら、<line-break>もったいないでしょう？<end>"
english = "I've decided to give you a different job. After paying so much for you, it would be a waste if you happened to die, wouldn't it?<end>"

["1030079"]
japanese = "さ、ぐずぐずしていないで、\u3000\u3000\u3000\u3000<line-break>ついてきなさい。<line-break>\u3000<end>"
english = "Now, stop dawdling and follow me.<end>"

["1030080"]
japanese = "さっそくですが、あなたには<line-break>解放軍に加わっていただきます。<end>"
english = "Let us get straight to the point. You will be joining the Liberation Army.<end>"

["1030081"]
japanese = "ディンガルに占領されたロセンを\u3000\u3000\u3000<line-break>解放するための軍隊です。<line-break>\u3000<line-break>リベルダムの有力商人が資金を出資し、<line-break>同志を募って、<line-break>極秘の内に組織したのです。<end>"
english = "It is an army formed to liberate Rocen from Dyneskal occupation. Influential merchants in Liberdam funded it, recruited like-minded people, and organized it in utmost secrecy.<end>"

["1030082"]
japanese = "ですが、人手が足りているわけ\u3000\u3000<line-break>ではないのです。<line-break>\u3000<line-break>特に危険な任務を実行できる<line-break>人材は不足しています。<end>"
english = "That does not mean we have all the people we need. We are especially short of those capable of carrying out dangerous missions.<end>"

["1030083"]
japanese = "そこで、あなたには、お金ではなく<line-break>体で払っていただくことにしました。<line-break>その方が、有効ですもの。<line-break>ただ、カン違いしないでほしいわ。<line-break>わたくしはあなたのことを<line-break>許したわけではないのですから。<end>"
english = "So I have decided that instead of paying in coin, you will pay with your body. It will be far more useful that way. But do not misunderstand me. I have not forgiven you.<end>"

["1030084"]
japanese = "解放軍の活動は命がけのもの。\u3000\u3000<line-break>捕まったら必ず殺されるわ。<line-break>せいぜい、がんばることね。<end>"
english = "The Liberation Army's work is a matter of life and death. If you are caught, you will certainly be killed. Do try your best.<end>"

["1030085"]
japanese = "その密書を解放軍の本部、<line-break>ロセン支部の順に届けてから、<line-break>私のもとに持ち帰るのが最初の仕事よ。<line-break>本部はリベルダムの東に１日、支部は<line-break>ロセンの南に２日の場所にあります。<line-break>１ケ月以内に必ず成し遂げなさい。<end>"
english = "Your first task is to deliver the Secret Letter to Liberation Army headquarters, then to the Rocen branch, and afterward bring it back to me. Headquarters is one day's journey east of Liberdam, and the branch is two days south of Rocen. You are to complete the task within one month, without fail.<end>"

["1030086"]
