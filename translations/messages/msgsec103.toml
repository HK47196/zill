["1030000"]
japanese = "クリュセイスメッセージＶ２用開始<end>"
english = ""

["1030001"]
japanese = "クリュセイス！\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>奴だ！<line-break>\u3000<line-break>お前の父、<line-break>ロティを殺したのは奴だ！<line-break>あの非市民だ！<end>"
english = "Khryuseis! That's the one! That noncitizen killed your father, Lottie!<end>"

["1030002"]
japanese = "お父さま…、いえ、<line-break>市民ロティ・クロイス殺害の罪で<line-break>あなたを逮捕します。<end>"
english = "Father... No. I hereby arrest you for the murder of the citizen Lottie Krois.<end>"

["1030003"]
japanese = "しらを切るつもりなの？<line-break>市民アンティノ・マモンから<line-break>証言を得ているのよ。<line-break>あなたがクロイス宛てに<line-break>毒の入った酒を届けたのを<line-break>彼は目撃したのよ！<end>"
english = "Are you going to deny it? We have testimony from the citizen Antino Mammon. He saw you deliver poisoned wine intended for Krois!<end>"

["1030004"]
japanese = "そうだ！\u3000私は見たのだ！<line-break>奴がロティ殺しの犯人だ！<line-break>市民警官、奴を逮捕しろ！<end>"
english = "Yes! I saw it! That noncitizen murdered Lottie! Citizen officer, arrest that noncitizen!<end>"

["1030005"]
japanese = "待ってよ。その人、<line-break>やってないって<line-break>言ってるじゃない！<end>"
english = "Wait! The accused says, “I didn't do it”!<end>"

["1030006"]
japanese = "また、下等な非市民ね。<line-break>非市民は黙っていなさい。\u3000\u3000\u3000<line-break>\u3000<line-break>これはリベルダムの問題なの。<line-break>非市民のあなたに<line-break>口出しする権利はないわ。<end>"
english = "Another lowly noncitizen. Be silent. This is Liberdam's affair. A noncitizen like you has no right to interfere.<end>"

["1030007"]
japanese = "なんだよ。非市民非市民って<line-break>いっつも見下して。<end>"
english = "What's with all this “noncitizen” talk? You're always looking down on us.<end>"

["1030008"]
japanese = "事実、非市民なんて<line-break>ろくでもない食い詰め者ばかりよ。<line-break>\u3000<line-break>そんな非市民の言うことなんて<line-break>聞くことはないわ。<line-break>さ、あの非市民を逮捕なさい。<end>"
english = "The fact is, noncitizens are nothing but penniless riffraff. We needn't listen to anything one of them says. Now arrest that noncitizen.<end>"

["1030009"]
japanese = "どうして、そんなに<line-break>非市民をバカにするんだ！<line-break>\u3000<line-break>リベルダムの繁栄は<line-break>非市民の労働が<line-break>支えているんだぞ！<end>"
english = "Why do you have such contempt for noncitizens? Liberdam's prosperity rests on their labor!<end>"

["1030010"]
japanese = "バカが汗を流して、利口者がもうける。<line-break>これがリベルダムのやり方ですの。<line-break>\u3000<line-break>あと、よそ者に<line-break>口を出させないというのもね。<line-break>従順な人だけいていただければいいの。<end>"
english = "Fools sweat, and the clever profit. That is how Liberdam works. And we don't allow outsiders to meddle in our affairs. We only need those willing to obey.<end>"

["1030011"]
japanese = "気に入らないのなら<line-break>出ていっていただいても結構よ。\u3000\u3000\u3000<line-break>代わりならいくらでもいるから<end>"
english = "If you don't like it, you are quite welcome to leave. There are any number of others to take your place.<end>"

["1030012"]
japanese = "なんだよ、なんだよ！<line-break>そんなに市民は偉いの？\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>この人は無実だって言っているのに<line-break>非市民だから逮捕が許される…<line-break>そんなのないよ！<end>"
english = "What, what?! Are citizens really that special? This person says, “I didn't do it!” And you think it's all right to make the arrest just because the accused is a noncitizen? That's not right!<end>"

["1030013"]
japanese = "まずいぞ、クリュセイス。\u3000\u3000\u3000<line-break>言い過ぎだ。<line-break>\u3000<line-break>非市民どもが、騒ぎを聞きつけて<line-break>集まって来るぞ。<line-break>ここは、引き上げよう。<end>"
english = "This is bad, Khryuseis. You've said too much. This commotion will draw the noncitizen rabble. We should leave.<end>"

["1030014"]
japanese = "引き上げるですって、<line-break>アンティノおじさま？<line-break>父を殺した者が目の前にいるのに？\u3000<line-break>非市民のクズどもなんて<line-break>いくら集まってもクズはクズですわ。<end>"
english = "Withdraw, Uncle Antino? With my father's murderer standing right before us? However many of those noncitizen scum gather, scum is still scum.<end>"

["1030015"]
japanese = "クズだと！<end>"
english = "Scum?!<end>"

["1030016"]
japanese = "いかん、引き上げるぞ。<line-break>クリュセイスを守れ！<end>"
english = "No, we must withdraw! Protect Khryuseis!<end>"

["1030017"]
japanese = "…覚えてなさい。<line-break>絶対に罪を償わせるから！<end>"
english = "Remember this. I will make you pay for your crime!<end>"

["1030018"]
japanese = "危なかったね。<line-break>大丈夫？<end>"
english = "That was close. Are you all right?<end>"

["1030019"]
japanese = "ボクはエステル。<line-break>キミは？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "I'm Esther. What's your name?<end>"

["1030020"]
japanese = "へぇー、<value:$28>か。<line-break>\u3000<line-break>\u3000<line-break>ところで<value:$28>、<line-break>ボクの名前、覚えた？<end>"
english = "Oh, so you're <value:$28>. By the way, <value:$28>, do you remember my name?<end>"

["1030021"]
japanese = "よしよし、正解正解。<line-break>人の名前と顔を覚えるのは<line-break>人付き合いの基本だからね。\u3000<line-break>じゃ、<value:$28>。<line-break>またどこかで会えるといいね。<end>"
english = "That's right! Remembering people's names and faces is the first rule of getting along with others. Well, <value:$28>, I hope we meet again somewhere.<end>"

["1030022"]
japanese = "ひどいなあ。ボクの名前、<line-break>さっき教えたばっかだよ。\u3000\u3000\u3000\u3000\u3000<line-break>しかも、ボク、キミの恩人じゃない。<line-break>エ・ス・テ・ル！<line-break>ボクはこの名前結構好きなんだから、<line-break>間違えないでよ、もう！<end>"
english = "That's awful. I only just told you my name! And didn't I just save you? Es-ther! I happen to like my name, so get it right next time!<end>"

["1030023"]
japanese = "…ま、いいか。<line-break>それじゃあね、<value:$28>。<end>"
english = "Oh, never mind. See you around, <value:$28>.<end>"

["1030024"]
japanese = "どこをどう聞き間違えたら<line-break>そんな風になるんだよ！\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>エ・ス・テ・ル！<line-break>ボクはこの名前結構好きなんだから、<line-break>間違えないでよ、もう！<end>"
english = "How could you possibly mishear it that badly? Es-ther! I happen to like my name, so get it right next time!<end>"

["1030025"]
japanese = "…ま、いいか。<line-break>それじゃあね、<value:$28>。<end>"
english = "Oh, never mind. See you around, <value:$28>.<end>"

["1030026"]
japanese = "待ちなよ。<end>"
english = "Hold it.<end>"

["1030027"]
japanese = "あんた、親友に毒入りの酒が<line-break>届けられたって時に、ぼーっと<line-break>それを見てたのかい？<end>"
english = "When someone delivered poisoned wine to your closest friend, you just stood there and watched?<end>"

["1030028"]
japanese = "い、いや。ただ、奴が、<line-break>クロイス邸に毒入りの酒を<line-break>持って行くところをだな…。<end>"
english = "N-no. I only saw that person taking poisoned wine to the Krois residence...<end>"

["1030029"]
japanese = "へぇ、よく毒入りだってわかったな。<line-break>その届けものが毒だなんて、誰にも<line-break>わからなかったろうに。<end>"
english = "Oh? Impressive that you knew it was poisoned. No one could have known what was in that delivery.<end>"

["1030030"]
japanese = "し、しかし！\u3000奴の態度は<line-break>あからさまに不審だったのだ！<end>"
english = "B-but the way that person was acting was obviously suspicious!<end>"

["1030031"]
japanese = "そうか。で、結局あんたは<line-break>その不審な奴が親友の家を訪れた時は<line-break>何もせずに見ていたんだな？<end>"
english = "Right. So when this suspicious character visited your closest friend's home, you did nothing but watch?<end>"

["1030032"]
japanese = "ち、違う…いや！<line-break>遠かったのだ！\u3000<line-break>追いかけたが追いつけなかったのだ！<end>"
english = "Th-that's not... No! I was too far away! I gave chase, but I couldn't catch up!<end>"

["1030033"]
japanese = "なるほどね。<line-break>じゃあ整理するとこういうことかな。<line-break>\u3000<line-break>あんたは遠くから、怪しい奴が<line-break>クロイス邸に毒入りの酒を<line-break>持ってきたところを目撃したわけだ。<end>"
english = "All right, let's make sure I have this straight. From a distance, you saw a suspicious character bringing poisoned wine to the Krois residence.<end>"

["1030034"]
japanese = "で、遠くから見たそいつの姿形が<line-break><value:$28>に似ていると。<line-break>それだけで判断しているんだな？<line-break>ああ、もっとも、遠くから<line-break>毒入りの酒を見破るくらいなら<line-break>人の見分けくらい簡単かな？<end>"
english = "And the person you saw from so far away looked like <value:$28>. That's all you're basing this on? Then again, if you could spot poisoned wine from that distance, I suppose recognizing a person would be easy.<end>"

["1030035"]
japanese = "小うるさい非市民ね。<line-break>市民に向かって無礼だわ！\u3000\u3000\u3000<line-break>\u3000<line-break>それに、あなたの言っていることは、<line-break>この非市民が父殺しの犯人でない<line-break>という証拠にもならなくてよ！<end>"
english = "What an irritating noncitizen. Show some respect when speaking to a citizen! Besides, nothing you've said proves that this noncitizen did not murder my father!<end>"

["1030036"]
japanese = "だが、<value:$28>を<line-break>しょっぴくには無理があるだろ？<end>"
english = "But that's hardly enough to haul <value:$28> away, is it?<end>"

["1030037"]
japanese = "…<value:$28>って言ったわね。<line-break>覚えてらっしゃい。<end>"
english = "You said <value:$28>, didn't you? Just you wait.<end>"

["1030038"]
japanese = "ま、助かってよかった。<line-break>ぬれぎぬ、災難だったな。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>しかし、奴らが、<line-break>あれで諦めたとは思えない。<line-break>気をつけろよ。<value:$28>。<end>"
english = "Well, at least you're safe. Being falsely accused is rotten luck. But I doubt that was enough to make them give up. Watch yourself, <value:$28>.<end>"

["1030039"]
japanese = "…レーグ。<end>"
english = "Reig...<end>"

["1030040"]
japanese = "…うぬは行くといい。<line-break>あとは我が引き受けた。<end>"
english = "You may go. Leave the rest to me.<end>"

["1030041"]
japanese = "レーグ、どいて！<line-break>あなたには関わりのないこ…。<end>"
english = "Reig, move! This has nothing to do with y―<end>"

["1030042"]
japanese = "…あなたが、そ、そう言うなら、<line-break>今は引き上げるわ。<end>"
english = "If... if you insist, then I will withdraw for now.<end>"

["1030043"]
japanese = "覚えてなさい！<line-break>父の仇は必ず…！<end>"
english = "Remember this! I will avenge my father...!<end>"

["1030044"]
japanese = "…強くなれ。<line-break>それだけだ。<end>"
english = "Grow stronger. That is all.<end>"

["1030045"]
japanese = "おう、<value:$28>。ついさっき、<line-break>えらくうまみのある仕事が入ったんだ。<line-break>\u3000<line-break>報酬はなんと、３０００００ギアだ。<line-break>これだけありゃあ、しばらく美味いメシ<line-break>食っていけるぜ。どうだい？<end>"
english = "Hey, <value:$28>. A very lucrative job just came in. The reward is a whopping 300,000 Gea. With that much, you can eat well for quite a while. What do you say?<end>"

["1030046"]
japanese = "そうこなくちゃな。<line-break>こんな話、滅多にないからな。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>頼みたいのは、この珍しい宝石、<line-break>ナイトメアの雫さ。<line-break>ロストールのギルドに届けてくれ。<end>"
english = "That's what I like to hear. Opportunities like this don't come along often. I want you to deliver this rare gemstone, the Nightmare's Tear, to the Guild in Rostorl.<end>"

["1030047"]
japanese = "ただ、こいつは保管が難しくてな、<line-break>普通に持ち歩いたら２週間ともたずに<line-break>露のように消えるんだ。気をつけろよ。<end>"
english = "There's just one thing: it's difficult to preserve. Carry it around normally, and it'll vanish like dew in less than two weeks. Be careful.<end>"

["1030048"]
japanese = "そうかい。残念だ。<line-break>あんたを見込んで頼んだのにな。<line-break>こんなに分のいい仕事はないんだぜ。\u3000<end>"
english = "I see. That's a shame. I asked because I thought you were the right one for the job. You won't find a better deal than this.<end>"

["1030049"]
japanese = "あ、すまん。お前さんに呼ばれたもんで<line-break>ついつい勢いで来たけど、俺、実は<line-break>今ちょっとヤボ用があるんだわ。<line-break>悪いが俺抜きで頑張ってくれ。<line-break>いや、ホント、ゴメン。<line-break>じゃあ、またな。<value:$28>。<end>"
english = "Oh, sorry. You called, so I came running without thinking, but I've actually got something I need to take care of right now. Sorry, but you'll have to manage without me. I really am sorry. See you around, <value:$28>.<end>"

["1030050"]
japanese = "ま、彼にも色々都合があるようですし、<line-break>今回はあきらめた方がよさそうですね。<line-break>他の方に呼びかけてみてはどうですか？<end>"
english = "Well, it seems he has other commitments, so it would be best to give up on him this time. Why not call for someone else?<end>"

["1030051"]
japanese = "よう、また会ったな。<end>"
english = "Hey. We meet again.<end>"

["1030052"]
japanese = "今日は、お前さん方の敵だ。<line-break>悪いが、ナイトメアの雫は<line-break>いただく。<end>"
english = "Today, I'm your enemy. Sorry, but I'll be taking the Nightmare Drop.<end>"

["1030053"]
japanese = "<if><value:$2A><less>50よう、あんた<line-break><value:$28>だな？<end><value:$2B>の<value:$28>…<line-break>お前さんのことだな？<end>"
english = "<if><value:$2A><less>50Hey, you're <value:$28>, right?<end><value:$28> of <value:$2B>... That's you, isn't it?<end>"

["1030054"]
japanese = "強盗が名乗るのもおこがましいが<line-break>俺はツェラシェルと言う。<line-break>\u3000<line-break>お前さんの持っている<line-break>ナイトメアの雫をもらいに来た。<line-break>悪いな。<end>"
english = "Making introductions is a bit rich for a robber, but I'm Zelashell. I've come to take the Nightmare Drop you've got. Sorry.<end>"

["1030055"]
japanese = "ヴァイ！\u3000ヴィア！<end>"
english = "Vai! Via!<end>"

["1030056"]
japanese = "ヴァイ！\u3000ヴィア！！<line-break>…っくっ…、ぅうおおあ！<end>"
english = "Vai! Via!! Ngh... Rrraaagh!<end>"

["1030057"]
japanese = "兄さん！<end>"
english = "Brother!<end>"

["1030058"]
japanese = "なんでそんな事を！<line-break>兄さんの体は…<end>"
english = "Why would you do that? Your body...<end>"

["1030059"]
japanese = "…大丈夫だ。心配するな。<line-break>さあ、もう行くぞ。<end>"
