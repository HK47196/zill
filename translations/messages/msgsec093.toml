["930036"]
japanese = "炎の神剣を打つにはな、<line-break>祈り手と打ち手が必要なんじゃ。<line-break>そのどちらが欠けても神剣は打てぬ。<line-break>カッツとロッチナもそうじゃ。<line-break>きっとロッチナがここで祈り、<line-break>カッツが打ったのじゃろう。<end>"
english = "To forge the divine sword of flame, you need someone to pray and someone to do the forging. Without both, the divine sword cannot be forged. It was the same for Katz and Rotchina. Rotchina must have prayed here while Katz did the forging.<end>"

["930037"]
japanese = "なぜ、ふもとで打つのかはわからぬ。<line-break>恐らくは精霊力の流れか何かの関係で<line-break>それがもっともよいのじゃろうな。<line-break>さあ、わしはふもとの小屋へ戻る。<line-break>お主はここで祈りをささげてくれ。<line-break>激しい炎を宿した剣を思い描くんじゃ。<end>"
english = "I don't know why it has to be forged at the foot of the mountain. Perhaps the flow of spirit power, or something like that, makes it the best place. Now, I'll return to the hut down below. Stay here and pray. Picture a sword with fierce flames burning within it.<end>"

["930038"]
