["930005"]
japanese = "ダサイ、ダサイ、ダサすぎよーー！\u3000<line-break>本当にセンスのかけらもないわね！<line-break>\u3000<line-break>アタクシのように気高く崇高な存在は<line-break>本来ならそんな泥くさいことになんて<line-break>一生無縁なのよ。わかっているの？<end>"
english = "Lame, lame, utterly lame! You really haven't got a shred of taste! A noble, exalted being such as myself should go an entire lifetime without ever having anything to do with such grubby business. Is that clear?<end>"

["930006"]
japanese = "それじゃ、<value:$28>！<line-break>それが欠けていたんじゃ！<end>"
english = "That's it, <value:$28>! That's what I was missing!<end>"

["930007"]
japanese = "きゃ、ちょ、ちょっと、どきなさいよ！<line-break>この酒まみれ泥ドワーフ！<line-break>アタクシに酒臭い身体、近づけないで！<end>"
english = "Eek! W-wait, move! You filthy, booze-soaked dwarf! Keep that booze-reeking body away from me!<end>"

["930008"]
japanese = "最強の剣を作りたいと願ったころは、<line-break>わしにも感動があふれとった。<line-break>剣を打つたびに心が踊った。<line-break>それが、いつの間にか、最強の剣を<line-break>作らねばならぬという思いが、<line-break>動かしようのない重石になっておった。<end>"
english = "When I first dreamed of forging the strongest sword, I was brimming with passion. My heart leapt every time I forged a sword. But somewhere along the way, the conviction that I had to forge the strongest sword became a weight I could no longer shift.<end>"

["930009"]
japanese = "わしは刀工だから剣を打っとった<line-break>のではない。剣を作りたかったから<line-break>刀工になったんじゃ。<end>"
english = "I didn't forge swords because I was a swordsmith. I became a swordsmith because I wanted to forge them.<end>"

["930010"]
