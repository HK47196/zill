["930001"]
japanese = "もぅ、ほんっっっっっっっっとに\u3000\u3000\u3000<line-break>あったま、きちゃうわ！<line-break>\u3000<line-break>何が世界は驚きに満ちているよ！<line-break>ぜんっぜん、なんっにもないじゃない、<line-break>そんなの！<end>"
