english = "<value:$28>.<end>"

["930039"]
japanese = "さて、わしの旅は終わった。<line-break>これからのわしは<line-break>お主と旅を共にする戦士じゃ。<line-break>では、行こうかの、<value:$28>。<line-break>まずは…酒場じゃ。<line-break>なぜだか無性に酒が飲みとうなったわ。<end>"
english = "Well, my journey is over. From now on, I am a warrior who travels at your side. Shall we be off, <value:$28>? First... to the tavern. For some reason, I find myself desperately craving a drink.<end>"

