["1590110"]
japanese = "ゴブリンは聖杯の力で人語を話し、\u3000\u3000<line-break>ゴブゴブ団を名乗ってます。<line-break>\u3000<line-break>あと、ネモの話だと<line-break>エンシャントにいるという話でしたが<line-break>急がないと、移動してしまうでしょう。<end>"
