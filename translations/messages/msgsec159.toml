["1590136"]
japanese = "破壊神ウルグの復活に<line-break>用いられた強力な魔道器です。\u3000<line-break>\u3000<line-break>１２種類あるといいます。<line-break>禁断の聖杯は<line-break>その中のひとつですね。<end>"
