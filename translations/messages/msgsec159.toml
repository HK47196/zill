["1590097"]
japanese = "うちにいるネモですよ。<line-break>もともと聖杯は彼のものなのです。\u3000\u3000<line-break>\u3000<line-break>アーギルシャイアの企みを知った彼は<line-break>自分の神器を奪われたくないと考え、<line-break>この際、神器の力でもとの姿に戻ろうと<end>"
