["1590144"]
japanese = "ですから、彼女は告げるものと\u3000\u3000\u3000<line-break>呼ばれています。<line-break>\u3000<line-break>ですが、あなたとの十数年の暮らしが<line-break>彼女を変えてしまったようですね。<line-break>\u3000<end>"
