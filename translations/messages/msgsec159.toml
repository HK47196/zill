["1590145"]
japanese = "彼女にとって、あなたとの短い年月は<line-break>自らの使命を忘れさせるくらい<line-break>大切なものだったのかもしれません。<end>"
english = "Perhaps the brief years she spent with you meant enough to make her forget her own calling.<end>"

["1590146"]
japanese = "破壊神ウルグの円卓騎士の１人です。\u3000<line-break>開け放つものと呼ばれています。<line-break>\u3000<line-break>告げるものアスティアにより<line-break>破壊神復活の時を告げられたとき、<line-break>破壊神を目覚めさせるのが彼です。<end>"
english = "He is one of Urg's Knights of the Round Table, known as He Who Opens the Way. When Astia, She Who Heralds, announces that the time has come for the God of Destruction's resurrection, his role is to awaken the god.<end>"

["1590147"]
japanese = "その実力は、円卓騎士の中でも<line-break>トップクラスです。アーギルシャイア、<line-break>ネモらは彼に率いられていました。<end>"
english = "He is one of the strongest of the Knights of the Round Table. Argyleshire, Nemo, and the others once served under his command.<end>"

["1590148"]
japanese = "そうですか。<end>"
english = "Is that so?<end>"

