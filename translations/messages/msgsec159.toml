["1590170"]
japanese = "<if><value:$29><equal>%0ふぅん。じゃ、<line-break>お兄ちゃんもあたしとおんなじだ。\u3000<line-break>\u3000<line-break>ルルアンタもね、<line-break>お父さんとお母さんいないよ。<end>ふぅん。じゃ、<line-break>お姉ちゃんもあたしとおんなじだ。\u3000<line-break>\u3000<line-break>ルルアンタもね、<line-break>お父さんとお母さんいないよ。<line-break>ずっとはやく、死んじゃった。<end>"
english = "<if><value:$29><equal>%0Oh. Then you're just like me, mister. Lulluantha doesn't have a mother or father either.<end>Oh. Then you're just like me, miss. Lulluantha doesn't have a mother or father either. They died a long, long time ago.<end>"

["1590171"]
japanese = "お世話になってたフリントさんも、\u3000<line-break>旅の途中で盗賊に襲われて、<line-break>……………死んじゃった。<line-break>そのあとで、旅芸人の一座に<line-break>拾われたんだけど、その一座が、最近<line-break>起きている誘拐事件の犯人だったの。<end>"
english = "Flint, who'd been looking after me, was attacked by bandits on the road, and... he died. After that, a troupe of traveling performers took me in. But they were the ones behind the recent kidnappings.<end>"

["1590172"]
japanese = "<if><value:$29><equal>%0それを知っちゃって<line-break>ルルアンタも捕まっちゃったところを<line-break>お兄ちゃんに助けてもらったの。<end>それを知っちゃって<line-break>ルルアンタも捕まっちゃったところを<line-break>お姉ちゃんに助けてもらったの。<end>"
english = "<if><value:$29><equal>%0When Lulluantha found out, they caught her too. Then you saved her, mister.<end>When Lulluantha found out, they caught her too. Then you saved her, miss.<end>"

["1590173"]
japanese = "うん、ルルアンタ、元気だよ。\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>あのね、<line-break>フリントさんが言ってくれたんだ。<line-break>\u3000<end>"
english = "Mm-hm! Lulluantha's doing fine. You know, Flint once told me something.<end>"

["1590174"]
japanese = "ルルアンタは元気だね、<line-break>ルルアンタが元気だと私も<line-break>うれしくなって元気が出るって。<line-break>だから、ルルアンタ、<line-break>天国のフリントさんが<line-break>喜んでくれるように元気なんだ。<end>"
english = "Flint said, “Lulluantha, you're always so cheerful. When you're cheerful, it makes me happy and cheers me up too.” So Lulluantha stays cheerful to make Flint happy in heaven.<end>"

["1590175"]
japanese = "<if><value:$29><equal>%0お兄ちゃんも、<line-break>ルルアンタが元気だとうれしいの？<end>お姉ちゃんも、<line-break>ルルアンタが元気だとうれしいの？<end>"
english = "<if><value:$29><equal>%0Does seeing Lulluantha cheerful make you happy too, mister?<end>Does seeing Lulluantha cheerful make you happy too, miss?<end>"

["1590176"]
japanese = "<if><value:$29><equal>%0うふふ、じゃあ、ルルアンタ、<line-break>お兄ちゃんと一緒にいてあげるね。<line-break>\u3000<line-break>お兄ちゃん、お名前は？<end>うふふ、じゃあ、ルルアンタ、<line-break>お姉ちゃんと一緒にいてあげるね。<line-break>\u3000<line-break>お姉ちゃん、お名前は？<end>"
english = "<if><value:$29><equal>%0Hee hee! Then Lulluantha will stay with you, mister. What's your name?<end>Hee hee! Then Lulluantha will stay with you, miss. What's your name?<end>"

["1590177"]
japanese = "じゃ、あらためてぇ…。\u3000\u3000\u3000\u3000<end>"
english = "Then let's start over properly...<end>"

["1590178"]
japanese = "あたしは、ルルアンタ。<line-break>よろしくね、<value:$28>。<end>"
english = "I'm Lulluantha. Nice to meet you, <value:$28>.<end>"

["1590179"]
japanese = "………………？<line-break>無限のソウルを持つ者…。<end>"
english = "Hm...? The Bearer of the Infinite Soul...<end>"

["1590180"]
japanese = "うんめいに、選ばれた…もの？<end>"
english = "The one... chosen by destiny?<end>"

["1590181"]
japanese = "ウフフ。もう、今日は遅いですから、<line-break>今日は泊まっていかれてはいかがです？<end>"
english = "Heh heh. It's already late, so why not stay here for the night?<end>"

["1590182"]
japanese = "それじゃあ、<line-break>よろしくお願いします。<end>"
english = "Then we'll take you up on that. Thank you.<end>"

["1590183"]
japanese = "さて、あなたたちは冒険者として\u3000\u3000<line-break>これから何をすればいいのかを、<line-break>\u3000<line-break>探しているようですが、<line-break>その前に説明したいものがあります。<line-break>こちらに来てください。<end>"
english = "Now, you seem to be wondering what you should do next as adventurers. Before that, though, there's something I'd like to explain. Come this way.<end>"

["1590184"]
japanese = "俺は猫じゃない、ネモだ。<line-break>破壊神の円卓騎士ネモ！<end>"
english = "I'm not a cat! I'm Nemo―Nemo, one of the God of Destruction's Knights of the Round Table!<end>"

["1590185"]
japanese = "わ、すごいすごーい！！<end>"
english = "Wow! That's amazing!<end>"

["1590186"]
japanese = "しかし、さすがは破壊神の円卓騎士\u3000<line-break>ですよね。猫の姿になってなお<line-break>人語を操るんですから。<line-break>ま、こんな感じで、<line-break>これは遠くの人を呼び寄せたり…。<line-break>さて、それでは、もう一度。<end>"
english = "But what else would you expect from one of the God of Destruction's Knights of the Round Table? Even as a cat, he can still speak the human tongue. Anyway, as you just saw, this device can summon people from far away... Now then, let's try that again.<end>"

["1590187"]
japanese = "あ、今後は、パーティーメンバーの<line-break>了解を取ってから呼び出しますから<line-break>そのあたりのことはご心配なく。<line-break>それより、<line-break>用意してあった朝ごはんは<line-break>食べていただけましたか。<end>"
english = "Oh, from now on I'll get your party members' permission before summoning them, so don't worry about that. Anyway, did you have breakfast?<end>"

["1590188"]
japanese = "くすっ、ありがとうございます。<line-break>何よりのほめ言葉です。<line-break>\u3000<line-break>それでは、さっそくですが…<line-break>先日、ミイスの村が<line-break>消失したことをご存じですか？<end>"
english = "Heh, thank you. I couldn't ask for higher praise. Now, to get straight to the matter... Have you heard that Miis Village vanished the other day?<end>"

["1590189"]
japanese = "ことはミイスを焼き払った魔人<line-break>アーギルシャイアに関わります。<end>"
english = "This concerns Argyleshire, the demon who burned Miis to the ground.<end>"

["1590190"]
japanese = "破壊神ウルグの円卓騎士と呼ばれる<line-break>強力な魔人の１人です。<line-break>\u3000<line-break>妖艶な美女で、残酷で気まぐれです。<line-break>闇の神器をひとつ手に入れるために<line-break>ミイスを焼き払ってしまいました。<end>"
english = "Argyleshire is one of the powerful demons known as Urg's Knights of the Round Table. She is a bewitching beauty, cruel and capricious. She burned Miis to the ground to obtain one of the dark divine artifacts.<end>"

["1590191"]
japanese = "ただ、彼女は<line-break>その本来の使い方以外のことを\u3000\u3000<line-break>しようとしています。<line-break>彼女は究極の合成怪物を作り<line-break>その力でおもしろ半分に世界を<line-break>破壊しようと考えています。<end>"
english = "But she intends to use it for something other than its true purpose. She plans to create the ultimate composite monster and use its power to destroy the world merely for amusement.<end>"

["1590192"]
japanese = "破壊神の円卓騎士ネモですよ。<line-break>もともと聖杯は彼のものなのです。\u3000\u3000<line-break>\u3000<line-break>アーギルシャイアの企みを知った彼は<line-break>自分の神器を奪われたくないと考え、<line-break>この際、神器の力でもとの姿に戻ろうと<end>"
english = "Nemo, the God of Destruction's Knight of the Round Table. The Grail originally belonged to him. When he learned of Argyleshire's scheme, he decided he wouldn't let her steal his divine artifact and would use this opportunity to regain his original form with its power...<end>"

["1590193"]
japanese = "急がないと、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>。<line-break>\u3000<end>"
english = "We have to hurry, <value:$28>.<end>"

["1590194"]
japanese = "円卓騎士には他に<line-break>アーギルシャイアなどがいますね。\u3000\u3000<line-break>\u3000<end>"
english = "The other Knights of the Round Table include Argyleshire.<end>"

["1590195"]
japanese = "究極生物を作ろうとして、<line-break>その製法を神器、禁断の聖杯から\u3000\u3000<line-break>得ようと、聖杯をねらっています。<line-break>円卓騎士には他に<line-break>うちのネモなどがいますね。<line-break>\u3000<end>"
english = "She seeks the Grail, hoping to learn how to create an Ultimate Life-Form from the divine artifact known as the Forbidden Grail. The other Knights of the Round Table include our own Nemo.<end>"

