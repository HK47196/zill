["1590140"]
japanese = "円卓騎士には他に、ヴァシュタール、<line-break>アーギルシャイアなどがいますね。\u3000\u3000<line-break>\u3000<end>"
english = "The other Knights of the Round Table include Vashtar and Argyleshire.<end>"

["1590141"]
japanese = "破壊神ウルグの円卓騎士の１人です。<line-break>妖艶な美女の姿をしています。<line-break>\u3000<line-break>きわめて、気まぐれで残酷です。<line-break>すでに神器を手に入れるため<line-break>ミイスの村を焼き払っています。<end>"
english = "She is one of Urg's Knights of the Round Table and takes the form of a bewitching beauty. She is exceptionally capricious and cruel. She has already burned Miis Village to the ground to obtain a divine artifact.<end>"

["1590142"]
japanese = "究極生物を作ろうとして、<line-break>その製法を神器、禁断の聖杯から\u3000\u3000<line-break>得ようと、聖杯をねらっています。<line-break>円卓騎士には他に、ヴァシュタールや<line-break>うちのネモなどがいますね。<line-break>\u3000<end>"
english = "She seeks the Grail, hoping to learn how to create an Ultimate Life-Form from the divine artifact known as the Forbidden Grail. The other Knights of the Round Table include Vashtar and our own Nemo.<end>"

["1590143"]
japanese = "破壊神ウルグの円卓騎士の１人です。<line-break>魔物を使う能力があると聞きます。<line-break>\u3000<line-break>破壊神復活の時を感知し、その時に<line-break>開け放つものヴァシュタールを<line-break>目覚めさせるのが彼女の役割です。<end>"
