["1590105"]
japanese = "<value:$28>、あなたは<line-break>魔人の恐ろしさを知っているはずです。<line-break>このまま、アーギルシャイアを<line-break>放っておくと、あなたのように<line-break>大事な人を失う人間がたくさん出ます。<end>"
english = "<value:$28>, you know how terrifying demons can be. If Argyleshire is left unchecked, many more people will lose someone precious to them, just as you did.<end>"

["1590106"]
