english = "She hopes to obtain the knowledge needed to create that monster from the Forbidden Grail, one of the Artifacts of Darkness. I want you to recover the Grail before it falls into Argyleshire's hands.<end>"

["1590094"]
japanese = "取り戻す？<line-break>聖杯は誰かに盗まれちゃったのぉ？<end>"
