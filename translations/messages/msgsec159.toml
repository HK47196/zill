english = "The Forbidden Grail is now in the hands of three Goblins called the Gobgob Gang. Try searching Ancient for now. I believe you'll find them there.<end>"

["1590138"]
japanese = "ここにいるブサイクな猫です。\u3000\u3000\u3000\u3000<line-break>口は悪いですけど、無害ですよ。<line-break>\u3000<line-break>もともとは老人星の精霊で<line-break>天空の賢者とも呼ばれた者でしたが<line-break>地上に堕ちて、魔人になりました。<end>"
english = "That ugly cat over there. He has a foul mouth, but he's harmless. He was once the spirit of the Old Man Star, known as the Sage of the Heavens, but he fell to earth and became a demon.<end>"

["1590139"]
japanese = "破壊神の強力な魔人、<line-break>１２人の円卓騎士のひとりで<line-break>名前を知るもの、の異名を持ちます。<line-break>そのあだ名の通り<line-break>金を出せば名前を付けてくれますが<line-break>ま、あんまりおすすめはしません。<end>"
