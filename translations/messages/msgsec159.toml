["1590095"]
japanese = "ええ。すでに聖杯はロストールの町から<line-break>盗み出されています。<line-break>\u3000<line-break>ですが、それを盗み出させたのは<line-break>魔人アーギルシャイアではない<line-break>別の魔人なのです。<end>"
