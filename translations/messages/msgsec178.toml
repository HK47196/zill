japanese = "妙だな…、<line-break>なぜ単独行動を…。<end>"
english = "That's strange... Why was he acting alone?<end>"

["1780030"]
japanese = "…考えてもムダか。<line-break>ネメアが考えてることなんざ、<line-break>俺にわかるわけないな。<line-break>ま、今はカルラとの戦いに<line-break>勝つことを考えよう。<line-break>さあ、行こうか。<end>"
