["1780024"]
japanese = "なんだって！？<line-break>ネメアが次元のはざまに落ちた？<end>"
english = "What!? Nemea fell into the Interdimensional Rift?<end>"

["1780025"]
japanese = "そいつは、ロストールにとっては<line-break>またとない、いい知らせだな。<line-break>\u3000<line-break>この戦いに勝てば、<line-break>生き残れるってことだ。<end>"
english = "For Rostorl, that's the best news we could have hoped for. If we win this battle, we survive.<end>"

["1780026"]
japanese = "だが…。<line-break>やな予感がしやがる。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>そいつは世界にとっては、<line-break>悪いシナリオの<line-break>始まりなのかもしれん…。<end>"
english = "But... I've got a bad feeling about this. For the world, this may be the beginning of something terrible.<end>"

["1780027"]
