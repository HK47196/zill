["1780000"]
japanese = "ロストールメッセージＶ５／１開始<end>"
english = ""

["1780001"]
japanese = "東方諸国、リベルダムと、これまで<line-break>神速の奇襲で勝利をおさめてきた<line-break>ディンガル帝国の青竜将軍カルラは、<line-break>大々的にロストール攻略を発表した。<line-break>カルラ率いる青竜軍の兵力は、<line-break>先の戦いで多くの兵を失っている<line-break>ロストール側の５倍はあると言われた。<end>"
english = "Having won victories over the Eastern Nations and Liberdam with lightning-fast surprise attacks, Karula, Azure Dragon General of the Dyneskal Empire, announced the Rostorl Campaign with great fanfare. The Azure Dragon Army under Karula was said to be five times the size of Rostorl's forces, which had lost many soldiers in the previous battle.<end>"

["1780002"]
japanese = "\u3000\u3000このことはロストールにもすぐに報じられ、<line-break>\u3000\u3000貴族、民衆を問わず大きな衝撃を与えたが、<line-break>\u3000\u3000\u3000\u3000もはやそれに対抗する力も持たず、<line-break>\u3000国内はただただ不協和音に包まれるだけだった。<line-break>\u3000その国家としての命を奪いに来るかのように<line-break>\u3000\u3000\u3000\u3000青い死神が率いる大軍の足音が<line-break>\u3000ロストールに向かって迫ってくるのだった…。<end>"
english = "News soon reached Rostorl, sending shock waves through nobles and commoners alike. Yet with no strength left to resist, the realm could do nothing but descend into discord. As if coming to extinguish Rostorl's very existence as a nation, the footsteps of a vast army led by the blue reaper drew ever closer...<end>"

["1780003"]
japanese = "\u3000\u3000青竜将軍カルラ率いるディンガル軍と<line-break>\u3000\u3000\u3000ゼネテス率いるロストール軍は<line-break>\u3000\u3000\u3000竜骨の砂漠南の街道で対峙した。<line-break>\u3000<line-break>\u3000\u3000レムオンら有力貴族の出兵拒否により、<line-break>\u3000ロストール側の兵は、ゼネテスの直属である<line-break>\u3000\u3000ファーロス家の私軍のみと噂されたが、<line-break>ゼネテスは、青竜軍を前に延々と陣を展開した。<end>"
english = "The Dyneskal Army, led by Azure Dragon General Karula, faced the Rostorl Army under Xenetes on the road south of the Dragonbone Desert. With Lemghon and other powerful nobles refusing to send troops, rumor had it that Rostorl's forces consisted solely of the private army of House Pharos, directly under Xenetes. Even so, Xenetes arrayed his troops in a line that stretched on and on before the Azure Dragon Army.<end>"

["1780004"]
japanese = "\u3000だが、そのあまりの無防備な陣取りを見て、<line-break>\u3000\u3000青竜軍は、機略を警戒して進軍を止めた。\u3000<line-break>\u3000そして、両軍が対峙してしばらくの時が経つと<line-break>\u3000\u3000\u3000\u3000ある噂がディンガル軍に流れた。<end>"
english = "But the position looked so utterly defenseless that the Azure Dragon Army halted its advance, wary of some stratagem. After the two armies had faced each other for some time, a rumor began to spread through the Dyneskal Army.<end>"

["1780005"]
japanese = "ネメア死す。<line-break>正規軍とは別に、独自に行動をしていた<line-break>皇帝ネメアが死んだという噂に<line-break>ディンガル軍は激しく動揺した。<end>"
english = "Nemea was dead. The rumor that Emperor Nemea, who had been acting independently of the regular army, had died threw the Dyneskal Army into turmoil.<end>"

["1780006"]
japanese = "一方、ゼネテスは<line-break>密かに本陣を離れ、別働隊を率いて、<line-break>カルラに奇襲をかけようとしていた。<end>"
english = "Meanwhile, Xenetes had secretly left the main camp and was leading a detached force in an attempt to launch a surprise attack on Karula.<end>"

["1780007"]
japanese = "いやー、虚名って<line-break>ホントにありがたいねえ。<line-break>ただ無謀に本陣をしけば、あの動揺だ。<line-break>ツェラシェルたちのまいてくれた<line-break>ネメア死すの偽情報も<line-break>かなり効いてるらしい。<end>"
english = "Ah, it's wonderful what a little undeserved fame can do. All we did was recklessly set up a command post, and look how badly it rattled them. The false report Zeraschel and the others spread that Nemea was dead seems to be having quite an effect too.<end>"

["1780008"]
japanese = "リベルダムを破壊して<line-break>俺たちがビビると思ってんだろうが<line-break>カルラちゃん、そりゃ大間違いだ。<line-break>奴の非道に反対する民衆が<line-break>義勇軍を率いて<line-break>俺たちに協力してくれてる。<end>"
english = "You thought destroying Liberdam would scare us, didn't you, Karula? Big mistake. The people who oppose your brutality are leading a volunteer army and have come to our aid.<end>"

["1780009"]
japanese = "彼らなしでは、少ない兵を割いて<line-break>空の本陣こさえて、カルラを足止め<line-break>…なんて策はできなかった。<line-break>人は恐怖に屈するばかりじゃない。<line-break>人は恐怖を克服するために<line-break>戦いを挑むのさ。<end>"
english = "Without them, we could never have diverted troops from our already small force to build an empty command post and hold Karula up. People don't just surrender to fear. They fight to overcome it.<end>"

["1780010"]
japanese = "万一、カルラが攻めてきたとき、<line-break>ちゃんと逃げられるよう<line-break>連中の訓練はできてるかい？<end>"
english = "Have you trained them well enough to escape if Karula should attack?<end>"

["1780011"]
japanese = "バッチリです、総司令。<line-break>逃げるだけなら、世界一です。<line-break>誰にも負けやしません。<end>"
english = "All set, Commander-in-Chief. If all we have to do is run, we're the best in the world. No one can beat us.<end>"

["1780012"]
japanese = "上できだ。連中は本陣で<line-break>旗を振ってくれりゃそれでいい。<line-break>命がけのチャンバラは俺たちの仕事だ。<line-break>俺たちは密かにカルラ軍の裏側に回り、<line-break>敵本陣を一気に突破。<line-break>カルラを討ち取る。<end>"
english = "Excellent. All they have to do is stay at the command post and wave the flags. We'll handle the life-or-death swordplay. We'll slip around behind Karula's Army, smash straight through the enemy command post, and take Karula's head.<end>"

["1780013"]
japanese = "<value:$28>。<line-break>カルラを討ち取るのは<line-break>お前にやってもらう。<line-break>奇策なんてものは何度も通用しない。<line-break>次は防げん。<line-break>絶対にカルラを討ち取ってくれ。<end>"
english = "<value:$28>, I'm leaving Karula to you. A trick like this won't work twice. We won't be able to stop her next time. Whatever happens, you have to kill Karula.<end>"

["1780014"]
japanese = "さぁーて、<line-break>カルラの陣に攻め込むにゃ、<line-break>もう少し待った方がいいな。<end>"
english = "Now then... we'd better wait a little longer before we storm Karula's camp.<end>"

["1780015"]
japanese = "今、攻め込んだら<line-break>カルラは部下を見捨てて逃げちまう。<line-break>混乱した軍なんて絶好の煙幕だ。<line-break>カルラは今率いてる数の倍は<line-break>兵を動員できるはずなんだ。<line-break>これがどういうことだか、わかるか？<end>"
english = "If we attack now, Karula will abandon her troops and run. An army in chaos makes the perfect smokescreen. She should be able to muster twice as many troops as she has now. Do you see what that means?<end>"

["1780016"]
japanese = "つまり、１回やっつけても<line-break>また兵を率いてこれるわけだ。<line-break>だから、必ずしとめないといけない。<line-break>やっこさんが、軍をまとめて<line-break>腰を上げかけたときにたたく。<line-break>それまで見つかるわけにはいかん。<end>"
english = "It means that even if we beat her once, she can come back with another army. So we have to finish her for good. We'll strike just as she finishes pulling her forces together and starts to move. Until then, we can't let anyone find us.<end>"

["1780017"]
japanese = "で、その間、悪いんだが<line-break>お前さんにもうひとつ仕事を頼みたい。<line-break>\u3000<line-break>ゼグナ鉱山の周りに魔物が出るらしい。<line-break>それも、かなり強烈な奴らなんだと。<line-break>まったく、この忙しい時に迷惑な話だ。<end>"
english = "In the meantime, sorry, but I've got one more job for you. Apparently monsters have been showing up around Zegna Mine―and nasty ones at that. Just what we needed when we're this busy.<end>"

["1780018"]
japanese = "でな、軍の奴らよりお前さんの方が<line-break>そういうのに慣れてるだろ？<line-break>いっちょ、退治してきてくれ。<line-break>ま、国を守る戦いは、人間様だけが<line-break>相手じゃないってことだな。<line-break>そういうことで、よろしく頼んだぜ。<end>"
english = "You're more used to dealing with that sort of thing than the soldiers are, right? Go take care of them for us. I suppose defending the country doesn't always mean fighting people. Anyway, I'm counting on you.<end>"

["1780019"]
japanese = "この先か…。<end>"
english = "Further in, then...<end>"

["1780020"]
japanese = "<if><value:$01><equal>3もしや、今の人影は<line-break>ネメア様ではなかったか？<line-break>どうする、<value:$28>？ <end><if><value:$01><equal>4今の人影、ネメア様に似てたかも。<line-break>でも、関わるとろくなことに<line-break>ならない気がするし…。 <end><if><value:$01><equal>5おい、<value:$28>。<line-break>今の人影、ネメアだったよな。<line-break>追いかけるか？ <end><if><value:$01><equal>6今の人影…<line-break>…ネメアじゃないかな？<line-break>どうしよう、<value:$28>？ <end><if><value:$01><equal>13今のは、ネメア。<line-break>…追うのか？ <end><if><value:$01><equal>10姉ちゃん、今の見たか？<line-break>あれ、絶対ネメアだぜ。<line-break>追うの？ <end><if><value:$01><equal>14今のはネメアではなかったか？<line-break>こんな所で供も連れずにいったい…？<line-break>どうするんじゃ、<value:$28>？ <end><if><value:$01><equal>15ねえ、<value:$28>。<line-break>今の人、ネメアさんじゃないかな？<line-break>どうしようか？ <end><if><value:$01><equal>17なに、あれ、ネメアぁ？\u3000<line-break>まさか、まさか、まさか、<line-break>あなた、ネメアを追うつもりなの？<line-break>…って、こっちの方が<line-break>ド下等生物の殺し合いより<line-break>よっぽどマシかもしれなくてね。 <end><if><value:$01><equal>19ねぇねぇ、<value:$28>。<line-break>今の人、ネメアさんみたいだったよ。<line-break>どうするのぉ？ <end><if><value:$01><equal>20…追うのか？ <end><if><value:$01><equal>11今のは…ネメア様…<line-break><value:$28>、追いかけるの？<end><if><value:$01><equal>21今のはネメアか？<line-break>こんな所で供も連れずにいったい…？<line-break>どうする、<value:$28>？ <end><if><value:$01><equal>23今のは…ネメア様…<line-break>どうする、<value:$28>？<end><if><value:$01><equal>27今のは、ネメア…。<line-break>追うのか？ <end><if><value:$01><equal>26もしや、今の人影は<line-break>ネメアではなかったか？<line-break>どうする、<value:$28>？ <end><if><value:$01><equal>24今のは…ネメア様？<line-break><value:$28><line-break>追いかけますか？<end><if><value:$01><equal>25今の人影…<line-break>ネメア…だよね？<line-break>追いかけるの？ <end><if><value:$01><equal>192あれはネメアですね。<line-break>どうしますか？<end><if><value:$01><equal>193今のはネメアさん？<line-break><value:$28>さん<line-break>追いかけますか？<line-break>でも、そうこうしているうちに<line-break>ロストールがディンガル軍に<line-break>襲われちゃうかもしれない…。<end><if><value:$01><equal>194嫌な奴が視界に入ったな…。<line-break><value:$28>、どうする？<end><if><value:$01><equal>191今の、ネメアじゃないかしら？<line-break>追いかける？<end><if><value:$01><equal>190あれはネメアじゃないか？<line-break>追うか、<value:$28>？<end>見た見た？\u3000今のネメアだよ。<line-break>でも、怒りんぼのオイフェとか<line-break>ぶあいそうなゼリグとか、いないなぁ。<line-break>ヒゲオヤジのドルドラムもいないよ。<line-break>何してるのか、気になるよね。<line-break>追いかけるの？ <end>"
english = "<if><value:$01><equal>3Could that have been Lord Nemea? What now, <value:$28>?<end><if><value:$01><equal>4That figure looked a little like Lord Nemea. But getting involved feels like asking for trouble...<end><if><value:$01><equal>5Hey, <value:$28>. That was Nemea, wasn't it? Go after him?<end><if><value:$01><equal>6That figure... Could it have been Nemea? What now, <value:$28>?<end><if><value:$01><equal>13That was Nemea. Go after him?<end><if><value:$01><equal>10Sis, did you see that? That was definitely Nemea. Going after him?<end><if><value:$01><equal>14Was that not Nemea? What could he be doing in a place like this without a single attendant...? What now, <value:$28>?<end><if><value:$01><equal>15Hey, <value:$28>. Don't you think that was Nemea? What now?<end><if><value:$01><equal>17Wait, was that Nemea? No, no, no. You're not planning to go after him, are you? Then again, that might be a lot better than those utterly inferior creatures slaughtering each other.<end><if><value:$01><equal>19Hey, hey, <value:$28>. That person looked like Nemea. What now?<end><if><value:$01><equal>20Go after him?<end><if><value:$01><equal>11That was... Lord Nemea... <value:$28>, are you going after him?<end><if><value:$01><equal>21Was that Nemea? What could he be doing in a place like this without a single attendant...? What now, <value:$28>?<end><if><value:$01><equal>23That was... Lord Nemea... What now, <value:$28>?<end><if><value:$01><equal>27That was Nemea... Go after him?<end><if><value:$01><equal>26Could that have been Nemea? What now, <value:$28>?<end><if><value:$01><equal>24Was that... Lord Nemea? <value:$28>, will you go after him?<end><if><value:$01><equal>25That figure... That was Nemea, wasn't it? Going after him?<end><if><value:$01><equal>192That was Nemea. What now?<end><if><value:$01><equal>193Was that Nemea? <value:$28>, are you going after him? But while we're doing that, the Dyneskal Army might attack Rostorl...<end><if><value:$01><equal>194Someone unpleasant just came into view... What now, <value:$28>?<end><if><value:$01><equal>191Wasn't that Nemea? Going after him?<end><if><value:$01><equal>190Wasn't that Nemea? Pursue him, <value:$28>?<end>Did you see? That was Nemea. But hot-tempered Aoife and surly Zelig aren't with him. And that bearded old man Doldrum isn't here either. Aren't you curious what Nemea is doing? Going after him?<end>"

