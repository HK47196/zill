english = "<if><value:$01><equal>3Yes... Karula comes first for now. Let us hurry.<end><if><value:$01><equal>4Looks like <value:$28> is just going to ignore it after all.<end><if><value:$01><equal>5Right. Taking down Karula comes first. Let's hurry.<end><if><value:$01><equal>6That's right. Rostorl matters more right now. Come on, let's hurry.<end><if><value:$01><equal>13So Karula comes first for now. Then stop dawdling.<end><if><value:$01><equal>10Right. Taking down Karula comes first. Let's hurry, sis.<end><if><value:$01><equal>14I understand. Karula comes first for now. Let us hurry.<end><if><value:$01><equal>15That's right. We can't let Xenetes down. Come on, let's hurry, <value:$28>.<end><if><value:$01><equal>17Whaaat? You'd rather have those miserable lower life-forms slaughter each other? How savage! How violent! I can't believe it! Miserable lower life-forms really do love killing, don't they? They know it's wrong, but call it war or justice and slaughter each other anyway!<end><if><value:$01><equal>19That's right. Helping the people of Rostorl is more important now. We have to hurry, <value:$28>.<end><if><value:$01><equal>20If so, let us hurry.<end><if><value:$01><equal>11All right. Then let's hurry.<end><if><value:$01><equal>21I understand. Then let us hurry.<end><if><value:$01><equal>23Yes... Then let us hurry.<end><if><value:$01><equal>27Yes. Then let us hurry.<end><if><value:$01><equal>26Yes. Let us press on.<end><if><value:$01><equal>24Very well, <value:$28>. Let us make haste.<end><if><value:$01><equal>25All right. Then let's hurry.<end><if><value:$01><equal>192I see. Then let's hurry.<end><if><value:$01><equal>193Exactly! At this rate, the Dyneskal Army will lay waste to Rostorl! The manager and my friends might even be killed... Please! We have to hurry!<end><if><value:$01><equal>194That's right. There's no need to worry about that one.<end><if><value:$01><equal>191Right. Protecting Rostorl comes first. Now that that's settled, let's hurry!<end><if><