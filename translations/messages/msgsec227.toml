["2270014"]
japanese = "ハァ…、ハァ…<line-break>ひとつだけ言っておく…。<line-break>おじさんではない…。勇者様だ。<end>"
english = "Hah... hah... Let me tell you one thing... It's not “mister”... It's “Lord Hero.”<end>"

["2270015"]
japanese = "まだまだ勝負はこれからだ。<line-break>絶体絶命からの大逆転は<line-break>勇者のみに許される特権。<line-break>小僧ども、お前たちは幸運だぞ。<line-break>俺様英雄伝説第３３章最大の山場を<line-break>その目で見られるのだからな！<end>"
english = "This battle is far from over. Only a Hero has the privilege of snatching victory from the jaws of certain defeat. Consider yourselves fortunate, you little whelps. You get to witness the grand climax of Chapter Thirty-Three of My Heroic Legend!<end>"

["2270016"]
japanese = "いかん！<line-break>あやつひとりでは分が悪い。<line-break><value:$28>よ、行くぞ！<end>"
english = "This is bad! The odds are against him on his own. <value:$28>, let's go!<end>"

["2270017"]
japanese = "待てっ！\u3000勇者に助太刀は無用！<line-break>この熱く燃えたぎる魂ある限り<line-break>魔物ごときに屈することはない！<end>"
english = "Wait! A Hero needs no aid! So long as this soul burns within me, I shall never yield to a mere monster!<end>"

["2270018"]
japanese = "血気盛んなのはいいが、<line-break>人の親切は素直に受けるもんじゃぞ。<line-break>\u3000<line-break>第一、勇者様の度量はそんなに<line-break>狭いものじゃなかろう。<end>"
english = "There's nothing wrong with youthful fire, but you ought to accept a kindness when it's offered. Besides, surely a Hero isn't so small-minded as all that.<end>"

["2270019"]
japanese = "むっ、むむっ…。確かに。<line-break>では仕方あるまい。<line-break>助太刀を認めてやる。<line-break>ただし、足は引っ張るなよ。<end>"
english = "Hrm... Hrrm... You have a point. Very well, then. I shall permit you to assist me. Just don't get in my way.<end>"

["2270020"]
japanese = "おじさん、大丈夫！？<end>"
english = "Mister, are you all right?!<end>"

["2270021"]
japanese = "フン…。<line-break>この程度のかすり傷、なんともない！<line-break>\u3000<line-break>だが、小僧、その前にやることが<line-break>あるだろう？<end>"
english = "Hmph... A scratch like this is nothing! But boy, there's something you ought to do first, isn't there?<end>"

["2270022"]
japanese = "えっ…！？<end>"
english = "Huh...?!<end>"

["2270023"]
japanese = "わからんのか！<line-break>女の子に礼を言わんといかんだろう？<end>"
english = "Can't you see?! You ought to thank the girl!<end>"

["2270024"]
japanese = "あっ…！<end>"
english = "Ah!<end>"

["2270025"]
japanese = "あ、ありがと…。<line-break>おかげで助かったよ。<end>"
english = "Th-Thanks... You saved us.<end>"

["2270026"]
japanese = "でも、なんで俺たちを助けたの？<end>"
english = "But why did you save us?<end>"

["2270027"]
japanese = "…わかんない。<line-break>気がついたら飛び出してたの。<end>"
english = "I don't know. Before I knew it, I'd jumped in.<end>"

["2270028"]
japanese = "そっか…。ありがとう。<end>"
english = "Oh... Thank you.<end>"

["2270029"]
japanese = "…なあ、さっきのお礼がしたいんだ。<line-break>何かほしいものとか、ないか？<end>"
english = "Hey... I want to repay you for what you did. Is there anything you want?<end>"

["2270030"]
japanese = "お友だち！<end>"
