["2270031"]
japanese = "…そ、そんなんで、いいの？<end>"
english = "I-Is that really all you want?<end>"

["2270032"]
japanese = "うん！\u3000あたし、お友だちがほしいの！<end>"
english = "Yes! I want some friends!<end>"

["2270033"]
japanese = "そっか…<end>"
english = "Oh...<end>"

["2270034"]
japanese = "じゃあ、今日からみんな友だちだ。<line-break>もう、いじめたりしないよ！<end>"
english = "Then we're all friends from now on. We won't pick on you anymore!<end>"

["2270035"]
japanese = "一緒に遊ぼうぜ！<end>"
english = "Come play with us!<end>"

["2270036"]
japanese = "うん！<end>"
english = "Okay!<end>"

["2270037"]
japanese = "もうこれであの子たちは大丈夫だな。<end>"
