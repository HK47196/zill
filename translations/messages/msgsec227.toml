["2270003"]
japanese = "未来の勇者ガルドラン参上！<line-break>\u3000<line-break>\u3000<line-break>どうした、小僧ども。<line-break>女の子をいじめることはできても<line-break>魔物に立ち向かう勇気はないのか？<end>"
english = "Girldlan, future Hero, is here! What's wrong, you little whelps? Brave enough to pick on a girl, but not brave enough to face a monster?<end>"

["2270004"]
japanese = "ごめんなさーい！<end>"
english = "We're sorry!<end>"

["2270005"]
japanese = "僕たちが悪かったよ。<line-break>助けて、おじさん！<end>"
english = "We were wrong. Help us, mister!<end>"

["2270006"]
japanese = "わかればいいんだ、わかれば。<line-break>罪を憎んで人を憎まず。<line-break>あとはこの俺様に任せろ！<end>"
english = "As long as you understand. Hate the sin, not the sinner. Now leave the rest to me!<end>"

["2270007"]
japanese = "来い、化け物！<line-break>子供たちの無垢な魂を貴様ごときに<line-break>くれてやるわけにはいかん。<line-break>完璧超絶無敵勇者の俺様が<line-break>相手になってやる！<end>"
english = "Come, beast! I won't let the likes of you have these children's innocent souls. You face the perfect, peerless, invincible Hero himself!<end>"

["2270008"]
japanese = "ぐはっ…！<end>"
english = "Gah...!<end>"

["2270009"]
japanese = "おじさん、大丈夫！？<end>"
english = "Mister, are you all right?!<end>"

["2270010"]
japanese = "しっかりして、おじさん！<end>"
english = "Hang in there, mister!<end>"

["2270011"]
japanese = "だめーっ！！<end>"
english = "No!!<end>"

["2270012"]
japanese = "バカ！\u3000逃げろ！<end>"
english = "Idiot! Run!<end>"

["2270013"]
japanese = "おじさん！\u3000起きてよぅ…。<end>"
