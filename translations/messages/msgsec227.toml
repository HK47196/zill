["2270038"]
japanese = "とりあえず礼を言っておくぞ。<line-break>俺様の英雄叙事詩が語られるとき、<line-break>貴様たちのことも付け加えてやろう。<line-break>あくまで脇役としてだが、な…。<end>"
english = "I suppose I owe you my thanks. When my heroic epic is told, I shall see that you are mentioned as well. As supporting characters, of course...<end>"

["2270039"]
japanese = "俺様には未来の勇者として果たすべき<line-break>崇高な使命が待っている。<line-break>さらばだ！<end>"
