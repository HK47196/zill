["240115"]
japanese = "ちょっとばかし俺たちを手伝ってくれないか。<line-break><value:$15>を<value:$16>まで運びたい。<line-break><value:$1B>日以内に届けてくれ。<line-break>報酬は、<value:$1A>ギアだ。<line-break>悪くないだろ。じゃあ、頼むぜ。<end>"
english = "Could you help us out a little? We need <value:$15> carried to <value:$16> within <value:$1B> days. The reward is <value:$1A> Gea. Not bad, right? We're counting on you.<end>"

["240116"]
japanese = "<value:$15>を<value:$16>まで<line-break>届けなきゃいけないのに、町の外じゃ、<line-break>モンスターとか盗賊が襲ってくる。<line-break>誰か代わりに届け物をしちゃくれないかな。<line-break><value:$1B>日以内にやってくれたら、<line-break><value:$1A>ギアは出すよ。<end>"
english = "We need <value:$15> delivered to <value:$16>, but monsters and bandits attack travelers outside town. Could someone make the delivery for us? Complete it within <value:$1B> days, and we'll pay <value:$1A> Gea.<end>"

["240117"]
japanese = "<value:$16>まで<value:$15>を<line-break>届けてはもらえんだろうか。<line-break>期限は<value:$1B>日以内。<line-break>お礼は、<value:$1A>ギアでどうじゃ。<line-break>わしらは畑仕事しか知らん。<line-break>旅とか戦いとかは知らんのじゃ。<line-break>冒険者なら、そういうことは大丈夫じゃろ？<end>"
