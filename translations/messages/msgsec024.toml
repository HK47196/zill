["240112"]
japanese = "ごひいきにしていただき感謝しております。<line-break>商売上で困った事態が生じました。<line-break><value:$16>までの危険な道のりを通って、<line-break><value:$15>を運ばないとならないのです。<line-break><value:$1B>日以内の期限、<line-break>報酬<value:$1A>ギアで、<line-break>引き受けていただけませんでしょうか。<end>"
