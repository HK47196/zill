["240122"]
japanese = "私たちの仕事が歌を歌うことなら、<line-break>冒険者の仕事は、様々な困難を乗り越え、<line-break>人々を助けることです。<line-break><value:$15>を運ぶこの仕事も、そのひとつ。<line-break><value:$16>まで、<value:$1B>日以内で、<line-break><value:$1A>ギアのお礼でどうですか？<end>"
english = "If our work is to sing, an adventurer's work is to overcome all manner of hardships and help people. Carrying <value:$15> is one such job. How does <value:$1A> Gea sound for delivery to <value:$16> within <value:$1B> days?<end>"
