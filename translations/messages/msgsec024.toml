["240118"]
japanese = "毎度ありがとうございます。<line-break>本日は、お願いしたいことがございます。<line-break>道中、危険が予想される<value:$16>までの<line-break><value:$15>の運搬です。<line-break>期限は<value:$1B>日以内。<line-break>お礼は、<value:$1A>ギアです。<end>"
english = "Thank you for your continued patronage. We have a request today: transport <value:$15> along the dangerous road to <value:$16>. Deadline: within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["240119"]
