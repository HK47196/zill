english = "Because I have you, <value:$28>.<end>"

["1890037"]
japanese = "<value:$28>！<end>"
english = "<value:$28>!<end>"

["1890038"]
japanese = "さあ、儀式を始めようか。<end>"
english = "Now, shall we begin the ritual?<end>"

["1890039"]
japanese = "ウルグはネメアに降臨する。<line-break>僕もそう思っていたよ。<line-break>\u3000<line-break>でもね、ウルグは<line-break>いつだって捜してるんだ。<line-break>もっとも適した入れ物をね。<end>"
