["1890040"]
japanese = "<value:$28>、<line-break>君は強くなりすぎたんだ。<line-break>ウルグはネメアより君がいいってさ。<line-break>君に降臨した方が<line-break>より強大な力を出せるんだよ。<line-break>破壊神は君の肉体をお望みだ。<end>"
english = "<value:$28>, you've become too strong. Ulugh wants you instead of Nemea. Descending into you will bring out far greater power. The God of Destruction desires your body.<end>"

