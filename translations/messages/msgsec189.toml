["1890140"]
japanese = "<if><value:$01><equal>2ネメア様！<line-break>生きていらっしゃったんですね！ <end><if><value:$01><equal>3おお！\u3000ネメア様！<line-break>ご無事で何より！ <end><if><value:$01><equal>4ネメアだわ。<line-break>このしぶとさ、見習わなくちゃ。 <end><if><value:$01><equal>5おおっ！\u3000ネメアだ！<line-break>くー、おいしいところで<line-break>帰ってきたなぁ。 <end><if><value:$01><equal>6さすが！<line-break>やっぱり戻ってきたよ。 <end><if><value:$01><equal>7ネメア様！<line-break>ご無事でしたか！ <end><if><value:$01><equal>8おかえりなさい、ネメア。<line-break>よくがんばりましたね。 <end><if><value:$01><equal>9さっすが、うちらの大将よねー。<line-break>やっぱ、無事だったんだ。 <end><if><value:$01><equal>12まったく、さすがだな。<line-break>生きて帰ってくるとは。<line-break>\u3000<line-break>ロストールはこんな奴を<line-break>相手にしてたのか。 <end><if><value:$01><equal>13無事だったか。<line-break>ネメア、さすがに大したものだ。 <end><if><value:$01><equal>10うお！\u3000ネメアだ！<line-break>姉ちゃん、やっぱネメアはすげぇよ！ <end><if><value:$01><equal>14さすが、ネメア。<line-break>やはり戻ってきたか。 <end><if><value:$01><equal>15よかった無事で…。<line-break>おかえりなさい、ネメアさん。 <end><if><value:$01><equal>17あら、ちゃんと帰ってきたのね。<line-break>下等生物にしては、上できだわ。 <end><if><value:$01><equal>19わーい、戻ってきたー。<line-break>ご理解ください、<value:$28>様。 <end><if><value:$01><equal>20遅かったな。 <end><if><value:$01><equal>21帰ってきたというのか…<line-break>さすが…というべきかな。<end><if><value:$01><equal>23ネメア様！<line-break>ご無事で何よりです<end><if><value:$01><equal>27生きて帰ってくるとは…<line-break>さすがだな。<end><if><value:$01><equal>26さすがネメア殿じゃな。<end><if><value:$01><equal>24生きていらっしゃったのですね<line-break>ネメア様<end><if><value:$01><equal>25生きて帰っていらっしゃるなんて<line-break>さすがネメア様です<end>さすがネメアだ。<line-break>まだまだネメアの詩は<line-break>続きそうだなぁ。 <end>"
english = "<if><value:$01><equal>2Lord Nemea! You're alive!<end><if><value:$01><equal>3Oh, Lord Nemea! What a relief to see you safe!<end><if><value:$01><equal>4It's Nemea. I could learn a thing or two from that tenacity.<end><if><value:$01><equal>5Whoa! It's Nemea! Argh, he came back just in time for the best part.<end><if><value:$01><equal>6That's Nemea for you! I knew he'd come back.<end><if><value:$01><equal>7Lord Nemea! You're safe!<end><if><value:$01><equal>8Welcome back, Nemea. You did very well.<end><if><value:$01><equal>9That's our leader for you! I knew he'd be all right.<end><if><value:$01><equal>12Incredible. He actually made it back alive. So this is the sort of man Rostorl was up against.<end><if><value:$01><equal>13So you're safe. Nemea, you truly are remarkable.<end><if><value:$01><equal>10Whoa! It's Nemea! Sis, Nemea really is amazing!<end><if><value:$01><equal>14Well done, Nemea. I knew you would return.<end><if><value:$01><equal>15I'm so glad you're safe... Welcome back, Nemea.<end><if><value:$01><equal>17Oh, you actually made it back. Not bad for an inferior life-form.<end><if><value:$01><equal>19Hooray, he's back! Please understand, Lord <value:$28>.<end><if><value:$01><equal>20You're late.<end><if><value:$01><equal>21He returned...? I suppose I should expect no less.<end><if><value:$01><equal>23Lord Nemea! I'm so glad you're safe!<end><if><value:$01><equal>27You made it back alive... Impressive.<end><if><value:$01><equal>26Just what I'd expect of Lord Nemea.<end><if><value:$01><equal>24So you were alive, Lord Nemea.<end><if><value:$01><equal>25You actually made it back alive. Just what I'd expect of you, Lord Nemea.<end>That's Nemea for you. It seems Nemea's song will continue for some time yet.<end>"

