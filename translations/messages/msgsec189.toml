["1890000"]
japanese = "Ｖ７開始<end>"
english = ""

["1890001"]
japanese = "フフ、久しぶりの新顔だな…。<end>"
english = "Heh. A new face, after all this time.<end>"

["1890002"]
japanese = "恐れることはない。<line-break>真に汝が恐れるべきは<line-break>他にある。<line-break>むしろ余は汝が力を得る<line-break>助けとなろう。<line-break>…また訪れるがよい。<end>"
english = "Do not be afraid. What you truly ought to fear lies elsewhere. If anything, I shall help you gain power. Come and visit me again.<end>"

["1890003"]
japanese = "そうだ。余だ。<end>"
english = "Yes. It is I.<end>"

["1890004"]
japanese = "フフ、さすがにこのおぞましい姿には\u3000<line-break>驚きを隠せぬか…。<line-break>\u3000<line-break>余はシャローム。<line-break>人類の革新を夢見たために<line-break>竜王にうとまれ、この有様だ。<end>"
english = "Heh. Even you cannot hide your shock at this hideous form, it seems. I am Shalom. I dreamed of Humanity's Evolution, and for that the Dragon King scorned me and reduced me to this.<end>"

["1890005"]
japanese = "見知り置くがよい、<line-break><value:$28>よ。<end>"
english = "Mark me well, <value:$28>.<end>"

["1890006"]
japanese = "フフ、汝の名を探るなど容易なこと。<line-break>また余を訪ね来るがよい。<line-break>余は汝に見せてやろう。<line-break>竜王の手によって、<line-break>この世界がいかに<line-break>ゆがめられてきたかを。<end>"
english = "Heh. Discovering your name was easy enough. Come and visit me again. I shall show you how the Dragon King has twisted this world.<end>"

["1890007"]
japanese = "また訪れるがよい。<end>"
english = "You may visit again.<end>"

["1890008"]
japanese = "フフ、無限のソウルの持ち主か…。<line-break>汝は余にとって<line-break>どのような者になるのか…。<line-break>なんにせよ、汝の力…、<line-break>人類の革新のため、<line-break>利用させてもらおう…。<end>"
english = "Heh heh. So you are the bearer of the Infinite Soul. I wonder what you will become to me... Whatever the answer, I shall put your power to use for Humanity's Evolution.<end>"

["1890009"]
japanese = "人類は永き眠りの途上にある。<line-break>魔力を失い、<line-break>腐りゆく肉体に魂をゆだねている。<line-break>だが、ひとたび覚醒すれば、<line-break>強大な魔力と<line-break>不滅の肉体が手に入るのだ。<end>"
english = "Humanity is in the midst of a long sleep. Its magic lost, it has entrusted its soul to decaying flesh. But once it awakens, it will gain immense magical power and an immortal body.<end>"

["1890010"]
japanese = "かつて余は<line-break>それを証明してみせた。<end>"
english = "I once proved it.<end>"

["1890011"]
japanese = "フッフッフ…、<line-break>信用できぬようだな。<line-break>仕方あるまい、この姿では。\u3000<line-break>だが、この姿こそ<line-break>覚醒を経験した証とも言えよう。<end>"
english = "Heh heh heh... You do not believe me. Hardly surprising, given my present form. Yet this very form may itself be called proof that I have undergone the awakening.<end>"

["1890012"]
japanese = "憎き支配者…竜王。<line-break>奴は、革新を果たした余を恐れた。<line-break>人類の力を恐れたのだ。<line-break>それゆえ、余を<line-break>こそくな術で縛りおった。<end>"
english = "That accursed ruler... the Dragon King. He feared me once I became the embodiment of Humanity's Evolution. He feared the power of humanity. And so he bound me with his underhanded arts.<end>"

["1890013"]
japanese = "余の肉体は滅びを知らぬ。<line-break>いつの日か必ず完全なる革新を果たし、<line-break>竜王を封じてくれよう。<end>"
english = "My body cannot perish. One day, I shall bring Humanity's Evolution to completion and seal away the Dragon King.<end>"

["1890014"]
japanese = "このザマからは想像もつかぬだろうが、<line-break>かつて余は国王として<line-break>君臨したこともあった。<end>"
english = "You would never guess it from the sorry state I am in now, but I once reigned as a king.<end>"

["1890015"]
japanese = "１２００年も前になる。<line-break>この世では小国同士の小競り合いが<line-break>繰り返されていた。<line-break>当時、すでに魔法は失われていたゆえ<line-break>戦はすべて肉弾戦であった。<end>"
english = "That was 1,200 years ago. Small states were forever skirmishing with one another. Magic had already vanished from the world, so every battle was fought hand-to-hand.<end>"

["1890016"]
japanese = "ただ神聖王国アルレシアのみが<line-break>神より魔法を授かっていたのだ。\u3000<line-break>\u3000<line-break>アルレシアは魔法を武器に<line-break>小国を平定し、戦乱を終結させた。<end>"
english = "Only the Holy Kingdom of Alresia had been granted magic by God. With magic as its weapon, Alresia subdued the small states and brought the strife to an end.<end>"

["1890017"]
japanese = "このときアルレシアを統治していたのが<line-break>７人の魔道士、アルレシア七王。<line-break>余もそのひとりであった。<end>"
english = "Alresia was ruled in those days by seven sorcerers known as the Seven Kings of Alresia. I was one of them.<end>"

["1890018"]
japanese = "だが、大国の存在を嫌い、<line-break>再び世を乱そうとした者がある。<line-break>…竜王だ。<line-break>竜王は、七王のうちのふたり、<line-break>…余とディーヴァをそそのかし、<line-break>アルレシアに対抗させた。<end>"
english = "But there was one who resented the existence of a great power and sought to plunge the world into turmoil once more: the Dragon King. He incited two of the Seven Kings, Diva and me, to oppose Alresia.<end>"

["1890019"]
japanese = "我々が築いた魔道王国ラドラスと<line-break>アルレシアの間で<line-break>再び戦が始まったのだ。<line-break>すべては奴の目論見どおり…。<line-break>神をかたり、世をかき乱す<line-break>あの者こそ人類の敵なのだ。<end>"
english = "War began anew between Alresia and the Magic Kingdom Ladras, which we had founded. Everything unfolded exactly as he intended. The one who poses as God and sows chaos throughout the world is humanity's enemy.<end>"

["1890020"]
japanese = "これまで、<line-break>可能性を秘めた者の多くが<line-break>竜王の手で葬られてきた。<end>"
english = "Many who possessed such potential have already been slain at the Dragon King's hands.<end>"

["1890021"]
japanese = "<value:$28>、<line-break>汝も注意することだ。<line-break>\u3000<line-break>目立った真似をすると<line-break>竜王に消される…。<end>"
english = "Take heed as well, <value:$28>. Draw too much attention, and the Dragon King will have you erased.<end>"

["1890022"]
japanese = "人類が覚醒を果たすまで、<line-break>竜王に屈する日々が続くのだ。<end>"
english = "Until humanity achieves its awakening, it will remain in submission to the Dragon King.<end>"

["1890023"]
japanese = "<value:$28>よ、<line-break>世界を見て、いかに感じた？\u3000<line-break>\u3000<line-break>世界は悲しみに満ちている…。<line-break>もう少し力があればと思うことが<line-break>多くはないか？<end>"
english = "<value:$28>, you have seen the world. What did you make of it? It is filled with sorrow. Have you not often wished you had just a little more power?<end>"

["1890024"]
japanese = "新たな力を得たくはないか？<end>"
english = "Would you not like to gain a new power?<end>"

["1890025"]
japanese = "フフ、そう警戒するな。<line-break>余は、汝に期待している。\u3000\u3000\u3000<line-break>悪いようにはせんよ。<line-break>この塔の最上階。<line-break>その奧には、マノンの腕輪という<line-break>強大な力を秘めた魔道器がある。<end>"
english = "Heh. There is no need to be so wary. I have high hopes for you, and I mean you no harm. Deep within the highest floor of this tower lies a magical artifact of immense power known as Manon's Bracelet.<end>"

["1890026"]
japanese = "マノンは、かつて<line-break>この塔にいた女魔道士だ。\u3000\u3000<line-break>\u3000<line-break>そのマノンの力を封じた腕輪に<line-break>打ち勝つことができれば、<line-break>汝は新たな力を得よう。<end>"
english = "Manon was a female mage who once lived in this tower. If you can overcome the bracelet containing Manon's sealed power, you shall gain new power.<end>"

["1890027"]
japanese = "今はまだ、マノンの腕輪は<line-break>深い眠りについているようだが、<line-break>私が起こしておこう。<line-break>訪れてみるがいい。<end>"
english = "For now, Manon's Bracelet still seems to be deep asleep, but I shall awaken it. Go and pay it a visit.<end>"

["1890028"]
japanese = "<value:$28>よ。<line-break>最も深く暗き魔法を欲しくはないか？<line-break>それは、新月の塔で手に入ろう。<line-break>天に近き場所に封印された<line-break>禁断の闇の魔法デモリッシュ。<end>"
english = "<value:$28>. Do you not desire the deepest, darkest magic? You will find it in New Moon Tower: Demolish, the forbidden dark magic sealed away close to the heavens.<end>"

["1890029"]
japanese = "ネガヴァニティアのソウルを<line-break>宿す者が訪れれば、<line-break>守護者が迎え撃つという。<line-break>守護者を倒し、祭壇にたどり着ければ、<line-break>汝は禁忌の力を手にしよう。<line-break>フフ、挑戦してみるがよいぞ。<end>"
english = "The Guardian is said to confront anyone who comes bearing the Soul of Negavanitia. Defeat the Guardian and reach the altar, and forbidden power shall be yours. Heh heh. Go on, then. See if you can.<end>"

["1890030"]
japanese = "竜王が動いたようだな。<line-break>ラドラスの浮上は、<line-break>さすがに捨て置けなかったようだ…。<line-break>ラドラスの力は<line-break>世界の均衡を容易に崩すからな。<end>"
english = "It seems the Dragon King has made a move. Apparently, Ladras's rise was too much to ignore... Ladras's power can easily upset the Balance of the World.<end>"

["1890031"]
japanese = "竜王とはそういう存在なのだ。<line-break>神の代行者として、<line-break>世界を存続させ続けるためにのみ動く。<line-break>疑うならば、この大陸にいる<line-break>すべての竜を殺して見よ。<line-break>そして、竜王の島に向かえ。<end>"
english = "That is the nature of the Dragon King. As the divine agent, the Dragon King acts for one purpose alone: to keep the world in existence. If you doubt it, try killing every dragon on this continent. Then make your way to Dragon King's Island.<end>"

["1890032"]
japanese = "竜王はお前を見逃さんだろうよ。<line-break>すべての竜を殺したとなれば、<line-break>間違いなく世界を脅かす力の持ち主だ。<line-break>必ず始末しようとする。<line-break>危険すぎるからな。フフフ。<end>"
english = "The Dragon King would never let you go. If you had killed every dragon, there would be no question that you possessed the power to threaten the world. The Dragon King would be sure to try to dispose of you. You would be too dangerous. Heh heh heh.<end>"

["1890033"]
japanese = "やあ、いらっしゃい。<line-break>待っていたよ、<line-break><value:$28>。<end>"
english = "Ah, welcome. I've been waiting for you, <value:$28>.<end>"

