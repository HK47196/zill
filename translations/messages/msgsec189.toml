english = "<if><value:$01><equal>2W-What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>3What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>4This is getting serious. Maybe I should slip away...<end><if><value:$01><equal>5W-What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>6N-No... Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>7What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>9Chosen by the God of Destruction? Not bad, <value:$28>. But I can't just stand by and let it happen.<end><if><value:$01><equal>12What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>13What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>10Urg's going to descend into Sis? Are you serious?!<end><if><value:$01><equal>14What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>15W-What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>17W-W-W-What did you say?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>19What?! N-No... <value:$28>, please! Don't become the God of Destruction!<end><if><value:$01><equal>20What?! Ulugh is to descend into <value:$28>...?!<end><if><value:$01><equal>21How can this be?! <value:$28>!<end><if><value:$01><equal>23Urg?! How can this be?!<end><if><value:$01><equal>27What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>26What?! Ulugh is going to descend into <value:$28>?!<end><if><value:$01><equal>24N-No... Ulugh is to descend into <value:$28>?!<if><value:$01><equal>25Urg...? No...<end><value:$28>, the God of Destruction?! Th-That could make an incredible poem... No, this is hardly the time!<end>"

["1890042"]
japanese = "あれ？\u3000なんだ…？<end>"
english = "Huh? What's happening...?<end>"

["1890043"]
japanese = "神器に異物が混入…だと？<line-break>意志あるもの…、ソウル…？<end>"
english = "A foreign presence within the divine artifact...? Something with a will of its own... a Soul...?<end>"

["1890044"]
japanese = "はじめまして、シャリ君。<line-break>私はオルファウスといいます。<line-break>よろしくお見知り置きを。<end>"
english = "A pleasure to meet you, Shalli. My name is Orphaus. Do remember me.<end>"

["1890045"]
japanese = "クッ、こうなることを見越し、<line-break>魂吸いの指輪にわざとソウルを<line-break>吸わせて潜んでいたのか…。<line-break>破壊神の復活を<line-break>直前でくい止めるために…。<end>"
english = "Damn... You foresaw this, had the Soul-Draining Ring absorb your Soul, and hid inside it deliberately... all to stop the God of Destruction's resurrection at the final moment...<end>"

["1890046"]
japanese = "とっさの思いつきだったんですけど、<line-break>ネメアはできのいい子でしてね。<line-break>無言で理解してくれましたよ。<line-break>ウルグの復活は、失敗ですね。<end>"
