english = "<if><value:$01><equal>2Is Lord Nemea really all right?!<end><if><value:$01><equal>3Lord Nemea really is all right, isn't he?!<end><if><value:$01><equal>4Oh, is he all right? Did that kill him?<end><if><value:$01><equal>5Whoa, incredible! We beat Nemea! Wait, that's not the point. Is Nemea all right?<end><if><value:$01><equal>6Did we really drive Ulugh away?<end><if><value:$01><equal>7Lord Nemea really is unharmed, isn't he?!<end><if><value:$01><equal>9Oh, is he all right? Was that a bit too much?<end><if><value:$01><equal>12If Nemea had been himself, we'd have been in trouble... So, did we drive Ulugh away?<end><if><value:$01><equal>13What happened to Nemea?<end><if><value:$01><equal>10Do you think Ulugh is gone now?<end><if><value:$01><equal>14Have we driven Ulugh away, then?<end><if><value:$01><equal>15He may not have been at full strength, but... we actually beat Nemea. Is he all right, though?<end><if><value:$01><equal>17Well, that was nothing for the likes of us. So, is Ulugh gone?<end><if><value:$01><equal>19Oh no, Nemea's collapsed! Is he all right?<end><if><value:$01><equal>20So weak... It hardly seems like Nemea.<end><if><value:$01><equal>21Urg is gone now, I take it.<end><if><value:$01><equal>23Is Lord Nemea truly unharmed...?!<end><if><value:$01><equal>27Did we truly manage to drive Ulugh away?<end><if><value:$01><equal>26Did we truly manage to drive away the evil god Ulugh?<end><if><value:$01><equal>24Lord Nemea... I wonder if he's safe...<end><if><value:$01><equal>25Did we... manage to drive Ulugh away?<end>Saving the hero Nemea from the evil god Ulugh... What an incredible adventure! Wait, did we really defeat Ulugh?<end>"

