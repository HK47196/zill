english = "<if><value:$01><equal>2It's over... Are you all right, <value:$28>?<end><if><value:$01><equal>4All that bluster, only to end up looking this pathetic.<end><if><value:$01><equal>5Heh, serves you right. That's what you get for underestimating us.<end><if><value:$01><equal>6It's over, <value:$28>.<end><if><value:$01><equal>7It's over...<end><if><value:$01><equal>11It's over.<end><if><value:$01><equal>13Hmph. All talk...<end><if><value:$01><equal>10Whew, that was close. You all right, sis?<end><if><value:$01><equal>14Just what I'd expect from a legendary Dwarf warrior. Well fought!<end><if><value:$01><equal>15Yes... That was close.<end><if><value:$01><equal>17Hmph! Hmph! Hmph! Dwarves can boast all they like, but this is all they're capable of!<end><if><value:$01><equal>19Whew, that scared me. That attack came out of nowhere!<end><if><value:$01><equal>20………………。<end><if><value:$01><equal>21Hmph... So the bravado didn't last long.<end><if><value:$01><equal>23Are you all right, <value:$28>?<end><if><value:$01><equal>27It's over... Are you all right, <value:$28>?<end><if><value:$01><equal>26Whew... That was a close one.<end><if><value:$01><equal>24That was a close call. Are you unharmed, <value:$28>?<end><if><value:$01><equal>25Whew... Attacking without warning like that was just awful.<end><if><value:$01><equal>192Are you hurt?<end><if><value:$01><equal>193Are you all right, <value:$28>? Th-the attack was so sudden, and I... I was so startled...<end><if><value:$01><equal>194For a Knight of the Round Table, that was nothing special...<end><if><value:$01><equal>191I'm... safe. I never want to face another demon.<end><if><value:$01><equal>190Looks like all is well. I'm glad nothing happened.<end>Are you all right, <value:$28>?<end>"

["950050"]
japanese = "<if><value:$01><equal>2早くここを出ましょ。 <end><if><value:$01><equal>5あばよ、ダナン。<line-break>お前もかわいそうな奴だナン。<line-break>…ププププッ。 <end><if><value:$01><equal>6帰ろう、<value:$28>。<line-break>なんだか、早くここを出たいよ。 <end><if><value:$01><equal>7それじゃあ、<line-break>帰りましょう。 <end><if><value:$01><equal>13…帰るぞ。 <end><if><value:$01><equal>10そんじゃ、行こうぜ。 <end><if><value:$01><equal>14さぁて、帰って酒でも飲むかの。\u3000<line-break>\u3000<line-break>\u3000<line-break>伝説ではボルキスに敗れたあと<line-break>邪竜シャンマと融合したというのに<line-break>あっけなかったのお！\u3000ガハハ！ <end><if><value:$01><equal>15さあ、<value:$28>、<line-break>帰ろう。 <end><if><value:$01><equal>17さあ、<value:$28>。<line-break>このカビ臭い城から<line-break>１秒でも早く出るのよー！ <end><if><value:$01><equal>21帰るぞ。 <end><if><value:$01><equal>23さあ、帰ろう<line-break><value:$28>。<end><if><value:$01><equal>27さあ、帰ろう<end><if><value:$01><equal>26さあ、ここを出ようか…。<end><if><value:$01><equal>24それじゃあ、<line-break>帰りましょう、<value:$28>様<end><if><value:$01><equal>25それじゃあ、<line-break>帰りましょう。 <end><if><value:$01><equal>192…嫌な予感がします。<line-break>早くここから離れましょう。<end><if><value:$01><equal>193さあ、<value:$28>さん。<line-break>早く帰りましょう。<end><if><value:$01><equal>194邪竜シャンマと融合した者が<line-break>この程度で…？<line-break><line-break>…いや考えすぎか。<line-break>さあ、帰ろう。<end><if><value:$01><equal>191本当に倒せたのかしら…？<line-break><line-break><line-break>…ふ。私、魔人を過剰に恐がりすぎよね。<line-break>とにかく、ここを出ないと。<end><if><value:$01><equal>190…倒せたのか？<line-break>経験上、魔人は油断できない。<line-break>倒せたと思ってもな。<line-break>…いずれにせよ、<line-break>急いでここを離れたほうがいいな。<end>それじゃあ、<line-break>帰ろうよ、<value:$28>。 <end>"
english = "<if><value:$01><equal>2Let's hurry and get out of here.<end><if><value:$01><equal>5So long, Dannan. You're one sorry Dannan... Pffft!<end><if><value:$01><equal>6Let's go home, <value:$28>. I don't know why, but I want to get out of here as soon as we can.<end><if><value:$01><equal>7Well then, let's go home.<end><if><value:$01><equal>13We're leaving.<end><if><value:$01><equal>10All right, let's go.<end><if><value:$01><equal>14Well then, shall we go home and have a drink? The legends say Dannan merged with the Evil Dragon Shanma after being defeated by Borkis, yet that was over in no time! Gahaha!<end><if><value:$01><equal>15Come on, <value:$28>. Let's go home.<end><if><value:$01><equal>17Come on, <value:$28>! We're getting out of this musty castle as fast as we can!<end><if><value:$01><equal>21We're leaving.<end><if><value:$01><equal>23Come on, <value:$28>. Let's go home.<end><if><value:$01><equal>27Come on, let's go home.<end><if><value:$01><equal>26Well, shall we get out of here...?<end><if><value:$01><equal>24Well then, let us return, <value:$28>.<end><if><value:$01><equal>25Well then, let's go home.<end><if><value:$01><equal>192I have a bad feeling about this... We should get away from here quickly.<end><if><value:$01><equal>193Come, <value:$28>. Let's hurry home.<end><if><value:$01><equal>194Could someone who merged with the Evil Dragon Shanma really be defeated that easily...? No, I'm probably overthinking it. Come on, let's go home.<end><if><value:$01><equal>191Did we really win...? Hm. I suppose I'm too afraid of demons. In any case, we need to get out of here.<end><if><value:$01><equal>190Is it really over...? In my experience, you can never let your guard down around demons, even when you think the fight is finished. Either way, we'd better leave this place quickly.<end>Well then, let's go home, <value:$28>.<end>"

