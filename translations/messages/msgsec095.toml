ammer of Wrath...<end><if><value:$01><equal>192This is the Dark Artifact, the Hammer of Wrath. Here you are.<end><if><value:$01><equal>193This is the Dark Artifact, the Hammer of Wrath. Here you are, <value:$28>.<end><if><value:$01><equal>194It's the Dark Artifact, the Hammer of Wrath. Whatever you do, don't equip it. Anger will take hold of you, and you'll lose your heart.<end><if><value:$01><equal>191This is the Dark Artifact, the Hammer of Wrath. I'm sorry... <value:$28>, you hold on to it. Somehow it brings back the past, and it feels as though something cold is... stroking my heart...<end><if><value:$01><equal>190So this is the Dark Artifact, the Hammer of Wrath. This thing's giving off a sinister aura too. Take it, <value:$28>.<end>Here, <value:$28>. The Dark Artifact, the Hammer of Wrath.<end>"

