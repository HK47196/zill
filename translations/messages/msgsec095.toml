["950000"]
japanese = "オイフェメッセージＶ１開始<end>"
english = ""

["950001"]
japanese = "俺たち冒険者のことをバカにする気か？<line-break>この小娘！<end>"
english = "Are you mocking us adventurers, you little brat?<end>"

["950002"]
japanese = "別にバカになんかしてなくてよー？\u3000<line-break>ただ、事実を言ってあげただけ。<line-break>\u3000<line-break>こぉ～んなに、つまらない世界を<line-break>真顔でうろついて冒険ですって？<line-break>ホント笑わせるわ！\u3000くだらないわ！<end>"
english = "I'm not mocking you. I merely told you the truth. You wander around this dreadfully dull world with straight faces and call it adventure? What a joke! How utterly ridiculous!<end>"

["950003"]
japanese = "こ、この…！\u3000冒険のすばらしさを<line-break>バカにしやがって…！<end>"
english = "Y-you... How dare you mock the wonders of adventure!<end>"

["950004"]
japanese = "冒険をバカになんてしてないわ。<line-break>あなたがたの程度の低さを指摘したの。<end>"
english = "I wasn't mocking adventure. I was pointing out how inferior you are.<end>"

["950005"]
japanese = "こっ、こっ、このエルフが！<line-break>ギタギタにしてやる！！<end>"
english = "Y-you... You damned Elf! I'll tear you to pieces!<end>"

["950006"]
japanese = "そ、アタクシは高貴なエルフなのよ。<line-break>あなたたち下等生物とは違うのよ。<line-break>\u3000<line-break>すぐ暴力に訴えようとするのね？<line-break>これだから下等生物ってイヤなのよ。<line-break>つまらないわ。ホントつまらない！<end>"
english = "That's right. I am a noble Elf, quite unlike you inferior creatures. Do you always resort to violence so quickly? That's precisely what I can't stand about inferior creatures. How dull. Utterly dull!<end>"

["950007"]
japanese = "あのエルフを助ける<end>"
english = "Help that elf<end>"

["950008"]
japanese = "放っておく<end>"
english = "Leave the elf alone<end>"

["950009"]
japanese = "こっ、こいつは、俺たちのことを<line-break>バカにしてるんだぞ！<line-break>\u3000<line-break>こんな奴を助ける気か！<line-break>貴様も痛い目にあわねば<line-break>わからんようだな！<end>"
english = "S-she's making fools of us! You're going to help someone like that? Looks like you won't understand until you've had a taste of pain yourself!<end>"

["950010"]
japanese = "くっ！\u3000この…！<line-break>覚えていろよ！<end>"
english = "Damn you... Just you remember this!<end>"

["950011"]
japanese = "おい、そこのエルフ、<line-break>お前も今度会ったらこうしてやる！<line-break>覚えていろよ！<end>"
english = "Hey, Elf! Next time we meet, you'll get the same! Remember that!<end>"

["950012"]
japanese = "あー、程度が低いわね、下等生物って！<line-break>こうやってなんでも暴力で<line-break>決めようとするのよねー！<line-break>ま、そこが下等生物が下等生物である<line-break>理由なんでしょうけど、エルフである<line-break>高貴なアタクシには耐えられないわ！<end>"
english = "Oh, inferior creatures are so terribly crude! You always try to settle everything with violence, don't you? I suppose that's what makes inferior creatures inferior, but a noble Elf such as myself simply cannot abide it!<end>"

["950013"]
japanese = "このつまらない世界をありがたがって<line-break>うろついて、冒険だって喜べるのも<line-break>その程度の低い脳みそあってのことね。<line-break>失礼するわ。外界を見ろってラミュ様は<line-break>おっしゃるけど、こんなつまらない世界<line-break>見る価値はないもの。森に戻るわ。<end>"
english = "Only with brains as inferior as yours could you roam this dull world, cherish it, and delight in calling that adventure. Good day. Lady Ramyu tells me to see the outside world, but a world this tedious isn't worth seeing. I'm going back to the forest.<end>"

["950014"]
japanese = "いや、世界は驚きに満ちている<end>"
english = "No, the world is full of surprises<end>"

["950015"]
japanese = "声をかけない<end>"
english = "Say nothing<end>"

["950016"]
japanese = "はぁ～？<end>"
english = "What?<end>"

["950017"]
japanese = "さっきの、頭の中まで冒険ロマンの<line-break>連中も、そこまで言わなかったわ！<line-break>\u3000<line-break>あなた、あいつらに輪をかけてアホ？<line-break>信じられないうつけ者？\u3000こぉ～んなに<line-break>つまらない世界が驚きに満ちている？<end>"
english = "Even those adventure-addled fools from before didn't go that far! Are you even more stupid than they were? Some kind of unbelievable simpleton? You think this dreadfully dull world is full of wonders?<end>"

["950018"]
japanese = "バカじゃない？\u3000アホじゃない？<line-break>どこへ行っても新しい驚きなんかない。<line-break>陳腐で何もかもがありふれてたわ。<end>"
english = "Are you stupid? A complete fool? There's nothing new or surprising anywhere. Everything I saw was stale and commonplace.<end>"

["950019"]
japanese = "世界の何がつまらないの？<end>"
english = "What's so boring about the world?<end>"

["950020"]
japanese = "じゃあ、禁断の聖杯って知ってる？<end>"
english = "Then do you know about the Forbidden Grail?<end>"

["950021"]
japanese = "ロストールのお城はつまらなかったわ。<line-break>門番が立ってるだけだもん。ダメね。<end>"
english = "The castle in Rostorl was dull. All it had was a guard standing at the gate. No good at all.<end>"

["950022"]
japanese = "あ、あとは、ウルカーンもつまんない。<line-break>な、何もなかったもん。ダメダメよ！<end>"
english = "A-and Urkaan was dull too. There was n-nothing there. No good at all!<end>"

["950023"]
japanese = "あ、あとは…何って…、何もかもよ！！<line-break>下等生物のくせに細かくてよぉ！！<line-break>\u3000<line-break>アタクシはつまんないって言う理由を<line-break>言ったんだから、今度はあなたが<line-break>世界はすばらしいって理由を言う番よ！<end>"
english = "A-and what else...? Everything! For an inferior creature, you certainly do fuss over petty details! I've told you why I find the world dull, so now it's your turn to explain why it's wonderful!<end>"

["950024"]
japanese = "禁断の聖杯…？<end>"
english = "The Forbidden Grail...?<end>"

["950025"]
japanese = "ロストールのお城はつまらなかったわ。<line-break>門番が立ってるだけだもん。ダメね。<end>"
english = "The castle in Rostorl was dull. All it had was a guard standing at the gate. No good at all.<end>"

["950026"]
japanese = "し、し、知らないわけないでしょ。<end>"
english = "O-of course I know what that is.<end>"

["950027"]
japanese = "アタクシは高貴で優雅なエルフなのよ！<line-break>何もかも知り尽くして飽き飽きだわ！<line-break>\u3000<line-break>き、禁断の聖杯は…その…杯なのよ。<line-break>魔法の物品ね。そうよ魔法の杯よぉ！<line-break>禁断…って言うくらいだから、あ！<end>"
english = "I am a noble and refined Elf! I know everything there is to know, and I'm thoroughly bored with it all! Th-the Forbidden Grail is... well... a cup. A magical object. Yes, a magical cup! And since it's forbidden... Ah!<end>"

["950028"]
japanese = "禁酒ができるのよ！\u3000そうよ、酒ほど<line-break>イヤなものはないわ。ドワーフなんかが<line-break>いっつも酒の臭いをプンプンさせて…！<line-break>アレを世界から消し去るために存在する<line-break>杯だわ。酒臭いドワーフを一掃するの！<line-break>そうね…アレはいい線いってるかしら？<end>"
english = "It can put a stop to drinking! That's right, nothing is more loathsome than alcohol. Dwarves are forever reeking of the stuff...! The grail exists to wipe it from the face of the world. It will rid us of every alcohol-reeking Dwarf! Yes... that sounds about right, doesn't it?<end>"

["950029"]
japanese = "何よ！\u3000違うって、じゃ、じゃあ、<line-break>答えはなんなのよ！\u3000答えなさいよ！<end>"
english = "What? If that's wrong, th-then what is the answer? Tell me!<end>"

["950030"]
japanese = "何で答えないのよ！<line-break>さっきの奴らの方がまだマシだわ！\u3000\u3000<line-break>\u3000<line-break>あいつらは、バカだったけど、<line-break>何か説明しようとしたもの。<line-break>あなた、高貴なエルフをバカにする気？<end>"
english = "Why won't you answer? Even those fools from before were better than you! They were idiots, but at least they tried to explain something. Are you mocking a noble Elf?<end>"

["950031"]
japanese = "ま、待ちなさいよぉ！<line-break>アタクシを置いて行こうなんて、<line-break>１００年早いわ！<end>"
english = "W-wait! You're a hundred years too early to think you can leave me behind!<end>"

["950032"]
japanese = "一緒に旅についてくれば<line-break>証明できるですって？<line-break>上等じゃない！\u3000よろしくてよ！<line-break>世界が驚きに満ちているって言った<line-break>あなたの言葉、ぜーったい、必ず、<line-break>旅で証明していただくわ！<end>"
english = "You say you can prove it if I travel with you? Very well! I accept! You said the world was full of wonders, and you will most certainly prove it to me on this journey!<end>"

["950033"]
japanese = "町を出るときに合流よ！\u3000わかって？<line-break>逃げないで来なさいよ、ド下等生物！<end>"
english = "We'll meet when you leave town. Understood? You'd better show up, you utterly inferior creature!<end>"

["950034"]
japanese = "猫屋敷で呼び出すぅ？<end>"
english = "You'll summon me at Cat Manor?<end>"

["950035"]
japanese = "し、知ってるわよ。そのくらい。<line-break>わかったわ、待っていてあげてよ！<end>"
english = "O-of course I knew that much. Very well, I'll be gracious enough to wait for you!<end>"

["950036"]
japanese = "どきなさいよ。レディ、しかもエルフに<line-break>道を譲るのは常識、道理、礼儀でしょ！<end>"
english = "Out of my way. Yielding the path to a lady, especially an Elf, is common sense, common decency, and common courtesy!<end>"

["950037"]
japanese = "ま、あなた、他の人間みたいに<line-break>小理屈で説明しないだけマシかもね！<end>"
english = "Well, perhaps you're better than the other humans. At least you don't try to explain everything with petty arguments!<end>"

["950038"]
japanese = "ちょっと、ほめただけで<line-break>調子にのらないようにね！<end>"
english = "Don't get carried away just because I paid you one little compliment!<end>"

["950039"]
japanese = "名を名乗りなさいよ！\u3000エルフに対して<line-break>名乗らないなんて無礼な下等生物ね！<line-break>\u3000<line-break>言っておきますけど、忘れてたんじゃ<line-break>絶対、絶対、絶対、なくてよ！<line-break>とにかく、早く名乗りなさい、無礼者！<end>"
english = "State your name! Only a thoroughly ill-mannered inferior creature would fail to introduce oneself to an Elf! And let me make one thing clear: I absolutely, positively, most certainly did not forget to ask! Now hurry up and give me your name, you boor!<end>"

["950040"]
japanese = "<value:$28>？\u3000いいわね。<line-break>下等生物らしい名前だわ。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>アタクシはフェティ。尊敬の念を込めて<line-break>フェティ様と呼んでよくてよ！<line-break>それじゃあね、<value:$28>！<end>"
english = "<value:$28>? Very nice. A fitting name for an inferior creature. I am Fety. You may address me as Lady Fety, with all the proper respect! See you, <value:$28>!<end>"

["950041"]
japanese = "キャー！<end>"
english = "Eek!<end>"

["950042"]
japanese = "最近は、酒場の中で平気で武器を出す<line-break>物騒な連中が増えてきたなあ…。<line-break>\u3000<line-break>ああ、でも、あんたの行動は<line-break>間違っちゃいないと思うぜ。<line-break>仕方ないって時はあるものさ。<end>"
english = "These days, more and more dangerous sorts think nothing of drawing weapons inside the tavern... Ah, but I don't think what you did was wrong. Sometimes you don't have a choice.<end>"

["950043"]
japanese = "からまれてる女の子を\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>助けに入るなんて<line-break><value:$28>さんらしいですね。<line-break>……私が同じようになっても、<line-break>助けに入って………。<line-break>あ、い、いえ、なんでもないです…。<end>"
english = "Stepping in to help a girl being harassed... That's just like you, <value:$28>. If the same thing ever happened to me, would you step in and... Ah, n-no, it's nothing...<end>"

["950044"]
japanese = "くっ…うるさいハエが！<end>"
english = "Gah... You irritating fly!<end>"

["950045"]
japanese = "我こそはウルグの円卓騎士、\u3000\u3000\u3000\u3000<line-break>打ち砕く者、ダナン。<line-break>いにしえのドワーフの勇者…。<line-break>我が城に、<line-break>のこのこ入り込む者がいようとは、<line-break>このダナンも、なめられたものよ…。<end>"
english = "I am Dannan the Crusher, one of Urg's Knights of the Round Table. An ancient Dwarf Hero... To think anyone would dare stroll into my castle. It seems even I, Dannan, have been sorely underestimated...<end>"

["950046"]
japanese = "我が異名の由来を知らぬか！？<line-break>ダナンの前に出た者は、ひとり残らず、<line-break>この闇の神器、憤怒の鎚の餌食よ…。<end>"
english = "Do you not know how I earned my epithet?! Every last one who has stood before Dannan has fallen prey to this Dark Artifact, the Hammer of Wrath...<end>"

["950047"]
japanese = "熟れた果実のごとく、<line-break>その頭、<line-break>かち割ってくれようぞ！<end>"
english = "I shall split your skull like a piece of ripe fruit!<end>"

["950048"]
japanese = "ぐぁ…！<line-break>バ、バカな…<end>"
english = "Gaaah...! I-impossible...<end>"

["950049"]
