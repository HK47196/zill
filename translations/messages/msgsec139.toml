["1390000"]
japanese = "オッシ、ボリューム６開始<end>"
english = ""

["1390001"]
japanese = "\u3000\u3000\u3000広大な大地、バイアシオン大陸。<line-break>\u3000\u3000\u3000\u3000\u3000人と、人ならざる者とが\u3000\u3000\u3000 <line-break>\u3000\u3000\u3000\u3000\u3000\u3000それぞれの生を営み\u3000\u3000\u3000\u3000 <line-break>\u3000\u3000\u3000光と闇がせめぎあう神秘の世界。\u3000\u3000 <line-break>\u3000\u3000古き遺跡の眠る小さな町、オズワルド。 <line-break>\u3000\u3000この穏やかな町の奥で、底知れぬ闇が\u3000 <line-break>\u3000\u3000\u3000\u3000\u3000目覚めようとしていた。\u3000\u3000\u3000 <line-break>\u3000大いなる魂の物語は、ここから始まる……。<end>"
english = "A vast land―the Baiashion Continent. A mysterious world where humans and nonhuman beings each go about their lives, while light and darkness struggle against one another. Oswald, a small town where ancient ruins lie dormant. Deep within this peaceful town, a fathomless darkness was about to awaken. Here begins the tale of a great soul...<end>"

["1390002"]
japanese = "カルラは、ゼネテスの機略の前に敗れた。<line-break>だが、青竜軍の兵力は、依然として<line-break>ロストール軍を大きく上回っていた。<line-break>\u3000<line-break>ゼネテスの勝利とは関係なく、<line-break>勝機は、いまだカルラにあった。<line-break>しかし、カルラ軍は進軍しなかった。<end>"
english = "Karula had been defeated by Xenetes's stratagem. Yet the Azure Dragon Army still vastly outnumbered Rostorl's forces. Despite Xenetes's victory, Karula still had a chance to win. But Karula's Army did not advance.<end>"

["1390003"]
japanese = "ネメア死す。<line-break>ゼネテスの放った<line-break>偽情報を裏付けるかのごとく、<line-break>\u3000<line-break>ゼグナ鉱山で<line-break>闇の神器を探索した後、<line-break>カルラ軍に合流するはずだった<line-break>ネメアが、ついに戻らなかったのである。<end><end>"
english = ""

["1390004"]
japanese = "一方、ロストールでは、<line-break>ファーロス家の勢力拡大を恐れた<line-break>エリエナイ公レムオンが、<line-break>ファーロス家に反旗を翻した。<end>"
english = "Meanwhile, in Rostorl, Lemghon, Duke of Elienai, feared the growing power of House Pharos and rose against it.<end>"

["1390005"]
japanese = "これにより、王妃エリスは殺害され、<end>"
english = "As a result, Queen Eris was murdered,<end>"

["1390006"]
japanese = "帰還の途についていたゼネテスも<line-break>無実の罪で処刑された。<end>"
english = "and Xenetes, who was on his way home, was executed for a crime he did not commit.<end>"

["1390007"]
japanese = "政敵を葬り去り、ロストールを<line-break>掌中に収めたレムオンであったが<line-break>そのレムオンも、謎の失踪を遂げた。<end>"
english = "Lemghon had eliminated his political rivals and brought Rostorl under his control. Yet he, too, mysteriously disappeared.<end>"

["1390008"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000指導者を失った両国は<line-break>\u3000\u3000\u3000一時的な停戦状態に陥るのだった。<end>"
english = "With both nations left leaderless, a temporary ceasefire took hold.<end>"

["1390009"]
japanese = "\u3000\u3000青竜将軍カルラ率いるディンガル軍と<line-break>\u3000\u3000\u3000ゼネテス率いるロストール軍は<line-break>\u3000\u3000\u3000竜骨の砂漠南の街道で対峙した。<line-break>\u3000<line-break>\u3000\u3000レムオンら有力貴族の出兵拒否により<line-break>\u3000\u3000\u3000\u3000ロストール軍は、青竜軍の<line-break>\u3000\u3000\u3000５分の１ほどの戦力だったが…、<end>"
english = "The Dingal Army, led by Azure Dragon General Karula, faced the Rostorl Army under Xenetes on the road south of the Dragonbone Desert. Because Lemghon and other powerful nobles had refused to send troops, the Rostorl Army had only about one-fifth the strength of the Azure Dragon Army. But...<end>"

["1390010"]
japanese = "\u3000\u3000足止めのために空の本陣を敷き、併せて<line-break>\u3000ネメア死すという偽情報を流すことで青竜軍の<line-break>\u3000動揺を誘い、そこに奇襲をかけるという機略で<line-break>\u3000\u3000\u3000\u3000辛くも緒戦の勝利をものにした。<end>"
english = "An empty command camp was established to hold the enemy back, and a false report of Nemea's death was spread to unsettle the Azure Dragon Army. A surprise attack amid the resulting confusion narrowly secured victory in the opening battle.<end>"

["1390011"]
japanese = "\u3000\u3000\u3000だが、青竜軍の兵力は、依然として<line-break>\u3000ロストール軍を大きく上回っており、緒戦の<line-break>勝敗に関係なく、勝機は、いまだカルラにあった。<line-break>\u3000\u3000しかし、カルラ軍は、進軍しなかった。<end>"
english = "Even so, the Azure Dragon Army still vastly outnumbered the Rostorl Army. Regardless of the opening battle's outcome, the advantage still lay with Karula. Yet Karula's Army did not advance.<end>"

["1390012"]
japanese = "ネメア死す。<line-break>ゼネテスの放った<line-break>偽情報を裏付けるかのごとく、<line-break> <line-break>ゼグナ鉱山で<line-break>闇の神器を探索した後、<line-break>カルラ軍に合流するはずだった<line-break>ネメアが、ついに戻らなかったのである。<end>"
english = "Nemea is dead. As if confirming the false report spread by Xenetes, Nemea, who was supposed to join Karula's Army after searching Zegna Mine for the Artifact of Darkness, never returned.<end>"

["1390013"]
japanese = "一方、ロストールでは、<line-break>ファーロス家の勢力拡大を恐れた<line-break>エリエナイ公レムオンが、<line-break>ファーロス家に反旗を翻した。<end>"
english = "Meanwhile, in Rostorl, Lemghon, Duke of Elienai, feared the growing power of House Pharos and rose against it.<end>"

