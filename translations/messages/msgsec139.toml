japanese = "\u3000\u3000 軍の主戦力であった多くの竜騎士……<line-break>\u3000\u3000\u3000失われたものはあまりにも大きく、<line-break> <line-break> <line-break>\u3000\u3000 ロストールの国力は著しく低下した。<end>"
