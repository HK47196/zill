["1390128"]
japanese = "ネメア亡きディンガルに種族平等を<line-break>実現する力なし…<line-break><line-break><line-break>そう考えたジラーク将軍は、制圧した<line-break>神聖都市アルノートゥンにコーンス族の<line-break>国を起こそうと、ディンガル帝国に<line-break>反旗をひるがえした。<end>"
english = "Without Nemea, Dingal has no power to achieve equality among the races... Convinced of this, General Zsilak rebelled against the Dingal Empire, seeking to establish a nation for the Corns in the conquered holy city of Alnortun.<end>"

["1390129"]
japanese = "これを予期していたディンガル帝国宰相<line-break>ベルゼーヴァ・ベルラインは、<line-break>ロストール攻略から帰還させていた<line-break>青竜軍にジラークの討伐を命じた。<end>"
english = "Having foreseen this, Beelzeva Berline, Chancellor of the Dingal Empire, ordered the Azure Dragon Army, recalled from the Rostorl Campaign, to eliminate Zsilak.<end>"

["1390130"]
japanese = "国政の中心人物を失い、形骸化したロストール…<line-break> <line-break> <line-break> <end>"
english = "Rostorl, hollowed out by the loss of its leading figures in government...<end>"

["1390131"]
