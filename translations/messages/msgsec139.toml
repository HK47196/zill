["1390133"]
japanese = "終わらぬ戦乱はバイアシオンの大地を赤く染め、<line-break>\u3000\u3000\u3000混乱と恐怖のみを拡大させていく。<line-break> <line-break> <end>"
english = "The unending wars stained the lands of Baiashion red, spreading only chaos and fear.<end>"

["1390134"]
japanese = "アルノートゥンから帰還したカルラは、<line-break>今回の反乱はジラーク個人の罪であると、<line-break>宰相ベルゼーヴァに報告した。<line-break><line-break>それと同時に、コーンスに対する<line-break>あらゆる迫害を禁じるよう提案した。<end>"
english = "Upon returning from Alnortun, Karula reported to Chancellor Beelzeva that Zsilak alone was responsible for the rebellion. At the same time, she proposed a ban on all persecution of the Corns.<end>"

["1390135"]
japanese = "\u3000\u3000\u3000\u3000 ベルゼーヴァはこれを承認。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000捕虜の解放を命じた。<line-break><line-break><line-break>\u3000\u3000\u3000\u3000コーンス達は、傷ついた身体を<line-break>\u3000\u3000 引きずりながら、それぞれの故郷へと<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000 去っていった。<end>"
english = "Beelzeva approved the proposal and ordered the prisoners released. Dragging their wounded bodies, the Corns departed for their respective homelands.<end>"

["1390136"]
japanese = "\u3000\u3000ここにコーンスによる世界統一の野望は<line-break>\u3000\u3000\u3000\u3000\u3000\u3000\u3000潰えたのだった。<end>"
english = "Thus ended the Corns' ambition to unite the world.<end>"

["1390137"]
japanese = "アルノートゥンのコーンスの反乱は、<line-break>首謀者であるジラークの死によって<line-break>その幕を閉じた。<line-break> <end>"
english = "The Corns Rebellion in Alnortun came to an end with the death of its ringleader, Zsilak.<end>"

["1390138"]
japanese = "\u3000\u3000\u3000残されたコーンス達は離散し、<line-break>\u3000\u3000\u3000ディンガル軍も<line-break>\u3000\u3000\u3000これを追撃することは無かった。<line-break><line-break>\u3000\u3000\u3000<value:$2B>の<value:$28>。<line-break>\u3000\u3000\u3000その活躍により、人類対コーンスの<line-break>\u3000\u3000\u3000全面戦争は回避されたのだった。<end>"
english = "The surviving Corns scattered, and the Dingal Army did not pursue them. The deeds of <value:$2B> <value:$28> averted an all-out war between humanity and the Corns.<end>"

["1390139"]
japanese = "神聖都市アルノートゥン……<line-break> <line-break> <line-break> <end>"
english = "Alnortun, the holy city...<end>"

["1390140"]
japanese = "カルラ率いる討伐軍は、<line-break>この神聖都市に<line-break>驚くべき速さで進軍した。<line-break><line-break>精鋭中の精鋭でかためられた討伐軍は、<line-break>ジラーク達に守備を固める暇さえ<line-break>与えなかった。<end>"
english = "The punitive force led by Karula advanced upon the holy city with astonishing speed. Composed of the finest troops, it gave Zsilak and his followers no time even to fortify their defenses.<end>"

["1390141"]
japanese = "アルノートゥンになだれ込んだ<line-break>討伐軍により、ジラークは、<line-break>あっけなくその命を断たれた。<line-break> <end>"
english = "The punitive force poured into Alnortun, and Zsilak was killed with startling ease.<end>"

["1390142"]
japanese = "\u3000\u3000\u3000\u3000叛乱鎮圧後、ディンガル帝国は<line-break>\u3000\u3000 ただちにコーンス族討伐令を発した。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000 ここにコーンス族は<line-break>\u3000\u3000\u3000\u3000\u3000 追われる存在となった…<end>"
english = "Once the rebellion had been suppressed, the Dingal Empire immediately issued an edict ordering a campaign against the Corns. From that moment, the Corns became a hunted people...<end>"

["1390143"]
japanese = "神聖都市アルノートゥン……<line-break><line-break><line-break><end>"
english = "Alnortun, the holy city...<end>"

["1390144"]
japanese = "カルラ率いる討伐軍は、<line-break>この神聖都市に<line-break>驚くべき速さで進軍した。<line-break><line-break>精鋭中の精鋭でかためられた討伐軍は、<line-break>ジラーク達に守備を固める暇さえ<line-break>与えなかった。<end>"
english = "The punitive force led by Karula advanced upon the holy city with astonishing speed. Composed of the finest troops, it gave Zsilak and his followers no time even to fortify their defenses.<end>"

["1390145"]
japanese = "アルノートゥンになだれ込んだ<line-break>討伐軍により、ジラークは、<line-break>あっけなくその命を断たれた。<line-break><end>"
english = "The punitive force poured into Alnortun, and Zsilak was killed with startling ease.<end>"

["1390146"]
japanese = "ジラークの考えに賛同し、<line-break>その旗の元に参集していたコーンス達も<line-break>ジラークと運命を供にした。<line-break><line-break>その中には<line-break><value:$28>の友、<line-break>ナッジの姿もあった。<end>"
english = "The Corns who had embraced Zsilak's cause and rallied beneath his banner shared his fate. Among them was Nadge, a friend of <value:$28>.<end>"

["1390147"]
japanese = "\u3000\u3000\u3000\u3000叛乱鎮圧後、ディンガル帝国は<line-break>\u3000\u3000 ただちにコーンス族討伐令を発した。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000 ここにコーンス族は<line-break>\u3000\u3000\u3000\u3000\u3000 追われる存在となった…<end>"
english = "Once the rebellion had been suppressed, the Dingal Empire immediately issued an edict ordering a campaign against the Corns. From that moment, the Corns became a hunted people...<end>"

["1390148"]
japanese = "\u3000\u3000<value:$28>によって<line-break>\u3000\u3000エンシャントに潜んでいた闇の勢力は<line-break>\u3000\u3000退けられた。<line-break><end>"
english = "<value:$28> drove back the forces of darkness lurking in Ancient.<end>"

["1390149"]
japanese = "\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000 だが…<line-break><line-break><line-break><end>"
english = "But...<end>"

["1390150"]
japanese = "\u3000 姿を消した人々が戻ってくることはなく…<line-break>\u3000\u3000魔物達の数は増えていくばかりだった。<line-break><line-break><end>"
english = "Those who had vanished never returned... and the monsters only continued to multiply.<end>"

["1390151"]
japanese = "\u3000\u3000英雄の力を持ってしても、闇の勢力を<line-break>\u3000\u3000\u3000\u3000 滅ぼすことはできなかった。<line-break>\u3000\u3000\u3000この事実は、戦乱に疲れた人々を<line-break>\u3000\u3000 \u3000さらに打ちのめすこととなった。<line-break>\u3000\u3000\u3000\u3000\u3000\u3000深まりゆく闇の気配…。<line-break>\u3000まことしやかに伝えられる破壊神復活の噂。<line-break><end>"
english = "Not even the hero's power could destroy the forces of darkness. This truth dealt yet another blow to a people already exhausted by war. The presence of darkness grew ever stronger... Rumors of the God of Destruction's return circulated as though they were true.<end>"

["1390152"]
japanese = "\u3000\u3000\u3000\u3000すべての人々が終末への予感を<line-break>\u3000\u3000\u3000\u3000\u3000\u3000抱き始めていた…。<end>"
english = "Everyone began to sense that the end was near...<end>"

