english = "And so... the upheaval that would later become known as the Ryuga Incident came to an end.<end>"

["1390019"]
japanese = "この混乱の最中、シャリと<line-break>闇の力に魅入られた王女アトレイアが<line-break>現れ、王宮に殺戮の嵐を巻き起こした。<line-break> <end>"
english = "Amid the chaos, Shalli and Princess Atleia, who had fallen under the spell of the power of darkness, appeared and unleashed a storm of slaughter in the royal palace.<end>"

