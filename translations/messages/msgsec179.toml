["1790000"]
japanese = "ロストールメッセージＶ５／２開始<end>"
english = ""

["1790001"]
japanese = "あ、伯爵様。王妃様が<line-break>謁見の間に来るようにとのことでした。<end>"
english = "Ah, Count. Her Majesty the Queen has asked you to come to the audience chamber.<end>"

["1790002"]
japanese = "では、謁見の間まで<line-break>ご案内いたします。<end>"
english = "Allow me to escort you to the audience chamber.<end>"

["1790003"]
japanese = "今日、そなたたちを集めたのは、<line-break>エリエナイ公、そなたに<line-break>問いただしたいことがあったからだ。<line-break>エリエナイ公レムオンよ。<line-break>そなた、ダルケニスではないか？<end>"
english = "I called you all here today because there is something I must ask you, Duke of Elienai. Lemghon, Duke of Elienai, are you a Darkenis?<end>"

["1790004"]
japanese = "…何をご冗談を。<end>"
english = "...You must be joking.<end>"

["1790005"]
japanese = "我が手の者が、<line-break>そなたが銀髪赤眼で血を求め、<line-break>吼えておったところを見ておる。<end>"
english = "One of my agents saw you with silver hair and red eyes, howling for blood.<end>"

["1790006"]
japanese = "…ダルケニスだったってことは、<line-break>そりゃ、前の新月の晩のことだよな、<line-break>叔母貴。<end>"
english = "If you're saying he was a Darkenis, you mean on the night of the last new moon, right, Aunt?<end>"

["1790007"]
japanese = "その通りだ。<end>"
english = "Precisely.<end>"

["1790008"]
japanese = "叔母貴の言う手の者ってのは、<line-break>もしかして、ツェラシェルか？<end>"
english = "This agent of yours―would that happen to be Zelashell?<end>"

["1790009"]
japanese = "そいつは、変だな。<line-break>俺はその晩、そのツェラシェルと<line-break>一緒だったんですよ。<end>"
english = "That's odd. I was with Zelashell that night.<end>"

["1790010"]
japanese = "…その言葉に偽りはないか？<line-break>ファーロス総司令。<end>"
english = "...Is that the truth, Commander-in-Chief Pharos?<end>"

["1790011"]
japanese = "千年樹に賭けて真実です、陛下。<line-break>それにノーブル伯も一緒だったしな。<line-break>な、<value:$28>。<end>"
english = "I swear by the Thousand-Year Tree, Your Majesty, it's true. The Count of Noble was there too. Isn't that right, <value:$28>?<end>"

["1790012"]
japanese = "そうか。ノーブル伯と総司令が<line-break>そう申すなら、間違いあるまい。<line-break>エリエナイ公もとんだ嫌疑であったな。<end>"
english = "Then there can be no mistake, if both the Count of Noble and the Commander-in-Chief vouch for it. It seems the Duke of Elienai has been falsely accused.<end>"

["1790013"]
japanese = "…陛下、気分が悪いので、<line-break>失礼いたします。<end>"
english = "Your Majesty, I am feeling unwell. Please excuse me.<end>"

["1790014"]
japanese = "恩を売る気か？<end>"
english = "Are you trying to put me in your debt?<end>"

["1790015"]
japanese = "そんなんじゃねぇさ。<end>"
english = "That's not why I did it.<end>"

["1790016"]
japanese = "後悔するぞ。<line-break>俺はもう腹を決めているのだ。<end>"
english = "You will regret this. I have already made my decision.<end>"

["1790017"]
japanese = "もう用はないようだな。<line-break>疲れた。下がらせてもらうぞ。<end>"
english = "It seems I am no longer needed here. I am tired. I shall retire.<end>"

["1790018"]
japanese = "…どういうつもりだ、ゼネテス。<line-break>手負いの獣を野に放つのか？<line-break>危険すぎるぞ。<end>"
english = "What are you playing at, Xenetes? Would you turn a wounded beast loose in the wild? It is far too dangerous.<end>"

["1790019"]
japanese = "叔母貴、ディンガル帝国の手が<line-break>そこまで伸びてる。だから、反対派の<line-break>巨頭を消そうと目論んだんだろうが…<line-break>少なくとも<line-break>種族間の不理解をネタに使うのは、<line-break>俺は気に入らないぜ。<end>"
english = "Aunt, the Dyneskal Empire's reach extends even this far. I suppose that's why you plotted to eliminate a leader of the opposition... but I, for one, don't like you exploiting the lack of understanding between races to do it.<end>"

["1790020"]
japanese = "以後は、総司令の不興を買わぬよう<line-break>肝に銘じよう。<line-break>…だが、甘いな。<line-break>これで、私とそなたは<line-break>一歩、死に近づいたぞ。<end>"
english = "I shall remember not to incur the Commander-in-Chief's displeasure again. But you are naive. This has brought both of us one step closer to death.<end>"

["1790021"]
japanese = "誰だって、死ぬのは決まってるさ。<line-break>俺は叔母貴と心中できるなら<line-break>本望だぜ。<end>"
english = "Everyone dies sooner or later. If I get to die with you, Aunt, I couldn't ask for more.<end>"

["1790022"]
japanese = "フフ、私はごめんこうむる。<line-break>できるだけの手を打つだけだ。<end>"
english = "Heh. No, thank you. I shall simply do all I can.<end>"

