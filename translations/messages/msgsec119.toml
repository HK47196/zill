["1190000"]
japanese = "ケリュネイア\u3000Ｖ２\u3000開始<end>"
english = ""

["1190001"]
japanese = "お、<value:$28>。<line-break>ちょっと来てくれないか。\u3000\u3000\u3000\u3000\u3000<end>"
english = "Ah, <value:$28>. Could you come over here a moment?<end>"

["1190002"]
japanese = "実はな、お前に名指しで\u3000\u3000\u3000\u3000\u3000\u3000<line-break>依頼が来ているそうだ。<line-break>\u3000<line-break>依頼主はハーフエルフらしい。\u3000\u3000\u3000<line-break>エンシャントの冒険者ギルドで<line-break>詳しい内容が聞けるぜ。<end>"
english = "Apparently, a request has come in asking for you by name. The client seems to be a Half-Elf. You can hear the details at the Ancient Adventurers' Guild.<end>"

["1190003"]
japanese = "指名されるなんて大したもんだぜ。\u3000<line-break>この依頼、逃すなよ。<line-break>名を売る絶好の機会だからな。<end>"
english = "Not bad, getting asked for by name. Don't let this one get away. It's the perfect chance to make a name for yourself.<end>"

["1190004"]
japanese = "お、<value:$28>。<line-break>ちょっと来てくれないか。<end>"
english = "Ah, <value:$28>. Could you come over here a moment?<end>"

["1190005"]
japanese = "実はな、お前に名指しで依頼が来てる。<line-break>依頼主は、ケリュネイアというハーフエルフで、<line-break>闇の神器を手に入れてほしいって内容だ。<line-break>こいつは全部で１２あるらしいんだが、<line-break>在処がわかってるのは、３点。<end>"
english = "You've been asked for by name. The client is a Half-Elf called Ceryneia, and she wants you to obtain the Dark Artifacts. There are apparently twelve in all, but the whereabouts of only three are known.<end>"

["1190006"]
japanese = "ひとつはロセン北の罪深き者の迷宮に\u3000\u3000\u3000\u3000\u3000<line-break>あるらしいんだが、いつでも見つかる<line-break>わけじゃないそうだ。<line-break>もうひとつはウルカーンにあって、<line-break>最後のひとつは考古学者の<line-break>エスト・リューガが持っているらしい。<end>"
english = "One is said to be in the Labyrinth of Sinners north of Rocen, though apparently it isn't always possible to find it. Another is in Ulkarne, and the last is said to be in the possession of the archaeologist Est Ryuga.<end>"

["1190007"]
japanese = "俺もこれ以上詳しい内容は知らないんだ。\u3000\u3000\u3000<line-break>もっと詳しく知りたかったら、<line-break>ケリュネイアに直接会ってくれ。<line-break>この町の港の向こうに<line-break>ライラネート神殿があるだろ？<line-break>そこで待ってるって言ってたよ。<end>"
english = "That's all I know. If you want the details, you'll have to speak to Ceryneia yourself. You know the Temple of Lailanate, across the harbor? She said she'd be waiting there.<end>"

["1190008"]
japanese = "まあ、そんな顔しなさんな。<line-break>とんでもない依頼内容だってことは\u3000<line-break>わかるがさ。<end>"
english = "Come on, don't look like that. I know it's an outrageous request.<end>"

["1190009"]
japanese = "ともかく、闇の神器を見つけたら、\u3000<line-break>持ってきてくれ。<line-break>\u3000<line-break>期限は無期限。<line-break>今言った３つ以外でもいいそうだから<line-break>がんばってくれよ。<end>"
english = "Anyway, if you find a Dark Artifact, bring it in. There's no deadline, and it doesn't have to be one of the three I mentioned. Good luck.<end>"

["1190010"]
japanese = "ま、なんだか怪しい感じだからな。\u3000<line-break>無理はしないこった。<line-break>気をつけろよ。<end>"
english = "Well, the whole thing sounds a bit suspicious. Don't overdo it. Watch yourself.<end>"

["1190011"]
japanese = "あなたが<value:$28>ね。<end>"
english = "So you're <value:$28>.<end>"

["1190012"]
japanese = "はじめまして。<line-break>私が、闇の神器探索の依頼主、<line-break>ケリュネイアよ。<line-break>どう、神器は手に入れた？<end>"
english = "A pleasure to meet you. I'm Ceryneia, the one who hired you to search for the Artifacts of Darkness. Well? Did you find one?<end>"

["1190013"]
japanese = "手に入れた<end>"
english = "I have it.<end>"

["1190014"]
japanese = "まだこれから<end>"
english = "Not yet.<end>"

["1190015"]
japanese = "そう。ならば、もう気付いているわね。<line-break>ネメアも闇の神器を<line-break>探しているということに。<end>"
english = "Good. Then you've already realized that Nemea is searching for the Artifacts of Darkness as well.<end>"

["1190016"]
japanese = "だったら、急いだ方がいいわ。<line-break>闇の神器は<line-break>ネメアも狙っているのよ。<end>"
english = "Then you'd better hurry. Nemea is after the Artifacts of Darkness too.<end>"

["1190017"]
japanese = "闇の神器が１２個すべて集まれば、<line-break>破壊神ウルグを<line-break>呼び出せると言われているわ。<line-break>王位を簒奪して、<line-break>世界征服をたくらむ男に、<line-break>渡していいような代物じゃないのよ。<end>"
english = "It is said that if all twelve Artifacts of Darkness are gathered, Ulugh, the God of Destruction, can be summoned. They cannot be allowed to fall into the hands of a man plotting to usurp the throne and conquer the world.<end>"

["1190018"]
japanese = "悪用するとは限らない<end>"
english = "That doesn't mean he'll misuse them.<end>"

["1190019"]
japanese = "………………<end>"
english = "………………<end>"

["1190020"]
japanese = "甘いわ、<value:$28>。<line-break>英雄はいつまでも<line-break>英雄でいるとは限らないのよ。<line-break>ネメアに倒された魔王バロルも<line-break>もとはディンガルを統一した<line-break>英雄だったのよ。<end>"
english = "You're naive, <value:$28>. A hero does not always remain a hero. Balor, the Demon King defeated by Nemea, was once the hero who united Dyneskal.<end>"

["1190021"]
japanese = "ネメアは確かに英雄だったわ。\u3000\u3000\u3000<line-break>ディンガルに現れた<line-break>魔王バロルを倒したのですもの。<line-break>でもね、ネメアに倒された魔王バロルも<line-break>もとはディンガルを統一した<line-break>英雄だったのよ。<end>"
english = "Nemea was certainly a hero. He defeated Balor, the Demon King who appeared in Dyneskal. But Balor himself was once the hero who united Dyneskal.<end>"

["1190022"]
japanese = "それにね…、<line-break>ネメアは人の子じゃないのよ。<end>"
english = "And there is something else... Nemea is no child of man.<end>"

["1190023"]
japanese = "彼の父親は魔人、<line-break>破壊神の円卓騎士バルザーよ。<end>"
english = "His father is a demon: Baltzer, a Knight of the Round Table serving the God of Destruction.<end>"

["1190024"]
japanese = "ネメアをこのまま<line-break>放っておくことは危険だわ。<end>"
english = "It is too dangerous to leave Nemea unchecked.<end>"

["1190025"]
japanese = "闇の神器を渡すわけにはいかないの。<line-break>覚悟を決めて、<line-break>ネメアと対決して。<end>"
english = "You can't hand over the Artifacts of Darkness. Steel yourself and confront Nemea.<end>"

["1190026"]
japanese = "なぜあなたでなければ<line-break>ならないのか？<line-break>…いい質問ね。<end>"
english = "Why does it have to be you? ...That's a good question.<end>"

["1190027"]
japanese = "闇の神器は強力な魔道器なの。\u3000<line-break>その力は、持っているだけで、<line-break>その者を闇に染めてしまうわ。<line-break>闇の神器に取り込まれないだけの<line-break>強力なソウルの持ち主なんて、<line-break>この世に限られているのよ。<end>"
english = "The Artifacts of Darkness are powerful arcane devices. Simply possessing one can taint its bearer with darkness. There are very few in this world whose Soul is strong enough to resist being consumed by one.<end>"

["1190028"]
japanese = "そして、あなたは<line-break>そのひとりなの。<end>"
english = "And you are one of them.<end>"

["1190029"]
japanese = "好む好まざるに関わらず、<line-break>あなたの周りで運命は<line-break>動きはじめているのよ。<line-break>それだけは覚えておきなさい。<end>"
english = "Whether you want it or not, fate has begun to move around you. Remember that.<end>"

["1190030"]
japanese = "束縛の腕輪を持ってきたのか。<line-break>よしよし、ケリュネイアから聞いている<line-break>形状と同じだな。<line-break>合格だ。こいつが報酬だ。<line-break>受け取りな。<end>"
english = "So, you brought the Bracelet of Binding. Good, good. It matches the description Ceryneia gave me. That'll do. Here's your reward. Take it.<end>"

["1190031"]
japanese = "そいつはお前が持っていてくれ。\u3000\u3000\u3000<line-break>よくわからんが、依頼主が<line-break>そうしてくれって言ってたんでな。<end>"
english = "Keep that with you. I don't know why, but that's what the client asked for.<end>"

["1190032"]
japanese = "傲慢の首飾りを持ってきたのか。<line-break>よしよし、ケリュネイアから聞いている<line-break>形状と同じだな。<line-break>合格だ。こいつが報酬だ。<line-break>受け取りな。<end>"
english = "So, you've brought the Necklace of Pride. Good, good. It matches Ceryneia's description. That'll do. Here's your reward. Take it.<end>"

