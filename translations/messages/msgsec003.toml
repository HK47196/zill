["30000"]
japanese = "<if><value:$2A><less-equal>%50<value:$28>殿と申されるか。<line-break>申しわけないが、あなたを通してもよい<line-break>という通達は受けておりませぬ。<line-break>我々も無駄な血は流したくないゆえ、<line-break>今日のところは、おとなしく帰って<line-break>もらえませぬか。<end><if><value:$2A><less-equal>%75あなたが<value:$28>殿ですか。<line-break>噂は聞いておりますぞ。<line-break>若手冒険者の中でも１番の注目株とか。\u3000\u3000<line-break>しかし我々もここを守るのが仕事ゆえ、<line-break>いかに<value:$28>殿でも通すわけには<line-break>いきませぬ。お帰りくだされい。<end>これはこれは、<value:$28>殿。<line-break>あいかわらず、ご活躍のようですな。\u3000\u3000\u3000\u3000<line-break>ところで、本日はどのようなご用ですかな？<line-break>あなたを通すよう命令は受けておりませぬが。<line-break>私も仕事ゆえ、許可のない方を通すわけには<line-break>いかぬのですよ。許してくだされ。<end>"
english = "<if><value:$2A><less-equal>%50You are called <value:$28>, I believe. My apologies, but we have received no word that you are to be allowed through. We have no wish to spill blood needlessly, so would you please turn back quietly for today?<end><if><value:$2A><less-equal>%75So you are <value:$28>. I have heard the rumors. They say you are the most promising of the young adventurers. But guarding this place is our duty, and even <value:$28> cannot be allowed through. Please turn back.<end>Well, well, <value:$28>. I see you are as active as ever. What brings you here today? I have received no orders to let you pass. I have a duty to perform, and I cannot admit anyone without permission. I hope you will forgive me.<end>"

["30001"]
japanese = "<select><value:$20>%1ここより先は王宮です。<line-break>許可のない者を通すわけには<line-break>いきません。早々にお帰りください。<end>"
english = "<select><value:$20>%1The royal palace lies beyond this point. No one may pass without permission. Please leave at once.<end>"

["30002"]
japanese = "<select><value:$33>一度旅立ってしまうとしばらくは<line-break>帰れないぞ。後悔のないようにな。<end>いやー、このあいだの地震はすごかったな。<line-break>ノトゥーン神殿のシンボルともいえる<line-break>天井のステンドグラスが壊れるぐらいだものな。<end>ばんざーい！\u3000とうとう皇帝ネメアの誕生だ！<line-break>ディンガル帝国の皇帝には、あの方こそ<line-break>ふさわしかったんだよ。<line-break>えっ、主君殺しだって？\u3000とんでもない！<line-break>もともと玉座にはネメア様が座るべきなんだ。<line-break>それをエリュマルクから取り戻しただけだよ。<end>青竜将軍カルラの活躍は聞いたかい？<line-break>東方諸国をたった数週間で滅ぼして<line-break>しまうんだから彼女は間違いなく天才だよ。<line-break>あんなかわいい少女が戦争の天才だなんて<line-break>普通気づかないよなあ。彼女を見いだして<line-break>将軍に任命したネメア様はすばらしいね。<end>アンギルダン将軍の山越え作戦は歴史に残るね。<line-break>ロストール軍も壊滅的だっていうし、<line-break>我がディンガルに、敵はなしだな。<line-break>えっ！？<line-break>ロストールのゼネテスにアンギルダン将軍が<line-break>敗れたって？\u3000じょ、冗談だろ？<end>青竜将軍カルラが、リベルダムを占領したね。<line-break>なんでも、大商人のアンティノを使って<line-break>門を、中から開けさせたそうだよ。<line-break>難攻不落の城壁も、内側から攻められれば<line-break>ただの壁ってことだね。<line-break>しっかし、カルラ将軍は戦いの天才だね。<end>いよいよカルラ将軍がロストール攻略を<line-break>開始するそうだね。<line-break>ネメア陛下の世界統一も時間の問題だね。<end>ネメア様が行方不明なんて根も葉もない噂が<line-break>流れているけど、信じるものか！<line-break>魔王バロルを倒した勇者が、死ぬわけがない！<end>"
english = "<select><value:$33>Once you set out, you won't be able to return for some time. Make sure you have no regrets.<end>That earthquake the other day was incredible. It even shattered the stained-glass ceiling, practically a symbol of Notun Temple.<end>Hurray! At last, Emperor Nemea has taken the throne! No one was better suited to rule the Dyneskal Empire. What? You call him a lord-slayer? Nonsense! Nemea was always the rightful occupant of the throne. He merely reclaimed it from Eryumark.<end>Have you heard about the exploits of Karula, the Azure Dragon General? She destroyed the Eastern Nations in just a few weeks. She's unquestionably a genius. No one would expect such a pretty young girl to be a genius at war. Nemea deserves praise for recognizing her talent and making her a general.<end>General Angeerdan's operation across the mountains will go down in history. They say Rostorl's army was devastated. No one can stand against Dyneskal now. What!? General Angeerdan was defeated by Xenetes of Rostorl? Y-you're joking, right?<end>Karula, the Azure Dragon General, has occupied Liberdam. Apparently, she used the great merchant Antino to have the gates opened from within. Even impregnable walls are just walls when attacked from the inside. Karula truly is a genius at war.<end>I hear General Karula is finally launching the Rostorl Campaign. It won't be long before Emperor Nemea unites the world.<end>There are baseless rumors that Nemea has gone missing, but I refuse to believe them! The Hero who defeated Balor, Demon King, cannot be dead!<end>"

["30003"]
japanese = "<select><value:$20>%2これは戦神ソリアスの像ですね。<line-break>ソリアスは神々の時代、破壊神ウルグを<line-break>倒すために異世界から呼ばれた神なのです。<end>強い憎しみや怒りから身体が闇に染まった\u3000\u3000<line-break>エルフを我々はダークエルフと呼んでいます。<line-break>ダークエルフは闇の使いなので抹殺すべし…<line-break>そう森では教えられましたが、世界を旅する<line-break>うちに疑問をもつようになりました。<line-break>自分の感情を隠すことは誤りではないかと…。<end>"
english = "<select><value:$20>%2This is a statue of the War God Solias. In the Age of the Gods, Solias was summoned from another world to defeat Urg, the God of Destruction.<end>We call Elves whose bodies have been steeped in darkness by intense hatred or anger Dark Elves. In the forest, I was taught that Dark Elves are servants of darkness and must be exterminated... But as I traveled the world, I began to question that teaching. I began to wonder whether hiding one's feelings might itself be wrong...<end>"

["30004"]
japanese = "<if><value:$2C><less-equal>%25上位の魔法を使えるようになりたいのなら\u3000\u3000\u3000<line-break>探求心Ｓｅａｒｃｈだけでなく冷静さＣｏｏｌも<line-break>高めなさい。そうすればニルヴァーナが宿るわ。<line-break>強力な精霊力を制御するには冷静さが必要なの。<line-break>もちろん精霊力レベルが低いとスキルがあっても<line-break>魔法は使えないわよ。<end><if><value:$2C><less-equal>%40各属性にひとつずつ封印された禁呪があるの。<line-break>新月の塔と呼ばれる所にも、<line-break>禁呪が封印されているそうよ。<end>究極のソウルを宿すためには、マイティブロウ、<line-break>ニルヴァーナ、トリックスター、パトリアーク、<line-break>アルバレストが必要になるそうよ。<end>"
english = "<if><value:$2C><less-equal>%25If you wish to use advanced magic, you must cultivate not only your curiosity, Ｓｅａｒｃｈ, but also your composure, Ｃｏｏｌ. Then you will be able to embody Nirvana. Composure is essential for controlling powerful elemental forces. Of course, even with the necessary skill, you cannot cast a spell if your elemental level is too low.<end><if><value:$2C><less-equal>%40Each element has one sealed Forbidden Spell. They say a Forbidden Spell is also sealed in a place called New Moon Tower.<end>They say you need Mighty Blow, Nirvana, Trickster, Patriarch, and Arbalest to embody the Ultimate Soul.<end>"

["30005"]
japanese = "<select><value:$20>%3ねえねえ、ゆうしゃってな～に？<line-break>世界を救うためなら何をしても<line-break>許される人のことなのぉ？<end>せんそーって、勝ったほうが<line-break>せいぎで、ただしーんだよねぇ。<line-break>だから、なんとしても勝つんだってぇ。<end>せっかく新しいソウルを身につけたのに<line-break>宿すのを忘れちゃったことなぁい？<end>"
english = "<select><value:$20>%3Hey, hey, what's a hero? Is it someone who's allowed to do anything at all, as long as it's to save the world?<end>In war, whoever wins is good and right, isn't that how it works? That's why you've got to win, no matter what. That's what they say.<end>Have you ever acquired a brand-new Soul and then forgotten to embody it?<end>"

["30006"]
japanese = "<if><value:$2C><less-equal>%10エンシャントの南にある賢者の森には<line-break>その名の通り賢者が住んでいるんだと。<line-break>だが、わしが行っても何もなかったけどな。<end><if><value:$2C><less-equal>%20ギルドで仕事を受けるときは、<line-break>自分の実力を考えて受けるんだぞ。<line-break>無理して死んでも仕方がないだろう。<end><if><value:$2C><less-equal>%30宝箱に仕掛けられている罠を解除するには、<line-break>アンチハードルのスキルが必須だぞ。<line-break>難易度の高い罠は、解除が難しいからな。<end>装備品は重いから持てる数に制限があるぞ。<line-break>だが聖や闇の属性を宿した武器は、自分で造る<line-break>ことができないから捨てたりせんようにな。<end>"
english = "<if><value:$2C><less-equal>%10They say a sage lives in the Sage's Forest south of Ancient, just as the name suggests. But when I went there, I found nothing.<end><if><value:$2C><less-equal>%20When you take a job from the Guild, choose one suited to your abilities. There's no sense taking on too much and getting yourself killed.<end><if><value:$2C><less-equal>%30You need the Anti-Hurdle skill to disarm traps on treasure chests. The more difficult the trap, the harder it is to disarm.<end>Equipment is heavy, so there is a limit to how much you can carry. But you cannot make weapons imbued with Holy or Dark power yourself, so take care not to throw them away.<end>"

["30007"]
japanese = "<select><value:$33>エリュマルク陛下もひどいお方だよ。\u3000\u3000\u3000\u3000\u3000<line-break>ネメア様に無理難題ばかりふっかけて<line-break>成し遂げられなかったら罰を与えようなんてさ。<line-break>もっともネメア様はすべての無理難題を成し遂げ<line-break>てしまったから、陛下もくやしかったろうね。<line-break>これでネメア様の株がますます上がっちゃうよ。<end>ネメア様がとうとう皇帝を見限って\u3000\u3000<line-break>エンシャントから逃げ出したって噂は<line-break>どうも本当のことらしいよ。<line-break>皇帝のネメア様に対する嫌がらせも<line-break>ひどいもんだったからねえ。<line-break>ネメア様も今までよく耐えたと思うよ。<end>とうとう来るべき時が来てしまったねえ。\u3000\u3000<line-break>殺されたエリュマルク帝も自業自得だよ。<line-break>ネメア様も皇帝殺しを恥じることはないさ。<line-break>あれだけ無理難題を押しつけられても黙って<line-break>耐えて、しかもすべて成し遂げてきたのだから。<line-break>悪いのはどう考えてもエリュマルク帝だよ。<end>東方の国はぜーんぶ滅ぼされたそうじゃないか。<line-break>ロセンのペウダはひどいことばかりしていた<line-break>そうだから、親族皆殺しも当然の報いだよ。<end>ロストールの将軍は能なしばかりだと\u3000<line-break>思っていたけど、ゼネテスってのは<line-break>それなりにできるみたいじゃないか。<line-break>だけど、カルラ将軍やネメア様には、<line-break>到底かなわないだろうさ。<line-break>ロストールが滅ぶのも時間の問題だよ。<end>リベルダムは、カルラ将軍によって破壊された<line-break>そうだよ。たぶん、逆らう者への見せしめだと<line-break>思うけど、やりすぎのような気がするねぇ。<end>ネメア様はロストール攻略に参加しないのかね。<line-break>宿敵ロストールとの戦いくらい、ネメア様が<line-break>出陣することを期待していたんだけどねぇ。<end>ネメア様が死んだなんて噂が流れているけど、<line-break>あれはロストールのゼネテスが流した<line-break>デマだそうだよ。<line-break>ネメア様が死んだなんて、信じる人間は<line-break>ディンガルにいるわけがないってのに、<line-break>ゼネテスって男もバカだねぇ。<end>"
english = "<select><value:$33>Emperor Eryumark really is dreadful. He kept setting Nemea impossible tasks, intending to punish him if he failed. But Nemea completed every last one, so the emperor must have been furious. Nemea's reputation will only rise higher now.<end>It seems the rumor is true: Nemea finally gave up on the emperor and fled Ancient. The emperor's harassment had become unbearable. Nemea endured it remarkably long.<end>So the inevitable has finally happened. Emperor Eryumark had only himself to blame for his death. Nemea has no reason to be ashamed of killing the emperor. He silently endured every impossible task and completed them all. However you look at it, Eryumark was the one at fault.<end>They say every nation in the east has been destroyed. Peuda of Rocen committed one atrocity after another, so the slaughter of his entire family was only fitting retribution.<end>I thought all Rostorl's generals were useless, but this Xenetes seems reasonably capable. Still, he could never measure up to General Karula or Nemea. Rostorl's fall is only a matter of time.<end>They say General Karula destroyed Liberdam. I suppose it was meant as a warning to anyone who might resist, but I think she went too far.<end>Is Nemea not taking part in the Rostorl Campaign? I thought he would at least take the field against his arch-enemy, Rostorl.<end>There are rumors that Nemea is dead, but apparently Xenetes of Rostorl started them. No one in Dyneskal would ever believe Nemea had died. Xenetes is a fool.<end>"

["30008"]
japanese = "<select><value:$20>%2エリュマルク帝はネメア様に、国境を侵し\u3000\u3000\u3000<line-break>村々を略奪するロセン軍を、わずかな騎兵<line-break>のみで撃退するよう命じたのじゃ。<line-break>ネメア様はロセン王ペウダの野営地に夜襲をかけ<line-break>ロセン軍が壊滅、ペウダは命からがら逃げた<line-break>そうじゃ。１２の難事のひとつじゃよ。<end>エリュマルク帝はネメア様に、施文院大神官の<line-break>イズをさらってくるよう命じたのじゃ。<line-break>イズは絶世の美女として有名じゃったからな。<line-break>ネメア様は不名誉な役目であるにも関わらず<line-break>１人旅立たれ、見事イズを連れてきたのじゃ。<line-break>１２の難事のひとつじゃよ。<end>"
english = "<select><value:$20>%2Emperor Eryumark ordered Nemea to repel the Rocen army, which had crossed the border and was pillaging villages, with only a small cavalry force. Nemea launched a night attack on King Peuda's camp, routing the Rocen army and leaving Peuda to escape with his life by the narrowest margin. It was one of the Twelve Labors.<end>Emperor Eryumark ordered Nemea to abduct Iz, the high priest of the Shiwenin. Iz was renowned as a woman of peerless beauty. Though the task was dishonorable, Nemea set out alone and returned with Iz. It was one of the Twelve Labors.<end>"

["30009"]
japanese = "<select><value:$33>ここはディンガル帝国の首都エンシャントよ。<end>ねえ、聞いた聞いた？\u3000どんなにひどい仕打ちを<line-break>受けても耐えていたネメア様も、とうとう<line-break>エリュマルク帝を見限って出奔したそうよ。<line-break>城勤めの友達の情報なんだけど、ネメア様の<line-break>人気を妬んだエリュマルク帝が無実の罪で<line-break>ネメア様を処刑しようとしたのが原因みたいよ。<end>ねえねえ、聞いた聞いた？\u3000再編成された\u3000\u3000\u3000<line-break>ディンガル軍にはディンガル統一戦争で活躍した<line-break>アンギルダン将軍が戻ってきたんですって。<line-break>驚くのはまだ早いわよ、若干１６歳の少女が<line-break>将軍の１人として大抜擢されたらしいのよ。<line-break>ネメア様も大胆な人事をされるわね。<end>ねえねえねえ、あなた知ってる？\u3000\u3000\u3000\u3000\u3000\u3000<line-break>例の若干１６歳で青竜将軍に任命された少女、<line-break>カルラって娘なんだけど、大活躍なのよ。<line-break>ロセンを含む東方の６国家をたったの数週間で<line-break>滅ぼしちゃったの。たったの数週間よ！<line-break>私が保証するわ、彼女は戦争の天才よ。<end>ねえねえったらねえ、あなた知ってる？<line-break>名将アンギルダン将軍が、山越えの奇襲ってのを<line-break>成功させてロストール軍をやっつけたんだって。<line-break>でも、アンギルダン将軍がゼネテスっていう<line-break>冒険者上がりの男にやられたって話も聞いたわ。<line-break>どっちが本当なのかしら…。<end>あなた、リベルダムって知っているかしら？\u3000<line-break>ここの南にある大きな町なの。<line-break>そこを天才カルラ将軍が占領したんだって。<line-break>でもね、せっかく占領したのにめちゃめちゃに<line-break>壊しちゃったみたいなの。<line-break>もう闘技場で試合観戦はできないのねぇ。<end>もう、知っていると思うけど、カルラ将軍が<line-break>ロストール攻略を開始するんだって。<line-break>ゼネテスとカルラ将軍、どっちが勝つかな。<end>ねえねえ、すごい情報があるんだけど。<line-break>ネメア様が死んだって噂がロストールを中心に<line-break>流れているんだって。<line-break>これって、ロストールのゼネテスの作戦よ。<line-break>この噂で動揺させるつもりに違いないわ。<line-break>ひっかかったらダメだからね。<end>"
english = "<select><value:$33>This is Ancient, capital of the Dyneskal Empire.<end>Have you heard? Nemea endured every cruelty, but finally gave up on Emperor Eryumark and fled. I heard it from a friend who works at the castle. Apparently, Eryumark was jealous of Nemea's popularity and tried to have him executed on false charges.<end>Have you heard? General Angeerdan, who distinguished himself in the Dyneskal Unification War, has returned to the reorganized Dyneskal Army. But that's not even the most surprising part. Apparently, a girl of only sixteen has been given an extraordinary promotion to general. Nemea certainly makes bold appointments.<end>Listen, have you heard about Karula? She's the girl who was appointed Azure Dragon General at only sixteen, and she's been doing astonishingly well. She destroyed six Eastern Nations, including Rocen, in only a few weeks. Just a few weeks! Take my word for it: she's a genius at war.<end>Listen, do you know what I heard? The great General Angeerdan launched a surprise attack across the mountains and defeated Rostorl's army. But I also heard that Angeerdan was beaten by a former adventurer named Xenetes. I wonder which story is true...<end>Do you know Liberdam? It's a large city south of here. I hear the brilliant General Karula occupied it. But after going to all that trouble, she apparently smashed the place to pieces. I suppose there'll be no more watching matches at the arena.<end>You probably know already, but General Karula is launching the Rostorl Campaign. I wonder who will win, Xenetes or General Karula.<end>Listen, I've got an incredible piece of news. Rumors that Nemea is dead are spreading, mainly through Rostorl. This must be part of Xenetes's strategy. He's trying to shake us with these rumors. Don't fall for it.<end>"

["30010"]
japanese = "<select><value:$20>%2あなた冒険者なら賢者の森に入ったことある？<line-break>勇者ネメアと一緒に魔王バロルと戦った賢者が<line-break>猫に囲まれて住んでいるって本当なのかしら。<line-break>あっ、でもよく考えたら普通の人は入れない<line-break>らしいから、あなたも入れないわけよね。<line-break>もし入れたら普通じゃないってことだもの。<end>故郷のテラネにはコーンス族の男の子がいたの。<line-break>でも、エンシャントではコーンス族って見たこと<line-break>ないわ。コーンス族の数が減ってるのは本当ね。<end>"
english = "<select><value:$20>%2You're an adventurer. Have you ever entered the Sage's Forest? I wonder if it's true that the sage who fought Balor, Demon King, alongside the Hero Nemea lives there surrounded by cats. Oh, but come to think of it, ordinary people supposedly can't get in, so I suppose you can't either. If you could, you wouldn't be ordinary.<end>There was a boy of the Corns people in my hometown of Terane. But I've never seen any Corns here in Ancient. Their numbers truly must be dwindling.<end>"

["30011"]
japanese = "<if><value:$2A><less-equal>%49ぼくの夢は、英雄の詩を作ることなんだぁ。<line-break>英雄叙事詩なら、ぼくが死んでも<line-break>ずーっと歌い継がれるもん。<line-break>だから、伝説の英雄って呼ばれそうな人を<line-break>探してるの。誰か英雄になりそうな人を<line-break>知ってたらおしえてよ。\u3000<end><if><value:$2A><less-equal>%100きみ、<value:$28>って名前でしょう？<line-break>冒険者ギルドの主人に聞いたんだ。<line-break>最近すっごく活躍しているんだってね。<line-break>今度、きみの冒険談を聞かせてよ。<line-break>きみなら英雄叙事詩の主役になれそうな<line-break>気がするんだ。<end><if><value:$2A><less-equal>%150やあ、<value:$2B>さん。<line-break>通り名がついてますますいい感じだね。<line-break>ぼくもがんばって詩を書くぞ！<end><value:$28>が主人公の叙事詩も、<line-break>だいぶ完成にちかづいてきたよ。<line-break>君の冒険に決着がついたとき、歌ってあげるよ。<end>"
english = "<if><value:$2A><less-equal>%49My dream is to write a song about a hero. If I make it an epic, people will keep singing it long after I'm dead. So I'm looking for someone who might become a legendary hero. Tell me if you know anyone who could.<end><if><value:$2A><less-equal>%100Your name is <value:$28>, isn't it? The master of the Adventurers' Guild told me. I hear you've been doing amazing things lately. Tell me about your adventures sometime. I think you could be the hero of my epic.<end><if><value:$2A><less-equal>%150Hello, <value:$2B>! Having an epithet makes you sound even better. I'll work hard on my poetry too!<end>My epic about <value:$28> is nearly finished. Once your adventure reaches its end, I'll sing it for you.<end>"

["30012"]
japanese = "<if><value:$2C><less-equal>%9エンシャントの西にある新月の塔の最上階に、<line-break>使い方も造られた目的もわかっていない<line-break>謎の祭壇があるって話を知っているかい？<line-break>俺もその祭壇を見てやろうと登ってみたが<line-break>上の階にいくほどモンスターが強くてね。<line-break>恥ずかしながら途中までしか登れなかったぜ。<end><if><value:$2C><less-equal>%29乙女の鏡なんて、しゃれた名前だと思わないか？<line-break>湖畔に美しい乙女がずらーっと並んで湖面を<line-break>鏡代わり使ってる姿が目に浮かぶねえ。<line-break>実際に行ってみると乙女じやなくてモンスターが<line-break>いるんだけどな。そういえば５本の柱に囲まれた<line-break>小さな島が湖の真ん中にあったなあ。<end>新月の塔の最上階に行ったことあるかい？\u3000<line-break>俺は今まで最上階にあるって噂の謎の祭壇を<line-break>見てやろうと、何回も挑戦しているんだぜ。<line-break>だけど上の階にいくほどモンスターが強くて<line-break>なかなかたどり着けないんだな、これが。<line-break>もうちょっとで、たどり着けるんだがよ。<end>"
english = "<if><value:$2C><less-equal>%9Have you heard about the mysterious altar at the top of New Moon Tower, west of Ancient? No one knows how it works or why it was built. I climbed the tower to see it for myself, but the monsters grew stronger the higher I went. I'm ashamed to admit I only made it partway up.<end><if><value:$2C><less-equal>%29Maiden's Mirror. Now that's an elegant name, don't you think? It makes me picture a long row of beautiful maidens along the shore, using the lake's surface as a mirror. When you actually go there, though, you find monsters instead of maidens. Come to think of it, there was a little island in the middle of the lake surrounded by five pillars.<end>Have you ever reached the top of New Moon Tower? I've made attempt after attempt to see the mysterious altar rumored to be up there. But the monsters get stronger the higher I climb, and I can never quite reach it. I'm almost there, though.<end>"

["30013"]
japanese = "<select><value:$33>ぼくの従妹はロセンに住んでいるんです。\u3000\u3000<line-break>だけど、今のロセンは門を閉ざしているから<line-break>ぜんぜん会えないんです。<line-break>ロセン王ペウダが近辺の村から娘をさらわせて<line-break>怪物のエサにしているなんて悪い噂を聞いた<line-break>ものだから、心配でしょうがないです。<end>ぼくの従妹はロセンに住んでいるんです。\u3000\u3000<line-break>だけど、今のロセンは門を閉ざしているから<line-break>ぜんぜん会えないんです。<line-break>ロセン王ペウダが近辺の村から娘をさらわせて<line-break>怪物のエサにしているなんて悪い噂を聞いた<line-break>ものだから、心配でしょうがないです。<end>新しく皇帝に即位されたネメア様は、\u3000\u3000\u3000\u3000\u3000<line-break>以前ロセン王が我が国に攻め込んできたとき、\u3000<line-break>わずかな騎兵で撃退したことがあるんです。<line-break>ロセンに住んでいる私の従妹のためにも、<line-break>暗愚王ペウダに苦しむ他の町の人々のためにも、<line-break>ぜひ、ロセン攻めを行ってほしいです。<end>ロセンが解放されてよかったです。<line-break>これで自由にロセンに入ることができますね。<line-break>すべては青竜将軍カルラ様のおかげですよ。<line-break>さっそく、ロセンに住んでいる従妹の<line-break>消息を調べに行かなくてはいけません。<line-break>無事であればいいのですが…。<end>ロセンに住んでいる従妹に無事会うことが\u3000\u3000\u3000<line-break>できました。<line-break>少しやつれていましたが元気そうでした。<line-break>ペウダの悪政と戦争の影響でロセンの町は<line-break>ずいぶん荒廃していますが、ペウダも処刑された<line-break>ことですし、少しずつ復興していくでしょう。<end>ロセンのカルラ将軍はすごい人ですね。<line-break>ロセンの町がすごい勢いで復興しているんです。<line-break>以前より華やかな町になるかもしれませんよ。<end>今のロセンは、まるでリベルダムですよ。\u3000\u3000\u3000<line-break>リベルダム名物の闘技場も建設された<line-break>ようですし、商人も増えて活気もありますし。<line-break>カルラ将軍がリベルダムを破壊したため、<line-break>大富豪フゴーもロセンへ引っ越したそうですよ。<line-break>これで時計塔が建てば完璧なんですけどね。<end>ネメア様が死んだなんていう不吉な噂が<line-break>流れているみたいですね。<line-break>カルラ将軍のロストール攻めも失敗したし…。<line-break>このまま戦乱は続くのでしょうか？<line-break>救世主エルファス様のおっしゃるように<line-break>世界は破滅の道を歩んでいるのかなあ…。<end>"
english = "<select><value:$33>My cousin lives in Rocen. But Rocen's gates are closed now, so I can't visit her at all. I've heard horrible rumors that King Peuda has girls abducted from nearby villages and fed to monsters. I can't stop worrying about her.<end>My cousin lives in Rocen. But Rocen's gates are closed now, so I can't visit her at all. I've heard horrible rumors that King Peuda has girls abducted from nearby villages and fed to monsters. I can't stop worrying about her.<end>When the King of Rocen invaded our country, Nemea, our newly crowned emperor, repelled him with only a small cavalry force. For my cousin in Rocen, and for all the people suffering under that foolish King Peuda, I dearly hope Nemea will launch an attack on Rocen.<end>I'm glad Rocen has been liberated. Now we can enter freely. We owe it all to Karula, the Azure Dragon General. I must go to Rocen at once and find out what happened to my cousin. I only hope she's safe...<end>I managed to find my cousin in Rocen. She looked a little haggard, but otherwise seemed well. Peuda's tyranny and the war have left the city badly ravaged, but now that Peuda has been executed, it should gradually recover.<end>General Karula is doing remarkable things in Rocen. The city is recovering at an incredible pace. It may become even more splendid than before.<end>Rocen is just like Liberdam now. They've even built an arena like Liberdam's famous one, and the growing number of merchants has made the city lively. Since General Karula destroyed Liberdam, the wealthy Hugo has apparently moved to Rocen as well. All it needs now is a clock tower.<end>It seems an ominous rumor is spreading that Nemea is dead. General Karula's attack on Rostorl failed as well... Will the wars simply continue? Perhaps the world truly is marching toward destruction, just as Elfas the Savior says...<end>"

["30014"]
japanese = "<select><value:$20>%2ここは魔法を学ぶために若者が集い、\u3000\u3000\u3000\u3000\u3000<line-break>魔法の研究に励む由緒正しき魔道アカデミーよ。<line-break>ここを卒業しなければ、魔道士とは呼べないわ。<line-break>しかも首席で卒業すれば、各国から宮廷魔道士<line-break>としてお呼びがかかるのよ。あたしもザギヴ先輩<line-break>やシェスター先輩のように首席卒業を目指すの。<end>どうしてあちこち建物が壊れてるのかって？\u3000<line-break>言っておくけど校舎が古くて壊れたとか<line-break>実験モンスターが暴れたんじゃないからね。<line-break>伝統ある魔道アカデミーの神聖なる学舎を<line-break>ここまで破壊したのはあの娘、アカデミー史上<line-break>最低最悪の問題児、暴走爆弾娘ユーリスよ！<end>"
english = "<select><value:$20>%2This is the venerable Arcane Academy, where young people gather to study and research magic. No one can call oneself a mage without graduating from here. Better yet, graduate at the head of the class and courts across the world will offer you a post as court mage. I intend to graduate at the head of my class, just like Zagiv and Shester before me.<end>You want to know why buildings are damaged all over the academy? Let me make one thing clear: they didn't collapse from age, and no experimental monster went berserk. The one who did all this to the sacred halls of our venerable Arcane Academy was Julls, that out-of-control bomb of a girl and the worst troublemaker in the academy's history!<end>"

["30015"]
japanese = "<select><value:$33>ちょ…ちょっと、魔法について質問されても\u3000<line-break>困りますよ。私もここの学生で魔法を学んで<line-break>いるところなんですから。<line-break>魔道士の格好してるから間違えたって？<line-break>ははは、何事もまずは形からと言うでしょ。<line-break>格好だけは魔道士になってみたんですよ。<end>ちょ…ちょっと、魔法について質問されても\u3000<line-break>困りますよ。私もここの学生で魔法を学んで<line-break>いるところなんですから。<line-break>魔道士の格好してるから間違えたって？<line-break>ははは、何事もまずは形からと言うでしょ。<line-break>格好だけは魔道士になってみたんですよ。<end>私が先生に聞いた話では魔道士系のソウルを<line-break>宿すには探求心Ｓｅａｒｃｈが高くないと<line-break>いけないそうですね。<line-break>でも、それだけじゃだめみたいですよ。<line-break>冷静さＣｏｏｌや信念Ｂｅｌｉｅｆも<line-break>高位の魔道士ソウルには重要みたいです。<end>戦闘後に手に入る精霊力ポイントは、<line-break>倒したモンスターの属性で決まるそうですよ。<line-break>戦う相手も考えなきゃいけませんね。<end>私が先生に聞いた話だと、人によって\u3000\u3000\u3000\u3000<line-break>生まれつき持っている精霊力レベルは違う<line-break>らしいですよ。<line-break>できるだけ精霊力レベルのかたよりをなくせと<line-break>先生はおっしゃってましたが、<line-break>これって大変じゃないですか？<end>火、水、土、風の４属性の上位属性で、<line-break>聖と闇というのがあるそうですよ。<line-break>やっぱり聖属性の攻撃魔法は強いんでしょうね。<end>私が先生に聞いた話だと、この世界のどこかに、<line-break>禁呪が封印されているそうですよ。<line-break>先輩の中には、必死に探している人もいますね。<end>もうすぐ初級課程の卒業試験があるんですよ。<line-break>これに合格すれば、私もほんとうの魔道士に<line-break>なれるわけです、ふふふふ…。<end>"
english = "<select><value:$33>W-wait, don't ask me about magic! I'm only a student here, still learning it myself. You mistook me for a mage because of my clothes? Ha ha, well, they say you have to start with appearances. I decided to look the part first.<end>W-wait, don't ask me about magic! I'm only a student here, still learning it myself. You mistook me for a mage because of my clothes? Ha ha, well, they say you have to start with appearances. I decided to look the part first.<end>My teacher says you need a high degree of curiosity, Ｓｅａｒｃｈ, to embody a mage-type Soul. But apparently that alone isn't enough. Composure, Ｃｏｏｌ, and conviction, Ｂｅｌｉｅｆ, also seem important for higher mage Souls.<end>Apparently, the elemental points you earn after battle depend on the element of the monster you defeated. We'll have to choose our opponents carefully.<end>My teacher says everyone is born with different elemental levels. We were told to keep those levels as balanced as possible, but doesn't that sound difficult?<end>Apparently, Holy and Dark are higher elements than the four basic ones: Fire, Water, Earth, and Wind. Holy-element attack spells must be powerful.<end>My teacher says a Forbidden Spell is sealed somewhere in this world. Some of the senior students are searching desperately for it.<end>The graduation exam for the beginner course is coming soon. If I pass, I'll finally be a real mage. Heh heh heh...<end>"

["30016"]
japanese = "<if><value:$2C><less-equal>%9魔法を使うためには、ウォーロックのソウルを<line-break>宿して、ロースペルが使えるようになりなさい。<line-break>あとは、精霊力レベルを上げるのです。<end><if><value:$2C><less-equal>%29ロースペルやハイスペルは、ひとつの精霊力のみ<line-break>を扱う魔法ですが、ユナイトスペルは火と水、<line-break>土と風のように複数の精霊力を扱います。<line-break>火と水の精霊力を扱う魔法を使うには<line-break>火と水の精霊力レベルが６以上なくては<line-break>ならないので注意してください。<end><if><value:$2C><less-equal>%49闇属性の魔法を使うためには、火、水、土、風、<line-break>４種類の精霊力レベルが、<line-break>２以上なければなりません。<line-break>その上で、ネガヴァニティアのソウルを宿し、<line-break>バニティスペルを使えるようになるのです。<line-break>精霊力レベルが、かたよっていてはダメですよ。<end>火、水、土、風の禁呪は、封印を解くだけでは<line-break>使えません。それぞれの精霊力レベルが９以上で<line-break>ハイスペルが使えなくてはならないのです。<end>"
english = "<if><value:$2C><less-equal>%9To cast magic, embody the Warlock Soul and learn to use Low Spell. Then raise your elemental levels.<end><if><value:$2C><less-equal>%29Low Spell and High Spell each manipulate only one elemental force, whereas Unite Spell combines several, such as Fire and Water or Earth and Wind. To cast a spell that uses both Fire and Water, your levels in both elements must be at least 6. Remember that.<end><if><value:$2C><less-equal>%49To cast Dark-element magic, your levels in all four elements―Fire, Water, Earth, and Wind―must be at least 2. You must then embody the Negavannitia Soul and learn to use Vanity Spell. Your elemental levels must not be unbalanced.<end>Merely breaking the seals on the Fire, Water, Earth, and Wind Forbidden Spells is not enough to use them. You must be able to use High Spell, and your level in the corresponding element must be at least 9.<end>"

["30017"]
japanese = "<select><value:$20>%2武器や防具に精霊の力を宿すエンチャント魔法は<line-break>ルーンファイターのソウルを宿した者だけが<line-break>使えるそうです。<end>魔法を使うとＭＰを消費するのはご存知ですね。<line-break>ＭＰが０になると気絶してしまうので、<line-break>魔法の使いすぎには注意してくださいね。<end>"
english = "<select><value:$20>%2They say Enchant magic, which imbues weapons and armor with elemental power, can be used only by someone embodying the Rune Fighter Soul.<end>You know that casting magic consumes ＭＰ. If your ＭＰ falls to 0, you will lose consciousness, so be careful not to overuse magic.<end>"

["30018"]
japanese = "<select><value:$20>%2魔法の講義って属性の話ばかりで<line-break>す～ぐ眠くなっちゃうの。<line-break>火が水に強くて、水が土に強くて…。<end>属性は火、水、土、風の４属性以外にも聖と闇の<line-break>２属性があるの。どちらも火、水、土、風より<line-break>強い属性で聖と闇では聖属性のほうが強いのよ。<end>"
english = "<select><value:$20>%2Magic lectures are nothing but talk about elements. They put me to sleep in no time. Fire is strong against Water, Water is strong against Earth...<end>Besides the four elements of Fire, Water, Earth, and Wind, there are also Holy and Dark. Both are stronger than the basic four, and Holy is stronger than Dark.<end>"

["30019"]
japanese = "<select><value:$20>%4そこのお若いの、ここディンガル\u3000\u3000<line-break>魔道アカデミーの創始者マノン道師を<line-break>ご存知かな？<line-break>精霊力の行使法を現在のような<line-break>学問の形へ一般化したのが<line-break>何を隠そうマノン道師なんじゃよ。<end>マノン道師は９世紀末の人でな。天才魔道士と<line-break>呼ばれ、メガ・ディンガル帝の側近として<line-break>活躍したそうじゃ。<line-break>彼女が後進の育成のために創設したのが、<line-break>ここディンガル魔道アカデミーなんじゃよ。<line-break>ババの話も少しは役に立つじゃろうが？<end>メガ・ディンガル帝の死後、マノン道師は<line-break>魔道の塔にこもり、精霊力とソウルの関係を<line-break>研究することに生涯の後半を捧げたそうじゃ。<line-break>そのためか老いることもなく、いつまでも<line-break>少女のように若々しかったということじゃ。<line-break>ほんに、うらやましいことじゃてのう。<end>あんた、魔道の塔に登ったことはあるのかい？<line-break>もし、登っている途中で暖炉を見つけたなら<line-break>調べてみなされ。ババの知恵袋じゃて。<end>"
english = "<select><value:$20>%4Young one, do you know of Master Manon, founder of the Dyneskal Arcane Academy? It was none other than Master Manon who turned the use of elemental forces into the formal discipline we know today.<end>Master Manon lived in the late ninth century. She was called a genius mage and served as a close adviser to Emperor Mega Dyneskal. She founded the Dyneskal Arcane Academy to train those who came after her. See? This old woman's stories can be useful.<end>After Emperor Mega Dyneskal died, Master Manon secluded herself in the Arcane Tower and devoted the latter half of her life to studying the relationship between elemental forces and Souls. Perhaps that was why she never aged and remained as young as a girl. How enviable.<end>Have you ever climbed the Arcane Tower? If you find a fireplace on your way up, take a close look at it. A little wisdom from an old woman.<end>"

["30020"]
japanese = "<select><value:$20>%3ここは天空神ノトゥーンの神殿です。<line-break>ノトゥーンは最高神として万物の上に存在し、<line-break>すべてを統括する神々の長なのです。<end>ノトゥーン神殿の総本山はアルノートゥンです。<line-break>１度お参りに行かれてはどうでしょうか？<line-break>あそこなら神を身近に感じることができますよ。<end>テラネの東に霊峰トールがあります。<line-break>ノトゥーンを信じる者なら、一生に一度は<line-break>巡礼しなくてはならない聖地ですよ。<end>"
english = "<select><value:$20>%3This is a temple of Notun, the Sky God. As the supreme god, Notun stands above all creation and is chief of the gods, governing all things.<end>The chief sanctuary of Notun Temple is in Alnortun. Why not make a pilgrimage there someday? You can feel close to the divine there.<end>Sacred Mount Thor lies east of Terane. It is a holy place where all followers of Notun must make a pilgrimage at least once in their lives.<end>"

["30021"]
japanese = "<select><value:$20>%2天井のステンドグラスが自慢だった<line-break>のですが、竜王の覚醒が原因と噂される<line-break>例の大地震で壊れてしまいました。<end>天井のステンドグラスを修理できる\u3000\u3000\u3000\u3000<line-break>職人を探してみたのですが、残念なことに<line-break>ディンガルにはいませんでした。<line-break>修理するには、かなりの技術を必要とする<line-break>らしくて、ドワーフ王国にでも行って捜して<line-break>みるしかないようです。<end>"
english = "<select><value:$20>%2The stained glass in the ceiling used to be a point of pride, but it was damaged in that great earthquake―the one rumored to have been caused by the Dragon King's Awakening.<end>Unfortunately, the search for an artisan who could repair the stained glass turned up no one in Dyneskal. Apparently, the work requires considerable skill, so it seems the only option is to go looking in the Dwarf Kingdom.<end>"

["30022"]
japanese = "<select><value:$33>特に話すことはありません。<end>うひゃー、本当に壊れてるね。\u3000\u3000\u3000\u3000<line-break>ノトゥーン神殿のステンドグラスは<line-break>観光名所として有名だったんだよ。<line-break>君もせっかく来たのに残念だったねえ。<line-break>せっかくだから、天空神に旅の安全でも<line-break>お祈りしていくといいよ。<end>みんな、多かれ少なかれ<line-break>心のどこかで、勇者ネメアこそ<line-break>皇帝にふさわしいと思っていたんだよ。\u3000\u3000\u3000<line-break>エリュマルク帝もそれに気づいていたから、<line-break>嫉妬して、無茶な命令をしていたんだろうね。<line-break>それを考えると、彼もかわいそうな人だよ。<end>祝ロセン陥落！\u3000これで東方の脅威は<line-break>なくなったわけだ。ロセンの人もペウダから<line-break>解放されて喜んでいるんじゃないのかい？<end>さすがは名将アンギルダン将軍だよ。<line-break>分断の山脈を越えてロストールに攻め込む<line-break>なんて無茶なやり方、普通は思いつかないよな。<line-break>海路からの攻撃しかないと思っていた<line-break>ロストールの連中は、何が起きたかさえ<line-break>わからないうちにやられたんだろうね。<end>リベルダムがカルラ将軍に破壊されたってね。<line-break>あそこは、今まで誰も占領することの<line-break>できなかった難攻不落の都市だったんだぜ。<line-break>それが、こうも簡単に占領できるなんて、<line-break>ノトゥーンの正義がディンガルにあるとしか<line-break>考えられないじゃないか！<end>カルラ将軍がロストール攻略を開始するんだと。<line-break>竜王なんて化け物を信仰するような国なんて、<line-break>ノトゥーンに守られた我が国の敵じゃないね。<end>ネメア様が死んだなんて…。<line-break>エルファス様の予言は正しかったんだ。<line-break>俺も真の神に祈りを捧げなくては…。<end>"
english = "<select><value:$33>I have nothing in particular to say.<end>Whoa, it really is shattered. The stained glass at Notun Temple was a famous attraction, too. It's a shame, after you came all this way. Since you're here, you may as well pray to the Sky God for a safe journey.<end>Deep down, nearly everyone thought Nemea the Hero was the one truly fit to be emperor. Emperor Erymalc must have realized that. He was jealous, and that's probably why he gave such reckless orders. When you think of it that way, he was rather pitiable himself.<end>Rocen has fallen! A cause for celebration! That puts an end to the threat from the east. The people of Rocen must be glad to be free of Peuda, don't you think?<end>That's General Angeerdan for you―a brilliant commander. No one else would even think of anything as reckless as crossing the Dividing Mountains to invade Rostorl. The people of Rostorl expected an attack by sea, so they were probably beaten before they even knew what was happening.<end>I hear General Karula destroyed Liberdam. No one had ever managed to capture that impregnable city before. If Dyneskal could occupy it so easily, surely that can only mean Notun's justice is with Dyneskal!<end>I hear General Karula is beginning the Rostorl Campaign. A country that worships a monster like the Dragon King is no match for our nation under Notun's protection.<end>Lord Nemea, dead... Lord Elfas's prophecy was true. I, too, must offer my prayers to the true god...<end>"

["30023"]
japanese = "<if><value:$2C><less-equal>%9お前、よそ者で駆け出しの冒険者だな。<line-break>親切な先輩としてありがたい助言を与えてやる。<line-break>スラムの先の荒れ果てた城には近づくなよ。<line-break>あそこは魔王バロルの居城だった所だ。<line-break>魔王が勇者に倒された今でも、邪悪な鬼気が<line-break>城中にただよっていて危険なんだからよ。<end><if><value:$2C><less-equal>%29親切な先輩から助言を与えてやろう。\u3000<line-break>スラムの右奥には塔がある。<line-break>それが魔道の塔だ。<line-break>塔の中には古代の魔道士が使っていた<line-break>アクセサリーが眠っているという。<line-break>罠の解除が得意なら行ってみるといい。<end>魔道の塔にはマノンとかいう魔道士が<line-break>造った化け物がいるらしいぞ。そいつを<line-break>倒すと強力な魔法がおぼえられるそうだ。<end>"
english = "<if><value:$2C><less-equal>%9You're an outsider, and a novice adventurer at that. Here's some friendly advice from someone with more experience: stay away from the ruined castle beyond the Slums. It was once the stronghold of Balor, Demon King. Even though the Demon King was slain by the Hero, an evil presence still hangs over the entire castle. It's dangerous.<end><if><value:$2C><less-equal>%29Here's some more friendly advice from an experienced adventurer. At the far right of the Slums stands a tower called the Arcane Tower. They say it holds accessories once used by ancient mages. If you're good at disarming traps, you might want to take a look.<end>They say there's a monster in the Arcane Tower made by some mage called Manon. Supposedly, defeating it lets you learn powerful magic.<end>"

["30024"]
japanese = "<select><value:$20>%3ここはスラムだよ。用がないなら厄介な事件に<line-break>巻き込まれる前に帰ったほうがいいと思うよ。<line-break>ぼくは闇社会の情報収集のために来たのさ。<end>宝箱に仕掛けられた罠は、<line-break>ディテクターのスキルなしでは解除できないよ。<line-break>宝箱を開けたければ習得しないとね。<end>宝箱の罠をうまく解除するには君自身の冷静さと<line-break>集中力が重要だよ。そして失敗を恐れずに数多く<line-break>罠解除をこなして経験を積むことさ。<end>"
english = "<select><value:$20>%3These are the Slums. If you have no business here, you'd be better off leaving before you get caught up in trouble. I came to gather information on the underworld.<end>You can't disarm traps on treasure chests without the Detector skill. If you want to open them, you'll have to learn it.<end>To disarm a chest's trap successfully, you need to stay calm and focused. You also need experience, so don't be afraid of failure. Keep disarming as many traps as you can.<end>"

["30025"]
japanese = "<select><value:$33>ふん、貧乏が悪いのさ。<end>ディンガル建国のために大活躍した名将\u3000\u3000\u3000\u3000<line-break>アンギルダンも、皇帝に逆らった罪で賞金首。<line-break>支配者ってのは勝手なもんだね。<line-break>あんた、アンギルダンの首を狙うつもりなら考え<line-break>直した方がいいぜ。運よくアンギルダンを殺せて<line-break>も、彼を慕う人間すべてを敵に回すからな。<end>スラムには、表の世界で生きられない犯罪者や<line-break>無法者たちも住んでいるんだ。<line-break>やつらの情報が役に立つこともあると思うぜ。<end>ロセンってのは王様が無法者だったからよ、<line-break>町全体がスラムみたいなもんさ。<line-break>これからどう変わっていくのか楽しみだぜ<end>ロストール、リベルダムそしてエンシャント。<line-break>どこの大都市にもスラムはあるもんだ。金持ちが<line-break>いれば、その倍は貧しい人がいるからな。<end>リベルダムの商人どもは大あわてだろうな。<line-break>自分たちの都市が、一夜にしてガレキの山に<line-break>なっちまったんだから。へへ…いい気味だぜ。<end>カルラがロストール攻略を開始するようだぜ。\u3000<line-break>天下のロストールもリベルダムみたいに<line-break>ガレキの山にされちまうのかね。<line-break>リベルダムがなくなったおかげで、<line-break>カルラの支配地ロセンはずいぶん活気があるん<line-break>だってよ。計画通りなのかもな、へへへ…。<end>ネメアが死んだんだってな。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>これでディンガルも、一波乱ありそうだぜ。<line-break>ディンガルの将軍どもは仲が悪いしよ。<line-break>しょせん、ネメアっていう柱に支えられた<line-break>国だからよ、柱が倒れりゃ簡単に崩れちまう。<line-break>へへへっ…あんたも巻き込まれないようにな。<end>"
english = "<select><value:$33>Hmph. It's poverty that's to blame.<end>Even General Angeerdan, who did so much to found Dyneskal, has a price on his head for defying the emperor. Rulers do as they please. If you're thinking of claiming Angeerdan's head, you'd better reconsider. Even if you're lucky enough to kill him, you'll make an enemy of everyone devoted to him.<end>The Slums are also home to criminals and outlaws who can't live in respectable society. Some of what they know might prove useful.<end>Rocen's king was an outlaw, so the whole city was practically one big slum. I'm looking forward to seeing how it changes now.<end>Rostorl, Liberdam, Ancient. Every major city has its slums. Wherever there are rich people, there are twice as many poor ones.<end>Liberdam's merchants must be in a panic. Their city turned into a pile of rubble overnight. Heh... serves them right.<end>Sounds like Karula is beginning the Rostorl Campaign. Think mighty Rostorl will end up a pile of rubble like Liberdam? With Liberdam gone, I hear Rocen, Karula's territory, is thriving. Maybe that was the plan all along. Heh heh heh...<end>So Nemea's dead. Dyneskal's in for some trouble now. Its generals can't stand one another, and the whole country was propped up by Nemea. Once that pillar falls, the rest will come down easily enough. Heh heh... mind you don't get caught in it.<end>"

["30026"]
japanese = "<if><value:$2C><less-equal>%9俺のような強い戦士になりたければ<line-break>まずグロウファイターのソウルを宿すことだ。<line-break>勇敢さＢｒａｖｅがあるならいずれ宿るだろう。<end><if><value:$2C><less-equal>%29野生Ｗｉｌｄが高いと獣系のソウルが宿る。\u3000\u3000<line-break>獣のソウルには相手の攻撃に反応する<line-break>カウンター系のスキルがあるのだ。<line-break>無敵の戦士になりたいならルナカウンターと<line-break>ソルカウンターを習得することをすすめておく。<line-break>相手の数が多いときに役立つだろう。<end><if><value:$2C><less-equal>%49武器に特殊効果を付けるのなら、<line-break>石化をおすすめする。<line-break>石にしてしまえば、倒したも同然だからな。<end>この世には、火、水、土、風の属性を持った<line-break>強力な武器が存在するという。手に入れる<line-break>ことができれば、心強い味方になるだろう。<end>"
english = "<if><value:$2C><less-equal>%9If you want to become a strong warrior like me, first you must gain the Grow Fighter Soul. If you possess enough Ｂｒａｖｅ, it will come to you in time.<end><if><value:$2C><less-equal>%29A high Ｗｉｌｄ value will grant you a beast-type Soul. Beast Souls have counter skills that trigger in response to an enemy's attack. If you want to become an invincible warrior, I recommend learning Luna Counter and Sol Counter. They should prove useful when you're outnumbered.<end><if><value:$2C><less-equal>%49If you're giving a weapon a special effect, I recommend petrification. Turn an enemy to stone, and that enemy is as good as defeated.<end>They say powerful weapons imbued with fire, water, earth, or wind exist in this world. If you can obtain one, it will serve you well.<end>"

["30027"]
japanese = "<select><value:$33>今は旅立ちの時だろ、ここにいるのは変だぞ。<end>この間の大地震は竜王の覚醒が原因だってな。<line-break>おかげで竜王の島近海を航行するたびに、竜王が<line-break>襲ってくるんじゃないかとドキドキするんだ。<line-break>エルズ近海で海王を見たって話も聞くし、<line-break>そのうちラミリー山に住むっていう翔王が<line-break>世界中を飛び回るんじゃないのか。<end>ネメア帝が発表した幕僚の面々は知ってるか？\u3000<line-break>宰相は前皇帝の時と同じくベルゼーヴァ、<line-break>玄武将軍に魔道アカデミー首席卒業のザギヴ、<line-break>青竜将軍に若干１６歳の少女カルラ、<line-break>朱雀将軍に歴戦の勇将アンギルダン、<line-break>白虎将軍にコーンスの魔道士ジラークだとよ。<end>ロセンの港が解放されたってな。<line-break>これでロセン、リベルダム、エンシャントの<line-break>三角貿易が復活するわけだ。忙しくなるぞ。<end>いやー分断の山脈を越えてロストール領に<line-break>攻め込むとはアンギルダン将軍も見事に<line-break>裏切ってくれたよな。<line-break>海路で攻め込むとばかり思っていたから<line-break>リベルダムの商人の中には軍船を大量に<line-break>用意した者もいるんだぜ。<end>ロセンが解放されて、せっかく活気が出てきた<line-break>のに、リベルダムがなくなっちまうとはな。<line-break>カルラって娘は何を考えてるのかね。<end>リベルダムを破壊した迷惑娘カルラが、<line-break>ロストール攻略を開始するんだってな。<line-break>兵力で劣るゼネテスの出方が楽しみだぜ。<end>ネメアが死んだってんで、世界中が大騒ぎさ。<line-break>だが、俺のつかんだ情報だとネメア死すの噂は<line-break>ゼネテスの流したデマなんだそうだ。<end>"
english = "<select><value:$33>Shouldn't you be setting out about now? It's strange to find you still here.<end>They say the recent earthquake was caused by the Dragon King's Awakening. Now every time I sail near the Dragon King's Isle, my heart pounds at the thought that it might attack. I've also heard the Sea King was sighted off Elz. At this rate, the Soaring King said to live on Mount Ramiri will soon be flying all over the world.<end>Have you heard who Emperor Nemea appointed to his staff? Beelzeva remains Chancellor, just as under the previous emperor. Zagiv, top graduate of the Arcane Academy, is Black Tortoise General; Karula, a girl of only sixteen, is Azure Dragon General; the battle-hardened Angeerdan is Vermilion Bird General; and Zsilak, a mage from Korns, is White Tiger General.<end>I hear Rocen's port has been liberated. That means the triangular trade between Rocen, Liberdam, and Ancient can begin again. We're going to be busy.<end>Well, General Angeerdan certainly pulled one over on us by crossing the Dividing Mountains and invading Rostorl territory. We were so sure the attack would come by sea that some Liberdam merchants had prepared large numbers of warships.<end>Rocen had finally begun to thrive again after being liberated, and now Liberdam is gone. What is that girl Karula thinking?<end>Karula, the troublesome girl who destroyed Liberdam, is beginning the Rostorl Campaign. I'm curious to see what Xenetes does with fewer troops.<end>The whole world's in an uproar over Nemea's death. But according to my information, the story that Nemea died is a lie spread by Xenetes.<end>"

["30028"]
japanese = "<if><value:$33><less-equal>2ライラネート神殿の先にある墓場には\u3000\u3000\u3000<line-break>行ったかい？<line-break>あそこには…、出るんだ。出るんだよ～！！<line-break>ものすごくきれいな女の人さ。<line-break>あれは幽霊なんかじゃないね。<line-break>ああ、今日も墓場に行ってみようかな。<end><select><value:$20>%2港はごちゃごちゃしてるから道に迷うなよ。<line-break>向こうのほうに城壁と見張り塔が見えるだろ。<line-break>あっちの方へ行けば大通りに行けるぜ。<line-break>もしかして愛の女神ライラネートの神殿に<line-break>行きたいのなら、階段を昇って倉庫の間を<line-break>抜ければいい。立派な神殿が建っているぜ。<end>大陸の西方は未開の地だから、冒険するには\u3000<line-break>いいんじゃないのか。誰も知らない宝や、<line-break>隠された古代の迷宮とかあるかもしれないぞ。<end>"
english = "<if><value:$33><less-equal>2Have you been to the graveyard beyond Lailanate Temple? Something appears there... It does, I tell you! An incredibly beautiful woman. She's no ghost, that's for sure. Ah, perhaps I'll visit the graveyard again today.<end><select><value:$20>%2The harbor's a maze, so don't get lost. See the city wall and watchtower over there? Head that way and you'll reach the main street. If you're looking for the temple of Lailanate, Goddess of Love, climb the stairs and pass between the warehouses. You'll find a magnificent temple there.<end>The western part of the continent is still unexplored, so it should be good territory for an adventure. There might be unknown treasures or hidden ancient labyrinths out there.<end>"

["30029"]
japanese = "<select><value:$20>%2ここは愛の女神ライラネートの神殿です。<line-break>愛のもたらす喜びも悲しみも、すべては<line-break>ライラネートのお導きなのですよ。<end>他人のために祈ること、それは愛なのです。<line-break>善き愛であればライラネートは必ずやかなえて<line-break>くださいます。あなたに愛はありますか？<end>"
english = "<select><value:$20>%2This is the temple of Lailanate, Goddess of Love. Both the joy and the sorrow that love brings come by Lailanate's guidance.<end>To pray for another is an act of love. If that love is good and true, Lailanate will surely grant your prayer. Is there love within you?<end>"

["30030"]
japanese = "<select><value:$20>%2愛は生きとし生けるものをいやし守る力です。<line-break>愛がもたらす悲しみも苦しみも、ライラネートが<line-break>いずれいやしてくださいます。<end>愛する人との別れ…生きていく上でこれ以上の<line-break>苦しみがあるでしょうか？\u3000ましてやそれが<line-break>永遠の別れであればなおさらです。<line-break>わたくしは、ライラネートに仕える巫女に<line-break>なることで、その苦しみをいやされました。<line-break>あなたの悲しみもいやされますように…。<end>"
english = "<select><value:$20>%2Love is the power that heals and protects all living things. In time, Lailanate will heal even the sorrow and suffering that love brings.<end>Parting from one you love... Is there any greater pain in life? All the more so when that parting is forever. Becoming a priestess in Lailanate's service healed that pain. May your sorrow be healed as well...<end>"

["30031"]
japanese = "<select><value:$33>女神ライラネートよ、私の息子が軍隊に<line-break>入りました。貧しい我が家のため私に内緒で<line-break>入隊したのです。息子をどうかお守りください。<end>女神ライラネートよ、愛する息子が軍隊に<line-break>入りました。貧しい我が家のため私に内緒で<line-break>入隊したのです。息子をどうかお守りください。<end>女神ライラネートよ、息子から手紙とお金が<line-break>届きました。息子は家族のために少ない給料の<line-break>中から半分以上も送ってくれたのです…。<line-break>息子は新しく青竜将軍に任命されたカルラ様の<line-break>下で戦うことになったそうです。どうか息子に<line-break>戦神ソリアスの加護をお与えください。<end>女神ライラネートよ、息子が所属している<line-break>東方攻略軍がロセンを攻め落としたそうです。\u3000<line-break>でも、息子からは何の連絡もありません…。<line-break>どうか、息子の身に何も起きていませんように、<line-break>そして息子が無事に帰って来ますように、<line-break>女神様どうかお願いします…。<end>女神ライラネートよ、息子からやっと手紙が<line-break>届きました。息子はロセン攻めの際、矢傷を<line-break>負ったそうですが、軽傷ですんだとのこと。<line-break>これもライラネート様とソリアス様の<line-break>ご加護だと感謝しております。<line-break>どうか今後も息子をお守りください…。<end>女神ライラネートよ、息子の犯した罪をお許し<line-break>ください。息子はカルラ将軍の命令とはいえ<line-break>リベルダムを破壊し、罪なき人を苦しめました。<line-break>息子に対する罰は私が受けますので、<line-break>どうか今まで通り息子をお守りください。<line-break>息子が無事に帰ってくるようお願いします…。<end>女神ライラネートよ、息子が戦うロストールの<line-break>司令官は、アンギルダン将軍を破ったゼネテス<line-break>だと聞きました。<line-break>どうか息子が、無事に帰って来ますように、<line-break>ゼネテスの卑劣な罠で、命を落とすことの<line-break>ないようにお願いします…。<end>ああ…なんということでしょう…\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ネメア陛下が崩御されたなんて…。<line-break>女神ライラネートよ、教えてください。<line-break>敵地にいる私の息子は無事でしょうか、<line-break>ネメア様の死を知って勢いづいたロストール軍に<line-break>攻められていないでしょうか…。<end>"
english = "<select><value:$33>O Goddess Lailanate, my son has joined the army. He enlisted without telling me, for the sake of our impoverished family. Please protect my son.<end>O Goddess Lailanate, my beloved son has joined the army. He enlisted without telling me, for the sake of our impoverished family. Please protect my son.<end>O Goddess Lailanate, a letter and money have arrived from my son. From his meager pay, he sent more than half home to his family... He says he will be fighting under Lady Karula, the newly appointed Azure Dragon General. Please grant my son the protection of the War God Solias.<end>O Goddess Lailanate, I hear the Eastern Campaign Army, in which my son serves, has captured Rocen. But I have heard nothing from him... Please, let no harm have come to him. Let him return home safely. Goddess, I beg you...<end>O Goddess Lailanate, at last a letter has come from my son. He was struck by an arrow during the attack on Rocen, but says the wound was only slight. I give thanks for the protection of Lailanate and Solias. Please continue to watch over my son...<end>O Goddess Lailanate, forgive my son's sin. Though he acted on General Karula's orders, he destroyed Liberdam and brought suffering upon innocent people. I will accept his punishment in his place, so please continue to protect him as you always have. Let my son return home safely...<end>O Goddess Lailanate, I hear the commander of Rostorl, where my son is fighting, is Xenetes, the one who defeated General Angeerdan. Please let my son return safely. Do not let him lose his life to one of Xenetes's treacherous traps...<end>Oh... how can this be? His Majesty Nemea is dead... Goddess Lailanate, tell me: is my son safe in enemy territory? Has the Rostorl army, emboldened by Lord Nemea's death, attacked him...?<end>"

["30032"]
japanese = "<select><value:$33>リベルダムの商人は守銭奴じゃ！<end>リベルダムのアンティノもロティもロセン王に<line-break>戦闘用モンスターと武器を売りつけて、<line-break>しこたま、もうけやがってからに。<line-break>奴らのもうけた金は、ロセン王が国民から<line-break>しぼりとった税金ですぞ。女神ライラネートの<line-break>名においてうらやましいが許せんです、ハイ。<end>リベルダムの大富豪フゴーさんには、<line-break>私もお世話になっております。<line-break>あの方のご先祖様は有名な義賊だそうですよ。<end>ロセンが解放されたので忙しくなりますぞ。\u3000<line-break>東方国家群一の都市といわれたロセンも<line-break>愚王ペウダのせいで荒れ果てていますからな。<line-break>それを復興させるのが我々商人の仕事です。<line-break>見ていてください、ロセンをリベルダム以上の<line-break>商業都市にしてみせますぞ。<end>ロセンで解放軍と名乗る者たちのテロが\u3000\u3000\u3000\u3000<line-break>続発していましてな、なんでもロセン王家の<line-break>復興を目指しているとかで。<line-break>奴らにも言い分があるでしょうが、我々も<line-break>ロセンのためを思って復興に参加しておる<line-break>のです。奴らに負けるわけにはいかんのです。<end>ああっ女神様！<line-break>自由都市リベルダムが破壊されてしまうなんて。<line-break>私は、これからどうすればいいのでしょうか…。<end>今ではロセンが商人の町になってしまいました。<line-break>私も復興活動に投資していたので、ずいぶんと<line-break>もうけさせてもらいました。<line-break>カルラ様によって解放軍も壊滅したと聞きますし<line-break>万事安泰と言いたいのですが、リベルダム破壊も<line-break>含めて、カルラ様に都合がよすぎて不気味です。<end>今、この瞬間もこの大陸のどこかで戦いが<line-break>起こっております。<line-break>世間ではネメア死すの噂で持ちきりというのに。<line-break>彼らは、いったい何のために戦おうと<line-break>いうのですかな。<end>"
english = "<select><value:$33>Liberdam's merchants are all misers!<end>Antino and Lottie of Liberdam made a fortune selling combat monsters and weapons to the king of Rocen. And every coin they earned came from taxes that king squeezed out of his people! In the name of the Goddess Lailanate, I envy them, but I cannot forgive them. No, sir!<end>I, too, owe much to Hugo, the great magnate of Liberdam. I hear his ancestor was a famous noble thief.<end>With Rocen liberated, we shall be busy. It was once called the greatest city among the eastern nations, but the foolish King Peuda left it in ruins. Rebuilding it is our duty as merchants. Just watch: we shall make Rocen a greater center of commerce than Liberdam.<end>There has been a wave of terrorist attacks in Rocen by people calling themselves the Liberation Army. Apparently, they seek to restore Rocen's royal house. They may have their reasons, but we merchants joined the rebuilding effort because we, too, care about Rocen. We cannot afford to lose to them.<end>Oh, Goddess! The Free City Liberdam has been destroyed. What am I to do now...?<end>Rocen has become a city of merchants now. I invested in the reconstruction and made a considerable profit myself. I hear Lady Karula has crushed the Liberation Army as well, so I would like to say all is secure. But when I consider Liberdam's destruction too, it all seems to have worked out far too conveniently for Lady Karula. That makes me uneasy.<end>Even at this very moment, battles are being fought somewhere on this continent, while everyone is preoccupied with rumors of Nemea's death. What can they possibly be fighting for?<end>"

