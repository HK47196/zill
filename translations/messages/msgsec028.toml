["280161"]
japanese = "<select><value:$20>%3お前もナッジも孤児だ。<line-break>だからまあ、気に入らないことも<line-break>多いんだろう。<line-break>お前たちが厄介なことをするのも<line-break>お前たちが悪いんじゃない。<line-break>うんうん、私にはわかってるよ。<end>お前もナッジも孤児だ。<line-break>だからまあ、気に入らないことも\u3000\u3000<line-break>多いんだろう。<line-break>しかも、ナッジときた日には、<line-break>人間じゃない、コーンスだ。<line-break>素直になれんのも仕方ないか。<end>しょうがないのかもしれんが、<line-break>そんなに神官様や宿屋のご亭主に<line-break>反発しなくてもいいんじゃないかね？<line-break>奥に住んでるボンガ夫婦にしか<line-break>心を開かないんじゃ、<line-break>よくないよ。<end>"
english = "<select><value:$20>%3You and Nadge are both orphans. I suppose there must be plenty you're unhappy about. It isn't your fault that the two of you keep causing trouble. Yes, yes, I understand.<end>You and Nadge are both orphans. I suppose there must be plenty you're unhappy about. And Nadge isn't even human―he's Korns. I suppose it's only natural that he can't be more open about things.<end>Maybe it can't be helped, but do you really need to defy the priest and the innkeeper at every turn? It isn't good to shut everyone out except Bonga and his wife, off at the far end of town.<end>"

["280162"]
japanese = "<select><value:$20>%4教会で食い物をくすねてたの、<line-break>神官様はあんたらだって言ってたけど、<line-break>あれ、ピクシーの仕業だったんだろ？<line-break>あたしゃ知ってるよ。<line-break>あんたらがそのピクシーを<line-break>街から追い出してくれたってことをさ。<end>教会で食い物をくすねてたの、<line-break>神官様はあんたらだって言ってたけど、\u3000<line-break>あれ、ピクシーの仕業だったんだろ？<line-break>なんで、ちゃんと言いわけしないかねえ。<line-break>そんなんだから、<line-break>厄介者あつかいされるのさ。<end>あたしゃ知ってるよ。<line-break>あんたはちゃんとした子だって。<line-break>ちゃんと街で暮らせばいいのに。\u3000\u3000<line-break>一緒にいるコーンスの子は<line-break>ムリかもしれないけど、<line-break>あんたはちゃんとした人間なんだし。<end>あたしゃ知ってるよ。<line-break>宿屋で女魔道士の着替えのぞいてたの\u3000\u3000<line-break>あんたらじゃないんだろ？<line-break>なんで、ちゃんと言いわけしないかねえ。<line-break>そんなんだから、<line-break>厄介者あつかいされるのさ。<end>"
english = "<select><value:$20>%4The priest said you lot were stealing food from the church, but it was that Pixie, wasn't it? I know what really happened. You chased the Pixie out of town for us.<end>The priest said you lot were stealing food from the church, but it was that Pixie, wasn't it? Why didn't you just explain yourselves properly? No wonder everyone treats you like troublemakers.<end>I know you're a good kid. You ought to settle down and live here properly. The Korns child with you might not be able to, but you're a proper human being.<end>I know it wasn't you lot peeping at the sorceress while she was changing at the inn. Why didn't you just explain yourselves properly? No wonder everyone treats you like troublemakers.<end>"

["280163"]
japanese = "<select><value:$20>%3ねえねえ、知ってる？<line-break>おかしなかっこうした<line-break>冒険者がこのテラネに来てさ。\u3000<line-break>俺様は未来の勇者だとか言って。<line-break>なんか目つきが恐いのよ。<line-break>いやねえ、ああいう手合いは。<end>ねえねえ、知ってる？<line-break>昨日の地震のこと、<line-break>いやー、びっくりしたわねえ！\u3000<line-break>大きな獣のほえ声みたいでさ！<line-break>この大陸中が震えたって言うよ！<line-break>すごいわねえ。<end>悪ガキ３人組の残りふたりなら、<line-break>街の奥のボンガの家の方に行ったわよ。<line-break>こっちじゃ、逆方向よ。<end>"
english = "<select><value:$20>%3Hey, have you heard? Some adventurer in a ridiculous outfit has come to Terane, going around calling himself a future hero. There's something frightening about the look in his eyes. I can't stand that sort.<end>Hey, have you heard about yesterday's earthquake? Oh, it gave me such a fright! It sounded like some enormous beast roaring! They say the whole continent shook. Can you imagine?<end>If you're looking for the other two in that trio of little troublemakers, they went toward Bonga's house at the far end of town. You're going the wrong way.<end>"

["280164"]
japanese = "ちっ、ヒヨッコ冒険者とのケンカか！<line-break>また、やっかいをしてのけたな。<line-break><value:$28>よ。<line-break>…ったく、また、宿屋のオヤジに、<line-break>冒険者に武器を売るからだとか<line-break>怒鳴られちまうぜ。<end>"
english = "Tch! A fight with some greenhorn adventurer? You've gone and caused trouble again, <value:$28>. Damn it, now the innkeeper's going to start shouting at me again for selling weapons to adventurers.<end>"

["280165"]
japanese = "<select><value:$20>%3…どんな意味においても、<line-break>気にかけてくれる人や<line-break>帰るべき家があるということは幸せだ。<line-break>わかったようなことを言う<line-break>大人は気に入らないという目だな、<line-break>少年。<end>昨日の大地震が<line-break>私の見当どおりのものだとすれば、<line-break>今日、運命が動き出す者がいるはずだ。<line-break>大人はいつもわかったようなことを言う<line-break>…そう言いたげな顔だな、<line-break>少年。<end>この町の宿屋の亭主が言うように<line-break>私たち冒険者は<line-break>しょせんは根なし草かもしれんな。<end>"
english = "<select><value:$20>%3By any measure, it's a blessing to have someone who cares about you and a home to return to. You have the look of a boy who doesn't care for adults talking as though they know everything.<end>If yesterday's great earthquake was what I suspect, then someone's destiny should be set in motion today. Adults always talk as though they know everything... That's what your face says, boy.<end>Perhaps the innkeeper in this town is right. In the end, we adventurers may be nothing more than rootless wanderers.<end>"

["280166"]
japanese = "ケンカか…。<end>"
english = "A fight, eh...<end>"

["280167"]
