english = "...So you're friends with the idiot son from that inn, are you? Tell that Van boy not to peek while I'm changing!<end>"

["280168"]
japanese = "宿屋のあの子が<line-break>冒険者に<line-break>ケガをさせられたんですってね。\u3000<line-break>ひどい目にあったわね。<line-break>冒険者が<line-break>あんな人ばかりだと思わないでね。<end>"
english = "I heard the boy from the inn was injured by an adventurer. That must have been awful. Please don't think all adventurers are like that.<end>"

["280169"]
japanese = "おいおい、またもめ事かよ！<line-break>しかも、今度は相手が冒険者だって？<line-break>かんべんしてくれよ！<line-break>これで、また<line-break>宿屋のおやじさんや神官様の<line-break>ギルドへの風当たりが強くなる！<end>"
