english = "<select><value:$20>%3Eek! Sorry! I'm sorry! I won't peep again! So please, keep this between us...!<end>Hey, youngster! Don't push yourself too hard! No point dying before you've made a name for yourself! W-wait, you're the one from before! H-heh... Thanks for keeping quiet about it.<end>D-don't glare at me...<end>"

