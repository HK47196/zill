ful... But who were they?<end><if><value:$01><equal>24Next time... without fail...<end><if><value:$01><equal>25Are you okay? That was awful. Who was that back there?<end><if><value:$01><equal>192Let us return, then.<end><if><value:$01><equal>193Still, those people... What in the world were they?<end><if><value:$01><equal>194I will make them pay for hurting <value:$28>.<end><if><value:$01><equal>191Oh, what was that about?! Next time I see them, I'll pay them back a hundredfold!<end><if><value:$01><equal>190Damn, they gave us a beating. Who the hell were they? Someday, I'll settle this score!<end>Ugh! Those people were awful. Next time we meet, I won't let them off!<end>"

