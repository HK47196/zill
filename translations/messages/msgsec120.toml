["1200000"]
japanese = "ケリュネイア\u3000Ｖ３\u3000開始<end>"
english = ""

["1200001"]
japanese = "父さん、魔王バロルを倒したのは<line-break>なんのためだったの？<line-break>\u3000<line-break>バロルの代わりにネメア兄さんを<line-break>魔王にするためだったの？<line-break>違うでしょう？<end>"
english = "Father, what was the point of defeating Balor, the Demon King? Was it so Nemea could take his place as Demon King? That wasn't the reason, was it?<end>"

["1200002"]
japanese = "そうですねえ。でも、あんまり<line-break>目的意識もなかったですかねえ。<end>"
english = "Quite right. Though I can't say we had much of a purpose in mind at the time.<end>"

["1200003"]
japanese = "父さん！<end>"
english = "Father!<end>"

["1200004"]
japanese = "それにネメアも、別に魔王になろうと<line-break>しているわけでもないでしょう？<end>"
english = "Besides, Nemea isn't actually trying to become the Demon King, is he?<end>"

["1200005"]
japanese = "世界に戦争を挑み、<line-break>闇の神器を集めているわ！\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>早く、くい止めないと<line-break>兄さんは魔王になる。そしたら、<line-break>もう誰も兄さんを止められないわ！<end>"
english = "He's waging war on the world and gathering the Artifacts of Darkness! If we don't stop him soon, he'll become the Demon King. And then no one will be able to stop him!<end>"

["1200006"]
japanese = "すでに今でも、<line-break>誰もネメアをとめられませんよ。\u3000\u3000\u3000<line-break>\u3000<line-break>剣聖レーグですら、引き分けたんです。<line-break>ま、好きにさせるしかないでしょう。<end>"
english = "No one can stop Nemea even now. Even Reig the Sword Saint could only fight him to a draw. Well, I suppose we'll just have to let him do as he pleases.<end>"

["1200007"]
japanese = "それより、感心しませんねえ。<line-break>無限のソウルを持つ者を使って、<line-break>私に内緒で何かたくらんでいるなんて。<end>"
english = "More to the point, I don't approve of you using the Bearer of the Infinite Soul to plot something behind my back.<end>"

["1200008"]
japanese = "あ、あれは…！<end>"
english = "Th-that was...!<end>"

["1200009"]
japanese = "言いわけは別の機会に聞きます。<line-break>行きなさい、ケリュネイア。<end>"
english = "You can make your excuses another time. Go, Ceryneia.<end>"

["1200010"]
japanese = "さすがは閃光の異名をとるだけある。<line-break>素早いですねえ。<line-break>\u3000<line-break><value:$28>、<line-break>もう、入ってきてもいいですよ。<end>"
english = "She certainly lives up to the name “Flash.” Very quick indeed. <value:$28>, you may come in now.<end>"

["1200011"]
japanese = "ふふ、おそらく、あなたには<line-break>質問したいことがあるのでしょう。<line-break>\u3000<line-break>あの女性は何者なのか？<line-break>私とネメアとあの女性との関係は？<line-break>ま、順に話していきましょうか。<end>"
english = "Heh. I imagine you have questions. Who was that woman? What is the connection between her, Nemea, and me? Well, let us take things in order.<end>"

["1200012"]
japanese = "さっきの女性の名はケリュネイア。<line-break>あなたにネメアの野望を阻止するように<line-break>言っているみたいですね。<line-break>彼女はハーフエルフです。<line-break>ハーフエルフは人からもエルフからも<line-break>うとまれています。<end>"
english = "The woman you just saw is Ceryneia. It seems she's been telling you to thwart Nemea's ambitions. She's a Half-Elf, and Half-Elves are shunned by humans and Elves alike.<end>"

["1200013"]
japanese = "それで、両親は持て余して<line-break>赤ん坊の彼女を捨てたのでしょう。<line-break>それを私が拾って育てたのです。<line-break>だから、彼女は私のことを<line-break>父と呼んでいたのです。<end>"
english = "Her parents presumably found her too much to deal with and abandoned her as an infant. I found her and raised her. That is why she called me Father.<end>"

["1200014"]
japanese = "私が育てた子はもうひとりいます。<line-break>それが今は血塗られた覇道を行く男<line-break>獅子帝ネメアなのです。<line-break>３０年程前、円卓騎士バルザーと<line-break>魔王バロルの娘エスリンの間に<line-break>恋が芽生え、生命が宿りました。<end>"
english = "There is one other child I raised: Nemea, the Lion Emperor, now treading a bloodstained path to supremacy. Some thirty years ago, love blossomed between Baltzer, a Knight of the Round Table, and Ethlinn, daughter of Balor, the Demon King. A new life was conceived.<end>"

["1200015"]
japanese = "しかし、バロルの娘の子がバロルを<line-break>滅ぼすという妖術宰相ゾフォルの<line-break>予言が、エスリンの命を奪いました。<line-break>予言をおそれた魔王バロルが、<line-break>自分の娘の首をかき切り<line-break>この森に捨てたのです。<end>"
english = "But the Sorcerous Chancellor Zofor prophesied that the child of Balor's daughter would destroy him, and that prophecy cost Ethlinn her life. Fearing it, Balor, the Demon King, slit his own daughter's throat and cast her body into this forest.<end>"

["1200016"]
japanese = "私はエスリンの命を救うことは\u3000\u3000\u3000\u3000<line-break>できませんでしたが、彼女に宿っていた<line-break>新しい命は救うことができました。<line-break>それがネメアなのです。<line-break>やがて、成長したネメアは<line-break>魔王バロルを倒すべく旅に出ました。<end>"
english = "I could not save Ethlinn, but I was able to save the new life within her. That child was Nemea. When he came of age, Nemea set out on a journey to defeat Balor, the Demon King.<end>"

["1200017"]
japanese = "その旅に付き従ったのが<line-break>先ほどのケリュネイアに剣聖レーグ、<line-break>そして私なのです。<end>"
english = "Those who accompanied him were Ceryneia, whom you just met, Reig the Sword Saint, and myself.<end>"

["1200018"]
japanese = "ハーフエルフと半魔。この似た境遇も<line-break>手伝って、ケリュネイアは<line-break>ネメアを慕うようになりました。<line-break>ともに旅をし、ともに苦難を抜け、<line-break>ケリュネイアは妹と言うよりはむしろ、<line-break>恋人のようにネメアに接していました。<end>"
english = "Ceryneia was a Half-Elf and Nemea a half-Demon. Their similar circumstances helped foster her affection for him. They traveled and endured hardship together, and Ceryneia behaved toward Nemea more like a lover than a younger sister.<end>"

["1200019"]
japanese = "それだけに、彼女には<line-break>今現在のネメアが許せないのです。<line-break>\u3000<line-break>自分の理想の男としてではなく、<line-break>血塗られた覇道を進むネメアの意図が<line-break>ケリュネイアには理解できないのです。<end>"
english = "That is precisely why she cannot forgive the man Nemea is now. She cannot understand why the man she idealized would choose to walk such a bloodstained path to supremacy.<end>"

["1200020"]
japanese = "自分の願い、自分の思い描く姿から、<line-break>ネメアが逸脱していくのが<line-break>許せないのです。<line-break>人はおのれのうちに抱く<line-break>幻想を打ち破るものを<line-break>たやすく憎むものです。<end>"
english = "She cannot forgive Nemea for straying from her wishes, from the image she formed of him. People readily come to hate anyone who shatters the illusions they hold within themselves.<end>"

["1200021"]
japanese = "ケリュネイアはネメアの真の意図を<line-break>確かめようともしません。<line-break>ネメアと直接対決するのが恐いのです。<line-break>そうすることによって自分の幻想が<line-break>壊れてしまうのが恐いから…。<line-break>つまり、信じ切れていないんですね。<end>"
english = "Ceryneia will not even try to discover Nemea's true intentions. She's afraid to confront him directly, because doing so might destroy her illusions. In other words, her faith in him is not absolute.<end>"

["1200022"]
japanese = "ですから、ネメアをただ憎み、<line-break>あなたを使って、自分の幻想の中の<line-break>ネメアを取り戻そうとしているのです。<end>"
english = "And so she simply hates Nemea and uses you in an attempt to reclaim the Nemea of her imagination.<end>"

["1200023"]
japanese = "さてさて、長い話になりました。<line-break>おさらいの質問を受け付けますよ。<line-break>何か聞きたいことはありますか？<end>"
english = "Well, that turned into quite a long story. Now, is there anything you'd like me to go over again? Any questions?<end>"

["1200024"]
japanese = "ケリュネイアについて<end>"
english = "About Ceryneia<end>"

["1200025"]
japanese = "ネメアについて<end>"
english = "About Nemea<end>"

["1200026"]
japanese = "ネメアの意図について<end>"
english = "Nemea's intentions<end>"

["1200027"]
japanese = "もう聞くことはない<end>"
english = "I have no more questions<end>"

["1200028"]
japanese = "あなたにネメアの野望を阻むように\u3000\u3000<line-break>言っている女性です。<line-break>\u3000<line-break>彼女はハーフエルフです。<line-break>ハーフエルフは人からもエルフからも<line-break>うとまれます。<end>"
english = "She's the woman telling you to thwart Nemea's ambitions. She's a Half-Elf, and Half-Elves are shunned by humans and Elves alike.<end>"

["1200029"]
japanese = "それで、彼女の両親は<line-break>赤ん坊の彼女を捨てたのでしょう。<line-break>それを私が拾って育てたのです。<line-break>ハーフエルフであるケリュネイアは<line-break>似た境遇のネメアに親近感を持ち、<line-break>彼になかば恋愛感情を抱いています。<end>"
english = "Her parents presumably abandoned her as an infant. I found her and raised her. As a Half-Elf, Ceryneia felt a kinship with Nemea because of their similar circumstances, and her feelings for him are partly romantic.<end>"

["1200030"]
japanese = "それだけに自分の理想像から離れていく<line-break>ネメアが許せないのかもしれません。<line-break>\u3000<line-break>素早い動きで魔法を連発する<line-break>優れた魔道士で、閃光の異名をとり、<line-break>バロル討伐ではネメアを助けました。<end>"
english = "That may be why she cannot forgive Nemea for straying from her ideal of him. She is an exceptional mage known as the Flash, moving swiftly as she casts spell after spell, and she helped Nemea defeat Balor.<end>"

["1200031"]
japanese = "他に、聞きたいことはありますか？\u3000\u3000<end>"
english = "Is there anything else you would like to ask?<end>"

["1200032"]
japanese = "バロルの娘エスリンと\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>破壊神ウルグの円卓騎士<line-break>魔人バルザーの間の子です。<line-break>ゾフォルの予言を恐れた魔王バロルに、<line-break>彼の母、エスリンは命を奪われましたが<line-break>私が死んだ母胎から彼を助けました。<end>"
english = "He is the son of Ethlinn, Balor's daughter, and Baltzer the Demon, a Knight of the Round Table who served Urg, God of Destruction. Fearing Zofor's prophecy, Balor, the Demon King, took the life of Nemea's mother, Ethlinn, but I rescued him from her dead womb.<end>"

["1200033"]
japanese = "その後、私は彼をケリュネイアと一緒に<line-break>育てました。いわば、養子ですね。<line-break>やがて立派な戦士に成長しました。<line-break>彼はバロルを倒し、世界を救いました。<line-break>そのときの仲間が閃光のケリュネイア<line-break>剣聖レーグ、そして私です。<end>"
english = "Afterward, I raised him alongside Ceryneia. You might say he was my adopted son. In time, he grew into a fine warrior. He defeated Balor and saved the world. His companions then were Ceryneia the Flash, Reig the Sword Saint, and myself.<end>"

["1200034"]
japanese = "他に、聞きたいことはありますか？\u3000\u3000<end>"
english = ""

["1200035"]
japanese = "ネメアに、直接<line-break>挑み、対決することです。<line-break>そこから確かめてください。<line-break>私は教えられません。<line-break>ただ、ケリュネイアのように<line-break>臆病にならないでください。<end>"
english = "Challenge Nemea and confront him directly. Find your answer there. I cannot give it to you. Just do not be a coward like Ceryneia.<end>"

["1200036"]
japanese = "他に、聞きたいことはありますか？\u3000<end>"
english = ""

["1200037"]
japanese = "そうですか。では最後にもうひとつ。<line-break>ネメアのやり方は、間違っていない<line-break>わけではありません。<line-break>ですが、あなたが彼の行動に<line-break>疑問を感じているのなら、<line-break>彼に挑んでください。いいですね？<end>"
english = "Very well. Then one last thing. I cannot say Nemea's methods are without fault. But if his actions trouble you, challenge him. Do you understand?<end>"

["1200038"]
japanese = "今はまだ、わからないかもしれません。<line-break>しかし、挑み続けているうちに、<line-break>いずれ、ぼんやりとわかってきますよ。<end>"
english = "You may not understand yet. But if you continue to challenge him, in time you will begin to see, however dimly.<end>"

["1200039"]
japanese = "今日もいい天気ですね。<line-break>たまには庭で昼寝でもどうです？<line-break>…ムリは、よくありませんよ。<end>"
english = "Another beautiful day, isn't it? Why not take a nap in the garden for a change? You really shouldn't push yourself too hard.<end>"

["1200040"]
japanese = "<value:$28>、<line-break>また背が伸びたようですね。<end>"
english = "It looks as though you've grown taller again, <value:$28>.<end>"

["1200041"]
japanese = "私が縮んだから？<line-break>…なるほど、そうかもしれません。<end>"
english = "Because I've shrunk? Ah, perhaps you're right.<end>"

["1200042"]
japanese = "ケリュネイアは<line-break>よくやってくれてますよ。<line-break>わがままな猫２匹の世話をね。<line-break>ああ見えても<line-break>やさしい子なんです。<end>"
english = "Ceryneia has been doing a fine job, looking after those two willful cats. She may not look it, but she's a kind girl.<end>"

["1200043"]
japanese = "さて、昼寝でもしましょうかね。<end>"
english = "Well then, perhaps it's time for a nap.<end>"

["1200044"]
japanese = "<value:$28>様。<line-break>ご無事でなによりです。<line-break>ゆっくりしていってくださいね。<end>"
english = "<value:$28>, what a relief to see you safe. Please stay and rest awhile.<end>"

["1200045"]
japanese = "ここにいると\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>心が安まるんです。<line-break> \u3000<line-break>つらかったことや<line-break>悲しかったことを<line-break>みんな忘れられるような気がして…。<end>"
english = "I feel at peace here. It's as though I can forget all the painful, sorrowful things that have happened...<end>"

["1200046"]
japanese = "ネモさんってとても<line-break>やさしい方なんですよ。<end>"
english = "Nemo is such a kind man.<end>"

["1200047"]
japanese = "本当です。<line-break>親切にいろいろと<line-break>教えてくださるんです。<end>"
english = "It's true. He's been kind enough to teach me all sorts of things.<end>"

["1200048"]
japanese = "あまりムリを<line-break>なさらないでくださいね。<end>"
english = "Please don't push yourself too hard.<end>"

