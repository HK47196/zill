["1460000"]
japanese = "エスト用メッセージ開始<end>"
english = ""

["1460001"]
japanese = "<value:$28>！ <line-break>こんな所で会うなんて、<line-break>すごい偶然だね。<end>"
english = "<value:$28>! What a coincidence, running into you here.<end>"

["1460002"]
japanese = "この場所には前から興味があってね。<line-break>調査してるんだ。<end>"
english = "I've been interested in this place for some time. I'm investigating it.<end>"

["1460003"]
japanese = "今回は、闇の神器の調査なんだ。<line-break>\u3000<line-break>\u3000<line-break>古代の謎を解き明かすには、<line-break>古代の遺跡を調べるのが、<line-break>一番の近道だからね。<end>"
english = "This time, I'm investigating the dark artifacts. If you want to unravel the mysteries of antiquity, examining ancient ruins is the best place to start.<end>"

["1460004"]
japanese = "例えば、魔道の塔に残された<line-break>宝とか…<line-break>\u3000<line-break>古代文明を受け継いで栄えた<line-break>魔道王国ラドラスとかね。<end>"
english = "The treasures left in the Arcane Tower, for example... or the Magic Kingdom Ladras, which flourished as heir to an ancient civilization.<end>"

["1460005"]
japanese = "でも、魔道の塔の宝は\u3000\u3000\u3000\u3000<line-break>ほとんど残ってないし、<line-break>\u3000<line-break>ラドラスは、８００年前に<line-break>滅亡して、謎に包まれてる…。<end>"
english = "But hardly any of the Arcane Tower's treasures remain, and Ladras fell eight hundred years ago. It's still shrouded in mystery.<end>"

["1460006"]
japanese = "だから、そこから先人類の謎に<line-break>たどり着くのは、難しいと思う。<end>"
english = "So I doubt those avenues will lead to the mysteries of the people who came before humanity.<end>"

["1460007"]
japanese = "でも、調べる価値があるものは<line-break>なんでも調べてみるつもりさ。<line-break>僕の興味は尽きないからね。<line-break>そして、近いうちに<line-break>古代の魔法文明の秘密を<line-break>解き明かしてみせる。<end>"
english = "Still, I intend to investigate anything worth investigating. My curiosity is endless. Before long, I'll uncover the secrets of ancient magical civilization.<end>"

["1460008"]
japanese = "人類の未来は明るいよ。<line-break>想像もできないような、<line-break>豊かな未来が待っているんだ。<end>"
english = "Humanity has a bright future ahead. A prosperous future beyond anything we can imagine.<end>"

["1460009"]
japanese = "現実を見ろよ<end>"
english = "Face reality.<end>"

["1460010"]
japanese = "そうなるといいね<end>"
english = "I hope you're right.<end>"

["1460011"]
japanese = "いいさ。<line-break>僕の研究がうまくいけば、<line-break>君にもわかる日がくるよ。<end>"
english = "That's all right. If my research succeeds, the day will come when you understand too.<end>"

["1460012"]
japanese = "その日まで、<line-break>僕はあきらめないから。<end>"
english = "And until that day, I won't give up.<end>"

["1460013"]
japanese = "ありがと。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>僕の話を聞くと、みんな笑うんだ。<line-break>でも、君は違うね。<line-break>君はみんなと違うよ。<end>"
english = "Thanks. Everyone laughs when I tell them about my work. But not you. You're different from the rest.<end>"

["1460014"]
japanese = "兄さんのおかげで、<line-break>僕はこうして考古学に熱中できる。<line-break>感謝してるよ。<line-break>でもね、兄さんが僕を好きなように<line-break>させておくのは…<end>"
english = "It's thanks to my brother that I can devote myself to archaeology like this, and I'm grateful. But the reason he lets me do as I please is...<end>"

["1460015"]
japanese = "僕に仕事をじゃまされたくない\u3000\u3000<line-break>からなんだ。<line-break>\u3000<line-break>そりゃ、兄さんは<line-break>王宮の貴族たちみたいに、<line-break>僕の研究をバカにしたりはしない。<end>"
english = "because he doesn't want me interfering with his work. Of course, he doesn't ridicule my research like the nobles at court do.<end>"

["1460016"]
japanese = "でも僕の研究を認めてるわけでもない。<line-break>そういう意味じゃ、<line-break>兄さんも他のみんなと同じさ。<end>"
english = "But that doesn't mean he believes in it. In that respect, he's no different from anyone else.<end>"

["1460017"]
japanese = "わかってないんだ。<line-break>魔道文明を人類が手にすれば…<line-break>\u3000<line-break>兄さんを悩ます<line-break>王宮のゴタゴタなんて<line-break>いっぺんに解決するのに。<end>"
english = "He doesn't understand. If humanity could reclaim magical civilization, all the squabbling at court that troubles him could be settled at once.<end>"

["1460018"]
japanese = "貴族だろうと、平民だろうと<line-break>楽して豊かな生活ができるのに。<line-break>\u3000<line-break>この研究はね、<line-break>兄さんの…<line-break>いやロストールのためでもある。<end>"
english = "Nobles and commoners alike could live prosperous lives without hardship. This research isn't just for my brother... No, it's for Rostorl too.<end>"

["1460019"]
japanese = "僕は僕なりに、<line-break>リューガ家の一員として<line-break>役割を果たしているつもりだよ。<end>"
english = "In my own way, I believe I'm doing my part as a member of House Ryuga.<end>"

["1460020"]
japanese = "それは勝手な言い分だ<end>"
english = "That's a self-serving excuse.<end>"

["1460021"]
japanese = "確かにそうだ<end>"
english = "That's true.<end>"

["1460022"]
japanese = "…確かに勝手だよね。<line-break>なんの成果もあげてないんだから。<end>"
english = "You're right. It is selfish of me to say that when I haven't achieved anything yet.<end>"

["1460023"]
japanese = "でも、見ててよ。<line-break>きっと役に立ってみせる。<line-break>きっと…。<end>"
english = "But just watch. I'll prove I can be of use. I will...<end>"

["1460024"]
japanese = "ありがと。<line-break>君ならわかってくれると思ってた。<line-break>\u3000<line-break>きっと、古代の謎を解き明かして<line-break>人類の生活を変えてみせるからね。<end>"
english = "Thanks. I knew you'd understand. I'll unravel the mysteries of antiquity and transform the way humanity lives. Just wait and see.<end>"

["1460025"]
japanese = "冒険は順調？<end>"
english = "How are your adventures going?<end>"

["1460026"]
japanese = "ああ、僕の発掘の方も順調だよ。<line-break>でも、今はちょっと横道に<line-break>それてるかな。<line-break>古代文明を知る手掛かりは、<line-break>あちこちに散らばっているんだ。<end>"
english = "Oh, my excavations are going well too. Though I suppose I've taken a bit of a detour. Clues to ancient civilization are scattered everywhere.<end>"

["1460027"]
japanese = "一見、無関係のようなことでも、<line-break>よく調べると、つながっている。<line-break>古代文明が土台になっているんだよ。<line-break>例えば、竜骨の砂漠。<line-break>あれは、古代の魔法を受け継いだ国<line-break>ラドラス王国が滅亡しかけたとき、<end>"
english = "Even things that seem unrelated at first are connected when you look closely. Ancient civilization lies at the root of it all. Take the Dragonbone Desert. When the Kingdom of Ladras, heir to ancient magic, stood on the brink of destruction,<end>"

["1460028"]
japanese = "ラドラス王国の巫女が<line-break>造った砂漠なんだ。<line-break>ラドラスの魔法文明を守るためにね。<line-break>砂漠の下には、ラドラスの都市が<line-break>そのままの姿で沈んでいるという。<end>"
english = "a priestess of Ladras created that desert to protect its magical civilization. They say Ladras itself lies submerged beneath the desert, preserved just as it was.<end>"

["1460029"]
japanese = "人が砂漠を造るなんて信じられる？<line-break>人が都市を沈めるなんて信じられる？<line-break>\u3000<line-break>でも、本当なんだ。<line-break>人間には、そんなことだってできる。<line-break>人間の力ってすごいんだよ。<end>"
english = "Can you believe a person could create a desert? Or sink a city? But it's true. Human beings are capable of even that. The power of humanity is incredible.<end>"

["1460030"]
japanese = "今ある力で十分だ<end>"
english = "The power we have now is enough.<end>"

["1460031"]
japanese = "そんな力を操りたい<end>"
english = "I want to wield that kind of power.<end>"

["1460032"]
japanese = "それじゃ、人は進歩しない。<line-break>満足しちゃったら、<line-break>それ以上はないよ。<line-break>僕は、そんなのイヤだ。<line-break>少しでも前へ進みたいんだ。<end>"
english = "Humanity would never progress that way. Once we're satisfied with what we have, we can go no further. I don't want that. I want to keep moving forward, even if only a little at a time.<end>"

["1460033"]
japanese = "見ていて。<line-break>僕がその力を<line-break>人間の手に取り戻してみせる。<end>"
english = "Just watch. I'll restore that power to human hands.<end>"

["1460034"]
japanese = "さてと。<line-break>僕は調査を続けるよ。<line-break>\u3000<line-break><value:$28>、<line-break>君も頑張ってね。<end>"
english = "Well, I'd better get back to my investigation. You keep at it too, <value:$28>.<end>"

["1460035"]
japanese = "…うーん、なるほど…。<end>"
english = "Hmm... I see...<end>"

["1460036"]
japanese = "また会ったね、<value:$28>。<end>"
english = "We meet again, <value:$28>.<end>"

["1460037"]
japanese = "なんだか、君に会えそうな<line-break>気がしてたんだ。<line-break>うれしいよ。<end>"
english = "Somehow, I had a feeling I'd see you. I'm glad.<end>"

["1460038"]
japanese = "僕ね、君と最初に出会ったとき、<line-break>君がこんな人ならいいな、と思った。<line-break>\u3000<line-break>君は、そのとき僕が思ったとおりの<line-break>人だったよ。<end>"
english = "When we first met, I remember hoping you'd be this kind of person. And you turned out to be exactly as I'd imagined.<end>"

["1460039"]
japanese = "君は、いつだって僕の話を\u3000\u3000<line-break>真剣に聞いてくれたもの。<line-break>\u3000<line-break>だから君には、僕の研究成果を<line-break>知る権利があるよね。<end>"
english = "You've always listened to me so earnestly. That means you have a right to know what my research has uncovered.<end>"

["1460040"]
japanese = "実はね、僕、ついに突き止めたんだ。<line-break>君に闇の神器を渡したあと、<line-break>いろんな遺跡を研究して、ついにね。<line-break>先人類の秘密が眠る場所…<line-break>先人類の遺跡のありかを。<end>"
english = "The truth is, I've finally tracked it down. After I gave you the sacred artifact of darkness, I studied all kinds of ruins until at last I found it: the place where the secrets of the Precursor Humans lie sleeping... the site of their ruins.<end>"

["1460041"]
japanese = "…夢幻の湖。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>そこに、僕の仮説が、<line-break>夢なんかじゃないってことを<line-break>証明するものが眠っている。<end>"
english = "...The Lake of Illusions. Something lies sleeping there that will prove my hypothesis was more than just a dream.<end>"

["1460042"]
japanese = "これから忙しくなるよ。<line-break>調査も大詰めだからね。<end>"
english = "I'm going to be busy from now on. The investigation is entering its final stage.<end>"

["1460043"]
japanese = "アドヴェントを習得した。<end>"
english = "Learned Advent.<end>"

["1460044"]
japanese = "ああ、君か。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>この私に何か用か？<line-break>\u3000<line-break>たまには君から話すがいい。<line-break>今日は、君の話を聞こう。<line-break>無限のソウルを持つ者の身の上を。<end>"
english = "Ah, it's you. Do you have some business with me? For once, you may do the talking. Today, I shall hear your story―the story of the Bearer of the Infinite Soul.<end>"

["1460045"]
japanese = "君の故郷は？\u3000ご両親は健在か？<line-break>君の活躍ぶりを、<line-break>さぞや鼻にかけていることだろう。<end>"
english = "Where are you from? Are your parents still well? They must take great pride in all you've accomplished.<end>"

["1460046"]
japanese = "…余計なことを言ったようだ。<end>"
english = "...It seems I spoke out of turn.<end>"

["1460047"]
japanese = "…この私にも両親はいない。<line-break>私を息子と呼ぶ者はいるが、<line-break>奴など親とは思いたくもない。<end>"
english = "...I have no parents either. Someone calls me a son, but I have no wish to think of that wretch as a parent.<end>"

["1460048"]
japanese = "フ…私が先に心ない質問をしたのだ。<line-break>愚かな生みの親について<line-break>話さぬわけにもいくまい。<end>"
english = "Hmph... I was the one who asked such a thoughtless question. I can hardly refuse to speak of my foolish birth parents.<end>"

["1460049"]
japanese = "私を生んだ両親は、\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>ディンガル家の一族。しかし、<line-break>その地位は低く、生活は貧しかった。<line-break>そこにゾフォル…あの予言者が現れた。<line-break>当時、宰相であったゾフォルは…<end>"
english = "My birth parents belonged to the Dingal family. But their standing was low, and they lived in poverty. Then Zofor appeared―that prophet. At the time, Zofor was Chancellor...<end>"

["1460050"]
japanese = "一夜、肉体を貸せば、<line-break>その後の地位と財産を保証する。<line-break>…そう言ったという。<line-break>父と母は、ゾフォルに連れられて<line-break>魔道の塔へとおもむき、<line-break>シャロームに肉体を貸した。<end>"
english = "“Lend your bodies for a single night, and your position and wealth afterward will be guaranteed.” That, it is said, was the offer. My father and mother went with Zofor to the Arcane Tower, where they lent their bodies to Shalom.<end>"

["1460051"]
japanese = "そして、奴の子を身ごもったのだ。\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>そのとき受けた強力な魔法がたたって、<line-break>間もなくふたりは世を去った。<line-break>シャロームの子ベルゼーヴァを残して。<end>"
english = "And my mother conceived his child. The powerful magic they were subjected to took its toll, and both died soon afterward, leaving behind Beelzeva, the son of Shalom.<end>"

["1460052"]
japanese = "彼らは愚かだろうか？<line-break>…彼らは弱かっただけだ。<line-break>あるいはその両方かもしれない。<line-break>なんにせよ、弱さが、<line-break>この世の悲しみを生むのだ。<end>"
english = "Were they fools? ...They were merely weak. Perhaps they were foolish as well. In any case, it is weakness that gives rise to sorrow in this world.<end>"

["1460053"]
japanese = "悪いが、はずしてくれ。<line-break>片付けてしまいたい仕事がある。<end>"
english = "Sorry, but leave me alone. I have some work I want to finish.<end>"

["1460054"]
japanese = "やあ、<value:$28>。<line-break>ついに発見したよ。<line-break>この先に、古代遺跡があるんだ。\u3000\u3000<line-break>おそらく、魔法が封印されているよ。<line-break>でも、強力な守護者がいてね。<line-break>僕は、近づけそうにない。<end>"
english = "Hello, <value:$28>. I've finally found it. There are ancient ruins up ahead, and I suspect some magic has been sealed inside. But a powerful Guardian stands watch, and I don't think I can get close.<end>"

["1460055"]
japanese = "でも、君なら近づけるかもしれないね。<line-break>僕は、他の場所も<line-break>調べてみたいからここを離れるけど、<line-break><value:$28>は、<line-break>行ってみたらどうだい？<line-break>見るだけでも価値があるよ。<end>"
english = "You might be able to get close, though. I'm leaving to investigate some other places, but why don't you go and see, <value:$28>? It would be worth it just to have a look.<end>"

["1460056"]
japanese = "じゃ、またね。<end>"
english = "Well, see you later.<end>"

["1460057"]
japanese = "すごい。あの守護者を倒したんだね。<line-break>これで古代の偉大な力のひとつが<line-break>復活したんだ。<line-break>ありがとう、<value:$28>。<line-break>これで研究が進められるよ。<end>"
english = "Amazing. You defeated that Guardian. One of the great powers of antiquity has been restored. Thank you, <value:$28>. Now I can move forward with my research.<end>"

["1460058"]
japanese = "ところで、<value:$28>。<line-break>兄さんのこと、何か知らない？\u3000\u3000<line-break>\u3000<line-break>行方不明らしいんだ。<line-break>僕に一言もなく姿を消すなんて…。<line-break>何があったんだろう…。<end>"
english = "By the way, <value:$28>, have you heard anything about my brother? Apparently he's gone missing. He vanished without saying a word to me... I wonder what happened.<end>"

["1460059"]
japanese = "そうだよね。<line-break>兄さんなら、大丈夫だよね。<end>"
english = "You're right. My brother will be all right, won't he?<end>"

["1460060"]
japanese = "じゃあ、僕は、一度戻って、<line-break>中を調べる準備をしてくるよ。<end>"
english = "Then I'll head back and prepare to investigate the interior.<end>"

