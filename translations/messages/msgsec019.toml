["190174"]
japanese = "砂漠の一族の長にして地の巫女。<line-break>魔道王国ラドラス最後の巫女たちのひとり、<line-break>地の巫女ズゥの血をひいている。<line-break>砂漠の一族が住むラドラスは魔道の力で、<line-break>生きるのに快適な環境を維持し、食料や水などを<line-break>提供することで、砂漠でも人が生活できるように<line-break>している。<line-break>\u3000<end>"
english = "Chief of the Desert Clan and Maiden of Earth. She is descended from Zuu, the Maiden of Earth and one of the last maidens of Magic Kingdom Ladras. Ladras, home of the Desert Clan, uses magical power to maintain a comfortable living environment and supply food, water, and other necessities, allowing people to live in the desert.<end>"

