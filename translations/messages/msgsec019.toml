japanese = "セラの姉。魔道アカデミーの出身で、ザギヴの<line-break>ひとつ下の代の首席。<line-break>リベルダムの魔獣商アンティノの命令で、戦闘用<line-break>モンスターのデスギガースを無理矢理制作させ<line-break>られる。自分の作ったモンスターによって、多く<line-break>の人が傷つき死んでいく現実に、彼女は苦しみ、<line-break>悩む。そこを魔人アーギルシャイアにつかれ、<line-break>肉体を乗っ取られてしまう。<end>"
english = "Sera's older sister and an Arcane Academy graduate who ranked first in the class below Zagiv's. Antino forced her to create the battle monster Death Gigas. Tormented by the harm it caused, she fell prey to Argyleshire, who possessed her body.<end>"

