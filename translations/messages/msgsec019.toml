["190039"]
japanese = "ロストールの先王の娘。王宮の隅で孤独に暮らす<line-break>自分とは対照的に、華やかで誰からも好かれてい<line-break>る従妹ティアナの存在が、彼女の心を闇に落とし<line-break>てしまう。システィーナの伝道師シャリは、彼女<line-break>の心の闇を解放し世界を危機に陥れる。<line-break><line-break><line-break>\u3000<end>"
english = "Daughter of the former king of Rostorl. Her cousin Tiana is everything she is not: dazzling and loved by all. Tiana's very existence plunges the lonely princess, who lives secluded in a corner of the palace, into darkness. Shalli, a missionary of Sistina, unleashes the darkness in her heart and places the world in peril.<end>"

