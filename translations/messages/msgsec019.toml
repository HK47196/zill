japanese = "海を越え、はるか東方から来たと称し<line-break>バイアシオン大陸のあちこちに出没する、<line-break>その目的も正体も不明な謎だらけの少年。<line-break>結果や方法の善悪は関係なく、願いをかなえる<line-break>ことに楽しみを感じているようだが…。<line-break>東方の博士と自称するだけあって、<line-break>古代の魔法技術や魔道器に詳しい。<line-break>\u3000<end>"
english = "A mysterious boy whose identity and motives are unknown. Claiming to have crossed the sea from the distant East, he appears here and there across the Baiashion Continent. He seems to delight in granting wishes, regardless of whether the means or results are good or evil... True to his self-proclaimed title of Scholar from the East, he is well versed in ancient magical technology and magical devices.<end>"

