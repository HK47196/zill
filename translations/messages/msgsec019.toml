["190069"]
japanese = "リベルダムの有力者で武器商人。同じく有力商人<line-break>のロティと共にディンガル帝国と東方国家の間に<line-break>争いの火種をまいてもうけていたが、次第に<line-break>ロティをねたましく思うようになり、暗殺する。<line-break>次にディンガルへリベルダムを売り渡し、地位を<line-break>得ようと画策。ディンガルの青竜将軍カルラと<line-break>手を組むが、結果的にリベルダムも地位も失うこ<line-break>ととなる。<end>"
english = "An influential Liberdam arms merchant. He and Lottie profited by sowing conflict between Dingal and the eastern nations, but Antino grew jealous and had Lottie killed. He then tried to sell Liberdam to Dingal. Though he joined Karula, he lost Liberdam and the status he sought.<end>"

