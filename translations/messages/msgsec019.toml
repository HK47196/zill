["190179"]
japanese = "地の巫女。シャリは魔道王国ラドラスの４人の巫<line-break>女の子孫であるイークレムン、エステル、フレア<line-break>エアを誘拐し、ラドラスの空中都市を浮上させ<line-break>その力で地上を焼き払おうとした。<line-break>だが、<value:$28>に阻止された。<line-break>エステルは空中都市を不時着させるため、<line-break>ひとり墜落する空中都市に残った。<line-break>その後のエステルの生死は不明である。<end>"
english = "The Maiden of Earth. Shalli abducted Iiklmn, Esther, Flare, and Er, descendants of the four maidens of Magic Kingdom Ladras, then raised the Floating City of Ladras and tried to use its power to burn the surface world. <value:$28> stopped the plan. To make the Floating City perform an emergency landing, Esther remained alone aboard the falling city. Whether she survived is unknown.<end>"

