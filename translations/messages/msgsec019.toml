japanese = "リベルダムの有力商人ロティの娘。<line-break>何者かに父ロティが暗殺されると、その跡を継ぎ<line-break>ロセン解放軍のリーダーとなる。なぜなら彼女の<line-break>母親はロセン王ペウダの叔母にあたり、カルラに<line-break>皆殺しにされたロセン王家の血を引く最後の生き<line-break>残りだからである。解放軍のリーダー兼シンボル<line-break>という重責のため、多少気負いすぎて突っ張って<line-break>いるところがある。<end>"
english = "Lottie's daughter and successor as leader of the Rocen Liberation Army. Her mother was King Peuda's aunt, making Khryuseis Rocen's last royal descendant after Karula killed the rest. As both the army's leader and symbol, she often forces herself to appear strong.<end>"

