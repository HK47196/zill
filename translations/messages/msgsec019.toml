japanese = "ロストール王国の王妃。名家ファーロス家の出。<line-break>謀略に優れ、２国を滅ぼしロストールに併合する<line-break>という実績を持つ。夫セルモノーも実兄ノヴィン<line-break>も頼りにならないため、国を守るには彼女が謀略<line-break>を用いて他国と戦うしかないのだが、その妖艶で<line-break>悪女的な外見も災いしファーロスの雌狐などと<line-break>呼ばれている。<line-break>\u3000<end>"
english = "Queen of Rostorl, born to House Pharos. A gifted schemer, she destroyed two countries and annexed them to Rostorl. Unable to rely on Selmono or Novin, she defended the kingdom through intrigue. Her bewitching, villainous appearance earned her the name Vixen of Pharos.<end>"

