japanese = "元はエリスの宝石たちの一員。テジャワの変に<line-break>大きく関わり、そのすえに魂切の鎌でソウルを<line-break>刈られるが、闇の神器・同化の髪飾りの力で<line-break>よみがえる。同化の髪飾りを使い、犠牲となった<line-break>ジリオンを救うため自分の身を捧げようとまで<line-break>するが、<value:$28>の助けや<line-break>シャリの後押しを受けてジリオンを救い出し、<line-break>自身も闇の神器の力から解放された。<end>"
