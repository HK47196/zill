["190014"]
japanese = "ロストールの騎士の娘で本人も騎士になることを<line-break>夢見ている。師匠オッシも認める剣の達人で近隣<line-break>でかなうものはいない。<line-break>ゴブゴブ団を名乗る３匹のゴブリンが盗んだ<line-break>禁断の聖杯を取り戻すため、旅に出る。<line-break><line-break><line-break>\u3000<end>"
english = "The daughter of a Rostorl knight, she dreams of becoming a knight herself. She is a master swordswoman whose skill is acknowledged by her teacher, Ossi, and no one in the surrounding region can match her. She sets out to recover the Forbidden Grail, stolen by three Goblins calling themselves the Gobgob Gang.<end>"

