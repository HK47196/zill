["190309"]
japanese = "玄武将軍。内務統括としてディンガル帝国の内政<line-break>をつかさどっていたが、政敵、青竜将軍カルラの<line-break>領土を視察に向かったまま行方不明になった。<line-break>宰相ベルゼーヴァは早々に捜索を打ち切った。<line-break>ロセン解放軍に襲われた、カルラによって闇に葬<line-break>られた、冒険者<value:$28>といっしょに<line-break>行動しているのが目撃された、ベルゼーヴァに始<line-break>末された、などの様々な情報が飛びかっている。<end>"
english = "The Black Tortoise General and Dingal's Director of Domestic Affairs. She disappeared while inspecting rival Karula's territory, and Beelzeva ended the search. Rumors blame the Rocen Liberation Army, Karula, or Beelzeva; another says she travels with <value:$28>.<end>"

