["190049"]
japanese = "真紅のプレートメイルに身を包み大斧を振り回す<line-break>老傭兵。若いころはバロルと共に戦場を駆けめぐ<line-break>り幾千の功をたてたが、バロルが闇に堕ちると意<line-break>見が衝突し、処刑されかけて出奔する。<line-break>バロル死後にエリュマルク帝に請われ、将軍を<line-break>勤めるも諫言が皇帝の怒りをかい、<line-break>またも処刑されかけて出奔し現在に至る。<line-break>\u3000<end>"
english = "An elderly mercenary in crimson plate mail who wields a great axe. He fought beside Balor, but fled when Balor fell to darkness. After Balor's death, Emperor Eryumark made him a general; his criticism angered the emperor, and he again escaped execution.<end>"

