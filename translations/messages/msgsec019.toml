japanese = "ウルグが愛した人間の少女システィーナ。<line-break>彼女は人間と自然の共生を願い、自然を破壊し、<line-break>精霊たちに残虐行為を働く人間に融和を説いた。<line-break>だが、敵をかばう彼女に怒った人間たちは彼女を<line-break>殺してしまう。彼女の心は飛び散って星になり、<line-break>そして星の光となって人間や妖精族や魔族を<line-break>含めたすべての生き物の中に溶け込み宿る<line-break>ようになった。それがソウルである。<end>"
english = "Urg's beloved human girl. She preached reconciliation between humanity and nature, but humans killed her for defending spirits. Her heart became stars, then starlight dwelling in every human, fairy, and demon. That starlight is the Soul.<end>"

