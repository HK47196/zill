["190009"]
japanese = "破壊神ウルグの円卓騎士のひとり。人間が魔法を<line-break>行使するときに犠牲となった精霊から生まれた。<line-break>気まぐれで残忍な性格。セラの姉シェスターの<line-break>体を乗っ取って復活した。闇の神器忘却の仮面の<line-break>力でロイを下僕にし、また、禁断の聖杯を使って<line-break>魔獣商アンティノに究極の怪物エクリプスを<line-break>創らせて、世界を滅ぼそうとしていたが、<line-break><value:$28>に敗れる。<end>"
english = "A Knight of the Round Table serving Urg, God of Destruction. Born from spirits sacrificed through human magic, she took over Sera's sister Shester. Using the Mask of Oblivion, she enslaved Roy and forced Antino to create Eclipse with the Forbidden Grail. <value:$28> defeated her.<end>"

