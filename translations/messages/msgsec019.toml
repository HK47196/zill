english = "One of Alresia's Seven Kings and cofounder of Magic Kingdom Ladras with Diva. Seeking a godlike superhuman race, he transformed himself into an immortal being of immense magical power. Fearing him, the Dragon King sealed him in the Arcane Tower.<end>"

