["190054"]
japanese = "真紅のプレートメイルに身を包み大斧を振り回す<line-break>老将軍。エリュマルク帝のもとを出奔し、傭兵を<line-break>していたが、ネメアの強さに憧れ、ネメアが帝位<line-break>につくと一兵卒で構わないからと仕官する。<line-break>ネメアは彼を重用し、南方攻略軍総司令官の職を<line-break>与える。朱雀将軍アンギルダンの誕生である。<line-break><line-break>\u3000<end>"
english = "An elderly general in crimson plate mail who wields a great axe. After fleeing Emperor Eryumark, he became a mercenary. Awed by Nemea, he offered his service when Nemea took the throne. Nemea made him supreme commander of the southern campaign: Angeerdan, Vermilion Bird General.<end>"

