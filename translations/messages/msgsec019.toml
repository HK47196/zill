["190299"]
japanese = "かつてネメアと共に魔王バロルを倒した魔術師。<line-break>彼女もネメア同様、オルファウスに拾われ、兄妹<line-break>のように育てられた。彼女は自分と境遇が似てい<line-break>るネメアに、恋愛感情のようなものを抱いていた<line-break>のだが、自分の理想像から離れ、帝位を奪い<line-break>世界統一戦争を起こすなど、血塗られた覇道を<line-break>進んでいくネメアを許せず、それを止めるために<line-break><value:$28>を利用しようとした。<end>"
english = "A mage who helped Nemea defeat Balor and was raised with him by Orphaus. She once loved him, but could not forgive his seizure of the throne, war of unification, and bloody rise to power. She tried to use <value:$28> to stop him.<end>"

