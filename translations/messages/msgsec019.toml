["190094"]
japanese = "天空神ノトゥーンに仕える神官。封士の異名を持<line-break>つ。古代の怪物を封印したり、退治したりしても<line-break>憎しみが連鎖するばかりで解決にならないと主張<line-break>し、古代の怪物イズキヤルを説得し、アルノート<line-break>ゥンの町でともに暮らしていくことで、人間と怪<line-break>物の共存の道を模索していた。<line-break>しかし、旅の少年魔術師によって突然イズキヤル<line-break>が凶暴化し、その追跡中に行方不明となる。<end>"
english = "A priest of Notun known as the Sealer. He believed slaying or sealing ancient monsters only sustained hatred. After persuading Izkiyar to live among Alnortunians, he sought coexistence between humans and monsters. A traveling boy sorcerer drove Izkiyar mad, and Ionz vanished pursuing it.<end>"

