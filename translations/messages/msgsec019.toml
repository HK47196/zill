["190099"]
japanese = "ノトゥーンに仕える神官。怪物と人類の共存を<line-break>唱え、古の怪物イズキヤルとアルノートゥンの<line-break>人々をともに生活させていた。ディンガル帝国<line-break>白虎将軍ジラークのアルノートゥン進攻を前に<line-break>イズキヤルとともに行方不明となった。<line-break>これにより、アルノートゥンは降伏することに<line-break>なる。イオンズ失踪直前、不審な黒髪の少年を<line-break>目撃したという町の人の証言がある。<end>"
english = "A priest of Notun who advocated coexistence between monsters and humanity, and had the ancient monster Izkiyar live among the people of Alnortun. Shortly before White Tiger General Zsilak of the Dingal Empire invaded Alnortun, both Ionz and Izkiyar disappeared. This led Alnortun to surrender. One resident testified to seeing a suspicious black-haired boy shortly before Ionz vanished.<end>"

