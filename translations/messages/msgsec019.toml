["190084"]
japanese = "水の巫女。初代水の巫女ネイの子孫。<line-break>アキュリュース陥落時に水の巫女として覚醒。<line-break>実はアンギルダンと先代の水の巫女ルフェイ<line-break>との間に生まれた子供である。<line-break>心優しく、傷ついたものを見過ごすことが<line-break>できない性格のため、彼女を慕う人は多い。<line-break>そんな彼女の性格は、敵兵にも尊敬された<line-break>父アンギルダン譲りなのかもしれない。<end>"
english = "The Maiden of Water and descendant of Nei, the first Maiden. She awakened when Aqyurius fell. She is the child of Angeerdan and Lufei, the previous Maiden. Her kindness leaves her unable to ignore anyone in need, a trait perhaps inherited from Angeerdan.<end>"

