english = "Head of the Inscription Order, which controls the Angels of Death, a band of assassins. Acting on Eryumark's orders, Nemea abducted his elder sister Iz. Traumatized by his failure to protect her, Elfas surrendered to darkness. Shalli preyed on his regret and led him to seek absolute power. In the end, he was turned into a “god” with absolute power who obeyed Shalli's every command.<end>"

