japanese = "エリス王妃の密偵を務める双子姉妹の姉のほう。<line-break>ツェラシェルの妹。伝令から、密偵、調略まで<line-break>なんでもこなす。また戦ってはすばやい動きで<line-break>敵を翻弄し、闘技場でもかなり上にランキング<line-break>されている実力者である。<line-break>冷静かつ怜悧な性格はサファイアに例えられる<line-break>が、兄想いな性格で、こと兄のことになると<line-break>冷たい人形の仮面が外れるときがある。<end>"
english = "The elder of twin sisters serving as Queen Eris's spies, and Tzerashel's younger sister. She handles courier work, espionage, and subversion. Her swift combat ranks highly in the arena. Cool and keen as a sapphire, she nevertheless cares deeply for her brother.<end>"

