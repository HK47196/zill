japanese = "破壊神ウルグの円卓の騎士のひとり。バルザーと<line-break>並ぶ実力者で、アーギルシャイア、アスティア、<line-break>マゴス、ネモらを率いる。<line-break>虚無と闇のはざまと、現世とを結ぶ闇の門を<line-break>開くことができる。<line-break>虚無に落ちた破壊神ウルグの魂は、この門を<line-break>通って現世に戻る。<line-break>\u3000<end>"
english = "One of the Knights of the Round Table serving Urg, the God of Destruction. A warrior equal to Baltzer, Vashtar commands Argyleshire, Astia, Magos, Nemo, and others. Vashtar can open the Gate of Darkness, which connects the mortal world to the boundary between the Void and darkness. The soul of Urg, the God of Destruction, can return from the Void to the mortal world through this gate.<end>"

