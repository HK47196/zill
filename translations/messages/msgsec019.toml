["190004"]
japanese = "破壊神ウルグの円卓騎士のひとり。<line-break>闇の神器忘却の仮面の守護者で、気まぐれで<line-break>残酷な性格。ミイスの村を襲って神器の神殿<line-break>に封印されていた忘却の仮面を取り戻す。<line-break>忘却の仮面をかぶったものは強大な力とひきかえ<line-break>に記憶を失い、アーギルシャイアの操り人形<line-break>として利用されてしまう。究極モンスターを創り<line-break>出すために禁断の聖杯を探している。<end>"
english = "A Knight of the Round Table serving Urg, God of Destruction. Capricious and cruel, she guards the Mask of Oblivion, a Dark Artifact. She attacked Miis Village, reclaimed the mask from the Temple of Artifacts, and seeks the Forbidden Grail to create the ultimate monster.<end>"

