english = "One of three Goblins who gained the power of human speech from the Forbidden Grail's magic when they stole the Dark Artifact. Speaking like humans did not make them clever, since they were Goblins to begin with. He is a coward who likes to put on a brave front. He leads Maroon and Ornat as head of the Gobgob Gang. The stylish scarf around his neck is his most charming feature.<end>"

