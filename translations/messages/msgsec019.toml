japanese = "ヴィアリアリの双子の姉。ヴィアリアリの他には<line-break>家族のない天涯孤独の身でヴィアリアリとより<line-break>そうようにして助け合って生きてきた。<line-break>クーデター前はエリス王妃の下で密偵をしており<line-break>カルラ軍中に「ネメア死す」の流言をばらまいて<line-break>ゼネテス率いるロストール軍の勝利に貢献した。<line-break>直情的な妹に対し、冷静で慎重な性格をしており<line-break><value:$28>にも礼儀正しい対応を心がける。<end>"
english = "Vialiali's elder twin sister. Before the coup, she served Queen Eris as a spy and helped Xenetes's army by spreading word of Nemea's death through Karula's forces. Unlike her impulsive sister, she is calm and cautious, and treats <value:$28> courteously.<end>"

