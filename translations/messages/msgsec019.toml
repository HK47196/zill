["190029"]
japanese = "破壊神ウルグの円卓の騎士のひとり。魔物使い。<line-break>破壊神ウルグの復活の時を知り開け放つもの<line-break>を復活させる使命を持つ。オズワルドの町で開<line-break>け放つものの糧となるべき人間を飼っていた。<line-break>永遠に続く闇と光の争いに疲れており、１６年前<line-break>に捨て子を拾ってからは自分の使命に疑問を持ち<line-break>開け放つものの目覚めを拒んだため開け放<line-break>つものによって処刑される。<end>"
english = "A Knight of the Round Table serving Urg, God of Destruction. A monster tamer, she knew of Urg's return and was charged with reviving the Opener. In Oswald, she kept humans as the Opener's sustenance. After refusing to awaken it, she was executed by it.<end>"

