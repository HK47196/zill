["190019"]
japanese = "ロストールの騎士の娘。剣技に優れている彼女は<line-break>実力があれば女でも騎士になれるディンガル帝国<line-break>に仕官する。青竜将軍カルラ旗下での活躍と<line-break>本人の一生懸命さをカルラに評価され、<line-break>副官を勤めることになる。<line-break>味方にとってふたりは戦女神だが、敵にとっては<line-break>死神姉妹である。<line-break>\u3000<end>"
english = "Daughter of a Rostorl knight and a gifted swordswoman. She joined the Dingal Empire, where ability lets women become knights. Azure Dragon General Karula made her an aide. Together, they are goddesses of war to allies and the Sisters of Death to enemies.<end>"

