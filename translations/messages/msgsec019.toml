["190319"]
japanese = "胎内に巣くう円卓騎士マゴスに操られるまま、<line-break>エンシャント全住民のソウルを奪い、<line-break>ゾフォルやシャリ、闇の王女たちの<line-break>世界を虚無に帰すための計画に協力した。<line-break><value:$28>によってマゴス共々<line-break>倒されたが、奪われたソウルが戻って<line-break>くることは無かった。<line-break><end>"
english = "Under the control of Magos, the Knight of the Round Table dwelling in her womb, she stole the Souls of every resident of Ancient and assisted Zophor, Shalli, and the Princesses of Darkness in their plan to return the world to the Void. <value:$28> defeated both her and Magos, but the stolen Souls never returned.<end>"

