["190314"]
japanese = "ディンガル帝国の内政を司どっていた将軍。<line-break>胎内に巣くう円卓騎士マゴスに操られるまま、<line-break>宰相ベルゼーヴァを排除し、帝位に就く。<line-break>「ザギヴが将来ディンガルを支配する」という<line-break>妖術宰相ゾフォルの預言が的中したのである。<line-break>ザギヴは、エンシャント全住民のソウルを奪い<line-break>ゾフォルやシャリ、闇の王女たちの<line-break>世界を虚無に帰すための計画に協力する。<end>"
english = "A Dingal general controlled by Magos, the Knight of the Round Table in her womb. She removed Beelzeva and ascended the throne, fulfilling Zophor's prophecy. She stole Ancient's Souls and aided Zophor, Shalli, and the Princesses of Darkness in returning the world to the Void.<end>"

