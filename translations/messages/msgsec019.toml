["190324"]
japanese = "ザギヴはゾフォルに「ディンガルを支配する」と<line-break>預言されていた。それは彼女の体の中にいる魔人<line-break>「棲み付くもの」破壊神の騎士マゴスに体を乗っ<line-break>取られ、その恐怖でディンガルを覆うことに他な<line-break>らなかった。ザギヴは自らの運命におびえていた<line-break>が、<value:$28>とともに旅をするうちに<line-break>運命と対決することを決意し、自らを縛る運命と<line-break>胎内に巣くうマゴスに打ち勝った。<end>"
english = "Zophor's prophecy that Zagiv would rule Dingal meant Magos, the Indweller, would seize her body and terrorize the empire. Fearing this fate, she resolved to confront it while traveling with <value:$28>. She overcame both destiny and Magos within her womb.<end>"

