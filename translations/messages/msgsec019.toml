["190024"]
japanese = "ロストールの騎士の娘。剣技に優れている彼女は<line-break>実力があれば女でも騎士になれるディンガル帝国<line-break>に仕官し、青竜将軍カルラ旗下で副将となった<line-break>だが、対ロストール戦で、<value:$28>に<line-break>死を覚悟して一騎打ちを挑むも、逃げられ、<line-break>それから剣を振ることの意味を考えるようになる<line-break>ディンガル副将の職を辞し、<value:$28>の<line-break>かたわらで、現在、その意味を模索中である<end>"
english = "Daughter of a Rostorl knight and gifted swordswoman. She became Karula's deputy commander in the Dingal Empire. During the war with Rostorl, she challenged <value:$28>, but the opponent fled. She left Dingal to seek the meaning of wielding a sword at <value:$28>'s side.<end>"

