japanese = "ネメア死すの報を受けたジラークは、コーンス族<line-break>による世界支配を目指しアルノートゥンで反乱を<line-break>起す。魔力を増幅する鉱石聖光石があれば、<line-break>数で劣るコーンス族にも勝機があると考えたので<line-break>ある。しかし、その夢が叶うことは無かった。<line-break>警備の隙を突かれたジラークは、刺客の刃に倒れ<line-break>コーンス族の反乱はあっけなく鎮圧されることに<line-break>なったのである。<end>"
