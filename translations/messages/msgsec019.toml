japanese = "エリス王妃の密偵を務める双子姉妹の妹のほう。<line-break>調略全般から伝令までこなし、フリント亡きあと<line-break>エリス配下の密偵中で一番の実力を誇っている。<line-break>ツェラシェルの妹。兄想いの性格で、兄の危機に<line-break>は何をさしおいても駆けつける。<line-break>クールで冷静な姉に対してルビーに例えられる。<line-break>直情的でキツい性格をしているが、体の弱い兄を<line-break>心配しているというやさしい面を持っている。<end>"
english = "The younger of Queen Eris's twin-sister spies. She handles subversion and courier work and, since Flint's death, is Eris's most capable agent. Tzerashel's younger sister, she rushes to his side whenever he is in danger. Impulsive and sharp-tempered, she is also gentle and worries about her frail brother.<end>"

