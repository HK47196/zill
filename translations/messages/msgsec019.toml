japanese = "リベルダムの有力商人ロティの娘。<line-break>豪商の娘らしく気位が高くて、わがままである。<line-break>父親を暗殺した犯人が、<value:$28>だと、<line-break>父の親友アンティノに聞かされ、何の疑いもなく<line-break>それを信じる。それゆえ父親の仇を討つために、<line-break><value:$28>を狙う。<line-break>\u3000<line-break>\u3000<end>"
english = "The daughter of Lottie, a prominent merchant in Liberdam. As befits the daughter of a wealthy merchant, she is proud and spoiled. Antino, her father's closest friend, told her that <value:$28> assassinated her father, and she believed him without question. She therefore targets <value:$28> to avenge her father.<end>"

