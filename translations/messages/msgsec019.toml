["190034"]
japanese = "ロストールの先王フェロヒアの娘。<line-break>先王死去のおりには母の胎内にいたので、<line-break>王位は先王の弟セルモノーが継いだ。<line-break>彼女は生まれつき病弱で盲目のため、<line-break>政争に巻き込まれることもなく<line-break>王宮の隅でひっそりと暮らしている。<line-break>暗闇の中、ただひとりで。<line-break>\u3000<end>"
english = "Daughter of Ferohia, the former king of Rostorl. She was still in her mother's womb when the king died, so the throne passed to his younger brother, Selmono. Frail and blind from birth, she has escaped the kingdom's political struggles and lives quietly in a corner of the royal palace. All alone in her blindness.<end>"

