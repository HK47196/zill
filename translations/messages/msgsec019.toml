["190074"]
japanese = "リベルダムの有力者。モンスターを軍用に改造し<line-break>各国間に戦争をあおって巨利を得ていた。リベル<line-break>ダムにカルラが迫ると、内通し、地位を保とうと<line-break>したが、カルラに裏切られ、逃亡する。その後、<line-break>魔人アーギルシャイアにさらわれ、究極生物エク<line-break>リプスの開発をさせられる。アーギルシャイアが<line-break>倒された後も失踪して開発を続け、エクリプスを<line-break>完成させたが、その下敷きになって死亡した<end>"
english = "A Liberdam arms merchant who profited from weaponized monsters and war. When Karula closed in, he secretly aided her, but she betrayed him. Argyleshire then forced him to develop Eclipse, the Ultimate Life-Form. He completed Eclipse, only to be crushed to death beneath it.<end>"

