["190159"]
japanese = "ウルグの円卓騎士と呼ばれる１２人の魔人を率い<line-break>破壊をほしいままにする闘神。天空神ノトゥーン<line-break>の次男として生まれ、人間を率い闇の聖母と戦う<line-break>が、彼が愛した少女システィーナを人間に殺され<line-break>たため、彼女の復活を条件に闇の聖母に降った。<line-break>強大な力を持つウルグは、兄である主神バイアス<line-break>を殺し世界を闇で覆ったが異世界から召還された<line-break>軍神ソリアスとの戦いで肉体を失い眠りにつく。<end>"
english = "God of battle who commands Urg's twelve Knights of the Round Table. Notun's second son, he fought the Dark Mother until humans killed Sistina, whom he loved. He joined the Dark Mother to restore her, killed his brother Bias, and shrouded the world in darkness. Defeated by Sorias, he fell into Sleep.<end>"

