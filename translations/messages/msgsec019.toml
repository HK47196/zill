japanese = "妖術宰相ゾフォルの「ザギヴが将来ディンガルを<line-break>支配する」という予言に、バロルは彼女を捕らえ<line-break>ウルグの円卓騎士マゴスの餌食にしようとした。<line-break>ネメアがバロルを倒したおかげで命は助かったが<line-break>マゴスはすでに彼女の胎内に入り込み、巣くって<line-break>しまっていた。その後、彼女はさらに強力な<line-break>魔道士となり、ネメアが帝位につくと玄武将軍に<line-break>任じられ、ディンガル帝国の内政を統括する。<end>"
english = "After Zophor prophesied that Zagiv would rule Dingal, Balor captured her for Magos. Nemea saved her, but Magos had entered her womb. Later, Nemea made her Black Tortoise General and placed her in charge of Dingal's domestic affairs.<end>"

