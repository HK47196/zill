["190044"]
japanese = "ロストール王国の王女。<line-break>ロストールの先々王フェロヒアの娘。<line-break>セルモノー没後王位を継承し、国事を司る。<line-break>開かれた政治をめざし、エリエナイ邸で、<line-break>ロストールの体制を市民と共に立て直そうと<line-break>活動している。<line-break>字の読み書きと料理も勉強中である。<line-break>\u3000<end>"
english = "Princess of the Kingdom of Rostorl and daughter of Ferohia, the king before last. She succeeded to the throne after Selmono's death and now governs the kingdom. Seeking more open government, she works from the Elienai residence alongside the citizenry to rebuild Rostorl's political system. She is also learning to read, write, and cook.<end>"

