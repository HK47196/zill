japanese = "システィーナの伝道師と呼ばれるウルグ復活<line-break>を目論む秘密結社のメンバー。<line-break>次元に穴をあけ、空間をねじ曲げる能力を持つ。<line-break>卑劣な性格で、手段を選ばない。<line-break>ゼグナ鉱山で闇の神器を探索中、ネメアと遭遇。<line-break>倒されかけるが、人質を取り、これを助けようと<line-break>したネメアを次元のはざまに落とした。<line-break>\u3000<end>"
english = "A member of the secret society known as the Missionaries of Sistina, which seeks to resurrect Urg. He can tear holes in dimensions and warp space. Devious and utterly unscrupulous, he encountered Nemea while searching Zegna Mine for a Dark Artifact. On the verge of defeat, he took a hostage and cast Nemea, who tried to save the captive, into the Interdimensional Rift.<end>"

