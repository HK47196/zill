["190164"]
japanese = "風の巫女、同時にエルズの支配者。<line-break>魔道王国ラドラス最後の巫女たちのひとり、<line-break>風の巫女エアの末裔。天地千年を見通す水晶球を<line-break>持っており、過去と未来千年のできごとであれば<line-break>知ることができる。<line-break>エルズの町の奥にある翔王のすみか竜の座で<line-break>風の精霊神に仕えている。<line-break>\u3000<end>"
english = "The Maiden of Wind and ruler of Elz. She is a descendant of Er, the Maiden of Wind and one of the last maidens of Magic Kingdom Ladras. Her crystal ball sees a thousand years across heaven and earth, allowing her to know events up to a thousand years in the past or future. She serves the Spirit God of Wind at the Dragon's Seat, the Soaring King's abode deep within Elz.<end>"

