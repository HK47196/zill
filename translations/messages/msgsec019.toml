japanese = "アルノートゥンの天経院にあるクリスタルに<line-break>封印されていた元「無限のソウルの持ち主」。<line-break>イーシャを助けるため闇の神器・同化の髪飾りを<line-break>使うが、自らの無限のソウルを犠牲にしたため、<line-break>クリスタルに封印されていた。<value:$28><line-break>とイーシャに助けられた後は、行動を共にする<line-break>ようになる。テジャワの変にも大きく関わり、<line-break>ティアナによくなつかれていた。<end>"
