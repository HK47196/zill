["190064"]
japanese = "リベルダムの有力者で武器商人。<line-break>兵器モンスター開発の第一人者。<line-break>いつも、いやらしい愛想笑いを浮かべている。<line-break>親友のロティと共にディンガル帝国と東方国家の<line-break>間に争いの火種をまいて武器や兵器モンスターを<line-break>売りさばき、大金を得ている。<line-break><line-break>\u3000<end>"
english = "An influential figure in Liberdam and an arms merchant. The foremost authority on developing weaponized monsters. He always wears an unpleasant, ingratiating smile. Together with his close friend Lottie, he sows conflict between the Dingal Empire and the eastern nations, then makes a fortune selling weapons and weaponized monsters.<end>"

