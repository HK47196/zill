["190059"]
japanese = "真紅のプレートメイルに身を包み大斧を振り回す<line-break>ディンガル帝国の朱雀将軍。<line-break>朱雀軍を率いて、不可能と言われた分断の<line-break>山脈越えを成功させる。この史上初の快挙は、<line-break>アンギルダンの山越えとして史書に記される<line-break>こととなる。しかし、ロストール軍を大敗させて<line-break>油断したところをゼネテスに急襲され、<line-break>朱雀軍は壊滅する。<end>"
english = "Dingal's Vermilion Bird General, clad in crimson plate mail and wielding a great axe. He led his army across the Dividing Mountains, a feat remembered as Angeerdan's Mountain Crossing. After crushing Rostorl's army, Xenetes surprised him and annihilated the Vermilion Bird Army.<end>"

