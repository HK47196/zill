["2450001"]
japanese = "妖術宰相の隠れ家にようこそ…。<line-break>何も出せんが<line-break>まあ、ゆっくりしていくといい。<end>"
english = "Welcome to the Sorcerous Chancellor's hideaway. I have nothing to offer you, but do make yourself at home.<end>"

["2450002"]
japanese = "ほう。自分が何者かを知りたいとな？<line-break>フォッフォッフォッ…。<line-break>それこそ徒労というものじゃ。<line-break>自分の出自や記憶を知ったところで、<line-break>人は誰しも運命にはあらがえぬ。<line-break>受け入れ、流されることしかできぬ。<line-break>それがたとえ、<line-break>作られた運命であったとしてもな。<end>"
english = "Oh? You wish to know who you are? Ho ho ho... A futile pursuit. Finding out about your origins or your memories will do you no good. No one can defy fate. All anyone can do is accept it and be swept along, even if that fate was fashioned.<end>"

["2450003"]
japanese = "フォッフォッフォッ…。<line-break>どういう意味か…じゃと？<line-break>\u3000<line-break>無知たることのなんと幸せなことよ…<line-break>お前を見ておると、<line-break>つい、そう思ってしまうわ。<line-break>その存在を知らぬ者にとっては、<line-break>運命も、人の世の因果も<line-break>あってなきがごとしなのかもしれん。<end>"
english = "Ho ho ho... You ask what I mean? Ah, what bliss there is in ignorance. Looking at you, I cannot help but think so. To anyone unaware of its existence, perhaps fate and the chain of cause and effect in the world of men might as well not exist.<end>"

