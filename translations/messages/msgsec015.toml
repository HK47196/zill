["150000"]
japanese = "<select><value:$20>%2アミラルはエルズやリベルダムとの交易で<line-break>栄えている交易都市なんだ。<end>海賊の親分といえばカンダカンが<line-break>有名なんだけど、最近は名前を聞かなく<line-break>なったよ。死んじまったのかな？<end>"
english = "<select><value:$20>%2Amiral is a trading city that has prospered through trade with Elz and Liberdam.<end>Kandakan is the best-known pirate chief, but I haven't heard his name lately. Think he's dead?<end>"

["150001"]
japanese = "<if><value:$2A><less-equal>%49私はアミラル自警団の団員です。<line-break>自警団はモンスターや海賊から町を守るために<line-break>結成されました。<line-break>王都ロストールでは貴族たちが権力争いに夢中で<line-break>なにもしてくれませんから、自分たちの町は<line-break>自分たちで守るしかないのです。<end><if><value:$2A><less-equal>%100街道で暴れるモンスターが、<line-break>だんだん凶暴になっていませんか？<line-break>私の気のせいですかね…。<end><if><value:$2A><less-equal>%130あなたが有名な<value:$28>さんですか。<line-break>ぜひ、自警団に入団してもらえませんか？<line-break>あなたが一緒なら恐いものなしですよ。<end>海は平和になりつつありますが、<line-break>陸の上はちっとも平和になりませんね。<line-break>なんとかならないものですかね。<end>"
english = "<if><value:$2A><less-equal>%49I'm a member of the Amiral vigilante corps. The corps was formed to defend the town from monsters and pirates. The nobles in the royal capital of Rostorl are too busy fighting among themselves for power to lift a finger, so we have no choice but to protect our town ourselves.<end><if><value:$2A><less-equal>%100Aren't the monsters rampaging along the roads getting more vicious? Or is it just me...<end><if><value:$2A><less-equal>%130Are you the famous <value:$28>? Would you consider joining the vigilante corps? With you beside us, we'd have nothing to fear.<end>The seas are growing more peaceful, but there's no peace at all on land. Can't something be done?<end>"

["150002"]
japanese = "<select><value:$33>我らが自警団あるかぎり、<line-break>モンスターだろうが海賊だろうが<line-break>アミラルで好き放題にはさせないぜ。<end>我ら自警団あるかぎり、<line-break>モンスターだろうが海賊だろうが<line-break>アミラルで好き放題にはさせないぜ。<end>ワッシャー海賊の勢いがなくなったおかげで、<line-break>雑魚海賊どもがウヨウヨ出てきやがった。<line-break>まとまりがないだけに対処に困るよ。<end>ワッシャー海賊は、フゴーの船しか襲わないから<line-break>対処しやすかったのだがな。<line-break>もっともどんなに防備を固めても破られたがね。<end>ワッシャーは刃向かうものには容赦しないが、<line-break>黙って積み荷を渡せば何もしなかった。<line-break>だが、最近の海賊は殺しを楽しんでやがる。<end>数年前、漁をしていたらシービショップに\u3000\u3000<line-break>襲われてな、もうダメかと思ったときに<line-break>ワッシャー海賊が現れて助けてくれた。<line-break>俺は海賊は大嫌いだが、カンダカンは好きだ。<line-break>先頭に立って戦う彼の勇姿が忘れられねえよ。<end>カルラ軍が攻めてきたら、<line-break>俺たち自警団でも防ぎようがないぜ。<line-break>総司令のゼネテスにすべてを託すしかないな。<end>世界を混乱させた張本人が死んだら、<line-break>これからどうなってしまうんだ！<line-break>せめてアミラルだけでも平和な町にするぜ。<end>"
english = "<select><value:$33>As long as our vigilante corps stands, no monster or pirate is going to run wild in Amiral.<end>As long as our vigilante corps stands, no monster or pirate is going to run wild in Amiral.<end>Now that the Washer Pirates have lost their edge, small-time pirate scum are crawling out of the woodwork. They're harder to deal with because there's no order among them.<end>The Washer Pirates were easier to handle because they only attacked Hugo's ships. Not that any amount of fortification ever stopped them.<end>The Washer Pirates showed no mercy to anyone who resisted, but if you handed over the cargo without a fight, they left you alone. These new pirates kill for sport.<end>A few years back, I was out fishing when a Sea Bishop attacked me. Just when I thought I was done for, the Washer Pirates appeared and saved me. I hate pirates, but I like Kandakan. I'll never forget the sight of him leading the charge.<end>If Karula's Army attacks, even our vigilante corps won't be able to stop it. All we can do is put everything in Commander-in-Chief Xenetes's hands.<end>If the one responsible for throwing the world into chaos dies, what will happen then? At least I'll make Amiral a peaceful town.<end>"

["150003"]
japanese = "<select><value:$20>%2これはね、海王様の像なの。<line-break>海王様は海の守り神なのよ。<end>王都から遠く離れたアミラルが<line-break>こんなに平和なのは、自警団の人たちが<line-break>守ってくれているからなのよ。<end>"
english = "<select><value:$20>%2This is a statue of the Sea King. The Sea King is the guardian god of the sea.<end>Amiral may be far from the royal capital, but it's this peaceful because the vigilante corps protects it.<end>"

["150004"]
japanese = "<select><value:$20>%4今日の夕食は何にしようかしら…。<end>シールミア貝のフライがいいかな？<end>とれたての新鮮な魚介類で、<line-break>シーフード・サラダがいいかもね。<end>ロームルエビのパスタもおいしいのよね。<end>"
english = "<select><value:$20>%4What should I make for dinner tonight...<end>Maybe fried Sealmia clams?<end>Or perhaps a seafood salad with fresh-caught fish and shellfish.<end>Pasta with Romul shrimp is delicious too.<end>"

["150005"]
japanese = "<select><value:$20>%3魚や貝ばかりじゃヤダよ～。<line-break>お母さん、ビーフシチューがいいよぉ。<end>うちのお母さんって毎日悩んでるのよ。<line-break>今日の夕食は何にしようかしら？\u3000ってね。<end>買い物に出かけてから、<line-break>すっごく時間がたってるよぉ。<line-break>お母さん、またお婆ちゃんに怒られちゃう。<end>"
english = "<select><value:$20>%3I'm sick of nothing but fish and shellfish! Mom, I want beef stew.<end>My mom worries about the same thing every day: “What should I make for dinner tonight?”<end>Mom's been out shopping forever. Grandma's going to scold her again.<end>"

["150006"]
japanese = "<select><value:$20>%2自警団員として今日も町の平和を<line-break>守っています。今のところ異常は<line-break>ありません。平穏そのものです。<end>キャプテン・カンダカン率いるワッシャー海賊が<line-break>このところ元気ないですね。昔は毎日のように<line-break>フゴー商会の船を襲っていたのに…。<line-break>も、もちろん海が平和なのはけっこうな<line-break>ことなんです。でも、ライバルがいないと<line-break>自警団としては張り合いがなくて。<end>"
english = "<select><value:$20>%2As a member of the vigilante corps, I'm keeping the town safe today as always. Nothing unusual to report so far. Everything is perfectly peaceful.<end>The Washer Pirates under Captain Kandakan haven't been very active lately. They used to attack ships belonging to the Hugo Trading Company almost every day... O-of course, peaceful seas are a good thing. It's just that without a rival, the vigilante corps has no one to measure itself against.<end>"

["150007"]
japanese = "<if><value:$2C><less-equal>%9魔法を使えるようになりたかったら、<line-break>まず探求心Ｓｅａｒｃｈを高めるのです。<line-break>ウォーロックのソウルが宿るはずです。<line-break>もっとも、あなたの精霊力レベルが<line-break>精霊を操るに足るレベルでなければ<line-break>魔法は使えないのですが…。<end><if><value:$2C><less-equal>%29私の現在のソウルはグロウファイターですが、<line-break>ロースペルのスキルを習得しているので<line-break>魔法を使うことができます。<line-break>あなたも気に入ったスキルがあれば<line-break>習得しておくといいですよ。<line-break>特に魔法のスキルは役にたつはずです。<end><if><value:$2C><less-equal>%49魔法は相手の属性を考えて使うものですよ。<line-break>火属性のモンスターに水属性の魔法なんて<line-break>問題外です。<end>すべての魔法スキルを習得した者が<line-break>次に目指すのは禁呪だそうです。<line-break>あなたも探してみますか？<end>"
english = "<if><value:$2C><less-equal>%9If you want to use magic, first raise your inquisitiveness, Ｓｅａｒｃｈ. The Warlock Soul should awaken within you. Of course, you still won't be able to cast magic unless your spirit-power level is high enough to command spirits...<end><if><value:$2C><less-equal>%29My current Soul is Grow Fighter, but I can use magic because I've learned the Low Spell skill. If you find a skill you like, you should learn it. Magic skills in particular are sure to prove useful.<end><if><value:$2C><less-equal>%49You must consider your opponent's element when using magic. Water-element magic against a Fire-element monster is out of the question.<end>Once every magic skill has been mastered, the next goal is said to be a Forbidden Spell. Would you like to search for one?<end>"

["150008"]
japanese = "<if><value:$2C><less-equal>%9アミラルの西と東の森はそれぞれ\u3000\u3000<line-break>シェーヌの森とミューンの森と<line-break>呼ばれているんだ。<line-break>どちらの森にもエルフが住んでいる<line-break>という噂だけど、俺は見たことないね。<end><if><value:$2C><less-equal>%29アミラルの東にある幻惑の洞窟に\u3000<line-break>行ったことはあるのかい？<line-break>コロル石を採取できる洞窟なんだ。<line-break>迷路のようになっているけど、<line-break>あんたくらい強ければモンスターに<line-break>やられることもないだろう。<end><if><value:$2C><less-equal>%49あんたくらい強ければ、<line-break>どんどん西を目指しても大丈夫だろ。<line-break>未開の森の奥には何があるのかな。<end>西の海は危険だらけで船が出せない。<line-break>しぶきの群島を目指した船は<line-break>たいてい難破しているみたいなんだ。<end>"
english = "<if><value:$2C><less-equal>%9The forests west and east of Amiral are called Chene Forest and Myun Forest, respectively. Rumor has it that Elves live in both, but I've never seen one.<end><if><value:$2C><less-equal>%29Have you ever been to the Bewildering Cave east of Amiral? You can mine Korol Stone there. It's like a maze, but someone as strong as you shouldn't have to worry about the monsters.<end><if><value:$2C><less-equal>%49Someone as strong as you should be fine heading farther west. I wonder what's deep inside the Uncharted Forest.<end>The western sea is so dangerous that ships can't sail there. It seems most vessels bound for the Spray Archipelago end up wrecked.<end>"

["150009"]
japanese = "<if><value:$2C><less-equal>%15若いころは腕利き冒険者として活躍しておった\u3000<line-break>わしも、今は自警団の団員として日夜、<line-break>アミラルの平和を守っておるのじゃ。<line-break>冒険者だったころの知識とスキルを<line-break>活かして、自警団でも大活躍するぞい。<line-break>スキルはたくさん習得しておいて損はないわい。<end><if><value:$2C><less-equal>%25モンスターを相手にするときは、<line-break>冒険者時代の経験が役に立つのじゃ。<line-break>弱点、属性を知っておるからのう。<end><if><value:$2C><less-equal>%35自警団は軍隊と違って装備品を<line-break>指定されないのがいいところじゃな。<line-break>斧以外の武器なんぞ考えられんからのう。<end>属性を固定された武器には注意せい！<line-break>戦闘中に、武器を持ちかえることは<line-break>できないのじゃからな。<end>"
english = "<if><value:$2C><less-equal>%15In my younger days, I was a skilled adventurer. Now I serve in the vigilante corps, protecting Amiral day and night. I put the knowledge and skills from my adventuring days to good use in the corps too. It never hurts to learn plenty of skills.<end><if><value:$2C><less-equal>%25My adventuring experience serves me well against monsters. I know their weaknesses and elements.<end><if><value:$2C><less-equal>%35Unlike the army, the vigilante corps doesn't dictate our equipment. I couldn't imagine wielding anything but an axe.<end>Beware weapons with a fixed element! You cannot change weapons in the middle of battle.<end>"

["150010"]
japanese = "<select><value:$20>%3アムドゥシアスのソウルを宿すためには<line-break>野生Ｗｉｌｄが低くないとダメなんだよぉ。<line-break>野蛮な吟遊詩人なんてきれいじゃないもんね。<end>きれいは目には見えない。心で感じるんだ。<line-break>師匠がよく言ってたけど、難しすぎて<line-break>ボクにはわからないなぁ…ララッラン。<end>宿屋の別館を破壊した女の子は<line-break>どうしたのかな？<line-break>宿屋でただ働きさせられていたけど。<end>"
english = "<select><value:$20>%3For the Soul of Amdusias to dwell within you, your Ｗｉｌｄ has to be low. A savage bard isn't beautiful, you know.<end>Beauty can't be seen. You feel it with your heart. My master used to say that all the time, but it's too hard for me to understand... La-la-lan.<end>I wonder what happened to the girl who destroyed the inn's annex. She was being made to work at the inn for no pay.<end>"

["150011"]
japanese = "<select><value:$33>ワッシャー海賊は、フゴー商会の船だけを襲う<line-break>ことで有名な海賊だ。素直に積み荷を渡せば<line-break>命までは取られないが、刃向かうと容赦がない。<end>ワッシャー海賊は、フゴー商会の船だけを襲う<line-break>ことで有名な海賊だ。素直に積み荷を渡せば<line-break>命までは取られないが、刃向かうと容赦がない。<end>エルズの船員が海王を見たって騒いでいたよ。<line-break>竜王が覚醒して、大地震が起きたり、<line-break>海王が現れたり…近頃、おかしなことばかりだ。<end>ロセンの港が解放された記念に、<line-break>次の航海ではロセンへ行くぞ。<line-break>準備をしておけよ。<end>ロセンの…たしかカルラとか言ったか、<line-break>あれはかなりのやり手だな。<line-break>段取りのよさには驚かされたよ。<end>リベルダムの破壊はどの程度なのだ。<line-break>港は使用できるのか！？<line-break>カルラめ！\u3000なんてことをしてくれるのだ！<end>ロセンへ直行する。<line-break>水や食料の補給を多めにしておけよ。<line-break>傭兵も屈強な者を雇っておけ。<end>竜王の島付近を航海するたびに、<line-break>鬼気を感じるのだが…。<line-break>お前はどうだ？<end>"
english = "<select><value:$33>The Washer Pirates are notorious for attacking only ships belonging to the Hugo Trading Company. Surrender the cargo quietly and they'll spare your life, but resist and they'll show no mercy.<end>The Washer Pirates are notorious for attacking only ships belonging to the Hugo Trading Company. Surrender the cargo quietly and they'll spare your life, but resist and they'll show no mercy.<end>A sailor from Elz was making a fuss about seeing the Sea King. The Dragon King has awakened, great earthquakes have struck, and the Sea King has appeared... Nothing but strange happenings lately.<end>To celebrate Rocen's port being liberated, we'll sail for Rocen on our next voyage. Make ready.<end>That Karula in Rocen... if I've got the name right, is extremely capable. I was amazed at how smoothly everything was arranged.<end>How badly was Liberdam damaged? Can the port still be used!? Damn that Karula! What has she done?<end>We'll sail straight to Rocen. Take on extra water and provisions, and hire some sturdy mercenaries.<end>Whenever we sail near the Dragon King's Isle, I sense a dreadful presence... Do you feel it too?<end>"

["150012"]
japanese = "<select><value:$33>船長、今度のリベルダム行きの積み荷は<line-break>まさか、フゴー商会のじゃないですよね？<line-break>えっ！\u3000そのまさかなんですか…トホホ。<end>船長、今度のリベルダム行きの積み荷は<line-break>まさか、フゴー商会のじゃないですよね？<line-break>えっ！\u3000そのまさかなんですか…トホホ。<end>海王ってのは広場に建っている<line-break>像のモデルですね。<line-break>まさか、人を襲ったりしないですよね？<end>はっ！<line-break>航路の確認をしておきます。<line-break>しかし積み荷はあるんですかね。<end>カルラ将軍はリベルダムにあるような<line-break>闘技場も建設しているみたいですよ。<end>自由都市リベルダムの面影はどこにも\u3000<line-break>ないそうです。大商人たちはロセンへ<line-break>引っ越したと聞きますし…。<line-break>港も、もはや使用できないと思います。<line-break>船長、これからどうします？<end>はっ！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>早急に手配しておきます。<line-break>\u3000<line-break>しかし、いくら戦争で陸路が使えないからって<line-break>物資が海路に集中すると、海賊やモンスターが<line-break>原因で物資の流れが滞る心配がありますね。<end>えっ！\u3000船長もですか！<line-break>やはり世界の混乱ぶりに、<line-break>竜王様が怒っているのでしょうか…。<end>"
english = "<select><value:$33>Captain, the cargo for our next voyage to Liberdam isn't from the Hugo Trading Company, is it? What? It is? Oh, misery...<end>Captain, the cargo for our next voyage to Liberdam isn't from the Hugo Trading Company, is it? What? It is? Oh, misery...<end>The Sea King is the one that statue in the square depicts, right? The Sea King doesn't attack people... right?<end>Yes, captain! I'll check the route. But do we even have any cargo?<end>It seems General Karula is also building an arena like the one in Liberdam.<end>I hear nothing remains of Free City Liberdam as it once was. The great merchants have apparently moved to Rocen... I doubt the port can be used anymore. What do we do now, captain?<end>Yes, captain! I'll make the arrangements at once. Still, with the war making overland routes unusable, concentrating supplies on sea routes could leave the flow of goods vulnerable to disruption by pirates and monsters.<end>What? You too, captain? Perhaps the Dragon King is angry at the chaos engulfing the world...<end>"

["150013"]
japanese = "<if><value:$2C><less-equal>%9わっ！\u3000ビックリさせないでおくれよ。<line-break>どうしたんだい？<line-break>何か用なのかい？<end><if><value:$2C><less-equal>%29今でこそ平和な町だけど、<line-break>自警団ができるまでは大変だったよ。<line-break>昼間からモンスターがうろついていたからね。<end><if><value:$2C><less-equal>%49こうして窓から外を見ていると安心するよ。<line-break>昔は子供のかわりにモンスターが走り回って<line-break>いたからね。平和になったもんだよ。<end>あんたエルファス様の予言をどう思うね？<line-break>あたしは何となく本当のような気がして<line-break>しょうがないんだよ。<end>"
english = "<if><value:$2C><less-equal>%9Oh! Don't startle me like that. What is it? Do you need something?<end><if><value:$2C><less-equal>%29The town may be peaceful now, but life was hard before the vigilante corps was formed. Monsters prowled the streets in broad daylight.<end><if><value:$2C><less-equal>%49It puts me at ease to look out the window now. In the old days, monsters ran around out there instead of children. The town truly has become peaceful.<end>What do you make of Lord Elfas's prophecy? I can't shake the feeling that it's true.<end>"

["150014"]
japanese = "<if><value:$2A><less-equal>%49誰かに仕事を頼まれるような冒険者を<line-break>目指しな。そのためには他人の信用を<line-break>裏切るなんてのはもってのほかだぜ。<end><if><value:$2A><less-equal>%100あんた、<value:$28>だろ？<line-break>若手冒険者の注目株だってな。<line-break>だが、そんなに強そうには見えんな。<end><if><value:$2A><less-equal>%130あんたを倒せば、<value:$2B>を<line-break>倒した男として、俺の名も大陸中に知れ渡るぜ。<line-break>悪いが俺のために死んでくれ！<line-break>なんて、突然襲われたこともあるだろ。<line-break>有名人ってのも敵が多くて大変だよな。<line-break>ま、そのぶんいいこともあるんだろうけどよ。<end>よう、<value:$28>さんよ。<line-break>どこの港に行ってもあんたの噂を聞くぜ。<line-break>たいした有名人ぶりだよな。<end>"
english = "<if><value:$2A><less-equal>%49Aim to become the sort of adventurer people trust with work. Betraying someone's trust is out of the question.<end><if><value:$2A><less-equal>%100You're <value:$28>, aren't you? I hear you're a promising young adventurer. You don't look all that strong to me.<end><if><value:$2A><less-equal>%130“If I defeat you, I'll be known across the continent as the man who defeated <value:$2B>. Sorry, but you'll have to die for my sake!” You've probably had someone attack you out of nowhere like that. Fame brings plenty of enemies. I suppose it has its rewards too.<end>Well, if it isn't <value:$28>. I hear stories about you in every port I visit. You're quite the celebrity.<end>"

["150015"]
japanese = "<select><value:$20>%2エルズの女王エアは過去だろうが\u3000<line-break>未来だろうが、何でもお見通しの<line-break>水晶球を持っているんだ。<line-break>エアの所まで行くことができれば<line-break>何でも教えてくれるっていうから、<line-break>知りたいことがあれば行ってみな。<end>俺も長いこと船員をやってるけど、<line-break>西の海にだけは行きたくないぜ。<line-break>あそこは魔の海域だからな。<end>"
english = "<select><value:$20>%2Queen Er of Elz has a crystal ball that reveals everything, past or future. I'm told she'll tell you anything if you can reach her, so go see her if there's something you want to know.<end>I've been a sailor a long time, but the western sea is the one place I never want to go. Those waters are accursed.<end>"

["150016"]
japanese = "<if><value:$2C><less-equal>%20アルノートゥンの鉱山では、昔々に<line-break>聖光石と呼ばれる強大な力を持った<line-break>石を採掘していたそうですよ。<line-break>昔の魔道士は聖光石の力を利用して<line-break>山も吹き飛ばしたっていうから<line-break>ほんとに恐ろしい話ですよね。<end><if><value:$2C><less-equal>%49未開の森の奥には何があるのでしょう。<line-break>海賊の砦があるとか噂は多いですが、<line-break>奥まで行って帰った人間がいませんからね。<end>しぶきの群島から生きて帰った冒険者が<line-break>ロストールに住んでいるそうですよ。<line-break>あの島にはいったい何があるんでしょうかね。<end>"
