english = "<if><value:$29><equal>%0Lord <value:$28>...? You mean Lemghon's younger brother, the one who recently became Count of Noble?<end><if><value:$29><equal>%1Lady <value:$28>...? You mean Lemghon's younger sister, the one who recently became Countess of Noble?<end>"

["650014"]
japanese = "<if><value:$29><equal>%0それではタルテュバ様の<line-break>従弟にあたられるのですね。<line-break>\u3000<line-break>でも、それならどうして<line-break>そんな所からいらしたのです？<end><if><value:$29><equal>%1それではタルテュバ様の<line-break>従妹にあたられるのですね。<line-break>\u3000<line-break>でも、それならどうして<line-break>そんな所からいらしたのです？<end>"
english = "<if><value:$29><equal>%0Then you are Lord Tarteuba's cousin. But if so, why did you come in through a place like that?<end><if><value:$29><equal>%1Then you are Lord Tarteuba's cousin. But if so, why did you come in through a place like that?<end>"

["650015"]
