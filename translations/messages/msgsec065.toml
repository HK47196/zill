english = "I meant it as a compliment. Heh. You must forgive your awkward brother.<end>"

["650067"]
japanese = "これはレムオン様、<line-break>それに<value:$28>様。<line-break>\u3000<line-break>ようこそ<line-break>お越しくださいました。<end>"
english = "Why, Lemghon―and <value:$28> as well. Welcome.<end>"

["650068"]
japanese = "ティアナ様にもご機嫌うるわしく。<end>"
english = "And I trust you are well, Princess Tiana.<end>"

["650069"]
japanese = "さぁ、ご遠慮なさらずに<line-break>奥へお入りくださいませ。<end>"
english = "Please, don't hesitate. Come in.<end>"

["650070"]
japanese = "ずいぶん丁重な<line-break>もてなしようではないか？<end>"
english = "Quite a gracious welcome, isn't it?<end>"

["650071"]
japanese = "お母様ですら一目置く<line-break>レムオン様のおいでですもの。<line-break>当然の応対ですわ。<end>"
english = "Even Mother holds you in high regard, Lemghon. A proper reception is only natural.<end>"

["650072"]
japanese = "笑える冗談だ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "That's quite a joke.<end>"

["650073"]
japanese = "しかし、どういうものかな？<line-break>俺のような者を部屋に入れるとは。<end>"
