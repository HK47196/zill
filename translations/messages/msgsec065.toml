["650042"]
japanese = "<if><value:$29><equal>%0ダメだ。お前は俺の弟なのだ。\u3000\u3000\u3000<line-break>言うことを聞いてもらう。<line-break>\u3000<line-break>それに王女に拝謁しておくのは<line-break>悪くはない。そろそろ貴族として<line-break>社交界にも名を売っておかないとな。<end>ダメだ。お前は俺の妹なのだ。\u3000\u3000\u3000<line-break>言うことを聞いてもらう。<line-break>\u3000<line-break>それに王女に拝謁しておくのは<line-break>悪くはない。そろそろ貴族として<line-break>社交界にも名を売っておかないとな。<end>"
english = "<if><value:$29><equal>%0No. You're my younger brother, and you'll do as I say. Besides, an audience with the princess will do you no harm. It's time you started making a name for yourself in society as a noble.<end>No. You're my younger sister, and you'll do as I say. Besides, an audience with the princess will do you no harm. It's time you started making a name for yourself in society as a noble.<end>"

["650043"]
japanese = "言葉づかいや身だしなみには\u3000\u3000<line-break>細心の注意を払え。<line-break>\u3000<line-break>相手はお前と同い年の小娘だが、<line-break>宮廷暮らしが長い上に<line-break>あのファーロスの雌狐の娘だ。<end>"
english = "Take the utmost care with your manners and appearance. She may be a mere girl your age, but she's spent years at court―and she's the daughter of that Vixen of Pharos.<end>"

["650044"]
japanese = "見破られるなよ、\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break><value:$28>。<line-break>\u3000<end>"
english = "Don't let her see through you, <value:$28>.<end>"

["650045"]
japanese = "レムオン様、<line-break>ようこそおいでくださいました。<end>"
english = "Lord Lemghon, welcome.<end>"

["650046"]
japanese = "これはティアナ王女、<line-break>今日は一段と美しい。<end>"
english = "Princess Tiana. You look lovelier than ever today.<end>"

["650047"]
japanese = "<if><value:$29><equal>%0くすっ、レムオン様ったら\u3000<line-break>お上手ですこと。<line-break>\u3000<line-break>弟君の前では<line-break>紳士で通すおつもりかしら？<end>くすっ、レムオン様ったら\u3000<line-break>お上手ですこと。<line-break>\u3000<line-break>妹君の前では<line-break>紳士で通すおつもりかしら？<end>"
english = "<if><value:$29><equal>%0My, Lord Lemghon, how charming. Do you mean to play the gentleman in front of your younger brother?<end>My, Lord Lemghon, how charming. Do you mean to play the gentleman in front of your younger sister?<end>"

["650048"]
japanese = "<if><value:$29><equal>%0弟のことをご存じとは<line-break>お耳が早い。さすがは、<line-break>諜略に長けたエリスの娘だな。<end>妹のことをご存じとは<line-break>お耳が早い。さすがは、<line-break>諜略に長けたエリスの娘だな。<end>"
english = "<if><value:$29><equal>%0So you've already heard about my younger brother. You are well informed. Just what I'd expect from the daughter of Eris, a woman skilled in intrigue.<end>So you've already heard about my younger sister. You are well informed. Just what I'd expect from the daughter of Eris, a woman skilled in intrigue.<end>"

["650049"]
japanese = "フフ、王宮中その噂で持ちきりです。<line-break>ファーロスの雌狐の娘で<line-break>なくても知っていますわ。<end>"
english = "The whole palace is abuzz with the rumor. I would have heard even if I were not the daughter of the Vixen of Pharos.<end>"

["650050"]
japanese = "<if><value:$29><equal>%0まったく、くだらん噂話しか<line-break>能のない奴らが多すぎる。\u3000\u3000\u3000<line-break>\u3000<line-break>紹介する。我が弟、<line-break>ノーブル伯<value:$28>だ。<end>まったく、くだらん噂話しか<line-break>能のない奴らが多すぎる。\u3000\u3000\u3000<line-break>\u3000<line-break>紹介する。我が妹、<line-break>ノーブル伯<value:$28>だ。<end>"
english = "<if><value:$29><equal>%0Too many people are good for nothing but idle gossip. Let me introduce my younger brother, <value:$28>, Count of Noble.<end>Too many people are good for nothing but idle gossip. Let me introduce my younger sister, <value:$28>, Count of Noble.<end>"

["650051"]
