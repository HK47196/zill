english = "It is an honor to meet you, Count of Noble.<end>"

["650052"]
japanese = "俺は他にも用事がある。<line-break>お前はあとは好きにしろ。<end>"
english = "I have other business to attend to. Do as you please from here.<end>"

["650053"]
japanese = "ティアナ、<line-break>少ししか話せなくて残念だが<line-break>これで失礼する。<end>"
english = "Tiana, I regret that we had so little time to speak, but I must take my leave.<end>"

["650054"]
japanese = "レムオン様、<line-break>またいらっしゃってください。<end>"
english = "Lord Lemghon, please come again.<end>"

["650055"]
japanese = "<value:$28>、<line-break>変な気は起こすなよ。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>王女にはもう、フィアンセがいる。<line-break>しかも、そいつは王妃エリスの実家<line-break>名家ファーロス家の跡取りだ。<end>"
english = "<value:$28>, do not get any ideas. The princess is already betrothed―and to the heir of the illustrious House Pharos, Queen Eris's own family.<end>"

["650056"]
japanese = "フィアンセ殿に怒られなければな。<end>"
english = "Provided your betrothed does not take offense.<end>"

["650057"]
japanese = "フィアンセだなんて！<line-break>存じません、そんな方！<end>"
english = "Betrothed? I know of no such person!<end>"

["650058"]
japanese = "貴族としての義務を果たさず、<line-break>酒とバクチにおぼれ、<line-break>宮廷にも近づこうとしない…。<line-break>いくら名家の出でも<line-break>あんな方と結婚なんて<line-break>考えられませんわ。<end>"
english = "Neglecting every noble duty, drowning in drink and gambling, refusing even to go near the court... No matter how illustrious the lineage, I cannot imagine marrying someone like that.<end>"

["650059"]
japanese = "フィアンセ…ですか？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>お母様が決めたことです。<line-break>お母様の実家ファーロス家の跡取りで<line-break>従兄に当たる方ですけど…。<end>"
english = "My betrothed...? Mother arranged it. The heir to House Pharos―her own family―and my cousin as well...<end>"

["650060"]
japanese = "酒とバクチにおぼれ、<line-break>宮廷にも近づこうとしません。\u3000\u3000\u3000<line-break>\u3000<line-break>そんな方と結婚するだなんて<line-break>とても考えられません。<end>"
english = "Drowning in drink and gambling, never even going near the court... I simply cannot imagine marrying someone like that.<end>"

["650061"]
japanese = "くすっ、<value:$28>様って<line-break>私が今までに出会った方々とは、<line-break>どこか違う雰囲気をお持ちですね。<line-break>また、いらしてくださいね。\u3000\u3000<line-break><value:$28>様。<line-break>\u3000<end>"
english = "Hee hee. <value:$28>, there's something about you that sets you apart from everyone I've ever met. Please do visit again, <value:$28>.<end>"

["650062"]
japanese = "<value:$28>、よく来た。\u3000<end>"
english = "<value:$28>, glad you could come.<end>"

["650063"]
japanese = "今からティアナ王女の所へ行く。<line-break>お前も来い。<end>"
english = "I'm going to see Princess Tiana now. Come with me.<end>"

["650064"]
japanese = "…いやに素直だな。<line-break>どこか身体の具合でも悪いのか？<end>"
english = "You're unusually cooperative. Are you feeling ill?<end>"

["650065"]
japanese = "フッ、さすがは<line-break>丈夫なだけが取り柄の奴だ。<end>"
english = "Heh. Sturdy as ever. It is the one thing you have going for you.<end>"

["650066"]
