["650074"]
japanese = "フィアンセが聞いたら<line-break>怒るのではないか？\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Wouldn't your betrothed be angry to hear of it?<end>"

["650075"]
japanese = "婚約者といっても、<line-break>お母様が勝手に決めたこと。\u3000\u3000\u3000<line-break>\u3000<line-break>幼なじみのレムオン様とのことを<line-break>とやかく言われる筋合いは<line-break>ありません。<end>"
english = "The engagement was Mother's decision alone. My betrothed has no right to complain about me and Lemghon. We've known each other since childhood.<end>"

["650076"]
japanese = "だいたい、酒とバクチにおぼれて<line-break>宮廷に近寄ろうともしない方を<line-break>ティアナは婚約者とは認めません。<end>"
english = "Besides, Tiana will not accept as a betrothed someone who wallows in drink and gambling and refuses even to come to court.<end>"

["650077"]
japanese = "いっそのこと、レムオン様が私の<line-break>夫になってくださればいいのです。<end>"
english = "I would much rather have you for my husband, Lemghon.<end>"

["650078"]
japanese = "…それはできんな。<end>"
english = "That I cannot do.<end>"

["650079"]
japanese = "まぁ、意地悪！\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>でも、ふふふ…レムオン様らしいわ。<line-break>迷うそぶりくらい見せてくれても<line-break>バチは当たらなくてよ。<end>"
english = "Oh, how cruel! Still... heh, that is just like you, Lemghon. You might at least have pretended to consider it. It would hardly have hurt you.<end>"

["650080"]
japanese = "何も王が男子でなければならぬ<line-break>理由はない。<line-break>\u3000<line-break>ティアナも、エリスのように<line-break>女王として君臨すれば、<line-break>無理に結婚することもなかろう？<end>"
english = "There is no reason the monarch must be a man. You could reign as queen, as Eris does, and then you would have no need to force yourself to marry, would you?<end>"

["650081"]
japanese = "女が出しゃばるのは<line-break>好きではありません。<line-break>\u3000<line-break>特にお母様みたいに<line-break>出しゃばるのは…。<line-break>それに…。<end>"
english = "I do not care for women who push themselves to the fore. Especially not the way Mother does... And besides...<end>"

["650082"]
japanese = "どうする、<value:$28>？<line-break>\u3000<line-break>\u3000<line-break>お前、いつも<line-break>男なんかには負けないと<line-break>言い張っているではないか。<end>"
english = "What about you, <value:$28>? You're always insisting you won't lose to any man.<end>"

["650083"]
japanese = "すみません。\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "I'm sorry.<end>"

["650084"]
japanese = "<value:$28>様がどうこうと<line-break>申しあげるつもりはなかったのです。<end>"
english = "<value:$28>, I did not mean to imply anything about you.<end>"

["650085"]
japanese = "許してやるのか…。\u3000\u3000<end>"
english = "So you will let it pass...?<end>"

["650086"]
japanese = "お前、もしかして<line-break>俺以外には寛大なのか？<end>"
english = "Are you generous with everyone but me?<end>"

["650087"]
japanese = "私はファーロス家を発展させるための<line-break>道具ではありませんもの。<end>"
english = "I am not a tool to be used for the advancement of House Pharos.<end>"

["650088"]
japanese = "やれやれ、エリスも哀れだな。\u3000<end>"
english = "Well, poor Eris.<end>"

["650089"]
japanese = "ファーロス家発展のために<line-break>知略の限りを尽くしたところが…<end>"
english = "She has used every ounce of her ingenuity to advance House Pharos...<end>"

["650090"]
japanese = "娘のわがままのせいで<line-break>その綿密な計画も水の泡か。\u3000\u3000<end>"
english = "And now her daughter's selfishness has brought that meticulous plan to nothing.<end>"

["650091"]
japanese = "ひどいわ、レムオン様！<line-break>わがままだなんて。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>これでも、国のことを<line-break>いろいろと考えているつもりです。<end>"
english = "How cruel, Lemghon! Calling me selfish! I do give a great deal of thought to the country, you know.<end>"

["650092"]
japanese = "これは失礼、ティアナ王女。<line-break>さすがはファーロスの…<end>"
