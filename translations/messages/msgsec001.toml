japanese = "性格も考え方も全然違うけどなぜか息の合う二人の孤児<line-break>ある日二人の親友が無法者の冒険者に大怪我を負わされた<line-break>その場に居合わせながら助けることができなかった事をくやむ二人<line-break>「僕らでヴァンの仇を討ちに行こうか？」<end>"
english = "Two orphans with utterly different personalities and ways of thinking somehow make a perfect team. One day, a lawless adventurer gravely injures their close friend. Though both were there, neither could help, and the regret weighs on them. “Why don't we go avenge Van ourselves?”<end>"

["10189"]
japanese = "主人公の妹ルフレンが、竜王の覚醒の影響で呪いにかかり倒れてしまった。この呪いを解くためには莫大な金がかかるという<line-break>その金を得るために、大金持ちフゴーをペテンにかける主人公たち。一時は失敗しかかったものの、幼なじみゴートの機転により無事大金を手に入れた主人公は、ゴートとともに妹の呪いを解くために旅に出る<end>"
english = "The protagonist's younger sister, Lufren, collapses under a curse brought on by the Dragon King's Awakening. Breaking the curse will require an enormous sum of money. To raise it, the protagonist and companions set out to swindle the wealthy Hugo. The scheme nearly fails, but a childhood friend named Goat saves it with some quick thinking. With the money safely in hand, the protagonist sets off with Goat on a journey to break Lufren's curse.<end>"

["10190"]
japanese = "主人公と主人公の居候先のアイリーンは、人語をしゃべる不思議なゴブリン３匹組を退治しに出かけるが、ゴブリンたちの三位一体の攻撃の前に倒れてしまう<line-break>アイリーンの前でまたも無様を演じてしまった主人公は、旅に出ることを決意する<line-break>アイリーンもまた旅に出ることを決意する絶対に主人公のことを守ると誓った、あの幼き日の約束を守るために<end>"
english = "The protagonist and Irene, with whom the protagonist is staying, set out to defeat a strange trio of Goblins who speak the human tongue. Instead, both are defeated by the Goblins' three-in-one attack. Having once again made a humiliating spectacle in front of Irene, the protagonist decides to leave on a journey. Irene resolves to go as well, determined to keep the promise she made as a child to protect the protagonist no matter what.<end>"

["10191"]
japanese = "主人公とその弟チャカは、ノーブルの悪代官モルモラとの戦いにおいて、危ないところを謎の貴族に助けられる。そのあとモルモラを倒すことに成功する主人公だが、反逆罪に問われることを恐れた町の長老たちにより、領主レムオンの前に引き出される。目の前に現れた領主は、いつかの謎の貴族だった<line-break>主人公はレムオンに従い、陰謀渦巻く王都ロストールへ旅立つ<end>"
english = "While fighting Mormora, Noble's corrupt magistrate, the protagonist and younger brother Chaka are saved at the last moment by a mysterious noble. The protagonist later succeeds in defeating Mormora, but the town elders, afraid of being accused of treason, bring the protagonist before their lord, Lemghon. The lord who appears is none other than the mysterious noble from before. Entering Lemghon's service, the protagonist departs for Rostorl, the royal capital seething with intrigue.<end>"

["10192"]
japanese = "主人公は神器の神殿の神官の子である<line-break>ある日、神器を狙う魔人の襲撃に遭う。この襲撃により、主人公は父を失い、神器を使って闘いを挑んだ兄を連れ去られてしまう<line-break>主人公は、魔人に体を奪われた姉の消息を追ってきたセラとともに、兄ロイとセラの姉の行方を追って旅にでる<end>"
english = "The protagonist is the child of a priest at the Temple of the Divine Artifact. One day, a demon attacks in pursuit of the artifact. The protagonist's father is killed, and the older brother who used the artifact to challenge the demon is carried away. The protagonist then meets Sera, who has been searching for an older sister whose body was stolen by a demon. Together, they set out to find Roy and Sera's sister.<end>"

["10193"]
japanese = "主人公は、人のいい行商人である父フリントとロストールへ向かう道中にあった<line-break>あと数日もすれば到着というところで、キャラバンが謎の襲撃者に襲われる<line-break>主人公も剣を手に応戦したが、相手はかなりの手だれだった<line-break>この戦いで命を落とすフリント<line-break>父は最期、息子に手紙を託す<line-break>「これを…王妃様に、必ず届けてくれ…」<end>"
english = "The protagonist is traveling to Rostorl with Flint, a kindhearted peddler and the protagonist's father. With only a few days left before their arrival, the caravan is attacked by mysterious assailants. The protagonist takes up a sword and fights back, but the attackers are highly skilled. Flint loses his life in the battle. With his dying breath, the father entrusts a letter to his son. “You must... deliver this to Her Majesty the Queen...”<end>"

["10194"]
japanese = "炎竜山が噴火するとき、その頂上の炎の礼状に現れる炎の泉で打った剣は、神をも切り裂く名剣になると言う<line-break>鍛冶の名工カッツの息子である主人公は、父とともに炎竜山の頂上を目指すが、炎のエレメントの活性化の影響で目覚めた魔物によって父を失い、旅立つことになる<line-break>父と母の夢を果たすため、父と母の師であるドワーフのドーレンを訪ねる旅に<end>"
english = "It is said that when Flame Dragon Mountain erupts, a sword forged in the spring of flame that appears in the fiery letter at its summit will become a legendary blade capable of cleaving even a god. The protagonist, son of the master blacksmith Katz, sets out with his father for the summit. But a Monster awakened by the increased activity of the fire element kills his father, forcing the protagonist to begin a journey. To fulfill the dream shared by both parents, the protagonist sets off in search of Doren, the Dwarf who taught them.<end>"

["10195"]
japanese = "山間にあるその村は盗人村と呼ばれているその村で育った主人公の師匠はロッシマという片腕の盗賊だった<line-break>ある日主人公は町の冒険者から、ロッシマは世界中のダンジョンを踏破した英雄で、彼の遺したメモがダンジョンの罠からたくさんの冒険者を救っている事実を聞く<line-break>ロッシマは語る「レオニックの迷宮を踏破し、この俺を越える盗賊になれ」と<end>"
english = "The mountain village is known as Thieves' Village. The protagonist grew up there under the tutelage of Rossima, a one-armed thief. One day, an adventurer in town reveals that Rossima was a hero who conquered dungeons all over the world, and that the notes he left behind have saved many adventurers from their traps. Rossima says, “Conquer the Labyrinth of Leonic, and become a thief who surpasses me.”<end>"

["10196"]
japanese = "主人公は母アスティアの後を追ってヴァシュタールの柩という遺跡にやってくる。そこで出会った不思議な少年シャリ騙された主人公は、破壊神を甦らせる魔人ヴァシュタールを復活させてしまう母とともに逃げようとするが、母アスティアは町とともに石にされてしまう<line-break>リルビーの踊り子ルルアンタに出会った主人公は、打倒ヴァシュタールの旅に出る<end>"
english = "Following the trail of the protagonist's mother, Astia, the protagonist arrives at a ruin known as the Coffin of Vashtar. There, a mysterious boy named Shalli deceives the protagonist into reviving Vashtar, a demon who intends to resurrect the God of Destruction. The protagonist tries to escape with Astia, but Astia and the entire town are turned to stone. After meeting Lulluantha, a dancer from Lilubee, the protagonist sets out on a journey to defeat Vashtar.<end>"

["10197"]
japanese = "主人公とその幼なじみは、竜の座から宝物を盗み手傷を負わされていた不思議な少女メイアを、何も知らずに助けてしまう<line-break>二人は、メイア逃亡の手助けをした罪で、竜の座に捕らえられてしまう<line-break>女王エアは主人公に命じた<line-break>「宝物を取り戻してこい。さもなくば、この少女やエルズの民の命はないものと思え」<end>"
english = "Knowing nothing of what has happened, the protagonist and a childhood friend help a mysterious wounded girl named Meia, who stole a treasure from the Seat of the Dragon. The two are arrested by the Seat of the Dragon for aiding her escape. Queen Er commands the protagonist, “Bring back the treasure. Otherwise, consider this girl and the people of Elz as good as dead.”<end>"

["10198"]
japanese = "閃光に包まれて、目を覚ますと、そこは見知らぬ世界だった。主人公の目の前に現れたエルフの魔道士ナーシェスは主人公に言う<line-break>「君は金の聖光石に導かれてこの世界に呼ばれた。君はこの世界が流す悲しみを止める事ができる存在なのだ」<line-break>主人公は、武器商人アンティノの不正を突き止めようとしている少女フィーユと出会い、元の世界に帰る手がかりを求めて旅に出る<end>"
english = "Engulfed in a flash of light, the protagonist awakens in an unknown world. An Elf mage named Narscess appears and says, “The Golden Holy Light Stone guided you here and summoned you to this world. You are capable of bringing an end to the sorrow this world sheds.” The protagonist meets a girl named Fille, who is trying to expose the wrongdoing of the arms merchant Antino, and sets out in search of a way back to the original world.<end>"

["10199"]
japanese = "主人公は月世界の住人レンシーの生まれ変わりであった<line-break>主人公が１６才になった時、魔獣・銀狼と化した神弓セリューンを倒し手に入れる。その主人公の前に月からの使者がが現れ、神弓セリューンを使ってレンシーが果たせなかったグフトク討伐を告げる<line-break>主人公は幼なじみのリディオン、さすらいの吟遊新人レルラロントンと旅に出る<end>"
english = "The protagonist is the reincarnation of Rensy, a resident of the Moon World. At the age of sixteen, the protagonist defeats the Divine Bow Selyune, which has taken the form of the monstrous Silver Wolf, and claims the bow. A messenger from the moon then appears and tells the protagonist to use Selyune to defeat Guftok, a task Rensy could not complete. The protagonist sets out with the childhood friend Lidion and a wandering novice minstrel named Relra-Lonton.<end>"
