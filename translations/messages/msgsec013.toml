japanese = "よっしゃ。<line-break>それでは、出発じゃ。<end>"
english = "Right, then. Off we go.<end>"

["130016"]
japanese = "それじゃ、わしはここで待っとるから、<line-break>用が済んだら、声をかけてくれ。<end>"
english = "I'll wait here, then. Give me a shout when you're done.<end>"

["130017"]
japanese = "なんだ、地下街道の案内じゃないのか。<line-break>わしは、いつもここにおるから、<line-break>そのうち、用があったら声をかけてくれ。<end>"
english = "What, you're not here for a guide through the Underground Roads? Well, I'm always here, so if you ever need me, just come and see me.<end>"

["130018"]
japanese = "おう、用事は済んだのかい。<line-break>連れて帰ってよいんじゃな？<end>"
english = "Oh, all done, are you? Then we can head back now, right?<end>"

["130019"]
japanese = "はい、お願いします<end>"
english = "Yes, please.<end>"

["130020"]
japanese = "待ってください<end>"
english = "Please wait.<end>"

["130021"]
japanese = "よっしゃ。<line-break>それじゃ戻ろうかの。<end>"
english = "Right, then. Let's head back.<end>"

["130022"]
japanese = "また、用があったら声をかけてくれ。<line-break>わしは、いつもここにおるからの。<end>"
english = "Come and see me again if you need anything. I'm always here.<end>"

["130023"]
