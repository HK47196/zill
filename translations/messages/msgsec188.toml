alue:$01><equal>24The fact that monsters were set to guard it means the hidden treasure must be farther in.<end><if><value:$01><equal>25Having monsters guard the place is practically announcing that the hidden treasure is farther in.<end><if><value:$01><equal>21So this so-called hidden treasure of the Liberdam merchants lies farther in. Let us see at once just how much has been hoarded.<end><if><value:$01><equal>192It seems the hidden treasure is farther in.<end><if><value:$01><equal>193If monsters were guarding this place, the hidden treasure must be farther in. Let's go, <value:$28>.<end><if><value:$01><equal>194It looks like the hidden treasure is farther in.<end><if><value:$01><equal>191Setting monsters to guard it means the hidden treasure must be farther in.<end><if><value:$01><equal>190The fact that monsters were guarding this place proves the hidden treasure lies ahead.<end>"

