["1880045"]
japanese = "おう、<value:$28>。<line-break>今戻ったか。クリュセイス様が<line-break>お待ちかねだ。<end>"
english = "Ah, <value:$28>. You're back. Lady Khryuseis has been waiting for you.<end>"

["1880046"]
japanese = "エリス王妃への援助の要請は<line-break>うまくいったようですね。<line-break>王家より活動資金が届いています。\u3000<line-break>実は、あなたがロストールへ向かって<line-break>数日後に、王家から使者が来ました。<line-break>後方かく乱の件は無用だと。<end>"
