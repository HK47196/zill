ak><value:$28>。 <end><if><value:$01><equal>192戻って報告しましょう。<end><if><value:$01><equal>193す、すごすぎます。<line-break>まさかこんなにもあるなんて…<line-break>早速戻って報告しましょう。<end><if><value:$01><equal>194おびただしい量の虚栄と貪欲…。<line-break>くだらないね。<line-break>さあ、早く戻るとしよう。<end><if><value:$01><equal>191さすがリベルダム商人の<line-break>埋蔵金なだけはあるわね。<line-break>目が痛くなりそうね。<line-break>戻って報告ね。<end><if><value:$01><equal>190これは驚いた。<line-break>これだけあれば解放軍の財政難も<line-break>解消するな。<line-break>戻って報告だ。<end>"
