english = "<if><value:$01><equal>15The fact that monsters were set to guard it means the hidden treasure must be farther in. Let's go see.<end><if><value:$01><equal>19So if monsters were set to guard it, the hidden treasure's got to be farther in. Why don't we go take a look?<end>The fact that monsters were set to guard it means the hidden treasure must be farther in. I wonder how much there is.<end>"

["1880020"]
japanese = "<if><value:$01><equal>15さすがはリベルダムの商人の<line-break>埋蔵金だね。これだけあれば解放軍の<line-break>財政難もだいぶよくなるはずだよ。 <end><if><value:$01><equal>19うわぁ。さすがはリベルダムの商人の<line-break>埋蔵金だね、<value:$28>。 <end>うわぁ。さすがにリベルダムの商人の<line-break>埋蔵金だけあるね、<value:$28>。 <end>"
english = "<if><value:$01><equal>15You'd expect no less from the Liberdam merchants' hidden treasure. This should go a long way toward easing the Liberation Army's financial troubles.<end><if><value:$01><equal>19Wow. You'd expect no less from the Liberdam merchants' hidden treasure, <value:$28>.<end>Wow. This is just what you'd expect from the Liberdam merchants' hidden treasure, <value:$28>.<end>"

["1880021"]
japanese = "<if><value:$01><equal>15でも、もったいない話だよね。<line-break>これだけお金があるなら生活が苦しい<line-break>人たちに分けてあげればいいのに…。 <end><if><value:$01><equal>19でも、これだけお金があるんだったら<line-break>お金がなくて困ってる人に<line-break>分けてあげればいいのに…。 <end>でも、これだけお金があるのに<line-break>貧しい人たちの生活をよくするようには<line-break>使ってあげないんだよね…。 <end>"
