ht expect as much from the Liberdam merchants' hidden treasure... Quite a hoard. Come, let us return.<end><if><value:$01><equal>27This is incredible... This should be more than enough to resolve the Liberation Army's financial troubles. Let's return and report it at once.<end><if><value:$01><equal>26You'd expect no less from the Liberdam merchants' hidden treasure. Come, let us return and report it.<end><if><value:$01><equal>24You'd expect no less from the Liberdam merchants' hidden treasure. Let's return and report it at once.<end><if><value:$01><equal>25Amazing... This should be enough. Let's hurry back.<end><if><value:$01><equal>21That is an impressive amount. This should resolve the Liberation Army's financial troubles. Come, <value:$28>. We're going back to report this.<end><if><value:$01><equal>192Let's go back and report this.<end><if><value:$01><equal>193Th-this is incredible. I never imagined there would be so much... Let's go back and report this at once.<end><if><value:$01><equal>194Such a vast accumulation of vanity and greed... How absurd. Come, let us hurry back.<end><if><value:$01><equal>191It certainly lives up to being the Liberdam merchants' hidden treasure. The sight of it is enough to make my eyes hurt. Let's go back and report this.<end><if><value:$01><equal>190Now this is a surprise. This much should resolve the Liberation Army's financial troubles. Back to report it.<end>"

["1880025"]
japanese = "<if><value:$01><equal>2こら、<value:$28>。<line-break>何をしてるのよ。<line-break>さっさと戻るわよ。 <end><if><value:$01><equal>3何をしておるんじゃ。<line-break>さっさと戻るぞ、<value:$28>。 <end><if><value:$01><equal>4<value:$28>ったら<line-break>やっぱりねらってたのね。<line-break>私にも３割くらいくれないかな。 <end><if><value:$01><equal>5何してんだよ、<value:$28>。<line-break>まさか、ネコババする気じゃ<line-break>ないだろうな。 <end><if><value:$01><equal>7何をしているの。<line-break>さっさと行くわよ。 <end><if><value:$01><equal>11<value:$28>。<line-break>…まさか、少しくらいとっても<line-break>平気なんて思ってないわよね？ <end><if><value:$01><equal>12おいおい、<value:$28>。<line-break>少しくらいなら、くすねても大丈夫<line-break>なんて思ってないだろうな？<line-break>滅多なことするもんじゃないぜ。<line-break>世の中には信用ってもんがある。 <end><if><value:$01><equal>13…何をしている。<line-break>早く行くぞ。 <end><if><value:$01><equal>10何してんだよ、姉ちゃん。<line-break>まさか、ネコババしようってんじゃ<line-break>ないだろうな？ <end><if><value:$01><equal>14何をしとるんじゃ。<line-break>よもや、多少なりともくすねようと<line-break>思ってはおるまいな？ <end><if><value:$01><equal>15何してるの、<value:$28>？<line-break>ま・さ・か、ネコババしようなんて<line-break>思ってないよね？ <end><if><value:$01><equal>17アタクシの崇高な時間はそんなはしたな<line-break>額で買えるようなものではなくてよ。<line-break>さっさと帰るのよー！ <end><if><value:$01><equal>19ちょっとぉ、<value:$28>。<line-break>ま・さ・か、少しくらいなら取っても<line-break>ばれないなんて思ってるのぉ？<line-break>そんなことしてると、<line-break>ルルアンタ、怒っちゃうよ。 <end><if><value:$01><equal>20…何をしている。<line-break>早く戻るぞ。 <end><if><value:$01><equal>21何をしている。<line-break>下らぬことをするな。 <end>…ひょっとして、<line-break>少しくらい取ったってばれない<line-break>なんて、考えてないよね？<line-break>そういうことしてると<line-break>信用なくすもんね。 <end>"
english = "<if><value:$01><equal>2Hey, <value:$28>. What are you doing? Come on, we're going back.<end><if><value:$01><equal>3What are you doing? Come, <value:$28>. We're going back.<end><if><value:$01><equal>4<value:$28>, so you were after it after all. Think you could give me about thirty percent?<end><if><value:$01><equal>5What are you doing, <value:$28>? You're not thinking of pocketing some, are you?<end><if><value:$01><equal>7What are you doing? Come on, we're leaving.<end><if><value:$01><equal>11<value:$28>... You aren't thinking a little would be fine, are you?<end><if><value:$01><equal>12Come on, <value:$28>. You aren't thinking it'd be all right to skim off a little, are you? Don't do anything rash. Trust matters in this world.<end><if><value:$01><equal>13...What are you doing? Let's go.<end><if><value:$01><equal>10What are you doing, sis? You're not planning to pocket any of it, are you?<end><if><value:$01><equal>14What are you doing? Surely you are not thinking of pocketing even a little?<end><if><value:$01><equal>15What are you doing, <value:$28>? You couldn't possibly be thinking of pocketing some, could you?<end><if><value:$01><equal>17My precious time cannot be bought for such a paltry sum. Hurry up, we're leaving!<end><if><value:$01><equal>19Hey, <value:$28>. You aren't thinking no one would notice if you took a little, are you? Lulluantha will get angry if you do that.<end><if><value:$01><equal>20...What are you doing? We're going back.<end><if><value:$01><equal>21What are you doing? Do not waste time on such foolishness.<end>...You aren't thinking no one would notice if you took a little, are you? Doing that will cost you people's trust.<end>"

