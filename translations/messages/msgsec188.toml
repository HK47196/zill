["1880037"]
japanese = "ディンガルのカルラ軍が<line-break>ロストールに攻め込む動きがあるのは\u3000<line-break>知っていますね？<line-break>ロストールも今の戦力では苦しいはず。<line-break>そこで、我々解放軍がカルラ軍の後方を<line-break>かく乱し、援護しようと思います。<end>"
english = "You know that Karula's Army in Dyneskal is preparing to invade Rostorl, don't you? Rostorl will have a hard time holding out with its current forces. So the Liberation Army intends to support Rostorl by disrupting Karula's rear.<end>"

["1880038"]
japanese = "そこで、この作戦を実行に移すために<line-break>ロストールのエリス王妃に資金援助を<line-break>要請するのがあなたの役目です。<line-break>行ってくれますね？<end>"
