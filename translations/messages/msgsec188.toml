english = "The truth is, I've received reports of a general in Rostorl's army who resembled you. Were you told to join their army in exchange for the funding?<end>"

["1880055"]
japanese = "どうして、言ってくれないのです。<line-break>本当のことを言ってください。<line-break>これは命令ですよ。<end>"
english = "Why won't you tell me? Tell me the truth. That's an order.<end>"

["1880056"]
japanese = "…やはり、そうだったのですか。\u3000<line-break>\u3000<line-break>\u3000<line-break>でも、なぜ隠していたのです？<line-break>あなたはわたくしに報告する義務が<line-break>あるはずですよ。<end>"
english = "So it was true. But why did you hide it from me? You are obliged to report such things to me.<end>"

["1880057"]
japanese = "わざわざ報告する必要はない<end>"
english = "There was no need to report it<end>"

["1880058"]
japanese = "余計な心配をさせたくない<end>"
english = "I didn't want to cause needless worry<end>"

["1880059"]
japanese = "そんなことはないわ。<line-break>わたくしはあなたが属する組織の<line-break>指導者なのですよ。<line-break>部下が何をしているのか<line-break>把握していないなんて、<line-break>指導者として失格じゃない。<end>"
english = "Of course you needed to tell me. I am the leader of the organization you belong to. If I don't even know what my own subordinates are doing, then I'm unfit to lead.<end>"

["1880060"]
japanese = "あなたが命をかけて、援助の要請を<line-break>果たしてくれたことには、<line-break>本当に感謝しています。<line-break>でも、今後はこのような単独行動は<line-break>慎んでいただきたいわ。<line-break>よろしくて？<end>"
english = "I am truly grateful that you risked your life to secure the aid we needed. But from now on, I must ask you not to act alone like this. Is that understood?<end>"

["1880061"]
japanese = "…今のは、言い過ぎでした。<line-break>解放軍のために命を懸けてくれたのに<line-break>あんなことを言って。<line-break>今回の任務は本当にご苦労でした。<line-break>ゆっくり休んでください。<line-break>…みなさんも下がってください。<end>"
english = "I went too far just now. You risked your life for the Liberation Army, and I said such things to you. You've worked very hard on this mission. Please get some rest. The rest of you may leave as well.<end>"

["1880062"]
japanese = "…心配させたくなかったですって？\u3000\u3000<line-break>冗談ではないわ！<line-break>あなたは組織のメンバーなのよ！<line-break>…わたくしの組織のメンバーが<line-break>戦場に出ているというのに、わたくしは<line-break>知らないなんて…バカみたいじゃない。<end>"
english = "You didn't want me to worry? Don't be ridiculous! You are a member of this organization! One of my own people was out on a battlefield, and I knew nothing about it. I look like a complete fool.<end>"

["1880063"]
japanese = "…ごめんなさい。言い過ぎました。<line-break>でも、今後はわたくしへの報告なしに<line-break>危険なことはしないように。<line-break>今日はゆっくり休んでください。<line-break>ご苦労様でした。<line-break>…みなさんも下がってください。<end>"
english = "I'm sorry. I went too far. But from now on, you are not to do anything dangerous without reporting to me first. Get some rest today. You've earned it. The rest of you may leave as well.<end>"

["1880064"]
japanese = "…わたくし、<line-break>どうして素直に言えないの？\u3000<line-break>…ありがとうって。<line-break>わたくしのために戦ってくれて<line-break>いるのに…、わたくしのために<line-break>気を使ってくれているのに…。<end>"
english = "Why can't I simply say what I mean? Why can't I just say thank you? You're fighting for me, and trying so hard not to worry me...<end>"

["1880065"]
japanese = "こんなことでは、わたくし<line-break>どんどん<value:$28>に<line-break>嫌われてしまう…。<end>"
english = "If I keep behaving like this, <value:$28> will like me less and less...<end>"

["1880066"]
japanese = "何を考えているの、クリュセイス？<line-break><value:$28>が戦っているのは<line-break>解放軍のためなのよ。<line-break>そうに決まっている。<line-break>そうに…。<end>"
english = "What are you thinking, Khryuseis? <value:$28> is fighting for the Liberation Army. Of course that's the reason. It must be...<end>"

["1880067"]
japanese = "<select><value:$20>%2どうしたのです、<value:$28>？<line-break>あなたには埋蔵金を調査する任務が<line-break>あるはずですよ。<line-break>こんなところで、<line-break>ぐずぐずしていられる時間は<line-break>ないのではないかしら？<end><value:$28>、<line-break>埋蔵金の調査を急いでください。<line-break>\u3000<line-break>わたくしたち解放軍の活動には、<line-break>どうしても資金が必要なのです。<end>"
english = "<select><value:$20>%2What are you doing here, <value:$28>? You have a cache of treasure to investigate. Surely you have no time to dawdle here?<end><value:$28>, please hurry with the investigation of the treasure cache. The Liberation Army desperately needs funds to continue its work.<end>"

["1880068"]
japanese = "<select><value:$20>%3え？\u3000解放軍はどうしてそんなに\u3000\u3000<line-break>資金が必要なのか、ですって？<line-break>\u3000<line-break>組織の運営にはそれなりの資金が<line-break>いるのです。わたくしの運営の仕方に<line-break>問題があると言いたいのですか？<end>資金もそうですけど、人員の不足も<line-break>解放軍の深刻な悩みです。リベルダム\u3000<line-break>陥落の際、大勢の仲間を失いました。<line-break>ですから、今後もあなたを頼ってしまう<line-break>かもしれませんね。<line-break>…解放軍の指導者として、ですが。<end>あなたの見つけてきてくれた埋蔵金の<line-break>おかげで、解放軍も少しは<line-break>持ち直しそうです。<line-break>ですが、資金があるにこしたことは<line-break>ありません。今後も解放軍の仲間には<line-break>節制してもらわないと。<end>"
english = "<select><value:$20>%3What? Why does the Liberation Army need so much money? Any organization requires a certain amount of funding to operate. Are you suggesting there is something wrong with the way I manage it?<end>Funds are not our only concern. The Liberation Army is also desperately short of personnel. We lost many of our comrades when Liberdam fell. I may have to call upon you again in the future―as leader of the Liberation Army, of course.<end>Thanks to the treasure you found, the Liberation Army should be able to regain some of its footing. Still, one can never have too much funding. Our comrades will have to remain frugal.<end>"

["1880069"]
japanese = "<value:$28>。<line-break>早く、エリス王妃の元へ\u3000\u3000\u3000<line-break>向かってください。<line-break>この作戦は時期を逃しては…。<line-break>とにかく、急いでください。<end>"
english = "<value:$28>, please go to Queen Eris at once. If we miss our chance, this operation will... Never mind. Just hurry.<end>"

["1880070"]
japanese = "<value:$28>。<line-break>エリス王妃への援助要請の件は<line-break>どうなったのですか？<end>"
english = "<value:$28>, what became of our request for aid from Queen Eris?<end>"

["1880071"]
japanese = "…そうですか。王妃は<line-break><value:$28>にロストール軍への<line-break>参加を求めてきたのですか…。<end>"
english = "I see. So the queen asked <value:$28> to join Rostorl's army...<end>"

["1880072"]
japanese = "<value:$28>さん、<line-break>どうしてロストール軍への参加を\u3000\u3000<line-break>拒否したんですか？<line-break>ロストール軍に参加して<line-break>それなりの功績を挙げられれば<line-break>援助を承知してくれたんでしょう？<end>"
english = "<value:$28>, why did you refuse to join Rostorl's army? If you had joined and distinguished yourself, the queen would have agreed to help us, wouldn't she?<end>"

["1880073"]
japanese = "おやめなさい。わたくしが与えた<line-break>任務は、わたくしの提案を王妃に<line-break>伝えることです。<line-break>王妃がそれを聞き入れなかった<line-break>というのでは、仕方ありません。<end>"
english = "That is enough. The task I gave was simply to convey my proposal to the queen. If she would not accept it, then there was nothing more to be done.<end>"

["1880074"]
japanese = "そ、そうでした。申しわけありません。<line-break>クリュセイス様、<line-break>それと、<value:$28>さん。<end>"
english = "Y-you're right. Please forgive me, Lady Khryuseis―and you as well, <value:$28>.<end>"

["1880075"]
japanese = "<value:$28>、<line-break>ご苦労様でした。王家にはあらためて<line-break>別の打診をしてみます。<line-break>今日は下がっていいですよ。<end>"
english = "Thank you for your efforts, <value:$28>. I will approach the royal house again with a different proposal. You may leave for the day.<end>"

["1880076"]
japanese = "<select><value:$20>%3今は特にあなたに頼まなければ\u3000\u3000<line-break>ならない任務はありません。<line-break>\u3000<line-break>わたくしには、あなたと悠長に<line-break>お話をしている時間はないのです。<line-break>下がっていていただけるかしら？<end>何をしているのか、ですって？<line-break>ディンガル軍の動きを探らせています。<line-break>その報告を待っているのです。<line-break>ロストールをリベルダムの二の舞に<line-break>させるわけにはいきません。あなたも<line-break>軍の動向には注意してください。<end>今はうかつには動けません。<line-break>解放軍は、壊滅を免れたとはいえ、<line-break>リベルダムで多くの仲間を失いました。<line-break>これまで以上に慎重に時期を選び、<line-break>ディンガルに気取られないように<line-break>動かなくては。<end>"
english = "<select><value:$20>%3I have no particular missions for you at present. Nor do I have time for a leisurely conversation with you. Would you kindly leave?<end>You ask what I'm doing? I'm having the Dyneskal Army's movements investigated, and I'm waiting for the report. We cannot let Rostorl suffer the same fate as Liberdam. You should keep a close eye on the army's movements as well.<end>We cannot afford to act carelessly now. Though the Liberation Army escaped destruction, we lost many comrades at Liberdam. We must choose our moment more carefully than ever and act without being detected by Dyneskal.<end>"

["1880077"]
japanese = "あ、<value:$28>。<line-break>その、怪我はありませんか？\u3000\u3000\u3000\u3000<line-break><value:$28>は無理をするから。<line-break>…変なことを言ってごめんなさい。<line-break>今のわたくしには、<value:$28><line-break>しかいないから…。<end>"
english = "Oh, <value:$28>. You aren't hurt, are you? You always push yourself too hard, <value:$28>. Forgive me. I shouldn't say such things. It's just that now, <value:$28> is all I have...<end>"

["1880078"]
japanese = "もう、わたくしには<line-break>これ以上大切な人を失うことに<line-break>耐えられそうもありませんもの。<line-break>あなたのことを頼ってしまった<line-break>今のわたくしには…。<end>"
english = "I don't think I could bear to lose anyone else dear to me. Not now that I've come to rely on you...<end>"

["1880079"]
japanese = "<value:$28>。<line-break>わたくし、この前、リベルダムの\u3000\u3000\u3000<line-break>難民のもとへ行ってきました。<line-break>実際に彼らの暮らしにふれる必要がある<line-break>と思ったのです。これまでは、資金と<line-break>物資の工面をするだけでしたから。<end>"
english = "<value:$28>, I recently went to visit the refugees from Liberdam. I felt I needed to see how they actually lived. Until then, all I had done was arrange funds and supplies.<end>"

["1880080"]
japanese = "そこで、初めて知りました。\u3000\u3000\u3000\u3000\u3000<line-break>人間の生きる力の強さを。<line-break>その姿の美しさを。<line-break>いえ、今まで見ようとしなかっただけ<line-break>かもしれませんね。わたくし、非市民と<line-break>聞くだけで、ゆがんで見てましたから。<end>"
english = "It was there that I first understood the strength of the human will to live, and the beauty of it. No... perhaps I had simply refused to see it before. The mere word “noncitizen” was enough to distort my view of them.<end>"

["1880081"]
japanese = "外見は、はっきり言って昔のスラムと<line-break>同じかそれ以上に不衛生だけど、<line-break>その中で生きていく力を失わない人々。<line-break>逆に教えられました。生きていくことの<line-break>大切さを…こんな風に考えられるのも、<line-break>あなたのおかげですね。<end>"
english = "To be frank, the place is as unsanitary as the old Slums were, if not worse. Yet the people there have not lost their will to survive. They were the ones who taught me how precious it is simply to live. And I can think this way now because of you.<end>"

["1880082"]
japanese = "わたくしの心の窓を開けてくれたのは<line-break>あなたの優しさですもの。<end>"
english = "It was your kindness that opened the window of my heart.<end>"

["1880083"]
japanese = "あ、<value:$28>。<end>"
english = "Oh, <value:$28>.<end>"

["1880084"]
japanese = "わたくし、<value:$28>には<line-break>ずっとそばにいてほしいのです。\u3000\u3000<line-break>\u3000<line-break>…でも、それはわたくしのわがまま。<line-break>そんなもので、あなたを<line-break>縛っておくことなどできません。<end>"
english = "I want you to stay by my side forever, <value:$28>. But that is only my selfish wish. I cannot use it to bind you to me.<end>"

["1880085"]
japanese = "でも、これだけは覚えていてください。<line-break>ここには、あなたを待っている<line-break>わたくしがいることを…。<line-break>どこに行こうとも、必ず<line-break>わたくしのもとへ帰ってきてください。<end>"
english = "But please remember this much: I will be here, waiting for you. Wherever you go, please always come back to me.<end>"

["1880086"]
japanese = "<value:$28>、あのとき、<line-break>あなたは言ってくれましたね。<line-break>わたくしのこと、放っておけないと。<line-break>わたくし、今でも覚えています。<line-break>あなたがそんな風に言ってくれて<line-break>本当にうれしかったですから。<end>"
english = "<value:$28>, you told me then that you couldn't simply abandon me. I still remember. Hearing you say that made me truly happy.<end>"

["1880087"]
japanese = "<if><value:$29><equal>%0わたくしは卑怯でした。<line-break>あなたにぬれぎぬを着せたのに、<line-break>…あなたを愛してしまった。<line-break>…ずっと素直になれなかった。<line-break>あなたに許してもらう勇気が、<line-break>わたくしにはなかったのです。<end>わたくしは卑怯でした。<line-break>あなたにぬれぎぬを着せたのに、<line-break>…あなたを頼ってしまった。<line-break>…ずっと素直になれなかった。<line-break>あなたに許してもらう勇気が、<line-break>わたくしにはなかったのです。<end>"
english = "<if><value:$29><equal>%0I was a coward. Even after I falsely accused you... I fell in love with you. I could never bring myself to be honest. I lacked the courage to ask your forgiveness.<end>I was a coward. Even after I falsely accused you... I came to rely on you. I could never bring myself to be honest. I lacked the courage to ask your forgiveness.<end>"

["1880088"]
japanese = "でも、わたくしのこんな気持ちを、<line-break>あなたは一言で解消してくれました。<line-break>放っておけないから、と。<end>"
english = "But with just a few words, you put all those feelings to rest. You said you couldn't simply abandon me.<end>"

["1880089"]
japanese = "だから、<value:$28>も<line-break>忘れないでください。あなたのことを<line-break>放っておけないわたくしがいることを。<end>"
english = "So please remember this too, <value:$28>: I cannot simply abandon you either.<end>"

["1880090"]
japanese = "<value:$28>、<line-break>難民の数は膨れ上がる一方です。\u3000<line-break>このままでは、また資金が…。<line-break><value:$28>には、<line-break>１００００ギアほど提供してくれる<line-break>ようなあてはありませんか？<end>"
english = "<value:$28>, the number of refugees continues to swell. At this rate, we will run short of funds again. Do you know of anyone who might provide around 10,000 Gea, <value:$28>?<end>"

["1880091"]
japanese = "資金を援助する<end>"
english = "Provide the funds<end>"

["1880092"]
japanese = "期待されても困る<end>"
english = "Don't expect that from me<end>"

["1880093"]
japanese = "資金を援助してくれるのですか？<line-break>あなたが！？<end>"
english = "You will provide the funds? You?!<end>"

["1880094"]
japanese = "…感謝の言葉もありません。<line-break>この資金を必要としている人たちに<line-break>かわってお礼を言わせてください。<line-break>本当にありがとう。<end>"
english = "I cannot thank you enough. Please allow me to offer my thanks on behalf of all those who need this money. Thank you, truly.<end>"

["1880095"]
japanese = "１００００ギアを資金提供した。<end>"
english = "Provided 10,000 Gea in funding.<end>"

["1880096"]
japanese = "それでは、わたくし、さっそく<line-break>難民を支援できるように手配を\u3000\u3000<line-break>整えてきます。<line-break><value:$28>、今のわたくしは<line-break>あなただけが頼りです。<line-break>それでは、行ってきます。<end>"
english = "Then I shall go and make the arrangements to aid the refugees at once. <value:$28>, you are the only person I can rely on now. I must be going.<end>"

["1880097"]
japanese = "…そうですよね。<line-break>１００００ギアなんて、そんなに簡単に<line-break>手に入れられるわけがありませんね。<end>"
english = "Of course. There is no easy way to obtain 10,000 Gea.<end>"

["1880098"]
japanese = "無理なこと言ってしまいましたね。<line-break>…忘れてください。<end>"
english = "I asked too much of you. Please forget I said anything.<end>"

["1880099"]
japanese = "<value:$28>…。<end>"
english = "<value:$28>...<end>"

["1880100"]
japanese = "<value:$28>…、<line-break>恥を忍んで言います。実はまた<line-break>資金が足りなくなりそうなのです。<end>"
english = "<value:$28>... I am ashamed to admit this, but it seems we are about to run short of funds again.<end>"

["1880101"]
japanese = "…今の解放軍は小さな組織です。<line-break>解放軍の運営だけなら、これまでの\u3000<line-break>資金で問題はありませんでした。<line-break>ですが、問題はロセン、リベルダムの<line-break>難民なのです。彼らの生活を支援する<line-break>ための資金がないのです。<end>"
english = "The Liberation Army is a small organization now. The funds we already had would have been enough to maintain the army itself. The problem is the refugees from Rocen and Liberdam. We have no money with which to support them.<end>"

["1880102"]
japanese = "カルラ軍はロセンとリベルダムを<line-break>攻略する際、無抵抗の市民は決して<line-break>殺さないように厳命しています。<line-break>そのおかげで多くの命が無意味に<line-break>奪われることなくすみました。<line-break>ですが、そのかわりに…。<end>"
english = "When taking Rocen and Liberdam, Karula's Army issued strict orders that civilians who did not resist were never to be killed. Thanks to that, many lives were spared a senseless end. But in exchange...<end>"

["1880103"]
japanese = "両方の町の郊外には、<line-break>難民があふれているのです。<line-break>彼らを見捨てることはできません。<end>"
english = "The outskirts of both towns are now overflowing with refugees. I cannot abandon them.<end>"

["1880104"]
japanese = "解放軍の中には、ディンガル軍への<line-break>抵抗運動よりも、難民の救済に資金が<line-break>流れるのが不満な仲間もいます。<line-break>ですが、わたくしには、ディンガルとの<line-break>戦いのために、難民を放っておくなど<line-break>どうしてもできないのです。<end>"
english = "Some in the Liberation Army resent seeing funds spent on refugee relief rather than resistance against the Dyneskal Army. But I cannot abandon the refugees merely for the sake of fighting Dyneskal.<end>"

["1880105"]
japanese = "<value:$28>、<line-break>わたくし、間違っているのでしょうか？<line-break>\u3000<line-break>やはり、わたくしのような娘には<line-break>解放軍の指導者など務まらないのかも<line-break>しれませんね…。<end>"
english = "<value:$28>, am I wrong? Perhaps a young woman like me truly is unfit to lead the Liberation Army...<end>"

["1880106"]
japanese = "せめて、今あと<line-break>１００００ギアあれば…。<end>"
english = "If only we had another 10,000 Gea now...<end>"

["1880107"]
japanese = "資金を援助する<end>"
english = "Provide the funds<end>"

["1880108"]
japanese = "そんな大金は渡せない<end>"
english = "I can't give you that much<end>"

["1880109"]
japanese = "え？\u3000今なんて…？<end>"
english = "What? What did you just say?<end>"

["1880110"]
japanese = "あ、あなたが、<line-break>資金を出してくれると言うのですか？<line-break>１００００ギアも！？<end>"
english = "Y-you mean you will provide the funds? All 10,000 Gea?!<end>"

["1880111"]
japanese = "どうしてそれほどの大金を<line-break>そんなに簡単に出してくれるのです？<line-break>解放軍のため？\u3000難民のため？<line-break>それとも、わたくしの…。<end>"
english = "How can you part with such a great sum so readily? Is it for the Liberation Army? For the refugees? Or for me...<end>"

["1880112"]
japanese = "わたくし、何を言っているのかしら。<line-break><value:$28>は、解放軍の一員<line-break>ですもの、解放軍のためよね。<line-break>でも、あなたはわたくしのやり方に<line-break>賛同してくれるのですね。<line-break>…正直に言って、うれしいです。<end>"
english = "What am I saying? You are a member of the Liberation Army, <value:$28>, so of course it is for the army. But this means you approve of what I am doing. To be honest, that makes me very happy.<end>"

["1880113"]
japanese = "あなたの資金提供の申し出、<line-break>ありがたく受けいれさせてもらいます。<line-break>本当にありがとう。<end>"
english = "I gratefully accept your offer of financial aid. Thank you, truly.<end>"

["1880114"]
japanese = "１００００ギアを資金提供した。<end>"
english = "Provided 10,000 Gea in funding.<end>"

["1880115"]
japanese = "これで、難民の暮らしをいくらか<line-break>楽にしてあげられます。わたくし<line-break>さっそく手はずを整えなくては。<line-break><value:$28>、<line-break>今日のこと、わたくし<line-break>決して忘れませんから。<end>"
english = "This will make life a little easier for the refugees. I must begin making arrangements at once. <value:$28>, I will never forget what you have done today.<end>"

["1880116"]
japanese = "余計なことを言ってしまいましたね。<line-break>こんなことを言っていても資金が<line-break>降ってくるわけじゃありませんのに…。<line-break><value:$28>、もう解放軍に<line-break>いても、ディンガルと戦うことは<line-break>できないかもしれません。<end>"
english = "I should not have said any of that. Talking about it will not make money fall from the sky. <value:$28>, even if you remain with the Liberation Army, you may no longer be able to fight Dyneskal.<end>"

["1880117"]
japanese = "もし、あなたがディンガルとの戦いを<line-break>望むなら、解放軍を離れた方が<line-break>いいかもしれません。<line-break>わたくしには、そう望む人を<line-break>止める権利はありません。<line-break>…もう、行ってください。<end>"
english = "If fighting Dyneskal is what you want, perhaps you should leave the Liberation Army. I have no right to stop anyone who wishes to do so. Please, go now.<end>"

["1880118"]
japanese = "<select><value:$20>%2わたくしが間違っているのかしら？<line-break>あの難民のすべてを救おうなんて<line-break>思い上がりなのかしら？<end>ディンガルをはやく倒すことが<line-break>できれば、これ以上の難民を<line-break>出さずにすむかもしれない。<line-break>でも、今困っている人たちを<line-break>見過ごすことはできません。<end>"
english = "<select><value:$20>%2Am I wrong? Is it arrogance to think I can save every one of those refugees?<end>If we could defeat Dyneskal quickly, perhaps we could prevent more people from becoming refugees. But I cannot turn away from those who are suffering now.<end>"

["1880119"]
japanese = "…<value:$28>。<line-break>今日はどうしたのですか？<end>"
english = "<value:$28>... What brings you here today?<end>"

["1880120"]
japanese = "難民支援のための<line-break>資金不足のことですか？<line-break>今のところ、どうにか大丈夫です。\u3000<line-break>…でも、<value:$28>はどうして<line-break>そこまで、資金を援助してくれようと<line-break>するのですか？<end>"
english = "Is this about the shortage of funds for refugee aid? We are managing somehow for now. But why are you willing to provide so much financial help, <value:$28>?<end>"

["1880121"]
japanese = "他の解放軍の面々は、<line-break>ディンガルへの憎しみのあまり<line-break>戦うことばかり主張しているのに…。\u3000<line-break>前々から不思議に思っていました。<line-break>あなたはどうして、そこまで<line-break>わたくしの活動を助けてくれるのです？<end>"
english = "The other members of the Liberation Army are so consumed by their hatred of Dyneskal that all they speak of is fighting. I have wondered about this for some time. Why do you go so far to help me with my work?<end>"

["1880122"]
japanese = "難民が哀れだからですか？<line-break>それとも…<end>"
english = "Is it because you pity the refugees? Or...<end>"

["1880123"]
japanese = "難民を救うのも解放軍の義務だから<end>"
english = "Because saving refugees is also the Liberation Army's duty<end>"

["1880124"]
japanese = "クリュセイスを放っておけないから<end>"
english = "Because I can't just leave Khryuseis alone<end>"

["1880125"]
japanese = "そう…ですよね。<line-break>わたくしの考えは間違っては<line-break>いないのですよね。<line-break>あなたがそう言ってくれて<line-break>わたくしも、少しは気が楽に<line-break>なりました。<end>"
english = "Yes... of course. Then I am not wrong in what I am doing. Hearing you say so has eased my mind a little.<end>"

["1880126"]
japanese = "でも、わたくしは…。<end>"
english = "But I...<end>"

["1880127"]
japanese = "…わたくし、これから行かなければ<line-break>いけないところがあったのを<line-break>思い出しました。<line-break>失礼させていただくわ、<line-break><value:$28>。<end>"
english = "I just remembered that I have somewhere I must be. Please excuse me, <value:$28>.<end>"

["1880128"]
japanese = "（わたくし、何を期待しているの？<line-break>\u3000<value:$28>がわたくしを<line-break>\u3000許してくれるはずないのに…。）<end>"
english = "(What was I hoping for? <value:$28> could never forgive me...)<end>"

["1880129"]
japanese = "え？\u3000…そんな、まさか…。<end>"
english = "What? No... surely not...<end>"

["1880130"]
japanese = "…わたくし、あなたには\u3000\u3000\u3000\u3000\u3000\u3000<line-break>一生許してもらえないと<line-break>思っていました。<line-break>ぬれぎぬを着せて…あんなにひどい<line-break>仕打ちをしたわたくしには、あなたに<line-break>優しくしてもらう資格はないと…。<end>"
english = "I thought you would never forgive me. After falsely accusing you and treating you so cruelly, I believed I had no right to receive any kindness from you...<end>"

["1880131"]
japanese = "ですから、わたくし、あなたを<line-break>解放軍の一員としてしか見ないように<line-break>決めていたのです。<line-break>わたくしを助けてくれるあなたを<line-break>ついつい頼ってしまいそうに<line-break>なるから…。<end>"
english = "That is why I decided I would see you only as a member of the Liberation Army. With you helping me, I knew I might find myself relying on you...<end>"

["1880132"]
japanese = "そんなこと、決して<line-break>許されないことなのに…。<line-break>虫がよすぎることなのに…。\u3000\u3000\u3000\u3000\u3000<line-break>でも、お父様を失い、<line-break>おじさまに捨てられたわたくしを<line-break>支えてくれる人は…もういないから…。<end>"
english = "I could never allow myself to do that. It would be far too selfish. But after losing Father and being cast aside by Uncle, there is no one left to support me...<end>"

["1880133"]
japanese = "<if><value:$29><equal>%0<value:$28>…。<line-break>ごめんなさい、<value:$28>！<line-break>わたくしの愚かさを許してください！<line-break>そして、許されるなら、<line-break>…わたくし、あなたのことを<line-break>好きになってもかまいませんか？<end><value:$28>…。<line-break>ごめんなさい、<value:$28>！<line-break>わたくしの愚かさを許してください！<line-break>そして、許されるなら、<line-break>…わたくし、あなたのことを<line-break>これからも頼ってかまいませんか？<end>"
english = "<if><value:$29><equal>%0<value:$28>... I'm sorry, <value:$28>! Please forgive my foolishness! And if I may... may I allow myself to love you?<end><value:$28>... I'm sorry, <value:$28>! Please forgive my foolishness! And if I may... may I continue to rely on you?<end>"

["1880134"]
japanese = "ありがとう、<value:$28>…。<line-break>これからも、わたくしのそばに<line-break>いてください。<line-break>わたくしを、支えて…。<end>"
english = "Thank you, <value:$28>... Please stay by my side from now on. Please... support me.<end>"

["1880135"]
japanese = "<select><value:$20>%3クリュセイス様なら<line-break>今、はずしてらっしゃる。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>本当に、忙しい人だ。<line-break>何もかも自分ひとりで背負い込んで…。<line-break>どうやら、ほとんど、<line-break>眠ってらっしゃらないようだ。<end>クリュセイス様は<line-break>お仕事がお忙しくてな。<line-break>今日も飛び回っていらっしゃる。<line-break>そのうち、本当に忙殺されて<line-break>死んでしまうのではないかと<line-break>思うほどだ。<end>クリュセイス様は、激務で心身ともに\u3000\u3000\u3000<line-break>すり減らしておられる。まだ若いのだから、<line-break>恋のひとつでもしていたかろうに。<line-break>我らにつらくあたるときもあるが仕方ない。<line-break>この解放軍を、リベルダム陥落後、<line-break>ひとりで支えてきたようなものだからな。<end>"
english = "<select><value:$20>%3Khryuseis is away at the moment. She really never stops. She takes everything on herself... It seems she barely sleeps.<end>Khryuseis has been busy with her duties. She's rushing from place to place again today. At this rate, I fear she may literally work herself to death.<end>The relentless work is wearing Khryuseis down, in both body and mind. She's still young; surely she'd rather have time for a little romance. She can be hard on us sometimes, but who can blame her? Since the fall of Liberdam, she's practically held the Liberation Army together single-handedly.<end>"

["1880136"]
