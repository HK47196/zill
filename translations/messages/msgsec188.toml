["1880000"]
japanese = "解放軍イベント開始<end>"
english = ""

["1880001"]
japanese = "おお、<value:$28>。<line-break>お前が来るのを待っていたんだ。<line-break>クリュセイス様のお話を聞いてくれ。<end>"
english = "Ah, <value:$28>. I've been waiting for you. Please hear what Lady Khryuseis has to say.<end>"

["1880002"]
japanese = "待っていました、<line-break><value:$28>。<line-break>あなたに頼みたいことがあります。<line-break>先日、リベルダムの廃墟から、<line-break>埋蔵金のありかを記した地図が<line-break>見つかったのです。<end>"
english = "I've been waiting for you, <value:$28>. I have a favor to ask. A map showing the location of a hidden fortune was recently found among the ruins of Liberdam.<end>"

["1880003"]
japanese = "おそらく、リベルダムの商人が<line-break>隠していたのでしょう。ですから<line-break>それなりの額が期待できます。<line-break>おわかりですね？\u3000この埋蔵金を<line-break>解放軍の資金としたいのです。<end>"
english = "It was probably hidden by one of Liberdam's merchants, so we can expect a considerable sum. You understand, I trust? I want to use this fortune to fund the Liberation Army.<end>"

["1880004"]
japanese = "そこで、<value:$28>。<line-break>あなたに、埋蔵金のありかを<line-break>調査してもらいたいのです。<line-break>引き受けてもらえますね？<end>"
english = "And so, <value:$28>, I would like you to investigate its whereabouts. You will accept, won't you?<end>"

["1880005"]
japanese = "引き受ける<end>"
english = "Accept<end>"

["1880006"]
japanese = "引き受けない<end>"
english = "Decline<end>"

["1880007"]
japanese = "それでは、さっそく<line-break>調査に向かってください。\u3000\u3000\u3000<line-break>\u3000<line-break>地図によると、埋蔵金は<line-break>ロストールの東にある洞窟に<line-break>隠されているようです。<end>"
english = "Then please begin your investigation at once. According to the map, the fortune appears to be hidden in a cave east of Rostorl.<end>"

["1880008"]
japanese = "それと、以前お父様に聞いた話では<line-break>財宝を隠すときに、門番として<line-break>モンスターを置く商人もいたそうです。<line-break>くれぐれも、用心してください。<end>"
english = "One more thing. My father once told me that some merchants left monsters to guard their hidden treasure. Please be extremely careful.<end>"

["1880009"]
japanese = "埋蔵金は<line-break>ロストールの東に行ったところにある<line-break>洞窟に隠されているようです。<line-break>よろしく、頼みますよ。<end>"
english = "It seems the buried treasure is hidden in a cave east of Rostorl. I'm counting on you.<end>"

["1880010"]
japanese = "解放軍の活動には、どうしても<line-break>資金が必要だ。リベルダムの商人の<line-break>埋蔵金なら期待できる。<line-break>頼んだぞ、<value:$28>。<end>"
english = "The Liberation Army cannot carry on without funds. The buried treasure of a Liberdam merchant looks promising. I'm counting on you, <value:$28>.<end>"

["1880011"]
japanese = "…解放軍の活動よりも<line-break>優先させることが、<line-break>あなたにはあるというのですか？<line-break>仕方ありませんね。<line-break>他の仲間に当たってみることにします。<line-break>もう、行っていいですよ。<end>"
english = "You have something more important than the work of the Liberation Army? Very well. I will ask one of our other comrades. You may go now.<end>"

["1880012"]
japanese = "今はあなたに用はありませんよ。<line-break>どこにでも行ってください。<end>"
english = "I have no need of you at present. Go wherever you please.<end>"

["1880013"]
japanese = "お前なら、埋蔵金の調査に適任だと<line-break>思ったんだがな。<line-break>残念だよ。<end>"
english = "I thought you'd be just the person to investigate the buried treasure. Too bad.<end>"

["1880014"]
japanese = "モンスターに守らせているということは<line-break>リベルダム商人の埋蔵金はこの奥だね。<line-break>さぁ、見てみよう。<end>"
english = "The fact that monsters were set to guard it means the Liberdam merchants' hidden treasure must be farther in. Come on, let's take a look.<end>"

["1880015"]
japanese = "埋蔵金を発見した。<end>"
english = "Buried treasure found.<end>"

["1880016"]
japanese = "お金は貯め込まれているだけでは<line-break>無意味だからね。お金にとっても<line-break>見つけてもらってよかったのかもね。<line-break>さぁ、<value:$28>。<line-break>戻って、埋蔵金を発見したことを<line-break>報告しないと。<end>"
english = "Money is worthless if all you do is hoard it. Maybe even the money itself is glad we found it. Come on, <value:$28>. We need to go back and report that we found the hidden treasure.<end>"

["1880017"]
japanese = "モンスターが守っているってことは<line-break>埋蔵金はこの奥みたいだね。<line-break>\u3000<line-break>どれくらいあるんだろう。<line-break>早く見てみようよ。<end>"
english = "If monsters are guarding it, the hidden treasure must be farther in. I wonder how much there is. Come on, let's hurry and see!<end>"

["1880018"]
japanese = "うわぁ！\u3000さすが、リベルダムの商人の<line-break>埋蔵金だね。ボクが想像してたのよりも<line-break>ずっとすごいや。<line-break>これで解放軍のお金の問題も解決だね。<line-break>さぁ、戻ろう、<value:$28>。<end>"
english = "Wow! You'd expect no less from the Liberdam merchants' hidden treasure. It's far more impressive than I imagined! This should solve the Liberation Army's money troubles. Come on, let's head back, <value:$28>.<end>"

["1880019"]
