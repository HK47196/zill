["1880047"]
japanese = "どういうことかと尋ねたのですが、<line-break>作戦上の秘密だからと、<line-break>教えてくれませんでした。<line-break>ただ、活動資金は送ると。<line-break>…いったい、何があったのです？<end>"
english = "I asked why, but the messenger refused to say, claiming it was a military secret. I was told only that we would receive the funding. What in the world happened?<end>"

["1880048"]
japanese = "ロストール軍に参戦したと言う<end>"
english = "Say that I joined Rostorl's army<end>"

["1880049"]
japanese = "参戦したことは伏せておく<end>"
english = "Keep quiet about having joined the fighting<end>"

["1880050"]
japanese = "…やはりそうだったのですか。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>実は、すでにロストール軍の中に、<line-break>あなたに似た将軍がいたと報告を<line-break>受けていました。それで、もしやと…。<end>"
english = "So it was true. I had already received reports of a general in Rostorl's army who resembled you. I wondered if perhaps...<end>"

["1880051"]
japanese = "…解放軍のために命を懸けて<line-break>くださったのですね。<line-break>解放軍を率いる者として礼を言います。<line-break>本当にありがとう。<line-break>…それと、ごめんなさい。<line-break>危険な目にあわせてしまって…。<end>"
english = "You risked your life for the Liberation Army. As its leader, you have my thanks. Thank you, truly. And... I'm sorry. I put you in such danger.<end>"

["1880052"]
japanese = "今回の任務では<line-break>本当にご苦労さまでした。<line-break>ゆっくり休んでください。\u3000\u3000<line-break>もう下がっていいですよ。<line-break>…それと、<line-break>みなさんも下がってください。<end>"
english = "You've worked very hard on this mission. Please get some rest. You may go now. And the rest of you may leave as well.<end>"

["1880053"]
japanese = "解放軍を率いる者として…だなんて…<line-break>わたくし、どうして、<line-break>素直に言えないの？<line-break>本当にわたくし、<line-break>かわいげのない女だわ…。<line-break>でも…。<end>"
english = "“As leader of the Liberation Army”... Why can't I just say what I mean? I'm really not a very likable woman, am I? But...<end>"

["1880054"]
