english = "Refuse to go<end>"

["1880041"]
japanese = "ロストール王家まで滅んでしまっては、<line-break>解放軍は後ろ盾を失ってしまいます。<line-break>頼みましたよ。<end>"
english = "If the Rostorl Royal House falls as well, the Liberation Army will lose its patron. I'm counting on you.<end>"

["1880042"]
japanese = "ロストール王家の存亡は、<line-break>我々解放軍にとっても死活問題です。<line-break>くれぐれも失敗しないように。<end>"
english = "The survival of the Rostorl Royal House is a matter of life and death for us in the Liberation Army as well. Make certain you do not fail.<end>"

["1880043"]
japanese = "…そうですか。<line-break>仕方ありません、他の人に<line-break>行ってもらうことにします。\u3000<line-break>あなたへの用はそれだけです。<line-break>もう、下がってください。<end>"
english = "I see. Very well, I'll send someone else. That was all I needed from you. You are dismissed.<end>"

["1880044"]
japanese = "あなたへの用はもうありません。<line-break>下がってください。<end>"
