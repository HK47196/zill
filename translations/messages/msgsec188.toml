["1880142"]
japanese = "<select><value:$20>%2ディンガルの奴らはずる賢い。<line-break>奴らはロセンでは、王政の時より少しだけ<line-break>住民よりの政治をしているんだ。<line-break>だから、ロセンの住民の中には<line-break>むしろディンガルの統治を歓迎<line-break>する動きもある。困ったものだ。<end>リベルダムでのディンガルの統治の<line-break>話を聞いたか？\u3000奴らは、市民非市民の\u3000<line-break>階級制度をなくしてしまったんだ。<line-break>おかげで非市民だった連中は、差別を<line-break>受けなくなったって喜んでいるらしい。<line-break>困ったものだ。<end>"
english = "<select><value:$20>%2The Dyneskal are a crafty lot. In Rocen, they're governing just a little more in the residents' interests than the monarchy did. So some of the people there are actually starting to welcome Dyneskal rule. That's a problem.<end>Have you heard how the Dyneskal are governing Liberdam? They've abolished the whole citizen and noncitizen class system. Apparently, the former noncitizens are delighted that they're no longer being discriminated against. That's a problem.<end>"

["1880143"]
japanese = "リベルダムが陥落し、<line-break>解放軍は財政上の大きな基盤を失った。<line-break>蓄えがなくなるのは時間の問題だ。<line-break>このままでは、ディンガルを倒す前に<line-break>我々が自滅してしまう。<line-break>なんとかしなければ…。<end>"
english = "With Liberdam fallen, the Liberation Army has lost a major source of financial support. It is only a matter of time before our reserves run dry. At this rate, we will destroy ourselves before we can defeat Dyneskal. We have to do something...<end>"

["1880144"]
japanese = "<select><value:$20>%2知っているか？\u3000クリュセイス様は<line-break>解放軍の資金の大部分を、リベルダムや<line-break>ロセンの難民の救済に回すらしい。<line-break>ただでさえ、資金難だというのに<line-break>これでは、いくら資金があっても<line-break>足らないぞ。困ったものだ。<end>クリュセイス様は難民の救済にもっと<line-break>資金を回すように主張しているそうだ。<line-break>以前は非市民と毛嫌いしていたのにな。<line-break>今は一刻も早くディンガルを倒して<line-break>難民をこれ以上増やさないことの方が<line-break>重要なんだが。困ったものだ。<end>"
english = "<select><value:$20>%2Have you heard? Lady Khryuseis apparently intends to spend most of the Liberation Army's funds on relief for the refugees from Liberdam and Rocen. We are already short of money. At this rate, no amount will ever be enough. What a mess.<end>They say Lady Khryuseis is insisting that even more money be devoted to refugee relief. And she used to despise them for being non-citizens. But what matters more right now is defeating Dyneskal as soon as possible, so we don't end up with even more refugees. What a mess.<end>"

["1880145"]
japanese = "カルラ軍は町を攻略するときに<line-break>無抵抗の住民には手を出さないように\u3000<line-break>命じているそうです。<line-break>どうやら、皇帝ネメアのお達し<line-break>らしいんですがね。まぁ、<line-break>ありがたいことではあるんですが、\u3000\u3000<end>"
english = "I hear Karula's Army has orders not to harm civilians who offer no resistance when they take a town. Apparently, the order came from Emperor Nemea himself. Well, I suppose we should be grateful, but...<end>"

["1880146"]
japanese = "ロセンやリベルダムの郊外に難民が<line-break>あふれているのは、カルラが住民を\u3000\u3000<line-break>殺さなかったからなんだそうです。<line-break>我々解放軍の立場上、彼らを見捨てて<line-break>おけない。それを見すかしたカルラの<line-break>作戦だと言っている人もいましたよ。<end>"
english = "They say the outskirts of Rocen and Liberdam are overflowing with refugees because Karula spared the people there. Given our position as the Liberation Army, we cannot simply abandon them. Some say Karula foresaw that and made it part of her strategy.<end>"

["1880147"]
japanese = "<value:$28>、<line-break>これからも、わたくしのことを<line-break>支えていてくださいね。<end>"
english = "Please continue to support me, <value:$28>.<end>"

["1880148"]
