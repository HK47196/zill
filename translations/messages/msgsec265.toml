["2650005"]
japanese = "あ、あたしの…？<end>"
english = "I-In me...?<end>"

["2650006"]
japanese = "忘れているだろうけど、<line-break>君は一度、ソウルを失ったんだよ。<line-break>\u3000<line-break>魔道士マスカードの操る<line-break>魂切の鎌で、胸を貫かれてね。<line-break>\u3000<line-break>君が今、こうして存在していられるのは<line-break>身代わりになってソウルを捧げた人が<line-break>いるからさ。<end>"
english = "You probably don't remember, but you lost your Soul once. The sorcerer Mascar drove the Soul-Reaping Scythe through your chest. You can exist as you do now only because someone took your place and offered up his Soul.<end>"

["2650007"]
japanese = "まさかその人って…ジリオン！？<end>"
english = "You don't mean... Zillion!?<end>"

["2650008"]
japanese = "アハハハ。ご名答！<end>"
english = "Hahahaha! Correct!<end>"

["2650009"]
japanese = "ジリオンの無限のソウルと<line-break>同化の髪飾りの力で<line-break>今の君は生かされているのさ。<line-break>君の核を…君の想いで２つの力に、<line-break>支えさせているんだよ。<end>"
english = "Zillion's Infinite Soul and the power of the Hair Ornament of Assimilation are what keep you alive now. Your feelings make those two powers sustain your core.<end>"

["2650010"]
japanese = "そんな…そんなことが……。<end>"
english = "No... That can't be...<end>"

["2650011"]
japanese = "まぎれもない事実だよ。<line-break>君は認めたくないだろうけど。<line-break>\u3000<line-break>…それに、君の想いはかなわない。<line-break>君が現れたとき、彼が消えた…。<line-break>今度は彼が現れれば、君が消える。<line-break>さて、どうすればいいのかな？<end>"
english = "It's the undeniable truth, whether you want to accept it or not. And your wish can never come true. When you appeared, he vanished. If he returns, you'll be the one to vanish. So what can be done?<end>"

["2650012"]
japanese = "…わからない。<line-break>あたしにはどうすればいいのか…。<end>"
english = "I don't know. I don't know what I'm supposed to do...<end>"

["2650013"]
japanese = "簡単だよ。不公平を解消すればいいのさ。<line-break>君自身は消えてしまうけど、それで<line-break>どちらの願いもかなうことになる。<line-break>肉体を捨てることで、君とジリオンは<line-break>永遠に一緒にいられるんだよ。<end>"
english = "It's simple. All you have to do is set things right. You'll disappear, but both wishes will come true. Once you cast off your body, you and Zillion can be together forever.<end>"

["2650014"]
japanese = "あとは君の決断ひとつだ。<line-break>君は消えて願いをかなえ、<line-break>僕はその報酬に同化の髪飾りをもらう。<line-break>悪くない取引だよ。<line-break>さあ、おいで。イーシャ。<end>"
english = "All that's left is for you to decide. You disappear and get your wish, and I receive the Hair Ornament of Assimilation as my reward. Not a bad bargain. Come along, Iria.<end>"

["2650015"]
japanese = "助けに入る<end>"
english = "Step in to help<end>"

["2650016"]
japanese = "様子を見る<end>"
english = "Wait and see<end>"

["2650017"]
japanese = "<value:$28>…！<end>"
english = "<value:$28>...!<end>"

["2650018"]
japanese = "無粋な邪魔が入っちゃったね。<line-break>僕の力が必要になったときは<line-break>ゼグナ鉱山に来るといいよ。イーシャ。<end>"
english = "What an uncouth interruption. If you ever find yourself in need of my power, come to Zegna Mine, Iria.<end>"

["2650019"]
japanese = "君も鈍感だなぁ。<line-break>素人はこれだから困るんだ。<line-break>\u3000<line-break>彼女は優しい子だったけど<line-break>幼いころから愛にめぐまれなかった。<line-break>\u3000<line-break>それを利用されて陰謀に巻きこまれ、<line-break>挙げ句の果てに、魂切の鎌で<line-break>ソウルを刈り取られたのさ。<line-break>ソウルが消えた時点でその人は<line-break>もう終わりだよ。普通ならね。<line-break>\u3000<line-break>でも、ジリオンの強い想いが、<line-break>奇跡的に彼女を救った。<line-break>\u3000<line-break>欲望をかなえる闇の神器・同化の髪飾りと<line-break>ジリオンのソウルが、彼女の想いを支え、<line-break>その消滅を食い止めているんだ。<end>"
english = "You're rather slow on the uptake yourself. Amateurs are always such a nuisance. She was a kind child, but she grew up starved of love. Someone exploited that and drew her into a conspiracy, and in the end the Soul-Reaping Scythe harvested her Soul. Once a person's Soul is gone, that's the end. Ordinarily, at least. But the strength of Zillion's feelings miraculously saved her. The Hair Ornament of Assimilation, a Dark Artifact that grants desires, and Zillion's Soul sustain her feelings and keep her from vanishing.<end>"

["2650020"]
japanese = "今の彼女を支えているのは<line-break>ジリオンへの強い想いだけだよ。<line-break>でも、その想いがいつまで続くかな？<line-break>人間の心なんて、はかなく、<line-break>移ろいやすい。<line-break>\u3000<line-break>彼女の想いが弱まれば、<line-break>彼女自身も消えてしまうんだ。<line-break>\u3000<line-break>僕はジリオンの居場所を知っている。<line-break>今ならまだイーシャの想いをそこに<line-break>運ぶことができたんだ。<end>"
english = "The only thing sustaining her now is the strength of her feelings for Zillion. But how long will those feelings last? The human heart is frail and fickle. If her feelings weaken, she herself will vanish. I know where Zillion is. There was still time for me to carry Iria's feelings there.<end>"

["2650021"]
japanese = "それが最良の結果になるはずだった…。<line-break>無知な君に台無しにされなければね。<line-break>ホントに善良なお節介焼きだよ、君は。<end>"
english = "That should have been the best possible outcome... until your ignorance ruined it. You really are a well-meaning meddler.<end>"

["2650022"]
japanese = "わかったわ…。<line-break>それでジリオンと一緒になれるのなら。<end>"
english = "All right... If it means I can be with Zillion.<end>"

["2650023"]
japanese = "いい子だ。イーシャ。<line-break>僕は約束を守るよ。<end>"
english = "Good girl, Iria. I'll keep my promise.<end>"

["2650024"]
japanese = "賢明な判断だったね。<value:$28>。<line-break>君と僕が傷つけ合うこともなく<line-break>イーシャの願いはかなえられた。<line-break>同化の髪飾りは僕がもらっていくよ。<line-break>まさか異論はないよね？\u3000アハハハ。<end>"
english = "A wise decision, <value:$28>. Iria's wish was granted without you and me having to hurt each other. I'll be taking the Hair Ornament of Assimilation. Surely you don't object? Hahahaha.<end>"

