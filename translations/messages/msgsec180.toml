english = "<if><value:$01><equal>3How could this be...? Lord Nemea... We should visit Cat Manor later and report what happened.<end><if><value:$01><equal>4I think we might've done something really bad. But it was all that bearded four-eyes' fault, right? Maybe we're not to blame. Still, I suppose we should tell Orphaus.<end><if><value:$01><equal>5You've got to be kidding me... Nemea's dead?! Hey, don't you think we ought to tell Orphaus?<end><if><value:$01><equal>6I can't believe it. Nemea... is dead? Don't you think we should tell Orphaus?<end><if><value:$01><equal>13That man said something strange―that Nemea had drawn closer to darkness. We should probably speak with Orphaus about it.<end><if><value:$01><equal>10Sis, isn't this seriously bad? We should tell Orphaus later.<end><if><value:$01><equal>14How could this be...? Nemea... We should probably speak with Orphaus.<end><if><value:$01><equal>15How could this happen...? Nemea... <value:$28>, don't you think we should tell Orphaus?<end><if><value:$01><equal>17Honestly! First he kills a king and throws everyone into an uproar, then he goes and dies in a place like this. The sheer impropriety! Clearly, this is his parent's fault. We're going to complain to Orphaus!<end><if><value:$01><equal>19No way... Nemea's dead? This is terrible! We have to tell Orphaus!<end><if><value:$01><equal>20I don't believe he's dead... Even so, we should inform Orphaus.<end><if><value:$01><equal>11Lord Nemea... How could this happen...? We should tell Orphaus what happened.<end><if><value:$01><equal>21I can't believe it. Nemea... is dead? <value:$28>, let's tell Orphaus.<end><if><value:$01><equal>23No... It can't be... Lord Nemea... <value:$28>, we're going to tell Orphaus.<end><if><value:$01><equal>27How could this happen...? Nemea... <value:$28>, let's tell Orphaus.<end><if><value:$01><equal>26How could this be...? Nemea... We should visit Cat Manor later and report what happened.<end><if><value:$01><equal>24Lord Nemea... We should visit Cat Manor later and report this to Lord Orphaus.<end><if><value:$01><equal>25No... He died... This is terrible! We have to tell Orphaus!<end><if><value:$01><equal>192We must inform Cat Manor of Nemea's vanishing.<end><if><value:$01><equal>193N-no! We got Nemea killed...! I-it was my fault... I'm s-so sorry...! <value:$28>! We have to apologize to Orphaus...!<end><if><value:$01><equal>194Only Jusapubros can open the door to the Interdimensional Rift. Shalli and the others have him completely in their clutches. Let's return to Cat Manor and decide what to do next...<end><if><value:$01><equal>191No. Nemea can't be dead. In any case, perhaps we should go report this at Cat Manor...<end><if><value:$01><equal>190Impossible! He cannot be dead! I can't even conceive of it! But whatever happened, we must tell Orphaus and the others. They are Nemea's family.<end>I can't believe even Nemea was defeated... That's a problem. Now I've got one less subject for my songs. Hmm... but is he really dead? Shall we ask Orphaus?<end>"

