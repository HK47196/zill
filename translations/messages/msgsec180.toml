["1800087"]
japanese = "\u3000\u3000青竜将軍カルラ率いるディンガル軍と<line-break>\u3000\u3000\u3000ゼネテス率いるロストール軍は<line-break>\u3000\u3000\u3000竜骨の砂漠南の街道で対峙した。<line-break>\u3000<line-break>\u3000\u3000レムオンら有力貴族の出兵拒否により<line-break>\u3000\u3000\u3000\u3000ロストール軍は、青竜軍の<line-break>\u3000\u3000\u3000５分の１ほどの戦力だったが…、<end>"
english = "The Dingal Army, led by Azure Dragon General Karula, faced the Rostorl Army under Xenetes on the road south of the Dragonbone Desert. Because Lemghon and other powerful nobles had refused to send troops, the Rostorl Army had only about one-fifth the strength of the Azure Dragon Army. But...<end>"

["1800088"]
japanese = "\u3000\u3000足止めのために空の本陣を敷き、併せて<line-break>\u3000ネメア死すという偽情報を流すことで青竜軍の<line-break>\u3000動揺を誘い、そこに奇襲をかけるという機略で<line-break>\u3000\u3000\u3000\u3000辛くも緒戦の勝利をものにした。<end>"
english = "An empty command camp was established to hold the enemy back, and a false report of Nemea's death was spread to unsettle the Azure Dragon Army. A surprise attack amid the resulting confusion narrowly secured victory in the opening battle.<end>"

["1800089"]
japanese = "\u3000\u3000\u3000だが、青竜軍の兵力は、依然として<line-break>\u3000ロストール軍を大きく上回っており、緒戦の<line-break>勝敗に関係なく、勝機はいまだカルラにあった。<line-break>\u3000\u3000\u3000しかし、青竜軍は進軍をとめた。\u3000\u3000\u3000<end>"
english = "Even so, the Azure Dragon Army still vastly outnumbered the Rostorl Army. Regardless of the opening battle's outcome, the advantage still lay with Karula. Yet the Azure Dragon Army halted its advance.<end>"

["1800090"]
japanese = "ネメア死す。<line-break>ゼネテスの放った<line-break>偽情報を裏付けるかのごとく、<line-break>\u3000<line-break>ゼグナ鉱山で<line-break>闇の神器を探索したあと、<line-break>青竜軍に合流するはずだった<line-break>ネメアが、ついに戻らなかったのである。<end>"
english = "Nemea is dead. As if confirming the false report spread by Xenetes, Nemea, who was supposed to join the Azure Dragon Army after searching Zegna Mine for the Artifact of Darkness, never returned.<end>"

["1800091"]
