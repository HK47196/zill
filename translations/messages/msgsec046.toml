["460079"]
japanese = "お前、向こう側に行っちまったんだな。<line-break>ガルドランや、強盗たちの方へ…。\u3000\u3000<line-break>\u3000<line-break>ナッジ、お前、何かの命を奪ったことを<line-break>喜々として話す人間じゃなかったのに…<line-break>俺が、俺が、バカだったばっかりに…。<end>"
english = "You've gone over to the other side, haven't you? To Girldlan and the bandits... Nadge, you weren't the kind of person who'd talk so gleefully about taking a life. This is all because I... because I was such a fool...<end>"

["460080"]
japanese = "すまない。俺、お前と旅がしたかった。<line-break>でも、今、お前と行く気にはなれない。<line-break>\u3000<line-break>俺は親父と一緒に<line-break>ここで巡礼客相手の宿屋をやる。<line-break>巡礼客をここで守る。<end>"
