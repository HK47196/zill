["460077"]
japanese = "戦って力を得ていくうちに<line-break>人は命や他人の痛みに鈍感になる。<line-break>\u3000<line-break>そうして、力を持った人間は<line-break>他人を傷つけなければ<line-break>生きていけないようになる。<end>"
