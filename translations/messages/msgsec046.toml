["460006"]
japanese = "くっ！\u3000ガルドランだとォ！？<line-break>ガルドランを相手にするほど堕ちたのか？<line-break><line-break>なめやがって！\u3000この俺が、俺が<line-break>悪者人生一筋のこの俺が、ここまで<line-break>堕ちるとは！！\u3000ひどい！\u3000ひどい！<end>"
