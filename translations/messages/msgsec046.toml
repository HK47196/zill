["460018"]
japanese = "確かに…！！\u3000あなたが、もしかしたら、<line-break>恩返しを盾に彼女に近づいたりして、<line-break>僕たちにとって驚異になるかもしれない！<end>"
english = "That's true! You might use the debt she owes you as an excuse to get close to her―and become a threat to us!<end>"

["460019"]
japanese = "ごめんなさい、ガルドランさん！<line-break>そうなる前に、あなたを殺して、<line-break>私たち、私たちの愛を貫きます！！<end>"
english = "I'm sorry, Girldlan! Before that can happen, we'll kill you and see our love through to the end!<end>"

["460020"]
japanese = "あなたの貴い犠牲は無駄にはしません！！<line-break>僕たち、きっと幸せになります！！<line-break>だから、死んでいてください、それじゃ！<end>"
english = "Your noble sacrifice will not be in vain! We promise we'll be happy! So please stay dead. Goodbye!<end>"

["460021"]
japanese = "ぐふっ！<end>"
english = "Guh!<end>"

["460022"]
japanese = "へへっ！\u3000無様だな。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>未来の勇者様よお！？<line-break><line-break>人助けしたのはいいが<line-break>そいつらにハメられて、このザマか？<line-break>ま、これも日頃の行いだな？<end>"
english = "Heh! Look at you, mighty Hero of the Future! You save someone, only to get taken in and end up like this? Guess that's what you get for the way you live.<end>"

["460023"]
japanese = "…誰もが俺様のような熱き魂を<line-break>持っているわけではない…。<line-break><line-break>臆病なのは仕方ない…<line-break>だが、熱き魂を持つ者は<line-break>…ち、違う…のだ。<end>"
english = "Not everyone possesses a fiery soul like mine... Cowardice is only natural. But one who possesses a fiery soul is... d-different.<end>"

["460024"]
japanese = "ああ？\u3000どう違うんだア？<end>"
english = "Yeah? Different how?<end>"

["460025"]
japanese = "じ、自分のためではなく<line-break>あ、愛のために力を使わねばならん。<end>"
english = "Y-you must use your strength not for yourself, but for l-love.<end>"

["460026"]
japanese = "何、恥ずかしいこと言ってんだよ！<line-break>このタコ！！<end>"
english = "What kind of embarrassing crap is that, you moron?!<end>"

["460027"]
japanese = "俺様は、あるコーンスの少年と<line-break>その仲間たちにそれを、教わった。\u3000\u3000<line-break><line-break>俺様はコーンスの少年とその友人を<line-break>テラネで傷つけた。少年は復讐のため<line-break>俺様をねらっていた…はずだった。<end>"
english = "A boy from Corns and his companions taught me that. I hurt the boy and his friend in Terane. He was after me for revenge... or so I thought.<end>"

["460028"]
japanese = "だが、その少年は２度も、<line-break>俺様を窮地から救ってくれた…。<line-break>いや、こう言っては少し違うな…。\u3000\u3000<line-break>少年はその友人を守るためだけに<line-break>力を使おうとしたから<line-break>俺様を窮地から救う結果になったのだ。<end>"
english = "Yet that boy saved me from dire straits twice. No―that is not quite right. He used his strength solely to protect his friend, and saving me merely happened as a result.<end>"

["460029"]
japanese = "俺様は昔、帝都の鼻つまみ者だった。\u3000<line-break>だが、俺様の親父だけは、俺が<line-break>偉大な人間になると言っていた。<line-break>俺様はそれが気に入らなかった。<line-break>人のよさそうな、貧弱そうな親父が<line-break>暴れ者の俺様をまともに説教できず…<end>"
english = "I used to be a notorious troublemaker in the Imperial Capital. But my old man always said I would become a great man. I didn't like hearing that. He looked too gentle and weak to give a brute like me a proper lecture...<end>"

["460030"]
japanese = "それでも、俺様にまともな生活に<line-break>戻ってもらいたいと、心にもないことを<line-break>言っているのだ…そう思っていた。<line-break>そんな親父が死んだ。俺様は死に目に<line-break>居合わせなかった。が、親父は死の床で<line-break>そんな俺様を責めず、こう言った。<end>"
english = "I thought he was saying things he didn't mean because he wanted me to return to a decent life. Then he died. I wasn't there at the end. But on his deathbed, rather than blame me, he said this:<end>"

["460031"]
japanese = "あの子は未来の勇者として<line-break>人様のため、働いていて<line-break>ここにこられないのでしょう、とな。\u3000<line-break>俺様は親父が本気で俺様を信じてたのを<line-break>そして、俺様自身がいかに臆病だったか<line-break>を知った。<end>"
english = "“He must be too busy serving others as the Hero of the Future to come here.” That was when I realized my old man had truly believed in me―and how much of a coward I had been.<end>"

["460032"]
japanese = "俺様は自分が偉大な人間になれないと\u3000<line-break>思っていたのだ。そうなろうとして<line-break>失敗するのを恐れていたのだ。<line-break>親父の信じる心が俺様の魂を熱き魂に<line-break>変えた。俺様は憶病さを捨てた。<line-break>俺様はそして未来の勇者となったのだ。<end>"
english = "I believed I could never become a great man. I was afraid to try and fail. My old man's faith transformed my soul into a fiery one. I cast aside my cowardice and became the Hero of the Future!<end>"

["460033"]
japanese = "だが、今のようにやることすべてが<line-break>空回りした。目標が見えなかった。<line-break>俺様も少しセンチになっていった…。\u3000<line-break>そんなときに他人を守る力、<line-break>つまり、愛としての正しき力について<line-break>あの少年が教えてくれたのだ。<end>"
english = "But everything I did went awry, just as it does now. I had no goal in sight, and I grew a little sentimental. That was when the boy taught me about righteous power used to protect others―the power of love.<end>"

["460034"]
japanese = "そして、少年の友人を思う心が<line-break>俺様の熱き魂をさらに熱くたぎらせた。<line-break>そして、俺様は知った…。<line-break>熱き魂が正しき力を使うとき、<line-break>その魂が他人の魂をも、熱く燃やすと。<line-break>その少年や、俺様の親父のように…。<end>"
english = "The boy's devotion to his friend made my fiery soul burn hotter still. And then I understood: when a fiery soul wields righteous power, it sets other souls ablaze as well. Just as that boy did―and my old man.<end>"

["460035"]
japanese = "貴様…、<line-break>その少年のテラネの友人だな？<end>"
english = "You... You're that boy's friend from Terane, aren't you?<end>"

["460036"]
japanese = "ケガが治って…よかったな。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break><line-break>貴様は昔の俺様によく似ている…。<line-break>世の中の汚いものに反発しているが、<line-break>それが何か、どうすればいいかわからず<end>"
english = "I'm glad your injuries have healed. You are much like the man I used to be. You rebel against all the filth in the world, but you do not know exactly what that filth is or what to do about it.<end>"

["460037"]
japanese = "ただ、世の中の何かを認めると<line-break>その気に入らない何かすら認めることに<line-break>なりそうで、すべてに反発している…。<end>"
english = "You reject everything because accepting anything in this world would feel like accepting even the things you despise.<end>"

["460038"]
japanese = "だが、それはすべて憶病だからなのだ！<line-break>\u3000<line-break><line-break>認めたいものは、全部認めるがいい！<line-break>貴様が認めたいと思った時点で<line-break>それは認めるに値するものだから！！<end>"
english = "But that is all because you are afraid! Accept everything you wish to accept! The very fact that you wish to accept something makes it worthy of acceptance!<end>"

["460039"]
japanese = "俺様は目標はまだ見えないが<line-break>今、立って歩いてゆける。<line-break>俺様の熱き魂に人を触れさせること…\u3000<line-break>そうして、人にこの熱き魂を<line-break>わけていくことで、俺様は正しき力を<line-break>愛を、正義を、世界に押し広げるのだ。<end>"
english = "My goal is still unclear, but now I can stand and walk forward. By letting others feel my fiery soul and sharing its fire with them, I will spread righteous power―love and justice―throughout the world!<end>"

["460040"]
japanese = "貴様も、それができる。<line-break>まず、貴様はその少年を認めてやれ！\u3000<line-break>かけがえのない、貴様の友達を…！<end>"
english = "You can do the same. Start by recognizing that boy for what he is: your irreplaceable friend!<end>"

["460041"]
japanese = "…けっ、ガルドランのくせに<line-break>人に説教しやがって…。<end>"
english = "Hmph. Girldlan, of all people, giving me a lecture...<end>"

["460042"]
japanese = "…憶病にならなければ、<line-break>俺にも、できるのかな。\u3000\u3000\u3000<line-break><line-break>こんな世界じゃない、<line-break>ナッジなんかが笑って暮らせる<line-break>新しい世界を作ること…。<end>"
english = "If I stop being afraid... could I do it too? Create a new world―not one like this, but one where even someone like Nadge can live with a smile...<end>"

["460043"]
japanese = "ナッジ…！？<end>"
english = "Nadge...?!<end>"

["460044"]
japanese = "ねえ、ヴァン！\u3000何をしたの！！<line-break>僕、ヴァンのこと…心配して…なのに！<end>"
english = "Van! What did you do?! After I was so worried about you...!<end>"

["460045"]
japanese = "ははっ、何マジ入ってんだよ。<line-break>俺がガルドランなんか相手にするかよ。<line-break><line-break>こいつは別口でおねんねしてるんだ。<line-break>…んなに騒ぐなよ、大丈夫だ。<line-break>自分で立って歩けるって言ってた。<end>"
english = "Ha! Why are you getting so worked up? Like I'd bother fighting Girldlan. He's taking a little nap for an entirely different reason. Don't make such a fuss. He's fine―said he could stand up and walk on his own.<end>"

["460046"]
japanese = "本当？<end>"
english = "Really?<end>"

["460047"]
japanese = "ああ、奴の口から聞いた。<line-break>ところで、<value:$28>…。<end>"
english = "Yeah. I heard it from his own mouth. Anyway, <value:$28>...<end>"

["460048"]
japanese = "俺も仲間に加えてくれ、<line-break>俺、お前らと一緒に旅がしたいんだ。<end>"
english = "Let me join you. I want to travel with all of you.<end>"

["460049"]
japanese = "…<value:$28>！<line-break>ヴァンには宿屋が…。<end>"
english = "<value:$28>! But Van has the inn...<end>"

["460050"]
japanese = "いいって、いいって。<line-break>じゃ、よろしくな、<value:$28>。<end>"
english = "It's fine, it's fine. I'm counting on you, then, <value:$28>.<end>"

["460051"]
japanese = "ねえ、本当にガルドランを<line-break>放って置いていいのかなあ。<end>"
english = "Are you sure it's all right to leave Girldlan here?<end>"

["460052"]
japanese = "いいさ。あいつの熱き魂で<line-break>ナントカするんだろ。行こうぜ。<end>"
english = "He'll manage somehow with that fiery soul of his. Come on, let's go.<end>"

["460053"]
japanese = "じゃ、俺はこいつの面倒見るから。<line-break>あとで、一緒にな。<end>"
english = "Then I'll look after this one. I'll catch up with you later.<end>"

["460054"]
japanese = "…親父。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break><line-break>俺が帝都の鼻つまみだったころ、<line-break>ただひとり、俺に秘められた勇者の魂を<line-break>信じて疑わなかった親父…。<end>"
english = "...Dad. Back when no one in the Imperial Capital could stand me, you were the one person who never doubted that the soul of a hero lay hidden inside me...<end>"

["460055"]
japanese = "見てくれ。未来の勇者となった俺を…。<line-break>それに、俺の魂はこれからも高まる。<line-break>真の勇者になるのも時間の問題だ。<end>"
english = "Look at me now―the hero of the future... And my soul will only keep soaring higher. It's just a matter of time before I become a true hero.<end>"

["460056"]
japanese = "そんな俺を記念して<line-break>歌を作ったんだ、親父…。<end>"
english = "So I wrote a song in my own honor, Dad...<end>"

["460057"]
japanese = "えっ、聞きたいって？<line-break>よせよ、照れるじゃねえか。\u3000\u3000<end>"
english = "What, you want to hear it? Come on, you're embarrassing me.<end>"

["460058"]
japanese = "…しょうがないな。聞かせてやるよ。<line-break>これも勇者の親孝行だ。<line-break>じゃ、いくぜ。<end>"
english = "...Oh, all right. I'll sing it for you. A hero's got to do right by his dad. Here goes.<end>"

["460059"]
japanese = "♪熱く燃える\u3000世界一の魂～<line-break>♪煮えたぎる\u3000悪党への怒り～<line-break>\u3000<end>"
english = "♪ The world's greatest soul, blazing hot～ ♪ Rage against villains, boiling over～<end>"

["460060"]
japanese = "♪この世の愛をおびやかす<line-break>♪よろこばしくない奴の影<line-break>♪俺がちぎっては投げするぜ～！<line-break>♪正義の熱い～\u3000（けるなぐる～）<line-break>♪勇者の力～\u3000\u3000（槍で突く～）<line-break>♪悪を（悪を）悪をひねる光～！<end>"
english = "♪ Threatening all the love in this world ♪ The shadow of a most unwelcome creep ♪ I'll send that creep flying～! ♪ Justice, burning hot～ (Kick and punch～) ♪ A hero's power～ (Thrust with a spear～) ♪ Evil! (Evil!) The light that twists evil～!<end>"

["460061"]
japanese = "♪ガルドラン！\u3000熱く正しい魂～<line-break>♪ガルドラン！\u3000青く輝く正義～<line-break>♪未来の勇者\u3000その名はガルドラン～！<end>"
english = "♪ Girldlan! A burning soul, righteous and true～ ♪ Girldlan! Justice shining blue～ ♪ The hero of the future―his name is Girldlan～!<end>"

["460062"]
japanese = "どうだった、親父？<end>"
english = "Well, Dad? What did you think?<end>"

["460063"]
japanese = "いやだなあ。<line-break>そんなにグッとくる曲だったかい。<line-break><line-break>ま、これも親孝行だからな。<end>"
english = "Oh, come on. Was it really that moving? Well, it's all part of being a good son.<end>"

["460064"]
japanese = "親孝行…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Being a good son...<end>"

["460065"]
japanese = "親父が生きてるうちに<line-break>やっときたかったぜ…。\u3000\u3000<end>"
english = "I wanted to do right by you while you were still alive...<end>"

["460066"]
japanese = "たくさん、たくさんなぁ…。<line-break>\u3000<end>"
english = "A lot. A whole lot...<end>"

["460067"]
japanese = "ヴァン、僕、仇をとったんだ。<line-break>ガルドランを殺してきたよ。<end>"
english = "Van, I got my revenge. I killed Girldlan.<end>"

["460068"]
japanese = "ねぇ、ヴァン、僕、仇をとったんだ。<line-break>ガルドランを殺してきたんだよ。<end>"
english = "Van, listen. I got my revenge. I killed Girldlan.<end>"

["460069"]
japanese = "ナッジ…俺、この前はじめて<line-break>親父について巡礼者を送ってきたんだ。<end>"
english = "Nadge... The other day, I went with my father to escort some pilgrims. It was my first time.<end>"

["460070"]
japanese = "ヴァン、どうしたの？<line-break>喜んでくれないの？<end>"
english = "Van, what's wrong? Aren't you happy for me?<end>"

["460071"]
japanese = "…霊峰トールへの道は険しく、<line-break>途中、モンスターも多い。\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>だけどモンスターよりも何よりも、<line-break>人間の敵は人間…なんだ。<end>"
english = "The road to Sacred Mount Thor is treacherous, and there are plenty of monsters along the way. But worse than any monster, the enemy of man... is man.<end>"

["460072"]
japanese = "霊峰トールへの巡礼は苦行だ。<line-break>巡礼者たちは、みんな、それぞれに、<line-break>いろいろな思いや悩みを抱えている。<line-break>自分の内面を見つめすぎた人たち<line-break>せっぱ詰まってここへ逃げてきた人たち<line-break>みんなそれぞれに救いを求めてた。<end>"
english = "The pilgrimage to Sacred Mount Thor is an ordeal. Every pilgrim carries different thoughts and troubles. Some have looked too deeply into themselves. Some have fled here in desperation. Each of them came seeking salvation.<end>"

["460073"]
japanese = "そんな人たちがトールの難所を<line-break>越えて行くにつれ…落として行くんだ。<line-break>なんて言うか…心の垢みたいなのをさ。<line-break>俺の目にははじめ、あの巡礼客たちは<line-break>ただの暇人やうさん臭いじじい、<line-break>人生の負け犬にしか見えなかった。<end>"
english = "But as they make their way through the difficult passes of Thor, they start shedding something. I don't know how to put it... the grime on their souls, maybe. At first, those pilgrims just looked like idlers, shady old men, and losers in life to me.<end>"

["460074"]
japanese = "それが、どこか神様じみてくるんだ。<line-break>顔からして輝き出すんだ。<line-break>俺も俺の…親父の仕事に誇りを持った。<line-break>だが、ある晩だ。護衛の冒険者が<line-break>巡礼の持つわずかな金を得るために<line-break>魂が輝きだした人たちを殺し始めた。<end>"
english = "Then they begin to seem almost divine. Even their faces start to shine. I came to take pride in my... in my father's work. But then, one night, the adventurers serving as escorts began killing people whose souls had begun to shine, all for the little money the pilgrims carried.<end>"

["460075"]
japanese = "俺は叫んだ。やめろ！<line-break>この人たちは救いを求めて来たんだ！<line-break>お前ら、命を何とも思わないのか！<line-break>冒険者たちは笑った。<line-break>俺たちはいつでも危険の中で生きてる。<line-break>いつでも命のやりとりをしてるんだ！<end>"
english = "I shouted, “Stop! These people came here seeking salvation! Does life mean nothing to you?” The adventurers laughed. “We live in danger every day. Every day, we kill or get killed!”<end>"

["460076"]
