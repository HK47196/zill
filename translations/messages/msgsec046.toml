english = "<select><value:$20>%20Amiral's Dragon Festival is held every year on December 31st.<end>Irene's mother in Rostorl was born on April 15th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Rossima of the Hand of God was born on May 7th. Sorry if you've never heard of Rossima. Not that knowing this will do you any good.<end>Tserashel's younger sister Vailaila was born on January 14th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Tserashel's younger sister Vialiali was born on January 14th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>The man at the inn in Terane was born on May 11th. Sorry if you've never heard of him. Not that knowing this will do you any good.<end>The lady at the inn in Terane was born on July 19th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Ossi, the swordsmanship instructor in Rostorl, was born on August 12th. Sorry if you've never heard of Ossi. Not that knowing this will do you any good.<end>Shemhaza, the elder of Vulcane, was born on November 4th. Sorry if you've never heard of him. Not that knowing this will do you any good.<end>Daidalo, Hugo's escort and appraiser, was born on October 10th. Sorry if you've never heard of Daidalo. Not that knowing this will do you any good.<end>Mrs. Hugo, Hugo's wife and double, was born on February 17th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Theresia of Elz was born on October 19th. Sorry if you've never heard of Theresia. Not that knowing this will do you any good.<end>Grand Duke Novin, head of the Pharos family, was born on May 7th. Sorry if you've never heard of him. Not that knowing this will do you any good.<end>Ferme from the tavern in Rostorl was born on May 11th. My birthday is January 1st, you see. I'd like to know how compatible Ferme and I are.<end>Bemoraberamo, a court lady of the Dragon's Seat in Elz, was born on December 17th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Polia, the wife of Roberto of Amiral, was born on July 6th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>The Bolbora brothers, Noble's corrupt magistrates, were born on December 8th. Sorry if you've never heard of them. Not that knowing this will do you any good.<end>Bonga, the woodcutter in Terane, was born on December 17th. Sorry if you've never heard of him. Not that knowing this will do you any good.<end>The wife of Bonga, the woodcutter in Terane, was born on May 5th. Sorry if you've never heard of her. Not that knowing this will do you any good.<end>Lufren, the girl at the inn in Amiral, was born on February 24th. My birthday is January 1st, you see. I'd like to know how compatible Lufren and I are.<end>"

