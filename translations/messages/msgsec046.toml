["460012"]
japanese = "フッ、未来の勇者にとっては他愛もない<line-break>敵だった…。<line-break><line-break>さぁ、来るんだお嬢さん！！<line-break>君の恋人はこの未来の勇者ガルドランが<line-break>助け出してあげたよおおおん！！<end>"
english = "Hmph. No more than a trifling foe for the Hero of the Future. Now, come to me, young lady! Girldlan, the Hero of the Future, has rescued your beloved for yooouuu!<end>"

["460013"]
