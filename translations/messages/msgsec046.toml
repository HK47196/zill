["460003"]
japanese = "くっ、ヒドー兄弟も堕ちたもんだ。\u3000\u3000<line-break>犯罪結社ライギロアの下請けとは！<line-break><line-break>しかし、背に腹は代えられねえか。<line-break>…にしても、ハンサムな男をさらえって<line-break>いったい、なんでこんなことを…。<end>"
