["80000"]
japanese = "<select><value:$20>%2詳しくは教えられてないが、この地には<line-break>何か恐ろしい力が封印されているらしい。<line-break>我々はそれを守るために雇われているのだ。<end>たとえ今は平和でも、<line-break>いつどこの国が攻め込んでくるかわからない。<line-break>それゆえ、鍛錬を怠らぬようにしているのだ。<end>"
english = "<select><value:$20>%2They haven't told us much, but apparently some terrible power is sealed away in this land. We were hired to guard it.<end>Peaceful as things are now, there's no telling when some country might invade. That's why we never neglect our training.<end>"

["80001"]
japanese = "<select><value:$20>%4８世紀末に最後の神聖王レムゲドンが\u3000\u3000\u3000<line-break>将軍のメガ・ディンガルに殺され、<line-break>神聖王国アルレシアは崩壊しました。<line-break>ここアルノートゥンは神聖王国の流れをくむ<line-break>最後の都市国家なのです。<end>強力な魔法文明を持つ魔道王国ラドラスを、<line-break>聖光石を利用した魔道兵器で滅ぼした神聖王国も<line-break>結局は滅んでしまいました。<line-break>強大な力は使い方を誤れば不幸を呼ぶだけです。<line-break>そのことを伝えていくためにも我々は<line-break>この地を守っていかなくてはならないのです。<end>ふもとの廃墟は見ましたか？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>あの廃墟も今から４００年ほど昔には<line-break>平和な町だったのです。<line-break>しかし、太守アハブが聖光石の力を悪用しようと<line-break>企てたため、大神官エシュトの怒りにふれ<line-break>現在のような廃墟になってしまいました。<end>ふもとの廃墟アハブは、聖光石の力を<line-break>求める者への戒めとするため、<line-break>今も昔のままに放置してあるのです。<line-break>聖光石の力は町をひとつ滅ぼしてまでも<line-break>守らなくてはならない禁忌の力。<line-break>そのことを忘れないでください。<end>"
english = "<select><value:$20>%4At the end of the eighth century, the last Sacred King, Remgedon, was killed by General Mega Dingal, and the Sacred Kingdom of Alresia collapsed. Alnortun is the last city-state to carry on the legacy of the Sacred Kingdom.<end>The Sacred Kingdom destroyed the magically advanced Magic Kingdom Ladras with weapons powered by the Holy Light Stone, yet in the end it too fell. Great power brings only misery when misused. We must protect this land so that lesson will not be forgotten.<end>Have you seen the ruins at the foot of the mountain? Some four hundred years ago, that was a peaceful town. But Governor Ahab plotted to misuse the power of the Holy Light Stone, incurring the wrath of High Priest Esht and leaving the town in the ruined state you see today.<end>The ruins of Ahab at the foot of the mountain have been left untouched as a warning to all who seek the power of the Holy Light Stone. The Holy Light Stone holds a forbidden power, one that must be guarded even at the cost of an entire town. Never forget that.<end>"

["80002"]
japanese = "<if><value:$2C><less-equal>%49この近くに、はざまの塔があるんだ。<line-break>そこには研究室のような部屋があるんだが、<line-break>誰もいないんだよ。不思議だよな。<end><if><value:$2C><less-equal>%100この近くにアハブって町の廃墟があるんだ。\u3000<line-break>レムゲドンの時代に太守のアハブが聖光石を<line-break>手に入れようとして滅ばされたんだとよ。<line-break>疫病の魔法を使って皆殺しにしたっていうから<line-break>住人の恨みや苦しみもすごかったんだろうな。<line-break>今じゃ悪霊、死霊のたまり場だよ。<end><if><value:$2C><less-equal>%120死霊や悪霊はたいてい闇属性だから、<line-break>聖属性の魔法や武器が有効なんだぜ。<end>この地には<line-break>世界を滅ぼすほど強大な力を持つ<line-break>邪竜がいたと言う。<end>"
english = "<if><value:$2C><less-equal>%49The Tower of the Interstice is near here. There's a room inside that looks like a laboratory, but no one's there. Strange, isn't it?<end><if><value:$2C><less-equal>%100There are ruins near here, the remains of a town called Ahab. They say that in Remgedon's time, Governor Ahab tried to obtain the Holy Light Stone and was destroyed for it. Everyone was killed with plague magic, so the bitterness and suffering of the townsfolk must have been terrible. Now the place is crawling with evil spirits and the undead.<end><if><value:$2C><less-equal>%120The undead and evil spirits are usually of the Dark element, so Holy-element magic and weapons work well against them.<end>They say there was once an Evil Dragon in this land with enough power to destroy the world.<end>"

["80003"]
japanese = "<select><value:$20>%4我らがノトゥーン様は天空の神にして<line-break>すべての神々の頂点に立つお方。<line-break>そのお方に仕えることを誇りに思っております。<end>この世界に災いを及ぼす者をノトゥーン様は<line-break>お許しになりません。<line-break>ふもとの廃墟、アハブを見てみなさい。<line-break>聖光石の力を悪用して世界に災いを<line-break>及ぼそうとしたアハブは、ノトゥーン様の<line-break>正義の鉄槌で滅ばされたのです。<end>私は以前アミラルに住んでおりましたが、<line-break>ノトゥーン様にお仕えしようと決心し<line-break>ここへ参りました。<line-break>ここの神官の多くは世界各地から<line-break>ノトゥーン様にお仕えしようと<line-break>集まった者たちです。<end>この山は大陸でも有数の標高を誇るので、<line-break>神聖王国時代に、天空神に仕える神殿として<line-break>天経院の神殿が建てられたのです。<end>"
english = "<select><value:$20>%4Our lord Notun is the Sky God, highest among all the gods. I am proud to be in his service.<end>Lord Notun does not forgive those who bring calamity upon this world. Look at Ahab, the ruins below. Ahab sought to misuse the Holy Light Stone and bring disaster upon the world, and so was destroyed by Notun's hammer of justice.<end>I once lived in Amiral, but I resolved to serve Lord Notun and came here. Many of the priests here have gathered from all corners of the world for that same purpose.<end>This mountain is among the highest on the continent. That is why, during the age of the Sacred Kingdom, the Tenkeiin temple was built here to serve the Sky God.<end>"

["80004"]
japanese = "<select><value:$33>今は旅立ち中だろ、なんでここにいるんだ。<end>世界中で、地震や火山の噴火があったらしいな。<line-break>ここも小さな地震があったが<line-break>被害はそれほどでもなかったよ。<end>ディンガルの皇帝が代わったんだってな。\u3000\u3000<line-break>なんでも魔王バロルを倒した勇者ネメアが<line-break>前の皇帝を殺して帝位を奪ったらしいぞ。<line-break>主君殺しとは勇者も落ちたもんだぜ。<line-break>まあ、ディンガルの人間はネメアが皇帝になる<line-break>のを望んでいたから、これでよかったのかもな。<end>ロセンがディンガルに滅ばされたみたいだな。<line-break>世界を魔王から救った勇者が、魔王のまねして<line-break>世界征服とはふざけた世の中だよなあ。<end>名将と呼ばれたアンギルダンも<line-break>ロストールの若き将軍ゼネテスに破れたか…。<line-break>時代を切り開くのは若さなのかもな。<end>アンギルダンが破れてディンガルの勢いも<line-break>なくなったと思ったが、なかなかどうして<line-break>カルラもたいしたものだな。<line-break>しかし、リベルダムを破壊してしまうとは、<line-break>若さゆえの暴走としか思えぬな。<end>カルラとゼネテスがいよいよ対決か…。<line-break>どちらが勝っても大陸は混乱するな。<line-break>戦とは不毛なものだと実感するよ。<end>ネメアが死に、カルラは動けなくなった。<line-break>しばらく平和が続くかもしれぬな。<end>"
english = "<select><value:$33>Aren't you supposed to be away on your journey? What are you doing here?<end>Sounds like there've been earthquakes and volcanic eruptions all over the world. We had a small quake here too, but it didn't do much damage.<end>I hear Dingal has a new emperor. Apparently Nemea, the Hero who defeated Balor, Demon King, killed the former emperor and seized the throne. A Hero reduced to murdering his own lord. How low he's fallen. Still, the people of Dingal wanted Nemea as emperor, so perhaps it's for the best.<end>Seems Dingal has destroyed Rocen. The Hero who saved the world from the Demon King is now imitating him and trying to conquer it. What a farce of a world.<end>So even the renowned Angeerdan has fallen to Rostorl's young general, Xenetes... Perhaps it is the young who open the way to a new age.<end>I thought Dingal would lose its momentum after Angeerdan's defeat, but Karula has proved quite formidable. Destroying Liberdam, though? That can only have been the recklessness of youth.<end>So Karula and Xenetes will finally face each other... No matter who wins, the continent will be thrown into turmoil. War truly is a barren thing.<end>Nemea is dead, and Karula can no longer act. We may have peace for a while.<end>"

["80005"]
japanese = "<select><value:$33>おやおや、今は旅立ちの途中のはずですが。<end>大陸の各地で、竜王の覚醒が原因の地震や<line-break>火山の噴火などが起きているようですね。<line-break>私の故郷は大丈夫なのでしょうか…心配です。<end>ディンガルでは皇帝が家臣の\u3000\u3000\u3000<line-break>ネメアに殺され、帝位を奪われた<line-break>という話を聞きました。<line-break>竜王の覚醒が乱世を呼ぶというのは、<line-break>どうやら本当のようですね。<end>ロセンを占領したカルラは、<line-break>ロセン王の一族を皆殺しにしたそうです。<line-break>なんと恐ろしい所業でしょうか…。<end>ネメアのような野心家が、聖光石の力を<line-break>手に入れたら世界はおしまいです。<line-break>なんとしてもこの地を守らなくては。<end>罪もない人々の命を奪い、住居を破壊する…<line-break>カルラの悪行はとどまることを知りません。<line-break>いまに天空神の裁きが下るに違いありません。<end>ディンガル軍がいかに精強であろうとも、<line-break>天空神の名にかけて負けるわけにはいきません。<end>聞きましたか？<line-break>あのネメアが死んだというのですよ。<line-break>まさに天空神の裁きが下されたのです。<end>"
english = "<select><value:$33>My, my. Aren't you supposed to be away on your journey?<end>It seems the Dragon King's Awakening has caused earthquakes, volcanic eruptions, and other disasters across the continent. I wonder if my homeland is safe... I fear for it.<end>I heard that the emperor of Dingal was killed by his vassal Nemea, who then seized the throne. It seems the Dragon King's Awakening truly does herald an age of turmoil.<end>They say Karula massacred Rocen's entire royal family after occupying it. What a dreadful deed...<end>If someone as ambitious as Nemea were to gain the power of the Holy Light Stone, the world would be finished. We must protect this land at any cost.<end>Taking innocent lives, destroying homes... There is no end to Karula's wickedness. The Sky God's judgment will surely fall upon her in time.<end>However mighty the Dingal Army may be, in the name of the Sky God, we cannot allow ourselves to lose.<end>Have you heard? Nemea is dead. The judgment of the Sky God has truly been delivered.<end>"

["80006"]
japanese = "<if><value:$2A><less-equal>%49俺たち傭兵は生き残ることにすべてをかけてる。<line-break>それはあんたら冒険者でも同じだろ？<line-break>死んじまったら何にもならないからなあ。<end><if><value:$2A><less-equal>%100最近、<value:$28>なんて<line-break>名前の冒険者がいるらしいな。<line-break>あんたも知っているかい？<end><if><value:$2A><less-equal>%130傭兵仲間のあいだで、<value:$2B>と<line-break>剣聖レーグはどっちが強いかって<line-break>いうのが話題になってるんだ。<line-break>俺は<value:$2B>のほうが<line-break>強いと思ってるんだがな。<line-break>あんたはどっちだと思う？<end>おぉ！\u3000<value:$28>に会えるなんてっ！<line-break>俺はなんて運のよい男なんだ。<line-break>ノトゥーンに感謝しないとな。<end>"
english = "<if><value:$2A><less-equal>%49We mercenaries stake everything on staying alive. It's the same for you adventurers, isn't it? Once you're dead, nothing else matters.<end><if><value:$2A><less-equal>%100I hear there's an adventurer named <value:$28> around these days. Have you heard the name?<end><if><value:$2A><less-equal>%130The mercenaries have been arguing over who's stronger, <value:$2B> or Reig the Sword Saint. My money's on <value:$2B>. What do you think?<end>Oh! I can't believe I'm meeting <value:$28>! What a lucky man I am. I ought to thank Notun.<end>"

["80007"]
japanese = "<select><value:$20>%2あんたレーグを知っているか？\u3000\u3000\u3000\u3000\u3000\u3000<line-break>剣聖の名で知られている最強の男。<line-break>俺たちボルダンの誇り、そして英雄だ。<line-break>かつて勇者ネメアたちと魔王バロルを<line-break>倒して世界を救ったこともある。<line-break>俺もあんな強い男になりたいと思っている。<end>レーグが持つ２本の剣、剛刃、閃刃は剣聖の証。<line-break>昔、神聖王サラミスの粛清から逃げる人々を<line-break>リベルダムまで守り、導いた英雄が愛用した剣だ。<line-break>最強の男が最強の武器を振るい戦う姿…、<line-break>なんと美しいことではないか。<end>"
english = "<select><value:$20>%2Do you know Reig? He's the strongest man, renowned as the Sword Saint. He's Bordan's pride and our hero. He once fought alongside the Hero Nemea and the others to defeat Balor, Demon King, and save the world. I want to become that strong myself.<end>Reig's two swords, Mighty Blade and Flash Blade, are the mark of the Sword Saint. Long ago, they were wielded by the hero who protected those fleeing Sacred King Salamis's purge and led them safely to Liberdam. The strongest man fighting with the most powerful weapons... What could be more beautiful?<end>"

["80008"]
japanese = "<select><value:$33>旅立ちの時は誰にでもあるものだ。<end>このあいだの地震で、エンシャントにある<line-break>ノトゥーン神殿の天井が壊れたそうだよ。<line-break>きれいなステンドグラスだったんだがなあ。<end>国から出奔したと思ったら、何の前触れもなく<line-break>帰ってきて、いきなり皇帝を名乗っちゃう。<line-break>ほんと勇者なんて理解できない人種だね。<line-break>殺された先帝のエリュマルクも運がないと<line-break>いうか何というか…、あわれなもんだよな。<line-break>運のない奴が死ぬのは傭兵も一緒だけどね。<end>ロセンを滅ぼしたディンガルの青竜将軍は<line-break>かわいい女の子だっていうじゃないか。<line-break>俺もディンガル軍に入ろうかなあ。<end>名将と呼ばれたアンギルダンも衰えたな。<line-break>最後の最後でゼネテスなんて若造に<line-break>負けてしまうとはね。<end>最小限の損害で勝利を手にする。<line-break>カルラのやり方は間違っていない。<line-break>若いが、たいした将軍だよ。<end>大陸中で戦争が起きてるんだ。<line-break>俺の生活もしばらくは安泰だな。<line-break>戦争がなくならないかぎり仕事があるからな。<end>傭兵生活も飽きてきたな。<line-break>お前のように冒険者になるのも<line-break>いいかもな。<end>"
english = "<select><value:$33>Everyone has a time when they must set out.<end>I hear the recent earthquake damaged the ceiling of the Notun Temple in Ancient. It had such beautiful stained glass, too.<end>First deserting the country, then coming back without warning and suddenly claiming to be emperor... Heroes really are impossible to understand. And the murdered former emperor, Elyumarque... Poor devil never had any luck. Still, unlucky mercenaries die too.<end>They say Dingal's Azure Dragon General, the one who destroyed Rocen, is a pretty young woman. Maybe I should join the Dingal Army myself.<end>Angeerdan, once hailed as a great commander, has lost his edge. To be beaten at the very end by a young upstart like Xenetes...<end>Win with the fewest possible losses. There's nothing wrong with Karula's methods. Young, perhaps, but a remarkable general.<end>Wars are breaking out all over the continent. Looks like my livelihood is safe for a while. As long as war exists, I'll have work.<end>I'm growing tired of the mercenary life. Maybe becoming an adventurer like you wouldn't be so bad.<end>"

["80009"]
japanese = "<if><value:$2C><less-equal>%9あんた冒険者としては駆け出しだろ？<line-break>長生きしたかったらアハブにだけは<line-break>近づくんじゃないぞ。<line-break>あそこは死霊でいっぱいだから、<line-break>心の弱い人間が行ったら、<line-break>奴らの餌食になっちまうぞ。<end><if><value:$2C><less-equal>%29古の樹海にはエルフの聖地があるという話だ。<line-break>もっとも人間がどんなに探しても、<line-break>聖地には入れないらしいがな。<end><if><value:$2C><less-equal>%49自分の実力を過信すると死ぬぞ。<line-break>リーダーのミスは仲間も巻き込む。<line-break>よく覚えとけよ。<end>あんたの強さは世界に影響を与える。<line-break>それをよく自覚しておけよ。<end>"
english = "<if><value:$2C><less-equal>%9You're still new to adventuring, aren't you? If you want to live long, stay away from Ahab. The place is full of the undead. Anyone weak of spirit who ventures in will become their prey.<end><if><value:$2C><less-equal>%29They say there's a sacred place of the Elves in the Ancient Forest. Apparently, no matter how hard humans search, they can never enter it.<end><if><value:$2C><less-equal>%49Overestimate your abilities and you'll die. A leader's mistakes drag the whole party down. Remember that.<end>Your strength will affect the world. Make sure you understand that.<end>"

["80010"]
japanese = "<select><value:$20>%4おう、好きな席に座りな。<line-break>金のある限り好きなもんを<line-break>飲ましてやるぜ。<end>俺がこの酒場の看板息子だ。<line-break>たくましくて頼りがいのある<line-break>ナイスガイだろ。<end>自分で言うのもなんだが、\u3000\u3000\u3000\u3000\u3000<line-break>この仕事は俺の天職だと<line-break>思うんだよな。<line-break>こんな山奥の酒場は辞めて<line-break>ロストールででも働いてみるかなあ。<end>どうした。<line-break>俺が看板息子じゃ不満か？<end>"
english = "<select><value:$20>%4Take any seat you like. As long as your money lasts, I'll serve you whatever you want to drink.<end>I'm this tavern's poster boy. Strapping, dependable, a real nice guy, right?<end>I know I shouldn't say it myself, but I think I was born for this work. Maybe I should leave this tavern in the mountains and try working in Rostorl.<end>What's wrong? Not happy with me as the tavern's poster boy?<end>"

["80011"]
japanese = "<if><value:$2A><less-equal>%49冒険者として名を売るには、<line-break>ギルドで引き受けた仕事を<line-break>期限内に確実に完了させることだ。\u3000\u3000\u3000\u3000\u3000<line-break>小さな信用をこつこつと貯めていけば、<line-break>そのうち大きな仕事も来るようになるからな。<end><if><value:$2A><less-equal>%100あんた、最近がんばっているみたいだな。<line-break><value:$28>だったっけ、<line-break>名前も聞くようになったよ。<end><if><value:$2A><less-equal>%130よう、<value:$28>。<line-break>がんばって仕事をしてるか？<line-break>冒険者もいいが傭兵も捨てたものじゃないよ。<end>よう、<value:$28>。<line-break>あんたが立派になって他人事ながら<line-break>うれしく思うよ。<end>"
english = "<if><value:$2A><less-equal>%49If you want to make a name as an adventurer, complete every job you take from the Guild reliably and before the deadline. Build up trust a little at a time, and eventually the bigger jobs will come your way.<end><if><value:$2A><less-equal>%100You've been working hard lately, haven't you? It was <value:$28>, right? I've started hearing your name around.<end><if><value:$2A><less-equal>%130Hey, <value:$28>. Keeping busy? Adventuring is all well and good, but the mercenary life has its merits too.<end>Hey, <value:$28>. I'm glad to see how far you've come, even if it's none of my affair.<end>"

["80012"]
japanese = "<if><value:$2C><less-equal>%9ソウルは肉体の成長にも影響を与える。\u3000\u3000\u3000\u3000<line-break>ソウルを変更するときはスキルだけでなく、<line-break>どのパラメータを成長させるかも考えるんだ。<line-break>例えばＳＴＲとＶＩＴを成長させたいなら<line-break>グロウファイターのソウルを宿せばいいんだ。<end><if><value:$2C><less-equal>%29気に入ったスキルがあればスキルポイントを<line-break>使って習得するといい。特に魔法のスキルは<line-break>習得しておいて損はないだろう。<end><if><value:$2C><less-equal>%49難易度が高い罠の解除は、<line-break>アンチハードルなしでは難しいぞ。<line-break>習得しといて損はないだろう。<end>無限のソウルを持つ者だけが<line-break>宿すことのできるソウルがあるそうだよ。<line-break>たしか、インフィニティアだったかな？<end>"
english = "<if><value:$2C><less-equal>%9Souls also affect your body's growth. When changing Souls, think not only about skills but also about which parameters you want to improve. For example, if you want to raise ＳＴＲ and ＶＩＴ, equip the Grow Fighter Soul.<end><if><value:$2C><less-equal>%29If there's a skill you like, spend Skill Points to learn it. Magic skills in particular are always worth having.<end><if><value:$2C><less-equal>%49Disarming difficult traps is hard without Anti-Hurdle. It's worth learning.<end>They say there's a Soul that only a Bearer of the Infinite Soul can equip. I think it was called Infinitia?<end>"

["80013"]
japanese = "<select><value:$33>今は旅立ちですよ。<end>アルノートゥンは天空神に仕える神官の<line-break>町だから、男ばかりでむさっくるしいよ。<line-break>酒場の看板娘がボルダン男なんて、トホホ…。<end>今は神官見習いの身だけど、無事神官に<line-break>なれたらロストールの神殿で働きたいな。<line-break>酒場にかわいい看板娘がいるって話だし。<line-break>えっ、名前だって？<line-break>ええっと、フェルムちゃんだったかな。<line-break>とにかくロストールじゃ大人気らしいよ。<end>ううう…、ロストールにノトゥーン神殿が<line-break>ないなんて話、聞かなきゃよかった。<line-break>これでフェルムちゃんに会えないんだ…ぐすっ。<end>エンシャントにはノトゥーン神殿が\u3000\u3000\u3000\u3000<line-break>あるんだって。あそこならきっと女の子も<line-break>たくさんいるにちがいないよね。<line-break>よーし、がんばって修行して神官になるぞ！<line-break>そしたら、こんな男臭い所とはおさらばだ。<end>ディンガル軍が攻めて来たらどうしよう。<line-break>このまま男の園で死ぬのはイヤだ～。<end>生きているってすばらしい…。<line-break>最近それを実感できるようになりました。<end>生きているってすばらしい…。<line-break>最近それを実感できるようになりました。<end>"
english = "<select><value:$33>Aren't you supposed to be away on your journey now?<end>Alnortun is a town of priests who serve the Sky God, so it's nothing but men. Even the tavern's poster girl is a Bordan man. It's hopeless...<end>I'm only an apprentice priest now, but once I'm properly ordained, I'd like to serve at a temple in Rostorl. I hear the tavern there has a pretty poster girl. What, her name? Um... Ferme, I think. Anyway, she's supposed to be enormously popular in Rostorl.<end>Ugh... I wish no one had told me there isn't a Notun Temple in Rostorl. Now I'll never get to meet Ferme... Sniff.<end>I hear Ancient has a Notun Temple. There must be plenty of girls there too, right? All right! I'll train hard and become a priest! Then I can say goodbye to this place that reeks of men.<end>What if the Dingal Army attacks? I don't want to die here in this garden of men!<end>It's wonderful to be alive... Lately, I've truly begun to appreciate that.<end>It's wonderful to be alive... Lately, I've truly begun to appreciate that.<end>"

