japanese = "<if><value:$2C><less-equal>%9クレリックのソウルを身に付けたいのなら<line-break>信じる心Ｂｅｌｉｅｆを上げるのです。<line-break>神に仕える者にとって信じる心が大切ですから。<end><if><value:$2C><less-equal>%29パトリアークのソウルを身に付けるためには<line-break>Ｂｅｌｉｅｆだけでなく、やさしさＫｉｎｄも<line-break>高くなくてはなりません。<line-break>他人を思いやるやさしさと信じる心が高ければ<line-break>きっとパトリアークのソウルが身に付き<line-break>聖なる力を使えるようになるでしょう。<end><if><value:$2C><less-equal>%49我々の行使する魔法は、<line-break>精霊力レベルに偏りがあってはなりません。<line-break>バランスよく精霊力レベルを上げるのです。<end>我々の行使する魔法は、<line-break>人をいやすためのものですが、<line-break>闇を滅ぼすための禁呪も存在するのです。<end>"
english = "<if><value:$2C><less-equal>%9If you wish to acquire the Cleric Soul, raise Ｂｅｌｉｅｆ, your faith. Faith is essential to those who serve God.<end><if><value:$2C><less-equal>%29To acquire the Patriarch Soul, you need not only high Ｂｅｌｉｅｆ but also high Ｋｉｎｄ, your kindness. With enough compassion for others and strength of faith, you will surely acquire the Patriarch Soul and be able to wield holy power.<end><if><value:$2C><less-equal>%49The magic we wield requires balance among the elemental power levels. Raise every elemental power level evenly.<end>Our magic is meant to heal people, but Forbidden Spells that destroy darkness also exist.<end>"

