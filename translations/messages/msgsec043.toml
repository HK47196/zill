["430000"]
japanese = "リューガ・ボリューム１その２開始<end>"
english = ""

["430001"]
japanese = "エリエナイ公とお見受けする。<end>"
english = "You must be Duke Elienai.<end>"

["430002"]
japanese = "…その命、もらった！<end>"
english = "Your life is mine!<end>"

["430003"]
japanese = "助けなきゃ！<end>"
english = "I've got to help!<end>"

["430004"]
japanese = "物騒だなあ…<end>"
english = "This looks dangerous…<end>"

["430005"]
japanese = "なんだ？<line-break>貴様もこいつらの仲間か？<end>"
english = "What? Are you with this lot too?<end>"

["430006"]
japanese = "フン、<line-break>ただの冒険者か。<end>"
english = "Hmph. Just an adventurer.<end>"

["430007"]
japanese = "未使用：奴らも生かすな。<end>"
english = ""

["430008"]
japanese = "…しかし、<line-break>武器は使えるようだな。<line-break>\u3000<end>"
english = "Still, you seem to know how to handle a weapon.<end>"

["430009"]
japanese = "名は？<end>"
english = "Your name?<end>"

["430010"]
japanese = "<value:$28>か。<line-break>ついてこい。<line-break>俺は急ぎノーブルへ向かう。<line-break>貴様は黙って護衛をしていれば、<line-break>それでいい。<end>"
english = "<value:$28>, is it? Come with me. I'm making for Noble, and I'm in a hurry. Just keep quiet and serve as my escort. That's all.<end>"

["430011"]
japanese = "金ははずむぞ、冒険者。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>それとも、人の命がかかっている<line-break>とでも言った方が、その気になるのか？<line-break>貴様のような甘っちょろい冒険者は。<end>"
english = "I'll pay you handsomely, adventurer. Or would telling you a life is at stake make you more willing? That might work on a softhearted adventurer like you.<end>"

["430012"]
japanese = "…引き受けよう<end>"
english = "…I'll do it.<end>"

["430013"]
japanese = "人をバカにするな！<end>"
english = "Don't treat me like an idiot!<end>"

["430014"]
japanese = "よし、では行くぞ。<line-break>\u3000<line-break>\u3000<line-break>ただし、足手まといになるようなら<line-break>消えてもらう。そのつもりでいろ。<end>"
english = "Good. Then let's go. But if you become a burden, I'll get rid of you. Bear that in mind.<end>"

["430015"]
japanese = "人の見えないところで<line-break>そんなことをするのは<line-break>感心できんな。<line-break>しかし俺も名乗らずに無礼だったな。<line-break>俺はレムオン。エリエナイ公爵だ。<end>"
english = "Doing such a thing where no one can see is hardly commendable. Still, it was discourteous of me not to introduce myself. I am Lemghon, Duke of Elienai.<end>"

["430016"]
japanese = "くっ、遅かったか。\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>行動開始からここまでに<line-break>さほどの時間は要していないはず…。<line-break>さすがは雌狐の手の者だな。<end>"
english = "Damn, too late. It can't have taken long to get this far once the operation began... The she-fox's agents are every bit as capable as expected.<end>"

["430017"]
japanese = "ゲヘヘ、代官である俺様に盾突くとは、<line-break>いい度胸だなアアア！\u3000ゲヘヘヘ…。\u3000<line-break>\u3000<line-break>ま、反乱が起こっちまったからには<line-break>レムオンもおしまいだな。これで、<line-break>俺も代官から晴れてこの地の領主様だ。<end>"
english = "Geh heh heh! You've got nerve, defying me, the magistrate! Geh heh heh... Well, now that the rebellion's begun, Lemghon is finished. Now I'll finally be lord of this land instead of its magistrate!<end>"

["430018"]
japanese = "ゲヘヘ…、領主様になるまで、<line-break>俺も死ぬわけにゃいかねえんでな。<line-break>\u3000<line-break>レムオンに面従腹背で密かに王妃様に<line-break>通じ、やっとここまでこぎ着けたんだ。<line-break>ゲヘヘ…、来い、俺のブサイクちゃん！<end>"
english = "Geh heh heh... I can't very well die before I become lord, can I? I pretended to serve Lemghon while secretly working with Her Majesty the Queen, and that's how I finally made it this far. Geh heh heh... Come, my ugly little darling!<end>"

["430019"]
japanese = "ゲヘ！\u3000強そうだろ？\u3000かわいいだろ？<line-break>俺が買ってきた戦闘用モンスターは！<line-break>\u3000<line-break>ゲヘヘ、かわいい俺のブサイクちゃん、<line-break>派手に暴れて楽しませてくれよ。<line-break>ゲヘ、ゲヘヘヘヘヘヘ！<end>"
english = "Geh heh! Looks strong, doesn't it? Isn't it adorable? That's the combat monster I bought! Geh heh heh! My precious ugly little darling, run wild and put on a good show for me! Geh heh, geh heh heh heh heh heh!<end>"

["430020"]
japanese = "<value:$28>、<line-break>ゆくぞ！<end>"
english = "<value:$28>, let's go!<end>"

["430021"]
japanese = "レ、レムオン…様。<end>"
english = "L-Lord Lemghon...<end>"

["430022"]
japanese = "ボルボラ…、俺の領地で<line-break>好き放題やってくれたようだな。<end>"
english = "Bolbora... It seems you've been doing whatever you please in my lands.<end>"

["430023"]
japanese = "め、め、めっそうもございません！\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>住民どもが暴れるので仕方なく、<line-break>代官としての責務を果たしたまでです。<line-break>ゲヘヘ…。<end>"
english = "N-n-nothing of the sort, my lord! The rabble started rioting, so I had no choice but to fulfill my duties as magistrate. Geh heh heh...<end>"

["430024"]
japanese = "ふん…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<end>"
english = "Hmph...<end>"

["430025"]
japanese = "エリスの手下フリントと<line-break>何か示し合わせるのも代官の責務か？<end>"
english = "And conspiring with Flint, one of Eris's lackeys―is that part of a magistrate's duty too?<end>"

["430026"]
japanese = "あ…、あ…いえ！<line-break>お、お助けを！<end>"
english = "Ah... ah... no! M-mercy!<end>"

["430027"]
japanese = "兄さん！！<end>"
english = "Brother!<end>"

["430028"]
japanese = "兄さん、とうとうボルボラを…。<end>"
english = "Brother, you finally... Bolbora...<end>"

["430029"]
japanese = "君は…<value:$28>。<line-break>どうしてここに？<end>"
english = "You're... <value:$28>. What are you doing here?<end>"

["430030"]
japanese = "<if><value:$29><equal>%0エスト、お前、<line-break>この男を知っているのか？<end>エスト、お前、<line-break>この女を知っているのか？<end>"
english = "<if><value:$29><equal>%0Est, do you know this man?<end>Est, do you know this woman?<end>"

["430031"]
japanese = "う、うん。<line-break>…最近知り合った…友人だよ。<end>"
english = "Y-yeah. A... friend I met recently.<end>"

["430032"]
japanese = "世間は狭いものだな。<end>"
english = "It is a small world.<end>"

["430033"]
japanese = "騒ぎの処理は、<line-break>エスト、お前に任せる。<end>"
english = "Est, I'll leave you to clean up this mess.<end>"

["430034"]
japanese = "ボルボラに似合いの事故でも\u3000\u3000\u3000\u3000<line-break>でっちあげろ。<end>"
english = "Fabricate some accident befitting Bolbora.<end>"

["430035"]
japanese = "兄さんは？<end>"
english = "What about you, Brother?<end>"

["430036"]
japanese = "この件に俺が関わっていたことが<line-break>知れては、やっかいなことになる。\u3000<line-break>\u3000<line-break>ロストールへ引き返し、王妃に会う。<line-break><value:$28>、お前も来るのだ。<end>"
english = "If word gets out that I was involved in this, there will be trouble. I'm returning to Rostorl to see the Queen. <value:$28>, you're coming with me.<end>"

["430037"]
japanese = "言っておくが<line-break>お前に断る自由はない。\u3000\u3000<line-break>\u3000<line-break>まだ仕事は終わっていない。<line-break>無事、王都に着くまでは、<line-break>金も払えん。<end>"
english = "Let me make this clear: you don't have the option of refusing. The job isn't over yet, and I can't pay you until we reach the royal capital safely.<end>"

["430038"]
japanese = "夜明け前にここを発つ。\u3000\u3000<line-break>しばらく休むのだな。<line-break>\u3000<end>"
english = "We leave before dawn. Get some rest until then.<end>"

["430039"]
japanese = "ごめん、眠ってた？<line-break>君に謝ろうと思って…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>僕はこの土地の領主リューガ家の<line-break>人間なんだ。<end>"
english = "Sorry, were you asleep? I wanted to apologize to you... I'm a member of the Ryuga family, the lords of this land.<end>"

["430040"]
japanese = "でも領主の仕事は、兄さんに任せきり。<line-break>僕は自由にやらせてもらってる。<line-break>あんまり、こういうの向いてないしね。<line-break>あ、あの…、昼間はごめんなさい。<line-break>兄さんの態度に腹を立てたよね？<end>"
english = "But I leave all the work of governing to my brother. He lets me do as I please. I'm not really suited to that sort of thing anyway. Oh, um... I'm sorry about earlier. My brother's attitude made you angry, didn't it?<end>"

["430041"]
japanese = "問題は、これからだ。\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>騒ぎの処理は、お前に任せる。<line-break>ボルボラにお似合いの事故でも<line-break>でっちあげろ。<end>"
english = "The real problem is what comes next. I'll leave you to clean up this mess. Fabricate some accident befitting Bolbora.<end>"

["430042"]
japanese = "ごめん、眠ってた？\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>あ、僕はエスト。<line-break>一応、この土地の領主、<line-break>リューガ家の人間なんだ。<end>"
english = "Sorry, were you asleep? Oh, I'm Est. I'm technically a member of the Ryuga family, the lords of this land.<end>"

["430043"]
japanese = "でも、領主の仕事は<line-break>みんな兄さんに任せっきり…。<line-break>僕はね、考古学者やってるんだ。\u3000\u3000\u3000<line-break>闇の神器を探して、世界中を旅してる。<line-break>ああ、闇の神器ってのは、<line-break>伝説の破壊神ウルグの…。<end>"
english = "But I leave all the governing to my brother... I'm an archaeologist, you see. I travel the world searching for the Dark Artifacts. Oh, the Dark Artifacts―they're the legendary God of Destruction Ulugh's...<end>"

["430044"]
japanese = "ごめん、ごめん。<line-break>僕の話をしにきたんじゃなかった。<line-break>\u3000<line-break>君に謝ろうと思って…。<line-break>昼間はごめんなさい。<line-break>兄さんの態度に腹を立てたよね？<end>"
english = "Sorry, sorry. I didn't come here to talk about myself. I wanted to apologize to you... I'm sorry about earlier. My brother's attitude made you angry, didn't it?<end>"

["430045"]
japanese = "本当にごめんなさい…。\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>でも、許してほしい…。<line-break>それから…<line-break>兄さんを見捨てないでほしいんだ。<end>"
english = "I'm truly sorry... But please, forgive me. And... please don't turn your back on my brother.<end>"

["430046"]
japanese = "ロストールの王宮では、<line-break>エリス王妃と兄さんの間で<line-break>しれつな権力争いがあってね。\u3000\u3000\u3000\u3000<line-break>エリス王妃は、兄さんの代官ボルボラに<line-break>領地で横暴を働かせて、その責任で<line-break>兄さんを失脚させようとしていたんだ。<end>"
english = "At Rostorl's royal court, Queen Eris and my brother are locked in a bitter struggle for power. The queen had Bolbora, my brother's deputy, abuse his authority in the domain so that my brother would take the blame and be brought down.<end>"

["430047"]
japanese = "王妃は他にも、ボルボラを使って<line-break>兄さんの弱みを探っていたらしい…。\u3000<line-break>\u3000<line-break>兄さんには、<line-break>君みたいな味方が必要なんだ。<line-break>お願いだ。兄さんを守ってほしい。<end>"
english = "It seems the queen was also using Bolbora to uncover anything she could use against my brother... He needs an ally like you. Please. I want you to protect him.<end>"

["430048"]
japanese = "…それじゃ、僕は行くね。<line-break>おやすみ。<end>"
english = "Well, I should go. Good night.<end>"

["430049"]
japanese = "お待ちしていた、エリエナイ公。<end>"
english = "I have been expecting you, Duke Elienai.<end>"

["430050"]
japanese = "そなたの領地で物騒な事件が<line-break>あったときくが？<end>"
english = "I hear there was a troubling incident in your domain. Is that so?<end>"

["430051"]
japanese = "さすがにお耳が早い。<line-break>ノーブルの代官ボルボラが死にました。<end>"
english = "News travels swiftly to Your Majesty. Bolbora, the governor of Noble, is dead.<end>"

["430052"]
japanese = "ほう？<end>"
english = "Oh?<end>"

["430053"]
japanese = "事故死です。<end>"
english = "It was an accident.<end>"

["430054"]
japanese = "フフ、エリエナイ公、<line-break>私は死因までは尋ねてはおらぬが？<end>"
english = "Heh. Duke Elienai, I did not ask how he died.<end>"

["430055"]
japanese = "一応、ご報告申し上げたまで。\u3000\u3000<end>"
english = "I merely thought it best to inform you.<end>"

["430056"]
japanese = "弟エストが処理にあたっています。<line-break>近日中に詳細をご報告できるかと。<end>"
english = "My younger brother Est is handling the matter. I expect to have a full report for you shortly.<end>"

["430057"]
japanese = "では、それを待とう。\u3000\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>\u3000<line-break>\u3000<line-break>しかし、残念なことよ。<line-break>ボルボラに聞きたいことがあったのだが<line-break>むくろを問いただすわけにもいくまい。<end>"
english = "Then I shall wait for it. Still, what a pity. I had questions for Bolbora, but one can hardly interrogate a corpse.<end>"

["430058"]
japanese = "領主の私に<line-break>答えられることでしたら…。<end>"
english = "If they are questions I can answer as his lord...<end>"

["430059"]
japanese = "先日、ボルボラが<line-break>このようなものを送りつけてきた。<end>"
english = "Bolbora sent me this the other day.<end>"

["430060"]
japanese = "今は亡き、先代のエリエナイ公<line-break>…そなたの父上が女に宛てた書簡だ。<end>"
english = "It is a letter addressed to a woman by the late Duke Elienai, your father and predecessor.<end>"

["430061"]
japanese = "女にですと！？<end>"
english = "A woman!?<end>"

["430062"]
japanese = "こ、これは…なんたること！\u3000\u3000\u3000\u3000\u3000<line-break>貴殿の父上は、妻以外の女性に<line-break>子供を産ませていたようだ。<end>"
english = "Th-this is... outrageous! It appears your father sired a child with a woman other than his wife.<end>"

["430063"]
japanese = "いや、待て。<line-break>エストの誕生には、我々もかけつけた。<line-break>…ということは、貴殿がその女性の…。<end>"
english = "No, wait. We were there for Est's birth. Then that would mean you are that woman's...<end>"

["430064"]
japanese = "故人の恋文をのぞき読むとは<line-break>いい趣味をお持ちですな。<end>"
english = "Reading a dead man's love letters. What refined tastes you have.<end>"

["430065"]
japanese = "コホン…確かに、<line-break>ファーロス家の当主に<line-break>あるまじき不作法だった。\u3000\u3000\u3000\u3000<line-break>しかし、この手紙から判断すれば、<line-break>貴殿は不当にリューガ家当主の座に<line-break>ついたことになる。<end>"
english = "Ahem... I admit that was conduct unbecoming the head of House Pharos. However, judging by this letter, you took your place as head of House Ryuga illegitimately.<end>"

["430066"]
japanese = "ふふん、エリエナイ公…\u3000\u3000\u3000\u3000\u3000\u3000\u3000<line-break>いや、レムオン。<line-break>これで貴殿も終わりだな。<end>"
english = "Hmph. Duke Elienai... No, Lemghon. This is the end of you.<end>"

["430067"]
japanese = "手紙の入手経路を明かさぬまま<line-break>ボルボラが死んだとあっては、<line-break>これを鵜呑みするわけにもいかぬ。<end>"
english = "With Bolbora dead before revealing where he obtained the letter, we cannot simply accept it at face value.<end>"

["430068"]
japanese = "しかし、手紙を手に入れた直後の\u3000<line-break>事故死とは…<line-break>\u3000<line-break>偶然にしては、<line-break>できすぎていると思わぬか？<end>"
english = "But for him to die in an accident just after obtaining it... Do you not find that rather too convenient to be mere coincidence?<end>"

["430069"]
japanese = "しかも、ボルボラはノーブルで<line-break>横暴を働き、そなたを困らせていた<line-break>というではないか。<line-break>この上ない幸運であったな。<line-break>エリエナイ公。<end>"
english = "And did Bolbora not abuse his authority in Noble, causing you no small trouble? His death was extraordinarily fortunate for you, Duke Elienai.<end>"

["430070"]
japanese = "フッ…、おたわむれを。<line-break>\u3000<line-break>\u3000<line-break>彼は有能な男でした。現にこれまで、<line-break>ボルボラのあとを任せられる者が<line-break>おらず、頭を悩ませておりました。<end>"
english = "Heh... You jest. He was a capable man. Indeed, I have been at a loss because no one could be found to take his place.<end>"

["430071"]
japanese = "<if><value:$29><equal>%0ですが、ようやくその結論が<line-break>得られたので、今日はその件について<line-break>お願いに上がった次第です。<line-break>ノーブルの支配を、<line-break>我が弟<value:$28>に<line-break>任せたく存じます。<end>ですが、ようやくその結論が<line-break>得られたので、今日はその件について<line-break>お願いに上がった次第です。<line-break>ノーブルの支配を、<line-break>我が妹<value:$28>に<line-break>任せたく存じます。<end>"
english = "<if><value:$29><equal>%0But I have finally found my answer, and that is why I came today with a request. I would entrust the governance of Noble to my younger brother, <value:$28>.<end>But I have finally found my answer, and that is why I came today with a request. I would entrust the governance of Noble to my younger sister, <value:$28>.<end>"

["430072"]
japanese = "<if><value:$29><equal>%0弟？<end>妹？<end>"
english = "<if><value:$29><equal>%0Your brother?<end>Your sister?<end>"

["430073"]
japanese = "ここに連れてまいりました。<end>"
english = "I have brought my sibling here.<end>"

["430074"]
japanese = "<if><value:$29><equal>%0エストの他に兄弟があったとは、<line-break>初耳だが。<end>エストの他に兄弟があったとは、<line-break>初耳だが。<end>"
english = "<if><value:$29><equal>%0This is the first I have heard of you having another sibling besides Est.<end>This is the first I have heard of you having another sibling besides Est.<end>"

["430075"]
japanese = "わけあって、<line-break>公にはしておりませんでした。<line-break>\u3000<line-break>そのわけは…<line-break>申し上げなくとも<line-break>おわかりでしょう。<end>"
english = "For certain reasons, I have kept it from public knowledge. I need hardly explain what those reasons were.<end>"

["430076"]
japanese = "<if><value:$29><equal>%0この少年こそ、<line-break>…この手紙にある子供だと？<end>この少女こそ、<line-break>…この手紙にある子供だと？<end>"
english = "<if><value:$29><equal>%0You mean this boy is the child mentioned in the letter?<end>You mean this girl is the child mentioned in the letter?<end>"

["430077"]
japanese = "<if><value:$29><equal>%0ボルボラ亡きあとのノーブルを<line-break>統制するために、<line-break>\u3000<line-break>なにとぞ、<line-break>我が弟<value:$28>に<line-break>ノーブルの伯爵の称号を。<end>ボルボラ亡きあとのノーブルを<line-break>統制するために、<line-break>\u3000<line-break>なにとぞ、<line-break>我が妹<value:$28>に<line-break>ノーブルの伯爵の称号を。<end>"
english = "<if><value:$29><equal>%0To maintain order in Noble after Bolbora's death, I beg you to grant my younger brother, <value:$28>, the title of Count of Noble.<end>To maintain order in Noble after Bolbora's death, I beg you to grant my younger sister, <value:$28>, the title of Countess of Noble.<end>"

["430078"]
japanese = "ならん！\u3000ならん！！<line-break>ふざけたことを！<end>"
english = "Absolutely not! I will not permit this nonsense!<end>"

["430079"]
japanese = "陛下、<line-break>どうかこの者に伯爵の称号を。<line-break>\u3000<line-break>事情が事情です。<line-break>手続きは追って行うこととし、<line-break>この場で叙任なされては？<end>"
