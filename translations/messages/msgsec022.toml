["220081"]
japanese = "国民に害をなすモンスターが徘徊している。<line-break>悪を斬る刃を持つ者に依頼する。<line-break><value:$15>を成敗してくれたまえ。<line-break>報酬は<value:$1A>ギア、<line-break>期限は<value:$1B>日以内である。<end>"
english = "A monster that harms the people is roaming about. This request is for one whose blade cuts down evil: strike down <value:$15>. Reward: <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["220082"]
japanese = "近頃街道にモンスターが出没しています。<line-break>通行人に被害が出る可能性もあります。<line-break>私たちも全力で倒そうとしていますが、<line-break>成功していません。<line-break>倒すために助力をお願いします。<line-break>報酬として<value:$1A>ギアを用意します。<line-break><value:$1B>日以内に倒してください。<end>"
english = "Monsters have recently begun appearing on the highway, and travelers may be harmed. We have done everything in our power to defeat them, without success. We ask for your help. Reward: <value:$1A> Gea. Please defeat them within <value:$1B> days.<end>"

["220083"]
japanese = "わしらは細工物を作るのが好きでの。一日中やっ<line-break>ていても飽きはせん。だが、最近村の近くに<line-break><value:$15>が出るようになって、<line-break>恐ろしゅうて落ち着いて細工できんのじゃ。<line-break>うちの村は年寄りばかりだで誰も戦えんのじゃ。<line-break>お願えするだ。モンスターを追い払ってくれ。<line-break><value:$1A>ギア、<value:$1B>日以内でどうじゃ。<end>"
english = "We love making handicrafts all day, but since sightings of <value:$15> began near our village, we're too frightened to work. Only old folk live here, and none can fight. Please drive the threat away within <value:$1B> days for <value:$1A> Gea.<end>"

["220084"]
japanese = "<value:$15>が出没しています。<line-break>商用で移動しているときにモンスターに出会うの<line-break>は、商売に支障がでますし、たいへん危険です。<line-break>そこで、あらかじめモンスターを排除しておきた<line-break>いと思います。退治をお願いします。<line-break><value:$1A>ギアをお礼としてさしあげます。<line-break>期間は<value:$1B>日以内です。<end>"
english = "<value:$15> has been sighted. Encountering a monster while traveling on business is both disruptive and extremely dangerous, so we wish to remove the threat in advance. Please eliminate it within <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["220085"]
japanese = "俺たちは、材料集めにあちこちに行くんだがよ。<line-break>最近<value:$15>に出くわすことが<line-break>多くてな。集めた荷物を抱えて戦うのは、<line-break>ちとたいへんなんだよ。<line-break>悪いんだが、奴を倒してくんねぇか？<line-break><value:$1A>ギア用意したからよ。<line-break><value:$1B>日以内に退治してくれ。<end>"
english = "We travel all over to gather materials, but lately we keep running into <value:$15>. Fighting while carrying everything we've collected is no easy task. Sorry to ask, but could you take it down? I've put together <value:$1A> Gea. Eliminate it within <value:$1B> days.<end>"

["220086"]
japanese = "うちには、旅の人が飲みに来ることもよくあるの<line-break>よ。このごろ、「さっきモンスターに出会った、<line-break>ドワーフの国は安全だって聞いてたのに」なんて<line-break>言う旅の人が多くてね。せっかく旅に出たのに、<line-break>そんなこと言わせちゃかわいそうでしょ。<line-break><value:$1A>ギア出すわ。<value:$15>を<line-break>倒してちょうだい。<value:$1B>日以内によろしくね。<end>"
english = "Travelers often come here for a drink. Lately, many have said, “I just ran into a monster. I heard the Dwarf country was safe.” It's a shame for anyone who came all this way to feel that way. I'll pay <value:$1A> Gea. Please defeat <value:$15> within <value:$1B> days.<end>"

["220087"]
japanese = "<value:$15>が出没しているとの知らせが<line-break>あります。<line-break>このモンスターは狂暴であり、<line-break>旅行者の方の安全がおびやかされています。<line-break>モンスターを退治し安全を確保してください。<line-break>謝礼は<value:$1A>ギア、<line-break>期限は<value:$1B>日以内とします。<end>"
english = "We have received reports that <value:$15> has been sighted. This vicious monster threatens the safety of travelers. Eliminate it and secure the area. Reward: <value:$1A> Gea. Deadline: <value:$1B> days.<end>"

["220088"]
japanese = "空気に妖気が混ざってきています。原因は、<line-break>近頃この周辺に現れる<value:$15>です。<line-break>澄んだ空気のもとでなければ、<line-break>私たちの歌は本来の美しさを発揮できません。<line-break><value:$15>退治を依頼したいと思います。<line-break><value:$1A>ギアの報酬、<line-break><value:$1B>日以内の期限でいかがでしょうか。<end>"
english = "An uncanny presence taints the air, and it comes from <value:$15>. Without clear air, our songs lose their true beauty. Please eliminate <value:$15>. We offer <value:$1A> Gea for completion within <value:$1B> days.<end>"

["220089"]
japanese = "昨今、モンスターによる被害が多発しているが、<line-break>テラネ周辺でも同様の報告があった。<line-break>報告にあった<value:$15>は、人身に被害を<line-break>与え、耕作地を荒らし、放置しかねるとのこと。<line-break>よってここに討伐令を布告するものである。<line-break>期限は、<value:$1B>日以内。見事退治せし者には、<line-break><value:$1A>ギアの賞金を与える。<end>"
english = "Reports from Terane say attacks by <value:$15> have injured people and ravaged farmland. This threat cannot be ignored. An official extermination order is hereby issued. Deadline: <value:$1B> days. Reward: <value:$1A> Gea.<end>"

["220090"]
japanese = "最近、街の周囲で<value:$15>が暴れて<line-break>います。このままでは、自由に街の外に出る<line-break>こともできず、日々の生活もままなりません。<line-break>どなたか<value:$1B>日以内に、このモンスターを退治<line-break>してくださいませんでしょうか？<line-break>報酬は<value:$1A>ギア用意しています。<line-break>どうかよろしくお願いいたします。<end>"
english = "<value:$15> has been rampaging around town. If this continues, we will be unable to venture outside freely or even go about our daily lives. Would someone please eliminate this monster within <value:$1B> days? We have prepared a reward of <value:$1A> Gea. Please help us.<end>"

["220091"]
japanese = "最近現れたモンスターが強くて、困っとります。<line-break>なんでも<value:$15>とかいうやつじゃそう<line-break>ですが、わしらでは手に負えませんです。<line-break>ほっとくと畑も村も危ないので、<line-break><value:$1B>日以内に、退治していただきたい。<line-break>お礼はあまりできんですが、できるだけのことは<line-break>するつもりですじゃ。どうかお助けくだされ。<end>"
english = "We cannot handle the monster known as <value:$15>. Our fields and village are in danger. Please defeat the threat within <value:$1B> days. We cannot offer much, but we will do all we can to repay you. Please help us.<end>"

["220092"]
japanese = "闇の力が強まり、世界に悪しき気が満ちはじめて<line-break>います。その影響はあまたの生き物にも及んでい<line-break>るようです。巡礼者を脅かす<value:$15>も<line-break>闇にとりつかれた哀れなる命です。<line-break>この悲しき命を、闇の苦痛から救う勇者を捜して<line-break>います。<value:$1B>日以内に、その命を解放して<line-break>くれた者には、お礼をさせていただきます。<end>"
english = "Darkness is spreading through the world and corrupting living creatures. Even <value:$15> must be pitied, for darkness causes the threat to pilgrims. We seek a hero to grant release from torment within <value:$1B> days. A reward will be given.<end>"

["220093"]
japanese = "うちの常連が、モンスターが出たって、<line-break>うるさくってね。酔っぱらいのたわごとですます<line-break>わけにもいかんから、ちょっくら若いのに調べさ<line-break>せたんだが、いたんだよね。やばそうなヤツが。<line-break>で、退治して欲しいんだわ。<line-break><value:$1B>日以内、報酬は、<value:$1A>ギア出すよ。<line-break>よろしくね。<end>"
english = "A regular kept making a fuss about a monster. I couldn't dismiss it as drunken nonsense, so I sent a youngster to check. Sure enough, something nasty was out there. Eliminate the threat within <value:$1B> days for <value:$1A> Gea. Thanks.<end>"

["220094"]
japanese = "冒険者の方々にはごひいきにしていただき、<line-break>ありがとうございます。日頃のご愛顧に応える<line-break>べく、日々、様々な品を作っていますが、<line-break>最近、<value:$15>が出没し、よい材料を<line-break>採集しにくくなっております。そこで、<line-break>報酬<value:$1A>ギアで、退治を依頼いたします。<line-break><value:$1B>日以内で、お願いできませんでしょうか？<end>"
english = "Thank you, adventurers, for your patronage. We make many goods in return, but the presence of <value:$15> makes fine materials hard to gather. We offer <value:$1A> Gea for eliminating the threat within <value:$1B> days.<end>"

["220095"]
japanese = "優れた武器防具は、良質の材料と腕のいい職人に<line-break>よって作られる。が、最近、現れた<line-break><value:$15>が物騒なヤツでな。危なくて、<line-break>じっくり材料を集められんと、職人どもが困って<line-break>おる。<value:$1B>日以内に退治して欲しいんだが、<line-break><value:$1A>ギアでどうじゃ？\u3000あんたらにしても<line-break>わしらの仕事がうまくいかんのは困るじゃろう。<end>"
english = "Fine arms require quality materials and skilled artisans. Since <value:$15> appeared, gathering materials is too dangerous. Eliminate the threat within <value:$1B> days for <value:$1A> Gea. You need our work too.<end>"

["220096"]
japanese = "最近現れた<value:$15>が、旅人を襲うそう<line-break>です。我がフゴー商会宿屋経営部門としては、<line-break>旅人の安全は何よりも大切なものですので、<line-break>退治を依頼します。<line-break>当方では、報酬として<value:$1A>ギア用意<line-break>いたしております。<line-break><value:$1B>日以内に倒してください。お願いします。<end>"
english = "Travelers are being attacked by <value:$15>. Hugo Trading Company's inn division puts their safety first and requests the threat's elimination. Reward: <value:$1A> Gea. Please complete the hunt within <value:$1B> days.<end>"

["220097"]
japanese = "遠くから珍しい品物を運んでくると、高い値段で<line-break>売れるんだ。他の街からも商人がやって来るんだ<line-break>ぜ。でもよ、最近現れた<value:$15>の<line-break>おかげで、他の街の商人が来れなくなったんだ。<line-break>せっかく高い値をつけてくれるのによ。<line-break><value:$15>を退治してくれ。<line-break>報酬は<value:$1A>ギア。<value:$1B>日以内で頼むぜ。<end>"
english = "Distant rarities sell well to visiting merchants. But the presence of <value:$15> keeps them away, costing us dearly. Eliminate <value:$15>. Reward: <value:$1A> Gea. Get it done within <value:$1B> days.<end>"

["220098"]
japanese = "困ったな。<line-break>街の外に<value:$15>が出るんで、<line-break>落ち着いて外出ができないよ。誰かモンスターを<line-break>やっつけてくれる人がいればいいんだけど。<line-break>退治してくれるなら、<value:$1A>ギアは出すね。<line-break><value:$1B>日以内で片付けられればの話だけど。<line-break>頼まれてくれる人はいないのかな。<end>"
english = "This is a real problem. There have been sightings of <value:$15> outside town, so I cannot go out without worry. Won't someone defeat the threat? I'll pay <value:$1A> Gea if the job is done within <value:$1B> days. Will no one accept?<end>"

["220099"]
japanese = "わしらは畑仕事をして暮らしておる。収穫の時が<line-break>一番の楽しみじゃ。じゃが、ここのところ現れ<line-break>おった<value:$15>が、わしらの畑を荒らし<line-break>てしまうんじゃ。せっかくの、わしらの畑を。<line-break>どなたか、<value:$15>を懲らしめては<line-break>くれんだろうか。<value:$1A>ギアでどうじゃ。<line-break><value:$1B>日以内にやっていただけるかの。<end>"
english = "We live by farming, and harvest is our greatest joy. But lately, our precious fields have been ravaged by <value:$15>. Will someone teach <value:$15> a lesson within <value:$1B> days? We can offer <value:$1A> Gea.<end>"

["220100"]
japanese = "毎度ありがとうございます。<line-break>本日はお願いがあります。<line-break>私どもの商売を妨害するモンスター、<line-break><value:$15>を倒していただきたいのです。<line-break><value:$1A>ギアでいかがでしょう？<line-break><value:$1B>日以内に完了していただければ幸いです。<line-break>では今後ともごひいきに。<end>"
english = "Thank you for your continued patronage. We have a request today: please defeat <value:$15> to end the interference with our business. How does <value:$1A> Gea sound? We would appreciate it if you completed the job within <value:$1B> days. We look forward to your continued patronage.<end>"

["220101"]
japanese = "材料を収集するのも俺たちの重要な仕事だ。<line-break>だがここのところ材料収集の作業場に<line-break><value:$15>が出没している。俺たちもたび<line-break>たび襲われるようになった。これではいけない。<line-break>そこで頼む。モンスターを成敗してくれ。<line-break><value:$1A>ギアをお礼として用意した。<line-break>期日は<value:$1B>日以内とさせてもらう。<end>"
english = "Gathering materials is vital to our work, but attacks by <value:$15> plague our collection site. This cannot continue. Eliminate the threat within <value:$1B> days. We have prepared <value:$1A> Gea as a reward.<end>"

["220102"]
japanese = "街から離れた場所に酒の貯蔵庫があるんだが、<line-break>先日酒を取りに行こうとしたところ、<line-break>道中モンスターに襲われ逃げ帰りました。<line-break><value:$1A>ギア出しますから、<line-break><value:$15>をあそこから追い払って<line-break>ください。<value:$1B>日以内でお願いします。<end>"
english = "Our liquor storehouse lies some distance from town. An attempt to fetch liquor the other day ended in a monster attack on the road and a hasty retreat. We will pay <value:$1A> Gea if you drive <value:$15> away from there. Please do it within <value:$1B> days.<end>"

["220103"]
japanese = "このたび、お得意様である団体様がアミラルの<line-break>我が店にいらっしゃることになりました。<line-break>しかし道中には<value:$15>がいることが<line-break>私どもの調査で判明しました。<line-break>あなた方にお願いしたいのは、そのモンスターの<line-break>退治です。<value:$1A>ギアの謝礼でいかが<line-break>でしょう。<value:$1B>日以内に退治してください。<end>"
english = "A valued group of regulars will soon visit our establishment in Amiral. Our investigation found <value:$15> along their route. Please eliminate the threat within <value:$1B> days. Would <value:$1A> Gea be an acceptable reward?<end>"

["220104"]
japanese = "私たちの仕事は、各地のでき事やお話を歌にして<line-break>多くの人に広めること。<line-break>英雄の歌もそのひとつ。<line-break>勇者たるあなた方に依頼します。<line-break><value:$15>を退治してください。<line-break><value:$1A>ギア、<value:$1B>日以内が条件です。<line-break>あなた方のご活躍を、歌にして広めましょう。<end>"
english = "We turn events and tales from across the land into songs, including heroic ballads. We ask you, as heroes, to defeat <value:$15>. The terms are <value:$1A> Gea and completion within <value:$1B> days. We will spread your deeds in song.<end>"
